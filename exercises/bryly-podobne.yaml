    Odpowiedź: \(20\ \mathrm{cm}\) oraz \(10\ \mathrm{cm}\).
  solution_steps:
  - Zauważ, że woda tworzy stożek podobny do naczynia (przekrój równoległy do podstawy).
  - Oznacz wysokość słupa wody przez h i zapisz skalę k=\frac{h}{30}.
  - Zapisz k^{3}=\frac{8}{27} i wyznacz k=\frac{2}{3}.
  - Oblicz h=\frac{2}{3}\cdot 30=20\ \mathrm{cm}.
  - 'Oblicz odległość do brzegu: 30-20=10\ \mathrm{cm}.'
