- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: wyznaczanie wzoru funkcji liniowej z warunku na pole i odrzucenie rozwiązania
  statement: Wykres funkcji liniowej f przechodzi przez punkt P = (2, 4), przecina oś OX w punkcie A oraz
    oś OY w punkcie B. Funkcja f jest malejąca, pole trójkąta o wierzchołkach A, B i O = (0, 0) jest równe
    18, a trójkąt AOB nie jest trójkątem równoramiennym. Wyznacz wzór funkcji f. Zapisz obliczenia.
  statement_latex: f\left(x\right) = a\cdot x + b,\qquad P = \left(2,\ 4\right),\qquad P_{AOB} = 18
  solution: |-
    Niech f\left(x\right) = a\cdot x + b. Z warunku P należy do wykresu: 4 = 2\cdot a + b, czyli b = 4 - 2\cdot a.
    Funkcja jest malejąca, więc a < 0; wtedy b = 4 - 2\cdot a > 0 oraz miejsce zerowe x_0 = -\frac{b}{a} > 0.
    A = \left(-\frac{b}{a},\ 0\right), B = \left(0,\ b\right), a trójkąt AOB ma kąt prosty w O, więc
    P_{AOB} = \frac{1}{2}\cdot\left(-\frac{b}{a}\right)\cdot b = -\frac{b^{2}}{2\cdot a} = 18, czyli b^{2} = -36\cdot a.
    Podstawiamy b = 4 - 2\cdot a: \left(4 - 2\cdot a\right)^{2} = -36\cdot a, czyli 4\cdot a^{2} - 16\cdot a + 16 + 36\cdot a = 0, a stąd 4\cdot a^{2} + 20\cdot a + 16 = 0, czyli a^{2} + 5\cdot a + 4 = 0.
    \Delta = 25 - 16 = 9, więc a = -4 albo a = -1 (oba są ujemne).
    Dla a = -1: b = 6, A = \left(6,\ 0\right), B = \left(0,\ 6\right), więc \left|OA\right| = \left|OB\right| = 6 — trójkąt jest równoramienny, tę wartość odrzucamy.
    Dla a = -4: b = 4 - 2\cdot\left(-4\right) = 12, A = \left(3,\ 0\right), B = \left(0,\ 12\right); \left|OA\right| = 3, \left|OB\right| = 12, \left|AB\right| = \sqrt{153}, więc trójkąt nie jest równoramienny.
    Sprawdzenie pola: \frac{1}{2}\cdot 3\cdot 12 = 18.
    Odpowiedź: f\left(x\right) = -4\cdot x + 12.
  solution_steps:
  - Przyjmij f\left(x\right) = a\cdot x + b i z warunku 4 = 2\cdot a + b wyznacz b = 4 - 2\cdot a.
  - Zauważ, że a < 0 (funkcja malejąca), więc b > 0 i miejsce zerowe x_0 = -\frac{b}{a} > 0.
