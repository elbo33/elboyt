    GDZIE JEST BŁĄD: to, który koniec daje większą wartość, zależy od znaku a i od odległości końców od osi symetrii x=p, a nie od tego, który koniec jest „prawy”.
    POPRAWNE ROZWIĄZANIE: a=1>0, p=-\frac{4}{2\cdot 1}=-2, przy czym -6\le -2\le 1, więc wierzchołek leży w przedziale.
