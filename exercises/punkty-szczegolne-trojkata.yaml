      = \\frac{9}{2}'') — human review'
- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: punkty szczególne w układzie współrzędnych – warunek kąta prostego
  statement: W kartezjańskim układzie współrzędnych (x, y) dane są punkty A = (0, 0) oraz B = (8, 0).
    Punkt C ma odciętą równą 2 i dodatnią rzędną, a kąt trójkąta ABC przy wierzchołku C jest kątem prostym.
    Wyznacz rzędną punktu C, oblicz promień r okręgu wpisanego w trójkąt ABC oraz podaj współrzędne ortocentrum
    H tego trójkąta.
  statement_latex: A=\left(0,\ 0\right),\ B=\left(8,\ 0\right),\ C=\left(2,\ y\right),\ y>0,\qquad r=\frac{a+b-c}{2}
  solution: |-
    Skoro kąt przy wierzchołku C jest prosty, to bok AB jest średnicą okręgu opisanego na trójkącie ABC (kąt wpisany oparty na średnicy jest prosty). Środek O tego okręgu to środek odcinka AB, czyli O = (4, 0), a promień R = \frac{|AB|}{2} = 4.

    Punkt C leży na tym okręgu, więc \left(2-4\right)^{2}+y^{2} = 16, czyli y^{2} = 12 oraz y = 2\sqrt{3} lub y = -2\sqrt{3}. Warunek „dodatnia rzędna” pozostawia tylko y = 2\sqrt{3}, zatem C = \left(2,\ 2\sqrt{3}\right).

    (Ten sam wynik daje warunek prostopadłości: \vec{CA}\circ\vec{CB} = \left(-2\right)\cdot 6+\left(-y\right)\cdot\left(-y\right) = y^{2}-12 = 0.)

    Długości boków:
    |AC| = \sqrt{2^{2}+\left(2\sqrt{3}\right)^{2}} = \sqrt{4+12} = 4,
    |BC| = \sqrt{6^{2}+\left(2\sqrt{3}\right)^{2}} = \sqrt{36+12} = 4\sqrt{3},
    |AB| = 8 (przeciwprostokątna).

    Promień okręgu wpisanego: r = \frac{4+4\sqrt{3}-8}{2} = 2\sqrt{3}-2.

    Ortocentrum: w trójkącie prostokątnym wysokości poprowadzone z wierzchołków A i B zawierają przyprostokątne CA i CB, więc przecinają się w wierzchołku kąta prostego: H = C = \left(2,\ 2\sqrt{3}\right).

    Kontrola: r = 2\sqrt{3}-2 \approx 1{,}46 < R = 4 ✓.
  solution_steps:
  - Zauważ, że kąt prosty przy C oznacza, iż C leży na okręgu o średnicy AB; jego środek to O = (4, 0),
    promień R = 4.
  - Zapisz warunek \left(2-4\right)^{2}+y^{2}=16 i wyznacz y^{2}=12.
  - 'Wybierz pierwiastek dodatni: y = 2\sqrt{3}, więc C = \left(2,\ 2\sqrt{3}\right).'
  - 'Oblicz długości boków: |AC| = 4, |BC| = 4\sqrt{3}, |AB| = 8.'
  - 'Podstaw do wzoru r = \frac{a+b-c}{2}: r = \frac{4+4\sqrt{3}-8}{2} = 2\sqrt{3}-2.'
  - 'Wskaż ortocentrum: w trójkącie prostokątnym H jest wierzchołkiem kąta prostego, czyli H = \left(2,\
    2\sqrt{3}\right).'
  answer:
    kind: MULTIPART
    parts:
    - name: y_C
      answer:
        kind: SYMBOLIC
        latex: 2\sqrt{3}
    - name: r
      answer:
        kind: SYMBOLIC
        latex: 2\sqrt{3}-2
    - name: H_x
      answer:
        kind: NUMERIC
        value: 2.0
        latex: '2'
    - name: H_y
      answer:
        kind: SYMBOLIC
        latex: 2\sqrt{3}
  checks:
  - kind: evaluate
    expr: \sqrt{16-\left(2-4\right)^{2}}
    part: y_C
  - kind: evaluate
    expr: \frac{4+4\cdot\sqrt{3}-8}{2}
    part: r
  - kind: evaluate
    expr: '2'
    part: H_x
  - kind: evaluate
    expr: \sqrt{16-\left(2-4\right)^{2}}
    part: H_y
  skills:
  - wykorzystanie warunku prostopadłości / twierdzenia Talesa o kącie wpisanym
  - wybór pierwiastka zgodnego z warunkiem geometrycznym
  - obliczanie promienia okręgu wpisanego w trójkąt prostokątny
  - lokalizowanie ortocentrum
  verification:
    checkability: DETERMINISTIC
    note: 'all 4 parts solved fresh · det: [y_C] SymPy solved it fresh: 3.4641016151377544 vs 3.4641016151377544
      (tol 1e-09) ; [r] SymPy solved it fresh: 1.4641016151377546 vs 1.4641016151377546 (tol 1e-09) ;
      [H_x] SymPy solved it fresh: 2.0 vs 2.0 (tol 1e-09) ; [H_y] SymPy solved it fresh: 3.4641016151377544
