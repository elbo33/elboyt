  statement: 'W trójkącie ABC punkt D leży na boku AB, a punkt E na boku AC, przy czym DE ∥ BC. Dane są
    |AD| = 4, |DB| = 6 oraz |BC| = 25. Uczeń obliczył długość odcinka DE tak: „skoro DE ∥ BC, to \frac{|DE|}{|BC|}=\frac{|AD|}{|DB|}=\frac{4}{6}=\frac{2}{3},
    więc |DE| = \frac{2}{3}\cdot 25 = \frac{50}{3}”. Wskaż błąd w tym rozumowaniu i oblicz poprawną długość
    odcinka DE.'
  statement_latex: '\text{błędnie: } |DE|=\frac{4}{6}\cdot 25;\qquad \text{poprawnie: } |DE|=\frac{4}{4+6}\cdot
    25'
  solution: |-
    Rozumowanie ucznia (błędne). Uczeń przyrównał stosunek \frac{|DE|}{|BC|} do stosunku CZĘŚCI do CZĘŚCI na siecznej AB, czyli \frac{|AD|}{|DB|}=\frac{4}{6}=\frac{2}{3}, i otrzymał |DE| = \frac{2}{3}\cdot 25 = \frac{50}{3}\approx 16{,}7.
    Gdzie tkwi błąd. Stosunek \frac{|AD|}{|DB|} dotyczy wyłącznie dwóch odcinków leżących NA tej samej siecznej i odpowiada mu \frac{|AE|}{|EC|} na drugiej siecznej. Odcinek DE nie leży na siecznej — jego długość wynika z podobieństwa trójkątów ADE i ABC, a skala tego podobieństwa to stosunek CAŁYCH boków.
    Poprawne rozwiązanie. |AB| = |AD| + |DB| = 4 + 6 = 10, więc
    k = \frac{|AD|}{|AB|} = \frac{4}{10} = \frac{2}{5},
    |DE| = k\cdot|BC| = \frac{4}{4+6}\cdot 25 = \frac{2}{5}\cdot 25 = 10.
    Odpowiedź: |DE| = 10 (uczeń otrzymał \frac{50}{3}, bo pomylił stosunek część:część ze stosunkiem całość:całość).
  solution_steps:
  - Zauważ, że uczeń użył stosunku |AD|/|DB| (część do części) tam, gdzie potrzebna jest skala podobieństwa.
  - 'Wyjaśnij: |DE|/|BC| = |AD|/|AB| — stosunek CAŁYCH boków, bo trójkąty ADE i ABC są podobne.'
  - Oblicz |AB| = 4 + 6 = 10 i skalę k = 4/10 = 2/5.
