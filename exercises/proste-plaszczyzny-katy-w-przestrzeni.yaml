- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie tangensa kąta nachylenia przekątnej sześcianu
  statement: Dany jest sześcian ABCDA'B'C'D' o krawędzi długości 6. Odcinek AC' jest przekątną tego sześcianu
    (A i C' są wierzchołkami nienależącymi do jednej ściany). Rzutem prostokątnym punktu C' na płaszczyznę
    podstawy ABCD jest punkt C. Oblicz tangens kąta nachylenia przekątnej AC' do płaszczyzny podstawy
    ABCD.
  statement_latex: a=6,\qquad |AC|=a\sqrt{2},\qquad \operatorname{tg}\alpha=\frac{|CC'|}{|AC|}=\frac{6}{6\cdot\sqrt{2}}
  solution: |-
    Ponieważ krawędź CC' jest prostopadła do płaszczyzny podstawy, rzutem prostokątnym punktu C' na tę płaszczyznę jest punkt C, a rzutem odcinka AC' jest odcinek AC. Szukanym kątem jest więc kąt C'AC w trójkącie prostokątnym ACC' o kącie prostym przy wierzchołku C.
    Przekątna kwadratu ABCD ma długość |AC| = 6\sqrt{2}, a |CC'| = 6.
    Stąd tg α = \frac{6}{6\cdot\sqrt{2}} = \frac{1}{\sqrt{2}} = \frac{\sqrt{2}}{2} ≈ 0,7071.
  solution_steps:
  - Zauważ, że CC' ⊥ płaszczyzna ABCD, więc rzutem C' na podstawę jest C, a rzutem AC' jest AC.
  - 'Wskaż kąt: α = ∠C''AC w trójkącie prostokątnym ACC'' (kąt prosty przy C).'
  - Oblicz |AC| = 6\sqrt{2} (przekątna kwadratu o boku 6) oraz |CC'| = 6.
  - Zapisz tg α = \frac{6}{6\sqrt{2}} = \frac{\sqrt{2}}{2}.
  answer:
    kind: SYMBOLIC
    latex: \frac{\sqrt{2}}{2}
  checks:
  - kind: evaluate
    expr: \frac{6}{6\cdot\sqrt{2}}
  skills:
  - rzut prostokątny odcinka na płaszczyznę
  - kąt między prostą a płaszczyzną
  - przekątne sześcianu
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 0.7071067811865476 vs 0.7071067811865476 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 2
  exercise_type: klasyfikacja wzajemnego położenia prostych w sześcianie
  statement: 'Dany jest sześcian ABCDA''B''C''D'' o krawędzi długości 4, w którym ABCD jest dolną podstawą,
    a A''B''C''D'' – górną (przy czym AA'', BB'', CC'', DD'' są krawędziami bocznymi). Rozważ proste AD
    oraz BB''. Odpowiedz na pytania: (a) Czy proste AD i BB'' mają punkt wspólny? (b) Czy istnieje płaszczyzna
    zawierająca obie te proste? (c) Jaka jest miara kąta między prostymi AD i BB'' (w stopniach)?'
  statement_latex: AD\ \text{i}\ BB':\quad AD\cap BB'=\varnothing,\qquad BB'\parallel AA',\qquad \measuredangle\left(AD,AA'\right)=90^\circ
  solution: |-
    (a) Prosta AD leży w dolnej podstawie i przechodzi przez wierzchołki A i D; prosta BB' przechodzi przez B i B'. Ich jedyny punkt na dolnej podstawie to B, który nie należy do prostej AD. Zatem proste nie mają punktu wspólnego – odpowiedź: NIE.
    (b) Gdyby istniała płaszczyzna zawierająca obie proste, to przy braku punktu wspólnego byłyby one równoległe; tymczasem AD jest pozioma, a BB' pionowa – nie mają tego samego kierunku. Nie ma takiej płaszczyzny – odpowiedź: NIE. Proste AD i BB' są więc skośne.
    (c) Przesuwamy prostą BB' równolegle do punktu A: BB' ∥ AA'. Kąt między AD a AA' jest kątem ściany ADD'A' przy wierzchołku A, czyli 90°. Zatem kąt między prostymi skośnymi AD i BB' ma miarę 90° – są to proste prostopadłe nieprzecinające się.
  solution_steps:
  - Sprawdź punkty wspólne prostych AD i BB' – nie ma ich.
  - Sprawdź, czy proste leżą w jednej płaszczyźnie – nie leżą, bo mają różne kierunki, więc są skośne.
  - 'Przesuń BB'' równolegle: BB'' ∥ AA''.'
  - Odczytaj kąt ∠(AD, AA') = 90°, czyli kąt między AD i BB' wynosi 90°.
  answer:
    kind: MULTIPART
    parts:
    - name: czy mają punkt wspólny
      answer:
        kind: BOOLEAN
        truth: false
    - name: czy istnieje płaszczyzna zawierająca obie proste
      answer:
        kind: BOOLEAN
        truth: false
    - name: kąt między prostymi (stopnie)
      answer:
        kind: NUMERIC
        value: 90.0
  skills:
  - wzajemne położenie prostych w przestrzeni
  - proste skośne
  - kąt między prostymi skośnymi
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: elementy ostrosłupa prawidłowego i tangens kąta dwuściennego
  statement: 'Dany jest ostrosłup prawidłowy czworokątny ABCDS o podstawie ABCD będącej kwadratem o boku
    długości 10 i o wysokości SO równej 12, gdzie O jest środkiem kwadratu ABCD. Punkt M jest środkiem
    krawędzi BC. Oblicz: (a) długość odcinka OM, czyli promień r okręgu wpisanego w podstawę, (b) tangens
    kąta SMO, będącego kątem dwuściennym między ścianą boczną SBC a płaszczyzną podstawy.'
  statement_latex: r=|OM|=\frac{10}{2},\qquad \operatorname{tg}\beta=\frac{|SO|}{|OM|}=\frac{12}{5}
  solution: |-
    (a) W kwadracie o boku 10 odległość środka O od boku BC jest równa połowie boku: r = |OM| = \frac{10}{2} = 5.
    (b) Ponieważ OM ⊥ BC oraz SM ⊥ BC (SM jest wysokością trójkąta równoramiennego SBC), kąt SMO jest kątem liniowym kąta dwuściennego między ścianą SBC a podstawą. Trójkąt SOM ma kąt prosty przy O (bo SO ⊥ płaszczyzna podstawy), zatem
    tg β = \frac{|SO|}{|OM|} = \frac{12}{5} = 2,4.
  solution_steps:
  - Wyznacz r = |OM| = \frac{10}{2} = 5 (połowa boku kwadratu).
  - 'Uzasadnij, że ∠SMO jest kątem liniowym: OM ⊥ BC i SM ⊥ BC.'
  - W trójkącie prostokątnym SOM zapisz tg β = \frac{|SO|}{|OM|}.
  - Oblicz tg β = \frac{12}{5} = 2,4.
  answer:
    kind: MULTIPART
    parts:
    - name: r
      answer:
        kind: NUMERIC
        value: 5.0
    - name: tangens kąta dwuściennego
      answer:
        kind: NUMERIC
        value: 2.4
  checks:
  - kind: evaluate
    expr: \frac{10}{2}
    part: r
  - kind: evaluate
    expr: \frac{12}{5}
    part: tangens kąta dwuściennego
  skills:
  - promień okręgu wpisanego w podstawę
  - kąt dwuścienny ściana boczna – podstawa
  - trójkąt (H, r, m)
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [r] SymPy solved it fresh: 5.0 vs 5.0 (tol 1e-09) ; [tangens
      kąta dwuściennego] SymPy solved it fresh: 2.4 vs 2.4 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: kąt nachylenia przekątnej graniastosłupa do podstawy
  statement: 'Dany jest graniastosłup prawidłowy czworokątny ABCDA''B''C''D'', w którym krawędź podstawy
    ma długość 3, a wysokość graniastosłupa jest równa 3\sqrt{6} (krawędzie boczne to AA'', BB'', CC'',
    DD''). Odcinek AC'' jest przekątną tego graniastosłupa. Oblicz: (a) tangens kąta α nachylenia przekątnej
    AC'' do płaszczyzny podstawy ABCD, (b) miarę kąta α, (c) długość przekątnej AC''.'
  statement_latex: '|AC|=3\sqrt{2},\qquad \operatorname{tg}\alpha=\frac{3\sqrt{6}}{3\sqrt{2}},\qquad |AC''|=\sqrt{\left(3\sqrt{2}\right)^{2}+\left(3\sqrt{6}\right)^{2}}'
  solution: |-
    Krawędź CC' jest prostopadła do płaszczyzny podstawy, więc rzutem prostokątnym punktu C' na tę płaszczyznę jest C, a rzutem odcinka AC' jest przekątna podstawy AC. Szukany kąt to α = ∠C'AC w trójkącie prostokątnym ACC' o kącie prostym przy C.
    (a) |AC| = 3\sqrt{2} (przekątna kwadratu o boku 3), |CC'| = 3\sqrt{6}, zatem
    tg α = \frac{3\sqrt{6}}{3\sqrt{2}} = \sqrt{3}.
    (b) Ponieważ tg α = \sqrt{3}, mamy α = 60°.
    (c) |AC'| = \sqrt{\left(3\sqrt{2}\right)^{2}+\left(3\sqrt{6}\right)^{2}} = \sqrt{18+54} = \sqrt{72} = 6\sqrt{2}.
  solution_steps:
  - Zauważ, że rzutem AC' na podstawę jest przekątna AC, więc α = ∠C'AC.
  - Oblicz |AC| = 3\sqrt{2}.
  - Zapisz tg α = \frac{3\sqrt{6}}{3\sqrt{2}} = \sqrt{3}.
  - Odczytaj α = 60°.
  - Z twierdzenia Pitagorasa |AC'| = \sqrt{18+54} = 6\sqrt{2}.
  answer:
    kind: MULTIPART
    parts:
    - name: tangens kąta alfa
      answer:
        kind: SYMBOLIC
        latex: \sqrt{3}
    - name: miara kąta alfa (stopnie)
      answer:
        kind: NUMERIC
        value: 60.0
    - name: długość przekątnej
      answer:
        kind: SYMBOLIC
        latex: 6\sqrt{2}
  checks:
  - kind: evaluate
    expr: \frac{3\cdot\sqrt{6}}{3\cdot\sqrt{2}}
    part: tangens kąta alfa
  - kind: evaluate
    expr: \sqrt{\left(3\cdot\sqrt{2}\right)^{2}+\left(3\cdot\sqrt{6}\right)^{2}}
    part: długość przekątnej
  skills:
  - rzut przekątnej na podstawę
  - tangens kąta nachylenia
  - twierdzenie Pitagorasa w bryle
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: PARSE_ERROR: "UnexpectedCharacters: No terminal matches ''\\'' in the current
      parser context, at line 1 col 4"'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: kąty w ostrosłupie prawidłowym trójkątnym
  statement: Dany jest ostrosłup prawidłowy trójkątny ABCS, w którym podstawa ABC jest trójkątem równobocznym
    o boku długości 12, a wysokość SO ostrosłupa jest równa 6 (O jest środkiem trójkąta ABC, czyli punktem
    przecięcia jego wysokości). Punkt M jest środkiem krawędzi BC. (a) Uzasadnij, że kąt SMO jest kątem
    liniowym kąta dwuściennego między ścianą boczną SBC a płaszczyzną podstawy. (b) Oblicz miarę tego
    kąta dwuściennego. (c) Oblicz długość apotemy SM. (d) Oblicz tangens kąta nachylenia krawędzi bocznej
    SA do płaszczyzny podstawy.
  statement_latex: r=|OM|=\frac{12\sqrt{3}}{6},\qquad \operatorname{tg}\beta=\frac{6}{2\sqrt{3}},\qquad
    |SM|=\sqrt{6^{2}+\left(2\sqrt{3}\right)^{2}},\qquad R=|OA|=\frac{12\sqrt{3}}{3},\qquad \operatorname{tg}\alpha=\frac{6}{4\sqrt{3}}
  solution: |-
    Oznaczmy a = 12, H = |SO| = 6.
    Promienie: r = |OM| = \frac{a\sqrt{3}}{6} = 2\sqrt{3}, R = |OA| = \frac{a\sqrt{3}}{3} = 4\sqrt{3}.
    (a) Odcinek OM leży w podstawie i jest częścią wysokości trójkąta równobocznego poprowadzonej z A, więc OM ⊥ BC. Odcinek SM jest wysokością trójkąta równoramiennego SBC (|SB| = |SC|) poprowadzoną do podstawy BC, więc SM ⊥ BC. Obie półproste MO i MS wychodzą z punktu M krawędzi BC i są do niej prostopadłe, leżąc odpowiednio w płaszczyźnie podstawy i w płaszczyźnie ściany SBC – zatem ∠SMO jest kątem liniowym rozważanego kąta dwuściennego. (Prostopadłość SM ⊥ BC wynika też z twierdzenia o trzech prostych prostopadłych: rzutem SM na podstawę jest OM ⊥ BC.)
    (b) Trójkąt SOM ma kąt prosty przy O, więc tg β = \frac{|SO|}{|OM|} = \frac{6}{2\sqrt{3}} = \frac{6\sqrt{3}}{6} = \sqrt{3}, czyli β = 60°.
    (c) |SM| = \sqrt{6^{2}+\left(2\sqrt{3}\right)^{2}} = \sqrt{36+12} = \sqrt{48} = 4\sqrt{3}.
    (d) Rzutem krawędzi SA na podstawę jest odcinek OA, więc kąt nachylenia to α = ∠SAO, a tg α = \frac{|SO|}{|OA|} = \frac{6}{4\sqrt{3}} = \frac{\sqrt{3}}{2} ≈ 0{,}866 (α ≈ 40°54'). Zgodnie z regułą R > r otrzymujemy α < β.
  solution_steps:
  - Wyznacz r = \frac{12\sqrt{3}}{6} = 2\sqrt{3} oraz R = \frac{12\sqrt{3}}{3} = 4\sqrt{3}.
  - Uzasadnij OM ⊥ BC i SM ⊥ BC, skąd ∠SMO jest kątem liniowym.
  - Oblicz tg β = \frac{6}{2\sqrt{3}} = \sqrt{3}, więc β = 60°.
  - Oblicz |SM| = \sqrt{36+12} = 4\sqrt{3}.
  - Oblicz tg α = \frac{6}{4\sqrt{3}} = \frac{\sqrt{3}}{2}.
  answer:
    kind: MULTIPART
    parts:
    - name: uzasadnienie kąta liniowego
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy wykazać, że OM ⊥ BC (OM zawiera się w wysokości trójkąta równobocznego) oraz SM
          ⊥ BC (SM jest wysokością trójkąta równoramiennego SBC lub z twierdzenia o trzech prostych prostopadłych),
          a obie półproste wychodzą z punktu M leżącego na krawędzi BC i leżą w odpowiednich półpłaszczyznach.
    - name: miara kąta dwuściennego (stopnie)
      answer:
        kind: NUMERIC
        value: 60.0
    - name: apotema SM
      answer:
        kind: SYMBOLIC
        latex: 4\sqrt{3}
    - name: tangens kąta nachylenia krawędzi bocznej
      answer:
        kind: SYMBOLIC
        latex: \frac{\sqrt{3}}{2}
  checks:
  - kind: evaluate
    expr: \sqrt{6^{2}+\left(2\cdot\sqrt{3}\right)^{2}}
    part: apotema SM
  - kind: evaluate
    expr: \frac{6}{4\cdot\sqrt{3}}
    part: tangens kąta nachylenia krawędzi bocznej
  skills:
  - kąt dwuścienny ściana boczna – podstawa
  - kąt nachylenia krawędzi bocznej
  - r i R w trójkącie równobocznym
  - uzasadnianie prostopadłości
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie kąta liniowego · 2/3 other parts solved fresh'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 5
  exercise_type: ostrosłup prawidłowy czworokątny z danym kątem dwuściennym
  statement: 'Dany jest ostrosłup prawidłowy czworokątny ABCDS, w którym podstawa ABCD jest kwadratem
    o boku długości 6, a każda ściana boczna jest nachylona do płaszczyzny podstawy pod kątem 60°. Punkt
    O jest środkiem kwadratu ABCD, a M – środkiem krawędzi BC. Oblicz: (a) wysokość SO ostrosłupa, (b)
    długość krawędzi bocznej SA, (c) tangens kąta α nachylenia krawędzi bocznej SA do płaszczyzny podstawy.
    (d) Uzasadnij, że kąt α jest mniejszy od 60°.'
  statement_latex: r=\frac{6}{2},\quad |SO|=\frac{6}{2}\cdot\sqrt{3},\quad R=\frac{6\sqrt{2}}{2},\quad
    |SA|=\sqrt{\left(3\sqrt{3}\right)^{2}+\left(3\sqrt{2}\right)^{2}},\quad \operatorname{tg}\alpha=\frac{3\sqrt{3}}{3\sqrt{2}}
  solution: |-
    Kąt dwuścienny między ścianą SBC a podstawą ma krawędź BC, a jego kątem liniowym jest ∠SMO, bo OM ⊥ BC i SM ⊥ BC. Zatem ∠SMO = 60°.
    (a) W trójkącie prostokątnym SOM (kąt prosty przy O) mamy |OM| = r = \frac{6}{2} = 3, więc
    |SO| = r\cdot\operatorname{tg}60^\circ = 3\cdot\sqrt{3} = 3\sqrt{3}.
    (b) Rzutem krawędzi SA na podstawę jest odcinek OA o długości R = \frac{6\sqrt{2}}{2} = 3\sqrt{2}. W trójkącie prostokątnym SOA (kąt prosty przy O):
    |SA| = \sqrt{\left(3\sqrt{3}\right)^{2}+\left(3\sqrt{2}\right)^{2}} = \sqrt{27+18} = \sqrt{45} = 3\sqrt{5}.
    (c) tg α = \frac{|SO|}{|OA|} = \frac{3\sqrt{3}}{3\sqrt{2}} = \frac{\sqrt{6}}{2} ≈ 1{,}2247 (α ≈ 50°46').
    (d) Ponieważ R = 3\sqrt{2} > r = 3, a licznik |SO| jest w obu przypadkach ten sam, mamy tg α = \frac{H}{R} < \frac{H}{r} = \operatorname{tg}60^\circ. Tangens jest funkcją rosnącą dla kątów ostrych, więc α < 60°.
  solution_steps:
  - Wskaż kąt liniowy ∠SMO = 60° (OM ⊥ BC, SM ⊥ BC) i wyznacz r = 3.
  - Oblicz |SO| = 3\cdot\operatorname{tg}60^\circ = 3\sqrt{3}.
  - Wyznacz R = |OA| = 3\sqrt{2}.
  - Oblicz |SA| = \sqrt{27+18} = 3\sqrt{5}.
  - Oblicz tg α = \frac{3\sqrt{3}}{3\sqrt{2}} = \frac{\sqrt{6}}{2}.
  - 'Porównaj: R > r, więc tg α < tg 60°, czyli α < 60°.'
  answer:
    kind: MULTIPART
    parts:
    - name: wysokość SO
      answer:
        kind: SYMBOLIC
        latex: 3\sqrt{3}
    - name: krawędź boczna SA
      answer:
        kind: SYMBOLIC
        latex: 3\sqrt{5}
    - name: tangens kąta alfa
      answer:
        kind: SYMBOLIC
        latex: \frac{\sqrt{6}}{2}
    - name: uzasadnienie, że alfa < 60 stopni
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy zauważyć, że R = 3\sqrt{2} > r = 3, więc tg α = H/R < H/r = tg 60°, a ponieważ
          tangens rośnie dla kątów ostrych, α < 60°.
  checks:
  - kind: evaluate
    expr: \frac{6}{2}\cdot\sqrt{3}
    part: wysokość SO
  - kind: evaluate
    expr: \sqrt{\left(3\cdot\sqrt{3}\right)^{2}+\left(3\cdot\sqrt{2}\right)^{2}}
    part: krawędź boczna SA
  - kind: evaluate
    expr: \frac{3\cdot\sqrt{3}}{3\cdot\sqrt{2}}
    part: tangens kąta alfa
  skills:
  - kąt dwuścienny ściana boczna – podstawa
  - wysokość ostrosłupa z tangensa
  - krawędź boczna
  - porównywanie kątów nachylenia
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie, że alfa < 60 stopni · 3/3 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: obliczanie kątów w ostrosłupie prawidłowym
  statement: Dany jest ostrosłup prawidłowy czworokątny $ABCDS$ o podstawie $ABCD$, w którym krawędź podstawy
    ma długość $|AB| = 8$. Ściana boczna tego ostrosłupa jest nachylona do płaszczyzny podstawy pod kątem
    $60^\circ$. Oblicz wysokość tego ostrosłupa oraz tangens kąta nachylenia krawędzi bocznej do płaszczyzny
    podstawy.
  statement_latex: \operatorname{tg}60^\circ = \frac{H}{r},\qquad r = \frac{8}{2},\qquad \operatorname{tg}\alpha
    = \frac{H}{R},\qquad R = \frac{8 \cdot \sqrt{2}}{2}
  solution: |-
    Niech $O$ będzie środkiem kwadratu $ABCD$ (spodkiem wysokości $SO = H$), a $M$ — środkiem krawędzi $BC$.

    Kąt dwuścienny między ścianą boczną $SBC$ a podstawą ma krawędź $BC$. Ponieważ $OM \perp BC$ oraz $SM \perp BC$ (odcinek $SM$ jest wysokością trójkąta równoramiennego $SBC$), kątem liniowym tego kąta dwuściennego jest $\angle SMO = 60^\circ$.

    W trójkącie prostokątnym $SOM$ (kąt prosty przy $O$) mamy $|OM| = r = \frac{8}{2} = 4$, zatem
    $$H = r \cdot \operatorname{tg}60^\circ = 4 \cdot \sqrt{3}.$$

    Rzutem prostokątnym krawędzi bocznej $SB$ na płaszczyznę podstawy jest odcinek $OB$, więc kątem nachylenia krawędzi bocznej do podstawy jest $\alpha = \angle SBO$. Przy tym $|OB| = R = \frac{8 \cdot \sqrt{2}}{2} = 4 \cdot \sqrt{2}$, zatem
    $$\operatorname{tg}\alpha = \frac{H}{R} = \frac{4 \cdot \sqrt{3}}{4 \cdot \sqrt{2}} = \frac{\sqrt{6}}{2} \approx 1{,}2247.$$

