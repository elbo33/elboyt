  exercise_type: diagnoza błędu – tangens kąta prostego
  statement: 'Uczeń miał obliczyć wartość wyrażenia W = 2\cdot\sin 90^{\circ} + \operatorname{tg}90^{\circ}.
    Napisał: „\cos 90^{\circ}=0, więc \operatorname{tg}90^{\circ}=0” i podał W=2. Rozstrzygnij, czy wyrażenie
    W ma wartość liczbową (odpowiedz TAK lub NIE) i uzasadnij odpowiedź, a następnie oblicz wartość wyrażenia
    U = 2\cdot\sin 90^{\circ} + \operatorname{tg}135^{\circ}.'
  statement_latex: W = 2\cdot\sin 90^{\circ} + \operatorname{tg}90^{\circ},\qquad U = 2\cdot\sin 90^{\circ}
    + \operatorname{tg}135^{\circ}
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń uznał, że skoro \cos 90^{\circ}=0, to \operatorname{tg}90^{\circ}=0, i otrzymał W = 2\cdot 1 + 0 = 2 — to jest błędne.
    GDZIE JEST BŁĄD: \operatorname{tg}\alpha = \frac{\sin\alpha}{\cos\alpha}, a dla \alpha=90^{\circ} mianownik jest równy zero — dzielenie przez zero jest niewykonalne. W definicji współrzędnościowej \operatorname{tg}\alpha=\frac{y}{x}, a dla 90^{\circ} ramię kąta leży na osi OY, czyli x=0. Zatem \operatorname{tg}90^{\circ} nie istnieje i wyrażenie W nie ma wartości liczbowej (odpowiedź: NIE).
    POPRAWNY RACHUNEK dla U: \sin 90^{\circ}=1 oraz \operatorname{tg}135^{\circ}=\operatorname{tg}\left(180^{\circ}-45^{\circ}\right)=-\operatorname{tg}45^{\circ}=-1, więc
    U = 2\cdot 1 + \left(-1\right) = 1.
  solution_steps:
  - 'Odtwórz błąd: przyjęcie \operatorname{tg}90^{\circ}=0 prowadzi do W=2.'
  - 'Wyjaśnij: \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha}, a \cos 90^{\circ}=0, więc \operatorname{tg}90^{\circ}
    nie istnieje – wyrażenie W nie ma wartości liczbowej.'
  - Oblicz \operatorname{tg}135^{\circ}=-\operatorname{tg}45^{\circ}=-1 oraz \sin 90^{\circ}=1.
  - Wyznacz U = 2\cdot 1 - 1 = 1.
  answer:
    kind: MULTIPART
    parts:
    - name: czy W ma wartosc liczbowa
      answer:
        kind: BOOLEAN
        latex: \text{NIE, bo }\operatorname{tg}90^{\circ}\text{ nie istnieje}
