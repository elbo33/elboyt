  exercise_type: kąt oparty na średnicy
  statement: Odcinek AB jest średnicą okręgu o środku O, a punkt C leży na tym okręgu i jest różny od
    A i od B. Kąt CAB ma miarę 41^\circ. Oblicz miary kątów ACB oraz ABC. Wyniki podaj w stopniach.
  statement_latex: '|\angle ACB| = 90^\circ,\qquad |\angle ABC| = 180^\circ - 90^\circ - 41^\circ'
  solution: |-
    Kąt ACB jest kątem wpisanym opartym na półokręgu (jego ramiona przechodzą przez końce średnicy AB), więc |\angle ACB| = 90^\circ.

    Z sumy kątów w trójkącie ABC:
    |\angle ABC| = 180^\circ - 90^\circ - 41^\circ = 49^\circ.

    Odpowiedź: |\angle ACB| = 90^\circ, |\angle ABC| = 49^\circ.
  solution_steps:
  - Zauważ, że AB jest średnicą, więc kąt wpisany ACB jest oparty na półokręgu.
  - Stąd |\angle ACB| = 90^\circ.
  - Z sumy kątów trójkąta ABC oblicz |\angle ABC| = 180^\circ - 90^\circ - 41^\circ = 49^\circ.
  answer:
    kind: MULTIPART
    parts:
    - name: kat_ACB
      answer:
        kind: NUMERIC
        value: 90.0
        latex: 90^\circ
    - name: kat_ABC
      answer:
        kind: NUMERIC
        value: 49.0
        latex: 49^\circ
  checks:
  - kind: evaluate
    expr: 180 - 90 - 41
    part: kat_ABC
  skills:
