  exercise_type: 'błąd: ignorowanie dziedziny z treści'
  statement: 'Zakład produkuje karmniki dla ptaków. Tygodniowy zysk (w złotych) ze sprzedaży x karmników
    opisuje funkcja Z\left(x\right)=-x^{2}+180x-3200. Tygodniowo zakład może wyprodukować i sprzedać co
    najwyżej 60 karmników. Uczeń napisał: „p=-\frac{180}{2\cdot\left(-1\right)}=90, więc największy zysk
    osiągniemy przy 90 karmnikach i wyniesie on Z\left(90\right)=4900 zł”. Wskaż błąd w tym rozumowaniu,
    a następnie oblicz, ile karmników należy sprzedać, aby tygodniowy zysk był największy, i oblicz ten
    zysk. Zapisz obliczenia.'
  statement_latex: Z\left(x\right)=-x^{2}+180x-3200,\qquad x\in\left[0,60\right]
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń policzył tylko wierzchołek paraboli: p=-\frac{180}{2\cdot(-1)}=90 oraz Z(90)=-8100+16200-3200=4900 i podał odpowiedź 90 karmników, zysk 4900 zł.
    DLACZEGO TO BŁĄD: wzór funkcji jest określony dla wszystkich liczb rzeczywistych, ale zadanie – nie. Z treści wynika, że x \in [0,60] (i x jest liczbą całkowitą). Ponieważ 90 \notin [0,60], zakład nie może wyprodukować 90 karmników – wynik ucznia jest niewykonalny.
    POPRAWNIE: a=-1<0, więc funkcja Z rośnie na przedziale (-\infty,90], a zatem rośnie na całym [0,60]. Największą wartość przyjmuje więc w prawym końcu dziedziny, dla x=60.
    Z(60)=-60^{2}+180\cdot 60-3200=-3600+10800-3200=4000.
    Odpowiedź: należy sprzedawać 60 karmników tygodniowo, a największy tygodniowy zysk wynosi 4000 zł.
  solution_steps:
  - 'Odtwórz błędne rozumowanie: p=90 i Z(90)=4900 zł.'
  - 'Wskaż błąd: dziedziną wynikającą z treści jest [0,60], a 90 do niej nie należy.'
  - 'Zbadaj monotoniczność: a=-1<0, więc na (-\infty,90] funkcja rośnie, czyli rośnie na [0,60].'
  - 'Wybierz prawy koniec przedziału: x=60.'
  - Oblicz Z(60)=-3600+10800-3200=4000 zł.
  answer:
