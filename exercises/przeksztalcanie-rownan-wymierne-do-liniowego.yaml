- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: zadanie tekstowe – wzór funkcji wymiernej, równanie i rozstrzygnięcie wykonalności
  statement: Zmieszano 200 g wodnego roztworu soli o stężeniu 10% oraz 300 g wodnego roztworu soli o stężeniu
    20%. Do otrzymanej mieszaniny dosypano x gramów czystej soli, która całkowicie się rozpuściła. a)
    Zapisz wzór na stężenie procentowe p(x) (w procentach) roztworu otrzymanego po dosypaniu soli oraz
    podaj dziedzinę tego wzoru wynikającą z warunków zadania. b) Oblicz, ile gramów czystej soli należy
    dosypać do mieszaniny, aby otrzymać roztwór o stężeniu 20%. c) W pracowni pozostało tylko 60 g czystej
    soli. Rozstrzygnij, czy z otrzymanej mieszaniny można w ten sposób sporządzić roztwór o stężeniu 30%.
  statement_latex: p\left(x\right)=\frac{\left(80+x\right)\cdot 100}{500+x}
  solution: |-
    Najpierw ustalamy skład mieszaniny.
    W 200 g roztworu 10% jest 0{,}1\cdot 200=20 g soli, a w 300 g roztworu 20% jest 0{,}2\cdot 300=60 g soli.
    Razem mieszanina ma masę 200+300=500 g i zawiera 20+60=80 g soli.
    a) Po dosypaniu x gramów czystej soli masa soli wynosi 80+x, a masa całego roztworu 500+x, zatem
    p\left(x\right)=\frac{\left(80+x\right)\cdot 100}{500+x}\ \left[\%\right].
    Z warunków zadania dosypujemy nieujemną masę soli, więc x\geq 0; dla takich x mianownik 500+x jest dodatni, czyli różny od zera. Dziedzina: x\in\left\langle 0,+\infty\right).
    b) Rozwiązujemy równanie p\left(x\right)=20, czyli
    \frac{80+x}{500+x}=\frac{20}{100}=\frac{1}{5}.
    Mnożymy na krzyż (mianowniki różne od zera):
    5\cdot\left(80+x\right)=500+x
    400+5x=500+x
    4x=100
    x=25.
    Liczba 25 należy do dziedziny.
    Sprawdzenie: \frac{80+25}{500+25}=\frac{105}{525}=\frac{1}{5}=20\%.
    c) Szukamy x, dla którego p\left(x\right)=30:
    \frac{80+x}{500+x}=\frac{30}{100}=\frac{3}{10}
    10\cdot\left(80+x\right)=3\cdot\left(500+x\right)
    800+10x=1500+3x
    7x=700
    x=100.
    Potrzeba więc 100 g czystej soli, a w pracowni jest tylko 60 g, ponieważ 100>60. Zatem nie można sporządzić roztworu o stężeniu 30%.
    Odpowiedź: a) p\left(x\right)=\frac{\left(80+x\right)\cdot 100}{500+x} dla x\in\left\langle 0,+\infty\right); b) 25 g; c) nie – potrzeba 100 g soli, a dostępne jest tylko 60 g.
  solution_steps:
  - 'Oblicz masy soli w obu roztworach: 0{,}1\cdot 200=20 g oraz 0{,}2\cdot 300=60 g.'
  - 'Wyznacz masę mieszaniny 500 g i masę soli w niej: 80 g.'
  - a) Zapisz wzór p\left(x\right)=\frac{\left(80+x\right)\cdot 100}{500+x} i dziedzinę x\in\left\langle
    0,+\infty\right).
  - 'b) Ułóż i rozwiąż równanie \frac{80+x}{500+x}=\frac{1}{5}: 400+5x=500+x, x=25.'
  - 'c) Ułóż i rozwiąż równanie \frac{80+x}{500+x}=\frac{3}{10}: 800+10x=1500+3x, x=100.'
  - 'c) Porównaj 100 g z dostępnymi 60 g i sformułuj wniosek: sporządzenie roztworu 30% jest niemożliwe.'
