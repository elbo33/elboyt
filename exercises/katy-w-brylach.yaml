  - 'Wprowadź niewiadomą: r — promień podstawy, r > 0.'
  - 'Z kąta nachylenia tworzącej: \operatorname{tg}60^\circ = \frac{h}{r}, więc h = r\cdot\sqrt{3}.'
  - 'Podstaw do wzoru na objętość: \frac{1}{3}\cdot\pi\cdot r^{2}\cdot r\cdot\sqrt{3} = 9\cdot\sqrt{3}\cdot\pi,
