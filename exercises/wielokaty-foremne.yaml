- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: kąty i przekątne wielokąta foremnego
  statement: Kąt wewnętrzny pewnego wielokąta foremnego jest trzy razy większy od jego kąta środkowego.
    Oblicz liczbę boków tego wielokąta, miarę jego kąta wewnętrznego oraz liczbę jego przekątnych.
  statement_latex: \alpha = 3\cdot\beta,\quad \beta=\frac{360^\circ}{n},\quad \alpha=180^\circ-\frac{360^\circ}{n}
  solution: |-
    Niech n oznacza liczbę boków wielokąta foremnego. Kąt środkowy ma miarę \beta=\frac{360^\circ}{n}, a kąt wewnętrzny \alpha=180^\circ-\frac{360^\circ}{n}.
    Z warunku zadania \alpha=3\cdot\beta, czyli
    180^\circ-\frac{360^\circ}{n}=3\cdot\frac{360^\circ}{n}.
    Stąd 180^\circ=4\cdot\frac{360^\circ}{n}, więc \frac{360^\circ}{n}=45^\circ i n=8.
    Kąt wewnętrzny: \alpha=\frac{\left(8-2\right)\cdot 180^\circ}{8}=\frac{1080^\circ}{8}=135^\circ (kontrola: 3\cdot 45^\circ=135^\circ ✓).
    Liczba przekątnych: d=\frac{n\left(n-3\right)}{2}=\frac{8\cdot 5}{2}=20.
    Odpowiedź: ośmiokąt foremny, kąt wewnętrzny 135°, 20 przekątnych.
  solution_steps:
  - Oznacz liczbę boków przez n i zapisz \beta=\frac{360^\circ}{n} oraz \alpha=180^\circ-\frac{360^\circ}{n}.
  - Ułóż równanie 180^\circ-\frac{360^\circ}{n}=3\cdot\frac{360^\circ}{n}.
  - 'Rozwiąż: 180^\circ=4\cdot\frac{360^\circ}{n}, zatem n=8.'
  - Oblicz kąt wewnętrzny \alpha=\frac{\left(8-2\right)\cdot 180^\circ}{8}=135^\circ.
  - Oblicz liczbę przekątnych d=\frac{8\cdot\left(8-3\right)}{2}=20.
  answer:
    kind: MULTIPART
    parts:
    - name: n
      answer:
        kind: NUMERIC
        value: 8.0
    - name: kat_wewnetrzny
      answer:
        kind: NUMERIC
        value: 135.0
    - name: liczba_przekatnych
      answer:
        kind: NUMERIC
        value: 20.0
  checks:
  - kind: solve_equation
    expr: 180 - \frac{360}{n} - 3\cdot\frac{360}{n}
    var: n
    part: n
  - kind: evaluate
    expr: \frac{\left(8-2\right)\cdot 180}{8}
    part: kat_wewnetrzny
  - kind: evaluate
    expr: \frac{8\cdot\left(8-3\right)}{2}
    part: liczba_przekatnych
  skills:
