  - 'Rozłóż na czynniki: 9-x^{2}=-(x-3)(x+3), x^{2}-6x+9=(x-3)^{2}, x^{2}+3x=x(x+3), 2x-6=2(x-3).'
  - 'Zapisz założenia: (x-3)^{2}\neq 0, 2(x-3)\neq 0, x(x+3)\neq 0; stąd D=\mathbb{R}\setminus\{-3,0,3\}.'
  - Zamień dzielenie na mnożenie przez odwrotność dolnego ułamka.
  - 'Skróć (x-3)^{2} i (x+3): W(x)=-\frac{2}{x}.'
  - Rozwiąż -\frac{2}{x}=-1, otrzymaj x=2 i sprawdź, że 2\in D.
