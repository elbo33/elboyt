  statement: Kąt \alpha jest ostry oraz \sin\alpha = \frac{5}{13}. Oblicz \cos\alpha.
  statement_latex: \cos\alpha=\sqrt{1-\sin^{2}\alpha},\qquad \sin\alpha=\frac{5}{13}
  solution: |-
    BŁĘDNE ROZUMOWANIE (typowy błąd):
    Uczeń „rozdziela" pierwiastek na różnicę:
    \cos\alpha=\sqrt{1-\sin^{2}\alpha}=\sqrt{1}-\sqrt{\sin^{2}\alpha}=1-\sin\alpha=1-\frac{5}{13}=\frac{8}{13} — wynik BŁĘDNY.

    DLACZEGO TO BŁĄD:
    Pierwiastek z różnicy nie jest różnicą pierwiastków: \sqrt{a-b}\neq\sqrt{a}-\sqrt{b}. Sprawdzenie: \left(\frac{5}{13}\right)^{2}+\left(\frac{8}{13}\right)^{2}=\frac{25+64}{169}=\frac{89}{169}\neq 1.

    POPRAWNE ROZWIĄZANIE:
    Najpierw obliczamy wyrażenie pod pierwiastkiem, a dopiero potem pierwiastkujemy:
    \cos^{2}\alpha=1-\left(\frac{5}{13}\right)^{2}=1-\frac{25}{169}=\frac{144}{169}.
    Kąt ostry, więc \cos\alpha=\sqrt{\frac{144}{169}}=\frac{12}{13}.
    Sprawdzenie: \frac{25}{169}+\frac{144}{169}=1 — zgadza się.
    Odpowiedź: \cos\alpha=\frac{12}{13}.
  solution_steps:
  - 'Błąd: \sqrt{1-\sin^{2}\alpha}=1-\sin\alpha i wynik \frac{8}{13}.'
  - 'Korekta: \sqrt{a-b}\neq\sqrt{a}-\sqrt{b}; najpierw licz różnicę pod pierwiastkiem.'
  - \cos^{2}\alpha=1-\frac{25}{169}=\frac{144}{169}.
