        kind: NUMERIC
        value: -3.0
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '-1'
        hi: '6'
        lo_open: false
    - name: miejsca_zerowe
      answer:
        kind: SET
        members:
        - '-1'
        - '3'
    - name: argumenty_nieujemne
      answer:
