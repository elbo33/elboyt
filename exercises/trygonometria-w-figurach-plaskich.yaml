- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: zadanie z filtrowaniem rozwiązania (kąt rozwarty)
  statement: Punkty A, B, C są wierzchołkami trójkąta, w którym |AB| = 12, |AC| = 5, a kąt BAC jest kątem
    rozwartym. Pole trójkąta ABC jest równe 15. Niech D będzie spodkiem wysokości opuszczonej z wierzchołka
    C na prostą AB. Wyznacz miarę kąta BAC, odległość punktu C od prostej AB oraz długość odcinka BD.
  statement_latex: 15=\frac{1}{2}\cdot 12\cdot 5\cdot\sin\left(\angle BAC\right),\qquad |CD|=\frac{2\cdot
    15}{12},\qquad |BD|=12+5\cdot\cos\left(180^\circ-\angle BAC\right)
  solution: |-
    1) Miara kąta. Kąt BAC leży między bokami AB i AC, więc
    15 = \frac{1}{2}\cdot 12\cdot 5\cdot\sin\left(\angle BAC\right) = 30\cdot\sin\left(\angle BAC\right),
    stąd \sin\left(\angle BAC\right) = \frac{1}{2}.
    Dla kątów z przedziału \left(0^\circ,180^\circ\right) warunek ten spełniają dwa kąty: 30^\circ oraz 150^\circ. Ponieważ w zadaniu kąt BAC jest rozwarty, odrzucamy 30^\circ i przyjmujemy \angle BAC = 150^\circ.

    2) Odległość C od prostej AB to długość wysokości h = |CD|. Z P = \frac{1}{2}\cdot |AB|\cdot h mamy
    h = \frac{2\cdot 15}{12} = 2{,}5.
    (Kontrola: h = 5\cdot\sin 150^\circ = 5\cdot\frac{1}{2} = 2{,}5. ✓)

    3) Odcinek BD. Ponieważ kąt przy A jest rozwarty, spodek D leży poza odcinkiem AB — na przedłużeniu za punkt A. W trójkącie prostokątnym ADC kąt przy A wynosi 180^\circ - 150^\circ = 30^\circ, a przeciwprostokątną jest AC = 5, więc
    |AD| = 5\cdot\cos 30^\circ = 5\cdot\frac{\sqrt{3}}{2} = \frac{5\sqrt{3}}{2}.
    Punkty D i B leżą po przeciwnych stronach punktu A, zatem
    |BD| = |BA| + |AD| = 12 + \frac{5\sqrt{3}}{2}.

    Odpowiedź: \angle BAC = 150^\circ, odległość C od prostej AB wynosi 2{,}5, a |BD| = 12+\frac{5\sqrt{3}}{2}.
  solution_steps:
  - Z wzoru na pole P = \frac{1}{2}\cdot 12\cdot 5\cdot\sin\left(\angle BAC\right) wyznacz \sin\left(\angle
    BAC\right) = \frac{1}{2}.
