- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: promienie r i R oraz położenie środka okręgu opisanego w trójkącie równoramiennym rozwartokątnym
  statement: W trójkącie równoramiennym ABC podstawa AB ma długość 24, a ramiona AC i BC mają długość
    13. Oblicz promień r okręgu wpisanego w ten trójkąt oraz promień R okręgu opisanego na tym trójkącie.
    Oblicz odległość środka O okręgu opisanego od prostej AB i rozstrzygnij, czy punkt O leży wewnątrz
    trójkąta ABC.
  statement_latex: '|AB| = 24,\quad |AC| = |BC| = 13,\quad r = \frac{P}{p},\quad R = \frac{a\cdot b\cdot
    c}{4\cdot P}'
  solution: |-
    Wysokość CD poprowadzona z wierzchołka C na podstawę dzieli ją na połowy, więc |AD| = 12 oraz h = |CD| = \sqrt{13^2-12^2} = \sqrt{25} = 5.

    Pole: P = \frac{1}{2}\cdot 24\cdot 5 = 60. Połowa obwodu: p = \frac{13+13+24}{2} = 25.

    Promień okręgu wpisanego: r = \frac{P}{p} = \frac{60}{25} = \frac{12}{5} = 2{,}4.

    Promień okręgu opisanego: R = \frac{13\cdot 13\cdot 24}{4\cdot 60} = \frac{4056}{240} = \frac{169}{10} = 16{,}9.

    Wszystkie punkty szczególne leżą na osi symetrii, czyli na prostej CD. Punkt O jest odległy od wierzchołka C o R = 16,9, a wierzchołek C leży 5 jednostek nad podstawą. Ponieważ 16,9 > 5, punkt O leży po przeciwnej stronie prostej AB niż wierzchołek C, w odległości 16,9 − 5 = 11,9 od tej prostej.

    Sprawdzenie: odległość O od końca podstawy wynosi \sqrt{11{,}9^2+12^2} = \sqrt{141{,}61+144} = \sqrt{285{,}61} = 16{,}9 = R ✓.

    Zatem O nie leży wewnątrz trójkąta (trójkąt jest rozwartokątny, bo 13^2+13^2 = 338 < 24^2 = 576). Kontrola: r = 2{,}4 < R = 16{,}9 ✓.
  solution_steps:
  - 'Oblicz wysokość opuszczoną na podstawę: h = \sqrt{13^{2}-12^{2}} = 5.'
  - Oblicz pole P = \frac{1}{2}\cdot 24\cdot 5 = 60 i połowę obwodu p = 25.
  - Wyznacz r = \frac{60}{25} = 2{,}4.
  - Wyznacz R = \frac{13\cdot 13\cdot 24}{4\cdot 60} = 16{,}9.
  - 'Na osi symetrii odmierz R od wierzchołka C: skoro 16{,}9 > 5, punkt O leży po drugiej stronie podstawy,
    w odległości 16{,}9-5 = 11{,}9 od prostej AB.'
  - 'Wyciągnij wniosek: trójkąt jest rozwartokątny, więc O leży na zewnątrz trójkąta.'
  answer:
