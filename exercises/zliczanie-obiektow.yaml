  exercise_type: systematyczne wypisywanie
  statement: Rozważamy wszystkie liczby dwucyfrowe, w których zapisie występują wyłącznie cyfry ze zbioru
    {2, 5, 7} (cyfry mogą się powtarzać). a) Wypisz systematycznie wszystkie takie liczby (rosnąco, blokami
    według cyfry dziesiątek). b) Podaj, ile jest wszystkich takich liczb.
  statement_latex: N = 3^2 = 3 \cdot 3
  solution: |-
    a) Wypisujemy blokami: ustalamy cyfrę dziesiątek i zmieniamy tylko cyfrę jedności.
    Blok „2”: 22, 25, 27.
    Blok „5”: 52, 55, 57.
    Blok „7”: 72, 75, 77.
    b) Mamy 3 bloki po 3 liczby, czyli 3 \cdot 3 = 9 liczb.
    Kontrola regułą mnożenia: cyfrę dziesiątek wybieramy na 3 sposoby I cyfrę jedności na 3 sposoby, więc N = 3^2 = 9. ✓
  solution_steps:
  - 'Ustal porządek wypisywania: blokami według cyfry dziesiątek, wewnątrz bloku rosnąco.'
  - 'Wypisz blok dla cyfry 2: 22, 25, 27.'
  - 'Wypisz blok dla cyfry 5: 52, 55, 57.'
  - 'Wypisz blok dla cyfry 7: 72, 75, 77.'
  - 'Policz: 3 bloki po 3 liczby, czyli N = 3 \cdot 3 = 9.'
  answer:
    kind: MULTIPART
    parts:
    - name: a) wykaz liczb
      answer:
        kind: SET
        members:
        - '22'
        - '25'
        - '27'
        - '52'
        - '55'
        - '57'
        - '72'
        - '75'
        - '77'
    - name: b) liczba wszystkich
      answer:
        kind: NUMERIC
        value: 9.0
  checks:
