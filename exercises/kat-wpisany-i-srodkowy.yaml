- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: trójkąt równoramienny wpisany w okrąg — kąt między promieniem a cięciwą
  statement: Trójkąt ABC jest wpisany w okrąg o środku O. Boki AC i BC mają równe długości, a kąt ACB
    jest o 30° mniejszy od kąta ABC. Oblicz miarę kąta OAB.
  statement_latex: \left|\angle OAB\right| = \frac{180^\circ - 2\cdot\left(\frac{210^\circ}{3} - 30^\circ\right)}{2}
  solution: |-
    Oznaczmy przez x miarę kąta ABC. Ponieważ |AC| = |BC|, trójkąt ABC jest równoramienny o podstawie AB, więc kąty przy podstawie są równe: |∠BAC| = |∠ABC| = x. Kąt przy wierzchołku C jest o 30° mniejszy, czyli |∠ACB| = x − 30°.

    Z sumy kątów trójkąta:
    x + x + (x − 30°) = 180°, czyli 3x = 210°, więc x = 70°.
    Stąd |∠ACB| = 70° − 30° = 40°.

    Kąt środkowy AOB jest oparty na tym samym łuku AB (niezawierającym C) co kąt wpisany ACB, zatem |∠AOB| = 2 · 40° = 80° (kąt wypukły, bo 2 · 40° < 180°).

    Trójkąt AOB jest równoramienny, bo |OA| = |OB| = r, więc kąty przy podstawie AB są równe:
    |∠OAB| = (180° − 80°) : 2 = 50°.

    Odpowiedź: |∠OAB| = 50°.
  solution_steps:
  - Wprowadzam x — miarę kąta ABC; z równości |AC| = |BC| wynika |∠BAC| = |∠ABC| = x.
  - 'Zapisuję warunek zadania: |∠ACB| = x − 30°.'
  - 'Z sumy kątów trójkąta: x + x + (x − 30°) = 180°, więc x = 70° i |∠ACB| = 40°.'
  - 'Kąt środkowy oparty na łuku AB niezawierającym C: |∠AOB| = 2 · 40° = 80°.'
  - 'Trójkąt AOB jest równoramienny (|OA| = |OB| = r), więc |∠OAB| = (180° − 80°) : 2 = 50°.'
  answer:
    kind: NUMERIC
    value: 50.0
    latex: 50^\circ
  checks:
  - kind: evaluate
    expr: \frac{180 - 2\cdot\left(\frac{210}{3} - 30\right)}{2}
