  statement: Promień podstawy stożka obrotowego ma długość 3, a jego tworząca ma długość 7. Oblicz pole
    powierzchni bocznej oraz pole powierzchni całkowitej tego stożka. Wyniki podaj w postaci dokładnej
    (z liczbą \pi).
  statement_latex: P_b=\pi\cdot r\cdot l,\qquad P_c=\pi\cdot r\cdot\left(r+l\right),\quad r=3,\ l=7
  solution: |-
    Pole powierzchni bocznej: P_b = \pi r l = \pi\cdot 3\cdot 7 = 21\pi.
    Pole podstawy: P_p = \pi r^2 = \pi\cdot 3^2 = 9\pi.
    Pole powierzchni całkowitej: P_c = P_p + P_b = 9\pi + 21\pi = 30\pi, co zgadza się ze wzorem P_c = \pi r(r+l) = \pi\cdot 3\cdot(3+7) = 30\pi.
  solution_steps:
  - Zastosuj P_b = \pi\cdot r\cdot l = \pi\cdot 3\cdot 7 = 21\pi.
  - Oblicz pole podstawy P_p = \pi\cdot 3^2 = 9\pi.
  - 'Dodaj oba pola: P_c = 9\pi + 21\pi = 30\pi.'
  answer:
    kind: MULTIPART
    parts:
    - name: pole powierzchni bocznej
      answer:
        kind: SYMBOLIC
        latex: 21\pi
    - name: pole powierzchni całkowitej
      answer:
        kind: SYMBOLIC
        latex: 30\pi
