  statement: 'Dana jest funkcja f(x) = \log_{3}\left(5 - 2x\right). Uczeń zapisał: „f(4) = \log_{3}\left(-3\right)
    = -1, bo 3^{-1} to coś ujemnego”. Wyjaśnij, dlaczego to obliczenie jest błędne. a) Wyznacz dziedzinę
    funkcji f. b) Oblicz f(1).'
