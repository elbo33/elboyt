- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: odczyt zbioru rozwiązań z miejsc zerowych
  statement: 'Trójmian kwadratowy f\left(x\right)=x^{2}-2x-8 ma dwa miejsca zerowe: x_{1}=-2 oraz x_{2}=4,
    a współczynnik przy x^{2} jest dodatni. Korzystając z tych informacji, zapisz zbiór rozwiązań nierówności
    x^{2}-2x-8\leq 0. Zapisz obliczenia.'
  statement_latex: x^{2}-2x-8\leq 0
  solution: 'Współczynnik przy x^{2} jest równy a=1>0, więc parabola będąca wykresem funkcji f ma ramiona
    skierowane w górę i przecina oś OX w punktach -2 oraz 4. Parabola o ramionach w górę leży POD osią
    OX między miejscami zerowymi, a NAD osią na zewnątrz nich. Nierówność jest nieostra (\leq), więc miejsca
    zerowe, w których trójmian przyjmuje wartość 0, też należą do zbioru rozwiązań — nawiasy są domknięte.
    Zatem x\in\left\langle -2,\ 4\right\rangle. Sprawdzenie: dla x=0 mamy 0-0-8=-8\leq 0 (prawda), a dla
    x=5 mamy 25-10-8=7\leq 0 (fałsz) — zgadza się.'
  solution_steps:
  - Zauważ, że a=1>0, więc ramiona paraboli są skierowane w górę.
  - Parabola o ramionach w górę przyjmuje wartości ujemne między miejscami zerowymi -2 i 4.
  - Nierówność jest nieostra, więc dołączamy miejsca zerowe (nawiasy domknięte).
  - 'Zapisz odpowiedź: x\in\left\langle -2,\ 4\right\rangle.'
  answer:
    kind: INTERVAL
    lo: '-2'
    hi: '4'
    lo_open: false
    hi_open: false
  checks:
  - kind: solve_inequality
    expr: x^{2}-2\cdot x-8\leq 0
  skills:
  - znak trójmianu kwadratowego
  - zapis zbioru rozwiązań
  - nierówność nieostra a nawiasy
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: endpoints matched'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 2
  exercise_type: nierówność w postaci iloczynowej
  statement: Rozwiąż nierówność \left(x-1\right)\cdot\left(x-5\right)>0. Zapisz obliczenia.
  statement_latex: \left(x-1\right)\cdot\left(x-5\right)>0
  solution: 'Lewa strona jest już zapisana w postaci iloczynowej, więc delty liczyć nie trzeba: miejsca
    zerowe trójmianu to x_{1}=1 oraz x_{2}=5. Po wymnożeniu otrzymalibyśmy x^{2}-6x+5, więc a=1>0 i ramiona
    paraboli są skierowane w górę. Parabola leży NAD osią OX na zewnątrz miejsc zerowych. Nierówność jest
    ostra, więc końców nie dołączamy. Odpowiedź: x\in\left(-\infty,\ 1\right)\cup\left(5,\ +\infty\right).
    Sprawdzenie: dla x=0 mamy \left(-1\right)\cdot\left(-5\right)=5>0 (prawda), dla x=2 mamy 1\cdot\left(-3\right)=-3>0
    (fałsz).'
  solution_steps:
  - 'Odczytaj miejsca zerowe z czynników: x=1 oraz x=5.'
  - 'Ustal znak współczynnika przy x^{2}: a=1>0, ramiona w górę.'
  - Wartości dodatnie parabola przyjmuje na zewnątrz miejsc zerowych.
  - 'Nierówność ostra — nawiasy okrągłe: x\in\left(-\infty,\ 1\right)\cup\left(5,\ +\infty\right).'
  answer:
    kind: SYMBOLIC
    latex: x\in\left(-\infty,\ 1\right)\cup\left(5,\ +\infty\right)
  checks:
  - kind: solve_inequality
    expr: \left(x-1\right)\cdot\left(x-5\right)>0
  skills:
  - postać iloczynowa trójmianu
  - znak trójmianu
  - suma przedziałów
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''x\\in\\left(-\\infty,\\ 1\\right)\\cup\\left(5,\\ +\\infty\\right)''
      vs ''Union(Interval.open(-oo, 1), Interval.open(5, oo))'' (as sets)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: przypadek brzegowy Δ < 0
  statement: Dana jest nierówność x^{2}+2x+5>0. Oblicz wyróżnik trójmianu x^{2}+2x+5, a następnie zapisz
    zbiór rozwiązań tej nierówności. Zapisz obliczenia.
  statement_latex: x^{2}+2x+5>0
  solution: 'Mamy a=1, b=2, c=5, więc \Delta=2^{2}-4\cdot 1\cdot 5=4-20=-16. Ponieważ \Delta<0, trójmian
    nie ma miejsc zerowych — parabola nie ma punktów wspólnych z osią OX. Ramiona są skierowane w górę
    (a=1>0), więc cała parabola leży NAD osią OX, czyli x^{2}+2x+5>0 dla każdej liczby rzeczywistej x.
    Uwaga: ujemna delta nie oznacza braku rozwiązań nierówności, lecz brak miejsc zerowych. Odpowiedź:
    zbiorem rozwiązań jest \mathbb{R}.'
  solution_steps:
  - 'Odczytaj współczynniki: a=1, b=2, c=5.'
  - Oblicz \Delta=2^{2}-4\cdot 1\cdot 5=-16.
  - Stwierdź, że \Delta<0, więc trójmian nie ma miejsc zerowych.
  - Ponieważ a>0, trójmian jest dodatni dla każdego x, więc zbiorem rozwiązań jest \mathbb{R}.
  answer:
    kind: MULTIPART
    parts:
    - name: delta
      answer:
        kind: NUMERIC
        value: -16.0
    - name: zbior_rozwiazan
      answer:
        kind: SYMBOLIC
        latex: \mathbb{R}
  checks:
  - kind: evaluate
    expr: 2^{2}-4\cdot 1\cdot 5
    part: delta
  - kind: solve_inequality
    expr: x^{2}+2\cdot x+5>0
    part: zbior_rozwiazan
  skills:
  - obliczanie wyróżnika
  - przypadek Δ < 0
  - stały znak trójmianu
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: kind mismatch: answer=SYMBOLIC reference=INTERVAL'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: rozwiązywanie nierówności kwadratowej
  statement: Rozwiąż nierówność 2x^{2}-7x+3\leq 0. Zapisz obliczenia.
  statement_latex: 2x^{2}-7x+3\leq 0
  solution: 'Po prawej stronie jest już 0. Mamy a=2>0, b=-7, c=3. \Delta=\left(-7\right)^{2}-4\cdot 2\cdot
    3=49-24=25, \sqrt{\Delta}=5. Stąd x_{1}=\frac{7-5}{2\cdot 2}=\frac{1}{2} oraz x_{2}=\frac{7+5}{2\cdot
    2}=3. Ramiona paraboli skierowane są w górę, więc wartości niedodatnie trójmian przyjmuje między miejscami
    zerowymi, wraz z nimi (nierówność nieostra). Odpowiedź: x\in\left\langle \frac{1}{2},\ 3\right\rangle.
    Sprawdzenie: dla x=1 mamy 2-7+3=-2\leq 0 (prawda).'
  solution_steps:
  - Zapisz nierówność w postaci trójmian \leq 0 i odczytaj a=2, b=-7, c=3.
  - Oblicz \Delta=\left(-7\right)^{2}-4\cdot 2\cdot 3=25 oraz \sqrt{\Delta}=5.
  - 'Wyznacz miejsca zerowe: x_{1}=\frac{1}{2}, x_{2}=3.'
  - 'Ramiona w górę i znak \leq: bierzemy przedział domknięty między pierwiastkami.'
  - 'Zapisz odpowiedź: x\in\left\langle \frac{1}{2},\ 3\right\rangle.'
  answer:
    kind: INTERVAL
    lo: \frac{1}{2}
    hi: '3'
    lo_open: false
    hi_open: false
  checks:
  - kind: solve_inequality
    expr: 2\cdot x^{2}-7\cdot x+3\leq 0
  skills:
  - obliczanie wyróżnika
  - wyznaczanie miejsc zerowych
  - zapis przedziału domkniętego
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: endpoints matched'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: rozwiązywanie nierówności kwadratowej
  statement: Rozwiąż nierówność 2\cdot\left(x^{2}+3\right)\geq 7x. Zapisz obliczenia.
  statement_latex: 2\cdot\left(x^{2}+3\right)\geq 7x
  solution: 'Przekształcamy do postaci ogólnej: 2x^{2}+6\geq 7x, czyli 2x^{2}-7x+6\geq 0. Mamy a=2>0,
    b=-7, c=6, więc \Delta=\left(-7\right)^{2}-4\cdot 2\cdot 6=49-48=1, \sqrt{\Delta}=1. Miejsca zerowe:
    x_{1}=\frac{7-1}{4}=\frac{3}{2}, x_{2}=\frac{7+1}{4}=2. Parabola ma ramiona w górę, więc wartości
    nieujemne przyjmuje na zewnątrz miejsc zerowych, wraz z nimi (nierówność nieostra). Odpowiedź: x\in\left(-\infty,\
    \frac{3}{2}\right\rangle\cup\left\langle 2,\ +\infty\right). Sprawdzenie: dla x=0 lewa strona wynosi
    6, prawa 0 — nierówność zachodzi; dla x=1{,}8 mamy 2\cdot 3{,}24+6=12{,}48 oraz 7\cdot 1{,}8=12{,}6,
    więc nierówność nie zachodzi.'
  solution_steps:
  - 'Wymnóż nawias: 2x^{2}+6\geq 7x.'
  - 'Przenieś wszystko na lewą stronę: 2x^{2}-7x+6\geq 0.'
  - Oblicz \Delta=\left(-7\right)^{2}-4\cdot 2\cdot 6=1.
  - 'Wyznacz miejsca zerowe: x_{1}=\frac{3}{2}, x_{2}=2.'
  - 'a>0 oraz znak \geq — zbiorem rozwiązań są przedziały na zewnątrz pierwiastków wraz z końcami: x\in\left(-\infty,\
    \frac{3}{2}\right\rangle\cup\left\langle 2,\ +\infty\right).'
  answer:
    kind: SYMBOLIC
    latex: x\in\left(-\infty,\ \frac{3}{2}\right\rangle\cup\left\langle 2,\ +\infty\right)
  checks:
  - kind: solve_inequality
    expr: 2\cdot\left(x^{2}+3\right)\geq 7\cdot x
  skills:
  - przekształcanie do postaci ogólnej
  - obliczanie wyróżnika
  - suma przedziałów
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''x\\in\\left(-\\infty,\\ \\frac{3}{2}\\right\\rangle\\cup\\left\\langle
      2,\\ +\\infty\\right)'' vs ''Union(Interval(-oo, 3/2), Interval(2, oo))'' (as sets)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: nierówność kwadratowa z pierwiastkami niewymiernymi
  statement: Rozwiąż nierówność 5x-x^{2}>\left(x-1\right)\cdot\left(x+2\right) oraz wypisz wszystkie liczby
    całkowite należące do zbioru jej rozwiązań. Zapisz obliczenia.
  statement_latex: 5x-x^{2}>\left(x-1\right)\cdot\left(x+2\right)
  solution: 'Wymnażamy prawą stronę: \left(x-1\right)\cdot\left(x+2\right)=x^{2}+x-2. Nierówność przyjmuje
    postać 5x-x^{2}>x^{2}+x-2, czyli po przeniesieniu wszystkiego na lewą stronę -2x^{2}+4x+2>0. Dzielimy
    obie strony przez liczbę dodatnią 2 (kierunek się nie zmienia): -x^{2}+2x+1>0, a następnie mnożymy
    przez -1 i ODWRACAMY znak: x^{2}-2x-1<0. Teraz a=1>0, b=-2, c=-1, \Delta=\left(-2\right)^{2}-4\cdot
    1\cdot\left(-1\right)=4+4=8, \sqrt{\Delta}=2\sqrt{2}. Miejsca zerowe: x_{1}=\frac{2-2\sqrt{2}}{2}=1-\sqrt{2},
    x_{2}=\frac{2+2\sqrt{2}}{2}=1+\sqrt{2}. Ramiona w górę i znak <, więc rozwiązaniem jest przedział
    między pierwiastkami: x\in\left(1-\sqrt{2},\ 1+\sqrt{2}\right). Ponieważ 1-\sqrt{2}\approx -0{,}41
    oraz 1+\sqrt{2}\approx 2{,}41, liczbami całkowitymi należącymi do tego przedziału są 0, 1, 2.'
  solution_steps:
  - 'Wymnóż prawą stronę: \left(x-1\right)\cdot\left(x+2\right)=x^{2}+x-2.'
  - 'Przenieś wszystko na lewą stronę: -2x^{2}+4x+2>0.'
  - 'Podziel przez 2, pomnóż przez -1 i odwróć znak: x^{2}-2x-1<0.'
  - Oblicz \Delta=4+4=8 oraz \sqrt{\Delta}=2\sqrt{2}.
  - 'Wyznacz miejsca zerowe: x_{1}=1-\sqrt{2}, x_{2}=1+\sqrt{2}.'
  - 'a>0 i znak < — rozwiązaniem jest przedział między pierwiastkami: x\in\left(1-\sqrt{2},\ 1+\sqrt{2}\right).'
  - 'Oszacuj końce (\approx -0{,}41 i \approx 2{,}41) i wypisz liczby całkowite: 0, 1, 2.'
  answer:
    kind: MULTIPART
    parts:
    - name: zbior_rozwiazan
      answer:
        kind: INTERVAL
        lo: 1-\sqrt{2}
        hi: 1+\sqrt{2}
    - name: liczby_calkowite
      answer:
        kind: SET
        members:
        - '0'
        - '1'
        - '2'
  checks:
  - kind: solve_inequality
    expr: 5\cdot x-x^{2}>\left(x-1\right)\cdot\left(x+2\right)
    part: zbior_rozwiazan
  skills:
  - porządkowanie nierówności
  - obliczanie wyróżnika
  - pierwiastki niewymierne
  - wskazanie liczb całkowitych ze zbioru rozwiązań
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: rozwiązywanie nierówności kwadratowej sprowadzalnej do postaci ogólnej
  statement: Rozwiąż nierówność 2\left(x+1\right)\left(x-5\right) \geq \left(x-3\right)^{2}-4. Zapisz
    obliczenia.
  statement_latex: 2\cdot\left(x+1\right)\cdot\left(x-5\right) \geq \left(x-3\right)^{2}-4
  solution: |-
    Wykonujemy działania po obu stronach nierówności.
    Lewa strona: 2\left(x+1\right)\left(x-5\right)=2\left(x^{2}-4x-5\right)=2x^{2}-8x-10.
    Prawa strona: \left(x-3\right)^{2}-4=x^{2}-6x+9-4=x^{2}-6x+5.
    Przenosimy wszystko na lewą stronę:
    2x^{2}-8x-10-\left(x^{2}-6x+5\right)\ge 0, czyli x^{2}-2x-15\ge 0.
    Mamy a=1>0 (ramiona paraboli skierowane w górę), b=-2, c=-15.
    \Delta=\left(-2\right)^{2}-4\cdot 1\cdot\left(-15\right)=4+60=64, \sqrt{\Delta}=8.
    x_{1}=\frac{2-8}{2}=-3, \qquad x_{2}=\frac{2+8}{2}=5.
    Parabola o ramionach w górę przyjmuje wartości nieujemne na zewnątrz miejsc zerowych, a nierówność jest nieostra, więc końce należą do zbioru rozwiązań.
    Odpowiedź: x\in\left(-\infty,-3\right\rangle\cup\left\langle 5,+\infty\right).
    Sprawdzenie punktem próbnym: dla x=0 lewa strona wyjściowej nierówności to 2\cdot 1\cdot\left(-5\right)=-10, a prawa 9-4=5; nierówność -10\ge 5 jest fałszywa, a 0 istotnie nie należy do otrzymanego zbioru.
  solution_steps:
  - 'Rozwiń lewą stronę: 2\left(x+1\right)\left(x-5\right)=2x^{2}-8x-10.'
  - 'Rozwiń prawą stronę: \left(x-3\right)^{2}-4=x^{2}-6x+5.'
  - 'Przenieś wszystko na lewą stronę i zredukuj: x^{2}-2x-15\ge 0.'
  - Oblicz \Delta=64 oraz miejsca zerowe x_{1}=-3, x_{2}=5.
  - Ponieważ a>0, a nierówność jest nieostra typu \ge, wybierz przedziały na zewnątrz pierwiastków wraz
    z nimi.
  - 'Zapisz odpowiedź: x\in\left(-\infty,-3\right\rangle\cup\left\langle 5,+\infty\right).'
  answer:
    kind: SYMBOLIC
    latex: x\in\left(-\infty,-3\right\rangle\cup\left\langle 5,+\infty\right)
  checks:
  - kind: solve_inequality
    expr: 2\cdot\left(x+1\right)\cdot\left(x-5\right) \geq \left(x-3\right)^{2}-4
  skills:
  - przekształcanie nierówności do postaci ax^2+bx+c \ge 0
  - obliczanie wyróżnika i miejsc zerowych
  - zapis zbioru rozwiązań jako sumy przedziałów
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''x\\in\\left(-\\infty,-3\\right\\rangle\\cup\\left\\langle
      5,+\\infty\\right)'' vs ''Union(Interval(-oo, -3), Interval(5, oo))'' (as sets)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: nierówność kwadratowa — przypadek brzegowy \Delta=0 przy a<0
  statement: 'Rozwiąż każdą z nierówności: (a) -3x^{2}+12x-12 < 0, (b) -3x^{2}+12x-12 \geq 0. Zapisz obliczenia.'
  statement_latex: -3\cdot x^{2}+12\cdot x-12 < 0 \quad \text{oraz} \quad -3\cdot x^{2}+12\cdot x-12 \geq
    0
  solution: |-
    W obu podpunktach rozpatrujemy ten sam trójmian. Wyłączamy czynnik -3:
    -3x^{2}+12x-12=-3\left(x^{2}-4x+4\right)=-3\left(x-2\right)^{2}.
    Równoważnie: a=-3<0, b=12, c=-12, więc \Delta=12^{2}-4\cdot\left(-3\right)\cdot\left(-12\right)=144-144=0 oraz x_{0}=\frac{-12}{2\cdot\left(-3\right)}=2.
    Parabola ma ramiona skierowane w dół i jest styczna do osi OX w punkcie x_{0}=2: dla x=2 trójmian ma wartość 0, a dla każdego x\neq 2 wartości ujemne.
    (a) -3\left(x-2\right)^{2}<0 zachodzi dokładnie wtedy, gdy \left(x-2\right)^{2}>0, czyli dla każdego x różnego od 2.
    Odpowiedź (a): x\in\mathbb{R}\setminus\left\{2\right\}, czyli x\in\left(-\infty,2\right)\cup\left(2,+\infty\right).
    (b) -3\left(x-2\right)^{2}\ge 0 zachodzi dokładnie wtedy, gdy \left(x-2\right)^{2}\le 0, a kwadrat jest niedodatni tylko wtedy, gdy jest równy 0.
    Odpowiedź (b): x=2, czyli zbiorem rozwiązań jest \left\{2\right\}.
  solution_steps:
  - 'Zapisz trójmian w postaci iloczynowej: -3x^{2}+12x-12=-3\left(x-2\right)^{2} (albo policz \Delta=0
    i x_{0}=2).'
  - Stwierdź, że a=-3<0, więc parabola ma ramiona w dół i jest styczna do osi OX w punkcie x_{0}=2.
  - '(a) Wartości ujemne trójmian przyjmuje wszędzie poza punktem styczności: x\in\mathbb{R}\setminus\{2\}.'
  - '(b) Wartość nieujemna występuje tylko w punkcie styczności: zbiorem rozwiązań jest \{2\}.'
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: SYMBOLIC
        latex: x\in\mathbb{R}\setminus\left\{2\right\}
    - name: b
      answer:
        kind: SET
        members:
        - '2'
  checks:
  - kind: solve_inequality
    expr: -3\cdot x^{2}+12\cdot x-12 < 0
    part: a
  - kind: solve_inequality
    expr: -3\cdot x^{2}+12\cdot x-12 \geq 0
    part: b
  skills:
  - mnożenie nierówności przez liczbę ujemną i odwracanie znaku
  - rozpoznanie wzoru skróconego mnożenia
  - rozstrzyganie przypadku \Delta=0
  - zapis odpowiedzi w postaci \mathbb{R}\setminus\{x_0\} lub zbioru jednoelementowego
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [a] SymPy solved it fresh: ''x\\in\\mathbb{R}\\setminus\\left\\{2\\right\\}''
      vs ''Union(Interval.open(-oo, 2), Interval.open(2, oo))'' (as sets) ; [b] SymPy solved it fresh:
      ''2'' vs ''{2}'''
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: analiza błędu — „w środku” czy „na zewnątrz”
  statement: 'Uczeń rozwiązywał nierówność x^{2}-7x+10>0. Poprawnie obliczył miejsca zerowe trójmianu:
    x_{1}=2 i x_{2}=5, po czym napisał: „znak nierówności to >, więc rozwiązaniem jest przedział \left(2,\
    5\right)”. Wyjaśnij, na czym polega błąd, i podaj poprawny zbiór rozwiązań.'
  statement_latex: x^{2}-7x+10>0
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń skojarzył znak > z „przedziałem między pierwiastkami” i zapisał odpowiedź x\in\left(2,\ 5\right).

