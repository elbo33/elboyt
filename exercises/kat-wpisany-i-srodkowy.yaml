- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: trójkąt wpisany w okrąg — kąty środkowe
  statement: Trójkąt ostrokątny ABC jest wpisany w okrąg o środku O, przy czym |\angle BAC| = 38^\circ
    oraz |\angle ABC| = 72^\circ. Oblicz miary kątów ACB, BOC oraz OBC. Wyniki podaj w stopniach.
  statement_latex: '|\angle ACB| = 180^\circ - 38^\circ - 72^\circ,\qquad |\angle BOC| = 2\cdot 38^\circ,\qquad
    |\angle OBC| = \frac{180^\circ - 76^\circ}{2}'
  solution: |-
    1) Z sumy kątów trójkąta ABC:
    |\angle ACB| = 180^\circ - 38^\circ - 72^\circ = 70^\circ.

    2) Kąt środkowy BOC i kąt wpisany BAC opierają się na tym samym łuku BC (nie zawierającym punktu A), zatem
    |\angle BOC| = 2\cdot 38^\circ = 76^\circ.

    3) Trójkąt BOC jest równoramienny, bo |OB| = |OC| = r. Kąt przy wierzchołku O ma miarę 76^\circ, więc kąty przy podstawie BC są równe:
    |\angle OBC| = |\angle OCB| = \frac{180^\circ - 76^\circ}{2} = 52^\circ.

    Odpowiedź: |\angle ACB| = 70^\circ, |\angle BOC| = 76^\circ, |\angle OBC| = 52^\circ.
  solution_steps:
  - 'Oblicz trzeci kąt trójkąta: |\angle ACB| = 180^\circ - 38^\circ - 72^\circ = 70^\circ.'
  - Zauważ, że kąt środkowy BOC i kąt wpisany BAC są oparte na tym samym łuku BC.
  - Oblicz |\angle BOC| = 2\cdot 38^\circ = 76^\circ.
  - 'W równoramiennym trójkącie BOC (|OB| = |OC| = r) oblicz kąt przy podstawie: |\angle OBC| = \frac{180^\circ
    - 76^\circ}{2} = 52^\circ.'
  answer:
    kind: MULTIPART
    parts:
    - name: kat_ACB
      answer:
        kind: NUMERIC
        value: 70.0
        latex: 70^\circ
    - name: kat_BOC
      answer:
        kind: NUMERIC
        value: 76.0
        latex: 76^\circ
    - name: kat_OBC
      answer:
        kind: NUMERIC
        value: 52.0
        latex: 52^\circ
  checks:
  - kind: evaluate
    expr: 180 - 38 - 72
    part: kat_ACB
  - kind: evaluate
    expr: 2\cdot 38
    part: kat_BOC
  - kind: evaluate
    expr: \frac{180 - 2\cdot 38}{2}
    part: kat_OBC
  skills:
  - suma kątów trójkąta
  - kąt wpisany a kąt środkowy
  - trójkąt równoramienny z dwóch promieni
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [kat_ACB] SymPy solved it fresh: 70.0 vs 70.0 (tol 1e-09) ;
      [kat_BOC] SymPy solved it fresh: 76.0 vs 76.0 (tol 1e-09) ; [kat_OBC] SymPy solved it fresh: 52.0
      vs 52.0 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: kąty środkowe wokół punktu O
  statement: 'Punkty A, B oraz C leżą na okręgu o środku O, przy czym punkt O leży wewnątrz trójkąta ABC,
    a punkt B leży na łuku AC nie zawierającym... — dokładniej: półprosta BO przecina łuk AC. Kąt ABO
    ma miarę 25^\circ, a kąt OBC ma miarę 15^\circ. Oblicz miary kątów AOB, BOC, AOC oraz ACO. Wyniki
    podaj w stopniach.'
  statement_latex: '|\angle AOB| = 180^\circ - 2\cdot 25^\circ,\qquad |\angle BOC| = 180^\circ - 2\cdot
    15^\circ,\qquad |\angle AOC| = 360^\circ - \left(130^\circ + 150^\circ\right)'
  solution: |-
    Każdy z trójkątów ABO, BCO i ACO jest równoramienny, bo jego ramionami są promienie okręgu.

    1) W trójkącie ABO: |\angle ABO| = |\angle BAO| = 25^\circ, więc
    |\angle AOB| = 180^\circ - 2\cdot 25^\circ = 130^\circ.

    2) W trójkącie BCO: |\angle OBC| = |\angle OCB| = 15^\circ, więc
    |\angle BOC| = 180^\circ - 2\cdot 15^\circ = 150^\circ.

    3) Kąty AOB, BOC oraz AOC tworzą razem kąt pełny wokół punktu O (bo O leży wewnątrz trójkąta ABC), zatem
    |\angle AOC| = 360^\circ - \left(130^\circ + 150^\circ\right) = 80^\circ.

    4) Trójkąt ACO jest równoramienny z kątem 80^\circ przy wierzchołku O, więc
    |\angle ACO| = \frac{180^\circ - 80^\circ}{2} = 50^\circ.

    Kontrola: |\angle ABC| = 25^\circ + 15^\circ = 40^\circ, a kąt środkowy AOC oparty na tym samym łuku AC ma miarę 2\cdot 40^\circ = 80^\circ — zgadza się.

    Odpowiedź: |\angle AOB| = 130^\circ, |\angle BOC| = 150^\circ, |\angle AOC| = 80^\circ, |\angle ACO| = 50^\circ.
  solution_steps:
  - Zauważ, że trójkąty ABO, BCO, ACO są równoramienne (ramiona to promienie).
  - Oblicz |\angle AOB| = 180^\circ - 2\cdot 25^\circ = 130^\circ.
  - Oblicz |\angle BOC| = 180^\circ - 2\cdot 15^\circ = 150^\circ.
  - 'Z kąta pełnego wokół O: |\angle AOC| = 360^\circ - \left(130^\circ + 150^\circ\right) = 80^\circ.'
  - 'Z trójkąta równoramiennego ACO: |\angle ACO| = \frac{180^\circ - 80^\circ}{2} = 50^\circ.'
  - 'Sprawdź wynik twierdzeniem o kącie wpisanym: |\angle ABC| = 40^\circ i 2\cdot 40^\circ = 80^\circ
    = |\angle AOC|.'
  answer:
    kind: MULTIPART
    parts:
    - name: kat_AOB
      answer:
        kind: NUMERIC
        value: 130.0
        latex: 130^\circ
    - name: kat_BOC
      answer:
        kind: NUMERIC
        value: 150.0
        latex: 150^\circ
    - name: kat_AOC
      answer:
        kind: NUMERIC
        value: 80.0
        latex: 80^\circ
    - name: kat_ACO
      answer:
        kind: NUMERIC
        value: 50.0
        latex: 50^\circ
  checks:
  - kind: evaluate
    expr: 180 - 2\cdot 25
    part: kat_AOB
  - kind: evaluate
    expr: 180 - 2\cdot 15
    part: kat_BOC
  - kind: evaluate
    expr: 360 - \left(\left(180 - 2\cdot 25\right) + \left(180 - 2\cdot 15\right)\right)
    part: kat_AOC
  - kind: evaluate
    expr: \frac{180 - \left(360 - \left(\left(180 - 2\cdot 25\right) + \left(180 - 2\cdot 15\right)\right)\right)}{2}
    part: kat_ACO
  skills:
  - trójkąt równoramienny z dwóch promieni
  - suma kątów wokół punktu
  - kąt wpisany a kąt środkowy
  verification:
    checkability: DETERMINISTIC
    note: 'all 4 parts solved fresh · det: [kat_AOB] SymPy solved it fresh: 130.0 vs 130.0 (tol 1e-09)
      ; [kat_BOC] SymPy solved it fresh: 150.0 vs 150.0 (tol 1e-09) ; [kat_AOC] SymPy solved it fresh:
      80.0 vs 80.0 (tol 1e-09) ; [kat_ACO] SymPy solved it fresh: 50.0 vs 50.0 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: obliczanie kątów w czworokącie wpisanym w okrąg
  statement: Czworokąt ABCD jest wpisany w okrąg o środku O, a jego wierzchołki leżą na tym okręgu w kolejności
    A, B, C, D. Kąt środkowy AOB, oparty na łuku AB niezawierającym punktów C i D, ma miarę 70°, a kąt
    wewnętrzny BCD tego czworokąta ma miarę 95°. Oblicz miary kątów ACB, BAD, ABD oraz miarę kąta środkowego
    wypukłego AOD opartego na łuku AD niezawierającym punktów B i C.
  statement_latex: \left|\angle AOB\right| = 70^\circ, \qquad \left|\angle BCD\right| = 95^\circ, \qquad
    \left|\angle ACB\right| = \frac{1}{2}\cdot 70^\circ
  solution: |-
    Kąt wpisany ACB ma wierzchołek w C, więc opiera się na łuku AB niezawierającym C — na tym samym łuku, na którym oparty jest dany kąt środkowy 70°. Zatem |∠ACB| = ½ · 70° = 35°.

    Kąty BAD i BCD są kątami przeciwległymi czworokąta wpisanego w okrąg, więc |∠BAD| + |∠BCD| = 180°, skąd |∠BAD| = 180° − 95° = 85°.

    Kąt wpisany BCD opiera się na łuku BAD (łuku od B do D przechodzącym przez A, niezawierającym C), więc miara tego łuku wynosi 2 · 95° = 190°. Łuk ten składa się z łuku AB (70°) i łuku AD, zatem miara łuku AD (niezawierającego B i C) wynosi 190° − 70° = 120°. Kąt środkowy AOD oparty na tym łuku ma więc miarę 120° (jest to kąt wypukły).

    Kąt wpisany ABD ma wierzchołek w B, więc opiera się na łuku AD niezawierającym B, o mierze 120°. Zatem |∠ABD| = ½ · 120° = 60°.

    Kontrola: |∠ACB| = 35° i |∠ADB| powinny być powiązane z tą samą cięciwą AB; ponadto w trójkącie ABD mamy 85° + 60° + |∠ADB| = 180°, czyli |∠ADB| = 35° = |∠ACB| — zgadza się, bo C i D leżą po tej samej stronie cięciwy AB.
  solution_steps:
  - 'Kąt ACB jest wpisany i oparty na tym samym łuku AB co dany kąt środkowy 70°: |∠ACB| = ½ · 70° = 35°.'
  - 'Kąty BAD i BCD są przeciwległe w czworokącie wpisanym: |∠BAD| = 180° − 95° = 85°.'
  - Kąt wpisany BCD opiera się na łuku BAD, więc miara tego łuku to 2 · 95° = 190°.
  - 'Odejmuję łuk AB: miara łuku AD (bez B i C) wynosi 190° − 70° = 120°, czyli |∠AOD| = 120°.'
  - 'Kąt wpisany ABD opiera się na łuku AD: |∠ABD| = ½ · 120° = 60°.'
  - 'Sprawdzam sumę kątów w trójkącie ABD: 85° + 60° + 35° = 180°.'
  answer:
    kind: MULTIPART
    parts:
    - name: ACB
      answer:
        kind: NUMERIC
        value: 35.0
        latex: 35^\circ
    - name: BAD
      answer:
        kind: NUMERIC
        value: 85.0
        latex: 85^\circ
    - name: AOD
      answer:
        kind: NUMERIC
        value: 120.0
        latex: 120^\circ
    - name: ABD
      answer:
        kind: NUMERIC
        value: 60.0
        latex: 60^\circ
  checks:
  - kind: evaluate
    expr: \frac{70}{2}
    part: ACB
  - kind: evaluate
    expr: 180 - 95
    part: BAD
  - kind: evaluate
    expr: 2\cdot 95 - 70
    part: AOD
  - kind: evaluate
    expr: \frac{2\cdot 95 - 70}{2}
    part: ABD
  skills:
  - twierdzenie o kącie wpisanym i środkowym
  - czworokąt wpisany w okrąg
  - kąty wpisane oparte na tym samym łuku
  - wybór właściwego łuku
  verification:
    checkability: DETERMINISTIC
    note: 'all 4 parts solved fresh · det: [ACB] SymPy solved it fresh: 35.0 vs 35.0 (tol 1e-09) ; [BAD]
      SymPy solved it fresh: 85.0 vs 85.0 (tol 1e-09) ; [AOD] SymPy solved it fresh: 120.0 vs 120.0 (tol
      1e-09) ; [ABD] SymPy solved it fresh: 60.0 vs 60.0 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: kąt oparty na średnicy i kąty wpisane po obu stronach cięciwy
  statement: Odcinek AB jest średnicą okręgu o środku O. Punkty C i D leżą na tym okręgu po przeciwnych
    stronach prostej AB, przy czym kąt CAB ma miarę 34°, a kąt DBA ma miarę 52°. Oblicz miary kątów ACB,
    BOC, CBD oraz CAD.
  statement_latex: \left|\angle ACB\right| = 90^\circ, \qquad \left|\angle BOC\right| = 2\cdot 34^\circ,
    \qquad \left|\angle CBD\right| = \left(180^\circ - 90^\circ - 34^\circ\right) + 52^\circ
  solution: |-
    Kąt ACB jest kątem wpisanym opartym na półokręgu (na średnicy AB), więc |∠ACB| = 90°.

    Kąt środkowy BOC i kąt wpisany BAC opierają się na tym samym łuku BC (niezawierającym A), zatem |∠BOC| = 2 · 34° = 68°.

    Z sumy kątów w trójkącie ABC: |∠ABC| = 180° − 90° − 34° = 56°. Ponieważ punkty C i D leżą po przeciwnych stronach prostej AB, półprosta BA leży wewnątrz kąta CBD, więc
    |∠CBD| = |∠ABC| + |∠ABD| = 56° + 52° = 108°.

    Analogicznie kąt ADB jest oparty na średnicy AB, więc |∠ADB| = 90°, a stąd |∠BAD| = 180° − 90° − 52° = 38°. Półprosta AB leży wewnątrz kąta CAD, zatem
    |∠CAD| = |∠CAB| + |∠BAD| = 34° + 38° = 72°.

    Kontrola: czworokąt ACBD jest wpisany w okrąg, więc |∠CAD| + |∠CBD| = 72° + 108° = 180° — zgadza się.
  solution_steps:
  - AB jest średnicą, więc kąt wpisany ACB oparty na półokręgu ma miarę 90°.
  - 'Kąt środkowy BOC jest dwa razy większy od kąta wpisanego BAC opartego na łuku BC: |∠BOC| = 2 · 34°
    = 68°.'
