- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: tabela możliwości — dwie kostki
  statement: 'Rzucamy jeden raz dwiema symetrycznymi sześciennymi kostkami do gry: białą i zieloną. Wynikiem
    rzutu jest para (liczba oczek na kostce białej, liczba oczek na kostce zielonej). a) Oblicz, ile jest
    wszystkich możliwych wyników. b) Oblicz, w ilu wynikach suma oczek na obu kostkach jest równa 9. c)
    Oblicz, w ilu wynikach iloczyn oczek na obu kostkach jest liczbą nieparzystą.'
  statement_latex: N = 6 \cdot 6
  solution: |-
    a) Wynik to para uporządkowana, bo kostki są rozróżnialne — para (2,5) to inny wynik niż (5,2). Tabela ma 6 wierszy i 6 kolumn, więc N = 6 \cdot 6 = 36 wyników.

    b) Zaznaczamy w tabeli komórki o sumie 9 i wypisujemy je systematycznie, zwiększając pierwszą współrzędną:
    (3,6), (4,5), (5,4), (6,3).
    Par (1,8) i (2,7) nie ma, bo kostka ma tylko 6 ścian. Zatem takich wyników jest 4.

    c) Iloczyn dwóch liczb jest nieparzysty dokładnie wtedy, gdy obie liczby są nieparzyste. Na każdej kostce liczba nieparzysta to jeden z wyników 1, 3, 5 — po 3 możliwości.
    N = 3 \cdot 3 = 9 wyników.
    Kontrola sensowności: 9 < 36 ✓.

    Odpowiedź: a) 36, b) 4, c) 9.
  solution_steps:
  - Ustal, że jednym obiektem jest para uporządkowana wyników (kostka biała, kostka zielona).
  - 'a) Policz komórki tabeli: 6 \cdot 6 = 36.'
  - 'b) Wypisz systematycznie pary o sumie 9: (3,6), (4,5), (5,4), (6,3) — jest ich 4.'
  - c) Zauważ, że iloczyn jest nieparzysty tylko wtedy, gdy obie liczby oczek są nieparzyste.
  - 'c) Policz: 3 \cdot 3 = 9 wyników.'
  answer:
    kind: MULTIPART
    parts:
    - name: a) wszystkie wyniki
      answer:
        kind: NUMERIC
        value: 36.0
    - name: b) suma równa 9
      answer:
        kind: NUMERIC
        value: 4.0
    - name: c) iloczyn nieparzysty
      answer:
        kind: NUMERIC
        value: 9.0
  checks:
  - kind: evaluate
    expr: 6 \cdot 6
    part: a) wszystkie wyniki
  - kind: evaluate
    expr: 3 \cdot 3
    part: c) iloczyn nieparzysty
