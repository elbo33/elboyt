    Odpowiedź: reszty wynoszą odpowiednio 2 oraz 0.
  solution_steps:
  - 'Przypominamy warunek z twierdzenia o dzieleniu z resztą: 0 \le r < b.'
  - Odrzucamy „resztę” -3 (ujemna) i „resztę” 4 (nie jest mniejsza od dzielnika 4).
  - Zapisujemy -23 = 5\cdot\left(-5\right)+2, więc reszta z dzielenia -23 przez 5 wynosi 2.
  - Zapisujemy 4k+4 = 4\cdot\left(k+1\right), więc reszta z dzielenia 4k+4 przez 4 wynosi 0.
  answer:
    kind: MULTIPART
    parts:
