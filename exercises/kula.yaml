  exercise_type: obliczenie V i S kuli z danego promienia
  statement: Kula ma promień R = 4 cm. Oblicz pole powierzchni tej kuli oraz jej objętość. Wyniki podaj
    dokładnie (z liczbą \pi).
  statement_latex: R = 4\ \text{cm},\qquad S = 4\pi R^{2},\qquad V = \frac{4}{3}\pi R^{3}
  solution: |-
    Krok 1. Pole powierzchni kuli liczymy ze wzoru S = 4\pi R^{2}. Podstawiamy R = 4: S = 4\pi\cdot 4^{2} = 4\pi\cdot 16 = 64\pi\ \text{cm}^{2}.
    Krok 2. Objętość kuli liczymy ze wzoru V = \frac{4}{3}\pi R^{3}. Podstawiamy R = 4: V = \frac{4}{3}\pi\cdot 4^{3} = \frac{4}{3}\pi\cdot 64 = \frac{256}{3}\pi\ \text{cm}^{3}.
    Krok 3. Kontrola jednostek: pole w cm^{2} (przy R^{2}), objętość w cm^{3} (przy R^{3}).
    Odpowiedź: S = 64\pi\ \text{cm}^{2}, V = \frac{256}{3}\pi\ \text{cm}^{3}.
  solution_steps:
  - Zastosuj wzór S = 4\pi R^{2} dla R = 4.
  - Oblicz S = 4\pi\cdot 16 = 64\pi\ \text{cm}^{2}.
  - Zastosuj wzór V = \frac{4}{3}\pi R^{3} dla R = 4.
  - Oblicz V = \frac{4}{3}\pi\cdot 64 = \frac{256}{3}\pi\ \text{cm}^{3}.
  answer:
    kind: MULTIPART
    parts:
    - name: pole powierzchni
      answer:
        kind: SYMBOLIC
        latex: 64\pi
    - name: objętość
      answer:
        kind: SYMBOLIC
        latex: \frac{256}{3}\pi
