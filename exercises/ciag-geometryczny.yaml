  exercise_type: wyraz ciągu i suma przy ułamkowym ilorazie
  statement: Ciąg geometryczny (a_n) jest określony dla każdej liczby naturalnej n ≥ 1. Wiadomo, że a_1
    = 162 oraz q = \frac{1}{3}. Oblicz piąty wyraz tego ciągu oraz sumę pięciu początkowych jego wyrazów.
  statement_latex: a_5 = 162\cdot\left(\frac{1}{3}\right)^{4},\qquad S_5 = 162\cdot\frac{1-\left(\frac{1}{3}\right)^{5}}{1-\frac{1}{3}}
  solution: |-
    Wyraz piąty: a_5 = a_1 \cdot q^{4} = 162 \cdot \left(\frac{1}{3}\right)^{4} = \frac{162}{81} = 2.
    Suma: q = \frac{1}{3} \neq 1, więc S_5 = a_1 \cdot \frac{1-q^{5}}{1-q} = 162 \cdot \frac{1-\frac{1}{243}}{1-\frac{1}{3}} = 162 \cdot \frac{\frac{242}{243}}{\frac{2}{3}} = 162 \cdot \frac{242}{243} \cdot \frac{3}{2} = 242.
    Sprawdzenie przez wypisanie wyrazów: 162, 54, 18, 6, 2; ich suma to 162 + 54 + 18 + 6 + 2 = 242. ✓
    Odpowiedź: a_5 = 2, S_5 = 242.
  solution_steps:
  - Zapisz wzór ogólny a_n = a_1 \cdot q^{n-1} i podstaw n = 5.
  - Oblicz a_5 = 162\cdot\frac{1}{81} = 2.
  - Zauważ, że q \neq 1, i podstaw dane do wzoru S_5 = a_1\cdot\frac{1-q^{5}}{1-q}.
  - 'Uprość ułamek piętrowy: 162\cdot\frac{242}{243}\cdot\frac{3}{2} = 242.'
  - Sprawdź wynik, wypisując pięć początkowych wyrazów i dodając je.
  answer:
    kind: MULTIPART
    parts:
    - name: a_5
      answer:
        kind: NUMERIC
        value: 2.0
        latex: a_5 = 2
    - name: S_5
      answer:
        kind: NUMERIC
        value: 242.0
        latex: S_5 = 242
