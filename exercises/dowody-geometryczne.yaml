- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: rachunek kątów z uzasadnieniem
  statement: Dany jest trójkąt ABC, w którym |AB| = |AC| oraz kąt przy wierzchołku A ma miarę |∡BAC| =
    44°. a) Oblicz miarę kąta ABC. b) Zapisz założenie i tezę twierdzenia, z którego skorzystałeś, uzasadniając
    równość kątów przy podstawie BC.
  statement_latex: '|AB|=|AC|,\quad |\sphericalangle BAC| = 44^\circ,\qquad |\sphericalangle ABC| = \frac{180^\circ
    - 44^\circ}{2}'
  solution: |-
    ZAŁOŻENIE: w trójkącie ABC zachodzi |AB| = |AC| oraz |∡BAC| = 44°.

    a) Trójkąt ABC jest równoramienny o ramionach AB i AC, więc kąty przy podstawie BC są równe: |∡ABC| = |∡ACB|. Oznaczmy tę wspólną miarę przez α.
    Suma kątów w trójkącie wynosi 180°, zatem
    44° + α + α = 180°,
    2α = 136°,
    α = 68°.
    Stąd |∡ABC| = 68°.

    b) Skorzystano z twierdzenia o trójkącie równoramiennym.
    Założenie: w trójkącie ABC zachodzi |AB| = |AC|.
    Teza: |∡ABC| = |∡ACB|.
    Uwaga: samo „widać z rysunku, że kąty są równe” nie jest uzasadnieniem — powołujemy się na twierdzenie.
  solution_steps:
  - 'Zapisz założenie: |AB| = |AC|, |∡BAC| = 44°.'
  - 'Z twierdzenia o trójkącie równoramiennym: |∡ABC| = |∡ACB| = α.'
  - 'Ułóż równanie z sumy kątów trójkąta: 44° + 2α = 180°.'
  - 'Rozwiąż: α = 68°, czyli |∡ABC| = 68°.'
  - Zapisz założenie i tezę użytego twierdzenia.
  answer:
    kind: MULTIPART
    parts:
    - name: miara kąta ABC (w stopniach)
      answer:
        kind: NUMERIC
        value: 68.0
    - name: założenie i teza twierdzenia
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: 'Uczeń ma zapisać: założenie — |AB| = |AC| w trójkącie ABC; teza — |∡ABC| = |∡ACB| (twierdzenie
          o kątach przy podstawie trójkąta równoramiennego).'
  checks:
  - kind: evaluate
    expr: \frac{180-44}{2}
    part: miara kąta ABC (w stopniach)
  skills:
  - kąty w trójkącie równoramiennym
  - suma kątów w trójkącie
  - rozdzielenie założenia i tezy
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: założenie i teza twierdzenia · 1/1 other parts solved fresh'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 2
  exercise_type: twierdzenie o kącie wpisanym i środkowym
  statement: Punkty A, B i C leżą na okręgu o środku O. Kąt środkowy AOB oparty na tym łuku AB, który
    NIE zawiera punktu C, ma miarę 130°. a) Oblicz miarę kąta wpisanego ACB. b) Uzasadnij, na jakim łuku
    oparty jest kąt ACB i z jakiego twierdzenia korzystasz.
  statement_latex: '|\sphericalangle AOB| = 130^\circ,\qquad |\sphericalangle ACB| = \frac{1}{2}\cdot
    130^\circ'
  solution: |-
    ZAŁOŻENIE: A, B, C leżą na okręgu o środku O, kąt środkowy AOB oparty na łuku AB niezawierającym C ma miarę 130°.

    a) Kąt wpisany ACB ma wierzchołek C leżący na okręgu, a jego ramiona przechodzą przez A i B. Jest on oparty na tym samym łuku AB, który nie zawiera punktu C — czyli na tym samym łuku co kąt środkowy AOB.
    Z twierdzenia o kącie wpisanym i środkowym opartych na tym samym łuku: kąt wpisany jest połową kąta środkowego, więc
    |∡ACB| = 1/2 · 130° = 65°.

    b) Kąt ACB jest oparty na łuku AB niezawierającym punktu C; twierdzenie o kącie wpisanym i środkowym stosujemy tylko wtedy, gdy oba kąty są oparte na TYM SAMYM łuku. Uwaga na kierunek zależności: to kąt środkowy jest dwa razy większy od wpisanego, a nie odwrotnie.
  solution_steps:
  - 'Ustal, na jakim łuku oparty jest kąt wpisany ACB: na łuku AB niezawierającym C.'
  - Zauważ, że kąt środkowy AOB jest oparty na tym samym łuku.
  - 'Zastosuj twierdzenie: kąt wpisany = połowa kąta środkowego.'
  - 'Oblicz: |∡ACB| = 1/2 · 130° = 65°.'
  answer:
    kind: MULTIPART
    parts:
    - name: miara kąta ACB (w stopniach)
      answer:
        kind: NUMERIC
        value: 65.0
    - name: uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma wskazać, że kąt ACB jest kątem wpisanym opartym na łuku AB niezawierającym C
          — tym samym, na którym oparty jest kąt środkowy AOB — i powołać się na twierdzenie o kącie wpisanym
          i środkowym (wpisany = połowa środkowego).
  checks:
  - kind: evaluate
    expr: \frac{1}{2}\cdot 130
    part: miara kąta ACB (w stopniach)
  skills:
  - kąt wpisany i środkowy
  - wskazanie łuku, na którym oparty jest kąt
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie · 1/1 other parts solved fresh'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: czworokąt wpisany w okrąg
  statement: Czworokąt ABCD jest wpisany w okrąg, przy czym |∡DAB| = 105° oraz |∡ABC| = 82°. a) Oblicz
    miarę kąta BCD. b) Oblicz miarę kąta CDA. c) Uzasadnij, z jakiego twierdzenia korzystasz w obu obliczeniach.
  statement_latex: '|\sphericalangle BCD| = 180^\circ - 105^\circ,\qquad |\sphericalangle CDA| = 180^\circ
    - 82^\circ'
  solution: |-
    ZAŁOŻENIE: ABCD jest czworokątem wpisanym w okrąg, |∡DAB| = 105°, |∡ABC| = 82°.
    TEZA (do obliczenia): |∡BCD| i |∡CDA|.

    W czworokącie wpisanym w okrąg sumy kątów przeciwległych są równe 180°.

    a) Kąty DAB i BCD są przeciwległe, więc
    |∡BCD| = 180° − 105° = 75°.

    b) Kąty ABC i CDA są przeciwległe, więc
    |∡CDA| = 180° − 82° = 98°.

    c) Korzystamy z twierdzenia o czworokącie wpisanym w okrąg: kąty przeciwległe sumują się do 180°. Wynika ono z twierdzenia o kącie wpisanym — kąty DAB i BCD są kątami wpisanymi opartymi na dwóch dopełniających się łukach BD, a odpowiadające im kąty środkowe dają w sumie 360°.

    Sprawdzenie: 105° + 82° + 75° + 98° = 360°, czyli suma kątów czworokąta jest poprawna.
  solution_steps:
  - 'Zapisz założenie: ABCD wpisany w okrąg, |∡DAB| = 105°, |∡ABC| = 82°.'
  - 'Powołaj się na twierdzenie o czworokącie wpisanym: kąty przeciwległe sumują się do 180°.'
  - Oblicz |∡BCD| = 180° − 105° = 75°.
  - Oblicz |∡CDA| = 180° − 82° = 98°.
  - 'Sprawdź: suma wszystkich czterech kątów wynosi 360°.'
  answer:
    kind: MULTIPART
    parts:
    - name: miara kąta BCD (w stopniach)
      answer:
        kind: NUMERIC
        value: 75.0
    - name: miara kąta CDA (w stopniach)
      answer:
        kind: NUMERIC
        value: 98.0
    - name: uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma powołać się na twierdzenie o czworokącie wpisanym w okrąg (kąty przeciwległe
          sumują się do 180°) i wskazać właściwe pary kątów przeciwległych.
  checks:
  - kind: evaluate
    expr: 180-105
    part: miara kąta BCD (w stopniach)
  - kind: evaluate
    expr: 180-82
    part: miara kąta CDA (w stopniach)
  skills:
  - czworokąt wpisany w okrąg
  - rachunek kątów
  - uzasadnianie kroków
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie · 2/2 other parts solved fresh'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: dowód przez przystawanie + obliczenie
  statement: W trójkącie ABC dane są |AB| = |AC| = 10 oraz |BC| = 12. Punkt D jest środkiem boku BC. a)
    Wykaż, korzystając z cechy przystawania trójkątów, że |∡ADB| = 90°, czyli że odcinek AD jest wysokością
    trójkąta ABC. b) Oblicz długość odcinka AD.
  statement_latex: '|AB|=|AC|=10,\quad |BC|=12,\quad |BD|=|DC|=6,\qquad |AD|=\sqrt{10^{2}-6^{2}}'
  solution: |-
    ZAŁOŻENIE: |AB| = |AC| = 10, |BC| = 12, D — środek BC, czyli |BD| = |DC| = 6.
    TEZA a): |∡ADB| = 90°.

    a) Porównajmy trójkąty ABD i ACD (w odpowiedniości A↔A, B↔C, D↔D):
    1) |AB| = |AC| — z założenia;
    2) |BD| = |CD| — bo D jest środkiem boku BC;
    3) |AD| = |AD| — bok wspólny.
    Trzy pary równych boków, więc z cechy bbb trójkąty ABD i ACD są przystające.
    Z przystawania wynika równość odpowiadających kątów, w szczególności |∡ADB| = |∡ADC|.
    Kąty ADB i ADC są kątami przyległymi (punkt D leży wewnątrz odcinka BC), więc |∡ADB| + |∡ADC| = 180°.
    Stąd 2·|∡ADB| = 180°, czyli |∡ADB| = 90°. To jest teza — odcinek AD jest wysokością trójkąta ABC, co należało wykazać.

    b) Trójkąt ABD jest prostokątny (kąt przy D jest prosty), o przeciwprostokątnej AB. Z twierdzenia Pitagorasa:
    |AD|² = |AB|² − |BD|² = 10² − 6² = 100 − 36 = 64,
    |AD| = 8.
  solution_steps:
  - Zapisz założenie i tezę; zauważ, że |BD| = |DC| = 6.
  - Wskaż trójkąty ABD i ACD i ustal odpowiedniość wierzchołków.
  - Zbierz trzy pary równych boków (AB = AC, BD = CD, AD wspólny) i powołaj cechę bbb.
  - 'Z przystawania: |∡ADB| = |∡ADC|.'
  - Kąty ADB i ADC są przyległe, więc każdy ma 90° — teza części a).
  - 'W trójkącie prostokątnym ABD zastosuj twierdzenie Pitagorasa: |AD| = √(100 − 36) = 8.'
  answer:
    kind: MULTIPART
    parts:
    - name: dowód, że kąt ADB jest prosty
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma wykazać przystawanie trójkątów ABD i ACD z cechy bbb (AB = AC, BD = CD, AD wspólny),
          stąd |∡ADB| = |∡ADC|, a z przyległości tych kątów |∡ADB| = 90°.
    - name: długość odcinka AD
      answer:
        kind: NUMERIC
        value: 8.0
  checks:
  - kind: evaluate
    expr: \sqrt{10^{2}-6^{2}}
    part: długość odcinka AD
  skills:
  - cechy przystawania trójkątów (bbb)
  - trójkąt równoramienny
  - twierdzenie Pitagorasa
  - redagowanie dowodu
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: dowód, że kąt ADB jest prosty · 1/1 other parts solved fresh'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: rachunek kątów w okręgu + dowód
  statement: Punkty A, B i C leżą na okręgu o środku O, przy czym odcinek AB jest średnicą tego okręgu,
    a punkt C jest różny od A i od B. Wiadomo, że |∡CAB| = 34°. a) Oblicz miary kątów ACB oraz ABC. b)
    Wykaż, że kąt środkowy COB, oparty na łuku CB niezawierającym punktu A, spełnia równość |∡COB| = 2·|∡CAB|
    (skorzystaj z tego, że trójkąt AOC jest równoramienny).
  statement_latex: '|\sphericalangle ACB| = \frac{1}{2}\cdot 180^\circ,\qquad |\sphericalangle ABC| =
    180^\circ - 90^\circ - 34^\circ,\qquad |\sphericalangle COB| = 2\cdot|\sphericalangle CAB|'
  solution: |-
    ZAŁOŻENIE: A, B, C leżą na okręgu o środku O, AB jest średnicą, |∡CAB| = 34°.

    a) Kąt ACB jest kątem wpisanym opartym na średnicy AB, a odpowiadający mu kąt środkowy AOB jest kątem półpełnym o mierze 180°. Z twierdzenia o kącie wpisanym i środkowym:
    |∡ACB| = 1/2 · 180° = 90°.
    Z sumy kątów w trójkącie ABC:
    |∡ABC| = 180° − 90° − 34° = 56°.

    b) Dorysujmy promień OC. Ponieważ |OA| = |OC| = r (promienie tego samego okręgu), trójkąt AOC jest równoramienny, więc kąty przy podstawie AC są równe:
    |∡OAC| = |∡OCA| = |∡CAB| = 34° (punkt O leży na odcinku AB, więc kąt OAC to ten sam kąt co CAB).
    Kąt COB jest kątem zewnętrznym trójkąta AOC przy wierzchołku O (bo punkty A, O, B leżą na jednej prostej, a kąty AOC i COB są przyległe). Z twierdzenia o kącie zewnętrznym:
    |∡COB| = |∡OAC| + |∡OCA| = 34° + 34° = 2 · 34° = 2·|∡CAB|.
    Ogólnie, jeśli oznaczymy |∡CAB| = α, to |∡OAC| = |∡OCA| = α i |∡COB| = 2α, co należało wykazać.
    (Kontrola: |∡COB| = 68°, a |∡ABC| = 56° — dane te są zgodne, bo trójkąt BOC jest równoramienny: 68° + 56° + 56° = 180°.)
  solution_steps:
  - Zauważ, że kąt środkowy oparty na średnicy ma 180°, więc kąt wpisany ACB ma 90°.
  - Z sumy kątów w trójkącie ABC oblicz |∡ABC| = 180° − 90° − 34° = 56°.
  - Dorysuj promień OC i zauważ, że |OA| = |OC| = r.
  - 'Z trójkąta równoramiennego AOC: |∡OAC| = |∡OCA| = α = |∡CAB|.'
  - 'Zastosuj twierdzenie o kącie zewnętrznym trójkąta AOC przy wierzchołku O: |∡COB| = α + α = 2α.'
  - 'Sformułuj wniosek: |∡COB| = 2·|∡CAB|, co należało wykazać.'
  answer:
    kind: MULTIPART
    parts:
    - name: miara kąta ACB (w stopniach)
      answer:
        kind: NUMERIC
        value: 90.0
    - name: miara kąta ABC (w stopniach)
      answer:
        kind: NUMERIC
        value: 56.0
    - name: dowód równości kąta środkowego i podwojonego wpisanego
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma wykorzystać |OA| = |OC| = r (trójkąt AOC równoramienny), stąd |∡OAC| = |∡OCA|
          = α, a następnie twierdzenie o kącie zewnętrznym (lub kąty przyległe i sumę kątów trójkąta)
          do otrzymania |∡COB| = 2α.
  checks:
  - kind: evaluate
    expr: \frac{1}{2}\cdot 180
    part: miara kąta ACB (w stopniach)
  - kind: evaluate
    expr: 180-90-34
    part: miara kąta ABC (w stopniach)
  skills:
  - kąt oparty na średnicy
  - trójkąt równoramienny z promieni
  - twierdzenie o kącie zewnętrznym
  - redagowanie dowodu
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: dowód równości kąta środkowego i podwojonego wpisanego · 2/2 other parts
      solved fresh'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: dowód z twierdzeń o okręgu + obliczenia
  statement: Punkt P leży na zewnątrz okręgu o środku O i promieniu 5, przy czym |OP| = 13. Z punktu P
    poprowadzono dwie styczne do tego okręgu; punktami styczności są A i B. a) Wykaż, że trójkąty OAP
    i OBP są przystające, i wywnioskuj stąd, że półprosta PO jest dwusieczną kąta APB. b) Oblicz długość
    odcinka PA. c) Oblicz pole czworokąta OAPB.
  statement_latex: '|OA|=|OB|=5,\quad |OP|=13,\qquad |PA|=\sqrt{13^{2}-5^{2}},\qquad P_{OAPB}=2\cdot\frac{1}{2}\cdot
    5\cdot 12'
  solution: |-
    ZAŁOŻENIE: PA i PB są styczne do okręgu o środku O i promieniu r = 5 w punktach A i B, |OP| = 13.
    TEZA a): trójkąty OAP i OBP przystają oraz |∡APO| = |∡BPO|.

    a) Prosta PA jest styczna do okręgu w punkcie A, więc promień OA jest do niej prostopadły: |∡OAP| = 90°. Analogicznie |∡OBP| = 90°. Trójkąty OAP i OBP są zatem prostokątne o wspólnej przeciwprostokątnej OP.
    Z twierdzenia Pitagorasa w trójkącie OAP: |PA|² = |OP|² − |OA|² = 13² − 5² = 169 − 25 = 144.
    Analogicznie w trójkącie OBP: |PB|² = |OP|² − |OB|² = 144.
    Zatem |PA|² = |PB|², a ponieważ długości są dodatnie, |PA| = |PB|.
    Teraz trójkąty OAP i OBP (w odpowiedniości O↔O, A↔B, P↔P) mają:
    |OA| = |OB| = 5, |PA| = |PB|, |OP| = |OP| — bok wspólny.
    Z cechy bbb są przystające: OAP ≅ OBP.
    Z przystawania wynika równość odpowiadających kątów, w szczególności |∡APO| = |∡BPO|, czyli półprosta PO dzieli kąt APB na dwa równe kąty — jest jego dwusieczną. Co należało wykazać.

    b) Z obliczeń w punkcie a): |PA| = √144 = 12.

    c) Czworokąt OAPB składa się z dwóch przystających trójkątów prostokątnych OAP i OBP o przyprostokątnych 5 i 12:
    P = 2 · (1/2 · 5 · 12) = 60.
  solution_steps:
  - 'Z własności stycznej: OA ⊥ PA i OB ⊥ PB, więc trójkąty OAP i OBP są prostokątne.'
  - 'Z twierdzenia Pitagorasa: |PA|² = |PB|² = 13² − 5² = 144, stąd |PA| = |PB|.'
  - Wskaż trzy pary równych boków (OA = OB, PA = PB, OP wspólny) i powołaj cechę bbb.
  - Z przystawania OAP ≅ OBP wynika |∡APO| = |∡BPO|, czyli PO jest dwusieczną kąta APB.
  - Oblicz |PA| = √144 = 12.
  - 'Oblicz pole: P = 2 · (1/2 · 5 · 12) = 60.'
  answer:
    kind: MULTIPART
    parts:
    - name: dowód przystawania i własności dwusiecznej
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma użyć prostopadłości stycznej do promienia, twierdzenia Pitagorasa do uzasadnienia
          |PA| = |PB|, cechy bbb dla trójkątów OAP i OBP oraz wywnioskować |∡APO| = |∡BPO|.
    - name: długość odcinka PA
      answer:
        kind: NUMERIC
        value: 12.0
    - name: pole czworokąta OAPB
      answer:
        kind: NUMERIC
        value: 60.0
  checks:
  - kind: evaluate
    expr: \sqrt{13^{2}-5^{2}}
    part: długość odcinka PA
  - kind: evaluate
    expr: 2\cdot\frac{1}{2}\cdot 5\cdot 12
    part: pole czworokąta OAPB
  skills:
  - styczna prostopadła do promienia
  - cecha przystawania bbb
  - twierdzenie Pitagorasa
  - pole trójkąta prostokątnego
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: dowód przystawania i własności dwusiecznej · 2/2 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: dowód z twierdzeń o okręgu + rachunek kątów
  statement: |-
    Z punktu P leżącego na zewnątrz okręgu o środku O poprowadzono dwie proste styczne do tego okręgu: pierwsza z nich jest styczna do okręgu w punkcie A, druga — w punkcie B. Miara kąta APB jest równa 52^\circ.
    a) Wykaż, że trójkąt APB jest równoramienny.
    b) Oblicz miarę kąta OAB.
  statement_latex: '|\sphericalangle APB| = 52^\circ,\qquad |\sphericalangle OAB| = 90^\circ - \frac{180^\circ
    - 52^\circ}{2}'
  solution: |-
    Założenie: PA i PB są odcinkami stycznych poprowadzonych z punktu P do okręgu o środku O, A i B to punkty styczności, |∡APB| = 52°. Teza a): |PA| = |PB|. Teza b): wyznaczyć |∡OAB|.

    a) Ponieważ prosta PA jest styczna do okręgu w punkcie A, to OA ⊥ PA, czyli |∡OAP| = 90°. Analogicznie |∡OBP| = 90°. Trójkąty OAP i OBP są więc prostokątne o wspólnej przeciwprostokątnej OP.
    Z twierdzenia Pitagorasa w trójkącie OAP: |PA|^2 = |OP|^2 - |OA|^2 = |OP|^2 - r^2, a w trójkącie OBP: |PB|^2 = |OP|^2 - |OB|^2 = |OP|^2 - r^2 (bo |OA| = |OB| = r jako promienie).
    Zatem |PA|^2 = |PB|^2, a ponieważ długości odcinków są dodatnie, |PA| = |PB|. Trójkąt APB ma dwa boki równej długości, więc jest równoramienny — co należało wykazać.

    b) W trójkącie równoramiennym APB kąty przy podstawie AB są równe, a kąt między ramionami ma miarę 52°, więc
    |∡PAB| = |∡PBA| = (180° - 52°) : 2 = 64°.
    Półprosta AO leży wewnątrz kąta PAB nie jest potrzebna — wystarczy, że kąt OAP jest prosty i że kąt OAB jest jego częścią: |∡OAB| = |∡OAP| - |∡PAB| = 90° - 64° = 26°.

    Odpowiedź: |∡OAB| = 26°.
  solution_steps:
  - Zapisz założenie (dwie styczne z punktu P, |∡APB| = 52°) i obie tezy.
  - 'Z prostopadłości stycznej do promienia: |∡OAP| = |∡OBP| = 90°.'
  - Z twierdzenia Pitagorasa w trójkątach OAP i OBP otrzymaj |PA|^2 = |PB|^2 = |OP|^2 - r^2, stąd |PA|
    = |PB| — trójkąt APB jest równoramienny.
  - 'W trójkącie równoramiennym APB oblicz kąty przy podstawie: \frac{180^\circ - 52^\circ}{2} = 64^\circ.'
  - 'Odejmij ten kąt od kąta prostego OAP: |∡OAB| = 90^\circ - 64^\circ = 26^\circ.'
  answer:
