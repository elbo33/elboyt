- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: dowód wprost przez wyłączenie czynnika
  statement: Dane jest wyrażenie \(5n^{2}+15n\), gdzie \(n\) jest liczbą całkowitą. Zapisz to wyrażenie
    w postaci \(5\cdot W\left(n\right)\), podając wyrażenie \(W\left(n\right)\), a następnie wykaż, że
    dla każdej liczby całkowitej \(n\) liczba \(5n^{2}+15n\) jest podzielna przez \(5\).
  statement_latex: 5n^{2}+15n = 5\cdot W\left(n\right)
  solution: |-
    Niech n będzie dowolną liczbą całkowitą. Wyłączamy czynnik 5 przed nawias:
    5n^{2}+15n = 5\cdot\left(n^{2}+3n\right),
    zatem W\left(n\right) = n^{2}+3n.

    Liczba n jest całkowita, więc n^{2}+3n jako suma iloczynów liczb całkowitych też jest liczbą całkowitą. Wyrażenie 5n^{2}+15n jest więc iloczynem liczby 5 i liczby całkowitej, a to zgodnie z definicją podzielności oznacza, że 5 \mid \left(5n^{2}+15n\right). To należało wykazać.
  solution_steps:
  - Niech n będzie dowolną liczbą całkowitą.
  - 'Wyłączamy wspólny czynnik: 5n^{2}+15n = 5\cdot\left(n^{2}+3n\right), czyli W\left(n\right)=n^{2}+3n.'
  - Zauważamy, że n^{2}+3n jest liczbą całkowitą (suma i iloczyn liczb całkowitych).
  - 'Wniosek: 5n^{2}+15n jest iloczynem liczby 5 i liczby całkowitej, więc jest podzielne przez 5.'
  answer:
    kind: MULTIPART
    parts:
    - name: wyrażenie W(n)
      answer:
        kind: SYMBOLIC
        latex: n^{2}+3n
    - name: dowód podzielności przez 5
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy zapisać 5n^{2}+15n = 5\cdot\left(n^{2}+3n\right), stwierdzić, że n^{2}+3n jest
          liczbą całkowitą, i powołać się na definicję podzielności.
  checks:
  - kind: simplify
    expr: \frac{5n^{2}+15n}{5}
    var: n
    part: wyrażenie W(n)
  skills:
  - wyłączanie czynnika przed nawias
  - definicja podzielności
  - zapisanie wniosku
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: dowód podzielności przez 5 · 1/1 other parts solved fresh'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: wyznaczanie reszty z uzasadnieniem
  statement: Wyznacz resztę z dzielenia liczby \(4n^{2}+8n+11\) przez \(4\) dla dowolnej liczby całkowitej
    \(n\) oraz uzasadnij, że reszta ta nie zależy od \(n\).
  statement_latex: 4n^{2}+8n+11 = 4\cdot\left(n^{2}+2n+2\right)+3
  solution: |-
    Niech n będzie dowolną liczbą całkowitą. Przekształcamy wyrażenie tak, aby wyodrębnić wielokrotność liczby 4:
    4n^{2}+8n+11 = 4n^{2}+8n+8+3 = 4\cdot\left(n^{2}+2n+2\right)+3.

    Liczba n^{2}+2n+2 jest całkowita, więc 4\cdot\left(n^{2}+2n+2\right) jest wielokrotnością liczby 4. Ponadto 0 \le 3 < 4, więc z twierdzenia o dzieleniu z resztą reszta z dzielenia liczby 4n^{2}+8n+11 przez 4 jest równa 3 — niezależnie od wyboru liczby całkowitej n. To należało wykazać.
  solution_steps:
  - Niech n będzie dowolną liczbą całkowitą.
  - 'Rozbijamy wyraz wolny: 11 = 8 + 3, więc 4n^{2}+8n+11 = 4n^{2}+8n+8+3.'
  - 'Wyłączamy czynnik 4: 4n^{2}+8n+8+3 = 4\cdot\left(n^{2}+2n+2\right)+3.'
  - Stwierdzamy, że n^{2}+2n+2 jest liczbą całkowitą oraz 0 \le 3 < 4.
  - 'Wniosek: reszta z dzielenia przez 4 jest równa 3 dla każdej liczby całkowitej n.'
  answer:
    kind: MULTIPART
    parts:
    - name: reszta
      answer:
        kind: NUMERIC
        value: 3.0
    - name: uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy przekształcić wyrażenie do postaci 4\cdot\left(n^{2}+2n+2\right)+3, uzasadnić całkowitość
          czynnika w nawiasie i sprawdzić warunek 0 \le 3 < 4.
  checks:
  - kind: evaluate
    expr: 4n^{2}+8n+11 - 4\cdot\left(n^{2}+2n+2\right)
    var: n
    part: reszta
  skills:
  - przekształcanie wyrażenia do postaci d\cdot(\ldots)+r
  - warunek 0 \le r < d
  - zapisanie wniosku
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie · 1/1 other parts solved fresh'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: dowód podzielności dla liczby nieparzystej
  statement: Wykaż, że dla każdej nieparzystej liczby całkowitej \(n\) liczba \(5n^{2}+6n+9\) jest podzielna
    przez \(4\). Zapisz ponadto iloraz \(\frac{5n^{2}+6n+9}{4}\) jako wyrażenie zmiennej \(l\), przyjmując
    \(n=2l+1\).
  statement_latex: 5n^{2}+6n+9,\qquad n = 2l+1,\ l\in\mathbb{Z}
  solution: |-
    Niech n będzie dowolną nieparzystą liczbą całkowitą. Wtedy istnieje liczba całkowita l taka, że n = 2l+1.

    Podstawiamy i wykonujemy działania:
    5\left(2l+1\right)^{2}+6\left(2l+1\right)+9 = 5\cdot\left(4l^{2}+4l+1\right)+12l+6+9 = 20l^{2}+20l+5+12l+15 = 20l^{2}+32l+20.

    Wyłączamy czynnik 4:
    20l^{2}+32l+20 = 4\cdot\left(5l^{2}+8l+5\right).

    Liczba l jest całkowita, więc 5l^{2}+8l+5 jest liczbą całkowitą. Zatem 5n^{2}+6n+9 jest iloczynem liczby 4 i liczby całkowitej, czyli jest podzielne przez 4. To należało wykazać.

    Iloraz wynosi \frac{5n^{2}+6n+9}{4} = 5l^{2}+8l+5.

    Sprawdzenie (kontrolne, nie zastępuje dowodu): dla n=3, czyli l=1, mamy 45+18+9 = 72 = 4\cdot 18 oraz 5+8+5 = 18.
  solution_steps:
  - 'Zapisujemy założenie wzorem: n = 2l+1, gdzie l \in \mathbb{Z}.'
  - 'Podstawiamy: 5\left(2l+1\right)^{2}+6\left(2l+1\right)+9 = 20l^{2}+20l+5+12l+15.'
  - 'Redukujemy wyrazy podobne: 20l^{2}+32l+20.'
  - 'Wyłączamy czynnik 4: 20l^{2}+32l+20 = 4\cdot\left(5l^{2}+8l+5\right), czyli iloraz to 5l^{2}+8l+5.'
  - 'Stwierdzamy całkowitość wyrażenia 5l^{2}+8l+5 i zapisujemy wniosek: 4 \mid \left(5n^{2}+6n+9\right).'
  answer:
    kind: MULTIPART
    parts:
    - name: iloraz
      answer:
        kind: SYMBOLIC
        latex: 5l^{2}+8l+5
    - name: dowód
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy przyjąć n=2l+1 (l całkowite), przekształcić wyrażenie do postaci 4\cdot\left(5l^{2}+8l+5\right)
          i uzasadnić, że czynnik w nawiasie jest liczbą całkowitą.
  checks:
  - kind: simplify
    expr: \frac{5\cdot\left(2l+1\right)^{2}+6\cdot\left(2l+1\right)+9}{4}
    var: l
    part: iloraz
  skills:
  - zapis liczby nieparzystej 2l+1
  - przekształcenia algebraiczne
  - definicja podzielności
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: dowód · 1/1 other parts solved fresh'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: dowód podzielności przez liczbę złożoną
  statement: Wykaż, że dla każdej liczby całkowitej \(n\) liczba \(n^{3}+11n\) jest podzielna przez \(6\).
    Oblicz ponadto iloraz \(\frac{n^{3}+11n}{6}\) dla \(n=7\).
  statement_latex: n^{3}+11n = \left(n-1\right)\cdot n\cdot\left(n+1\right)+12n
  solution: |-
    Niech n będzie dowolną liczbą całkowitą. Zapisujemy
    n^{3}+11n = \left(n^{3}-n\right)+12n = n\cdot\left(n^{2}-1\right)+12n = \left(n-1\right)\cdot n\cdot\left(n+1\right)+12n.

    Składnik 12n jest podzielny przez 6, bo 12n = 6\cdot 2n, a 2n jest liczbą całkowitą.

    Składnik \left(n-1\right)\cdot n\cdot\left(n+1\right) jest iloczynem trzech kolejnych liczb całkowitych. Ponieważ 6 = 2\cdot 3 oraz NWD(2,3)=1, wystarczy pokazać jego podzielność przez 2 i przez 3.
    • Podzielność przez 2: wśród dwóch kolejnych liczb n i n+1 dokładnie jedna jest parzysta, więc iloczyn jest podzielny przez 2.
    • Podzielność przez 3: z twierdzenia o dzieleniu z resztą n = 3k lub n = 3k+1, lub n = 3k+2. Gdy n = 3k, czynnik n dzieli się przez 3; gdy n = 3k+1, to n-1 = 3k; gdy n = 3k+2, to n+1 = 3\left(k+1\right). Innych przypadków nie ma, więc iloczyn zawsze dzieli się przez 3.
    Zatem \left(n-1\right)n\left(n+1\right) dzieli się przez 6.

    Suma dwóch liczb podzielnych przez 6 jest podzielna przez 6, więc 6 \mid \left(n^{3}+11n\right). To należało wykazać.

    Dla n = 7: 7^{3}+11\cdot 7 = 343+77 = 420 oraz \frac{420}{6} = 70.
  solution_steps:
  - Niech n będzie dowolną liczbą całkowitą; zapisujemy n^{3}+11n = \left(n^{3}-n\right)+12n.
  - Rozkładamy n^{3}-n = \left(n-1\right)\cdot n\cdot\left(n+1\right) — iloczyn trzech kolejnych liczb
    całkowitych.
  - Uzasadniamy podzielność tego iloczynu przez 2 (jedna z liczb n, n+1 jest parzysta) i przez 3 (rozpatrujemy
    n=3k, 3k+1, 3k+2); z NWD(2,3)=1 wynika podzielność przez 6.
  - Zauważamy, że 12n = 6\cdot 2n jest podzielne przez 6.
  - Suma liczb podzielnych przez 6 jest podzielna przez 6, więc 6 \mid \left(n^{3}+11n\right).
  - Obliczamy \frac{7^{3}+11\cdot 7}{6} = \frac{420}{6} = 70.
  answer:
    kind: MULTIPART
    parts:
    - name: dowód podzielności przez 6
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy rozłożyć n^{3}+11n = \left(n-1\right)n\left(n+1\right)+12n, uzasadnić podzielność
          iloczynu trzech kolejnych liczb przez 2 i przez 3 (wszystkie trzy przypadki reszt) oraz powołać
          się na NWD(2,3)=1 i na własność sumy liczb podzielnych przez 6.
    - name: iloraz dla n=7
      answer:
        kind: NUMERIC
        value: 70.0
  checks:
  - kind: evaluate
    expr: \frac{7^{3}+11\cdot 7}{6}
    var: n
    part: iloraz dla n=7
  skills:
  - rozkład n^{3}-n=(n-1)n(n+1)
  - iloczyn kolejnych liczb całkowitych
  - podzielność przez 6 przez rozbicie 6=2\cdot 3
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: dowód podzielności przez 6 · 1/1 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: dowód podzielności z wnioskiem liczbowym
  statement: |-
    Dana jest liczba \left(2\cdot n+5\right)^{2}-\left(2\cdot n-1\right)^{2}, gdzie n jest liczbą całkowitą.
    a) Wykaż, że dla każdej liczby całkowitej n liczba ta jest podzielna przez 24.
    b) Oblicz wartość tej liczby dla n=10.
    c) Wyznacz wszystkie liczby całkowite n, dla których liczba ta jest podzielna przez 48.
  statement_latex: \left(2\cdot n+5\right)^{2}-\left(2\cdot n-1\right)^{2}
  solution: |-
    a) Niech n będzie dowolną liczbą całkowitą. Korzystamy ze wzoru na różnicę kwadratów a^{2}-b^{2}=\left(a-b\right)\left(a+b\right), przyjmując a=2\cdot n+5 oraz b=2\cdot n-1:
    \left(2\cdot n+5\right)^{2}-\left(2\cdot n-1\right)^{2}=\left[\left(2\cdot n+5\right)-\left(2\cdot n-1\right)\right]\cdot\left[\left(2\cdot n+5\right)+\left(2\cdot n-1\right)\right]=6\cdot\left(4\cdot n+4\right)=24\cdot\left(n+1\right).
    Liczba n+1 jest liczbą całkowitą (suma liczb całkowitych), więc badana liczba jest iloczynem liczby 24 i liczby całkowitej. Zgodnie z definicją podzielności jest ona podzielna przez 24. To należało wykazać.

    b) Dla n=10 otrzymujemy \left(2\cdot 10+5\right)^{2}-\left(2\cdot 10-1\right)^{2}=25^{2}-19^{2}=625-361=264 (zgodnie ze wzorem 24\cdot\left(10+1\right)=264).

    c) Badana liczba równa się 24\cdot\left(n+1\right). Jest ona podzielna przez 48=24\cdot 2 dokładnie wtedy, gdy 24\cdot\left(n+1\right)=48\cdot m dla pewnej całkowitej m, czyli gdy n+1=2\cdot m, a więc gdy n+1 jest liczbą parzystą. To zachodzi dokładnie wtedy, gdy n jest liczbą nieparzystą, tzn. n=2\cdot m+1, gdzie m jest liczbą całkowitą.
  solution_steps:
  - 'Zapisz założenie: n jest dowolną liczbą całkowitą.'
  - Zastosuj wzór na różnicę kwadratów do wyrażenia \left(2\cdot n+5\right)^{2}-\left(2\cdot n-1\right)^{2}.
  - 'Uprość czynniki: 6\cdot\left(4\cdot n+4\right)=24\cdot\left(n+1\right).'
  - Zauważ, że n+1 jest liczbą całkowitą, i sformułuj wniosek o podzielności przez 24.
  - 'Podstaw n=10: 24\cdot 11=264.'
  - 'Rozwiąż warunek 48\mid 24\cdot\left(n+1\right): n+1 musi być parzyste, czyli n jest nieparzyste,
    n=2\cdot m+1.'
  answer:
    kind: MULTIPART
    parts:
    - name: dowod_24
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy przekształcić \left(2n+5\right)^{2}-\left(2n-1\right)^{2} do postaci 24\cdot\left(n+1\right),
          stwierdzić, że n+1 jest liczbą całkowitą, i powołać się na definicję podzielności.
    - name: wartosc_dla_n_10
      answer:
        kind: NUMERIC
        value: 264.0
    - name: n_podzielne_przez_48
      answer:
        kind: SYMBOLIC
        latex: n=2\cdot m+1,\ m\in\mathbb{Z}
  checks:
  - kind: evaluate
    expr: \left(2\cdot 10+5\right)^{2}-\left(2\cdot 10-1\right)^{2}
    var: n
    part: wartosc_dla_n_10
  skills:
  - wzory skróconego mnożenia w dowodzie
  - wyłączanie czynnika przed nawias
  - definicja podzielności
  - analiza podzielności przez liczbę złożoną
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: dowod_24 · 1/2 other parts solved fresh'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: zapis dziesiętny — dowód i analiza podzielności
  statement: |-
    Liczba trzycyfrowa N ma cyfrę setek a, cyfrę dziesiątek b oraz cyfrę jedności c, przy czym c\ge 1 oraz a>c. Przez M oznaczamy liczbę trzycyfrową zapisaną tymi samymi cyframi w odwrotnej kolejności, tzn. o cyfrze setek c, cyfrze dziesiątek b i cyfrze jedności a.
    a) Wykaż, że różnica N-M jest podzielna przez 99.
    b) Oblicz różnicę N-M dla N=742.
    c) Wyznacz wszystkie możliwe wartości różnicy a-c, dla których liczba N-M jest podzielna przez 198.
  statement_latex: N-M=\left(100\cdot a+10\cdot b+c\right)-\left(100\cdot c+10\cdot b+a\right)
  solution: |-
    a) Zapisujemy obie liczby wzorami: N=100\cdot a+10\cdot b+c oraz M=100\cdot c+10\cdot b+a, gdzie a,c\in\{1,2,\ldots,9\}, b\in\{0,1,\ldots,9\}. Wtedy
    N-M=\left(100\cdot a+10\cdot b+c\right)-\left(100\cdot c+10\cdot b+a\right)=99\cdot a-99\cdot c=99\cdot\left(a-c\right).
