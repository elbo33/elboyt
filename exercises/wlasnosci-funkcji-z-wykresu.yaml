- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: odtworzenie łamanej z warunków i pełny odczyt własności
  statement: |-
    Funkcja f jest określona w przedziale ⟨-5, 7⟩, a jej wykresem jest łamana o kolejnych wierzchołkach A(-5, a), B(-2, 4), C(1, 4), D(p, -2), E(7, e), przy czym 1 < p < 7, a oba końce wykresu (punkty A i E) należą do wykresu. Wiadomo ponadto, że:
    – liczba -4 jest miejscem zerowym funkcji f,
    – liczba 3 jest miejscem zerowym funkcji f,
    – największa wartość funkcji f w przedziale ⟨p, 7⟩ jest równa 4.
    a) Wyznacz liczby a, p oraz e.
    b) Zapisz zbiór wszystkich rozwiązań nierówności f(x) ≥ 2.
    c) Podaj wartość największą i wartość najmniejszą funkcji f w przedziale ⟨-3, 5⟩ oraz wszystkie argumenty, dla których te wartości są przyjmowane.
  statement_latex: A\left(-5,\ a\right),\ B\left(-2,\ 4\right),\ C\left(1,\ 4\right),\ D\left(p,\ -2\right),\
    E\left(7,\ e\right),\qquad f(-4) = 0,\ f(3) = 0,\ \max_{x \in \langle p,\ 7 \rangle} f(x) = 4
  solution: |-
    a) Miejsce zerowe -4 leży między -5 a -2, więc pochodzi z odcinka AB. Współczynnik kierunkowy tego odcinka to (4 - a)/(-2 - (-5)) = (4 - a)/3, zatem na odcinku AB mamy y = a + ((4 - a)/3)·(x + 5). Warunek f(-4) = 0 daje a + (4 - a)/3 = 0, czyli 3a + 4 - a = 0, stąd a = -2. Wtedy odcinek AB ma równanie y = -2 + 2(x + 5) = 2x + 8 (rzeczywiście 2·(-4) + 8 = 0).
    Odcinek BC jest poziomy: y = 4 dla x ∈ ⟨-2, 1⟩, więc miejsce zerowe 3 musi leżeć na odcinku CD. Odcinek CD łączy (1, 4) i (p, -2), więc y = 4 - (6/(p - 1))·(x - 1). Warunek f(3) = 0 daje 4 - (6·(3 - 1))/(p - 1) = 0, czyli 4(p - 1) = 12, stąd p = 4. Odcinek CD ma zatem równanie y = -2x + 6.
    Na odcinku DE funkcja zmienia się monotonicznie od f(4) = -2 do f(7) = e, więc największa wartość w ⟨4, 7⟩ to większa z liczb -2 i e. Z warunku, że jest ona równa 4, otrzymujemy e = 4. Odcinek DE ma równanie y = -2 + 2(x - 4) = 2x - 10.

    b) Rozwiązujemy f(x) ≥ 2 na każdym odcinku:
    AB (x ∈ ⟨-5, -2⟩): 2x + 8 ≥ 2 ⟺ x ≥ -3, czyli ⟨-3, -2⟩;
    BC (x ∈ ⟨-2, 1⟩): wartość 4 ≥ 2 — cały przedział ⟨-2, 1⟩;
    CD (x ∈ ⟨1, 4⟩): -2x + 6 ≥ 2 ⟺ x ≤ 2, czyli ⟨1, 2⟩;
    DE (x ∈ ⟨4, 7⟩): 2x - 10 ≥ 2 ⟺ x ≥ 6, czyli ⟨6, 7⟩.
    Łącząc: x ∈ ⟨-3, 2⟩ ∪ ⟨6, 7⟩.

    c) W przedziale ⟨-3, 5⟩ kandydaci to: f(-3) = 2·(-3) + 8 = 2, poziom 4 na odcinku BC (dla x ∈ ⟨-2, 1⟩), f(4) = -2 (wierzchołek D) oraz f(5) = 2·5 - 10 = 0.
    Wartość największa wynosi 4 i jest przyjmowana dla każdego x ∈ ⟨-2, 1⟩.
    Wartość najmniejsza wynosi -2 i jest przyjmowana tylko dla x = 4 (z równania -2x + 6 = -2 otrzymujemy x = 4).
  solution_steps:
  - Zauważ, że miejsce zerowe -4 pochodzi z odcinka AB i zapisz równanie tego odcinka z parametrem a.
  - 'Z warunku f(-4) = 0 wyznacz a = -2; odcinek AB: y = 2x + 8.'
  - 'Zauważ, że miejsce zerowe 3 pochodzi z odcinka CD (bo BC jest poziomy na poziomie 4) i z warunku
    f(3) = 0 wyznacz p = 4; odcinek CD: y = -2x + 6.'
  - 'Z warunku o największej wartości 4 w ⟨4, 7⟩ wyznacz e = 4; odcinek DE: y = 2x - 10.'
  - 'Rozwiąż nierówność f(x) ≥ 2 osobno na każdym z czterech odcinków i zsumuj: ⟨-3, 2⟩ ∪ ⟨6, 7⟩.'
  - 'W przedziale ⟨-3, 5⟩ porównaj kandydatów: f(-3) = 2, poziom 4 na ⟨-2, 1⟩, f(4) = -2, f(5) = 0.'
  - 'Zapisz: wartość największa 4 dla każdego x ∈ ⟨-2, 1⟩; wartość najmniejsza -2 dla x = 4.'
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: NUMERIC
        value: -2.0
    - name: p
      answer:
        kind: NUMERIC
        value: 4.0
    - name: e
      answer:
        kind: NUMERIC
        value: 4.0
    - name: rozwiazanie_nierownosci
      answer:
        kind: SYMBOLIC
        latex: \langle -3,\ 2 \rangle \cup \langle 6,\ 7 \rangle
    - name: wartosc_najwieksza
