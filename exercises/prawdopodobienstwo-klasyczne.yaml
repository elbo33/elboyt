- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: obliczanie prawdopodobieństwa (losowanie bez zwracania, zdarzenie przeciwne)
  statement: 'W urnie znajduje się 12 kul: 4 kule białe, 3 kule zielone i 5 kul czerwonych. Losujemy jednocześnie
    dwie kule. Oblicz prawdopodobieństwo zdarzenia A polegającego na tym, że co najmniej jedna z wylosowanych
    kul jest czerwona, oraz prawdopodobieństwo zdarzenia B polegającego na tym, że obie wylosowane kule
    są tego samego koloru. Zapisz obliczenia.'
  statement_latex: \left|\Omega\right|=\frac{12\cdot 11}{2}=66,\qquad P\left(A\right)=1-\frac{\frac{7\cdot
    6}{2}}{\frac{12\cdot 11}{2}},\qquad P\left(B\right)=\frac{\frac{4\cdot 3}{2}+\frac{3\cdot 2}{2}+\frac{5\cdot
    4}{2}}{\frac{12\cdot 11}{2}}
  solution: |-
    Losujemy jednocześnie dwie kule, więc kolejność jest nieistotna: zdarzeniem elementarnym jest dwuelementowy podzbiór zbioru 12 kul. Stąd \left|\Omega\right|=\frac{12\cdot 11}{2}=66 i wszystkie takie pary są jednakowo prawdopodobne.

    Zdarzenie A: co najmniej jedna kula czerwona. Wygodniej policzyć zdarzenie przeciwne A': żadna z wylosowanych kul nie jest czerwona, czyli obie pochodzą spośród 4+3=7 kul niecerwonych. Zatem \left|A'\right|=\frac{7\cdot 6}{2}=21 oraz P\left(A'\right)=\frac{21}{66}=\frac{7}{22}. Stąd P\left(A\right)=1-\frac{7}{22}=\frac{15}{22}.

    Zdarzenie B: obie kule tego samego koloru. Liczymy w tym samym modelu (bez kolejności): obie białe — \frac{4\cdot 3}{2}=6 par, obie zielone — \frac{3\cdot 2}{2}=3 pary, obie czerwone — \frac{5\cdot 4}{2}=10 par. Te przypadki wykluczają się, więc \left|B\right|=6+3+10=19 i P\left(B\right)=\frac{19}{66}.

    Kontrola: obie wartości należą do przedziału \left[0,1\right].
  solution_steps:
  - 'Losowanie jednoczesne — model bez kolejności: \left|\Omega\right|=\frac{12\cdot 11}{2}=66.'
  - 'Zdarzenie przeciwne A'': obie kule spośród 7 kul niecerwonych, \left|A''\right|=\frac{7\cdot 6}{2}=21.'
  - P\left(A\right)=1-\frac{21}{66}=\frac{15}{22}.
  - 'Zdarzenie B: \left|B\right|=\frac{4\cdot 3}{2}+\frac{3\cdot 2}{2}+\frac{5\cdot 4}{2}=6+3+10=19.'
  - P\left(B\right)=\frac{19}{66}.
