- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: obliczanie prawdopodobieństwa (dwa rzuty kostką, podzielność i zdarzenie przeciwne)
  statement: Rzucamy dwukrotnie symetryczną sześcienną kostką do gry, która na każdej ściance ma inną
    liczbę oczek — od jednego oczka do sześciu oczek. Oblicz prawdopodobieństwo zdarzenia A polegającego
    na tym, że iloczyn liczb wyrzuconych oczek jest podzielny przez 6, oraz prawdopodobieństwo zdarzenia
    B polegającego na tym, że co najmniej w jednym rzucie wypadło 5 oczek. Zapisz obliczenia.
  statement_latex: \left|\Omega\right|=6\cdot 6=36,\qquad P\left(A\right)=\frac{1+2+3+2+1+6}{6\cdot 6},\qquad
    P\left(B\right)=1-\frac{5\cdot 5}{6\cdot 6}
  solution: |-
    Wynik doświadczenia zapisujemy jako parę uporządkowaną \left(a,b\right), gdzie a to liczba oczek w pierwszym rzucie, b — w drugim. Wszystkie takie pary są jednakowo prawdopodobne, więc \left|\Omega\right|=6\cdot 6=36.

    Zdarzenie A: 6\mid a\cdot b. Przeglądamy wiersze tabeli 6\times 6:
    dla a=1 sprzyja tylko b=6 — 1 para;
    dla a=2: b\in\left\{3,6\right\} — 2 pary;
    dla a=3: b\in\left\{2,4,6\right\} — 3 pary;
    dla a=4: b\in\left\{3,6\right\} — 2 pary;
    dla a=5: b=6 — 1 para;
    dla a=6: dowolne b — 6 par.
    Zatem \left|A\right|=1+2+3+2+1+6=15 oraz P\left(A\right)=\frac{15}{36}=\frac{5}{12}.

    Zdarzenie B: co najmniej raz wypadło 5 oczek. Zdarzenie przeciwne B' to: ani razu nie wypadło 5 oczek, czyli w każdym rzucie jeden z pięciu pozostałych wyników: \left|B'\right|=5\cdot 5=25, więc P\left(B'\right)=\frac{25}{36}. Stąd P\left(B\right)=1-\frac{25}{36}=\frac{11}{36}.

    Kontrola: \frac{5}{12}\in\left[0,1\right] i \frac{11}{36}\in\left[0,1\right].
  solution_steps:
  - 'Przyjmujemy Ω jako zbiór par uporządkowanych: \left|\Omega\right|=6\cdot 6=36.'
  - 'Zliczamy pary o iloczynie podzielnym przez 6 wierszami: 1+2+3+2+1+6=15.'
  - P\left(A\right)=\frac{15}{36}=\frac{5}{12}.
  - 'Formułujemy zdarzenie przeciwne do B: ani razu 5 oczek, \left|B''\right|=5\cdot 5=25.'
  - P\left(B\right)=1-\frac{25}{36}=\frac{11}{36}.
  answer:
    kind: MULTIPART
    parts:
    - name: P_A
      answer:
        kind: SYMBOLIC
        latex: \frac{5}{12}
    - name: P_B
      answer:
        kind: SYMBOLIC
        latex: \frac{11}{36}
  checks:
  - kind: evaluate
    expr: \frac{1+2+3+2+1+6}{6\cdot 6}
