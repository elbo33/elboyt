- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: prostokąt wpisany w trójkąt — wzór, dziedzina, wartość największa i sprawdzenie osiągalności
  statement: |-
    Dany jest trójkąt ABC, w którym |AB| = 12 cm, a wysokość CH poprowadzona z wierzchołka C na bok AB ma długość 8 cm (punkt H leży na boku AB). W trójkąt ten wpisano prostokąt DEFG w taki sposób, że bok DE zawiera się w boku AB, wierzchołek F leży na boku BC, a wierzchołek G leży na boku AC (bok GF jest równoległy do AB). Przyjmij, że |DG| = x, gdzie x oznacza wyrażoną w centymetrach wysokość tego prostokąta.
    a) Wyznacz wzór na pole P prostokąta DEFG jako funkcję zmiennej x i podaj dziedzinę tej funkcji.
    b) Oblicz, dla jakiej wartości x pole prostokąta DEFG jest największe, i oblicz to największe pole.
    c) Rozstrzygnij, czy w trójkąt ABC można wpisać w opisany sposób prostokąt o polu 25 cm².
  statement_latex: '|GF|=12\cdot\frac{8-x}{8},\qquad P\left(x\right)=x\cdot\left(12-\frac{3}{2}\cdot x\right)=12x-\frac{3}{2}x^{2}'
  solution: |-
    a) Ponieważ GF ∥ AB, trójkąt CGF jest podobny do trójkąta CAB: kąt przy wierzchołku C jest wspólny, a kąty CGF i CAB są odpowiadające (cecha kkk).
    Wysokość trójkąta CGF poprowadzona z wierzchołka C jest równa 8 − x (od całej wysokości 8 odejmujemy wysokość prostokąta x). Odpowiadające sobie wysokości i boki są w tej samej skali, więc
    \frac{|GF|}{12}=\frac{8-x}{8}, skąd |GF| = 12\cdot\frac{8-x}{8} = 12-\frac{3}{2}x.
    Pole prostokąta:
    P\left(x\right)=|DG|\cdot|GF| = x\cdot\left(12-\frac{3}{2}x\right) = 12x-\frac{3}{2}x^{2}.
    Dziedzina: musi być x > 0 oraz |GF| > 0, czyli 12-\frac{3}{2}x>0, a więc x < 8. Zatem x ∈ (0, 8).
    b) Funkcja P jest kwadratowa, a współczynnik przy x² jest ujemny \left(-\frac{3}{2}\right), więc największą wartość przyjmuje w wierzchołku:
    x_{w}=\frac{-12}{2\cdot\left(-\frac{3}{2}\right)}=4.
    Liczba 4 należy do dziedziny (0, 8), więc
    P_{max}=P\left(4\right)=4\cdot\left(12-\frac{3}{2}\cdot 4\right)=4\cdot 6=24.
    Największe pole prostokąta wynosi 24 cm² i jest osiągane dla x = 4 cm (wtedy |GF| = 6 cm).
    c) Największe możliwe pole takiego prostokąta to 24 cm², a 25 > 24, więc prostokąta o polu 25 cm² wpisać w ten trójkąt w opisany sposób NIE można.
  solution_steps:
  - Zauważ, że GF ∥ AB, i uzasadnij podobieństwo △CGF ∼ △CAB (wspólny kąt C i kąty odpowiadające, cecha
    kkk).
  - Wysokość trójkąta CGF wynosi 8 − x, więc ze skali podobieństwa |GF| = 12·(8 − x)/8 = 12 − (3/2)x.
  - 'Zapisz pole prostokąta: P(x) = x·(12 − (3/2)x) = 12x − (3/2)x².'
  - Wyznacz dziedzinę z warunków x > 0 i 12 − (3/2)x > 0, czyli x ∈ (0, 8).
  - 'Współczynnik przy x² jest ujemny, więc największa wartość jest w wierzchołku: x_w = −12 / (2·(−3/2))
    = 4 ∈ (0, 8).'
  - Oblicz P(4) = 4·6 = 24, czyli największe pole to 24 cm².
  - 'Porównaj z 25 cm²: 25 > 24, więc takiego prostokąta wpisać nie można.'
