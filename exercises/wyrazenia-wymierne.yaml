  statement: 'Uczeń upraszczał wyrażenie \frac{x^{2}+6\cdot x}{x^{2}+2\cdot x} (dla x\neq 0 i x\neq -2)
    i zapisał: „skreślam x^{2} w liczniku i w mianowniku, zostaje \frac{6\cdot x}{2\cdot x}=3”. Wyjaśnij,
    na czym polega błąd, i podaj poprawną najprostszą postać tego wyrażenia.'
  statement_latex: \frac{x^{2}+6\cdot x}{x^{2}+2\cdot x}
  solution: |-
    Błędne rozumowanie: uczeń „skreśla” x^{2}, traktując je jak wspólny czynnik, i otrzymuje \frac{6\cdot x}{2\cdot x}=3.
    Dlaczego to źle: x^{2} jest w liczniku i w mianowniku SKŁADNIKIEM sumy, a nie czynnikiem iloczynu. Skracać wolno wyłącznie wspólne czynniki. Kontrola liczbowa dla x=1: \frac{1+6}{1+2}=\frac{7}{3}\neq 3.
    Poprawne rozwiązanie: najpierw rozkładamy na czynniki
    licznik: x^{2}+6\cdot x = x\cdot\left(x+6\right),
    mianownik: x^{2}+2\cdot x = x\cdot\left(x+2\right).
    Teraz x jest wspólnym CZYNNIKIEM i (na mocy założenia x\neq 0) wolno go skrócić:
    \frac{x\cdot\left(x+6\right)}{x\cdot\left(x+2\right)}=\frac{x+6}{x+2}.
    Odpowiedź: \frac{x+6}{x+2}.
