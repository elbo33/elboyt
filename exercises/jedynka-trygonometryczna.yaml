    DLACZEGO TO BŁĄD:
    Tożsamość dotyczy kwadratów: \sin^{2}\alpha+\cos^{2}\alpha=1. Sprawdźmy „wynik" 0{,}4: \left(0{,}6\right)^{2}+\left(0{,}4\right)^{2}=0{,}36+0{,}16=0{,}52\neq 1. Ponadto dla kąta ostrego zawsze \sin\alpha+\cos\alpha>1.

    POPRAWNE ROZWIĄZANIE:
    \cos^{2}\alpha=1-\sin^{2}\alpha=1-\left(0{,}6\right)^{2}=1-0{,}36=0{,}64.
    Kąt \alpha jest ostry, więc \cos\alpha>0 i \cos\alpha=\sqrt{0{,}64}=0{,}8.
    \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha}=\frac{0{,}6}{0{,}8}=\frac{3}{4}=0{,}75.
    Odpowiedź: \cos\alpha=0{,}8, \operatorname{tg}\alpha=\frac{3}{4}.
