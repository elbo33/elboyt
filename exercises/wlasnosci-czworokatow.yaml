  statement: 'W równoległoboku ABCD boki mają długości |AB| = 8 i |AD| = 6, a przekątna AC ma długość
    12. Uczeń stwierdził: „przekątne równoległoboku są równe, więc |BD| = |AC| = 12”. Wyjaśnij, dlaczego
    to rozumowanie jest błędne, i oblicz rzeczywistą długość przekątnej BD.'
  statement_latex: \left|BD\right| = \sqrt{2\cdot\left(8^{2}+6^{2}\right)-12^{2}}
  solution: |-
    Błędne rozumowanie: „przekątne dzielą się na połowy i figura wygląda symetrycznie, więc |BD| = |AC| = 12” — odpowiedź błędna: 12.
    Gdzie tkwi błąd: w równoległoboku przekątne jedynie dzielą się na połowy. Równość przekątnych charakteryzuje prostokąt (i kwadrat) oraz trapez równoramienny — w „skośnym” równoległoboku przekątna leżąca naprzeciw kąta rozwartego jest dłuższa od drugiej.
