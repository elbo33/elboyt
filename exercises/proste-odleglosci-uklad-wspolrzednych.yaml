  statement: W kartezjańskim układzie współrzędnych (x, y) dana jest prosta k o równaniu y = \frac{3}{4}x
    - 1. Oblicz współczynnik kierunkowy dowolnej prostej prostopadłej do prostej k.
  statement_latex: a_{k}\cdot a = -1,\qquad \frac{3}{4}\cdot a = -1
  solution: |-
    Z równania prostej k odczytujemy a_k = \frac{3}{4}.
    Warunek prostopadłości: a_k \cdot a = -1, czyli \frac{3}{4}\cdot a = -1.
    Stąd a = -1 \cdot \frac{4}{3} = -\frac{4}{3}.
    Odpowiedź: a = -\frac{4}{3}.
  solution_steps:
  - 'Odczytaj współczynnik kierunkowy prostej k: a_{k} = \frac{3}{4}.'
  - 'Zapisz warunek prostopadłości: \frac{3}{4}\cdot a = -1.'
  - 'Rozwiąż równanie: a = -\frac{4}{3} (odwracamy ułamek i zmieniamy znak).'
