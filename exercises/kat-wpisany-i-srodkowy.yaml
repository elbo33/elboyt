section: kat-wpisany-i-srodkowy
name: Twierdzenie o kącie wpisanym i środkowym
scope: 'The inscribed-angle theorem: an inscribed angle is half the central angle on the same arc; inscribed
  angles on the same arc are equal; the angle in a semicircle is right. Using these to find angles in
  circle figures.'
requirements:
- VIII.5
counts:
  total: 16
  DETERMINISTIC: 14
  REFERENCE_CALL: 1
  NOT_MACHINE_CHECKABLE: 1
exercises:
- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie kąta wpisanego z kąta środkowego
  statement: Punkty A i B leżą na okręgu o środku O. Kąt wypukły AOB ma miarę 130^\circ. Punkt C leży
    na dłuższym łuku AB tego okręgu. Oblicz miarę kąta wpisanego ACB. Wynik podaj w stopniach.
  statement_latex: '|\angle AOB| = 130^\circ,\qquad |\angle ACB| = \frac{1}{2}\cdot 130^\circ'
  solution: |-
    Wierzchołek C kąta wpisanego ACB leży na dłuższym łuku AB, więc kąt ten opiera się na krótszym łuku AB — czyli na tym samym łuku, na którym oparty jest dany kąt środkowy wypukły o mierze 130^\circ.

    Z twierdzenia o kącie wpisanym i środkowym kąt wpisany jest dwa razy mniejszy od kąta środkowego opartego na tym samym łuku:
    |\angle ACB| = \frac{1}{2}\cdot 130^\circ = 65^\circ.

    Odpowiedź: |\angle ACB| = 65^\circ.
  solution_steps:
  - Zauważ, że cięciwa AB wyznacza dwa łuki, a punkt C leży na dłuższym z nich.
  - Stąd kąt ACB opiera się na krótszym łuku AB, tym samym co kąt środkowy 130^\circ.
  - 'Zastosuj wzór \alpha = \tfrac{1}{2}\beta: |\angle ACB| = \tfrac{1}{2}\cdot 130^\circ = 65^\circ.'
  answer:
    kind: NUMERIC
    value: 65.0
    latex: 65^\circ
  checks:
  - kind: evaluate
    expr: \frac{1}{2}\cdot 130
  skills:
  - twierdzenie o kącie wpisanym i środkowym
  - rozpoznanie łuku, na którym oparty jest kąt
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 65.0 vs 65.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: obliczenie kąta środkowego z kąta wpisanego
  statement: Punkty A, B oraz C leżą na okręgu o środku O, przy czym punkt C leży na dłuższym łuku AB.
    Kąt wpisany ACB ma miarę 34^\circ. Oblicz miarę kąta środkowego wypukłego AOB. Wynik podaj w stopniach.
  statement_latex: '|\angle ACB| = 34^\circ,\qquad |\angle AOB| = 2\cdot 34^\circ'
  solution: |-
    Kąt wpisany ACB (wierzchołek C na dłuższym łuku) opiera się na krótszym łuku AB. Na tym samym łuku oparty jest kąt środkowy wypukły AOB.

    Kąt środkowy jest dwa razy większy od kąta wpisanego opartego na tym samym łuku:
    |\angle AOB| = 2\cdot 34^\circ = 68^\circ.

    Sprawdzenie sensowności: 68^\circ < 180^\circ, więc jest to rzeczywiście kąt wypukły.

    Odpowiedź: |\angle AOB| = 68^\circ.
  solution_steps:
  - Wskaż cięciwę AB i łuk, na którym oparty jest kąt ACB (krótszy łuk AB, bo C leży na dłuższym).
  - Kąt środkowy AOB oparty jest na tym samym łuku.
  - 'Zastosuj \beta = 2\alpha: |\angle AOB| = 2\cdot 34^\circ = 68^\circ.'
  answer:
    kind: NUMERIC
    value: 68.0
    latex: 68^\circ
  checks:
  - kind: evaluate
    expr: 2\cdot 34
  skills:
  - twierdzenie o kącie wpisanym i środkowym
  - przejście kąt wpisany → kąt środkowy
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 68.0 vs 68.0 (tol 1e-09)'
- id: g-th-02
