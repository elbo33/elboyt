- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: Walec opisany na graniastosłupie prawidłowym, stosunek objętości
  statement: 'Dany jest graniastosłup prawidłowy trójkątny o krawędzi podstawy równej 6 i wysokości równej
    10. Na tym graniastosłupie opisano walec: podstawą walca jest koło opisane na podstawie graniastosłupa,
    a wysokość walca jest równa wysokości graniastosłupa. Oblicz objętość tego walca oraz stosunek objętości
    walca do objętości graniastosłupa. Zapisz obliczenia.'
  statement_latex: R = \frac{6\sqrt{3}}{3},\qquad V_{w} = \pi R^{2}\cdot 10,\qquad \frac{V_{w}}{V_{g}}
    = \frac{\pi R^{2}\cdot 10}{\frac{6^{2}\sqrt{3}}{4}\cdot 10}
  solution: |-
    Krok 1. Promień okręgu opisanego na trójkącie równobocznym o boku a = 6:
    R = \frac{a\sqrt{3}}{3} = \frac{6\sqrt{3}}{3} = 2\sqrt{3}.
    Wysokość walca jest równa wysokości graniastosłupa: H = 10.
    Krok 2. Objętość walca:
    V_{w} = \pi R^{2} H = \pi\cdot\left(2\sqrt{3}\right)^{2}\cdot 10 = \pi\cdot 12\cdot 10 = 120\pi.
    Krok 3. Pole podstawy graniastosłupa: P = \frac{a^{2}\sqrt{3}}{4} = \frac{36\sqrt{3}}{4} = 9\sqrt{3}, zatem
    V_{g} = 9\sqrt{3}\cdot 10 = 90\sqrt{3}.
    Krok 4. Stosunek objętości:
    \frac{V_{w}}{V_{g}} = \frac{120\pi}{90\sqrt{3}} = \frac{4\pi}{3\sqrt{3}} = \frac{4\sqrt{3}\pi}{9} \approx 2{,}42.
    Odp. V_{w} = 120\pi \approx 377, stosunek objętości wynosi \frac{4\sqrt{3}\pi}{9}.
  solution_steps:
  - 'Zapisz, że wysokość walca równa jest wysokości graniastosłupa: H = 10.'
  - 'Wyznacz promień koła opisanego na trójkącie równobocznym o boku 6: R = \frac{6\sqrt{3}}{3} = 2\sqrt{3}.'
  - 'Oblicz objętość walca: V_{w} = \pi\cdot 12\cdot 10 = 120\pi.'
  - 'Oblicz pole podstawy i objętość graniastosłupa: P = 9\sqrt{3}, V_{g} = 90\sqrt{3}.'
  - 'Wyznacz i uprość stosunek: \frac{120\pi}{90\sqrt{3}} = \frac{4\sqrt{3}\pi}{9}.'
  answer:
    kind: MULTIPART
    parts:
    - name: V_walca
      answer:
        kind: SYMBOLIC
        latex: 120\pi
    - name: stosunek
      answer:
        kind: SYMBOLIC
        latex: \frac{4\sqrt{3}\pi}{9}
  checks:
  - kind: evaluate
    expr: \pi \cdot \left(2\sqrt{3}\right)^{2} \cdot 10
    part: V_walca
  - kind: evaluate
    expr: \frac{\pi \cdot \left(2\sqrt{3}\right)^{2} \cdot 10}{\frac{6^{2}\sqrt{3}}{4} \cdot 10}
    part: stosunek
  skills:
  - promień okręgu opisanego na trójkącie równobocznym
  - objętość walca
  - objętość graniastosłupa
  - stosunek objętości
  verification:
