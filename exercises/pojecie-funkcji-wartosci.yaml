- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczanie wartości funkcji ze wzoru
  statement: Funkcja f jest określona wzorem f(x) = 3x - 5 dla wszystkich liczb rzeczywistych x. Oblicz
    f(4) oraz f(-2).
  statement_latex: f\left(x\right)=3\cdot x-5
  solution: |-
    W miejsce każdego x wstawiamy podany argument, ujmując go w nawias.
    f(4) = 3·(4) − 5 = 12 − 5 = 7.
    f(−2) = 3·(−2) − 5 = −6 − 5 = −11.
    Odpowiedź: f(4) = 7 oraz f(−2) = −11.
  solution_steps:
  - Sprawdzamy, że oba argumenty należą do dziedziny (wszystkie liczby rzeczywiste).
  - 'Podstawiamy x = 4: f(4) = 3\cdot\left(4\right)-5 = 12-5 = 7.'
  - 'Podstawiamy x = -2 (argument w nawiasie): f(-2) = 3\cdot\left(-2\right)-5 = -6-5 = -11.'
  - Zapisujemy odpowiedź w postaci f(a) = ... .
  answer:
    kind: MULTIPART
    parts:
    - name: f(4)
      answer:
        kind: NUMERIC
        value: 7.0
    - name: f(-2)
      answer:
        kind: NUMERIC
        value: -11.0
  checks:
  - kind: evaluate
    expr: 3\cdot\left(4\right)-5
    part: f(4)
  - kind: evaluate
    expr: 3\cdot\left(-2\right)-5
    part: f(-2)
  skills:
  - podstawianie argumentu do wzoru
  - nawiasy przy liczbie ujemnej
  - kolejność działań
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [f(4)] SymPy solved it fresh: 7.0 vs 7.0 (tol 1e-09) ; [f(-2)]
      SymPy solved it fresh: -11.0 vs -11.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: odczyt z tabeli
  statement: 'Funkcja g o dziedzinie D = {1, 2, 3, 4, 5} jest opisana tabelą: g(1) = 6, g(2) = -1, g(3)
    = 6, g(4) = 0, g(5) = 3. Podaj zbiór wartości funkcji g oraz jej miejsce zerowe.'
  statement_latex: D=\left\{1,2,3,4,5\right\},\quad g\left(1\right)=6,\ g\left(2\right)=-1,\ g\left(3\right)=6,\
    g\left(4\right)=0,\ g\left(5\right)=3
  solution: |-
    Zbiór wartości to zbiór wszystkich liczb z wiersza wartości, zapisany bez powtórzeń:
    ZW = {6, −1, 6, 0, 3} = {−1, 0, 3, 6}.
    Miejsce zerowe to taki argument x₀ ∈ D, dla którego g(x₀) = 0. W tabeli wartość 0 stoi pod argumentem 4, więc x₀ = 4.
    Odpowiedź: ZW = {−1, 0, 3, 6}, miejscem zerowym jest x = 4.
  solution_steps:
  - Ustalamy, że argumenty to liczby 1, 2, 3, 4, 5, a wartości to liczby 6, -1, 6, 0, 3.
  - 'Zbiór wartości: wypisujemy wartości bez powtórzeń, ZW = \left\{-1,0,3,6\right\}.'
  - Szukamy w wierszu wartości liczby 0 — stoi ona pod argumentem 4.
  - 'Miejsce zerowe: x = 4 (to argument, a nie wartość).'
  answer:
    kind: MULTIPART
    parts:
    - name: zbiór wartości
      answer:
        kind: SET
        members:
        - '-1'
        - '0'
        - '3'
        - '6'
    - name: miejsce zerowe
      answer:
        kind: NUMERIC
        value: 4.0
  skills:
  - odczyt wartości z tabeli
  - zbiór wartości
  - miejsce zerowe
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: należenie punktu do wykresu
  statement: Dana jest funkcja f określona wzorem f(x) = x^2 - 5 dla wszystkich liczb rzeczywistych x.
    Oblicz f(3) oraz f(-2), a następnie rozstrzygnij, czy punkt A = (3, 4) należy do wykresu funkcji f
    i czy punkt B = (-2, 1) należy do wykresu funkcji f.
  statement_latex: f\left(x\right)=x^{2}-5,\quad A=\left(3,\,4\right),\quad B=\left(-2,\,1\right)
  solution: |-
    Punkt P(x₀, y₀) należy do wykresu funkcji f dokładnie wtedy, gdy y₀ = f(x₀).
    f(3) = (3)² − 5 = 9 − 5 = 4. Ponieważ f(3) = 4 = y_A, punkt A(3, 4) należy do wykresu.
    f(−2) = (−2)² − 5 = 4 − 5 = −1. Ponieważ f(−2) = −1, a y_B = 1, punkt B(−2, 1) NIE należy do wykresu.
    Odpowiedź: f(3) = 4, f(−2) = −1; A leży na wykresie, B nie leży.
  solution_steps:
  - Obliczamy f(3) = \left(3\right)^{2}-5 = 4.
  - 'Porównujemy z drugą współrzędną punktu A: 4 = 4, więc A należy do wykresu.'
  - Obliczamy f(-2) = \left(-2\right)^{2}-5 = -1.
  - 'Porównujemy z drugą współrzędną punktu B: -1 \ne 1, więc B nie należy do wykresu.'
  answer:
    kind: MULTIPART
    parts:
    - name: f(3)
      answer:
        kind: NUMERIC
        value: 4.0
    - name: f(-2)
      answer:
        kind: NUMERIC
        value: -1.0
    - name: A należy do wykresu
      answer:
        kind: BOOLEAN
        truth: true
    - name: B należy do wykresu
      answer:
        kind: BOOLEAN
        truth: false
  checks:
  - kind: evaluate
    expr: \left(3\right)^{2}-5
    part: f(3)
  - kind: evaluate
    expr: \left(-2\right)^{2}-5
    part: f(-2)
  skills:
  - obliczanie wartości funkcji
  - warunek należenia punktu do wykresu
  verification:
    checkability: REFERENCE_CALL
    note: '4 parts matched · det: [f(3)] SymPy solved it fresh: 4.0 vs 4.0 (tol 1e-09) ; [f(-2)] SymPy
      solved it fresh: -1.0 vs -1.0 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: wartości funkcji i równanie f(x)=c
  statement: Funkcja f jest określona wzorem f(x) = x^2 - 4x + 3 dla wszystkich liczb rzeczywistych x.
    a) Oblicz f(-2) oraz f(1/2). b) Wyznacz wszystkie argumenty, dla których funkcja f przyjmuje wartość
    3.
  statement_latex: f\left(x\right)=x^{2}-4\cdot x+3
  solution: |-
    a) f(−2) = (−2)² − 4·(−2) + 3 = 4 + 8 + 3 = 15.
    f(1/2) = (1/2)² − 4·(1/2) + 3 = 1/4 − 2 + 3 = 1/4 + 1 = 5/4.
    b) Rozwiązujemy równanie f(x) = 3:
    x² − 4x + 3 = 3
    x² − 4x = 0
    x(x − 4) = 0, czyli x = 0 lub x = 4.
    Oba argumenty należą do dziedziny (zbioru liczb rzeczywistych).
    Odpowiedź: f(−2) = 15, f(1/2) = 5/4; funkcja przyjmuje wartość 3 dla x = 0 oraz dla x = 4.
  solution_steps:
  - 'Podstawiamy argument -2 w nawiasie: f(-2)=\left(-2\right)^{2}-4\cdot\left(-2\right)+3=15.'
  - 'Podstawiamy argument \frac{1}{2}: f\left(\frac{1}{2}\right)=\left(\frac{1}{2}\right)^{2}-4\cdot\frac{1}{2}+3=\frac{5}{4}.'
  - Zapisujemy równanie x^{2}-4\cdot x+3=3.
  - 'Przekształcamy: x^{2}-4\cdot x=0, czyli x\cdot\left(x-4\right)=0.'
  - Odczytujemy rozwiązania x=0 oraz x=4 i sprawdzamy, że należą do dziedziny.
  answer:
    kind: MULTIPART
    parts:
    - name: f(-2)
      answer:
        kind: NUMERIC
        value: 15.0
    - name: f(1/2)
      answer:
        kind: NUMERIC
        value: 1.25
    - name: argumenty, dla których f(x)=3
      answer:
        kind: SET
        members:
        - '0'
        - '4'
  checks:
  - kind: evaluate
    expr: \left(-2\right)^{2}-4\cdot\left(-2\right)+3
    part: f(-2)
  - kind: evaluate
    expr: \left(\frac{1}{2}\right)^{2}-4\cdot\frac{1}{2}+3
    part: f(1/2)
  - kind: solve_equation
    expr: x^{2}-4\cdot x+3=3
    part: argumenty, dla których f(x)=3
  skills:
  - podstawianie ujemnego i ułamkowego argumentu
  - rozwiązywanie równania f(x)=c
  - rozróżnianie argumentu i wartości
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [f(-2)] SymPy solved it fresh: 15.0 vs 15.0 (tol 1e-09) ; [f(1/2)]
      SymPy solved it fresh: 1.25 vs 1.25 (tol 1e-09) ; [argumenty, dla których f(x)=3] SymPy solved it
      fresh: 2 members matched'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: funkcja określona różnymi wzorami
  statement: 'Funkcja f jest określona dla wszystkich liczb rzeczywistych wzorem: f(x) = 2x + 7 dla x
    < -2, f(x) = x^2 - 1 dla -2 \le x \le 3, f(x) = 11 - 2x dla x > 3. a) Oblicz f(-4), f(-2), f(3) oraz
    f(5). b) Wyznacz wszystkie argumenty, dla których f(x) = 3.'
  statement_latex: f\left(x\right)=\begin{cases} 2\cdot x+7 & \text{dla } x<-2\\ x^{2}-1 & \text{dla }
    -2\le x\le 3\\ 11-2\cdot x & \text{dla } x>3\end{cases}
  solution: |-
    a) x = −4: ponieważ −4 < −2, obowiązuje wzór 2x + 7, więc f(−4) = 2·(−4) + 7 = −1.
    x = −2: warunek −2 ≤ x ≤ 3 jest spełniony (nierówność nieostra), więc f(−2) = (−2)² − 1 = 3.
    x = 3: 3 należy do ⟨−2, 3⟩, więc f(3) = 3² − 1 = 8 (nie wolno użyć wzoru 11 − 2x, bo tam jest x > 3).
    x = 5: 5 > 3, więc f(5) = 11 − 2·5 = 1.
    b) Równanie f(x) = 3 rozwiązujemy osobno na każdym przedziale:
    • dla x < −2: 2x + 7 = 3 ⟹ 2x = −4 ⟹ x = −2; ale −2 nie spełnia warunku x < −2, więc ODRZUCAMY;
    • dla −2 ≤ x ≤ 3: x² − 1 = 3 ⟹ x² = 4 ⟹ x = −2 lub x = 2; oba należą do ⟨−2, 3⟩, przyjmujemy oba;
    • dla x > 3: 11 − 2x = 3 ⟹ 2x = 8 ⟹ x = 4; 4 > 3, przyjmujemy.
    Odpowiedź: f(−4) = −1, f(−2) = 3, f(3) = 8, f(5) = 1; równanie f(x) = 3 ma trzy rozwiązania: x ∈ {−2, 2, 4}.
  solution_steps:
  - 'Dla x=-4 sprawdzamy warunek: -4<-2, więc f(-4)=2\cdot\left(-4\right)+7=-1.'
  - Dla x=-2 zachodzi -2\le x\le 3, więc f(-2)=\left(-2\right)^{2}-1=3.
  - Dla x=3 zachodzi -2\le x\le 3, więc f(3)=\left(3\right)^{2}-1=8.
  - Dla x=5 zachodzi x>3, więc f(5)=11-2\cdot 5=1.
  - Na przedziale x<-2 rozwiązujemy 2\cdot x+7=3 i otrzymujemy x=-2, które odrzucamy (nie spełnia x<-2).
  - Na przedziale -2\le x\le 3 rozwiązujemy x^{2}-1=3 i otrzymujemy x=-2 oraz x=2 — oba przyjmujemy.
  - Na przedziale x>3 rozwiązujemy 11-2\cdot x=3 i otrzymujemy x=4 — przyjmujemy.
  - Zapisujemy zbiór rozwiązań \left\{-2,2,4\right\}.
  answer:
    kind: MULTIPART
    parts:
    - name: f(-4)
      answer:
        kind: NUMERIC
        value: -1.0
    - name: f(-2)
      answer:
        kind: NUMERIC
        value: 3.0
    - name: f(3)
      answer:
        kind: NUMERIC
        value: 8.0
    - name: f(5)
      answer:
        kind: NUMERIC
        value: 1.0
    - name: rozwiązania równania f(x)=3
      answer:
        kind: SET
        members:
        - '-2'
        - '2'
        - '4'
  checks:
  - kind: evaluate
    expr: 2\cdot\left(-4\right)+7
    part: f(-4)
  - kind: evaluate
    expr: \left(-2\right)^{2}-1
    part: f(-2)
  - kind: evaluate
    expr: \left(3\right)^{2}-1
    part: f(3)
  - kind: evaluate
    expr: 11-2\cdot\left(5\right)
    part: f(5)
  skills:
  - wybór właściwego wzoru w funkcji klamrowej
  - rozwiązywanie f(x)=c na każdym przedziale
  - odrzucanie rozwiązań spoza przedziału
  verification:
    checkability: REFERENCE_CALL
    note: '5 parts matched · det: [f(-4)] SymPy solved it fresh: -1.0 vs -1.0 (tol 1e-09) ; [f(-2)] SymPy
      solved it fresh: 3.0 vs 3.0 (tol 1e-09) ; [f(3)] SymPy solved it fresh: 8.0 vs 8.0 (tol 1e-09) ;
      [f(5)] SymPy solved it fresh: 1.0 vs 1.0 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: modelowanie cennika, funkcja klamrowa, kilka źródeł informacji
  statement: Na parkingu A za postój trwający nie dłużej niż 2 rozpoczęte godziny kierowca płaci 8 zł,
    a za każdą kolejną rozpoczętą godzinę dopłaca 3 zł. Niech t oznacza liczbę rozpoczętych godzin postoju
    (t jest liczbą naturalną, t \ge 1), a K(t) — koszt postoju w złotych. a) Zapisz wzór funkcji K. b)
    Oblicz K(5). c) Kierowca zapłacił za postój 26 zł. Przez ile rozpoczętych godzin stał na tym parkingu?
    d) Na parkingu B każda rozpoczęta godzina postoju kosztuje 4 zł i nie ma opłaty stałej. O ile złotych
    mniej zapłaci kierowca za 5 rozpoczętych godzin postoju na parkingu A niż na parkingu B?
  statement_latex: K\left(t\right)=\begin{cases} 8 & \text{dla } t\in\left\{1,2\right\}\\ 8+3\cdot\left(t-2\right)
    & \text{dla } t>2\end{cases}
  solution: |-
    a) Za pierwsze dwie rozpoczęte godziny płacimy 8 zł, a za każdą godzinę ponad dwie — po 3 zł, czyli łącznie 3·(t − 2) zł dopłaty:
    K(t) = 8 dla t = 1, 2 oraz K(t) = 8 + 3·(t − 2) dla t > 2 (t naturalne).
    b) t = 5 > 2, więc K(5) = 8 + 3·(5 − 2) = 8 + 9 = 17 (zł).
    c) Ponieważ 26 zł > 8 zł, argument leży w drugim przedziale:
    8 + 3·(t − 2) = 26 ⟹ 3·(t − 2) = 18 ⟹ t − 2 = 6 ⟹ t = 8.
    Sprawdzenie: 8 > 2 ✓. Kierowca stał 8 rozpoczętych godzin.
    d) Parking B: L(5) = 4·5 = 20 (zł). Parking A: K(5) = 17 zł.
    Różnica: 20 − 17 = 3 (zł).
    Odpowiedź: za 5 rozpoczętych godzin postoju na parkingu A kierowca zapłaci o 3 zł mniej niż na parkingu B.
  solution_steps:
  - 'Ustalamy strukturę cennika: opłata stała 8 zł obejmuje 2 rozpoczęte godziny, każda kolejna kosztuje
    3 zł.'
  - 'Zapisujemy wzór: K\left(t\right)=8 dla t\in\left\{1,2\right\} oraz K\left(t\right)=8+3\cdot\left(t-2\right)
    dla t>2.'
  - 'Dla t=5 wybieramy drugi wzór: K\left(5\right)=8+3\cdot\left(5-2\right)=17 zł.'
  - Rozwiązujemy równanie 8+3\cdot\left(t-2\right)=26, skąd t=8, i sprawdzamy warunek t>2.
  - 'Obliczamy koszt na parkingu B: 4\cdot 5=20 zł.'
  - Wyznaczamy różnicę 20-17=3 zł i zapisujemy odpowiedź z jednostką.
  answer:
    kind: MULTIPART
    parts:
    - name: wzór funkcji K
      answer:
        kind: SYMBOLIC
        latex: K\left(t\right)=\begin{cases} 8 & \text{dla } t\in\left\{1,2\right\}\\ 8+3\cdot\left(t-2\right)
          & \text{dla } t>2\end{cases}
    - name: K(5)
      answer:
        kind: NUMERIC
        value: 17.0
    - name: liczba godzin przy opłacie 26 zł
      answer:
        kind: NUMERIC
        value: 8.0
    - name: różnica kosztów za 5 godzin
      answer:
        kind: NUMERIC
        value: 3.0
  checks:
  - kind: evaluate
    expr: 8+3\cdot\left(5-2\right)
    var: t
    part: K(5)
  - kind: solve_equation
    expr: 8+3\cdot\left(t-2\right)=26
    var: t
    part: liczba godzin przy opłacie 26 zł
  - kind: evaluate
    expr: 4\cdot 5-\left(8+3\cdot\left(5-2\right)\right)
    var: t
    part: różnica kosztów za 5 godzin
  stated_model:
    variable: t
    objective_latex: K\left(t\right)=\begin{cases} 8 & \text{dla } t\in\left\{1,2\right\}\\ 8+3\cdot\left(t-2\right)
      & \text{dla } t>2\end{cases}
    domain_lo: '1'
    domain_lo_open: false
    goal: value
    constraint_used: t — liczba rozpoczętych godzin postoju, t liczba naturalna, t \ge 1
  skills:
  - budowanie wzoru funkcji klamrowej
  - obliczanie wartości w kontekście praktycznym
  - rozwiązywanie f(t)=c
  - porównywanie dwóch ofert
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (NOT_MACHINE_CHECKABLE: ''set literal'') — human
      review'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: 'funkcja klamrowa: obliczanie wartości i rozwiązywanie f(x)=c'
  statement: |-
    Funkcja f jest określona dla wszystkich liczb rzeczywistych wzorem
    f(x) = 2x + 7 dla x < −2,  f(x) = x² − 1 dla −2 ≤ x ≤ 3,  f(x) = 11 − 2x dla x > 3.
    a) Oblicz f(−4), f(−2), f(3) oraz f(5).
    b) Wyznacz wszystkie argumenty, dla których funkcja f przyjmuje wartość 3.
  statement_latex: f\left(x\right)=\begin{cases} 2\cdot x+7, & x<-2\\ x^{2}-1, & -2\le x\le 3\\ 11-2\cdot
    x, & x>3\end{cases}
  solution: |-
    a) Dla każdego argumentu najpierw sprawdzamy, który warunek jest spełniony.
    x = −4: ponieważ −4 < −2, korzystamy ze wzoru 2x + 7, więc f(−4) = 2·(−4) + 7 = −8 + 7 = −1.
    x = −2: warunek −2 ≤ x ≤ 3 jest spełniony (nierówność nieostra!), więc f(−2) = (−2)² − 1 = 4 − 1 = 3.
    x = 3: 3 należy do ⟨−2, 3⟩, więc f(3) = 3² − 1 = 9 − 1 = 8 (nie wolno użyć wzoru 11 − 2x, bo tam jest x > 3).
    x = 5: 5 > 3, więc f(5) = 11 − 2·5 = 1.

    b) Równanie f(x) = 3 rozwiązujemy osobno na każdym przedziale.
    • dla x < −2: 2x + 7 = 3, czyli 2x = −4, x = −2. Ale −2 nie spełnia warunku x < −2, więc to rozwiązanie odrzucamy.
    • dla −2 ≤ x ≤ 3: x² − 1 = 3, czyli x² = 4, x = −2 lub x = 2. Oba argumenty należą do ⟨−2, 3⟩, więc oba przyjmujemy.
    • dla x > 3: 11 − 2x = 3, czyli 2x = 8, x = 4. Ponieważ 4 > 3, przyjmujemy.
    Odpowiedź: f(x) = 3 dla x ∈ {−2, 2, 4}.
  solution_steps:
  - 'Dla x = −4 sprawdzam warunek: −4 < −2, więc f(−4) = 2·(−4) + 7 = −1.'
  - Dla x = −2 zachodzi −2 ≤ x ≤ 3, więc f(−2) = (−2)² − 1 = 3.
  - Dla x = 3 zachodzi −2 ≤ x ≤ 3, więc f(3) = 3² − 1 = 8.
  - Dla x = 5 zachodzi x > 3, więc f(5) = 11 − 2·5 = 1.
  - Na przedziale x < −2 rozwiązuję 2x + 7 = 3, otrzymuję x = −2 i odrzucam (nie spełnia x < −2).
  - Na przedziale ⟨−2, 3⟩ rozwiązuję x² − 1 = 3, otrzymuję x = −2 i x = 2 — oba należą do przedziału.
  - Na przedziale x > 3 rozwiązuję 11 − 2x = 3, otrzymuję x = 4, które spełnia x > 3.
  - 'Zapisuję zbiór rozwiązań: {−2, 2, 4}.'
  answer:
    kind: MULTIPART
    parts:
    - name: f(-4)
      answer:
