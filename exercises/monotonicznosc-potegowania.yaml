- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: porzadkowanie_liczb_zapisanych_jako_potegi
  statement: 'Dane są liczby: a = \left(\frac{1}{2}\right)^{-\frac{3}{2}}, \; b = 4^{\frac{3}{5}}, \;
    c = \left(\frac{1}{8}\right)^{\frac{1}{5}}, \; d = 8^{\frac{3}{10}}. Uporządkuj te liczby rosnąco,
    podając kolejność ich oznaczeń.'
  statement_latex: a = \left(\frac{1}{2}\right)^{-\frac{3}{2}}, \quad b = 4^{\frac{3}{5}}, \quad c = \left(\frac{1}{8}\right)^{\frac{1}{5}},
    \quad d = 8^{\frac{3}{10}}
  solution: |-
    Sprowadzamy wszystkie liczby do podstawy 2, korzystając z \left(\frac{1}{a}\right)^{x} = a^{-x} oraz \left(a^{m}\right)^{n} = a^{m \cdot n}:
    a = \left(2^{-1}\right)^{-\frac{3}{2}} = 2^{\frac{3}{2}} = 2^{1,5},
    b = \left(2^{2}\right)^{\frac{3}{5}} = 2^{\frac{6}{5}} = 2^{1,2},
    c = \left(2^{-3}\right)^{\frac{1}{5}} = 2^{-\frac{3}{5}} = 2^{-0,6},
    d = \left(2^{3}\right)^{\frac{3}{10}} = 2^{\frac{9}{10}} = 2^{0,9}.
    Wspólna podstawa 2 jest większa od 1, więc porządek wykładników przenosi się bez zmian na porządek potęg. Wykładniki uporządkowane rosnąco: -0,6 < 0,9 < 1,2 < 1,5, czyli c < d < b < a.
    Odpowiedź (rosnąco): c, d, b, a.
  solution_steps:
  - 'Zamień podstawy ułamkowe na potęgi dwójki: \frac{1}{2} = 2^{-1}, \frac{1}{8} = 2^{-3}.'
  - 'Zapisz wszystkie liczby w postaci potęg o podstawie 2: a = 2^{\frac{3}{2}}, b = 2^{\frac{6}{5}},
    c = 2^{-\frac{3}{5}}, d = 2^{\frac{9}{10}}.'
  - 'Zamień wykładniki na ułamki dziesiętne: 1,5; 1,2; -0,6; 0,9.'
  - 'Uporządkuj wykładniki rosnąco: -0,6 < 0,9 < 1,2 < 1,5.'
  - 'Ponieważ podstawa 2 > 1, kolejność potęg jest taka sama: c < d < b < a.'
  answer:
    kind: TUPLE
    latex: c < d < b < a
    items:
    - c
    - d
    - b
    - a
  skills:
  - sprowadzanie do wspólnej podstawy
  - zamiana podstawy na odwrotną
  - porządkowanie liczb
  verification:
    checkability: REFERENCE_CALL
    note: 4 components matched
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: porownanie_poteg_i_nierownosc_wykladnicza
  statement: (a) Która z liczb 5^{30} oraz 3^{45} jest większa? Odpowiedź uzasadnij, sprowadzając obie
    liczby do wspólnego wykładnika. (b) Rozwiąż nierówność \left(\frac{3}{5}\right)^{2x-1} \geq \left(\frac{3}{5}\right)^{x+4}
    i zapisz zbiór rozwiązań w postaci przedziału.
  statement_latex: \text{(a) } 5^{30} \;\square\; 3^{45}, \qquad \text{(b) } \left(\frac{3}{5}\right)^{2x-1}
    \geq \left(\frac{3}{5}\right)^{x+4}
  solution: |-
    (a) Podstaw 5 i 3 nie da się sprowadzić do wspólnej podstawy, więc uwspólniamy wykładniki. NWD(30, 45) = 15, zatem
    5^{30} = \left(5^{2}\right)^{15} = 25^{15},
    3^{45} = \left(3^{3}\right)^{15} = 27^{15}.
    Teraz wykładnik jest wspólny i dodatni, więc decyduje porównanie podstaw: skoro 0 < 25 < 27, to 25^{15} < 27^{15}. Zatem 5^{30} < 3^{45} — większa jest liczba 3^{45}.
    (b) Podstawa \frac{3}{5} należy do przedziału (0,1), więc przy opuszczaniu potęgowania ODWRACAMY znak nierówności:
    2x - 1 \leq x + 4
    2x - x \leq 4 + 1
    x \leq 5.
    Zbiór rozwiązań: x \in \left(-\infty, 5\right\rangle.
    Sprawdzenie: dla x = 0 lewa strona to \left(\frac{3}{5}\right)^{-1} = \frac{5}{3} > 1, a prawa \left(\frac{3}{5}\right)^{4} < 1 — nierówność jest spełniona.
  solution_steps:
  - '(a) Wyznacz NWD wykładników: NWD(30, 45) = 15.'
  - '(a) Zapisz liczby w postaci potęg o wykładniku 15: 5^{30} = 25^{15}, 3^{45} = 27^{15}.'
  - '(a) Wykładnik 15 jest dodatni, więc większa podstawa daje większą potęgę: 25^{15} < 27^{15}, czyli
    większa jest liczba 3^{45}.'
  - (b) Ustal, że podstawa \frac{3}{5} leży w przedziale (0,1), więc potęgowanie jest malejące.
  - '(b) Opuść potęgowanie, odwracając znak: 2x - 1 \leq x + 4.'
  - '(b) Rozwiąż nierówność: x \leq 5, czyli x \in \left(-\infty, 5\right\rangle.'
  answer:
    kind: MULTIPART
    parts:
    - name: (a) wieksza liczba
      answer:
        kind: SYMBOLIC
        latex: 3^{45}
    - name: (a) uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: 'Uczeń musi uzasadnić porównanie: sprowadzić obie liczby do wspólnego wykładnika 15 (5^{30}
          = 25^{15}, 3^{45} = 27^{15}) i powołać się na monotoniczność względem podstawy przy dodatnim
          wykładniku.'
    - name: (b) zbior rozwiazan
      answer:
        kind: INTERVAL
        hi: '5'
        hi_open: false
  checks:
  - kind: solve_inequality
    expr: 2 \cdot x - 1 \le x + 4
    part: (b) zbior rozwiazan
  skills:
  - sprowadzanie do wspólnego wykładnika
  - monotoniczność względem podstawy
  - prosta nierówność wykładnicza
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: (a) uzasadnienie · 1/2 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: porządkowanie potęg (wspólna podstawa)
  statement: |-
    Dane są liczby:
    a = \left( \frac{1}{8} \right)^{-0,4}, \quad b = 4^{0,6}, \quad c = 2^{1,1}, \quad d = \left( \frac{1}{32} \right)^{-0,25}.
    Zapisz każdą z tych liczb w postaci potęgi o podstawie 2 (podaj wykładniki), a następnie uporządkuj liczby a, b, c, d rosnąco.
  statement_latex: a = \left( \frac{1}{8} \right)^{-0,4},\quad b = 4^{0,6},\quad c = 2^{1,1},\quad d =
    \left( \frac{1}{32} \right)^{-0,25}
  solution: |-
    Każdą podstawę zapisujemy jako potęgę liczby 2 i korzystamy ze wzoru \left( a^{m} \right)^{n} = a^{m \cdot n}.

    a = \left( 2^{-3} \right)^{-\frac{2}{5}} = 2^{\left(-3\right) \cdot \left(-\frac{2}{5}\right)} = 2^{\frac{6}{5}} = 2^{1,2}.

    b = \left( 2^{2} \right)^{\frac{3}{5}} = 2^{2 \cdot \frac{3}{5}} = 2^{\frac{6}{5}} = 2^{1,2}.

    c = 2^{1,1} = 2^{\frac{11}{10}}.

    d = \left( 2^{-5} \right)^{-\frac{1}{4}} = 2^{\left(-5\right) \cdot \left(-\frac{1}{4}\right)} = 2^{\frac{5}{4}} = 2^{1,25}.

    Wszystkie liczby mają teraz wspólną podstawę 2 > 1, więc potęgowanie zachowuje porządek: kolejność wykładników przenosi się bez zmian na kolejność potęg.

    Wykładniki na osi liczbowej: 1,1 < 1,2 = 1,2 < 1,25, czyli c ma najmniejszy wykładnik, a d największy; liczby a i b mają ten sam wykładnik, więc są równe.

    Zatem rosnąco: c < a = b < d, czyli 2^{1,1} < \left( \frac{1}{8} \right)^{-0,4} = 4^{0,6} < \left( \frac{1}{32} \right)^{-0,25}.
  solution_steps:
  - 'Zapisz podstawy jako potęgi dwójki: \frac{1}{8} = 2^{-3}, \; 4 = 2^{2}, \; \frac{1}{32} = 2^{-5}.'
  - 'Zastosuj wzór \left( a^{m} \right)^{n} = a^{m \cdot n}: a = 2^{1,2}, \; b = 2^{1,2}, \; c = 2^{1,1},
    \; d = 2^{1,25}.'
  - Zauważ, że wspólna podstawa 2 jest większa od 1, więc potęgowanie jest rosnące.
  - 'Uporządkuj wykładniki: 1,1 < 1,2 = 1,2 < 1,25.'
  - 'Przenieś porządek na potęgi: c < a = b < d.'
  answer:
    kind: MULTIPART
    parts:
    - name: wykladnik_a
      answer:
        kind: NUMERIC
        value: 1.2
    - name: wykladnik_b
      answer:
        kind: NUMERIC
        value: 1.2
    - name: wykladnik_c
      answer:
        kind: NUMERIC
        value: 1.1
    - name: wykladnik_d
      answer:
        kind: NUMERIC
        value: 1.25
    - name: porzadek_rosnacy
      answer:
        kind: SYMBOLIC
        latex: c < a = b < d
  checks:
  - kind: evaluate
    expr: \left(-3\right) \cdot \left(-\frac{2}{5}\right)
    part: wykladnik_a
  - kind: evaluate
    expr: 2 \cdot \frac{3}{5}
    part: wykladnik_b
  - kind: evaluate
    expr: \frac{11}{10}
    part: wykladnik_c
  - kind: evaluate
    expr: \left(-5\right) \cdot \left(-\frac{1}{4}\right)
    part: wykladnik_d
  skills:
  - sprowadzanie potęg do wspólnej podstawy
  - stosowanie wzoru (a^m)^n = a^{mn}
  - porównywanie wykładników ujemnych i ułamkowych
  - monotoniczność potęgowania dla podstawy większej od 1
  verification:
    checkability: REFERENCE_CALL
    note: 'answer and reference disagree: part disagrees: 1.2 vs 2.29739670999407 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: nierówność wykładnicza
  statement: Rozwiąż nierówność \left( \frac{1}{9} \right)^{x-1} \ge 27^{2x-5} i zapisz zbiór jej rozwiązań
    w postaci przedziału. Podaj największą liczbę całkowitą spełniającą tę nierówność.
  statement_latex: \left( \frac{1}{9} \right)^{x-1} \ge 27^{2 \cdot x - 5}
  solution: |-
    Sprowadzamy obie strony do podstawy 3: \frac{1}{9} = 3^{-2} oraz 27 = 3^{3}.

    Lewa strona: \left( 3^{-2} \right)^{x-1} = 3^{-2 \cdot \left( x - 1 \right)} = 3^{-2x+2}.
    Prawa strona: \left( 3^{3} \right)^{2x-5} = 3^{3 \cdot \left( 2x - 5 \right)} = 3^{6x-15}.

    Nierówność ma postać 3^{-2x+2} \ge 3^{6x-15}. Podstawa 3 > 1, więc potęgowanie jest rosnące i znak nierówności zostaje zachowany:
    -2x + 2 \ge 6x - 15
    2 + 15 \ge 6x + 2x
    17 \ge 8x
    x \le \frac{17}{8}.

    Zbiór rozwiązań: x \in \left( -\infty, \frac{17}{8} \right\rangle.

    Ponieważ \frac{17}{8} = 2,125, największą liczbą całkowitą spełniającą nierówność jest 2.

    Sprawdzenie dla x = 2: lewa strona \left( \frac{1}{9} \right)^{1} = 3^{-2}, prawa strona 27^{-1} = 3^{-3}; istotnie 3^{-2} \ge 3^{-3}.
  solution_steps:
  - 'Zapisz podstawy jako potęgi trójki: \frac{1}{9} = 3^{-2}, \; 27 = 3^{3}.'
  - 'Przekształć obie strony: 3^{-2x+2} \ge 3^{6x-15}.'
  - Zauważ, że podstawa 3 > 1, więc znaku nierówności nie odwracamy.
  - Rozwiąż nierówność liniową -2x + 2 \ge 6x - 15, otrzymując x \le \frac{17}{8}.
  - 'Zapisz zbiór rozwiązań \left( -\infty, \frac{17}{8} \right\rangle i odczytaj największą liczbę całkowitą:
    2.'
  answer:
    kind: MULTIPART
    parts:
    - name: zbior_rozwiazan
      answer:
        kind: INTERVAL
        lo: -\infty
        hi: \frac{17}{8}
        hi_open: false
    - name: najwieksza_calkowita
      answer:
        kind: NUMERIC
        value: 2.0
  checks:
  - kind: solve_inequality
    expr: \left( \frac{1}{9} \right)^{x-1} \ge 27^{2 \cdot x - 5}
    part: zbior_rozwiazan
  - kind: evaluate
    expr: \left\lfloor \frac{17}{8} \right\rfloor
    part: najwieksza_calkowita
  skills:
  - sprowadzanie obu stron nierówności do wspólnej podstawy
  - opuszczanie potęgowania przy podstawie większej od 1
