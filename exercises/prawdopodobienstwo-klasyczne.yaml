  exercise_type: prawdopodobieństwo przy dwóch rzutach kostką
  statement: Doświadczenie losowe polega na dwukrotnym rzucie symetryczną sześcienną kostką do gry, która
    na każdej ściance ma inną liczbę oczek — od jednego oczka do sześciu oczek. Wynik zapisujemy jako
    parę uporządkowaną (a, b), gdzie a to liczba oczek w pierwszym rzucie, a b — w drugim. Oblicz prawdopodobieństwo
    zdarzenia A polegającego na tym, że suma wyrzuconych oczek jest równa 9, oraz prawdopodobieństwo zdarzenia
    B polegającego na tym, że iloczyn wyrzuconych oczek jest liczbą nieparzystą. Zapisz obliczenia.
  statement_latex: '|\Omega|=6\cdot 6=36,\qquad P(A)=\frac{4}{36},\qquad P(B)=\frac{9}{36}'
  solution: |-
    Wyniki zapisujemy jako pary uporządkowane, dzięki czemu wszystkie zdarzenia elementarne są jednakowo prawdopodobne. Z reguły mnożenia |\Omega|=6\cdot 6=36.
    Zdarzenie A: a+b=9. Sprzyjające pary to (3,6), (4,5), (5,4), (6,3) — zatem |A|=4 i P(A)=\frac{4}{36}=\frac{1}{9}.
    Zdarzenie B: iloczyn a\cdot b jest nieparzysty dokładnie wtedy, gdy obie liczby są nieparzyste, czyli a\in\{1,3,5\} i b\in\{1,3,5\}. Z reguły mnożenia |B|=3\cdot 3=9, więc P(B)=\frac{9}{36}=\frac{1}{4}.
    Oba wyniki należą do przedziału [0,1].
  solution_steps:
  - 'Przyjmujemy \Omega jako zbiór par uporządkowanych: |\Omega|=6\cdot 6=36.'
  - 'Wypisujemy pary o sumie 9: (3,6), (4,5), (5,4), (6,3), więc |A|=4.'
  - P(A)=\frac{4}{36}=\frac{1}{9}.
  - 'Iloczyn jest nieparzysty, gdy obie liczby są nieparzyste: |B|=3\cdot 3=9.'
  - P(B)=\frac{9}{36}=\frac{1}{4}.
  answer:
    kind: MULTIPART
    parts:
    - name: P(A)
      answer:
        kind: SYMBOLIC
        latex: \frac{1}{9}
    - name: P(B)
      answer:
        kind: SYMBOLIC
        latex: \frac{1}{4}
  checks:
  - kind: evaluate
    expr: \frac{4}{6\cdot 6}
