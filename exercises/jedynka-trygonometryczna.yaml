  exercise_type: obliczenie wartości wyrażenia z kątami szczególnymi
  statement: Oblicz wartość wyrażenia W = 2\cdot\sin^{2}30^\circ + 3\cdot\cos^{2}30^\circ.
  statement_latex: W=2\cdot\sin^{2}30^\circ+3\cdot\cos^{2}30^\circ
  solution: |-
    BŁĘDNE ROZUMOWANIE (typowy błąd):
    Uczeń czyta \sin^{2}30^\circ jako \sin\left(2\cdot 30^\circ\right)=\sin 60^\circ=\frac{\sqrt{3}}{2} oraz \cos^{2}30^\circ jako \cos 60^\circ=\frac{1}{2} (albo jeszcze gorzej: jako \sin\left(30^{2}\right)=\sin 900^\circ). Wtedy otrzymuje
    W=2\cdot\frac{\sqrt{3}}{2}+3\cdot\frac{1}{2}=\sqrt{3}+\frac{3}{2}\approx 3{,}23 — wynik BŁĘDNY.

    DLACZEGO TO BŁĄD:
    Zapis \sin^{2}\alpha to tylko skrót na \left(\sin\alpha\right)^{2}. Kąt się nie zmienia — potęgowana jest wartość funkcji. \sin^{2}30^\circ\neq\sin 60^\circ i \sin^{2}30^\circ\neq\sin\left(900^\circ\right).

    POPRAWNE ROZWIĄZANIE:
    \sin 30^\circ=\frac{1}{2}, więc \sin^{2}30^\circ=\left(\frac{1}{2}\right)^{2}=\frac{1}{4}.
    \cos 30^\circ=\frac{\sqrt{3}}{2}, więc \cos^{2}30^\circ=\left(\frac{\sqrt{3}}{2}\right)^{2}=\frac{3}{4}.
    W=2\cdot\frac{1}{4}+3\cdot\frac{3}{4}=\frac{1}{2}+\frac{9}{4}=\frac{11}{4}.
    Kontrola: \sin^{2}30^\circ+\cos^{2}30^\circ=\frac{1}{4}+\frac{3}{4}=1 — zgodnie z jedynką trygonometryczną.
    Odpowiedź: W=\frac{11}{4}=2{,}75.
  solution_steps:
  - 'Błąd: odczytanie \sin^{2}30^\circ jako \sin 60^\circ (lub \sin 900^\circ) i otrzymanie \sqrt{3}+\frac{3}{2}.'
  - 'Korekta: \sin^{2}\alpha=\left(\sin\alpha\right)^{2} — najpierw wartość funkcji, potem kwadrat.'
  - \sin^{2}30^\circ=\frac{1}{4}, \cos^{2}30^\circ=\frac{3}{4}.
  - W=2\cdot\frac{1}{4}+3\cdot\frac{3}{4}=\frac{11}{4}.
