- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: kumulacja dawek leku — wzór ogólny i ocena bezpieczeństwa
  statement: |-
    Masa leku w organizmie po przyjęciu jednorazowej dawki m_{0} zmienia się zgodnie z zależnością m\left(t\right)=m_{0}\cdot\left(\frac{1}{2}\right)^{\frac{t}{T}}, gdzie T jest czasem półtrwania leku, a t — czasem liczonym od momentu przyjęcia tej dawki. Masy leku pozostałe z wszystkich wcześniej przyjętych dawek sumują się. Pacjent przyjmuje lek o czasie półtrwania T=8 godzin: pierwszą dawkę 120 mg o godzinie 8:00, a każdą następną dawkę 120 mg dokładnie co 8 godzin.
    a) Wyznacz wzór na masę M_{n} (w miligramach) leku w organizmie pacjenta w chwili tuż po przyjęciu n-tej dawki, gdzie n jest liczbą naturalną dodatnią.
    b) Oblicz masę leku w organizmie tuż po przyjęciu czwartej dawki oraz rozstrzygnij, czy przy takim schemacie przyjmowania leku masa leku w organizmie tego pacjenta może kiedykolwiek przekroczyć 250 mg. Odpowiedź uzasadnij.
  statement_latex: M_{n}=120\cdot\left(1+\frac{1}{2}+\frac{1}{4}+\ldots+\left(\frac{1}{2}\right)^{n-1}\right)=240\cdot\left(1-\left(\frac{1}{2}\right)^{n}\right)
  solution: |-
    a) W chwili przyjęcia n-tej dawki dawka o numerze k (k=1,2,\ldots,n) została przyjęta \left(n-k\right)\cdot 8 godzin wcześniej, więc pozostało z niej 120\cdot\left(\frac{1}{2}\right)^{\frac{\left(n-k\right)\cdot 8}{8}}=120\cdot\left(\frac{1}{2}\right)^{n-k} mg. Sumując po wszystkich dawkach:
    M_{n}=120\cdot\left(1+\frac{1}{2}+\left(\frac{1}{2}\right)^{2}+\ldots+\left(\frac{1}{2}\right)^{n-1}\right)=120\cdot\frac{1-\left(\frac{1}{2}\right)^{n}}{1-\frac{1}{2}}=240\cdot\left(1-\left(\frac{1}{2}\right)^{n}\right)\ \mathrm{mg}.
    Sprawdzenie: M_{1}=240\cdot\frac{1}{2}=120 mg. ✓
    b) M_{4}=240\cdot\left(1-\left(\frac{1}{2}\right)^{4}\right)=240\cdot\frac{15}{16}=225 mg.
    Między kolejnymi dawkami masa leku maleje, więc największe wartości masa przyjmuje dokładnie w momentach przyjęcia dawek, czyli są to liczby M_{n}. Ponieważ \left(\frac{1}{2}\right)^{n}>0 dla każdego n, mamy M_{n}=240-240\cdot\left(\frac{1}{2}\right)^{n}<240<250 mg.
    Odpowiedź: nie — masa leku w organizmie nigdy nie przekroczy 250 mg (pozostaje zawsze poniżej 240 mg).
  solution_steps:
  - Zauważ, że tuż po przyjęciu n-tej dawki z dawki numer k pozostało 120\cdot\left(\frac{1}{2}\right)^{n-k}
    mg.
  - 'Zsumuj wkłady wszystkich dawek: M_{n}=120\cdot\left(1+\frac{1}{2}+\ldots+\left(\frac{1}{2}\right)^{n-1}\right).'
  - 'Zsumuj skończony ciąg geometryczny: M_{n}=240\cdot\left(1-\left(\frac{1}{2}\right)^{n}\right) mg.'
  - 'Podstaw n=4: M_{4}=240\cdot\frac{15}{16}=225 mg.'
  - Zauważ, że maksima masy występują w momentach przyjęcia dawek, a M_{n}<240 dla każdego n, bo \left(\frac{1}{2}\right)^{n}>0.
  - 'Wniosek: 240<250, więc masa leku nigdy nie przekroczy 250 mg.'
