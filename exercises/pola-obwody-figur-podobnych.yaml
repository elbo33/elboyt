  solution: |-
    Najpierw pole całego trójkąta. Wysokość opuszczona z C na AB dzieli podstawę na połowy, więc
    h = \sqrt{10^{2}-6^{2}} = \sqrt{100-36} = 8 cm, a P_{ABC} = \frac{1}{2}\cdot 12 \cdot 8 = 48 cm².
    Trójkąty CDE i CAB są podobne (kąt przy C wspólny, kąty odpowiadające przy DE ∥ AB). Niech k będzie skalą podobieństwa trójkąta CDE do trójkąta CAB, k > 0.
    Trapez ABED jest różnicą tych trójkątów, więc P_{ABED} = P_{ABC}\left(1-k^{2}\right):
    48\left(1-k^{2}\right) = 21, stąd 1-k^{2} = \frac{21}{48} = \frac{7}{16}, czyli k^{2} = \frac{9}{16}.
    Ponieważ k > 0 (i dodatkowo 0 < k < 1, bo odcięty trójkąt jest mniejszy), przyjmujemy k = \frac{3}{4}; wartość k = -\frac{3}{4} odrzucamy.
    Wtedy |DE| = k \cdot |AB| = \frac{3}{4}\cdot 12 = 9 cm oraz |CD| = |CE| = \frac{3}{4}\cdot 10 = 7{,}5 cm.
    Stąd |DA| = |EB| = 10 - 7{,}5 = 2{,}5 cm.
    Obwód trapezu ABED = |AB| + |BE| + |ED| + |DA| = 12 + 2{,}5 + 9 + 2{,}5 = 26 cm.
    Sprawdzenie: pole trójkąta CDE = \left(\frac{3}{4}\right)^{2}\cdot 48 = 27 cm², a 48 - 27 = 21 cm². Zgadza się.
    Odpowiedź: |DE| = 9 cm, obwód trapezu ABED = 26 cm.
  solution_steps:
  - 'Oblicz wysokość trójkąta ABC: h = \sqrt{10^{2}-6^{2}} = 8 cm, a następnie P_{ABC} = \frac{1}{2}\cdot
    12\cdot 8 = 48 cm².'
