- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 2
  exercise_type: promienie okręgów w wielokącie foremnym
  statement: Dany jest sześciokąt foremny o boku długości 8. Oblicz promień R okręgu opisanego na tym
    sześciokącie oraz promień r okręgu wpisanego w ten sześciokąt (apotemę).
  statement_latex: a=8,\qquad R=a,\qquad r=\frac{a\cdot\sqrt{3}}{2}
  solution: |-
    Kąt środkowy sześciokąta foremnego wynosi 360°/6 = 60°, więc trójkąt środkowy o ramionach R i podstawie a jest równoramienny z kątem 60° przy wierzchołku — czyli jest równoboczny.
    Stąd R = a = 8.
    Apotema r jest wysokością tego trójkąta równobocznego o boku 8:
    r = (8·√3)/2 = 4√3.
    Odpowiedź: R = 8, r = 4√3 ≈ 6,93 (zgodnie z regułą r < R).
  solution_steps:
  - 'Oblicz kąt środkowy: 360°/6 = 60°.'
  - Zauważ, że trójkąt środkowy jest równoboczny, więc R = a = 8.
  - 'Apotema to wysokość tego trójkąta: r = (8·√3)/2 = 4√3.'
  - 'Sprawdź nierówność r < R: 4√3 ≈ 6,93 < 8. ✓'
  answer:
    kind: MULTIPART
    parts:
    - name: R
      answer:
        kind: NUMERIC
        value: 8.0
    - name: r
      answer:
        kind: SYMBOLIC
        latex: 4\sqrt{3}
  checks:
