      ; [pole] SymPy solved it fresh: 240.0 vs 240.0 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: przekątna prostokąta i kąt z bokiem
  statement: Dany jest prostokąt ABCD, w którym |AB| = 12 oraz |BC| = 5. Przekątne AC i BD przecinają
    się w punkcie S. Oblicz długość przekątnej AC, promień okręgu opisanego na tym prostokącie oraz sinus
    kąta ostrego, jaki przekątna AC tworzy z bokiem AB. Zapisz obliczenia.
  statement_latex: \left|AC\right| = \sqrt{12^{2}+5^{2}},\qquad R = \frac{\left|AC\right|}{2},\qquad \sin\alpha
    = \frac{5}{\left|AC\right|}
  solution: |-
    Trójkąt ABC jest prostokątny (kąt przy B jest prosty), więc z twierdzenia Pitagorasa:
    |AC|² = 12² + 5² = 144 + 25 = 169, czyli |AC| = 13.
    W prostokącie przekątne są równe i dzielą się na połowy, więc |AS| = |BS| = |CS| = |DS| = 13/2. Punkt S jest środkiem okręgu opisanego na prostokącie, a jego promień to R = 13/2 = 6,5.
    Kąt α = |∡CAB| leży w trójkącie prostokątnym ABC naprzeciw przyprostokątnej BC, zatem
    sin α = |BC| / |AC| = 5/13.
    Odpowiedź: |AC| = 13, R = 6,5, sin α = 5/13.
  solution_steps:
  - Zauważ, że trójkąt ABC jest prostokątny o przyprostokątnych 12 i 5.
  - 'Z twierdzenia Pitagorasa: |AC| = √(144 + 25) = 13.'
  - 'Promień okręgu opisanego: R = d/2 = 13/2 = 6,5.'
  - 'Sinus kąta między AC a AB: sin α = |BC|/|AC| = 5/13.'
  answer:
    kind: MULTIPART
    parts:
    - name: dlugosc AC
      answer:
        kind: NUMERIC
        value: 13.0
    - name: promien R
      answer:
        kind: NUMERIC
        value: 6.5
    - name: sinus kata
      answer:
        kind: SYMBOLIC
        latex: \frac{5}{13}
  checks:
  - kind: evaluate
    expr: \sqrt{12^{2}+5^{2}}
    part: dlugosc AC
  - kind: evaluate
    expr: \frac{\sqrt{12^{2}+5^{2}}}{2}
    part: promien R
  - kind: evaluate
    expr: \frac{5}{\sqrt{12^{2}+5^{2}}}
    part: sinus kata
  skills:
  - przekątna prostokąta
  - promień okręgu opisanego na prostokącie
  - funkcje trygonometryczne kąta ostrego
  verification:
