  difficulty: 1
  exercise_type: obliczanie wartości funkcji trygonometrycznych z danych boków
  statement: Dany jest trójkąt prostokątny ABC, w którym kąt przy wierzchołku A jest kątem prostym, |AB|
    = 8, |AC| = 15, a przeciwprostokątna |BC| = 17. Kąt ABC oznaczmy przez \beta. Oblicz \sin\beta, \cos\beta
    oraz \operatorname{tg}\beta.
  statement_latex: \sin\beta=\frac{|AC|}{|BC|},\qquad \cos\beta=\frac{|AB|}{|BC|},\qquad \operatorname{tg}\beta=\frac{|AC|}{|AB|}
  solution: |-
    Kąt prosty jest przy wierzchołku A, więc przyprostokątnymi są AB oraz AC, a przeciwprostokątną jest BC.
    Patrzymy z wierzchołka B (na kąt \beta):
    – naprzeciw kąta \beta leży przyprostokątna AC o długości 15,
    – przy kącie \beta leży przyprostokątna AB o długości 8,
    – przeciwprostokątna to BC o długości 17.
    Stąd z definicji:
    \sin\beta=\frac{15}{17}\approx 0{,}88, \qquad \cos\beta=\frac{8}{17}\approx 0{,}47, \qquad \operatorname{tg}\beta=\frac{15}{8}=1{,}875.
    Kontrola: sinus i cosinus wyszły z przedziału (0,1). ✓
  solution_steps:
  - 'Wskaż przeciwprostokątną: leży naprzeciw kąta prostego, czyli |BC| = 17.'
  - 'Podpisz boki względem kąta \beta: naprzeciw AC = 15, przy AB = 8.'
  - Zapisz sin\beta = \frac{15}{17} (naprzeciw przez przeciwprostokątną).
  - Zapisz cos\beta = \frac{8}{17} (przy przez przeciwprostokątną).
  - Zapisz tg\beta = \frac{15}{8} (naprzeciw przez przy).
  - Sprawdź, że sinus i cosinus są mniejsze od 1.
  answer:
    kind: MULTIPART
    parts:
    - name: sin beta
      answer:
        kind: SYMBOLIC
        latex: \frac{15}{17}
    - name: cos beta
      answer:
        kind: SYMBOLIC
        latex: \frac{8}{17}
    - name: tg beta
      answer:
        kind: SYMBOLIC
        latex: \frac{15}{8}
  checks:
  - kind: evaluate
    expr: \frac{15}{17}
    part: sin beta
  - kind: evaluate
    expr: \frac{8}{17}
    part: cos beta
  - kind: evaluate
    expr: \frac{15}{8}
    part: tg beta
  skills:
  - rozpoznawanie boku naprzeciw i przy kącie
  - definicje sin, cos, tg kąta ostrego
  verification:
