  statement_latex: f(x)=\frac{4}{x},\qquad f\left(-0{,}5\right),\ f\left(0{,}5\right)
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: „Wykres jest jedną ciągłą krzywą, więc przechodząc od wartości ujemnych do dodatnich musi przeciąć oś OY (i po drodze oś OX)”. Prowadzi to do błędnej odpowiedzi: 1 punkt wspólny z osią OY.
    OBLICZENIA: f\left(-0{,}5\right)=\frac{4}{-0{,}5}=-8 oraz f\left(0{,}5\right)=\frac{4}{0{,}5}=8. Widać, że przy zbliżaniu się do zera od lewej wartości maleją nieograniczenie (-8, -40, -400 dla x=-0{,}1;\ -0{,}01), a od prawej rosną nieograniczenie. Wykres nie „przechodzi” przez okolice punktu \left(0,\ 0\right), tylko ucieka wzdłuż osi OY.
