    BŁĘDNE ROZUMOWANIE: uczeń przyjął \cos 150^{\circ}=\cos 30^{\circ}=\frac{\sqrt{3}}{2} i otrzymał
    W = 2\cdot\frac{\sqrt{3}}{2}+\sqrt{3}\cdot\frac{1}{2}=\sqrt{3}+\frac{\sqrt{3}}{2}=\frac{3\sqrt{3}}{2} — odpowiedź błędna.
    GDZIE JEST BŁĄD: punkty okręgu jednostkowego odpowiadające kątom \alpha oraz 180^{\circ}-\alpha są symetryczne względem osi OY, a taka symetria zmienia znak pierwszej współrzędnej, czyli cosinusa. Prawidłowy wzór to \cos\left(180^{\circ}-\alpha\right)=-\cos\alpha. Szybka kontrola: cosinus kąta rozwartego musi być ujemny.
    POPRAWNIE: \cos 150^{\circ}=-\cos 30^{\circ}=-\frac{\sqrt{3}}{2}, a \sin 150^{\circ}=\sin 30^{\circ}=\frac{1}{2}. Zatem
    W = 2\cdot\left(-\frac{\sqrt{3}}{2}\right)+\sqrt{3}\cdot\frac{1}{2}=-\sqrt{3}+\frac{\sqrt{3}}{2}=-\frac{\sqrt{3}}{2}.
