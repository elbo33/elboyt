- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: wyrażenia symetryczne z daną sumą \sin\alpha+\cos\alpha
  statement: 'Kąt \alpha jest ostry oraz \sin\alpha + \cos\alpha = \frac{6}{5}. Oblicz: a) \sin\alpha\cdot\cos\alpha,
    b) \left|\sin\alpha - \cos\alpha\right|, c) \sin^{3}\alpha + \cos^{3}\alpha.'
  statement_latex: \sin\alpha+\cos\alpha=\frac{6}{5}
  solution: |-
    a) Podnosimy daną równość do kwadratu:
    \left(\sin\alpha+\cos\alpha\right)^{2}=\left(\frac{6}{5}\right)^{2}=\frac{36}{25}.
    Z drugiej strony \left(\sin\alpha+\cos\alpha\right)^{2}=\sin^{2}\alpha+2\sin\alpha\cos\alpha+\cos^{2}\alpha=1+2\sin\alpha\cos\alpha.
    Zatem 1+2\sin\alpha\cos\alpha=\frac{36}{25}, czyli 2\sin\alpha\cos\alpha=\frac{11}{25} i \sin\alpha\cos\alpha=\frac{11}{50}.
    b) \left(\sin\alpha-\cos\alpha\right)^{2}=1-2\sin\alpha\cos\alpha=1-\frac{11}{25}=\frac{14}{25}.
    Ponieważ \sqrt{x^{2}}=|x|, mamy \left|\sin\alpha-\cos\alpha\right|=\sqrt{\frac{14}{25}}=\frac{\sqrt{14}}{5}.
    c) Ze wzoru a^{3}+b^{3}=(a+b)\left(a^{2}-ab+b^{2}\right):
    \sin^{3}\alpha+\cos^{3}\alpha=\left(\sin\alpha+\cos\alpha\right)\left(1-\sin\alpha\cos\alpha\right)=\frac{6}{5}\cdot\left(1-\frac{11}{50}\right)=\frac{6}{5}\cdot\frac{39}{50}=\frac{117}{125}.
    Kontrola sensowności: dla kąta ostrego \sin\alpha+\cos\alpha\in(1;\sqrt{2}\,], a \frac{6}{5}=1{,}2 rzeczywiście należy do tego przedziału.
    Odpowiedź: \sin\alpha\cos\alpha=\frac{11}{50}, \left|\sin\alpha-\cos\alpha\right|=\frac{\sqrt{14}}{5}, \sin^{3}\alpha+\cos^{3}\alpha=\frac{117}{125}.
  solution_steps:
  - 'Podnieś \sin\alpha+\cos\alpha=\frac{6}{5} do kwadratu i skorzystaj z jedynki: 1+2\sin\alpha\cos\alpha=\frac{36}{25}.'
  - Wyznacz \sin\alpha\cos\alpha=\frac{11}{50}.
  - 'Oblicz \left(\sin\alpha-\cos\alpha\right)^{2}=1-\frac{11}{25}=\frac{14}{25} i weź pierwiastek: \left|\sin\alpha-\cos\alpha\right|=\frac{\sqrt{14}}{5}.'
  - 'Zastosuj a^{3}+b^{3}=(a+b)\left(1-\sin\alpha\cos\alpha\right): \sin^{3}\alpha+\cos^{3}\alpha=\frac{6}{5}\cdot\frac{39}{50}=\frac{117}{125}.'
  answer:
    kind: MULTIPART
    parts:
    - name: iloczyn
      answer:
        kind: SYMBOLIC
        latex: \frac{11}{50}
    - name: modul_roznicy
      answer:
        kind: SYMBOLIC
        latex: \frac{\sqrt{14}}{5}
    - name: suma_szescianow
      answer:
        kind: SYMBOLIC
        latex: \frac{117}{125}
  checks:
  - kind: evaluate
    expr: \frac{\left(\frac{6}{5}\right)^{2}-1}{2}
    part: iloczyn
  - kind: evaluate
    expr: \sqrt{1-2\cdot\frac{11}{50}}
    part: modul_roznicy
  - kind: evaluate
    expr: \frac{6}{5}\cdot\left(1-\frac{11}{50}\right)
    part: suma_szescianow
  skills:
  - (\sin\alpha\pm\cos\alpha)^{2}=1\pm 2\sin\alpha\cos\alpha
  - wzór na sumę sześcianów
  - pierwiastek z kwadratu i wartość bezwzględna
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [iloczyn] SymPy solved it fresh: 0.22 vs 0.22 (tol 1e-09) ;
