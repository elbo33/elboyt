  - 'Wstaw \left(n+1\right) w miejsce każdego n: a_{n+1}=\left(n+1\right)^{2}-3\cdot\left(n+1\right).'
  - 'Rozwiń nawiasy i zredukuj: n^{2}+2n+1-3n-3=n^{2}-n-2.'
  answer:
