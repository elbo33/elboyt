- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: trapez równoramienny — ramię, wysokość, pole
  statement: W trapezie równoramiennym ABCD podstawy mają długości |AB| = 12 i |CD| = 6, a kąty przy dłuższej
    podstawie AB mają miarę 60°. Oblicz długość ramienia, wysokość oraz pole tego trapezu. Wyniki podaj
    w postaci dokładnej.
  statement_latex: '|AB|=12,\ |CD|=6,\ \alpha=60^\circ,\quad p=\frac{12-6}{2},\quad \cos 60^\circ=\frac{p}{c},\quad
    h=c\cdot\sin 60^\circ,\quad P=\frac{1}{2}\cdot\left(12+6\right)\cdot h'
  solution: |-
    Z wierzchołków C i D prowadzimy wysokości na podstawę AB. Odcinają one na AB środkowy odcinek długości 6 oraz dwa przystające trójkąty prostokątne.

    1) Rzut ramienia na dłuższą podstawę:
    \[p=\frac{12-6}{2}=3.\]

    2) Ramię c: odcinek p leży PRZY kącie 60°, a c jest przeciwprostokątną, więc
    \[\cos 60^\circ=\frac{3}{c}\ \Rightarrow\ \frac{1}{2}=\frac{3}{c}\ \Rightarrow\ c=\frac{3}{\frac{1}{2}}=6.\]

    3) Wysokość:
    \[h=c\cdot\sin 60^\circ=6\cdot\frac{\sqrt3}{2}=3\sqrt3 .\]
    Kontrola Pitagorasem: \(3^2+\left(3\sqrt3\right)^2=9+27=36=6^2\). ✓

    4) Pole:
    \[P=\frac{1}{2}\cdot\left(12+6\right)\cdot 3\sqrt3=9\cdot 3\sqrt3=27\sqrt3 .\]

    Odpowiedź: ramię 6, wysokość \(3\sqrt3\), pole \(27\sqrt3\).
  solution_steps:
  - Poprowadź wysokości z C i D na AB; rzut ramienia p = (12 − 6)/2 = 3.
  - 'W trójkącie prostokątnym p leży przy kącie 60°, ramię jest przeciwprostokątną: cos 60° = 3/c, stąd
    c = 6.'
  - 'Oblicz wysokość: h = 6·sin 60° = 3√3 (kontrola twierdzeniem Pitagorasa).'
  - 'Podstaw do wzoru na pole trapezu: P = ½·(12+6)·3√3 = 27√3.'
  answer:
    kind: MULTIPART
    parts:
