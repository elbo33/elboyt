  - 'Dodaj wykładniki: \(\frac{1}{2}+\frac{1}{3}=\frac{5}{6}\).'
  - Zapisz wynik jako potęgę \(7^{\frac{5}{6}}\) i jako pierwiastek \(\sqrt[6]{7^{5}}\).
