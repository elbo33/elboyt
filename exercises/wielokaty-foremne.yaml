  exercise_type: wielokąt foremny a okrąg wpisany
  statement: W trójkąt równoboczny wpisano okrąg o promieniu r = 4\sqrt{3}. Oblicz długość boku tego trójkąta,
    jego pole oraz pole obszaru zawartego między trójkątem a kołem (czyli tę część trójkąta, która leży
    poza kołem).
  statement_latex: r=\frac{a\sqrt{3}}{6}=4\sqrt{3},\qquad P=\frac{a^{2}\sqrt{3}}{4},\qquad P_{obszaru}=P-\pi\cdot
    r^{2}
  solution: |-
    Okrąg wpisany dotyka boków trójkąta, więc jego promień to apotema: r=\frac{a\sqrt{3}}{6}.
    Z równania \frac{a\sqrt{3}}{6}=4\sqrt{3} otrzymujemy a\sqrt{3}=24\sqrt{3}, czyli a=24.
    Pole trójkąta: P=\frac{a^{2}\sqrt{3}}{4}=\frac{24^{2}\sqrt{3}}{4}=\frac{576\sqrt{3}}{4}=144\sqrt{3}.
    Pole koła: P_{k}=\pi\cdot r^{2}=\pi\cdot\left(4\sqrt{3}\right)^{2}=48\pi.
    Pole obszaru między trójkątem a kołem: P-P_{k}=144\sqrt{3}-48\pi\approx 249{,}42-150{,}80\approx 98{,}62.
    Odpowiedź: a = 24, P = 144\sqrt{3}, pole obszaru = 144\sqrt{3}-48\pi.
  solution_steps:
  - 'Zauważ, że promień okręgu wpisanego to apotema trójkąta równobocznego: r=\frac{a\sqrt{3}}{6}.'
  - Rozwiąż równanie \frac{a\sqrt{3}}{6}=4\sqrt{3}, otrzymując a=24.
  - 'Oblicz pole trójkąta: P=\frac{24^{2}\sqrt{3}}{4}=144\sqrt{3}.'
  - 'Oblicz pole koła: \pi\cdot\left(4\sqrt{3}\right)^{2}=48\pi.'
  - 'Odejmij pola: 144\sqrt{3}-48\pi.'
  answer:
