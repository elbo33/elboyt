- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: prawa działań na potęgach
  statement: Wyrażenie \(\frac{2^{7}\cdot 2^{-3}}{2^{2}}\) zapisz w postaci jednej potęgi liczby 2 oraz
    oblicz jego wartość.
  statement_latex: \frac{2^{7}\cdot 2^{-3}}{2^{2}}
  solution: |-
    W liczniku mnożymy potęgi o tej samej podstawie, więc dodajemy wykładniki:
    \[2^{7}\cdot 2^{-3}=2^{7+(-3)}=2^{4}.\]
    Następnie dzielimy potęgi o tej samej podstawie, więc odejmujemy wykładniki:
    \[\frac{2^{4}}{2^{2}}=2^{4-2}=2^{2}.\]
    Wartość: \(2^{2}=4\).
    Odpowiedź: \(2^{2}=4\).
  solution_steps:
  - 'W liczniku dodaj wykładniki: \(2^{7}\cdot 2^{-3}=2^{4}\).'
  - 'Przy dzieleniu odejmij wykładniki: \(\frac{2^{4}}{2^{2}}=2^{2}\).'
  - 'Oblicz wartość: \(2^{2}=4\).'
  answer:
    kind: MULTIPART
    parts:
    - name: postać potęgowa
      answer:
        kind: SYMBOLIC
        latex: 2^{2}
    - name: wartość
      answer:
        kind: NUMERIC
        value: 4.0
  checks:
  - kind: simplify
    expr: \frac{2^{7}\cdot 2^{-3}}{2^{2}}
    part: postać potęgowa
  - kind: evaluate
    expr: \frac{2^{7}\cdot 2^{-3}}{2^{2}}
    part: wartość
