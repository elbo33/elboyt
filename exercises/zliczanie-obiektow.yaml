    Poprawne rozwiązanie — przez dopełnienie:
    Wszystkich wyników trzech rzutów: 6^3 = 216.
    Zaprzeczeniem warunku „co najmniej jedna szóstka” jest „ani razu nie wypadła szóstka”, czyli w każdym rzucie wynik ze zbioru {1,2,3,4,5}: 5^3 = 125.
    N = 216 − 125 = 91.
    Kontrola sensowności: 91 < 216 ✓, a błędny wynik 108 jest większy od liczby wszystkich wyników z szóstką i zawyżony właśnie o wyniki policzone wielokrotnie.

    Odpowiedź: 91 wyników (wynik 108 jest błędny).
  solution_steps:
