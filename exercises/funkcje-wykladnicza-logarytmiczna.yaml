  solution: |-
    Błędne rozumowanie: uczeń policzył logarytm liczby ujemnej. Z definicji \log_{a}b = c \iff a^{c} = b, przy czym b > 0 — nie istnieje wykładnik c taki, że 3^{c} = -3, bo potęga liczby dodatniej jest dodatnia (w szczególności 3^{-1} = \frac{1}{3} > 0). Zatem f(4) w ogóle nie jest określone.

    Korekta:
    a) Dziedzinę wyznaczamy z warunku 5 - 2x > 0, czyli 2x < 5, stąd x < \frac{5}{2}. Dziedzina: D = \left(-\infty,\ \frac{5}{2}\right). Liczba 4 do niej nie należy, więc f(4) nie istnieje.
    b) x = 1 należy do dziedziny: f(1) = \log_{3}\left(5 - 2\cdot 1\right) = \log_{3}3 = 1.
  solution_steps:
  - 'Wskazujemy błąd: logarytmować można tylko liczby dodatnie, więc \log_{3}(-3) nie istnieje.'
  - 'Zapisujemy warunek dziedziny: 5-2x>0.'
  - 'Rozwiązujemy: x<\frac{5}{2}, czyli D=\left(-\infty,\frac{5}{2}\right); punkt x=4 nie należy do dziedziny.'
  - Obliczamy f(1)=\log_{3}\left(5-2\cdot 1\right)=\log_{3}3=1.
  answer:
