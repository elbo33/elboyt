- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie: pole trójkąta jako funkcja tangensa'
  statement: |-
    W trójkącie prostokątnym ABC kąt przy wierzchołku C jest prosty, a przeciwprostokątna AB ma długość 10. Kąt ostry przy wierzchołku A ma miarę α. Przyjmij oznaczenie t = tg α.
    a) Wyznacz wzór na pole P tego trójkąta w zależności od t i podaj dziedzinę tak otrzymanej funkcji.
    b) Wiedząc, że pole tego trójkąta jest równe 24 oraz że α > 45°, oblicz t, a następnie sin α i cos α.
  statement_latex: P\left(t\right) = \frac{50\cdot t}{1 + t^{2}},\qquad \frac{50\cdot t}{1 + t^{2}} =
    24
  solution: |-
    a) Kąt α jest kątem ostrym przy wierzchołku A, a przeciwprostokątna AB ma długość 10, więc przyprostokątne mają długości
    |BC| = 10\cdot\sin\alpha (naprzeciw kąta α) oraz |AC| = 10\cdot\cos\alpha.
    Pole trójkąta prostokątnego to połowa iloczynu przyprostokątnych:
    P = \frac{1}{2}\cdot 10\cdot\sin\alpha\cdot 10\cdot\cos\alpha = 50\cdot\sin\alpha\cdot\cos\alpha.
    Wyrażamy sin α i cos α przez t = tg α: z sin α = t·cos α i jedynki trygonometrycznej mamy \cos^{2}\alpha\cdot\left(1 + t^{2}\right) = 1, czyli \cos\alpha = \frac{1}{\sqrt{1 + t^{2}}} oraz \sin\alpha = \frac{t}{\sqrt{1 + t^{2}}} (znak plus, bo kąt ostry). Zatem
    \sin\alpha\cdot\cos\alpha = \frac{t}{1 + t^{2}}, a stąd
    P\left(t\right) = \frac{50\cdot t}{1 + t^{2}}.
    Dla kąta ostrego 0° < α < 90° tangens przyjmuje wszystkie wartości dodatnie, więc dziedziną jest przedział \left(0;\ +\infty\right).
    b) Rozwiązujemy równanie \frac{50\cdot t}{1 + t^{2}} = 24. Mianownik 1 + t² jest dodatni, więc
    50\cdot t = 24 + 24\cdot t^{2}, czyli 24\cdot t^{2} - 50\cdot t + 24 = 0, po podzieleniu przez 2: 12\cdot t^{2} - 25\cdot t + 12 = 0.
    \Delta = \left(-25\right)^{2} - 4\cdot 12\cdot 12 = 625 - 576 = 49, \sqrt{\Delta} = 7.
    t = \frac{25 - 7}{24} = \frac{3}{4} lub t = \frac{25 + 7}{24} = \frac{4}{3}. Oba należą do dziedziny (pole 24 jest osiągalne, bo największe możliwe pole to 50·sin α·cos α ≤ 25).
    Warunek α > 45° oznacza tg α > tg 45° = 1, więc odrzucamy t = \frac{3}{4} i przyjmujemy t = \frac{4}{3}.
    Wtedy \cos\alpha = \frac{1}{\sqrt{1 + \left(\frac{4}{3}\right)^{2}}} = \frac{1}{\frac{5}{3}} = \frac{3}{5} oraz \sin\alpha = \frac{4}{3}\cdot\frac{3}{5} = \frac{4}{5}.
    Sprawdzenie: przyprostokątne mają wtedy długości 8 i 6, a pole \frac{1}{2}\cdot 8\cdot 6 = 24. Zgadza się.
    Odpowiedź: P(t) = \frac{50\cdot t}{1 + t^{2}} dla t ∈ (0; +∞); t = \frac{4}{3}, sin α = \frac{4}{5}, cos α = \frac{3}{5}.
  solution_steps:
  - 'Zapisz długości przyprostokątnych: |BC| = 10 sin α, |AC| = 10 cos α.'
  - 'Ułóż wzór na pole: P = 50·sin α·cos α.'
  - 'Wyraź sin α i cos α przez t = tg α (z sin α = t cos α i jedynki): sin α cos α = t/(1+t²), więc P(t)
    = 50t/(1+t²).'
  - 'Podaj dziedzinę: t ∈ (0; +∞), bo α jest kątem ostrym.'
  - Rozwiąż równanie 50t/(1+t²) = 24, czyli 12t² − 25t + 12 = 0; Δ = 49, t = 3/4 lub t = 4/3 (pole 24
    jest osiągalne, bo P ≤ 25).
  - Odrzuć t = 3/4, bo z α > 45° wynika tg α > 1; przyjmij t = 4/3.
  - Oblicz cos α = 1/√(1+t²) = 3/5 oraz sin α = t·cos α = 4/5.
