    = 3". Wskaż błąd w tym zapisie i podaj poprawne wartości.'
  statement_latex: f\left(x\right)=x^{2}-4\cdot x
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: f(−3) = −3² − 4·−3 = −9 + 12 = 3.
    NA CZYM POLEGA BŁĄD: uczeń nie ujął podstawianej liczby ujemnej w nawias. Zapis −3² oznacza −(3²) = −9, a to zupełnie co innego niż (−3)² = 9. Podstawiany argument ZAWSZE ujmujemy w nawias.
    POPRAWNE ROZWIĄZANIE:
    f(−3) = (−3)² − 4·(−3) = 9 + 12 = 21.
    f(−1/2) = (−1/2)² − 4·(−1/2) = 1/4 + 2 = 9/4.
    Odpowiedź: f(−3) = 21, f(−1/2) = 9/4 = 2,25. Błędny wynik ucznia (3) różni się od poprawnego (21) właśnie o skutek brakującego nawiasu.
  solution_steps:
