- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: procent składany — kapitalizacja kwartalna
  statement: Pani Anna wpłaciła 12 000 zł na dwuletnią lokatę o nominalnym oprocentowaniu 6% w skali roku,
    z kapitalizacją kwartalną. Podatku od odsetek nie uwzględniamy. Oblicz wartość lokaty po dwóch latach
    oraz łączną kwotę odsetek. Wyniki podaj z dokładnością do 1 grosza. Zapisz obliczenia.
  statement_latex: K = 12000\cdot\left(1+\frac{6}{100\cdot 4}\right)^{4\cdot 2}
  solution: |-
    Kapitalizacja kwartalna oznacza, że jeden okres to kwartał, a stopa w jednym okresie wynosi \frac{6\%}{4} = 1{,}5\%. Mnożnik jednego okresu to q = 1 + \frac{1{,}5}{100} = 1{,}015.
    Liczba okresów: N = 4\cdot 2 = 8.
    K = 12000\cdot 1{,}015^{8}. Ponieważ 1{,}015^{8} \approx 1{,}1264926, mamy K \approx 12000\cdot 1{,}1264926 = 13517{,}91 zł.
    Odsetki: K - K_0 \approx 13517{,}91 - 12000 = 1517{,}91 zł.
    Odpowiedź: po dwóch latach na lokacie będzie około 13 517,91 zł, a odsetki wyniosą około 1517,91 zł.
  solution_steps:
  - 'Oblicz stopę na jeden kwartał: 6% : 4 = 1,5%, czyli q = 1,015.'
  - 'Oblicz liczbę okresów kapitalizacji: N = 4\cdot 2 = 8.'
  - Zapisz K = 12000\cdot 1,015^{8}.
  - Oblicz 1,015^8 ≈ 1,1264926 i K ≈ 13517,91 zł (zaokrąglenie dopiero na końcu).
  - Oblicz odsetki jako K - 12000 ≈ 1517,91 zł.
  answer:
    kind: MULTIPART
    parts:
    - name: wartość lokaty po 2 latach (zł)
      answer:
        kind: NUMERIC
        value: 13517.91
        tol: 0.02
    - name: kwota odsetek (zł)
      answer:
        kind: NUMERIC
        value: 1517.91
        tol: 0.02
  checks:
  - kind: evaluate
    expr: 12000\cdot\left(1+\frac{6}{100\cdot 4}\right)^{8}
    part: wartość lokaty po 2 latach (zł)
  - kind: evaluate
    expr: 12000\cdot\left(1+\frac{6}{100\cdot 4}\right)^{8}-12000
    part: kwota odsetek (zł)
  skills:
  - stopa w okresie kapitalizacji
  - liczba okresów
  - procent składany
  - obliczanie odsetek
  - zaokrąglanie do groszy
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [wartość lokaty po 2 latach (zł)] SymPy solved it fresh: 13517.91
      vs 13517.911039143683 (tol 0.02) ; [kwota odsetek (zł)] SymPy solved it fresh: 1517.91 vs 1517.9110391436832
      (tol 0.02)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: 'zadanie mieszane: ciąg arytmetyczny → geometryczny'
  statement: Trzy liczby tworzą ciąg arytmetyczny, a ich suma jest równa 21. Jeżeli do pierwszej z tych
    liczb dodamy 1, od drugiej odejmiemy 1, a do trzeciej dodamy 5, to otrzymane liczby (w tej samej kolejności)
    utworzą ciąg geometryczny. Wyznacz wszystkie trójki liczb spełniające warunki zadania. Zapisz obliczenia.
  statement_latex: \left(a-r\right)+a+\left(a+r\right)=21,\qquad 6^{2}=\left(8-r\right)\cdot\left(12+r\right)
  solution: |-
    Oznaczmy szukane liczby jako a-r,\ a,\ a+r.
    Z warunku na sumę: (a-r)+a+(a+r) = 3a = 21, więc a = 7. Liczby to 7-r,\ 7,\ 7+r.
    Po zmianach otrzymujemy: (7-r)+1 = 8-r, \ 7-1 = 6, \ (7+r)+5 = 12+r.
    Warunek ciągu geometrycznego: 6^{2} = (8-r)(12+r), czyli 36 = 96 + 8r - 12r - r^{2}, stąd r^{2} + 4r - 60 = 0.
    \Delta = 16 + 240 = 256, \sqrt{\Delta} = 16, więc r = \frac{-4-16}{2} = -10 lub r = \frac{-4+16}{2} = 6.
    Dla r = 6: liczby 1,\ 7,\ 13; po zmianie 2,\ 6,\ 18 — ciąg geometryczny o ilorazie 3, bo 6^{2} = 2\cdot 18 = 36.
    Dla r = -10: liczby 17,\ 7,\ -3; po zmianie 18,\ 6,\ 2 — ciąg geometryczny o ilorazie \tfrac{1}{3}, bo 6^{2} = 18\cdot 2 = 36.
    Odpowiedź: szukane liczby to 1, 7, 13 albo 17, 7, -3.
  solution_steps:
  - Oznacz liczby a-r, a, a+r i z sumy 3a = 21 wyznacz a = 7.
  - 'Zapisz liczby po zmianie: 8-r, 6, 12+r.'
  - Zastosuj warunek ciągu geometrycznego 6^2 = (8-r)(12+r).
  - 'Doprowadź do równania kwadratowego r^2 + 4r - 60 = 0 i rozwiąż je: r = 6 lub r = -10.'
  - Odtwórz obie trójki liczb i sprawdź oba warunki zadania.
  answer:
    kind: MULTIPART
    parts:
    - name: możliwe wartości różnicy r
      answer:
        kind: SET
        members:
        - '6'
        - '-10'
    - name: trójka liczb dla r = 6
      answer:
        kind: TUPLE
        items:
        - '1'
        - '7'
        - '13'
    - name: trójka liczb dla r = -10
      answer:
        kind: TUPLE
        items:
        - '17'
        - '7'
        - '-3'
  checks:
  - kind: solve_equation
    expr: r^{2}+4\cdot r-60=0
    var: r
    part: możliwe wartości różnicy r
  skills:
  - oznaczenia a-r, a, a+r
  - warunek b^2 = a\cdot c
  - równanie kwadratowe
  - uwzględnienie obu rozwiązań
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: kind mismatch: answer=MULTIPART reference=SET'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: procent składany z kapitalizacją półroczną i podatkiem
  statement: Pan Nowak wpłacił 12 000 zł na dwuletnią lokatę o nominalnym oprocentowaniu 6% w skali roku,
    z kapitalizacją półroczną. Od odsetek naliczonych na koniec każdego półrocza bank pobiera 19% podatku,
    a pozostałą część odsetek dopisuje do kapitału. Oblicz kwotę, jaką pan Nowak będzie miał na lokacie
    po dwóch latach, oraz łączną kwotę odsetek po opodatkowaniu. Wyniki podaj z dokładnością do 1 grosza.
    Zapisz obliczenia.
  statement_latex: K = 12000\cdot\left(1+\frac{6}{2\cdot 100}\cdot\left(1-\frac{19}{100}\right)\right)^{4}
  solution: |-
    Jeden okres kapitalizacji to pół roku, więc stopa w okresie wynosi \frac{6\%}{2}=3\%.
    Podatek zabiera 19% odsetek, więc do kapitału dopisywane jest 81% odsetek: mnożnik jednego półrocza to q = 1+\frac{3}{100}\cdot\frac{81}{100} = 1+0{,}0243 = 1{,}0243.
    W dwóch latach mieszczą się N = 2\cdot 2 = 4 okresy kapitalizacji, a ciąg kolejnych stanów konta jest geometryczny o ilorazie q, przy czym kapitał początkowy odpowiada zeru okresów.
    Zatem K = 12000\cdot 1{,}0243^{4}. Ponieważ 1{,}0243^{2} = 1{,}04919049 oraz 1{,}0243^{4} = 1{,}04919049^{2} \approx 1{,}10080069, otrzymujemy
    K \approx 12000\cdot 1{,}10080069 = 13209{,}6083 \approx 13209{,}61 zł.
    Odsetki po opodatkowaniu: K - 12000 \approx 13209{,}61 - 12000 = 1209{,}61 zł.
    Odpowiedź: po dwóch latach na lokacie będzie około 13 209,61 zł, a odsetki po opodatkowaniu wyniosą około 1209,61 zł.
  solution_steps:
  - 'Ustal długość okresu kapitalizacji: pół roku, stopa w okresie p = 6% : 2 = 3%.'
  - 'Uwzględnij podatek: mnożnik jednego okresu q = 1 + 0,03·0,81 = 1,0243.'
  - 'Policz liczbę okresów: N = 2 lata · 2 = 4.'
  - Zastosuj wzór K = 12000·1,0243^4 ≈ 13 209,61 zł.
  - 'Oblicz odsetki netto: 13 209,61 − 12 000 = 1209,61 zł i sformułuj odpowiedź.'
  answer:
    kind: MULTIPART
    parts:
    - name: kapital_po_2_latach
      answer:
        kind: NUMERIC
        value: 13209.61
        tol: 0.01
    - name: odsetki_netto
      answer:
        kind: NUMERIC
        value: 1209.61
        tol: 0.01
  checks:
  - kind: evaluate
    expr: 12000\cdot\left(1+\frac{3}{100}\cdot\frac{81}{100}\right)^{4}
    part: kapital_po_2_latach
  - kind: evaluate
    expr: 12000\cdot\left(1+\frac{3}{100}\cdot\frac{81}{100}\right)^{4}-12000
    part: odsetki_netto
  skills:
  - model geometryczny procentu składanego
  - przeliczanie stopy na okres kapitalizacji
  - uwzględnianie podatku od odsetek
  - zaokrąglanie kwot do groszy
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [kapital_po_2_latach] SymPy solved it fresh: 13209.61 vs 13209.608211677281
      (tol 0.01) ; [odsetki_netto] SymPy solved it fresh: 1209.61 vs 1209.6082116772811 (tol 0.01)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: 'zadanie mieszane: ciąg arytmetyczny → ciąg geometryczny'
  statement: Trzy liczby tworzą ciąg arytmetyczny o różnicy r, a ich suma jest równa 24. Jeżeli do pierwszej
    z tych liczb dodamy 1, drugą pozostawimy bez zmian, a do trzeciej dodamy 3, to otrzymane liczby —
    w tej samej kolejności — utworzą ciąg geometryczny. Wyznacz wszystkie możliwe wartości różnicy r oraz
    odpowiadające im trójki liczb. Zapisz obliczenia.
  statement_latex: 8^{2} = \left(8-r+1\right)\cdot\left(8+r+3\right)
  solution: |-
    Oznaczmy szukane liczby jako 8-r,\ 8,\ 8+r? Najpierw wyznaczmy środkowy wyraz: jeżeli liczby to a-r,\ a,\ a+r, to ich suma wynosi 3a = 24, więc a = 8. Liczby mają postać 8-r,\ 8,\ 8+r.
    Po zmianie otrzymujemy trójkę: 8-r+1 = 9-r,\quad 8,\quad 8+r+3 = 11+r.
    Warunek ciągu geometrycznego dla trzech kolejnych wyrazów: 8^{2} = \left(9-r\right)\cdot\left(11+r\right).
    64 = 99 + 9r - 11r - r^{2}, czyli 64 = 99 - 2r - r^{2}, stąd r^{2}+2\cdot r-35 = 0.
    \Delta = 4 + 140 = 144,\ \sqrt{\Delta} = 12, więc r = \frac{-2-12}{2} = -7 albo r = \frac{-2+12}{2} = 5.
    Dla r = 5: liczby 3,\ 8,\ 13 (suma 24 ✓); po zmianie 4,\ 8,\ 16 — ciąg geometryczny o ilorazie 2, bo 8^{2} = 4\cdot 16 = 64 ✓.
    Dla r = -7: liczby 15,\ 8,\ 1 (suma 24 ✓); po zmianie 16,\ 8,\ 4 — ciąg geometryczny o ilorazie \frac{1}{2}, bo 8^{2} = 16\cdot 4 = 64 ✓.
    Odpowiedź: r = 5 i liczby 3, 8, 13 albo r = −7 i liczby 15, 8, 1.
  solution_steps:
  - Oznacz liczby jako a − r, a, a + r; z sumy 3a = 24 wyznacz a = 8.
  - 'Zapisz trójkę po zmianie: 9 − r, 8, 11 + r.'
  - Zastosuj warunek ciągu geometrycznego 8² = (9 − r)(11 + r).
  - 'Doprowadź do równania r² + 2r − 35 = 0 i rozwiąż je: r = 5 lub r = −7.'
  - Odtwórz obie trójki liczb i sprawdź oba warunki zadania; podaj obie odpowiedzi.
  answer:
    kind: MULTIPART
    parts:
    - name: roznica_r
      answer:
        kind: SET
        members:
        - '5'
        - '-7'
    - name: trojki_liczb
      answer:
        kind: SET
        members:
        - \left(3,\ 8,\ 13\right)
        - \left(15,\ 8,\ 1\right)
  checks:
  - kind: solve_equation
    expr: r^{2}+2\cdot r-35=0
    var: r
    part: roznica_r
  skills:
  - podstawienie a−r, a, a+r
  - warunek b² = a·c
  - rozwiązywanie równania kwadratowego
  - uwzględnianie obu pierwiastków
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: kind mismatch: answer=SET reference=TUPLE'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 3
  exercise_type: 'demonstracja błędu: procent zamiast stałej kwoty'
  statement: 'Pensja miesięczna pracownika w pierwszym roku pracy wynosi 4000 zł i co roku wzrasta o 5%
    w stosunku do pensji z roku poprzedniego. Pewien uczeń rozwiązał zadanie tak: „5% z 4000 zł to 200
    zł, więc pensja rośnie co roku o 200 zł; jest to ciąg arytmetyczny o r = 200 i w czwartym roku pensja
    wynosi 4000 + 3\cdot 200 = 4600 zł”. Wyjaśnij, na czym polega błąd tego rozumowania, i oblicz poprawnie
    pensję miesięczną w czwartym roku pracy (z dokładnością do 1 grosza).'
  statement_latex: a_{4} = 4000\cdot\left(1+\frac{5}{100}\right)^{3}
  solution: |-
    Błędne rozumowanie: uczeń policzył 5% tylko od pensji początkowej (0,05\cdot 4000 = 200 zł) i przyjął, że co roku przyrost wynosi te same 200 zł. Otrzymał model arytmetyczny a_n = 4000 + (n-1)\cdot 200 i wynik a_4 = 4600 zł.
