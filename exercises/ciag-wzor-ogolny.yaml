  statement: 'Ciąg \left(a_{n}\right) jest określony wzorem a_{n}=7\cdot n-4 dla każdej liczby naturalnej
    n\geq 1. Uczeń rozwiązał równanie 7\cdot n-4=39, otrzymał n=\frac{43}{7} i odpowiedział: „tak, liczba
    39 jest wyrazem tego ciągu”. Wyjaśnij błąd i rozstrzygnij, czy liczba 39 jest wyrazem tego ciągu.
    Podaj też numer wyrazu ciągu równego 45.'
  statement_latex: a_{n}=7\cdot n-4,\qquad 7\cdot n-4=39,\quad 7\cdot n-4=45
  solution: |-
    Błędne rozumowanie: uczeń rozwiązał równanie 7n-4=39, czyli 7n=43, n=\frac{43}{7}\approx 6{,}14, i uznał, że skoro równanie ma rozwiązanie, to 39 jest wyrazem ciągu.
    Dlaczego to błąd: liczba c jest wyrazem ciągu tylko wtedy, gdy równanie a_{n}=c ma rozwiązanie będące liczbą NATURALNĄ DODATNIĄ — indeks to numer miejsca w kolejce. Liczba \frac{43}{7} nie jest liczbą naturalną, więc trzeba ją odrzucić.
    Poprawne rozwiązanie:
    1) 7n-4=39 \Rightarrow n=\frac{43}{7}\notin\mathbb{N}_{+}, zatem liczba 39 NIE jest wyrazem tego ciągu (sprawdzenie: a_{6}=38, a_{7}=45).
    2) 7n-4=45 \Rightarrow 7n=49 \Rightarrow n=7, a 7 jest liczbą naturalną dodatnią, więc 45 jest siódmym wyrazem ciągu: a_{7}=45.
    Odpowiedź: 39 nie jest wyrazem ciągu; liczba 45 jest wyrazem o numerze n=7.
  solution_steps:
