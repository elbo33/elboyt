    na dłuższym łuku AB. Uczeń zapisał: „Kąt OAB ma wierzchołek połączony ze środkiem O, więc jest kątem
    środkowym opartym na łuku AB, a stąd |\angle ACB| = \frac{1}{2}\cdot 32^\circ = 16^\circ”. Wyjaśnij,
    na czym polega błąd, oraz oblicz miary kątów AOB i ACB.'
  statement_latex: '|\angle AOB| = 180^\circ - 2\cdot 32^\circ,\qquad |\angle ACB| = \frac{1}{2}\cdot\left(180^\circ
    - 2\cdot 32^\circ\right)'
  solution: |-
