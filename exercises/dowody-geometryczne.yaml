- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: dowód z twierdzeń o okręgu z rozstrzygnięciem położenia punktu
  statement: |-
    Punkty A i B leżą na okręgu o środku O i promieniu r, przy czym |AB| = r \cdot \sqrt{2}. Punkt C leży na tym okręgu, jest różny od A i od B, a kąt ACB jest rozwarty.
    a) Wykaż, że kąt AOB jest kątem prostym.
    b) Oblicz miarę kąta ACB.
  statement_latex: '|AB| = r\cdot\sqrt{2},\qquad |\sphericalangle ACB| = \frac{360 - 90}{2}'
  solution: |-
    Założenie: |OA| = |OB| = r, |AB| = r\sqrt{2}, C leży na okręgu i kąt ACB jest rozwarty.

    a) W trójkącie AOB mamy |OA| = |OB| = r oraz |AB| = r\sqrt{2}. Sprawdzamy zależność Pitagorasa:
    |OA|^2 + |OB|^2 = r^2 + r^2 = 2r^2, a |AB|^2 = \left(r\sqrt{2}\right)^2 = 2r^2.
    Zatem |OA|^2 + |OB|^2 = |AB|^2, więc z twierdzenia odwrotnego do twierdzenia Pitagorasa trójkąt AOB jest prostokątny, a kąt prosty leży naprzeciw najdłuższego boku AB, czyli |∡AOB| = 90^\circ. To była teza a).

    b) Kluczowe pytanie brzmi: na którym łuku AB leży punkt C?
    Gdyby C leżał na dłuższym łuku AB, to kąt wpisany ACB byłby oparty na krótszym łuku AB, któremu odpowiada kąt środkowy AOB o mierze 90^\circ; wtedy |∡ACB| = \frac{90^\circ}{2} = 45^\circ, a więc kąt ACB byłby ostry — sprzecznie z założeniem, że jest rozwarty. Ten przypadek odpada.
    Zatem C leży na krótszym łuku AB. Wówczas kąt wpisany ACB jest oparty na dłuższym łuku AB, a odpowiadający mu kąt środkowy (niewypukły) ma miarę 360^\circ - 90^\circ = 270^\circ. Z twierdzenia o kącie wpisanym i środkowym
    |∡ACB| = \frac{360^\circ - 90^\circ}{2} = 135^\circ.
    (Ten sam wynik daje twierdzenie o czworokącie wpisanym: 180^\circ - 45^\circ = 135^\circ.)
    Kąt 135^\circ jest rozwarty, więc warunek zadania jest spełniony.

    Odpowiedź: |∡ACB| = 135^\circ.
  solution_steps:
  - 'Zauważ, że w trójkącie AOB znane są wszystkie trzy boki: r, r i r\sqrt{2}.'
  - Sprawdź warunek r^2 + r^2 = \left(r\sqrt{2}\right)^2 i z twierdzenia odwrotnego do twierdzenia Pitagorasa
    wywnioskuj |∡AOB| = 90^\circ.
  - 'Rozważ położenie C na dłuższym łuku AB: dostajesz |∡ACB| = 45^\circ, kąt ostry — sprzeczność z założeniem,
    przypadek odpada.'
  - Zatem C leży na krótszym łuku AB, a kąt ACB jest oparty na dłuższym łuku, któremu odpowiada kąt środkowy
    360^\circ - 90^\circ = 270^\circ.
  - Oblicz |∡ACB| = \frac{360^\circ - 90^\circ}{2} = 135^\circ i sprawdź, że jest to kąt rozwarty.
  answer:
    kind: MULTIPART
    parts:
    - name: a) dowód, że kąt AOB jest prosty
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy zauważyć, że w trójkącie AOB boki mają długości r, r, r\sqrt{2}, sprawdzić równość
          r^2 + r^2 = \left(r\sqrt{2}\right)^2 i powołać się na twierdzenie odwrotne do twierdzenia Pitagorasa,
          wskazując, że kąt prosty leży naprzeciw boku AB.
    - name: b) miara kąta ACB
      answer:
        kind: NUMERIC
        value: 135.0
  checks:
  - kind: evaluate
    expr: \frac{360 - 90}{2}
    part: b) miara kąta ACB
