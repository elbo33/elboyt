  exercise_type: zadanie optymalizacyjne z ograniczeniem (pole rombu jako funkcja przekątnej)
  statement: |-
    W rombie ABCD suma długości przekątnych AC i BD jest równa 24, a przekątna AC ma długość nie większą niż 10. Przyjmij |AC| = x.
    a) Wyznacz wzór na pole P tego rombu jako funkcję zmiennej x i podaj dziedzinę tej funkcji.
    b) Oblicz największe możliwe pole tego rombu oraz długość przekątnej BD, przy której to pole jest osiągane.
    Zapisz obliczenia.
  statement_latex: P\left(x\right)=\frac{1}{2}\cdot x\cdot\left(24-x\right)=12x-\frac{1}{2}x^{2},\qquad
    x\in\left(0,\ 10\right\rangle
  solution: |-
    a) Skoro |AC| = x oraz |AC|+|BD| = 24, to |BD| = 24 - x.
    Przekątne rombu są prostopadłe, więc pole obliczamy ze wzoru P = \frac{1}{2}\cdot e\cdot f:
    P\left(x\right) = \frac{1}{2}\cdot x\cdot\left(24-x\right) = 12x-\frac{1}{2}x^{2}.

    Dziedzina. Obie przekątne muszą mieć dodatnią długość: x > 0 oraz 24-x > 0, czyli x < 24. Dodatkowo z treści x \le 10. Warunek x \le 10 jest mocniejszy, więc
    D = \left(0,\ 10\right\rangle.

    b) Funkcja P jest funkcją kwadratową o współczynniku a = -\frac{1}{2} < 0, więc jej wykresem jest parabola o ramionach skierowanych w dół. Pierwsza współrzędna wierzchołka:
    x_{w} = -\frac{b}{2a} = -\frac{12}{2\cdot\left(-\frac{1}{2}\right)} = 12.

    Wierzchołek nie należy do dziedziny, bo 12 > 10. Na przedziale \left(0,\ 12\right\rangle funkcja jest rosnąca, a \left(0,\ 10\right\rangle \subset \left(0,\ 12\right\rangle, więc największą wartość przyjmuje na prawym końcu dziedziny, czyli dla x = 10:
    P\left(10\right) = \frac{1}{2}\cdot 10\cdot\left(24-10\right) = \frac{1}{2}\cdot 10\cdot 14 = 70.
    Wtedy |BD| = 24-10 = 14.

    Sprawdzenie sensowności: dla przekątnych 10 i 14 bok rombu wynosi \sqrt{5^{2}+7^{2}} = \sqrt{74} \approx 8{,}6 — taki romb istnieje; jego dłuższą przekątną jest BD, a warunek |AC| \le 10 jest spełniony z równością. ✓

    Odpowiedź: a) P\left(x\right) = 12x-\frac{1}{2}x^{2} dla x\in\left(0,\ 10\right\rangle; b) największe pole wynosi 70 i jest osiągane dla |BD| = 14.
  solution_steps:
  - 'Zapisz drugą przekątną: |BD| = 24 − x.'
  - 'Zbuduj pole rombu (przekątne prostopadłe): P(x) = ½·x·(24 − x) = 12x − ½x².'
  - 'Wyznacz dziedzinę: x > 0, 24 − x > 0 oraz x ≤ 10, czyli x ∈ (0, 10⟩.'
  - 'Wyznacz wierzchołek paraboli: x_w = 12, i stwierdź, że 12 ∉ (0, 10⟩.'
  - 'Ponieważ na (0, 12⟩ funkcja rośnie, największą wartość osiąga dla x = 10: P(10) = 70.'
  - 'Oblicz odpowiadającą przekątną: |BD| = 24 − 10 = 14 i sprawdź, że taki romb istnieje (bok √74).'
