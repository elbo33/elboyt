    b) tangens kąta nachylenia przekątnej $A'B$ ściany bocznej $ABB'A'$ do płaszczyzny podstawy $ABC$.
  statement_latex: \operatorname{tg}\beta = \frac{|AA'|}{|AM|} = \frac{4}{3 \cdot \sqrt{3}},\qquad \operatorname{tg}\alpha
    = \frac{|AA'|}{|AB|} = \frac{4}{6}
  solution: |-
    a) Niech $M$ będzie środkiem krawędzi $BC$. W trójkącie równobocznym $ABC$ odcinek $AM$ jest wysokością, więc $AM \perp BC$ oraz $|AM| = \frac{6 \cdot \sqrt{3}}{2} = 3 \cdot \sqrt{3}$. Rzutem prostokątnym odcinka $A'M$ na płaszczyznę podstawy jest odcinek $AM$, a $AM \perp BC$, więc na mocy twierdzenia o trzech prostych prostopadłych $A'M \perp BC$. Zatem $\angle A'MA = \beta$ jest kątem liniowym szukanego kąta dwuściennego.
