- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 3
  exercise_type: porównywanie wielokątów foremnych o równych obwodach
  statement: Sześciokąt foremny i kwadrat mają równe obwody. Oblicz stosunek pola sześciokąta do pola
    kwadratu oraz stosunek promienia okręgu opisanego na sześciokącie do promienia okręgu opisanego na
    kwadracie. Wyniki podaj w postaci dokładnej (bez niewymierności w mianowniku).
  statement_latex: L=6\cdot a=4\cdot s,\qquad \frac{P_{6}}{P_{4}}=\frac{\frac{3\sqrt{3}}{2}\cdot a^{2}}{s^{2}},\qquad
    \frac{R_{6}}{R_{4}}=\frac{a}{\frac{s\sqrt{2}}{2}}
  solution: |-
    Oznaczmy przez L wspólny obwód obu figur (L > 0). Wtedy bok sześciokąta a=\frac{L}{6}, a bok kwadratu s=\frac{L}{4}.
    Pole sześciokąta foremnego: P_{6}=\frac{3\cdot a^{2}\sqrt{3}}{2}=\frac{3\sqrt{3}}{2}\cdot\frac{L^{2}}{36}=\frac{L^{2}\sqrt{3}}{24}.
    Pole kwadratu: P_{4}=s^{2}=\frac{L^{2}}{16}.
    Stosunek pól: \frac{P_{6}}{P_{4}}=\frac{\frac{L^{2}\sqrt{3}}{24}}{\frac{L^{2}}{16}}=\frac{16\sqrt{3}}{24}=\frac{2\sqrt{3}}{3}\approx 1{,}15.
    W sześciokącie foremnym R_{6}=a=\frac{L}{6}. W kwadracie R_{4}=\frac{s\sqrt{2}}{2}=\frac{L\sqrt{2}}{8}.
    Stosunek promieni: \frac{R_{6}}{R_{4}}=\frac{\frac{L}{6}}{\frac{L\sqrt{2}}{8}}=\frac{8}{6\sqrt{2}}=\frac{4}{3\sqrt{2}}=\frac{4\sqrt{2}}{6}=\frac{2\sqrt{2}}{3}\approx 0{,}94.
    Odpowiedź: \frac{P_{6}}{P_{4}}=\frac{2\sqrt{3}}{3}, \frac{R_{6}}{R_{4}}=\frac{2\sqrt{2}}{3}.
  solution_steps:
  - 'Wprowadź wspólny obwód L i wyraź boki: a=\frac{L}{6} (sześciokąt), s=\frac{L}{4} (kwadrat).'
  - 'Oblicz pola: P_{6}=\frac{3\sqrt{3}}{2}\cdot\left(\frac{L}{6}\right)^{2}=\frac{L^{2}\sqrt{3}}{24}
    oraz P_{4}=\left(\frac{L}{4}\right)^{2}=\frac{L^{2}}{16}.'
  - 'Podziel pola: \frac{P_{6}}{P_{4}}=\frac{16\sqrt{3}}{24}=\frac{2\sqrt{3}}{3}.'
  - 'Zapisz promienie okręgów opisanych: R_{6}=a=\frac{L}{6}, R_{4}=\frac{s\sqrt{2}}{2}=\frac{L\sqrt{2}}{8}.'
  - 'Podziel promienie i usuń niewymierność: \frac{R_{6}}{R_{4}}=\frac{8}{6\sqrt{2}}=\frac{2\sqrt{2}}{3}.'
  answer:
    kind: MULTIPART
    parts:
    - name: stosunek_pol
      answer:
        kind: SYMBOLIC
        latex: \frac{2\sqrt{3}}{3}
    - name: stosunek_promieni
      answer:
        kind: SYMBOLIC
        latex: \frac{2\sqrt{2}}{3}
