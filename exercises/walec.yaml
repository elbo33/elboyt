  statement: Średnica podstawy walca jest równa 10, a wysokość tego walca jest równa 6. Oblicz pole powierzchni
    całkowitej tego walca. Wynik podaj w postaci dokładnej (z liczbą \pi).
  statement_latex: P_c = 2\pi \cdot 5 \cdot \left(5 + 6\right)
  solution: |-
    Najpierw z średnicy wyznaczamy promień: 2r = 10, więc r = 5.
    Walec jest zamknięty, ma dwie podstawy, zatem P_c = 2\pi r^2 + 2\pi r H = 2\pi r\left(r + H\right).
    P_c = 2\pi \cdot 5 \cdot \left(5 + 6\right) = 10\pi \cdot 11 = 110\pi.
    Odp. P_c = 110\pi (około 345{,}58).
