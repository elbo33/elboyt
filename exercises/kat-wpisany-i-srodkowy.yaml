  statement: 'Punkty A i B leżą na okręgu o środku O, a kąt wypukły AOB ma miarę 84^\circ. Punkt C leży
    na dłuższym łuku AB. Uczeń zapisał: „Kąt środkowy ma 84^\circ, więc kąt wpisany ACB ma miarę 2\cdot
    84^\circ = 168^\circ”. Wyjaśnij, na czym polega błąd, i oblicz poprawną miarę kąta ACB.'
  statement_latex: '\text{błędnie: } |\angle ACB| = 2\cdot 84^\circ,\qquad \text{poprawnie: } |\angle
    ACB| = \frac{1}{2}\cdot 84^\circ'
  solution: |-
    Błędne rozumowanie: uczeń przyjął, że kąt wpisany otrzymuje się przez pomnożenie kąta środkowego przez 2, i otrzymał |\angle ACB| = 2\cdot 84^\circ = 168^\circ.

    Dlaczego to jest źle: twierdzenie mówi, że to kąt wpisany jest DWA RAZY MNIEJSZY od kąta środkowego opartego na tym samym łuku, czyli \alpha = \tfrac12\beta, a nie \beta = \tfrac12\alpha. Szybki test pamięciowy: dla średnicy kąt środkowy ma 180^\circ, a kąt wpisany oparty na półokręgu 90^\circ — kąt wpisany to połowa. Ponadto wynik 168^\circ jest niemożliwy: kąt wpisany oparty na krótszym łuku musi być ostry.

    Poprawne rozwiązanie: punkt C leży na dłuższym łuku, więc kąt ACB opiera się na krótszym łuku AB, tym samym co dany kąt środkowy 84^\circ. Zatem
    |\angle ACB| = \frac{1}{2}\cdot 84^\circ = 42^\circ.

    Odpowiedź: |\angle ACB| = 42^\circ.
  solution_steps:
  - 'Wskaż błąd: uczeń pomnożył kąt środkowy przez 2, zamiast podzielić go przez 2.'
  - Przypomnij zależność \alpha = \tfrac12\beta (kąt wpisany jest połową kąta środkowego opartego na tym
    samym łuku).
  - Zauważ, że C leży na dłuższym łuku, więc kąt ACB opiera się na krótszym łuku AB.
  - Oblicz |\angle ACB| = \tfrac12\cdot 84^\circ = 42^\circ.
