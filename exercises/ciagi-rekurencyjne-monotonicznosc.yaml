  exercise_type: kolejność w różnicy
  statement: 'Dany jest ciąg \left(a_{n}\right) określony wzorem a_{n} = 7 - 2n dla każdej liczby naturalnej
    n \geq 1. Uczeń obliczył a_{n} - a_{n+1} = 2 i napisał: „różnica jest dodatnia, więc ciąg jest rosnący”.
    Oblicz różnicę a_{n+1} - a_{n} zgodnie z definicją i rozstrzygnij, czy ciąg jest malejący. Wyjaśnij
    błąd ucznia.'
  statement_latex: a_{n}=7-2n,\qquad a_{n+1}-a_{n}=?
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń policzył różnicę w odwrotnej kolejności:
    a_{n} - a_{n+1} = \left(7-2n\right) - \left(7-2\left(n+1\right)\right) = 2,
    otrzymał liczbę dodatnią i stąd błędnie wywnioskował, że ciąg jest rosnący.
    DLACZEGO TO BŁĄD: kryterium monotoniczności dotyczy różnicy „następny minus poprzedni”, czyli a_{n+1} - a_{n}. Przy odwróconej kolejności wnioski trzeba odwrócić — dodatnia różnica a_{n} - a_{n+1} oznacza właśnie, że ciąg MALEJE.
    POPRAWNE ROZWIĄZANIE:
    a_{n+1} = 7 - 2\left(n+1\right) = 7 - 2n - 2 = 5 - 2n,
    a_{n+1} - a_{n} = \left(5-2n\right) - \left(7-2n\right) = -2.
    Różnica jest ujemna dla każdego n \in \mathbb{N}^{+}, więc a_{n+1} < a_{n}, czyli ciąg jest malejący.
