- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: rozwijanie kwadratu dwumianu
  statement: 'Rozwiń i uporządkuj wyrażenia: a) \left(2x+3y\right)^{2}, b) \left(3x-2\sqrt{5}\right)^{2}.'
  statement_latex: \text{a) } \left(2x+3y\right)^{2}, \qquad \text{b) } \left(3x-2\sqrt{5}\right)^{2}
  solution: |-
    a) Składnikami są 2x oraz 3y.
    \left(2x\right)^{2}=4x^{2}, podwojony iloczyn 2\cdot 2x\cdot 3y=12xy, \left(3y\right)^{2}=9y^{2}.
    Zatem \left(2x+3y\right)^{2}=4x^{2}+12xy+9y^{2}.
    b) Składnikami są 3x oraz 2\sqrt{5}, a między nimi jest znak minus, więc wyraz środkowy będzie ujemny.
    \left(3x\right)^{2}=9x^{2}, podwojony iloczyn 2\cdot 3x\cdot 2\sqrt{5}=12\sqrt{5}\cdot x, \left(2\sqrt{5}\right)^{2}=4\cdot 5=20.
    Zatem \left(3x-2\sqrt{5}\right)^{2}=9x^{2}-12\sqrt{5}\cdot x+20.
  solution_steps:
  - 'a) Przyjmij a=2x, b=3y i podnieś każdy składnik do kwadratu: 4x^{2} oraz 9y^{2}.'
  - a) Oblicz podwojony iloczyn 2\cdot 2x\cdot 3y=12xy i zapisz wynik 4x^{2}+12xy+9y^{2}.
  - b) Przyjmij a=3x, b=2\sqrt{5}; \left(3x\right)^{2}=9x^{2}, \left(2\sqrt{5}\right)^{2}=20.
  - 'b) Oblicz podwojony iloczyn 2\cdot 3x\cdot 2\sqrt{5}=12\sqrt{5}\cdot x i zapisz wynik ze znakiem
    minus: 9x^{2}-12\sqrt{5}\cdot x+20.'
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: SYMBOLIC
        latex: 4x^{2}+12xy+9y^{2}
    - name: b
      answer:
        kind: SYMBOLIC
        latex: 9x^{2}-12\sqrt{5}\cdot x+20
