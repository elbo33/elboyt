- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie kąta nachylenia tworzącej stożka
  statement: Dany jest stożek obrotowy, w którym promień podstawy ma długość r = 5, a wysokość stożka
    ma długość h = 5. Oblicz miarę kąta nachylenia tworzącej tego stożka do płaszczyzny podstawy.
  statement_latex: \operatorname{tg}\alpha=\frac{h}{r}=\frac{5}{5}
  solution: Rzutem prostokątnym wierzchołka stożka na płaszczyznę podstawy jest środek koła podstawy,
    więc rzutem tworzącej jest promień poprowadzony do jej spodka. Kąt α między tworzącą a tym promieniem
    leży w trójkącie prostokątnym o przyprostokątnych r = 5 (przy kącie α) i h = 5 (naprzeciw kąta α).
    Zatem \operatorname{tg}\alpha=\frac{5}{5}=1, czyli α = 45°.
  solution_steps:
  - Zauważ, że rzutem tworzącej na podstawę jest promień podstawy o długości r = 5.
  - Wyodrębnij trójkąt prostokątny o przyprostokątnych r = 5 i h = 5 (połowa przekroju osiowego).
  - Zapisz \operatorname{tg}\alpha=\frac{h}{r}=\frac{5}{5}=1.
  - 'Odczytaj miarę kąta: α = 45°.'
  answer:
    kind: NUMERIC
    value: 45.0
    tol: 1.0e-06
    latex: 45^\circ
  checks:
  - kind: evaluate
    expr: \frac{180}{\pi}\cdot\arctan\left(\frac{5}{5}\right)
  skills:
  - kąt między prostą a płaszczyzną
  - przekrój osiowy stożka
  - funkcje trygonometryczne kąta ostrego
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 45.0 vs 45.0 (tol 1e-06)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: walec — przekrój osiowy i kąt tworzącej
  statement: Dany jest walec obrotowy o promieniu podstawy r = 3 i wysokości H = 8. Oblicz długość przekątnej
    przekroju osiowego tego walca oraz podaj miarę kąta, jaki tworząca walca tworzy z płaszczyzną podstawy.
  statement_latex: d=\sqrt{\left(2\cdot 3\right)^2+8^2}
  solution: Przekrój osiowy walca jest prostokątem o bokach 2r = 6 (średnica podstawy) i H = 8 (tworząca).
    Z twierdzenia Pitagorasa przekątna tego prostokąta ma długość d=\sqrt{6^2+8^2}=\sqrt{36+64}=\sqrt{100}=10.
    Tworząca walca obrotowego jest prostopadła do obu podstaw, więc kąt między tworzącą a płaszczyzną
    podstawy ma miarę 90°.
  solution_steps:
  - Narysuj przekrój osiowy jako prostokąt o bokach 2r = 6 i H = 8.
  - 'Zastosuj twierdzenie Pitagorasa: d=\sqrt{6^2+8^2}=10.'
  - 'Przypomnij definicję walca obrotowego: tworząca jest prostopadła do podstaw.'
  - Zapisz, że kąt tworzącej z płaszczyzną podstawy ma miarę 90°.
  answer:
    kind: MULTIPART
    parts:
    - name: przekątna przekroju osiowego
      answer:
        kind: NUMERIC
        value: 10.0
        tol: 1.0e-06
        latex: '10'
    - name: kąt tworzącej z podstawą
      answer:
        kind: NUMERIC
        value: 90.0
        tol: 1.0e-06
        latex: 90^\circ
