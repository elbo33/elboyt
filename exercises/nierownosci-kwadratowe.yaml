- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie: wzór i dziedzina, nierówność kwadratowa z dodatkowym ograniczeniem'
  statement: Prostokątny ogród ma zostać ogrodzony z trzech stron siatką o łącznej długości 40 m; czwarty
    bok ogrodu przylega do prostego muru i nie jest ogrodzony. Ze względów technicznych bok przylegający
    do muru nie może być dłuższy niż 24 m. Przez x oznaczamy długość (w metrach) boku ogrodu prostopadłego
    do muru (takie boki są dwa). (a) Wyznacz wzór funkcji P opisującej pole ogrodu w zależności od x oraz
    dziedzinę tej funkcji wynikającą z warunku, że wszystkie boki mają dodatnie długości (bez uwzględniania
    ograniczenia 24 m). (b) Wyznacz zbiór wszystkich wartości x, dla których pole ogrodu jest nie mniejsze
    niż 150 m^{2} i jednocześnie bok przylegający do muru nie jest dłuższy niż 24 m. (c) Oblicz pole ogrodu
    dla najmniejszej wartości x należącej do zbioru wyznaczonego w podpunkcie (b). Zapisz obliczenia.
  statement_latex: P\left(x\right)=x\cdot\left(40-2\cdot x\right), \qquad P\left(x\right)\geq 150, \qquad
    40-2\cdot x \leq 24
  solution: |-
    (a) Na ogrodzenie zużywamy dwa boki prostopadłe do muru (po x metrów) oraz bok równoległy do muru. Zatem bok równoległy do muru ma długość 40-2x, a pole ogrodu wynosi
    P\left(x\right)=x\cdot\left(40-2x\right)=40x-2x^{2}.
    Wszystkie boki muszą być dodatnie: x>0 oraz 40-2x>0, czyli x<20. Dziedziną jest przedział \left(0,20\right).

    (b) Warunek na pole: 40x-2x^{2}\ge 150. Przenosimy wszystko na jedną stronę:
    -2x^{2}+40x-150\ge 0 \;\big|\cdot\left(-\frac{1}{2}\right) \;\Longrightarrow\; x^{2}-20x+75\le 0 (znak nierówności odwracamy).
    \Delta=\left(-20\right)^{2}-4\cdot 1\cdot 75=400-300=100, \sqrt{\Delta}=10.
    x_{1}=\frac{20-10}{2}=5, \qquad x_{2}=\frac{20+10}{2}=15.
    Ponieważ a>0 i znak \le, otrzymujemy x\in\left\langle 5,15\right\rangle.
