- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: wyznaczanie promienia i pola z obwodu wycinka
  statement: Obwód wycinka koła o kącie środkowym 72^\circ (czyli suma długości łuku i dwóch promieni)
    jest równy 4\pi + 20. Oblicz promień koła oraz pole tego wycinka.
  statement_latex: \frac{72^\circ}{360^\circ}\cdot 2\cdot \pi \cdot r + 2\cdot r = 4\pi + 20
  solution: |-
    Ułamek koła: \frac{72^\circ}{360^\circ}=\frac{1}{5}.
    Długość łuku: l=\frac{1}{5}\cdot 2\pi r=\frac{2\pi r}{5}.
    Obwód wycinka: Ob=l+2r=\frac{2\pi r}{5}+2r.
    Z warunku zadania \frac{2\pi r}{5}+2r=4\pi+20. Po lewej i po prawej stronie porównujemy osobno składniki z \pi i osobno bez \pi (są to wyrazy niepodobne):
    \frac{2\pi r}{5}=4\pi \Rightarrow r=10, oraz 2r=20 \Rightarrow r=10 — oba warunki dają ten sam promień, więc r=10.
    Pole wycinka: P_w=\frac{1}{5}\cdot \pi\cdot 10^2=\frac{1}{5}\cdot 100\pi=20\pi.
    Kontrola wzorem P_w=\frac{1}{2}lr: l=\frac{1}{5}\cdot 2\pi\cdot 10=4\pi, więc \frac{1}{2}\cdot 4\pi\cdot 10=20\pi ✓.
  solution_steps:
  - 'Oblicz ułamek koła: 72°/360° = 1/5.'
  - Zapisz długość łuku l = (1/5)·2πr = 2πr/5.
  - Zapisz obwód wycinka Ob = l + 2r i przyrównaj do 4π + 20.
  - 'Porównaj osobno składniki z π i bez π: 2πr/5 = 4π oraz 2r = 20.'
  - Wyznacz r = 10.
  - Oblicz pole P = (1/5)·π·10² = 20π i sprawdź wynik wzorem P = ½·l·r.
  answer:
    kind: MULTIPART
    parts:
    - name: promien
      answer:
        kind: NUMERIC
        value: 10.0
    - name: pole_wycinka
      answer:
        kind: SYMBOLIC
        latex: 20\pi
  checks:
  - kind: solve_equation
    expr: \frac{72}{360}\cdot 2\cdot \pi \cdot r + 2\cdot r = 4\cdot \pi + 20
    var: r
    part: promien
  - kind: evaluate
    expr: \frac{72}{360}\cdot \pi \cdot 10^{2}
    part: pole_wycinka
  skills:
  - obwód wycinka koła
  - rozdzielanie składników z π i bez π
  - przekształcanie wzoru na długość łuku
  - pole wycinka koła
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: pole i obwód figury złożonej (fragment pierścienia)
  statement: 'Dane są dwa okręgi współśrodkowe o wspólnym środku O i promieniach 5 cm oraz 8 cm. Ramiona
    kąta środkowego o wierzchołku O i mierze 120^\circ wycinają z pierścienia ograniczonego tymi okręgami
    figurę F. Brzeg figury F tworzą: łuk okręgu o promieniu 8 cm, łuk okręgu o promieniu 5 cm oraz dwa
    odcinki zawarte w ramionach tego kąta, każdy o końcach leżących na obu okręgach. Oblicz pole oraz
    obwód figury F.'
  statement_latex: P=\frac{120^\circ}{360^\circ}\cdot\left(\pi\cdot 8^{2}-\pi\cdot 5^{2}\right),\qquad
    Ob=\frac{120^\circ}{360^\circ}\cdot 2\pi\cdot 8+\frac{120^\circ}{360^\circ}\cdot 2\pi\cdot 5+2\cdot\left(8-5\right)
  solution: |-
    Ułamek koła: \frac{120^\circ}{360^\circ}=\frac{1}{3}.
    Pole figury F to \frac{1}{3} pola pierścienia:
    P=\frac{1}{3}\left(\pi\cdot 8^2-\pi\cdot 5^2\right)=\frac{1}{3}\left(64\pi-25\pi\right)=\frac{1}{3}\cdot 39\pi=13\pi\ \text{cm}^2\approx 40{,}8\ \text{cm}^2.
    Obwód: idziemy po brzegu figury — łuk zewnętrzny, odcinek, łuk wewnętrzny, drugi odcinek.
    Łuk zewnętrzny: \frac{1}{3}\cdot 2\pi\cdot 8=\frac{16\pi}{3}.
    Łuk wewnętrzny: \frac{1}{3}\cdot 2\pi\cdot 5=\frac{10\pi}{3}.
    Każdy z dwóch odcinków ma długość 8-5=3.
    Ob=\frac{16\pi}{3}+\frac{10\pi}{3}+2\cdot 3=\frac{26\pi}{3}+6\ \text{cm}\approx 33{,}2\ \text{cm}.
    Składników z \pi i bez \pi nie łączymy w jeden.
  solution_steps:
  - 'Zapisz ułamek koła: 120°/360° = 1/3.'
  - 'Oblicz pole pierścienia: π·8² − π·5² = 39π.'
  - 'Pole figury: P = (1/3)·39π = 13π cm².'
  - Oblicz łuk zewnętrzny (1/3)·2π·8 = 16π/3 i wewnętrzny (1/3)·2π·5 = 10π/3.
  - Dodaj dwa odcinki o długości 8 − 5 = 3.
  - 'Obwód: Ob = 16π/3 + 10π/3 + 6 = 26π/3 + 6 cm.'
  answer:
    kind: MULTIPART
    parts:
    - name: pole
      answer:
        kind: SYMBOLIC
        latex: 13\pi
    - name: obwod
      answer:
        kind: SYMBOLIC
        latex: \frac{26\pi}{3}+6
  checks:
  - kind: evaluate
    expr: \frac{120}{360}\cdot\left(\pi\cdot 8^{2}-\pi\cdot 5^{2}\right)
    part: pole
  - kind: evaluate
    expr: \frac{120}{360}\cdot 2\cdot \pi\cdot 8+\frac{120}{360}\cdot 2\cdot \pi\cdot 5+2\cdot\left(8-5\right)
    part: obwod
  skills:
  - pole wycinka koła
  - długość łuku
  - pole i obwód figury złożonej
  - analiza brzegu figury
  verification:
    checkability: REFERENCE_CALL
    note: 'answer and reference disagree: part disagrees: ''13\\pi'' vs ''13\\pi\\ \\text{cm}^2'' (as
      text)'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: wykrycie błędu – pominięcie ułamka α/360°
  statement: 'Uczeń miał obliczyć pole wycinka koła o promieniu r = 6 cm, wyznaczonego przez kąt środkowy
    o mierze 45°. Zapisał: „P = \pi\cdot 6^2 = 36\pi cm^2”. Wyjaśnij, na czym polega błąd, i podaj poprawne
    pole tego wycinka.'
  statement_latex: P_w=\frac{45^\circ}{360^\circ}\cdot\pi\cdot 6^2
  solution: |-
    Błędne rozumowanie: uczeń użył wzoru na pole całego koła P=\pi r^2=\pi\cdot 6^2=36\pi cm^2 i całkowicie pominął kąt środkowy – dostał 36\pi cm^2, czyli pole CAŁEGO koła, a nie jego kawałka.
    Dlaczego to źle: wycinek to tylko część koła; jaką część, mówi ułamek \frac{\alpha}{360^\circ}. Tu \frac{45^\circ}{360^\circ}=\frac{1}{8}, więc wynik musi być ośmiokrotnie mniejszy od pola koła.
    Poprawnie: P_w=\frac{1}{8}\cdot\pi\cdot 6^2=\frac{1}{8}\cdot 36\pi=\frac{9\pi}{2}=4{,}5\pi cm^2 ≈ 14{,}1 cm^2.
    Kontrola: 4{,}5\pi\le 36\pi ✓; dla \alpha=360^\circ wzór dałby całe koło 36\pi.
  solution_steps:
  - Zauważ, że zapis \pi\cdot 6^{2} to pole całego koła, a nie wycinka.
  - 'Wyznacz ułamek koła: \frac{45^\circ}{360^\circ}=\frac{1}{8}.'
  - 'Pomnóż pole koła przez ten ułamek: P_w=\frac{1}{8}\cdot 36\pi=\frac{9\pi}{2} cm^2.'
  - 'Sprawdź: P_w\le\pi r^{2}.'
  answer:
    kind: SYMBOLIC
    latex: \frac{9\pi}{2}
  checks:
  - kind: evaluate
    expr: \frac{45}{360}\cdot\pi\cdot 6^{2}
  skills:
  - pole wycinka koła
  - ułamek α/360°
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 14.137166941154069 vs 14.137166941154069 (tol 1e-09)'
- id: g-cm-07
  slot: COMMON_MISTAKE
  ramp_index: 0
