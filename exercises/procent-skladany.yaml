    - name: kapital_brutto
      answer:
        kind: NUMERIC
        value: 16872.96
        tol: 0.01
        latex: 16872{,}96\ \text{zł}
    - name: kwota_do_wyplaty
      answer:
        kind: NUMERIC
        value: 16517.1
        tol: 0.01
        latex: 16517{,}10\ \text{zł}
  checks:
  - kind: evaluate
    expr: 15000\cdot\left(1+\frac{4}{100}\right)^{3}
    part: kapital_brutto
  - kind: evaluate
