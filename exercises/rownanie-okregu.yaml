- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: okrąg zadany średnicą
  statement: W kartezjańskim układzie współrzędnych (x, y) punkty A = (-1, 2) oraz B = (7, 8) są końcami
    średnicy okręgu O. a) Wyznacz środek S i promień r okręgu O. b) Zapisz równanie okręgu O w postaci
    kanonicznej. c) Rozstrzygnij, czy punkt M = (2, 9) leży na okręgu O, wewnątrz niego, czy na zewnątrz.
  statement_latex: S=\left(\frac{-1+7}{2},\ \frac{2+8}{2}\right),\qquad r=\frac{1}{2}\cdot\sqrt{\left(7-\left(-1\right)\right)^{2}+\left(8-2\right)^{2}}
  solution: |-
    a) Środek okręgu to środek odcinka AB:
    S=\left(\frac{-1+7}{2},\frac{2+8}{2}\right)=(3,5).
    Promień: r^2=|SA|^2=(-1-3)^2+(2-5)^2=16+9=25, więc r=5.
    (Sprawdzenie: |AB|=\sqrt{8^2+6^2}=\sqrt{100}=10, więc r=\frac{1}{2}\cdot 10=5 ✓.)

    b) Równanie: (x-3)^2+(y-5)^2=25. Kontrola: dla B=(7,8) mamy (7-3)^2+(8-5)^2=16+9=25 ✓.

    c) Dla M=(2,9): L=(2-3)^2+(9-5)^2=1+16=17. Ponieważ 17<25, czyli L<r^2, punkt M leży WEWNĄTRZ okręgu (należy do koła, ale nie do okręgu).
  solution_steps:
  - 'Oblicz środek odcinka AB: S=\left(\frac{-1+7}{2},\ \frac{2+8}{2}\right)=\left(3,5\right).'
  - Oblicz r=\frac{1}{2}\cdot\left|AB\right|=\frac{1}{2}\cdot\sqrt{64+36}=5.
  - Zapisz równanie \left(x-3\right)^{2}+\left(y-5\right)^{2}=25.
  - 'Podstaw M=\left(2,9\right): L=\left(2-3\right)^{2}+\left(9-5\right)^{2}=17.'
  - Porównaj 17<25, więc M leży wewnątrz okręgu.
  answer:
    kind: MULTIPART
    parts:
    - name: srodek
      answer:
        kind: TUPLE
        items:
        - '3'
        - '5'
    - name: promien
      answer:
        kind: NUMERIC
        value: 5.0
    - name: rownanie
      answer:
        kind: SYMBOLIC
        latex: \left(x-3\right)^{2}+\left(y-5\right)^{2}=25
    - name: wartosc_L_dla_M
      answer:
        kind: NUMERIC
        value: 17.0
    - name: polozenie_M
      answer:
        kind: SYMBOLIC
        latex: \text{punkt } M \text{ leży wewnątrz okręgu}
  checks:
  - kind: evaluate
    expr: \frac{1}{2}\cdot\sqrt{\left(7-\left(-1\right)\right)^{2}+\left(8-2\right)^{2}}
    part: promien
  - kind: evaluate
    expr: \left(2-3\right)^{2}+\left(9-5\right)^{2}
    part: wartosc_L_dla_M
