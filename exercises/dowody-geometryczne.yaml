  - układ bok–bok–kąt
  - wysokość trójkąta i twierdzenie Pitagorasa
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 2 members matched'
- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: rachunek kątów z niewiadomą wprowadzoną przez ucznia
  statement: Dany jest trójkąt ABC, w którym |CA| = |CB|. Na boku AC obrano punkt D, różny od A i od C,
    taki że |BD| = |BA| oraz |DC| = |DB|. Oblicz miarę kąta ACB.
  statement_latex: 4 \cdot x = 180 - x
  solution: |-
    Nic w treści nie podpowiada, co oznaczyć — wprowadzamy więc jedną niewiadomą i wszystkie kąty wyrażamy przez nią.
    Niech x oznacza miarę kąta ACB (w stopniach).

    Krok 1. Trójkąt DCB jest równoramienny, bo |DC| = |DB|. Kąty przy podstawie CB są równe, a jednym z nich jest kąt DCB = ACB (punkt D leży na boku AC). Zatem |∡DBC| = |∡DCB| = x.

    Krok 2. Kąt BDA jest kątem zewnętrznym trójkąta DCB przy wierzchołku D, więc jest równy sumie kątów wewnętrznych przy pozostałych wierzchołkach:
    |∡BDA| = |∡DCB| + |∡DBC| = x + x = 2x.

    Krok 3. Trójkąt ABD jest równoramienny, bo |BA| = |BD|. Kąty przy podstawie AD są równe, więc
    |∡BAD| = |∡BDA| = 2x. Ponieważ D leży na boku AC, kąt BAD to kąt BAC trójkąta ABC, czyli |∡BAC| = 2x.

    Krok 4. Trójkąt ABC jest równoramienny (|CA| = |CB|), więc jego kąty przy podstawie AB są równe:
    |∡BAC| = \frac{180^\circ - x}{2}.

    Krok 5. Porównujemy wyrażenia z kroków 3 i 4:
    2x = \frac{180^\circ - x}{2}, czyli 4x = 180^\circ - x, stąd 5x = 180^\circ oraz x = 36^\circ.

    Sprawdzenie sensowności: wtedy |∡BAC| = |∡ABC| = 72°, |∡BAD| = 72° = 2·36°, wszystkie kąty są dodatnie i punkt D rzeczywiście leży wewnątrz boku AC.

    Odpowiedź: |∡ACB| = 36^\circ.
  solution_steps:
  - Oznacz x = |∡ACB| — treść zadania nie podaje żadnej miary, trzeba wprowadzić niewiadomą.
  - Z |DC| = |DB| wywnioskuj |∡DBC| = x.
  - 'Z twierdzenia o kącie zewnętrznym: |∡BDA| = 2x.'
  - Z |BA| = |BD| wywnioskuj |∡BAC| = |∡BDA| = 2x.
  - 'Z równoramienności trójkąta ABC: |∡BAC| = \frac{180^\circ - x}{2}.'
  - Rozwiąż równanie 4x = 180^\circ - x i otrzymaj x = 36^\circ.
  answer:
    kind: NUMERIC
    value: 36.0
