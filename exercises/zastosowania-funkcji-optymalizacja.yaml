- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: model liniowy z opisu słownego
  statement: Wypożyczalnia hulajnóg elektrycznych pobiera 3 zł opłaty początkowej za odblokowanie pojazdu
    oraz 0,40 zł za każdą minutę jazdy. Niech t oznacza czas jazdy wyrażony w minutach (t \ge 0), a K(t)
    – łączny koszt jazdy w złotych. (a) Zapisz wzór funkcji K. (b) Oblicz koszt jazdy trwającej 25 minut.
    Zapisz obliczenia.
  statement_latex: K(t)=\frac{2}{5}\cdot t+3,\qquad K\left(25\right)=\frac{2}{5}\cdot 25+3
  solution: |-
    (a) Opłata początkowa nie zależy od czasu jazdy – jest to wartość początkowa b, czyli K(0)=3 zł. Za każdą kolejną minutę dopłacamy tyle samo, czyli 0,40 zł – to stałe tempo zmian a. Zatem model jest liniowy: K(t)=0{,}4\cdot t+3, dla t \ge 0.
    (b) Podstawiamy t=25: K(25)=0{,}4\cdot 25+3=10+3=13.
    Odpowiedź: (a) K(t)=0{,}4t+3; (b) jazda trwająca 25 minut kosztuje 13 zł.
  solution_steps:
  - 'Wprowadź zmienną: t – czas jazdy w minutach, t \ge 0.'
  - 'Odczytaj wartość początkową: b = 3 (zł) – opłata za odblokowanie.'
  - 'Odczytaj tempo zmian: a = 0,40 (zł za każdą minutę).'
  - 'Zapisz wzór: K(t)=0{,}4t+3.'
  - 'Podstaw t=25: K(25)=0{,}4\cdot 25+3=13.'
  - 'Odpowiedź z jednostką: 13 zł.'
  answer:
    kind: MULTIPART
    parts:
    - name: wzór funkcji K
      answer:
        kind: SYMBOLIC
        latex: K(t)=\frac{2}{5}t+3
    - name: koszt jazdy 25-minutowej (zł)
      answer:
        kind: NUMERIC
        value: 13.0
  checks:
  - kind: evaluate
    expr: \frac{2}{5}\cdot 25+3
    var: t
    part: koszt jazdy 25-minutowej (zł)
  skills:
  - budowa modelu liniowego
  - interpretacja współczynników a i b
  - obliczanie wartości funkcji
