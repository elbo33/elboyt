- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: liczby wielocyfrowe z ograniczeniami
  statement: Rozważamy wszystkie liczby czterocyfrowe o wszystkich cyfrach różnych, utworzone wyłącznie
    z cyfr ze zbioru {0, 1, 2, 3, 5, 7}. a) Oblicz, ile jest wszystkich takich liczb. b) Oblicz, ile spośród
    nich jest liczbami parzystymi.
  statement_latex: N = 5 \cdot 5 \cdot 4 \cdot 3
  solution: |-
    Jednym obiektem jest liczba czterocyfrowa; kolejność cyfr ma znaczenie, cyfry nie mogą się powtarzać, a cyfra tysięcy musi być różna od 0.

    a) Obsadzamy najpierw miejsce z ograniczeniem — tysiące: cyfra różna od 0, czyli jedna z {1,2,3,5,7} — 5 możliwości. Setki: zostało 5 cyfr z sześciu (zero jest już dozwolone) — 5 możliwości. Dziesiątki: 4 możliwości. Jedności: 3 możliwości.
    N = 5 \cdot 5 \cdot 4 \cdot 3 = 300.

    b) Liczba jest parzysta wtedy i tylko wtedy, gdy jej cyfra jedności należy do {0, 2}. Warunek na jedności koliduje z warunkiem na tysiące (oba dotyczą zera), więc dzielimy na dwa rozłączne przypadki.
    Przypadek A: cyfra jedności = 0 (1 sposób). Tysiące: dowolna z pozostałych 5 cyfr — 5 możliwości. Setki: 4 możliwości, dziesiątki: 3 możliwości. Razem 5 \cdot 4 \cdot 3 = 60.
    Przypadek B: cyfra jedności = 2 (1 sposób). Tysiące: cyfra różna od 0 i od 2, czyli jedna z {1,3,5,7} — 4 możliwości. Setki: z sześciu cyfr dwie są zużyte — 4 możliwości. Dziesiątki: 3 możliwości. Razem 4 \cdot 4 \cdot 3 = 48.
    Przypadki są rozłączne, więc dodajemy: 60 + 48 = 108.
    Kontrola sensowności: 108 < 300 ✓.

    Odpowiedź: a) 300 liczb, b) 108 liczb parzystych.
  solution_steps:
  - 'Zapisz warunki: cyfry różne, cyfra tysięcy ≠ 0, cyfry ze zbioru {0,1,2,3,5,7}.'
  - a) Obsadź tysiące (5 możliwości), potem setki (5), dziesiątki (4) i jedności (3).
  - a) Oblicz N = 5 \cdot 5 \cdot 4 \cdot 3 = 300.
  - b) Zauważ, że parzystość wymaga cyfry jedności ze zbioru {0, 2}; podziel na dwa rozłączne przypadki.
  - 'b) Przypadek jedności = 0: 5 \cdot 4 \cdot 3 = 60.'
  - 'b) Przypadek jedności = 2: 4 \cdot 4 \cdot 3 = 48.'
  - 'b) Dodaj przypadki: 60 + 48 = 108.'
  answer:
    kind: MULTIPART
    parts:
    - name: a) wszystkie liczby
      answer:
        kind: NUMERIC
        value: 300.0
    - name: b) liczby parzyste
      answer:
        kind: NUMERIC
        value: 108.0
  checks:
  - kind: evaluate
    expr: 5 \cdot 5 \cdot 4 \cdot 3
    part: a) wszystkie liczby
  - kind: evaluate
    expr: 5 \cdot 4 \cdot 3 + 4 \cdot 4 \cdot 3
    part: b) liczby parzyste
  skills:
  - reguła mnożenia z miejscami
  - cyfra wiodąca ≠ 0
  - podział na rozłączne przypadki
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [a) wszystkie liczby] SymPy solved it fresh: 300.0 vs 300.0
      (tol 1e-09) ; [b) liczby parzyste] SymPy solved it fresh: 108.0 vs 108.0 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: kody — powtórzenia i dopełnienie
  statement: Kod dostępu składa się z 5 znaków, a każdym znakiem jest jedna z liter A, B, C, D (litery
    mogą się powtarzać). a) Oblicz, ile jest wszystkich takich kodów. b) Oblicz, ile jest kodów, w których
    nie występuje litera A. c) Oblicz, ile jest kodów, w których litera A występuje co najmniej raz. d)
    Oblicz, ile jest kodów, w których litera A występuje dokładnie raz.
  statement_latex: N = 4^5,\quad M = 3^5,\quad N - M = 4^5 - 3^5
  solution: |-
    Jednym obiektem jest pięcioznakowy ciąg liter; kolejność ma znaczenie, litery mogą się powtarzać.

    a) Na każdym z 5 miejsc mamy 4 możliwości: N = 4^5 = 1024 kody.

    b) Jeśli litera A jest zabroniona, to na każdym miejscu dostępne są tylko litery B, C, D: M = 3^5 = 243 kody.

    c) Zaprzeczeniem warunku „litera A występuje co najmniej raz” jest „litera A nie występuje ani razu”, a takich kodów jest 243 (punkt b). Liczymy przez dopełnienie w tym samym zbiorze wszystkich kodów:
    1024 − 243 = 781 kodów.
    (Rozumowanie „wybieram miejsce dla A na 5 sposobów i resztę na 4^4 sposobów”, dające 1280, jest błędne — kody z dwiema lub więcej literami A byłyby policzone wielokrotnie, a 1280 > 1024.)

    d) Wybieramy miejsce dla jedynej litery A — 5 sposobów; na każdym z pozostałych 4 miejsc musi stać litera różna od A, czyli 3 możliwości:
    5 \cdot 3^4 = 5 \cdot 81 = 405 kodów.
    Kontrola sensowności: 405 < 781 ✓ (kody z dokładnie jedną literą A stanowią część kodów z co najmniej jedną literą A).

    Odpowiedź: a) 1024, b) 243, c) 781, d) 405.
  solution_steps:
  - 'Ustal: obiekt to ciąg 5 liter, kolejność ma znaczenie, powtórzenia dozwolone.'
  - a) Oblicz N = 4^5 = 1024.
  - 'b) Ogranicz pulę do liter B, C, D: M = 3^5 = 243.'
  - 'c) Sformułuj zaprzeczenie warunku „co najmniej jedna litera A” i policz przez dopełnienie: 1024 −
    243 = 781.'
  - 'd) Wybierz miejsce dla jedynej litery A (5 sposobów) i obsadź pozostałe 4 miejsca literami różnymi
    od A: 5 \cdot 3^4 = 405.'
  answer:
    kind: MULTIPART
    parts:
    - name: a) wszystkie kody
      answer:
        kind: NUMERIC
        value: 1024.0
    - name: b) bez litery A
      answer:
        kind: NUMERIC
        value: 243.0
    - name: c) co najmniej jedna litera A
      answer:
        kind: NUMERIC
        value: 781.0
    - name: d) dokładnie jedna litera A
      answer:
        kind: NUMERIC
        value: 405.0
  checks:
  - kind: evaluate
    expr: 4^5
    part: a) wszystkie kody
  - kind: evaluate
    expr: 3^5
    part: b) bez litery A
  - kind: evaluate
    expr: 4^5 - 3^5
    part: c) co najmniej jedna litera A
  - kind: evaluate
    expr: 5 \cdot 3^4
    part: d) dokładnie jedna litera A
  skills:
  - ciągi z powtórzeniami
  - zliczanie przez dopełnienie
  - podział na rozłączne przypadki
  verification:
    checkability: DETERMINISTIC
    note: 'all 4 parts solved fresh · det: [a) wszystkie kody] SymPy solved it fresh: 1024.0 vs 1024.0
      (tol 1e-09) ; [b) bez litery A] SymPy solved it fresh: 243.0 vs 243.0 (tol 1e-09) ; [c) co najmniej
      jedna litera A] SymPy solved it fresh: 781.0 vs 781.0 (tol 1e-09) ; [d) dokładnie jedna litera A]
      SymPy solved it fresh: 405.0 vs 405.0 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: zliczanie liczb wielocyfrowych z ograniczeniami na pozycje
  statement: Rozważamy wszystkie liczby czterocyfrowe o wszystkich cyfrach różnych, w zapisie których
    występują wyłącznie cyfry ze zbioru {0, 1, 2, 3, 5, 7}. a) Oblicz, ile jest wszystkich takich liczb.
    b) Oblicz, ile spośród nich jest liczbami nieparzystymi.
  statement_latex: N = 5 \cdot 5 \cdot 4 \cdot 3, \qquad N_{np} = 4 \cdot 4 \cdot 4 \cdot 3
  solution: |-
    Jednym liczonym obiektem jest liczba czterocyfrowa, czyli ciąg czterech pozycji: tysiące, setki, dziesiątki, jedności. Cyfry nie mogą się powtarzać, a kolejność oczywiście ma znaczenie. Do dyspozycji mamy 6 cyfr: 0, 1, 2, 3, 5, 7.

    a) Zaczynamy od miejsca z ograniczeniem. Cyfra tysięcy musi być różna od 0, więc mamy dla niej 5 możliwości (1, 2, 3, 5, 7). Na miejsce setek możemy wziąć każdą z pozostałych 5 cyfr (zero jest już dozwolone), na miejsce dziesiątek — jedną z 4 pozostałych, na miejsce jedności — jedną z 3 pozostałych.
    Regułą mnożenia: N = 5 \cdot 5 \cdot 4 \cdot 3 = 300.

    b) Liczba jest nieparzysta wtedy i tylko wtedy, gdy jej cyfra jedności należy do zbioru {1, 3, 5, 7} — mamy 4 możliwości. Teraz obsadzamy miejsce tysięcy: odpada 0 oraz cyfra już użyta na miejscu jedności, zostają zatem 4 możliwości. Na setki pozostają 4 cyfry (z sześciu dwie są zużyte), na dziesiątki — 3 cyfry.
    N_np = 4 \cdot 4 \cdot 4 \cdot 3 = 192.

    Kontrola sensowności. Liczb parzystych jest: przypadek A (jedności = 0): 5 \cdot 4 \cdot 3 = 60; przypadek B (jedności ∈ {2}): 4 \cdot 4 \cdot 3 = 48; razem 108. Ponieważ 192 + 108 = 300, wynik jest zgodny z punktem a). ✓

    Odpowiedź: a) 300 liczb, b) 192 liczby nieparzyste.
  solution_steps:
  - Ustal, że obiektem jest ciąg czterech różnych cyfr ze zbioru 6-elementowego, przy czym pierwsza cyfra
    ≠ 0.
  - 'Obsadź najpierw miejsce tysięcy: 5 możliwości; potem setki: 5, dziesiątki: 4, jedności: 3.'
  - 'Pomnóż: 5·5·4·3 = 300.'
  - 'Dla liczb nieparzystych obsadź najpierw jedności: 4 możliwości (1, 3, 5, 7).'
  - 'Następnie tysiące (bez 0 i bez cyfry jedności): 4 możliwości, setki: 4, dziesiątki: 3.'
  - 'Pomnóż: 4·4·4·3 = 192 i sprawdź, że liczb parzystych jest 300 − 192 = 108.'
  answer:
    kind: MULTIPART
    parts:
    - name: wszystkie
      answer:
        kind: NUMERIC
        value: 300.0
    - name: nieparzyste
      answer:
        kind: NUMERIC
        value: 192.0
  checks:
  - kind: evaluate
    expr: 5 \cdot 5 \cdot 4 \cdot 3
    part: wszystkie
  - kind: evaluate
    expr: 4 \cdot 4 \cdot 4 \cdot 3
    part: nieparzyste
  skills:
  - reguła mnożenia z miejscami
  - warunek niezerowej cyfry wiodącej
  - wybór bez powtórzeń
  - podział na przypadki i kontrola wyniku
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [wszystkie] SymPy solved it fresh: 300.0 vs 300.0 (tol 1e-09)
      ; [nieparzyste] SymPy solved it fresh: 192.0 vs 192.0 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: 'zliczanie kodów: reguła mnożenia i dopełnienie'
  statement: Kod dostępu do szafki składa się z trzech znaków, a każdym znakiem jest jedna z liter A,
    B, C, D, E, F (litery w kodzie mogą się powtarzać; kolejność liter ma znaczenie). a) Oblicz, ile jest
    wszystkich takich kodów. b) Oblicz, ile jest kodów, w których litera A występuje co najmniej raz.
    c) Oblicz, ile jest kodów, w których wszystkie trzy litery są różne i wśród nich występuje litera
    A.
  statement_latex: N = 6^{3}, \qquad N_{A} = 6^{3} - 5^{3}, \qquad N_{r} = 6 \cdot 5 \cdot 4 - 5 \cdot
    4 \cdot 3
  solution: |-
    Jednym obiektem jest kod, czyli trójwyrazowy ciąg liter ze zbioru 6-elementowego. Kolejność ma znaczenie (kod ABC to inny kod niż BAC).

    a) Powtórzenia są dozwolone, więc na każdym z trzech miejsc mamy po 6 możliwości:
    N = 6^3 = 216.

    b) Warunek „co najmniej raz” liczymy przez dopełnienie. Zaprzeczeniem zdania „litera A występuje co najmniej raz” jest zdanie „litera A nie występuje ani razu”. Kodów bez litery A jest 5^3 = 125 (na każdym miejscu tylko B, C, D, E, F). Zatem
    N_A = 216 − 125 = 91.
    (Uwaga: rozumowanie „wybieram miejsce dla A na 3 sposoby i resztę na 6^2 sposobów”, dające 108, jest błędne — kody z dwiema lub trzema literami A policzylibyśmy wielokrotnie.)

