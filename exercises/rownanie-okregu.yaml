- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: równanie okręgu z parametrem
  statement: W kartezjańskim układzie współrzędnych (x, y) dane jest równanie \left(x+3\right)^2+\left(y-1\right)^2=3\cdot
    m-2 z parametrem m. a) Wyznacz wszystkie wartości m, dla których to równanie opisuje okrąg. b) Wyznacz
    tę wartość m, dla której punkt P=\left(1,4\right) leży na tym okręgu. c) Wyznacz tę wartość m, dla
    której okrąg ten jest styczny do osi Oy.
  statement_latex: \left(x+3\right)^2+\left(y-1\right)^2=3\cdot m-2
  solution: |-
    Lewa strona równania jest sumą kwadratów, a środek odczytujemy ze zmienionymi znakami: S=\left(-3,1\right). Prawa strona to r^2.

    a) Równanie opisuje okrąg dokładnie wtedy, gdy prawa strona jest dodatnia: 3\cdot m-2>0, czyli m>\frac{2}{3}. Zatem m\in\left(\frac{2}{3},\infty\right).

    b) Punkt P=\left(1,4\right) leży na okręgu, gdy spełnia równanie:
    \left(1+3\right)^2+\left(4-1\right)^2=3\cdot m-2,
    16+9=3\cdot m-2, czyli 3\cdot m-2=25, stąd m=9. Warunek m>\frac{2}{3} jest spełniony, więc dla m=9 mamy okrąg o promieniu r=5.

    c) Odległość środka S=\left(-3,1\right) od osi Oy wynosi \left|-3\right|=3, więc styczność do Oy zachodzi dokładnie wtedy, gdy r=3, czyli r^2=9:
    3\cdot m-2=9, stąd m=\frac{11}{3}. Ta wartość spełnia m>\frac{2}{3}, więc jest to okrąg \left(x+3\right)^2+\left(y-1\right)^2=9, styczny do osi Oy w punkcie \left(0,1\right).
  solution_steps:
  - 'Odczytaj środek: S=\left(-3,1\right); prawa strona równa się r^2.'
  - 'a) Zapisz warunek istnienia okręgu 3\cdot m-2>0 i rozwiąż: m>\frac{2}{3}.'
  - 'b) Podstaw współrzędne punktu P: \left(1+3\right)^2+\left(4-1\right)^2=25, więc 3\cdot m-2=25 i m=9.'
  - Sprawdź, że m=9 spełnia warunek m>\frac{2}{3}.
  - c) Odległość S od osi Oy to \left|-3\right|=3, więc warunek styczności to r^2=9, czyli 3\cdot m-2=9
    i m=\frac{11}{3}.
  answer:
    kind: MULTIPART
    parts:
    - name: m_okrag
      answer:
        kind: INTERVAL
        lo: \frac{2}{3}
        hi: \infty
    - name: m_przez_P
      answer:
        kind: NUMERIC
        value: 9.0
        latex: '9'
    - name: m_stycznosc_Oy
      answer:
        kind: NUMERIC
        value: 3.6666666666666665
        latex: \frac{11}{3}
  checks:
  - kind: solve_inequality
    expr: 3\cdot m-2>0
    var: m
    part: m_okrag
  - kind: solve_equation
    expr: 3\cdot m-2=\left(1+3\right)^2+\left(4-1\right)^2
    var: m
    part: m_przez_P
  - kind: solve_equation
    expr: 3\cdot m-2=9
    var: m
    part: m_stycznosc_Oy
  skills:
  - warunek istnienia okręgu
