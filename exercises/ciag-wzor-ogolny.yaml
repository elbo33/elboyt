  statement: Ciąg \left(a_{n}\right) jest określony wzorem a_{n}=4\cdot n-7 dla każdej liczby naturalnej
    n\geq 1. Oblicz pierwszy wyraz tego ciągu oraz wyraz a_{5}.
  statement_latex: a_{n}=4\cdot n-7,\qquad n\geq 1
  solution: |-
    W miejsce n wstawiamy kolejno podane numery wyrazów.
    Dla n=1: a_{1}=4\cdot 1-7=4-7=-3.
    Dla n=5: a_{5}=4\cdot 5-7=20-7=13.
    Pierwszym wyrazem ciągu jest a_{1} (nie a_{0}), zatem a_{1}=-3 oraz a_{5}=13.
  solution_steps:
  - Zapisz wzór ogólny a_{n}=4\cdot n-7.
  - 'Podstaw n=1: a_{1}=4\cdot 1-7=-3.'
  - 'Podstaw n=5: a_{5}=4\cdot 5-7=13.'
  - 'Zapisz odpowiedź: a_{1}=-3, a_{5}=13.'
