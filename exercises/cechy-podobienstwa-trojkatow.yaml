- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 3
  exercise_type: modelowanie sytuacji praktycznej trójkątami podobnymi
  statement: Ola chce zmierzyć wysokość rosnącego na płaskim, poziomym terenie drzewa. Wbiła pionowo w
    ziemię tyczkę o wysokości 2 m w odległości 3 m od pnia drzewa. Następnie położyła się na ziemi po
    drugiej stronie tyczki tak, aby jej oko znajdowało się tuż przy powierzchni ziemi, i tak dobrała miejsce,
    żeby wierzchołek tyczki i wierzchołek drzewa widzieć w jednej linii. Odległość oka Oli od podstawy
    tyczki wynosiła wtedy 1,2 m. Oko Oli, podstawa tyczki i pień drzewa leżą na jednej prostej, a drzewo
    i tyczka są prostopadłe do podłoża. Oblicz wysokość tego drzewa. Zapisz obliczenia.
  statement_latex: \frac{h}{1{,}2+3}=\frac{2}{1{,}2}\quad\Longrightarrow\quad h=\frac{2\cdot\left(1{,}2+3\right)}{1{,}2}
  solution: |-
    Model: oznaczmy przez O punkt, w którym znajduje się oko Oli, przez T — podstawę tyczki, przez P — podstawę (pień) drzewa. Punkty O, T, P leżą na jednej prostej, przy czym |OT| = 1,2 m oraz |TP| = 3 m, więc |OP| = 1,2 + 3 = 4,2 m.
    Tyczka i drzewo są prostopadłe do podłoża, a wierzchołek tyczki i wierzchołek drzewa leżą na jednej prostej wychodzącej z punktu O. Otrzymujemy dwa trójkąty prostokątne: mniejszy — o przyprostokątnych 1,2 m (podłoże) i 2 m (tyczka) — oraz większy — o przyprostokątnych 4,2 m i h (wysokość drzewa).
    Oba trójkąty mają kąt prosty przy podłożu oraz wspólny kąt ostry przy wierzchołku O (linia wzroku jest tą samą prostą), więc na mocy cechy kkk są podobne.
    Układamy proporcję odpowiadających sobie boków:
    \frac{h}{4{,}2}=\frac{2}{1{,}2}
    Stąd h = \frac{2\cdot 4{,}2}{1{,}2} = \frac{8{,}4}{1{,}2} = 7.
    Wysokość drzewa jest równa 7 m.
    Sprawdzenie sensowności: skala podobieństwa wynosi k = 4,2 : 1,2 = 3,5, a 3,5 · 2 m = 7 m — zgadza się.
  solution_steps:
  - 'Zbuduj model: dwa trójkąty prostokątne o wspólnym wierzchołku w punkcie, w którym znajduje się oko,
    z pionową tyczką i pionowym drzewem jako przyprostokątnymi.'
  - 'Oblicz odległość oka od pnia drzewa: 1,2 + 3 = 4,2 m.'
  - Uzasadnij podobieństwo trójkątów cechą kkk (kąt prosty i wspólny kąt przy oku).
  - Ułóż proporcję h/4,2 = 2/1,2.
  - 'Rozwiąż proporcję: h = 2·4,2/1,2 = 7, czyli drzewo ma 7 m wysokości.'
  answer:
    kind: NUMERIC
    value: 7.0
  checks:
  - kind: evaluate
    expr: \frac{2\cdot\left(1.2+3\right)}{1.2}
    var: h
  stated_model:
    variable: h
    objective_latex: \frac{h}{1.2+3}=\frac{2}{1.2}
    domain_lo: '0'
    goal: value
    constraint_used: trójkąty prostokątne o wspólnym kącie przy oku obserwatora są podobne (kkk)
  skills:
  - budowanie modelu geometrycznego z opisu słownego
  - uzasadnianie podobieństwa cechą kkk
  - układanie proporcji wysokość–odległość
  - interpretacja wyniku w kontekście
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''h'': ''\\frac{h}{1.2+3}=\\frac{2}{1.2}'')
