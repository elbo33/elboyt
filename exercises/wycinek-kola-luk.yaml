- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie długości łuku
  statement: Punkty A i B leżą na okręgu o środku O i promieniu r = 9 cm, a kąt środkowy AOB ma miarę
    40°. Oblicz długość krótszego łuku AB. Wynik podaj w postaci dokładnej (z liczbą π).
  statement_latex: l=\frac{40^\circ}{360^\circ}\cdot 2\cdot\pi\cdot 9
  solution: 'Łuk AB odpowiada kątowi środkowemu 40°, więc stanowi taką część okręgu, jaką część kąta pełnego
    stanowi 40°: \frac{40^\circ}{360^\circ}=\frac{1}{9}. Obwód całego okręgu wynosi 2\cdot\pi\cdot 9=18\pi
    cm. Zatem l=\frac{1}{9}\cdot 18\pi=2\pi cm ≈ 6{,}28 cm. Kontrola: 2\pi\le 18\pi, jednostka liniowa
    – wynik sensowny.'
  solution_steps:
  - 'Wyznacz ułamek koła: \frac{40^\circ}{360^\circ}=\frac{1}{9}.'
  - 'Oblicz obwód całego okręgu: 2\cdot\pi\cdot 9=18\pi cm.'
  - 'Pomnóż obwód przez ułamek: l=\frac{1}{9}\cdot 18\pi=2\pi cm.'
  - Sprawdź jednostkę (cm) i warunek l\le 2\pi r.
  answer:
    kind: SYMBOLIC
    latex: 2\pi
