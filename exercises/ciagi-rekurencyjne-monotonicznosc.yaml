  - Wyznacz a_{n+1} = 7 - 2\left(n+1\right) = 5 - 2n.
  - 'Oblicz różnicę: a_{n+1} - a_{n} = \left(5-2n\right) - \left(7-2n\right) = -2.'
  - Ponieważ -2 < 0 dla każdego n \geq 1, ciąg jest malejący; uczeń odwrócił kolejność odejmowania i dlatego
    pomylił wniosek.
  answer:
