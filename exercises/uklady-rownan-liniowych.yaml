  - 'Sprawdź parę (0, 0) w pierwszym równaniu: 2·0 - 0 = 0 ≠ 3 — nie jest rozwiązaniem.'
  - Zauważ, że drugie równanie to pierwsze pomnożone przez (-3), łącznie z wyrazem wolnym.
  - 'Wyciągnij poprawny wniosek: 0 = 0 oznacza układ nieoznaczony, nieskończenie wiele rozwiązań, proste
    się pokrywają.'
  - 'Opisz zbiór rozwiązań: y = 2x - 3, czyli pary (x, 2x - 3) dla x ∈ R.'
