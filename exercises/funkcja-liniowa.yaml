- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: odczyt współczynników ze wzoru
  statement: Funkcja liniowa f jest określona wzorem f(x) = -3x + 5. Podaj współczynnik kierunkowy a oraz
    wyraz wolny b tej funkcji, a następnie oblicz jej miejsce zerowe.
  statement_latex: f(x) = -3\cdot x + 5
  solution: |-
    We wzorze f(x) = ax + b liczba stojąca przy x to współczynnik kierunkowy, a liczba dodawana to wyraz wolny.
    Stąd a = -3 oraz b = 5 (wykres przecina oś Oy w punkcie (0, 5)).
    Miejsce zerowe to rozwiązanie równania f(x) = 0:
    -3x + 5 = 0
    -3x = -5
    x = \frac{5}{3}.
    Sprawdzenie: f\left(\frac{5}{3}\right) = -3\cdot\frac{5}{3} + 5 = -5 + 5 = 0 ✓.
  solution_steps:
  - Porównaj wzór f(x) = -3x + 5 z postacią f(x) = ax + b.
  - Odczytaj a = -3 (liczba przy x) oraz b = 5 (wyraz wolny).
  - Rozwiąż równanie -3x + 5 = 0.
  - Otrzymaj x = \frac{5}{3} i sprawdź, podstawiając do wzoru.
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: NUMERIC
        value: -3.0
    - name: b
      answer:
        kind: NUMERIC
        value: 5.0
    - name: miejsce zerowe
      answer:
        kind: NUMERIC
        value: 1.6666666666666667
  checks:
  - kind: solve_equation
    expr: -3\cdot x + 5 = 0
    part: miejsce zerowe
  skills:
  - identyfikacja współczynnika kierunkowego i wyrazu wolnego
  - obliczanie miejsca zerowego funkcji liniowej
  verification:
    checkability: REFERENCE_CALL
    note: '3 parts matched · det: [miejsce zerowe] SymPy solved it fresh: 1.6666666666666667 vs 1.6666666666666667
      (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: współczynnik kierunkowy z dwóch punktów
  statement: Do wykresu pewnej funkcji liniowej należą punkty A = (-1, 4) oraz B = (3, -2). Oblicz współczynnik
    kierunkowy a tej funkcji.
  statement_latex: a = \frac{-2 - 4}{3 - \left(-1\right)}
  solution: |-
    Korzystamy ze wzoru na współczynnik kierunkowy prostej przechodzącej przez dwa punkty:
    a = \frac{y_2 - y_1}{x_2 - x_1} = \frac{-2 - 4}{3 - \left(-1\right)} = \frac{-6}{4} = -\frac{3}{2}.
    W liczniku i mianowniku odejmowaliśmy w tej samej kolejności (od B do A), więc znak jest poprawny.
    Ponieważ a = -\frac{3}{2} < 0, funkcja jest malejąca.
  solution_steps:
  - Oznacz A = (x_1, y_1) = (-1, 4) oraz B = (x_2, y_2) = (3, -2).
  - Podstaw do wzoru a = \frac{y_2 - y_1}{x_2 - x_1}.
  - Oblicz a = \frac{-6}{4} = -\frac{3}{2}.
  answer:
    kind: NUMERIC
    value: -1.5
  checks:
  - kind: evaluate
    expr: \frac{-2 - 4}{3 - \left(-1\right)}
  skills:
  - obliczanie a jako ilorazu przyrostów
  - wnioskowanie o monotoniczności ze znaku a
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: -1.5 vs -1.5 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: warunki równoległości i prostopadłości
  statement: Dana jest prosta k o równaniu y = -\frac{2}{5}x + 7. Podaj współczynnik kierunkowy prostej
    równoległej do prostej k oraz współczynnik kierunkowy prostej prostopadłej do prostej k.
  statement_latex: k:\; y = -\frac{2}{5}\cdot x + 7
  solution: |-
    Prosta k ma współczynnik kierunkowy a_1 = -\frac{2}{5}.
    Proste równoległe mają ten sam współczynnik kierunkowy, więc dla prostej równoległej a = -\frac{2}{5}.
    Dla prostej prostopadłej musi zachodzić a_1\cdot a = -1, czyli a = -\frac{1}{a_1} = -\frac{1}{-\frac{2}{5}} = \frac{5}{2}.
    Sprawdzenie: \left(-\frac{2}{5}\right)\cdot\frac{5}{2} = -1 ✓.
  solution_steps:
  - 'Odczytaj współczynnik kierunkowy prostej k: a_1 = -\frac{2}{5}.'
  - Dla równoległej przyjmij a = a_1 = -\frac{2}{5}.
  - Dla prostopadłej oblicz a = -\frac{1}{a_1} = \frac{5}{2}.
  - Sprawdź warunek a_1\cdot a = -1.
  answer:
    kind: MULTIPART
    parts:
    - name: wspolczynnik prostej rownoleglej
      answer:
        kind: NUMERIC
        value: -0.4
    - name: wspolczynnik prostej prostopadlej
      answer:
        kind: NUMERIC
        value: 2.5
  checks:
  - kind: evaluate
    expr: -\frac{2}{5}
    part: wspolczynnik prostej rownoleglej
  - kind: evaluate
    expr: -\frac{1}{-\frac{2}{5}}
    part: wspolczynnik prostej prostopadlej
  skills:
  - warunek równoległości a_1 = a_2
  - warunek prostopadłości a_1\cdot a_2 = -1
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [wspolczynnik prostej rownoleglej] SymPy solved it fresh: -0.4
      vs -0.4 (tol 1e-09) ; [wspolczynnik prostej prostopadlej] SymPy solved it fresh: 2.5 vs 2.5 (tol
      1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: wyznaczanie wzoru z dwóch warunków
  statement: 'Funkcja liniowa f spełnia warunki: f(-2) = 9 oraz f(3) = -1. Wyznacz wzór funkcji f, oblicz
    jej miejsce zerowe oraz rozstrzygnij, czy punkt P = (4, -3) należy do wykresu funkcji f.'
  statement_latex: f(-2) = 9,\qquad f(3) = -1
  solution: |-
    Warunki oznaczają, że do wykresu należą punkty A = (-2, 9) i B = (3, -1).
    Współczynnik kierunkowy:
    a = \frac{-1 - 9}{3 - \left(-2\right)} = \frac{-10}{5} = -2.
    Wyraz wolny wyznaczamy z punktu A:
    b = y_A - a\cdot x_A = 9 - \left(-2\right)\cdot\left(-2\right) = 9 - 4 = 5.
    Zatem f(x) = -2x + 5.
    Sprawdzenie na punkcie B: f(3) = -6 + 5 = -1 ✓.
    Miejsce zerowe: -2x + 5 = 0, czyli x = \frac{5}{2}.
    Punkt P: f(4) = -8 + 5 = -3, a więc rzeczywiście f(4) = -3 i punkt P = (4, -3) należy do wykresu funkcji f.
  solution_steps:
  - 'Zamień warunki na punkty wykresu: A = (-2, 9), B = (3, -1).'
  - Oblicz a = \frac{-1 - 9}{3 - \left(-2\right)} = -2.
  - Oblicz b = 9 - \left(-2\right)\cdot\left(-2\right) = 5 i zapisz f(x) = -2x + 5.
  - Rozwiąż -2x + 5 = 0, otrzymując miejsce zerowe x = \frac{5}{2}.
  - Oblicz f(4) = -3 i stwierdź, że punkt P należy do wykresu.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor funkcji
      answer:
        kind: SYMBOLIC
        latex: f(x) = -2x + 5
    - name: miejsce zerowe
      answer:
        kind: NUMERIC
        value: 2.5
    - name: czy P nalezy do wykresu
      answer:
        kind: BOOLEAN
        truth: true
  checks:
  - kind: solve_equation
    expr: -2\cdot x + 5 = 0
    part: miejsce zerowe
  skills:
  - układanie równań z warunków f(x_1)=y_1
  - wyznaczanie wzoru funkcji liniowej
  - sprawdzanie przynależności punktu do wykresu
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: AMBIGUOUS: ''parser returned an unresolved ambiguity (_ambig)'''
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: proste równoległe i prostopadłe przez dany punkt
  statement: Dana jest prosta k o równaniu 4x - 3y + 12 = 0 oraz punkt A = (6, -1). Wyznacz wzór funkcji
    liniowej g, której wykres jest równoległy do prostej k i przechodzi przez punkt A, wyznacz wzór funkcji
    liniowej h, której wykres jest prostopadły do prostej k i przechodzi przez punkt A, a następnie oblicz
    miejsce zerowe funkcji h.
  statement_latex: k:\; 4\cdot x - 3\cdot y + 12 = 0,\qquad A = \left(6,\; -1\right)
  solution: |-
    Krok 1. Postać kierunkowa prostej k: 3y = 4x + 12, czyli y = \frac{4}{3}x + 4. Zatem a_1 = \frac{4}{3}.
    Krok 2. Prosta równoległa ma a = \frac{4}{3}. Z warunku przejścia przez A:
    b = -1 - \frac{4}{3}\cdot 6 = -1 - 8 = -9, więc g(x) = \frac{4}{3}x - 9 (wyrazy wolne -9 i 4 są różne, więc proste są równoległe i różne).
    Krok 3. Prosta prostopadła ma a = -\frac{1}{\frac{4}{3}} = -\frac{3}{4}. Z warunku przejścia przez A:
    b = -1 + \frac{3}{4}\cdot 6 = -1 + \frac{9}{2} = \frac{7}{2}, więc h(x) = -\frac{3}{4}x + \frac{7}{2}.
    Krok 4. Miejsce zerowe funkcji h: -\frac{3}{4}x + \frac{7}{2} = 0, stąd \frac{3}{4}x = \frac{7}{2}, czyli x = \frac{14}{3}.
    Sprawdzenie: \frac{4}{3}\cdot\left(-\frac{3}{4}\right) = -1 ✓ oraz h(6) = -\frac{9}{2} + \frac{7}{2} = -1 ✓.
  solution_steps:
  - Przekształć 4x - 3y + 12 = 0 do postaci y = \frac{4}{3}x + 4 i odczytaj a_1 = \frac{4}{3}.
  - Dla równoległej przyjmij a = \frac{4}{3} i oblicz b = -1 - \frac{4}{3}\cdot 6 = -9.
  - Zapisz g(x) = \frac{4}{3}x - 9.
  - Dla prostopadłej przyjmij a = -\frac{3}{4} i oblicz b = -1 - \left(-\frac{3}{4}\right)\cdot 6 = \frac{7}{2}.
  - Zapisz h(x) = -\frac{3}{4}x + \frac{7}{2}.
  - Rozwiąż -\frac{3}{4}x + \frac{7}{2} = 0 i otrzymaj x = \frac{14}{3}.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor g
      answer:
        kind: SYMBOLIC
        latex: g(x) = \frac{4}{3}x - 9
    - name: wzor h
      answer:
        kind: SYMBOLIC
        latex: h(x) = -\frac{3}{4}x + \frac{7}{2}
    - name: miejsce zerowe h
      answer:
        kind: NUMERIC
        value: 4.666666666666667
  checks:
  - kind: solve_equation
    expr: -\frac{3}{4}\cdot x + \frac{7}{2} = 0
    part: miejsce zerowe h
  skills:
  - zamiana postaci ogólnej na kierunkową
  - wyznaczanie prostej równoległej i prostopadłej przez punkt
  - obliczanie miejsca zerowego
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: AMBIGUOUS: ''parser returned an unresolved ambiguity (_ambig)'''
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: wzajemne położenie prostych z parametrem
  statement: 'Dane są proste: k o równaniu y = \left(2m + 1\right)x - 3 oraz l o równaniu 4x + 2y - 7
    = 0, gdzie m jest liczbą rzeczywistą. Wyznacz tę wartość m, dla której proste k i l są równoległe,
    i uzasadnij, że dla tej wartości m proste te są równoległe i różne. Wyznacz też tę wartość m, dla
    której proste k i l są prostopadłe.'
  statement_latex: k:\; y = \left(2\cdot m + 1\right)\cdot x - 3,\qquad l:\; 4\cdot x + 2\cdot y - 7 =
    0
  solution: |-
    Krok 1. Postać kierunkowa prostej l: 2y = -4x + 7, czyli y = -2x + \frac{7}{2}. Zatem a_l = -2 oraz b_l = \frac{7}{2}.
    Krok 2. Równoległość: 2m + 1 = -2, stąd 2m = -3 i m = -\frac{3}{2}.
    Uzasadnienie różności: dla m = -\frac{3}{2} prosta k ma równanie y = -2x - 3, a prosta l równanie y = -2x + \frac{7}{2}. Współczynniki kierunkowe są równe, a wyrazy wolne różne \left(-3 \neq \frac{7}{2}\right), więc proste są równoległe i nie pokrywają się.
    Krok 3. Prostopadłość: \left(2m + 1\right)\cdot\left(-2\right) = -1, czyli 2m + 1 = \frac{1}{2}, stąd 2m = -\frac{1}{2} i m = -\frac{1}{4}.
    Sprawdzenie: dla m = -\frac{1}{4} prosta k ma współczynnik \frac{1}{2}, a \frac{1}{2}\cdot\left(-2\right) = -1 ✓.
  solution_steps:
  - 'Doprowadź prostą l do postaci kierunkowej: y = -2x + \frac{7}{2}, więc a_l = -2.'
  - Z warunku równoległości rozwiąż równanie 2m + 1 = -2 i otrzymaj m = -\frac{3}{2}.
  - 'Porównaj wyrazy wolne: -3 \neq \frac{7}{2}, więc proste są równoległe i różne.'
  - Z warunku prostopadłości rozwiąż równanie \left(2m + 1\right)\cdot\left(-2\right) = -1.
  - Otrzymaj m = -\frac{1}{4} i sprawdź iloczyn współczynników kierunkowych.
  answer:
    kind: MULTIPART
    parts:
    - name: m dla rownoleglosci
      answer:
        kind: NUMERIC
        value: -1.5
    - name: uzasadnienie roznosci prostych
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń musi zapisać, że dla m = -\frac{3}{2} obie proste mają współczynnik kierunkowy -2,
          a ich wyrazy wolne -3 i \frac{7}{2} są różne, więc proste są równoległe i nie pokrywają się.
    - name: m dla prostopadlosci
      answer:
        kind: NUMERIC
        value: -0.25
  checks:
  - kind: solve_equation
    expr: 2\cdot m + 1 = -2
    var: m
    part: m dla rownoleglosci
  - kind: solve_equation
    expr: \left(2\cdot m + 1\right)\cdot\left(-2\right) = -1
    var: m
    part: m dla prostopadlosci
  skills:
  - zamiana postaci ogólnej na kierunkową
  - warunek równoległości z parametrem
  - warunek prostopadłości z parametrem
  - sprawdzenie, czy proste równoległe są różne
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie roznosci prostych · 2/2 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: wyznaczanie wzoru prostej prostopadłej przez punkt przecięcia dwóch prostych
  statement: 'Dane są proste k oraz l o równaniach: k: 2x - 3y - 6 = 0 oraz l: 2x + y - 6 = 0. Oblicz
    współrzędne punktu P, w którym proste k i l się przecinają, a następnie wyznacz wzór funkcji liniowej
    g, której wykres jest prostą prostopadłą do prostej k i przechodzącą przez punkt P. Zapisz obliczenia.'
  statement_latex: k:\ 2x - 3y - 6 = 0,\qquad l:\ 2x + y - 6 = 0
  solution: |-
    Doprowadzamy obie proste do postaci kierunkowej.
    k: 2x - 3y - 6 = 0 \Rightarrow 3y = 2x - 6 \Rightarrow y = \frac{2}{3}\cdot x - 2, więc a_k = \frac{2}{3}.
    l: 2x + y - 6 = 0 \Rightarrow y = -2\cdot x + 6.
    Punkt wspólny: \frac{2}{3}\cdot x - 2 = -2\cdot x + 6, czyli \frac{2}{3}\cdot x + 2\cdot x = 8, \frac{8}{3}\cdot x = 8, stąd x = 3.
    Wtedy y = \frac{2}{3}\cdot 3 - 2 = 0, zatem P = \left(3,\ 0\right).
    Z warunku prostopadłości: a_g = -\frac{1}{a_k} = -\frac{1}{\frac{2}{3}} = -\frac{3}{2}.
    Wyraz wolny: b_g = y_P - a_g\cdot x_P = 0 - \left(-\frac{3}{2}\right)\cdot 3 = \frac{9}{2}.
    Zatem g\left(x\right) = -\frac{3}{2}\cdot x + \frac{9}{2}.
    Sprawdzenie: a_k\cdot a_g = \frac{2}{3}\cdot\left(-\frac{3}{2}\right) = -1 oraz g\left(3\right) = -\frac{9}{2} + \frac{9}{2} = 0.
  solution_steps:
  - 'Zapisz prostą k w postaci kierunkowej: y = \frac{2}{3}\cdot x - 2, więc a_k = \frac{2}{3}.'
  - 'Zapisz prostą l w postaci kierunkowej: y = -2\cdot x + 6.'
  - 'Porównaj wzory: \frac{2}{3}\cdot x - 2 = -2\cdot x + 6 i wyznacz x = 3.'
  - 'Oblicz drugą współrzędną: y = \frac{2}{3}\cdot 3 - 2 = 0, więc P = \left(3,\ 0\right).'
  - Z warunku prostopadłości oblicz a_g = -\frac{1}{\frac{2}{3}} = -\frac{3}{2}.
  - Oblicz b_g = 0 - \left(-\frac{3}{2}\right)\cdot 3 = \frac{9}{2} i zapisz wzór g\left(x\right) = -\frac{3}{2}\cdot
    x + \frac{9}{2}.
  answer:
    kind: MULTIPART
    parts:
    - name: P_x
      answer:
        kind: NUMERIC
        value: 3.0
    - name: P_y
      answer:
        kind: NUMERIC
        value: 0.0
    - name: a_g
      answer:
        kind: NUMERIC
        value: -1.5
    - name: b_g
      answer:
        kind: NUMERIC
        value: 4.5
    - name: wzor_g
      answer:
        kind: SYMBOLIC
        latex: g\left(x\right) = -\frac{3}{2}\cdot x + \frac{9}{2}
  checks:
  - kind: solve_equation
    expr: \frac{2}{3}\cdot x - 2 = -2\cdot x + 6
    part: P_x
  - kind: evaluate
    expr: \frac{2}{3}\cdot 3 - 2
    part: P_y
  - kind: evaluate
    expr: -\frac{1}{\frac{2}{3}}
    part: a_g
  - kind: evaluate
    expr: 0 - \left(-\frac{3}{2}\right)\cdot 3
    part: b_g
  skills:
  - zamiana postaci ogólnej na kierunkową
  - punkt przecięcia dwóch prostych
  - warunek prostopadłości
  - wyznaczanie wyrazu wolnego z punktu
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: reference produced 2 outputs, answer has 5'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: badanie wzajemnego położenia prostych z parametrem
  statement: Funkcja liniowa f jest określona wzorem f(x) = (m - 1)x + m + 5, gdzie m jest liczbą rzeczywistą.
    Dana jest też prosta l o równaniu 4x + 2y - 7 = 0. a) Wyznacz tę wartość m, dla której wykres funkcji
    f jest prostą równoległą do prostej l i różną od niej, a następnie dla tej wartości m oblicz miejsce
    zerowe funkcji f. b) Wyznacz tę wartość m, dla której wykres funkcji f jest prostą prostopadłą do
    prostej l. Zapisz obliczenia.
  statement_latex: f\left(x\right) = \left(m - 1\right)\cdot x + m + 5,\qquad l:\ 4x + 2y - 7 = 0
  solution: |-
    Postać kierunkowa prostej l: 2y = -4x + 7, czyli y = -2\cdot x + \frac{7}{2}, więc a_l = -2, b_l = \frac{7}{2}.
    a) Równoległość: m - 1 = -2, stąd m = -1.
    Dla m = -1 mamy f\left(x\right) = -2\cdot x + 4. Wyraz wolny 4 \neq \frac{7}{2}, więc proste są równoległe i różne.
    Miejsce zerowe: -2\cdot x + 4 = 0, czyli x = 2.
    b) Prostopadłość: \left(m - 1\right)\cdot\left(-2\right) = -1, czyli m - 1 = \frac{1}{2}, stąd m = \frac{3}{2}.
    Sprawdzenie: dla m = \frac{3}{2} współczynnik kierunkowy f wynosi \frac{1}{2} oraz \frac{1}{2}\cdot\left(-2\right) = -1.
  solution_steps:
  - 'Zapisz prostą l w postaci kierunkowej: y = -2\cdot x + \frac{7}{2}, odczytaj a_l = -2 oraz b_l =
    \frac{7}{2}.'
  - 'Warunek równoległości: m - 1 = -2, stąd m = -1.'
  - 'Sprawdź różność prostych: dla m = -1 wyraz wolny f jest równy 4 i 4 \neq \frac{7}{2}, więc proste
    są równoległe i różne.'
  - Dla m = -1 rozwiąż równanie -2\cdot x + 4 = 0 i otrzymaj miejsce zerowe x = 2.
  - 'Warunek prostopadłości: \left(m - 1\right)\cdot\left(-2\right) = -1, stąd m = \frac{3}{2}.'
  answer:
    kind: MULTIPART
