- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: dwie styczne z punktu zewnętrznego (deltoid)
  statement: Dany jest okrąg o środku O i promieniu 7. Z punktu P, którego odległość od środka okręgu
    jest równa |OP| = 25, poprowadzono dwie styczne do tego okręgu. Punkty styczności oznaczono przez
    A i B. Oblicz długość odcinka stycznego PA oraz pole czworokąta OAPB. Zapisz obliczenia.
  statement_latex: '|PA| = \sqrt{25^{2}-7^{2}},\qquad P_{OAPB} = 7\cdot |PA|'
  solution: |-
    Styczna jest prostopadła do promienia w punkcie styczności, więc trójkąt OAP ma kąt prosty przy A: przyprostokątne |OA| = 7 i |PA|, przeciwprostokątna |OP| = 25.
    Z twierdzenia Pitagorasa: |PA|^{2} = 25^{2} - 7^{2} = 625 - 49 = 576, zatem |PA| = 24. Z równości odcinków stycznych |PB| = |PA| = 24.
    Trójkąty OAP i OBP są przystające (bok–bok–bok), a każdy z nich ma pole \frac{1}{2}\cdot 7\cdot 24 = 84.
    Czworokąt OAPB składa się z tych dwóch trójkątów, więc jego pole wynosi 2\cdot 84 = 168.
  solution_steps:
  - Zaznacz kąty proste przy punktach styczności A i B.
  - 'Z Pitagorasa w trójkącie OAP: |PA|^2 = 625 - 49 = 576, |PA| = 24.'
  - Z równości odcinków stycznych |PB| = 24, trójkąty OAP i OBP są przystające.
  - 'Pole jednego trójkąta: (1/2)·7·24 = 84.'
  - 'Pole czworokąta OAPB: 2·84 = 168.'
