- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 2
  exercise_type: odczyt miejsc zerowych
  statement: 'Funkcja f jest określona następująco: f(x) = 2x + 3 dla x należących do przedziału ⟨-4,
    1⟩ oraz f(x) = 5 dla x należących do przedziału (1, 4⟩. Wykres funkcji y = f(x) składa się z odcinka
    o końcach (-4, -5) i (1, 5) oraz z poziomego odcinka o końcach (1, 5) (kropka pusta) i (4, 5) (kropka
    pełna). Podaj wszystkie miejsca zerowe funkcji f.'
  statement_latex: f\left(x\right)=2\cdot x+3 \ \text{dla}\ x\in\left\langle -4,\,1\right\rangle,\qquad
    f\left(x\right)=5 \ \text{dla}\ x\in\left(1,\,4\right\rangle
  solution: 'Miejsce zerowe to argument, dla którego wartość funkcji wynosi 0, czyli punkt wspólny wykresu
    z osią OX. Drugi fragment wykresu leży na poziomie y = 5, więc w całości znajduje się nad osią OX
    i nie daje miejsc zerowych. Pierwszy fragment to odcinek o równaniu y = 2x + 3, który wznosi się od
    wartości -5 do wartości 5, więc przecina oś OX. Rozwiązujemy 2\cdot x+3=0, czyli 2x = -3, stąd x =
    -\frac{3}{2}. Liczba -\frac{3}{2} należy do przedziału ⟨-4, 1⟩, więc jest miejscem zerowym. Odpowiedź:
    x = -\frac{3}{2}.'
  solution_steps:
  - Przypomnij, że miejsce zerowe to liczba x z dziedziny, dla której f(x) = 0.
  - 'Sprawdź drugi fragment: wartości stale równe 5, więc wykres leży nad osią OX — brak miejsc zerowych.'
  - Dla pierwszego fragmentu rozwiąż równanie 2x + 3 = 0.
  - Otrzymujesz x = -3/2 i sprawdzasz, że -3/2 ∈ ⟨-4, 1⟩.
  - 'Zapisz miejsce zerowe jako liczbę: x = -3/2.'
  answer:
    kind: SET
    members:
    - -\frac{3}{2}
  checks:
  - kind: solve_equation
    expr: 2\cdot x + 3 = 0
