    GDZIE JEST BŁĄD: własność iloczynu zerowego to alternatywa, a nie koniunkcja — iloczyn jest równy zeru, gdy przynajmniej jeden czynnik jest zerem. Wystarczy, że zeruje się jeden z nich, bo 0 pomnożone przez cokolwiek daje 0.
