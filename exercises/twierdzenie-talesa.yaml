- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: Prostokąt wpisany w trójkąt – wzór z dziedziną i optymalizacja z ograniczeniem
  statement: W trójkącie ABC bok BC ma długość 12, a wysokość tego trójkąta poprowadzona z wierzchołka
    A na bok BC ma długość 8. W trójkąt ABC wpisano prostokąt KLMN w taki sposób, że bok KL zawiera się
    w boku BC, wierzchołek N leży na boku AB, wierzchołek M leży na boku AC, boki KN i LM są prostopadłe
    do BC, a bok NM jest równoległy do BC. Przyjmij |KN| = x. a) Wyznacz wzór na pole P prostokąta KLMN
    jako funkcję zmiennej x oraz podaj dziedzinę tej funkcji. b) Wiadomo dodatkowo, że ze względów technicznych
    wysokość prostokąta nie może przekraczać 3, czyli x \leq 3. Oblicz, dla jakiej wartości x pole prostokąta
    jest wtedy największe, i podaj to największe pole.
  statement_latex: \frac{|NM|}{12}=\frac{8-x}{8},\qquad P\left(x\right)=x\cdot\left(12-\frac{3}{2}\cdot
    x\right)
  solution: |-
    a) Niech AH będzie wysokością trójkąta ABC poprowadzoną z A na BC, |AH| = 8. Bok NM jest równoległy do BC, a punkty N i M leżą na bokach AB i AC, więc trójkąt ANM jest podobny do trójkąta ABC, a skala podobieństwa to stosunek odpowiednich wysokości.
    Wysokość prostokąta wynosi x, więc odległość odcinka NM od wierzchołka A jest równa 8 - x. Stąd (twierdzenie Talesa / podobieństwo):
    \frac{|NM|}{|BC|}=\frac{8-x}{8}, czyli |NM| = 12\cdot\frac{8-x}{8} = 12-\frac{3}{2}\cdot x.
    Pole prostokąta:
    P\left(x\right)=x\cdot\left(12-\frac{3}{2}\cdot x\right)=12x-\frac{3}{2}x^{2}.
    Dziedzina: musi być x > 0 oraz |NM| > 0, czyli 12-\frac{3}{2}x > 0, tzn. x < 8. Zatem x \in \left(0,\ 8\right).
    b) Funkcja P jest funkcją kwadratową o współczynniku a = -\frac{3}{2} < 0, więc jej wykresem jest parabola o ramionach skierowanych w dół. Pierwsza współrzędna wierzchołka:
    x_{w}=\frac{-12}{2\cdot\left(-\frac{3}{2}\right)}=4.
    Wierzchołek wypada poza dopuszczalny przedział, bo 4 > 3. Na przedziale \left(0,\ 4\right) funkcja P jest rosnąca, więc na przedziale \left(0,\ 3\right] największą wartość przyjmuje na jego prawym końcu, dla x = 3.
    Wtedy |NM| = 12-\frac{3}{2}\cdot 3 = 7{,}5 oraz
    P\left(3\right)=3\cdot 7{,}5 = 22{,}5.
    Odpowiedź: a) P\left(x\right)=12x-\frac{3}{2}x^{2}, x \in \left(0,\ 8\right); b) największe pole równe 22,5 prostokąt ma dla x = 3.
  solution_steps:
  - Zauważ, że NM ∥ BC, więc trójkąt ANM jest podobny do ABC; odległość NM od A wynosi 8 - x.
  - Z proporcji \frac{|NM|}{12}=\frac{8-x}{8} otrzymaj |NM| = 12-\frac{3}{2}x.
  - 'Ułóż pole: P\left(x\right)=x\cdot\left(12-\frac{3}{2}x\right)=12x-\frac{3}{2}x^{2}.'
  - 'Wyznacz dziedzinę z warunków x > 0 i 12-\frac{3}{2}x > 0: x \in \left(0,\ 8\right).'
  - 'Oblicz pierwszą współrzędną wierzchołka paraboli: x_{w} = 4.'
  - 'Sprawdź ograniczenie x \leq 3: wierzchołek jest niedopuszczalny, a P rośnie na (0, 4), więc maksimum
    przypada dla x = 3.'
  - Oblicz P\left(3\right)=3\cdot\left(12-\frac{3}{2}\cdot 3\right)=22{,}5.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor
      answer:
        kind: SYMBOLIC
        latex: P\left(x\right)=12x-\frac{3}{2}x^{2}
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '8'
    - name: x_max
      answer:
        kind: NUMERIC
        value: 3.0
    - name: P_max
      answer:
        kind: NUMERIC
        value: 22.5
  checks:
  - kind: simplify
    expr: x\cdot\left(12-\frac{3}{2}\cdot x\right)
    part: wzor
  - kind: evaluate
    expr: \min\left(\frac{12}{2\cdot\frac{3}{2}},\ 3\right)
    part: x_max
  - kind: evaluate
    expr: 3\cdot\left(12-\frac{3}{2}\cdot 3\right)
    part: P_max
