  statement: 'Rozwiąż równanie \left(x-2\right)\left(x+5\right)=8. Uczeń zapisał: „x-2=8 lub x+5=8”. Wyjaśnij,
    dlaczego takie rozumowanie jest błędne, i podaj poprawny zbiór rozwiązań.'
  statement_latex: \left(x-2\right)\cdot\left(x+5\right)=8
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń pisze x-2=8 lub x+5=8, skąd x=10 lub x=3, i podaje odpowiedź x\in\left\{3,10\right\}.
    GDZIE JEST BŁĄD: własność iloczynu zerowego działa wyłącznie wtedy, gdy po prawej stronie stoi 0. Liczbę 8 można otrzymać na nieskończenie wiele sposobów jako iloczyn dwóch liczb, więc z równości iloczynu 8 nic nie wynika o pojedynczych czynnikach. Sprawdzenie x=10: \left(10-2\right)\left(10+5\right)=8\cdot15=120\neq 8, więc 10 nie jest rozwiązaniem.
    POPRAWNE ROZWIĄZANIE: wymnażamy i przenosimy wszystko na lewą stronę:
    \left(x-2\right)\left(x+5\right)=x^{2}+3x-10, więc x^{2}+3x-10-8=0, czyli x^{2}+3x-18=0.
    \Delta=3^{2}-4\cdot1\cdot\left(-18\right)=9+72=81, \sqrt{\Delta}=9,
    x=\frac{-3-9}{2}=-6 lub x=\frac{-3+9}{2}=3.
    Sprawdzenie x=-6: \left(-6-2\right)\left(-6+5\right)=\left(-8\right)\cdot\left(-1\right)=8 — zgadza się.
    Odpowiedź: x\in\left\{-6,3\right\}.
  solution_steps:
  - 'Pokaż błędne rozumowanie: x-2=8 lub x+5=8 daje x=10 lub x=3.'
  - 'Wskaż błąd: własność iloczynu zerowego wymaga zera po prawej stronie; sprawdzenie pokazuje, że x=10
    nie spełnia równania.'
  - 'Wymnóż nawiasy i przenieś 8 na lewą stronę: x^{2}+3x-18=0.'
  - Oblicz \Delta=81 i pierwiastki x=-6 oraz x=3.
