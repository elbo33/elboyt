  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: „W trójkącie z wysokością ostrosłupa przyprostokątną leżącą w podstawie jest odcinek OB”, więc tg β = \frac{|SO|}{|OB|} = \frac{4}{4\sqrt{2}} = \frac{\sqrt{2}}{2} (co dałoby β ≈ 35°16'). Błędna odpowiedź: tg β = \frac{\sqrt{2}}{2}.
    DLACZEGO TO BŁĄD: to jest tangens innego kąta – kąta nachylenia KRAWĘDZI BOCZNEJ do podstawy. Do kąta dwuściennego między ścianą boczną a podstawą służy trójkąt (H, r, m), czyli SOM, gdzie |OM| = r; do kąta krawędzi bocznej – trójkąt (H, R, b), czyli SOB, gdzie |OB| = R.
    POPRAWNE ROZUMOWANIE:
    r = |OM| = \frac{8}{2} = 4, R = |OB| = \frac{8\sqrt{2}}{2} = 4\sqrt{2}.
    (a) tg β = \frac{|SO|}{|OM|} = \frac{4}{4} = 1.
    (b) β = 45°.
    (c) tg α = \frac{|SO|}{|OB|} = \frac{4}{4\sqrt{2}} = \frac{\sqrt{2}}{2} ≈ 0,7071 (α ≈ 35°16').
    Wartość otrzymana przez ucznia jest więc poprawną wartością, ale dla innego kąta. Zgodnie z regułą R > r zawsze α < β.
  solution_steps:
  - 'Błąd: użycie R = |OB| zamiast r = |OM| w trójkącie dla kąta ściany bocznej; błędny wynik tg β = \frac{\sqrt{2}}{2}.'
  - 'Rozróżnij trójkąty: (H, r, m) – ściana boczna, (H, R, b) – krawędź boczna.'
  - Wyznacz r = \frac{8}{2} = 4 oraz R = \frac{8\sqrt{2}}{2} = 4\sqrt{2}.
  - Oblicz tg β = \frac{4}{4} = 1, więc β = 45°.
  - Oblicz tg α = \frac{4}{4\sqrt{2}} = \frac{\sqrt{2}}{2}; zauważ, że α < β, bo R > r.
  answer:
    kind: MULTIPART
    parts:
    - name: tangens kąta beta (ściana boczna)
      answer:
        kind: NUMERIC
        value: 1.0
    - name: miara kąta beta (stopnie)
      answer:
