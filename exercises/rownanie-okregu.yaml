    do okręgu O, oraz zapisz nierówność opisującą koło o tym samym środku i promieniu. Uczeń stwierdził:
    "P leży blisko środka, więc na pewno należy do okręgu O". Wyjaśnij, na czym polega jego błąd.'
  statement_latex: \left(x-2\right)^{2}+\left(y+1\right)^{2}=36,\qquad P=\left(4,2\right)
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń miesza okrąg z kołem — sprawdza tylko, czy punkt 'mieści się w środku figury', i na tej podstawie mówi, że punkt należy do okręgu.

    OBLICZENIA: L=(4-2)^2+(2+1)^2=2^2+3^2=4+9=13. Prawa strona to r^2=36.
    Ponieważ 13<36, punkt P leży WEWNĄTRZ okręgu, a więc NIE należy do okręgu O.

    DLACZEGO TO JEST ŹLE: okrąg to sama linia — zbiór punktów odległych od środka DOKŁADNIE o r; opisuje go RÓWNANIE (x-2)^2+(y+1)^2=36. Koło to linia wraz z wnętrzem; opisuje je NIERÓWNOŚĆ (x-2)^2+(y+1)^2\le 36. Punkt P spełnia nierówność ostrą, więc należy do koła, ale nie do okręgu.

