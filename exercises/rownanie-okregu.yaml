- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: równanie okręgu z parametrem
  statement: W kartezjańskim układzie współrzędnych (x, y) dane jest równanie \left(x+3\right)^{2}+\left(y-1\right)^{2}=2\cdot
    m-6 z parametrem m. a) Wyznacz wszystkie wartości m, dla których równanie to opisuje okrąg. b) Wyznacz
    m, dla którego promień tego okręgu jest równy 4. c) Wyznacz m, dla którego okrąg ten jest styczny
    do osi Oy układu współrzędnych.
  statement_latex: \left(x+3\right)^{2}+\left(y-1\right)^{2}=2\cdot m-6
  solution: |-
    Lewa strona jest sumą kwadratów, a środek okręgu to S=(-3,1).

    a) Równanie opisuje okrąg dokładnie wtedy, gdy prawa strona jest dodatnia:
    2m-6>0 \iff 2m>6 \iff m>3.
    (Dla m=3 zbiorem rozwiązań jest jeden punkt (-3,1), dla m<3 zbiór jest pusty.)

    b) r=4 oznacza r^2=16, czyli 2m-6=16, stąd 2m=22 i m=11. Warunek m>3 jest spełniony ✓.

    c) Odległość środka S=(-3,1) od osi Oy wynosi |-3|=3, więc styczność do Oy zachodzi, gdy r=3, czyli r^2=9:
    2m-6=9, 2m=15, m=\frac{15}{2}. Warunek m>3 jest spełniony ✓ (okrąg dotyka osi Oy w punkcie (0,1)).
  solution_steps:
  - 'Zapisz warunek istnienia okręgu: 2\cdot m-6>0.'
  - 'Rozwiąż nierówność: m>3.'
  - 'Dla r=4 zapisz 2\cdot m-6=16 i rozwiąż: m=11.'
  - Odczytaj środek S=\left(-3,1\right); odległość od osi Oy to \left|-3\right|=3.
  - 'Z warunku styczności r=3 zapisz 2\cdot m-6=9 i rozwiąż: m=\frac{15}{2}.'
  - Sprawdź, że otrzymane wartości spełniają warunek m>3.
  answer:
    kind: MULTIPART
    parts:
    - name: a_warunek_okregu
      answer:
        kind: INTERVAL
        lo: '3'
        hi: \infty
    - name: b_promien_4
      answer:
        kind: NUMERIC
        value: 11.0
    - name: c_stycznosc_Oy
      answer:
        kind: NUMERIC
        value: 7.5
  checks:
  - kind: solve_inequality
    expr: 2\cdot m-6>0
    var: m
    part: a_warunek_okregu
  - kind: solve_equation
    expr: 2\cdot m-6=16
    var: m
    part: b_promien_4
  - kind: solve_equation
    expr: 2\cdot m-6=9
    var: m
    part: c_stycznosc_Oy
  skills:
  - warunek istnienia okręgu
  - dobór parametru do zadanego promienia
  - styczność okręgu do osi układu
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [a_warunek_okregu] SymPy solved it fresh: endpoints matched
