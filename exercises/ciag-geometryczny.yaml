  statement_latex: S_5 = a_1\cdot\frac{q^{5}-1}{q-1} = 1\cdot\frac{4^{5}-1}{4-1}
  solution: |-
    Ponieważ q = 4 \neq 1, korzystamy ze wzoru S_n = a_1 \cdot \frac{q^{n}-1}{q-1}.
    Dla n = 5: S_5 = 1 \cdot \frac{4^{5}-1}{4-1} = \frac{1024-1}{3} = \frac{1023}{3} = 341.
    Sprawdzenie: 1 + 4 + 16 + 64 + 256 = 341. ✓
    Odpowiedź: S_5 = 341.
  solution_steps:
  - Sprawdź, że q = 4 \neq 1, więc obowiązuje wzór z ułamkiem.
  - 'Podstaw dane: S_5 = 1\cdot\frac{4^{5}-1}{4-1}.'
  - Oblicz 4^{5} = 1024.
  - 'Wykonaj działania: \frac{1023}{3} = 341.'
