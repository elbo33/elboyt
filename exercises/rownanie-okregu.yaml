  solution_steps:
  - 'Podstaw P=\left(4,2\right) do lewej strony: L=\left(4-2\right)^{2}+\left(2+1\right)^{2}=13.'
  - 'Porównaj z r^{2}=36: 13<36, więc P leży wewnątrz.'
  - 'Wniosek: P nie należy do okręgu O, bo okrąg to tylko brzeg.'
  - 'Zapisz nierówność opisującą koło: \left(x-2\right)^{2}+\left(y+1\right)^{2}\le 36.'
