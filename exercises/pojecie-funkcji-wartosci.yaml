- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: budowa modelu liniowego z dwóch danych wartości i obliczenie wartości funkcji
  statement: Wypożyczalnia kajaków pobiera jednorazową opłatę startową za wypożyczenie kajaka oraz dodatkowo
    stałą kwotę za każdą godzinę pływania. Klient, który pływał 4 godziny, zapłacił 26 zł, a klient, który
    pływał 7 godzin, zapłacił 41 zł. Ile zapłaci klient, który wypożyczy kajak na 10 godzin?
  statement_latex: K\left(t\right)=a+c\cdot t,\qquad K\left(4\right)=26,\qquad K\left(7\right)=41
  solution: |-
    Koszt zależy od liczby godzin t, więc opisuję go funkcją. Opłata startowa (stała) to a zł, a cena jednej godziny to c zł, zatem
    K(t) = a + c·t, gdzie t ≥ 0 jest liczbą godzin.
    Z danych: K(4) = 26 oraz K(7) = 41, czyli
    a + 4c = 26,
    a + 7c = 41.
    Odejmując pierwsze równanie od drugiego: 3c = 15, więc c = 5 (jedna godzina kosztuje 5 zł).
    Stąd a = 26 − 4·5 = 6 (opłata startowa wynosi 6 zł).
    Wzór funkcji: K(t) = 6 + 5·t.
    Za 10 godzin: K(10) = 6 + 5·10 = 56.
    Odpowiedź: klient, który wypożyczy kajak na 10 godzin, zapłaci 56 zł.
  solution_steps:
  - Wprowadzam zmienną t — liczbę godzin pływania, oraz oznaczam opłatę startową przez a, a cenę jednej
    godziny przez c.
  - 'Zapisuję model kosztu: K(t) = a + c·t.'
  - 'Z danych zapisuję warunki: a + 4c = 26 oraz a + 7c = 41.'
  - 'Odejmuję równania stronami: 3c = 15, więc c = 5.'
  - Wyznaczam a = 26 − 4·5 = 6, czyli K(t) = 6 + 5·t.
  - Obliczam K(10) = 6 + 5·10 = 56.
  - 'Odpowiedź: 56 zł.'
  answer:
    kind: NUMERIC
    value: 56.0
  checks:
  - kind: evaluate
    expr: \left(26-4\cdot\frac{41-26}{3}\right)+10\cdot\frac{41-26}{3}
    var: t
