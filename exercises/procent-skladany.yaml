  statement: Pan Jacek wpłacił do banku 15000 zł na lokatę trzyletnią, oprocentowaną 4% w skali roku,
    z kapitalizacją roczną. Na koniec okresu oszczędzania bank pobiera 19% podatku od uzyskanych odsetek.
    Oblicz kapitał brutto zgromadzony po trzech latach oraz kwotę, którą pan Jacek faktycznie otrzyma
    z banku. Wyniki podaj z dokładnością do 1 grosza.
  statement_latex: K_{3}=15000\cdot\left(1+\frac{4}{100}\right)^{3},\qquad K_{netto}=15000+0{,}81\cdot\left(K_{3}-15000\right)
  solution: |-
    Model: K_0 = 15000 zł, q = 1,04, n = 3.
    K_3 = 15000·(1,04)^3 = 15000·1,124864 = 16872,96 zł (kapitał brutto).
    Odsetki brutto: O = 16872,96 − 15000 = 1872,96 zł.
    Podatek: 0,19·1872,96 = 355,8624 zł, odsetki netto: 0,81·1872,96 = 1517,0976 zł.
    Kwota do wypłaty: 15000 + 1517,0976 = 16517,0976 ≈ 16517,10 zł.
    Odpowiedź: kapitał brutto to 16872,96 zł, a do wypłaty pozostaje 16517,10 zł.
  solution_steps:
  - 'Zapisz model: K_3 = 15000·(1,04)^3.'
  - Oblicz (1,04)^3 = 1,124864 i K_3 = 16872,96 zł.
  - 'Oblicz odsetki brutto: 16872,96 − 15000 = 1872,96 zł.'
  - 'Pomnóż odsetki przez 0,81 (potrącenie 19% podatku): 1517,0976 zł.'
  - 'Dodaj odsetki netto do kapitału początkowego: 15000 + 1517,0976 ≈ 16517,10 zł.'
