- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: zadanie obliczeniowe z dwoma przypadkami
  statement: 'W okręgu o promieniu 25 poprowadzono dwie cięciwy równoległe: cięciwę AB o długości 48 oraz
    cięciwę CD o długości 14. Oblicz odległość między tymi cięciwami w przypadku, gdy leżą one po przeciwnych
    stronach środka okręgu, oraz w przypadku, gdy leżą po tej samej stronie środka okręgu. Zapisz obliczenia.'
  statement_latex: k_{1}=\sqrt{25^{2}-\left(\frac{48}{2}\right)^{2}},\qquad k_{2}=\sqrt{25^{2}-\left(\frac{14}{2}\right)^{2}}
  solution: |-
    Niech O będzie środkiem okręgu, r=25. Prostopadła poprowadzona ze środka do cięciwy dzieli ją na połowy, więc dla każdej cięciwy powstaje trójkąt prostokątny o przeciwprostokątnej r i przyprostokątnej równej połowie cięciwy.

    Dla cięciwy AB: połowa cięciwy to \frac{48}{2}=24, zatem k_{1}=\sqrt{25^{2}-24^{2}}=\sqrt{625-576}=\sqrt{49}=7.

    Dla cięciwy CD: połowa cięciwy to \frac{14}{2}=7, zatem k_{2}=\sqrt{25^{2}-7^{2}}=\sqrt{625-49}=\sqrt{576}=24.

    Przypadek 1 – cięciwy po przeciwnych stronach środka: odległość między nimi wynosi k_{1}+k_{2}=7+24=31.

    Przypadek 2 – cięciwy po tej samej stronie środka: odległość między nimi wynosi k_{2}-k_{1}=24-7=17.

    Sprawdzenie sensowności: k_{1}<r oraz k_{2}<r, a 31<2r=50, więc oba położenia są możliwe.
  solution_steps:
  - Zauważ, że prostopadła ze środka do cięciwy dzieli ją na połowy, więc w trójkącie prostokątnym występuje
    połowa cięciwy.
  - 'Oblicz odległość środka od cięciwy AB: k_{1}=\sqrt{25^{2}-24^{2}}=7.'
  - 'Oblicz odległość środka od cięciwy CD: k_{2}=\sqrt{25^{2}-7^{2}}=24.'
  - 'Dla cięciw po przeciwnych stronach środka dodaj odległości: 7+24=31.'
  - 'Dla cięciw po tej samej stronie środka odejmij odległości: 24-7=17.'
  answer:
    kind: MULTIPART
    parts:
    - name: odleglosc_po_przeciwnych_stronach
      answer:
        kind: NUMERIC
        value: 31.0
    - name: odleglosc_po_tej_samej_stronie
      answer:
        kind: NUMERIC
        value: 17.0
  checks:
  - kind: evaluate
    expr: \sqrt{25^{2}-24^{2}}+\sqrt{25^{2}-7^{2}}
    part: odleglosc_po_przeciwnych_stronach
  - kind: evaluate
    expr: \sqrt{25^{2}-7^{2}}-\sqrt{25^{2}-24^{2}}
    part: odleglosc_po_tej_samej_stronie
  skills:
  - odległość środka okręgu od cięciwy
  - twierdzenie Pitagorasa w okręgu
