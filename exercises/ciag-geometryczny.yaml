- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: ciąg arytmetyczny przekształcony w geometryczny, filtr monotoniczności, suma
  statement: Trzy liczby, których suma jest równa 15, tworzą w podanej kolejności ciąg arytmetyczny. Jeżeli
    do trzeciej z tych liczb dodamy 16, a dwie pierwsze pozostawimy bez zmian, to otrzymane trzy liczby
    będą trzema kolejnymi wyrazami pewnego ciągu geometrycznego rosnącego. Wyznacz te trzy liczby tworzące
    ciąg arytmetyczny oraz oblicz sumę sześciu początkowych wyrazów tego ciągu geometrycznego. Zapisz
    obliczenia.
  statement_latex: 5^{2} = \left(5-r\right) \cdot \left(5+r+16\right)
  solution: |-
    Oznaczmy trzy kolejne wyrazy ciągu arytmetycznego przez 5-r,\ 5,\ 5+r — istotnie ich suma wynosi 15, bo \left(5-r\right) + 5 + \left(5+r\right) = 15, więc wyraz środkowy jest równy 5.
    Po zwiększeniu trzeciej liczby o 16 otrzymujemy liczby 5-r,\ 5,\ 21+r, które mają tworzyć ciąg geometryczny, zatem
    5^{2} = \left(5-r\right) \cdot \left(21+r\right),
    25 = 105 - 16r - r^{2}, czyli r^{2} + 16r - 80 = 0.
    \Delta = 256 + 320 = 576, \sqrt{\Delta} = 24, stąd r = \frac{-16+24}{2} = 4 lub r = \frac{-16-24}{2} = -20.
    Rozpatrujemy oba przypadki:
    • r = 4: liczby arytmetyczne 1, 5, 9, a po zmianie 1, 5, 25 — ciąg geometryczny o ilorazie q = 5, rosnący;
    • r = -20: liczby arytmetyczne 25, 5, -15, a po zmianie 25, 5, 1 — ciąg geometryczny o ilorazie q = \frac{1}{5}, malejący, więc ten przypadek odrzucamy.
    Zatem szukane liczby to 1, 5, 9, a ciąg geometryczny ma a_{1} = 1 i q = 5.
    S_{6} = 1 \cdot \frac{5^{6} - 1}{5 - 1} = \frac{15\,625 - 1}{4} = \frac{15\,624}{4} = 3906.
    Odpowiedź: liczby to 1, 5, 9, a suma sześciu początkowych wyrazów ciągu geometrycznego wynosi 3906.
  solution_steps:
  - Oznacz wyrazy ciągu arytmetycznego jako 5-r, 5, 5+r (z sumy 15 wynika, że środkowy wyraz to 5).
  - 'Zapisz warunek geometryczności po zmianie: 5^{2} = \left(5-r\right)\cdot\left(21+r\right).'
  - 'Sprowadź do równania r^{2} + 16r - 80 = 0 i rozwiąż: r = 4 lub r = -20.'
  - 'Wypisz oba ciągi geometryczne: 1, 5, 25 (q = 5, rosnący) oraz 25, 5, 1 (q = \frac{1}{5}, malejący)
    i odrzuć drugi przypadek.'
  - Oblicz S_{6} = 1 \cdot \frac{5^{6}-1}{5-1} = 3906.
  answer:
