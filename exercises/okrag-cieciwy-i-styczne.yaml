- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: wyznaczanie promienia z cięciwy
  statement: Cięciwa AB pewnego okręgu o środku O ma długość 30, a jej odległość od środka okręgu wynosi
    8. Oblicz promień tego okręgu. Zapisz obliczenia.
  statement_latex: r = \sqrt{8^{2}+\left(\frac{30}{2}\right)^{2}}
  solution: |-
    Prostopadła poprowadzona z O do cięciwy AB dzieli ją na połowy, więc połowa cięciwy ma długość \frac{30}{2} = 15.
    Powstaje trójkąt prostokątny o przyprostokątnych 8 i 15 oraz przeciwprostokątnej r.
    Z twierdzenia Pitagorasa: r^{2} = 8^{2} + 15^{2} = 64 + 225 = 289, więc r = 17.
    Sprawdzenie: k = 8 < 17 = r oraz |AB| = 30 < 34 = 2r – warunki geometryczne są spełnione.
  solution_steps:
  - 'Połowa cięciwy: 30/2 = 15.'
  - Trójkąt prostokątny o przyprostokątnych 8 i 15, przeciwprostokątna r.
  - r^2 = 64 + 225 = 289.
  - r = 17.
