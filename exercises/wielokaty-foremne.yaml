- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 1
  exercise_type: przekątne wielokąta
  statement: Oblicz, ile przekątnych ma piętnastokąt foremny.
  statement_latex: d=\frac{n\cdot\left(n-3\right)}{2},\qquad n=15
  solution: |-
    Z każdego z 15 wierzchołków wychodzi 15 − 3 = 12 przekątnych (pomijamy sam wierzchołek i dwóch jego sąsiadów). Każdą przekątną policzyliśmy dwukrotnie, więc
    d = 15·12/2 = 180/2 = 90.
    Odpowiedź: 90 przekątnych.
  solution_steps:
  - 'Zapisz wzór: d = n(n−3)/2.'
  - 'Podstaw n = 15: d = 15·(15−3)/2.'
  - 'Oblicz: d = 15·12/2 = 90.'
