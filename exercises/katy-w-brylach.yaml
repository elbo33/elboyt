- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: kąt nachylenia ściany bocznej ostrosłupa
  statement: Dany jest ostrosłup prawidłowy czworokątny, w którym krawędź podstawy ma długość a = 8, a
    wysokość ostrosłupa ma długość H = 4\sqrt{3}. Oblicz miarę kąta, pod jakim ściana boczna tego ostrosłupa
    jest nachylona do płaszczyzny podstawy.
  statement_latex: \operatorname{tg}\beta=\frac{H}{\frac{a}{2}}=\frac{4\sqrt{3}}{\frac{8}{2}}
  solution: Niech S będzie wierzchołkiem ostrosłupa, O — środkiem podstawy (spodkiem wysokości), a M —
    środkiem krawędzi podstawy. Odcinek SM (apotema) jest prostopadły do krawędzi podstawy i odcinek OM
    (o długości r = \frac{a}{2} = 4) też jest do niej prostopadły, więc kąt SMO jest kątem liniowym kąta
    dwuściennego między ścianą boczną a podstawą. W trójkącie prostokątnym SOM mamy \operatorname{tg}\beta=\frac{H}{r}=\frac{4\sqrt{3}}{4}=\sqrt{3},
    zatem β = 60°.
  solution_steps:
  - 'Wyznacz promień okręgu wpisanego w podstawę: r = \frac{a}{2} = 4.'
  - 'Wskaż kąt liniowy: kąt SMO między apotemą SM a odcinkiem OM.'
  - Zapisz \operatorname{tg}\beta=\frac{H}{r}=\frac{4\sqrt{3}}{4}=\sqrt{3}.
  - 'Odczytaj: β = 60°.'
  answer:
    kind: NUMERIC
    value: 60.0
    tol: 1.0e-06
    latex: 60^\circ
  checks:
  - kind: evaluate
    expr: \frac{180}{\pi}\cdot\arctan\left(\frac{4\sqrt{3}}{\frac{8}{2}}\right)
  skills:
  - kąt dwuścienny
  - apotema ostrosłupa
  - promień okręgu wpisanego w podstawę
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 60.0 vs 60.0 (tol 1e-06)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: przekątna graniastosłupa i jej nachylenie do podstawy
  statement: Dany jest graniastosłup prawidłowy czworokątny ABCDA'B'C'D', w którym podstawą jest kwadrat
    ABCD o boku długości 5, a krawędź boczna AA' ma długość 5\sqrt{2} i jest prostopadła do płaszczyzny
    podstawy. Oblicz długość przekątnej AC' tego graniastosłupa oraz miarę kąta, jaki przekątna AC' tworzy
    z płaszczyzną podstawy ABCD.
  statement_latex: AC'=\sqrt{5^2+5^2+\left(5\sqrt{2}\right)^2},\qquad \operatorname{tg}\alpha=\frac{5\sqrt{2}}{5\sqrt{2}}
  solution: 'Przekątna podstawy: AC = 5\sqrt{2}. Ponieważ krawędź CC'' jest prostopadła do płaszczyzny
    podstawy, rzutem punktu C'' na tę płaszczyznę jest punkt C, a rzutem odcinka AC'' jest odcinek AC.
    Trójkąt ACC'' jest prostokątny o przyprostokątnych AC = 5\sqrt{2} i CC'' = 5\sqrt{2}, więc AC''=\sqrt{\left(5\sqrt{2}\right)^2+\left(5\sqrt{2}\right)^2}=\sqrt{50+50}=10,
    co jest zgodne ze wzorem \sqrt{5^2+5^2+\left(5\sqrt{2}\right)^2}=10. Kąt α nachylenia przekątnej do
    podstawy to kąt C''AC: \operatorname{tg}\alpha=\frac{CC''}{AC}=\frac{5\sqrt{2}}{5\sqrt{2}}=1, zatem
    α = 45°.'
  solution_steps:
  - 'Oblicz przekątną podstawy: AC = 5\sqrt{2}.'
  - Zauważ, że rzutem przekątnej AC' na podstawę jest przekątna AC (bo CC' ⟂ podstawa).
  - 'Oblicz AC'' z twierdzenia Pitagorasa: AC''=\sqrt{5^2+5^2+\left(5\sqrt{2}\right)^2}=10.'
  - Zapisz \operatorname{tg}\alpha=\frac{CC'}{AC}=\frac{5\sqrt{2}}{5\sqrt{2}}=1.
  - 'Odczytaj miarę kąta: α = 45°.'
  answer:
    kind: MULTIPART
    parts:
    - name: długość przekątnej AC'
      answer:
        kind: NUMERIC
        value: 10.0
        tol: 1.0e-06
        latex: '10'
    - name: kąt nachylenia do podstawy
      answer:
        kind: NUMERIC
        value: 45.0
        tol: 1.0e-06
        latex: 45^\circ
  checks:
  - kind: evaluate
    expr: \sqrt{5^2+5^2+\left(5\sqrt{2}\right)^2}
    part: długość przekątnej AC'
  - kind: evaluate
    expr: \frac{180}{\pi}\cdot\arctan\left(\frac{5\sqrt{2}}{5\sqrt{2}}\right)
    part: kąt nachylenia do podstawy
