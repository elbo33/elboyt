- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: potęgi w zadaniu o bryle
  statement: Objętość pewnego sześcianu jest równa 2^{4,5}. Oblicz pole powierzchni całkowitej tego sześcianu.
    Rozstrzygnij też, czy krawędź tego sześcianu jest większa od liczby 2^{1,4}.
  statement_latex: a^{3} = 2^{\frac{9}{2}}, \qquad P_{c} = 6 \cdot a^{2}
  solution: |-
    Oznaczmy przez a długość krawędzi sześcianu (a > 0). Wtedy jego objętość to a^{3}, więc
    a^{3} = 2^{4,5} = 2^{\frac{9}{2}}.

    Szukamy a w postaci potęgi dwójki: jeśli a = 2^{t}, to a^{3} = 2^{3 \cdot t}, a z różnowartościowości potęgowania (podstawa 2 > 0, 2 \ne 1) otrzymujemy 3 \cdot t = \frac{9}{2}, czyli t = \frac{3}{2}. Zatem
    a = 2^{\frac{3}{2}}.

    Pole powierzchni całkowitej sześcianu wynosi P_{c} = 6 \cdot a^{2}, więc
    P_{c} = 6 \cdot \left( 2^{\frac{3}{2}} \right)^{2} = 6 \cdot 2^{3} = 6 \cdot 8 = 48.

    Porównanie krawędzi z liczbą 2^{1,4}: obie liczby mają wspólną podstawę 2 > 1, więc potęgowanie zachowuje porządek wykładników. Ponieważ \frac{3}{2} = 1,5 > 1,4, mamy 2^{1,5} > 2^{1,4}, czyli krawędź jest większa od 2^{1,4} — odpowiedź: tak.
  solution_steps:
  - 'Wprowadź zmienną: niech a > 0 będzie krawędzią sześcianu; wtedy a^{3} = 2^{\frac{9}{2}}.'
  - Zapisz a = 2^{t} i z różnowartościowości potęgowania rozwiąż 3 \cdot t = \frac{9}{2}, skąd t = \frac{3}{2},
    czyli a = 2^{\frac{3}{2}}.
  - 'Ułóż wzór na pole powierzchni całkowitej: P_{c} = 6 \cdot a^{2}.'
  - Oblicz P_{c} = 6 \cdot \left( 2^{\frac{3}{2}} \right)^{2} = 6 \cdot 2^{3} = 48.
  - 'Porównaj wykładniki 1,5 i 1,4 przy podstawie 2 > 1: 2^{1,5} > 2^{1,4}, więc krawędź jest większa
    od 2^{1,4}.'
  answer:
    kind: MULTIPART
    parts:
    - name: pole_powierzchni
      answer:
        kind: NUMERIC
        value: 48.0
    - name: krawedz_wieksza_od_2^1,4
      answer:
        kind: BOOLEAN
        truth: true
  checks:
  - kind: evaluate
    expr: 6 \cdot \left( 2^{\frac{3}{2}} \right)^{2}
    part: pole_powierzchni
  stated_model:
    variable: a
    objective_latex: P_{c}\left( a \right) = 6 \cdot a^{2}, \quad a^{3} = 2^{\frac{9}{2}}
