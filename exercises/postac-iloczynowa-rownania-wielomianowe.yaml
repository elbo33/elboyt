  exercise_type: analiza błędu — znak przy odczycie pierwiastka
  statement: Dany jest wielomian W\left(x\right)=\left(x+6\right)\left(x-1\right)\left(2x+5\right). Uczeń
    podał, że pierwiastkami tego wielomianu są liczby 6, -1 oraz 5. Wyjaśnij, na czym polega jego błąd,
    i podaj wszystkie pierwiastki wielomianu W.
  statement_latex: W\left(x\right)=\left(x+6\right)\left(x-1\right)\left(2x+5\right)
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń „zmienia znak w pamięci”: z czynnika \left(x+6\right) odczytuje 6, z \left(x-1\right) odczytuje -1, a z \left(2x+5\right) — liczbę 5. Jego odpowiedź to 6, -1, 5.
    GDZIE JEST BŁĄD: sprawdzenie dla x=6 daje W\left(6\right)=\left(6+6\right)\left(6-1\right)\left(2\cdot6+5\right)=12\cdot5\cdot17\neq 0, więc 6 nie jest pierwiastkiem. Pierwiastek zawsze wyznaczamy, rozwiązując równanie „czynnik = 0”, a nie przez samo odwrócenie znaku liczby stojącej w nawiasie (w czynniku z współczynnikiem 2 trzeba jeszcze podzielić).
    POPRAWNE ROZWIĄZANIE:
    x+6=0 daje x=-6,
    x-1=0 daje x=1,
    2x+5=0 daje 2x=-5, czyli x=-\frac{5}{2}.
    Sprawdzenie dla x=-6: \left(-6+6\right)\left(-6-1\right)\left(2\cdot\left(-6\right)+5\right)=0\cdot\left(-7\right)\cdot\left(-7\right)=0 — zgadza się.
    Odpowiedź: pierwiastkami są liczby -6, -\frac{5}{2} oraz 1.
  solution_steps:
  - 'Pokaż błędne rozumowanie: odczyt 6, -1, 5 przez samo ''odwrócenie znaku''.'
  - 'Wskaż błąd: podstawienie x=6 daje wartość różną od zera, więc 6 nie jest pierwiastkiem.'
  - Rozwiąż x+6=0, x-1=0 oraz 2x+5=0.
  - Otrzymaj pierwiastki x=-6, x=1, x=-\frac{5}{2} i sprawdź jeden z nich przez podstawienie.
