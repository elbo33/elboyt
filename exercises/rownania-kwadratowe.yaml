  exercise_type: równanie kwadratowe niezupełne
  statement: Rozwiąż równanie \(5x^{2}-20x=0\). Zapisz obliczenia.
  statement_latex: 5x^{2}-20x=0
  solution: |-
    W równaniu brakuje wyrazu wolnego (c = 0), więc nie liczymy delty, tylko wyłączamy wspólny czynnik przed nawias.
    \(5x^{2}-20x=0\)
    \(5x\cdot\left(x-4\right)=0\)
    Iloczyn jest równy zeru wtedy i tylko wtedy, gdy co najmniej jeden z czynników jest równy zeru:
    \(5x=0\) lub \(x-4=0\),
    czyli \(x=0\) lub \(x=4\).
    Uwaga: gdybyśmy podzielili obie strony przez \(x\), zgubilibyśmy rozwiązanie \(x=0\).
    Odpowiedź: \(x=0\) lub \(x=4\).
  solution_steps:
  - Zauważ, że c = 0 — równanie jest niezupełne.
  - 'Wyłącz wspólny czynnik: 5x(x−4)=0.'
  - 'Skorzystaj z własności iloczynu równego zeru: 5x=0 lub x−4=0.'
  - 'Zapisz rozwiązania: x = 0 lub x = 4.'
  answer:
