  exercise_type: rekonstrukcja wykresu złożonego z paraboli i odcinka, odczyt własności
  statement: |-
    Wykres funkcji f składa się z dwóch części. Pierwsza część to fragment paraboli o wierzchołku W(1, -4) i ramionach skierowanych do góry, narysowany dla x ∈ ⟨-1, 3⟩ (oba końce należą do wykresu), przy czym punkt (3, 0) leży na tej paraboli. Druga część to odcinek o początku (3, 0) (kropka pełna) i końcu (6, c) (kropka pusta), a funkcja f jest rosnąca w przedziale ⟨3, 6). Zbiorem wartości funkcji f jest przedział ⟨-4, 5).
    a) Oblicz c oraz f(0) i podaj dziedzinę funkcji f.
    b) Podaj wszystkie miejsca zerowe funkcji f.
    c) Zapisz zbiór wszystkich argumentów, dla których f(x) ≥ 0.
    d) Rozstrzygnij, czy funkcja f ma wartość największą w przedziale ⟨0, 6). Odpowiedź uzasadnij.
  statement_latex: f(x) = a \cdot \left(x - 1\right)^{2} - 4 \ \text{ dla } x \in \langle -1,\ 3 \rangle,
    \qquad ZW_{f} = \langle -4,\ 5 \right)
  solution: |-
    Najpierw ustalamy wzór fragmentu parabolicznego. Z wierzchołka W(1, -4) mamy f(x) = a(x - 1)² - 4, a z warunku f(3) = 0 otrzymujemy a·(3 - 1)² - 4 = 0, czyli 4a = 4, a = 1 (ramiona do góry — zgodnie z treścią). Zatem na przedziale ⟨-1, 3⟩ mamy f(x) = (x - 1)² - 4.

    a) Fragment paraboliczny przyjmuje wartości od -4 (w wierzchołku) do f(-1) = f(3) = 0, czyli ⟨-4, 0⟩. Odcinek rośnie od wartości 0 (dla x = 3) do poziomu c, którego nie osiąga (kropka pusta), więc daje wartości ⟨0, c). Razem ZW = ⟨-4, c). Skoro ZW = ⟨-4, 5), to c = 5.
    f(0) = (0 - 1)² - 4 = 1 - 4 = -3.
    Dziedzina: fragment paraboli daje ⟨-1, 3⟩, odcinek daje ⟨3, 6) (punkt (6, 5) nie należy do wykresu), więc D = ⟨-1, 6).

    b) Miejsca zerowe fragmentu parabolicznego: (x - 1)² - 4 = 0 ⟺ (x - 1)² = 4 ⟺ x = -1 lub x = 3; obie liczby należą do ⟨-1, 3⟩. Odcinek jest rosnący i zaczyna się w punkcie (3, 0), więc dla x > 3 przyjmuje wartości dodatnie i nie daje nowych miejsc zerowych. Miejsca zerowe: -1 oraz 3.

    c) Na przedziale ⟨-1, 3⟩ mamy (x - 1)² - 4 ≥ 0 ⟺ x ≤ -1 lub x ≥ 3, więc w tym przedziale warunek spełniają tylko argumenty x = -1 i x = 3. Na przedziale ⟨3, 6) wszystkie wartości są nieujemne. Zatem f(x) ≥ 0 dla x ∈ {-1} ∪ ⟨3, 6).

    d) W przedziale ⟨0, 6) wartości funkcji to ⟨-4, 0⟩ (część paraboliczna dla x ∈ ⟨0, 3⟩) oraz ⟨0, 5) (odcinek). Wartości zbliżają się do 5, ale poziom 5 nie jest osiągany, bo punkt (6, 5) nie należy do wykresu. Dla każdego x₀ ∈ ⟨0, 6) można wskazać argument bliższy 6, dla którego wartość jest większa. Wartość największa nie istnieje.
  solution_steps:
  - 'Z wierzchołka i punktu (3, 0) wyznacz wzór paraboli: a·(3-1)² - 4 = 0 ⟹ a = 1, czyli f(x) = (x -
    1)² - 4 na ⟨-1, 3⟩.'
  - 'Ustal zbiory wartości obu części: ⟨-4, 0⟩ oraz ⟨0, c); z warunku ZW = ⟨-4, 5) wynika c = 5.'
  - Oblicz f(0) = (0 - 1)² - 4 = -3 i podaj dziedzinę D = ⟨-1, 6).
  - Rozwiąż (x - 1)² - 4 = 0 ⟹ x = -1, x = 3; na odcinku brak dalszych zer.
  - 'Wyznacz zbiór f(x) ≥ 0: {-1} ∪ ⟨3, 6).'
  - 'Zbadaj wartość największą w ⟨0, 6): poziom 5 nie jest osiągany (kropka pusta) — wartość największa
    nie istnieje.'
  answer:
