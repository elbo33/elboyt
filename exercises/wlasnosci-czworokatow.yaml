- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: zadanie problemowe (romb — przekątne z boku i pola, filtr kąta ostrego)
  statement: Romb ABCD ma bok długości 10, a jego pole jest równe 96. Kąt BAD tego rombu jest kątem ostrym.
    Oblicz długości przekątnych AC i BD oraz tangens kąta, jaki przekątna AC tworzy z bokiem AB. Zapisz
    obliczenia.
  statement_latex: \left(\frac{e}{2}\right)^{2}+\left(\frac{f}{2}\right)^{2}=10^{2},\qquad \frac{1}{2}\cdot
    e\cdot f=96
  solution: |-
    Oznaczmy e = |AC| oraz f = |BD|.

    Krok 1. Przekątne rombu są prostopadłe i dzielą się na połowy, więc
    \left(\frac{e}{2}\right)^{2}+\left(\frac{f}{2}\right)^{2} = 10^{2}, czyli e^{2}+f^{2} = 4\cdot 100 = 400.

    Krok 2. Z pola: \frac{1}{2}\cdot e\cdot f = 96, czyli e\cdot f = 192.

    Krok 3. Stosujemy wzory skróconego mnożenia:
    \left(e+f\right)^{2} = 400+2\cdot 192 = 784, więc e+f = 28 (długości są dodatnie),
    \left(e-f\right)^{2} = 400-2\cdot 192 = 16, więc |e-f| = 4.
    Zatem jedna przekątna ma długość \frac{28+4}{2} = 16, a druga \frac{28-4}{2} = 12.

    Krok 4. Która jest która? Przekątna AC jest dwusieczną kąta BAD, więc w trójkącie prostokątnym ABS (S — punkt przecięcia przekątnych) kąt SAB ma miarę \frac{1}{2}\left|\measuredangle BAD\right| < 45^{\circ}. Naprzeciw mniejszego kąta ostrego leży krótsza przyprostokątna, więc |BS| < |AS|, czyli \frac{f}{2} < \frac{e}{2}. Stąd
    |AC| = e = 16 oraz |BD| = f = 12.

    Krok 5. Tangens kąta między AC a AB:
    \operatorname{tg}\left|\measuredangle SAB\right| = \frac{\frac{12}{2}}{\frac{16}{2}} = \frac{6}{8} = \frac{3}{4}.

    Sprawdzenie: 8^{2}+6^{2} = 100 ✓, \frac{1}{2}\cdot 16\cdot 12 = 96 ✓, a \frac{3}{4} < 1, więc kąt SAB jest mniejszy od 45^{\circ} i kąt BAD jest ostry ✓.

    Odpowiedź: |AC| = 16, |BD| = 12, \operatorname{tg}\left|\measuredangle SAB\right| = \frac{3}{4}.
  solution_steps:
  - Oznacz e = |AC|, f = |BD| i zapisz e² + f² = 4·10² = 400 (przekątne prostopadłe, dzielą się na połowy).
  - Z pola ½·e·f = 96 otrzymaj e·f = 192.
  - 'Ze wzorów skróconego mnożenia: (e + f)² = 784 → e + f = 28 oraz (e − f)² = 16 → |e − f| = 4.'
