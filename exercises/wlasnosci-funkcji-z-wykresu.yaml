- id: g-cm-10
  slot: COMMON_MISTAKE
  ramp_index: 4
  difficulty: 3
  exercise_type: 'korekta błędu: wartość największa a argument'
  statement: 'Funkcja f jest określona wzorem f(x) = -x^2 + 6x - 5 dla x ∈ ⟨0, 5⟩. Wykresem funkcji jest
    fragment paraboli o ramionach skierowanych w dół i wierzchołku W = (3, 4). Uczeń zapisał: „Największa
    wartość funkcji f w przedziale ⟨0, 5⟩ jest równa 3, bo wykres najwyżej sięga nad liczbą 3”. Wyjaśnij,
    na czym polega błąd ucznia, a następnie podaj największą wartość funkcji f w przedziale ⟨0, 5⟩ oraz
    argument, dla którego jest ona przyjmowana.'
  statement_latex: f\left(x\right)=-x^{2}+6\cdot x-5,\qquad x\in\left\langle 0,\,5\right\rangle,\qquad
    W=\left(3,\,4\right)
  solution: |-
    Błędne rozumowanie ucznia: „najwyższy punkt wykresu leży nad liczbą 3 na osi OX, więc największa wartość wynosi 3”. Uczeń podał ARGUMENT zamiast WARTOŚCI.

    Korekta: wartość funkcji to liczba odczytywana na osi OY (druga współrzędna punktu wykresu). Najwyższym punktem fragmentu wykresu jest wierzchołek W = (3, 4): jego pierwsza współrzędna 3 to argument, a druga współrzędna 4 to wartość.

    Sprawdzenie rachunkowe: f\left(3\right) = -\left(3\right)^{2} + 6\cdot 3 - 5 = -9 + 18 - 5 = 4. Ponadto na końcach przedziału f\left(0\right) = -5 oraz f\left(5\right) = -25 + 30 - 5 = 0, a obie te wartości są mniejsze od 4. Ponieważ ramiona paraboli są skierowane w dół, dla każdego x ∈ ⟨0, 5⟩ zachodzi f(x) ≤ 4.

    Odpowiedź: największa wartość funkcji f w przedziale ⟨0, 5⟩ wynosi 4 i jest przyjmowana dla argumentu x = 3.
  solution_steps:
  - 'Pokaż błąd: uczeń podał odciętą wierzchołka (3) jako wartość największą.'
  - 'Przypomnij: wartość to liczba na osi OY, argument to liczba na osi OX.'
  - Odczytaj wierzchołek W = (3, 4) — najwyższy punkt wykresu; oblicz f(3) = -9 + 18 - 5 = 4.
  - 'Porównaj z wartościami na końcach: f(0) = -5, f(5) = 0 — obie mniejsze od 4.'
  - 'Zapisz odpowiedź: wartość największa wynosi 4 i jest przyjmowana dla x = 3.'
  answer:
    kind: MULTIPART
    parts:
    - name: wartość największa
      answer:
        kind: NUMERIC
        value: 4.0
    - name: argument, dla którego jest przyjmowana
      answer:
        kind: NUMERIC
        value: 3.0
