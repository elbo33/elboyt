- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: wyznaczanie a_1 i q z dwóch wyrazów, suma
  statement: W ciągu geometrycznym (a_n), określonym dla każdej liczby naturalnej n ≥ 1, drugi wyraz jest
    równy a_2 = -6, a piąty wyraz jest równy a_5 = 48. Wyznacz iloraz q oraz pierwszy wyraz a_1 tego ciągu,
    a następnie oblicz sumę sześciu początkowych jego wyrazów. Zapisz obliczenia.
  statement_latex: a_5 = a_2\cdot q^{3}\ \Rightarrow\ 48 = \left(-6\right)\cdot q^{3},\qquad S_6 = a_1\cdot\frac{1-q^{6}}{1-q}
  solution: |-
    Korzystamy z zależności między dwoma wyrazami: a_5 = a_2 \cdot q^{5-2} = a_2 \cdot q^{3}.
    Stąd 48 = (-6)\cdot q^{3}, czyli q^{3} = -8, a więc q = -2 (wykładnik nieparzysty, jedno rozwiązanie rzeczywiste).
    Z równości a_2 = a_1 \cdot q mamy -6 = a_1 \cdot (-2), zatem a_1 = \frac{-6}{-2} = 3.
    Sprawdzenie: 3, -6, 12, -24, 48 — istotnie a_5 = 48. ✓
    Suma: q = -2 \neq 1, więc S_6 = 3 \cdot \frac{1-\left(-2\right)^{6}}{1-\left(-2\right)} = 3\cdot\frac{1-64}{3} = 3\cdot\frac{-63}{3} = -63.
    Kontrola: 3 - 6 + 12 - 24 + 48 - 96 = -63. ✓
    Odpowiedź: q = -2, a_1 = 3, S_6 = -63.
  solution_steps:
  - 'Zapisz a_5 = a_2 \cdot q^{3} i podstaw dane: 48 = \left(-6\right)\cdot q^{3}.'
  - Wyznacz q^{3} = -8, stąd q = -2.
  - Z a_2 = a_1 \cdot q oblicz a_1 = \frac{-6}{-2} = 3.
  - Sprawdź, że q \neq 1, i podstaw do wzoru S_6 = a_1\cdot\frac{1-q^{6}}{1-q}.
  - Pamiętaj, że \left(-2\right)^{6} = 64, i oblicz S_6 = -63.
  answer:
    kind: MULTIPART
    parts:
    - name: q
      answer:
        kind: NUMERIC
        value: -2.0
        latex: q = -2
    - name: a_1
      answer:
        kind: NUMERIC
        value: 3.0
        latex: a_1 = 3
    - name: S_6
      answer:
        kind: NUMERIC
        value: -63.0
        latex: S_6 = -63
  checks:
  - kind: evaluate
    expr: \frac{-6}{-2}
    part: a_1
  - kind: evaluate
    expr: 3\cdot\frac{1-\left(-2\right)^{6}}{1-\left(-2\right)}
    part: S_6
  skills:
  - zależność a_n = a_k q^{n-k}
  - równanie potęgowe
  - wzór na S_n
  - ujemny iloraz
  verification:
    checkability: REFERENCE_CALL
    note: '3 parts matched · det: [a_1] SymPy solved it fresh: 3.0 vs 3.0 (tol 1e-09) ; [S_6] SymPy solved
      it fresh: -63.0 vs -63.0 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: dobieranie parametru (warunek b² = ac)
  statement: Wyznacz wszystkie wartości x, dla których liczby 2, x, x + 12 — w podanej kolejności — są
    trzema kolejnymi wyrazami ciągu geometrycznego. Dla każdej znalezionej wartości x podaj iloraz tego
    ciągu. Zapisz obliczenia.
  statement_latex: x^{2} = 2\cdot\left(x+12\right)
  solution: |-
    Warunek na trzy kolejne wyrazy ciągu geometrycznego: (wyraz środkowy)² = (pierwszy)·(trzeci), czyli x^{2} = 2\cdot\left(x+12\right).
    Stąd x^{2} - 2x - 24 = 0. Wyróżnik: \Delta = 4 + 96 = 100, \sqrt{\Delta} = 10.
    Zatem x = \frac{2-10}{2} = -4 lub x = \frac{2+10}{2} = 6.
    Sprawdzamy warunek, że żaden wyraz nie jest zerem:
    • dla x = 6 otrzymujemy liczby 2, 6, 18 — wszystkie różne od zera, q = \frac{6}{2} = 3 (i \frac{18}{6} = 3 ✓);
    • dla x = -4 otrzymujemy liczby 2, -4, 8 — wszystkie różne od zera, q = \frac{-4}{2} = -2 (i \frac{8}{-4} = -2 ✓).
    Odpowiedź: x = 6 (wtedy q = 3) albo x = -4 (wtedy q = -2).
  solution_steps:
  - Zapisz warunek x^{2} = 2\cdot\left(x+12\right).
  - Przekształć do postaci x^{2} - 2x - 24 = 0.
  - Oblicz \Delta = 100 i pierwiastki x = -4 oraz x = 6.
  - Wypisz odpowiadające trójki liczb i sprawdź, że żadna z nich nie zawiera zera.
  - 'Wyznacz iloraz jako iloraz wyrazu drugiego przez pierwszy: q = 3 dla x = 6 oraz q = -2 dla x = -4.'
  answer:
    kind: MULTIPART
    parts:
    - name: x
      answer:
        kind: SET
        latex: x \in \{-4,\ 6\}
        members:
        - '-4'
        - '6'
    - name: q
      answer:
        kind: SET
        latex: q = -2 \text{ (dla } x=-4\text{)},\ q = 3 \text{ (dla } x=6\text{)}
        members:
        - '-2'
        - '3'
  checks:
  - kind: solve_equation
    expr: x^{2} = 2\cdot\left(x+12\right)
    part: x
  skills:
  - warunek na trzy kolejne wyrazy
  - równanie kwadratowe
  - weryfikacja warunku niezerowości
  - wyznaczanie ilorazu
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: kind mismatch: answer=SET reference=NUMERIC'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: wyznaczanie a_1 i q z dwóch wyrazów, suma n wyrazów
  statement: Dany jest ciąg geometryczny \left(a_{n}\right) określony dla każdej liczby naturalnej n \geq
    1, w którym a_{3} = 18 oraz a_{6} = -486. Oblicz iloraz q tego ciągu, jego pierwszy wyraz a_{1} oraz
    sumę S_{7} siedmiu początkowych wyrazów. Zapisz obliczenia.
  statement_latex: a_{6} = a_{3} \cdot q^{3}, \qquad S_{7} = a_{1} \cdot \frac{1 - q^{7}}{1 - q}
  solution: |-
    Korzystamy z zależności między dwoma dowolnymi wyrazami: a_{6} = a_{3} \cdot q^{6-3} = a_{3} \cdot q^{3}.
    Stąd -486 = 18 \cdot q^{3}, czyli q^{3} = -27, więc q = -3 (wykładnik nieparzysty — jedno rozwiązanie rzeczywiste).
    Z zależności a_{3} = a_{1} \cdot q^{2} mamy 18 = a_{1} \cdot \left(-3\right)^{2} = 9 a_{1}, zatem a_{1} = 2.
    Sprawdzenie: 2, -6, 18, -54, 162, -486 — istotnie a_{3} = 18 i a_{6} = -486.
    Ponieważ q = -3 \neq 1, stosujemy wzór na sumę:
    S_{7} = 2 \cdot \frac{1 - \left(-3\right)^{7}}{1 - \left(-3\right)} = 2 \cdot \frac{1 + 2187}{4} = \frac{2 \cdot 2188}{4} = 1094.
    Odpowiedź: q = -3, a_{1} = 2, S_{7} = 1094.
  solution_steps:
  - 'Zapisz a_{6} = a_{3} \cdot q^{3} i podstaw dane: -486 = 18 \cdot q^{3}.'
  - Wyznacz q^{3} = -27, stąd q = -3.
  - 'Z a_{3} = a_{1} \cdot q^{2}: 18 = 9 a_{1}, więc a_{1} = 2.'
  - Sprawdź, że q \neq 1 i podstaw do wzoru S_{7} = a_{1} \cdot \frac{1 - q^{7}}{1 - q}.
  - 'Oblicz \left(-3\right)^{7} = -2187 i wykonaj działania: S_{7} = 2 \cdot \frac{2188}{4} = 1094.'
  answer:
    kind: MULTIPART
    parts:
    - name: q
      answer:
        kind: NUMERIC
        value: -3.0
        latex: '-3'
    - name: a_1
      answer:
        kind: NUMERIC
        value: 2.0
        latex: '2'
    - name: S_7
      answer:
        kind: NUMERIC
        value: 1094.0
        latex: '1094'
  checks:
  - kind: evaluate
    expr: -\sqrt[3]{27}
    var: q
    part: q
  - kind: evaluate
    expr: \frac{18}{\left(-3\right)^{2}}
    part: a_1
  - kind: evaluate
    expr: 2 \cdot \frac{1 - \left(-3\right)^{7}}{1 - \left(-3\right)}
    part: S_7
  skills:
  - zależność a_n = a_k q^{n-k}
  - rozwiązywanie równania q^3 = c
  - wzór na sumę n początkowych wyrazów
  - działania na potęgach o ujemnej podstawie
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [q] SymPy solved it fresh: -3.0 vs -3.0 (tol 1e-09) ; [a_1]
      SymPy solved it fresh: 2.0 vs 2.0 (tol 1e-09) ; [S_7] SymPy solved it fresh: 1094.0 vs 1094.0 (tol
      1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: warunek b^2 = ac z parametrem, iloraz, suma
  statement: Liczby x,\ x+6,\ 2x+3 (w podanej kolejności) są trzema kolejnymi wyrazami ciągu geometrycznego.
    Wyznacz wszystkie liczby x spełniające ten warunek i dla każdej z nich podaj iloraz otrzymanego ciągu.
    Następnie dla tego z otrzymanych ciągów, który jest rosnący, oblicz sumę pięciu początkowych wyrazów
    (przyjmując, że jego pierwszym wyrazem jest liczba x). Zapisz obliczenia.
  statement_latex: \left(x+6\right)^{2} = x \cdot \left(2x+3\right)
  solution: |-
    Warunek na trzy kolejne wyrazy ciągu geometrycznego: \left(x+6\right)^{2} = x \cdot \left(2x+3\right).
    x^{2} + 12x + 36 = 2x^{2} + 3x, czyli x^{2} - 9x - 36 = 0.
    \Delta = 81 + 144 = 225, \sqrt{\Delta} = 15, więc x = \frac{9-15}{2} = -3 lub x = \frac{9+15}{2} = 12.
    Sprawdzamy niezerowość wyrazów i wyznaczamy iloraz:
    • dla x = 12 liczby to 12, 18, 27 — wszystkie różne od zera, q = \frac{18}{12} = \frac{3}{2} (oraz \frac{27}{18} = \frac{3}{2});
    • dla x = -3 liczby to -3, 3, -3 — wszystkie różne od zera, q = \frac{3}{-3} = -1.
    Ciąg jest rosnący tylko w pierwszym przypadku (a_{1} = 12 > 0 i q = \frac{3}{2} > 1); dla q = -1 wyrazy zmieniają znak, więc ciąg nie jest monotoniczny.
    Suma pięciu początkowych wyrazów ciągu o a_{1} = 12 i q = \frac{3}{2}:
    S_{5} = 12 \cdot \frac{1 - \left(\frac{3}{2}\right)^{5}}{1 - \frac{3}{2}} = 12 \cdot \frac{1 - \frac{243}{32}}{-\frac{1}{2}} = 12 \cdot \frac{211}{16} = \frac{633}{4} = 158{,}25.
    Odpowiedź: x = 12 (q = \frac{3}{2}) lub x = -3 (q = -1); dla ciągu rosnącego S_{5} = \frac{633}{4} = 158{,}25.
  solution_steps:
  - Zapisz warunek \left(x+6\right)^{2} = x \cdot \left(2x+3\right).
  - 'Sprowadź do równania x^{2} - 9x - 36 = 0 i rozwiąż: x = 12 lub x = -3.'
  - 'Dla każdego x wypisz trzy liczby, sprawdź, że są różne od zera, i oblicz iloraz: q = \frac{3}{2}
    oraz q = -1.'
  - 'Wskaż ciąg rosnący: a_{1} = 12, q = \frac{3}{2}.'
  - Oblicz S_{5} = 12 \cdot \frac{1 - \left(\frac{3}{2}\right)^{5}}{1 - \frac{3}{2}} = \frac{633}{4} =
    158{,}25.
  answer:
    kind: MULTIPART
    parts:
    - name: x
      answer:
        kind: SET
        members:
        - '12'
        - '-3'
    - name: ilorazy
      answer:
        kind: SET
        members:
        - \frac{3}{2}
        - '-1'
    - name: S_5
      answer:
        kind: NUMERIC
        value: 158.25
        latex: \frac{633}{4}
  checks:
  - kind: solve_equation
    expr: \left(x+6\right)^{2} = x \cdot \left(2x+3\right)
    part: x
  - kind: evaluate
    expr: 12 \cdot \frac{1 - \left(\frac{3}{2}\right)^{5}}{1 - \frac{3}{2}}
    part: S_5
  skills:
  - warunek na trzy kolejne wyrazy ciągu geometrycznego
  - rozwiązywanie równania kwadratowego
  - sprawdzanie niezerowości wyrazów
  - monotoniczność ciągu geometrycznego
  - wzór na sumę n początkowych wyrazów
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: kind mismatch: answer=SET reference=SYMBOLIC'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: 'demonstracja błędu: iloraz a różnica'
  statement: 'Trzema początkowymi wyrazami ciągu geometrycznego (a_n) są liczby 3, 12, 48. Uczeń zauważył,
    że różnice kolejnych wyrazów wynoszą 9 i 36, i zapisał: „skoro ciąg rośnie coraz szybciej, to kolejny
    wyraz otrzymam, dodając 36·4 = 144, czyli a_4 = 48 + 144 = 192, a ogólnie a_n = 3 + \left(n-1\right)\cdot
    9”. Wskaż błąd w tym rozumowaniu i oblicz poprawnie piąty wyraz tego ciągu.'
  statement_latex: '\text{błędnie: } a_n = a_1 + \left(n-1\right)\cdot q;\qquad \text{poprawnie: } a_5
    = 3\cdot 4^{4}'
  solution: |-
