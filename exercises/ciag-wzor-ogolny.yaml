- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: obliczanie wyrazu ciągu danego wzorem z ułamkiem
  statement: Ciąg \left(a_{n}\right) jest określony wzorem a_{n}=\frac{n^{2}+2}{n+1} dla każdej liczby
    naturalnej n\geq 1. Oblicz wyraz a_{5} i zapisz wynik w postaci ułamka nieskracalnego.
  statement_latex: a_{n}=\frac{n^{2}+2}{n+1},\qquad n\geq 1
  solution: |-
    Podstawiamy n=5 w każdym miejscu, w którym występuje n:
    a_{5}=\frac{5^{2}+2}{5+1}=\frac{25+2}{6}=\frac{27}{6}=\frac{9}{2}.
    Odpowiedź: a_{5}=\frac{9}{2}=4{,}5.
  solution_steps:
  - 'Wstaw n=5 do licznika: 5^{2}+2=27.'
  - 'Wstaw n=5 do mianownika: 5+1=6.'
  - 'Zapisz iloraz: \frac{27}{6}.'
  - 'Skróć ułamek przez 3: \frac{9}{2}.'
  answer:
    kind: NUMERIC
    value: 4.5
  checks:
  - kind: evaluate
    expr: \frac{5^{2}+2}{5+1}
    var: n
  skills:
  - podstawianie do wzoru z ułamkiem
  - skracanie ułamka
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 4.5 vs 4.5 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: obliczanie wyrazów i ich różnicy
  statement: Ciąg \left(a_{n}\right) jest określony wzorem a_{n}=2^{n}-3\cdot n dla każdej liczby naturalnej
    n\geq 1. Oblicz wyrazy a_{1} oraz a_{4}, a następnie oblicz różnicę a_{4}-a_{1}.
  statement_latex: a_{n}=2^{n}-3\cdot n,\qquad n\geq 1
  solution: |-
    Podstawiamy kolejno numery wyrazów.
    a_{1}=2^{1}-3\cdot 1=2-3=-1.
    a_{4}=2^{4}-3\cdot 4=16-12=4.
    Różnica: a_{4}-a_{1}=4-\left(-1\right)=5.
    Odpowiedź: a_{1}=-1, a_{4}=4, a_{4}-a_{1}=5.
  solution_steps:
  - 'Podstaw n=1: a_{1}=2^{1}-3\cdot 1=-1.'
  - 'Podstaw n=4: a_{4}=2^{4}-3\cdot 4=16-12=4.'
  - 'Oblicz różnicę: 4-\left(-1\right)=5.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_1
      answer:
        kind: NUMERIC
        value: -1.0
    - name: a_4
      answer:
        kind: NUMERIC
        value: 4.0
    - name: roznica
      answer:
        kind: NUMERIC
        value: 5.0
  checks:
  - kind: evaluate
    expr: 2^{1}-3\cdot 1
    var: n
    part: a_1
  - kind: evaluate
    expr: 2^{4}-3\cdot 4
    var: n
    part: a_4
  - kind: evaluate
    expr: \left(2^{4}-3\cdot 4\right)-\left(2^{1}-3\cdot 1\right)
    var: n
