- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie: funkcja kwadratowa pola z ograniczeniem zewnętrznym'
  statement: Rolnik ma 60 metrów siatki i chce ogrodzić nią prostokątny wybieg dla drobiu. Jednym bokiem
    wybieg ma przylegać do prostej ściany stodoły, więc siatką ogradzane są tylko trzy pozostałe boki.
    Ściana stodoły ma długość 24 metry, zatem bok wybiegu przylegający do ściany nie może być dłuższy
    niż 24 metry. Niech x oznacza długość boku wybiegu prostopadłego do ściany (w metrach). a) Wyznacz
    wzór funkcji P opisującej pole wybiegu w zależności od x oraz jej dziedzinę. b) Oblicz wymiary wybiegu
    o największym możliwym polu i to największe pole. Zapisz obliczenia.
  statement_latex: P\left(x\right) = x\cdot\left(60 - 2\cdot x\right)
  solution: |-
    a) Oznaczmy przez y długość boku przylegającego do ściany. Siatka pokrywa dwa boki o długości x i jeden bok o długości y, więc
    2\cdot x + y = 60, \qquad y = 60 - 2\cdot x.
    Warunki zadania:
    \bullet x > 0,
    \bullet y > 0, czyli 60 - 2x > 0, stąd x < 30,
    \bullet y \le 24 (ściana ma 24 m), czyli 60 - 2x \le 24, stąd 2x \ge 36, czyli x \ge 18.
    Część wspólna tych warunków to x \in \left\langle 18,\,30\right).
    Pole wybiegu: P\left(x\right) = x\cdot\left(60 - 2\cdot x\right) = -2x^{2} + 60x, dla x \in \left\langle 18,\,30\right).

    b) Współczynnik przy x^{2} jest ujemny, więc parabola ma ramiona skierowane w dół, a jej wierzchołek ma odciętą
    p = \frac{-60}{2\cdot\left(-2\right)} = 15.
    Liczba 15 NIE należy do dziedziny (dla x = 15 bok przy ścianie miałby 30 m, a ściana ma tylko 24 m). Dla x > 15 funkcja P jest malejąca, więc na przedziale \left\langle 18,\,30\right) największą wartość przyjmuje na jego lewym końcu, czyli dla x = 18.
    Wtedy y = 60 - 2\cdot 18 = 24 oraz
    P\left(18\right) = 18\cdot 24 = 432.
    Sprawdzenie ograniczenia: y = 24 \le 24 — warunek jest spełniony (bok dokładnie pokrywa ścianę).

    Odpowiedź: a) P\left(x\right) = -2x^{2} + 60x, x \in \left\langle 18,\,30\right); b) wybieg o wymiarach 18 m i 24 m, jego pole to 432 m^{2}.
