  - 'Wyznacz miejsca zerowe: x=3-t oraz x=3+t, więc \left|AB\right|=2t, a wysokość trójkąta wynosi t.'
  - 'Ułóż równanie pola: \frac{1}{2}\cdot 2t\cdot t=25, czyli t^2=25, skąd t=5 (t=-5 odrzucamy).'
