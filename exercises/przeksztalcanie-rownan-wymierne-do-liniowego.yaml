    podaj poprawny zbiór rozwiązań.
  statement_latex: \frac{3\cdot x}{x-5}=\frac{15}{x-5}+2
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA:
    Uczeń bez żadnych założeń mnoży obie strony przez x-5:
    3x=15+2\cdot\left(x-5\right)
