- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: modelowanie średniej – równanie wymierne z odrzuceniem pierwiastka
  statement: W teście z matematyki wzięła udział pewna grupa uczniów. Łączna liczba punktów uzyskanych
    przez wszystkich uczniów tej grupy jest równa 300. Gdyby w tym teście wzięło udział o 5 uczniów mniej,
    a łączna liczba punktów pozostałaby taka sama, to średnia liczba punktów przypadająca na jednego ucznia
    byłaby o 2 punkty większa. Oblicz, ilu uczniów pisało ten test, oraz wyznacz średnią liczbę punktów
    przypadającą na jednego ucznia.
  statement_latex: \frac{300}{n - 5} = \frac{300}{n} + 2
  solution: |-
    Oznaczmy przez n liczbę uczniów piszących test; n jest liczbą całkowitą i n > 5 (inaczej druga sytuacja nie miałaby sensu).

    Średnia liczba punktów w rzeczywistej sytuacji to 300/n, a w sytuacji hipotetycznej 300/(n − 5). Z treści zadania:
    300/(n − 5) = 300/n + 2.

    Mnożymy obie strony przez n(n − 5) ≠ 0:
    300n = 300(n − 5) + 2n(n − 5),
    300n = 300n − 1500 + 2n² − 10n,
    0 = 2n² − 10n − 1500,
    n² − 5n − 750 = 0.

    Δ = (−5)² − 4·1·(−750) = 25 + 3000 = 3025, √Δ = 55.
    n = (5 − 55)/2 = −25 albo n = (5 + 55)/2 = 30.

    Liczba uczniów musi być dodatnia i większa od 5, więc odrzucamy n = −25. Zatem n = 30.

    Średnia liczba punktów: 300/30 = 10 punktów.
    Sprawdzenie: przy 25 uczniach średnia wynosiłaby 300/25 = 12, czyli o 2 punkty więcej ✓.

    Odpowiedź: test pisało 30 uczniów, a średnia liczba punktów wynosi 10.
  solution_steps:
  - Wprowadź niewiadomą n – liczbę uczniów, przy założeniu n > 5 i n całkowite.
  - 'Zapisz obie średnie: rzeczywistą 300/n oraz hipotetyczną 300/(n − 5).'
  - Ułóż równanie 300/(n − 5) = 300/n + 2.
  - Sprowadź je do postaci n² − 5n − 750 = 0 i oblicz Δ = 3025, √Δ = 55.
  - Wyznacz pierwiastki n = −25 oraz n = 30 i odrzuć ujemny, bo liczba uczniów jest dodatnia.
  - 'Oblicz średnią: 300/30 = 10 punktów i sprawdź warunek zadania.'
