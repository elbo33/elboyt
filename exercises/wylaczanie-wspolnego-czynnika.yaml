  exercise_type: 'modelowanie: wzór + dziedzina, rozkład na czynniki, równanie i kontrola dziedziny'
  statement: |-
    Z kwadratowego arkusza tektury o boku długości 12 cm wycięto w każdym z czterech narożników jednakowy kwadrat o boku długości x cm, a następnie wystające paski zagięto ku górze wzdłuż linii cięcia i sklejono, otrzymując otwarte pudełko w kształcie prostopadłościanu o kwadratowej podstawie i wysokości x cm.
    a) Wyznacz wzór na pole powierzchni S\left(x\right) tego pudełka, będące sumą pola dna i pól czterech ścian bocznych; zapisz je w postaci iloczynu oraz podaj dziedzinę tego wzoru.
    b) Oblicz, dla jakiej wartości x pole powierzchni pudełka jest równe 96 cm^{2}, i sprawdź, czy otrzymana wartość należy do wyznaczonej dziedziny.
  statement_latex: S\left(x\right)=\left(12-2\cdot x\right)^{2}+4\cdot x\cdot\left(12-2\cdot x\right)
  solution: |-
    a) Po wycięciu narożników dno pudełka jest kwadratem o boku 12-2x, a każda z czterech ścian bocznych jest prostokątem o wymiarach \left(12-2x\right)\times x.
    Zatem
    S\left(x\right)=\left(12-2x\right)^{2}+4\cdot x\cdot\left(12-2x\right).
    Wyłączamy wspólny czynnik \left(12-2x\right):
    S\left(x\right)=\left(12-2x\right)\left[\left(12-2x\right)+4x\right]=\left(12-2x\right)\left(12+2x\right)=4\left(6-x\right)\left(6+x\right)=144-4x^{2}.
    Dziedzina: musi być x>0 (wycinamy kwadraty o dodatnim boku) oraz 12-2x>0, czyli x<6. Zatem x\in\left(0;6\right).

    b) Rozwiązujemy równanie 144-4x^{2}=96:
    4x^{2}=48,\qquad x^{2}=12,\qquad x=2\sqrt{3}\ \text{lub}\ x=-2\sqrt{3}.
    Wartość ujemna nie należy do dziedziny. Ponieważ 2\sqrt{3}\approx 3{,}46 oraz 0<3{,}46<6, wartość x=2\sqrt{3} należy do dziedziny \left(0;6\right) — jest to rozwiązanie zadania.
    Sprawdzenie: dla x=2\sqrt{3} mamy S=144-4\cdot 12=144-48=96 cm^{2}. ✓
  solution_steps:
  - Zauważ, że dno pudełka jest kwadratem o boku 12-2x, a wysokość pudełka wynosi x.
  - Zapisz pole dna (12-2x)^2 i pole czterech ścian bocznych 4x(12-2x); dodaj je.
  - 'Wyłącz wspólny czynnik (12-2x): S(x) = (12-2x)[(12-2x)+4x] = (12-2x)(12+2x) = 4(6-x)(6+x) = 144-4x^2.'
  - Wyznacz dziedzinę z warunków x > 0 oraz 12-2x > 0, czyli x ∈ (0; 6).
  - Rozwiąż równanie 144-4x^2 = 96, otrzymując x^2 = 12, czyli x = 2\sqrt{3} lub x = -2\sqrt{3}.
  - 'Sprawdź zgodność z dziedziną: 2\sqrt{3} ≈ 3,46 należy do (0;6), wartość ujemna odpada.'
