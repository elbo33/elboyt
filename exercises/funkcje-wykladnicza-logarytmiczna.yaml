- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: skala logarytmiczna z ograniczeniem — maksymalna liczba obiektów
  statement: Poziom natężenia dźwięku wyraża się wzorem L=10\cdot\log\frac{I}{I_{0}}, gdzie L jest wyrażone
    w decybelach, I to natężenie dźwięku, a I_{0}=10^{-12}\ \frac{\mathrm{W}}{\mathrm{m}^{2}} to próg
    słyszalności. W hali produkcyjnej pracują jednakowe maszyny. Gdy pracuje dokładnie jedna maszyna,
    poziom natężenia dźwięku w punkcie kontrolnym hali jest równy 74 dB. Natężenia dźwięków pochodzących
    od wszystkich pracujących maszyn sumują się w punkcie kontrolnym. Przepisy dopuszczają w tym punkcie
    poziom natężenia dźwięku nieprzekraczający 86 dB. Ile najwięcej maszyn może pracować w tej hali jednocześnie?
    Przyjmij \log 2 \approx 0{,}301 oraz \log 3 \approx 0{,}477.
  statement_latex: L\left(n\right)=10\cdot\log\frac{n\cdot I_{1}}{I_{0}}=74+10\cdot\log n
  solution: |-
    Niech I_{1} będzie natężeniem dźwięku od jednej maszyny w punkcie kontrolnym, a n — liczbą jednocześnie pracujących maszyn. Wtedy natężenie od n maszyn wynosi n\cdot I_{1}, więc
    L\left(n\right)=10\cdot\log\frac{n\cdot I_{1}}{I_{0}}=10\cdot\log\frac{I_{1}}{I_{0}}+10\cdot\log n=74+10\cdot\log n.
    Warunek przepisów: 74+10\cdot\log n\le 86, czyli 10\cdot\log n\le 12, a stąd \log n\le 1{,}2, czyli n\le 10^{1{,}2}.
    Sprawdzamy kandydatów: \log 15=\log 3+\log 5=\log 3+1-\log 2\approx 0{,}477+0{,}699=1{,}176\le 1{,}2, natomiast \log 16=4\cdot\log 2\approx 1{,}204>1{,}2.
