- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: graniastosłup prawidłowy — przekątna bryły, objętość i pole boczne
  statement: Dany jest graniastosłup prawidłowy sześciokątny ABCDEF A'B'C'D'E'F', w którym wierzchołek
    A' leży nad A, B' nad B itd. Krawędź podstawy tego graniastosłupa ma długość 6, a najdłuższa przekątna
    bryły, czyli odcinek AD', ma długość 15 (punkty A i D są przeciwległymi wierzchołkami sześciokąta
    foremnego ABCDEF). Oblicz wysokość tego graniastosłupa, jego objętość oraz pole powierzchni bocznej.
    Zapisz obliczenia.
  statement_latex: \left|AD\right| = 2\cdot 6 = 12,\qquad H = \sqrt{15^{2} - 12^{2}}
  solution: |-
    Rzutem prostokątnym przekątnej AD' na płaszczyznę podstawy jest najdłuższa przekątna sześciokąta foremnego, czyli odcinek AD o długości |AD| = 2a = 2\cdot 6 = 12.
    Trójkąt ADD' jest prostokątny (krawędź boczna DD' jest prostopadła do podstawy), więc z twierdzenia Pitagorasa:
    H^2 = |AD'|^2 - |AD|^2 = 15^2 - 12^2 = 225 - 144 = 81, zatem H = 9.
    Pole podstawy (sześciokąt foremny o boku 6): P_p = \frac{3\cdot 6^2\sqrt{3}}{2} = 54\sqrt{3}.
    Objętość: V = P_p\cdot H = 54\sqrt{3}\cdot 9 = 486\sqrt{3} \approx 841,8.
    Pole powierzchni bocznej: sześć przystających prostokątów 6\times 9, więc P_b = 6\cdot 6\cdot 9 = 324.
    Kontrola sensu: przekątna bryły (15) jest dłuższa od przekątnej podstawy (12) i od wysokości (9) — zgadza się.
  solution_steps:
  - Zauważ, że rzutem przekątnej AD' na podstawę jest przekątna AD = 2a = 12.
  - 'Z twierdzenia Pitagorasa w trójkącie prostokątnym ADD'': H^2 = 15^2 - 12^2 = 81, więc H = 9.'
  - 'Oblicz pole podstawy: P_p = \frac{3\cdot 6^2\sqrt{3}}{2} = 54\sqrt{3}.'
  - 'Objętość: V = 54\sqrt{3}\cdot 9 = 486\sqrt{3}.'
  - 'Pole boczne: P_b = Ob_p\cdot H = 36\cdot 9 = 324.'
  answer:
    kind: MULTIPART
    parts:
    - name: H
      answer:
        kind: NUMERIC
        value: 9.0
    - name: V
      answer:
        kind: SYMBOLIC
        latex: 486\sqrt{3}
    - name: P_b
      answer:
        kind: NUMERIC
        value: 324.0
  checks:
  - kind: evaluate
    expr: \sqrt{15^{2} - \left(2\cdot 6\right)^{2}}
    part: H
  - kind: evaluate
    expr: \frac{3\cdot 6^{2}\cdot\sqrt{3}}{2}\cdot 9
    part: V
  - kind: evaluate
    expr: 6\cdot 6\cdot 9
    part: P_b
  skills:
