  exercise_type: suma n początkowych wyrazów z a_1 i a_n
  statement: Ciąg arytmetyczny (a_n) jest określony dla każdej liczby naturalnej n ≥ 1. W tym ciągu a_1
    = 3 oraz a_{12} = 36. Oblicz sumę dwunastu początkowych kolejnych wyrazów tego ciągu. Zapisz obliczenia.
  statement_latex: S_{12} = \frac{3 + 36}{2}\cdot 12
  solution: |-
    Znam pierwszy i dwunasty wyraz, więc stosuję wzór S_n = \frac{a_1 + a_n}{2}\cdot n.
    S_{12} = \frac{3 + 36}{2}\cdot 12 = \frac{39}{2}\cdot 12 = 39\cdot 6 = 234.
    Odpowiedź: S_{12} = 234.
  solution_steps:
  - Zapisuję wzór S_n = \frac{a_1 + a_n}{2}\cdot n.
  - Podstawiam a_1 = 3, a_{12} = 36, n = 12.
  - Obliczam \frac{39}{2}\cdot 12 = 234.
