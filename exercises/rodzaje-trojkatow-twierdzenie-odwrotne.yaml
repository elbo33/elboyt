      answer:
        kind: NUMERIC
        value: 130.0
    - name: kwadrat najdłuższego boku
      answer:
        kind: NUMERIC
        value: 121.0
    - name: rodzaj trójkąta
      answer:
        kind: SYMBOLIC
        latex: \text{trójkąt ostrokątny}
