- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: porządkowanie i redukcja wielomianu
  statement: Dane jest wyrażenie W(x)=3x^{2}-5+2x^{3}-7x^{2}+4. Zredukuj wyrazy podobne i zapisz wielomian
    W w postaci uporządkowanej (według malejących potęg zmiennej). Podaj stopień wielomianu W, jego wyraz
    wolny oraz współczynnik przy x.
  statement_latex: W(x)=3x^{2}-5+2x^{3}-7x^{2}+4
  solution: |-
    Grupujemy wyrazy podobne. Wyraz z x^{3} jest tylko jeden: 2x^{3}. Wyrazy z x^{2}: 3x^{2}-7x^{2}=\left(3-7\right)x^{2}=-4x^{2}. Wyrazy wolne: -5+4=-1. Wyrazu z x w ogóle nie ma, więc jego współczynnik jest równy 0.
    Po uporządkowaniu: W(x)=2x^{3}-4x^{2}-1.
    Najwyższa potęga zmiennej to x^{3}, więc stopień wielomianu wynosi 3. Wyraz wolny to -1 (można też obliczyć W\left(0\right)=-1), a współczynnik przy x wynosi 0.
  solution_steps:
  - 'Pogrupuj wyrazy podobne: osobno x^{3}, osobno x^{2}, osobno wyrazy wolne.'
  - 'Dodaj współczynniki w każdej grupie: 3x^{2}-7x^{2}=-4x^{2}, -5+4=-1.'
  - 'Zapisz wynik malejąco: W(x)=2x^{3}-4x^{2}-1.'
  - 'Odczytaj: stopień 3, wyraz wolny -1, współczynnik przy x równy 0 (brak wyrazu z x).'
  answer:
    kind: MULTIPART
    parts:
    - name: postac uporzadkowana
      answer:
        kind: SYMBOLIC
        latex: 2x^{3}-4x^{2}-1
    - name: stopien
      answer:
        kind: NUMERIC
        value: 3.0
    - name: wyraz wolny
      answer:
        kind: NUMERIC
        value: -1.0
    - name: wspolczynnik przy x
      answer:
        kind: NUMERIC
        value: 0.0
  checks:
  - kind: simplify
    expr: 3x^{2}-5+2x^{3}-7x^{2}+4
    part: postac uporzadkowana
  - kind: evaluate
    expr: 3\cdot 0^{2}-5+2\cdot 0^{3}-7\cdot 0^{2}+4
    part: wyraz wolny
  skills:
