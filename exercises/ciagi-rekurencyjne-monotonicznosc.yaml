    BŁĘDNE ROZUMOWANIE: uczeń potraktował symbol a_{n+1} tak, jakby oznaczał „a_{n} powiększone o 1”, i napisał a_{n+1} = a_{n} + 1 = \left(5n-3\right) + 1 = 5n - 2. Stąd otrzymałby różnicę a_{n+1} - a_{n} = 1 — wartość błędną.
    DLACZEGO TO BŁĄD: a_{n+1} to NASTĘPNY WYRAZ ciągu, czyli wartość wzoru dla argumentu n+1, a nie poprzedni wyraz zwiększony o 1. Indeks n+1 wstawiamy do wzoru, a nie dodajemy do wartości.
