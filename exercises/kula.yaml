  exercise_type: wyznaczanie promienia z pola powierzchni
  statement: Pole powierzchni kuli jest równe 100\pi\ \text{cm}^{2}. Oblicz promień tej kuli.
  statement_latex: 4\pi R^{2} = 100\pi
  solution: |-
    Krok 1. Zapisujemy równanie ze wzoru na pole sfery: 4\pi R^{2} = 100\pi.
    Krok 2. Dzielimy obie strony przez 4\pi: R^{2} = \frac{100\pi}{4\pi} = 25.
    Krok 3. Ponieważ promień jest dodatni, R = \sqrt{25} = 5\ \text{cm}.
    Odpowiedź: R = 5 cm.
  solution_steps:
  - Zapisz równanie 4\pi R^{2} = 100\pi.
  - 'Podziel przez 4\pi: R^{2} = 25.'
  - 'Weź pierwiastek dodatni: R = 5\ \text{cm}.'
  answer:
    kind: NUMERIC
    value: 5.0
  checks:
