- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: modelowanie rekurencyjne (D2, D3) z rozstrzygnięciem monotoniczności
  statement: 'W stawie hodowlanym na początku pierwszego roku obserwacji było 500 karpi. Przyjmujemy następujący
    model: liczba karpi na początku każdego następnego roku jest równa liczbie karpi z początku roku poprzedniego
    powiększonej o 20% tej liczby i pomniejszonej o 60 ryb odłowionych w ciągu tego roku. Zapisz wzór
    rekurencyjny ciągu \left( a_{n} \right), którego n-ty wyraz oznacza liczbę karpi na początku n-tego
    roku obserwacji, oblicz a_{3} oraz rozstrzygnij, czy w tym modelu liczba karpi rośnie z roku na rok.
    Odpowiedź uzasadnij.'
  statement_latex: a_{1} = 500,\qquad a_{n+1} = \frac{6}{5}\cdot a_{n} - 60
  solution: |-
    Oznaczmy przez a_{n} liczbę karpi na początku n-tego roku obserwacji. Z warunków zadania a_{1} = 500, a powiększenie o 20% to pomnożenie przez \frac{6}{5}, więc
    a_{n+1} = \frac{6}{5}\cdot a_{n} - 60 dla n \geq 1.
    Obliczamy kolejno:
    a_{2} = \frac{6}{5}\cdot 500 - 60 = 600 - 60 = 540,
    a_{3} = \frac{6}{5}\cdot 540 - 60 = 648 - 60 = 588.
    Monotoniczność: a_{n+1} - a_{n} = \frac{6}{5}\cdot a_{n} - 60 - a_{n} = \frac{1}{5}\cdot a_{n} - 60.
    Różnica jest dodatnia dokładnie wtedy, gdy a_{n} > 300.
    Mamy a_{1} = 500 > 300. Ponadto jeżeli a_{n} > 300, to a_{n+1} = \frac{6}{5}\cdot a_{n} - 60 > \frac{6}{5}\cdot 300 - 60 = 300.
    Zatem a_{n} > 300 dla każdego n \geq 1, więc a_{n+1} - a_{n} = \frac{1}{5}\cdot a_{n} - 60 > 0 dla każdego n.
    Ciąg \left( a_{n} \right) jest rosnący — w tym modelu liczba karpi rośnie z roku na rok.
  solution_steps:
  - 'Wprowadź ciąg: a_{n} — liczba karpi na początku n-tego roku, a_{1} = 500.'
  - 'Zapisz regułę przejścia: wzrost o 20% to mnożenie przez \frac{6}{5}, odłów to odjęcie 60, czyli a_{n+1}
    = \frac{6}{5}\cdot a_{n} - 60.'
  - Oblicz a_{2} = \frac{6}{5}\cdot 500 - 60 = 540.
  - Oblicz a_{3} = \frac{6}{5}\cdot 540 - 60 = 588.
  - Wyznacz różnicę a_{n+1} - a_{n} = \frac{1}{5}\cdot a_{n} - 60.
  - Zauważ, że różnica jest dodatnia dla a_{n} > 300, oraz że a_{1} = 500 > 300 i z a_{n} > 300 wynika
    a_{n+1} > 300.
  - 'Wniosek: różnica jest dodatnia dla każdego n, więc ciąg jest rosnący.'
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_rekurencyjny
      answer:
        kind: SYMBOLIC
        latex: a_{n+1} = \frac{6}{5}\cdot a_{n} - 60
    - name: a_3
