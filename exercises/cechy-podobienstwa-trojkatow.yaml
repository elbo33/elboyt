  statement: 'W trójkącie ABC dane są: |AB| = 9, |BC| = 6 oraz |∡BAC| = 30°. W trójkącie KLM dane są:
    |KL| = 12, |LM| = 8 oraz |∡LKM| = 30°. Bartek stwierdził: „Zachodzi 12/9 = 8/6 = 4/3 i kąty przy wierzchołkach
    A oraz K są równe, więc na mocy cechy bkb trójkąty ABC i KLM są podobne”. Rozstrzygnij, czy rozumowanie
    Bartka jest poprawne, i wyjaśnij dlaczego. Następnie oblicz |KM| przy dodatkowym założeniu, że zamiast
    kątów przy A i K równe są kąty |∡ABC| = |∡KLM| = 30°, a |AC| = 5,4.'
  statement_latex: \frac{\left|KL\right|}{\left|AB\right|}=\frac{\left|LM\right|}{\left|BC\right|}=\frac{4}{3},\qquad
    \left|KM\right|=\frac{4}{3}\cdot 5{,}4
  solution: |-
    BŁĘDNE ROZUMOWANIE: „Dwa boki są proporcjonalne (12/9 = 8/6 = 4/3) i jest jeszcze para równych kątów, więc z cechy bkb trójkąty są podobne”.
    GDZIE JEST BŁĄD: cecha bkb wymaga, aby równe kąty leżały MIĘDZY parami proporcjonalnych boków. Proporcjonalne są boki AB i BC oraz KL i LM, a kątem zawartym między nimi jest kąt przy wierzchołku B (odpowiednio przy L), natomiast dane są kąty przy A i K — leżące naprzeciw boku BC (odpowiednio LM). Taki układ danych („bbk”) nie wyznacza kształtu trójkąta jednoznacznie: mając |AB| = 9, |BC| = 6 i kąt 30° naprzeciw krótszego z tych boków, można zbudować dwa różne, niepodobne trójkąty (jeden z kątem przy C ostrym, drugi z rozwartym). Zatem rozumowanie Bartka jest niepoprawne — trójkąty nie muszą być podobne.
    POPRAWNE ROZUMOWANIE PRZY ZMIENIONYM ZAŁOŻENIU: jeśli równe są kąty |∡ABC| = |∡KLM| = 30°, to leżą one między bokami AB i BC oraz KL i LM, a ponieważ |KL|/|AB| = |LM|/|BC| = 4/3, to z cechy bkb △ABC ∼ △KLM ze skalą k = 4/3.
    Wtedy AC ↔ KM, więc |KM| = (4/3) · 5,4 = 7,2.
  solution_steps:
