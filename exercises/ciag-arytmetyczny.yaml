- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: odczytanie różnicy i monotoniczności z wypisanych wyrazów
  statement: 'Dany jest skończony ciąg arytmetyczny: 13, 9, 5, 1, -3. Wyznacz różnicę r tego ciągu oraz
    rozstrzygnij, czy ten ciąg jest malejący (odpowiedz Tak albo Nie). Zapisz obliczenia.'
  statement_latex: r = 9 - 13
  solution: |-
    Z definicji różnica to następny wyraz minus poprzedni:
    r = a_2 - a_1 = 9 - 13 = -4.
    Kontrola pozostałych par: 5 - 9 = -4, 1 - 5 = -4, -3 - 1 = -4, więc różnica jest stała i r = -4.
    Ponieważ r = -4 < 0, ciąg jest malejący.
    Odpowiedź: r = -4; tak, ciąg jest malejący.
  solution_steps:
  - 'Stosuję definicję: r = a_{n+1} - a_n (następny minus poprzedni).'
  - Obliczam r = 9 - 13 = -4.
  - 'Sprawdzam pozostałe różnice: 5-9 = -4, 1-5 = -4, -3-1 = -4 — wszystkie równe.'
  - Ponieważ r < 0, ciąg jest malejący.
  answer:
    kind: MULTIPART
    parts:
    - name: r
      answer:
        kind: NUMERIC
        value: -4.0
        latex: '-4'
    - name: czy ciąg jest malejący
      answer:
        kind: BOOLEAN
        truth: true
