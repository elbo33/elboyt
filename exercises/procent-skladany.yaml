- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: lokata z kapitalizacją półroczną
  statement: Pani Marta wpłaciła do banku 12000 zł na lokatę dwuletnią, oprocentowaną 6% w skali roku,
    z kapitalizacją półroczną (odsetki dopisywane są do kapitału na koniec każdego półrocza). Oblicz kwotę
    zgromadzoną na lokacie po dwóch latach oraz łączną wartość doliczonych odsetek (bez uwzględniania
    podatków). Wyniki podaj z dokładnością do 1 grosza.
  statement_latex: K=12000\cdot\left(1+\frac{3}{100}\right)^{4}
  solution: |-
    Jednym okresem kapitalizacji jest półrocze, więc stopa okresowa to 6% : 2 = 3%, czyli q = 1,03.
    W dwóch latach są 4 półrocza, zatem n = 4.
    K = 12000·(1,03)^4.
    (1,03)^2 = 1,0609, (1,03)^4 = (1,0609)^2 = 1,12550881.
    K = 12000·1,12550881 = 13506,10572 ≈ 13506,11 zł.
    Odsetki: 13506,11 − 12000 = 1506,11 zł.
    Odpowiedź: na lokacie będzie 13506,11 zł, a doliczone odsetki wyniosą 1506,11 zł.
  solution_steps:
  - 'Ustal długość jednego okresu kapitalizacji: półrocze.'
  - 'Oblicz stopę okresową: 6% : 2 = 3%, czyli q = 1,03.'
  - 'Oblicz liczbę okresów: 2 lata = 4 półrocza, n = 4.'
  - 'Zapisz model: K = 12000·(1,03)^4 i oblicz (1,03)^4 = 1,12550881.'
  - 'Oblicz kapitał: K ≈ 13506,11 zł.'
  - 'Oblicz odsetki: K − 12000 ≈ 1506,11 zł.'
  answer:
    kind: MULTIPART
    parts:
    - name: kapital_po_2_latach
      answer:
        kind: NUMERIC
        value: 13506.11
        tol: 0.01
        latex: 13506{,}11\ \text{zł}
    - name: odsetki
      answer:
        kind: NUMERIC
        value: 1506.11
        tol: 0.01
        latex: 1506{,}11\ \text{zł}
  checks:
  - kind: evaluate
    expr: 12000\cdot\left(1+\frac{3}{100}\right)^{4}
    part: kapital_po_2_latach
  - kind: evaluate
    expr: 12000\cdot\left(1+\frac{3}{100}\right)^{4}-12000
    part: odsetki
