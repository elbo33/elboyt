  - suma kątów trójkąta
  - przejście kąt wpisany → kąt środkowy
  - trójkąt równoramienny z dwóch promieni
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 50.0 vs 50.0 (tol 1e-09)'
- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: od długości cięciw do kątów trójkąta wpisanego
  statement: Punkty A, B, C leżą na okręgu o środku O i promieniu r. Cięciwa AB ma długość r, cięciwa
    BC ma długość r\sqrt{2}, a punkt B leży na krótszym z dwóch łuków wyznaczonych przez punkty A i C.
    Oblicz miary wszystkich kątów trójkąta ABC.
  statement_latex: \left|AB\right| = r, \qquad \left|BC\right| = r\cdot\sqrt{2}, \qquad \left|\angle ABC\right|
    = \frac{360^\circ - 60^\circ - 90^\circ}{2}
  solution: |-
    Najpierw zamieniam długości cięciw na miary łuków (czyli na kąty środkowe).

    Trójkąt AOB ma boki |OA| = |OB| = r oraz |AB| = r, więc jest równoboczny, a zatem |∠AOB| = 60°. Łuk AB niezawierający C ma miarę 60°.

    W trójkącie BOC mamy |OB| = |OC| = r oraz |BC| = r√2. Ponieważ r² + r² = (r√2)², trójkąt BOC jest prostokątny (twierdzenie odwrotne do twierdzenia Pitagorasa) z kątem prostym przy O, więc |∠BOC| = 90°. Łuk BC niezawierający A ma miarę 90°.

    Punkt B leży na krótszym łuku AC, więc łuki AB i BC (te wyznaczone wyżej) leżą po tej samej stronie i tworzą razem łuk AC zawierający B, o mierze 60° + 90° = 150°. Wtedy łuk AC niezawierający B ma miarę 360° − 60° − 90° = 210° (jest to łuk większy — zgodne z warunkiem, bo 150° < 210°).

    Teraz kąty trójkąta:
    |∠ACB| = ½ · 60° = 30° (kąt wpisany oparty na łuku AB niezawierającym C),
    |∠BAC| = ½ · 90° = 45° (kąt wpisany oparty na łuku BC niezawierającym A),
    |∠ABC| = ½ · 210° = 105° (kąt wpisany oparty na łuku AC niezawierającym B — łuku większym!).

    Kontrola: 30° + 45° + 105° = 180°.

    Uwaga: gdyby punkt B nie leżał na krótszym łuku AC, łuk AC miałby miarę 90° − 60° = 30° i kąty trójkąta byłyby inne — warunek o położeniu B jest istotny.
  solution_steps:
  - Z |OA| = |OB| = |AB| = r wynika, że trójkąt AOB jest równoboczny, więc |∠AOB| = 60° (łuk AB ma 60°).
  - Z r² + r² = (r√2)² wynika, że trójkąt BOC jest prostokątny przy O, więc |∠BOC| = 90° (łuk BC ma 90°).
  - B leży na krótszym łuku AC, więc łuk AC zawierający B ma miarę 60° + 90° = 150°, a łuk AC niezawierający
    B ma 360° − 150° = 210°.
  - '|∠ACB| = ½ · 60° = 30°.'
  - '|∠BAC| = ½ · 90° = 45°.'
  - '|∠ABC| = ½ · 210° = 105°; kontrola: 30° + 45° + 105° = 180°.'
