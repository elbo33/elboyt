    objective_latex: R=\left(10\cdot a+b\right)^{2}-\left(10\cdot b+a\right)^{2}=99\cdot\left(a-b\right)\cdot\left(a+b\right)
    goal: value
    constraint_used: a\in\{1,\ldots,9\},\ b\in\{1,\ldots,9\},\ R=4455
  skills:
