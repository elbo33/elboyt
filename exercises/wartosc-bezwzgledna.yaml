- id: g-cm-10
  slot: COMMON_MISTAKE
  ramp_index: 4
  difficulty: 3
  exercise_type: moduł wyrażenia niewymiernego — analiza błędu
  statement: 'Oblicz wartość wyrażenia W = \left|\sqrt{7} - 3\right| + \left|2 - \sqrt{7}\right|. Uczeń
    zapisał: "pierwiastek jest liczbą dodatnią, więc \left|\sqrt{7} - 3\right| = \sqrt{7} - 3 oraz \left|2
    - \sqrt{7}\right| = 2 - \sqrt{7}, zatem W = \sqrt{7} - 3 + 2 - \sqrt{7} = -1". Wyjaśnij błąd i podaj
    poprawny wynik.'
  statement_latex: W = \left|\sqrt{7} - 3\right| + \left|2 - \sqrt{7}\right|
  solution: |-
    Błędne rozumowanie: uczeń opuścił oba moduły bez zmiany znaku i otrzymał W = -1. Już sam wynik ujemny sygnalizuje błąd: suma dwóch modułów nie może być liczbą ujemną.
    Gdzie tkwi błąd: przed opuszczeniem modułu trzeba rozstrzygnąć znak wyrażenia. Porównujemy: \sqrt{7} \approx 2{,}65, bo 2^2 = 4 < 7 < 9 = 3^2, czyli 2 < \sqrt{7} < 3.
    Stąd \sqrt{7} - 3 < 0, więc \left|\sqrt{7} - 3\right| = 3 - \sqrt{7}.
    Oraz 2 - \sqrt{7} < 0, więc \left|2 - \sqrt{7}\right| = \sqrt{7} - 2.
    Poprawne rozwiązanie: W = \left(3 - \sqrt{7}\right) + \left(\sqrt{7} - 2\right) = 3 - \sqrt{7} + \sqrt{7} - 2 = 1.
    Odpowiedź: W = 1.
  solution_steps:
  - Zauważ, że wynik ucznia jest ujemny, co jest niemożliwe dla sumy modułów.
  - 'Porównaj \sqrt{7} z liczbami 2 i 3: z 4 < 7 < 9 wynika 2 < \sqrt{7} < 3.'
  - Stwierdź, że \sqrt{7} - 3 < 0, więc \left|\sqrt{7}-3\right| = 3 - \sqrt{7}.
  - Stwierdź, że 2 - \sqrt{7} < 0, więc \left|2-\sqrt{7}\right| = \sqrt{7} - 2.
  - 'Dodaj: W = \left(3 - \sqrt{7}\right) + \left(\sqrt{7} - 2\right) = 1.'
  answer:
