  exercise_type: 'zadanie odwrotne: z liczby meczów wyznacz liczbę drużyn'
  statement: 'W pewnej lidze każda drużyna rozgrywa z każdą inną drużyną dokładnie dwa mecze: jeden na
    własnym boisku i jeden na boisku przeciwnika. W minionym sezonie rozegrano łącznie 90 meczów. Do ligi
    dołączą teraz 2 nowe drużyny, a zasady rozgrywek pozostaną bez zmian. Oblicz, ile meczów zostanie
    rozegranych w nowym sezonie.'
  statement_latex: n \cdot \left(n-1\right) = 90
  solution: |-
    Liczba drużyn nie jest podana — oznaczmy ją przez n (n jest liczbą naturalną, n ≥ 2).

    Krok 1. Jednym obiektem jest mecz, czyli para uporządkowana (gospodarz, gość) dwóch różnych drużyn — zamiana ról daje inny mecz, bo mecze rozgrywane są na różnych boiskach. Gospodarza można wybrać na n sposobów, gościa na n − 1 sposobów, więc liczba wszystkich meczów w sezonie wynosi n\cdot\left(n-1\right).

    Krok 2. Z warunków zadania n\cdot\left(n-1\right) = 90, czyli n^2 - n - 90 = 0. Wyróżnik: Δ = 1 + 360 = 361, \sqrt{Δ} = 19, stąd n = \frac{1-19}{2} = -9 albo n = \frac{1+19}{2} = 10. Liczba drużyn musi być liczbą naturalną, więc n = -9 odrzucamy: w lidze grało 10 drużyn.
    (Kontrola: 10\cdot 9 = 90 ✓.)

    Krok 3. Po dołączeniu 2 drużyn będzie ich 10 + 2 = 12. Liczba meczów w nowym sezonie:
    12 \cdot 11 = 132.

    Odpowiedź: w nowym sezonie zostanie rozegranych 132 mecze.
  solution_steps:
  - 'Wprowadź niewiadomą: n — liczba drużyn w minionym sezonie.'
  - Ustal, że mecz to para uporządkowana (gospodarz, gość), więc meczów jest n·(n−1) — bez dzielenia przez
    2.
  - 'Ułóż równanie n·(n−1) = 90 i rozwiąż: n² − n − 90 = 0, Δ = 361, n = 10 lub n = −9.'
  - Odrzuć n = −9 (liczba drużyn jest liczbą naturalną); zatem n = 10.
  - Nowa liczba drużyn to 12; liczba meczów wynosi 12·11 = 132.
