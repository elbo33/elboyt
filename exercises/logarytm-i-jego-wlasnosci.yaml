  exercise_type: obliczanie logarytmu z definicji
  statement: Niech \log_{2}64 = c. Zapisz tę równość w postaci potęgowej i oblicz c.
  statement_latex: \log_{2}64 = c
  solution: 'Z definicji logarytmu równość \log_{2}64=c oznacza dokładnie to samo, co 2^{c}=64. Liczbę
    64 zapisujemy jako potęgę dwójki: 64 = 2^{6}. Zatem 2^{c}=2^{6}, a stąd (porównując wykładniki przy
    tej samej podstawie) c = 6. Kontrola znaku: podstawa 2>1 i liczba logarytmowana 64>1, więc wynik musi
    być dodatni — zgadza się.'
  solution_steps:
  - 'Zapisz równoważne równanie potęgowe: 2^{c}=64.'
  - 'Przedstaw 64 jako potęgę dwójki: 64=2^{6}.'
  - 'Porównaj wykładniki: c=6.'
