- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: odczyt z postaci kanonicznej
  statement: Funkcja kwadratowa f jest określona wzorem f(x)=3\left(x-4\right)^{2}-7. Podaj współrzędne
    wierzchołka paraboli, która jest wykresem funkcji f, oraz zbiór wartości funkcji f.
  statement_latex: f(x)=3\left(x-4\right)^{2}-7
  solution: |-
    Wzór jest zapisany w postaci kanonicznej f(x)=a\left(x-p\right)^{2}+q. Porównujemy: a=3, p=4, q=-7, zatem wierzchołkiem jest punkt W=(4,\,-7).
    Ponieważ a=3>0, ramiona paraboli są skierowane w górę, więc funkcja przyjmuje wartość najmniejszą równą q=-7 (w wierzchołku).
    Zbiór wartości: ZW=\langle -7,\,+\infty).
  solution_steps:
  - Rozpoznaj postać kanoniczną f(x)=a(x-p)^2+q.
  - Odczytaj a=3, p=4, q=-7, czyli W=(4,-7).
  - Ponieważ a>0, ramiona skierowane w górę, wartość najmniejsza to q=-7.
  - Zapisz ZW=\langle -7,+\infty).
  answer:
    kind: MULTIPART
    parts:
    - name: wierzcholek
      answer:
        kind: TUPLE
        items:
        - '4'
        - '-7'
    - name: zbior_wartosci
      answer:
        kind: INTERVAL
        lo: '-7'
        hi: \infty
        lo_open: false
  skills:
  - odczytywanie p i q z postaci kanonicznej
  - zbiór wartości funkcji kwadratowej
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: odczyt z postaci iloczynowej
  statement: Funkcja kwadratowa f jest określona wzorem f(x)=-2\left(x+3\right)\left(x-1\right). Podaj
    miejsca zerowe funkcji f oraz pierwszą współrzędną p wierzchołka paraboli będącej wykresem funkcji
    f.
  statement_latex: f(x)=-2\left(x+3\right)\left(x-1\right)
  solution: |-
    Iloczyn jest równy zeru, gdy któryś z czynników jest równy zeru: x+3=0 lub x-1=0, czyli x=-3 lub x=1. Miejsca zerowe to -3 oraz 1.
    Oś symetrii przechodzi w połowie odległości między miejscami zerowymi: p=\frac{-3+1}{2}=-1.
    Sprawdzenie: f(-3)=-2\cdot 0\cdot(-4)=0 oraz f(1)=-2\cdot 4\cdot 0=0.
  solution_steps:
  - 'Przyrównaj każdy nawias do zera: x+3=0 oraz x-1=0.'
  - Odczytaj miejsca zerowe x_1=-3, x_2=1.
  - Oblicz p=\frac{x_1+x_2}{2}=\frac{-3+1}{2}=-1.
  answer:
    kind: MULTIPART
    parts:
    - name: miejsca_zerowe
      answer:
        kind: SET
        members:
        - '-3'
        - '1'
    - name: p
      answer:
        kind: NUMERIC
        value: -1.0
  checks:
  - kind: evaluate
    expr: \frac{-3+1}{2}
    part: p
  skills:
  - odczytywanie miejsc zerowych z postaci iloczynowej
  - oś symetrii z miejsc zerowych
  verification:
    checkability: REFERENCE_CALL
    note: '2 parts matched · det: [p] SymPy solved it fresh: -1.0 vs -1.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: obliczenie wyróżnika
  statement: Funkcja kwadratowa f jest określona wzorem f(x)=x^{2}-6x+5. Oblicz wyróżnik \Delta trójmianu
    kwadratowego f oraz podaj liczbę punktów wspólnych wykresu funkcji f z osią Ox.
  statement_latex: f(x)=x^{2}-6x+5,\qquad \Delta=b^{2}-4\cdot a\cdot c
  solution: |-
    Odczytujemy współczynniki: a=1, b=-6, c=5.
    \Delta=\left(-6\right)^{2}-4\cdot 1\cdot 5=36-20=16.
    Ponieważ \Delta=16>0, trójmian ma dwa miejsca zerowe, więc parabola przecina oś Ox w dwóch punktach.
  solution_steps:
  - Odczytaj a=1, b=-6, c=5.
  - Podstaw do wzoru \Delta=b^2-4ac.
  - Oblicz \Delta=36-20=16.
  - Z \Delta>0 wynika, że są dwa punkty wspólne z osią Ox.
  answer:
    kind: MULTIPART
    parts:
    - name: delta
      answer:
        kind: NUMERIC
        value: 16.0
    - name: liczba_punktow_wspolnych_z_Ox
      answer:
        kind: NUMERIC
        value: 2.0
  checks:
  - kind: evaluate
    expr: \left(-6\right)^{2}-4\cdot 1\cdot 5
    part: delta
  skills:
  - obliczanie delty
  - wnioskowanie o liczbie miejsc zerowych
  verification:
    checkability: REFERENCE_CALL
    note: '2 parts matched · det: [delta] SymPy solved it fresh: 16.0 vs 16.0 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: zamiana postaci ogólnej na kanoniczną
  statement: Funkcja kwadratowa f jest określona wzorem f(x)=x^{2}+6x+5. Zapisz wzór funkcji f w postaci
    kanonicznej, podaj współrzędne wierzchołka paraboli będącej wykresem funkcji f oraz zbiór wartości
    funkcji f. Zapisz obliczenia.
  statement_latex: f(x)=x^{2}+6x+5
  solution: |-
    Współczynniki: a=1, b=6, c=5.
    p=\frac{-b}{2\cdot a}=\frac{-6}{2\cdot 1}=-3,\qquad q=f(-3)=\left(-3\right)^{2}+6\cdot\left(-3\right)+5=9-18+5=-4.
    Zatem W=(-3,\,-4), a postać kanoniczna to f(x)=\left(x+3\right)^{2}-4.
    Kontrola: \left(x+3\right)^{2}-4=x^{2}+6x+9-4=x^{2}+6x+5 ✔
    Ponieważ a=1>0, ramiona są skierowane w górę i wartość najmniejsza wynosi q=-4, więc ZW=\langle -4,\,+\infty).
  solution_steps:
  - Odczytaj a=1, b=6, c=5.
  - Oblicz p=\frac{-6}{2\cdot 1}=-3.
  - Oblicz q=f(-3)=9-18+5=-4.
  - Zapisz f(x)=\left(x+3\right)^{2}-4 i sprawdź przez wymnożenie.
  - Z a>0 odczytaj ZW=\langle -4,+\infty).
  answer:
    kind: MULTIPART
    parts:
    - name: postac_kanoniczna
      answer:
        kind: SYMBOLIC
        latex: \left(x+3\right)^{2}-4
    - name: wierzcholek
      answer:
        kind: TUPLE
        items:
        - '-3'
        - '-4'
    - name: zbior_wartosci
      answer:
        kind: INTERVAL
        lo: '-4'
        hi: \infty
        lo_open: false
  checks:
  - kind: simplify
    expr: x^{2}+6x+5
    part: postac_kanoniczna
  skills:
  - obliczanie współrzędnych wierzchołka
