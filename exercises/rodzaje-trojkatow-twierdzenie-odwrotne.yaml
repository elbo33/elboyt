- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'zadanie modelowe: wzór i dziedzina, następnie warunek prostokątności'
  statement: |-
    Z kawałka drutu o długości 60 cm wygięto model trójkąta równoramiennego, zużywając cały drut (drut tworzy trzy boki trójkąta). Ramię tego trójkąta ma długość x cm.
    a) Zapisz długość podstawy trójkąta jako wyrażenie zależne od x oraz wyznacz zbiór wszystkich wartości x, dla których taki trójkąt istnieje.
    b) Wyznacz tę wartość x, dla której otrzymany trójkąt jest prostokątny, i sprawdź, czy należy ona do zbioru wyznaczonego w punkcie a).
  statement_latex: x^2 + x^2 = \left(60 - 2 \cdot x\right)^2
  solution: |-
    a) Trójkąt równoramienny ma dwa ramiona długości x, więc na podstawę zostaje
    p\left(x\right) = 60 - 2 \cdot x (w centymetrach).
    Warunki: x > 0 oraz 60 - 2x > 0, czyli x < 30. Ponadto musi być spełniona nierówność trójkąta dla najdłuższego z boków. Gdy podstawa jest najdłuższa, potrzeba x + x > 60 - 2x, czyli 4x > 60, a więc x > 15; gdy najdłuższe jest ramię, druga nierówność x + \left(60 - 2x\right) > x zachodzi automatycznie dla x < 30.
    Zatem trójkąt istnieje dokładnie dla x \in \left(15,\ 30\right).

    b) Kąt prosty nie może leżeć naprzeciw ramienia: gdyby ramię było przeciwprostokątną, mielibyśmy x^2 = x^2 + \left(60 - 2x\right)^2, czyli \left(60 - 2x\right)^2 = 0, co daje x = 30 — wartość odrzucona (brak podstawy). Zatem przeciwprostokątną musi być podstawa i
    x^2 + x^2 = \left(60 - 2 \cdot x\right)^2,
    2x^2 = \left(60 - 2x\right)^2.
    Dla x \in \left(15,\ 30\right) obie strony są dodatnie i 60 - 2x > 0, więc pierwiastkujemy:
    x\sqrt{2} = 60 - 2x,
    x\left(\sqrt{2} + 2\right) = 60,
    x = \frac{60}{2 + \sqrt{2}} = \frac{60\left(2 - \sqrt{2}\right)}{\left(2 + \sqrt{2}\right)\left(2 - \sqrt{2}\right)} = \frac{60\left(2 - \sqrt{2}\right)}{2} = 60 - 30\sqrt{2}.
    Sprawdzenie zgodności z dziedziną: 30\sqrt{2} \approx 42{,}43, więc x \approx 17{,}57 i rzeczywiście 15 < x < 30 ✔. Podstawa ma wtedy długość 60 - 2x = 60\sqrt{2} - 60 \approx 24{,}85 cm i jest najdłuższym bokiem, co potwierdza, że to ona jest przeciwprostokątną.

    Odpowiedź: podstawa ma długość 60 - 2x, trójkąt istnieje dla x \in \left(15,\ 30\right), a jest prostokątny dla x = 60 - 30\sqrt{2} \approx 17{,}57 cm.
  solution_steps:
  - 'Z obwodu 60 wyznacz podstawę: 60 - x - x = 60 - 2 \cdot x.'
  - 'Zapisz warunki dodatniości: x > 0 i 60 - 2x > 0, czyli x < 30.'
  - 'Zapisz nierówność trójkąta x + x > 60 - 2x, stąd x > 15; dziedzina: x \in \left(15,\ 30\right).'
  - Uzasadnij, że przeciwprostokątną może być tylko podstawa, i zapisz równanie x^2 + x^2 = \left(60 -
    2x\right)^2.
  - Pierwiastkując (obie strony dodatnie) otrzymaj x\sqrt{2} = 60 - 2x, czyli x = \frac{60}{2 + \sqrt{2}}
    = 60 - 30\sqrt{2}.
  - Sprawdź, że 60 - 30\sqrt{2} \approx 17{,}57 należy do przedziału \left(15,\ 30\right).
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_podstawy
      answer:
        kind: SYMBOLIC
        latex: 60 - 2 \cdot x
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '15'
        hi: '30'
    - name: x_prostokatny
      answer:
        kind: NUMERIC
        value: 17.57359312880715
        tol: 1.0e-06
  checks:
  - kind: simplify
    expr: 60 - x - x
    part: wzor_podstawy
  - kind: solve_inequality
    expr: \left(x - 15\right) \cdot \left(30 - x\right) > 0
    part: dziedzina
  - kind: evaluate
    expr: \frac{60}{2 + \sqrt{2}}
    part: x_prostokatny
