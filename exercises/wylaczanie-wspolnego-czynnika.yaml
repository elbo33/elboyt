  exercise_type: modelowanie geometryczne + równanie rozwiązywane przez wyłączenie czynnika
  statement: Dłuższy bok pewnego prostokąta jest trzy razy dłuższy od jego boku krótszego. Pole tego prostokąta,
    wyrażone w centymetrach kwadratowych, jest liczbowo równe potrojonemu obwodowi tego prostokąta, wyrażonemu
    w centymetrach. Oblicz długość krótszego boku oraz pole tego prostokąta.
  statement_latex: 3\cdot x^{2}=3\cdot\left(2\cdot x+2\cdot 3\cdot x\right)
  solution: |-
    Oznaczmy przez x długość krótszego boku prostokąta (w centymetrach), przy czym x>0. Wtedy dłuższy bok ma długość 3x.
    Pole prostokąta: P=x\cdot 3x=3x^{2}.
    Obwód prostokąta: L=2\cdot\left(x+3x\right)=8x, więc potrojony obwód to 3\cdot 8x=24x.
    Z warunku zadania: 3x^{2}=24x.
    Przenosimy wszystko na jedną stronę i wyłączamy wspólny czynnik (nie wolno dzielić przez x, bo x jest niewiadomą):
    3x^{2}-24x=0,\qquad 3x\left(x-8\right)=0.
    Stąd 3x=0 lub x-8=0, czyli x=0 albo x=8. Wartość x=0 odrzucamy, bo bok prostokąta ma długość dodatnią.
    Zatem krótszy bok ma długość 8 cm, dłuższy 3\cdot 8=24 cm, a pole wynosi P=8\cdot 24=192 cm^{2}.
    Sprawdzenie: obwód L=2\cdot\left(8+24\right)=64, a 3\cdot 64=192=P. ✓
  solution_steps:
  - 'Wprowadź zmienną: x — długość krótszego boku (x > 0), dłuższy bok ma długość 3x.'
  - Zapisz pole P = 3x^2 oraz obwód L = 8x, a więc potrojony obwód 24x.
  - Ułóż równanie 3x^2 = 24x wynikające z warunku zadania.
  - 'Przenieś wszystko na jedną stronę i wyłącz wspólny czynnik: 3x(x-8)=0.'
  - Z równania iloczynowego x = 0 lub x = 8; odrzuć x = 0 jako sprzeczne z warunkami zadania.
  - 'Oblicz pole: P = 8·24 = 192 cm^2.'
