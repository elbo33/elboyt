- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: wyznaczanie wartości wyrażenia logarytmicznego z warunków na liczby
  statement: Liczby dodatnie \(x\) oraz \(y\) spełniają jednocześnie warunki \( x\cdot y = 10^{5} \) oraz
    \( \frac{x}{y} = 10 \). Oblicz wartość wyrażenia \( \log x + 2\cdot\log y \) (logarytmy dziesiętne).
  statement_latex: x\cdot y = 10^{5}, \quad \frac{x}{y} = 10, \quad \log x + 2\cdot\log y = ?
  solution: |-
    Oba warunki logarytmujemy (logarytm dziesiętny), oznaczając \(p = \log x\) oraz \(q = \log y\).
    Z pierwszego warunku: \(\log\left(x\cdot y\right) = \log 10^{5}\), czyli \(\log x + \log y = 5\), zatem \(p + q = 5\).
    Z drugiego warunku: \(\log\frac{x}{y} = \log 10\), czyli \(\log x - \log y = 1\), zatem \(p - q = 1\).
    Dodając równania stronami: \(2p = 6\), więc \(p = 3\), a stąd \(q = 2\).
    Szukane wyrażenie: \(\log x + 2\cdot\log y = p + 2q = 3 + 2\cdot 2 = 7\).
    Sprawdzenie: \(p = 3\) i \(q = 2\) oznacza \(x = 1000\), \(y = 100\); istotnie \(x\cdot y = 10^{5}\) i \(\frac{x}{y} = 10\).
  solution_steps:
  - Oznacz p = log x, q = log y.
  - 'Zlogarytmuj warunek x·y = 10^5: p + q = 5 (logarytm iloczynu).'
  - 'Zlogarytmuj warunek x/y = 10: p − q = 1 (logarytm ilorazu).'
  - 'Rozwiąż układ: p = 3, q = 2.'
  - Oblicz p + 2q = 3 + 4 = 7.
  answer:
    kind: NUMERIC
    value: 7.0
    latex: '7'
  checks:
  - kind: evaluate
    expr: \log_{10}1000 + 2\cdot\log_{10}100
  skills:
  - logarytmowanie warunków
  - logarytm iloczynu i ilorazu
  - układ równań liniowych
  - składanie szukanego wyrażenia
  verification:
    checkability: REFERENCE_CALL
    note: 7.0 vs 7.0 (tol 1e-09)
- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: modelowanie równaniem logarytmicznym z warunkiem dodatniości
  statement: Dwie liczby dodatnie różnią się o 24. Logarytm o podstawie 3 z iloczynu tych liczb jest równy
    4. Wyznacz obie te liczby oraz oblicz różnicę logarytmu o podstawie 3 z liczby większej i logarytmu
    o podstawie 3 z liczby mniejszej.
  statement_latex: \log_{3}\left(x\cdot\left(x+24\right)\right) = 4, \quad x > 0
  solution: |-
    Oznaczmy przez \(x\) mniejszą z liczb; wtedy większa jest równa \(x + 24\), przy czym z warunków zadania \(x > 0\).
    Warunek zapisujemy równaniem: \(\log_{3}\left(x\cdot\left(x+24\right)\right) = 4\), więc z definicji logarytmu \(x\cdot\left(x+24\right) = 3^{4} = 81\).
    Stąd \(x^{2} + 24x - 81 = 0\). Wyróżnik: \(\Delta = 24^{2} + 4\cdot 81 = 576 + 324 = 900\), \(\sqrt{\Delta} = 30\).
    Pierwiastki: \(x = \frac{-24 - 30}{2} = -27\) lub \(x = \frac{-24 + 30}{2} = 3\).
    Warunek \(x > 0\) odrzuca \(x = -27\), więc mniejsza liczba to \(3\), a większa \(3 + 24 = 27\).
    Różnica logarytmów: \(\log_{3}27 - \log_{3}3 = \log_{3}\frac{27}{3} = \log_{3}9 = 2\).
    Sprawdzenie: \(3\cdot 27 = 81\) i \(\log_{3}81 = 4\) — zgadza się.
  solution_steps:
  - 'Wprowadź zmienną: mniejsza liczba x > 0, większa x + 24.'
  - 'Zapisz warunek: log_3(x(x+24)) = 4, czyli x(x+24) = 3^4 = 81.'
  - 'Rozwiąż x² + 24x − 81 = 0: Δ = 900, x = 3 lub x = −27.'
  - Odrzuć x = −27 (liczby mają być dodatnie); liczby to 3 i 27.
  - Oblicz log_3 27 − log_3 3 = log_3 9 = 2.
  answer:
    kind: MULTIPART
    parts:
    - name: liczba_mniejsza
      answer:
        kind: NUMERIC
        value: 3.0
        latex: '3'
    - name: liczba_wieksza
      answer:
        kind: NUMERIC
        value: 27.0
        latex: '27'
    - name: roznica_logarytmow
      answer:
        kind: NUMERIC
        value: 2.0
        latex: '2'
  checks:
  - kind: evaluate
    expr: \frac{-24 + \sqrt{24^{2} + 4\cdot 81}}{2}
    part: liczba_mniejsza
  - kind: evaluate
    expr: \frac{-24 + \sqrt{24^{2} + 4\cdot 81}}{2} + 24
    part: liczba_wieksza
  - kind: evaluate
    expr: \log_{3}27 - \log_{3}3
    part: roznica_logarytmow
  stated_model:
    variable: x
    objective_latex: x\cdot\left(x+24\right) = 81
    domain_lo: '0'
    goal: value
    constraint_used: x>0,\ \text{druga liczba} = x+24
  skills:
  - wprowadzenie zmiennej
  - definicja logarytmu
  - równanie kwadratowe
  - odrzucanie rozwiązania sprzecznego z warunkiem zadania
  - logarytm ilorazu
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''x'': ''x\\cdot\\left(x+24\\right)
      = 81'') — human review'
- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie: logarytm jako działanie odwrotne do potęgowania (wzór + dziedzina + obliczenie)'
  statement: W hodowli laboratoryjnej liczba bakterii podwaja się co 20 minut. W chwili rozpoczęcia obserwacji
    w hodowli było 400 bakterii. Hodowlę prowadzi się w naczyniu, w którym może się znaleźć co najwyżej
    60000 bakterii. a) Wyznacz wzór, z którego można obliczyć czas \(t\) (w minutach, liczony od chwili
    rozpoczęcia obserwacji) potrzebny do tego, by liczba bakterii w hodowli wzrosła do \(n\), oraz podaj
    zbiór tych wartości \(n\), dla których wzór ten opisuje hodowlę prowadzoną w tym naczyniu. b) Oblicz,
    po ilu minutach od rozpoczęcia obserwacji w hodowli będzie 51000 bakterii — a jeśli taka liczba w
    tym naczyniu wystąpić nie może, wyjaśnij dlaczego; następnie oblicz, po ilu minutach w hodowli będzie
    51200 bakterii, i rozstrzygnij, czy naczynie pomieści tę liczbę bakterii.
  statement_latex: n\left(t\right) = 400\cdot 2^{\frac{t}{20}}, \qquad t = 20\cdot\log_{2}\frac{n}{400}
  solution: |-
    a) Po każdych 20 minutach liczba bakterii mnoży się przez 2, więc po czasie \(t\) minut liczba bakterii wynosi \(n = 400\cdot 2^{\frac{t}{20}}\).
    Odwracamy tę zależność: \(2^{\frac{t}{20}} = \frac{n}{400}\), a z definicji logarytmu \(\frac{t}{20} = \log_{2}\frac{n}{400}\), czyli
    \(t = 20\cdot\log_{2}\frac{n}{400}\).
    Wzór ma sens dla \(n > 0\), ale opisuje hodowlę od chwili rozpoczęcia obserwacji (czyli \(t \ge 0\), stąd \(n \ge 400\)) i tylko dopóki bakterie mieszczą się w naczyniu (\(n \le 60000\)). Zatem \(n \in \left[400;\ 60000\right]\).
    b) Dla \(n = 51200\) mamy \(\frac{n}{400} = 128 = 2^{7}\), więc \(t = 20\cdot\log_{2}2^{7} = 20\cdot 7 = 140\) minut.
    Sprawdzenie pojemności: \(51200 \le 60000\), więc naczynie pomieści tę liczbę bakterii (a więc wynik 140 minut jest zgodny z modelem).
    Uwaga do liczby 51000: \(\frac{51000}{400} = 127{,}5\) nie jest potęgą dwójki, więc czas \(t = 20\cdot\log_{2}127{,}5\) nie jest liczbą wymierną możliwą do wyznaczenia bez tablic — sam stan 51000 bakterii jest jednak w tym naczyniu dopuszczalny, bo \(51000 \le 60000\); liczba, dla której rachunek jest dokładny, to 51200.
  solution_steps:
  - 'Zbuduj model wzrostu: po t minutach liczba bakterii to n = 400·2^{t/20}.'
  - 'Odwróć zależność logarytmem: t/20 = log_2 (n/400), czyli t = 20·log_2 (n/400).'
  - 'Ustal zbiór wartości n: t ≥ 0 daje n ≥ 400, pojemność naczynia daje n ≤ 60000, więc n ∈ [400; 60000].'
  - 'Podstaw n = 51200: 51200/400 = 128 = 2^7, więc t = 20·7 = 140 minut.'
  - 'Sprawdź warunek brzegowy: 51200 ≤ 60000, więc naczynie pomieści tę liczbę bakterii.'
  answer:
    kind: MULTIPART
    parts:
    - name: wzor
      answer:
        kind: SYMBOLIC
        latex: t = 20\cdot\log_{2}\frac{n}{400}
    - name: dziedzina
      answer:
        kind: INTERVAL
        latex: \left[400;\ 60000\right]
        lo: '400'
        hi: '60000'
        lo_open: false
        hi_open: false
    - name: czas_dla_51200
      answer:
        kind: NUMERIC
        value: 140.0
        latex: '140'
    - name: czy_naczynie_pomiesci
      answer:
        kind: BOOLEAN
        truth: true
    - name: komentarz_do_51000
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: 'Uczeń ma wyjaśnić, że 51000 : 400 = 127,5 nie jest potęgą dwójki, więc czasu t = 20·log_2
          127,5 nie da się podać dokładnie bez tablic, choć sama liczba 51000 mieści się w naczyniu (51000
          ≤ 60000).'
  checks:
  - kind: evaluate
    expr: 20\cdot\log_{2}\left(\frac{51200}{400}\right)
    var: n
    part: czas_dla_51200
  stated_model:
    variable: n
    objective_latex: t\left(n\right) = 20\cdot\log_{2}\frac{n}{400}
    domain_lo: '400'
    domain_hi: '60000'
    domain_lo_open: false
    domain_hi_open: false
    goal: value
    constraint_used: n = 400\cdot 2^{\frac{t}{20}},\ n\le 60000
  skills:
  - budowanie modelu wykładniczego
  - odwracanie zależności logarytmem
  - wyznaczanie dziedziny wzoru
  - obliczanie logarytmu z definicji
  - sprawdzanie warunku brzegowego
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''n'': ''t\\left(n\\right)
      = 20\\cdot\\log_{2}\\frac{n}{400}'') — human review'
