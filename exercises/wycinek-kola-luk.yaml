- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: zadanie odwrotne z filtrowaniem pierwiastka
  statement: Z drutu o długości 20 cm wygięto — bez odpadu i bez zakładek — cały brzeg pewnego wycinka
    koła, czyli dwa promienie i łuk. Pole tego wycinka jest równe 16 \text{ cm}^2. Wyznacz promień koła
    oraz długość łuku tego wycinka. Uzasadnij, że drugie rozwiązanie otrzymanego równania nie opisuje
    żadnego wycinka koła.
  statement_latex: \begin{cases}2\cdot r+l=20\\ \frac{1}{2}\cdot l\cdot r=16\end{cases}
  solution: |-
    Oznaczmy przez r promień, a przez l długość łuku (zmiennych nie ma w treści).
    Brzeg wycinka: 2r+l=20, więc l=20-2r, przy czym r>0 i l>0, czyli r\in\left(0;10\right).
    Pole wycinka wygodnie liczymy wzorem P_w=\frac{1}{2}\cdot l\cdot r:
    \frac{1}{2}\cdot\left(20-2r\right)\cdot r=16\quad\Rightarrow\quad 10r-r^{2}=16\quad\Rightarrow\quad r^{2}-10r+16=0.
    \Delta=100-64=36,\ \sqrt{\Delta}=6, stąd r_1=\frac{10-6}{2}=2 lub r_2=\frac{10+6}{2}=8.
    Sprawdzamy warunek istnienia wycinka: łuk nie może być dłuższy niż cały okrąg, czyli l\le 2\pi r.
    Dla r=2 mamy l=20-2\cdot 2=16, a 2\pi\cdot 2=4\pi\approx 12{,}57<16 — łuk byłby dłuższy od całego okręgu (kąt środkowy przekroczyłby 360^\circ), więc taki wycinek nie istnieje. Odrzucamy r=2.
    Dla r=8 mamy l=20-2\cdot 8=4, a 2\pi\cdot 8=16\pi\approx 50{,}3>4 ✓.
    Odpowiedź: r=8 cm, l=4 cm (kąt środkowy: \alpha=\frac{4}{16\pi}\cdot 360^\circ=\frac{90^\circ}{\pi}\approx 28{,}6^\circ).
    Kontrola pola: \frac{1}{2}\cdot 4\cdot 8=16 ✓.
  solution_steps:
  - 'Wprowadź oznaczenia: r — promień, l — długość łuku.'
  - Z warunku o drucie zapisz 2r + l = 20, czyli l = 20 − 2r, gdzie 0 < r < 10.
  - 'Zapisz pole wzorem P = ½·l·r i podstaw: ½·(20 − 2r)·r = 16.'
  - 'Doprowadź do równania r² − 10r + 16 = 0 i rozwiąż: r = 2 lub r = 8.'
  - 'Sprawdź warunek l ≤ 2πr: dla r = 2 jest l = 16 > 4π, więc ten przypadek odrzucamy.'
  - Dla r = 8 otrzymujemy l = 4 i warunek jest spełniony; podaj odpowiedź.
  answer:
    kind: MULTIPART
    parts:
    - name: promien
      answer:
        kind: NUMERIC
        value: 8.0
    - name: dlugosc_luku
      answer:
        kind: NUMERIC
        value: 4.0
    - name: uzasadnienie_odrzucenia
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy wykazać, że dla r = 2 długość łuku l = 16 przekracza obwód całego okręgu 2π·2 =
          4π ≈ 12,57, więc kąt środkowy musiałby być większy od 360° — taki wycinek nie istnieje i rozwiązanie
          r = 2 odrzucamy.
  checks:
  - kind: evaluate
    expr: \frac{10+\sqrt{10^{2}-4\cdot 16}}{2}
    var: r
    part: promien
  - kind: evaluate
    expr: 20-2\cdot 8
    var: r
    part: dlugosc_luku
