  statement: 'Ciąg \left(a_{n}\right) jest określony wzorem a_{n}=n^{2}-3\cdot n dla każdej liczby naturalnej
    n\geq 1. Uczeń napisał: „skoro a_{n}=n^{2}-3\cdot n, to następny wyraz jest o 1 większy, czyli a_{n+1}=n^{2}-3\cdot
    n+1”. Wyjaśnij błąd i wyznacz poprawny wzór na a_{n+1} w postaci uporządkowanej.'
  statement_latex: a_{n}=n^{2}-3\cdot n,\qquad a_{n+1}=?
  solution: |-
    Błędne rozumowanie: uczeń dodaje 1 do wartości wyrazu, przyjmując a_{n+1}=a_{n}+1=n^{2}-3\cdot n+1. Sprawdźmy to liczbowo dla n=4: a_{4}=16-12=4, więc według ucznia a_{5}=5. Tymczasem a_{5}=25-15=10 — odpowiedź ucznia jest fałszywa.
    Dlaczego to błąd: indeks n+1 jest ARGUMENTEM funkcji, a nie liczbą dodawaną do wartości. a_{n+1}=f\left(n+1\right), czyli w miejsce KAŻDEGO n wstawiamy \left(n+1\right) w nawiasie.
    Poprawne rozwiązanie:
    a_{n+1}=\left(n+1\right)^{2}-3\cdot\left(n+1\right)=n^{2}+2n+1-3n-3=n^{2}-n-2.
    Kontrola dla n=4: 16-4-2=10=a_{5}. ✓
    Odpowiedź: a_{n+1}=n^{2}-n-2.
