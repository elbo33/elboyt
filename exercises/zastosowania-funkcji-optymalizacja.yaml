- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: 'błąd: podanie p zamiast q'
  statement: 'Rozważamy wszystkie prostokąty o obwodzie równym 52 cm. Oblicz największe możliwe pole takiego
    prostokąta. Uczeń zapisał: „Niech x będzie bokiem prostokąta, wtedy drugi bok ma długość 26-x, a pole
    to P\left(x\right)=x\cdot\left(26-x\right)=-x^{2}+26x. Wierzchołek: p=13, więc największe pole wynosi
    13 cm²”. Wskaż błąd w tym rozumowaniu i podaj poprawny wynik. Zapisz obliczenia.'
  statement_latex: P\left(x\right)=x\cdot\left(26-x\right)=-x^{2}+26x
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń poprawnie zbudował model P(x)=-x^{2}+26x i poprawnie obliczył p=-\frac{26}{2\cdot(-1)}=13, ale jako odpowiedź podał liczbę 13 jako pole. Otrzymał więc błędny wynik: 13 cm².
    DLACZEGO TO BŁĄD: p to ARGUMENT, dla którego funkcja przyjmuje wartość największą – tutaj jest to długość boku (w centymetrach), a nie pole. Wartość największa to druga współrzędna wierzchołka q=P(p). Uczeń pomylił oś poziomą (bok) z osią pionową (pole); świadczy o tym też jednostka: 13 cm to długość, a pole musi wyjść w cm².
    POPRAWNIE: dziedzina to x \in (0,26) (oba boki dodatnie), a=-1<0, więc maksimum jest w wierzchołku.
    p=-\frac{26}{2\cdot(-1)}=13 \in (0,26) – to długość boku.
    q=P(13)=13\cdot(26-13)=13\cdot 13=169.
    Odpowiedź: największe pole ma kwadrat o boku 13 cm i wynosi ono 169 cm².
  solution_steps:
  - 'Odtwórz błędne rozumowanie: obliczono p=13 i podano 13 jako pole.'
  - 'Wskaż błąd: p jest argumentem (długością boku), a wartość największa to q=P(p).'
  - 'Sprawdź jednostki: bok w cm, pole w cm² – 13 cm nie może być polem.'
  - 'Podstaw p do wzoru: q=P(13)=13\cdot 13=169.'
  - 'Podaj poprawną odpowiedź: 169 cm² (dla kwadratu o boku 13 cm).'
  answer:
    kind: NUMERIC
    value: 169.0
  checks:
  - kind: evaluate
    expr: 13\cdot\left(26-13\right)
