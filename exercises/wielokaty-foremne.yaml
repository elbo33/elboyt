  exercise_type: kąty wielokąta foremnego
  statement: Dany jest dziewięciokąt foremny. Oblicz miarę kąta środkowego opartego na jednym boku tego
    wielokąta oraz miarę jego kąta wewnętrznego.
  statement_latex: n=9,\qquad \beta=\frac{360^\circ}{9},\qquad \alpha=\frac{\left(9-2\right)\cdot 180^\circ}{9}
  solution: |-
    Liczba boków wynosi n = 9.
    Kąt środkowy: promienie poprowadzone ze środka O do wszystkich wierzchołków dzielą kąt pełny na 9 równych części, więc
    β = 360°/9 = 40°.
    Kąt wewnętrzny: α = (9 − 2)·180°/9 = 1260°/9 = 140° (kontrola: α = 180° − β = 180° − 40° = 140°). ✓
    Odpowiedź: kąt środkowy ma 40°, kąt wewnętrzny 140°.
  solution_steps:
  - 'Zapisz liczbę boków: n = 9.'
  - 'Oblicz kąt środkowy: β = 360°/9 = 40°.'
  - 'Oblicz kąt wewnętrzny: α = (9−2)·180°/9 = 140°.'
  - 'Sprawdź: α = 180° − β = 140°. ✓'
