- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: wysokość figury wyrażona przez sinus
  statement: Ramię trapezu ma długość 10 i tworzy z dłuższą podstawą kąt o mierze 60°. Oblicz wysokość
    tego trapezu. Wynik podaj w postaci dokładnej.
  statement_latex: h=10\cdot\sin 60^\circ
  solution: |-
    Z końca ramienia opuszczamy prostopadłą na dłuższą podstawę — powstaje trójkąt prostokątny, w którym ramię (długości 10) jest przeciwprostokątną, a wysokość h leży NAPRZECIW kąta 60°.
    Bok naprzeciw i przeciwprostokątna → sinus:
    \[\sin 60^\circ=\frac{h}{10}\ \Rightarrow\ h=10\cdot\frac{\sqrt3}{2}=5\sqrt3 .\]
    Kontrola: \(5\sqrt3\approx 8{,}66<10\) — wysokość jest krótsza od ramienia. ✓
  solution_steps:
  - Dorysuj wysokość z końca ramienia na dłuższą podstawę — powstaje trójkąt prostokątny.
  - Zauważ, że wysokość leży naprzeciw kąta 60°, a ramię jest przeciwprostokątną.
  - Zapisz sin 60° = h/10.
  - Wyznacz h = 10·(√3/2) = 5√3.
  answer:
    kind: SYMBOLIC
    latex: 5\sqrt{3}
  checks:
  - kind: evaluate
    expr: 10\cdot\frac{\sqrt{3}}{2}
  skills:
  - h = c·sin α
  - trójkąt pomocniczy w trapezie
  verification:
