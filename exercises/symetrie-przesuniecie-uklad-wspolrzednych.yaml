- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: wektor przesunięcia z pary punkt-obraz
  statement: Pewne przesunięcie przeprowadza punkt A = (-5, 2) na punkt A' = (1, -4). Wyznacz współrzędne
    wektora \vec{u} tego przesunięcia oraz jego długość.
  statement_latex: \vec{u}=\vec{AA'}=\left[1-\left(-5\right),\;-4-2\right],\qquad \left|\vec{u}\right|=\sqrt{a^2+b^2}
  solution: |-
    Współrzędne wektora liczymy jako 'koniec minus początek':
    \vec{u} = \vec{AA'} = [1 - (-5), -4 - 2] = [6, -6].
    Długość wektora: |\vec{u}| = \sqrt{6^2 + (-6)^2} = \sqrt{36 + 36} = \sqrt{72} = 6\sqrt{2}.
    Kontrola: (-5 + 6, 2 - 6) = (1, -4) = A' — zgadza się.
  solution_steps:
  - 'Zastosuj wzór na współrzędne wektora: \vec{AA''} = [x_{A''} - x_A, y_{A''} - y_A].'
  - 'Oblicz: \vec{u} = [1 - (-5), -4 - 2] = [6, -6].'
  - 'Oblicz długość: |\vec{u}| = \sqrt{6^2 + (-6)^2} = \sqrt{72} = 6\sqrt{2}.'
  - 'Sprawdź: przesunięcie punktu A o wektor [6, -6] daje punkt (1, -4).'
  answer:
    kind: MULTIPART
    parts:
    - name: wektor u
      answer:
        kind: TUPLE
        items:
        - '6'
        - '-6'
    - name: dlugosc wektora
      answer:
        kind: SYMBOLIC
        latex: 6\sqrt{2}
  checks:
  - kind: evaluate
    expr: \sqrt{6^2+\left(-6\right)^2}
    part: dlugosc wektora
  skills:
