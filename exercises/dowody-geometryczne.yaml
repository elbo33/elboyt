  exercise_type: ocena błędnego rozumowania
  statement: 'W trójkącie ABC zachodzi |AB| = |AC| = 25 oraz |BC| = 14. Punkt D leży na boku BC i odcinek
    AD jest dwusieczną kąta BAC, tzn. |∡BAD| = |∡CAD|. Uczeń miał wykazać, że |BD| = |DC|, i napisał:
    „Ponieważ |BD| = |DC|, a ponadto |AB| = |AC| i bok AD jest wspólny, to trójkąty ABD i ACD przystają
    z cechy bbb, więc |BD| = |DC|”. Wskaż błąd w tym rozumowaniu, przeprowadź poprawny dowód, a następnie
    oblicz |BD| oraz |AD|.'
  statement_latex: '|BD| = \frac{14}{2},\qquad |AD| = \sqrt{25^{2}-7^{2}}'
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: jako jedną z trzech par równych boków uczeń przyjął |BD| = |DC| — czyli dokładnie to, co miał udowodnić. To błędne koło: teza została użyta jako argument, a na końcu „wywnioskowana” z samej siebie. Takie rozumowanie niczego nie dowodzi (w ten sposób można „udowodnić” dowolne zdanie).

    POPRAWNY DOWÓD: porównujemy trójkąty ABD i ACD w odpowiedniości A↔A, B↔C, D↔D:
    1) |AB| = |AC| — z założenia;
    2) |∡BAD| = |∡CAD| — bo AD jest dwusieczną kąta BAC (założenie);
    3) |AD| = |AD| — bok wspólny.
    Są to dwa boki i kąt MIĘDZY nimi, więc z cechy bkb trójkąty ABD i ACD są przystające.
    Z przystawania wynika równość odpowiadających boków, w szczególności |BD| = |CD| — a to jest teza. Co należało wykazać.
    (Zauważ: teza pojawia się dopiero jako ostatni wniosek, a nie jako założenie.)

    OBLICZENIA: skoro |BD| = |DC| i |BD| + |DC| = |BC| = 14, to |BD| = 14/2 = 7.
    Z przystawania mamy też |∡ADB| = |∡ADC|, a ponieważ kąty te są przyległe, każdy z nich ma 90°. Trójkąt ABD jest prostokątny o przeciwprostokątnej AB, więc z twierdzenia Pitagorasa:
    |AD|² = 25² − 7² = 625 − 49 = 576, czyli |AD| = 24.
  solution_steps:
  - 'Wskaż błąd: uczeń użył tezy |BD| = |DC| jako jednej z przesłanek (błędne koło).'
  - 'Zbierz poprawne przesłanki: |AB| = |AC| (założenie), |∡BAD| = |∡CAD| (dwusieczna), AD bok wspólny.'
  - Powołaj cechę bkb (kąt leży między danymi bokami) i stwierdź przystawanie ABD ≅ ACD.
  - Z przystawania wywnioskuj tezę |BD| = |DC|.
  - Oblicz |BD| = 14/2 = 7.
  - Zauważ, że |∡ADB| = 90°, i z twierdzenia Pitagorasa oblicz |AD| = √(625 − 49) = 24.
  answer:
    kind: MULTIPART
    parts:
    - name: długość odcinka BD
      answer:
