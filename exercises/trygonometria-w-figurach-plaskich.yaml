  statement: W trójkącie ABC dane są |AB| = 10, |AC| = 6, |∠ABC| = 105° oraz |∠ACB| = 45°. Oblicz pole
    tego trójkąta. Wyjaśnij, dlaczego zapis P = ½·10·6·sin 45° jest błędny.
  statement_latex: '|\angle BAC|=180^\circ-105^\circ-45^\circ,\qquad P=\frac{1}{2}\cdot 10\cdot 6\cdot\sin
    30^\circ'
  solution: |-
    BŁĘDNE ROZUMOWANIE (typowy błąd):
    Uczeń bierze dwa dane boki i „jakiś dany kąt”:
    \[P=\frac{1}{2}\cdot 10\cdot 6\cdot\sin 45^\circ=30\cdot\frac{\sqrt2}{2}=15\sqrt2\approx 21{,}2 .\]

    DLACZEGO TO BŁĄD:
    We wzorze \(P=\tfrac12ab\sin\gamma\) kąt γ musi leżeć MIĘDZY bokami a i b. Kąt o mierze 45° jest kątem przy wierzchołku C, czyli kątem między bokami CA i CB — a nie między AB i AC. Użyta para boków i kąt do siebie nie pasują.

    POPRAWNE ROZWIĄZANIE:
    Kątem między bokami AB i AC jest kąt przy wierzchołku A. Z sumy kątów trójkąta:
    \[|\angle BAC|=180^\circ-105^\circ-45^\circ=30^\circ .\]
    Stąd
    \[P=\frac{1}{2}\cdot 10\cdot 6\cdot\sin 30^\circ=30\cdot\frac{1}{2}=15 .\]

    Odpowiedź: P = 15.
  solution_steps:
  - 'Rozpoznaj błąd: kąt 45° leży przy wierzchołku C, a nie między bokami AB i AC (błędny wynik 15√2).'
  - 'Wyznacz kąt między danymi bokami z sumy kątów trójkąta: ∠BAC = 180° − 105° − 45° = 30°.'
  - Podstaw do wzoru P = ½·|AB|·|AC|·sin(∠BAC).
  - Oblicz P = ½·10·6·½ = 15.
