section: uklady-rownan-liniowych
name: 'Układy równań liniowych: rozwiązywanie, interpretacja i zastosowania'
scope: Solving 2x2 linear systems; consistent, dependent and inconsistent systems as pairs of lines; translating
  a word problem into a system and interpreting the solution.
requirements:
- IV.1
- IV.2
counts:
  total: 16
  REFERENCE_CALL: 6
  DETERMINISTIC: 5
  NOT_MACHINE_CHECKABLE: 2
  STATED_MODEL: 3
exercises:
- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: sprawdzenie pary liczb w układzie równań
  statement: Dany jest układ równań \begin{cases} 3x + 2y = 4 \\ x - 5y = 7 \end{cases} Rozważamy parę
    liczb x = 2, y = -1. Oblicz wartość lewej strony pierwszego równania oraz wartość lewej strony drugiego
    równania dla tej pary liczb, a następnie rozstrzygnij, czy para (2, -1) jest rozwiązaniem tego układu
    równań.
  statement_latex: \begin{cases} 3\cdot x + 2\cdot y = 4 \\ x - 5\cdot y = 7 \end{cases},\qquad \left(x,\
    y\right) = \left(2,\ -1\right)
  solution: |-
    Podstawiamy x = 2 oraz y = -1 do lewej strony pierwszego równania: 3\cdot 2 + 2\cdot(-1) = 6 - 2 = 4. Prawa strona pierwszego równania jest równa 4, więc pierwsze równanie jest spełnione.
    Podstawiamy tę samą parę do lewej strony drugiego równania: 2 - 5\cdot(-1) = 2 + 5 = 7. Prawa strona drugiego równania jest równa 7, więc i to równanie jest spełnione.
    Para liczb spełnia JEDNOCZEŚNIE oba równania, zatem jest rozwiązaniem układu. Geometrycznie: punkt (2, -1) leży na obu prostych, czyli jest ich punktem wspólnym.
    Odpowiedź: lewa strona I równania ma wartość 4, lewa strona II równania ma wartość 7, para (2, -1) jest rozwiązaniem układu.
  solution_steps:
  - 'Podstaw x = 2 i y = -1 do lewej strony pierwszego równania: 3·2 + 2·(-1) = 4.'
  - 'Porównaj z prawą stroną: 4 = 4, pierwsze równanie jest spełnione.'
  - 'Podstaw tę samą parę do lewej strony drugiego równania: 2 - 5·(-1) = 7.'
  - 'Porównaj z prawą stroną: 7 = 7, drugie równanie jest spełnione.'
  - Ponieważ oba równania są spełnione jednocześnie, para (2, -1) jest rozwiązaniem układu.
  answer:
    kind: MULTIPART
    parts:
    - name: wartość lewej strony I równania
      answer:
        kind: NUMERIC
        value: 4.0
    - name: wartość lewej strony II równania
      answer:
        kind: NUMERIC
        value: 7.0
    - name: czy para jest rozwiązaniem układu
      answer:
        kind: BOOLEAN
        truth: true
  checks:
  - kind: evaluate
    expr: 3\cdot 2 + 2\cdot\left(-1\right)
    part: wartość lewej strony I równania
  - kind: evaluate
    expr: 2 - 5\cdot\left(-1\right)
    part: wartość lewej strony II równania
  skills:
  - sprawdzanie, czy para liczb jest rozwiązaniem układu
  - obliczanie wartości wyrażenia algebraicznego
  verification:
    checkability: REFERENCE_CALL
    note: '3 parts matched · det: [wartość lewej strony I równania] SymPy solved it fresh: 4.0 vs 4.0
      (tol 1e-09) ; [wartość lewej strony II równania] SymPy solved it fresh: 7.0 vs 7.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: rozwiązywanie układu metodą podstawiania
  statement: Rozwiąż metodą podstawiania układ równań \begin{cases} y = 2x - 3 \\ 3x + y = 12 \end{cases}
    Podaj wartość x oraz wartość y.
  statement_latex: \begin{cases} y = 2\cdot x - 3 \\ 3\cdot x + y = 12 \end{cases}
  solution: |-
    W pierwszym równaniu niewiadoma y jest już wyznaczona: y = 2x - 3.
    Wyrażenie 2x - 3 podstawiamy w miejsce y do DRUGIEGO równania (nie do tego samego, z którego je wzięliśmy):
    3x + (2x - 3) = 12.
    Porządkujemy: 5x - 3 = 12, czyli 5x = 15, stąd x = 3.
    Wracamy do wzoru z pierwszego równania: y = 2\cdot 3 - 3 = 3.
    Sprawdzenie: y = 2·3 - 3 = 3 ✓ oraz 3·3 + 3 = 12 ✓.
    Odpowiedź: (x, y) = (3, 3).
  solution_steps:
  - 'Zauważ, że z pierwszego równania y jest już wyznaczone: y = 2x - 3.'
  - 'Podstaw 2x - 3 w miejsce y do drugiego równania: 3x + (2x - 3) = 12.'
  - 'Rozwiąż równanie z jedną niewiadomą: 5x = 15, więc x = 3.'
  - 'Oblicz y: y = 2·3 - 3 = 3.'
  - Sprawdź parę (3, 3) w obu równaniach i zapisz odpowiedź jako parę liczb.
  answer:
    kind: MULTIPART
    parts:
    - name: x
      answer:
        kind: NUMERIC
        value: 3.0
    - name: y
      answer:
        kind: NUMERIC
        value: 3.0
  checks:
  - kind: solve_equation
    expr: 3\cdot x + \left(2\cdot x - 3\right) = 12
    part: x
  - kind: evaluate
    expr: 2\cdot 3 - 3
    var: y
    part: y
  skills:
  - metoda podstawiania
  - rozwiązywanie równania liniowego z jedną niewiadomą
  - zapis rozwiązania jako pary liczb
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [x] SymPy solved it fresh: 3.0 vs 3.0 (tol 1e-09) ; [y] SymPy
      solved it fresh: 3.0 vs 3.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: klasyfikacja układu i interpretacja geometryczna
  statement: Dany jest układ równań \begin{cases} y = -3x + 5 \\ y = -3x - 2 \end{cases} Rozstrzygnij,
    czy ten układ jest oznaczony, nieoznaczony czy sprzeczny, podaj liczbę jego rozwiązań oraz opisz wzajemne
    położenie prostych opisanych tymi równaniami.
  statement_latex: \begin{cases} y = -3\cdot x + 5 \\ y = -3\cdot x - 2 \end{cases}
  solution: |-
    Oba równania są już zapisane w postaci kierunkowej y = ax + b.
    Współczynniki kierunkowe: a_1 = -3 oraz a_2 = -3, są więc równe.
    Wyrazy wolne: b_1 = 5 oraz b_2 = -2, są różne.
    Równe współczynniki kierunkowe i różne wyrazy wolne oznaczają proste równoległe i rozłączne — nie mają one punktu wspólnego.
    Można to też pokazać rachunkowo: odejmując równania stronami dostajemy 0 = 7, czyli zdanie fałszywe.
    Odpowiedź: układ jest sprzeczny, ma 0 rozwiązań, a proste są równoległe i różne (nie mają punktów wspólnych).
  solution_steps:
  - 'Odczytaj współczynniki kierunkowe: a₁ = -3, a₂ = -3 — są równe.'
  - 'Odczytaj wyrazy wolne: b₁ = 5, b₂ = -2 — są różne.'
  - 'Wniosek algebraiczny: odejmując równania stronami otrzymujemy 0 = 7, zdanie fałszywe, więc układ
    jest sprzeczny (0 rozwiązań).'
  - 'Wniosek geometryczny: proste są równoległe i rozłączne, nie mają punktu wspólnego.'
  answer:
    kind: MULTIPART
    parts:
    - name: typ układu
      answer:
        kind: SYMBOLIC
        latex: \text{układ sprzeczny}
    - name: liczba rozwiązań
      answer:
        kind: NUMERIC
        value: 0.0
    - name: położenie prostych
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma opisać, że proste mają ten sam współczynnik kierunkowy (-3) i różne wyrazy wolne,
          więc są równoległe i rozłączne — nie mają punktów wspólnych.
  skills:
  - klasyfikacja układu przez postać kierunkową
  - interpretacja geometryczna układu
  - liczba rozwiązań układu
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: położenie prostych · 0/2 other parts solved fresh'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: rozwiązywanie układu metodą przeciwnych współczynników
  statement: Rozwiąż układ równań \begin{cases} 4x - 3y = 18 \\ 2x + 5y = -4 \end{cases} Podaj wartość
    x oraz wartość y.
  statement_latex: \begin{cases} 4\cdot x - 3\cdot y = 18 \\ 2\cdot x + 5\cdot y = -4 \end{cases}
  solution: |-
    Stosujemy metodę przeciwnych współczynników. Mnożymy CAŁE drugie równanie przez (-2):
    -4x - 10y = 8.
    Dodajemy je stronami do pierwszego równania:
    (4x - 4x) + (-3y - 10y) = 18 + 8, czyli -13y = 26, stąd y = -2.
    Wstawiamy y = -2 do drugiego równania wyjściowego: 2x + 5\cdot(-2) = -4, czyli 2x - 10 = -4, więc 2x = 6 i x = 3.
    Sprawdzenie: 4·3 - 3·(-2) = 12 + 6 = 18 ✓ oraz 2·3 + 5·(-2) = 6 - 10 = -4 ✓.
    Odpowiedź: (x, y) = (3, -2). Układ jest oznaczony (W = 4·5 - 2·(-3) = 26 ≠ 0), proste przecinają się w punkcie (3, -2).
  solution_steps:
  - 'Pomnóż całe drugie równanie przez (-2): -4x - 10y = 8.'
  - 'Dodaj równania stronami: -13y = 26.'
  - 'Rozwiąż: y = -2.'
  - 'Wstaw y = -2 do równania 2x + 5y = -4: 2x = 6, czyli x = 3.'
  - Sprawdź parę (3, -2) w obu równaniach wyjściowych i zapisz odpowiedź.
  answer:
    kind: MULTIPART
    parts:
    - name: x
      answer:
        kind: NUMERIC
        value: 3.0
    - name: y
      answer:
        kind: NUMERIC
        value: -2.0
  checks:
  - kind: solve_equation
    expr: 4\cdot x - 3\cdot\frac{-4 - 2\cdot x}{5} = 18
    part: x
  - kind: solve_equation
    expr: 4\cdot\frac{-4 - 5\cdot y}{2} - 3\cdot y = 18
    var: y
    part: y
  skills:
  - metoda eliminacji
  - sprawdzanie rozwiązania
  - zapis rozwiązania jako pary liczb
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [x] SymPy solved it fresh: 3.0 vs 3.0 (tol 1e-09) ; [y] SymPy
      solved it fresh: -2.0 vs -2.0 (tol 1e-09)'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: układ wymagający uporządkowania (ułamki i nawiasy)
  statement: Rozwiąż układ równań \begin{cases} \frac{x+y}{2} - \frac{x-y}{3} = 3 \\ 2\left(x-1\right)
    + 3\left(y+2\right) = 26 \end{cases} Podaj wartość x oraz wartość y.
  statement_latex: \begin{cases} \frac{x+y}{2} - \frac{x-y}{3} = 3 \\ 2\cdot\left(x-1\right) + 3\cdot\left(y+2\right)
    = 26 \end{cases}
  solution: |-
    Najpierw porządkujemy oba równania.
    Pierwsze równanie mnożymy przez 6 (wspólny mianownik): 3(x + y) - 2(x - y) = 18, czyli 3x + 3y - 2x + 2y = 18, więc x + 5y = 18.
    W drugim równaniu opuszczamy nawiasy: 2x - 2 + 3y + 6 = 26, czyli 2x + 3y = 22.
    Otrzymaliśmy układ równoważny: { x + 5y = 18 ; 2x + 3y = 22 }.
    Metoda podstawiania: z pierwszego równania x = 18 - 5y. Podstawiamy do drugiego:
    2(18 - 5y) + 3y = 22, czyli 36 - 10y + 3y = 22, więc -7y = -14 i y = 2.
    Stąd x = 18 - 5·2 = 8.
    Sprawdzenie w równaniach wyjściowych: \frac{8+2}{2} - \frac{8-2}{3} = 5 - 2 = 3 ✓ oraz 2·(8-1) + 3·(2+2) = 14 + 12 = 26 ✓.
    Odpowiedź: (x, y) = (8, 2).
  solution_steps:
  - 'Pomnóż pierwsze równanie przez 6 i uporządkuj: 3(x+y) - 2(x-y) = 18, czyli x + 5y = 18.'
  - 'Opuść nawiasy w drugim równaniu: 2x - 2 + 3y + 6 = 26, czyli 2x + 3y = 22.'
  - Z równania x + 5y = 18 wyznacz x = 18 - 5y.
  - 'Podstaw do drugiego równania: 2(18 - 5y) + 3y = 22, skąd -7y = -14, czyli y = 2.'
  - Oblicz x = 18 - 5·2 = 8.
  - Sprawdź parę (8, 2) w obu równaniach wyjściowych i zapisz odpowiedź.
  answer:
    kind: MULTIPART
    parts:
    - name: x
      answer:
        kind: NUMERIC
        value: 8.0
    - name: y
      answer:
        kind: NUMERIC
        value: 2.0
  checks:
  - kind: solve_equation
    expr: 2\cdot x + 3\cdot\frac{18 - x}{5} = 22
    part: x
  - kind: solve_equation
    expr: 2\cdot\left(18 - 5\cdot y\right) + 3\cdot y = 22
    var: y
    part: y
  skills:
  - 'porządkowanie równań: usuwanie ułamków i nawiasów'
  - metoda podstawiania
  - sprawdzanie rozwiązania
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [x] SymPy solved it fresh: 8.0 vs 8.0 (tol 1e-09) ; [y] SymPy
      solved it fresh: 2.0 vs 2.0 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: zadanie tekstowe rozwiązywane układem równań
  statement: Na seans filmowy sprzedano bilety normalne w cenie 22 zł oraz bilety ulgowe w cenie 14 zł.
    Łącznie sprzedano 150 biletów. Po opłaceniu kosztów organizacji seansu, które stanowiły 20% wpływów
    ze sprzedaży biletów, organizatorowi pozostało 2128 zł. Oblicz, ile sprzedano biletów normalnych,
    ile ulgowych oraz o ile więcej sprzedano biletów ulgowych niż normalnych. Zapisz obliczenia.
  statement_latex: \begin{cases} x + y = 150 \\ \frac{80}{100}\cdot\left(22\cdot x + 14\cdot y\right)
    = 2128 \end{cases}
  solution: |-
    Oznaczenia: x — liczba sprzedanych biletów normalnych, y — liczba sprzedanych biletów ulgowych. Z sensu zadania x i y są liczbami całkowitymi nieujemnymi oraz x + y = 150.
    Koszty stanowiły 20% wpływów, więc organizatorowi pozostało 80% wpływów: 0{,}8\cdot(22x + 14y) = 2128, skąd 22x + 14y = \frac{2128}{0{,}8} = 2660.
    Układ: { x + y = 150 ; 22x + 14y = 2660 }.
    Z pierwszego równania y = 150 - x. Podstawiamy do drugiego:
    22x + 14(150 - x) = 2660, czyli 22x + 2100 - 14x = 2660, więc 8x = 560 i x = 70.
    Stąd y = 150 - 70 = 80.
    Warunki dziedziny: 70 i 80 to liczby całkowite dodatnie — spełnione.
    Sprawdzenie w treści: 70 + 80 = 150 ✓; wpływy 22·70 + 14·80 = 1540 + 1120 = 2660 zł, koszty 20% to 532 zł, pozostaje 2660 - 532 = 2128 zł ✓.
    Różnica: 80 - 70 = 10.
    Odpowiedź: sprzedano 70 biletów normalnych i 80 biletów ulgowych; biletów ulgowych sprzedano o 10 więcej niż normalnych.
  solution_steps:
  - 'Oznacz: x — liczba biletów normalnych, y — liczba biletów ulgowych; x, y całkowite nieujemne.'
  - 'Zapisz pierwszy warunek: x + y = 150.'
  - 'Zapisz drugi warunek: 0,8·(22x + 14y) = 2128, czyli 22x + 14y = 2660.'
  - 'Podstaw y = 150 - x do drugiego równania: 22x + 14(150 - x) = 2660.'
  - 'Rozwiąż: 8x = 560, czyli x = 70, a stąd y = 80.'
  - Sprawdź warunki dziedziny i zgodność z treścią zadania.
  - 'Odpowiedz na pytanie: oblicz różnicę 80 - 70 = 10 i sformułuj odpowiedź pełnym zdaniem.'
  answer:
    kind: MULTIPART
    parts:
    - name: liczba biletów normalnych
      answer:
        kind: NUMERIC
        value: 70.0
    - name: liczba biletów ulgowych
      answer:
        kind: NUMERIC
        value: 80.0
    - name: o ile więcej biletów ulgowych
      answer:
        kind: NUMERIC
        value: 10.0
  checks:
  - kind: solve_equation
    expr: \frac{80}{100}\cdot\left(22\cdot x + 14\cdot\left(150 - x\right)\right) = 2128
    part: liczba biletów normalnych
  - kind: solve_equation
    expr: \frac{80}{100}\cdot\left(22\cdot\left(150 - y\right) + 14\cdot y\right) = 2128
    var: y
    part: liczba biletów ulgowych
  - kind: evaluate
    expr: 80 - 70
    part: o ile więcej biletów ulgowych
  stated_model:
    variable: x
    objective_latex: \frac{80}{100}\cdot\left(22\cdot x + 14\cdot\left(150 - x\right)\right) = 2128
    domain_lo: '0'
    domain_hi: '150'
    domain_lo_open: false
    domain_hi_open: false
    goal: value
    constraint_used: x + y = 150,\ x,\ y \in \mathbb{Z},\ x \ge 0,\ y \ge 0
  skills:
  - układanie układu równań do treści zadania
  - obliczenia procentowe
  - interpretacja rozwiązania w kontekście zadania
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''x'': ''\\frac{80}{100}\\cdot\\left(22\\cdot
      x + 14\\cdot\\left(150 - x\\right)\\right) = 2128'') — human review'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: Rozwiązywanie układu wymagającego uporządkowania + klasyfikacja
  statement: |-
    Rozwiąż układ równań
    \[ \left\{ \begin{matrix} \frac{x+2}{3} - \frac{y-1}{2} = 1 \\ 5x - 2\left(y+3\right) = 8 \end{matrix} \right. \]
    Podaj rozwiązanie w postaci pary liczb \left(x,\ y\right) oraz określ, czy ten układ jest oznaczony, nieoznaczony, czy sprzeczny. Zapisz obliczenia.
  statement_latex: \left\{ \begin{matrix} \frac{x+2}{3} - \frac{y-1}{2} = 1 \\ 5\cdot x - 2\cdot\left(y+3\right)
    = 8 \end{matrix} \right.
  solution: |-
    Porządkujemy pierwsze równanie: mnożymy obie strony (KAŻDY wyraz) przez 6:
    \(2\cdot\left(x+2\right) - 3\cdot\left(y-1\right) = 6\), czyli \(2x + 4 - 3y + 3 = 6\), stąd \(2x - 3y = -1\).
    Porządkujemy drugie równanie: \(5x - 2y - 6 = 8\), czyli \(5x - 2y = 14\).
    Układ równoważny: \(\left\{ 2x - 3y = -1;\ 5x - 2y = 14 \right\}\).
    Wyznacznik: \(W = 2\cdot\left(-2\right) - 5\cdot\left(-3\right) = -4 + 15 = 11 \neq 0\), więc układ jest oznaczony.
    Metoda przeciwnych współczynników: pierwsze równanie mnożymy przez 2, drugie przez \(-3\):
    \(4x - 6y = -2\) oraz \(-15x + 6y = -42\). Dodajemy stronami: \(-11x = -44\), stąd \(x = 4\).
    Z równania \(5x - 2y = 14\): \(20 - 2y = 14\), czyli \(2y = 6\), \(y = 3\).
    Sprawdzenie w równaniach wyjściowych: \(\frac{4+2}{3} - \frac{3-1}{2} = 2 - 1 = 1\) ✓ oraz \(5\cdot 4 - 2\cdot\left(3+3\right) = 20 - 12 = 8\) ✓.
    Odpowiedź: \(\left(x,\ y\right) = \left(4,\ 3\right)\); układ jest oznaczony (proste przecinają się w jednym punkcie \(\left(4,\ 3\right)\)).
  solution_steps:
  - 'Mnożę pierwsze równanie przez 6 i porządkuję: 2x - 3y = -1.'
  - 'Usuwam nawias w drugim równaniu i porządkuję: 5x - 2y = 14.'
  - Obliczam wyznacznik W = 2·(-2) - 5·(-3) = 11 ≠ 0, więc układ jest oznaczony.
  - 'Mnożę równania przez 2 i przez (-3) i dodaję stronami: -11x = -44, czyli x = 4.'
  - Podstawiam x = 4 do 5x - 2y = 14 i otrzymuję y = 3.
  - Sprawdzam parę (4, 3) w obu wyjściowych równaniach i zapisuję odpowiedź.
  answer:
    kind: MULTIPART
    parts:
    - name: x
      answer:
        kind: NUMERIC
        value: 4.0
    - name: y
      answer:
        kind: NUMERIC
        value: 3.0
    - name: typ_ukladu
      answer:
        kind: SYMBOLIC
        latex: oznaczony
  checks:
  - kind: solve_equation
    expr: 2 \cdot x - 3 \cdot \frac{5 \cdot x - 14}{2} = -1
    part: x
  - kind: solve_equation
    expr: 5 \cdot \frac{3 \cdot y - 1}{2} - 2 \cdot y = 14
    var: y
    part: y
  skills:
  - porządkowanie równań (nawiasy, ułamki)
  - metoda przeciwnych współczynników
  - klasyfikacja układu
  - sprawdzenie rozwiązania
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: reference produced 2 outputs, answer has 3'
