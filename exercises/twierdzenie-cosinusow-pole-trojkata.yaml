  exercise_type: 'BBB: największy kąt i pole'
  statement: Dany jest trójkąt ABC o bokach długości |BC| = 7, |AC| = 8 oraz |AB| = 13. Oblicz cosinus
    największego kąta tego trójkąta, podaj miarę tego kąta oraz oblicz pole trójkąta ABC. Zapisz obliczenia.
  statement_latex: \cos\angle ACB = \frac{7^2 + 8^2 - 13^2}{2\cdot 7\cdot 8},\qquad P = \frac{1}{2}\cdot
    7\cdot 8\cdot\sin\angle ACB
  solution: |-
    Największy kąt leży naprzeciw najdłuższego boku, czyli naprzeciw AB = 13; jest to kąt ACB.
    \cos\angle ACB = \frac{|BC|^2 + |AC|^2 - |AB|^2}{2\cdot|BC|\cdot|AC|} = \frac{49 + 64 - 169}{2\cdot 7\cdot 8} = \frac{-56}{112} = -\frac{1}{2}.
    Cosinus jest ujemny, więc kąt jest rozwarty, a wartości -\frac{1}{2} odpowiada kąt 120°: |∠ACB| = 120°.
    Pole liczymy ze wzoru z sinusem kąta zawartego między bokami BC i AC; sin 120° = \frac{\sqrt{3}}{2}:
    P = \frac{1}{2}\cdot 7\cdot 8\cdot\frac{\sqrt{3}}{2} = 14\sqrt{3} \approx 24{,}25.
    Kontrola: 13^2 = 169 > 49 + 64 = 113, więc trójkąt jest rozwartokątny — zgodnie z otrzymanym kątem.
  solution_steps:
  - 'Wskaż największy kąt: leży on naprzeciw najdłuższego boku AB = 13, czyli jest to kąt ACB.'
  - Zastosuj wzór \cos\angle ACB = \frac{7^2+8^2-13^2}{2\cdot 7\cdot 8} = \frac{-56}{112} = -\frac{1}{2}.
  - Z ujemnego cosinusa i wartości tablicowej odczytaj |∠ACB| = 120°.
  - 'Oblicz pole: P = \frac{1}{2}\cdot 7\cdot 8\cdot\frac{\sqrt{3}}{2} = 14\sqrt{3}.'
  - 'Sprawdź: 169 > 113, więc trójkąt jest rozwartokątny.'
  answer:
    kind: MULTIPART
    parts:
    - name: cosinus największego kąta
      answer:
        kind: SYMBOLIC
        latex: -\frac{1}{2}
    - name: miara największego kąta
      answer:
        kind: NUMERIC
        value: 120.0
        tol: 1.0e-06
    - name: pole
      answer:
        kind: SYMBOLIC
        latex: 14\sqrt{3}
  checks:
  - kind: evaluate
    expr: \frac{7^2 + 8^2 - 13^2}{2\cdot 7\cdot 8}
    part: cosinus największego kąta
  - kind: evaluate
    expr: \frac{180}{\pi}\cdot\arccos\left(\frac{7^2 + 8^2 - 13^2}{2\cdot 7\cdot 8}\right)
