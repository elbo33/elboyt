- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'Dwuczęściowe zadanie modelowe: wzór z dziedziną, obliczenie poziomu cieczy, sprawdzenie
    pojemności'
  statement: Naczynie ma kształt stożka o promieniu podstawy \(6\ \mathrm{cm}\) i wysokości \(18\ \mathrm{cm}\),
    ustawionego wierzchołkiem w dół (podstawa stożka jest poziomym otworem u góry naczynia). Wlewana woda
    tworzy w naczyniu stożek o wierzchołku w dolnym wierzchołku naczynia, którego górna powierzchnia jest
    równoległa do podstawy. a) Wyznacz wzór opisujący objętość wody w naczyniu w zależności od wysokości
    słupa wody i podaj dziedzinę tej zależności. b) Do pustego naczynia wlano \(64\pi\ \mathrm{cm}^{3}\)
    wody. Oblicz wysokość słupa wody oraz rozstrzygnij, czy do naczynia można dolać jeszcze \(150\pi\
    \mathrm{cm}^{3}\) wody bez jej przelania.
  statement_latex: V\left(x\right)=\frac{1}{3}\cdot\pi\cdot\left(\frac{x}{3}\right)^{2}\cdot x=\frac{\pi\cdot
    x^{3}}{27}
  solution: |-
    a) Oznaczmy przez \(x\) wysokość słupa wody (w centymetrach). Powierzchnia wody jest równoległa do podstawy, więc stożek wody jest podobny do całego naczynia w skali \(k=\frac{x}{18}\).
    Promień powierzchni wody: \(r=k\cdot 6=\frac{6x}{18}=\frac{x}{3}\).
    Objętość wody: \(V\left(x\right)=\frac{1}{3}\cdot\pi\cdot r^{2}\cdot x=\frac{1}{3}\cdot\pi\cdot\left(\frac{x}{3}\right)^{2}\cdot x=\frac{\pi\cdot x^{3}}{27}\).
    Słup wody musi mieć dodatnią wysokość i nie może przekroczyć wysokości naczynia, zatem dziedziną jest przedział \(\left(0;\,18\right\rangle\).
    (Sprawdzenie: dla \(x=18\) otrzymujemy pojemność naczynia \(V=\frac{\pi\cdot 18^{3}}{27}=216\pi\ \mathrm{cm}^{3}\), zgodnie ze wzorem \(\frac{1}{3}\pi\cdot 6^{2}\cdot 18\).)
    b) Rozwiązujemy równanie \(\frac{\pi\cdot x^{3}}{27}=64\pi\), czyli \(x^{3}=27\cdot 64=1728\), skąd \(x=12\). Wartość \(12\) należy do dziedziny, więc wysokość słupa wody wynosi \(12\ \mathrm{cm}\).
    Pojemność naczynia to \(216\pi\ \mathrm{cm}^{3}\), a w naczyniu jest już \(64\pi\ \mathrm{cm}^{3}\) wody, więc wolne miejsce to \(216\pi-64\pi=152\pi\ \mathrm{cm}^{3}\).
    Ponieważ \(150\pi<152\pi\), dolanie \(150\pi\ \mathrm{cm}^{3}\) wody jest możliwe — woda się nie przeleje.
    Odpowiedź: \(V\left(x\right)=\frac{\pi\cdot x^{3}}{27}\) dla \(x\in\left(0;\,18\right\rangle\); wysokość słupa wody wynosi \(12\ \mathrm{cm}\), a wodę można dolać (tak).
  solution_steps:
  - Wprowadź zmienną x — wysokość słupa wody.
  - Zauważ podobieństwo stożka wody i naczynia oraz zapisz skalę k=\frac{x}{18}.
  - Wyznacz promień powierzchni wody r=6\cdot\frac{x}{18}=\frac{x}{3}.
  - Zapisz i uprość wzór V\left(x\right)=\frac{1}{3}\cdot\pi\cdot\left(\frac{x}{3}\right)^{2}\cdot x=\frac{\pi\cdot
    x^{3}}{27}, podaj dziedzinę \left(0;18\right\rangle.
  - 'Rozwiąż \frac{\pi\cdot x^{3}}{27}=64\pi: x^{3}=1728, x=12 (wartość z dziedziny).'
  - Oblicz pojemność naczynia 216\pi\ \mathrm{cm}^{3} i wolne miejsce 216\pi-64\pi=152\pi\ \mathrm{cm}^{3};
    ponieważ 150\pi<152\pi, dolanie jest możliwe.
