- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: kula wpisana w stożek z danym kątem nachylenia tworzącej
  statement: Dany jest stożek o promieniu podstawy r = 9, którego tworząca jest nachylona do płaszczyzny
    podstawy pod kątem 60^{\circ}. W ten stożek wpisano kulę (styczną do podstawy i do powierzchni bocznej).
    Oblicz promień tej kuli, jej objętość oraz stosunek objętości kuli do objętości stożka. Zapisz obliczenia.
  statement_latex: H = 9\cdot\mathrm{tg}\,60^{\circ},\qquad l = \frac{9}{\cos 60^{\circ}},\qquad R = \frac{r\cdot
    H}{r+l}
  solution: |-
    Krok 1. Przekrój osiowy stożka to trójkąt równoramienny o podstawie 2r = 18 i kątach przy podstawie 60^{\circ}.
    Krok 2. Wysokość stożka: H = r\cdot\mathrm{tg}\,60^{\circ} = 9\sqrt{3}. Tworząca: l = \frac{r}{\cos 60^{\circ}} = \frac{9}{\frac{1}{2}} = 18.
    Krok 3. Kula wpisana w stożek daje w przekroju osiowym okrąg wpisany w ten trójkąt, więc R = \frac{r\cdot H}{r+l} = \frac{9\cdot 9\sqrt{3}}{9+18} = \frac{81\sqrt{3}}{27} = 3\sqrt{3}.
    Krok 4. Objętość kuli: V_{k} = \frac{4}{3}\pi\left(3\sqrt{3}\right)^{3} = \frac{4}{3}\pi\cdot 81\sqrt{3} = 108\sqrt{3}\,\pi.
    Krok 5. Objętość stożka: V_{s} = \frac{1}{3}\pi r^{2}H = \frac{1}{3}\pi\cdot 81\cdot 9\sqrt{3} = 243\sqrt{3}\,\pi.
    Krok 6. Stosunek: \frac{V_{k}}{V_{s}} = \frac{108\sqrt{3}\,\pi}{243\sqrt{3}\,\pi} = \frac{4}{9}.
    Odpowiedź: R = 3\sqrt{3}, V_{k} = 108\sqrt{3}\,\pi, kula stanowi \frac{4}{9} objętości stożka.
  solution_steps:
  - Wyznacz z kąta 60^{\circ} wysokość H = 9\sqrt{3} i tworzącą l = 18.
  - Zastosuj wzór na promień kuli wpisanej w stożek R = \frac{r\cdot H}{r+l} = 3\sqrt{3}.
  - Oblicz V_{k} = \frac{4}{3}\pi\left(3\sqrt{3}\right)^{3} = 108\sqrt{3}\,\pi.
  - Oblicz V_{s} = \frac{1}{3}\pi\cdot 9^{2}\cdot 9\sqrt{3} = 243\sqrt{3}\,\pi.
  - 'Utwórz iloraz i skróć: \frac{V_{k}}{V_{s}} = \frac{4}{9}.'
  answer:
    kind: MULTIPART
    parts:
    - name: promień kuli wpisanej
      answer:
        kind: SYMBOLIC
        latex: 3\sqrt{3}
    - name: objętość kuli
      answer:
        kind: SYMBOLIC
        latex: 108\sqrt{3}\pi
    - name: stosunek objętości
      answer:
        kind: SYMBOLIC
        latex: \frac{4}{9}
  checks:
  - kind: evaluate
    expr: \frac{9\cdot 9\cdot\sqrt{3}}{9+18}
    part: promień kuli wpisanej
  - kind: evaluate
    expr: \frac{4}{3}\cdot\pi\cdot\left(3\cdot\sqrt{3}\right)^{3}
    part: objętość kuli
  - kind: evaluate
    expr: \frac{\frac{4}{3}\cdot\pi\cdot\left(3\cdot\sqrt{3}\right)^{3}}{\frac{1}{3}\cdot\pi\cdot 9^{2}\cdot
      9\cdot\sqrt{3}}
    part: stosunek objętości
  skills:
