  exercise_type: 'błąd: mylenie maksimum z minimum'
  statement: 'Dzienny koszt produkcji (w złotych) x sztuk pewnego wyrobu w małej pracowni opisuje funkcja
    K\left(x\right)=\frac{1}{2}x^{2}-30x+800, przy czym x jest liczbą całkowitą i 0 \le x \le 80. Uczeń
    stwierdził: „Wierzchołek paraboli zawsze daje wartość największą, więc dla x=30 koszt jest największy”.
    Wskaż błąd w tym rozumowaniu, a następnie oblicz, przy jakiej dziennej produkcji koszt jest najmniejszy
    i ile on wtedy wynosi. Zapisz obliczenia.'
  statement_latex: K\left(x\right)=\frac{1}{2}x^{2}-30x+800
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń obliczył p=-\frac{-30}{2\cdot\frac{1}{2}}=30 i uznał, że wierzchołek zawsze daje wartość NAJWIĘKSZĄ, więc odpowiedział, że dla x=30 koszt jest największy.
    DLACZEGO TO BŁĄD: o rodzaju ekstremum decyduje znak współczynnika a. Tutaj a=\frac{1}{2}>0, więc ramiona paraboli są skierowane w górę i wierzchołek daje wartość NAJMNIEJSZĄ, a nie największą. (Największy koszt na przedziale [0,80] jest zresztą przyjmowany na końcu przedziału: K(80)=3200-2400+800=1600 zł.)
    POPRAWNIE: a=\frac{1}{2}>0, więc funkcja przyjmuje wartość najmniejszą w wierzchołku.
    p=-\frac{-30}{2\cdot\frac{1}{2}}=30 – liczba całkowita należąca do przedziału [0,80].
    q=K(30)=\frac{1}{2}\cdot 900-30\cdot 30+800=450-900+800=350.
    Odpowiedź: koszt jest najmniejszy przy produkcji 30 sztuk dziennie i wynosi wtedy 350 zł.
  solution_steps:
  - 'Odtwórz błędne rozumowanie: „wierzchołek zawsze daje maksimum”.'
  - 'Wskaż błąd: a=\frac{1}{2}>0, ramiona w górę, więc wierzchołek daje minimum.'
  - Oblicz p=-\frac{-30}{2\cdot\frac{1}{2}}=30 i sprawdź, że 30 \in [0,80] oraz jest liczbą całkowitą.
  - Oblicz q=K(30)=450-900+800=350.
  - 'Podaj odpowiedź: 30 sztuk dziennie, koszt najmniejszy 350 zł.'
