- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: pole i objętość bryły podobnej
  statement: Graniastosłupy G₁ i G₂ są podobne. Krawędź podstawy graniastosłupa G₁ ma długość 6 cm, a
    odpowiadająca jej krawędź podstawy graniastosłupa G₂ ma długość 9 cm. Pole powierzchni całkowitej
    graniastosłupa G₁ jest równe 48 cm², a jego objętość jest równa 40 cm³. Oblicz pole powierzchni całkowitej
    oraz objętość graniastosłupa G₂.
  statement_latex: k=\frac{9}{6}=\frac{3}{2},\qquad P_{2}=k^{2}\cdot 48,\qquad V_{2}=k^{3}\cdot 40
  solution: |-
    Skala przejścia G₁ → G₂: k = 9/6 = 3/2 (powiększenie, bo k > 1).
    Pole: P₂ = k²·P₁ = (3/2)²·48 = (9/4)·48 = 108 (cm²).
    Objętość: V₂ = k³·V₁ = (3/2)³·40 = (27/8)·40 = 135 (cm³).
    Kontrola: k > 1, więc obie wielkości wzrosły — zgadza się.
    Odpowiedź: P₂ = 108 cm², V₂ = 135 cm³.
  solution_steps:
  - 'Wyznacz skalę podobieństwa: k=\frac{9}{6}=\frac{3}{2}.'
  - Do pola zastosuj P_{2}=k^{2}\cdot P_{1}=\left(\frac{3}{2}\right)^{2}\cdot 48=108\ \text{cm}^{2}.
  - Do objętości zastosuj V_{2}=k^{3}\cdot V_{1}=\left(\frac{3}{2}\right)^{3}\cdot 40=135\ \text{cm}^{3}.
  - Sprawdź sensowność wyników (k > 1, więc obie wartości większe).
  answer:
    kind: MULTIPART
    parts:
    - name: pole powierzchni G2
      answer:
        kind: NUMERIC
        value: 108.0
        latex: 108\ \text{cm}^{2}
    - name: objętość G2
      answer:
        kind: NUMERIC
        value: 135.0
        latex: 135\ \text{cm}^{3}
