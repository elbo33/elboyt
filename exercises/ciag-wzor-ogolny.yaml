    kind: MULTIPART
    parts:
    - name: a_1
      answer:
        kind: NUMERIC
        value: -3.0
    - name: a_5
      answer:
        kind: NUMERIC
        value: 13.0
  checks:
  - kind: evaluate
    expr: 4\cdot 1-7
    var: n
    part: a_1
  - kind: evaluate
    expr: 4\cdot 5-7
    var: n
    part: a_5
