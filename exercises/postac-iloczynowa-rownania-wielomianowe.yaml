- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: równanie wielomianowe
  statement: Rozwiąż równanie x^{4}-25x^{2}=0. Zapisz obliczenia.
  statement_latex: x^{4}-25x^{2}=0
  solution: |-
    Wyłączamy przed nawias x^{2}:
    x^{4}-25x^{2}=x^{2}\left(x^{2}-25\right)=0.
    Czynnik x^{2}-25 to różnica kwadratów: x^{2}-5^{2}=\left(x-5\right)\left(x+5\right). Zatem
    x^{2}\left(x-5\right)\left(x+5\right)=0.
    Stąd x^{2}=0 lub x-5=0 lub x+5=0, czyli x=0 lub x=5 lub x=-5.
    Kontrola: wielomian jest stopnia czwartego, więc może mieć co najwyżej cztery różne pierwiastki — mamy trzy (0 jest pierwiastkiem dwukrotnym, ale w odpowiedzi zapisujemy go raz).
    Odpowiedź: x\in\left\{-5,0,5\right\}.
  solution_steps:
  - 'Wyłącz przed nawias wspólny czynnik x^{2}: x^{2}\left(x^{2}-25\right)=0.'
  - 'Rozłóż różnicę kwadratów: x^{2}-25=\left(x-5\right)\left(x+5\right).'
  - 'Zastosuj własność iloczynu zerowego: x^{2}=0 lub x-5=0 lub x+5=0.'
  - 'Wypisz różne rozwiązania: x=-5, x=0, x=5.'
  answer:
    kind: SET
    members:
    - '-5'
    - '0'
    - '5'
  checks:
  - kind: solve_equation
    expr: x^{4}-25x^{2}=0
  skills:
  - wyłączanie wspólnego czynnika
  - różnica kwadratów
  - własność iloczynu zerowego
