  statement: |-
    Dany jest trójkąt równoboczny ABC o boku długości 12. Przy każdym z wierzchołków A, B, C odcięto od niego trójkąt równoboczny o tej samej długości boku, przy czym każdy z odciętych trójkątów ma wierzchołek w odpowiednim wierzchołku trójkąta ABC, a jego dwa boki zawierają się w bokach trójkąta ABC. Po odcięciu trzech takich trójkątów z trójkąta ABC pozostaje sześciokąt, którego boki mają na przemian długość boku odciętego trójkąta oraz długość pozostałej części boku trójkąta ABC.
    a) Oznaczając przez x długość boku odciętego trójkąta, wyznacz wzór na pole P powstałego sześciokąta w zależności od x i podaj dziedzinę tej zależności.
    b) Wyznacz tę wartość x, dla której powstały sześciokąt jest sześciokątem foremnym, oblicz jego pole i rozstrzygnij, czy pole to stanowi więcej niż 65% pola trójkąta ABC.
  statement_latex: P\left(x\right)=\frac{12^{2}\sqrt{3}}{4}-3\cdot\frac{x^{2}\sqrt{3}}{4}=36\sqrt{3}-\frac{3\sqrt{3}}{4}\cdot
    x^{2}
  solution: |-
    a) Pole trójkąta ABC: P_{ABC}=\frac{12^{2}\sqrt{3}}{4}=36\sqrt{3}.
    Każdy odcięty trójkąt jest równoboczny o boku x, więc ma pole \frac{x^{2}\sqrt{3}}{4}. Odcinamy trzy takie trójkąty, zatem
    P\left(x\right)=36\sqrt{3}-3\cdot\frac{x^{2}\sqrt{3}}{4}=36\sqrt{3}-\frac{3\sqrt{3}}{4}\cdot x^{2}.
    Dziedzina: musi być x>0 oraz pozostała część każdego boku musi być dodatnia, czyli 12-2x>0, skąd x<6. Zatem x\in\left(0;6\right).
    b) Boki sześciokąta mają na przemian długości x oraz 12-2x, a wszystkie jego kąty wewnętrzne mają miarę 180^\circ-60^\circ=120^\circ. Sześciokąt jest więc foremny dokładnie wtedy, gdy wszystkie boki są równe:
    12-2x=x \Rightarrow 3x=12 \Rightarrow x=4, przy czym 4\in\left(0;6\right) — warunek dziedziny jest spełniony.
    Pole: P\left(4\right)=36\sqrt{3}-\frac{3\sqrt{3}}{4}\cdot 16=36\sqrt{3}-12\sqrt{3}=24\sqrt{3}.
    (Kontrola wzorem na pole sześciokąta foremnego o boku 4: \frac{3\cdot 4^{2}\sqrt{3}}{2}=24\sqrt{3} ✓.)
    Porównanie z progiem: \frac{24\sqrt{3}}{36\sqrt{3}}=\frac{2}{3}\approx 0{,}667=66{,}7\%>65\%.
    Odpowiedź: P\left(x\right)=36\sqrt{3}-\frac{3\sqrt{3}}{4}x^{2} dla x\in\left(0;6\right); sześciokąt jest foremny dla x=4, jego pole wynosi 24\sqrt{3} i stanowi \frac{2}{3} pola trójkąta ABC, czyli więcej niż 65%.
  solution_steps:
  - 'Oblicz pole trójkąta wyjściowego: P_{ABC}=\frac{12^{2}\sqrt{3}}{4}=36\sqrt{3}.'
  - 'Zapisz pole jednego odciętego trójkąta równobocznego o boku x: \frac{x^{2}\sqrt{3}}{4}, i odejmij
    trzy takie pola: P\left(x\right)=36\sqrt{3}-\frac{3\sqrt{3}}{4}x^{2}.'
  - Ustal dziedzinę z warunków x>0 i 12-2x>0, czyli x\in\left(0;6\right).
  - Zauważ, że boki sześciokąta mają długości x oraz 12-2x, a kąty są równe 120^\circ; warunek foremności
    to 12-2x=x, skąd x=4 (należy do dziedziny).
  - 'Oblicz pole: P\left(4\right)=36\sqrt{3}-12\sqrt{3}=24\sqrt{3}.'
  - 'Porównaj z progiem: \frac{24\sqrt{3}}{36\sqrt{3}}=\frac{2}{3}\approx 66{,}7\%>65\%, więc odpowiedź
    brzmi: tak.'
