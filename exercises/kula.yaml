- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: kula opisana na prostopadłościanie
  statement: Dany jest prostopadłościan ABCDEFGH o krawędziach |AB| = 4, |BC| = 4 oraz |AE| = 7. Na tym
    prostopadłościanie opisano kulę (wszystkie osiem wierzchołków leży na sferze). Oblicz promień tej
    kuli, jej pole powierzchni oraz jej objętość. Zapisz obliczenia.
  statement_latex: R = \frac{1}{2}\sqrt{4^{2}+4^{2}+7^{2}}
  solution: |-
    Krok 1. Środek kuli opisanej na prostopadłościanie jest środkiem jego przekątnej, a średnica kuli jest równa długości tej przekątnej.
    Krok 2. Przekątna: d = \sqrt{4^{2}+4^{2}+7^{2}} = \sqrt{16+16+49} = \sqrt{81} = 9.
    Krok 3. Promień kuli: R = \frac{d}{2} = \frac{9}{2} = 4{,}5.
    Krok 4. Pole powierzchni kuli: S = 4\pi R^{2} = 4\pi\cdot\frac{81}{4} = 81\pi.
    Krok 5. Objętość kuli: V = \frac{4}{3}\pi R^{3} = \frac{4}{3}\pi\cdot\frac{729}{8} = \frac{243}{2}\pi.
    Odpowiedź: R = \frac{9}{2}, S = 81\pi, V = \frac{243}{2}\pi.
  solution_steps:
  - Zauważ, że średnica kuli opisanej to przekątna prostopadłościanu.
  - 'Oblicz przekątną: \sqrt{4^{2}+4^{2}+7^{2}} = 9.'
  - Wyznacz R = \frac{9}{2}.
  - Oblicz S = 4\pi\cdot\left(\frac{9}{2}\right)^{2} = 81\pi.
  - Oblicz V = \frac{4}{3}\pi\cdot\left(\frac{9}{2}\right)^{3} = \frac{243}{2}\pi.
  answer:
    kind: MULTIPART
    parts:
    - name: promień kuli
      answer:
        kind: SYMBOLIC
        latex: \frac{9}{2}
    - name: pole powierzchni kuli
      answer:
        kind: SYMBOLIC
        latex: 81\pi
    - name: objętość kuli
      answer:
        kind: SYMBOLIC
        latex: \frac{243}{2}\pi
  checks:
  - kind: evaluate
    expr: \frac{1}{2}\cdot\sqrt{4^{2}+4^{2}+7^{2}}
    part: promień kuli
  - kind: evaluate
    expr: 4\cdot\pi\cdot\left(\frac{9}{2}\right)^{2}
    part: pole powierzchni kuli
  - kind: evaluate
    expr: \frac{4}{3}\cdot\pi\cdot\left(\frac{9}{2}\right)^{3}
    part: objętość kuli
  skills:
  - przekątna prostopadłościanu
