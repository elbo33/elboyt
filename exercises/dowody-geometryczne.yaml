          OBP są prostokątne o wspólnej przeciwprostokątnej OP i równych przyprostokątnych OA = OB = r,
          więc z twierdzenia Pitagorasa |PA| = |PB|; stąd trójkąt APB jest równoramienny.'
    - name: b) miara kąta OAB
