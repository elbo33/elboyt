  - nawiasy przy licznikach wielowyrazowych
  - rozwiązania całkowite
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: nierówność liniowa i równanie z parametrem
  statement: |-
    a) Rozwiąż nierówność \(3\left(2 - x\right) - 2\left(4 - x\right) \geq x - 2\) i zapisz zbiór wszystkich jej rozwiązań w postaci przedziału.
    b) Wyznacz tę wartość parametru \(m\), dla której równanie \(\left(2m - 6\right)x = m - 3\) z niewiadomą \(x\) jest tożsamościowe (spełnia je każda liczba rzeczywista).
  statement_latex: 3\cdot\left(2 - x\right) - 2\cdot\left(4 - x\right) \geq x - 2,\qquad \left(2\cdot
    m - 6\right)\cdot x = m - 3
  solution: |-
    a) Usuwamy nawiasy: 6 − 3x − 8 + 2x ≥ x − 2, czyli −x − 2 ≥ x − 2.
    Przenosimy wyrazy z x na lewo, liczby na prawo: −x − x ≥ −2 + 2, czyli −2x ≥ 0.
    Dzielimy obie strony przez −2 — liczbę ujemną — więc odwracamy znak: x ≤ 0.
    Zbiór rozwiązań: (−∞, 0⟩.
    Sprawdzenie: dla x = −1 mamy L = 3·3 − 2·5 = −1, P = −3, więc −1 ≥ −3 ✓; dla x = 1: L = 3 − 6 = −3, P = −1, więc −3 ≥ −1 — fałsz ✓.

    b) Równanie ma postać A·x = B, gdzie A = 2m − 6, B = m − 3. Równanie jest tożsamościowe dokładnie wtedy, gdy A = 0 i B = 0.
    A = 0 daje 2m − 6 = 0, czyli m = 3.
    Sprawdzamy wyraz wolny: dla m = 3 mamy B = 3 − 3 = 0, więc równanie przyjmuje postać 0·x = 0 — jest tożsamościowe.
    Odpowiedź: m = 3. (Dla m ≠ 3 równanie jest oznaczone i ma jedno rozwiązanie x = (m − 3)/(2m − 6) = 1/2; nie ma takiego m, dla którego równanie byłoby sprzeczne.)
  solution_steps:
  - 'a) Usuń nawiasy: 6 − 3x − 8 + 2x ≥ x − 2.'
  - 'a) Zredukuj: −x − 2 ≥ x − 2, następnie −2x ≥ 0.'
  - 'a) Podziel przez −2 z odwróceniem znaku: x ≤ 0; zbiór rozwiązań (−∞, 0⟩.'
  - 'b) Zapisz równanie w postaci A·x = B: A = 2m − 6, B = m − 3.'
  - 'b) Rozwiąż A = 0: 2m − 6 = 0, stąd m = 3.'
  - 'b) Sprawdź wyraz wolny dla m = 3: B = 0, więc 0·x = 0 — równanie tożsamościowe; odpowiedź m = 3.'
  answer:
    kind: MULTIPART
    parts:
    - name: a) zbiór rozwiązań nierówności
      answer:
        kind: INTERVAL
        lo: -\infty
        hi: '0'
        hi_open: false
    - name: b) wartość parametru m
      answer:
        kind: NUMERIC
        value: 3.0
  checks:
  - kind: solve_inequality
    expr: 3\cdot\left(2 - x\right) - 2\cdot\left(4 - x\right) \geq x - 2
    part: a) zbiór rozwiązań nierówności
  - kind: solve_equation
    expr: 2\cdot m - 6 = 0
    var: m
    part: b) wartość parametru m
  skills:
  - rozwiązywanie nierówności liniowej
  - dyskusja równania z parametrem
  - rozpoznawanie równania tożsamościowego
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [a) zbiór rozwiązań nierówności] SymPy solved it fresh: endpoints
      matched ; [b) wartość parametru m] SymPy solved it fresh: 3.0 vs 3.0 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: nierówność liniowa z ułamkami + rozwiązania całkowite
  statement: Rozwiąż nierówność \frac{3 - 2\cdot x}{4} - \frac{x - 1}{6} > \frac{1}{3}. Zbiór wszystkich
    rozwiązań zapisz w postaci przedziału, a następnie podaj największą liczbę całkowitą, która tę nierówność
    spełnia.
  statement_latex: \frac{3 - 2\cdot x}{4} - \frac{x - 1}{6} > \frac{1}{3}
  solution: |-
    Wspólnym mianownikiem liczb 4, 6 i 3 jest 12. Mnożymy obie strony nierówności przez 12 — to liczba dodatnia, więc zwrot nierówności się nie zmienia (licznik wielowyrazowy bierzemy w nawias):
    \frac{12\cdot\left(3 - 2\cdot x\right)}{4} - \frac{12\cdot\left(x - 1\right)}{6} > \frac{12}{3}, czyli 3\cdot\left(3 - 2\cdot x\right) - 2\cdot\left(x - 1\right) > 4.
    Usuwamy nawiasy: 9 - 6\cdot x - 2\cdot x + 2 > 4, po redukcji: -8\cdot x + 11 > 4.
    Przenosimy 11 na prawą stronę: -8\cdot x > -7.
    Dzielimy obie strony przez -8, czyli przez liczbę ujemną, więc ODWRACAMY znak nierówności: x < \frac{7}{8}.
    Zbiór wszystkich rozwiązań: \left(-\infty, \frac{7}{8}\right).
    Największa liczba całkowita w tym przedziale: skoro \frac{7}{8} = 0{,}875, to szukaną liczbą jest \lfloor \frac{7}{8} \rfloor = 0 (liczba 1 już nie należy do przedziału).
    Sprawdzenie: dla x = 0 lewa strona wynosi \frac{3}{4} + \frac{1}{6} = \frac{11}{12} > \frac{1}{3} ✓, a dla x = 1 mamy \frac{1}{4} - 0 = \frac{1}{4} < \frac{1}{3} ✗.
  solution_steps:
  - Wspólny mianownik 4, 6, 3 to 12; mnożymy obie strony przez 12 (liczba dodatnia — znak bez zmian),
    pamiętając o nawiasach.
  - Otrzymujemy 3\cdot\left(3 - 2\cdot x\right) - 2\cdot\left(x - 1\right) > 4.
  - 'Usuwamy nawiasy i redukujemy wyrazy podobne: -8\cdot x + 11 > 4.'
  - 'Porządkujemy: -8\cdot x > -7.'
  - 'Dzielimy przez -8 i odwracamy znak nierówności: x < \frac{7}{8}.'
  - Zapisujemy zbiór rozwiązań jako przedział \left(-\infty, \frac{7}{8}\right).
  - Największa liczba całkowita spełniająca nierówność to \lfloor \frac{7}{8} \rfloor = 0.
  - Sprawdzamy podstawieniem liczby z przedziału (x = 0) i liczby spoza niego (x = 1).
  answer:
    kind: MULTIPART
    parts:
    - name: zbior_rozwiazan
      answer:
        kind: INTERVAL
        lo: -\infty
        hi: \frac{7}{8}
    - name: najwieksza_calkowita
      answer:
        kind: NUMERIC
        value: 0.0
  checks:
  - kind: solve_inequality
    expr: \frac{3 - 2\cdot x}{4} - \frac{x - 1}{6} > \frac{1}{3}
    part: zbior_rozwiazan
  - kind: evaluate
    expr: \left\lfloor \frac{7}{8} \right\rfloor
    part: najwieksza_calkowita
  skills:
  - mnożenie nierówności przez wspólny mianownik
  - dzielenie przez liczbę ujemną z odwróceniem znaku
  - zapis przedziałowy zbioru rozwiązań
  - wyznaczanie największej liczby całkowitej spełniającej nierówność
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [zbior_rozwiazan] SymPy solved it fresh: endpoints matched
      ; [najwieksza_calkowita] SymPy solved it fresh: 0.0 vs 0.0 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: dyskusja równania liniowego z parametrem
  statement: Dane jest równanie \left(m^{2} - 1\right)\cdot x = m + 1 z niewiadomą x i parametrem m. Wyznacz
    wszystkie wartości parametru m, dla których to równanie jest sprzeczne, wszystkie wartości m, dla
    których jest ono tożsamościowe, oraz zapisz rozwiązanie x tego równania dla pozostałych wartości m.
  statement_latex: \left(m^{2} - 1\right)\cdot x = m + 1
  solution: |-
    Równanie ma już postać A\cdot x = B, gdzie A = m^{2} - 1 = \left(m - 1\right)\cdot\left(m + 1\right) oraz B = m + 1.
    Szukamy najpierw tych m, dla których współczynnik przy x jest zerem: m^{2} - 1 = 0, czyli m = 1 lub m = -1. Tylko te wartości wymagają osobnego rozpatrzenia.
    Dla m = 1: A = 0 oraz B = 1 + 1 = 2 \neq 0, więc równanie ma postać 0\cdot x = 2 — otrzymujemy fałszywą równość liczbową, równanie jest sprzeczne, zbiór rozwiązań to \varnothing.
    Dla m = -1: A = 0 oraz B = -1 + 1 = 0, więc równanie ma postać 0\cdot x = 0 — równość prawdziwa dla każdej liczby x. Równanie jest tożsamościowe, zbiór rozwiązań to \mathbb{R} (uwaga: to NIE jest x = 0).
    Dla pozostałych m, czyli dla m \neq 1 i m \neq -1, mamy A \neq 0, więc równanie jest oznaczone i
    x = \frac{m + 1}{m^{2} - 1} = \frac{m + 1}{\left(m - 1\right)\cdot\left(m + 1\right)} = \frac{1}{m - 1}.
    Odpowiedź: równanie jest sprzeczne dla m = 1, tożsamościowe dla m = -1, a dla m \neq \pm 1 ma dokładnie jedno rozwiązanie x = \frac{1}{m - 1}.
  solution_steps:
  - Zapisz równanie w postaci A\cdot x = B z A = m^{2} - 1 i B = m + 1.
  - 'Rozwiąż A = 0: m^{2} - 1 = 0, stąd m = 1 lub m = -1 — te wartości rozpatrz osobno.'
  - Dla m = 1 otrzymujesz 0\cdot x = 2 — równość fałszywa, równanie sprzeczne, zbiór rozwiązań \varnothing.
  - Dla m = -1 otrzymujesz 0\cdot x = 0 — równość prawdziwa, równanie tożsamościowe, zbiór rozwiązań \mathbb{R}.
  - 'Dla m \neq \pm 1 podziel obie strony przez m^{2} - 1 i skróć: x = \frac{m + 1}{\left(m - 1\right)\cdot\left(m
    + 1\right)} = \frac{1}{m - 1}.'
  - Zbierz pełną dyskusję przypadków w odpowiedzi.
  answer:
    kind: MULTIPART
    parts:
    - name: m_sprzeczne
      answer:
        kind: SET
        members:
        - '1'
    - name: m_tozsamosciowe
      answer:
        kind: SET
        members:
        - '-1'
    - name: rozwiazanie_dla_pozostalych_m
      answer:
        kind: SYMBOLIC
        latex: \frac{1}{m - 1}
  checks:
  - kind: simplify
    expr: \frac{m + 1}{m^{2} - 1}
    var: m
    part: rozwiazanie_dla_pozostalych_m
  skills:
  - doprowadzanie równania do postaci A(m)\cdot x = B(m)
  - rozpoznawanie równania sprzecznego i tożsamościowego
  - skracanie wyrażenia wymiernego
  - dyskusja przypadków
  verification:
    checkability: REFERENCE_CALL
    note: 'answer and reference disagree: part disagrees: ''\\frac{1}{m - 1}'' vs ''x=\\frac{1}{m-1}'''
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: nierówność liniowa — analiza błędu
  statement: Rozwiąż nierówność \(-4x + 5 > 21\) i zapisz zbiór wszystkich jej rozwiązań w postaci przedziału.
