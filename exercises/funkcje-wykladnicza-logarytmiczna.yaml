exercises:
- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczanie wartości funkcji wykładniczej
  statement: 'Dana jest funkcja wykładnicza f(x) = 3^{x} określona dla każdej liczby rzeczywistej x. a)
    Oblicz f(-2). b) Oblicz f(0). c) Oblicz f(3). d) Rozstrzygnij, czy funkcja f jest rosnąca (odpowiedz:
    tak albo nie).'
  statement_latex: f\left(x\right)=3^{x}
  solution: |-
    a) f(-2) = 3^{-2} = \frac{1}{3^{2}} = \frac{1}{9}.
    b) f(0) = 3^{0} = 1 — każdy wykres funkcji wykładniczej przechodzi przez punkt (0,\,1).
    c) f(3) = 3^{3} = 27.
    d) Podstawa a = 3 > 1, więc funkcja f jest rosnąca (zwiększenie x o 1 mnoży wartość przez 3).
  solution_steps:
  - 'Korzystamy z a^{-x}=\frac{1}{a^{x}}: f(-2)=3^{-2}=\frac{1}{9}.'
  - f(0)=3^{0}=1.
  - f(3)=3^{3}=27.
  - 'Podstawa 3>1, zatem funkcja jest rosnąca — odpowiedź: tak.'
  answer:
    kind: MULTIPART
    parts:
    - name: f(-2)
      answer:
        kind: NUMERIC
        value: 0.1111111111111111
        tol: 1.0e-06
        latex: \frac{1}{9}
    - name: f(0)
      answer:
        kind: NUMERIC
        value: 1.0
        latex: '1'
    - name: f(3)
      answer:
        kind: NUMERIC
        value: 27.0
        latex: '27'
    - name: czy f jest rosnąca
      answer:
        kind: BOOLEAN
        truth: true
  checks:
  - kind: evaluate
    expr: 3^{-2}
    part: f(-2)
  - kind: evaluate
    expr: 3^{0}
    part: f(0)
  - kind: evaluate
    expr: 3^{3}
    part: f(3)
  skills:
  - obliczanie wartości funkcji wykładniczej
  - monotoniczność funkcji wykładniczej
  verification:
    checkability: REFERENCE_CALL
    note: '4 parts matched · det: [f(-2)] SymPy solved it fresh: 0.1111111111111111 vs 0.1111111111111111
      (tol 1e-06) ; [f(0)] SymPy solved it fresh: 1.0 vs 1.0 (tol 1e-09) ; [f(3)] SymPy solved it fresh:
      27.0 vs 27.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczanie logarytmów z definicji
  statement: 'Korzystając z definicji logarytmu, oblicz: a) \log_{2} 32, b) \log_{5}\frac{1}{25}, c) \log
    1000 (logarytm dziesiętny).'
  statement_latex: \log_{2} 32,\qquad \log_{5}\frac{1}{25},\qquad \log_{10} 1000
  solution: |-
    a) Pytamy: do której potęgi podnieść 2, aby otrzymać 32? Ponieważ 2^{5}=32, więc \log_{2}32 = 5.
    b) 5^{-2}=\frac{1}{25}, więc \log_{5}\frac{1}{25} = -2.
    c) 10^{3}=1000, więc \log 1000 = 3.
  solution_steps:
  - 'Zapisujemy 32 jako potęgę dwójki: 32 = 2^{5}, stąd \log_{2}32 = 5.'
  - Zapisujemy \frac{1}{25} = 5^{-2}, stąd \log_{5}\frac{1}{25} = -2.
  - Zapisujemy 1000 = 10^{3}, stąd \log 1000 = 3.
  answer:
    kind: MULTIPART
    parts:
    - name: log_2 32
      answer:
        kind: NUMERIC
        value: 5.0
        latex: '5'
    - name: log_5 1/25
      answer:
        kind: NUMERIC
        value: -2.0
        latex: '-2'
    - name: log 1000
      answer:
        kind: NUMERIC
        value: 3.0
        latex: '3'
  checks:
  - kind: evaluate
    expr: \log_{2}\left(32\right)
    part: log_2 32
  - kind: evaluate
    expr: \log_{5}\left(\frac{1}{25}\right)
    part: log_5 1/25
  - kind: evaluate
    expr: \log_{10}\left(1000\right)
    part: log 1000
  skills:
  - definicja logarytmu
  - logarytm dziesiętny
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [log_2 32] SymPy solved it fresh: 5.0 vs 5.0 (tol 1e-09) ;
      [log_5 1/25] SymPy solved it fresh: -2.0 vs -2.0 (tol 1e-09) ; [log 1000] SymPy solved it fresh:
      3.0 vs 3.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: budowanie modelu wykładniczego (podwajanie)
  statement: Liczebność hodowli bakterii podwaja się co 4 godziny. W chwili t = 0 w hodowli było 300 bakterii.
    a) Zapisz wzór opisujący liczbę N(t) bakterii po t godzinach. b) Oblicz liczbę bakterii po 12 godzinach.
  statement_latex: N\left(t\right)=300\cdot 2^{\frac{t}{4}}
  solution: |-
    a) Wartość początkowa N_{0}=300, a czas podwojenia T = 4 h, więc N(t) = 300\cdot 2^{\frac{t}{4}}, gdzie t jest wyrażone w godzinach.
    b) Dla t = 12 mamy wykładnik \frac{12}{4}=3 (czyli trzy podwojenia):
    N(12) = 300\cdot 2^{3} = 300\cdot 8 = 2400.
    Po 12 godzinach w hodowli będzie 2400 bakterii.
  solution_steps:
  - Odczytujemy wartość początkową N_{0}=300 oraz czas podwojenia T=4 h.
  - 'Zapisujemy model: N(t)=300\cdot 2^{\frac{t}{4}}.'
  - 'Podstawiamy t=12: wykładnik \frac{12}{4}=3.'
  - Obliczamy N(12)=300\cdot 2^{3}=2400 bakterii.
  answer:
    kind: MULTIPART
    parts:
    - name: wzór N(t)
      answer:
        kind: SYMBOLIC
        latex: N\left(t\right)=300\cdot 2^{\frac{t}{4}}
    - name: N(12)
      answer:
        kind: NUMERIC
        value: 2400.0
        tol: 1.0e-06
        latex: '2400'
  checks:
  - kind: evaluate
    expr: 300\cdot 2^{\frac{12}{4}}
    var: t
    part: N(12)
  stated_model:
    variable: t
    objective_latex: N\left(t\right)=300\cdot 2^{\frac{t}{4}}
    domain_lo: '0'
    domain_lo_open: false
    goal: value
    constraint_used: podwojenie liczebności co 4 godziny, N(0)=300
  skills:
  - model wykładniczy N(t)=N_0 q^t
  - czas podwojenia
  verification:
    checkability: STATED_MODEL
    note: 'stage 1 inconclusive: SympifyError: SympifyError: "cannot sympify object of type <class ''function''>"'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: równanie i nierówność wykładnicza
  statement: Rozwiąż równanie \left(\frac{1}{3}\right)^{x} = 27 oraz nierówność \left(\frac{1}{3}\right)^{x}
    > \frac{1}{9}.
  statement_latex: \left(\frac{1}{3}\right)^{x} = 27,\qquad \left(\frac{1}{3}\right)^{x} > \frac{1}{9}
  solution: |-
    Równanie: 27 = 3^{3} = \left(\frac{1}{3}\right)^{-3}, więc \left(\frac{1}{3}\right)^{x} = \left(\frac{1}{3}\right)^{-3}. Funkcja wykładnicza jest różnowartościowa, zatem x = -3.

    Nierówność: \frac{1}{9} = \left(\frac{1}{3}\right)^{2}, więc \left(\frac{1}{3}\right)^{x} > \left(\frac{1}{3}\right)^{2}. Podstawa \frac{1}{3}\in(0,1), więc funkcja jest malejąca i znak nierówności między wykładnikami się odwraca: x < 2.
    Odpowiedź: x \in \left(-\infty,\ 2\right).
  solution_steps:
  - 'Zapisujemy prawą stronę równania w podstawie \frac{1}{3}: 27=\left(\frac{1}{3}\right)^{-3}.'
  - 'Z różnowartościowości przyrównujemy wykładniki: x=-3.'
  - Zapisujemy \frac{1}{9}=\left(\frac{1}{3}\right)^{2}.
  - 'Podstawa należy do (0,1) — funkcja malejąca, więc znak nierówności odwracamy: x<2.'
  - 'Zapisujemy odpowiedź w postaci przedziału: x\in\left(-\infty,2\right).'
  answer:
    kind: MULTIPART
    parts:
    - name: rozwiązanie równania
      answer:
        kind: SET
        members:
        - '-3'
    - name: rozwiązanie nierówności
      answer:
        kind: INTERVAL
        lo: -\infty
        hi: '2'
  checks:
  - kind: solve_equation
    expr: \left(\frac{1}{3}\right)^{x} = 27
    part: rozwiązanie równania
  - kind: solve_inequality
    expr: \left(\frac{1}{3}\right)^{x} > \frac{1}{9}
    part: rozwiązanie nierówności
  skills:
  - sprowadzanie do wspólnej podstawy
  - monotoniczność a znak nierówności
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [rozwiązanie równania] SymPy solved it fresh: 1 members matched
      ; [rozwiązanie nierówności] SymPy solved it fresh: endpoints matched'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: procent składany z wyznaczaniem czasu
  statement: Na lokatę wpłacono 8000 zł. Oprocentowanie lokaty wynosi 3% w skali roku, a odsetki są kapitalizowane
    raz w roku (dopisywane do kapitału na koniec każdego roku). a) Zapisz wzór na wartość kapitału K(n)
    po n pełnych latach oszczędzania. b) Oblicz wartość kapitału po 4 latach (wynik podaj z dokładnością
    do 1 grosza). c) Wyznacz najmniejszą liczbę pełnych lat, po których kapitał przekroczy 10 000 zł.
    Przyjmij \log 1{,}25 \approx 0{,}09691 oraz \log 1{,}03 \approx 0{,}01284.
  statement_latex: K\left(n\right)=8000\cdot\left(1+\frac{3}{100}\right)^{n}
  solution: |-
    a) Każdy rok mnoży kapitał przez 1{,}03, więc K(n) = 8000\cdot 1{,}03^{n}.
    b) K(4) = 8000\cdot 1{,}03^{4} = 8000\cdot 1{,}12550881 = 9004{,}07 zł (po zaokrągleniu do 1 grosza).
    c) Szukamy najmniejszej liczby naturalnej n, dla której 8000\cdot 1{,}03^{n} > 10000, czyli 1{,}03^{n} > 1{,}25.
    Logarytmujemy obie strony: n\cdot\log 1{,}03 > \log 1{,}25, stąd n > \frac{\log 1{,}25}{\log 1{,}03} \approx \frac{0{,}09691}{0{,}01284} \approx 7{,}55.
    Najmniejsza liczba naturalna spełniająca ten warunek to n = 8.
    Sprawdzenie: 8000\cdot 1{,}03^{7} \approx 9838{,}99 zł (za mało), 8000\cdot 1{,}03^{8} \approx 10134{,}16 zł (wystarczy).
  solution_steps:
  - 'Ustalamy mnożnik roczny: q = 1+\frac{3}{100}=1{,}03.'
  - 'Zapisujemy model procentu składanego: K(n)=8000\cdot 1{,}03^{n}.'
  - 'Podstawiamy n=4: K(4)=8000\cdot 1{,}03^{4}=9004{,}07 zł.'
  - Zapisujemy warunek 8000\cdot 1{,}03^{n}>10000, czyli 1{,}03^{n}>1{,}25.
  - 'Logarytmujemy: n>\frac{\log 1{,}25}{\log 1{,}03}\approx 7{,}55.'
  - Najmniejsza liczba pełnych lat to n=8; sprawdzamy K(7)<10000<K(8).
  answer:
    kind: MULTIPART
    parts:
    - name: wzór K(n)
      answer:
        kind: SYMBOLIC
        latex: K\left(n\right)=8000\cdot\left(1{,}03\right)^{n}
    - name: kapitał po 4 latach
      answer:
        kind: NUMERIC
        value: 9004.07
        tol: 0.01
        latex: 9004{,}07\ \text{zł}
    - name: liczba pełnych lat
      answer:
        kind: NUMERIC
        value: 8.0
        latex: '8'
  checks:
  - kind: evaluate
    expr: 8000\cdot\left(1.03\right)^{4}
    var: n
    part: kapitał po 4 latach
  stated_model:
    variable: n
    objective_latex: K\left(n\right)=8000\cdot 1{,}03^{n}
    domain_lo: '0'
    domain_lo_open: false
    goal: value
    constraint_used: kapitalizacja roczna, stopa 3% w skali roku, n — liczba pełnych lat
  skills:
  - procent składany
  - logarytmowanie w celu wyznaczenia czasu
  - zaokrąglanie zgodne z sensem zadania
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''n'': ''K\\left(n\\right)=8000\\cdot
      1{,}03^{n}'') — human review'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: skala logarytmiczna (decybele)
  statement: Poziom natężenia dźwięku L (w decybelach) wyraża się wzorem L = 10\cdot\log\frac{I}{I_{0}},
    gdzie I to natężenie dźwięku (w \frac{\text{W}}{\text{m}^{2}}), a I_{0} = 10^{-12}\ \frac{\text{W}}{\text{m}^{2}}
    jest progiem słyszalności. a) Oblicz poziom natężenia dźwięku odkurzacza, dla którego I = 10^{-6}\
    \frac{\text{W}}{\text{m}^{2}}. b) Poziom natężenia dźwięku młota pneumatycznego jest równy 85 dB.
    Oblicz natężenie I tego dźwięku (wynik podaj z dokładnością do trzech cyfr znaczących). c) Oblicz,
    ile razy natężenie dźwięku młota jest większe od natężenia dźwięku odkurzacza. d) Uzasadnij, że wzrost
    poziomu natężenia dźwięku o 20 dB oznacza stukrotny wzrost natężenia.
  statement_latex: L = 10\cdot\log\frac{I}{I_{0}},\qquad I_{0}=10^{-12}
  solution: |-
    a) L = 10\cdot\log\frac{10^{-6}}{10^{-12}} = 10\cdot\log 10^{6} = 10\cdot 6 = 60 dB.
    b) Z równania 85 = 10\cdot\log\frac{I}{I_{0}} otrzymujemy \log\frac{I}{I_{0}} = 8{,}5, czyli \frac{I}{I_{0}} = 10^{8{,}5}.
    Stąd I = 10^{-12}\cdot 10^{8{,}5} = 10^{-3{,}5} \approx 3{,}16\cdot 10^{-4}\ \frac{\text{W}}{\text{m}^{2}}.
    c) \frac{I_{\text{młot}}}{I_{\text{odkurzacz}}} = \frac{10^{-3{,}5}}{10^{-6}} = 10^{2{,}5} \approx 316. Natężenie dźwięku młota jest około 316 razy większe (różnica 25 dB to czynnik 10^{2{,}5}, a nie 25).
    d) Jeśli natężenie wzrośnie ze I do 100I, to nowy poziom wynosi 10\cdot\log\frac{100I}{I_{0}} = 10\cdot\left(\log 100 + \log\frac{I}{I_{0}}\right) = 10\cdot 2 + L = L + 20, czyli poziom rośnie dokładnie o 20 dB. Rozumowanie odwrotne daje tezę.
  solution_steps:
  - 'Podstawiamy I=10^{-6} i I_{0}=10^{-12}: \frac{I}{I_{0}}=10^{6}, więc L=10\cdot 6=60 dB.'
  - Z 85=10\cdot\log\frac{I}{I_{0}} wyznaczamy \log\frac{I}{I_{0}}=8{,}5.
  - 'Przechodzimy do postaci wykładniczej: I = 10^{-12}\cdot 10^{8{,}5}=10^{-3{,}5}\approx 3{,}16\cdot
    10^{-4}\ \frac{\text{W}}{\text{m}^{2}}.'
  - 'Liczymy iloraz natężeń: \frac{10^{-3{,}5}}{10^{-6}}=10^{2{,}5}\approx 316.'
  - 'Uzasadniamy: 10\cdot\log\frac{100I}{I_{0}}=10\cdot\log 100+10\cdot\log\frac{I}{I_{0}}=L+20.'
  answer:
    kind: MULTIPART
    parts:
    - name: poziom dla odkurzacza
      answer:
        kind: NUMERIC
        value: 60.0
        tol: 1.0e-06
        latex: 60\ \text{dB}
    - name: natężenie dla 85 dB
      answer:
        kind: NUMERIC
        value: 0.000316227766
        tol: 1.0e-06
        latex: 3{,}16\cdot 10^{-4}\ \frac{\text{W}}{\text{m}^{2}}
    - name: krotność natężeń
      answer:
        kind: NUMERIC
        value: 316.227766
        tol: 0.5
        latex: 10^{2{,}5}\approx 316
    - name: uzasadnienie wzrostu o 20 dB
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma wykazać rachunkiem, że 10\cdot\log\frac{100I}{I_{0}} = 10\cdot\log 100 + 10\cdot\log\frac{I}{I_{0}}
          = L + 20, czyli stukrotny wzrost natężenia odpowiada wzrostowi poziomu o 20 dB.
  checks:
  - kind: evaluate
    expr: 10\cdot\log_{10}\left(\frac{10^{-6}}{10^{-12}}\right)
    var: I
    part: poziom dla odkurzacza
  - kind: evaluate
    expr: 10^{-12}\cdot 10^{\frac{85}{10}}
    var: I
    part: natężenie dla 85 dB
  - kind: evaluate
    expr: 10^{\frac{85-60}{10}}
    var: I
    part: krotność natężeń
  skills:
  - praca ze skalą logarytmiczną
  - przechodzenie między postacią logarytmiczną a wykładniczą
  - interpretacja krotności
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie wzrostu o 20 dB · 3/3 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: budowanie i stosowanie modelu wykładniczego (zanik)
  statement: |-
    Liczebność populacji pewnego gatunku ryb w jeziorze maleje wykładniczo, tzn. opisuje ją wzór N(t)=N_{0}\cdot q^{t}, gdzie t jest czasem w latach liczonym od początku roku 2015. Na początku roku 2015 populacja liczyła 12000 osobników, a na początku roku 2021 — 3000 osobników.
    a) Wyznacz wzór opisujący liczebność populacji po t latach.
    b) Oblicz, ile osobników będzie liczyła ta populacja na początku roku 2027.
    c) Na początku którego roku liczebność populacji będzie po raz pierwszy mniejsza niż 500 osobników? Przyjmij \log 2 \approx 0{,}301 oraz \log 3 \approx 0{,}477.
  statement_latex: N(t)=12000\cdot\left(\frac{1}{2}\right)^{\frac{t}{3}}
  solution: |-
    a) W ciągu 6 lat liczebność zmalała z 12000 do 3000, czyli \frac{3000}{12000}=\frac{1}{4}=\left(\frac{1}{2}\right)^{2}. Oznacza to, że w ciągu 6 lat nastąpiły dwa połowienia, więc czas połowienia wynosi T=\frac{6}{2}=3 lata. Zatem N(t)=12000\cdot\left(\frac{1}{2}\right)^{\frac{t}{3}}. Sprawdzenie: N(6)=12000\cdot\left(\frac{1}{2}\right)^{2}=3000. ✓
    b) Początek roku 2027 to t=12, więc N(12)=12000\cdot\left(\frac{1}{2}\right)^{\frac{12}{3}}=12000\cdot\left(\frac{1}{2}\right)^{4}=\frac{12000}{16}=750 osobników.
    c) Szukamy najmniejszej liczby całkowitej t\ge 0 takiej, że 12000\cdot\left(\frac{1}{2}\right)^{\frac{t}{3}}<500, czyli \left(\frac{1}{2}\right)^{\frac{t}{3}}<\frac{1}{24}. Podstawa \frac{1}{2}\in(0,1), więc funkcja jest malejąca i znak nierówności między wykładnikami się odwraca: \frac{t}{3}>\log_{2}24. Ponieważ \log_{2}24=\frac{\log 24}{\log 2}=\frac{3\log 2+\log 3}{\log 2}\approx\frac{0{,}903+0{,}477}{0{,}301}=\frac{1{,}380}{0{,}301}\approx 4{,}585, to t>3\cdot 4{,}585\approx 13{,}75. Najmniejsza liczba całkowita to t=14. Sprawdzenie: N(13)=12000\cdot\left(\frac{1}{2}\right)^{\frac{13}{3}}\approx 595>500, a N(14)\approx 472<500. Rok: 2015+14=2029.
  solution_steps:
  - 'Oblicz krotność zmiany: 3000:12000=\frac{1}{4}=\left(\frac{1}{2}\right)^{2}.'
  - Stąd dwa połowienia w 6 lat, czyli T=3 lata i N(t)=12000\cdot\left(\frac{1}{2}\right)^{\frac{t}{3}}.
  - 'Podstaw t=12: N(12)=12000\cdot\left(\frac{1}{2}\right)^{4}=750.'
  - Zapisz nierówność 12000\cdot\left(\frac{1}{2}\right)^{\frac{t}{3}}<500, czyli \left(\frac{1}{2}\right)^{\frac{t}{3}}<\frac{1}{24}.
  - 'Skorzystaj z malejącej monotoniczności: \frac{t}{3}>\log_{2}24\approx 4{,}585, więc t>13{,}75.'
  - Najmniejsza liczba całkowita t=14, czyli początek roku 2029.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor
      answer:
        kind: SYMBOLIC
        latex: N(t)=12000\cdot\left(\frac{1}{2}\right)^{\frac{t}{3}}
    - name: liczebnosc_2027
      answer:
        kind: NUMERIC
        value: 750.0
        tol: 1.0e-06
    - name: rok
      answer:
        kind: NUMERIC
        value: 2029.0
  checks:
  - kind: evaluate
    expr: 12000\cdot\left(\frac{1}{2}\right)^{\frac{12}{3}}
    var: t
    part: liczebnosc_2027
  - kind: evaluate
    expr: 2015+\left\lceil \frac{3\cdot\log 24}{\log 2} \right\rceil
    var: t
    part: rok
  stated_model:
    variable: t
    objective_latex: N(t)=12000\cdot\left(\frac{1}{2}\right)^{\frac{t}{3}}
    domain_lo: '0'
    domain_lo_open: false
    goal: value
    constraint_used: N(0)=12000,\ N(6)=3000
  skills:
  - budowanie modelu N(t)=N_0 q^t z dwóch pomiarów
  - rozpoznanie krotności jako potęgi liczby 2
  - obliczanie wartości modelu
  - rozwiązywanie nierówności wykładniczej z użyciem logarytmu
