      = \\frac{a^{3} \\cdot \\sqrt{3}}{6}'') — human review'
- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: położenie punktu na krawędzi z warunku prostopadłości
  statement: Dany jest prostopadłościan $ABCDA'B'C'D'$, w którym podstawa $ABCD$ jest kwadratem o boku
    $4$, a krawędzie boczne $AA'$, $BB'$, $CC'$, $DD'$ mają długość $10$ i są prostopadłe do płaszczyzny
    podstawy (punkty $A'$, $B'$, $C'$, $D'$ leżą odpowiednio nad $A$, $B$, $C$, $D$). Punkt $P$ leży na
    krawędzi $CC'$ i jest tak dobrany, że odcinki $PA'$ i $PB$ są prostopadłe oraz $|CP| > |PC'|$. Oblicz
    długość odcinka $CP$ oraz tangens kąta nachylenia prostej $BP$ do płaszczyzny podstawy $ABCD$.
  statement_latex: \left|A'P\right|^{2} + \left|PB\right|^{2} = \left|A'B\right|^{2},\qquad \left(32 +
    \left(10 - x\right)^{2}\right) + \left(16 + x^{2}\right) = 116
  solution: |-
    Oznaczmy $|CP| = x$, gdzie $x \in \left(0;\,10\right)$; wtedy $|PC'| = 10 - x$.

    Krok 1. $|PB|$: trójkąt $BCP$ ma kąt prosty przy $C$ (bo $CC' \perp$ podstawa, więc $CP \perp CB$), zatem
    $$|PB|^{2} = 4^{2} + x^{2} = 16 + x^{2}.$$

    Krok 2. $|A'P|$: trójkąt $A'C'P$ ma kąt prosty przy $C'$ (bo $CC' \perp$ górna podstawa, więc $C'P \perp C'A'$), a $|A'C'| = 4 \cdot \sqrt{2}$ jako przekątna kwadratu, zatem
    $$|A'P|^{2} = \left(4 \cdot \sqrt{2}\right)^{2} + \left(10 - x\right)^{2} = 32 + \left(10 - x\right)^{2}.$$

    Krok 3. $|A'B|$: trójkąt $A'AB$ ma kąt prosty przy $A$, więc $|A'B|^{2} = 10^{2} + 4^{2} = 116$.

    Krok 4. Warunek $PA' \perp PB$ oznacza, że trójkąt $A'PB$ ma kąt prosty przy $P$, czyli
    $$\left(32 + \left(10 - x\right)^{2}\right) + \left(16 + x^{2}\right) = 116.$$
    Po uporządkowaniu: $2x^{2} - 20x + 32 = 0$, czyli $x^{2} - 10x + 16 = 0$. Wyróżnik $\Delta = 100 - 64 = 36$, $\sqrt{\Delta} = 6$, więc $x = 2$ lub $x = 8$. Oba punkty leżą na krawędzi, ale warunek $|CP| > |PC'|$ (czyli $x > 5$) spełnia tylko $x = 8$. Zatem $|CP| = 8$.

    Krok 5. Rzutem prostokątnym punktu $P$ na płaszczyznę podstawy jest punkt $C$ (bo $PC \perp$ podstawa), więc rzutem odcinka $BP$ jest $BC$, a szukanym kątem jest $\angle PBC$. W trójkącie prostokątnym $BCP$:
    $$\operatorname{tg}\angle PBC = \frac{|CP|}{|BC|} = \frac{8}{4} = 2.$$
  solution_steps:
  - Wprowadź $x = |CP|$, $x \in (0;10)$, oraz $|PC'| = 10 - x$.
  - 'Z trójkąta prostokątnego $BCP$: $|PB|^{2} = 16 + x^{2}$.'
  - 'Z trójkąta prostokątnego $A''C''P$ (przekątna $|A''C''| = 4\sqrt{2}$): $|A''P|^{2} = 32 + (10-x)^{2}$.'
  - 'Z trójkąta prostokątnego $A''AB$: $|A''B|^{2} = 116$.'
  - Z warunku $PA' \perp PB$ zapisz $|A'P|^{2} + |PB|^{2} = |A'B|^{2}$ i doprowadź do $x^{2} - 10x + 16
    = 0$.
  - 'Rozwiąż: $x = 2$ lub $x = 8$; warunek $|CP| > |PC''|$ eliminuje $x = 2$, więc $|CP| = 8$.'
  - Rzutem $P$ na podstawę jest $C$, więc $\operatorname{tg}\angle PBC = \frac{8}{4} = 2$.
  answer:
    kind: MULTIPART
    parts:
    - name: CP
      answer:
        kind: NUMERIC
        value: 8.0
        latex: '8'
    - name: tg_kata
      answer:
        kind: NUMERIC
        value: 2.0
        latex: '2'
  checks:
  - kind: evaluate
    expr: \frac{10 + \sqrt{100 - 4 \cdot 16}}{2}
    part: CP
  - kind: evaluate
    expr: \frac{8}{4}
    part: tg_kata
  stated_model:
    variable: x
    objective_latex: \left(32 + \left(10 - x\right)^{2}\right) + \left(16 + x^{2}\right) = 116
    domain_lo: '0'
    domain_hi: '10'
    goal: value
    constraint_used: \left|CP\right| > \left|PC'\right|
  skills:
  - wielokrotne stosowanie twierdzenia Pitagorasa w bryle
  - warunek prostopadłości odcinków jako równanie kwadratowe
  - odrzucenie rozwiązania niespełniającego warunku dodatkowego
  - kąt prostej z płaszczyzną podstawy
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''x'': ''\\left(32
      + \\left(10 - x\\right)^{2}\\right) + \\left(16 + x^{2}\\right) = 116'') — human review'
- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie: wzór z dziedziną, kąt dwuścienny i kontrola warunku zewnętrznego'
  statement: |-
    Szkielet namiotu ma kształt ostrosłupa prawidłowego czworokątnego. Suma długości krawędzi podstawy tego ostrosłupa i jego wysokości jest równa $12$ m. Długość krawędzi podstawy (wyrażoną w metrach) oznaczmy przez $x$.
    a) Wyznacz wzór na tangens kąta nachylenia ściany bocznej namiotu do płaszczyzny podstawy jako funkcję zmiennej $x$ i podaj dziedzinę tej funkcji.
    b) Wyznacz tę wartość $x$, dla której ściana boczna jest nachylona do płaszczyzny podstawy pod kątem $45^\circ$, i oblicz odpowiadającą jej wysokość namiotu. Namiot ma stanąć w hali o wysokości $4{,}5$ m — rozstrzygnij, czy się w niej zmieści.
    c) Dla wyznaczonej w punkcie b) wartości $x$ oblicz tangens kąta nachylenia krawędzi bocznej namiotu do płaszczyzny podstawy.
  statement_latex: \operatorname{tg}\beta\left(x\right) = \frac{12 - x}{\frac{x}{2}} = \frac{2 \cdot \left(12
    - x\right)}{x}
  solution: |-
    a) Niech $x$ — krawędź podstawy, wtedy wysokość ostrosłupa $H = 12 - x$. Niech $O$ będzie środkiem podstawy, a $M$ — środkiem krawędzi podstawy. Wtedy $OM \perp$ krawędź podstawy i apotema $SM \perp$ krawędź podstawy, więc kątem liniowym kąta dwuściennego ściana boczna–podstawa jest $\beta = \angle SMO$. W trójkącie prostokątnym $SOM$ mamy $|OM| = r = \frac{x}{2}$ oraz $|SO| = H = 12 - x$, zatem
    $$\operatorname{tg}\beta\left(x\right) = \frac{12 - x}{\frac{x}{2}} = \frac{2 \cdot \left(12 - x\right)}{x}.$$
    Dziedzina: musi być $x > 0$ oraz $H = 12 - x > 0$, czyli $x \in \left(0;\,12\right)$.

    b) Warunek $\beta = 45^\circ$ oznacza $\operatorname{tg}\beta = 1$:
    $$\frac{2 \cdot \left(12 - x\right)}{x} = 1 \iff 24 - 2x = x \iff 3x = 24 \iff x = 8,$$
    i $x = 8 \in \left(0;\,12\right)$. Wtedy wysokość namiotu $H = 12 - 8 = 4$ (m). Ponieważ $4 < 4{,}5$, namiot zmieści się w hali.

    c) Rzutem krawędzi bocznej $SA$ na podstawę jest odcinek $OA$ o długości $R = \frac{x \cdot \sqrt{2}}{2} = \frac{8 \cdot \sqrt{2}}{2} = 4 \cdot \sqrt{2}$. Zatem
    $$\operatorname{tg}\alpha = \frac{H}{R} = \frac{4}{4 \cdot \sqrt{2}} = \frac{\sqrt{2}}{2} \approx 0{,}7071.$$
    Wynik jest zgodny z regułą $R > r$: $\operatorname{tg}\alpha < \operatorname{tg}\beta = 1$, czyli $\alpha < 45^\circ$.
  solution_steps:
  - Wprowadź $x$ — krawędź podstawy; z warunku sumy $H = 12 - x$.
  - Zbuduj kąt liniowy $\beta = \angle SMO$ ($M$ — środek krawędzi podstawy), $r = \frac{x}{2}$.
  - Zapisz wzór $\operatorname{tg}\beta(x) = \frac{2(12-x)}{x}$.
  - 'Wyznacz dziedzinę z warunków $x > 0$ i $12 - x > 0$: $x \in (0;12)$.'
  - Rozwiąż $\frac{2(12-x)}{x} = 1$, skąd $x = 8$, a $H = 12 - 8 = 4$.
  - 'Porównaj $H = 4$ z ograniczeniem $4{,}5$ m: warunek spełniony, namiot się mieści.'
  - Oblicz $R = \frac{8\sqrt{2}}{2} = 4\sqrt{2}$ i $\operatorname{tg}\alpha = \frac{4}{4\sqrt{2}} = \frac{\sqrt{2}}{2}$.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor
      answer:
        kind: SYMBOLIC
        latex: \frac{2 \cdot \left(12 - x\right)}{x}
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '12'
    - name: x
      answer:
        kind: NUMERIC
        value: 8.0
        latex: '8'
    - name: wysokosc
      answer:
        kind: NUMERIC
        value: 4.0
        latex: '4'
    - name: czy_miesci
      answer:
        kind: BOOLEAN
        truth: true
    - name: tg_alfa
      answer:
        kind: NUMERIC
        value: 0.7071067811865476
        tol: 1.0e-06
        latex: \frac{\sqrt{2}}{2}
