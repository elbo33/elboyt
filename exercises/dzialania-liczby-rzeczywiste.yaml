- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 1
  exercise_type: zapis zbioru w postaci przedziału
  statement: 'Dany jest zbiór A = \left\{x \in \mathbb{R} : -3 \leq x < 7\right\}. Zapisz zbiór A w postaci
    przedziału oraz oblicz jego długość.'
  statement_latex: 'A = \left\{x \in \mathbb{R} : -3 \leq x < 7\right\}'
  solution: |-
    Lewy koniec: warunek x \geq -3 jest nieostry, więc liczba -3 należy do zbioru — nawias domknięty.
    Prawy koniec: warunek x < 7 jest ostry, więc liczba 7 nie należy do zbioru — nawias okrągły.
    Zatem A = \langle -3, 7\right).
    Długość przedziału ograniczonego o końcach a < b wynosi d = b - a, czyli d = 7 - \left(-3\right) = 10.
    Odpowiedź: A = \langle -3, 7\right), długość równa 10.
  solution_steps:
  - Znak ≥ przy lewym końcu → nawias domknięty w −3.
  - Znak < przy prawym końcu → nawias okrągły w 7.
  - 'Zapisz przedział: A = ⟨−3, 7).'
  - 'Oblicz długość: d = 7 − (−3) = 10.'
  answer:
    kind: MULTIPART
    parts:
    - name: przedział A
      answer:
        kind: INTERVAL
        lo: '-3'
        hi: '7'
        lo_open: false
    - name: długość przedziału
      answer:
        kind: NUMERIC
        value: 10.0
  checks:
  - kind: evaluate
    expr: 7 - \left(-3\right)
    part: długość przedziału
  skills:
  - zapis przedziału
  - dobór nawiasu do znaku nierówności
  - długość przedziału
  verification:
    checkability: REFERENCE_CALL
    note: '2 parts matched · det: [długość przedziału] SymPy solved it fresh: 10.0 vs 10.0 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: działania na pierwiastkach
  statement: Oblicz wartość wyrażenia \sqrt{75} - \sqrt{27} + \frac{6}{\sqrt{3}}. Wynik zapisz w postaci
    a\sqrt{3}, gdzie a jest liczbą całkowitą.
  statement_latex: \sqrt{75} - \sqrt{27} + \frac{6}{\sqrt{3}}
  solution: |-
    Wyłączamy pełne kwadraty spod pierwiastków:
    \sqrt{75} = \sqrt{25\cdot 3} = 5\sqrt{3}, \qquad \sqrt{27} = \sqrt{9\cdot 3} = 3\sqrt{3}.
    Usuwamy niewymierność z mianownika:
    \frac{6}{\sqrt{3}} = \frac{6\cdot\sqrt{3}}{3} = 2\sqrt{3}.
    Wszystkie składniki są pierwiastkami podobnymi (zawierają \sqrt{3}), więc:
    5\sqrt{3} - 3\sqrt{3} + 2\sqrt{3} = \left(5 - 3 + 2\right)\sqrt{3} = 4\sqrt{3}.
    Odpowiedź: 4\sqrt{3}.
  solution_steps:
  - √75 = √(25·3) = 5√3.
  - √27 = √(9·3) = 3√3.
  - 'Usuń niewymierność: 6/√3 = 6√3/3 = 2√3.'
  - 'Zredukuj pierwiastki podobne: (5 − 3 + 2)√3 = 4√3.'
  answer:
    kind: SYMBOLIC
    latex: 4\sqrt{3}
  checks:
  - kind: simplify
    expr: \sqrt{75} - \sqrt{27} + \frac{6}{\sqrt{3}}
  skills:
  - wyłączanie czynnika przed znak pierwiastka
  - redukcja pierwiastków podobnych
  - usuwanie niewymierności z mianownika
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''4\\sqrt{3}'' vs ''4*sqrt(3)'''
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: obliczanie wartości wyrażenia z potęgami i logarytmem
  statement: Oblicz wartość wyrażenia \left(\frac{2}{3}\right)^{-2}\cdot 27^{\frac{2}{3}} - \log_{2}\left(\frac{1}{16}\right).
    Wynik podaj w postaci ułamka nieskracalnego.
  statement_latex: \left(\frac{2}{3}\right)^{-2}\cdot 27^{\frac{2}{3}} - \log_{2}\left(\frac{1}{16}\right)
  solution: |-
    Pierwszy czynnik: ujemny wykładnik oznacza odwrotność podstawy, więc \left(\frac{2}{3}\right)^{-2} = \left(\frac{3}{2}\right)^{2} = \frac{9}{4}.
    Drugi czynnik: 27 = 3^{3}, zatem 27^{\frac{2}{3}} = \left(3^{3}\right)^{\frac{2}{3}} = 3^{2} = 9.
    Iloczyn: \frac{9}{4}\cdot 9 = \frac{81}{4}.
    Logarytm: \frac{1}{16} = 2^{-4}, więc \log_{2}\left(\frac{1}{16}\right) = -4.
    Całe wyrażenie: \frac{81}{4} - \left(-4\right) = \frac{81}{4} + \frac{16}{4} = \frac{97}{4}.
    Odpowiedź: \frac{97}{4} = 24{,}25.
  solution_steps:
  - (2/3)⁻² = (3/2)² = 9/4.
  - 27^(2/3) = (3³)^(2/3) = 3² = 9.
  - 'Pomnóż: (9/4)·9 = 81/4.'
  - log₂(1/16) = log₂2⁻⁴ = −4.
  - 'Odejmij: 81/4 − (−4) = 81/4 + 16/4 = 97/4.'
  answer:
    kind: NUMERIC
    value: 24.25
  checks:
  - kind: evaluate
    expr: \left(\frac{2}{3}\right)^{-2}\cdot 27^{\frac{2}{3}} - \log_{2}\left(\frac{1}{16}\right)
  skills:
  - potęga o wykładniku ujemnym
  - potęga o wykładniku wymiernym
  - definicja logarytmu
  - kolejność działań
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 24.25 vs 24.25 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: działania na przedziałach
  statement: Dane są przedziały A = \left(-4, 3\right\rangle oraz B = \left\langle -1, 7\right). Wyznacz
    A \cap B, A \cup B oraz A \setminus B, podaj liczbę wszystkich liczb całkowitych należących do A \cap
    B, a także zaznacz przedziały A i B na jednej osi liczbowej (jeden pod drugim), poprawnie odróżniając
    końce należące i nienależące do zbiorów.
  statement_latex: A = \left(-4, 3\right\rangle,\qquad B = \left\langle -1, 7\right)
  solution: |-
    Zaznaczamy oba przedziały jeden pod drugim: A to odcinek od -4 (kółko puste) do 3 (kółko pełne), B to odcinek od -1 (kółko pełne) do 7 (kółko puste).

    A \cap B: liczby spełniające jednocześnie -4 < x \leq 3 oraz -1 \leq x < 7, czyli -1 \leq x \leq 3. Koniec -1 należy do B (nawias domknięty) i do A (bo -1 > -4), więc należy do części wspólnej; koniec 3 należy do A (nawias domknięty) i do B (bo 3 < 7). Zatem A \cap B = \left\langle -1, 3\right\rangle.

    A \cup B: przedziały zachodzą na siebie, więc suma jest jednym przedziałem od -4 (bez -4) do 7 (bez 7): A \cup B = \left(-4, 7\right).

    A \setminus B: liczby z A, które nie należą do B, czyli -4 < x \leq 3 oraz x < -1. Otrzymujemy A \setminus B = \left(-4, -1\right); liczba -1 nie należy, bo należy do B.

    Liczby całkowite w A \cap B = \left\langle -1, 3\right\rangle to: -1, 0, 1, 2, 3 — jest ich 5 (można je policzyć jako 3 - \left(-1\right) + 1).

    Odpowiedź: A \cap B = \left\langle -1, 3\right\rangle, A \cup B = \left(-4, 7\right), A \setminus B = \left(-4, -1\right), liczb całkowitych jest 5.
  solution_steps:
  - Zaznacz A = (−4, 3⟩ i B = ⟨−1, 7) na jednej osi, jeden pod drugim.
  - 'Część wspólna: −1 ≤ x ≤ 3, oba końce należą, więc A ∩ B = ⟨−1, 3⟩.'
  - 'Suma: przedziały zachodzą na siebie, więc A ∪ B = (−4, 7).'
  - 'Różnica: liczby z A na lewo od −1, czyli A \ B = (−4, −1).'
  - 'Policz liczby całkowite w ⟨−1, 3⟩: −1, 0, 1, 2, 3 → 3 − (−1) + 1 = 5.'
  answer:
    kind: MULTIPART
    parts:
    - name: A przecięte B
      answer:
        kind: INTERVAL
        lo: '-1'
        hi: '3'
        lo_open: false
        hi_open: false
    - name: A suma B
      answer:
        kind: INTERVAL
        lo: '-4'
        hi: '7'
    - name: A minus B
      answer:
        kind: INTERVAL
        lo: '-4'
        hi: '-1'
    - name: liczba liczb całkowitych w A przecięte B
      answer:
        kind: NUMERIC
        value: 5.0
    - name: zaznaczenie na osi
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: 'Uczeń ma narysować oś liczbową i zaznaczyć na niej przedziały A = (−4, 3⟩ oraz B = ⟨−1,
          7): puste kółko w −4 i w 7, pełne kółko w −1 i w 3, pogrubione odpowiednie fragmenty osi.'
  checks:
  - kind: evaluate
    expr: 3 - \left(-1\right) + 1
    part: liczba liczb całkowitych w A przecięte B
  skills:
  - część wspólna przedziałów
  - suma przedziałów
  - różnica przedziałów
  - przynależność końców
  - zaznaczanie przedziału na osi
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: zaznaczenie na osi · 1/4 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: obliczanie wartości wyrażenia z potęgami, pierwiastkami i logarytmem
  statement: |-
    Dane jest wyrażenie
    \[ W = \frac{\sqrt{18}-\sqrt{50}}{\sqrt{2}} + \left(\frac{2}{3}\right)^{-2}\cdot 8^{\frac{2}{3}} + \log_{5}\left(\frac{1}{25}\right). \]
    a) Oblicz wartość liczby $W$.
    b) Rozstrzygnij, czy liczba $W$ należy do przedziału $\left\langle 2\sqrt{5},\ 3\sqrt{3}\right)$.
  statement_latex: W = \frac{\sqrt{18}-\sqrt{50}}{\sqrt{2}} + \left(\frac{2}{3}\right)^{-2}\cdot 8^{\frac{2}{3}}
    + \log_{5}\left(\frac{1}{25}\right)
  solution: |-
    a) Liczymy osobno trzy składniki (kreska ułamkowa pełni rolę nawiasu).
    Pierwszy składnik: wyłączamy pełne kwadraty: $\sqrt{18}=\sqrt{9\cdot 2}=3\sqrt{2}$, $\sqrt{50}=\sqrt{25\cdot 2}=5\sqrt{2}$. Zatem licznik to $3\sqrt{2}-5\sqrt{2}=-2\sqrt{2}$ i
    $\frac{-2\sqrt{2}}{\sqrt{2}}=-2$.
    Drugi składnik: ujemny wykładnik oznacza odwrotność podstawy: $\left(\frac{2}{3}\right)^{-2}=\left(\frac{3}{2}\right)^{2}=\frac{9}{4}$, a $8^{\frac{2}{3}}=\left(\sqrt[3]{8}\right)^{2}=2^{2}=4$. Stąd $\frac{9}{4}\cdot 4 = 9$.
    Trzeci składnik: $\frac{1}{25}=5^{-2}$, więc z definicji logarytmu $\log_{5}\left(\frac{1}{25}\right)=-2$.
    Razem: $W=-2+9+(-2)=5$.

    b) Porównujemy $W=5$ z końcami przedziału, wciągając czynniki pod pierwiastek:
    $2\sqrt{5}=\sqrt{4\cdot 5}=\sqrt{20}$, $3\sqrt{3}=\sqrt{9\cdot 3}=\sqrt{27}$, a $5=\sqrt{25}$.
    Ponieważ $20 \le 25 < 27$, to $2\sqrt{5}\le 5 < 3\sqrt{3}$, czyli liczba $W$ należy do przedziału $\left\langle 2\sqrt{5},\ 3\sqrt{3}\right)$.

    Odpowiedź: a) $W=5$; b) tak, $W$ należy do tego przedziału.
  solution_steps:
  - 'Wyłącz pełne kwadraty: √18 = 3√2, √50 = 5√2, więc licznik pierwszego ułamka to −2√2.'
  - 'Podziel: (−2√2) : √2 = −2.'
  - 'Zamień potęgę o ujemnym wykładniku na odwrotność: (2/3)^(−2) = (3/2)² = 9/4.'
  - 'Oblicz potęgę o wykładniku wymiernym: 8^(2/3) = (∛8)² = 4, więc (9/4)·4 = 9.'
  - 'Z definicji logarytmu: 1/25 = 5^(−2), zatem log_5(1/25) = −2.'
  - 'Dodaj składniki: W = −2 + 9 − 2 = 5.'
  - 'Porównaj końce przedziału z liczbą 5: 2√5 = √20, 3√3 = √27, 5 = √25, a 20 ≤ 25 < 27.'
  - 'Wniosek: W ∈ ⟨2√5, 3√3).'
  answer:
    kind: MULTIPART
    parts:
    - name: W
      answer:
        kind: NUMERIC
        value: 5.0
    - name: przynaleznosc_do_przedzialu
      answer:
        kind: BOOLEAN
        truth: true
  checks:
  - kind: evaluate
    expr: \frac{\sqrt{18}-\sqrt{50}}{\sqrt{2}} + \left(\frac{2}{3}\right)^{-2} \cdot 8^{\frac{2}{3}} +
      \log_{5}\left(\frac{1}{25}\right)
    part: W
  skills:
  - kolejność wykonywania działań
  - potęga o wykładniku ujemnym i wymiernym
  - wyłączanie czynnika przed znak pierwiastka
  - logarytm z definicji
  - porównywanie liczb niewymiernych
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: działania na przedziałach liczbowych
  statement: |-
    Dane są zbiory $A=\left\langle -3,\,4\right)$ oraz $B=\left\{x\in\mathbb{R}:\ 1<x\le 9\right\}$.
    a) Wyznacz zbiory $A\cap B$, $A\cup B$ oraz $B\setminus A$ i zapisz je w postaci przedziałów.
    b) Zapisz zbiór $\mathbb{R}\setminus A$ jako sumę przedziałów.
    c) Podaj liczbę liczb całkowitych należących do zbioru $B\setminus A$ oraz długość przedziału $A\cup B$.
  statement_latex: A=\left\langle -3,\,4\right),\qquad B=\left\{x\in\mathbb{R}:\ 1<x\le 9\right\}
  solution: |-
    Najpierw zapisujemy $B$ jako przedział: warunek $1<x\le 9$ (znak ostry przy 1, znak $\le$ przy 9) daje $B=\left(1,\,9\right\rangle$.
    Zaznaczamy oba przedziały jeden pod drugim na osi: $A$ od $-3$ (kółko pełne) do $4$ (kółko puste), $B$ od $1$ (kółko puste) do $9$ (kółko pełne).

    a) Część wspólna to "zakładka": liczby spełniające jednocześnie $-3\le x<4$ oraz $1<x\le 9$, czyli $1<x<4$. Końce: $1\notin B$, $4\notin A$, więc oba nawiasy okrągłe:
    $A\cap B=\left(1,\,4\right)$.
    Suma to wszystko, co zamalowane na co najmniej jednym rysunku: od $-3$ (należy, bo $-3\in A$) do $9$ (należy, bo $9\in B$); przedziały zachodzą na siebie, więc suma jest jednym przedziałem:
    $A\cup B=\left\langle -3,\,9\right\rangle$.
    Różnica $B\setminus A$ to liczby z $B$, których nie ma w $A$: $1<x\le 9$ oraz $x\ge 4$ (bo liczby mniejsze od 4 są w $A$). Liczba $4$ nie należy do $A$, więc należy do różnicy:
    $B\setminus A=\left\langle 4,\,9\right\rangle$.

    b) Dopełnienie $A=\left\langle -3,4\right)$ to liczby $x<-3$ lub $x\ge 4$. Są to dwie rozłączne półproste, więc zapisujemy je jako sumę:
    $\mathbb{R}\setminus A=\left(-\infty,\,-3\right)\cup\left[4,\,+\infty\right)$ (przy $\pm\infty$ zawsze nawias okrągły).

    c) Liczby całkowite w $\left\langle 4,9\right\rangle$ to $4,5,6,7,8,9$ — jest ich $9-4+1=6$.
    Długość przedziału $A\cup B=\left\langle -3,9\right\rangle$ wynosi $9-\left(-3\right)=12$.
  solution_steps:
  - 'Zapisz B z nierówności: 1 < x ≤ 9 daje B = (1, 9⟩.'
  - Zaznacz A i B na jednej osi, jeden pod drugim, i rozstrzygnij o każdym końcu osobno.
  - 'A ∩ B: warunki −3 ≤ x < 4 i 1 < x ≤ 9 dają 1 < x < 4, czyli (1, 4).'
  - 'A ∪ B: przedziały zachodzą na siebie, więc suma to ⟨−3, 9⟩.'
  - 'B \ A: liczby z B o x ≥ 4, czyli ⟨4, 9⟩ (4 nie należy do A).'
  - 'R \ A: x < −3 lub x ≥ 4, czyli (−∞, −3) ∪ [4, +∞).'
  - 'Policz liczby całkowite w ⟨4, 9⟩: 9 − 4 + 1 = 6.'
  - 'Oblicz długość A ∪ B: 9 − (−3) = 12.'
  answer:
    kind: MULTIPART
    parts:
    - name: A_przeciecie_B
      answer:
        kind: INTERVAL
        lo: '1'
        hi: '4'
    - name: A_suma_B
      answer:
        kind: INTERVAL
        lo: '-3'
        hi: '9'
        lo_open: false
        hi_open: false
    - name: B_minus_A
      answer:
        kind: INTERVAL
        lo: '4'
        hi: '9'
        lo_open: false
        hi_open: false
    - name: dopelnienie_A
      answer:
        kind: SYMBOLIC
        latex: \left(-\infty,\,-3\right)\cup\left[4,\,+\infty\right)
    - name: liczba_calkowitych_w_B_minus_A
      answer:
        kind: NUMERIC
        value: 6.0
    - name: dlugosc_A_suma_B
      answer:
        kind: NUMERIC
        value: 12.0
  checks:
  - kind: evaluate
    expr: 9 - 4 + 1
    part: liczba_calkowitych_w_B_minus_A
  - kind: evaluate
    expr: 9 - \left(-3\right)
    part: dlugosc_A_suma_B
  skills:
  - zapis zbioru w postaci przedziału
  - część wspólna, suma i różnica przedziałów
  - rozstrzyganie o przynależności końców
  - długość przedziału
  - zapis dopełnienia jako sumy przedziałów
  verification:
    checkability: REFERENCE_CALL
    note: 6 parts matched
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: wykrywanie błędu w rachunku na pierwiastkach
  statement: Oblicz wartość wyrażenia \sqrt{36+64} - \sqrt{169-144}. Pewien uczeń otrzymał wynik 13. Wskaż
    błąd w jego rozumowaniu i podaj poprawną wartość wyrażenia.
  statement_latex: \sqrt{36+64} - \sqrt{169-144}
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: uczeń „rozdzielił” pierwiastek na składniki sumy i różnicy:
    \sqrt{36+64} = \sqrt{36} + \sqrt{64} = 6 + 8 = 14 oraz \sqrt{169-144} = \sqrt{169} - \sqrt{144} = 13 - 12 = 1,
    skąd 14 - 1 = 13.

    DLACZEGO TO ŹLE: pierwiastkowanie jest rozdzielne tylko względem mnożenia i dzielenia (\sqrt{a\cdot b} = \sqrt{a}\cdot\sqrt{b}), a NIE względem dodawania i odejmowania: \sqrt{a+b} \neq \sqrt{a} + \sqrt{b}. Znak pierwiastka pełni rolę nawiasu — najpierw wykonujemy działanie pod pierwiastkiem.

    POPRAWNIE:
    \sqrt{36+64} = \sqrt{100} = 10, \qquad \sqrt{169-144} = \sqrt{25} = 5,
    zatem 10 - 5 = 5.

    Odpowiedź: 5 (a nie 13).
  solution_steps:
  - 'Błąd: uczeń zastosował nieistniejące „prawo” √(a+b) = √a + √b.'
  - 'Znak pierwiastka jest nawiasem: najpierw licz sumę/różnicę pod pierwiastkiem.'
  - √(36+64) = √100 = 10.
  - √(169−144) = √25 = 5.
  - 'Wynik: 10 − 5 = 5.'
  answer:
    kind: NUMERIC
    value: 5.0
  checks:
  - kind: evaluate
    expr: \sqrt{36+64} - \sqrt{169-144}
  skills:
  - pierwiastek z sumy
  - kolejność działań
  - pierwiastek jako nawias
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 5.0 vs 5.0 (tol 1e-09)'
- id: g-cm-07
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: wykrywanie błędu w rachunku na potęgach
  statement: Oblicz wartość wyrażenia -3^{4} + \left(-3\right)^{4} + \left(-2\right)^{3} - 2^{3}. Pewien
    uczeń otrzymał wynik 146, twierdząc, że „minus przy parzystym wykładniku znika”. Wskaż jego błąd i
    podaj poprawną wartość wyrażenia.
  statement_latex: -3^{4} + \left(-3\right)^{4} + \left(-2\right)^{3} - 2^{3}
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: uczeń uznał, że -3^{4} = \left(-3\right)^{4} = 81, a ponadto że \left(-2\right)^{3} = 2^{3} = 8, i policzył:
    81 + 81 + 8 - 8 = 162. Po poprawieniu jednego znaku otrzymał 146 — niezależnie od szczegółów, źródłem błędu jest utożsamienie -a^{n} z \left(-a\right)^{n}.

    DLACZEGO TO ŹLE: bez nawiasu potęgujemy tylko liczbę stojącą przy wykładniku, a minus zostaje z przodu: -3^{4} = -\left(3^{4}\right) = -81. Dopiero \left(-3\right)^{4} = 81, bo podstawą jest -3, a wykładnik jest parzysty. Podobnie \left(-2\right)^{3} = -8 (wykładnik nieparzysty, więc znak minus zostaje).

    POPRAWNIE:
    -3^{4} = -81, \qquad \left(-3\right)^{4} = 81, \qquad \left(-2\right)^{3} = -8, \qquad 2^{3} = 8,
    zatem -81 + 81 + \left(-8\right) - 8 = 0 - 8 - 8 = -16.

    Odpowiedź: -16.
  solution_steps:
  - 'Błąd: utożsamienie −aⁿ z (−a)ⁿ.'
  - 'Bez nawiasu: −3⁴ = −(3⁴) = −81; z nawiasem: (−3)⁴ = 81.'
  - (−2)³ = −8 (wykładnik nieparzysty), 2³ = 8.
  - 'Sumuj od lewej: −81 + 81 − 8 − 8 = −16.'
  answer:
    kind: NUMERIC
    value: -16.0
  checks:
  - kind: evaluate
    expr: -3^{4} + \left(-3\right)^{4} + \left(-2\right)^{3} - 2^{3}
  skills:
  - znak potęgi
  - rola nawiasu w podstawie potęgi
  - kolejność działań
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: -16.0 vs -16.0 (tol 1e-09)'
- id: g-cm-08
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: wykrywanie błędu w rachunku na potęgach o wykładniku ujemnym
  statement: Oblicz wartość wyrażenia 2^{-3} + \left(\frac{1}{4}\right)^{-2}. Pewien uczeń otrzymał wynik
    -24, uzasadniając, że „ujemny wykładnik daje ujemny wynik”. Wskaż jego błąd i podaj poprawną wartość
    wyrażenia.
  statement_latex: 2^{-3} + \left(\frac{1}{4}\right)^{-2}
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: uczeń przyjął, że 2^{-3} = -2^{3} = -8 oraz \left(\frac{1}{4}\right)^{-2} = -\left(4\right)^{2}\;\text{(z minusem)} = -16, i otrzymał -8 + \left(-16\right) = -24.

    DLACZEGO TO ŹLE: ujemny wykładnik nie zmienia znaku wyniku, tylko oznacza odwrotność: a^{-n} = \frac{1}{a^{n}}. Potęga liczby dodatniej jest zawsze dodatnia.

    POPRAWNIE:
    2^{-3} = \frac{1}{2^{3}} = \frac{1}{8}, \qquad \left(\frac{1}{4}\right)^{-2} = \left(\frac{4}{1}\right)^{2} = 16.
    Zatem \frac{1}{8} + 16 = \frac{1}{8} + \frac{128}{8} = \frac{129}{8} = 16{,}125.

    Odpowiedź: \frac{129}{8} = 16{,}125.
  solution_steps:
  - 'Błąd: potraktowanie ujemnego wykładnika jak znaku minus przed liczbą.'
  - 'Zastosuj a⁻ⁿ = 1/aⁿ: 2⁻³ = 1/8.'
  - 'Zastosuj (a/b)⁻ⁿ = (b/a)ⁿ: (1/4)⁻² = 4² = 16.'
  - 'Dodaj: 1/8 + 16 = 129/8 = 16,125.'
  answer:
    kind: NUMERIC
    value: 16.125
  checks:
  - kind: evaluate
    expr: 2^{-3} + \left(\frac{1}{4}\right)^{-2}
  skills:
  - potęga o wykładniku ujemnym
  - odwrotność liczby
  - działania na ułamkach
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 16.125 vs 16.125 (tol 1e-09)'
- id: g-cm-09
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: wykrywanie błędu przy pierwiastku z kwadratu
  statement: Oblicz wartość wyrażenia \sqrt{\left(-7\right)^{2}} + \sqrt{\left(3-8\right)^{2}}. Pewien
    uczeń otrzymał wynik -12, twierdząc, że pierwiastek „kasuje” kwadrat. Wskaż jego błąd i podaj poprawną
    wartość wyrażenia.
  statement_latex: \sqrt{\left(-7\right)^{2}} + \sqrt{\left(3-8\right)^{2}}
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: uczeń zastosował „regułę” \sqrt{a^{2}} = a i napisał
    \sqrt{\left(-7\right)^{2}} = -7 oraz \sqrt{\left(3-8\right)^{2}} = 3 - 8 = -5, skąd -7 + \left(-5\right) = -12.

    DLACZEGO TO ŹLE: pierwiastek arytmetyczny z liczby nieujemnej jest zawsze nieujemny, więc jego wartość nie może wynosić -7. Poprawna tożsamość to \sqrt{a^{2}} = \left|a\right| — pierwiastek „zjada” znak minus.

    POPRAWNIE:
    \sqrt{\left(-7\right)^{2}} = \sqrt{49} = 7 = \left|-7\right|, \qquad \sqrt{\left(3-8\right)^{2}} = \sqrt{\left(-5\right)^{2}} = \sqrt{25} = 5 = \left|-5\right|.
    Zatem 7 + 5 = 12.

    Odpowiedź: 12.
  solution_steps:
  - 'Błąd: użycie „reguły” √(a²) = a zamiast √(a²) = |a|.'
  - 'Oblicz działanie w nawiasie: 3 − 8 = −5.'
  - √((−7)²) = √49 = 7, √((−5)²) = √25 = 5.
  - 'Dodaj: 7 + 5 = 12.'
  answer:
    kind: NUMERIC
    value: 12.0
  checks:
  - kind: evaluate
    expr: \sqrt{\left(-7\right)^{2}} + \sqrt{\left(3-8\right)^{2}}
  skills:
  - √(a²) = |a|
  - pierwiastek arytmetyczny
  - wartość bezwzględna
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 12.0 vs 12.0 (tol 1e-09)'
- id: g-cm-10
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: rozróżnianie pierwiastka arytmetycznego i rozwiązań równania
  statement: Oblicz \sqrt{81} oraz wyznacz zbiór wszystkich rozwiązań rzeczywistych równania x^{2} = 81.
    Pewien uczeń napisał, że \sqrt{81} = \pm 9, „bo 9^{2} = 81 i \left(-9\right)^{2} = 81”. Wskaż jego
    błąd i podaj poprawne odpowiedzi.
  statement_latex: \sqrt{81}\quad\text{oraz}\quad x^{2} = 81
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: skoro 9^{2} = 81 i \left(-9\right)^{2} = 81, to \sqrt{81} = \pm 9, czyli pierwiastek ma dwie wartości.

    DLACZEGO TO ŹLE: symbol \sqrt{\ } oznacza pierwiastek arytmetyczny, czyli JEDYNĄ liczbę nieujemną, której kwadrat jest równy liczbie podpierwiastkowej. Wartość \sqrt{81} jest więc jedna: \sqrt{81} = 9. Dwie liczby pojawiają się dopiero jako rozwiązania równania x^{2} = 81, bo pytamy tam o wszystkie liczby o kwadracie 81.

    POPRAWNIE:
    \sqrt{81} = 9 (bo 9 \geq 0 i 9^{2} = 81).
    Równanie: x^{2} = 81 \iff x^{2} - 81 = 0 \iff \left(x-9\right)\left(x+9\right) = 0, czyli x = 9 lub x = -9. Zbiór rozwiązań to \left\{-9,\, 9\right\}.

    Odpowiedź: \sqrt{81} = 9, a równanie x^{2} = 81 ma dwa rozwiązania: -9 i 9.
  solution_steps:
  - 'Błąd: mylenie wartości pierwiastka arytmetycznego z rozwiązaniami równania kwadratowego.'
  - '√ oznacza jedyną liczbę nieujemną o zadanym kwadracie: √81 = 9.'
  - Równanie x² = 81 zapisz jako (x − 9)(x + 9) = 0.
  - 'Rozwiązania: x = 9 lub x = −9, czyli zbiór {−9, 9}.'
  answer:
    kind: MULTIPART
    parts:
    - name: wartość pierwiastka
      answer:
        kind: NUMERIC
        value: 9.0
    - name: rozwiązania równania
      answer:
        kind: SET
        members:
        - '-9'
        - '9'
  checks:
  - kind: evaluate
    expr: \sqrt{81}
    part: wartość pierwiastka
  - kind: solve_equation
    expr: x^{2} = 81
    part: rozwiązania równania
  skills:
  - pierwiastek arytmetyczny
  - rozwiązywanie równania x² = a
  - definicja pierwiastka
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [wartość pierwiastka] SymPy solved it fresh: 9.0 vs 9.0 (tol
      1e-09) ; [rozwiązania równania] SymPy solved it fresh: 2 members matched'
- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: modelowanie zbioru opisanego słownie i działania na przedziałach
  statement: |-
    Zbiór $A$ składa się ze wszystkich liczb rzeczywistych, których odległość na osi liczbowej od liczby $3$ jest mniejsza niż $5$. Zbiór $B$ składa się ze wszystkich liczb rzeczywistych $x$, dla których wyrażenie $\sqrt{x-1}$ ma wartość rzeczywistą.
    Wyznacz zbiór $A\cap B$ i zapisz go w postaci przedziału, podaj jego długość oraz największą liczbę całkowitą do niego należącą.
  statement_latex: A=\left\{x\in\mathbb{R}:\ \left|x-3\right|<5\right\},\qquad B=\left\{x\in\mathbb{R}:\
    x-1\ge 0\right\}
  solution: |-
    Krok 1 — opis zbioru $A$. Liczby odległe od $3$ o mniej niż $5$ leżą na osi między $3-5=-2$ a $3+5=8$, przy czym same końce są odległe dokładnie o $5$, więc do zbioru nie należą (nierówność ostra). Zatem
    $A=\left(-2,\,8\right)$.

    Krok 2 — opis zbioru $B$. Pierwiastek arytmetyczny stopnia drugiego jest określony tylko dla liczb nieujemnych, więc musi być $x-1\ge 0$, czyli $x\ge 1$. Stąd
    $B=\left\langle 1,\,+\infty\right)$ (przy $+\infty$ zawsze nawias okrągły).

    Krok 3 — część wspólna. Szukamy liczb spełniających jednocześnie $-2<x<8$ oraz $x\ge 1$, czyli $1\le x<8$. Koniec $1$ należy do obu zbiorów (bo $1>-2$ i $1-1=0\ge 0$), koniec $8$ nie należy do $A$. Zatem
    $A\cap B=\left\langle 1,\,8\right)$.

    Krok 4 — długość i największa liczba całkowita. Długość: $8-1=7$. Największa liczba całkowita mniejsza od $8$ to $7$ (liczba $8$ do zbioru nie należy, bo prawy koniec jest otwarty).

    Odpowiedź: $A\cap B=\left\langle 1,\,8\right)$, długość $7$, największa liczba całkowita $7$.
  solution_steps:
  - 'Przetłumacz opis odległości na nierówność: |x − 3| < 5, czyli −2 < x < 8, więc A = (−2, 8).'
  - 'Z warunku istnienia pierwiastka: x − 1 ≥ 0, czyli x ≥ 1, więc B = ⟨1, +∞).'
  - 'Zaznacz oba zbiory na osi i weź zakładkę: 1 ≤ x < 8.'
  - 'Rozstrzygnij o końcach: 1 należy do obu zbiorów, 8 nie należy do A, więc A ∩ B = ⟨1, 8).'
  - 'Oblicz długość: 8 − 1 = 7.'
  - 'Wskaż największą liczbę całkowitą mniejszą od 8: jest nią 7.'
  answer:
    kind: MULTIPART
    parts:
    - name: A_przeciecie_B
      answer:
        kind: INTERVAL
        lo: '1'
        hi: '8'
        lo_open: false
    - name: dlugosc
      answer:
        kind: NUMERIC
        value: 7.0
    - name: najwieksza_liczba_calkowita
      answer:
        kind: NUMERIC
        value: 7.0
  checks:
  - kind: evaluate
    expr: 8 - 1
    part: dlugosc
  - kind: evaluate
    expr: \lceil 8 \rceil - 1
    part: najwieksza_liczba_calkowita
  stated_model:
    variable: x
    objective_latex: \left|x-3\right|<5\ \wedge\ x-1\ge 0
    domain_lo: '1'
    domain_hi: '8'
    domain_lo_open: false
    goal: value
    constraint_used: 'warunek istnienia pierwiastka: x-1 \ge 0'
  skills:
  - przekład opisu słownego na nierówność
  - dziedzina pierwiastka (warunek nieujemności)
  - część wspólna przedziałów
  - długość przedziału
  - największa liczba całkowita w zbiorze
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (PARSE_ERROR: "UnexpectedCharacters: No terminal
      matches ''\\'' in the current parser context, at line 1 col 19") — human review'
- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: szacowanie pierwiastków i zliczanie elementów zbioru
  statement: |-
    Rozważamy wszystkie liczby postaci $\sqrt{n}$, gdzie $n$ jest liczbą całkowitą dodatnią, które należą do przedziału $\left\langle 2\sqrt{3},\ 5\sqrt{2}\right)$.
    a) Ile jest takich liczb?
    b) Podaj największą z nich.
    c) Ile spośród tych liczb jest liczbami wymiernymi?
  statement_latex: \sqrt{n}\in\left\langle 2\sqrt{3},\ 5\sqrt{2}\right),\qquad n\in\mathbb{C},\ n>0
  solution: |-
    Krok 1 — sprowadzamy końce przedziału do jednego pierwiastka, wciągając czynniki pod znak pierwiastka:
    $2\sqrt{3}=\sqrt{2^{2}\cdot 3}=\sqrt{12}$, $5\sqrt{2}=\sqrt{5^{2}\cdot 2}=\sqrt{50}$.

    Krok 2 — warunek $\sqrt{12}\le\sqrt{n}<\sqrt{50}$ dla liczb nieujemnych jest równoważny warunkowi na liczby podpierwiastkowe:
    $12\le n<50$.
    Uwaga na końce: lewy koniec jest domknięty, więc $n=12$ liczymy; prawy jest otwarty, więc $n=50$ odrzucamy.

    Krok 3 — a) liczby całkowite spełniające $12\le n\le 49$ to $12,13,\dots,49$; jest ich $49-12+1=38$. Różnym $n$ odpowiadają różne liczby $\sqrt{n}$, więc szukanych liczb jest $38$.

    Krok 4 — b) największą liczbę daje największe $n$, czyli $n=49$: jest to $\sqrt{49}=7$. (Sprawdzenie: $7=\sqrt{49}<\sqrt{50}=5\sqrt{2}$, więc liczba $7$ istotnie należy do przedziału.)

    Krok 5 — c) liczba $\sqrt{n}$ jest wymierna dokładnie wtedy, gdy $n$ jest kwadratem liczby całkowitej. W przedziale $12\le n\le 49$ są to $16=4^{2}$, $25=5^{2}$, $36=6^{2}$, $49=7^{2}$, czyli $7-4+1=4$ liczby.

    Odpowiedź: a) $38$, b) $7$, c) $4$.
  solution_steps:
  - 'Wciągnij czynniki pod pierwiastek: 2√3 = √12, 5√2 = √50.'
  - 'Zamień warunek na liczby podpierwiastkowe: 12 ≤ n < 50.'
  - 'Uwzględnij typ końców: n = 12 należy, n = 50 nie należy, więc 12 ≤ n ≤ 49.'
  - 'Policz liczby całkowite: 49 − 12 + 1 = 38.'
  - Największa liczba to √49 = 7.
  - 'Wymierne są tylko pierwiastki z kwadratów: 16, 25, 36, 49, czyli 7 − 4 + 1 = 4 liczby.'
  answer:
    kind: MULTIPART
    parts:
    - name: liczba_elementow
      answer:
        kind: NUMERIC
        value: 38.0
    - name: najwieksza_liczba
      answer:
        kind: NUMERIC
        value: 7.0
    - name: liczba_wymiernych
      answer:
        kind: NUMERIC
        value: 4.0
  checks:
  - kind: evaluate
    expr: 49 - 12 + 1
    var: n
    part: liczba_elementow
  - kind: evaluate
    expr: \sqrt{49}
    var: n
    part: najwieksza_liczba
  - kind: evaluate
    expr: 7 - 4 + 1
    var: n
    part: liczba_wymiernych
  stated_model:
    variable: n
    objective_latex: \sqrt{n}
    domain_lo: '12'
    domain_hi: '50'
    domain_lo_open: false
    constraint_used: \sqrt{12}\le\sqrt{n}<\sqrt{50}\iff 12\le n<50,\ n\in\mathbb{C}
  skills:
  - wciąganie czynnika pod pierwiastek
  - porównywanie liczb niewymiernych
  - przynależność końców przedziału
  - zliczanie liczb całkowitych spełniających warunek
  - rozpoznawanie liczb wymiernych i niewymiernych
  verification:
    checkability: STATED_MODEL
    note: 'stage 1 inconclusive: no interior critical point in (12, 50)'
- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: łańcuch rachunkowy w bryle z pierwiastkami, szacowanie i sprawdzenie warunku
  statement: |-
    Prostopadłościan ma podstawę, która jest kwadratem o polu $32\ \mathrm{cm}^{2}$, a jego objętość jest równa $128\sqrt{2}\ \mathrm{cm}^{3}$.
    a) Wyznacz długość krawędzi podstawy oraz wysokość tego prostopadłościanu (zapisz je w postaci $a\sqrt{b}$, gdzie $a$, $b$ są liczbami całkowitymi dodatnimi).
    b) Oblicz pole powierzchni całkowitej tego prostopadłościanu.
    c) Podaj dwie kolejne liczby całkowite, między którymi leży długość przekątnej tego prostopadłościanu.
    d) Rozstrzygnij, czy ten prostopadłościan można umieścić wewnątrz sześciennego pudełka o krawędzi $6\ \mathrm{cm}$ tak, aby jego krawędzie były równoległe do krawędzi pudełka.
  statement_latex: P_{p}=a^{2}=32,\qquad V=a^{2}\cdot H=128\sqrt{2}
  solution: |-
    Krok 1 — krawędź podstawy. Podstawa jest kwadratem o polu $32$, więc dla krawędzi $a>0$ mamy $a^{2}=32$, skąd
    $a=\sqrt{32}=\sqrt{16\cdot 2}=4\sqrt{2}\ \mathrm{cm}$.

    Krok 2 — wysokość. Z wzoru na objętość $V=P_{p}\cdot H$ otrzymujemy
    $H=\frac{128\sqrt{2}}{32}=4\sqrt{2}\ \mathrm{cm}$.
    (Wszystkie krawędzie mają więc tę samą długość — bryła jest sześcianem o krawędzi $4\sqrt{2}$.)

    Krok 3 — pole powierzchni całkowitej. Prostopadłościan ma sześć ścian, a każda jest kwadratem o polu $\left(4\sqrt{2}\right)^{2}=32$, zatem
    $P_{c}=6\cdot 32=192\ \mathrm{cm}^{2}$.

    Krok 4 — przekątna. Dla krawędzi $a=H=4\sqrt{2}$ przekątna bryły ma długość
    $d=\sqrt{a^{2}+a^{2}+H^{2}}=\sqrt{32+32+32}=\sqrt{96}=4\sqrt{6}\ \mathrm{cm}$.
