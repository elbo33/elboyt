  exercise_type: Zadanie tekstowe — mieszaniny, układ równań i kontrola dziedziny
  statement: |-
    W laboratorium znajdują się dwa roztwory soli: 12-procentowy oraz 30-procentowy (procenty masowe). Z tych dwóch roztworów należy przygotować 900 g roztworu 20-procentowego.
    a) Oblicz, ile gramów roztworu 12-procentowego i ile gramów roztworu 30-procentowego trzeba w tym celu zmieszać.
    b) Rozstrzygnij, czy mieszając (w dowolnych proporcjach) te same dwa roztwory, można otrzymać 900 g roztworu 35-procentowego. Uzasadnij odpowiedź.
    Zapisz obliczenia.
  statement_latex: \left\{ \begin{matrix} x + y = 900 \\ \frac{12}{100}\cdot x + \frac{30}{100}\cdot y
    = \frac{20}{100}\cdot 900 \end{matrix} \right.
  solution: |-
    Oznaczenia: \(x\) — masa roztworu 12-procentowego (w gramach), \(y\) — masa roztworu 30-procentowego (w gramach). Z sensu zadania \(x \geq 0\) i \(y \geq 0\).
    a) Masa mieszaniny: \(x + y = 900\). Bilans soli: w mieszaninie ma być \(\frac{20}{100}\cdot 900 = 180\) g soli, więc \(\frac{12}{100}\cdot x + \frac{30}{100}\cdot y = 180\), czyli po pomnożeniu przez 100: \(12x + 30y = 18000\), a po podzieleniu przez 6: \(2x + 5y = 3000\).
    Z pierwszego równania \(x = 900 - y\); podstawiamy do drugiego: \(2\cdot\left(900 - y\right) + 5y = 3000\), czyli \(1800 + 3y = 3000\), stąd \(3y = 1200\), \(y = 400\), a więc \(x = 500\).
    Dziedzina: \(500 > 0\) i \(400 > 0\) — warunki spełnione. Sprawdzenie: \(0{,}12\cdot 500 + 0{,}30\cdot 400 = 60 + 120 = 180\) ✓.
    b) Gdyby mieszanina miała mieć stężenie 35%, to soli byłoby \(\frac{35}{100}\cdot 900 = 315\) g, więc
    \(\left\{ x + y = 900;\ \frac{12}{100}\cdot x + \frac{30}{100}\cdot y = 315 \right\}\).
    Podstawiamy \(x = 900 - y\): \(12\cdot\left(900 - y\right) + 30y = 31500\), czyli \(10800 + 18y = 31500\), stąd \(18y = 20700\), \(y = 1150\), a wtedy \(x = 900 - 1150 = -250\).
    Otrzymana para \(\left(-250,\ 1150\right)\) nie spełnia warunków dziedziny (masa nie może być ujemna, a masa jednego składnika nie może przekraczać masy mieszaniny), więc zadanie nie ma rozwiązania: takiej mieszaniny przygotować się NIE DA. Jest to zgodne z tym, że stężenie mieszaniny dwóch roztworów zawsze mieści się między 12% a 30%, a 35% leży poza tym przedziałem.
    Odpowiedź: trzeba zmieszać 500 g roztworu 12-procentowego i 400 g roztworu 30-procentowego; roztworu 35-procentowego z tych składników otrzymać nie można.
  solution_steps:
