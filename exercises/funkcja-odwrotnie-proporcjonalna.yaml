  exercise_type: zadanie tekstowe z modelem odwrotnie proporcjonalnym i warunkiem brzegowym
  statement: |-
    Ekipa 6 malarzy o jednakowej wydajności pomalowałaby pewną halę w ciągu 10 dni pracy. Ekipa pracowała w tym składzie przez 4 dni, po czym prace przerwano. Malowanie ma zostać dokończone w ciągu kolejnych 5 dni roboczych przez malarzy o takiej samej wydajności.
    a) Oblicz, ilu co najmniej malarzy musi pracować przez te 5 dni, aby malowanie zostało ukończone w terminie.
    b) Oblicz, ile dni zajęłoby dokończenie malowania, gdyby pracowało przy nim 12 malarzy.
  statement_latex: W=6\cdot 10,\qquad W_{\text{poz}}=60-6\cdot 4,\qquad t\left(n\right)=\frac{36}{n}\le
    5
  solution: |-
    Całą pracę mierzymy w roboczodniach. Cała hala to W = 6\cdot 10 = 60 roboczodni.
    Przez 4 dni sześciu malarzy wykonało 6\cdot 4 = 24 roboczodni, więc do wykonania pozostało 60 - 24 = 36 roboczodni.
    Czas dokończenia malowania przez n malarzy jest odwrotnie proporcjonalny do n: t\left(n\right)=\frac{36}{n}, gdzie n jest dodatnią liczbą naturalną.
    a) Warunek terminu: \frac{36}{n}\le 5. Ponieważ n > 0, mnożymy przez n: 36 \le 5n, czyli n \ge \frac{36}{5}=7{,}2. Liczba malarzy jest liczbą naturalną, więc n = 8 — musi pracować co najmniej 8 malarzy. (Dla 7 malarzy potrzeba \frac{36}{7}\approx 5{,}14 dnia, czyli za dużo.)
    b) Dla n = 12: t = \frac{36}{12} = 3 dni.
  solution_steps:
