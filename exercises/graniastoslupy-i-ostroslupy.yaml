- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: odzyskiwanie odcinków w ostrosłupie za pomocą twierdzenia Pitagorasa
  statement: Dany jest ostrosłup prawidłowy czworokątny ABCDS o podstawie ABCD. Krawędź podstawy ma długość
    12, a każda krawędź boczna ma długość 10. Oblicz wysokość ściany bocznej, wysokość tego ostrosłupa,
    jego objętość oraz pole powierzchni całkowitej. Zapisz obliczenia.
  statement_latex: h = \sqrt{10^2 - \left(\frac{12}{2}\right)^2},\qquad H = \sqrt{10^2 - \left(\frac{12\sqrt{2}}{2}\right)^2}
  solution: |-
    Ściana boczna jest trójkątem równoramiennym o ramieniu b = 10 i podstawie a = 12. Jej wysokość h dzieli podstawę na połowy, więc
    h = \sqrt{b^2 - \left(\frac{a}{2}\right)^2} = \sqrt{100 - 36} = \sqrt{64} = 8.
    Promień okręgu opisanego na podstawie (połowa przekątnej kwadratu): R = \frac{a\sqrt{2}}{2} = 6\sqrt{2}.
    W trójkącie prostokątnym o przyprostokątnych H i R oraz przeciwprostokątnej b:
    H = \sqrt{b^2 - R^2} = \sqrt{100 - 72} = \sqrt{28} = 2\sqrt{7} \approx 5,29.
    Pole podstawy: P_p = 12^2 = 144.
    Objętość: V = \frac{1}{3}\cdot 144 \cdot 2\sqrt{7} = 96\sqrt{7} \approx 254,0.
    Pole boczne: P_b = 4\cdot \frac{1}{2}\cdot 12\cdot 8 = 192.
    Pole całkowite: P_c = 144 + 192 = 336.
    Kontrola sensu: H = 2\sqrt{7} \approx 5,29 < h = 8 < b = 10 — kolejność zgodna z geometrią.
  solution_steps:
  - 'W ścianie bocznej zastosuj Pitagorasa: h = \sqrt{10^2 - 6^2} = 8.'
  - Wyznacz R = \frac{12\sqrt{2}}{2} = 6\sqrt{2}.
  - 'Oblicz wysokość bryły: H = \sqrt{10^2 - \left(6\sqrt{2}\right)^2} = \sqrt{28} = 2\sqrt{7}.'
  - 'Oblicz objętość: V = \frac{1}{3}\cdot 144\cdot 2\sqrt{7} = 96\sqrt{7}.'
  - 'Oblicz pole boczne: P_b = 4\cdot\frac{1}{2}\cdot 12\cdot 8 = 192 i pole całkowite: P_c = 144 + 192
    = 336.'
  answer:
    kind: MULTIPART
    parts:
    - name: h
      answer:
        kind: NUMERIC
        value: 8.0
        latex: '8'
    - name: H
      answer:
        kind: SYMBOLIC
        latex: 2\sqrt{7}
    - name: V
      answer:
        kind: SYMBOLIC
        latex: 96\sqrt{7}
    - name: P_c
      answer:
        kind: NUMERIC
        value: 336.0
        latex: '336'
  checks:
  - kind: evaluate
    expr: \sqrt{10^2 - \left(\frac{12}{2}\right)^2}
    part: h
  - kind: evaluate
    expr: \sqrt{10^2 - \left(\frac{12\cdot\sqrt{2}}{2}\right)^2}
    part: H
  - kind: evaluate
    expr: \frac{1}{3}\cdot 12^2 \cdot \sqrt{10^2 - \left(\frac{12\cdot\sqrt{2}}{2}\right)^2}
    part: V
  - kind: evaluate
    expr: 12^2 + 4\cdot\frac{1}{2}\cdot 12\cdot \sqrt{10^2 - \left(\frac{12}{2}\right)^2}
