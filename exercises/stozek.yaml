- id: g-cm-07
  slot: COMMON_MISTAKE
  ramp_index: 1
  difficulty: 2
  exercise_type: objętość stożka – czynnik 1/3
  statement: Promień podstawy stożka obrotowego jest równy 6, a jego wysokość wynosi 10. Uczeń zapisał,
    że objętość tego stożka jest równa V = \pi\cdot 6^2\cdot 10 = 360\pi. Wyjaśnij błąd i oblicz poprawną
    objętość stożka.
  statement_latex: r=6,\quad H=10,\quad V=\frac{1}{3}\cdot\pi\cdot r^2\cdot H
  solution: |-
    Błędne rozumowanie: uczeń użył wzoru na objętość WALCA, V = \pi r^2 H = \pi\cdot 36\cdot 10 = 360\pi.
    Dlaczego to źle: stożek jest „ostrosłupem o podstawie kołowej”, a dla ostrosłupa i stożka V = \frac{1}{3}P_p\cdot H. Objętość stożka jest trzy razy mniejsza od objętości walca o tej samej podstawie i wysokości.
    Poprawnie: V = \frac{1}{3}\cdot\pi\cdot 6^2\cdot 10 = \frac{1}{3}\cdot 360\pi = 120\pi.
    Odpowiedź: V = 120\pi (a nie 360\pi).
