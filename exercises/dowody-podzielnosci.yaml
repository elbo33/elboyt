- id: g-cm-10
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 3
  exercise_type: podzielność przez iloczyn dzielników
  statement: 'Uczeń zauważył, że dla każdej liczby całkowitej \(n\) liczba \(12n\) jest podzielna przez
    \(4\) i przez \(6\), i wywnioskował: „zatem dla każdej liczby całkowitej \(n\) liczba \(12n\) jest
    podzielna przez \(24\)”. Wskaż błąd w tym wniosku, oblicz wartość wyrażenia \(12n\) dla \(n=3\) jako
    kontrprzykład oraz zapisz, dla jakich liczb całkowitych \(n\) liczba \(12n\) rzeczywiście jest podzielna
    przez \(24\).'
  statement_latex: 12\cdot n,\qquad 24 = 4\cdot 6,\qquad \mathrm{NWD}\left(4,6\right)=2
  solution: |-
    Błędne rozumowanie: „skoro 4 \mid 12n i 6 \mid 12n, to 4\cdot 6 = 24 dzieli 12n”. Wniosek ucznia: 24 \mid 12n dla każdej liczby całkowitej n.

    Dlaczego to błąd: własność „a \mid n i b \mid n \Rightarrow ab \mid n” wymaga, aby liczby a i b były względnie pierwsze. Tutaj \mathrm{NWD}\left(4,6\right)=2 \ne 1, więc z podzielności przez 4 i przez 6 wynika jedynie podzielność przez najmniejszą wspólną wielokrotność, czyli przez 12.

    Kontrprzykład: dla n = 3 otrzymujemy 12\cdot 3 = 36, a 36 = 24\cdot 1 + 12, więc 36 nie jest podzielne przez 24.

    Kiedy 24 \mid 12n? Mamy 12n = 24m dokładnie wtedy, gdy n = 2m, czyli dokładnie wtedy, gdy n jest liczbą parzystą (n = 2k, k \in \mathbb{Z}).

    Odpowiedź: wniosek ucznia jest FAŁSZYWY; kontrprzykład: dla n = 3 mamy 12n = 36; podzielność przez 24 zachodzi dokładnie dla n parzystych.
  solution_steps:
  - 'Przypominamy warunek: z a \mid n i b \mid n wynika ab \mid n tylko wtedy, gdy \mathrm{NWD}\left(a,b\right)=1.'
  - 'Sprawdzamy: \mathrm{NWD}\left(4,6\right)=2 \ne 1, więc wniosek ucznia jest nieuprawniony.'
  - 'Podajemy kontrprzykład: 12\cdot 3 = 36 oraz 36 = 24\cdot 1+12, czyli 24 \nmid 36.'
  - 'Rozstrzygamy warunek: 12n = 24m \iff n = 2m, czyli n musi być parzyste.'
  - 'Zapisujemy wniosek: 24 \mid 12n dokładnie dla n = 2k, k \in \mathbb{Z}.'
  answer:
    kind: MULTIPART
    parts:
    - name: czy wniosek ucznia jest poprawny
      answer:
        kind: BOOLEAN
        truth: false
    - name: wartość 12n dla n=3
      answer:
        kind: NUMERIC
        value: 36.0
    - name: warunek na n
      answer:
        kind: SYMBOLIC
        latex: n=2k,\ k\in\mathbb{Z}
