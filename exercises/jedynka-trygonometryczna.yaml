  statement: Kąt \alpha jest ostry oraz \sin\alpha = 0{,}6. Oblicz \cos\alpha oraz \operatorname{tg}\alpha.
  statement_latex: \sin\alpha=0{,}6,\qquad \sin^{2}\alpha+\cos^{2}\alpha=1
