- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie trzeciego boku (BKB)
  statement: W trójkącie ABC dane są długości boków |AC| = 3 oraz |BC| = 8, a kąt zawarty między nimi
    ma miarę |∠ACB| = 60°. Oblicz długość boku AB. Zapisz obliczenia.
  statement_latex: '|AB|^2 = 3^2 + 8^2 - 2\cdot 3\cdot 8\cdot\cos 60^\circ'
  solution: |-
    Kąt ACB leży między bokami AC i BC, a naprzeciw niego leży bok AB. Stosujemy twierdzenie cosinusów:
    |AB|^2 = |AC|^2 + |BC|^2 - 2\cdot|AC|\cdot|BC|\cdot\cos 60^\circ.
    Podstawiamy cos 60° = 1/2:
    |AB|^2 = 3^2 + 8^2 - 2\cdot 3\cdot 8\cdot\frac{1}{2} = 9 + 64 - 24 = 49.
    Stąd |AB| = \sqrt{49} = 7.
    Kontrola: 7 < 3 + 8, więc nierówność trójkąta jest spełniona.
  solution_steps:
  - Zauważ, że kąt 60° jest kątem między bokami AC i BC, więc naprzeciw niego leży szukany bok AB.
  - 'Zapisz twierdzenie cosinusów: |AB|^2 = |AC|^2 + |BC|^2 - 2\cdot|AC|\cdot|BC|\cdot\cos 60^\circ.'
  - 'Podstaw dane i cos 60° = 1/2: |AB|^2 = 9 + 64 - 24 = 49.'
  - 'Wyciągnij pierwiastek: |AB| = 7.'
  answer:
    kind: NUMERIC
    value: 7.0
  checks:
  - kind: evaluate
    expr: \sqrt{3^2 + 8^2 - 2\cdot 3\cdot 8\cdot\frac{1}{2}}
  skills:
  - twierdzenie cosinusów
  - wartości cosinusa kątów tablicowych
  - pierwiastkowanie wyniku
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 7.0 vs 7.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
