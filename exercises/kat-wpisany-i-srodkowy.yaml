- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: kąty wpisane po obu stronach cięciwy
  statement: Punkty A i B leżą na okręgu o środku O, a kąt wypukły AOB ma miarę 96^\circ. Punkt C leży
    na dłuższym łuku AB, a punkt D — na krótszym łuku AB. Oblicz miary kątów ACB oraz ADB. Wyniki podaj
    w stopniach.
  statement_latex: '|\angle ACB| = \frac{1}{2}\cdot 96^\circ,\qquad |\angle ADB| = \frac{1}{2}\cdot\left(360^\circ
    - 96^\circ\right)'
  solution: |-
    Cięciwa AB wyznacza dwa łuki: krótszy, któremu odpowiada kąt środkowy wypukły o mierze 96^\circ, oraz dłuższy, któremu odpowiada kąt środkowy wklęsły o mierze 360^\circ - 96^\circ = 264^\circ.

    Punkt C leży na dłuższym łuku, więc kąt ACB opiera się na krótszym łuku AB:
    |\angle ACB| = \frac{1}{2}\cdot 96^\circ = 48^\circ.

    Punkt D leży na krótszym łuku, więc kąt ADB opiera się na dłuższym łuku AB:
    |\angle ADB| = \frac{1}{2}\cdot 264^\circ = 132^\circ.

    Sprawdzenie: 48^\circ + 132^\circ = 180^\circ, zgodnie z własnością kątów wpisanych opartych na tej samej cięciwie, których wierzchołki leżą po przeciwnych jej stronach.

    Odpowiedź: |\angle ACB| = 48^\circ, |\angle ADB| = 132^\circ.
  solution_steps:
  - 'Wyznacz oba kąty środkowe wyznaczone przez cięciwę AB: 96^\circ oraz 360^\circ - 96^\circ = 264^\circ.'
  - 'Ustal, że kąt ACB (C na dłuższym łuku) opiera się na krótszym łuku: |\angle ACB| = \tfrac12\cdot
    96^\circ = 48^\circ.'
  - 'Ustal, że kąt ADB (D na krótszym łuku) opiera się na dłuższym łuku: |\angle ADB| = \tfrac12\cdot
    264^\circ = 132^\circ.'
  - 'Sprawdź: 48^\circ + 132^\circ = 180^\circ.'
  answer:
    kind: MULTIPART
    parts:
    - name: kat_ACB
      answer:
        kind: NUMERIC
        value: 48.0
        latex: 48^\circ
    - name: kat_ADB
      answer:
        kind: NUMERIC
        value: 132.0
        latex: 132^\circ
  checks:
  - kind: evaluate
    expr: \frac{1}{2}\cdot 96
    part: kat_ACB
  - kind: evaluate
    expr: \frac{1}{2}\cdot \left(360 - 96\right)
    part: kat_ADB
  skills:
  - kąt wpisany a kąt środkowy
  - kąt środkowy wklęsły
