- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: wzór funkcji z dziedziną, wyznaczenie argumentu z danej wartości i dalsze obliczenie
  statement: |-
    Z prostokątnego arkusza blachy o wymiarach 24 cm × 18 cm wycięto w każdym z czterech narożników jednakowy kwadrat o boku x cm, a powstałe cztery prostokątne paski zagięto ku górze pod kątem prostym, otrzymując otwarte od góry pudełko w kształcie prostopadłościanu o wysokości x cm.
    a) Wyznacz wzór funkcji S opisującej pole powierzchni pudełka (dno oraz cztery ściany boczne, bez górnej pokrywy) w zależności od x i podaj dziedzinę tej funkcji.
    b) Pole powierzchni tego pudełka jest równe 396 cm². Oblicz x i sprawdź, czy otrzymana liczba należy do dziedziny.
    c) Oblicz objętość otrzymanego pudełka.
  statement_latex: S\left(x\right)=\left(24-2\cdot x\right)\cdot\left(18-2\cdot x\right)+2\cdot x\cdot\left(24-2\cdot
    x\right)+2\cdot x\cdot\left(18-2\cdot x\right)
  solution: |-
    a) Po wycięciu narożników dno pudełka jest prostokątem o wymiarach (24 − 2x) cm × (18 − 2x) cm, a wysokość pudełka wynosi x cm. Pole powierzchni to pole dna powiększone o pola czterech ścian bocznych (dwie o wymiarach x × (24 − 2x) i dwie o wymiarach x × (18 − 2x)):
    S(x) = (24 − 2x)(18 − 2x) + 2·x·(24 − 2x) + 2·x·(18 − 2x)
    = 432 − 84x + 4x² + 48x − 4x² + 36x − 4x²
    = 432 − 4x².
    (Ten sam wynik otrzymamy szybciej: z arkusza o polu 24·18 = 432 cm² usunięto cztery kwadraty o polu x² każdy.)
    Warunki geometryczne: x > 0, 24 − 2x > 0 i 18 − 2x > 0, czyli x < 9. Dziedzina: x ∈ (0; 9).
    b) Rozwiązuję równanie S(x) = 396:
    432 − 4x² = 396 ⟹ 4x² = 36 ⟹ x² = 9 ⟹ x = 3 lub x = −3.
    Liczba −3 nie należy do dziedziny (odrzucam), a x = 3 spełnia warunek 0 < 3 < 9 ✓.
    Zatem bok wyciętego kwadratu wynosi 3 cm.
    c) Dla x = 3 dno ma wymiary (24 − 6) cm × (18 − 6) cm = 18 cm × 12 cm, a wysokość 3 cm, więc
    V = 18·12·3 = 648 cm³.
    Odpowiedź: S(x) = 432 − 4x² dla x ∈ (0; 9), x = 3 cm, V = 648 cm³.
  solution_steps:
  - Zauważam, że dno pudełka to prostokąt o wymiarach (24 − 2x) × (18 − 2x), a wysokość pudełka to x.
  - 'Składam pole powierzchni: dno + dwie ściany x·(24 − 2x) + dwie ściany x·(18 − 2x).'
  - 'Redukuję wyrażenie: S(x) = 432 − 84x + 4x² + 48x − 4x² + 36x − 4x² = 432 − 4x².'
  - Ustalam dziedzinę z warunków x > 0, 24 − 2x > 0, 18 − 2x > 0, czyli x ∈ (0; 9).
  - Rozwiązuję 432 − 4x² = 396, otrzymuję x² = 9, więc x = 3 lub x = −3.
  - Odrzucam x = −3 (poza dziedziną) i sprawdzam, że 3 ∈ (0; 9).
  - Dla x = 3 wyznaczam wymiary dna 18 cm × 12 cm i wysokość 3 cm.
  - Obliczam objętość V = 18·12·3 = 648 cm³.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_S
      answer:
        kind: SYMBOLIC
