  exercise_type: poprawne podstawianie z nawiasami
  statement: 'Dany jest ciąg \left(a_{n}\right) określony wzorem a_{n} = n^{2} + 3n - 1 dla każdej liczby
    naturalnej n \geq 1. Uczeń zapisał: „a_{n+1} = n+1^{2} + 3n+1 - 1 = 4n + 1”. Wyznacz poprawnie a_{n+1},
    oblicz różnicę a_{n+1} - a_{n} i rozstrzygnij, czy ciąg jest rosnący. Wskaż błąd ucznia.'
  statement_latex: a_{n}=n^{2}+3n-1,\qquad a_{n+1}=?,\qquad a_{n+1}-a_{n}=?
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń nie ujął podstawianego wyrażenia w nawiasy i otrzymał a_{n+1} = n + 1^{2} + 3n + 1 - 1 = 4n + 1. Wtedy różnica wyszłaby
    \left(4n+1\right) - \left(n^{2}+3n-1\right) = -n^{2} + n + 2,
    co dla n = 2 daje -4 + 2 + 2 = 0, a dla n = 3 daje -9 + 3 + 2 = -4 < 0 — uczeń błędnie orzekłby, że ciąg maleje.
    DLACZEGO TO BŁĄD: podstawiając n+1 za n, trzeba całe wyrażenie ująć w nawias, bo podnoszeniu do kwadratu i mnożeniu podlega suma n+1, a nie samo n.
    POPRAWNE ROZWIĄZANIE:
    a_{n+1} = \left(n+1\right)^{2} + 3\left(n+1\right) - 1 = n^{2} + 2n + 1 + 3n + 3 - 1 = n^{2} + 5n + 3.
    Różnica: a_{n+1} - a_{n} = \left(n^{2}+5n+3\right) - \left(n^{2}+3n-1\right) = 2n + 4.
    Dla każdego n \geq 1 mamy 2n + 4 \geq 6 > 0, więc a_{n+1} > a_{n}, czyli ciąg jest rosnący.
    Sprawdzenie: a_{1} = 3, a_{2} = 9, a_{3} = 17 — wyrazy rosną, co potwierdza wniosek (a przeczy błędnej wersji ucznia).
  solution_steps:
  - 'Zauważ, że podstawiając n+1, trzeba użyć nawiasów: \left(n+1\right)^{2} oraz 3\left(n+1\right).'
  - 'Uprość: a_{n+1} = n^{2} + 2n + 1 + 3n + 3 - 1 = n^{2} + 5n + 3.'
  - 'Oblicz różnicę: a_{n+1} - a_{n} = \left(n^{2}+5n+3\right) - \left(n^{2}+3n-1\right) = 2n + 4.'
  - 'Zbadaj znak: dla n \geq 1 mamy 2n + 4 > 0, więc ciąg jest rosnący.'
  answer:
