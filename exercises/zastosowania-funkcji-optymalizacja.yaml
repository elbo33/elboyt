  - kind: evaluate
    expr: \frac{36-3\cdot 8}{2}
    part: x
  - kind: evaluate
    expr: \frac{36-2\cdot 6}{3}
    part: y
  - kind: evaluate
    expr: 12\cdot 6-\frac{2}{3}\cdot 6^{2}
    part: P_max
