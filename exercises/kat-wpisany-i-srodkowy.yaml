    Dlaczego to jest źle: kąt środkowy musi mieć wierzchołek W ŚRODKU okręgu. Kąt OAB ma wierzchołek w punkcie A leżącym na okręgu — jest to kąt między cięciwą AB a promieniem OA, czyli kąt przy podstawie trójkąta równoramiennego AOB.

    Poprawne rozwiązanie. Trójkąt AOB jest równoramienny, bo |OA| = |OB| = r, więc |\angle OBA| = |\angle OAB| = 32^\circ. Z sumy kątów trójkąta:
