- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: dowód o reszcie — samodzielne wprowadzenie oznaczeń
  statement: Ola wybrała trzy kolejne liczby całkowite nieparzyste i obliczyła sumę ich kwadratów. Wykaż,
    że reszta z dzielenia otrzymanej sumy przez 12 nie zależy od tego, jakie liczby Ola wybrała, oraz
    wyznacz tę resztę.
  statement_latex: S=\left(2\cdot k+1\right)^{2}+\left(2\cdot k+3\right)^{2}+\left(2\cdot k+5\right)^{2}
  solution: |-
    Trzeba samodzielnie wprowadzić oznaczenie. Kolejne liczby nieparzyste różnią się o 2, więc najmniejszą z nich zapiszemy jako 2\cdot k+1, gdzie k jest liczbą całkowitą; pozostałe to 2\cdot k+3 oraz 2\cdot k+5.
    Suma ich kwadratów wynosi
    S=\left(2\cdot k+1\right)^{2}+\left(2\cdot k+3\right)^{2}+\left(2\cdot k+5\right)^{2}=\left(4\cdot k^{2}+4\cdot k+1\right)+\left(4\cdot k^{2}+12\cdot k+9\right)+\left(4\cdot k^{2}+20\cdot k+25\right)=12\cdot k^{2}+36\cdot k+35.
    Rozdzielamy wyraz wolny tak, aby otrzymać resztę z przedziału \left[0,12\right):
    S=12\cdot k^{2}+36\cdot k+24+11=12\cdot\left(k^{2}+3\cdot k+2\right)+11.
    Liczba k^{2}+3\cdot k+2 jest całkowita (suma i iloczyn liczb całkowitych), więc 12\cdot\left(k^{2}+3\cdot k+2\right) jest wielokrotnością liczby 12, a ponieważ 0\le 11<12, reszta z dzielenia S przez 12 jest równa 11 — niezależnie od wyboru liczby k, czyli niezależnie od wyboru trzech kolejnych liczb nieparzystych. To należało wykazać.
