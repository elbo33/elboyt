- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie: stałe pole prostokąta, funkcja odwrotnie proporcjonalna, dziedzina i selekcja
    rozwiązania'
  statement: |-
    Prostokątną rabatę o polu 60 m^2 planuje się założyć tak, aby jednym bokiem przylegała do prostego muru o długości 12 m. Bok rabaty leżący przy murze nie może być dłuższy niż mur i nie jest ogradzany — siatką ogradza się pozostałe trzy boki rabaty. Niech x oznacza długość (w metrach) boku rabaty prostopadłego do muru.
    a) Wyznacz wzór funkcji L opisującej długość zużytej siatki (w metrach) w zależności od x oraz podaj dziedzinę tej funkcji wynikającą z warunków zadania.
    b) Wiedząc, że zużyto dokładnie 34 m siatki, oblicz wymiary rabaty.
  statement_latex: L\left(x\right)=2\cdot x+\frac{60}{x},\qquad 2\cdot x+\frac{60}{x}=34
  solution: |-
    a) Bok prostopadły do muru ma długość x, a bok przy murze — długość y. Pole rabaty jest stałe: x\cdot y = 60, więc y = \frac{60}{x} (wielkości x i y są odwrotnie proporcjonalne).
    Ogradzamy dwa boki o długości x i jeden bok o długości y (bok przy murze nie jest ogradzany), zatem
    L\left(x\right)=2\cdot x+\frac{60}{x}.
    Dziedzina: musi być x > 0 oraz bok przy murze nie może być dłuższy od muru, czyli \frac{60}{x}\le 12, skąd 60 \le 12x, czyli x \ge 5. Ostatecznie D = \left[5,\,+\infty\right).
    b) Rozwiązujemy równanie 2x+\frac{60}{x}=34 przy x \ge 5. Mnożąc przez x (dodatnie) otrzymujemy
    2x^{2}+60=34x, czyli 2x^{2}-34x+60=0, a po podzieleniu przez 2: x^{2}-17x+30=0.
    \Delta = 289-120=169, \sqrt{\Delta}=13, więc x_{1}=\frac{17-13}{2}=2, x_{2}=\frac{17+13}{2}=15.
    Liczba 2 nie należy do dziedziny (dla x = 2 bok przy murze miałby długość \frac{60}{2}=30 m, a mur ma tylko 12 m), więc x = 15.
    Wtedy drugi bok ma długość \frac{60}{15}=4 m i istotnie 4 \le 12 oraz 2\cdot 15+4=34 m siatki.
    Odpowiedź: rabata ma wymiary 15 m \times 4 m.
  solution_steps:
  - 'Oznacz bok przy murze przez y i zapisz stałe pole: x·y = 60, czyli y = 60/x.'
  - 'Złóż funkcję długości siatki: ogradzane są dwa boki x i jeden bok y, więc L(x) = 2x + 60/x.'
  - 'Wyznacz dziedzinę: x > 0 oraz 60/x ≤ 12, czyli x ≥ 5; D = [5, +∞).'
  - 'Rozwiąż 2x + 60/x = 34: 2x² − 34x + 60 = 0, czyli x² − 17x + 30 = 0.'
  - Oblicz Δ = 169 i pierwiastki x = 2 oraz x = 15.
  - Odrzuć x = 2 (nie należy do dziedziny — bok przy murze miałby 30 m > 12 m) i przyjmij x = 15.
  - 'Oblicz drugi bok: 60/15 = 4 m; wymiary rabaty to 15 m × 4 m.'
