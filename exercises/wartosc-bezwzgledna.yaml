  - 'Dla x < -6: -2x+4 = 24, stąd x = -10 (należy do przedziału).'
  - 'Dla -6 \le x \le 10: lewa strona jest równa 16, więc 16 = 24 — brak rozwiązań.'
  - 'Dla x > 10: 2x-4 = 24, stąd x = 14 (należy do przedziału).'
  - 'Oblicz długość odcinka: \left|14-\left(-10\right)\right| = 24 oraz środek \frac{-10+14}{2} = 2.'
  - Uzasadnij, że dla x z przedziału \left[-6,10\right] suma odległości jest stała i równa 16 \ne 24.
