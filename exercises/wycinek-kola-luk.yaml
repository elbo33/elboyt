- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: łuk, pole i obwód wycinka
  statement: 'Punkty A i B leżą na okręgu o środku O i promieniu r = 12 cm, przy czym kąt środkowy AOB
    ma miarę 150°. Rozpatrujemy wycinek koła ograniczony promieniami OA i OB oraz łukiem AB odpowiadającym
    kątowi 150°. Oblicz: a) długość łuku AB, b) pole tego wycinka, c) obwód tego wycinka. Wyniki podaj
    w postaci dokładnej.'
  statement_latex: l=\frac{150^\circ}{360^\circ}\cdot 2\cdot\pi\cdot 12,\qquad P_w=\frac{150^\circ}{360^\circ}\cdot\pi\cdot
    12^2,\qquad Ob=l+2\cdot 12
  solution: |-
    Ułamek koła: \frac{150^\circ}{360^\circ}=\frac{5}{12}.
    a) l=\frac{5}{12}\cdot 2\cdot\pi\cdot 12=\frac{5}{12}\cdot 24\pi=10\pi cm.
    b) P_w=\frac{5}{12}\cdot\pi\cdot 12^2=\frac{5}{12}\cdot 144\pi=60\pi cm^2.
    c) Brzeg wycinka tworzą łuk i dwa promienie: Ob=l+2r=10\pi+2\cdot 12=10\pi+24 cm ≈ 55{,}4 cm. Składników 10\pi i 24 nie łączymy w jeden wyraz.
    Kontrola wzorem P_w=\frac{1}{2}\cdot l\cdot r: \frac{1}{2}\cdot 10\pi\cdot 12=60\pi ✓.
  solution_steps:
  - 'Wyznacz ułamek koła: \frac{150^\circ}{360^\circ}=\frac{5}{12}.'
  - 'Oblicz długość łuku: l=\frac{5}{12}\cdot 24\pi=10\pi cm.'
  - 'Oblicz pole wycinka: P_w=\frac{5}{12}\cdot 144\pi=60\pi cm^2.'
  - 'Oblicz obwód wycinka: Ob=l+2r=10\pi+24 cm.'
  - Sprawdź wynik wzorem P_w=\frac{1}{2}\cdot l\cdot r.
  answer:
    kind: MULTIPART
    parts:
    - name: dlugosc_luku
      answer:
        kind: SYMBOLIC
        latex: 10\pi
    - name: pole_wycinka
      answer:
        kind: SYMBOLIC
        latex: 60\pi
    - name: obwod_wycinka
      answer:
        kind: SYMBOLIC
        latex: 10\pi+24
