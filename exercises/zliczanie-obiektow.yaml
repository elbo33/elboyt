- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: 'zliczanie z warunkiem „lub”: zasada włączeń i wyłączeń'
  statement: 'Rzucamy trzykrotnie sześcienną kostką do gry. Z otrzymanych kolejno liczb oczek tworzymy
    liczbę trzycyfrową w ten sposób, że wynik pierwszego rzutu jest cyfrą setek, wynik drugiego — cyfrą
    dziesiątek, a wynik trzeciego — cyfrą jedności. Oblicz, ile różnych liczb trzycyfrowych można w ten
    sposób otrzymać, jeżeli liczba ta ma spełniać co najmniej jeden z warunków: (1) jest podzielna przez
    5, (2) ma wszystkie cyfry różne.'
  statement_latex: \left|A \cup B\right| = \left|A\right| + \left|B\right| - \left|A \cap B\right| = 6
    \cdot 6 \cdot 1 + 6 \cdot 5 \cdot 4 - 5 \cdot 4
  solution: |-
    Jednym obiektem jest liczba trzycyfrowa, której cyfry pochodzą ze zbioru {1, 2, 3, 4, 5, 6} (na kostce nie ma zera, więc warunek „pierwsza cyfra ≠ 0” jest spełniony automatycznie). Powtórzenia cyfr są dozwolone, kolejność ma znaczenie; wszystkich takich liczb jest 6^3 = 216. Każdemu wynikowi trzech rzutów odpowiada dokładnie jedna liczba.

    Niech A — zbiór liczb podzielnych przez 5, B — zbiór liczb o wszystkich cyfrach różnych. Warunki mogą zachodzić jednocześnie (np. 235), więc przypadki NIE są rozłączne i samo dodawanie dałoby wynik zawyżony.

    |A|: liczba jest podzielna przez 5 wtedy i tylko wtedy, gdy jej cyfra jedności to 0 albo 5; zero jest niemożliwe, więc cyfra jedności musi być równa 5 (1 możliwość), a cyfry setek i dziesiątek są dowolne: |A| = 6\cdot 6\cdot 1 = 36.

    |B|: cyfry różne, więc setki 6 możliwości, dziesiątki 5, jedności 4: |B| = 6\cdot 5\cdot 4 = 120.

    |A ∩ B|: cyfra jedności równa 5, a pozostałe cyfry różne i różne od 5: setki 5 możliwości, dziesiątki 4 możliwości: |A ∩ B| = 5\cdot 4 = 20.

    Z zasady włączeń i wyłączeń:
    |A ∪ B| = 36 + 120 − 20 = 136.

    Kontrola sensowności: 136 < 216 ✓ oraz 136 > 120 = |B| ✓.

    Odpowiedź: 136 liczb.
  solution_steps:
  - Zauważ, że cyframi mogą być tylko 1, 2, 3, 4, 5, 6, a wszystkich otrzymywanych liczb jest 6³ = 216.
  - 'Wprowadź zbiory: A — liczby podzielne przez 5, B — liczby o wszystkich cyfrach różnych; stwierdź,
    że A i B mają część wspólną.'
  - 'Policz |A|: cyfra jedności musi być równa 5, więc |A| = 6·6·1 = 36.'
  - 'Policz |B|: 6·5·4 = 120.'
  - 'Policz |A ∩ B|: jedności = 5, setki 5 możliwości, dziesiątki 4, czyli 20.'
  - Zastosuj |A ∪ B| = 36 + 120 − 20 = 136 i sprawdź, że wynik nie przekracza 216.
