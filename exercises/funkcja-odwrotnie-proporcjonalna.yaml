  - 'Zapisz równość iloczynów: 15\cdot 8=20\cdot x.'
  - Wyznacz x=\frac{120}{20}=6 godzin.
  - 'Oceń sens wyniku: więcej drukarek — krótszy czas, więc 6 h < 8 h; wynik ucznia 10{,}7 h był sprzeczny
