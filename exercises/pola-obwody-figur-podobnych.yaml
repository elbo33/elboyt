  exercise_type: trójkąt równoramienny odcięty prostą równoległą — skala z pól, obwód trapezu
  statement: 'Trójkąt ABC jest równoramienny: |AB| = 12 cm, |CA| = |CB| = 10 cm. Punkt D leży na ramieniu
    CA, punkt E leży na ramieniu CB, a odcinek DE jest równoległy do podstawy AB. Pole trapezu ABED jest
