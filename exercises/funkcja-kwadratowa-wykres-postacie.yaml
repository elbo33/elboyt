- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie kwadratowe: wzór i dziedzina oraz optymalizacja z ograniczeniem zewnętrznym'
  statement: Rolnik chce ogrodzić prostokątny wybieg dla kóz. Jeden bok wybiegu ma w całości przylegać
    do prostej ściany stodoły i tego boku nie trzeba grodzić. Wybieg ma być dodatkowo przedzielony na
    dwie części płotem równoległym do ściany stodoły. Rolnik ma do dyspozycji dokładnie 60 m siatki, którą
    zużyje w całości na pozostałe trzy odcinki ogrodzenia oraz na płot dzielący. Ściana stodoły ma długość
    12 m, więc bok wybiegu przylegający do ściany nie może być dłuższy niż 12 m. a) Wyznacz wzór funkcji
    opisującej pole wybiegu w zależności od długości boku prostopadłego do ściany stodoły oraz podaj dziedzinę
    tej funkcji. b) Oblicz wymiary wybiegu o największym polu i to pole.
  statement_latex: 2x+2y=60,\qquad P\left(x\right)=x\cdot\left(30-x\right),\qquad 0<y\leq 12
  solution: |-
    Oznaczmy przez x (w metrach) długość boku prostopadłego do ściany stodoły, a przez y długość boku przylegającego do ściany.
    Siatka idzie na: dwa boki prostopadłe do ściany (2x), bok równoległy do ściany po przeciwnej stronie (y) oraz płot dzielący, równoległy do ściany, o długości y. Zatem
    2x + y + y = 60, czyli 2x + 2y = 60, stąd y = 30 - x.
    Warunki: x > 0 oraz 0 < y ≤ 12, czyli 0 < 30 - x ≤ 12, co daje 18 ≤ x < 30.
    Dziedzina: x ∈ ⟨18, 30).
    Pole wybiegu:
    P(x) = x·y = x·(30 - x) = -x² + 30x.
    Jest to funkcja kwadratowa o a = -1 < 0; jej wierzchołek ma pierwszą współrzędną
    p = \frac{-30}{2\cdot(-1)} = 15.
    Liczba 15 nie należy do dziedziny ⟨18, 30), więc sprawdzamy monotoniczność: dla a < 0 funkcja maleje w ⟨15, +∞), a więc maleje w całej dziedzinie. Największą wartość przyjmuje dla x = 18:
    P(18) = 18·(30 - 18) = 18·12 = 216.
    Wtedy y = 12 m — ściana stodoły wystarcza (y ≤ 12 ✔).
    Odpowiedź: P(x) = 30x - x² dla x ∈ ⟨18, 30); wybieg o największym polu ma wymiary 18 m × 12 m, a jego pole wynosi 216 m².
  solution_steps:
  - Wprowadzamy x — bok prostopadły do ściany, y — bok przylegający do ściany.
  - 'Zapisujemy bilans siatki: 2x + y + y = 60, stąd y = 30 - x.'
  - Uwzględniamy warunki x > 0 oraz 0 < 30 - x ≤ 12, otrzymując dziedzinę ⟨18, 30).
  - 'Układamy wzór pola: P(x) = x(30 - x) = -x² + 30x.'
  - Obliczamy p = 15 i stwierdzamy, że wierzchołek leży poza dziedziną; funkcja maleje w ⟨18, 30).
  - 'Największe pole jest dla x = 18: P(18) = 216, a wtedy y = 12.'
  - 'Odpowiedź: wymiary 18 m i 12 m, pole 216 m².'
