  statement_latex: 2\cdot x^{3}=32,\qquad L=8\cdot x+4\cdot\left(2\cdot x\right)=16\cdot x
  solution: |-
    Oznaczmy przez \(x\) (w cm) długość krawędzi podstawy, \(x>0\). Wtedy wysokość jest równa \(2x\).

    Objętość: \(V=x^{2}\cdot 2x=2x^{3}\). Z warunku zadania
    \[2\cdot x^{3}=32,\qquad x^{3}=16,\qquad x=\sqrt[3]{16}.\]
    Ponieważ \(16=2^{3}\cdot 2\), mamy \(x=2\cdot\sqrt[3]{2}\ \mathrm{cm}\), a wysokość \(2x=4\cdot\sqrt[3]{2}\ \mathrm{cm}\).

    Prostopadłościan ma 8 krawędzi długości \(x\) (cztery w dolnej i cztery w górnej podstawie) oraz 4 krawędzie boczne długości \(2x\), zatem suma długości krawędzi wynosi
    \[L=8\cdot x+4\cdot 2x=16\cdot x=16\cdot 2\cdot\sqrt[3]{2}=32\cdot\sqrt[3]{2}\ \mathrm{cm}.\]

    Odpowiedź: \(L=32\sqrt[3]{2}\ \mathrm{cm}\ \left(\approx 40{,}3\ \mathrm{cm}\right)\).
  solution_steps:
  - 'Wprowadź zmienną: x — krawędź kwadratowej podstawy (x>0), wysokość równa 2x.'
  - 'Zapisz objętość: V = x²·2x = 2x³.'
  - Z równania 2x³ = 32 wyznacz x³ = 16, czyli x = ∛16 = 2∛2.
  - 'Ułóż wyrażenie na sumę krawędzi: L = 8x + 4·(2x) = 16x.'
  - Podstaw x = 2∛2 i otrzymaj L = 32∛2 cm.
