- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: dowód z podobieństwa trójkątów + rachunki
  statement: |-
    Czworokąt ABCD jest wpisany w okrąg. Jego przekątne AC i BD przecinają się w punkcie S. Wiadomo, że |AS| = 6, |CS| = 4 oraz |BS| = 8.
    a) Wykaż, że trójkąty ASB i DSC są podobne.
    b) Oblicz długość odcinka DS.
    c) Oblicz stosunek pola trójkąta ASB do pola trójkąta DSC.
  statement_latex: '|DS| = \frac{6 \cdot 4}{8},\qquad \frac{P_{ASB}}{P_{DSC}} = \left(\frac{8}{4}\right)^{2}'
  solution: |-
    Założenie: ABCD jest czworokątem wpisanym w okrąg, S — punkt przecięcia przekątnych AC i BD, |AS| = 6, |CS| = 4, |BS| = 8. Teza a): trójkąty ASB i DSC są podobne.

    a) Kąty SAB i CAB to ten sam kąt; jest to kąt wpisany oparty na łuku BC niezawierającym punktu A. Kąt SDC to kąt BDC — kąt wpisany oparty na tym samym łuku BC (punkty A i D leżą po tej samej stronie cięciwy BC, na tym samym łuku). Zatem |∡SAB| = |∡SDC|.
    Kąty ASB i DSC są kątami wierzchołkowymi (proste AC i BD przecinają się w S), więc |∡ASB| = |∡DSC|.
    Dwie pary równych kątów dają, z cechy kk, podobieństwo trójkątów w odpowiedniości A↔D, S↔S, B↔C, czyli ASB ~ DSC — co należało wykazać.

    b) Z podobieństwa (w tej właśnie odpowiedniości) zachodzi proporcja
    \frac{|AS|}{|DS|} = \frac{|BS|}{|CS|}, czyli \frac{6}{|DS|} = \frac{8}{4}.
    Stąd 8 · |DS| = 6 · 4, więc |DS| = \frac{6\cdot 4}{8} = 3.

    c) Skala podobieństwa trójkąta ASB względem trójkąta DSC wynosi k = \frac{|BS|}{|CS|} = \frac{8}{4} = 2 (to samo daje \frac{|AS|}{|DS|} = \frac{6}{3} = 2). Pola figur podobnych są w stosunku k^2, zatem \frac{P_{ASB}}{P_{DSC}} = 2^2 = 4.

    Odpowiedź: |DS| = 3, stosunek pól jest równy 4.
  solution_steps:
  - 'Wskaż równe kąty wpisane: |∡SAB| = |∡SDC| — oba oparte na łuku BC niezawierającym A i D.'
  - 'Wskaż kąty wierzchołkowe: |∡ASB| = |∡DSC|.'
  - Z cechy kk wywnioskuj podobieństwo ASB ~ DSC w odpowiedniości A↔D, S↔S, B↔C.
  - Zapisz proporcję \frac{|AS|}{|DS|} = \frac{|BS|}{|CS|} i wylicz |DS| = \frac{6\cdot 4}{8} = 3.
  - Wyznacz skalę k = \frac{8}{4} = 2 i stosunek pól k^2 = 4.
  answer:
    kind: MULTIPART
    parts:
    - name: a) dowód podobieństwa
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: 'Należy wskazać dwie pary równych kątów: |∡SAB| = |∡SDC| (kąty wpisane oparte na tym samym
          łuku BC) oraz |∡ASB| = |∡DSC| (kąty wierzchołkowe), i powołać się na cechę kk w odpowiedniości
          A↔D, S↔S, B↔C.'
    - name: b) |DS|
      answer:
        kind: NUMERIC
        value: 3.0
    - name: c) stosunek pól
      answer:
        kind: NUMERIC
        value: 4.0
  checks:
  - kind: evaluate
    expr: \frac{6 \cdot 4}{8}
    part: b) |DS|
  - kind: evaluate
    expr: \left(\frac{8}{4}\right)^{2}
    part: c) stosunek pól
