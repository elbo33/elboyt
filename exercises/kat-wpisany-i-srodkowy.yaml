  statement: 'Cięciwy AB i CD okręgu przecinają się w punkcie P leżącym wewnątrz okręgu. Łuk AC objęty
    przez kąt APC ma miarę 80^\circ, a łuk BD objęty przez kąt wierzchołkowy BPD ma miarę 40^\circ. Uczeń
    zapisał: „Kąt APC opiera się na łuku AC, więc |\angle APC| = \frac{1}{2}\cdot 80^\circ = 40^\circ”.
