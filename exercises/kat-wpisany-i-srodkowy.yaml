- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: wzór na kąt w zależności od parametru, dziedzina i badanie wykonalności
  statement: "Trójkąt ABC jest wpisany w okrąg o środku O, przy czym kąt ABC jest dwa razy większy od\
    \ kąta BAC. \na) Wyznacz wzór na miarę kąta OBC w zależności od miary kąta BAC oraz podaj, jakie miary\
    \ (w stopniach) może przyjmować kąt BAC. \nb) Oblicz miary wszystkich kątów trójkąta ABC, jeżeli kąt\
    \ OBC ma miarę 62°. \nc) Rozstrzygnij, czy istnieje trójkąt spełniający warunki zadania, w którym\
    \ kąt OBC ma miarę 25°. Odpowiedź uzasadnij."
  statement_latex: \left|\angle OBC\right| = \frac{180^\circ - 2\cdot x}{2} = 90^\circ - x, \qquad x =
    \left|\angle BAC\right|
  solution: |-
    Oznaczmy przez x miarę kąta BAC (w stopniach). Wtedy |∠ABC| = 2x oraz z sumy kątów trójkąta |∠ACB| = 180° − x − 2x = 180° − 3x.

    a) Kąt środkowy BOC jest oparty na tym samym łuku BC (niezawierającym A) co kąt wpisany BAC, więc |∠BOC| = 2x. Trójkąt BOC jest równoramienny (|OB| = |OC| = r), zatem kąty przy podstawie BC są równe:
    |∠OBC| = (180° − 2x) : 2 = 90° − x.
    Trójkąt istnieje, gdy wszystkie jego kąty są dodatnie: x > 0, 2x > 0 oraz 180° − 3x > 0, czyli x ∈ (0°, 60°).
    Zatem wzór: |∠OBC| = 90° − x dla x ∈ (0°, 60°).

    b) Z równania 90° − x = 62° otrzymujemy x = 28°, a więc:
    |∠BAC| = 28°, |∠ABC| = 2 · 28° = 56°, |∠ACB| = 180° − 3 · 28° = 96°.
    Warunek x ∈ (0°, 60°) jest spełniony, więc taki trójkąt istnieje. Kontrola: 28° + 56° + 96° = 180°.

    c) Gdyby |∠OBC| = 25°, to 90° − x = 25°, czyli x = 65°. Ale wtedy 180° − 3 · 65° = −15° < 0, więc kąt ACB nie istnieje — wartość x = 65° nie należy do przedziału (0°, 60°). Zatem taki trójkąt nie istnieje. (Równoważnie: z wzoru |∠OBC| = 90° − x i x ∈ (0°, 60°) wynika |∠OBC| ∈ (30°, 90°), a 25° nie należy do tego przedziału.)
  solution_steps:
  - Oznaczam x = |∠BAC|; wtedy |∠ABC| = 2x oraz |∠ACB| = 180° − 3x.
  - 'Kąt środkowy BOC oparty na łuku BC: |∠BOC| = 2x.'
  - 'Trójkąt BOC jest równoramienny (|OB| = |OC| = r), więc |∠OBC| = (180° − 2x) : 2 = 90° − x.'
  - 'Warunki istnienia trójkąta: x > 0 i 180° − 3x > 0, czyli x ∈ (0°, 60°).'
  - 'b) 90° − x = 62° daje x = 28°, stąd kąty trójkąta: 28°, 56°, 96° (suma 180°).'
  - c) 90° − x = 25° daje x = 65° ∉ (0°, 60°), więc taki trójkąt nie istnieje (możliwe miary kąta OBC
    to (30°, 90°)).
