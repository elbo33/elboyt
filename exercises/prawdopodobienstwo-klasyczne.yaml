  statement: Ze zbioru liczb \left\{11,\ 12,\ 13,\ \ldots,\ 30\right\} losujemy jedną liczbę. Wylosowanie
    każdej liczby z tego zbioru jest jednakowo prawdopodobne. Oblicz prawdopodobieństwo zdarzenia A polegającego
    na tym, że wylosowana liczba jest podzielna przez 4. Zapisz obliczenia.
  statement_latex: P(A)=\frac{|A|}{|\Omega|}=\frac{5}{20}
  solution: |-
    Zbiór \Omega składa się z kolejnych liczb naturalnych od 11 do 30, więc |\Omega|=30-11+1=20.
    Liczby z tego zbioru podzielne przez 4 to: 12, 16, 20, 24, 28. Zatem |A|=5.
    Stąd P(A)=\frac{5}{20}=\frac{1}{4}.
  solution_steps:
  - Obliczamy |\Omega|=30-11+1=20.
  - 'Wypisujemy liczby sprzyjające: 12, 16, 20, 24, 28, więc |A|=5.'
  - P(A)=\frac{5}{20}=\frac{1}{4}.
  answer:
    kind: SYMBOLIC
    latex: \frac{1}{4}
