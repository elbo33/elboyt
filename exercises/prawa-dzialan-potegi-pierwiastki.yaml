  - Zastosuj wzór \(\sqrt{a^{2}}=\left|a\right|\).
  - Oblicz \(\sqrt{\left(-7\right)^{2}}=\left|-7\right|=7\).
  - 'Ustal znak: \(\sqrt{5}>2\), więc \(\left|2-\sqrt{5}\right|=\sqrt{5}-2\).'
  - 'Dodaj: \(7+\sqrt{5}-2=5+\sqrt{5}\).'
  answer:
