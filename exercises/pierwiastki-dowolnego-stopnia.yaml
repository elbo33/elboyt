- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczanie pierwiastka dowolnego stopnia
  statement: 'Oblicz: a) \sqrt[3]{-64}, b) \sqrt[4]{625}.'
  statement_latex: \text{a) } \sqrt[3]{-64}, \qquad \text{b) } \sqrt[4]{625}
  solution: |-
    a) Stopień pierwiastka wynosi 3, jest więc nieparzysty — pierwiastek z liczby ujemnej istnieje i ma ten sam znak co liczba podpierwiastkowa. Korzystamy ze wzoru \sqrt[3]{-a}=-\sqrt[3]{a}: \sqrt[3]{-64}=-\sqrt[3]{64}. Ponieważ 64=4^{3}, mamy \sqrt[3]{64}=4, czyli \sqrt[3]{-64}=-4. Sprawdzenie: \left(-4\right)^{3}=-64.
    b) Stopień 4 jest parzysty, a liczba podpierwiastkowa jest dodatnia, więc pierwiastek istnieje i jest liczbą nieujemną. Ponieważ 625=5^{4}, otrzymujemy \sqrt[4]{625}=5 (a nie \pm 5). Sprawdzenie: 5^{4}=625.
  solution_steps:
  - Sprawdź parzystość stopnia pierwiastka w każdym podpunkcie.
  - 'a) stopień 3 nieparzysty: \sqrt[3]{-64}=-\sqrt[3]{64}.'
  - Zauważ, że 64=4^{3}, więc \sqrt[3]{64}=4 i \sqrt[3]{-64}=-4.
  - 'b) stopień 4 parzysty, liczba podpierwiastkowa dodatnia: szukamy liczby nieujemnej.'
  - Zauważ, że 625=5^{4}, więc \sqrt[4]{625}=5.
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: NUMERIC
        value: -4.0
        latex: '-4'
    - name: b
      answer:
        kind: NUMERIC
        value: 5.0
        latex: '5'
  checks:
  - kind: evaluate
    expr: -\sqrt[3]{64}
    part: a
  - kind: evaluate
    expr: \sqrt[4]{625}
    part: b
  skills:
  - definicja pierwiastka stopnia n
  - pierwiastek stopnia nieparzystego z liczby ujemnej
  - rozkład na czynniki pierwsze
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [a] SymPy solved it fresh: -4.0 vs -4.0 (tol 1e-09) ; [b] SymPy
      solved it fresh: 5.0 vs 5.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 2
  exercise_type: wyłączanie czynnika przed znak pierwiastka
  statement: Wyłącz czynnik przed znak pierwiastka i zapisz liczbę \sqrt[3]{40} w postaci najprostszej.
  statement_latex: \sqrt[3]{40}
  solution: 'Pod pierwiastkiem stopnia trzeciego szukamy czynnika będącego sześcianem. Rozkładamy liczbę
    podpierwiastkową na czynniki pierwsze: 40=2^{3}\cdot 5. Wykładnik przy dwójce jest podzielny przez
    3, więc dwójkę wyprowadzamy przed pierwiastek: \sqrt[3]{40}=\sqrt[3]{2^{3}\cdot 5}=2\cdot\sqrt[3]{5}.
    Pod pierwiastkiem została liczba 5, która nie ma już dzielnika będącego sześcianem, więc postać 2\sqrt[3]{5}
    jest najprostsza. Sprawdzenie: \left(2\cdot\sqrt[3]{5}\right)^{3}=8\cdot 5=40.'
  solution_steps:
  - 'Rozłóż liczbę podpierwiastkową na czynniki pierwsze: 40=2^{3}\cdot 5.'
  - Zastosuj wzór \sqrt[3]{k^{3}\cdot b}=k\cdot\sqrt[3]{b} dla k=2, b=5.
  - 'Zapisz wynik: \sqrt[3]{40}=2\cdot\sqrt[3]{5}.'
  - Sprawdź, że pod pierwiastkiem nie ma już czynnika będącego sześcianem.
  answer:
    kind: SYMBOLIC
    latex: 2\cdot\sqrt[3]{5}
  checks:
  - kind: simplify
    expr: \sqrt[3]{40}
  skills:
  - wyłączanie czynnika przed pierwiastek
  - rozkład na czynniki pierwsze
  - postać najprostsza wyrażenia pierwiastkowego
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''2\\cdot\\sqrt[3]{5}'' vs ''2*5**(1/3)'''
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: własności pierwiastków
  statement: 'Oblicz: a) \sqrt[4]{2}\cdot\sqrt[4]{128}, b) \sqrt{\sqrt[3]{64}}.'
  statement_latex: \text{a) } \sqrt[4]{2}\cdot\sqrt[4]{128}, \qquad \text{b) } \sqrt{\sqrt[3]{64}}
  solution: |-
    a) Oba pierwiastki mają ten sam stopień 4, a liczby podpierwiastkowe są dodatnie, więc wolno zastosować wzór \sqrt[n]{a}\cdot\sqrt[n]{b}=\sqrt[n]{a\cdot b}: \sqrt[4]{2}\cdot\sqrt[4]{128}=\sqrt[4]{2\cdot 128}=\sqrt[4]{256}. Ponieważ 256=4^{4}, otrzymujemy \sqrt[4]{256}=4.
    b) Korzystamy ze wzoru \sqrt[m]{\sqrt[n]{a}}=\sqrt[m\cdot n]{a}: \sqrt{\sqrt[3]{64}}=\sqrt[6]{64}. Ponieważ 64=2^{6}, mamy \sqrt[6]{64}=2. Można też krócej: \sqrt[3]{64}=4, a \sqrt{4}=2.
  solution_steps:
  - a) Sprawdź, że stopnie pierwiastków są równe (oba stopnia 4).
  - 'Połącz je w jeden pierwiastek: \sqrt[4]{2\cdot 128}=\sqrt[4]{256}.'
  - Zauważ, że 256=4^{4}, więc wynik to 4.
  - 'b) Zastosuj wzór na pierwiastek z pierwiastka: \sqrt{\sqrt[3]{64}}=\sqrt[6]{64}.'
  - Zauważ, że 64=2^{6}, więc wynik to 2.
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: NUMERIC
        value: 4.0
        latex: '4'
    - name: b
      answer:
        kind: NUMERIC
        value: 2.0
        latex: '2'
  checks:
  - kind: evaluate
    expr: \sqrt[4]{2}\cdot\sqrt[4]{128}
    part: a
  - kind: evaluate
    expr: \sqrt{\sqrt[3]{64}}
    part: b
  skills:
  - pierwiastek z iloczynu
  - pierwiastek z pierwiastka
  - obliczanie pierwiastków
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [a] SymPy solved it fresh: 4.0 vs 4.0 (tol 1e-09) ; [b] SymPy
      solved it fresh: 2.0 vs 2.0 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: redukcja sumy wyrażeń pierwiastkowych
  statement: Uprość wyrażenie \sqrt[3]{128}-2\cdot\sqrt[3]{54}+\sqrt[3]{250}.
  statement_latex: \sqrt[3]{128}-2\cdot\sqrt[3]{54}+\sqrt[3]{250}
  solution: |-
    Wszystkie pierwiastki są stopnia trzeciego, więc po wyłączeniu czynników przed pierwiastek mogą okazać się podobne.
    128=2^{7}=\left(2^{2}\right)^{3}\cdot 2=4^{3}\cdot 2, więc \sqrt[3]{128}=4\cdot\sqrt[3]{2}.
    54=27\cdot 2=3^{3}\cdot 2, więc \sqrt[3]{54}=3\cdot\sqrt[3]{2}, czyli 2\cdot\sqrt[3]{54}=6\cdot\sqrt[3]{2}.
    250=125\cdot 2=5^{3}\cdot 2, więc \sqrt[3]{250}=5\cdot\sqrt[3]{2}.
    Wszystkie składniki mają teraz ten sam stopień i tę samą liczbę podpierwiastkową, więc dodajemy współczynniki: 4\cdot\sqrt[3]{2}-6\cdot\sqrt[3]{2}+5\cdot\sqrt[3]{2}=\left(4-6+5\right)\cdot\sqrt[3]{2}=3\cdot\sqrt[3]{2}.
  solution_steps:
  - Sprawdź, że wszystkie pierwiastki są stopnia 3.
  - 'Wyłącz czynniki przed pierwiastek: \sqrt[3]{128}=4\sqrt[3]{2}, \sqrt[3]{54}=3\sqrt[3]{2}, \sqrt[3]{250}=5\sqrt[3]{2}.'
  - 'Uwzględnij współczynnik: 2\cdot\sqrt[3]{54}=6\cdot\sqrt[3]{2}.'
  - 'Zredukuj wyrazy podobne: \left(4-6+5\right)\cdot\sqrt[3]{2}.'
  - 'Zapisz wynik: 3\cdot\sqrt[3]{2}.'
  answer:
    kind: SYMBOLIC
    latex: 3\cdot\sqrt[3]{2}
  checks:
  - kind: simplify
    expr: \sqrt[3]{128}-2\cdot\sqrt[3]{54}+\sqrt[3]{250}
  skills:
  - wyłączanie czynnika przed pierwiastek
  - pierwiastki podobne
  - redukcja wyrazów podobnych
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''3\\cdot\\sqrt[3]{2}'' vs ''3*2**(1/3)'''
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: usuwanie niewymierności z mianownika
  statement: 'Usuń niewymierność z mianownika i zapisz wynik w postaci najprostszej: a) \frac{12}{\sqrt[3]{2}},
    b) \frac{6}{\sqrt[4]{27}}.'
  statement_latex: \text{a) } \frac{12}{\sqrt[3]{2}}, \qquad \text{b) } \frac{6}{\sqrt[4]{27}}
  solution: |-
    a) W mianowniku stoi \sqrt[3]{2^{1}}. Aby dopełnić wykładnik do 3, mnożymy licznik i mianownik przez \sqrt[3]{2^{2}}=\sqrt[3]{4}:
    \frac{12}{\sqrt[3]{2}}=\frac{12\cdot\sqrt[3]{4}}{\sqrt[3]{2}\cdot\sqrt[3]{4}}=\frac{12\cdot\sqrt[3]{4}}{\sqrt[3]{8}}=\frac{12\cdot\sqrt[3]{4}}{2}=6\cdot\sqrt[3]{4}.
    b) Zapisujemy mianownik jako potęgę trójki: 27=3^{3}, więc \sqrt[4]{27}=\sqrt[4]{3^{3}}. Brakuje jednej trójki do 3^{4}, więc mnożymy licznik i mianownik przez \sqrt[4]{3}:
    \frac{6}{\sqrt[4]{3^{3}}}=\frac{6\cdot\sqrt[4]{3}}{\sqrt[4]{3^{4}}}=\frac{6\cdot\sqrt[4]{3}}{3}=2\cdot\sqrt[4]{3}.
    W obu przypadkach mianownik jest liczbą wymierną, a pod pierwiastkiem nie ma czynników będących odpowiednio sześcianem ani czwartą potęgą.
  solution_steps:
  - a) Zauważ, że mianownik to \sqrt[3]{2^{1}} — brakuje wykładnika 2 do stopnia 3.
  - Pomnóż licznik i mianownik przez \sqrt[3]{2^{2}}=\sqrt[3]{4}.
  - 'Uprość mianownik: \sqrt[3]{2}\cdot\sqrt[3]{4}=\sqrt[3]{8}=2, skróć ułamek i otrzymaj 6\cdot\sqrt[3]{4}.'
  - b) Zapisz 27=3^{3}, czyli \sqrt[4]{27}=\sqrt[4]{3^{3}}.
  - Pomnóż licznik i mianownik przez \sqrt[4]{3}, aby otrzymać \sqrt[4]{3^{4}}=3.
  - 'Skróć ułamek: \frac{6\cdot\sqrt[4]{3}}{3}=2\cdot\sqrt[4]{3}.'
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: SYMBOLIC
        latex: 6\cdot\sqrt[3]{4}
    - name: b
      answer:
        kind: SYMBOLIC
        latex: 2\cdot\sqrt[4]{3}
  checks:
  - kind: simplify
    expr: \frac{12}{\sqrt[3]{2}}
    part: a
  - kind: simplify
    expr: \frac{6}{\sqrt[4]{27}}
    part: b
  skills:
  - usuwanie niewymierności przy pierwiastku stopnia n
  - dobór czynnika dopełniającego wykładnik
  - postać najprostsza
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [a] SymPy solved it fresh: ''6\\cdot\\sqrt[3]{4}'' vs ''6*2**(2/3)''
      ; [b] SymPy solved it fresh: ''2\\cdot\\sqrt[4]{3}'' vs ''2*3**(1/4)'''
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: upraszczanie wyrażenia pierwiastkowego z parametrem
  statement: Dane jest wyrażenie W\left(x\right)=\sqrt[4]{81\cdot x^{4}}+\sqrt[3]{-27\cdot x^{3}}-2\cdot
    x, gdzie x jest dowolną liczbą rzeczywistą. Zapisz W\left(x\right) w postaci bez pierwiastków osobno
    dla x\geqslant 0 i osobno dla x<0, a następnie oblicz W\left(-2\right).
  statement_latex: W\left(x\right)=\sqrt[4]{81\cdot x^{4}}+\sqrt[3]{-27\cdot x^{3}}-2\cdot x
  solution: |-
    Pierwszy składnik ma stopień 4 (parzysty): \sqrt[4]{81\cdot x^{4}}=\sqrt[4]{\left(3\cdot x\right)^{4}}=\left|3\cdot x\right|=3\cdot\left|x\right|. Wartości bezwzględnej nie wolno pominąć, bo wynik pierwiastka parzystego stopnia jest nieujemny.
    Drugi składnik ma stopień 3 (nieparzysty): \sqrt[3]{-27\cdot x^{3}}=\sqrt[3]{\left(-3\cdot x\right)^{3}}=-3\cdot x, tutaj wartość bezwzględna nie występuje.
    Zatem W\left(x\right)=3\cdot\left|x\right|-3\cdot x-2\cdot x=3\cdot\left|x\right|-5\cdot x.
    Dla x\geqslant 0 mamy \left|x\right|=x, więc W\left(x\right)=3\cdot x-5\cdot x=-2\cdot x.
    Dla x<0 mamy \left|x\right|=-x, więc W\left(x\right)=-3\cdot x-5\cdot x=-8\cdot x.
    Dla x=-2 korzystamy z drugiego wzoru: W\left(-2\right)=-8\cdot\left(-2\right)=16. Sprawdzenie bezpośrednie: \sqrt[4]{81\cdot 16}+\sqrt[3]{-27\cdot\left(-8\right)}-2\cdot\left(-2\right)=\sqrt[4]{1296}+\sqrt[3]{216}+4=6+6+4=16.
  solution_steps:
  - 'Zapisz 81\cdot x^{4}=\left(3\cdot x\right)^{4} i zastosuj \sqrt[4]{a^{4}}=\left|a\right|: pierwszy
    składnik to 3\cdot\left|x\right|.'
  - 'Zapisz -27\cdot x^{3}=\left(-3\cdot x\right)^{3} i zastosuj \sqrt[3]{a^{3}}=a: drugi składnik to
    -3\cdot x.'
  - 'Zsumuj: W\left(x\right)=3\cdot\left|x\right|-5\cdot x.'
  - 'Dla x\geqslant 0 opuść wartość bezwzględną: W\left(x\right)=-2\cdot x.'
  - 'Dla x<0 zastosuj \left|x\right|=-x: W\left(x\right)=-8\cdot x.'
  - 'Podstaw x=-2 do wzoru dla x<0: W\left(-2\right)=16.'
  answer:
    kind: MULTIPART
    parts:
    - name: wzor dla x>=0
      answer:
        kind: SYMBOLIC
        latex: -2\cdot x
    - name: wzor dla x<0
      answer:
        kind: SYMBOLIC
        latex: -8\cdot x
    - name: W(-2)
      answer:
        kind: NUMERIC
        value: 16.0
        latex: '16'
  checks:
  - kind: evaluate
    expr: \sqrt[4]{81\cdot\left(-2\right)^{4}}+\sqrt[3]{216}-2\cdot\left(-2\right)
    part: W(-2)
  skills:
  - \sqrt[n]{a^{n}} dla n parzystego i nieparzystego
  - wartość bezwzględna
  - rozważanie przypadków
  - obliczanie wartości wyrażenia
  verification:
    checkability: REFERENCE_CALL
    note: '3 parts matched · det: [W(-2)] SymPy solved it fresh: 16.0 vs 16.0 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: upraszczanie wyrażenia pierwiastkowego
  statement: Oblicz wartość wyrażenia \[W=\sqrt[3]{54}-\sqrt[3]{16}+\frac{6}{\sqrt[3]{4}}.\] Wynik zapisz
    w najprostszej postaci (bez pierwiastka w mianowniku i bez czynnika będącego sześcianem pod pierwiastkiem).
  statement_latex: W=\sqrt[3]{54}-\sqrt[3]{16}+\frac{6}{\sqrt[3]{4}}
  solution: |-
    Wszystkie pierwiastki są stopnia trzeciego, więc pod pierwiastkiem szukamy sześcianów.

    1) \(54=27\cdot 2=3^{3}\cdot 2\), zatem \(\sqrt[3]{54}=3\cdot\sqrt[3]{2}\).

    2) \(16=8\cdot 2=2^{3}\cdot 2\), zatem \(\sqrt[3]{16}=2\cdot\sqrt[3]{2}\).

    3) W trzecim składniku usuwamy niewymierność z mianownika. Mianownik to \(\sqrt[3]{4}=\sqrt[3]{2^{2}}\); aby dopełnić wykładnik do 3, mnożymy licznik i mianownik przez \(\sqrt[3]{2}\):
    \[\frac{6}{\sqrt[3]{4}}=\frac{6\cdot\sqrt[3]{2}}{\sqrt[3]{4}\cdot\sqrt[3]{2}}=\frac{6\cdot\sqrt[3]{2}}{\sqrt[3]{8}}=\frac{6\cdot\sqrt[3]{2}}{2}=3\cdot\sqrt[3]{2}.\]

    4) Wszystkie składniki są teraz pierwiastkami podobnymi (stopień 3, liczba podpierwiastkowa 2):
    \[W=3\cdot\sqrt[3]{2}-2\cdot\sqrt[3]{2}+3\cdot\sqrt[3]{2}=\left(3-2+3\right)\cdot\sqrt[3]{2}=4\cdot\sqrt[3]{2}.\]

    Odpowiedź: \(W=4\sqrt[3]{2}\).
  solution_steps:
  - 'Rozłóż liczby podpierwiastkowe: 54=3^3·2 oraz 16=2^3·2.'
  - 'Wyłącz czynniki przed pierwiastek: ∛54=3∛2, ∛16=2∛2.'
  - 'Usuń niewymierność: pomnóż licznik i mianownik ułamka 6/∛4 przez ∛2, otrzymując 3∛2.'
  - 'Zredukuj pierwiastki podobne: (3−2+3)∛2.'
  - 'Zapisz wynik: 4∛2.'
  answer:
    kind: SYMBOLIC
    latex: 4\sqrt[3]{2}
  checks:
  - kind: evaluate
    expr: \sqrt[3]{54}-\sqrt[3]{16}+\frac{6}{\sqrt[3]{4}}
  skills:
  - wyłączanie czynnika przed pierwiastek stopnia n
  - usuwanie niewymierności z mianownika
  - redukcja pierwiastków podobnych
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 5.039684199579493 vs 5.039684199579493 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: wyrażenie pierwiastkowe z parametrem, wartość bezwzględna
  statement: |-
    Dane jest wyrażenie \[W\left(x\right)=\sqrt[6]{64\cdot x^{6}}-\sqrt[5]{-32\cdot x^{5}},\] gdzie \(x\) jest dowolną liczbą rzeczywistą.
    a) Zapisz \(W\left(x\right)\) w postaci niezawierającej pierwiastków — osobno dla \(x\ge 0\) i osobno dla \(x<0\).
    b) Oblicz \(W\left(2\right)\) oraz \(W\left(-3\right)\).
  statement_latex: W\left(x\right)=\sqrt[6]{64\cdot x^{6}}-\sqrt[5]{-32\cdot x^{5}}
  solution: |-
    Pierwszy składnik: stopień 6 jest parzysty, a \(64\cdot x^{6}=\left(2x\right)^{6}\), więc
    \[\sqrt[6]{64\cdot x^{6}}=\left|2x\right|=2\left|x\right|.\]
    Drugi składnik: stopień 5 jest nieparzysty, a \(-32\cdot x^{5}=\left(-2x\right)^{5}\), więc
    \[\sqrt[5]{-32\cdot x^{5}}=-2x\]
    (bez wartości bezwzględnej i bez ograniczeń na \(x\)).
    Stąd
    \[W\left(x\right)=2\left|x\right|-\left(-2x\right)=2\left|x\right|+2x.\]
    a) Dla \(x\ge 0\): \(\left|x\right|=x\), więc \(W\left(x\right)=2x+2x=4x\).
    Dla \(x<0\): \(\left|x\right|=-x\), więc \(W\left(x\right)=-2x+2x=0\).
    b) \(W\left(2\right)=4\cdot 2=8\) (sprawdzenie: \(\sqrt[6]{64\cdot 64}-\sqrt[5]{-32\cdot 32}=4-\left(-4\right)=8\)).
    \(W\left(-3\right)=0\) (sprawdzenie: \(\sqrt[6]{64\cdot 729}-\sqrt[5]{-32\cdot\left(-243\right)}=6-6=0\)).
  solution_steps:
  - 'Zauważ, że 64·x⁶=(2x)⁶ i zastosuj ⁶√(a⁶)=|a| (stopień parzysty): ⁶√(64x⁶)=2|x|.'
  - 'Zauważ, że −32·x⁵=(−2x)⁵ i zastosuj ⁵√(a⁵)=a (stopień nieparzysty): ⁵√(−32x⁵)=−2x.'
  - Zapisz W(x)=2|x|+2x.
  - 'Dla x≥0 opuść wartość bezwzględną: W(x)=4x.'
  - 'Dla x<0 podstaw |x|=−x: W(x)=0.'
  - Oblicz W(2)=8 oraz W(−3)=0.
  answer:
    kind: MULTIPART
    parts:
    - name: W_dla_x_nieujemnych
      answer:
        kind: SYMBOLIC
        latex: 4x
    - name: W_dla_x_ujemnych
      answer:
        kind: SYMBOLIC
        latex: '0'
    - name: W_w_2
      answer:
        kind: NUMERIC
        value: 8.0
    - name: W_w_minus3
      answer:
        kind: NUMERIC
        value: 0.0
  checks:
  - kind: evaluate
    expr: 2\cdot\left|2\right|+2\cdot 2
    part: W_w_2
  - kind: evaluate
    expr: 2\cdot\left|-3\right|+2\cdot\left(-3\right)
    part: W_w_minus3
  skills:
  - ⁿ√(aⁿ)=a lub |a| w zależności od parzystości stopnia
  - wyłączanie czynnika przed pierwiastek
  - obliczanie wartości wyrażenia z parametrem
  verification:
    checkability: REFERENCE_CALL
    note: 4 parts matched
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 4
  difficulty: 2
  exercise_type: obliczanie pierwiastków, istnienie pierwiastka
  statement: 'Oblicz \sqrt[5]{-32}. Następnie rozstrzygnij, czy istnieje liczba rzeczywista równa \sqrt[4]{-81},
    i uzasadnij odpowiedź. Uczeń rozumował tak: „Skoro \sqrt[3]{-8}=-2, to minus zawsze można wyprowadzić
    przed pierwiastek, więc \sqrt[4]{-81}=-\sqrt[4]{81}=-3”. Wskaż błąd w tym rozumowaniu.'
  statement_latex: \sqrt[5]{-32}, \qquad \sqrt[4]{-81}
  solution: |-
    BŁĘDNE ROZUMOWANIE: „Reguła \sqrt[n]{-a}=-\sqrt[n]{a} działa zawsze, więc \sqrt[4]{-81}=-\sqrt[4]{81}=-3”. Otrzymana odpowiedź: -3.
