    w naczyniu oraz odległość powierzchni wody od górnego brzegu naczynia.
  statement_latex: \left(\frac{h}{30}\right)^{3}=\frac{8}{27}
  solution: |-
    Powierzchnia wody jest równoległa do podstawy, więc woda wypełnia stożek podobny do całego naczynia (wierzchołek obu stożków jest wspólny — to dolny wierzchołek naczynia).
    Niech \(h\) oznacza wysokość słupa wody, a \(k=\frac{h}{30}\) — skalę podobieństwa stożka wody do naczynia.
    Z zależności między objętościami brył podobnych: \(k^{3}=\frac{V_{\text{wody}}}{V_{\text{naczynia}}}=\frac{8}{27}\).
    Stąd \(k=\sqrt[3]{\frac{8}{27}}=\frac{2}{3}\).
    Wysokość słupa wody: \(h=k\cdot 30=\frac{2}{3}\cdot 30=20\ \mathrm{cm}\).
    Odległość powierzchni wody od górnego brzegu naczynia: \(30-20=10\ \mathrm{cm}\).
