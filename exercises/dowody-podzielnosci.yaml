exercises:
- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: dzielenie z resztą
  statement: Zapisz liczbę \(-47\) w postaci \(-47 = 6\cdot q + r\), gdzie \(q\) i \(r\) są liczbami całkowitymi
    oraz \(0 \le r < 6\). Podaj wyznaczoną resztę \(r\) oraz iloraz całkowity \(q\).
  statement_latex: -47 = 6\cdot q + r,\qquad 0 \le r < 6
  solution: |-
    Szukamy takiej liczby całkowitej q, aby po odjęciu 6\cdot q od liczby -47 otrzymać liczbę z przedziału [0,6). Dla q = -8 mamy 6\cdot(-8) = -48, a więc r = -47 - (-48) = 1 oraz 0 \le 1 < 6. Zatem -47 = 6\cdot(-8) + 1, czyli reszta wynosi 1, a iloraz całkowity wynosi -8.

    Uwaga: zapis -47 = 6\cdot(-7) + (-5) nie jest poprawny, bo reszta nie może być ujemna.
  solution_steps:
  - Z twierdzenia o dzieleniu z resztą szukamy q, r całkowitych, dla których -47 = 6\cdot q + r oraz 0
    \le r < 6.
  - Największa wielokrotność liczby 6 nie większa od -47 to 6\cdot(-8) = -48.
  - Obliczamy r = -47 - \left(-48\right) = 1 i sprawdzamy warunek 0 \le 1 < 6.
  - 'Zapisujemy wynik: -47 = 6\cdot\left(-8\right) + 1, więc r = 1, q = -8.'
  answer:
    kind: MULTIPART
    parts:
    - name: reszta r
      answer:
        kind: NUMERIC
        value: 1.0
    - name: iloraz q
      answer:
        kind: NUMERIC
        value: -8.0
  checks:
  - kind: evaluate
    expr: -47 - 6\cdot\left(-8\right)
    part: reszta r
  - kind: evaluate
    expr: \frac{-47 - 1}{6}
    part: iloraz q
  skills:
  - twierdzenie o dzieleniu z resztą
  - wyznaczanie reszty liczby ujemnej
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [reszta r] SymPy solved it fresh: 1.0 vs 1.0 (tol 1e-09) ;
      [iloraz q] SymPy solved it fresh: -8.0 vs -8.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: ogólna postać liczby o zadanej reszcie
  statement: Liczba całkowita \(n\) daje resztę \(3\) przy dzieleniu przez \(7\). Zapisz ogólną postać
    liczby \(n\) za pomocą parametru całkowitego \(k\) oraz wyznacz resztę z dzielenia liczby \(n+11\)
    przez \(7\).
  statement_latex: n = 7\cdot k + 3,\qquad k \in \mathbb{Z}
  solution: |-
    Liczby dające resztę 3 przy dzieleniu przez 7 to dokładnie liczby postaci n = 7\cdot k + 3, gdzie k jest liczbą całkowitą.

    Wtedy n + 11 = 7\cdot k + 3 + 11 = 7\cdot k + 14 = 7\cdot\left(k+2\right).

    Liczba k+2 jest całkowita, więc n+11 jest iloczynem liczby 7 i liczby całkowitej, czyli jest podzielna przez 7. Reszta z dzielenia liczby n+11 przez 7 wynosi 0.
  solution_steps:
  - 'Zapisujemy n wzorem: n = 7\cdot k + 3, gdzie k \in \mathbb{Z}.'
  - Obliczamy n + 11 = 7\cdot k + 3 + 11 = 7\cdot k + 14.
  - 'Wyłączamy czynnik: 7\cdot k + 14 = 7\cdot\left(k+2\right), a k+2 jest liczbą całkowitą.'
  - Zatem 7 \mid \left(n+11\right), czyli reszta wynosi 0.
  answer:
    kind: MULTIPART
    parts:
    - name: postać liczby n
      answer:
        kind: SYMBOLIC
        latex: 7k+3,\ k\in\mathbb{Z}
    - name: reszta z dzielenia n+11 przez 7
      answer:
        kind: NUMERIC
        value: 0.0
  checks:
  - kind: evaluate
    expr: 7\cdot k + 3 + 11 - 7\cdot\left(k+2\right)
    var: k
    part: reszta z dzielenia n+11 przez 7
  skills:
  - zapisywanie liczby wzorem nk+r
  - wyznaczanie reszty wyrażenia
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: PARSE_ERROR: "UnexpectedCharacters: No terminal matches
