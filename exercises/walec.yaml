  statement: Przekrój osiowy walca jest kwadratem o obwodzie 32. Oblicz objętość tego walca.
  statement_latex: 4\cdot \left(2r\right) = 32,\qquad H = 2r
  solution: |-
    Typowy błąd: uczeń rozumuje „kwadrat ma równe boki, więc r = H”. Z obwodu 32 otrzymuje bok 8, przyjmuje r = 8 i H = 8, a stąd V = \pi \cdot 8^2 \cdot 8 = 512\pi. To wynik błędny.
