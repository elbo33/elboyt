- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: prosta przez dwa punkty i sprawdzenie przynależności punktu
  statement: W kartezjańskim układzie współrzędnych (x, y) dane są punkty A = (-4, 1) oraz B = (2, -3).
    Prosta AB ma równanie w postaci kierunkowej y = ax + b. Oblicz współczynnik kierunkowy a oraz wyraz
    wolny b tej prostej, a następnie rozstrzygnij, czy punkt C = (5, -5) leży na prostej AB. Zapisz obliczenia.
  statement_latex: a = \frac{-3-1}{2-\left(-4\right)},\qquad 1 = a\cdot\left(-4\right)+b
  solution: |-
    Ponieważ x_A = -4 \ne 2 = x_B, prosta AB nie jest pionowa.
    Współczynnik kierunkowy: a = \frac{y_B-y_A}{x_B-x_A} = \frac{-3-1}{2-\left(-4\right)} = \frac{-4}{6} = -\frac{2}{3}.
    Wyraz wolny wyznaczamy, wstawiając współrzędne punktu A do równania y = ax + b:
    1 = -\frac{2}{3}\cdot\left(-4\right)+b, czyli 1 = \frac{8}{3}+b, stąd b = 1-\frac{8}{3} = -\frac{5}{3}.
    Prosta AB: y = -\frac{2}{3}x-\frac{5}{3}.
    Sprawdzenie dla punktu B: -\frac{2}{3}\cdot 2-\frac{5}{3} = -\frac{4}{3}-\frac{5}{3} = -3 \checkmark.
    Sprawdzamy punkt C = (5, -5): -\frac{2}{3}\cdot 5-\frac{5}{3} = -\frac{10}{3}-\frac{5}{3} = -\frac{15}{3} = -5, a więc równość jest prawdziwa.
    Odpowiedź: a = -\frac{2}{3}, b = -\frac{5}{3}, punkt C leży na prostej AB.
  solution_steps:
  - Sprawdź, że x_A \ne x_B, więc prosta AB nie jest pionowa.
  - Oblicz a = \frac{-3-1}{2-\left(-4\right)} = -\frac{2}{3}.
  - 'Wstaw współrzędne punktu A do y = ax+b: 1 = -\frac{2}{3}\cdot\left(-4\right)+b i wyznacz b = -\frac{5}{3}.'
  - 'Podstaw współrzędne punktu C: -\frac{2}{3}\cdot 5-\frac{5}{3} = -5 — równość zachodzi.'
  - 'Sformułuj wniosek: punkt C leży na prostej AB.'
  answer:
    kind: MULTIPART
    parts:
    - name: wspolczynnik_a
      answer:
        kind: NUMERIC
        value: -0.6666666666666666
        latex: -\frac{2}{3}
    - name: wyraz_wolny_b
      answer:
        kind: NUMERIC
        value: -1.6666666666666667
        latex: -\frac{5}{3}
    - name: czy_C_lezy_na_prostej
      answer:
        kind: BOOLEAN
        latex: \text{tak}
        truth: true
  checks:
  - kind: evaluate
    expr: \frac{-3-1}{2-\left(-4\right)}
    part: wspolczynnik_a
  - kind: solve_equation
    expr: 1 = -\frac{2}{3}\cdot\left(-4\right)+b
    var: b
    part: wyraz_wolny_b
  skills:
  - współczynnik kierunkowy z dwóch punktów
  - wyznaczanie wyrazu wolnego
  - sprawdzanie, czy punkt należy do prostej
  verification:
    checkability: REFERENCE_CALL
    note: '3 parts matched · det: [wspolczynnik_a] SymPy solved it fresh: -0.6666666666666666 vs -0.6666666666666666
