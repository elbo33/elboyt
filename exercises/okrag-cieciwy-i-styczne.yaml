  statement: Punkt P leży na zewnątrz okręgu o środku O i promieniu 5. Odległość punktu P od środka okręgu
    jest równa |OP| = 13. Z punktu P poprowadzono styczną do tego okręgu, a jej punkt styczności oznaczono
    przez A. Oblicz długość odcinka stycznego PA. Zapisz obliczenia.
  statement_latex: '|PA| = \sqrt{13^{2}-5^{2}}'
  solution: |-
    Styczna jest prostopadła do promienia poprowadzonego do punktu styczności, więc kąt OAP jest kątem prostym.
    Trójkąt OAP jest prostokątny z kątem prostym przy A: przyprostokątne to |OA| = r = 5 oraz |PA|, a przeciwprostokątną jest |OP| = 13.
    Z twierdzenia Pitagorasa: |PA|^{2} = 13^{2} - 5^{2} = 169 - 25 = 144, więc |PA| = 12.
    Sprawdzenie: 12 < 13, czyli odcinek styczny jest krótszy od |OP| – zgadza się.
  solution_steps:
  - Narysuj promień OA do punktu styczności i zaznacz kąt prosty przy A.
  - W trójkącie OAP przeciwprostokątną jest OP = 13, przyprostokątną OA = 5.
  - 'Z Pitagorasa: |PA|^2 = 169 - 25 = 144.'
  - '|PA| = 12.'
