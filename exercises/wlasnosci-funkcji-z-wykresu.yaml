  exercise_type: 'korekta błędu: dziedzina a zbiór wartości'
  statement: 'Funkcja f jest określona wzorem f(x) = -2x + 1 dla x ∈ ⟨-3, 2⟩. Jej wykresem jest odcinek
    o końcach (-3, 7) oraz (2, -3), przy czym oba końce należą do wykresu (kropki pełne). Uczeń zapisał:
    „Dziedziną funkcji f jest przedział ⟨-3, 7⟩, bo wykres sięga od -3 do 7”. Wyjaśnij, na czym polega
    błąd ucznia, a następnie podaj poprawnie dziedzinę oraz zbiór wartości funkcji f.'
  statement_latex: f\left(x\right)=-2\cdot x+1,\qquad x\in\left\langle -3,\,2\right\rangle,\qquad \left(-3,\,7\right),\
    \left(2,\,-3\right)
  solution: |-
    Błędne rozumowanie ucznia: „patrzę, jak wysoko i jak nisko leży wykres — od -3 do 7 — i to jest dziedzina”, czyli D_f = ⟨-3, 7⟩. Uczeń odczytał liczby z osi OY (drugie współrzędne końców odcinka: 7 i -3) i nazwał je dziedziną. To pomylenie dziedziny ze zbiorem wartości.

    Korekta: dziedzina to zbiór ARGUMENTÓW, czyli pierwszych współrzędnych punktów wykresu — odczytujemy ją z osi OX. Pierwsze współrzędne końców to -3 i 2, oba końce z kropkami pełnymi, więc D_f = ⟨-3, 2⟩ (co zresztą podano we wzorze funkcji).

    Zbiór wartości to zbiór drugich współrzędnych, czyli rzut wykresu na oś OY. Funkcja maleje (współczynnik -2), f(-3) = 6 + 1 = 7 oraz f(2) = -4 + 1 = -3, a wykres jest odcinkiem, więc przyjmuje wszystkie wartości pomiędzy: ZW_f = ⟨-3, 7⟩.

    Zapamiętaj: „x — dziedzina, y — wartości”.
  solution_steps:
  - 'Pokaż błąd: uczeń odczytał skrajne poziomy wykresu (7 i -3), czyli liczby z osi OY, i nazwał je dziedziną
    — to zbiór wartości.'
  - 'Przypomnij definicję: dziedzina to zbiór argumentów, odczytywany z osi OX.'
  - 'Odczytaj pierwsze współrzędne końców odcinka: -3 i 2, kropki pełne, więc D_f = ⟨-3, 2⟩.'
  - 'Oblicz wartości na końcach: f(-3) = 7, f(2) = -3; funkcja jest malejąca i ciągła, więc ZW_f = ⟨-3,
    7⟩.'
  - 'Podsumuj: dziedzina ⟨-3, 2⟩, zbiór wartości ⟨-3, 7⟩.'
  answer:
    kind: MULTIPART
    parts:
    - name: dziedzina
      answer:
