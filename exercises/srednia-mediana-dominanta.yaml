- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie średniej arytmetycznej
  statement: 'W ciągu pięciu kolejnych dni pewna wypożyczalnia wypożyczyła kolejno: 7, 11, 4, 9 oraz 14
    rowerów. Oblicz średnią arytmetyczną dziennej liczby wypożyczonych rowerów.'
  statement_latex: \bar{x}=\frac{7+11+4+9+14}{5}
  solution: |-
    Liczebność zestawu wynosi n = 5.
    Suma danych: 7 + 11 + 4 + 9 + 14 = 45.
    Średnia arytmetyczna: \bar{x}=\frac{45}{5}=9.
    Sprawdzenie: 4 \le 9 \le 14, więc wynik mieści się między najmniejszą a największą daną.
    Odpowiedź: średnio 9 rowerów dziennie.
  solution_steps:
  - 'Policz liczebność zestawu: n = 5.'
  - 'Zsumuj dane: 7 + 11 + 4 + 9 + 14 = 45.'
  - 'Podziel sumę przez liczebność: \frac{45}{5}=9.'
  - Sprawdź, czy 4 \le 9 \le 14.
  answer:
    kind: NUMERIC
    value: 9.0
    latex: '9'
  checks:
  - kind: evaluate
    expr: \frac{7+11+4+9+14}{5}
