  exercise_type: zadanie modelujące — klasyfikacja trójkąta z warunków słownych
  statement: Obwód pewnego trójkąta równoramiennego jest równy 36 cm, a jego podstawa jest o 3 cm dłuższa
    od ramienia. Oblicz długość ramienia i długość podstawy tego trójkąta oraz rozstrzygnij, jakiego rodzaju
    ze względu na kąty jest ten trójkąt (ostrokątny, prostokątny czy rozwartokątny).
  statement_latex: 2 \cdot x + \left(x + 3\right) = 36
  solution: |-
    Oznaczmy przez x długość ramienia (w cm). Wtedy podstawa ma długość x + 3, a trójkąt ma boki x, x, x + 3.

    Z warunku o obwodzie: 2 \cdot x + \left(x + 3\right) = 36, czyli 3x + 3 = 36, stąd 3x = 33 i x = 11.
    Ramię ma więc długość 11 cm, a podstawa 11 + 3 = 14 cm.

    Sprawdzenie istnienia trójkąta: 11 + 11 = 22 > 14 ✔.

    Najdłuższym bokiem jest podstawa c = 14, więc naprzeciw niej leży największy kąt i to on decyduje o rodzaju trójkąta. Porównujemy:
    11^2 + 11^2 = 121 + 121 = 242 oraz 14^2 = 196.
    Ponieważ 242 > 196, czyli a^2 + b^2 > c^2, największy kąt jest ostry, a zatem wszystkie kąty trójkąta są ostre.

    Odpowiedź: ramię ma 11 cm, podstawa 14 cm, trójkąt jest ostrokątny (i równoramienny).
  solution_steps:
  - 'Wprowadź zmienną: x — długość ramienia, wtedy podstawa ma długość x + 3.'
  - 'Zapisz równanie obwodu: 2 \cdot x + \left(x + 3\right) = 36.'
  - 'Rozwiąż: 3x + 3 = 36, x = 11; podstawa ma długość 14.'
  - 'Sprawdź nierówność trójkąta: 11 + 11 = 22 > 14 ✔.'
  - Wskaż najdłuższy bok c = 14 i porównaj 11^2 + 11^2 = 242 z 14^2 = 196.
  - Ponieważ 242 > 196, kąt naprzeciw najdłuższego boku jest ostry — trójkąt jest ostrokątny.
  answer:
    kind: MULTIPART
    parts:
    - name: ramie
      answer:
        kind: NUMERIC
        value: 11.0
    - name: podstawa
      answer:
        kind: NUMERIC
        value: 14.0
    - name: rodzaj
      answer:
        kind: SYMBOLIC
        latex: ostrokątny
  checks:
  - kind: solve_equation
    expr: 2 \cdot x + \left(x + 3\right) = 36
    part: ramie
  - kind: evaluate
    expr: 11 + 3
    part: podstawa
