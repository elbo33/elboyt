  statement_latex: S=\left(\frac{1+7}{2},\ \frac{-1+3}{2}\right),\qquad r=\frac{1}{2}\cdot\sqrt{\left(7-1\right)^2+\left(3+1\right)^2}
  solution: |-
    a) Środek okręgu opisanego na kwadracie to punkt przecięcia jego przekątnych, czyli środek odcinka AC:
    S=\left(\frac{1+7}{2},\frac{-1+3}{2}\right)=\left(4,1\right).
    Promień to połowa przekątnej:
    \left|AC\right|=\sqrt{\left(7-1\right)^2+\left(3+1\right)^2}=\sqrt{36+16}=\sqrt{52}=2\cdot\sqrt{13},
    więc r=\frac{2\cdot\sqrt{13}}{2}=\sqrt{13} oraz r^2=13.
    Równanie okręgu: \left(x-4\right)^2+\left(y-1\right)^2=13.

    b) Odległość środka S=\left(4,1\right) od osi Ox wynosi \left|1\right|=1. Ponieważ 1<\sqrt{13} (bo 1^2=1<13=r^2), odległość środka od osi jest mniejsza od promienia, a więc okrąg przecina oś Ox w dwóch punktach.

    c) Podstawiamy y=0 do równania okręgu:
    \left(x-4\right)^2+\left(0-1\right)^2=13
    \left(x-4\right)^2=12
    x-4=2\cdot\sqrt{3} albo x-4=-2\cdot\sqrt{3},
    czyli x=4+2\cdot\sqrt{3} albo x=4-2\cdot\sqrt{3}.
    Punkty wspólne to \left(4-2\cdot\sqrt{3},0\right) i \left(4+2\cdot\sqrt{3},0\right).
  solution_steps:
  - 'Zauważ, że środek okręgu opisanego na kwadracie to środek jego przekątnej AC: S=\left(4,1\right).'
  - Oblicz \left|AC\right|=\sqrt{36+16}=2\cdot\sqrt{13} i promień r=\sqrt{13}, czyli r^2=13.
  - 'Zapisz równanie okręgu: \left(x-4\right)^2+\left(y-1\right)^2=13.'
  - 'Porównaj odległość środka od osi Ox, równą 1, z promieniem \sqrt{13}: 1<\sqrt{13}, więc okrąg przecina
    oś Ox w dwóch punktach.'
  - 'Podstaw y=0: \left(x-4\right)^2=12, stąd x=4-2\cdot\sqrt{3} lub x=4+2\cdot\sqrt{3}.'
