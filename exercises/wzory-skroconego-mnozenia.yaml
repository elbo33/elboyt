- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie: funkcja kwadratowa z dziedziną i ograniczeniem'
  statement: Drut o długości 40 cm rozcięto na dwie części i z każdej z nich zgięto kwadrat (cały drut
    został zużyty). Wiadomo, że pierwsza część drutu jest co najmniej o 8 cm dłuższa od drugiej części.
    a) Wyznacz wzór funkcji S opisującej sumę pól obu kwadratów w zależności od długości x boku kwadratu
    zbudowanego z pierwszej części drutu oraz podaj dziedzinę tej funkcji. b) Oblicz najmniejszą możliwą
    wartość sumy pól obu kwadratów oraz podaj długości obu części drutu, dla których ta najmniejsza wartość
    jest osiągana.
  statement_latex: S\left(x\right) = x^{2} + \left(10-x\right)^{2}, \qquad 4\cdot x - \left(40 - 4\cdot
    x\right) \ge 8
  solution: |-
    Niech x (w cm) oznacza długość boku kwadratu zgiętego z pierwszej części drutu. Wtedy pierwsza część ma długość 4\cdot x, a druga 40 - 4\cdot x, więc bok drugiego kwadratu jest równy \frac{40-4\cdot x}{4} = 10 - x.
    Suma pól: S\left(x\right) = x^{2} + \left(10-x\right)^{2} = x^{2} + 100 - 20x + x^{2} = 2x^{2} - 20x + 100.
    Dziedzina: drugi kwadrat musi istnieć, więc 10 - x > 0, czyli x < 10. Warunek z treści: 4\cdot x \ge \left(40-4\cdot x\right) + 8, czyli 8\cdot x \ge 48, a stąd x \ge 6. Zatem D = \left\langle 6;\ 10\right).
    b) Zwijamy pełny kwadrat: S\left(x\right) = 2\cdot\left(x^{2}-10x+25\right) + 50 = 2\cdot\left(x-5\right)^{2} + 50.
    Wierzchołek paraboli ma pierwszą współrzędną x = 5, ale 5 \notin D — ta wartość jest niedopuszczalna. Na przedziale \left\langle 6;\ 10\right) funkcja S jest rosnąca (bo 6 > 5), więc najmniejszą wartość przyjmuje na lewym krańcu, dla x = 6:
    S\left(6\right) = 2\cdot\left(6-5\right)^{2} + 50 = 52.
    Wtedy pierwsza część drutu ma długość 4\cdot 6 = 24 cm, a druga 40 - 24 = 16 cm (różnica 24-16 = 8 cm, warunek spełniony).
    Odpowiedź: S\left(x\right) = 2x^{2}-20x+100 dla x \in \left\langle 6;\ 10\right); najmniejsza suma pól to 52 cm^{2} przy podziale drutu na części 24 cm i 16 cm.
  solution_steps:
  - Oznacz przez x bok pierwszego kwadratu; pierwsza część drutu ma 4\cdot x cm, druga 40-4\cdot x cm.
  - 'Wyznacz bok drugiego kwadratu: \frac{40-4\cdot x}{4} = 10-x.'
  - 'Zapisz i rozwiń objętość celu: S\left(x\right) = x^{2} + \left(10-x\right)^{2} = 2x^{2}-20x+100.'
  - 'Wyznacz dziedzinę: 10-x>0 oraz 4\cdot x - \left(40-4\cdot x\right) \ge 8, czyli x \in \left\langle
    6;\ 10\right).'
  - 'Zwiń pełny kwadrat: S\left(x\right) = 2\cdot\left(x-5\right)^{2}+50; wierzchołek x=5 nie należy do
    dziedziny.'
  - 'Na \left\langle 6;\ 10\right) funkcja rośnie, więc minimum w x=6: S\left(6\right)=52 cm^{2}, a części
    drutu mają 24 cm i 16 cm.'
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_funkcji
      answer:
        kind: SYMBOLIC
        latex: 2x^{2} - 20x + 100
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '6'
        hi: '10'
        lo_open: false
    - name: najmniejsza_suma_pol
      answer:
        kind: NUMERIC
        value: 52.0
    - name: dlugosci_czesci_drutu
      answer:
        kind: TUPLE
        items:
        - '24'
        - '16'
  checks:
  - kind: simplify
    expr: x^{2} + \left(10-x\right)^{2}
    part: wzor_funkcji
  - kind: evaluate
    expr: 2\cdot 6^{2} - 20\cdot 6 + 100
