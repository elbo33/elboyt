- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: monotoniczność ciągu wymiernego + nierówność z wyrazem ciągu
  statement: Ciąg \left( a_{n} \right) jest określony wzorem a_{n} = \frac{4n - 3}{n + 1} dla każdej liczby
    naturalnej n \geq 1. Wyznacz i uprość różnicę a_{n+1} - a_{n}, rozstrzygnij, czy ciąg \left( a_{n}
    \right) jest rosnący, czy malejący, a następnie wyznacz najmniejszą liczbę naturalną n, dla której
    a_{n} > 3{,}5.
  statement_latex: a_{n} = \frac{4\cdot n - 3}{n + 1}
  solution: |-
    Dla n \geq 1 mianownik n + 1 > 0, więc wzór ma sens.
    Podstawiamy (n+1) w miejsce każdego n:
    a_{n+1} = \frac{4\cdot \left(n+1\right) - 3}{\left(n+1\right) + 1} = \frac{4n + 1}{n + 2}.
    Różnica:
    a_{n+1} - a_{n} = \frac{4n+1}{n+2} - \frac{4n-3}{n+1} = \frac{\left(4n+1\right)\cdot\left(n+1\right) - \left(4n-3\right)\cdot\left(n+2\right)}{\left(n+1\right)\cdot\left(n+2\right)}.
    Licznik: \left(4n+1\right)\left(n+1\right) = 4n^{2} + 5n + 1, \left(4n-3\right)\left(n+2\right) = 4n^{2} + 5n - 6, a ich różnica wynosi 7.
    Zatem a_{n+1} - a_{n} = \frac{7}{\left(n+1\right)\cdot\left(n+2\right)}.
    Dla każdego n \geq 1 mamy n + 1 > 0 i n + 2 > 0, więc różnica jest dodatnia — ciąg jest rosnący.
    Teraz nierówność a_{n} > 3{,}5:
    \frac{4n-3}{n+1} > \frac{7}{2}. Ponieważ n + 1 > 0, mnożymy obustronnie przez 2\cdot\left(n+1\right):
    2\cdot\left(4n - 3\right) > 7\cdot\left(n + 1\right), czyli 8n - 6 > 7n + 7, stąd n > 13.
    Najmniejszą liczbą naturalną spełniającą ten warunek jest n = 14 (sprawdzenie: a_{14} = \frac{53}{15} \approx 3{,}53 > 3{,}5, a a_{13} = \frac{49}{14} = 3{,}5).
  solution_steps:
  - Zauważ, że n + 1 > 0 dla n \geq 1.
  - Wyznacz a_{n+1} = \frac{4\cdot\left(n+1\right) - 3}{\left(n+1\right)+1} = \frac{4n+1}{n+2}.
  - Utwórz różnicę i sprowadź do wspólnego mianownika \left(n+1\right)\left(n+2\right).
  - 'Uprość licznik: \left(4n^{2}+5n+1\right) - \left(4n^{2}+5n-6\right) = 7.'
  - Stwierdź, że a_{n+1} - a_{n} = \frac{7}{\left(n+1\right)\left(n+2\right)} > 0, więc ciąg jest rosnący.
  - Rozwiąż nierówność \frac{4n-3}{n+1} > \frac{7}{2}, otrzymując n > 13.
  - Wybierz najmniejszą liczbę naturalną większą od 13, czyli n = 14.
  answer:
    kind: MULTIPART
    parts:
    - name: roznica
      answer:
        kind: SYMBOLIC
        latex: \frac{7}{\left(n+1\right)\cdot\left(n+2\right)}
    - name: monotonicznosc
      answer:
        kind: SYMBOLIC
        latex: rosnący
    - name: n_min
      answer:
        kind: NUMERIC
        value: 14.0
  checks:
  - kind: simplify
    expr: \frac{4\cdot\left(n+1\right)-3}{\left(n+1\right)+1} - \frac{4\cdot n - 3}{n+1}
    var: n
    part: roznica
  - kind: evaluate
    expr: \left\lfloor 13 \right\rfloor + 1
    var: n
    part: n_min
  skills:
