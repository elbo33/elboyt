  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń poprawnie policzył 4² + 7² = 16 + 49 = 65 oraz 9² = 81, ale odwrócił wniosek: uznał, że nierówność a² + b² < c² oznacza „za krótki” bok c i kąt ostry.
    DLACZEGO TO BŁĄD: jest dokładnie odwrotnie. Gdy a² + b² < c², bok c jest ZA DŁUGI jak na kąt prosty, więc kąt leżący naprzeciw niego jest ROZWARTY. Kąt ostry naprzeciw c mamy wtedy, gdy a² + b² > c².
    POPRAWNIE: 4 + 7 = 11 > 9, więc trójkąt istnieje. Ponieważ 65 < 81, trójkąt jest ROZWARTOKĄTNY, a kąt rozwarty leży naprzeciw boku długości 9.
    Potwierdzenie rachunkiem: cos γ = (4² + 7² − 9²)/(2·4·7) = (65 − 81)/56 = −16/56 = −2/7 ≈ −0,286. Ujemny cosinus oznacza kąt rozwarty.
