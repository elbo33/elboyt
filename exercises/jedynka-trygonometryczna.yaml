      SymPy solved it fresh: 0.9359999999999999 vs 0.9359999999999999 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: wyznaczanie sin, cos i tg z równania z funkcjami trygonometrycznymi
  statement: Kąt α jest ostry i spełnia warunek \frac{2\cdot\sin\alpha + 3\cdot\cos\alpha}{\sin\alpha
    - \cos\alpha} = 7. Oblicz tg α, a następnie sin α oraz cos α.
  statement_latex: \frac{2\cdot\sin\alpha + 3\cdot\cos\alpha}{\sin\alpha - \cos\alpha} = 7
  solution: |-
    Ponieważ α jest kątem ostrym, to cos α > 0, więc licznik i mianownik ułamka możemy podzielić przez cos α (mianownik jest różny od zera na mocy warunku zadania). Otrzymujemy
    \frac{2\cdot\frac{\sin\alpha}{\cos\alpha} + 3}{\frac{\sin\alpha}{\cos\alpha} - 1} = 7, czyli \frac{2\cdot\operatorname{tg}\alpha + 3}{\operatorname{tg}\alpha - 1} = 7.
    Oznaczmy t = tg α. Wtedy 2t + 3 = 7\cdot\left(t - 1\right), czyli 2t + 3 = 7t - 7, stąd 5t = 10 i t = 2.
    Zatem tg α = 2, czyli sin α = 2·cos α. Wstawiamy to do jedynki trygonometrycznej:
    \left(2\cdot\cos\alpha\right)^{2} + \cos^{2}\alpha = 1, czyli 5\cdot\cos^{2}\alpha = 1, więc \cos^{2}\alpha = \frac{1}{5}.
    Kąt α jest ostry, więc cos α > 0 i cos α = \frac{1}{\sqrt{5}} = \frac{\sqrt{5}}{5}, a sin α = 2·cos α = \frac{2\sqrt{5}}{5}.
    Sprawdzenie: \left(\frac{2\sqrt5}{5}\right)^2 + \left(\frac{\sqrt5}{5}\right)^2 = \frac{4}{5} + \frac{1}{5} = 1.
    Odpowiedź: tg α = 2, sin α = \frac{2\sqrt{5}}{5}, cos α = \frac{\sqrt{5}}{5}.
  solution_steps:
  - Zauważ, że dla kąta ostrego cos α ≠ 0, więc można podzielić licznik i mianownik przez cos α.
  - Przekształć warunek do postaci \frac{2\cdot\operatorname{tg}\alpha + 3}{\operatorname{tg}\alpha -
    1} = 7.
  - Rozwiąż równanie 2t + 3 = 7(t − 1) i otrzymaj t = tg α = 2.
  - 'Zapisz sin α = 2·cos α i wstaw do jedynki trygonometrycznej: 5cos²α = 1.'
  - Wyznacz cos α = \frac{\sqrt5}{5} (znak plus, bo kąt ostry) oraz sin α = \frac{2\sqrt5}{5}.
  answer:
    kind: MULTIPART
    parts:
    - name: tg_alfa
      answer:
        kind: NUMERIC
        value: 2.0
    - name: sin_alfa
      answer:
        kind: SYMBOLIC
        latex: \frac{2\sqrt{5}}{5}
    - name: cos_alfa
      answer:
        kind: SYMBOLIC
        latex: \frac{\sqrt{5}}{5}
  checks:
  - kind: solve_equation
    expr: \frac{2\cdot x + 3}{x - 1} = 7
    part: tg_alfa
  - kind: evaluate
    expr: \frac{2}{\sqrt{5}}
    part: sin_alfa
  - kind: evaluate
    expr: \frac{1}{\sqrt{5}}
    part: cos_alfa
  skills:
  - dzielenie licznika i mianownika przez cos α
  - definicja tangensa jako sin/cos
  - jedynka trygonometryczna
  - usuwanie niewymierności z mianownika
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [tg_alfa] SymPy solved it fresh: 2.0 vs 2.0 (tol 1e-09) ; [sin_alfa]
      SymPy solved it fresh: 0.8944271909999159 vs 0.8944271909999159 (tol 1e-09) ; [cos_alfa] SymPy solved
      it fresh: 0.4472135954999579 vs 0.4472135954999579 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 5
  exercise_type: wyrażenia symetryczne sin i cos
  statement: 'Kąt α jest ostry i spełnia warunek \sin\alpha - \cos\alpha = \frac{1}{5}. Oblicz: a) sin
    α · cos α, b) sin α + cos α, c) \sin^{3}\alpha - \cos^{3}\alpha.'
  statement_latex: \sin\alpha - \cos\alpha = \frac{1}{5}
  solution: |-
    a) Podnosimy daną równość stronami do kwadratu:
    \left(\sin\alpha - \cos\alpha\right)^{2} = \left(\frac{1}{5}\right)^{2} = \frac{1}{25}.
    Z drugiej strony \left(\sin\alpha - \cos\alpha\right)^{2} = \sin^{2}\alpha - 2\cdot\sin\alpha\cdot\cos\alpha + \cos^{2}\alpha = 1 - 2\cdot\sin\alpha\cdot\cos\alpha.
    Stąd 1 - 2\cdot\sin\alpha\cdot\cos\alpha = \frac{1}{25}, czyli 2\cdot\sin\alpha\cdot\cos\alpha = \frac{24}{25}, a więc \sin\alpha\cdot\cos\alpha = \frac{12}{25}.
    b) \left(\sin\alpha + \cos\alpha\right)^{2} = 1 + 2\cdot\sin\alpha\cdot\cos\alpha = 1 + \frac{24}{25} = \frac{49}{25}.
    Dla kąta ostrego sin α > 0 i cos α > 0, więc sin α + cos α > 0 i bierzemy pierwiastek dodatni: \sin\alpha + \cos\alpha = \frac{7}{5}.
    c) Ze wzoru a³ − b³ = (a − b)(a² + ab + b²) oraz z jedynki:
    \sin^{3}\alpha - \cos^{3}\alpha = \left(\sin\alpha - \cos\alpha\right)\cdot\left(1 + \sin\alpha\cdot\cos\alpha\right) = \frac{1}{5}\cdot\left(1 + \frac{12}{25}\right) = \frac{1}{5}\cdot\frac{37}{25} = \frac{37}{125}.
    Kontrola: z sumy \frac{7}{5} i różnicy \frac{1}{5} wynika sin α = \frac{4}{5}, cos α = \frac{3}{5}; istotnie \frac{64}{125} - \frac{27}{125} = \frac{37}{125}.
    Odpowiedź: sin α·cos α = \frac{12}{25}, sin α + cos α = \frac{7}{5}, sin³α − cos³α = \frac{37}{125}.
  solution_steps:
  - Podnieś równość sin α − cos α = 1/5 do kwadratu i skorzystaj z (sin α − cos α)² = 1 − 2 sin α cos
    α.
  - Wyznacz sin α·cos α = 12/25.
  - 'Oblicz (sin α + cos α)² = 1 + 2 sin α cos α = 49/25 i weź pierwiastek dodatni, bo kąt jest ostry:
    sin α + cos α = 7/5.'
  - 'Zastosuj wzór a³ − b³ = (a − b)(a² + ab + b²) i jedynkę: sin³α − cos³α = (1/5)·(1 + 12/25).'
  - Uprość wynik do 37/125 i sprawdź go, wyznaczając sin α = 4/5, cos α = 3/5.
  answer:
    kind: MULTIPART
    parts:
    - name: iloczyn
      answer:
        kind: SYMBOLIC
        latex: \frac{12}{25}
    - name: suma
      answer:
        kind: SYMBOLIC
        latex: \frac{7}{5}
    - name: roznica_szescianow
      answer:
        kind: SYMBOLIC
        latex: \frac{37}{125}
  checks:
  - kind: evaluate
    expr: \frac{1 - \left(\frac{1}{5}\right)^{2}}{2}
    part: iloczyn
  - kind: evaluate
    expr: \sqrt{1 + 2\cdot\frac{12}{25}}
    part: suma
  - kind: evaluate
    expr: \frac{1}{5}\cdot\left(1 + \frac{12}{25}\right)
    part: roznica_szescianow
  skills:
  - wzór (sin α − cos α)² = 1 − 2 sin α cos α
  - jedynka trygonometryczna
  - wzór na różnicę sześcianów
  - kontrola sensowności wyniku dla kąta ostrego
  verification:
