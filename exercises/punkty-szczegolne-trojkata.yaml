    SPRAWDZENIE, ŻE TO NIEPRAWDA: |IA| = \sqrt{2^{2}+2^{2}} = 2\sqrt2 \approx 2{,}83, a |IB| = \sqrt{6^{2}+2^{2}} = \sqrt{40} \approx 6{,}32 — odległości od wierzchołków nie są równe, więc (2,2) nie może być środkiem okręgu opisanego.
    POPRAWNIE: środek okręgu opisanego to punkt przecięcia SYMETRALNYCH boków, czyli punkt jednakowo odległy od wierzchołków. Symetralna boku AB (leżącego na osi x) to prosta x = 4, symetralna boku AC (leżącego na osi y) to prosta y = 3, więc O = (4, 3). Jest to środek przeciwprostokątnej BC — zgodnie z zasadą, że w trójkącie prostokątnym przeciwprostokątna jest średnicą okręgu opisanego.
    Promień: |BC| = \sqrt{8^{2}+6^{2}} = 10, więc R = \frac{10}{2} = 5.
    Sprawdzenie: |OA| = \sqrt{4^{2}+3^{2}} = 5 = |OB| = |OC| ✓.
