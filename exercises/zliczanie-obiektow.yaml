  - reguła mnożenia
  - zliczanie z warunkiem
  verification:
    checkability: REFERENCE_CALL
    note: '3 parts matched · det: [a) wszystkie wyniki] SymPy solved it fresh: 36.0 vs 36.0 (tol 1e-09)
