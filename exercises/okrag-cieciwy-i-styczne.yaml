    Niech r będzie promieniem okręgu, k_{1} – odległością środka od cięciwy długości 16, a k_{2} – odległością środka od cięciwy długości 30. Połowy cięciw wynoszą 8 i 15, więc
    k_{1}=\sqrt{r^{2}-8^{2}},\qquad k_{2}=\sqrt{r^{2}-15^{2}},
    przy czym k_{1}>k_{2} (krótsza cięciwa leży dalej od środka). Ponadto
    k_{1}^{2}-k_{2}^{2}=\left(r^{2}-64\right)-\left(r^{2}-225\right)=161.

    Przypadek 1 – cięciwy po tej samej stronie środka: wtedy k_{1}-k_{2}=23. Z równości \left(k_{1}-k_{2}\right)\left(k_{1}+k_{2}\right)=161 otrzymujemy 23\left(k_{1}+k_{2}\right)=161, czyli k_{1}+k_{2}=7. Ale wtedy k_{1}-k_{2}=23>7=k_{1}+k_{2}, skąd k_{2}<0 – sprzeczność. Ten przypadek jest niemożliwy.

    Przypadek 2 – cięciwy po przeciwnych stronach środka: wtedy k_{1}+k_{2}=23, więc 23\left(k_{1}-k_{2}\right)=161, czyli k_{1}-k_{2}=7. Stąd k_{1}=15 oraz k_{2}=8.

    Promień: r^{2}=k_{1}^{2}+8^{2}=15^{2}+8^{2}=225+64=289, czyli r=17. Sprawdzenie drugą cięciwą: r^{2}=k_{2}^{2}+15^{2}=64+225=289 – zgadza się, a przy tym k_{1}=15<17=r.

    Odpowiedź: promień okręgu jest równy 17, a cięciwy leżą po przeciwnych stronach środka.
