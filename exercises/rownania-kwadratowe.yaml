- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: zadanie tekstowe (droga–prędkość–czas) z równaniem wymiernym
  statement: Rowerzysta przejechał trasę o długości 60 km, jadąc ze stałą prędkością. Gdyby przez cały
    czas jechał ze stałą prędkością o 5 \frac{km}{h} większą, to pokonałby tę samą trasę o godzinę krócej.
    Oblicz prędkość rowerzysty oraz czas, w jakim przejechał on tę trasę. Zapisz obliczenia.
  statement_latex: \frac{60}{v} - \frac{60}{v+5} = 1
  solution: |-
    Oznaczmy przez v prędkość rowerzysty (w \frac{km}{h}); z sensu zadania v > 0.
    Czas jazdy z prędkością v wynosi \frac{60}{v} godzin, a z prędkością v+5 wynosi \frac{60}{v+5} godzin. Ten drugi czas jest o godzinę krótszy, więc
    \frac{60}{v} - \frac{60}{v+5} = 1.
    Dziedzina: v > 0 (wtedy także v+5 \neq 0).

    Mnożymy obie strony przez v\cdot\left(v+5\right) > 0:
    60\cdot\left(v+5\right) - 60\cdot v = v\cdot\left(v+5\right),
    60v + 300 - 60v = v^{2} + 5v,
    v^{2} + 5v - 300 = 0.
    \Delta = 5^{2} - 4\cdot 1\cdot\left(-300\right) = 25 + 1200 = 1225, \sqrt{\Delta} = 35.
    v_{1} = \frac{-5-35}{2} = -20, \qquad v_{2} = \frac{-5+35}{2} = 15.
    Liczba -20 nie należy do dziedziny (prędkość musi być dodatnia), więc ją odrzucamy.

    Zatem v = 15 \frac{km}{h}, a czas jazdy wynosi \frac{60}{15} = 4 godziny.

    SPRAWDZENIE: przy prędkości 20 \frac{km}{h} czas wynosiłby \frac{60}{20} = 3 godziny, czyli o godzinę mniej. Zgadza się.

    Odpowiedź: prędkość rowerzysty to 15 \frac{km}{h}, a czas przejazdu 4 godziny.
  solution_steps:
  - 'Wprowadź zmienną: v — prędkość rowerzysty, v > 0.'
  - 'Zapisz czasy przejazdu: \frac{60}{v} oraz \frac{60}{v+5} i warunek \frac{60}{v}-\frac{60}{v+5} =
    1.'
  - 'Pomnóż stronami przez v\left(v+5\right) i uporządkuj: v^{2}+5v-300 = 0.'
  - Oblicz \Delta = 1225 i pierwiastki v = -20 oraz v = 15.
  - Odrzuć v = -20 (prędkość dodatnia); przyjmij v = 15 \frac{km}{h}.
  - 'Oblicz czas: t = \frac{60}{15} = 4 godziny.'
  answer:
    kind: MULTIPART
    parts:
    - name: predkosc_km_h
      answer:
        kind: NUMERIC
        value: 15.0
    - name: czas_h
      answer:
        kind: NUMERIC
        value: 4.0
