  statement: Ciąg arytmetyczny (a_n) jest określony dla każdej liczby naturalnej n ≥ 1. W tym ciągu a_1
    = -5 oraz różnica r = 4. Oblicz dwudziesty wyraz tego ciągu oraz sumę dwudziestu początkowych kolejnych
