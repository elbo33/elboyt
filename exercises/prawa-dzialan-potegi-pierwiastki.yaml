- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: działania na pierwiastkach
  statement: |-
    a) Uprość wyrażenie \(\sqrt{75}-\sqrt{27}+\frac{6}{\sqrt{3}}\).
    b) Usuń niewymierność z mianownika ułamka \(\frac{10}{\sqrt[3]{4}}\) i zapisz wynik w możliwie najprostszej postaci.
  statement_latex: \text{a) } \sqrt{75}-\sqrt{27}+\frac{6}{\sqrt{3}}\qquad \text{b) } \frac{10}{\sqrt[3]{4}}
  solution: |-
    a) Wyłączamy czynniki przed znak pierwiastka:
    \[\sqrt{75}=\sqrt{25\cdot 3}=5\sqrt{3},\qquad \sqrt{27}=\sqrt{9\cdot 3}=3\sqrt{3}.\]
    Usuwamy niewymierność: \(\frac{6}{\sqrt{3}}=\frac{6\cdot\sqrt{3}}{\sqrt{3}\cdot\sqrt{3}}=\frac{6\sqrt{3}}{3}=2\sqrt{3}\).
    Zbieramy wyrazy podobne: \(5\sqrt{3}-3\sqrt{3}+2\sqrt{3}=\left(5-3+2\right)\sqrt{3}=4\sqrt{3}\).

    b) Ponieważ \(4=2^{2}\), mnożymy licznik i mianownik przez \(\sqrt[3]{2}\), aby pod pierwiastkiem powstało \(2^{3}\):
    \[\frac{10}{\sqrt[3]{2^{2}}}=\frac{10\cdot\sqrt[3]{2}}{\sqrt[3]{2^{2}}\cdot\sqrt[3]{2}}=\frac{10\sqrt[3]{2}}{\sqrt[3]{2^{3}}}=\frac{10\sqrt[3]{2}}{2}=5\sqrt[3]{2}.\]
    Odpowiedzi: a) \(4\sqrt{3}\); b) \(5\sqrt[3]{2}\).
  solution_steps:
  - 'Wyłącz czynniki: \(\sqrt{75}=5\sqrt{3}\), \(\sqrt{27}=3\sqrt{3}\).'
  - 'Usuń niewymierność: \(\frac{6}{\sqrt{3}}=2\sqrt{3}\).'
  - 'Zbierz wyrazy podobne: \(5\sqrt{3}-3\sqrt{3}+2\sqrt{3}=4\sqrt{3}\).'
  - W b) zapisz \(4=2^{2}\) i pomnóż licznik i mianownik przez \(\sqrt[3]{2}\).
  - 'Uprość: \(\frac{10\sqrt[3]{2}}{2}=5\sqrt[3]{2}\).'
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: SYMBOLIC
        latex: 4\sqrt{3}
    - name: b
      answer:
        kind: SYMBOLIC
        latex: 5\sqrt[3]{2}
  checks:
  - kind: simplify
    expr: \sqrt{75}-\sqrt{27}+\frac{6}{\sqrt{3}}
    part: a
  - kind: simplify
    expr: \frac{10}{\sqrt[3]{4}}
    part: b
  skills:
  - wyłączanie czynnika przed pierwiastek
  - dodawanie wyrazów podobnych
  - usuwanie niewymierności z mianownika
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [a] SymPy solved it fresh: ''4\\sqrt{3}'' vs ''4*sqrt(3)''
      ; [b] SymPy solved it fresh: ''5\\sqrt[3]{2}'' vs ''5*2**(1/3)'''
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: potęgi o wykładnikach wymiernych i porównywanie liczb
  statement: |-
    a) Zapisz liczbę \(\frac{\sqrt[3]{3}\cdot\sqrt[4]{3^{3}}}{\sqrt{3}}\) w postaci potęgi liczby 3 o wykładniku wymiernym.
    b) Rozstrzygnij, która z liczb \(\sqrt[3]{4}\) oraz \(\sqrt{3}\) jest większa. Odpowiedź zapisz w postaci nierówności.
  statement_latex: \text{a) } \frac{\sqrt[3]{3}\cdot\sqrt[4]{3^{3}}}{\sqrt{3}}\qquad \text{b) } \sqrt[3]{4}\
    \text{oraz}\ \sqrt{3}
  solution: |-
    a) Zamieniamy pierwiastki na potęgi o wykładnikach wymiernych:
    \[\sqrt[3]{3}=3^{\frac{1}{3}},\qquad \sqrt[4]{3^{3}}=3^{\frac{3}{4}},\qquad \sqrt{3}=3^{\frac{1}{2}}.\]
    Przy mnożeniu dodajemy wykładniki, przy dzieleniu odejmujemy:
    \[\frac{1}{3}+\frac{3}{4}-\frac{1}{2}=\frac{4}{12}+\frac{9}{12}-\frac{6}{12}=\frac{7}{12}.\]
    Zatem wyrażenie równa się \(3^{\frac{7}{12}}\) (czyli \(\sqrt[12]{3^{7}}\)).

    b) Obie liczby są dodatnie, a stopnie pierwiastków to 3 i 2; \(\mathrm{NWW}(3,2)=6\). Podnosimy obie liczby do potęgi 6 (nierówność między liczbami dodatnimi się nie odwróci):
    \[\left(\sqrt[3]{4}\right)^{6}=4^{2}=16,\qquad \left(\sqrt{3}\right)^{6}=3^{3}=27.\]
    Ponieważ \(16<27\), to \(\sqrt[3]{4}<\sqrt{3}\).
    Odpowiedzi: a) \(3^{\frac{7}{12}}\); b) \(\sqrt[3]{4}<\sqrt{3}\).
  solution_steps:
  - 'Zamień pierwiastki na potęgi: \(3^{\frac{1}{3}}\), \(3^{\frac{3}{4}}\), \(3^{\frac{1}{2}}\).'
  - 'Dodaj wykładniki licznika i odejmij wykładnik mianownika: \(\frac{1}{3}+\frac{3}{4}-\frac{1}{2}=\frac{7}{12}\).'
  - 'Zapisz wynik: \(3^{\frac{7}{12}}\).'
  - 'W b) podnieś obie liczby do potęgi \(\mathrm{NWW}(3,2)=6\): \(16\) i \(27\).'
  - 'Porównaj: \(16<27\), więc \(\sqrt[3]{4}<\sqrt{3}\).'
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: SYMBOLIC
        latex: 3^{\frac{7}{12}}
    - name: b
      answer:
        kind: SYMBOLIC
        latex: \sqrt[3]{4}<\sqrt{3}
  checks:
  - kind: simplify
    expr: \frac{\sqrt[3]{3}\cdot\sqrt[4]{3^{3}}}{\sqrt{3}}
    part: a
  skills:
  - zamiana pierwiastków na potęgi
  - działania na wykładnikach wymiernych
  - porównywanie pierwiastków różnych stopni
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: obliczanie wartości potęg o wykładnikach wymiernych i upraszczanie wyrażenia potęgowego
  statement: |-
    a) Oblicz wartość wyrażenia \( W = 27^{-\frac{2}{3}} + \left(\frac{1}{4}\right)^{-\frac{3}{2}} - \sqrt[4]{81} \).
    b) Dla \( a > 0 \) uprość wyrażenie \( \frac{a^{\frac{5}{6}}\cdot \sqrt[3]{a}}{\sqrt{a}} \) i zapisz wynik w postaci potęgi o wykładniku wymiernym.
  statement_latex: W = 27^{-\frac{2}{3}} + \left(\frac{1}{4}\right)^{-\frac{3}{2}} - \sqrt[4]{81};\qquad
    \frac{a^{\frac{5}{6}}\cdot \sqrt[3]{a}}{\sqrt{a}}
  solution: |-
    a) Każdy składnik sprowadzamy do potęgi liczby pierwszej.
    \( 27^{-\frac{2}{3}} = \left(3^{3}\right)^{-\frac{2}{3}} = 3^{3\cdot\left(-\frac{2}{3}\right)} = 3^{-2} = \frac{1}{9} \).
    \( \left(\frac{1}{4}\right)^{-\frac{3}{2}} = 4^{\frac{3}{2}} = \left(2^{2}\right)^{\frac{3}{2}} = 2^{3} = 8 \) (ujemny wykładnik odwraca ułamek).
    \( \sqrt[4]{81} = \left(3^{4}\right)^{\frac{1}{4}} = 3 \).
    Zatem \( W = \frac{1}{9} + 8 - 3 = 5 + \frac{1}{9} = \frac{46}{9} \).

    b) Zamieniamy pierwiastki na potęgi: \( \sqrt[3]{a} = a^{\frac{1}{3}} \), \( \sqrt{a} = a^{\frac{1}{2}} \). Przy mnożeniu wykładniki dodajemy, przy dzieleniu odejmujemy:
    \( \frac{5}{6} + \frac{1}{3} - \frac{1}{2} = \frac{5}{6} + \frac{2}{6} - \frac{3}{6} = \frac{4}{6} = \frac{2}{3} \).
    Zatem wyrażenie równa się \( a^{\frac{2}{3}} \) (co można też zapisać jako \( \sqrt[3]{a^{2}} \)). Założenie \( a>0 \) jest konieczne, by stosować wykładniki wymierne.
  solution_steps:
  - 'Zapisz 27, 4 i 81 jako potęgi liczb pierwszych: 27 = 3^3, 4 = 2^2, 81 = 3^4.'
  - 'Zastosuj (a^m)^n = a^{m·n}: 27^{-2/3} = 3^{-2} = 1/9, (1/4)^{-3/2} = 4^{3/2} = 8, czwarty pierwiastek
    z 81 równa się 3.'
  - 'Dodaj i odejmij otrzymane liczby: 1/9 + 8 − 3 = 46/9.'
  - W drugim wyrażeniu zamień pierwiastki na potęgi o wykładnikach wymiernych.
  - 'Dodaj wykładniki licznika i odejmij wykładnik mianownika: 5/6 + 1/3 − 1/2 = 2/3.'
  - Zapisz wynik jako a^{2/3}.
  answer:
    kind: MULTIPART
    parts:
    - name: W
      answer:
        kind: NUMERIC
        value: 5.111111111111111
        latex: \frac{46}{9}
    - name: uproszczenie
      answer:
        kind: SYMBOLIC
        latex: a^{\frac{2}{3}}
  checks:
  - kind: evaluate
    expr: 27^{-\frac{2}{3}} + \left(\frac{1}{4}\right)^{-\frac{3}{2}} - \sqrt[4]{81}
    part: W
  - kind: simplify
    expr: \frac{a^{\frac{5}{6}}\cdot a^{\frac{1}{3}}}{a^{\frac{1}{2}}}
    var: a
    part: uproszczenie
  skills:
  - potęga o wykładniku wymiernym
  - potęga o wykładniku ujemnym
  - sprowadzanie do wspólnej podstawy
  - zamiana pierwiastków na potęgi
  - prawa działań na potęgach
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [W] SymPy solved it fresh: 5.111111111111111 vs 5.111111111111111
      (tol 1e-09) ; [uproszczenie] SymPy solved it fresh: ''a^{\\frac{2}{3}}'' vs ''a**(2/3)'''
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: działania na pierwiastkach, usuwanie niewymierności i porównywanie pierwiastków różnych
    stopni
  statement: |-
    a) Wykonaj działania i zapisz wynik w najprostszej postaci: \( \frac{12}{\sqrt{18}} + \sqrt{50} - \sqrt{8} \).
    b) Rozstrzygnij, która z liczb \( \sqrt[3]{4} \), \( \sqrt[4]{7} \) jest większa. Odpowiedź zapisz w postaci nierówności.
  statement_latex: \frac{12}{\sqrt{18}} + \sqrt{50} - \sqrt{8};\qquad \sqrt[3]{4}\ \text{oraz}\ \sqrt[4]{7}
  solution: |-
    a) Najpierw upraszczamy liczby pod pierwiastkami:
    \( \sqrt{18} = \sqrt{9\cdot 2} = 3\sqrt{2} \), \( \sqrt{50} = \sqrt{25\cdot 2} = 5\sqrt{2} \), \( \sqrt{8} = \sqrt{4\cdot 2} = 2\sqrt{2} \).
    Usuwamy niewymierność z mianownika:
    \( \frac{12}{\sqrt{18}} = \frac{12}{3\sqrt{2}} = \frac{4}{\sqrt{2}} = \frac{4\cdot\sqrt{2}}{2} = 2\sqrt{2} \).
    Zbieramy wyrazy podobne: \( 2\sqrt{2} + 5\sqrt{2} - 2\sqrt{2} = \left(2+5-2\right)\sqrt{2} = 5\sqrt{2} \).

    b) Stopnie pierwiastków są różne: 3 i 4, a \( \mathrm{NWW}(3,4) = 12 \). Obie liczby są dodatnie, więc podniesienie do potęgi 12 nie odwraca nierówności:
    \( \left(\sqrt[3]{4}\right)^{12} = 4^{4} = 256 \), \( \left(\sqrt[4]{7}\right)^{12} = 7^{3} = 343 \).
    Ponieważ \( 256 < 343 \), to \( \sqrt[3]{4} < \sqrt[4]{7} \); większa jest liczba \( \sqrt[4]{7} \).
  solution_steps:
  - 'Wyłącz czynniki przed pierwiastki: √18 = 3√2, √50 = 5√2, √8 = 2√2.'
  - 'Usuń niewymierność z mianownika: 12/(3√2) = 4/√2 = 2√2.'
  - 'Zbierz wyrazy podobne: 2√2 + 5√2 − 2√2 = 5√2.'
  - 'Do porównania pierwiastków znajdź NWW stopni: NWW(3,4) = 12.'
  - 'Podnieś obie dodatnie liczby do potęgi 12: 4^4 = 256 oraz 7^3 = 343.'
  - Z 256 < 343 wynika, że trzeci pierwiastek z 4 jest mniejszy od czwartego pierwiastka z 7.
  answer:
    kind: MULTIPART
    parts:
    - name: wartosc_wyrazenia
      answer:
        kind: NUMERIC
        value: 7.0710678118654755
        latex: 5\sqrt{2}
    - name: porownanie
      answer:
        kind: SYMBOLIC
        latex: \sqrt[3]{4} < \sqrt[4]{7}
  checks:
  - kind: evaluate
    expr: \frac{12}{\sqrt{18}} + \sqrt{50} - \sqrt{8}
    part: wartosc_wyrazenia
  skills:
  - wyłączanie czynnika przed znak pierwiastka
  - usuwanie niewymierności z mianownika
  - dodawanie wyrazów podobnych z pierwiastkami
  - porównywanie pierwiastków różnych stopni
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 3
  exercise_type: korekta błędu rachunkowego
  statement: 'Oblicz: a) \(\sqrt{36+64}\),  b) \(\left(\sqrt{7}+3\right)^{2}\). Uczeń zapisał: \(\sqrt{36+64}=\sqrt{36}+\sqrt{64}=6+8=14\)
    oraz \(\left(\sqrt{7}+3\right)^{2}=\left(\sqrt{7}\right)^{2}+3^{2}=7+9=16\). Wskaż błąd w jego rozumowaniu
    i podaj poprawne wyniki.'
  statement_latex: \text{a) } \sqrt{36+64}\qquad \text{b) } \left(\sqrt{7}+3\right)^{2}
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń „rozdzielił” pierwiastek i potęgę względem sumy:
    \[\sqrt{36+64}=\sqrt{36}+\sqrt{64}=6+8=14,\qquad \left(\sqrt{7}+3\right)^{2}=7+9=16.\]
    Dlaczego to źle: pierwiastkowanie i potęgowanie są rozdzielne wyłącznie względem mnożenia i dzielenia (\(\sqrt{a\cdot b}=\sqrt{a}\cdot\sqrt{b}\)), a nie względem dodawania. Nie istnieje żaden wzór na \(\sqrt{a+b}\).

    POPRAWNIE:
    a) Najpierw wykonujemy dodawanie pod pierwiastkiem: \(\sqrt{36+64}=\sqrt{100}=10\) (a nie 14).
    b) Stosujemy wzór \(\left(a+b\right)^{2}=a^{2}+2\cdot a\cdot b+b^{2}\):
    \[\left(\sqrt{7}+3\right)^{2}=\left(\sqrt{7}\right)^{2}+2\cdot\sqrt{7}\cdot 3+3^{2}=7+6\sqrt{7}+9=16+6\sqrt{7}.\]
    Odpowiedzi: a) 10; b) \(16+6\sqrt{7}\).
  solution_steps:
  - 'Zauważ błąd: uczeń rozdzielił pierwiastek i kwadrat względem sumy.'
  - Przypomnij, że \(\sqrt{a\cdot b}=\sqrt{a}\cdot\sqrt{b}\), ale \(\sqrt{a+b}\neq\sqrt{a}+\sqrt{b}\).
  - 'W a) dodaj liczby pod pierwiastkiem: \(\sqrt{100}=10\).'
  - W b) użyj wzoru \(\left(a+b\right)^{2}=a^{2}+2ab+b^{2}\).
  - 'Zapisz wynik: \(7+6\sqrt{7}+9=16+6\sqrt{7}\).'
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: NUMERIC
        value: 10.0
    - name: b
      answer:
        kind: SYMBOLIC
        latex: 16+6\sqrt{7}
  checks:
  - kind: evaluate
    expr: \sqrt{36+64}
    part: a
  - kind: simplify
    expr: \left(\sqrt{7}+3\right)^{2}
