    a = 6√3·√3 = 6·3 = 18.
    Pole trójkąta: P = a²√3/4 = 18²·√3/4 = 324√3/4 = 81√3.
    Pole koła: P_koła = π·(6√3)² = π·108 = 108π.
    Pole obszaru między okręgiem a trójkątem:
    P_obszaru = 108π − 81√3 ≈ 339,29 − 140,30 ≈ 198,99.
    Odpowiedź: a = 18, P = 81√3, pole obszaru = 108π − 81√3.
