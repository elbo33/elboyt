- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: trójkąt prostokątny równoramienny w układzie współrzędnych, wzór prostej i obwód
  statement: |-
    W kartezjańskim układzie współrzędnych (x, y) dane są punkty A = (-1, 2) oraz B = (5, 4). Trójkąt ABC jest równoramienny, kąt przy wierzchołku B jest kątem prostym oraz |BA| = |BC|. Ponadto odległość wierzchołka C od początku układu współrzędnych O = (0, 0) jest nie większa niż 8.
    a) Wyznacz równanie prostej BC w postaci kierunkowej oraz współrzędne wierzchołka C.
    b) Oblicz obwód trójkąta ABC.
    Zapisz obliczenia.
  statement_latex: A = \left(-1,\ 2\right),\quad B = \left(5,\ 4\right),\quad BC \perp BA,\quad |BC| =
    |BA|,\quad |OC| \le 8
  solution: |-
    a) Współczynnik kierunkowy prostej AB: a_{AB} = \frac{4 - 2}{5 - \left(-1\right)} = \frac{2}{6} = \frac{1}{3}.
    Kąt przy wierzchołku B jest prosty, więc prosta BC jest prostopadła do AB: a_{BC} = -\frac{1}{\frac{1}{3}} = -3. Prosta BC przechodzi przez B = (5, 4): 4 = -3\cdot 5 + b, stąd b = 19, czyli BC:\ y = -3x + 19.

    Punkt C leży na tej prostej, więc C = \left(t,\ -3t + 19\right).
    Długość ramienia: |BA| = \sqrt{\left(5 + 1\right)^2 + \left(4 - 2\right)^2} = \sqrt{36 + 4} = \sqrt{40}.
    Warunek |BC| = |BA| zapisujemy dla kwadratów:
    \left(t - 5\right)^2 + \left(-3t + 19 - 4\right)^2 = 40, czyli \left(t - 5\right)^2 + 9\cdot\left(t - 5\right)^2 = 40, więc 10\cdot\left(t - 5\right)^2 = 40, czyli \left(t - 5\right)^2 = 4.
    Stąd t = 5 - 2 = 3 albo t = 5 + 2 = 7, co daje kandydatów C_1 = (3, 10) oraz C_2 = (7, -2).

    Sprawdzamy warunek |OC| \le 8:
    |OC_1| = \sqrt{3^2 + 10^2} = \sqrt{109} > 8, bo 109 > 64 — punkt C_1 odrzucamy;
    |OC_2| = \sqrt{7^2 + \left(-2\right)^2} = \sqrt{53} \le 8, bo 53 < 64 — warunek jest spełniony.
    Zatem C = (7, -2).

    b) |BA| = |BC| = \sqrt{40} = 2\sqrt{10}, a przeciwprostokątna
    |AC| = \sqrt{\left(7 + 1\right)^2 + \left(-2 - 2\right)^2} = \sqrt{64 + 16} = \sqrt{80} = 4\sqrt{5}.
    Obwód: 2\sqrt{10} + 2\sqrt{10} + 4\sqrt{5} = 4\sqrt{10} + 4\sqrt{5}.
  solution_steps:
  - Oblicz a_{AB} = \frac{4 - 2}{5 + 1} = \frac{1}{3}.
  - 'Z warunku prostopadłości w wierzchołku B wyznacz a_{BC} = -3 i równanie prostej BC: y = -3x + 19.'
  - Zapisz C = (t, -3t + 19) i oblicz |BA|^2 = 40.
  - Z warunku |BC|^2 = 40 otrzymaj 10\cdot\left(t - 5\right)^2 = 40, czyli t = 3 lub t = 7.
  - 'Sprawdź warunek |OC| \le 8: \sqrt{109} > 8 odrzuca C = (3, 10), \sqrt{53} < 8 dopuszcza C = (7, -2).'
  - Oblicz |AC| = \sqrt{80} = 4\sqrt{5}.
  - 'Zsumuj boki: obwód = 2\sqrt{10} + 2\sqrt{10} + 4\sqrt{5} = 4\sqrt{10} + 4\sqrt{5}.'
