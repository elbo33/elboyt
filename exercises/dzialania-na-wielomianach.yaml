  statement: Suma długości wszystkich krawędzi pewnego prostopadłościanu o podstawie kwadratowej jest
    równa 48 cm, a pole powierzchni całkowitej tego prostopadłościanu jest równe 90 cm^{2}. Wysokość tego
    prostopadłościanu jest większa od długości krawędzi jego podstawy. Oblicz długość krawędzi podstawy
    oraz wysokość tego prostopadłościanu.
  statement_latex: P_{c}\left(x\right)=2\cdot x^{2}+4\cdot x\cdot\left(12-2\cdot x\right)=90
  solution: |-
    Oznaczmy przez x (w centymetrach) długość krawędzi podstawy, a przez h wysokość prostopadłościanu, x>0, h>0.
    Prostopadłościan o podstawie kwadratowej ma 8 krawędzi podstaw o długości x i 4 krawędzie boczne o długości h, więc
    8\cdot x+4\cdot h=48, czyli h=12-2\cdot x (stąd dodatkowo 0<x<6).
    Pole powierzchni całkowitej to dwie podstawy i cztery jednakowe ściany boczne:
    P_{c}=2\cdot x^{2}+4\cdot x\cdot h=2\cdot x^{2}+4\cdot x\cdot\left(12-2\cdot x\right)=2\cdot x^{2}+48\cdot x-8\cdot x^{2}=-6\cdot x^{2}+48\cdot x.
    Z warunku zadania -6\cdot x^{2}+48\cdot x=90, czyli po podzieleniu przez -6: x^{2}-8\cdot x+15=0.
    Wyróżnik: \Delta=64-60=4, \sqrt{\Delta}=2, więc x=\frac{8-2}{2}=3 albo x=\frac{8+2}{2}=5.
    Sprawdzamy warunek h>x: dla x=3 mamy h=12-6=6 i 6>3 ✔; dla x=5 mamy h=12-10=2 i 2<5 ✘ — tę wartość odrzucamy.
    Odpowiedź: krawędź podstawy ma 3 cm, a wysokość 6 cm.
    Sprawdzenie: krawędzie 8\cdot 3+4\cdot 6=48 ✔, pole 2\cdot 9+4\cdot 3\cdot 6=18+72=90 ✔.
  solution_steps:
