    i podaje odpowiedź x=5.
    DLACZEGO TO JEST BŁĄD:
    Dziedzinę trzeba ustalić PRZED przekształceniami. W równaniu występują ułamki o mianowniku x-5, więc x-5\neq 0, czyli x\neq 5 i D=\mathbb{R}\setminus\{5\}. Mnożenie obu stron przez x-5 jest przekształceniem równoważnym tylko przy założeniu x\neq 5; liczba 5 „pojawiła się” jako rozwiązanie obce. Dla x=5 lewa i prawa strona równania wyjściowego w ogóle nie mają sensu liczbowego (dzielenie przez zero).
    POPRAWNE ROZWIĄZANIE:
    Założenie: x\neq 5.
