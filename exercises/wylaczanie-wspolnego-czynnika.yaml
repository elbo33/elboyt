- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: modelowanie bryły + rozkład przez grupowanie + filtr rozwiązań
  statement: Podstawą pewnego prostopadłościanu jest kwadrat, a wysokość tego prostopadłościanu jest o
    2 cm większa od długości krawędzi podstawy. Objętość tego prostopadłościanu, wyrażona w centymetrach
    sześciennych, jest liczbowo równa pięciokrotności jego wysokości, wyrażonej w centymetrach. Oblicz
    długość krawędzi podstawy oraz objętość tego prostopadłościanu.
  statement_latex: x^{2}\cdot\left(x+2\right)=5\cdot\left(x+2\right)
  solution: |-
    Oznaczmy przez x długość krawędzi podstawy (w centymetrach), x>0. Wysokość jest równa x+2.
    Objętość prostopadłościanu o kwadratowej podstawie: V=x^{2}\cdot\left(x+2\right)=x^{3}+2x^{2}.
    Pięciokrotność wysokości to 5\left(x+2\right)=5x+10.
    Warunek zadania daje równanie:
    x^{3}+2x^{2}=5x+10,\qquad x^{3}+2x^{2}-5x-10=0.
    Rozkładamy lewą stronę metodą grupowania:
    \left(x^{3}+2x^{2}\right)-\left(5x+10\right)=x^{2}\left(x+2\right)-5\left(x+2\right)=\left(x+2\right)\left(x^{2}-5\right).
    Zatem \left(x+2\right)\left(x^{2}-5\right)=0, czyli x=-2 lub x^{2}=5, więc x=\sqrt{5} albo x=-\sqrt{5}.
    Warunek x>0 pozostawia tylko x=\sqrt{5}.
    Krawędź podstawy ma długość \sqrt{5} cm, wysokość \sqrt{5}+2 cm, a objętość
    V=\left(\sqrt{5}\right)^{2}\cdot\left(\sqrt{5}+2\right)=5\left(\sqrt{5}+2\right)=5\sqrt{5}+10\ \left(\approx 21{,}18\right) cm^{3}.
    Sprawdzenie: pięciokrotność wysokości to 5\left(\sqrt{5}+2\right) — zgadza się z objętością. ✓
  solution_steps:
  - 'Wprowadź zmienną: x — krawędź kwadratowej podstawy (x > 0); wysokość wynosi x + 2.'
  - Zapisz objętość V = x^2(x+2) oraz pięciokrotność wysokości 5(x+2).
  - Ułóż równanie x^3 + 2x^2 - 5x - 10 = 0.
  - 'Rozłóż lewą stronę przez grupowanie: x^2(x+2) - 5(x+2) = (x+2)(x^2-5).'
  - Z równania iloczynowego otrzymaj x = -2, x = \sqrt{5}, x = -\sqrt{5}; odrzuć wartości niedodatnie.
  - 'Oblicz objętość: V = 5(\sqrt{5}+2) = 5\sqrt{5}+10 cm^3.'
  answer:
    kind: MULTIPART
    parts:
