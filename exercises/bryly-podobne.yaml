- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie pola bryły podobnej przy danej skali
  statement: Ostrosłupy P i Q są podobne, przy czym skala podobieństwa przejścia od ostrosłupa P do ostrosłupa
    Q jest równa k = 3. Pole powierzchni całkowitej ostrosłupa P jest równe 7 cm². Oblicz pole powierzchni
    całkowitej ostrosłupa Q.
  statement_latex: k=3,\qquad P_{P}=7\ \text{cm}^{2},\qquad P_{Q}=k^{2}\cdot P_{P}=3^{2}\cdot 7
  solution: |-
    Pole powierzchni jest wielkością dwuwymiarową, więc przy podobieństwie w skali k mnoży się przez k².
    Zatem P_Q = k²·P_P = 3²·7 = 9·7 = 63 (cm²).
    Kontrola sensowności: k = 3 > 1, czyli ostrosłup Q jest większy, więc jego pole musi być większe od 7 cm² — zgadza się.
    Odpowiedź: pole powierzchni całkowitej ostrosłupa Q jest równe 63 cm².
  solution_steps:
  - 'Zauważ, że pole powierzchni skaluje się z kwadratem skali: P'' = k²·P.'
  - 'Podstaw k = 3 oraz P = 7 cm²: P'' = 3²·7.'
  - 'Oblicz: P'' = 9·7 = 63 cm².'
  - 'Sprawdź sensowność: k > 1, więc wynik jest większy od pola wyjściowego.'
  answer:
    kind: NUMERIC
    value: 63.0
    latex: 63\ \text{cm}^{2}
  checks:
  - kind: evaluate
    expr: 3^{2}\cdot 7
  skills:
  - stosowanie zależności P' = k^2 P
  - odczytanie kierunku skali
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 63.0 vs 63.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: wyznaczanie skali z objętości
  statement: Dwie kule mają objętości równe odpowiednio 24 cm³ oraz 81 cm³. Wiadomo, że dowolne dwie kule
    są podobne. Oblicz skalę podobieństwa przejścia od kuli mniejszej do kuli większej, czyli stosunek
    promienia kuli mniejszej do promienia kuli większej.
  statement_latex: k=\sqrt[3]{\frac{V_{1}}{V_{2}}}=\sqrt[3]{\frac{24}{81}}
  solution: |-
    Dowolne dwie kule są podobne, więc możemy korzystać z zależności V₁/V₂ = k³.
    Stosunek objętości: V₁/V₂ = 24/81 = 8/27.
    Skala liniowa: k = ∛(8/27) = 2/3.
    Odpowiedź: stosunek promieni (mniejsza do większej) wynosi k = 2/3.
  solution_steps:
  - 'Zapisz stosunek objętości: \frac{24}{81}=\frac{8}{27}.'
  - Skorzystaj ze wzoru k = \sqrt[3]{\frac{V_{1}}{V_{2}}}.
  - 'Oblicz pierwiastek sześcienny: k=\sqrt[3]{\frac{8}{27}}=\frac{2}{3}.'
  - 'Zinterpretuj: promień mniejszej kuli stanowi \frac{2}{3} promienia większej.'
  answer:
    kind: SYMBOLIC
    latex: \frac{2}{3}
  checks:
  - kind: evaluate
    expr: \sqrt[3]{\frac{24}{81}}
  skills:
  - wyznaczanie skali ze stosunku objętości
  - pierwiastek sześcienny z ułamka
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 0.6666666666666666 vs 0.6666666666666666 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: skala i stosunek objętości sześcianów
  statement: Krawędź pierwszego sześcianu ma długość 3 cm, a krawędź drugiego sześcianu ma długość 12
    cm. Dowolne dwa sześciany są podobne. Podaj skalę podobieństwa przejścia od pierwszego sześcianu do
    drugiego oraz oblicz, ile razy objętość drugiego sześcianu jest większa od objętości pierwszego.
  statement_latex: k=\frac{12}{3},\qquad \frac{V_{2}}{V_{1}}=k^{3}=\left(\frac{12}{3}\right)^{3}
  solution: |-
    Skala podobieństwa to stosunek odpowiadających sobie odcinków: k = 12/3 = 4.
    Objętość jest wielkością trójwymiarową, więc V₂/V₁ = k³ = 4³ = 64.
    Odpowiedź: k = 4, objętość drugiego sześcianu jest 64 razy większa.
  solution_steps:
  - 'Wyznacz skalę jako stosunek krawędzi: k=\frac{12}{3}=4.'
  - Zastosuj zależność \frac{V_{2}}{V_{1}}=k^{3}.
  - Oblicz 4^{3}=64.
  - 'Zapisz odpowiedź: k = 4, objętość rośnie 64-krotnie.'
  answer:
    kind: MULTIPART
    parts:
    - name: skala
      answer:
        kind: NUMERIC
        value: 4.0
        latex: k=4
    - name: stosunek objętości
      answer:
        kind: NUMERIC
        value: 64.0
        latex: '64'
  checks:
  - kind: evaluate
    expr: \frac{12}{3}
    part: skala
  - kind: evaluate
    expr: \left(\frac{12}{3}\right)^{3}
    part: stosunek objętości
