  - Zastosuj warunek \frac{a}{b}=0 \iff a=0 \wedge b\neq 0.
  - 'Przyrównaj licznik do zera: \left(x-4\right)\cdot\left(x+1\right)=0, stąd x=4 lub x=-1.'
