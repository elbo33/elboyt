- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: obliczeniowe (trójkąt, dana wartość sinusa)
  statement: W trójkącie ABC dane są |AB| = 10 oraz |AC| = 12. Kąt BAC jest kątem ostrym i \sin\left(\angle
    BAC\right) = \frac{3}{5}. Oblicz pole trójkąta ABC, długość wysokości opuszczonej z wierzchołka C
    na bok AB oraz długość boku BC.
  statement_latex: P=\frac{1}{2}\cdot 10\cdot 12\cdot\frac{3}{5},\qquad h=\frac{2\cdot P}{10},\qquad |BC|=\sqrt{\left(10-12\cdot\frac{4}{5}\right)^{2}+\left(12\cdot\frac{3}{5}\right)^{2}}
  solution: |-
    1) Pole. Kąt BAC leży między bokami AB i AC, więc
    P = \frac{1}{2}\cdot |AB|\cdot |AC|\cdot\sin\left(\angle BAC\right) = \frac{1}{2}\cdot 10\cdot 12\cdot\frac{3}{5} = 36.

    2) Wysokość z C na AB. Z P = \frac{1}{2}\cdot |AB|\cdot h mamy 36 = \frac{1}{2}\cdot 10\cdot h, czyli h = \frac{2\cdot 36}{10} = 7{,}2.

    3) Bok BC. Kąt BAC jest ostry, więc \cos\left(\angle BAC\right) = \sqrt{1-\left(\frac{3}{5}\right)^{2}} = \frac{4}{5}.
    Niech D będzie spodkiem wysokości z C na AB. Wtedy |AD| = 12\cdot\frac{4}{5} = 9{,}6 oraz |CD| = h = 12\cdot\frac{3}{5} = 7{,}2.
    Ponieważ 9{,}6 < 10, punkt D leży wewnątrz odcinka AB i |DB| = 10 - 9{,}6 = 0{,}4.
    Z twierdzenia Pitagorasa w trójkącie BDC:
    |BC| = \sqrt{0{,}4^{2}+7{,}2^{2}} = \sqrt{0{,}16+51{,}84} = \sqrt{52} = 2\sqrt{13}.

    Odpowiedź: P = 36, h = 7{,}2, |BC| = 2\sqrt{13}.
  solution_steps:
  - Zastosuj wzór P = \frac{1}{2}\cdot 10\cdot 12\cdot\sin\left(\angle BAC\right) i oblicz P = 36.
  - Z P = \frac{1}{2}\cdot 10\cdot h wyznacz h = 7{,}2.
  - Z jedynki trygonometrycznej wyznacz \cos\left(\angle BAC\right) = \frac{4}{5} (kąt ostry — pierwiastek
    dodatni).
  - Oblicz rzut |AD| = 12\cdot\frac{4}{5} = 9{,}6 oraz |DB| = 10-9{,}6 = 0{,}4.
  - 'Z twierdzenia Pitagorasa: |BC| = \sqrt{0{,}4^{2}+7{,}2^{2}} = 2\sqrt{13}.'
  answer:
    kind: MULTIPART
    parts:
    - name: pole
      answer:
        kind: NUMERIC
        value: 36.0
    - name: wysokosc
      answer:
        kind: NUMERIC
        value: 7.2
    - name: BC
      answer:
        kind: SYMBOLIC
        latex: 2\sqrt{13}
