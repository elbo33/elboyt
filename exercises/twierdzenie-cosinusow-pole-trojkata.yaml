- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: 'zadanie praktyczne: równoległobok, pole i przekątne'
  statement: Działka ma kształt równoległoboku ABCD, w którym |AB| = 40 m, |BC| = 30 m oraz |∠ABC| = 60°.
    Oblicz pole tej działki oraz długości obu przekątnych AC i BD. Wyniki podaj w postaci dokładnej. Zapisz
    obliczenia.
  statement_latex: P = 40\cdot 30\cdot\sin 60^\circ,\qquad |AC|^2 = 40^2 + 30^2 - 2\cdot 40\cdot 30\cdot\cos
    60^\circ,\qquad |BD|^2 = 40^2 + 30^2 - 2\cdot 40\cdot 30\cdot\cos 120^\circ
  solution: |-
    Pole równoległoboku o bokach a, b i kącie α między nimi wynosi P = a\cdot b\cdot\sin\alpha, więc
    P = 40\cdot 30\cdot\sin 60^\circ = 1200\cdot\frac{\sqrt{3}}{2} = 600\sqrt{3}\ \text{m}^2 \approx 1039{,}2\ \text{m}^2.
    Przekątna AC leży naprzeciw kąta ABC = 60° w trójkącie ABC o bokach AB = 40 i BC = 30:
    |AC|^2 = 40^2 + 30^2 - 2\cdot 40\cdot 30\cdot\frac{1}{2} = 1600 + 900 - 1200 = 1300,
    zatem |AC| = \sqrt{1300} = 10\sqrt{13} \approx 36{,}1 m.
    Kąt przy wierzchołku A w równoległoboku jest kątem przyległym do kąta ABC, więc |∠DAB| = 180^\circ - 60^\circ = 120^\circ, a przekątna BD leży w trójkącie ABD naprzeciw tego kąta (przy czym |AD| = |BC| = 30):
    |BD|^2 = 40^2 + 30^2 - 2\cdot 40\cdot 30\cdot\left(-\frac{1}{2}\right) = 1600 + 900 + 1200 = 3700,
    czyli |BD| = \sqrt{3700} = 10\sqrt{37} \approx 60{,}8 m.
    Kontrola: 1300 + 3700 = 5000 = 2\left(40^2 + 30^2\right) — spełniona jest zależność między przekątnymi równoległoboku.
  solution_steps:
  - 'Zapisz pole równoległoboku: P = |AB|\cdot|BC|\cdot\sin 60^\circ = 40\cdot 30\cdot\frac{\sqrt{3}}{2}
    = 600\sqrt{3}.'
  - 'W trójkącie ABC zastosuj twierdzenie cosinusów dla kąta 60°: |AC|^2 = 1600 + 900 - 1200 = 1300, więc
    |AC| = 10\sqrt{13}.'
  - Zauważ, że kąt DAB = 180° - 60° = 120° i że |AD| = |BC| = 30.
  - 'W trójkącie ABD: |BD|^2 = 1600 + 900 + 1200 = 3700, więc |BD| = 10\sqrt{37}.'
  - 'Sprawdź poprawność: suma kwadratów przekątnych 1300 + 3700 = 5000 równa się 2(40^2+30^2).'
  answer:
    kind: MULTIPART
    parts:
    - name: pole
      answer:
        kind: SYMBOLIC
        latex: 600\sqrt{3}
    - name: '|AC|'
      answer:
        kind: SYMBOLIC
        latex: 10\sqrt{13}
    - name: '|BD|'
      answer:
        kind: SYMBOLIC
        latex: 10\sqrt{37}
  checks:
  - kind: evaluate
    expr: 40\cdot 30\cdot\frac{\sqrt{3}}{2}
    part: pole
  - kind: evaluate
    expr: \sqrt{40^2 + 30^2 - 2\cdot 40\cdot 30\cdot\frac{1}{2}}
    part: '|AC|'
  - kind: evaluate
    expr: \sqrt{40^2 + 30^2 - 2\cdot 40\cdot 30\cdot\left(-\frac{1}{2}\right)}
    part: '|BD|'
  skills:
  - pole równoległoboku przez sinus
  - twierdzenie cosinusów dla obu przekątnych
