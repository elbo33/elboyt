- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie długości z proporcji Talesa
  statement: W trójkącie ABC punkt D leży na boku AB, a punkt E leży na boku AC, przy czym odcinek DE
    jest równoległy do boku BC. Wiadomo, że |AD| = 6 cm, |DB| = 9 cm oraz |AE| = 8 cm. Oblicz długość
    odcinka EC.
  statement_latex: \frac{|AD|}{|DB|}=\frac{|AE|}{|EC|},\qquad \frac{6}{9}=\frac{8}{x}
  solution: |-
    Ponieważ DE ∥ BC, a punkty D i E leżą na bokach AB i AC kąta BAC po tej samej stronie wierzchołka A, z twierdzenia Talesa odcinki odcięte na ramionach tego kąta są proporcjonalne:
    \frac{|AD|}{|DB|}=\frac{|AE|}{|EC|}.
    Oznaczmy |EC| = x, x > 0. Podstawiamy dane:
    \frac{6}{9}=\frac{8}{x}.
    Mnożymy na krzyż: 6\cdot x = 9\cdot 8, czyli 6x = 72, stąd x = 12.
    Sprawdzenie sensowności: 6 < 9 oraz 8 < 12 — na obu bokach punkt leży bliżej wierzchołka A.
    Odpowiedź: |EC| = 12 cm.
  solution_steps:
  - Zauważ, że DE ∥ BC, więc zachodzi proporcja |AD|/|DB| = |AE|/|EC|.
  - 'Oznacz |EC| = x, x > 0, i podstaw dane: 6/9 = 8/x.'
  - 'Pomnóż na krzyż: 6x = 72.'
  - 'Rozwiąż równanie: x = 12.'
  - 'Zapisz odpowiedź z jednostką: |EC| = 12 cm.'
  answer:
    kind: NUMERIC
    value: 12.0
  checks:
  - kind: solve_equation
    expr: \frac{6}{9}=\frac{8}{x}
  skills:
  - zapisanie proporcji część:część
  - mnożenie na krzyż
  - twierdzenie Talesa w trójkącie
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 12.0 vs 12.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: wiązka prostych równoległych przeciętych dwiema siecznymi
  statement: Trzy proste równoległe k, l, m przecinają dwie sieczne. Pierwsza sieczna przecina proste
    k, l, m odpowiednio w punktach A, B, C, a druga sieczna przecina te proste odpowiednio w punktach
    A′, B′, C′ (punkty oznaczone tą samą literą leżą na tej samej prostej równoległej; B leży między A
    i C, a B′ leży między A′ i C′). Wiadomo, że |AB| = 4, |BC| = 6 oraz |A′B′| = 5. Oblicz |B′C′|.
  statement_latex: \frac{|AB|}{|BC|}=\frac{|A'B'|}{|B'C'|},\qquad \frac{4}{6}=\frac{5}{x}
  solution: |-
    Trzy proste równoległe przecinają dwie sieczne, więc z twierdzenia Talesa odcinki wyznaczone na jednej siecznej są proporcjonalne do odcinków odpowiadających im na drugiej siecznej:
    \frac{|AB|}{|BC|}=\frac{|A'B'|}{|B'C'|}.
    Niech |B′C′| = x, x > 0. Podstawiamy dane:
    \frac{4}{6}=\frac{5}{x}.
    Mnożymy na krzyż: 4x = 30, stąd x = 7{,}5.
    Sprawdzenie: \frac{4}{6}=\frac{2}{3} oraz \frac{5}{7{,}5}=\frac{2}{3} — zgadza się.
    Odpowiedź: |B′C′| = 7,5.
  solution_steps:
  - 'Ustal odcinki odpowiadające sobie: AB ↔ A′B′ oraz BC ↔ B′C′.'
  - Zapisz proporcję |AB|/|BC| = |A′B′|/|B′C′| i oznacz |B′C′| = x.
  - 'Podstaw dane: 4/6 = 5/x.'
  - 'Pomnóż na krzyż: 4x = 30.'
  - Wyznacz x = 7,5 i zapisz odpowiedź.
  answer:
    kind: NUMERIC
    value: 7.5
  checks:
  - kind: solve_equation
    expr: \frac{4}{6}=\frac{5}{x}
  skills:
  - twierdzenie Talesa dla wiązki prostych równoległych
  - rozpoznanie odcinków odpowiadających sobie
  - mnożenie na krzyż
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 7.5 vs 7.5 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 1
  exercise_type: linia środkowa trójkąta
  statement: W trójkącie ABC punkt M jest środkiem boku AB, a punkt N jest środkiem boku AC. Bok BC ma
    długość 13 cm. Oblicz długość odcinka MN.
  statement_latex: '|MN|=\frac{1}{2}\cdot|BC|=\frac{1}{2}\cdot 13'
  solution: |-
    Odcinek MN łączy środki boków AB i AC, jest więc linią środkową trójkąta ABC. Z twierdzenia o linii środkowej (szczególny przypadek twierdzenia Talesa dla skali k = \frac{1}{2}) odcinek MN jest równoległy do boku BC i ma połowę jego długości:
    |MN| = \frac{1}{2}\cdot|BC| = \frac{1}{2}\cdot 13 = 6{,}5.
    Odpowiedź: |MN| = 6,5 cm.
  solution_steps:
  - Zauważ, że MN łączy środki dwóch boków, więc jest linią środkową trójkąta ABC.
  - Zastosuj wzór |MN| = (1/2)·|BC|.
  - Podstaw |BC| = 13 cm i oblicz |MN| = 6,5 cm.
  answer:
    kind: NUMERIC
    value: 6.5
  checks:
  - kind: evaluate
    expr: \frac{1}{2}\cdot 13
  skills:
  - twierdzenie o linii środkowej trójkąta
  - szczególny przypadek konfiguracji Talesa
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 6.5 vs 6.5 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: twierdzenie Talesa w kącie (dwie proste równoległe)
  statement: Ramiona kąta o wierzchołku O przecięto dwiema prostymi równoległymi k oraz l. Prosta k przecina
    jedno ramię kąta w punkcie A, a drugie ramię w punkcie B. Prosta l przecina te same ramiona odpowiednio
    w punktach C oraz D, przy czym punkt A leży między O i C, a punkt B leży między O i D. Wiadomo, że
    |OA| = 9, |AC| = 6 oraz |OB| = 12. Oblicz |OD| oraz |BD|.
  statement_latex: \frac{|OA|}{|OC|}=\frac{|OB|}{|OD|},\qquad \frac{9}{15}=\frac{12}{x}
  solution: |-
    Proste k i l są równoległe i przecinają ramiona kąta o wierzchołku O, więc możemy zastosować twierdzenie Talesa. Punktem odniesienia jest wierzchołek O.
    Najpierw liczymy całość na pierwszym ramieniu: |OC| = |OA| + |AC| = 9 + 6 = 15.
    (1) Proporcja całość:całość dla wyznaczenia |OD| = x, x > 0:
    \frac{|OA|}{|OC|}=\frac{|OB|}{|OD|},\quad \frac{9}{15}=\frac{12}{x}.
    Mnożymy na krzyż: 9x = 15\cdot 12 = 180, stąd x = 20, czyli |OD| = 20.
    (2) Stąd |BD| = |OD| - |OB| = 20 - 12 = 8.
    Kontrola proporcją część:część: \frac{|OA|}{|AC|}=\frac{9}{6}=\frac{3}{2} oraz \frac{|OB|}{|BD|}=\frac{12}{8}=\frac{3}{2} — zgadza się.
    Odpowiedź: |OD| = 20, |BD| = 8.
  solution_steps:
  - Oblicz |OC| = |OA| + |AC| = 9 + 6 = 15.
  - 'Zapisz proporcję Talesa całość:całość: |OA|/|OC| = |OB|/|OD|.'
  - 'Podstaw dane: 9/15 = 12/|OD| i pomnóż na krzyż: 9·|OD| = 180.'
  - Wyznacz |OD| = 20.
  - 'Oblicz |BD| = |OD| − |OB| = 20 − 12 = 8 (kontrola: 9/6 = 12/8).'
  - 'Zapisz odpowiedź: |OD| = 20, |BD| = 8.'
  answer:
    kind: MULTIPART
    parts:
    - name: OD
      answer:
        kind: NUMERIC
        value: 20.0
    - name: BD
      answer:
        kind: NUMERIC
        value: 8.0
  checks:
  - kind: solve_equation
    expr: \frac{9}{15}=\frac{12}{x}
    part: OD
  - kind: solve_equation
    expr: \frac{9}{6}=\frac{12}{x}
    part: BD
  skills:
  - proporcja całość:całość
  - proporcja część:część
  - rozwiązywanie równania liniowego z proporcji
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [OD] SymPy solved it fresh: 20.0 vs 20.0 (tol 1e-09) ; [BD]
      SymPy solved it fresh: 8.0 vs 8.0 (tol 1e-09)'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: niewiadoma w dwóch odcinkach + długość odcinka równoległego
  statement: W trójkącie ABC prosta równoległa do boku BC przecina bok AB w punkcie D, a bok AC w punkcie
    E. Wiadomo, że |AD| = x, |DB| = x + 3, |AE| = 4, |EC| = 10 oraz |BC| = 21. Oblicz x, długość boku
    AB oraz długość odcinka DE.
  statement_latex: \frac{x}{x+3}=\frac{4}{10},\qquad |DE|=\frac{|AD|}{|AB|}\cdot|BC|
  solution: |-
    Z założenia DE ∥ BC, a punkty D i E leżą na bokach AB i AC, więc z twierdzenia Talesa:
    \frac{|AD|}{|DB|}=\frac{|AE|}{|EC|},\quad \frac{x}{x+3}=\frac{4}{10}=\frac{2}{5}.
    Zakładamy x > 0, więc mianowniki są dodatnie. Mnożymy na krzyż:
    5\cdot x = 2\cdot\left(x+3\right),\quad 5x = 2x + 6,\quad 3x = 6,\quad x = 2.
    Stąd |AD| = 2, |DB| = 2 + 3 = 5, więc |AB| = 2 + 5 = 7.
    Długość odcinka DE liczymy ze skali podobieństwa trójkątów ADE i ABC (kąt A wspólny, kąty odpowiadające przy prostych równoległych DE i BC równe):
    k = \frac{|AD|}{|AB|} = \frac{2}{7},\quad |DE| = k\cdot|BC| = \frac{2}{7}\cdot 21 = 6.
    Sprawdzenie: \frac{2}{5} = \frac{4}{10} ✓.
    Odpowiedź: x = 2, |AB| = 7, |DE| = 6.
  solution_steps:
  - 'Zapisz proporcję Talesa: |AD|/|DB| = |AE|/|EC|, czyli x/(x+3) = 4/10.'
  - 'Pomnóż na krzyż, pamiętając o nawiasie: 5x = 2·(x + 3).'
  - 'Rozwiąż równanie: 5x = 2x + 6, 3x = 6, x = 2.'
  - Oblicz |AB| = |AD| + |DB| = 2 + 5 = 7.
  - 'Wyznacz skalę podobieństwa trójkątów ADE i ABC: k = |AD|/|AB| = 2/7 (stosunek CAŁYCH boków).'
  - Oblicz |DE| = k·|BC| = (2/7)·21 = 6.
  answer:
    kind: MULTIPART
    parts:
    - name: x
      answer:
        kind: NUMERIC
        value: 2.0
    - name: AB
      answer:
        kind: NUMERIC
        value: 7.0
    - name: DE
      answer:
        kind: NUMERIC
        value: 6.0
  checks:
  - kind: solve_equation
    expr: \frac{x}{x+3}=\frac{4}{10}
    part: x
  - kind: evaluate
    expr: 2+\left(2+3\right)
    part: AB
  - kind: evaluate
    expr: \frac{2}{7}\cdot 21
    part: DE
  skills:
  - proporcja z niewiadomą w dwóch odcinkach
  - mnożenie na krzyż z nawiasem
  - skala podobieństwa trójkątów
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [x] SymPy solved it fresh: 2.0 vs 2.0 (tol 1e-09) ; [AB] SymPy
      solved it fresh: 7.0 vs 7.0 (tol 1e-09) ; [DE] SymPy solved it fresh: 6.0 vs 6.0 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: konfiguracja motylka — przekątne trapezu
  statement: W trapezie ABCD podstawy AB i CD są równoległe, przy czym |AB| = 15 cm oraz |CD| = 9 cm.
    Przekątne AC i BD tego trapezu przecinają się w punkcie S. Przekątna BD ma długość 16 cm. Uzasadnij,
    że trójkąty ABS i CDS są podobne, a następnie oblicz |BS| oraz |SD|.
  statement_latex: \frac{|BS|}{|SD|}=\frac{|AB|}{|CD|}=\frac{15}{9},\qquad |BS|=\frac{5}{5+3}\cdot 16
  solution: |-
    Uzasadnienie podobieństwa. Kąty ASB i CSD są kątami wierzchołkowymi, więc są równe. Kąty ABS i CDS są kątami naprzemianległymi przy prostych równoległych AB i CD przeciętych sieczną BD, więc również są równe. Z cechy kąt-kąt trójkąty ABS i CDS są podobne, a więc odpowiadające sobie boki są proporcjonalne.
    Obliczenia. Z podobieństwa:
    \frac{|BS|}{|SD|}=\frac{|AB|}{|CD|}=\frac{15}{9}=\frac{5}{3}.
    Punkt S dzieli przekątną BD w stosunku 5 : 3, a odcinek BD składa się z 5 + 3 = 8 równych części, zatem
    |BS| = \frac{5}{5+3}\cdot|BD| = \frac{5}{8}\cdot 16 = 10\ \text{cm},
    |SD| = \frac{3}{8}\cdot 16 = 6\ \text{cm}.
    Sprawdzenie: 10 + 6 = 16 ✓ oraz \frac{10}{6}=\frac{5}{3} ✓.
    Odpowiedź: |BS| = 10 cm, |SD| = 6 cm.
  solution_steps:
  - Zauważ, że AB ∥ CD, a przekątne AC i BD są siecznymi przecinającymi się w S (konfiguracja motylka).
  - 'Uzasadnij podobieństwo: kąty ASB i CSD wierzchołkowe, kąty ABS i CDS naprzemianległe — cecha kąt-kąt.'
  - Zapisz proporcję |BS|/|SD| = |AB|/|CD| = 15/9 = 5/3.
  - 'Zamień stosunek część:część na część:całość: |BS| = 5/8 · |BD|, |SD| = 3/8 · |BD|.'
  - 'Podstaw |BD| = 16 cm: |BS| = 10 cm, |SD| = 6 cm.'
  - 'Sprawdź: 10 + 6 = 16 oraz 10/6 = 5/3.'
  answer:
    kind: MULTIPART
    parts:
    - name: uzasadnienie podobieństwa
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: 'Uczeń musi uzasadnić podobieństwo trójkątów ABS i CDS: kąty ASB i CSD są wierzchołkowe
          (równe), kąty ABS i CDS są naprzemianległe przy prostych równoległych AB i CD przeciętych sieczną
          BD (równe), zatem z cechy kąt-kąt trójkąty są podobne.'
    - name: BS
      answer:
        kind: NUMERIC
        value: 10.0
    - name: SD
      answer:
        kind: NUMERIC
        value: 6.0
  checks:
  - kind: evaluate
    expr: \frac{5}{5+3}\cdot 16
    part: BS
  - kind: evaluate
    expr: \frac{3}{5+3}\cdot 16
    part: SD
  skills:
  - uzasadnienie podobieństwa trójkątów
  - podział odcinka w danym stosunku
  - konfiguracja motylka
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie podobieństwa · 2/2 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: Obliczenie długości z proporcji Talesa i ze skali podobieństwa
  statement: W trójkącie ABC punkt D leży na boku AB, a punkt E leży na boku AC, przy czym odcinek DE
    jest równoległy do boku BC. Wiadomo, że |AD| = x, |DB| = x + 3, |AE| = 4, |EC| = 10 oraz |BC| = 21.
    Oblicz x oraz długość odcinka DE.
  statement_latex: \frac{x}{x+3}=\frac{4}{10},\qquad |DE|=\frac{|AD|}{|AB|}\cdot|BC|
  solution: |-
    Ponieważ DE ∥ BC, a punkty D i E leżą na ramionach kąta BAC po tej samej stronie wierzchołka A, to z twierdzenia Talesa odcinki odcięte na obu bokach są proporcjonalne:
    \frac{|AD|}{|DB|}=\frac{|AE|}{|EC|}, czyli \frac{x}{x+3}=\frac{4}{10}=\frac{2}{5}, przy czym x > 0.
    Mnożymy na krzyż: 5\cdot x = 2\cdot\left(x+3\right), stąd 5x = 2x + 6, czyli 3x = 6 i x = 2.
    Zatem |AD| = 2, |DB| = 5, więc |AB| = 2 + 5 = 7.
    Odcinek DE nie leży na siecznej, więc jego długość wyznaczamy ze skali podobieństwa trójkątów ADE i ABC (kąt A wspólny, kąty odpowiadające przy prostych równoległych równe):
    k = \frac{|AD|}{|AB|} = \frac{2}{7} (stosunek CAŁYCH boków, nie części).
    Stąd |DE| = k\cdot|BC| = \frac{2}{7}\cdot 21 = 6.
    Sprawdzenie sensowności: \frac{2}{5}=\frac{4}{10} ✓ oraz |DE| = 6 < 21 = |BC| ✓.
    Odpowiedź: x = 2 oraz |DE| = 6.
  solution_steps:
  - Z równoległości DE ∥ BC zapisz proporcję część:część \frac{|AD|}{|DB|}=\frac{|AE|}{|EC|}.
  - 'Podstaw dane: \frac{x}{x+3}=\frac{2}{5}.'
  - 'Pomnóż na krzyż: 5x = 2\left(x+3\right), skąd x = 2.'
  - Oblicz |AB| = |AD| + |DB| = 2 + 5 = 7.
  - Wyznacz skalę podobieństwa k = \frac{|AD|}{|AB|} = \frac{2}{7}.
  - Oblicz |DE| = \frac{2}{7}\cdot 21 = 6.
  answer:
    kind: MULTIPART
    parts:
    - name: x
      answer:
        kind: NUMERIC
        value: 2.0
    - name: DE
      answer:
        kind: NUMERIC
        value: 6.0
  checks:
  - kind: solve_equation
    expr: \frac{x}{x+3}=\frac{4}{10}
    part: x
  - kind: evaluate
    expr: \frac{2}{7}\cdot 21
    part: DE
  skills:
  - zapisanie proporcji część:część
  - rozwiązanie równania liniowego z proporcji
  - obliczenie długości odcinka równoległego do boku trójkąta
  - przejście część → całość
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [x] SymPy solved it fresh: 2.0 vs 2.0 (tol 1e-09) ; [DE] SymPy
