- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: skala z pól plus warunek na różnicę objętości
  statement: 'Ostrosłupy prawidłowe czworokątne F₁ i F₂ są podobne, przy czym ostrosłup F₁ jest mniejszy.
    Stosunek pola powierzchni całkowitej ostrosłupa F₁ do pola powierzchni całkowitej ostrosłupa F₂ jest
    równy 9 : 16. Różnica objętości ostrosłupa F₂ i ostrosłupa F₁ jest równa 259 cm³. a) Uzasadnij, że
    skala podobieństwa przejścia od ostrosłupa F₁ do ostrosłupa F₂ jest równa 4/3. b) Oblicz objętość
    ostrosłupa F₁. c) Oblicz objętość ostrosłupa F₂.'
  statement_latex: \frac{P_{1}}{P_{2}}=\frac{9}{16},\qquad k=\sqrt{\frac{16}{9}}=\frac{4}{3},\qquad V_{2}-V_{1}=259
  solution: |-
    a) Dla brył podobnych stosunek pól powierzchni jest równy kwadratowi skali. Przy przejściu F₁ → F₂ mamy P₂/P₁ = 16/9 = k², a ponieważ k > 0, to k = √(16/9) = 4/3.
    b) i c) Stosunek objętości: V₂/V₁ = k³ = (4/3)³ = 64/27. Zapiszmy V₁ = 27x, V₂ = 64x, gdzie x > 0.
    Z warunku V₂ − V₁ = 259 otrzymujemy 64x − 27x = 259, czyli 37x = 259, stąd x = 7.
    Zatem V₁ = 27·7 = 189 cm³, V₂ = 64·7 = 448 cm³.
    Sprawdzenie: 448 − 189 = 259 ✓ oraz 189/448 = 27/64 ✓.
    Odpowiedź: V₁ = 189 cm³, V₂ = 448 cm³.
  solution_steps:
  - Z zależności \frac{P_{2}}{P_{1}}=k^{2} wyznacz k=\sqrt{\frac{16}{9}}=\frac{4}{3} (uzasadnienie punktu
    a).
  - 'Oblicz stosunek objętości: \frac{V_{2}}{V_{1}}=k^{3}=\frac{64}{27}.'
  - Wprowadź oznaczenia V_{1}=27x, V_{2}=64x.
  - 'Ułóż równanie 64x-27x=259 i rozwiąż: 37x=259, x=7.'
  - Oblicz V_{1}=27\cdot 7=189\ \text{cm}^{3} oraz V_{2}=64\cdot 7=448\ \text{cm}^{3}.
  - 'Sprawdź warunek zadania: 448-189=259.'
  answer:
    kind: MULTIPART
    parts:
    - name: a) uzasadnienie skali
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń musi uzasadnić, że ze stosunku pól powierzchni P2:P1 = 16:9 wynika k² = 16/9, a
          więc (przy k > 0) k = 4/3.
    - name: b) objętość F1
      answer:
        kind: NUMERIC
        value: 189.0
        latex: 189\ \text{cm}^{3}
    - name: c) objętość F2
      answer:
        kind: NUMERIC
        value: 448.0
        latex: 448\ \text{cm}^{3}
  checks:
  - kind: evaluate
    expr: 27\cdot\frac{259}{37}
    part: b) objętość F1
  - kind: evaluate
    expr: 64\cdot\frac{259}{37}
    part: c) objętość F2
  skills:
  - k = sqrt(P'/P)
  - stosunek objętości k^3
  - układanie i rozwiązywanie równania liniowego
  - uzasadnianie
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: a) uzasadnienie skali · 2/2 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: Skala z pól, stosunek objętości, równanie z warunkiem dodatkowym
  statement: Dwa walce są podobne. Stosunek pola powierzchni całkowitej walca mniejszego do pola powierzchni
    całkowitej walca większego jest równy \(9:25\). Objętość walca większego jest o \(392\ \mathrm{cm}^{3}\)
    większa od objętości walca mniejszego. Wyznacz skalę podobieństwa \(k\) (przejście od walca mniejszego
    do większego) oraz oblicz objętość każdego z tych walców.
  statement_latex: \frac{P_{1}}{P_{2}}=\frac{9}{25},\qquad V_{2}-V_{1}=392\ \mathrm{cm}^{3},\qquad k=\sqrt{\frac{25}{9}}
  solution: |-
    Ze wzoru na stosunek pól brył podobnych mamy \(\frac{P_{2}}{P_{1}}=k^{2}=\frac{25}{9}\), więc \(k=\sqrt{\frac{25}{9}}=\frac{5}{3}\) (bierzemy wartość dodatnią). Skala przejścia od walca mniejszego do większego to \(k=\frac{5}{3}>1\), co jest zgodne z tym, że drugi walec jest większy.
    Stosunek objętości: \(\frac{V_{2}}{V_{1}}=k^{3}=\left(\frac{5}{3}\right)^{3}=\frac{125}{27}\).
    Oznaczmy \(V_{1}=27x\) oraz \(V_{2}=125x\), gdzie \(x>0\).
    Z warunku zadania: \(125x-27x=392\), czyli \(98x=392\), stąd \(x=4\).
    Zatem \(V_{1}=27\cdot 4=108\ \mathrm{cm}^{3}\) oraz \(V_{2}=125\cdot 4=500\ \mathrm{cm}^{3}\).
    Sprawdzenie: \(500-108=392\) ✓ oraz \(\frac{108}{500}=\frac{27}{125}\) ✓.
    Odpowiedź: \(k=\frac{5}{3}\), objętości wynoszą \(108\ \mathrm{cm}^{3}\) i \(500\ \mathrm{cm}^{3}\).
  solution_steps:
  - Z \frac{P_{2}}{P_{1}}=k^{2}=\frac{25}{9} wyznacz k=\frac{5}{3}.
  - 'Oblicz stosunek objętości: k^{3}=\frac{125}{27}.'
  - Wprowadź oznaczenia V_{1}=27x, V_{2}=125x, x>0.
  - 'Ułóż równanie 125x-27x=392 i rozwiąż: x=4.'
  - Oblicz V_{1}=108\ \mathrm{cm}^{3} i V_{2}=500\ \mathrm{cm}^{3} oraz sprawdź warunki zadania.
  answer:
    kind: MULTIPART
    parts:
    - name: k
      answer:
        kind: SYMBOLIC
        latex: \frac{5}{3}
    - name: V_mniejszego
      answer:
        kind: NUMERIC
        value: 108.0
    - name: V_wiekszego
      answer:
        kind: NUMERIC
        value: 500.0
  checks:
  - kind: evaluate
    expr: \sqrt{\frac{25}{9}}
    part: k
  - kind: evaluate
    expr: 27 \cdot \frac{392}{125 - 27}
    part: V_mniejszego
  - kind: evaluate
    expr: 125 \cdot \frac{392}{125 - 27}
    part: V_wiekszego
  skills:
  - wyznaczanie skali podobieństwa z stosunku pól
  - stosunek objętości k^3
  - układanie i rozwiązywanie prostego równania z warunkiem na różnicę objętości
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [k] SymPy solved it fresh: 1.6666666666666667 vs 1.6666666666666667
      (tol 1e-09) ; [V_mniejszego] SymPy solved it fresh: 108.0 vs 108.0 (tol 1e-09) ; [V_wiekszego] SymPy
      solved it fresh: 500.0 vs 500.0 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 5
  exercise_type: Masa brył podobnych, skala z objętości, pole powierzchni
  statement: Dwa ostrosłupy prawidłowe czworokątne są podobne i zostały wykonane z tego samego jednorodnego
    materiału. Masa mniejszego ostrosłupa jest równa \(24\ \mathrm{g}\), a masa większego \(81\ \mathrm{g}\).
    Krawędź podstawy mniejszego ostrosłupa ma długość \(4\ \mathrm{cm}\), a jego pole powierzchni całkowitej
    jest równe \(60\ \mathrm{cm}^{2}\). Oblicz długość krawędzi podstawy większego ostrosłupa oraz jego
    pole powierzchni całkowitej.
  statement_latex: \frac{m'}{m}=k^{3}=\frac{81}{24},\qquad a'=k\cdot 4\ \mathrm{cm},\qquad P'=k^{2}\cdot
    60\ \mathrm{cm}^{2}
  solution: |-
    Bryły są z tego samego materiału, więc ich masy są proporcjonalne do objętości: \(\frac{m'}{m}=\frac{V'}{V}=k^{3}\).
    Stąd \(k^{3}=\frac{81}{24}=\frac{27}{8}\), więc \(k=\sqrt[3]{\frac{27}{8}}=\frac{3}{2}\).
    Krawędź podstawy jest wielkością liniową, więc mnożymy ją przez \(k\): \(a'=\frac{3}{2}\cdot 4=6\ \mathrm{cm}\).
    Pole powierzchni całkowitej mnożymy przez \(k^{2}\): \(P'=\left(\frac{3}{2}\right)^{2}\cdot 60=\frac{9}{4}\cdot 60=135\ \mathrm{cm}^{2}\).
    Kontrola sensowności: \(k>1\), więc zarówno krawędź, jak i pole większego ostrosłupa są większe — zgadza się.
    Odpowiedź: krawędź podstawy większego ostrosłupa ma długość \(6\ \mathrm{cm}\), a jego pole powierzchni całkowitej wynosi \(135\ \mathrm{cm}^{2}\).
  solution_steps:
  - Zauważ, że przy tym samym materiale \frac{m'}{m}=\frac{V'}{V}=k^{3}.
  - Oblicz k^{3}=\frac{81}{24}=\frac{27}{8}, a następnie k=\frac{3}{2}.
  - 'Krawędź podstawy: a''=k\cdot 4=6\ \mathrm{cm}.'
  - 'Pole powierzchni całkowitej: P''=k^{2}\cdot 60=\frac{9}{4}\cdot 60=135\ \mathrm{cm}^{2}.'
  - Sprawdź sensowność wyników (k>1, więc obie wielkości rosną).
  answer:
    kind: MULTIPART
    parts:
    - name: krawedz_wiekszego
      answer:
        kind: NUMERIC
        value: 6.0
    - name: pole_wiekszego
      answer:
        kind: NUMERIC
        value: 135.0
  checks:
  - kind: evaluate
    expr: 4 \cdot \left(\frac{81}{24}\right)^{\frac{1}{3}}
    part: krawedz_wiekszego
  - kind: evaluate
    expr: 60 \cdot \left(\frac{81}{24}\right)^{\frac{2}{3}}
    part: pole_wiekszego
  skills:
  - masa jako wielkość proporcjonalna do objętości (k^3)
