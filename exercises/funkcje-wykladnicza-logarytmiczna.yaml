  difficulty: 3
  exercise_type: 'wykrycie błędu: fałszywe wzory na logarytmy'
  statement: 'Uczeń obliczał wartości dwóch wyrażeń i zapisał: „A = \log_{2}40 - \log_{2}5 = \frac{\log_{2}40}{\log_{2}5}”
    oraz „B = \log 2 + \log 5 = \log\left(2 + 5\right) = \log 7”. Wskaż, które wzory zostały użyte błędnie,
    i oblicz poprawne wartości wyrażeń A oraz B.'
  statement_latex: A=\log_{2}40-\log_{2}5,\qquad B=\log 2+\log 5
  solution: |-
    Błędne rozumowanie: uczeń użył nieistniejących „wzorów” \log x - \log y = \frac{\log x}{\log y} oraz \log x + \log y = \log(x+y). Poprawne wzory to \log_{a}\frac{x}{y} = \log_{a}x - \log_{a}y oraz \log_{a}(x\cdot y) = \log_{a}x + \log_{a}y — różnicy logarytmów odpowiada ILORAZ liczb, a sumie logarytmów ILOCZYN liczb.

    Korekta:
    A = \log_{2}40 - \log_{2}5 = \log_{2}\frac{40}{5} = \log_{2}8 = 3.
    B = \log 2 + \log 5 = \log\left(2\cdot 5\right) = \log 10 = 1.
    (Dla porównania: błędne wyniki ucznia to \frac{\log_{2}40}{\log_{2}5} \approx \frac{5{,}32}{2{,}32}\approx 2{,}29 oraz \log 7 \approx 0{,}85 — obie liczby są inne niż poprawne 3 i 1.)
  solution_steps:
  - 'Wskazujemy błąd: różnica logarytmów to logarytm ILORAZU, a nie iloraz logarytmów; suma logarytmów
    to logarytm ILOCZYNU, a nie logarytm sumy.'
  - 'Stosujemy wzór na logarytm ilorazu: A=\log_{2}\frac{40}{5}=\log_{2}8=3.'
  - 'Stosujemy wzór na logarytm iloczynu: B=\log\left(2\cdot 5\right)=\log 10=1.'
  answer:
    kind: MULTIPART
    parts:
    - name: A
      answer:
        kind: NUMERIC
        value: 3.0
        latex: '3'
    - name: B
      answer:
        kind: NUMERIC
        value: 1.0
        latex: '1'
  checks:
  - kind: evaluate
    expr: \log_{2}\left(40\right)-\log_{2}\left(5\right)
    part: A
  - kind: evaluate
    expr: \log_{10}\left(2\right)+\log_{10}\left(5\right)
    part: B
  skills:
  - logarytm ilorazu i iloczynu
  - obliczanie wartości wyrażeń logarytmicznych
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
