- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: sprowadzanie_do_wspolnej_podstawy
  statement: Dane są liczby 27^{10} oraz 9^{16}. Zapisz każdą z nich w postaci potęgi o podstawie 3 (podaj
    otrzymane wykładniki), a następnie rozstrzygnij, która z tych liczb jest większa.
  statement_latex: 27^{10} = 3^{\square}, \qquad 9^{16} = 3^{\square}
  solution: |-
    Obie podstawy są potęgami trójki: 27 = 3^{3} oraz 9 = 3^{2}. Stąd
    27^{10} = \left(3^{3}\right)^{10} = 3^{3 \cdot 10} = 3^{30},
    9^{16} = \left(3^{2}\right)^{16} = 3^{2 \cdot 16} = 3^{32}.
    Wspólna podstawa 3 jest większa od 1, więc potęgowanie zachowuje porządek wykładników. Ponieważ 30 < 32, mamy 3^{30} < 3^{32}, czyli 27^{10} < 9^{16}.
    Odpowiedź: większa jest liczba 9^{16}.
  solution_steps:
  - 'Zapisz podstawy jako potęgi trójki: 27 = 3^{3}, 9 = 3^{2}.'
  - 'Zastosuj wzór \left(a^{m}\right)^{n} = a^{m \cdot n}: 27^{10} = 3^{30}, 9^{16} = 3^{32}.'
  - Zauważ, że podstawa 3 > 1, więc potęgowanie jest rosnące.
  - 'Porównaj wykładniki: 30 < 32, zatem 27^{10} < 9^{16} — większa jest liczba 9^{16}.'
  answer:
    kind: MULTIPART
    parts:
    - name: wykladnik liczby 27^{10} przy podstawie 3
      answer:
        kind: NUMERIC
        value: 30.0
    - name: wykladnik liczby 9^{16} przy podstawie 3
      answer:
        kind: NUMERIC
        value: 32.0
    - name: wieksza liczba
      answer:
        kind: SYMBOLIC
        latex: 9^{16}
  checks:
  - kind: evaluate
    expr: 3 \cdot 10
    part: wykladnik liczby 27^{10} przy podstawie 3
  - kind: evaluate
    expr: 2 \cdot 16
    part: wykladnik liczby 9^{16} przy podstawie 3
