- id: g-cm-07
  slot: COMMON_MISTAKE
  ramp_index: 1
  difficulty: 3
  exercise_type: ocena błędnego rozumowania
  statement: 'Uczeń miał uzasadnić zdanie: „w każdym czworokącie wpisanym w okrąg suma miar kątów przeciwległych
    jest równa 180°”. Napisał: „Sprawdziłem to dla kwadratu wpisanego w okrąg: 90° + 90° = 180°, oraz
    dla prostokąta: też 90° + 90° = 180°, zatem twierdzenie jest udowodnione”. Wyjaśnij, dlaczego takie
    sprawdzenie nie jest dowodem, naszkicuj poprawne uzasadnienie, a następnie oblicz miarę kąta BCD w
    czworokącie ABCD wpisanym w okrąg, w którym |∡DAB| = 118°.'
  statement_latex: '|\sphericalangle DAB| + |\sphericalangle BCD| = 180^\circ,\qquad |\sphericalangle
    BCD| = 180^\circ - 118^\circ'
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: sprawdzenie tezy dla kwadratu i prostokąta i uznanie zdania ogólnego za udowodnione.

    DLACZEGO TO BŁĄD: zdanie zaczyna się od słowa „każdy”, więc dotyczy nieskończenie wielu czworokątów. Sprawdzenie jednego (ani stu) przykładów nie dowodzi zdania ogólnego — dowodzi tylko, że w tych konkretnych przypadkach teza zachodzi. Dodatkowo uczeń wybrał przypadki wyjątkowo szczególne (wszystkie kąty proste), z których nic nie widać o czworokącie ogólnym. Pojedynczy przykład wystarcza wyłącznie do OBALENIA zdania ogólnego (kontrprzykład), a nie do jego udowodnienia.

    POPRAWNE UZASADNIENIE (dla dowolnego czworokąta ABCD wpisanego w okrąg o środku O): kąt DAB jest kątem wpisanym opartym na tym łuku BD, który zawiera punkt C; odpowiadający mu kąt środkowy oznaczmy φ, wtedy φ = 2·|∡DAB|. Kąt BCD jest kątem wpisanym opartym na drugim łuku BD (zawierającym A); odpowiadający mu kąt środkowy ψ spełnia ψ = 2·|∡BCD|. Oba łuki tworzą razem cały okrąg, więc φ + ψ = 360°, czyli 2·|∡DAB| + 2·|∡BCD| = 360°, a stąd |∡DAB| + |∡BCD| = 180°. Rozumowanie nie korzystało z żadnej szczególnej własności czworokąta — dlatego jest dowodem.

    OBLICZENIE: dla |∡DAB| = 118° mamy |∡BCD| = 180° − 118° = 62°.
    Zauważ, że wynik 62° ≠ 90° — przykłady ucznia (kwadrat, prostokąt) w ogóle nie obejmowały takiej sytuacji.
  solution_steps:
  - 'Nazwij błąd: sprawdzenie przykładów zamiast dowodu zdania ogólnego.'
  - Wyjaśnij, że przykład obala zdanie ogólne, ale go nie dowodzi.
  - 'Podaj poprawne uzasadnienie: kąty wpisane DAB i BCD oparte na dopełniających się łukach BD, odpowiadające
    kąty środkowe dają 360°.'
  - 'Przekształć: 2·|∡DAB| + 2·|∡BCD| = 360°, czyli |∡DAB| + |∡BCD| = 180°.'
  - Podstaw |∡DAB| = 118° i oblicz |∡BCD| = 62°.
  answer:
    kind: NUMERIC
    value: 62.0
  checks:
