- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 3
  exercise_type: praca z błędem — trygonometria bez kąta prostego
  statement: 'W trójkącie ABC dane są |AB| = 8, |AC| = 6 oraz kąt BAC o mierze 30°. Trójkąt ten nie ma
    kąta prostego. Oblicz długość wysokości opuszczonej z wierzchołka C na bok AB oraz pole tego trójkąta.
    Wyjaśnij przy tym, dlaczego zapis „sin 30° = |BC| : |AB|” jest w tym trójkącie błędny.'
  statement_latex: '|AB|=8,\ |AC|=6,\ |\angle BAC|=30^\circ,\qquad h=6\cdot\sin 30^\circ,\qquad P=\frac{1}{2}\cdot
    8\cdot h'
  solution: |-
    BŁĘDNE ROZUMOWANIE (typowy błąd):
    Uczeń traktuje trójkąt ABC tak, jakby był prostokątny, i pisze
    \[\sin 30^\circ=\frac{|BC|}{|AB|}=\frac{|BC|}{8}\ \Rightarrow\ |BC|=4,\]
    a następnie „pole = ½·|AB|·|BC| = ½·8·4 = 16”. Otrzymuje h = 4 i P = 16 — obie liczby są błędne.

    DLACZEGO TO BŁĄD:
    Definicje sin, cos, tg jako stosunki boków obowiązują WYŁĄCZNIE w trójkącie prostokątnym. W trójkącie ABC nie ma kąta prostego, więc AB nie jest żadną przeciwprostokątną i stosunek |BC| : |AB| nie ma nic wspólnego z sin 30°.

    POPRAWNE ROZWIĄZANIE:
    Dorysowujemy wysokość CD z wierzchołka C na prostą AB — dopiero wtedy powstaje trójkąt prostokątny ACD, w którym AC = 6 jest przeciwprostokątną, a h = |CD| leży naprzeciw kąta 30°:
    \[h=6\cdot\sin 30^\circ=6\cdot\frac{1}{2}=3 .\]
    Pole:
    \[P=\frac{1}{2}\cdot|AB|\cdot h=\frac{1}{2}\cdot 8\cdot 3=12 .\]
    Kontrola wzorem na pole z dwóch boków i kąta między nimi:
    \[P=\frac{1}{2}\cdot 8\cdot 6\cdot\sin 30^\circ=24\cdot\frac{1}{2}=12 .\] ✓

    Odpowiedź: h = 3, P = 12.
  solution_steps:
  - 'Rozpoznaj błąd: użycie sin 30° = |BC|/|AB| w trójkącie, który nie jest prostokątny (daje h = 4, P
    = 16).'
  - Przypomnij, że definicje sin/cos/tg dotyczą tylko trójkąta prostokątnego.
  - Dorysuj wysokość CD na bok AB — powstaje trójkąt prostokątny ACD z przeciwprostokątną AC = 6.
  - Oblicz h = 6·sin 30° = 3.
  - Oblicz pole P = ½·8·3 = 12 i sprawdź wzorem P = ½·8·6·sin 30°.
