  statement: 'Uczeń rozwiązywał zadanie: „Klient wpłacił do banku 2000 zł na lokatę trzyletnią. Po każdym
    rocznym okresie oszczędzania bank dolicza odsetki w wysokości 8% od kwoty bieżącego kapitału (procent
    składany). Ile pieniędzy będzie na lokacie po 3 latach, bez uwzględniania podatków?”. Uczeń napisał:
    „3·8% = 24%, więc kapitał wyniesie 2000·1,24 = 2480 zł”. Wskaż błąd w rozumowaniu ucznia i podaj poprawny
    wynik z dokładnością do 1 grosza.'
  statement_latex: K_{3}=2000\cdot\left(1+\frac{8}{100}\right)^{3}
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: „W każdym roku dochodzi 8%, więc przez trzy lata dojdzie 8% + 8% + 8% = 24%. Zatem K = 2000·(1 + 0,24) = 2000·1,24 = 2480 zł.”
    DLACZEGO TO ŹLE: dodawanie procentów oznaczałoby, że co roku odsetki liczone są ciągle od tej samej kwoty 2000 zł — to procent PROSTY. Przy kapitalizacji odsetki są dopisywane do kapitału i w następnym roku same przynoszą odsetki, więc zmiany procentowe się MNOŻĄ, a nie dodają.
