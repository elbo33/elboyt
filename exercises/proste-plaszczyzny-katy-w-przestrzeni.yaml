- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: 'zadanie odwrotne: od objętości i kąta do krawędzi'
  statement: Objętość pewnego ostrosłupa prawidłowego czworokątnego jest równa $36\sqrt{3}$, a każda jego
    ściana boczna jest nachylona do płaszczyzny podstawy pod kątem $60^\circ$. Oblicz długość krawędzi
    podstawy tego ostrosłupa.
  statement_latex: \frac{1}{3} \cdot a^{2} \cdot \left(\frac{a}{2} \cdot \operatorname{tg}60^\circ\right)
    = 36 \cdot \sqrt{3}
  solution: |-
    Oznaczmy przez $a$ długość krawędzi podstawy, przez $O$ — środek podstawy (spodek wysokości $H$), a przez $M$ — środek jednej z krawędzi podstawy.

    Odcinek $OM$ jest prostopadły do tej krawędzi i $|OM| = r = \frac{a}{2}$; apotema poprowadzona z wierzchołka ostrosłupa też jest do niej prostopadła, więc kątem liniowym kąta dwuściennego ściana boczna–podstawa jest kąt o mierze $60^\circ$ w trójkącie prostokątnym o przyprostokątnych $H$ i $r$. Stąd
    $$H = r \cdot \operatorname{tg}60^\circ = \frac{a}{2} \cdot \sqrt{3} = \frac{a \cdot \sqrt{3}}{2}.$$

    Objętość ostrosłupa:
    $$V = \frac{1}{3} \cdot a^{2} \cdot H = \frac{1}{3} \cdot a^{2} \cdot \frac{a \cdot \sqrt{3}}{2} = \frac{a^{3} \cdot \sqrt{3}}{6}.$$

    Z warunku zadania $\frac{a^{3} \cdot \sqrt{3}}{6} = 36 \cdot \sqrt{3}$, czyli $a^{3} = 216$, zatem $a = \sqrt[3]{216} = 6$.

    Odpowiedź: krawędź podstawy ma długość $6$ (wtedy $H = 3\sqrt{3}$).
  solution_steps:
  - Wprowadź zmienną $a$ — długość krawędzi podstawy.
  - 'Zbuduj kąt liniowy: $r = \frac{a}{2}$, kąt $60^\circ$ w trójkącie o przyprostokątnych $H$ i $r$.'
  - 'Wyraź wysokość: $H = \frac{a}{2} \cdot \sqrt{3}$.'
  - 'Zapisz objętość jako funkcję $a$: $V = \frac{a^{3}\sqrt{3}}{6}$.'
  - Rozwiąż równanie $\frac{a^{3}\sqrt{3}}{6} = 36\sqrt{3}$, czyli $a^{3} = 216$, skąd $a = 6$.
  answer:
    kind: NUMERIC
    value: 6.0
    latex: '6'
  checks:
  - kind: evaluate
    expr: \sqrt[3]{216}
    var: a
  stated_model:
    variable: a
    objective_latex: V\left(a\right) = \frac{a^{3} \cdot \sqrt{3}}{6}
    domain_lo: '0'
    goal: value
    constraint_used: H = \frac{a}{2} \cdot \operatorname{tg}60^\circ
