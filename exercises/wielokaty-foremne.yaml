      answer:
        kind: SYMBOLIC
        latex: 4\sqrt{3}
    - name: obwod
      answer:
        kind: SYMBOLIC
        latex: 24\sqrt{3}
    - name: pole
      answer:
        kind: SYMBOLIC
        latex: 72\sqrt{3}
