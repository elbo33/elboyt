  statement: W trójkącie ABC dane są |AB| = 3, |AC| = 5 oraz |∠BAC| = 120°. Oblicz długość boku BC oraz
    pole trójkąta ABC. Zapisz obliczenia.
  statement_latex: '|BC|^2 = 3^2 + 5^2 - 2\cdot 3\cdot 5\cdot\cos 120^\circ,\qquad P = \frac{1}{2}\cdot
    3\cdot 5\cdot\sin 120^\circ'
  solution: |-
    Kąt BAC leży między bokami AB i AC, a naprzeciw niego leży bok BC.
    Twierdzenie cosinusów: |BC|^2 = |AB|^2 + |AC|^2 - 2\cdot|AB|\cdot|AC|\cdot\cos 120^\circ.
    Ponieważ cos 120° = -\frac{1}{2}, składnik poprawkowy jest dodatni:
    -2\cdot 3\cdot 5\cdot\left(-\frac{1}{2}\right) = +15,
    więc |BC|^2 = 9 + 25 + 15 = 49, czyli |BC| = 7.
    Pole: sin 120° = \frac{\sqrt{3}}{2}, zatem
    P = \frac{1}{2}\cdot 3\cdot 5\cdot\frac{\sqrt{3}}{2} = \frac{15\sqrt{3}}{4} \approx 6{,}5.
    Kontrola: 7 < 3 + 5 = 8 (nierówność trójkąta), a najdłuższy bok BC leży naprzeciw największego, rozwartego kąta.
  solution_steps:
  - Ustal, że kąt 120° jest kątem między bokami AB i AC, a bok BC leży naprzeciw niego.
  - Zapisz |BC|^2 = 3^2 + 5^2 - 2\cdot 3\cdot 5\cdot\cos 120^\circ.
  - 'Podstaw cos 120° = -\frac{1}{2}: |BC|^2 = 9 + 25 + 15 = 49, więc |BC| = 7.'
  - 'Oblicz pole: P = \frac{1}{2}\cdot 3\cdot 5\cdot\frac{\sqrt{3}}{2} = \frac{15\sqrt{3}}{4}.'
  - 'Sprawdź sensowność wyniku: nierówność trójkąta i zasada ''większy bok naprzeciw większego kąta''.'
