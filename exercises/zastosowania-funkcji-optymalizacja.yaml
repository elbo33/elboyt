- id: g-cm-10
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 3
  exercise_type: 'błąd: wybór rozwiązania bez sensu fizycznego'
  statement: 'Z balkonu położonego na wysokości 15 m nad ziemią wyrzucono pionowo w górę piłkę. Wysokość
    piłki nad ziemią (w metrach) po t sekundach opisuje wzór h\left(t\right)=-5t^{2}+10t+15, przy czym
    t \ge 0. Uczeń rozwiązał równanie h\left(t\right)=0, otrzymał t=-1 oraz t=3 i napisał: „piłka uderza
    w ziemię dwukrotnie: w chwili t=-1 s oraz w chwili t=3 s”. Wskaż błąd w tym rozumowaniu i podaj (a)
    chwilę, w której piłka uderzy w ziemię, oraz (b) wysokość piłki po 1 sekundzie lotu. Zapisz obliczenia.'
  statement_latex: h\left(t\right)=-5t^{2}+10t+15
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń poprawnie rozwiązał równanie -5t^{2}+10t+15=0 (po podzieleniu przez -5: t^{2}-2t-3=0, \Delta=16, t_{1}=-1, t_{2}=3), ale oba pierwiastki potraktował jako chwile czasu i stwierdził, że piłka uderza w ziemię dwa razy, w tym w chwili t=-1 s.
    DLACZEGO TO BŁĄD: t oznacza czas liczony od chwili wyrzucenia, więc dziedziną modelu jest t \ge 0. Liczba t=-1 nie należy do dziedziny – nie opisuje żadnej chwili ruchu i trzeba ją odrzucić jako niezgodną z sytuacją. Ruch kończy się w chwili pierwszego zetknięcia z ziemią, więc jest tylko jedna taka chwila.
    POPRAWNIE: (a) spośród pierwiastków -1 i 3 do dziedziny należy tylko t=3, zatem piłka uderzy w ziemię po 3 sekundach.
    (b) h(1)=-5\cdot 1^{2}+10\cdot 1+15=-5+10+15=20, czyli po 1 sekundzie piłka jest na wysokości 20 m (to jednocześnie największa wysokość, bo p=-\frac{10}{2\cdot(-5)}=1).
    Odpowiedź: piłka uderzy w ziemię po 3 s; po 1 s znajduje się na wysokości 20 m.
  solution_steps:
  - 'Odtwórz błędne rozumowanie: uznanie obu pierwiastków (-1 i 3) za chwile upadku.'
  - 'Wskaż błąd: dziedziną modelu jest t \ge 0, więc t=-1 należy odrzucić.'
  - 'Rozwiąż h(t)=0: t^{2}-2t-3=0, \Delta=16, t=-1 lub t=3; wybierz t=3.'
  - Oblicz h(1)=-5+10+15=20 (m).
  - 'Zapisz odpowiedź z jednostkami: 3 s oraz 20 m.'
  answer:
    kind: MULTIPART
    parts:
    - name: chwila uderzenia o ziemię (s)
      answer:
        kind: NUMERIC
        value: 3.0
    - name: wysokość po 1 sekundzie (m)
      answer:
        kind: NUMERIC
        value: 20.0
