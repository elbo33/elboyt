- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: obliczeniowe (trapez równoramienny)
  statement: W trapezie równoramiennym ABCD podstawy mają długości |AB| = 14 oraz |CD| = 6, przy czym
    AB jest podstawą dłuższą, a ramiona AD i BC są równej długości. Kąty przy dłuższej podstawie AB mają
    miarę 45^\circ. Oblicz długość ramienia, wysokość, pole oraz obwód tego trapezu. Wyniki podaj w postaci
    dokładnej.
  statement_latex: '|AB|=14,\quad |CD|=6,\quad \alpha=45^\circ,\quad p=\frac{14-6}{2},\quad c=\frac{p}{\cos
    45^\circ},\quad h=c\cdot\sin 45^\circ,\quad P=\frac{1}{2}\cdot\left(14+6\right)\cdot h'
  solution: |-
    Z wierzchołków C i D prowadzimy wysokości na podstawę AB. Odcinają one na AB środkowy prostokąt o długości 6 oraz dwa przystające trójkąty prostokątne o kącie ostrym 45^\circ.

    1) Rzut ramienia na dłuższą podstawę: p = \frac{14-6}{2} = 4.

    2) Rzut p leży PRZY kącie 45^\circ, a ramię c jest przeciwprostokątną, więc \cos 45^\circ = \frac{4}{c}, czyli \frac{\sqrt{2}}{2} = \frac{4}{c}, stąd c = \frac{4}{\frac{\sqrt{2}}{2}} = \frac{8}{\sqrt{2}} = 4\sqrt{2}.

    3) Wysokość leży naprzeciw kąta 45^\circ: h = c\cdot\sin 45^\circ = 4\sqrt{2}\cdot\frac{\sqrt{2}}{2} = 4.
    (Kontrola Pitagorasem: 4^2+4^2 = 32 = \left(4\sqrt{2}\right)^2. ✓)

    4) Pole: P = \frac{1}{2}\cdot\left(14+6\right)\cdot 4 = 40.

    5) Obwód: L = 14 + 6 + 2\cdot 4\sqrt{2} = 20 + 8\sqrt{2}.

    Odpowiedź: ramię 4\sqrt{2}, wysokość 4, pole 40, obwód 20+8\sqrt{2}.
  solution_steps:
  - Poprowadź wysokości z C i D na AB — powstają dwa przystające trójkąty prostokątne o kącie 45^\circ.
  - 'Oblicz rzut ramienia: p = \frac{14-6}{2} = 4.'
  - Z \cos 45^\circ = \frac{4}{c} wyznacz ramię c = 4\sqrt{2}.
  - Z h = c\cdot\sin 45^\circ oblicz wysokość h = 4.
  - Policz pole P = \frac{1}{2}\cdot\left(14+6\right)\cdot 4 = 40.
  - Policz obwód L = 14+6+2\cdot 4\sqrt{2} = 20+8\sqrt{2}.
  answer:
    kind: MULTIPART
    parts:
    - name: ramie
      answer:
        kind: SYMBOLIC
        latex: 4\sqrt{2}
    - name: wysokosc
      answer:
        kind: NUMERIC
        value: 4.0
    - name: pole
      answer:
        kind: NUMERIC
        value: 40.0
    - name: obwod
      answer:
        kind: SYMBOLIC
        latex: 20+8\sqrt{2}
  checks:
  - kind: evaluate
    expr: \frac{4}{\frac{\sqrt{2}}{2}}
    part: ramie
  - kind: evaluate
    expr: 4\sqrt{2}\cdot\frac{\sqrt{2}}{2}
    part: wysokosc
