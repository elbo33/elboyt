- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: Optymalizacja pola bocznego walca powstałego z obrotu prostokąta
  statement: Prostokąt o obwodzie równym 28 obracamy wokół prostej zawierającej jeden z jego boków i otrzymujemy
    walec. Wyznacz długości boków tego prostokąta, dla których pole powierzchni bocznej otrzymanego walca
    jest największe, oraz oblicz to największe pole. Zapisz obliczenia.
  statement_latex: P_{b}\left(x\right) = 2\pi\cdot x\cdot\left(14 - x\right),\qquad x\in\left(0;14\right)
  solution: |-
    Krok 1. Oznaczmy przez x długość boku prostokąta prostopadłego do osi obrotu. Bok ten staje się promieniem walca, więc r = x. Z obwodu prostokąta: 2\left(x + H\right) = 28, czyli bok leżący na osi obrotu (wysokość walca) ma długość H = 14 - x.
    Musi być x > 0 oraz 14 - x > 0, zatem x \in \left(0;14\right).
    Krok 2. Pole powierzchni bocznej walca:
    P_{b}\left(x\right) = 2\pi r H = 2\pi\cdot x\cdot\left(14 - x\right) = -2\pi x^{2} + 28\pi x.
    Krok 3. Jest to funkcja kwadratowa o ujemnym współczynniku przy x^{2}, więc największą wartość przyjmuje w wierzchołku:
    x_{w} = \frac{-28\pi}{2\cdot\left(-2\pi\right)} = 7, a 7 \in \left(0;14\right).
    Wtedy H = 14 - 7 = 7, czyli prostokąt jest kwadratem o boku 7 (walec jest równoboczny).
    Krok 4. P_{b} = 2\pi\cdot 7\cdot 7 = 98\pi \approx 307{,}9.
    Odp. Boki prostokąta mają długości 7 i 7, a największe pole powierzchni bocznej wynosi 98\pi.
  solution_steps:
  - 'Wprowadź zmienną: x — długość boku prostopadłego do osi obrotu, czyli promień walca.'
  - 'Z obwodu 28 wyznacz drugi bok (wysokość walca): H = 14 - x, oraz dziedzinę x\in\left(0;14\right).'
  - 'Zbuduj funkcję: P_{b}\left(x\right) = 2\pi x\left(14-x\right) = -2\pi x^{2} + 28\pi x.'
  - 'Wyznacz wierzchołek: x_{w} = 7 (należy do dziedziny), stąd H = 7.'
  - 'Oblicz największe pole: P_{b} = 2\pi\cdot 7\cdot 7 = 98\pi.'
  answer:
