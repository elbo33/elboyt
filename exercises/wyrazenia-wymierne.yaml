  statement: |-
    Trójkąt T ma pole równe x^{2}-4, a długość jego podstawy jest równa 2\cdot x+4. Prostokąt R ma pole równe x^{2}-2\cdot x, a jeden z jego boków ma długość x-2. Wszystkie występujące w opisie długości i pola są dodatnie.
    a) Wyznacz wysokość trójkąta T opuszczoną na podaną podstawę oraz długość drugiego boku prostokąta R, zapisz w najprostszej postaci iloraz W\left(x\right) = \frac{\text{wysokość trójkąta } T}{\text{drugi bok prostokąta } R} i podaj zbiór wszystkich wartości x, dla których ten opis ma sens.
    b) Wyznacz tę wartość x, dla której W\left(x\right) = \frac{3}{5}, i sprawdź, czy należy ona do zbioru wyznaczonego w podpunkcie a).
  statement_latex: W\left(x\right) = \frac{\frac{2\cdot\left(x^{2}-4\right)}{2\cdot x+4}}{\frac{x^{2}-2\cdot
    x}{x-2}}
  solution: |-
    a) Wysokość trójkąta wyznaczamy ze wzoru na pole P=\frac{1}{2}\cdot a\cdot h, czyli h=\frac{2P}{a}:
    h\left(x\right)=\frac{2\left(x^{2}-4\right)}{2x+4}=\frac{2\left(x-2\right)\left(x+2\right)}{2\left(x+2\right)}=x-2.
    Drugi bok prostokąta to iloraz pola i danego boku:
    b\left(x\right)=\frac{x^{2}-2x}{x-2}=\frac{x\left(x-2\right)}{x-2}=x.
    Iloraz:
    W\left(x\right)=\frac{x-2}{x}.
    Warunki: bok prostokąta x-2>0, czyli x>2; wtedy również x>0, 2x+4>0, x^{2}-4>0 i x^{2}-2x>0, a mianowniki 2x+4, x-2, x są różne od zera. Zatem opis ma sens dla x\in\left(2,\;+\infty\right).
    b) Rozwiązujemy równanie
    \frac{x-2}{x}=\frac{3}{5}\;\Rightarrow\; 5\left(x-2\right)=3x\;\Rightarrow\; 5x-10=3x\;\Rightarrow\; 2x=10\;\Rightarrow\; x=5.
    Sprawdzenie: 5>2, więc x=5 należy do zbioru \left(2,+\infty\right) — rozwiązanie jest dopuszczalne (wysokość trójkąta wynosi 3, drugi bok prostokąta 5, a ich iloraz \frac{3}{5}).
    Odpowiedź: h(x)=x-2, b(x)=x, W\left(x\right)=\frac{x-2}{x} dla x\in\left(2,+\infty\right); W\left(x\right)=\frac{3}{5} dla x=5.
