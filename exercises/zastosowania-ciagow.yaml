    note: '[whole] SymPy solved it fresh: 5304.5 vs 5304.5 (tol 0.005)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: model arytmetyczny — wyraz i suma
  statement: W amfiteatrze w pierwszym rzędzie widowni jest 12 miejsc, a w każdym następnym rzędzie o
    4 miejsca więcej niż w rzędzie poprzednim. Widownia ma 20 rzędów. Oblicz, ile miejsc jest w ostatnim
    rzędzie oraz ile miejsc ma cała widownia. Zapisz obliczenia.
  statement_latex: a_{1} = 12,\quad r = 4,\quad a_{20} = 12 + \left(20-1\right)\cdot 4,\quad S_{20} =
    \frac{a_{1}+a_{20}}{2}\cdot 20
  solution: |-
    Niech a_n oznacza liczbę miejsc w n-tym rzędzie. Z treści a_1 = 12 oraz a_{n+1} = a_n + 4, więc (a_n) jest ciągiem arytmetycznym o różnicy r = 4.
    Ostatni (dwudziesty) rząd: a_{20} = 12 + (20-1)\cdot 4 = 12 + 76 = 88 miejsc.
    Cała widownia to suma 20 początkowych wyrazów:
    S_{20} = \frac{a_1 + a_{20}}{2}\cdot 20 = \frac{12+88}{2}\cdot 20 = 50\cdot 20 = 1000.
    Odpowiedź: w ostatnim rzędzie jest 88 miejsc, a cała widownia liczy 1000 miejsc.
  solution_steps:
  - 'Zapisz model: a_n — liczba miejsc w n-tym rzędzie, a_1 = 12, r = 4.'
  - 'Oblicz liczbę miejsc w ostatnim rzędzie: a_{20} = 12 + 19\cdot 4 = 88.'
  - Zauważ, że liczba wszystkich miejsc to suma S_{20}, a nie wyraz a_{20}.
  - Oblicz S_{20} = \frac{12+88}{2}\cdot 20 = 1000.
  - 'Podaj odpowiedź z jednostkami: 88 miejsc i 1000 miejsc.'
  answer:
    kind: MULTIPART
    parts:
    - name: liczba miejsc w ostatnim rzędzie
      answer:
        kind: NUMERIC
        value: 88.0
    - name: liczba wszystkich miejsc na widowni
      answer:
        kind: NUMERIC
        value: 1000.0
  checks:
  - kind: evaluate
    expr: 12 + \left(20-1\right)\cdot 4
    part: liczba miejsc w ostatnim rzędzie
  - kind: evaluate
    expr: \frac{12 + \left(12 + 19\cdot 4\right)}{2}\cdot 20
    part: liczba wszystkich miejsc na widowni
  skills:
