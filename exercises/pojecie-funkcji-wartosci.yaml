  exercise_type: rozstrzyganie, czy przyporządkowanie jest funkcją
  statement: 'W tabeli zapisano przyporządkowanie o dziedzinie D = {1, 2, 3, 4, 5}: argumentowi 1 przypisano
    liczbę 4, argumentowi 2 — liczbę 7, argumentowi 3 — liczbę 4, argumentowi 4 — liczbę 9, a argumentowi
    5 — liczbę 7. Uczeń stwierdził: "To nie jest funkcja, bo liczba 4 pojawia się dwa razy i liczba 7
    pojawia się dwa razy, więc przyporządkowanie nie jest jednoznaczne". Rozstrzygnij, czy tabela określa
    funkcję, wskaż błąd ucznia i podaj zbiór wartości tego przyporządkowania.'
  statement_latex: h\left(1\right)=4,\ h\left(2\right)=7,\ h\left(3\right)=4,\ h\left(4\right)=9,\ h\left(5\right)=7
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: "wartość 4 przypisano dwóm argumentom (1 i 3), a wartość 7 dwóm argumentom (2 i 5), więc jednoznaczność jest złamana i to nie jest funkcja". Wniosek ucznia: to nie jest funkcja.
    NA CZYM POLEGA BŁĄD: jednoznaczność dotyczy wyłącznie kierunku OD ARGUMENTU DO WARTOŚCI — każdy argument ma mieć dokładnie jedną wartość. Nie ma natomiast żadnego zakazu, by dwa różne argumenty miały tę samą wartość (np. funkcja stała f(x) = 7 jest poprawną funkcją).
    POPRAWNE ROZUMOWANIE: sprawdzamy argumenty: 1, 2, 3, 4, 5 — każdy występuje w tabeli dokładnie raz i ma przypisaną dokładnie jedną liczbę. Oba warunki definicji są spełnione, więc tabela określa funkcję o dziedzinie D = {1, 2, 3, 4, 5}.
    Zbiór wartości (liczby z wiersza wartości, bez powtórzeń): ZW = {4, 7, 9}.
    Odpowiedź: tak, to jest funkcja; ZW = {4, 7, 9}.
  solution_steps:
  - 'Rozpoznajemy błąd: uczeń wymaga, by wartości się nie powtarzały — a definicja tego nie wymaga.'
  - 'Sprawdzamy kompletność: każdy z argumentów 1, 2, 3, 4, 5 ma przypisaną wartość.'
  - 'Sprawdzamy jednoznaczność: żaden argument nie występuje dwa razy z różnymi wartościami.'
  - 'Wniosek: tabela określa funkcję.'
  - 'Wypisujemy zbiór wartości bez powtórzeń: ZW=\left\{4,7,9\right\}.'
