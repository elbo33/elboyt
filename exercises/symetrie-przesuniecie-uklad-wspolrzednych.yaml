  exercise_type: obraz okręgu w przesunięciu
  statement: W kartezjańskim układzie współrzędnych (x, y) dany jest okrąg o o równaniu \left(x-4\right)^2+\left(y+1\right)^2=16.
    Okrąg o przesunięto o wektor \vec{u}=\left[-2,\;5\right]. Podaj współrzędne środka otrzymanego okręgu
    o', jego promień oraz równanie okręgu o'.
  statement_latex: \left(x-4\right)^2+\left(y+1\right)^2=16,\qquad \vec{u}=\left[-2,\;5\right],\qquad
    T_{\vec{u}}\left(x,\;y\right)=\left(x-2,\;y+5\right)
  solution: |-
    Z równania (x - 4)^2 + (y + 1)^2 = 16 odczytujemy środek S = (4, -1) (bo (y + 1)^2 = (y - (-1))^2) oraz promień r = \sqrt{16} = 4.
    Przesunięcie o wektor [-2, 5] daje środek S' = (4 + (-2), -1 + 5) = (2, 4).
    Przesunięcie jest izometrią, więc promień się nie zmienia: r = 4.
    Równanie obrazu: (x - 2)^2 + (y - 4)^2 = 16.
  solution_steps:
  - Odczytaj z równania środek S = (4, -1) i promień r = \sqrt{16} = 4.
  - 'Przekształć środek: S'' = (4 - 2, -1 + 5) = (2, 4).'
  - Zauważ, że przesunięcie jest izometrią, więc promień pozostaje równy 4.
  - 'Zapisz równanie obrazu: (x - 2)^2 + (y - 4)^2 = 16.'
  answer:
    kind: MULTIPART
    parts:
    - name: srodek obrazu
      answer:
        kind: TUPLE
        items:
        - '2'
        - '4'
    - name: promien
      answer:
        kind: NUMERIC
        value: 4.0
    - name: rownanie obrazu
      answer:
        kind: SYMBOLIC
        latex: \left(x-2\right)^2+\left(y-4\right)^2=16
  checks:
  - kind: evaluate
