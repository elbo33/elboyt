- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: rachunek kątów
  statement: 'W czworokącie wypukłym ABCD miary trzech kątów wewnętrznych są równe: |∡DAB| = 95°, |∡ABC|
    = 118°, |∡BCD| = 63°. Oblicz miarę kąta ∡CDA. Zapisz obliczenia.'
  statement_latex: \left|\measuredangle CDA\right| = 360^\circ - 95^\circ - 118^\circ - 63^\circ
  solution: |-
    Suma miar kątów wewnętrznych dowolnego czworokąta wynosi 360° (przekątna dzieli czworokąt na dwa trójkąty, a w każdym suma kątów to 180°).
    Zatem |∡CDA| = 360° − (95° + 118° + 63°) = 360° − 276° = 84°.
    Kontrola: 95° + 118° + 63° + 84° = 360°. ✓
    Odpowiedź: |∡CDA| = 84°.
  solution_steps:
  - 'Zapisz zależność: suma kątów czworokąta wynosi 360°.'
  - 'Dodaj dane kąty: 95° + 118° + 63° = 276°.'
  - 'Odejmij od 360°: 360° − 276° = 84°.'
  - Sprawdź, że suma czterech kątów daje 360°.
  answer:
    kind: NUMERIC
    value: 84.0
  checks:
  - kind: evaluate
    expr: 360 - 95 - 118 - 63
  skills:
  - suma kątów czworokąta
  - obliczanie brakującego kąta
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 84.0 vs 84.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: kąty równoległoboku
  statement: 'W równoległoboku ABCD kąt przy wierzchołku B ma miarę |∡ABC| = 47°. Oblicz miary pozostałych
    trzech kątów wewnętrznych tego równoległoboku: ∡BCD, ∡CDA oraz ∡DAB.'
  statement_latex: \left|\measuredangle CDA\right| = 47^\circ,\qquad \left|\measuredangle BCD\right| =
    180^\circ - 47^\circ
  solution: |-
    W równoległoboku kąty przeciwległe są równe, a kąty leżące przy tym samym boku sumują się do 180°.
    Kąt ∡CDA jest przeciwległy do ∡ABC, więc |∡CDA| = 47°.
    Kąty ∡ABC i ∡BCD leżą przy boku BC, więc |∡BCD| = 180° − 47° = 133°.
    Kąt ∡DAB jest przeciwległy do ∡BCD, więc |∡DAB| = 133°.
    Kontrola: 47° + 133° + 47° + 133° = 360°. ✓
  solution_steps:
  - 'Skorzystaj z równości kątów przeciwległych: |∡CDA| = |∡ABC| = 47°.'
  - 'Skorzystaj z zależności dla kątów przy jednym boku: |∡BCD| = 180° − 47° = 133°.'
  - 'Kąt przeciwległy do ∡BCD: |∡DAB| = 133°.'
  - 'Sprawdź sumę: 47° + 133° + 47° + 133° = 360°.'
  answer:
    kind: MULTIPART
    parts:
