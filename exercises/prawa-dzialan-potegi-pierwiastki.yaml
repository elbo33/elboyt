    Powierzchnia boczna składa się z czterech jednakowych prostokątów o wymiarach \( x \) i \( h \):
    \( P = 4\cdot x\cdot h = 4\cdot x\cdot\frac{32}{x^{2}} = \frac{128}{x} \).
    Dziedzina: \( x \) jest długością krawędzi, więc \( x > 0 \), czyli \( D = \left(0,\ +\infty\right) \) (dla każdego takiego \( x \) wysokość \( h = \frac{32}{x^{2}} \) jest dodatnia, więc prostopadłościan istnieje).
    b) Dla \( x = 2\sqrt{2} \):
    \( P = \frac{128}{2\sqrt{2}} = \frac{64}{\sqrt{2}} = \frac{64\sqrt{2}}{2} = 32\sqrt{2} \) cm\(^2\).
    (Sprawdzenie: \( h = \frac{32}{\left(2\sqrt{2}\right)^{2}} = \frac{32}{8} = 4 \) cm, więc \( P = 4\cdot 2\sqrt{2}\cdot 4 = 32\sqrt{2} \)).
