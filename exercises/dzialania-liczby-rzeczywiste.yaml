  exercise_type: obliczanie logarytmu z definicji
  statement: Korzystając z definicji logarytmu, oblicz \log_{2}\left(\frac{1}{16}\right).
  statement_latex: \log_{2}\left(\frac{1}{16}\right)
  solution: |-
    Sprawdzamy założenia: podstawa a = 2 > 0 i a \neq 1, liczba logarytmowana b = \frac{1}{16} > 0, więc logarytm istnieje.
    Zapisujemy liczbę logarytmowaną jako potęgę podstawy: \frac{1}{16} = \frac{1}{2^{4}} = 2^{-4}.
    Z własności \log_{a}a^{k} = k otrzymujemy \log_{2}\left(2^{-4}\right) = -4.
    Odpowiedź: -4.
  solution_steps:
  - 'Sprawdź założenia: 2 > 0, 2 ≠ 1, 1/16 > 0.'
  - 'Zapisz 1/16 jako potęgę dwójki: 1/16 = 2⁻⁴.'
  - 'Zastosuj log_a a^k = k: log₂ 2⁻⁴ = −4.'
  answer:
    kind: NUMERIC
    value: -4.0
  checks:
  - kind: evaluate
    expr: \log_{2}\left(\frac{1}{16}\right)
  skills:
