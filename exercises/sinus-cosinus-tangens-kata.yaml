  statement_latex: W = 2\cdot\sin 120^{\circ} + 2\cdot\cos 120^{\circ}
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń przyjął, że dla kąta rozwartego zmieniają znak wszystkie funkcje, więc \sin 120^{\circ}=-\frac{\sqrt{3}}{2}; stąd W = 2\cdot\left(-\frac{\sqrt{3}}{2}\right)+2\cdot\left(-\frac{1}{2}\right)=-\sqrt{3}-1 — to jest odpowiedź błędna.
    GDZIE JEST BŁĄD: punkt P=(x,y) leżący na ramieniu kąta \alpha\in\left(0^{\circ},180^{\circ}\right) ma zawsze y>0, a r=|OP|>0, więc \sin\alpha=\frac{y}{r}>0. Dla kąta rozwartego ujemna jest tylko pierwsza współrzędna x, więc znak zmieniają wyłącznie cosinus i tangens.
    POPRAWNIE: \sin 120^{\circ}=\sin\left(180^{\circ}-60^{\circ}\right)=\sin 60^{\circ}=\frac{\sqrt{3}}{2}, natomiast \cos 120^{\circ}=-\cos 60^{\circ}=-\frac{1}{2}.
    Zatem W = 2\cdot\frac{\sqrt{3}}{2}+2\cdot\left(-\frac{1}{2}\right)=\sqrt{3}-1.
  solution_steps:
  - 'Odtwórz błędne rozumowanie: uczeń przyjął \sin 120^{\circ}=-\frac{\sqrt{3}}{2} i otrzymał W=-\sqrt{3}-1.'
  - 'Wskaż błąd: dla \alpha\in\left(0^{\circ},180^{\circ}\right) jest y>0 i r>0, więc \sin\alpha=\frac{y}{r}>0;
    znak zmieniają tylko cos i tg.'
  - 'Zastosuj poprawne wzory redukcyjne: \sin 120^{\circ}=\sin 60^{\circ}=\frac{\sqrt{3}}{2}, \cos 120^{\circ}=-\cos
