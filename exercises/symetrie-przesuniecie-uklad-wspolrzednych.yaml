  exercise_type: złożenie przesunięcia i symetrii osiowej dla wielokąta
  statement: |-
    Przesunięcie T przeprowadza punkt P=\left(4,\ -2\right) na punkt P'=\left(-1,\ 3\right). W kartezjańskim układzie współrzędnych (x,\ y) dany jest trójkąt ABC o wierzchołkach A=\left(-3,\ 1\right), B=\left(2,\ 1\right), C=\left(-3,\ 5\right). Trójkąt ABC przekształcono najpierw w przesunięciu T, a otrzymany trójkąt A'B'C' odbito symetrycznie względem osi Ox, otrzymując trójkąt A''B''C''.
    a) Wyznacz współrzędne wektora przesunięcia T.
    b) Wyznacz współrzędne wierzchołków A'', B'', C''.
    c) Oblicz pole trójkąta A''B''C''.
  statement_latex: \vec{u}=\left[x_{P'}-x_{P},\ y_{P'}-y_{P}\right]
  solution: |-
    a) Współrzędne wektora liczymy jako „koniec minus początek”:
    \vec{u}=\vec{PP'}=\left[-1-4,\ 3-\left(-2\right)\right]=\left[-5,\ 5\right].

    b) Najpierw przesunięcie o \left[-5,\ 5\right] (do każdej pierwszej współrzędnej dodajemy -5, do drugiej 5):
    A'=\left(-3-5,\ 1+5\right)=\left(-8,\ 6\right),\quad B'=\left(2-5,\ 1+5\right)=\left(-3,\ 6\right),\quad C'=\left(-3-5,\ 5+5\right)=\left(-8,\ 10\right).
    Następnie symetria względem osi Ox (zmiana znaku drugiej współrzędnej):
    A''=\left(-8,\ -6\right),\quad B''=\left(-3,\ -6\right),\quad C''=\left(-8,\ -10\right).

    c) Bok A''B'' jest poziomy: \left|A''B''\right|=\left|-3-\left(-8\right)\right|=5. Bok A''C'' jest pionowy: \left|A''C''\right|=\left|-10-\left(-6\right)\right|=4. Kąt przy wierzchołku A'' jest prosty, więc
    P=\frac{1}{2}\cdot 5\cdot 4=10.
    Kontrola: trójkąt ABC ma przyprostokątne 5 i 4, więc jego pole też wynosi 10 — oba przekształcenia są izometriami.
  solution_steps:
  - 'Oblicz wektor przesunięcia: \vec{u}=\vec{PP''}=\left[-1-4,\ 3-\left(-2\right)\right]=\left[-5,\ 5\right].'
  - 'Zastosuj przesunięcie do każdego wierzchołka: A''=\left(-8,\ 6\right), B''=\left(-3,\ 6\right), C''=\left(-8,\
    10\right).'
  - 'Zastosuj symetrię względem osi Ox do punktów A'', B'', C'': zmień znak drugiej współrzędnej.'
  - 'Zapisz wierzchołki obrazu: A''''=\left(-8,\ -6\right), B''''=\left(-3,\ -6\right), C''''=\left(-8,\
    -10\right).'
  - 'Wyznacz długości przyprostokątnych: \left|A''''B''''\right|=5, \left|A''''C''''\right|=4.'
  - 'Oblicz pole: P=\frac{1}{2}\cdot 5\cdot 4=10.'
  answer:
