- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: wyłączanie wspólnego czynnika liczbowego
  statement: Wyłącz przed nawias największy wspólny czynnik wyrażenia 8a + 12.
  statement_latex: 8\cdot a + 12
  solution: 'Suma ma dwa wyrazy: 8a oraz 12. Litera a występuje tylko w pierwszym wyrazie, więc nie można
    jej wyłączyć. Zostaje część liczbowa: NWD(8, 12) = 4. Dzielimy każdy wyraz przez 4: 8a : 4 = 2a oraz
    12 : 4 = 3. Zatem 8a + 12 = 4\left(2a + 3\right). Sprawdzenie: 4·2a + 4·3 = 8a + 12. ✓'
  solution_steps:
  - 'Wypisz wyrazy sumy: 8a oraz 12.'
  - 'Sprawdź litery: a nie występuje w wyrazie 12, więc litery nie wyłączamy.'
  - Wyznacz NWD(8, 12) = 4.
  - 'Podziel wyrazy przez 4: 8a : 4 = 2a, 12 : 4 = 3.'
  - 'Zapisz iloczyn: 8a + 12 = 4(2a + 3).'
  - 'Sprawdź przez wymnożenie: 4·2a + 4·3 = 8a + 12.'
  answer:
    kind: SYMBOLIC
    latex: 4\left(2\cdot a + 3\right)
  checks:
  - kind: simplify
    expr: 8\cdot a + 12
    var: a
  skills:
  - wyznaczanie NWD współczynników
  - wyłączanie jednomianu przed nawias
  - sprawdzanie rozkładu przez wymnożenie
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''4\\left(2\\cdot a + 3\\right)'' vs ''8*a + 12'''
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: wyłączanie potęgi zmiennej
  statement: Zapisz w postaci iloczynu wyrażenie x^7 + x^4, wyłączając przed nawias zmienną x w najniższej
    występującej potędze.
  statement_latex: x^{7} + x^{4}
  solution: 'Wykładniki zmiennej x to 7 i 4, najmniejszy z nich to 4, więc wyłączamy x^{4}. Dzielimy wyrazy
    (wykładniki odejmujemy): x^{7} : x^{4} = x^{3}, x^{4} : x^{4} = 1. Zatem x^{7} + x^{4} = x^{4}\left(x^{3}
    + 1\right). Sprawdzenie: x^{4}·x^{3} + x^{4}·1 = x^{7} + x^{4}. ✓'
  solution_steps:
  - 'Odczytaj wykładniki zmiennej x: 7 oraz 4.'
  - 'Wybierz najmniejszy wykładnik: k = 4, wyłączasz x^4.'
  - 'Podziel wyrazy, odejmując wykładniki: x^7 : x^4 = x^3, x^4 : x^4 = 1.'
  - 'Zapisz wynik: x^7 + x^4 = x^4(x^3 + 1).'
  - Sprawdź przez wymnożenie.
  answer:
    kind: SYMBOLIC
    latex: x^{4}\left(x^{3} + 1\right)
  checks:
  - kind: simplify
    expr: x^{7} + x^{4}
  skills:
  - rozpoznanie najniższego wykładnika
  - wyłączanie potęgi zmiennej przed nawias
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''x^{4}\\left(x^{3} + 1\\right)'' vs ''x**7 + x**4'''
