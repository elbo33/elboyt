  statement: Oblicz bez użycia kalkulatora wartość wyrażenia 53\cdot 17 + 53\cdot 83.
  statement_latex: 53\cdot 17 + 53\cdot 83
  solution: 'W obu wyrazach powtarza się czynnik 53, więc wyłączamy go przed nawias: 53·17 + 53·83 = 53\left(17
    + 83\right) = 53\cdot 100 = 5300.'
  solution_steps:
