- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie wyrazu ciągu ze wzoru a_n = a_1 + (n-1)r
  statement: Ciąg arytmetyczny (a_n) jest określony dla każdej liczby naturalnej n ≥ 1. W tym ciągu pierwszy
    wyraz jest równy a_1 = 7, a różnica jest równa r = -4. Oblicz dziesiąty wyraz tego ciągu. Zapisz obliczenia.
  statement_latex: a_{10} = 7 + \left(10 - 1\right)\cdot\left(-4\right)
  solution: |-
    Korzystam ze wzoru na n-ty wyraz ciągu arytmetycznego: a_n = a_1 + (n-1)\cdot r.
    Dla n = 10 wykonuję 10 - 1 = 9 kroków po r, zatem
    a_{10} = 7 + 9\cdot(-4) = 7 - 36 = -29.
    Odpowiedź: a_{10} = -29.
  solution_steps:
  - Zapisuję wzór a_n = a_1 + (n-1)\cdot r.
  - 'Podstawiam a_1 = 7, r = -4, n = 10: a_{10} = 7 + 9\cdot(-4).'
  - 'Obliczam: 7 - 36 = -29.'
  answer:
    kind: NUMERIC
    value: -29.0
    latex: '-29'
  checks:
  - kind: evaluate
    expr: 7 + \left(10 - 1\right)\cdot\left(-4\right)
  skills:
