    rozstrzygnij, czy DE ∥ BC (odpowiedź TAK/NIE), oraz podaj, jaką długość musiałby mieć odcinek EC,
    aby DE było równoległe do BC.'
  statement_latex: \frac{|AD|}{|DB|}=\frac{4}{5}=0{,}8,\qquad \frac{|AE|}{|EC|}=\frac{6}{8}=0{,}75
  solution: |-
    Rozumowanie ucznia (błędne). Uczeń przyjął równoległość tylko dlatego, że odcinki „wyglądają na równoległe”, i z twierdzenia Talesa policzył |EC| = 7,5, a rozbieżność z daną |EC| = 8 uznał za błąd w zadaniu.
    Gdzie tkwi błąd. Równoległość jest ZAŁOŻENIEM twierdzenia Talesa — musi być dana w treści albo wcześniej udowodniona. Nie wolno jej zakładać z wyglądu rysunku. Tutaj mamy komplet czterech długości, więc równoległość można sprawdzić twierdzeniem odwrotnym.
    Poprawne rozumowanie. Punkty D i E leżą na bokach AB i AC kąta BAC, po tej samej stronie wierzchołka A. Liczymy stosunki:
    \frac{|AD|}{|DB|}=\frac{4}{5}=0{,}8,\qquad \frac{|AE|}{|EC|}=\frac{6}{8}=0{,}75.
    Stosunki są różne, więc na mocy twierdzenia odwrotnego do twierdzenia Talesa odcinki DE i BC NIE są równoległe. Zadanie nie zawiera błędu — błędne było założenie ucznia.
    Aby DE ∥ BC, musiałoby zachodzić \frac{4}{5}=\frac{6}{|EC|}, czyli 4\cdot|EC| = 30, |EC| = 7{,}5.
    Odpowiedź: DE nie jest równoległe do BC; równoległość zachodziłaby przy |EC| = 7,5.
  solution_steps:
