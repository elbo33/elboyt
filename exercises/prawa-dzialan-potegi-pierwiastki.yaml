  statement_latex: x^{2}\cdot h = 32,\qquad P\left(x\right) = 4\cdot x\cdot h = \frac{128}{x},\qquad P\left(2\sqrt{2}\right)
    = \frac{128}{2\sqrt{2}}
  solution: |-
    Oznaczmy przez \( x \) (w centymetrach) długość krawędzi podstawy, a przez \( h \) wysokość prostopadłościanu; oczywiście \( x > 0 \) i \( h > 0 \).
