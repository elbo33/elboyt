- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: ciąg pól powierzchni prostopadłościanu; wzór z zakresem, największy wyraz, wyraz o danej
    wartości
  statement: |-
    Suma długości wszystkich krawędzi prostopadłościanu o podstawie kwadratowej jest równa 48. Długość krawędzi podstawy tego prostopadłościanu jest liczbą naturalną dodatnią n, a pole jego powierzchni całkowitej oznaczamy przez S_n.
    a) Wyznacz wzór ogólny ciągu (S_n) oraz zbiór wszystkich indeksów n, dla których taki prostopadłościan istnieje.
    b) Oblicz największy wyraz ciągu (S_n) i podaj jego indeks.
    c) Rozstrzygnij, czy liczba 90 jest wyrazem ciągu (S_n), i podaj wszystkie indeksy, dla których wyraz jest równy 90.
  statement_latex: 8 \cdot n + 4 \cdot h = 48,\qquad S_n = 2 \cdot n^2 + 4 \cdot n \cdot h
  solution: |-
    Oznaczmy przez n krawędź podstawy, a przez h wysokość prostopadłościanu.
    Krok 1. Prostopadłościan o podstawie kwadratowej ma 8 krawędzi podstaw o długości n i 4 krawędzie boczne o długości h, więc 8 \cdot n + 4 \cdot h = 48, stąd 2n + h = 12, czyli h = 12 - 2n.
    Krok 2. Wysokość musi być dodatnia: 12 - 2n > 0, czyli n < 6. Ponieważ n jest liczbą naturalną dodatnią, mamy n \in \{1, 2, 3, 4, 5\}.
    Krok 3. Pole powierzchni całkowitej: S_n = 2 \cdot n^2 + 4 \cdot n \cdot h = 2n^2 + 4n \cdot \left(12 - 2n\right) = 2n^2 + 48n - 8n^2 = -6n^2 + 48n.
    Krok 4. Funkcja f(x) = -6x^2 + 48x ma ramiona skierowane w dół, a jej wierzchołek leży dla x = \frac{-48}{2 \cdot \left(-6\right)} = 4. Liczba 4 jest liczbą naturalną i należy do zbioru \{1, \ldots, 5\}, więc największym wyrazem ciągu jest
    S_4 = -6 \cdot 4^2 + 48 \cdot 4 = -96 + 192 = 96.
    (Wtedy podstawa ma bok 4, a wysokość h = 12 - 8 = 4 — jest to sześcian o polu 6 \cdot 16 = 96. ✓)
    Krok 5. Rozwiązujemy równanie -6n^2 + 48n = 90, czyli po podzieleniu przez -6: n^2 - 8n + 15 = 0. \Delta = 64 - 60 = 4, \sqrt{\Delta} = 2, więc n = 3 albo n = 5. Obie liczby należą do zbioru \{1, 2, 3, 4, 5\}, zatem liczba 90 jest wyrazem ciągu, i to dla dwóch indeksów: S_3 = 90 oraz S_5 = 90.
    Odpowiedź: S_n = -6n^2 + 48n dla n \in \{1, 2, 3, 4, 5\}; największy wyraz to S_4 = 96; liczba 90 jest wyrazem ciągu dla n = 3 i n = 5.
  solution_steps:
  - 'Oznacz krawędź podstawy przez n, wysokość przez h i zapisz sumę krawędzi: 8n + 4h = 48.'
  - Wyznacz h = 12 - 2n.
  - Z warunku h > 0 otrzymaj n < 6, czyli n \in \{1, 2, 3, 4, 5\}.
  - 'Zapisz pole całkowite: S_n = 2n^2 + 4n(12 - 2n) = -6n^2 + 48n.'
  - 'Znajdź wierzchołek: n = \frac{48}{2 \cdot 6} = 4 i sprawdź, że 4 należy do zakresu indeksów.'
  - Oblicz S_4 = -6 \cdot 16 + 192 = 96.
  - Rozwiąż -6n^2 + 48n = 90, czyli n^2 - 8n + 15 = 0, otrzymując n = 3 i n = 5 (oba w zakresie).
  - Sformułuj odpowiedzi do punktów a), b), c).
