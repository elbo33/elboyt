- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: Zadanie praktyczne – model dwóch prostych równoległych przeciętych siecznymi
  statement: Na poziomym, płaskim placu stoi pionowa latarnia; żarówka umieszczona jest na jej szczycie.
    W odległości 6 m od podstawy latarni, na tym samym placu, stoi pionowy słupek o wysokości 1,8 m. Światło
    żarówki sprawia, że słupek rzuca cień o długości 3 m, leżący na prostej przechodzącej przez podstawę
    latarni i podstawę słupka, po przeciwnej stronie słupka niż latarnia. Oblicz wysokość latarni.
  statement_latex: \frac{1{,}8}{h}=\frac{3}{6+3}
  solution: |-
    Wprowadzamy model. Niech O będzie podstawą latarni, Ż — szczytem latarni (żarówką), S — podstawą słupka, N — szczytem słupka, a T — końcem cienia. Wszystkie punkty O, S, T leżą na jednej prostej (na ziemi), przy czym |OS| = 6 m oraz |ST| = 3 m, więc
    |OT| = 6 + 3 = 9 m.
    Słupek SN i latarnia OŻ są prostopadłe do ziemi, więc proste SN i OŻ są równoległe. Ramiona kąta o wierzchołku T (jedno ramię to prosta ziemi TO, drugie to promień światła TŻ przechodzący przez N) zostały przecięte dwiema prostymi równoległymi: SN i OŻ.
    Z twierdzenia Talesa (w wersji w kącie o wierzchołku T):
    \frac{|SN|}{|OŻ|}=\frac{|TS|}{|TO|}.
    Oznaczmy wysokość latarni |OŻ| = h, h > 0. Wtedy
    \frac{1{,}8}{h}=\frac{3}{9}=\frac{1}{3}.
    Mnożąc na krzyż: h = 3\cdot 1{,}8 = 5{,}4.
    Sprawdzenie sensowności: latarnia jest trzy razy dalej od końca cienia niż słupek, więc musi być trzy razy wyższa — 5,4 m > 1,8 m ✓.
    Odpowiedź: latarnia ma wysokość 5,4 m.
  solution_steps:
  - 'Nazwij punkty: O — podstawa latarni, S — podstawa słupka, T — koniec cienia; zauważ, że O, S, T leżą
    na jednej prostej.'
  - 'Złóż odległość: |TO| = |TS| + |SO| = 3 + 6 = 9 m.'
  - Zauważ, że słupek i latarnia są pionowe, więc odpowiednie odcinki leżą na prostych równoległych przecinających
    ramiona kąta o wierzchołku T.
  - Zapisz proporcję Talesa \frac{1{,}8}{h}=\frac{3}{9}.
  - 'Rozwiąż: h = 3\cdot 1{,}8 = 5{,}4 m.'
