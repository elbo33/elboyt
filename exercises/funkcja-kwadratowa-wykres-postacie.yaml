  statement: W trójkącie prostokątnym suma długości jednej przyprostokątnej i podwojonej długości drugiej
    przyprostokątnej jest równa 20 cm. Oblicz największe możliwe pole takiego trójkąta. Zapisz obliczenia.
  statement_latex: P\left(x\right)=\frac{1}{2}\cdot x\cdot\frac{20-x}{2}=\frac{20x-x^{2}}{4}
  solution: |-
    Oznaczmy przez x (w centymetrach) długość tej przyprostokątnej, która występuje w warunku pojedynczo, a przez y długość drugiej przyprostokątnej. Wtedy
    x + 2y = 20, czyli y = \frac{20-x}{2}.
    Długości boków są dodatnie: x > 0 oraz \frac{20-x}{2} > 0, czyli x < 20. Zatem x ∈ (0, 20).
    Pole trójkąta prostokątnego to połowa iloczynu przyprostokątnych:
    P(x) = \frac{1}{2}\cdot x\cdot\frac{20-x}{2} = \frac{20x-x^{2}}{4} = -\frac{1}{4}x^{2} + 5x.
    Jest to funkcja kwadratowa o współczynniku a = -\frac{1}{4} < 0, więc największą wartość przyjmuje w wierzchołku:
    p = \frac{-5}{2\cdot\left(-\frac{1}{4}\right)} = 10, a 10 ∈ (0, 20).
    Wtedy y = \frac{20-10}{2} = 5 oraz
    P(10) = \frac{20\cdot 10 - 10^{2}}{4} = \frac{100}{4} = 25.
    Największe możliwe pole tego trójkąta jest równe 25 cm² (przyprostokątne mają wtedy długości 10 cm i 5 cm).
  solution_steps:
  - 'Wprowadzamy zmienne: x i y — długości przyprostokątnych, przy czym x + 2y = 20.'
  - 'Wyznaczamy y = (20 - x)/2 i ustalamy dziedzinę: x ∈ (0, 20).'
  - 'Układamy wzór na pole: P(x) = (1/2)·x·(20-x)/2 = (20x - x²)/4.'
  - 'Zauważamy, że a = -1/4 < 0, więc wartość największa jest w wierzchołku: p = 10 ∈ (0, 20).'
  - Obliczamy P(10) = 100/4 = 25.
  - 'Odpowiedź: największe pole wynosi 25 cm².'
