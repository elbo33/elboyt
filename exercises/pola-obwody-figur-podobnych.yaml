- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: stosunek obwodów i pól figur podobnych — metoda parametru t
  statement: Dwa wielokąty są podobne. Obwód pierwszego z nich jest równy 24 cm, a obwód drugiego jest
    równy 60 cm. Suma pól tych wielokątów jest równa 116 cm². Oblicz pole każdego z tych wielokątów. Zapisz
    obliczenia.
  statement_latex: k=\frac{60}{24}=\frac{5}{2},\qquad k^{2}=\frac{25}{4},\qquad 4t+25t=116
  solution: |-
    Obwody figur podobnych są w stosunku równym skali podobieństwa, więc skala podobieństwa drugiego wielokąta do pierwszego wynosi k = \frac{60}{24} = \frac{5}{2}.
    Stosunek pól jest równy kwadratowi skali: k^{2} = \left(\frac{5}{2}\right)^{2} = \frac{25}{4}, czyli pola mają się jak 4 : 25.
    Wprowadzamy parametr t > 0 i zapisujemy pola: P_{1} = 4t (mniejszy wielokąt), P_{2} = 25t (większy wielokąt).
    Z warunku na sumę pól: 4t + 25t = 116, czyli 29t = 116, stąd t = 4.
    Zatem P_{1} = 4 \cdot 4 = 16 cm², P_{2} = 25 \cdot 4 = 100 cm².
    Sprawdzenie: 16 + 100 = 116 oraz \frac{100}{16} = \frac{25}{4} = \left(\frac{5}{2}\right)^{2}. Zgadza się.
    Odpowiedź: pola wynoszą 16 cm² i 100 cm².
  solution_steps:
  - 'Wyznacz skalę ze stosunku obwodów: k = \frac{60}{24} = \frac{5}{2}.'
  - 'Oblicz stosunek pól: k^{2} = \frac{25}{4}, czyli P_{1} : P_{2} = 4 : 25.'
  - Zapisz pola jako 4t i 25t z parametrem t > 0.
  - 'Ułóż równanie 4t + 25t = 116 i rozwiąż: t = 4.'
  - 'Podaj pola: 16 cm² oraz 100 cm²; sprawdź stosunek pól.'
  answer:
    kind: MULTIPART
    parts:
    - name: pole_mniejszego
      answer:
        kind: NUMERIC
        value: 16.0
        latex: 16\ \mathrm{cm}^{2}
    - name: pole_wiekszego
      answer:
        kind: NUMERIC
        value: 100.0
        latex: 100\ \mathrm{cm}^{2}
  checks:
  - kind: evaluate
    expr: 4 \cdot \frac{116}{4 + 25}
    var: t
    part: pole_mniejszego
  - kind: evaluate
    expr: 25 \cdot \frac{116}{4 + 25}
    var: t
    part: pole_wiekszego
  skills:
  - wyznaczanie skali ze stosunku obwodów
  - stosunek pól równy k²
  - układanie i rozwiązywanie równania z parametrem t
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [pole_mniejszego] SymPy solved it fresh: 16.0 vs 16.0 (tol
      1e-09) ; [pole_wiekszego] SymPy solved it fresh: 100.0 vs 100.0 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 5
  exercise_type: trójkąt odcięty prostą równoległą do boku — pole trapezu
  statement: 'W trójkącie ABC punkt D leży na boku CA, a punkt E leży na boku CB, przy czym odcinek DE
    jest równoległy do boku AB oraz |CD| : |DA| = 3 : 2. Pole trapezu ABED jest równe 64 cm². Oblicz pole
    trójkąta CDE oraz pole trójkąta ABC. Zapisz obliczenia.'
  statement_latex: k=\frac{|CD|}{|CA|}=\frac{3}{3+2}=\frac{3}{5},\qquad P_{ABED}=P_{CAB}\cdot\left(1-k^{2}\right)=64
  solution: |-
    Trójkąty CDE i CAB są podobne: kąt przy wierzchołku C jest wspólny, a kąty CDE i CAB są równe jako kąty odpowiadające przy prostych równoległych DE ∥ AB (cecha kk).
    Skala podobieństwa to stosunek CAŁYCH odpowiadających sobie boków, a nie stosunek odcinków na boku CA:
    k = \frac{|CD|}{|CA|} = \frac{3}{3+2} = \frac{3}{5}.
    Stąd \frac{P_{CDE}}{P_{CAB}} = k^{2} = \frac{9}{25}.
    Trapez ABED jest różnicą trójkąta CAB i trójkąta CDE, więc
    P_{ABED} = P_{CAB} - P_{CDE} = P_{CAB}\left(1-\frac{9}{25}\right) = \frac{16}{25}P_{CAB}.
    Z warunku \frac{16}{25}P_{CAB} = 64 otrzymujemy P_{CAB} = 64 \cdot \frac{25}{16} = 100 cm².
    Wtedy P_{CDE} = \frac{9}{25} \cdot 100 = 36 cm².
    Sprawdzenie: 100 - 36 = 64. Zgadza się.
    Odpowiedź: P_{CDE} = 36 cm², P_{ABC} = 100 cm².
  solution_steps:
  - Uzasadnij podobieństwo trójkątów CDE i CAB (kąt wspólny przy C oraz kąty odpowiadające przy DE ∥ AB).
  - 'Wyznacz skalę jako stosunek całych boków: k = \frac{|CD|}{|CA|} = \frac{3}{5}.'
  - 'Zapisz stosunek pól: k^{2} = \frac{9}{25}.'
  - 'Zapisz pole trapezu jako różnicę: P_{ABED} = P_{CAB}\left(1-\frac{9}{25}\right) = \frac{16}{25}P_{CAB}.'
  - Rozwiąż \frac{16}{25}P_{CAB} = 64, otrzymując P_{CAB} = 100 cm².
  - Oblicz P_{CDE} = \frac{9}{25}\cdot 100 = 36 cm² i sprawdź różnicę pól.
  answer:
    kind: MULTIPART
    parts:
    - name: pole_CDE
      answer:
        kind: NUMERIC
        value: 36.0
        latex: 36\ \mathrm{cm}^{2}
    - name: pole_ABC
      answer:
        kind: NUMERIC
        value: 100.0
        latex: 100\ \mathrm{cm}^{2}
  checks:
  - kind: evaluate
    expr: \frac{\left(\frac{3}{5}\right)^{2} \cdot 64}{1 - \left(\frac{3}{5}\right)^{2}}
    part: pole_CDE
  - kind: evaluate
    expr: \frac{64}{1 - \left(\frac{3}{5}\right)^{2}}
    part: pole_ABC
  skills:
  - uzasadnianie podobieństwa (cecha kk)
  - skala jako stosunek całych boków, a nie odcinków na boku
  - pole trapezu jako różnica pól trójkątów podobnych
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [pole_CDE] SymPy solved it fresh: 36.0 vs 36.0 (tol 1e-09)
      ; [pole_ABC] SymPy solved it fresh: 100.0 vs 100.0 (tol 1e-09)'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: ocena rozumowania — pole a skala
  statement: 'Trójkąt T_{2} jest podobny do trójkąta T_{1} w skali k = 4. Pole trójkąta T_{1} jest równe
    12 cm². Uczeń zapisał: „Skala wynosi 4, więc pole trójkąta T_{2} jest równe 4 \cdot 12 = 48 cm²”.
    Wyjaśnij, na czym polega błąd ucznia, i oblicz poprawne pole trójkąta T_{2}.'
  statement_latex: P(T_{2})=k^{2}\cdot P(T_{1})=4^{2}\cdot 12
  solution: |-
    Błędne rozumowanie: uczeń pomnożył pole przez skalę k = 4 i otrzymał P(T_{2}) = 4\cdot 12 = 48 cm².
    Na czym polega błąd: w skali k mnożą się tylko wielkości liniowe — boki, wysokości, przekątne i obwód. Pole jest iloczynem dwóch długości (np. \frac{1}{2}\cdot a\cdot h), więc każda z tych długości mnoży się przez k i pole mnoży się przez k \cdot k = k^{2}.
    Poprawne rozwiązanie: P(T_{2}) = k^{2}\cdot P(T_{1}) = 4^{2}\cdot 12 = 16\cdot 12 = 192 cm².
    Kontrola na przykładzie: jeśli T_{1} ma podstawę 6 i wysokość 4 (pole 12), to T_{2} ma podstawę 24 i wysokość 16, więc jego pole to \frac{1}{2}\cdot 24\cdot 16 = 192 cm². Zgadza się.
    Odpowiedź: 192 cm² (a nie 48 cm²).
  solution_steps:
  - 'Odtwórz błędne rozumowanie: pomnożenie pola przez k daje 4·12 = 48 cm².'
  - 'Wskaż błąd: przez k mnożą się tylko długości i obwód; pole mnoży się przez k².'
  - 'Oblicz poprawnie: P(T₂) = 4²·12 = 192 cm².'
  - Sprawdź na przykładzie konkretnych wymiarów trójkąta.
  answer:
