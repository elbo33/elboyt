  statement: Promień okręgu wpisanego w sześciokąt foremny (apotema tego sześciokąta) ma długość 6. Oblicz
    długość boku sześciokąta, jego obwód oraz jego pole. Wyniki podaj w postaci dokładnej.
  statement_latex: r=6,\qquad r=\frac{a\cdot\sqrt{3}}{2},\qquad L=6\cdot a,\qquad P=\frac{1}{2}\cdot L\cdot
    r
  solution: |-
    W sześciokącie foremnym apotema jest wysokością trójkąta środkowego, który jest równoboczny o boku a, więc
    r = a√3/2 = 6  ⟹  a = 12/√3 = 12√3/3 = 4√3.
    Obwód: L = 6a = 6·4√3 = 24√3.
    Pole (jako suma 6 trójkątów o podstawie a i wysokości r):
    P = ½·L·r = ½·24√3·6 = 72√3.
    Kontrola wzorem P = 3a²√3/2 = 3·48·√3/2 = 72√3. ✓
    Odpowiedź: a = 4√3, L = 24√3, P = 72√3.
  solution_steps:
  - 'Zapisz zależność apotemy i boku: r = a√3/2.'
  - Z równania a√3/2 = 6 wyznacz a = 12/√3 = 4√3.
  - 'Oblicz obwód: L = 6·4√3 = 24√3.'
  - 'Oblicz pole: P = ½·L·r = ½·24√3·6 = 72√3.'
  - Skontroluj wynik wzorem P = 3a²√3/2 = 72√3. ✓
