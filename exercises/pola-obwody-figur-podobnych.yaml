  exercise_type: 'modelowanie: koszt figury podobnej w skali k z ograniczeniem wymiarów'
  statement: |-
    Zakład reklamowy wycina metalowe tabliczki podobne do wzoru, którym jest trójkąt prostokątny o przyprostokątnych długości 6 cm i 8 cm. Tabliczkę wykonuje się w skali podobieństwa k > 0 względem wzoru. Materiał kosztuje 0,50 zł za każdy centymetr kwadratowy pola tabliczki, a oklejenie krawędzi kosztuje 2 zł za każdy centymetr obwodu tabliczki. Gotowa tabliczka musi zmieścić się w prostokątnej ramce o wymiarach 15 cm × 20 cm, przy czym krótsza przyprostokątna tabliczki jest równoległa do boku ramki o długości 15 cm, a dłuższa — do boku o długości 20 cm.
    a) Wyznacz wzór na łączny koszt K wykonania jednej tabliczki jako funkcję skali k oraz podaj dziedzinę tej funkcji wynikającą z warunków zadania.
    b) Oblicz koszt najdroższej tabliczki, jaką można wykonać.
  statement_latex: K\left(k\right)=\frac{1}{2}\cdot 24\cdot k^{2}+2\cdot 24\cdot k=12k^{2}+48k,\qquad
    6k\le 15\ \wedge\ 8k\le 20
  solution: |-
    Wzór jest trójkątem prostokątnym o przyprostokątnych 6 cm i 8 cm, więc jego przeciwprostokątna ma długość \sqrt{6^{2}+8^{2}} = 10 cm.
    Stąd pole wzoru: P = \frac{1}{2}\cdot 6\cdot 8 = 24 cm², a obwód wzoru: Obw = 6+8+10 = 24 cm.
    Tabliczka jest figurą podobną do wzoru w skali k, zatem
    pole tabliczki = k^{2}\cdot 24, obwód tabliczki = k\cdot 24.
    a) Koszt materiału: \frac{1}{2}\cdot 24k^{2} = 12k^{2}, koszt oklejenia krawędzi: 2\cdot 24k = 48k. Łącznie
    K\left(k\right) = 12k^{2}+48k.
    Dziedzina: skala musi być dodatnia, czyli k > 0. Przyprostokątne tabliczki mają długości 6k i 8k, a warunek zmieszczenia w ramce daje
    6k \le 15 oraz 8k \le 20, czyli k \le \frac{15}{6} = \frac{5}{2} oraz k \le \frac{20}{8} = \frac{5}{2}.
    Zatem dziedziną jest przedział \left(0;\ \frac{5}{2}\right\rangle.
    b) Dla k > 0 funkcja K\left(k\right) = 12k^{2}+48k jest rosnąca (ramiona paraboli skierowane w górę, wierzchołek dla k = -2 leży na lewo od dziedziny), więc największy koszt odpowiada największej dopuszczalnej skali k = \frac{5}{2}:
    K\left(\frac{5}{2}\right) = 12\cdot\frac{25}{4} + 48\cdot\frac{5}{2} = 75 + 120 = 195 zł.
    Sprawdzenie: dla k = \frac{5}{2} przyprostokątne mają 15 cm i 20 cm — tabliczka dokładnie wypełnia ramkę; pole wynosi 150 cm² (koszt 75 zł), obwód 60 cm (koszt 120 zł), razem 195 zł.
    Odpowiedź: a) K\left(k\right)=12k^{2}+48k dla k\in\left(0;\ \frac{5}{2}\right\rangle; b) 195 zł.
  solution_steps:
  - 'Oblicz przeciwprostokątną wzoru: \sqrt{6^{2}+8^{2}} = 10 cm.'
  - 'Oblicz pole i obwód wzoru: P = 24 cm², Obw = 24 cm.'
  - 'Zapisz pole i obwód tabliczki w skali k: 24k^{2} oraz 24k.'
