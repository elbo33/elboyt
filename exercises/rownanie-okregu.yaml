    POPRAWNIE: r^2=48, więc r=\sqrt{48}. Wyłączamy przed pierwiastek największy kwadrat będący dzielnikiem 48, czyli 16:
    r=\sqrt{16\cdot 3}=\sqrt{16}\cdot\sqrt{3}=4\sqrt{3}\approx 6{,}93.
    Odpowiedź: r=4\sqrt{3}.
  solution_steps:
