    ucznia, i oblicz poprawny obwód większego wielokąta.'
  statement_latex: k=\sqrt{\frac{75}{27}}=\frac{5}{3},\qquad \mathrm{Obw}'=k\cdot 18
  solution: |-
    Błędne rozumowanie: uczeń przyjął, że obwody są w takim samym stosunku jak pola, i otrzymał \frac{75}{27}\cdot 18 = \frac{25}{9}\cdot 18 = 50 cm.
    Na czym polega błąd: stosunek pól jest równy kwadratowi skali, a nie samej skali. Żeby przejść od pól do wielkości liniowych (boków, obwodów), trzeba wyciągnąć pierwiastek kwadratowy.
    Poprawne rozwiązanie: k^{2} = \frac{75}{27} = \frac{25}{9}, więc k = \sqrt{\frac{25}{9}} = \frac{5}{3}.
    Obwody są w stosunku k, zatem Obw' = \frac{5}{3}\cdot 18 = 30 cm.
    Sprawdzenie: \left(\frac{30}{18}\right)^{2} = \left(\frac{5}{3}\right)^{2} = \frac{25}{9} = \frac{75}{27}. Zgadza się.
