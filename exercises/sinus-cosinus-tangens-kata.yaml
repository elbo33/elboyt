  exercise_type: diagnoza błędu – definicje sin i cos w trójkącie prostokątnym
  statement: W trójkącie prostokątnym ABC kąt prosty jest przy wierzchołku C, |BC| = 6, |AC| = 8, |AB|
    = 10. Kąt przy wierzchołku A oznaczamy przez \alpha. Uczeń zapisał \sin\alpha = \frac{8}{10} oraz
    \cos\alpha = \frac{6}{10}. Wskaż jego błąd i podaj poprawne wartości \sin\alpha, \cos\alpha oraz \operatorname{tg}\alpha.
  statement_latex: '|BC| = 6,\ |AC| = 8,\ |AB| = 10,\qquad \sin\alpha = \frac{|BC|}{|AB|},\ \cos\alpha
    = \frac{|AC|}{|AB|},\ \operatorname{tg}\alpha = \frac{|BC|}{|AC|}'
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń zamienił role przyprostokątnych i przyjął, że w liczniku sinusa stoi bok przyległy do kąta \alpha, czyli AC; otrzymał \sin\alpha=\frac{8}{10}=\frac{4}{5} i \cos\alpha=\frac{6}{10}=\frac{3}{5} — odwrotnie niż być powinno.
    GDZIE JEST BŁĄD: sinus to stosunek boku leżącego naprzeciw kąta do przeciwprostokątnej, a cosinus – boku przyległego do przeciwprostokątnej. W tym trójkącie naprzeciw kąta \alpha (przy wierzchołku A) leży bok BC o długości 6, a bok AC o długości 8 jest bokiem przyległym; przeciwprostokątną jest AB o długości 10.
    Kontrola: dla małego kąta bok naprzeciw jest krótki, więc sinus jest bliski 0, a cosinus bliski 1.
    POPRAWNIE:
    \sin\alpha=\frac{|BC|}{|AB|}=\frac{6}{10}=\frac{3}{5},\qquad \cos\alpha=\frac{|AC|}{|AB|}=\frac{8}{10}=\frac{4}{5},\qquad \operatorname{tg}\alpha=\frac{|BC|}{|AC|}=\frac{6}{8}=\frac{3}{4}.
  solution_steps:
  - 'Odtwórz błąd: uczeń wziął do sinusa bok przyległy, otrzymując \sin\alpha=\frac{4}{5}, \cos\alpha=\frac{3}{5}.'
  - 'Ustal położenie boków względem kąta \alpha przy wierzchołku A: naprzeciw leży BC=6, przyległy jest
    AC=8, przeciwprostokątna AB=10.'
  - 'Zastosuj definicje: \sin\alpha=\frac{6}{10}=\frac{3}{5}, \cos\alpha=\frac{8}{10}=\frac{4}{5}.'
  - Oblicz \operatorname{tg}\alpha=\frac{6}{8}=\frac{3}{4} i sprawdź, że \sin^{2}\alpha+\cos^{2}\alpha=1.
