- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: mnożenie wyrażeń wymiernych
  statement: 'Dla każdej liczby rzeczywistej x różnej od 0 oraz różnej od -3 wykonaj mnożenie i podaj
    wynik w najprostszej postaci: \frac{x^{2}-9}{5\cdot x}\cdot\frac{10}{x+3}.'
  statement_latex: \frac{x^{2}-9}{5\cdot x}\cdot\frac{10}{x+3}
  solution: |-
    1) Rozkładamy licznik pierwszego ułamka: x^{2}-9 = \left(x-3\right)\cdot\left(x+3\right).
    2) Mnożymy licznik przez licznik i mianownik przez mianownik, nie wymnażając nawiasów:
    \frac{\left(x-3\right)\cdot\left(x+3\right)\cdot 10}{5\cdot x\cdot\left(x+3\right)}.
    3) Skracamy czynnik \left(x+3\right) oraz liczbę 5:
    = \frac{2\cdot\left(x-3\right)}{x}.
    Odpowiedź: \frac{2\cdot\left(x-3\right)}{x}, czyli \frac{2\cdot x-6}{x}.
  solution_steps:
  - Rozłóż x^{2}-9 = \left(x-3\right)\cdot\left(x+3\right).
  - 'Zapisz jeden ułamek: iloczyn liczników przez iloczyn mianowników.'
  - Skróć \left(x+3\right) oraz czynnik liczbowy 5 z 10.
  - 'Zapisz wynik: \frac{2\cdot\left(x-3\right)}{x}.'
  answer:
    kind: SYMBOLIC
    latex: \frac{2\cdot\left(x-3\right)}{x}
  checks:
  - kind: simplify
    expr: \frac{x^{2}-9}{5\cdot x}\cdot\frac{10}{x+3}
  skills:
  - mnożenie wyrażeń wymiernych
  - różnica kwadratów
  - skracanie czynników
