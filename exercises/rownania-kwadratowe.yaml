- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: wyróżnik i liczba rozwiązań
  statement: Dane jest równanie \(3x^{2}-4x+5=0\). Oblicz wyróżnik \(\Delta\) tego równania oraz podaj
    liczbę jego rozwiązań rzeczywistych.
  statement_latex: 3x^{2}-4x+5=0,\qquad \Delta=b^{2}-4\cdot a\cdot c
  solution: |-
    Odczytujemy współczynniki: \(a=3\), \(b=-4\), \(c=5\).
    Podstawiamy do wzoru na wyróżnik (współczynniki wstawiamy w nawiasach):
    \(\Delta=\left(-4\right)^{2}-4\cdot 3\cdot 5=16-60=-44\).
    Otrzymaliśmy \(\Delta<0\), więc równanie nie ma rozwiązań rzeczywistych — liczba rozwiązań jest równa \(0\).
    Geometrycznie: parabola o równaniu \(y=3x^{2}-4x+5\) leży w całości nad osią \(OX\).
  solution_steps:
  - Odczytaj a = 3, b = −4, c = 5.
  - Oblicz Δ = (−4)² − 4·3·5 = 16 − 60 = −44.
  - Stwierdź, że Δ < 0.
  - 'Wywnioskuj: równanie nie ma rozwiązań rzeczywistych (0 rozwiązań).'
  answer:
    kind: MULTIPART
    parts:
    - name: delta
      answer:
        kind: NUMERIC
        value: -44.0
    - name: liczba rozwiazan
      answer:
        kind: NUMERIC
        value: 0.0
