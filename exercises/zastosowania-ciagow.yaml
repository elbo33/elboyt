  exercise_type: 'model arytmetyczny: wzór na sumę i sprawdzenie ograniczeń'
  statement: |-
    W amfiteatrze rzędy widowni ustawiono tak, że każdy następny rząd ma o 6 miejsc więcej niż rząd poprzedni. W piątym rzędzie jest 48 miejsc. Przepisy przeciwpożarowe wymagają, aby żaden rząd nie liczył więcej niż 90 miejsc, a cała widownia nie liczyła więcej niż 900 miejsc.
