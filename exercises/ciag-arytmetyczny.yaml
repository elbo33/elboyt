- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: wyznaczanie a_1 i r z dwóch wyrazów, następnie suma
  statement: Ciąg arytmetyczny (a_n) jest określony dla każdej liczby naturalnej n ≥ 1. W tym ciągu a_4
    = -3 oraz a_{11} = 18. Wyznacz różnicę r tego ciągu, jego pierwszy wyraz a_1 oraz oblicz sumę dwudziestu
    początkowych kolejnych wyrazów tego ciągu. Zapisz obliczenia.
  statement_latex: a_{11} = a_4 + \left(11 - 4\right)\cdot r,\qquad S_{20} = \frac{2\cdot a_1 + 19\cdot
    r}{2}\cdot 20
  solution: |-
    1) Korzystam ze wzoru a_n = a_k + (n-k)r: a_{11} = a_4 + 7r, czyli 18 = -3 + 7r.
    2) Stąd 7r = 21, więc r = \frac{18 - \left(-3\right)}{11 - 4} = 3.
    3) Pierwszy wyraz: a_4 = a_1 + 3r, czyli -3 = a_1 + 9, zatem a_1 = -12.
    4) Suma: S_{20} = \frac{2\cdot(-12) + 19\cdot 3}{2}\cdot 20 = \frac{-24 + 57}{2}\cdot 20 = \frac{33}{2}\cdot 20 = 330.
    Kontrola: a_{20} = -12 + 19\cdot 3 = 45, więc S_{20} = \frac{-12 + 45}{2}\cdot 20 = \frac{33}{2}\cdot 20 = 330. ✓
    Odpowiedź: r = 3, a_1 = -12, S_{20} = 330.
  solution_steps:
  - Zapisuję zależność a_{11} = a_4 + 7r, czyli 18 = -3 + 7r.
  - Obliczam r = \frac{21}{7} = 3.
  - Z a_4 = a_1 + 3r wyznaczam a_1 = -3 - 9 = -12.
  - Obliczam S_{20} = \frac{2\cdot(-12) + 19\cdot 3}{2}\cdot 20 = 330.
  - Sprawdzam wynik, licząc a_{20} = 45 i S_{20} = \frac{-12 + 45}{2}\cdot 20 = 330.
  answer:
    kind: MULTIPART
    parts:
    - name: r
      answer:
        kind: NUMERIC
        value: 3.0
        latex: '3'
    - name: a_1
      answer:
        kind: NUMERIC
        value: -12.0
        latex: '-12'
    - name: S_20
      answer:
        kind: NUMERIC
        value: 330.0
        latex: '330'
  checks:
  - kind: evaluate
    expr: \frac{18 - \left(-3\right)}{11 - 4}
    part: r
  - kind: evaluate
    expr: -3 - 3\cdot 3
    part: a_1
  - kind: evaluate
    expr: \frac{2\cdot\left(-12\right) + 19\cdot 3}{2}\cdot 20
    part: S_20
  skills:
  - układ równań na a_1 i r
  - wzór a_n = a_k + (n-k)r
  - suma n początkowych wyrazów
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [r] SymPy solved it fresh: 3.0 vs 3.0 (tol 1e-09) ; [a_1] SymPy
      solved it fresh: -12.0 vs -12.0 (tol 1e-09) ; [S_20] SymPy solved it fresh: 330.0 vs 330.0 (tol
      1e-09)'
