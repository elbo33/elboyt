    Uczeń zapisał, że licznik ma być równy zeru, i podał dwa rozwiązania: x=4 oraz x=-1. Wyjaśnij, na
    czym polega jego błąd, i podaj poprawny zbiór rozwiązań.'
  statement_latex: \frac{\left(x-4\right)\cdot\left(x+1\right)}{\left(x+1\right)\cdot\left(x+3\right)}=0
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA:
    „Ułamek jest równy zeru, gdy licznik jest równy zeru”, więc \left(x-4\right)\cdot\left(x+1\right)=0, czyli x=4 lub x=-1 – i uczeń podaje oba te wyniki.
    DLACZEGO TO JEST BŁĄD:
    Warunek zerowania się ułamka brzmi: \frac{a}{b}=0 wtedy i tylko wtedy, gdy a=0 ORAZ b\neq 0. Mianownik ma prawo weta. Tutaj dziedzina: \left(x+1\right)\cdot\left(x+3\right)\neq 0, czyli x\neq -1 i x\neq -3, D=\mathbb{R}\setminus\{-3,-1\}. Liczba -1 zeruje także mianownik, więc nie należy do dziedziny i nie może być rozwiązaniem (dla x=-1 wyrażenie po lewej stronie nie ma sensu liczbowego).
