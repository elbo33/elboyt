- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: odtworzenie wykresu z warunków i odczyt własności
  statement: |-
    Funkcja f jest określona w przedziale ⟨-4, 6⟩, a jej wykresem jest łamana o kolejnych wierzchołkach A(-4, 6), B(-1, -3), C(3, -3), D(6, m); oba końce wykresu (punkty A i D) należą do wykresu. Wiadomo, że największa wartość funkcji f jest równa 6 i funkcja przyjmuje tę wartość dokładnie dla dwóch argumentów.
    a) Oblicz m.
    b) Podaj wszystkie miejsca zerowe funkcji f.
    c) Zapisz zbiór wszystkich argumentów, dla których f(x) < 0.
  statement_latex: A\left(-4,\ 6\right),\ B\left(-1,\ -3\right),\ C\left(3,\ -3\right),\ D\left(6,\ m\right),\qquad
    \max_{x \in \langle -4,\ 6 \rangle} f(x) = 6
  solution: |-
    a) Na odcinku AB funkcja maleje od 6 do -3, na BC jest stała i równa -3, na CD zmienia się od -3 do m. Poziom 6 jest osiągany w punkcie A (dla x = -4). Gdyby m < 6, wartość największa 6 byłaby przyjmowana tylko dla jednego argumentu; gdyby m > 6, największa wartość byłaby równa m ≠ 6. Aby wartość największa wynosiła 6 i była przyjmowana dokładnie dla dwóch argumentów, musi być m = 6 (drugim argumentem jest x = 6).

    b) Wyznaczamy równania odcinków.
    AB: współczynnik kierunkowy równa się (-3 - 6)/(-1 - (-4)) = -3, więc y = 6 - 3(x + 4) = -3x - 6. Zero: -3x - 6 = 0, czyli x = -2 i -2 ∈ ⟨-4, -1⟩.
    BC: y = -3, brak miejsc zerowych.
    CD: współczynnik kierunkowy równa się (6 - (-3))/(6 - 3) = 3, więc y = -3 + 3(x - 3) = 3x - 12. Zero: 3x - 12 = 0, czyli x = 4 i 4 ∈ ⟨3, 6⟩.
    Miejsca zerowe: -2 oraz 4.

    c) Miejsca zerowe dzielą dziedzinę na kawałki. Dla x ∈ ⟨-4, -2) wykres leży nad osią OX (np. f(-4) = 6 > 0), dla x ∈ (-2, 4) pod osią (np. cały odcinek BC na poziomie -3), dla x ∈ (4, 6⟩ nad osią (np. f(6) = 6 > 0). Zatem f(x) < 0 dla x ∈ (-2, 4).
  solution_steps:
  - Zauważ, że poziom 6 jest osiągany w punkcie A; drugi argument o wartości 6 może pochodzić tylko z
    ostatniego odcinka.
  - Z warunku „wartość największa równa 6, przyjmowana dokładnie dwa razy” wynika m = 6.
  - 'Wyznacz równanie odcinka AB: y = -3x - 6, i jego miejsce zerowe x = -2.'
  - 'Wyznacz równanie odcinka CD: y = 3x - 12, i jego miejsce zerowe x = 4.'
  - Odczytaj znak na kolejnych kawałkach dziedziny i zapisz f(x) < 0 dla x ∈ (-2, 4).
  answer:
    kind: MULTIPART
    parts:
    - name: m
      answer:
        kind: NUMERIC
        value: 6.0
    - name: miejsca_zerowe
      answer:
        kind: SET
        members:
