- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie wartości funkcji z jedynki trygonometrycznej
  statement: Kąt \alpha jest ostry oraz \sin\alpha = \frac{4}{5}. Oblicz \cos\alpha.
  statement_latex: \sin^2\alpha+\cos^2\alpha=1,\qquad \sin\alpha=\frac{4}{5}
  solution: |-
    Korzystamy z jedynki trygonometrycznej: \sin^2\alpha+\cos^2\alpha=1.
    Podstawiamy daną wartość: \left(\frac{4}{5}\right)^2+\cos^2\alpha=1, czyli \frac{16}{25}+\cos^2\alpha=1.
    Stąd \cos^2\alpha=1-\frac{16}{25}=\frac{9}{25}.
    Kąt \alpha jest ostry, więc \cos\alpha>0 i bierzemy pierwiastek dodatni: \cos\alpha=\frac{3}{5}.
    Sprawdzenie: \left(\frac{4}{5}\right)^2+\left(\frac{3}{5}\right)^2=\frac{16}{25}+\frac{9}{25}=1.
    Odpowiedź: \cos\alpha=\frac{3}{5}.
  solution_steps:
  - 'Zapisz jedynkę trygonometryczną: \sin^2\alpha+\cos^2\alpha=1.'
  - 'Podstaw \sin\alpha=\frac{4}{5}: \frac{16}{25}+\cos^2\alpha=1.'
  - Wyznacz \cos^2\alpha=\frac{9}{25}.
  - Kąt ostry, więc \cos\alpha=\frac{3}{5} (znak plus).
  answer:
    kind: SYMBOLIC
    latex: \frac{3}{5}
  checks:
  - kind: evaluate
    expr: \sqrt{1-\left(\frac{4}{5}\right)^{2}}
  skills:
  - jedynka trygonometryczna
  - wybór znaku pierwiastka dla kąta ostrego
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 0.6 vs 0.6 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: upraszczanie wyrażenia trygonometrycznego
  statement: Kąt \alpha jest ostry. Uprość wyrażenie W = \frac{1-\cos^{2}\alpha}{\sin\alpha}.
  statement_latex: W=\frac{1-\cos^{2}\alpha}{\sin\alpha}
  solution: |-
    Dla kąta ostrego \sin\alpha>0, więc mianownik jest różny od zera i wyrażenie ma sens.
    Z jedynki trygonometrycznej \sin^2\alpha+\cos^2\alpha=1 otrzymujemy 1-\cos^2\alpha=\sin^2\alpha.
    Zatem W=\frac{\sin^{2}\alpha}{\sin\alpha}=\sin\alpha (skróciliśmy przez \sin\alpha\neq 0).
    Sprawdzenie dla \alpha=30^\circ: \frac{1-\left(\frac{\sqrt3}{2}\right)^2}{\frac12}=\frac{\frac14}{\frac12}=\frac12=\sin 30^\circ.
    Odpowiedź: W=\sin\alpha.
  solution_steps:
  - Zauważ, że dla kąta ostrego \sin\alpha\neq 0.
  - Zastąp 1-\cos^{2}\alpha przez \sin^{2}\alpha.
  - Skróć ułamek \frac{\sin^{2}\alpha}{\sin\alpha}=\sin\alpha.
  answer:
    kind: SYMBOLIC
    latex: \sin\alpha
  checks:
  - kind: simplify
    expr: \frac{1-\cos^{2}\alpha}{\sin\alpha}
    var: \alpha
  skills:
  - zamiana 1-\cos^2\alpha na \sin^2\alpha
  - skracanie ułamka
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''\\sin\\alpha'' vs ''sin(alpha)'''
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 1
  exercise_type: zastosowanie definicji tangensa
  statement: Kąt \alpha jest ostry, \sin\alpha = \frac{\sqrt{7}}{4} oraz \cos\alpha = \frac{3}{4}. Oblicz
    \operatorname{tg}\alpha.
  statement_latex: \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha}=\frac{\frac{\sqrt{7}}{4}}{\frac{3}{4}}
  solution: |-
    Sprawdzamy, że dane są zgodne z jedynką: \left(\frac{\sqrt7}{4}\right)^2+\left(\frac34\right)^2=\frac{7}{16}+\frac{9}{16}=1.
    Z definicji tangensa (\cos\alpha\neq 0):
    \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha}=\frac{\frac{\sqrt{7}}{4}}{\frac{3}{4}}=\frac{\sqrt{7}}{4}\cdot\frac{4}{3}=\frac{\sqrt{7}}{3}.
    Odpowiedź: \operatorname{tg}\alpha=\frac{\sqrt{7}}{3}.
  solution_steps:
  - 'Zapisz definicję: \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha} (sinus w liczniku).'
  - Podstaw dane wartości.
  - 'Wykonaj dzielenie ułamków: \frac{\sqrt{7}}{4}\cdot\frac{4}{3}=\frac{\sqrt{7}}{3}.'
  answer:
    kind: SYMBOLIC
    latex: \frac{\sqrt{7}}{3}
  checks:
  - kind: evaluate
    expr: \frac{\frac{\sqrt{7}}{4}}{\frac{3}{4}}
  skills:
  - tangens jako iloraz sinusa i cosinusa
  - dzielenie ułamków
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 0.8819171036881969 vs 0.8819171036881969 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: odtworzenie pozostałych wartości z danego cosinusa
  statement: Kąt \alpha jest ostry oraz \cos\alpha = \frac{5}{13}. Oblicz \sin\alpha oraz \operatorname{tg}\alpha.
  statement_latex: \cos\alpha=\frac{5}{13},\qquad \sin^{2}\alpha+\cos^{2}\alpha=1,\qquad \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha}
  solution: |-
    Dana wartość jest sensowna, bo 0<\frac{5}{13}<1.
    Z jedynki trygonometrycznej: \sin^{2}\alpha=1-\cos^{2}\alpha=1-\left(\frac{5}{13}\right)^{2}=1-\frac{25}{169}=\frac{144}{169}.
    Kąt \alpha jest ostry, więc \sin\alpha>0 i \sin\alpha=\sqrt{\frac{144}{169}}=\frac{12}{13}.
    Z definicji tangensa: \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha}=\frac{\frac{12}{13}}{\frac{5}{13}}=\frac{12}{13}\cdot\frac{13}{5}=\frac{12}{5}.
    Kontrola: to znany trójkąt 5-12-13.
    Odpowiedź: \sin\alpha=\frac{12}{13}, \operatorname{tg}\alpha=\frac{12}{5}.
  solution_steps:
  - 'Sprawdź sensowność danej: 0<\cos\alpha<1.'
  - 'Podstaw do jedynki: \sin^{2}\alpha=1-\frac{25}{169}=\frac{144}{169}.'
  - 'Weź pierwiastek dodatni (kąt ostry): \sin\alpha=\frac{12}{13}.'
  - Oblicz \operatorname{tg}\alpha=\frac{\frac{12}{13}}{\frac{5}{13}}=\frac{12}{5}.
  answer:
    kind: MULTIPART
    parts:
    - name: sin
      answer:
        kind: SYMBOLIC
        latex: \frac{12}{13}
    - name: tg
