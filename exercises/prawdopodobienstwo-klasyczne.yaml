  ramp_index: 2
  difficulty: 5
  exercise_type: zadanie odwrotne dwuczęściowe — skład urny z danego prawdopodobieństwa, następnie prawdopodobieństwo
    innego zdarzenia
  statement: |-
    W pudełku znajdują się wyłącznie kule białe i kule czarne, łącznie 15 kul, przy czym kul białych jest mniej niż kul czarnych. Z pudełka losujemy jednocześnie dwie kule. Prawdopodobieństwo zdarzenia polegającego na tym, że obie wylosowane kule są tego samego koloru, jest równe \frac{7}{15}.
    a) Wyznacz, ile kul białych i ile kul czarnych znajduje się w tym pudełku.
    b) Oblicz prawdopodobieństwo zdarzenia C polegającego na tym, że wśród dwóch wylosowanych kul jest co najmniej jedna kula biała.
    Zapisz obliczenia.
  statement_latex: \frac{\frac{b\cdot\left(b-1\right)}{2}+\frac{\left(15-b\right)\cdot\left(14-b\right)}{2}}{\frac{15\cdot
    14}{2}}=\frac{7}{15}
  solution: |-
    Niech b oznacza liczbę kul białych; wtedy kul czarnych jest 15-b, a z warunku „białych jest mniej niż czarnych” mamy b<15-b, czyli b\le 7 (b jest liczbą całkowitą, b\ge 0).

    Losujemy jednocześnie dwie kule, więc \left|\Omega\right|=\frac{15\cdot 14}{2}=105.
    Zdarzeniu S (obie kule tego samego koloru) sprzyja
    \left|S\right|=\frac{b\cdot\left(b-1\right)}{2}+\frac{\left(15-b\right)\cdot\left(14-b\right)}{2}.
    Z warunku P\left(S\right)=\frac{7}{15} otrzymujemy \left|S\right|=\frac{7}{15}\cdot 105=49, czyli
    b\cdot\left(b-1\right)+\left(15-b\right)\cdot\left(14-b\right)=98.
    Po wymnożeniu: b^{2}-b+210-29b+b^{2}=98, czyli 2b^{2}-30b+112=0, a po podzieleniu przez 2: b^{2}-15b+56=0.
    \Delta=225-224=1, \sqrt{\Delta}=1, więc b=\frac{15-1}{2}=7 lub b=\frac{15+1}{2}=8.
    Warunek b\le 7 (kul białych jest mniej niż czarnych) odrzuca b=8. Zatem kul białych jest 7, a kul czarnych 15-7=8.

    b) Zdarzenie C: co najmniej jedna kula biała. Zdarzenie przeciwne C' to: obie kule czarne, \left|C'\right|=\frac{8\cdot 7}{2}=28, więc P\left(C'\right)=\frac{28}{105}=\frac{4}{15}.
    Stąd P\left(C\right)=1-\frac{4}{15}=\frac{11}{15}.

    Sprawdzenie: \frac{11}{15}\in\left[0,1\right], a przy 7 kulach białych zdarzenie „co najmniej jedna biała” jest częste — wynik jest zgodny z intuicją.
  solution_steps:
  - Wprowadzamy niewiadomą b — liczba kul białych; kul czarnych jest 15-b, a warunek b<15-b daje b\le
    7.
  - \left|\Omega\right|=\frac{15\cdot 14}{2}=105 (losowanie jednoczesne, bez kolejności).
  - \left|S\right|=\frac{b\left(b-1\right)}{2}+\frac{\left(15-b\right)\left(14-b\right)}{2} oraz \left|S\right|=\frac{7}{15}\cdot
    105=49.
  - 'Rozwiązujemy b^{2}-15b+56=0: \Delta=1, b=7 lub b=8.'
  - Warunek „białych mniej niż czarnych” wybiera b=7; czarnych jest 8.
  - 'Zdarzenie przeciwne do C: obie czarne, \left|C''\right|=\frac{8\cdot 7}{2}=28.'
  - P\left(C\right)=1-\frac{28}{105}=\frac{11}{15}.
