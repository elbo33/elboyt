  - 'Rozwiąż 7\cdot n-4=39: n=\frac{43}{7}, liczba niecałkowita — odrzuć.'
  - 'Wniosek: 39 nie jest wyrazem ciągu.'
  - 'Rozwiąż 7\cdot n-4=45: 7n=49, n=7 \in\mathbb{N}_{+}.'
  - 'Odpowiedz: liczba 45 jest siódmym wyrazem ciągu.'
  answer:
