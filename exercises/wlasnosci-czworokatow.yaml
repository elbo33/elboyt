- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: przekątne rombu
  statement: Przekątne rombu ABCD mają długości |AC| = 30 oraz |BD| = 16. Oblicz długość boku tego rombu
    oraz jego pole.
  statement_latex: a = \sqrt{\left(\frac{30}{2}\right)^{2}+\left(\frac{16}{2}\right)^{2}},\qquad P = \frac{1}{2}\cdot
    30\cdot 16
  solution: |-
    Przekątne rombu są prostopadłe i dzielą się na połowy, więc powstają cztery trójkąty prostokątne o przyprostokątnych 30/2 = 15 i 16/2 = 8 oraz przeciwprostokątnej równej bokowi a.
    Z twierdzenia Pitagorasa: a² = 15² + 8² = 225 + 64 = 289, więc a = 17.
    Pole rombu (przekątne są prostopadłe): P = ½·30·16 = 240.
    Odpowiedź: bok ma długość 17, pole wynosi 240.
  solution_steps:
  - 'Podziel każdą przekątną na połowy: 15 i 8.'
  - 'Zapisz twierdzenie Pitagorasa: a² = 15² + 8² = 289.'
  - Wyznacz a = 17.
  - Oblicz pole ze wzoru P = ½·e·f = ½·30·16 = 240.
  answer:
    kind: MULTIPART
    parts:
    - name: bok rombu
      answer:
        kind: NUMERIC
        value: 17.0
    - name: pole
      answer:
        kind: NUMERIC
        value: 240.0
  checks:
  - kind: evaluate
    expr: \sqrt{\left(\frac{30}{2}\right)^{2}+\left(\frac{16}{2}\right)^{2}}
    part: bok rombu
  - kind: evaluate
    expr: \frac{1}{2}\cdot 30\cdot 16
    part: pole
  skills:
  - związek boku i przekątnych rombu
  - pole rombu z przekątnych
  - twierdzenie Pitagorasa
