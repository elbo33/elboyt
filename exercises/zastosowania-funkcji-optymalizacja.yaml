- id: g-cm-08
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: 'błąd: dwie zmienne we wzorze'
  statement: 'Suma dwóch liczb dodatnich x i y jest równa 30. Oblicz, dla jakich liczb x i y ich iloczyn
    jest największy, i oblicz ten największy iloczyn. Uczeń zapisał: „Iloczyn to I=x\cdot y, więc szukam
    wierzchołka funkcji I\left(x\right)=x\cdot y: p=-\frac{y}{2}”. Wskaż błąd w tym rozumowaniu i rozwiąż
    zadanie poprawnie. Zapisz obliczenia.'
  statement_latex: x+y=30,\qquad I\left(x\right)=x\cdot\left(30-x\right)
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń potraktował wyrażenie x\cdot y jak funkcję kwadratową zmiennej x i „obliczył” p=-\frac{y}{2}. Otrzymał wynik zawierający literę y, a więc żadnej konkretnej liczby.
    DLACZEGO TO BŁĄD: wyrażenie x\cdot y zawiera DWIE zmienne – nie jest to funkcja jednej zmiennej i nie ma ono wykresu w postaci paraboli, więc wzorów na wierzchołek nie wolno tu stosować. Najpierw trzeba wykorzystać warunek wiążący i wyeliminować y.
    POPRAWNIE: z warunku x+y=30 mamy y=30-x. Ponieważ x>0 i y>0, dziedziną jest x \in (0,30).
    I(x)=x\cdot(30-x)=-x^{2}+30x – to już funkcja kwadratowa jednej zmiennej, a=-1<0.
    p=-\frac{30}{2\cdot(-1)}=15 \in (0,30), więc x=15, a wtedy y=30-15=15.
    q=I(15)=15\cdot(30-15)=225.
    Odpowiedź: iloczyn jest największy dla x=15 i y=15 i wynosi 225 (zgodnie z regułą: przy stałej sumie iloczyn jest największy, gdy składniki są równe).
  solution_steps:
  - 'Odtwórz błędne rozumowanie: liczenie wierzchołka dla wyrażenia x·y z dwiema zmiennymi.'
  - 'Wskaż błąd: to nie jest funkcja jednej zmiennej; trzeba użyć warunku wiążącego.'
  - Z warunku x+y=30 wyznacz y=30-x i wyznacz dziedzinę x \in (0,30).
  - Zapisz I(x)=x(30-x)=-x^{2}+30x.
  - Oblicz p=15 oraz y=15 i q=I(15)=225.
