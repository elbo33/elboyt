- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie: wzór na kąt w ostrosłupie z dziedziną i kontrolą ograniczenia'
  statement: |-
    Namiot ma kształt ostrosłupa prawidłowego czworokątnego ABCDS: podstawa ABCD jest kwadratem o boku długości 4 m, leżącym na poziomym podłożu, a wierzchołek S znajduje się nad środkiem O tego kwadratu. Wysokość namiotu, czyli długość odcinka SO, oznaczmy przez x (w metrach). Namiot ma stanąć w hali, w której nie może być wyższy niż 3,2 m.
    a) Wyznacz wzór wyrażający tangens kąta α nachylenia krawędzi bocznej SA do płaszczyzny podstawy w zależności od x oraz podaj dziedzinę tak otrzymanej funkcji, uwzględniając warunki zadania.
    b) Producent wymaga, aby ściana boczna namiotu była nachylona do płaszczyzny podłoża pod kątem nie mniejszym niż 60°. Wyznacz najmniejszą wysokość namiotu spełniającą to wymaganie i rozstrzygnij, czy w tej hali można ustawić namiot spełniający jednocześnie oba warunki.
  statement_latex: \operatorname{tg}\alpha=\frac{x}{\frac{4\cdot\sqrt{2}}{2}},\qquad \operatorname{tg}\beta=\frac{x}{\frac{4}{2}}\ge\operatorname{tg}60^\circ=\sqrt{3}
  solution: |-
    a) Rzutem krawędzi bocznej SA na płaszczyznę podstawy jest odcinek OA, czyli połowa przekątnej kwadratu: R = \frac{4\cdot\sqrt{2}}{2} = 2\sqrt{2}. W trójkącie prostokątnym SOA (kąt prosty przy O):
    \operatorname{tg}\alpha = \frac{SO}{OA} = \frac{x}{2\sqrt{2}} = \frac{x\cdot\sqrt{2}}{4}.
    Wysokość musi być dodatnia i nie większa niż 3,2 m, więc dziedziną jest przedział \left(0;\ 3{,}2\right\rangle.

    b) Kąt β nachylenia ściany bocznej do podstawy mierzymy w trójkącie prostokątnym SOM, gdzie M jest środkiem krawędzi AB, a OM = r = \frac{4}{2} = 2 (to rzut apotemy). Zatem \operatorname{tg}\beta = \frac{x}{2}.
    Warunek β ≥ 60° oznacza \frac{x}{2} \ge \sqrt{3}, czyli x \ge 2\sqrt{3} \approx 3{,}46.
    Najmniejsza wysokość spełniająca wymaganie producenta to 2\sqrt{3} m ≈ 3,46 m.

    Ponieważ 2\sqrt{3} \approx 3{,}46 > 3{,}2, żadna wysokość z dziedziny \left(0;\ 3{,}2\right\rangle nie spełnia warunku producenta. Odpowiedź: nie, takiego namiotu nie da się ustawić w tej hali.

    Uwaga: gdyby do kąta ściany bocznej użyć błędnie odcinka R = 2\sqrt{2} zamiast r = 2, otrzymalibyśmy x = 2\sqrt{6} \approx 4{,}90 — kąt ściany bocznej liczymy zawsze z promieniem okręgu wpisanego w podstawę.
  solution_steps:
  - 'Wyznacz rzut krawędzi bocznej na podstawę: R = OA = \frac{4\cdot\sqrt{2}}{2} = 2\sqrt{2}.'
  - W trójkącie prostokątnym SOA zapisz \operatorname{tg}\alpha = \frac{x}{2\sqrt{2}} = \frac{x\cdot\sqrt{2}}{4}.
  - 'Ustal dziedzinę z warunków zadania: x > 0 oraz x \le 3{,}2, czyli x \in \left(0;\ 3{,}2\right\rangle.'
  - Dla ściany bocznej użyj r = \frac{4}{2} = 2 (rzut apotemy) i zapisz \operatorname{tg}\beta = \frac{x}{2}.
  - 'Rozwiąż warunek \frac{x}{2} \ge \sqrt{3}: x \ge 2\sqrt{3}\ \text{m} \approx 3{,}46\ \text{m} — to
    najmniejsza dopuszczalna wysokość.'
  - 'Porównaj z ograniczeniem hali: 2\sqrt{3} > 3{,}2, więc obu warunków nie da się spełnić jednocześnie
    — odpowiedź: nie.'
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_tg_alfa
      answer:
        kind: SYMBOLIC
        latex: \frac{x\cdot\sqrt{2}}{4}
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '3.2'
        hi_open: false
    - name: najmniejsza_wysokosc
      answer:
        kind: NUMERIC
        value: 3.4641016151377544
        tol: 1.0e-06
    - name: czy_mozliwe
      answer:
        kind: BOOLEAN
        truth: false
  checks:
  - kind: simplify
    expr: \frac{x}{\frac{4\cdot\sqrt{2}}{2}}
    part: wzor_tg_alfa
  - kind: solve_equation
    expr: \frac{x}{2}=\sqrt{3}
    part: najmniejsza_wysokosc
  stated_model:
    variable: x
    objective_latex: \operatorname{tg}\alpha\left(x\right)=\frac{x\cdot\sqrt{2}}{4}
    domain_lo: '0'
