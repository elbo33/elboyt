  exercise_type: 'Zadanie tekstowo-geometryczne: układ równań, pole, kontrola wykonalności'
  statement: |-
    Prostokątna działka ABCD ma obwód równy 120 m, przy czym bok AB jest dłuższy od boku BC. Właściciel ogrodził tę działkę: wzdłuż boków AB i CD ustawił płot w cenie 60 zł za metr, a wzdłuż boków BC i AD — płot w cenie 40 zł za metr. Za całe ogrodzenie zapłacił 6400 zł.
    a) Oblicz długości boków AB i BC tej działki oraz pole tej działki.
    b) Rozstrzygnij, czy na tej działce można wytyczyć prostokątny plac o wymiarach 25 m na 22 m, którego boki są równoległe do boków działki. Uzasadnij odpowiedź.
    Zapisz obliczenia.
  statement_latex: \left\{ \begin{matrix} 2\cdot a + 2\cdot b = 120 \\ 2\cdot 60 \cdot a + 2\cdot 40 \cdot
    b = 6400 \end{matrix} \right.
  solution: |-
    Oznaczenia: \(a\) — długość boku AB (w metrach), \(b\) — długość boku BC (w metrach); z sensu zadania \(a > 0\), \(b > 0\) oraz \(a > b\).
    Obwód: \(2a + 2b = 120\), czyli \(a + b = 60\).
    Koszt ogrodzenia: boki AB i CD mają łącznie długość \(2a\) i kosztują \(60\cdot 2a\) zł, boki BC i AD mają łącznie długość \(2b\) i kosztują \(40\cdot 2b\) zł, zatem \(120a + 80b = 6400\), czyli po podzieleniu przez 40: \(3a + 2b = 160\).
    Układ: \(\left\{ a + b = 60;\ 3a + 2b = 160 \right\}\). Z pierwszego równania \(b = 60 - a\); podstawiamy: \(3a + 2\cdot\left(60 - a\right) = 160\), czyli \(a + 120 = 160\), stąd \(a = 40\), a wtedy \(b = 20\).
    Warunek zadania: \(40 > 20\), czyli AB jest rzeczywiście dłuższy od BC — model jest zgodny z treścią.
    Sprawdzenie: obwód \(2\cdot 40 + 2\cdot 20 = 120\) m ✓, koszt \(120\cdot 40 + 80\cdot 20 = 4800 + 1600 = 6400\) zł ✓.
    Pole działki: \(P = 40\cdot 20 = 800\) (m²).
    b) Plac o bokach równoległych do boków działki musi zmieścić się w prostokącie o wymiarach 40 m na 20 m. Choć pole placu \(25\cdot 22 = 550 < 800\), to przy każdym ustawieniu jeden z boków placu (22 m lub 25 m) musiałby być równoległy do boku BC o długości 20 m, a \(22 > 20\) i \(25 > 20\). Zatem placu o wymiarach 25 m na 22 m wytyczyć NIE MOŻNA.
    Odpowiedź: AB = 40 m, BC = 20 m, pole działki wynosi 800 m²; takiego placu wytyczyć się nie da.
  solution_steps:
  - 'Wprowadzam niewiadome: a = |AB| (m), b = |BC| (m), a > b > 0.'
  - Z obwodu zapisuję równanie 2a + 2b = 120, czyli a + b = 60.
  - Z kosztu ogrodzenia zapisuję równanie 60·2a + 40·2b = 6400, czyli 3a + 2b = 160.
  - 'Rozwiązuję układ metodą podstawiania: a = 40, b = 20; sprawdzam warunek a > b oraz dane liczbowe.'
  - 'Obliczam pole działki: P = 40·20 = 800 m².'
  - 'Porównuję wymiary placu z wymiarami działki: 22 > 20 i 25 > 20, więc żaden bok placu nie zmieści
    się wzdłuż boku BC — placu wytyczyć nie można.'
