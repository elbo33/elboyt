- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: układ równań z przekroju osiowego
  statement: Obwód przekroju osiowego walca jest równy 34, a pole tego przekroju jest równe 60. Wysokość
    walca jest większa od średnicy jego podstawy. Oblicz objętość oraz pole powierzchni całkowitej tego
    walca. Zapisz obliczenia.
  statement_latex: \begin{cases} 2\cdot \left(2r + H\right) = 34 \\ 2r\cdot H = 60 \end{cases}
  solution: |-
    Przekrój osiowy walca jest prostokątem o bokach 2r (bok przy podstawie, czyli średnica) oraz H.
    Obwód: 2\left(2r + H\right) = 34, czyli 2r + H = 17.
    Pole: 2r \cdot H = 60.
    Oznaczmy x = 2r. Wtedy x + H = 17 oraz x \cdot H = 60, więc x i H są pierwiastkami równania t^2 - 17t + 60 = 0.
    \Delta = 289 - 240 = 49, \sqrt{\Delta} = 7, zatem t_1 = 5, t_2 = 12.
    Ponieważ H > 2r, przyjmujemy 2r = 5 oraz H = 12, czyli r = \frac{5}{2}.
    Objętość: V = \pi r^2 H = \pi \cdot \left(\frac{5}{2}\right)^2 \cdot 12 = \pi \cdot \frac{25}{4}\cdot 12 = 75\pi.
    Pole całkowite: P_c = 2\pi r\left(r + H\right) = 2\pi \cdot \frac{5}{2}\cdot \left(\frac{5}{2} + 12\right) = 5\pi \cdot \frac{29}{2} = \frac{145\pi}{2} = 72{,}5\pi.
    Odp. V = 75\pi, P_c = \frac{145\pi}{2}.
  solution_steps:
  - 'Zapisz wymiary przekroju osiowego: prostokąt 2r \times H.'
  - 'Z obwodu: 2\left(2r + H\right) = 34, czyli 2r + H = 17.'
  - 'Z pola: 2r \cdot H = 60.'
  - 'Podstaw x = 2r i rozwiąż t^2 - 17t + 60 = 0: t_1 = 5, t_2 = 12.'
  - Z warunku H > 2r wybierz 2r = 5, H = 12, czyli r = \frac{5}{2}.
  - Oblicz V = \pi \cdot \left(\frac{5}{2}\right)^2 \cdot 12 = 75\pi.
  - Oblicz P_c = 2\pi \cdot \frac{5}{2}\cdot \left(\frac{5}{2} + 12\right) = \frac{145\pi}{2}.
  answer:
    kind: MULTIPART
    parts:
    - name: objętość
      answer:
        kind: SYMBOLIC
        latex: 75\pi
    - name: pole powierzchni całkowitej
      answer:
        kind: SYMBOLIC
        latex: \frac{145\pi}{2}
  checks:
  - kind: evaluate
    expr: \pi \cdot \left(\frac{5}{2}\right)^2 \cdot 12
    var: r
    part: objętość
  - kind: evaluate
    expr: 2\cdot \pi \cdot \frac{5}{2} \cdot \left(\frac{5}{2} + 12\right)
    var: r
    part: pole powierzchni całkowitej
  skills:
  - przekrój osiowy 2r \times H
  - układ równań
  - objętość i pole całkowite
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [objętość] SymPy solved it fresh: 235.61944901923448 vs 235.61944901923448
