- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'łańcuch: środek odcinka, promień, symetria osiowa, przesunięcie ze stycznością i kontrolą
    położenia'
  statement: |-
    W kartezjańskim układzie współrzędnych (x,\ y) dane są punkty A=\left(-2,\ -1\right) oraz B=\left(6,\ 5\right). Punkt S jest środkiem odcinka AB. Okrąg o ma środek S i przechodzi przez punkt A.
    a) Wyznacz równanie okręgu o' będącego obrazem okręgu o w symetrii względem osi Ox.
    b) Okrąg o'' jest obrazem okręgu o' w przesunięciu o wektor \vec{u}=\left[m,\ 0\right]. Wyznacz wszystkie wartości m, dla których okrąg o'' jest styczny do osi Oy, a następnie wskaż tę wartość m, dla której okrąg o'' zawiera się w półpłaszczyźnie określonej nierównością x\geq 0.
  statement_latex: A=\left(-2,\ -1\right),\quad B=\left(6,\ 5\right),\quad \vec{u}=\left[m,\ 0\right]
  solution: |-
    Środek odcinka AB:
    S=\left(\frac{-2+6}{2},\ \frac{-1+5}{2}\right)=\left(2,\ 2\right).

    Promień okręgu o to odległość \left|SA\right|:
    r=\sqrt{\left(2-\left(-2\right)\right)^{2}+\left(2-\left(-1\right)\right)^{2}}=\sqrt{16+9}=5.
    Zatem o:\ \left(x-2\right)^{2}+\left(y-2\right)^{2}=25.

    a) Symetria względem osi Ox zmienia znak drugiej współrzędnej środka: S'=\left(2,\ -2\right); promień pozostaje równy 5. Stąd
    o':\ \left(x-2\right)^{2}+\left(y+2\right)^{2}=25.

    b) Po przesunięciu o \vec{u}=\left[m,\ 0\right] środek okręgu o'' to S''=\left(2+m,\ -2\right), promień nadal 5. Okrąg o'' jest styczny do osi Oy wtedy i tylko wtedy, gdy odległość środka od tej osi równa się promieniowi:
    \left|2+m\right|=5, czyli 2+m=5 lub 2+m=-5, a więc m=3 albo m=-7.

    Kontrola położenia: dla m=3 środek to \left(5,\ -2\right); najmniejsza pierwsza współrzędna punktu okręgu wynosi 5-5=0, więc cały okrąg leży w półpłaszczyźnie x\geq 0. Dla m=-7 środek to \left(-5,\ -2\right) i okrąg leży w półpłaszczyźnie x\leq 0, więc ta wartość nie spełnia warunku.
    Szukana wartość to m=3 (wtedy o'':\ \left(x-5\right)^{2}+\left(y+2\right)^{2}=25).
  solution_steps:
  - 'Wyznacz środek odcinka AB: S=\left(\frac{-2+6}{2},\ \frac{-1+5}{2}\right)=\left(2,\ 2\right).'
  - Oblicz promień jako odległość \left|SA\right|=\sqrt{4^{2}+3^{2}}=5 i zapisz o:\ \left(x-2\right)^{2}+\left(y-2\right)^{2}=25.
  - 'Zastosuj symetrię względem Ox do środka: S''=\left(2,\ -2\right); promień bez zmian.'
  - 'Zapisz równanie obrazu: o'':\ \left(x-2\right)^{2}+\left(y+2\right)^{2}=25.'
  - 'Zapisz środek po przesunięciu: S''''=\left(2+m,\ -2\right) i warunek styczności do osi Oy: \left|2+m\right|=5.'
  - 'Rozwiąż równanie: m=3 lub m=-7.'
  - 'Sprawdź warunek położenia: dla m=3 najmniejsza pierwsza współrzędna punktu okręgu to 5-5=0, więc
    okrąg zawiera się w półpłaszczyźnie x\geq 0; wartość m=-7 odrzucamy.'
  answer:
    kind: MULTIPART
    parts:
    - name: rownanie_okregu_o_prim
      answer:
        kind: SYMBOLIC
        latex: \left(x-2\right)^{2}+\left(y+2\right)^{2}=25
    - name: wartosci_m_stycznosc
      answer:
        kind: SET
        members:
        - '3'
        - '-7'
    - name: m_polplaszczyzna
      answer:
        kind: NUMERIC
        value: 3.0
  checks:
  - kind: solve_equation
    expr: \left|2+m\right|=5
    var: m
    part: wartosci_m_stycznosc
  - kind: evaluate
    expr: 5-2
    var: m
    part: m_polplaszczyzna
