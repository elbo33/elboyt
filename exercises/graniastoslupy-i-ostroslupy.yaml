- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: trygonometria w ostrosłupie prawidłowym trójkątnym
  statement: Dany jest ostrosłup prawidłowy trójkątny ABCS o podstawie ABC. Krawędź podstawy ma długość
    6, a każda ściana boczna jest nachylona do płaszczyzny podstawy pod kątem \alpha = 60^\circ. Oblicz
    wysokość tego ostrosłupa, jego objętość oraz pole powierzchni całkowitej. Zapisz obliczenia.
  statement_latex: r = \frac{6\sqrt{3}}{6},\qquad H = r\cdot\operatorname{tg}60^\circ,\qquad h = \frac{r}{\cos
    60^\circ}
  solution: |-
    Podstawą jest trójkąt równoboczny o boku a = 6. Odległość środka podstawy od krawędzi podstawy (promień okręgu wpisanego) wynosi
    r = \frac{a\sqrt{3}}{6} = \frac{6\sqrt{3}}{6} = \sqrt{3}.
    Kąt nachylenia ściany bocznej leży w trójkącie prostokątnym o przyprostokątnych r i H, którego przeciwprostokątną jest wysokość ściany bocznej h.
    Wysokość bryły: \operatorname{tg}60^\circ = \frac{H}{r}, więc H = \sqrt{3}\cdot\sqrt{3} = 3.
    Wysokość ściany bocznej: \cos 60^\circ = \frac{r}{h}, więc h = \frac{\sqrt{3}}{\frac{1}{2}} = 2\sqrt{3}.
    Pole podstawy: P_p = \frac{6^2\sqrt{3}}{4} = 9\sqrt{3}.
    Objętość: V = \frac{1}{3}\cdot 9\sqrt{3}\cdot 3 = 9\sqrt{3} \approx 15,6.
    Pole boczne: P_b = 3\cdot\frac{1}{2}\cdot 6\cdot 2\sqrt{3} = 18\sqrt{3}.
    Pole całkowite: P_c = 9\sqrt{3} + 18\sqrt{3} = 27\sqrt{3} \approx 46,8.
    Kontrola: h = 2\sqrt{3} \approx 3,46 > H = 3 > r = \sqrt{3} — zgodnie z oczekiwaniem.
  solution_steps:
  - 'Wyznacz r dla trójkąta równobocznego o boku 6: r = \frac{6\sqrt{3}}{6} = \sqrt{3}.'
  - 'Z tangensa kąta nachylenia ściany: H = r\cdot\operatorname{tg}60^\circ = \sqrt{3}\cdot\sqrt{3} =
    3.'
  - 'Z cosinusa: h = \frac{r}{\cos 60^\circ} = 2\sqrt{3}.'
  - 'Oblicz pole podstawy: P_p = \frac{6^2\sqrt{3}}{4} = 9\sqrt{3}.'
  - 'Oblicz objętość: V = \frac{1}{3}\cdot 9\sqrt{3}\cdot 3 = 9\sqrt{3}.'
  - Oblicz P_b = 3\cdot\frac{1}{2}\cdot 6\cdot 2\sqrt{3} = 18\sqrt{3} oraz P_c = 9\sqrt{3} + 18\sqrt{3}
    = 27\sqrt{3}.
  answer:
    kind: MULTIPART
    parts:
    - name: H
      answer:
        kind: NUMERIC
        value: 3.0
        latex: '3'
    - name: V
      answer:
        kind: SYMBOLIC
        latex: 9\sqrt{3}
    - name: P_c
      answer:
        kind: SYMBOLIC
        latex: 27\sqrt{3}
  checks:
  - kind: evaluate
    expr: \frac{6\cdot\sqrt{3}}{6}\cdot\sqrt{3}
    part: H
  - kind: evaluate
    expr: \frac{1}{3}\cdot\frac{6^2\cdot\sqrt{3}}{4}\cdot 3
    part: V
  - kind: evaluate
    expr: \frac{6^2\cdot\sqrt{3}}{4} + 3\cdot\frac{1}{2}\cdot 6\cdot 2\cdot\sqrt{3}
    part: P_c
  skills:
  - promienie r i R w trójkącie równobocznym
  - kąt nachylenia ściany bocznej
  - objętość ostrosłupa
  - pole całkowite ostrosłupa
