  exercise_type: Walec wpisany w kulę z ograniczeniem wysokości — optymalizacja z kontrolą dziedziny
  statement: Rozważamy walce wpisane w kulę o promieniu 5, to znaczy takie, że oba okręgi podstaw walca
    leżą na powierzchni tej kuli. Dodatkowo wysokość walca ma być nie mniejsza niż 8. Wyznacz wysokość
    i promień podstawy tego spośród rozważanych walców, którego pole powierzchni bocznej jest największe,
    oraz oblicz to pole. Zapisz obliczenia.
  statement_latex: r = \sqrt{25 - \frac{H^{2}}{4}},\qquad P_{b}\left(H\right) = 2\pi\cdot H\cdot\sqrt{25
    - \frac{H^{2}}{4}},\qquad H\in\left\langle 8;10\right)
  solution: |-
    Krok 1. Przekrój osiowy: prostokąt o wymiarach 2r \times H wpisany w koło o promieniu 5, którego przekątna jest średnicą tego koła. Stąd
    25 = r^{2} + \left(\frac{H}{2}\right)^{2}, czyli r = \sqrt{25 - \frac{H^{2}}{4}}.
    Warunki: r > 0 daje H < 10, a z treści H \geq 8, zatem H \in \left\langle 8;10\right).
    Krok 2. Pole powierzchni bocznej:
    P_{b}\left(H\right) = 2\pi r H = 2\pi H\sqrt{25 - \frac{H^{2}}{4}} = \pi H\sqrt{100 - H^{2}}.
    Krok 3. Ponieważ P_{b} > 0, wystarczy zbadać wyrażenie pod pierwiastkiem po podniesieniu do kwadratu:
    \left(\frac{P_{b}}{\pi}\right)^{2} = H^{2}\left(100 - H^{2}\right). Podstawmy t = H^{2}; funkcja g\left(t\right) = t\left(100 - t\right) = -t^{2} + 100t ma wierzchołek dla t = 50, czyli dla H = \sqrt{50} \approx 7{,}07.
    Dla H \in \left\langle 8;10\right) mamy t = H^{2} \in \left\langle 64;100\right), a na tym przedziale g jest malejąca. Wierzchołek jest więc nieosiągalny — największą wartość otrzymujemy na lewym końcu, dla t = 64, czyli H = 8.
    Krok 4. Dla H = 8: r = \sqrt{25 - \frac{64}{4}} = \sqrt{9} = 3 (i istotnie r = 3 < 5).
    P_{b} = 2\pi\cdot 3\cdot 8 = 48\pi \approx 150{,}8.
    Odp. H = 8, r = 3, największe pole powierzchni bocznej wynosi 48\pi.
  solution_steps:
