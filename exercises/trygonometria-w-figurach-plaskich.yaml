- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: optymalizacja z ograniczeniem (wzór + dziedzina, wartość największa)
  statement: "Z drutu o długości 60 cm wykonano (bez odpadu i bez zakładek) ramkę w kształcie równoległoboku,\
    \ którego kąt ostry ma miarę 30^\\circ. Dłuższy bok tej ramki ma długość x cm i jest co najmniej o\
    \ 8 cm dłuższy od boku sąsiedniego. \na) Wyznacz wzór funkcji P opisującej pole ramki (w cm^2) w zależności\
    \ od x i podaj dziedzinę tej funkcji. \nb) Oblicz, dla jakiej długości x pole ramki jest największe,\
    \ i wyznacz to największe pole."
  statement_latex: P\left(x\right)=x\cdot\left(30-x\right)\cdot\sin 30^\circ=\frac{1}{2}\cdot x\cdot\left(30-x\right),\qquad
    x-\left(30-x\right)\ge 8
  solution: |-
    a) Obwód równoległoboku wynosi 60 cm, a sąsiednie boki to x i drugi bok, więc 2\cdot x + 2\cdot\left(\text{drugi bok}\right) = 60, skąd drugi bok ma długość 30-x.
    Pole równoległoboku o bokach x i 30-x oraz kącie 30^\circ między nimi:
    P\left(x\right) = x\cdot\left(30-x\right)\cdot\sin 30^\circ = \frac{1}{2}\cdot x\cdot\left(30-x\right) = 15x-\frac{x^{2}}{2}.

    Dziedzina. Oba boki muszą być dodatnie: x>0 i 30-x>0, czyli 0<x<30. Dodatkowo bok x jest co najmniej o 8 cm dłuższy od sąsiedniego:
    x-\left(30-x\right)\ge 8 \Rightarrow 2x\ge 38 \Rightarrow x\ge 19.
    (Wtedy automatycznie x>30-x, więc x jest bokiem dłuższym.)
    Ostatecznie dziedziną jest przedział \left\langle 19,\,30\right).

    b) Funkcja P\left(x\right)=-\frac{1}{2}x^{2}+15x jest funkcją kwadratową o ujemnym współczynniku przy x^{2}; jej wierzchołek ma pierwszą współrzędną
    x_{w} = \frac{-15}{2\cdot\left(-\frac{1}{2}\right)} = 15.
    Liczba 15 NIE należy do dziedziny (15<19). Dla x>15 funkcja jest malejąca, więc na przedziale \left\langle 19,30\right) największą wartość przyjmuje na jego lewym końcu, czyli dla x = 19.
    Wtedy drugi bok ma długość 30-19 = 11 cm oraz
    P\left(19\right) = \frac{1}{2}\cdot 19\cdot\left(30-19\right) = \frac{209}{2} = 104{,}5.

    Odpowiedź: P\left(x\right)=15x-\frac{x^{2}}{2} dla x\in\left\langle 19,30\right); największe pole 104{,}5\ \text{cm}^{2} dla x = 19 cm.
  solution_steps:
  - 'Z obwodu 60 cm wyznacz drugi bok: 30-x.'
  - 'Zapisz pole równoległoboku: P\left(x\right)=x\cdot\left(30-x\right)\cdot\sin 30^\circ=15x-\frac{x^{2}}{2}.'
  - Z warunków x>0 i 30-x>0 oraz x-\left(30-x\right)\ge 8 wyznacz dziedzinę \left\langle 19,30\right).
  - 'Wyznacz wierzchołek paraboli: x_{w}=15 — nie należy do dziedziny.'
  - Ponieważ dla x>15 funkcja maleje, największa wartość jest w x=19.
  - Oblicz P\left(19\right)=\frac{1}{2}\cdot 19\cdot 11=104{,}5 cm^2.
