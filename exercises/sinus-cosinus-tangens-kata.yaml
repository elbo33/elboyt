- id: g-cm-09
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: diagnoza błędu – komplet rozwiązań równania z sinusem
  statement: 'Uczeń rozwiązywał w przedziale \langle 0^{\circ},180^{\circ}\rangle równania \sin\alpha=\frac{\sqrt{3}}{2}
    oraz \cos\beta=-\frac{\sqrt{2}}{2} i podał tylko po jednej odpowiedzi: \alpha=60^{\circ} oraz \beta=135^{\circ}.
    Sprawdź jego rozwiązania: wyznacz wszystkie kąty \alpha oraz wszystkie kąty \beta z przedziału \langle
    0^{\circ},180^{\circ}\rangle spełniające te równania.'
  statement_latex: \sin\alpha=\frac{\sqrt{3}}{2},\qquad \cos\beta=-\frac{\sqrt{2}}{2},\qquad \alpha,\beta\in\langle
    0^{\circ},180^{\circ}\rangle
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń odczytał z tabeli kąt ostry 60^{\circ} i na tym poprzestał, podając \alpha=60^{\circ} jako jedyne rozwiązanie — to odpowiedź niepełna.
    GDZIE JEST BŁĄD: w przedziale \langle 0^{\circ},180^{\circ}\rangle sinus rośnie od 0 do 1 na \langle 0^{\circ},90^{\circ}\rangle i maleje od 1 do 0 na \langle 90^{\circ},180^{\circ}\rangle, więc każdą wartość s\in\left(0,1\right) przyjmuje dwa razy: dla \alpha_{0} i dla 180^{\circ}-\alpha_{0}.
    POPRAWNIE: \sin 60^{\circ}=\frac{\sqrt{3}}{2}, więc \alpha=60^{\circ} lub \alpha=180^{\circ}-60^{\circ}=120^{\circ}.
    Dla cosinusa jest inaczej: cosinus maleje w całym przedziale od 1 do -1, więc rozwiązanie jest dokładnie jedno. Ponieważ \cos 45^{\circ}=\frac{\sqrt{2}}{2}, a wartość dana jest ujemna, to \beta=180^{\circ}-45^{\circ}=135^{\circ} — tutaj uczeń miał rację.
    Odpowiedź: \alpha\in\left\{60^{\circ},120^{\circ}\right\}, \beta=135^{\circ}.
  solution_steps:
  - 'Odtwórz błąd: podanie tylko \alpha=60^{\circ} pomija drugie rozwiązanie równania z sinusem.'
  - 'Przypomnij monotoniczność: sinus przyjmuje każdą wartość z (0,1) dwukrotnie, cosinus jest różnowartościowy
    na \langle 0^{\circ},180^{\circ}\rangle.'
  - Wyznacz \alpha=60^{\circ} oraz \alpha=180^{\circ}-60^{\circ}=120^{\circ}.
  - 'Wyznacz \beta: \cos 45^{\circ}=\frac{\sqrt{2}}{2} i wartość ujemna, więc \beta=180^{\circ}-45^{\circ}=135^{\circ}
