- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie odległości dwóch punktów
  statement: W kartezjańskim układzie współrzędnych (x, y) dane są punkty A = (-3, 2) oraz B = (1, -1).
    Oblicz długość odcinka AB. Zapisz obliczenia.
  statement_latex: '|AB| = \sqrt{\left(1-\left(-3\right)\right)^{2}+\left(-1-2\right)^{2}}'
  solution: |-
    Obliczamy przyrosty współrzędnych: \Delta x = x_B - x_A = 1 - (-3) = 4 oraz \Delta y = y_B - y_A = -1 - 2 = -3.
    Stosujemy wzór na odległość dwóch punktów:
    |AB| = \sqrt{\left(\Delta x\right)^{2}+\left(\Delta y\right)^{2}} = \sqrt{4^{2}+\left(-3\right)^{2}} = \sqrt{16+9} = \sqrt{25} = 5.
    Odpowiedź: |AB| = 5.
  solution_steps:
  - 'Wyznacz przyrost odciętych: \Delta x = 1 - \left(-3\right) = 4.'
  - 'Wyznacz przyrost rzędnych: \Delta y = -1 - 2 = -3.'
  - 'Podstaw do wzoru: |AB| = \sqrt{4^{2}+\left(-3\right)^{2}} = \sqrt{25}.'
  - 'Oblicz pierwiastek: |AB| = 5.'
  answer:
    kind: NUMERIC
    value: 5.0
    latex: '5'
  checks:
  - kind: evaluate
    expr: \sqrt{\left(1-\left(-3\right)\right)^{2}+\left(-1-2\right)^{2}}
  skills:
  - wzór na odległość dwóch punktów
  - działania na liczbach ujemnych
  - upraszczanie pierwiastka
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 5.0 vs 5.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: zamiana postaci ogólnej na kierunkową
  statement: W kartezjańskim układzie współrzędnych (x, y) dana jest prosta k o równaniu 2x - 5y + 10
    = 0. Zapisz równanie prostej k w postaci kierunkowej, a następnie podaj jej współczynnik kierunkowy
    a oraz wyraz wolny b.
  statement_latex: 2x-5y+10=0 \iff y = \frac{2}{5}x + 2
  solution: |-
    Wyznaczamy y z równania prostej:
    2x - 5y + 10 = 0 \iff -5y = -2x - 10 \iff y = \frac{-2x-10}{-5} = \frac{2}{5}x + 2.
    Zatem postać kierunkowa prostej k to y = \frac{2}{5}x + 2, czyli a = \frac{2}{5} oraz b = 2.
    (Kontrola wzorem: a = -\frac{A}{B} = -\frac{2}{-5} = \frac{2}{5}, b = -\frac{C}{B} = -\frac{10}{-5} = 2.)
  solution_steps:
  - 'Przenieś wyrazy z x i wyraz wolny na prawą stronę: -5y = -2x - 10.'
  - 'Podziel obie strony przez -5: y = \frac{2}{5}x + 2.'
  - 'Odczytaj współczynnik kierunkowy: a = \frac{2}{5}.'
  - 'Odczytaj wyraz wolny: b = 2 (prosta przechodzi przez punkt \left(0,\ 2\right)).'
  answer:
    kind: MULTIPART
    parts:
    - name: wspolczynnik_a
      answer:
        kind: NUMERIC
        value: 0.4
        latex: \frac{2}{5}
    - name: wyraz_wolny_b
      answer:
        kind: NUMERIC
        value: 2.0
        latex: '2'
  checks:
  - kind: evaluate
    expr: -\frac{2}{-5}
    part: wspolczynnik_a
  - kind: evaluate
    expr: -\frac{10}{-5}
    part: wyraz_wolny_b
  skills:
  - przekształcanie równania prostej
  - odczytywanie współczynnika kierunkowego
  - odczytywanie wyrazu wolnego
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [wspolczynnik_a] SymPy solved it fresh: 0.4 vs 0.4 (tol 1e-09)
      ; [wyraz_wolny_b] SymPy solved it fresh: 2.0 vs 2.0 (tol 1e-09)'
- id: g-th-02
