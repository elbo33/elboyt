- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: zadanie odwrotne z ukrytym warunkiem geometrycznym
  statement: Przekrój osiowy pewnego stożka jest trójkątem prostokątnym, a objętość tego stożka jest równa
    72\pi. Oblicz pole powierzchni całkowitej tego stożka. Zapisz obliczenia.
  statement_latex: V=\frac{1}{3}\cdot\pi\cdot r^{2}\cdot H=72\pi,\qquad H=r
  solution: |-
    Przekrój osiowy jest trójkątem równoramiennym o ramionach l i podstawie 2r. Kąty przy podstawie są równe, więc kąt prosty może być tylko kątem przy wierzchołku stożka.
    Wysokość H poprowadzona do przeciwprostokątnej trójkąta prostokątnego równoramiennego jest równa połowie tej przeciwprostokątnej, czyli H=\frac{1}{2}\cdot 2r=r.
    Podstawiamy do wzoru na objętość: \frac{1}{3}\pi r^{2}\cdot r=72\pi, czyli r^{3}=216, więc r=6, a zatem H=6.
    Tworząca: l^{2}=r^{2}+H^{2}=36+36=72, więc l=6\sqrt{2}.
    Pole całkowite: P_c=\pi r\left(r+l\right)=\pi\cdot 6\cdot\left(6+6\sqrt{2}\right)=36\pi\left(1+\sqrt{2}\right).
    Odpowiedź: P_c=36\pi\left(1+\sqrt{2}\right)=36\pi+36\sqrt{2}\pi.
  solution_steps:
  - Zauważ, że w trójkącie równoramiennym kąt prosty musi być kątem przy wierzchołku stożka.
  - 'Wywnioskuj, że wysokość do przeciwprostokątnej jest jej połową: H=r.'
  - Z równania \frac{1}{3}\pi r^{3}=72\pi wyznacz r^{3}=216, czyli r=6 oraz H=6.
  - 'Oblicz tworzącą: l=\sqrt{36+36}=6\sqrt{2}.'
  - Oblicz P_c=\pi\cdot 6\cdot\left(6+6\sqrt{2}\right)=36\pi\left(1+\sqrt{2}\right).
  answer:
    kind: SYMBOLIC
    latex: 36\pi\left(1+\sqrt{2}\right)
