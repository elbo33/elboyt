- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: wzór funkcji i własności hiperboli
  statement: Wykres funkcji odwrotnie proporcjonalnej f, danej wzorem f(x)=\frac{a}{x}, przechodzi przez
    punkt P=\left(-6,\ 2\right). a) Wyznacz wzór funkcji f. b) Oblicz f(3). c) Rozstrzygnij, czy punkt
    B=\left(4,\ -3\right) należy do wykresu funkcji f (odpowiedz TAK lub NIE). d) Podaj, w których ćwiartkach
    układu współrzędnych leżą gałęzie tej hiperboli.
  statement_latex: f(x)=\frac{a}{x},\qquad P=\left(-6,\ 2\right)
  solution: |-
    a) Współrzędne punktu P spełniają wzór: 2=\frac{a}{-6}, więc a=\left(-6\right)\cdot 2=-12 i f(x)=\frac{-12}{x}.
    b) f(3)=\frac{-12}{3}=-4.
    c) Sprawdzamy iloczyn współrzędnych punktu B: 4\cdot\left(-3\right)=-12=a, zatem punkt B należy do wykresu (istotnie f(4)=\frac{-12}{4}=-3).
    d) Ponieważ a=-12<0, iloraz \frac{a}{x} ma znak przeciwny do znaku x: dla x<0 wartości są dodatnie, a dla x>0 ujemne. Gałęzie leżą więc w II i IV ćwiartce.
  solution_steps:
  - 'Podstaw P do wzoru ogólnego: 2=\frac{a}{-6}.'
  - Wyznacz a=\left(-6\right)\cdot 2=-12 i zapisz f(x)=\frac{-12}{x}.
  - Oblicz f(3)=\frac{-12}{3}=-4.
  - 'Sprawdź punkt B iloczynem współrzędnych: 4\cdot\left(-3\right)=-12=a, więc B należy do wykresu.'
  - Z warunku a<0 wywnioskuj, że gałęzie leżą w II i IV ćwiartce.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor funkcji
      answer:
        kind: SYMBOLIC
        latex: f(x)=\frac{-12}{x}
    - name: f(3)
      answer:
        kind: NUMERIC
        value: -4.0
        latex: f(3)=-4
    - name: czy B nalezy do wykresu
      answer:
        kind: BOOLEAN
        latex: TAK
        truth: true
    - name: cwiartki
      answer:
        kind: SET
        latex: \text{II i IV ćwiartka}
        members:
        - II
        - IV
  checks:
  - kind: simplify
    expr: \frac{\left(-6\right)\cdot 2}{x}
    part: wzor funkcji
  - kind: evaluate
    expr: \frac{-12}{3}
    part: f(3)
  skills:
  - wyznaczanie wzoru z jednego punktu
  - obliczanie wartości funkcji
  - sprawdzanie przynależności punktu
  - położenie gałęzi a znak a
  verification:
    checkability: DETERMINISTIC
    note: '[wzor funkcji] SymPy solved it fresh and disagrees: ''f(x)=\\frac{-12}{x}'' vs ''-12/x'' (as
      text)'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: równanie i nierówność z funkcją a/x
  statement: Funkcja f jest określona wzorem f(x)=\frac{8}{x} dla x\neq 0. a) Rozwiąż nierówność \frac{8}{x}\ge
    4. b) Rozwiąż równanie \frac{8}{x}=-16. c) Uzasadnij, że funkcja f nie ma miejsc zerowych.
  statement_latex: f(x)=\frac{8}{x},\qquad \frac{8}{x}\ge 4,\qquad \frac{8}{x}=-16
  solution: |-
    a) Zakładamy x\neq 0 i rozpatrujemy dwa przypadki.
    Dla x>0 mnożymy nierówność przez dodatnie x, znak nierówności się nie zmienia: 8\ge 4\cdot x, czyli x\le 2. Razem z warunkiem x>0 otrzymujemy 0<x\le 2.
    Dla x<0 lewa strona \frac{8}{x} jest ujemna, a prawa równa 4>0, więc nierówność nie jest spełniona dla żadnego x<0.
    Odpowiedź: x\in\left(0,\ 2\right\rangle.
    b) Mnożymy przez x: 8=-16\cdot x, stąd x=\frac{8}{-16}=-\frac{1}{2}. Sprawdzenie: f\left(-\frac{1}{2}\right)=\frac{8}{-\frac{1}{2}}=-16.
    c) Miejsce zerowe to rozwiązanie równania \frac{8}{x}=0. Ułamek jest równy zeru tylko wtedy, gdy jego licznik jest zerem, a licznik jest stale równy 8\neq 0. Zatem równanie jest sprzeczne i funkcja f nie ma miejsc zerowych (jej wykres nie ma punktów wspólnych z osią OX, która jest asymptotą poziomą).
  solution_steps:
  - Zapisz założenie x\neq 0.
  - 'Dla x>0 pomnóż nierówność przez x: 8\ge 4\cdot x, czyli x\le 2; łącznie 0<x\le 2.'
  - Dla x<0 zauważ, że \frac{8}{x}<0<4, więc nierówność nie zachodzi.
  - 'Zapisz rozwiązanie nierówności: x\in\left(0,\ 2\right\rangle.'
  - 'Rozwiąż równanie: 8=-16\cdot x, stąd x=-\frac{1}{2}.'
  - 'Uzasadnij brak miejsc zerowych: \frac{8}{x}=0 jest sprzeczne, bo 8\neq 0.'
  answer:
    kind: MULTIPART
    parts:
    - name: rozwiazanie nierownosci
      answer:
        kind: INTERVAL
        latex: x\in\left(0,\ 2\right\rangle
        lo: '0'
        hi: '2'
        hi_open: false
    - name: rozwiazanie rownania
      answer:
        kind: SET
        latex: x=-\frac{1}{2}
        members:
        - -\frac{1}{2}
    - name: uzasadnienie braku miejsc zerowych
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma uzasadnić, że równanie \frac{8}{x}=0 jest sprzeczne, bo ułamek jest zerem tylko
          przy zerowym liczniku, a licznik wynosi 8\neq 0.
  checks:
  - kind: solve_inequality
    expr: \frac{8}{x} \ge 4
    part: rozwiazanie nierownosci
  - kind: solve_equation
    expr: \frac{8}{x} = -16
    part: rozwiazanie rownania
  skills:
  - rozwiązywanie nierówności a/x≥c z uwzględnieniem znaku x
  - rozwiązywanie równania a/x=c
  - uzasadnianie braku miejsc zerowych
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie braku miejsc zerowych · 2/2 other parts solved fresh'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: 'zadanie tekstowe: praca–wydajność–czas'
  statement: Sześć jednakowych maszyn pakujących wykonuje pewne zlecenie w ciągu 14 dni, pracując jednakowo
    wydajnie. Zakładamy, że każda maszyna pracuje z tą samą wydajnością, a czas t wykonania całego zlecenia
    zależy tylko od liczby n pracujących maszyn. a) Zapisz t jako funkcję zmiennej n oraz podaj dziedzinę
    tej funkcji wynikającą z treści zadania. b) Oblicz, w ile dni zlecenie wykonałoby 12 maszyn. c) Oblicz,
    ile maszyn trzeba zatrudnić, aby zlecenie zostało wykonane w 4 dni. d) Oblicz, o ile procent skróci
    się czas wykonania zlecenia, jeżeli zamiast 6 maszyn pracować będzie 8 maszyn.
  statement_latex: t\left(n\right)=\frac{a}{n},\qquad a=6\cdot 14
  solution: |-
    a) Cała praca do wykonania jest stała, więc iloczyn liczby maszyn i czasu jest stały: n\cdot t=6\cdot 14=84 (w maszynodniach). Stąd t\left(n\right)=\frac{84}{n}. W kontekście zadania n jest dodatnią liczbą naturalną, więc dziedziną jest zbiór n\in\mathbb{N},\ n\ge 1 (rysujemy tylko fragment prawej gałęzi hiperboli w I ćwiartce).
    b) t\left(12\right)=\frac{84}{12}=7 dni.
    c) Rozwiązujemy \frac{84}{n}=4, czyli n=\frac{84}{4}=21 maszyn.
    d) t\left(6\right)=\frac{84}{6}=14 dni, t\left(8\right)=\frac{84}{8}=10{,}5 dnia. Skrócenie wynosi 14-10{,}5=3{,}5 dnia, co stanowi \frac{3{,}5}{14}=0{,}25=25\% czasu początkowego. Zauważmy, że liczba maszyn wzrosła o około 33\%, a czas zmalał o 25\% — zależność jest odwrotnie proporcjonalna, a nie liniowa.
  solution_steps:
  - Zauważ, że praca jest stała, więc n\cdot t=6\cdot 14=84.
  - Zapisz model t\left(n\right)=\frac{84}{n} z dziedziną n\in\mathbb{N},\ n\ge 1.
  - Oblicz t\left(12\right)=\frac{84}{12}=7 dni.
  - Rozwiąż \frac{84}{n}=4, otrzymując n=\frac{84}{4}=21 maszyn.
  - Oblicz t\left(6\right)=14 i t\left(8\right)=10{,}5.
  - 'Oblicz procent skrócenia: \frac{14-10{,}5}{14}\cdot 100\%=25\%.'
  answer:
    kind: MULTIPART
    parts:
    - name: wzor funkcji
      answer:
        kind: SYMBOLIC
        latex: t\left(n\right)=\frac{84}{n}
    - name: dziedzina
      answer:
        kind: SYMBOLIC
        latex: n\in\mathbb{N},\ n\ge 1
    - name: czas dla 12 maszyn
      answer:
        kind: NUMERIC
        value: 7.0
        latex: 7\ \text{dni}
    - name: liczba maszyn na 4 dni
      answer:
        kind: NUMERIC
        value: 21.0
        latex: 21\ \text{maszyn}
    - name: procent skrocenia czasu
      answer:
        kind: NUMERIC
        value: 25.0
        latex: 25\%
  checks:
  - kind: simplify
    expr: \frac{6 \cdot 14}{n}
    var: n
    part: wzor funkcji
  - kind: evaluate
    expr: \frac{84}{12}
    var: n
    part: czas dla 12 maszyn
  - kind: solve_equation
    expr: \frac{84}{n} = 4
    var: n
    part: liczba maszyn na 4 dni
  - kind: evaluate
    expr: \frac{\frac{84}{6} - \frac{84}{8}}{\frac{84}{6}} \cdot 100
    var: n
    part: procent skrocenia czasu
  stated_model:
    variable: n
    objective_latex: t\left(n\right)=\frac{84}{n}
    domain_lo: '0'
    goal: value
    constraint_used: n\cdot t = 6\cdot 14 = 84, n liczba naturalna dodatnia
  skills:
  - budowanie modelu odwrotnie proporcjonalnego
  - dziedzina wynikająca z kontekstu
  - obliczenia procentowe
  - interpretacja wyniku
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''n'': ''t\\left(n\\right)=\\frac{84}{n}'')
      — human review'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: wyznaczanie wzoru i własności funkcji odwrotnie proporcjonalnej
  statement: |-
    Wykres funkcji odwrotnie proporcjonalnej f przechodzi przez punkt A = (-4, 3).
    a) Wyznacz współczynnik a i zapisz wzór funkcji f.
    b) Rozstrzygnij, czy punkt B = (3, -4) należy do wykresu funkcji f.
    c) Rozwiąż nierówność f(x) \le -2.
    d) Podaj, w których ćwiartkach układu współrzędnych leżą gałęzie hiperboli będącej wykresem funkcji f.
  statement_latex: f\left(x\right)=\frac{a}{x},\qquad A=\left(-4,\,3\right),\qquad \frac{a}{x}\le -2
  solution: |-
    a) Ze wzoru f(x) = \frac{a}{x} oraz z warunku f(-4) = 3 otrzymujemy 3 = \frac{a}{-4}, czyli a = \left(-4\right)\cdot 3 = -12. Zatem f\left(x\right)=\frac{-12}{x}.
    b) Punkt należy do wykresu wtedy i tylko wtedy, gdy iloczyn jego współrzędnych jest równy a. Mamy 3\cdot\left(-4\right) = -12 = a, więc punkt B należy do wykresu (istotnie f(3) = \frac{-12}{3} = -4).
    c) Rozwiązujemy \frac{-12}{x}\le -2 przy założeniu x \neq 0.
    Przypadek x > 0: mnożymy obie strony przez x (dodatnie), znak nierówności zostaje: -12 \le -2x, czyli 2x \le 12, stąd x \le 6. Uwzględniając x > 0, otrzymujemy 0 < x \le 6.
    Przypadek x < 0: wtedy \frac{-12}{x} > 0, a liczba dodatnia nie jest mniejsza ani równa -2, więc nierówność nie ma tu rozwiązań.
    Odpowiedź: x \in \left(0,\,6\right].
    d) Ponieważ a = -12 < 0, gałęzie hiperboli leżą w II i IV ćwiartce.
  solution_steps:
  - 'Zapisz wzór ogólny f(x) = a/x i podstaw współrzędne punktu A: 3 = a/(-4).'
  - Wyznacz a = (-4)·3 = -12, więc f(x) = -12/x.
  - 'Sprawdź B: 3·(-4) = -12 = a, więc B należy do wykresu.'
  - 'Nierówność -12/x ≤ -2 rozważ w dwóch przypadkach: x > 0 daje 0 < x ≤ 6, x < 0 nie daje rozwiązań.'
  - Zapisz odpowiedź (0, 6] oraz, z warunku a < 0, wskaż ćwiartki II i IV.
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: NUMERIC
        value: -12.0
    - name: wzor
      answer:
        kind: SYMBOLIC
        latex: f\left(x\right)=\frac{-12}{x}
    - name: B_nalezy
      answer:
        kind: BOOLEAN
        truth: true
    - name: nierownosc
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '6'
        hi_open: false
    - name: cwiartki
      answer:
        kind: SYMBOLIC
        latex: II i IV
  checks:
  - kind: evaluate
    expr: \left(-4\right)\cdot 3
    part: a
  - kind: solve_inequality
    expr: \frac{-12}{x} \le -2
    part: nierownosc
  skills:
  - wyznaczanie współczynnika a z punktu wykresu
  - sprawdzanie przynależności punktu do wykresu
  - rozwiązywanie nierówności typu a/x ≤ c
  - położenie gałęzi hiperboli a znak a
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: reference produced 4 outputs, answer has 5'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: 'zadanie tekstowe: model odwrotnie proporcjonalny praca–wydajność–czas'
  statement: |-
    Osiem jednakowych koparek, pracujących z tą samą wydajnością, wykonuje pewien wykop w ciągu 15 dni. Czas t (w dniach) wykonania tego wykopu jest odwrotnie proporcjonalny do liczby n pracujących koparek.
    a) Wyznacz wzór funkcji t(n) i podaj jej dziedzinę wynikającą z treści zadania.
    b) Oblicz, ile koparek trzeba skierować do pracy, aby wykop został wykonany w ciągu 10 dni.
    c) Oblicz, o ile procent skróci się czas wykonania wykopu, jeżeli zamiast 8 koparek będzie pracowało 10 koparek.
  statement_latex: t\left(n\right)=\frac{a}{n},\qquad a=8\cdot 15,\qquad \frac{120}{n}=10
  solution: |-
    a) Iloczyn liczby koparek i czasu pracy jest stały i równy łącznej pracy: a = 8\cdot 15 = 120 (koparkodni). Zatem t\left(n\right)=\frac{120}{n}. Z treści zadania n jest dodatnią liczbą naturalną, więc D = \mathbb{N}_{+}.
    b) Rozwiązujemy \frac{120}{n}=10, stąd n = \frac{120}{10}=12. Potrzeba 12 koparek. Wynik jest sensowny: więcej koparek — krótszy czas.
    c) Dla n = 8: t = \frac{120}{8} = 15 dni. Dla n = 10: t = \frac{120}{10} = 12 dni. Skrócenie wynosi 15 - 12 = 3 dni, co stanowi \frac{3}{15}\cdot 100\% = 20\% czasu początkowego. (Zauważ, że liczba koparek wzrosła o 25\%, a czas zmalał o 20\% — zależność jest odwrotnie proporcjonalna, a nie liniowa.)
  solution_steps:
