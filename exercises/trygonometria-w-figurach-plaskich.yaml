- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie boku w trójkącie prostokątnym
  statement: W trójkącie prostokątnym ABC kąt prosty jest przy wierzchołku C, przeciwprostokątna AB ma
    długość 12, a kąt ostry przy wierzchołku A ma miarę 30°. Oblicz długość boku BC.
  statement_latex: '|AB|=12,\quad |\angle BAC|=30^\circ,\quad |\angle ACB|=90^\circ,\quad |BC|=12\cdot\sin
    30^\circ'
  solution: |-
    Bok BC leży naprzeciw kąta o mierze 30°, a AB jest przeciwprostokątną, więc łączy je sinus:
    \[\sin 30^\circ=\frac{|BC|}{|AB|}=\frac{|BC|}{12}.\]
    Ponieważ \(\sin 30^\circ=\frac{1}{2}\), mamy
    \[|BC|=12\cdot\frac{1}{2}=6.\]
    Kontrola sensowności: 6 < 12, czyli przyprostokątna jest krótsza od przeciwprostokątnej. ✓
  solution_steps:
  - 'Zaznacz kąt 30° przy wierzchołku A i opisz boki: AB — przeciwprostokątna, BC — bok naprzeciw kąta
    30°.'
  - 'Bok naprzeciw i przeciwprostokątna → sinus: sin 30° = |BC| / 12.'
  - Podstaw sin 30° = 1/2 i wyznacz |BC| = 12 · 1/2 = 6.
  - 'Sprawdź sensowność: przyprostokątna krótsza od przeciwprostokątnej.'
  answer:
    kind: NUMERIC
    value: 6.0
  checks:
  - kind: evaluate
    expr: 12\cdot\frac{1}{2}
  skills:
  - definicje funkcji trygonometrycznych kąta ostrego
  - wartości dla kąta 30°
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 6.0 vs 6.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
