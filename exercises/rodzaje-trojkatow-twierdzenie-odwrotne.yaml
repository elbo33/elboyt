- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: badanie typu trójkąta zależnego od parametru
  statement: |-
    Boki trójkąta mają długości x, x + 3 oraz x + 6, gdzie x > 0.
    a) Wyznacz wszystkie wartości x, dla których taki trójkąt istnieje.
    b) Wyznacz tę wartość x, dla której trójkąt jest prostokątny.
    c) Wyznacz wszystkie wartości x, dla których trójkąt jest rozwartokątny.
  statement_latex: x^2 + \left(x + 3\right)^2 = \left(x + 6\right)^2
  solution: |-
    Ponieważ x < x + 3 < x + 6, najdłuższym bokiem jest c = x + 6, a pozostałe boki to a = x oraz b = x + 3.

    a) Warunek istnienia: suma dwóch krótszych boków musi być większa od najdłuższego:
    x + \left(x + 3\right) > x + 6, czyli 2x + 3 > x + 6, stąd x > 3.

    b) Trójkąt jest prostokątny, gdy x^2 + \left(x + 3\right)^2 = \left(x + 6\right)^2:
    x^2 + x^2 + 6x + 9 = x^2 + 12x + 36,
    x^2 - 6x - 27 = 0, \Delta = 36 + 108 = 144, \sqrt{\Delta} = 12,
    x = \frac{6 - 12}{2} = -3 \ \text{lub}\ x = \frac{6 + 12}{2} = 9.
    Warunek x > 3 odrzuca x = -3, zostaje x = 9. Boki: 9, 12, 15 ✔ (trójka pitagorejska).

    c) Trójkąt jest rozwartokątny, gdy x^2 + \left(x + 3\right)^2 < \left(x + 6\right)^2, czyli x^2 - 6x - 27 < 0, a więc x \in \left(-3,\ 9\right). Przecinamy z warunkiem istnienia x > 3 i otrzymujemy x \in \left(3,\ 9\right).

    Odpowiedź: trójkąt istnieje dla x \in \left(3,\ +\infty\right), jest prostokątny dla x = 9 i rozwartokątny dla x \in \left(3,\ 9\right) (a ostrokątny dla x > 9).
  solution_steps:
  - Ustal, że najdłuższym bokiem jest x + 6, bo x < x + 3 < x + 6.
  - 'Zapisz warunek istnienia: x + \left(x + 3\right) > x + 6, stąd x > 3.'
  - 'Zapisz warunek prostokątności: x^2 + \left(x + 3\right)^2 = \left(x + 6\right)^2 i przekształć do
