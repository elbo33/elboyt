  statement: W graniastosłupie prawidłowym sześciokątnym krawędź podstawy ma długość 3, a wysokość bryły
    jest równa 8. Oblicz objętość oraz pole powierzchni całkowitej tego graniastosłupa. Zapisz obliczenia.
  statement_latex: P_p = \frac{3\cdot 3^2\sqrt{3}}{2},\qquad V = P_p\cdot 8,\qquad P_c = 2P_p + 6\cdot
