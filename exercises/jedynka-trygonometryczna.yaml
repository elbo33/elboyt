- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: trójkąt prostokątny o przeciwprostokątnej 1 — wyrażenia symetryczne
  statement: Odcinek AB o długości 1 jest przeciwprostokątną trójkąta prostokątnego ABC (kąt prosty przy
    wierzchołku C). Suma długości przyprostokątnych tego trójkąta jest równa \frac{7}{5}. Oblicz długości
    obu przyprostokątnych oraz tangens mniejszego z kątów ostrych tego trójkąta.
  statement_latex: a + b = \frac{7}{5},\qquad a^{2} + b^{2} = 1
  solution: |-
    Oznaczmy przez a = |BC| i b = |AC| długości przyprostokątnych, a > 0, b > 0. Z twierdzenia Pitagorasa a^{2} + b^{2} = 1 (to ta sama zależność co jedynka trygonometryczna, bo przy przeciwprostokątnej długości 1 mamy a = \sin\alpha, b = \cos\alpha dla kąta α przy wierzchołku A).
    Z warunku zadania a + b = \frac{7}{5}. Podnosimy tę równość do kwadratu:
    \left(a + b\right)^{2} = a^{2} + 2\cdot a\cdot b + b^{2} = 1 + 2\cdot a\cdot b = \frac{49}{25},
    zatem 2\cdot a\cdot b = \frac{24}{25}, czyli a\cdot b = \frac{12}{25}.
    Liczby a i b są więc pierwiastkami równania
    x^{2} - \frac{7}{5}\cdot x + \frac{12}{25} = 0.
    Wyróżnik: \Delta = \left(\frac{7}{5}\right)^{2} - 4\cdot\frac{12}{25} = \frac{49}{25} - \frac{48}{25} = \frac{1}{25}, \sqrt{\Delta} = \frac{1}{5}.
    Stąd x = \frac{\frac{7}{5} - \frac{1}{5}}{2} = \frac{3}{5} lub x = \frac{\frac{7}{5} + \frac{1}{5}}{2} = \frac{4}{5}.
    Przyprostokątne mają więc długości \frac{3}{5} i \frac{4}{5} (obie dodatnie i mniejsze od 1 — zgodnie z tym, że przeciwprostokątna jest najdłuższym bokiem).
    Mniejszy kąt ostry leży naprzeciw krótszej przyprostokątnej, czyli naprzeciw boku długości \frac{3}{5}. Zatem jego tangens to iloraz krótszej przyprostokątnej przez dłuższą:
    \operatorname{tg} = \frac{\frac{3}{5}}{\frac{4}{5}} = \frac{3}{4}.
    Odpowiedź: przyprostokątne mają długości \frac{3}{5} i \frac{4}{5}, a tangens mniejszego kąta ostrego jest równy \frac{3}{4}.
  solution_steps:
  - Oznacz przyprostokątne przez a i b; z twierdzenia Pitagorasa a² + b² = 1.
  - 'Zapisz warunek a + b = 7/5 i podnieś go do kwadratu: 1 + 2ab = 49/25.'
  - Wyznacz ab = 12/25, więc a i b są pierwiastkami równania x² − (7/5)x + 12/25 = 0.
  - 'Rozwiąż to równanie: a, b ∈ {3/5, 4/5}.'
  - 'Zauważ, że mniejszy kąt ostry leży naprzeciw krótszej przyprostokątnej, i oblicz jego tangens: (3/5)
    : (4/5) = 3/4.'
  answer:
    kind: MULTIPART
    parts:
    - name: przyprostokatne
      answer:
        kind: SET
        members:
        - \frac{3}{5}
        - \frac{4}{5}
    - name: tangens_mniejszego_kata
      answer:
        kind: SYMBOLIC
        latex: \frac{3}{4}
  checks:
