  exercise_type: ocena stwierdzenia o monotoniczności
  statement: 'Funkcja f jest określona wzorem f(x)=\frac{5}{x} dla x\neq 0. Uczeń napisał: „Ponieważ a=5>0,
    funkcja f jest malejąca w całej swojej dziedzinie, czyli w zbiorze \mathbb{R}\setminus\left\{0\right\}”.
    Oceń prawdziwość tego stwierdzenia (P — prawda, F — fałsz), oblicz f\left(-1\right) oraz f\left(1\right)
    i wyjaśnij, na czym polega błąd ucznia.'
  statement_latex: f(x)=\frac{5}{x},\qquad f\left(-1\right),\ f\left(1\right)
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: „Obie gałęzie hiperboli opadają, więc im większy argument, tym mniejsza wartość — funkcja jest malejąca w zbiorze \mathbb{R}\setminus\left\{0\right\}”. Ta odpowiedź (P) jest niepoprawna.
    KONTRPRZYKŁAD: f\left(-1\right)=\frac{5}{-1}=-5 oraz f\left(1\right)=\frac{5}{1}=5. Mamy -1<1, a mimo to f\left(-1\right)=-5<5=f\left(1\right), czyli przy większym argumencie wartość jest większa. Funkcja NIE jest więc malejąca w całej dziedzinie — stwierdzenie ucznia jest fałszywe (F).
    KOREKTA: monotoniczność orzeka się na przedziale zawartym w dziedzinie. Poprawnie: funkcja f jest malejąca w przedziale \left(-\infty,\ 0\right) i malejąca w przedziale \left(0,\ +\infty\right), ale nie w sumie tych przedziałów. Powodem jest przerwa w dziedzinie w punkcie x=0 (asymptota pionowa), przez którą wartości „przeskakują” z ujemnych na dodatnie.
  solution_steps:
  - 'Zapisz błędną tezę ucznia: f jest malejąca w \mathbb{R}\setminus\left\{0\right\}.'
  - Oblicz f\left(-1\right)=\frac{5}{-1}=-5 oraz f\left(1\right)=\frac{5}{1}=5.
  - Zauważ, że -1<1, a f\left(-1\right)<f\left(1\right) — to kontrprzykład, więc stwierdzenie jest fałszywe.
  - 'Sformułuj poprawny wniosek: f jest malejąca w \left(-\infty,\ 0\right) i malejąca w \left(0,\ +\infty\right),
    rozpatrywanych osobno.'
  answer:
    kind: MULTIPART
    parts:
