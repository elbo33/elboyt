  statement: Przekątna przekroju osiowego walca ma długość 12 i jest nachylona do płaszczyzny podstawy
    pod kątem \alpha = 30^{\circ}. Oblicz objętość tego walca oraz pole jego powierzchni bocznej. Zapisz
    obliczenia.
  statement_latex: 2r = 12\cdot\cos 30^{\circ},\qquad H = 12\cdot\sin 30^{\circ},\qquad V=\pi r^{2}H,\qquad
    P_{b}=2\pi r H
  solution: |-
    Przekrój osiowy walca jest prostokątem o wymiarach 2r \times H, a jego przekątna ma długość 12 i tworzy z bokiem długości 2r kąt 30^{\circ}.
    Z trójkąta prostokątnego o przeciwprostokątnej 12:
    2r = 12\cdot\cos 30^{\circ} = 12\cdot\frac{\sqrt{3}}{2} = 6\sqrt{3}, więc r = 3\sqrt{3};
    H = 12\cdot\sin 30^{\circ} = 12\cdot\frac{1}{2} = 6.
    Objętość: V = \pi r^{2}H = \pi\cdot\left(3\sqrt{3}\right)^{2}\cdot 6 = \pi\cdot 27\cdot 6 = 162\pi.
    Pole powierzchni bocznej: P_{b} = 2\pi r H = 2\pi\cdot 3\sqrt{3}\cdot 6 = 36\sqrt{3}\pi.
    Sprawdzenie: \left(2r\right)^{2}+H^{2} = 108 + 36 = 144 = 12^{2}. ✓
    Odp. V = 162\pi, P_{b} = 36\sqrt{3}\pi \approx 195,9.
  solution_steps:
  - Zauważ, że przekrój osiowy to prostokąt o bokach 2r i H, a jego przekątna ma długość 12.
  - Oblicz 2r = 12\cdot\cos 30^{\circ} = 6\sqrt{3}, czyli r = 3\sqrt{3}.
  - Oblicz H = 12\cdot\sin 30^{\circ} = 6.
  - Podstaw do V = \pi r^{2} H = \pi\cdot 27\cdot 6 = 162\pi.
  - Podstaw do P_{b} = 2\pi r H = 2\pi\cdot 3\sqrt{3}\cdot 6 = 36\sqrt{3}\pi.
  answer:
    kind: MULTIPART
    parts:
    - name: V
      answer:
        kind: SYMBOLIC
        latex: 162\pi
    - name: P_b
      answer:
        kind: SYMBOLIC
        latex: 36\sqrt{3}\pi
