- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: zliczanie rozwiązań całkowitych z podziałem na przypadki
  statement: Dane są dwa odcinki o długościach 5 i 12 oraz odcinek o długości x, gdzie x jest liczbą całkowitą
    dodatnią. Wyznacz wszystkie wartości x, dla których z tych trzech odcinków można zbudować trójkąt
    rozwartokątny, oraz podaj, ile jest takich liczb x. W rozwiązaniu wyznacz też przedział wszystkich
    x (niekoniecznie całkowitych), dla których trójkąt o bokach 5, 12, x w ogóle istnieje.
  statement_latex: 5^2 + x^2 < 12^2 \quad \text{lub} \quad 5^2 + 12^2 < x^2
  solution: |-
    Krok 1. Warunek istnienia trójkąta. Muszą zachodzić: 5 + 12 > x, 5 + x > 12 oraz 12 + x > 5. Dwie pierwsze dają x < 17 i x > 7, trzecia jest wtedy spełniona. Zatem trójkąt istnieje dokładnie dla x \in \left(7,\ 17\right), a liczby całkowite z tego przedziału to 8, 9, 10, 11, 12, 13, 14, 15, 16.

    Krok 2. Który bok jest najdłuższy? To zależy od x, więc rozpatrujemy dwa przypadki.

    Przypadek A: x > 12, czyli najdłuższym bokiem jest x. Trójkąt jest rozwartokątny, gdy 5^2 + 12^2 < x^2, czyli 169 < x^2, czyli x > 13. Wśród liczb całkowitych mniejszych od 17 daje to x \in \{14, 15, 16\}. (Dla x = 13 mamy równość — trójkąt jest prostokątny, a nie rozwartokątny.)

    Przypadek B: x \le 12, czyli najdłuższym bokiem jest 12. Trójkąt jest rozwartokątny, gdy 5^2 + x^2 < 12^2, czyli x^2 < 119. Ponieważ 10^2 = 100 < 119, a 11^2 = 121 > 119, warunek spełniają liczby całkowite x = 8, 9, 10 (pamiętamy, że musi być x > 7).

    Krok 3. Łącznie x \in \{8, 9, 10, 14, 15, 16\} — jest 6 takich liczb.
  solution_steps:
