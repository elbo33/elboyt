- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: tożsamości pochodne i usuwanie niewymierności
  statement: Liczby rzeczywiste a oraz b spełniają warunki a+b=9 i a\cdot b=14. a) Oblicz a^{2}+b^{2}.
    b) Oblicz \left(a-b\right)^{2}. c) Usuń niewymierność z mianownika ułamka \frac{5}{4-\sqrt{11}}.
  statement_latex: a+b=9,\quad a\cdot b=14,\qquad \frac{5}{4-\sqrt{11}}
  solution: |-
    a) Ze wzoru na kwadrat sumy \left(a+b\right)^{2}=a^{2}+2ab+b^{2} otrzymujemy
    a^{2}+b^{2}=\left(a+b\right)^{2}-2\cdot a\cdot b=9^{2}-2\cdot 14=81-28=53.
    b) \left(a-b\right)^{2}=a^{2}-2ab+b^{2}=53-28=25. Równoważnie \left(a-b\right)^{2}=\left(a+b\right)^{2}-4ab=81-56=25.
    c) Mnożymy licznik i mianownik przez wyrażenie sprzężone 4+\sqrt{11}:
    \frac{5}{4-\sqrt{11}}=\frac{5\cdot\left(4+\sqrt{11}\right)}{\left(4-\sqrt{11}\right)\cdot\left(4+\sqrt{11}\right)}=\frac{5\cdot\left(4+\sqrt{11}\right)}{16-11}=\frac{5\cdot\left(4+\sqrt{11}\right)}{5}=4+\sqrt{11}.
  solution_steps:
  - a) Skorzystaj z tożsamości a^{2}+b^{2}=\left(a+b\right)^{2}-2ab.
  - 'a) Podstaw dane: 81-28=53.'
  - 'b) Skorzystaj z \left(a-b\right)^{2}=\left(a+b\right)^{2}-4ab i podstaw: 81-56=25.'
  - 'c) Wypisz sprzężenie mianownika: 4+\sqrt{11}.'
  - c) Pomnóż licznik i mianownik przez 4+\sqrt{11}; w mianowniku otrzymasz 16-11=5.
  - 'c) Skróć ułamek: wynik to 4+\sqrt{11}.'
  answer:
    kind: MULTIPART
    parts:
    - name: a2+b2
      answer:
        kind: NUMERIC
        value: 53.0
    - name: (a-b)^2
      answer:
        kind: NUMERIC
        value: 25.0
    - name: usuniecie_niewymiernosci
      answer:
        kind: SYMBOLIC
        latex: 4+\sqrt{11}
  checks:
  - kind: evaluate
    expr: 9^{2}-2\cdot 14
    part: a2+b2
  - kind: evaluate
    expr: 9^{2}-4\cdot 14
    part: (a-b)^2
  - kind: evaluate
    expr: \frac{5}{4-\sqrt{11}}
    part: usuniecie_niewymiernosci
  skills:
  - tożsamości pochodne
  - kwadrat sumy
  - wyrażenia sprzężone
  - usuwanie niewymierności z mianownika
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [a2+b2] SymPy solved it fresh: 53.0 vs 53.0 (tol 1e-09) ; [(a-b)^2]
      SymPy solved it fresh: 25.0 vs 25.0 (tol 1e-09) ; [usuniecie_niewymiernosci] SymPy solved it fresh:
      7.3166247903554 vs 7.3166247903554 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: upraszczanie wyrażeń algebraicznych i obliczanie wartości
  statement: Dane jest wyrażenie W(x) = \left(3x-2\right)^{2} - \left(2x+5\right)\cdot\left(2x-5\right)
    + 2\cdot\left(x-3\right)^{2}. a) Zapisz wyrażenie W(x) w najprostszej postaci (jako trójmian uporządkowany
    malejąco względem potęg x). b) Oblicz W\left(\sqrt{2}\right) i wynik podaj w najprostszej postaci.
  statement_latex: W(x) = \left(3x-2\right)^{2} - \left(2x+5\right)\cdot\left(2x-5\right) + 2\cdot\left(x-3\right)^{2}
  solution: |-
    Rozwijamy każdy składnik osobno.
    \left(3x-2\right)^{2} = 9x^{2} - 12x + 4 (bo \left(3x\right)^{2} = 9x^{2}, podwojony iloczyn 2\cdot 3x\cdot 2 = 12x, \left(-2\right)^{2}=4).
    \left(2x+5\right)\cdot\left(2x-5\right) = \left(2x\right)^{2} - 5^{2} = 4x^{2} - 25 (różnica kwadratów).
    2\cdot\left(x-3\right)^{2} = 2\cdot\left(x^{2}-6x+9\right) = 2x^{2} - 12x + 18.
    Uwzględniamy minus przed nawiasem: -\left(4x^{2}-25\right) = -4x^{2} + 25.
    Stąd W(x) = 9x^{2} - 12x + 4 - 4x^{2} + 25 + 2x^{2} - 12x + 18 = 7x^{2} - 24x + 47.
    b) W\left(\sqrt{2}\right) = 7\cdot\left(\sqrt{2}\right)^{2} - 24\cdot\sqrt{2} + 47 = 14 - 24\sqrt{2} + 47 = 61 - 24\sqrt{2}.
    Kontrola dla x = 1: z wyjściowego wzoru \left(1\right)^{2} - \left(7\right)\cdot\left(-3\right) + 2\cdot 4 = 1 + 21 + 8 = 30, a z wyniku 7 - 24 + 47 = 30. Zgadza się.
  solution_steps:
  - Rozwiń \left(3x-2\right)^{2} = 9x^{2}-12x+4.
  - 'Zastosuj różnicę kwadratów: \left(2x+5\right)\cdot\left(2x-5\right) = 4x^{2}-25.'
  - Rozwiń 2\cdot\left(x-3\right)^{2} = 2x^{2}-12x+18.
  - 'Zmień znaki wyrazów po minusie przed nawiasem i zredukuj wyrazy podobne: W(x) = 7x^{2}-24x+47.'
  - 'Podstaw x = \sqrt{2}: 7\cdot 2 - 24\sqrt{2} + 47 = 61 - 24\sqrt{2}.'
  answer:
    kind: MULTIPART
    parts:
    - name: uproszczenie
      answer:
        kind: SYMBOLIC
        latex: 7x^{2} - 24x + 47
    - name: wartosc_dla_pierwiastek_z_2
      answer:
        kind: SYMBOLIC
        latex: 61 - 24\sqrt{2}
  checks:
  - kind: simplify
    expr: \left(3x-2\right)^{2} - \left(2x+5\right)\cdot\left(2x-5\right) + 2\cdot\left(x-3\right)^{2}
    part: uproszczenie
  - kind: evaluate
    expr: 7\cdot\left(\sqrt{2}\right)^{2} - 24\cdot\sqrt{2} + 47
    part: wartosc_dla_pierwiastek_z_2
  skills:
