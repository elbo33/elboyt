  statement: Średnica podstawy stożka obrotowego ma długość 16 cm, a wysokość tego stożka jest równa 15
    cm. Oblicz objętość oraz pole powierzchni całkowitej tego stożka. Zapisz obliczenia i pamiętaj o jednostkach.
  statement_latex: 2r=16\ \mathrm{cm},\quad H=15\ \mathrm{cm},\quad V=\frac{1}{3}\cdot\pi\cdot r^2\cdot
    H,\quad P_c=\pi\cdot r\cdot\left(r+l\right)
  solution: |-
    Ze średnicy wyznaczamy promień: r = \frac{16}{2} = 8 (cm).
    Tworząca: l^2 = r^2 + H^2 = 8^2 + 15^2 = 64 + 225 = 289, więc l = 17 (cm).
    Objętość: V = \frac{1}{3}\pi r^2 H = \frac{1}{3}\cdot\pi\cdot 64\cdot 15 = 320\pi\ \mathrm{cm}^3.
    Pole całkowite: P_c = \pi r(r+l) = \pi\cdot 8\cdot(8+17) = 200\pi\ \mathrm{cm}^2.
    Odpowiedź: V = 320\pi\ \mathrm{cm}^3, P_c = 200\pi\ \mathrm{cm}^2.
  solution_steps:
  - 'Podziel średnicę przez 2: r = 8 cm.'
  - Z twierdzenia Pitagorasa l = \sqrt{8^2+15^2} = 17 cm.
  - Oblicz objętość V = \frac{1}{3}\cdot\pi\cdot 8^2\cdot 15 = 320\pi\ \mathrm{cm}^3.
  - Oblicz pole całkowite P_c = \pi\cdot 8\cdot\left(8+17\right) = 200\pi\ \mathrm{cm}^2.
  answer:
    kind: MULTIPART
    parts:
    - name: objętość
      answer:
        kind: SYMBOLIC
        latex: 320\pi
    - name: pole powierzchni całkowitej
