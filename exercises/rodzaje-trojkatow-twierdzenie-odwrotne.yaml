  - 'Wskazuję błąd: a² + b² < c² oznacza kąt rozwarty naprzeciw boku c.'
  - 'Sprawdzam istnienie trójkąta: 4 + 7 = 11 > 9.'
  - 'Stwierdzam: 4² + 7² = 65 < 81 = 9², więc trójkąt jest rozwartokątny.'
  - Obliczam cos γ = (16 + 49 − 81)/(2·4·7) = −16/56 = −2/7 < 0, co potwierdza kąt rozwarty.
  answer:
    kind: MULTIPART
    parts:
    - name: rodzaj trójkąta
