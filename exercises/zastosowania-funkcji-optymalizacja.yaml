- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 3
  exercise_type: optymalizacja – minimum sumy pól (zmienna niepodana w treści)
  statement: Odcinek o długości 10 podzielono punktem na dwie części i na każdej z tych części, jako na
    boku, zbudowano kwadrat. Wyznacz długości obu części, dla których suma pól tych dwóch kwadratów jest
    najmniejsza, oraz oblicz tę najmniejszą sumę pól. Zapisz obliczenia.
  statement_latex: S\left(x\right)=x^{2}+\left(10-x\right)^{2}=2x^{2}-20x+100,\qquad x\in\left(0,10\right)
  solution: |-
    Niech x oznacza długość jednej z części odcinka. Wtedy druga część ma długość 10-x.
    Dziedzina: obie części są dodatnie, czyli x>0 oraz 10-x>0, zatem x\in\left(0,10\right).
    Suma pól kwadratów zbudowanych na tych częściach: S\left(x\right)=x^{2}+\left(10-x\right)^{2}=x^{2}+100-20x+x^{2}=2x^{2}-20x+100.
    Jest to funkcja kwadratowa o współczynniku a=2>0, więc przyjmuje wartość najmniejszą w wierzchołku.
    p=-\frac{-20}{2\cdot 2}=5, przy czym 5\in\left(0,10\right).
    q=S\left(5\right)=2\cdot 25-20\cdot 5+100=50-100+100=50.
    Uzasadnienie bez pochodnych: S\left(x\right)=2\left(x-5\right)^{2}+50, a ponieważ \left(x-5\right)^{2}\geq 0, to S\left(x\right)\geq 50, z równością tylko dla x=5.
    Odpowiedź: obie części powinny mieć długość 5 (odcinek dzielimy na połowy), a najmniejsza suma pól kwadratów wynosi 50.
  solution_steps:
  - Oznacz przez x długość jednej części; druga część ma długość 10-x.
  - 'Ustal dziedzinę: x>0 i 10-x>0, czyli x ∈ (0,10).'
  - 'Zapisz sumę pól: S(x)=x²+(10-x)² i wymnóż: S(x)=2x²-20x+100.'
  - Zauważ, że a=2>0, więc minimum jest w wierzchołku; oblicz p=5 i sprawdź p ∈ (0,10).
  - Oblicz q=S(5)=50 (lub użyj postaci kanonicznej S(x)=2(x-5)²+50).
  - 'Podaj odpowiedź: części po 5, najmniejsza suma pól 50.'
  answer:
    kind: MULTIPART
    parts:
    - name: x
      answer:
        kind: NUMERIC
        value: 5.0
    - name: S_min
      answer:
        kind: NUMERIC
        value: 50.0
  checks:
  - kind: evaluate
    expr: \frac{20}{2\cdot 2}
    part: x
  - kind: evaluate
    expr: 2\cdot 5^{2}-20\cdot 5+100
    part: S_min
  stated_model:
    variable: x
    objective_latex: S\left(x\right)=2x^{2}-20x+100
    domain_lo: '0'
    domain_hi: '10'
    goal: min
    constraint_used: suma długości części równa 10
  skills:
  - wprowadzenie zmiennej niezależnej
  - złożenie funkcji celu
  - dziedzina otwarta z warunku dodatniości
  - wierzchołek jako minimum przy a>0
