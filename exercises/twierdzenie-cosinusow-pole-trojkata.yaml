      0.125 (tol 1e-09) ; [pole] SymPy solved it fresh: 9.921567416492215 vs 9.921567416492215 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: Kąt wyznaczony z pola (dwie możliwości) i trzeci bok z twierdzenia cosinusów
  statement: W trójkącie ABC dane są boki |AB| = 10 i |AC| = 6. Pole tego trójkąta jest równe 15\sqrt{3},
    a kąt BAC jest rozwarty. Oblicz miarę kąta BAC oraz długość boku BC. Zapisz obliczenia.
  statement_latex: 15\sqrt{3} = \frac{1}{2}\cdot 10\cdot 6\cdot\sin\alpha,\qquad |BC|^2 = 10^2 + 6^2 -
    2\cdot 10\cdot 6\cdot\cos\alpha
  solution: |-
    Kąt BAC = \alpha leży między bokami AB = 10 i AC = 6, więc do pola stosujemy wzór P = \frac{1}{2}\cdot|AB|\cdot|AC|\cdot\sin\alpha.

    15\sqrt{3} = \frac{1}{2}\cdot 10\cdot 6\cdot\sin\alpha = 30\sin\alpha, stąd \sin\alpha = \frac{15\sqrt{3}}{30} = \frac{\sqrt{3}}{2}.

    W przedziale (0^\circ;\,180^\circ) równanie \sin\alpha = \frac{\sqrt{3}}{2} ma dwa rozwiązania: \alpha = 60^\circ oraz \alpha = 120^\circ. Z treści zadania kąt BAC jest rozwarty, więc \alpha = 120^\circ i \cos\alpha = -\frac{1}{2}.

    Z twierdzenia cosinusów (bok BC leży naprzeciw kąta \alpha):
    |BC|^2 = 10^2 + 6^2 - 2\cdot 10\cdot 6\cdot\left(-\frac{1}{2}\right) = 100 + 36 + 60 = 196,
    zatem |BC| = 14.

    Kontrola: 14 < 10 + 6 = 16 (nierówność trójkąta) i najdłuższy bok leży naprzeciw kąta rozwartego — wynik jest spójny.
  solution_steps:
  - Zauważ, że kąt BAC jest zawarty między danymi bokami, więc P = \frac{1}{2}\cdot 10\cdot 6\cdot\sin\alpha.
  - Wyznacz \sin\alpha = \frac{2\cdot 15\sqrt{3}}{10\cdot 6} = \frac{\sqrt{3}}{2}.
  - 'Wypisz oba kąty spełniające to równanie: 60^\circ i 120^\circ.'
  - Odrzuć 60^\circ, bo kąt BAC ma być rozwarty; przyjmij \alpha = 120^\circ, \cos\alpha = -\frac{1}{2}.
  - 'Zastosuj twierdzenie cosinusów: |BC|^2 = 100 + 36 + 60 = 196, więc |BC| = 14.'
  - 'Sprawdź nierówność trójkąta: 14 < 16.'
  answer:
    kind: MULTIPART
    parts:
    - name: kat_BAC_w_stopniach
      answer:
        kind: NUMERIC
        value: 120.0
    - name: dlugosc_BC
      answer:
        kind: NUMERIC
        value: 14.0
  checks:
  - kind: evaluate
    expr: 180 - \frac{180}{\pi}\cdot\arcsin\left(\frac{\sqrt{3}}{2}\right)
    part: kat_BAC_w_stopniach
  - kind: evaluate
    expr: \sqrt{10^2 + 6^2 - 2\cdot 10\cdot 6\cdot\left(-\frac{1}{2}\right)}
    part: dlugosc_BC
  skills:
