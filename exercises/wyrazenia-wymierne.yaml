  exercise_type: wyznaczanie dziedziny
  statement: Dane jest wyrażenie \frac{x+5}{x^{2}-7\cdot x}. Wypisz wszystkie liczby rzeczywiste, które
    nie należą do dziedziny tego wyrażenia.
  statement_latex: \frac{x+5}{x^{2}-7\cdot x}
  solution: |-
    Na dziedzinę wpływa wyłącznie mianownik. Rozkładamy go na czynniki: x^{2}-7\cdot x = x\cdot\left(x-7\right).
    Warunek dziedziny: x\cdot\left(x-7\right)\neq 0, czyli x\neq 0 i x\neq 7.
    Zatem D = \mathbb{R}\setminus\{0,\ 7\}, a liczbami wykluczonymi są 0 oraz 7.
    Uwaga: licznik x+5 nie nakłada żadnych warunków.
  solution_steps:
  - Zauważ, że warunek dotyczy tylko mianownika.
  - 'Rozłóż mianownik: x^{2}-7\cdot x = x\cdot\left(x-7\right).'
  - 'Przyrównaj każdy czynnik do zera: x = 0 lub x-7 = 0, czyli x = 7.'
  - 'Zapisz dziedzinę: D = \mathbb{R}\setminus\{0,\ 7\}.'
  answer:
    kind: SET
    members:
    - '0'
    - '7'
  checks:
  - kind: solve_equation
    expr: x^{2}-7\cdot x = 0
  skills:
  - rozkład mianownika na czynniki
  - wyznaczanie dziedziny wyrażenia wymiernego
