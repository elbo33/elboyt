  statement: Powierzchnia boczna pewnego stożka obrotowego po rozwinięciu na płaszczyznę jest wycinkiem
    koła o promieniu 15 i kącie środkowym 216^\circ. Oblicz promień podstawy, wysokość oraz objętość tego
    stożka. Zapisz obliczenia.
  statement_latex: l=15,\quad \varphi=216^\circ,\quad \frac{\varphi}{360^\circ}=\frac{r}{l}
  solution: |-
    Promień wycinka jest tworzącą stożka: l = 15.
    Długość łuku wycinka równa się obwodowi podstawy, czyli \frac{\varphi}{360^\circ}\cdot 2\pi l = 2\pi r, stąd r = l\cdot\frac{\varphi}{360^\circ} = 15\cdot\frac{216}{360} = 9.
    Wysokość: H = \sqrt{l^2-r^2} = \sqrt{225-81} = \sqrt{144} = 12.
    Objętość: V = \frac{1}{3}\pi r^2 H = \frac{1}{3}\cdot\pi\cdot 81\cdot 12 = 324\pi.
    Kontrola: P_b = \pi r l = 135\pi oraz pole wycinka = \frac{216}{360}\cdot\pi\cdot 15^2 = 135\pi. ✓
  solution_steps:
  - 'Zapisz, że promień wycinka to tworząca: l = 15.'
  - 'Z równości łuku i obwodu podstawy: r = 15\cdot\frac{216}{360} = 9.'
  - Oblicz wysokość H = \sqrt{15^2-9^2} = 12.
  - 'Podstaw do wzoru: V = \frac{1}{3}\cdot\pi\cdot 9^2\cdot 12 = 324\pi.'
  answer:
    kind: MULTIPART
    parts:
    - name: promień podstawy
      answer:
        kind: NUMERIC
        value: 9.0
    - name: wysokość
      answer:
        kind: NUMERIC
        value: 12.0
    - name: objętość
      answer:
        kind: SYMBOLIC
        latex: 324\pi
  checks:
  - kind: evaluate
    expr: 15\cdot\frac{216}{360}
    part: promień podstawy
  - kind: evaluate
    expr: \sqrt{15^2-\left(15\cdot\frac{216}{360}\right)^2}
    part: wysokość
  - kind: evaluate
    expr: \frac{1}{3}\cdot\pi\cdot 9^2\cdot 12
    part: objętość
  skills:
  - kąt wycinka phi=360 r/l
  - l^2=r^2+H^2
  - objętość stożka
