- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: zadanie problemowe (przekątne prostokąta, wzór skróconego mnożenia)
  statement: Przekątne prostokąta ABCD przecinają się w punkcie S, przy czym |AS| = 5. Obwód tego prostokąta
    jest równy 28. Oblicz pole prostokąta ABCD. Zapisz obliczenia.
  statement_latex: a+b=\frac{28}{2},\qquad a^{2}+b^{2}=\left(2\cdot 5\right)^{2},\qquad P=a\cdot b
  solution: |-
    Oznaczmy |AB| = a, |BC| = b.

    Krok 1. W prostokącie przekątne są równe i dzielą się na połowy, więc |AC| = |BD| = 2\cdot|AS| = 2\cdot 5 = 10.

    Krok 2. Z obwodu: 2a+2b = 28, czyli a+b = 14.

    Krok 3. Trójkąt ABC jest prostokątny (kąt przy B jest prosty), więc z twierdzenia Pitagorasa
    a^{2}+b^{2} = 10^{2} = 100.

    Krok 4. Nie musimy wyznaczać osobno a i b. Korzystamy ze wzoru skróconego mnożenia:
    \left(a+b\right)^{2} = a^{2}+2ab+b^{2},
    14^{2} = 100 + 2ab,
    196 - 100 = 2ab,
    ab = \frac{96}{2} = 48.

    Zatem P = a\cdot b = 48.

    Sprawdzenie: a+b = 14 i ab = 48 dają boki 6 i 8; wtedy \sqrt{6^{2}+8^{2}} = 10 ✓ oraz obwód 2\cdot(6+8) = 28 ✓.

    Odpowiedź: pole prostokąta ABCD jest równe 48.
  solution_steps:
  - 'Wprowadź oznaczenia boków: |AB| = a, |BC| = b.'
  - 'Z własności przekątnych prostokąta: przekątna d = 2·|AS| = 10.'
  - 'Z obwodu: a + b = 14; z twierdzenia Pitagorasa: a² + b² = 100.'
  - 'Podnieś a + b = 14 do kwadratu: 196 = 100 + 2ab, więc ab = 48.'
  - 'Pole P = ab = 48 (kontrola: boki 6 i 8).'
  answer:
    kind: NUMERIC
    value: 48.0
  checks:
  - kind: evaluate
    expr: \frac{\left(\frac{28}{2}\right)^{2}-\left(2\cdot 5\right)^{2}}{2}
