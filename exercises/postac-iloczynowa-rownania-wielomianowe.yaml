      x\\cdot\\left(x+2\\right)=4\\cdot 3\\cdot x'') — human review'
- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: wyznaczanie współczynników wielomianu z jego pierwiastków i rozwiązanie równania
  statement: Dany jest wielomian W(x)=x^{3}+a x^{2}+b x+12, gdzie a i b są pewnymi liczbami rzeczywistymi.
    Wiadomo, że liczby 2 oraz \left(-3\right) są pierwiastkami tego wielomianu. Wyznacz a i b, a następnie
    podaj wszystkie rozwiązania równania W(x)=0. Zapisz obliczenia.
  statement_latex: W(x)=x^{3}+a\cdot x^{2}+b\cdot x+12,\qquad W\left(2\right)=0,\quad W\left(-3\right)=0
  solution: |-
    Skoro 2 jest pierwiastkiem, to W\left(2\right)=0:
    2^3+a\cdot 2^2+b\cdot 2+12=0, czyli 8+4a+2b+12=0, a po uproszczeniu 2a+b=-10.

    Skoro \left(-3\right) jest pierwiastkiem, to W\left(-3\right)=0:
    \left(-3\right)^3+a\cdot\left(-3\right)^2+b\cdot\left(-3\right)+12=0, czyli -27+9a-3b+12=0, a po uproszczeniu 3a-b=5.

    Dodając stronami równania 2a+b=-10 oraz 3a-b=5, otrzymujemy 5a=-5, czyli a=-1. Wtedy b=-10-2\cdot\left(-1\right)=-8.

    Zatem W(x)=x^{3}-x^{2}-8x+12.

    Wielomian jest stopnia trzeciego, ma współczynnik przy x^3 równy 1 i pierwiastki 2 oraz \left(-3\right), więc można go zapisać w postaci
    W(x)=\left(x-2\right)\cdot\left(x+3\right)\cdot\left(x-c\right)
    dla pewnej liczby rzeczywistej c. Porównujemy wyrazy wolne obu postaci: \left(-2\right)\cdot 3\cdot\left(-c\right)=12, czyli 6c=12, skąd c=2.

    Zatem W(x)=\left(x-2\right)^{2}\cdot\left(x+3\right) (sprawdzenie przez wymnożenie: \left(x^2-4x+4\right)\left(x+3\right)=x^3-x^2-8x+12).

    Równanie \left(x-2\right)^{2}\cdot\left(x+3\right)=0 daje x-2=0 lub x+3=0, czyli x=2 (pierwiastek dwukrotny) lub x=-3. Krotność nie mnoży odpowiedzi, więc równanie ma dokładnie dwa różne rozwiązania.

    Odpowiedź: a=-1, b=-8, x\in\{-3,2\}.
  solution_steps:
  - Z warunku W\left(2\right)=0 otrzymaj 8+4a+2b+12=0, czyli 2a+b=-10.
  - Z warunku W\left(-3\right)=0 otrzymaj -27+9a-3b+12=0, czyli 3a-b=5.
  - 'Rozwiąż układ: 5a=-5, więc a=-1 oraz b=-8; zatem W(x)=x^{3}-x^{2}-8x+12.'
