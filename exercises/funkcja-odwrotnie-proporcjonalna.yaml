  statement: 'Funkcja f jest określona wzorem f(x)=\frac{-9}{x} dla x\neq 0. Uczeń napisał: „f\left(0\right)=\frac{-9}{0}=0,
    zatem miejscem zerowym funkcji f jest liczba 0”. Podaj zbiór miejsc zerowych funkcji f, rozwiąż równanie
    f(x)=3 i wyjaśnij, na czym polega błąd ucznia.'
  statement_latex: f(x)=\frac{-9}{x},\qquad \frac{-9}{x}=0,\qquad \frac{-9}{x}=3
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: „Podstawiam x=0 i otrzymuję \frac{-9}{0}=0, więc miejscem zerowym jest x=0”. Odpowiedź „miejscem zerowym jest 0” jest niepoprawna z dwóch powodów.
    KOREKTA: po pierwsze dzielenie przez zero jest niewykonalne, więc f\left(0\right) w ogóle nie istnieje — liczba 0 nie należy do dziedziny D=\mathbb{R}\setminus\left\{0\right\}. Po drugie równanie \frac{-9}{x}=0 jest sprzeczne: ułamek jest równy zeru tylko wtedy, gdy jego licznik jest zerem, a tutaj licznik wynosi -9\neq 0. Zatem funkcja f nie ma miejsc zerowych, a zbiór jej miejsc zerowych jest pusty (\emptyset); oś OX jest asymptotą poziomą wykresu.
    RÓWNANIE f(x)=3: zakładamy x\neq 0 i mnożymy przez x: -9=3\cdot x, stąd x=\frac{-9}{3}=-3. Sprawdzenie: f\left(-3\right)=\frac{-9}{-3}=3.
  solution_steps:
  - 'Wskaż błąd: dzielenie przez zero jest niewykonalne, f\left(0\right) nie istnieje, bo 0\notin D.'
  - Zauważ, że równanie \frac{-9}{x}=0 jest sprzeczne, bo licznik -9\neq 0.
  - Zapisz, że zbiór miejsc zerowych funkcji f jest pusty.
  - 'Rozwiąż \frac{-9}{x}=3: -9=3\cdot x, czyli x=-3.'
  - 'Sprawdź: f\left(-3\right)=\frac{-9}{-3}=3.'
  answer:
    kind: MULTIPART
    parts:
    - name: zbior miejsc zerowych
      answer:
        kind: SET
        latex: \emptyset
    - name: rozwiazanie rownania f(x)=3
