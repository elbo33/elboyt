- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie kapitału końcowego (procent składany)
  statement: Klient wpłacił do banku 5000 zł na lokatę trzyletnią. Po każdym rocznym okresie oszczędzania
    bank dolicza odsetki w wysokości 4% od kwoty bieżącego kapitału znajdującego się na lokacie (procent
    składany). Oblicz kwotę zgromadzoną na tej lokacie po 3 latach oszczędzania (bez uwzględniania podatków).
    Wynik podaj z dokładnością do 1 grosza.
  statement_latex: K_{3}=5000\cdot\left(1+\frac{4}{100}\right)^{3}
  solution: |-
    Kapitał początkowy: K_0 = 5000 zł. Jednym okresem kapitalizacji jest rok, stopa jednego okresu to 4%, czyli 0,04. Czynnik wzrostu: q = 1 + 0,04 = 1,04. Liczba okresów: n = 3.
    Model: K_3 = 5000·(1,04)^3.
    (1,04)^2 = 1,0816, (1,04)^3 = 1,124864.
    K_3 = 5000·1,124864 = 5624,32 zł.
    Odpowiedź: po trzech latach na lokacie będzie 5624,32 zł.
  solution_steps:
  - 'Zapisz dane: K_0 = 5000 zł, stopa jednego okresu 4%, n = 3 lata.'
  - 'Zamień procent na czynnik wzrostu: q = 1 + 4/100 = 1,04.'
  - 'Zapisz model procentu składanego: K_3 = 5000·(1,04)^3.'
  - Oblicz (1,04)^3 = 1,124864.
  - 'Wykonaj mnożenie: 5000·1,124864 = 5624,32 zł.'
  answer:
    kind: NUMERIC
    value: 5624.32
    tol: 0.01
    latex: 5624{,}32\ \text{zł}
  checks:
  - kind: evaluate
    expr: 5000\cdot\left(1+\frac{4}{100}\right)^{3}
  skills:
  - zamiana procentu na czynnik wzrostu
  - wzór K_n = K_0·q^n
  - kapitalizacja roczna
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 5624.32 vs 5624.32 (tol 0.01)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 2
  exercise_type: odczytanie parametrów modelu wykładniczego
  statement: Wartość pewnej maszyny po n latach od zakupu (w złotych) opisuje wzór W\left(n\right)=60000\cdot\left(0{,}88\right)^{n},
    gdzie n jest liczbą całkowitą nieujemną. Podaj wartość maszyny w chwili zakupu oraz oblicz, o ile
    procent maleje wartość tej maszyny w ciągu jednego roku.
  statement_latex: W\left(n\right)=60000\cdot\left(0{,}88\right)^{n}
  solution: |-
    Wartość początkową odczytujemy, podstawiając n = 0: W(0) = 60000·(0,88)^0 = 60000·1 = 60000 zł.
    Czynnik jednego roku wynosi q = 0,88 i jest mniejszy od 1, więc wartość maleje. Zapiszmy q = 1 − p/100:
    1 − p/100 = 0,88, zatem p/100 = 0,12, czyli p = 12.
    Odpowiedź: maszyna kosztowała 60000 zł i co roku traci 12% swojej aktualnej wartości.
  solution_steps:
  - 'Podstaw n = 0, aby odczytać wartość początkową: W(0) = 60000 zł.'
  - Zauważ, że czynnik q = 0,88 < 1, więc model opisuje spadek.
  - Rozwiąż 1 − p/100 = 0,88, otrzymując p = 12.
  - 'Sformułuj wniosek: co roku wartość maleje o 12% wartości aktualnej.'
  answer:
    kind: MULTIPART
    parts:
    - name: wartosc_poczatkowa
      answer:
        kind: NUMERIC
        value: 60000.0
        tol: 1.0e-06
        latex: 60000\ \text{zł}
    - name: roczny_spadek_procent
      answer:
        kind: NUMERIC
        value: 12.0
        tol: 1.0e-06
        latex: 12\%
  checks:
  - kind: evaluate
    expr: 60000\cdot\left(\frac{88}{100}\right)^{0}
    var: n
    part: wartosc_poczatkowa
  - kind: evaluate
    expr: \left(1-\frac{88}{100}\right)\cdot 100
    var: p
    part: roczny_spadek_procent
  skills:
  - interpretacja modelu W(n)=W_0·q^n
  - odczyt procentu zmiany z czynnika
