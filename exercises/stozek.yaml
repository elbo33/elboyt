  statement: Kąt rozwarcia stożka obrotowego (kąt przy wierzchołku jego przekroju osiowego) ma miarę 60^\circ,
    a tworząca tego stożka ma długość 10. Uczeń zapisał r = 10\cdot\sin 60^\circ = 5\sqrt{3} oraz H =
    10\cdot\cos 60^\circ = 5 i stąd obliczył objętość. Wyjaśnij błąd i oblicz poprawną objętość stożka.
  statement_latex: 2\alpha=60^\circ,\quad l=10,\quad r=l\cdot\sin\alpha,\quad H=l\cdot\cos\alpha
  solution: |-
    Błędne rozumowanie: uczeń użył całego kąta rozwarcia 60^\circ jako kąta trójkąta prostokątnego i otrzymał r = 5\sqrt{3}, H = 5, a więc V = \frac{1}{3}\pi\cdot 75\cdot 5 = 125\pi.
    Dlaczego to źle: wysokość stożka dzieli przekrój osiowy (trójkąt równoramienny) na dwa przystające trójkąty prostokątne, a więc dzieli kąt rozwarcia NA POŁOWĘ. W trójkącie prostokątnym o bokach r, H, l pracujemy z kątem \alpha = \frac{60^\circ}{2} = 30^\circ.
    Poprawnie: r = l\cdot\sin 30^\circ = 10\cdot\frac{1}{2} = 5, H = l\cdot\cos 30^\circ = 10\cdot\frac{\sqrt{3}}{2} = 5\sqrt{3}.
