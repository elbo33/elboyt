  statement: |-
    Prostopadłościan ma podstawę, która jest kwadratem, a jego objętość jest równa 32 cm\(^3\).
    a) Wyznacz wzór na pole powierzchni bocznej \( P \) tego prostopadłościanu w zależności od długości krawędzi podstawy oraz podaj dziedzinę tak otrzymanej funkcji.
