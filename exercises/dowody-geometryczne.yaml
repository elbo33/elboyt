  - stosunek pól figur podobnych
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: a) dowód podobieństwa · 2/2 other parts solved fresh'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: ocena błędnego rozumowania
  statement: 'W trójkącie ABC dane są |∡BAC| = 58° oraz |∡ABC| = 63°. Uczeń miał obliczyć miarę kąta ACB
    i napisał: „Narysowałem ten trójkąt i widzę, że boki AB i BC są jednakowej długości, więc trójkąt
    jest równoramienny, a zatem |∡ACB| = |∡BAC| = 58°”. Wskaż błąd w tym rozumowaniu i oblicz poprawnie
    miarę kąta ACB.'
  statement_latex: '|\sphericalangle ACB| = 180^\circ - 58^\circ - 63^\circ'
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: „na rysunku |AB| = |BC|, więc kąty przy podstawie AC są równe i |∡ACB| = 58°”. Wynik ucznia: 58°.

    DLACZEGO TO BŁĄD: rysunek jest zawsze niedokładny i przedstawia tylko jeden, przypadkowy obraz sytuacji; zmierzenie linijką nie jest uzasadnieniem matematycznym. W założeniu nie ma żadnej informacji o równości boków — jest tylko informacja o dwóch kątach. Co więcej, wynik ucznia sam sobie przeczy: gdyby było |AB| = |BC|, to kąty przy podstawie AC (czyli kąty BAC i BCA) byłyby równe, ale wtedy suma kątów wynosiłaby 58° + 63° + 58° = 179° ≠ 180°, co jest niemożliwe.

    POPRAWNE ROZWIĄZANIE: korzystamy wyłącznie z założenia i z twierdzenia o sumie kątów w trójkącie:
    |∡ACB| = 180° − 58° − 63° = 59°.

    WNIOSEK: |∡ACB| = 59°. Ponieważ 59° ≠ 58°, trójkąt nie jest równoramienny — rysunek wprowadził ucznia w błąd. Rysunek służy tylko do znalezienia pomysłu; każdy krok dowodu musi wynikać z założenia, definicji lub twierdzenia.
  solution_steps:
  - 'Odtwórz rozumowanie ucznia: z rysunku |AB| = |BC|, stąd |∡ACB| = 58°.'
  - 'Pokaż sprzeczność: 58° + 63° + 58° = 179° ≠ 180°, więc wniosek z rysunku jest fałszywy.'
  - 'Zastosuj twierdzenie o sumie kątów w trójkącie: |∡ACB| = 180° − 58° − 63°.'
  - 'Oblicz: |∡ACB| = 59°.'
  - 'Sformułuj morał: rysunek ilustruje, ale nie dowodzi.'
  answer:
    kind: NUMERIC
    value: 59.0
  checks:
  - kind: evaluate
    expr: 180-58-63
  skills:
  - suma kątów w trójkącie
