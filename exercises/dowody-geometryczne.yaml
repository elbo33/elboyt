  statement_latex: x^{2}-2\cdot 8\cdot x\cdot\frac{1}{2}+8^{2}-7^{2}=0,\qquad \text{czyli}\qquad x^{2}-8\cdot
    x+15=0
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: powołanie się na nieistniejącą „cechę bok–bok–kąt”. Dane boki to AB i AC, a dany kąt jest kątem przy wierzchołku B — leży on między bokami AB i BC, a NIE między dwoma danymi bokami. Cechy przystawania to bbb, bkb (kąt MIĘDZY danymi bokami) i kbk; układ bok–bok–kąt nieleżący między nimi na ogół nie wyznacza trójkąta jednoznacznie.

    POKAŻMY KONTRPRZYKŁAD, czyli policzmy |BC|. Niech H będzie spodkiem wysokości poprowadzonej z wierzchołka A na prostą BC. W trójkącie prostokątnym ABH mamy |∡ABH| = 60°, więc
    |BH| = 8·cos60° = 8·(1/2) = 4, |AH| = 8·sin60° = 4√3.
    Z twierdzenia Pitagorasa w trójkącie AHC: |HC|² = |AC|² − |AH|² = 49 − 48 = 1, czyli |HC| = 1.
    Punkt C leży na prostej BC po tej samej stronie co H, ale może wypaść przed punktem H albo za nim:
    |BC| = |BH| − |HC| = 4 − 1 = 3 albo |BC| = |BH| + |HC| = 4 + 1 = 5.
    (Ten sam wynik daje twierdzenie cosinusów: 7² = |BC|² + 8² − 2·|BC|·8·cos60°, czyli |BC|² − 8·|BC| + 15 = 0, skąd |BC| = 3 lub |BC| = 5.)

    WNIOSEK: istnieją DWA nieprzystające trójkąty o danych |AB| = 8, |AC| = 7, |∡ABC| = 60° — jeden z bokiem BC długości 3, drugi z bokiem długości 5. Dane ucznia nie wyznaczają więc trójkąta jednoznacznie i wniosek |BC| = |LM| jest nieuprawniony. Wyjątkiem, w którym układ bok–bok–kąt działa, jest sytuacja, gdy dany kąt jest prosty — wtedy trzeci bok liczymy z twierdzenia Pitagorasa i wracamy do cechy bbb.
  solution_steps:
  - Zauważ, że dany kąt (przy B) nie leży między danymi bokami AB i AC — to układ bbk, a nie bkb.
  - Poprowadź wysokość AH na prostą BC i oblicz |BH| = 8·cos60° = 4 oraz |AH| = 4√3.
  - 'Z twierdzenia Pitagorasa w trójkącie AHC: |HC| = √(49 − 48) = 1.'
  - 'Rozważ oba położenia punktu C: |BC| = 4 − 1 = 3 lub |BC| = 4 + 1 = 5.'
  - Alternatywnie rozwiąż równanie |BC|² − 8·|BC| + 15 = 0 (twierdzenie cosinusów).
  - 'Wniosek: dane bbk nie wyznaczają trójkąta jednoznacznie, więc rozumowanie ucznia jest błędne.'
  answer:
    kind: SET
    members:
    - '3'
    - '5'
  checks:
