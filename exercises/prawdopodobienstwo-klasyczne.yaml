  statement: 'W pudełku znajdują się wyłącznie kule zielone i żółte: kul zielonych jest 5, a kul żółtych
    nie znamy. Z pudełka losujemy jednocześnie dwie kule. Prawdopodobieństwo zdarzenia polegającego na
    tym, że obie wylosowane kule są żółte, jest równe \frac{3}{7}. Oblicz, ile kul żółtych znajduje się
    w pudełku. Zapisz obliczenia.'
  statement_latex: \frac{\frac{n\cdot\left(n-1\right)}{2}}{\frac{\left(n+5\right)\cdot\left(n+4\right)}{2}}=\frac{3}{7}
  solution: |-
    Oznaczmy przez n liczbę kul żółtych, n jest liczbą naturalną i n\ge 2 (musimy móc wylosować dwie kule żółte). Wszystkich kul jest n+5.

    Losujemy jednocześnie dwie kule, więc kolejność jest nieistotna:
    \left|\Omega\right|=\frac{\left(n+5\right)\cdot\left(n+4\right)}{2}.
    Zdarzeniu A (obie kule żółte) sprzyja \left|A\right|=\frac{n\cdot\left(n-1\right)}{2} par.

    Z warunku zadania:
    \frac{n\cdot\left(n-1\right)}{\left(n+5\right)\cdot\left(n+4\right)}=\frac{3}{7}.
    Stąd 7\cdot n\cdot\left(n-1\right)=3\cdot\left(n+5\right)\cdot\left(n+4\right), czyli 7n^{2}-7n=3n^{2}+27n+60, a po uporządkowaniu 4n^{2}-34n-60=0, czyli 2n^{2}-17n-30=0.

    Wyróżnik: \Delta=\left(-17\right)^{2}-4\cdot 2\cdot\left(-30\right)=289+240=529, \sqrt{\Delta}=23.
    n_{1}=\frac{17-23}{4}=-\frac{3}{2}, n_{2}=\frac{17+23}{4}=10.
    Liczba kul nie może być ujemna, więc odrzucamy n_{1} i otrzymujemy n=10.

    Sprawdzenie: przy 10 kulach żółtych i 5 zielonych \left|\Omega\right|=\frac{15\cdot 14}{2}=105, \left|A\right|=\frac{10\cdot 9}{2}=45 oraz \frac{45}{105}=\frac{3}{7}. ✓
  solution_steps:
  - 'Wprowadzamy niewiadomą: n — liczba kul żółtych, wszystkich kul jest n+5, przy czym n\ge 2.'
  - 'Model bez kolejności: \left|\Omega\right|=\frac{\left(n+5\right)\left(n+4\right)}{2}, \left|A\right|=\frac{n\left(n-1\right)}{2}.'
  - Zapisujemy równanie \frac{n\left(n-1\right)}{\left(n+5\right)\left(n+4\right)}=\frac{3}{7}.
  - Przekształcamy do postaci 2n^{2}-17n-30=0.
  - \Delta=529, \sqrt{\Delta}=23, n=-\frac{3}{2} lub n=10.
  - 'Odrzucamy rozwiązanie ujemne; odpowiedź: 10 kul żółtych (sprawdzenie: \frac{45}{105}=\frac{3}{7}).'
