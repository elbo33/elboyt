  statement_latex: K_{n}=12000\cdot\left(1+\frac{3}{100}\right)^{n}
  solution: |-
    a) K_{3}=12000\cdot\left(1{,}03\right)^{3}=12000\cdot 1{,}092727=13112{,}724, czyli po zaokrągleniu 13112{,}72 zł.
    b) Mnożnik po trzech latach to \left(1{,}03\right)^{3}=1{,}092727, czyli \left(1{,}092727-1\right)\cdot 100\%=9{,}2727\%\approx 9{,}3\%. (Uwaga: to NIE jest 3\cdot 3\%=9\%.)
