- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: nierówność liniowa z ułamkami
  statement: Rozwiąż nierówność \(\frac{2x - 1}{3} - \frac{x + 2}{4} \leq 1\). Zbiór wszystkich rozwiązań
    zapisz w postaci przedziału oraz podaj największą liczbę całkowitą należącą do tego zbioru.
  statement_latex: \frac{2\cdot x - 1}{3} - \frac{x + 2}{4} \leq 1
  solution: |-
    Wspólnym mianownikiem liczb 3 i 4 jest 12. Mnożymy obie strony przez 12 (liczba dodatnia, więc znak nierówności zostaje), pamiętając o nawiasach wokół liczników:
    4(2x − 1) − 3(x + 2) ≤ 12
    8x − 4 − 3x − 6 ≤ 12
    5x − 10 ≤ 12
    5x ≤ 22
    Dzielimy przez 5 (liczba dodatnia): x ≤ 22/5, czyli x ≤ 4,4.
    Zbiór rozwiązań: (−∞, 22/5⟩.
    Największa liczba całkowita należąca do tego przedziału to 4 (bo 5 > 4,4).
    Sprawdzenie: dla x = 4 mamy (8 − 1)/3 − (4 + 2)/4 = 7/3 − 3/2 = 5/6 ≤ 1 ✓; dla x = 5: 9/3 − 7/4 = 1,25 > 1 ✗.
  solution_steps:
  - 'Pomnóż obie strony przez 12: 4(2x − 1) − 3(x + 2) ≤ 12.'
  - 'Usuń nawiasy: 8x − 4 − 3x − 6 ≤ 12.'
  - 'Zredukuj: 5x − 10 ≤ 12, czyli 5x ≤ 22.'
  - 'Podziel przez 5: x ≤ 22/5.'
  - 'Zapisz przedział (−∞, 22/5⟩ i wskaż największą liczbę całkowitą: 4.'
  answer:
    kind: MULTIPART
    parts:
    - name: zbiór rozwiązań
      answer:
        kind: INTERVAL
        lo: -\infty
        hi: \frac{22}{5}
        hi_open: false
    - name: największa liczba całkowita
      answer:
        kind: NUMERIC
        value: 4.0
  checks:
  - kind: solve_inequality
    expr: \frac{2\cdot x - 1}{3} - \frac{x + 2}{4} \leq 1
    part: zbiór rozwiązań
  skills:
