  exercise_type: odczytanie środka i promienia
  statement: W kartezjańskim układzie współrzędnych (x, y) dany jest okrąg o równaniu \left(x-4\right)^2+\left(y+2\right)^2=49.
    Podaj współrzędne środka S tego okręgu oraz jego promień r.
  statement_latex: \left(x-4\right)^2+\left(y+2\right)^2=49
  solution: |-
    Przepisujemy nawiasy tak, by w obu stał znak minus: (x-4)^2+(y-(-2))^2=49.
    Stąd a=4 oraz b=-2, czyli środek S=(4,-2).
    Prawa strona to r^2, więc r=\sqrt{49}=7.
    Odpowiedź: S=(4,-2), r=7.
  solution_steps:
  - 'Zapisz oba nawiasy w postaci \left(x-a\right)^2 i \left(y-b\right)^2: \left(y+2\right)^2=\left(y-\left(-2\right)\right)^2.'
  - Odczytaj środek S=\left(4,-2\right).
  - Zauważ, że prawa strona to r^2, i oblicz r=\sqrt{49}=7.
  answer:
    kind: MULTIPART
    parts:
    - name: srodek
      answer:
        kind: TUPLE
        items:
        - '4'
        - '-2'
    - name: promien
      answer:
        kind: NUMERIC
        value: 7.0
  checks:
  - kind: evaluate
    expr: \sqrt{49}
    part: promien
  skills:
  - odczytywanie środka z postaci kanonicznej
  - wyznaczanie promienia jako pierwiastka z prawej strony
  verification:
    checkability: REFERENCE_CALL
    note: '2 parts matched · det: [promien] SymPy solved it fresh: 7.0 vs 7.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: sprawdzenie położenia punktu
  statement: W kartezjańskim układzie współrzędnych (x, y) dany jest okrąg o równaniu x^{2}+y^{2}=40 oraz
    punkt A = (6, 2). Oblicz wartość lewej strony równania dla punktu A i rozstrzygnij, czy punkt A leży
    na tym okręgu.
  statement_latex: x^{2}+y^{2}=40,\quad A=\left(6,2\right)
  solution: |-
    Okrąg x^2+y^2=40 ma środek S=(0,0) i r^2=40.
    Podstawiamy współrzędne punktu A do lewej strony:
    L=6^2+2^2=36+4=40.
    Porównujemy: L=40 oraz r^2=40, czyli L=r^2.
    Zatem punkt A leży na okręgu (nie trzeba obliczać \sqrt{40}).
  solution_steps:
  - Zapisz lewą stronę L=x_0^{2}+y_0^{2}.
  - 'Podstaw A=\left(6,2\right): L=6^{2}+2^{2}=36+4=40.'
  - Porównaj L=40 z r^{2}=40.
  - 'Wniosek: L=r^{2}, więc punkt A leży na okręgu.'
  answer:
    kind: MULTIPART
    parts:
    - name: wartosc_L
      answer:
        kind: NUMERIC
        value: 40.0
    - name: czy_lezy_na_okregu
      answer:
        kind: BOOLEAN
        truth: true
  checks:
  - kind: evaluate
    expr: 6^{2}+2^{2}
    part: wartosc_L
  skills:
  - podstawianie współrzędnych do równania okręgu
  - porównanie L z r^2
  verification:
    checkability: REFERENCE_CALL
    note: '2 parts matched · det: [wartosc_L] SymPy solved it fresh: 40.0 vs 40.0 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: okrąg o danym środku przechodzący przez dany punkt
  statement: W kartezjańskim układzie współrzędnych (x, y) okrąg O o środku S = (-2, 3) przechodzi przez
    punkt P = (1, 7). Oblicz promień okręgu O oraz zapisz jego równanie w postaci kanonicznej.
  statement_latex: S=\left(-2,3\right),\quad P=\left(1,7\right),\quad r=\sqrt{\left(1-\left(-2\right)\right)^{2}+\left(7-3\right)^{2}}
  solution: |-
    Promień to odległość środka od punktu leżącego na okręgu:
    r^2=(1-(-2))^2+(7-3)^2=3^2+4^2=9+16=25, więc r=\sqrt{25}=5.
    Wstawiamy a=-2, b=3 oraz r^2=25 do postaci kanonicznej:
    (x+2)^2+(y-3)^2=25.
    Kontrola: dla P=(1,7) mamy (1+2)^2+(7-3)^2=9+16=25 ✓.
  solution_steps:
  - Oblicz r^{2}=\left(1-\left(-2\right)\right)^{2}+\left(7-3\right)^{2}=9+16=25.
  - Wyznacz r=\sqrt{25}=5.
  - Podstaw a=-2, b=3 i r^{2}=25 do \left(x-a\right)^2+\left(y-b\right)^2=r^2.
  - Zapisz \left(x+2\right)^{2}+\left(y-3\right)^{2}=25 i sprawdź równanie punktem P.
  answer:
    kind: MULTIPART
    parts:
    - name: promien
      answer:
        kind: NUMERIC
        value: 5.0
    - name: rownanie
      answer:
        kind: SYMBOLIC
        latex: \left(x+2\right)^{2}+\left(y-3\right)^{2}=25
  checks:
  - kind: evaluate
