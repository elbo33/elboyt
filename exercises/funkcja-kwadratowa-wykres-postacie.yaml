- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: wyznaczanie wzoru z wierzchołka i punktu
  statement: W kartezjańskim układzie współrzędnych (x,\ y) wykresem funkcji kwadratowej f jest parabola
    o wierzchołku w punkcie W=(-2,\ -8). Parabola ta przecina oś Oy w punkcie o współrzędnych (0,\ 4).
    Oblicz współczynnik a, wyznacz wzór funkcji f w postaci ogólnej oraz podaj zbiór wartości funkcji
    f. Zapisz obliczenia.
  statement_latex: f(x)=a\left(x+2\right)^{2}-8,\qquad f(0)=4
  solution: |-
    Skoro znamy wierzchołek W=(-2,-8), zapisujemy postać kanoniczną: f(x)=a\left(x+2\right)^{2}-8.
    Punkt (0,\,4) należy do wykresu, więc a\cdot\left(0+2\right)^{2}-8=4, czyli 4a=12, stąd a=3.
    Postać ogólna: f(x)=3\left(x+2\right)^{2}-8=3\left(x^{2}+4x+4\right)-8=3x^{2}+12x+12-8=3x^{2}+12x+4.
    Sprawdzenie: f(0)=4 ✔ oraz p=\frac{-12}{2\cdot 3}=-2 ✔.
    Ponieważ a=3>0, wartość najmniejsza to q=-8, zatem ZW=\langle -8,\,+\infty).
  solution_steps:
  - Zapisz f(x)=a\left(x+2\right)^{2}-8.
  - 'Podstaw punkt (0,4): a\cdot\left(0+2\right)^{2}-8=4.'
  - 'Rozwiąż równanie: 4a=12, a=3.'
  - 'Rozwiń: f(x)=3x^{2}+12x+4.'
  - Z a>0 i q=-8 zapisz ZW=\langle -8,+\infty).
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: NUMERIC
        value: 3.0
    - name: postac_ogolna
      answer:
        kind: SYMBOLIC
        latex: 3x^{2}+12x+4
    - name: zbior_wartosci
      answer:
        kind: INTERVAL
        lo: '-8'
        hi: \infty
        lo_open: false
  checks:
  - kind: solve_equation
    expr: a\cdot\left(0+2\right)^{2}-8=4
    var: a
    part: a
  - kind: simplify
    expr: 3\cdot\left(x+2\right)^{2}-8
    part: postac_ogolna
  skills:
  - układanie równania z jedną niewiadomą a
  - zamiana postaci kanonicznej na ogólną
  - zbiór wartości
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: wyznaczanie wzoru z miejsc zerowych i wartości najmniejszej
  statement: Miejscami zerowymi funkcji kwadratowej f są liczby x_{1}=-3 oraz x_{2}=5, a wartość najmniejsza
    funkcji f jest równa -8. Oblicz współczynnik a, zapisz wzór funkcji f w postaci kanonicznej i w postaci
    ogólnej oraz podaj przedział, w którym funkcja f jest rosnąca. Zapisz obliczenia.
  statement_latex: f(x)=a\left(x+3\right)\left(x-5\right),\qquad q=-8
  solution: |-
    Funkcja ma wartość najmniejszą, więc a>0. Znamy miejsca zerowe, zatem f(x)=a\left(x+3\right)\left(x-5\right).
    Oś symetrii przechodzi w połowie między miejscami zerowymi: p=\frac{-3+5}{2}=1, a wartość najmniejsza to q=-8, więc wierzchołek to W=(1,\,-8) i f(x)=a\left(x-1\right)^{2}-8.
    Podstawiamy miejsce zerowe x=-3: a\cdot\left(-3-1\right)^{2}-8=0, czyli 16a=8, stąd a=\frac{1}{2} (istotnie a>0 ✔).
    Postać kanoniczna: f(x)=\frac{1}{2}\left(x-1\right)^{2}-8.
    Postać ogólna: f(x)=\frac{1}{2}\left(x^{2}-2x+1\right)-8=\frac{1}{2}x^{2}-x+\frac{1}{2}-8=\frac{1}{2}x^{2}-x-\frac{15}{2}.
    Sprawdzenie: f(5)=\frac{25}{2}-5-\frac{15}{2}=0 ✔.
    Ponieważ a>0, funkcja maleje w (-\infty,\,1\rangle i rośnie w \langle 1,\,+\infty).
  solution_steps:
  - Zauważ, że a>0 (istnieje wartość najmniejsza) i zapisz f(x)=a\left(x+3\right)\left(x-5\right).
  - Oblicz p=\frac{-3+5}{2}=1, więc W=(1,-8) i f(x)=a\left(x-1\right)^{2}-8.
  - 'Podstaw x=-3: a\cdot\left(-3-1\right)^{2}-8=0, stąd a=\frac{1}{2}.'
  - Zapisz postać kanoniczną f(x)=\frac{1}{2}\left(x-1\right)^{2}-8.
  - Rozwiń do postaci ogólnej f(x)=\frac{1}{2}x^{2}-x-\frac{15}{2}.
  - 'Podaj przedział monotoniczności: funkcja rośnie w \langle 1,+\infty).'
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: NUMERIC
        value: 0.5
    - name: postac_kanoniczna
      answer:
        kind: SYMBOLIC
        latex: \frac{1}{2}\left(x-1\right)^{2}-8
    - name: postac_ogolna
      answer:
        kind: SYMBOLIC
        latex: \frac{1}{2}x^{2}-x-\frac{15}{2}
    - name: przedzial_rosnacosci
      answer:
        kind: INTERVAL
        lo: '1'
        hi: \infty
        lo_open: false
  checks:
  - kind: solve_equation
    expr: a\cdot\left(-3-1\right)^{2}-8=0
    var: a
    part: a
  - kind: simplify
    expr: \frac{1}{2}\cdot\left(x+3\right)\cdot\left(x-5\right)
    part: postac_kanoniczna
  - kind: simplify
    expr: \frac{1}{2}\cdot\left(x-1\right)^{2}-8
    part: postac_ogolna
  skills:
  - oś symetrii z miejsc zerowych
  - wyznaczanie a
  - postać kanoniczna i ogólna
  - przedziały monotoniczności
  verification:
    checkability: DETERMINISTIC
    note: '[a] SymPy solved it fresh: 0.5 vs 0.5 (tol 1e-09) ; [postac_kanoniczna] SymPy solved it fresh
      and disagrees: ''\\frac{1}{2}\\left(x-1\\right)^{2}-8'' vs ''(x - 5)*(x + 3)/2'' (as text)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: wyznaczanie wzoru funkcji kwadratowej z wierzchołka i punktu
  statement: Funkcja kwadratowa f przyjmuje wartość najmniejszą równą (-8) dla argumentu x = 1. Wykres
    funkcji f przecina oś Oy układu współrzędnych w punkcie o współrzędnych (0, -6). Wyznacz wzór funkcji
    f w postaci ogólnej oraz w postaci iloczynowej, a także podaj zbiór wartości funkcji f. Zapisz obliczenia.
  statement_latex: f\left(x\right)=a\cdot\left(x-1\right)^{2}-8,\qquad f\left(0\right)=-6
  solution: |-
    Funkcja przyjmuje wartość najmniejszą, więc a > 0, a wierzchołek paraboli ma współrzędne W = (1, -8). Zapisujemy postać kanoniczną:
    f(x) = a\cdot(x-1)^2 - 8.
    Punkt (0, -6) należy do wykresu, więc f(0) = -6:
    -6 = a\cdot(0-1)^2 - 8, czyli -6 = a - 8, stąd a = 2 (istotnie a > 0 ✔).
    Postać kanoniczna: f(x) = 2\cdot(x-1)^2 - 8.
    Postać ogólna: f(x) = 2\cdot(x^2 - 2x + 1) - 8 = 2x^2 - 4x + 2 - 8 = 2x^2 - 4x - 6.
    Miejsca zerowe: 2(x-1)^2 - 8 = 0 ⟺ (x-1)^2 = 4 ⟺ x - 1 = 2 lub x - 1 = -2, czyli x = 3 lub x = -1.
    Postać iloczynowa (pamiętamy o współczynniku a): f(x) = 2\cdot(x+1)\cdot(x-3). Sprawdzenie: 2(x^2-2x-3) = 2x^2-4x-6 ✔.
    Ramiona skierowane w górę, q = -8, więc ZW = ⟨-8, +∞).
  solution_steps:
  - Z wartości najmniejszej odczytujemy wierzchołek W = (1, -8) i zapisujemy f(x) = a(x-1)^2 - 8.
  - 'Podstawiamy punkt (0, -6): -6 = a - 8, więc a = 2.'
  - 'Rozwijamy kwadrat: f(x) = 2x^2 - 4x - 6 (postać ogólna).'
  - Rozwiązujemy (x-1)^2 = 4 i otrzymujemy miejsca zerowe x = -1 oraz x = 3.
  - 'Zapisujemy postać iloczynową z współczynnikiem a: f(x) = 2(x+1)(x-3).'
  - Ponieważ a > 0 i q = -8, zbiorem wartości jest przedział ⟨-8, +∞).
  answer:
    kind: MULTIPART
    parts:
    - name: postac_ogolna
      answer:
        kind: SYMBOLIC
        latex: 2x^{2}-4x-6
    - name: postac_iloczynowa
      answer:
        kind: SYMBOLIC
        latex: 2\left(x+1\right)\left(x-3\right)
    - name: zbior_wartosci
      answer:
        kind: INTERVAL
        lo: '-8'
        lo_open: false
  checks:
  - kind: simplify
    expr: 2\cdot\left(x-1\right)^{2}-8
    part: postac_ogolna
  - kind: simplify
    expr: 2\cdot\left(x+1\right)\cdot\left(x-3\right)
    part: postac_iloczynowa
  skills:
  - postać kanoniczna
  - postać ogólna
  - postać iloczynowa
  - zbiór wartości
  - miejsca zerowe
  verification:
    checkability: REFERENCE_CALL
    note: 'answer and reference disagree: part disagrees: ''2x^{2}-4x-6'' vs ''f(x)=2x^2-4x-6'' (as text)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: wyznaczanie wzoru z trzech punktów i rozstrzygnięcie o postaci iloczynowej
  statement: Do wykresu funkcji kwadratowej f należą punkty A = (0, 3), B = (2, 3) oraz C = (-1, 9). Wyznacz
    wzór funkcji f w postaci kanonicznej i w postaci ogólnej, oblicz wyróżnik Δ trójmianu f oraz rozstrzygnij,
    czy funkcja f ma postać iloczynową. Zapisz obliczenia.
  statement_latex: f\left(0\right)=3,\qquad f\left(2\right)=3,\qquad f\left(-1\right)=9
  solution: |-
    Punkty A i B mają tę samą rzędną, więc oś symetrii paraboli przechodzi w połowie odległości między nimi:
    p = \frac{0+2}{2} = 1.
    Zapisujemy postać kanoniczną f(x) = a\cdot(x-1)^2 + q i podstawiamy dwa punkty:
    f(0) = 3: a\cdot(0-1)^2 + q = 3, czyli a + q = 3,
    f(-1) = 9: a\cdot(-1-1)^2 + q = 9, czyli 4a + q = 9.
    Odejmując stronami: 3a = 6, więc a = 2 oraz q = 1.
    Postać kanoniczna: f(x) = 2\cdot(x-1)^2 + 1. Sprawdzenie: f(2) = 2\cdot 1 + 1 = 3 ✔.
    Postać ogólna: f(x) = 2\cdot(x^2 - 2x + 1) + 1 = 2x^2 - 4x + 3.
    Wyróżnik: Δ = (-4)^2 - 4\cdot 2\cdot 3 = 16 - 24 = -8.
    Δ < 0, więc funkcja nie ma miejsc zerowych — postać iloczynowa nie istnieje (parabola o ramionach skierowanych w górę leży w całości nad osią Ox).
  solution_steps:
  - Zauważamy, że f(0) = f(2) = 3, więc p = (0+2)/2 = 1.
  - 'Zapisujemy f(x) = a(x-1)^2 + q i podstawiamy punkty A oraz C: a + q = 3 i 4a + q = 9.'
  - 'Rozwiązujemy układ: 3a = 6, a = 2, q = 1; postać kanoniczna f(x) = 2(x-1)^2 + 1.'
  - 'Rozwijamy: f(x) = 2x^2 - 4x + 3.'
  - Obliczamy Δ = (-4)^2 - 4·2·3 = -8.
  - 'Ponieważ Δ < 0, zapisujemy: postać iloczynowa nie istnieje.'
  answer:
    kind: MULTIPART
    parts:
    - name: postac_kanoniczna
      answer:
        kind: SYMBOLIC
        latex: 2\left(x-1\right)^{2}+1
    - name: postac_ogolna
      answer:
        kind: SYMBOLIC
        latex: 2x^{2}-4x+3
    - name: delta
      answer:
        kind: NUMERIC
        value: -8.0
    - name: postac_iloczynowa
      answer:
        kind: SYMBOLIC
        latex: nie istnieje
  checks:
  - kind: simplify
    expr: 2\cdot\left(x-1\right)^{2}+1
    part: postac_ogolna
  - kind: evaluate
    expr: \left(-4\right)^{2}-4\cdot 2\cdot 3
    part: delta
  skills:
  - oś symetrii z dwóch punktów o równych rzędnych
  - układ równań
  - postać kanoniczna
  - wyróżnik
  - istnienie postaci iloczynowej
  verification:
    checkability: REFERENCE_CALL
    note: 'answer and reference disagree: part disagrees: ''2\\left(x-1\\right)^{2}+1'' vs ''f(x)=2(x-1)^2+1''
      (as text)'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: wykrycie błędu — znaki p i q
  statement: Funkcja kwadratowa f jest określona wzorem f(x)=2\left(x+3\right)^{2}-5. Uczeń stwierdził,
    że wierzchołkiem paraboli będącej wykresem funkcji f jest punkt (3,\ -5). Wyjaśnij, na czym polega
    błąd ucznia, i podaj poprawne współrzędne wierzchołka.
  statement_latex: f(x)=2\left(x+3\right)^{2}-5
  solution: |-
    Błędne rozumowanie ucznia: „w nawiasie stoi +3, więc p=3” — uczeń odczytuje liczbę z nawiasu bez zmiany znaku i otrzymuje wierzchołek (3,\,-5).
    Dlaczego to źle: wzorcem jest f(x)=a\left(x-p\right)^{2}+q, a nasz nawias to x+3=x-\left(-3\right), więc p=-3, a nie 3.
