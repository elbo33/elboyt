- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: wyznaczanie a_1 i r z układu równań
  statement: Ciąg arytmetyczny \left( a_{n} \right) jest określony dla każdej liczby naturalnej n \geq
    1. Piąty wyraz tego ciągu jest równy 11, a suma dwunastu początkowych kolejnych wyrazów tego ciągu
    jest równa 168. Oblicz pierwszy wyraz i różnicę tego ciągu oraz dwudziesty wyraz tego ciągu. Zapisz
    obliczenia.
  statement_latex: a_{5} = a_{1} + 4\cdot r = 11, \qquad S_{12} = \frac{2a_{1} + 11\cdot r}{2}\cdot 12
    = 168
  solution: |-
    1) Zapisuję dane wzorami ciągu arytmetycznego:
    a_{5} = a_{1} + 4\cdot r = 11, czyli a_{1} = 11 - 4\cdot r,
    S_{12} = \frac{2a_{1} + 11\cdot r}{2}\cdot 12 = 168.
    2) Podstawiam a_{1} = 11 - 4r do drugiego równania:
    \frac{2\cdot\left(11 - 4r\right) + 11r}{2}\cdot 12 = 168,
    \frac{22 - 8r + 11r}{2}\cdot 12 = 168,
    \left(22 + 3r\right)\cdot 6 = 168, czyli 132 + 18r = 168.
    3) Stąd 18r = 36, więc r = 2.
    4) a_{1} = 11 - 4\cdot 2 = 3.
    5) a_{20} = a_{1} + 19\cdot r = 3 + 19\cdot 2 = 3 + 38 = 41.
    Sprawdzenie: a_{12} = 3 + 11\cdot 2 = 25, więc S_{12} = \frac{3 + 25}{2}\cdot 12 = 14\cdot 12 = 168. ✓
    Odpowiedź: a_{1} = 3, r = 2, a_{20} = 41.
  solution_steps:
  - 'Zapisz warunki wzorami: a_5 = a_1 + 4r = 11 oraz S_12 = ((2a_1 + 11r)/2)·12 = 168.'
  - Z pierwszego równania wyznacz a_1 = 11 − 4r i wstaw do drugiego.
  - 'Uporządkuj: 132 + 18r = 168, stąd r = 2.'
  - Oblicz a_1 = 11 − 4·2 = 3.
  - Oblicz a_20 = 3 + 19·2 = 41.
  - 'Sprawdź kontrolnie: a_12 = 25 i S_12 = (3+25)/2·12 = 168.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_1
      answer:
        kind: NUMERIC
        value: 3.0
    - name: r
      answer:
        kind: NUMERIC
        value: 2.0
    - name: a_20
      answer:
        kind: NUMERIC
        value: 41.0
  checks:
  - kind: solve_equation
    expr: \frac{2\cdot\left(11 - 4\cdot r\right) + 11\cdot r}{2}\cdot 12 = 168
    var: r
    part: r
  - kind: evaluate
    expr: 11 - 4\cdot 2
    part: a_1
  - kind: evaluate
    expr: 3 + 19\cdot 2
    part: a_20
  skills:
  - wzór na n-ty wyraz ciągu arytmetycznego
  - wzór na sumę n początkowych wyrazów
  - rozwiązywanie układu równań
  - kontrola wyniku
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [r] SymPy solved it fresh: 2.0 vs 2.0 (tol 1e-09) ; [a_1] SymPy
      solved it fresh: 3.0 vs 3.0 (tol 1e-09) ; [a_20] SymPy solved it fresh: 41.0 vs 41.0 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: równanie na liczbę wyrazów oraz suma fragmentu ciągu
  statement: |-
    Ciąg arytmetyczny \left( a_{n} \right) jest określony dla każdej liczby naturalnej n \geq 1. Pierwszy wyraz tego ciągu jest równy 4, a różnica tego ciągu jest równa 3.
    a) Oblicz, ile początkowych kolejnych wyrazów tego ciągu należy dodać, aby otrzymać sumę równą 1000.
    b) Oblicz sumę a_{11} + a_{12} + \dots + a_{25}.
    Zapisz obliczenia.
  statement_latex: S_{n} = \frac{2\cdot 4 + \left(n-1\right)\cdot 3}{2}\cdot n = 1000, \qquad a_{11} +
    a_{12} + \dots + a_{25} = S_{25} - S_{10}
  solution: |-
    a) 1) Wyznaczam wzór na sumę: S_{n} = \frac{2\cdot 4 + \left(n-1\right)\cdot 3}{2}\cdot n = \frac{8 + 3n - 3}{2}\cdot n = \frac{\left(3n + 5\right)\cdot n}{2}.
    2) Równanie: \frac{\left(3n + 5\right)\cdot n}{2} = 1000, czyli 3n^{2} + 5n - 2000 = 0.
    3) \Delta = 5^{2} - 4\cdot 3\cdot\left(-2000\right) = 25 + 24000 = 24025, \sqrt{\Delta} = 155.
    4) n = \frac{-5 - 155}{6} = -\frac{80}{3} (odrzucam, bo n musi być liczbą naturalną dodatnią) albo n = \frac{-5 + 155}{6} = \frac{150}{6} = 25.
    5) Sprawdzenie: a_{25} = 4 + 24\cdot 3 = 76, S_{25} = \frac{4 + 76}{2}\cdot 25 = 40\cdot 25 = 1000. ✓
    b) 1) a_{11} + \dots + a_{25} = S_{25} - S_{10}.
    2) S_{10} = \frac{\left(3\cdot 10 + 5\right)\cdot 10}{2} = \frac{35\cdot 10}{2} = 175.
    3) S_{25} - S_{10} = 1000 - 175 = 825.
    Kontrola: a_{11} = 4 + 10\cdot 3 = 34, a_{25} = 76, wyrazów jest 25 - 11 + 1 = 15, więc suma = \frac{34 + 76}{2}\cdot 15 = 55\cdot 15 = 825. ✓
    Odpowiedź: a) należy dodać 25 początkowych wyrazów; b) szukana suma jest równa 825.
  solution_steps:
  - Zapisz S_n = ((2·4 + (n−1)·3)/2)·n = ((3n+5)·n)/2.
  - 'Przyrównaj do 1000 i uporządkuj: 3n² + 5n − 2000 = 0.'
  - Oblicz Δ = 24025, √Δ = 155, stąd n = −80/3 lub n = 25.
  - Odrzuć n = −80/3, bo n jest liczbą wyrazów; zatem n = 25.
  - Sumę fragmentu policz jako S_25 − S_10 = 1000 − 175 = 825.
  - 'Sprawdź kontrolnie: 15 wyrazów od a_11 = 34 do a_25 = 76 daje (34+76)/2·15 = 825.'
  answer:
    kind: MULTIPART
    parts:
    - name: n
      answer:
        kind: NUMERIC
        value: 25.0
    - name: suma_fragmentu
      answer:
        kind: NUMERIC
        value: 825.0
  checks:
  - kind: evaluate
    expr: \frac{-5 + \sqrt{24025}}{6}
    var: n
    part: n
  - kind: evaluate
    expr: \frac{\left(3\cdot 25 + 5\right)\cdot 25}{2} - \frac{\left(3\cdot 10 + 5\right)\cdot 10}{2}
    var: n
    part: suma_fragmentu
  skills:
  - wzór na sumę n początkowych wyrazów
  - rozwiązywanie równania kwadratowego
  - odrzucanie niedopuszczalnych wartości n
  - suma fragmentu ciągu jako S_n − S_{k−1}
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [n] SymPy solved it fresh: 25.0 vs 25.0 (tol 1e-09) ; [suma_fragmentu]
      SymPy solved it fresh: 825.0 vs 825.0 (tol 1e-09)'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: wyznaczanie r, wyrazu i sumy w ciągu malejącym
  statement: Dany jest ciąg arytmetyczny, którego kolejne początkowe wyrazy to 12, 8, 4, 0, … Wyznacz
    różnicę r tego ciągu, oblicz a_{15} oraz sumę piętnastu początkowych kolejnych wyrazów. Zapisz obliczenia.
  statement_latex: r = 8 - 12,\qquad a_{15} = 12 + \left(15 - 1\right)\cdot r,\qquad S_{15} = \frac{12
    + a_{15}}{2}\cdot 15
  solution: |-
    BŁĘDNE ROZUMOWANIE (częsty błąd): uczeń liczy różnicę „w drugą stronę”: r = a_1 - a_2 = 12 - 8 = 4. Wtedy a_{15} = 12 + 14\cdot 4 = 68 i S_{15} = \frac{12 + 68}{2}\cdot 15 = 600. Wyniki są błędne, a ciąg wyszedłby rosnący, choć wypisane liczby wyraźnie maleją.

    KOREKTA: z definicji r = a_{n+1} - a_n, czyli następny minus poprzedni:
    r = 8 - 12 = -4 (kontrola: 4 - 8 = -4, 0 - 4 = -4).
    a_{15} = 12 + 14\cdot(-4) = 12 - 56 = -44.
    S_{15} = \frac{12 + (-44)}{2}\cdot 15 = \frac{-32}{2}\cdot 15 = -16\cdot 15 = -240.
