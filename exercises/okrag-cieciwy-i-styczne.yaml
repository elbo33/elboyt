  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie długości cięciwy
  statement: Dany jest okrąg o środku O i promieniu 10 cm. W tym okręgu poprowadzono cięciwę AB, której
    odległość od środka O jest równa 8 cm (odcinek OS jest prostopadły do AB, a punkt S leży na cięciwie
    AB). Oblicz długość cięciwy AB. Zapisz obliczenia.
  statement_latex: r = 10,\qquad k = 8,\qquad |AB| = 2\cdot\sqrt{10^{2}-8^{2}}
  solution: |-
    Odcinek OS poprowadzony ze środka okręgu prostopadle do cięciwy AB dzieli tę cięciwę na dwie równe części, więc S jest środkiem AB i |AS| = \frac{|AB|}{2}.
    Trójkąt OSA jest prostokątny (kąt prosty przy S), jego przyprostokątne to |OS| = 8 i |AS|, a przeciwprostokątną jest promień |OA| = 10.
    Z twierdzenia Pitagorasa: 8^{2} + |AS|^{2} = 10^{2}, czyli 64 + |AS|^{2} = 100, stąd |AS|^{2} = 36 i |AS| = 6.
    Zatem |AB| = 2\cdot 6 = 12 cm.
    Sprawdzenie: 12 < 2\cdot 10 = 20, więc wynik jest sensowny.
  solution_steps:
  - 'Zauważ, że prostopadła ze środka dzieli cięciwę na połowy: |AS| = |AB|/2.'
  - W trójkącie prostokątnym OSA przeciwprostokątną jest promień r = 10, przyprostokątną k = 8.
  - 'Z Pitagorasa: |AS|^2 = 100 - 64 = 36, więc |AS| = 6.'
  - 'Podwój: |AB| = 2·6 = 12 cm.'
  answer:
    kind: NUMERIC
    value: 12.0
    latex: 12\ \text{cm}
