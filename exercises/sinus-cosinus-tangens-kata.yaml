  statement_latex: \left|OA\right|=6,\qquad \left|OB\right|=4,\qquad P_{OAB}=\frac{1}{2}\cdot 6\cdot y_{B}=6\sqrt{3}
  solution: |-
    Bok OA leży na osi Ox i ma długość 6, więc wysokość trójkąta OAB opuszczona na ten bok jest równa drugiej współrzędnej punktu B, czyli y_{B} (punkt B leży w II ćwiartce, więc y_{B}>0).
    Zatem P_{OAB}=\frac{1}{2}\cdot 6\cdot y_{B}=3\cdot y_{B}. Z warunku 3\cdot y_{B}=6\sqrt{3} otrzymujemy y_{B}=2\sqrt{3}.
    Punkt B leży na drugim ramieniu kąta α i \left|OB\right|=r=4, więc \sin\alpha=\frac{y_{B}}{r}=\frac{2\sqrt{3}}{4}=\frac{\sqrt{3}}{2}.
    W przedziale \left(0^\circ,180^\circ\right) równanie to ma dwa rozwiązania: \alpha=60^\circ oraz \alpha=180^\circ-60^\circ=120^\circ.
    Punkt B leży w II ćwiartce, więc x_{B}<0, czyli \cos\alpha<0 i kąt α jest rozwarty. Odrzucamy 60^\circ i przyjmujemy \alpha=120^\circ.
    Pierwszą współrzędną wyznaczamy z Pitagorasa: x_{B}=-\sqrt{4^{2}-\left(2\sqrt{3}\right)^{2}}=-\sqrt{16-12}=-2 (znak minus, bo II ćwiartka).
    Kontrola: \cos 120^\circ=-\frac{1}{2} oraz \frac{x_{B}}{r}=\frac{-2}{4}=-\frac{1}{2}. ✔
    Odpowiedź: B=\left(-2,\ 2\sqrt{3}\right), \alpha=120^\circ.
