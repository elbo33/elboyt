  exercise_type: równanie z czynnikiem wspólnym – analiza błędu
  statement: 'Rozwiąż równanie \[2\cdot x\cdot\left(x+4\right)=7\cdot\left(x+4\right).\] Uczeń podzielił
    obie strony przez \left(x+4\right) i podał jedną odpowiedź: x=\frac{7}{2}. Wyjaśnij, na czym polega
    jego błąd, i podaj wszystkie rozwiązania równania.'
  statement_latex: 2\cdot x\cdot\left(x+4\right)=7\cdot\left(x+4\right)
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA:
    Uczeń dzieli obie strony przez \left(x+4\right):
    2x=7, więc x=\frac{7}{2}
    i podaje to jako jedyne rozwiązanie.
    DLACZEGO TO JEST BŁĄD:
    Dzielić obie strony wolno tylko przez wyrażenie RÓŻNE OD ZERA. Wyrażenie x+4 zeruje się dla x=-4, a ta liczba należy do dziedziny równania (dziedziną jest \mathbb{R}, bo nie ma tu ułamków). Dzieląc bez założenia, uczeń gubi rozwiązanie x=-4.
    POPRAWNE ROZWIĄZANIE:
    Przenosimy wszystko na jedną stronę i wyłączamy wspólny czynnik:
    2x\cdot\left(x+4\right)-7\cdot\left(x+4\right)=0
    \left(x+4\right)\cdot\left(2x-7\right)=0.
    Iloczyn jest równy zeru, gdy któryś czynnik jest zerem:
    x+4=0\ \text{lub}\ 2x-7=0,
    czyli x=-4 lub x=\frac{7}{2}.
    Sprawdzenie dla x=-4: L=2\cdot\left(-4\right)\cdot 0=0, P=7\cdot 0=0 – równość prawdziwa.
    Odpowiedź: x=-4 oraz x=\frac{7}{2}.
  solution_steps:
  - Zauważ, że dzielenie przez \left(x+4\right) wymaga założenia x\neq -4.
  - 'Przenieś wszystko na jedną stronę: 2x\cdot\left(x+4\right)-7\cdot\left(x+4\right)=0.'
  - 'Wyłącz wspólny czynnik: \left(x+4\right)\cdot\left(2x-7\right)=0.'
  - 'Przyrównaj każdy czynnik do zera: x=-4 lub x=\frac{7}{2}.'
  - Sprawdź, że x=-4 spełnia równanie wyjściowe – to rozwiązanie zgubione przez ucznia.
