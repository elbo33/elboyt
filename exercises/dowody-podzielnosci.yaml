- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: zapis dziesiętny — dowód, warunek podzielności i wybór największej liczby
  statement: |-
    Liczbę trzycyfrową nazwiemy zgodną, jeżeli jej cyfra dziesiątek jest średnią arytmetyczną cyfry setek i cyfry jedności.
    a) Wykaż, że każda liczba zgodna jest podzielna przez 3.
    b) Wyznacz największą liczbę zgodną, która ma trzy różne cyfry i jest podzielna przez 9.
  statement_latex: N=100\cdot a+10\cdot b+c,\qquad b=\frac{a+c}{2}
  solution: |-
    Oznaczenia. Niech N będzie liczbą zgodną o cyfrze setek a, cyfrze dziesiątek b i cyfrze jedności c, gdzie a\in\{1,\ldots,9\}, b,c\in\{0,\ldots,9\}. Wtedy N=100\cdot a+10\cdot b+c, a warunek z treści zapisujemy jako b=\frac{a+c}{2}, czyli 2\cdot b=a+c.

    a) Przekształcamy N, korzystając z warunku a+c=2\cdot b:
    N=100\cdot a+10\cdot b+c=99\cdot a+9\cdot b+\left(a+b+c\right)=99\cdot a+9\cdot b+\left(2\cdot b+b\right)=99\cdot a+12\cdot b=3\cdot\left(33\cdot a+4\cdot b\right).
    Liczba 33\cdot a+4\cdot b jest całkowita, więc N jest iloczynem liczby 3 i liczby całkowitej, czyli jest podzielna przez 3. To należało wykazać.

    b) Z części a) mamy N=99\cdot a+12\cdot b=9\cdot\left(11\cdot a+b\right)+3\cdot b. Liczba 9\cdot\left(11\cdot a+b\right) jest podzielna przez 9, więc
    9\mid N \iff 9\mid 3\cdot b \iff 3\mid b,
    czyli b\in\{0,3,6,9\}.
    Szukamy liczby największej, więc próbujemy kolejno największą możliwą cyfrę setek: a=9. Z warunku 2\cdot b=a+c otrzymujemy c=2\cdot b-9, a c musi być cyfrą, czyli 0\le 2\cdot b-9\le 9, skąd b\ge 4{,}5. Wraz z warunkiem 3\mid b zostają b=6 oraz b=9.
    • b=9: c=2\cdot 9-9=9, czyli liczba 999 — ma powtarzające się cyfry, więc nie spełnia warunku „trzy różne cyfry”; odrzucamy.
    • b=6: c=2\cdot 6-9=3, czyli liczba 963; cyfry 9, 6, 3 są różne.
    Sprawdzenie: \frac{9+3}{2}=6 (liczba jest zgodna) oraz 963=9\cdot 107, więc 9\mid 963.
    Każda liczba zgodna o cyfrze setek mniejszej od 9 jest mniejsza od 963, a dla a=9 jedyną dopuszczalną możliwością jest 963. Zatem szukaną liczbą jest 963.
  solution_steps:
  - 'Wprowadź zapis dziesiętny: N=100\cdot a+10\cdot b+c, a\in\{1,\ldots,9\}, b,c\in\{0,\ldots,9\}.'
  - 'Przetłumacz warunek słowny na równanie: 2\cdot b=a+c.'
  - Przekształć N=99\cdot a+9\cdot b+\left(a+b+c\right) i wykorzystaj a+c=2\cdot b, otrzymując N=99\cdot
    a+12\cdot b=3\cdot\left(33\cdot a+4\cdot b\right); wywnioskuj podzielność przez 3.
  - 'Zapisz N=9\cdot\left(11\cdot a+b\right)+3\cdot b i wywnioskuj: 9\mid N \iff 3\mid b, czyli b\in\{0,3,6,9\}.'
  - 'Przyjmij największe a=9; z 2\cdot b=9+c wyznacz c=2\cdot b-9 i sprawdź dopuszczalność cyfry c: b\ge
    4{,}5.'
  - Rozpatrz b=9 (liczba 999 — cyfry nierózne, odrzucona) i b=6 (liczba 963).
  - Sprawdź warunki dla 963 i sformułuj odpowiedź.
  answer:
    kind: MULTIPART
    parts:
    - name: dowod_podzielnosci_przez_3
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy zapisać N=100a+10b+c, wykorzystać warunek 2b=a+c i doprowadzić do postaci N=3\cdot\left(33a+4b\right)
          z całkowitym czynnikiem w nawiasie.
    - name: najwieksza_liczba
      answer:
        kind: NUMERIC
        value: 963.0
  checks:
  - kind: evaluate
    expr: 100\cdot 9+10\cdot 6+3
    var: a
    part: najwieksza_liczba
