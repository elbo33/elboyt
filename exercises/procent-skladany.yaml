    note: 'answer and reference disagree: part disagrees: 10.0 vs 0.1 (tol 1e-06)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: lokata z kapitalizacją półroczną, podatek Belki, stopa efektywna
  statement: Pani Marta wpłaciła do banku 20 000 zł na lokatę na 1,5 roku. Oprocentowanie lokaty wynosi
    6% w skali roku, a kapitalizacja odsetek następuje co pół roku. Na koniec oszczędzania bank pobiera
    jednorazowo 19% podatku od całości naliczonych odsetek. a) Oblicz kapitał na lokacie (bez podatku)
    po 1,5 roku. b) Oblicz kwotę, którą pani Marta faktycznie otrzyma po potrąceniu podatku (z dokładnością
    do 1 grosza). c) Oblicz efektywną roczną stopę procentową tej lokaty (w procentach, z dokładnością
    do 0,01 punktu procentowego).
  statement_latex: K = 20000\cdot\left(1+\frac{3}{100}\right)^{3}
  solution: |-
    Jeden okres kapitalizacji to pół roku, więc stopa jednego okresu wynosi \frac{6\%}{2}=3\%, czyli q = 1,03. W ciągu 1,5 roku mamy n = 3 okresy.
    a) K_3 = 20000\cdot 1,03^{3} = 20000\cdot 1,092727 = 21854{,}54 zł.
    b) Odsetki brutto: 21854,54 − 20000 = 1854,54 zł. Podatek: 0,19·1854,54 = 352,3626 zł, więc odsetki netto to 0,81·1854,54 = 1502,1774 zł ≈ 1502,18 zł. Do wypłaty: 20000 + 1502,18 = 21 502,18 zł.
    c) Czynnik roczny: 1,03^{2} = 1,0609, zatem r_{ef} = 1,0609 − 1 = 0,0609 = 6,09%. Stopa efektywna jest o 0,09 p.p. wyższa od nominalnej.
  solution_steps:
  - 'Ustal okres kapitalizacji: pół roku, stopa okresu 6%:2 = 3%, więc q = 1,03.'
  - 'Policz liczbę okresów: 1,5 roku = 3 półrocza, n = 3.'
  - 'Kapitał brutto: 20000·1,03³ = 21 854,54 zł.'
  - 'Odsetki brutto: 21 854,54 − 20 000 = 1854,54 zł.'
  - 'Odsetki netto: 0,81·1854,54 = 1502,18 zł, do wypłaty 20 000 + 1502,18 = 21 502,18 zł.'
  - 'Stopa efektywna: (1,03)² − 1 = 0,0609 = 6,09%.'
  answer:
    kind: MULTIPART
    parts:
    - name: kapital_brutto
      answer:
        kind: NUMERIC
        value: 21854.54
        tol: 0.01
    - name: kwota_po_podatku
      answer:
        kind: NUMERIC
        value: 21502.18
        tol: 0.01
    - name: stopa_efektywna_proc
      answer:
        kind: NUMERIC
        value: 6.09
        tol: 0.01
  checks:
  - kind: evaluate
    expr: 20000\cdot\left(1+\frac{3}{100}\right)^{3}
    part: kapital_brutto
  - kind: evaluate
    expr: 20000+\frac{81}{100}\cdot\left(20000\cdot\left(1+\frac{3}{100}\right)^{3}-20000\right)
    part: kwota_po_podatku
  - kind: evaluate
    expr: \left(\left(1+\frac{3}{100}\right)^{2}-1\right)\cdot 100
    part: stopa_efektywna_proc
  skills:
  - model wykładniczy lokaty
  - stopa okresowa r/m
  - podatek 19% od odsetek
  - efektywna stopa roczna
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [kapital_brutto] SymPy solved it fresh: 21854.54 vs 21854.54
      (tol 0.01) ; [kwota_po_podatku] SymPy solved it fresh: 21502.18 vs 21502.1774 (tol 0.01) ; [stopa_efektywna_proc]
