- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: 'amortyzacja: wyznaczanie stopy pierwiastkiem i liczby okresów'
  statement: Samochód dostawczy kupiono za 60 000 zł. Jego wartość maleje co roku o ten sam procent i
    po dwóch latach od zakupu wynosiła 43 350 zł. a) O ile procent rocznie maleje wartość tego samochodu?
    b) Oblicz wartość samochodu po 5 latach od zakupu (z dokładnością do 1 grosza). c) Po ilu pełnych
    latach od zakupu wartość samochodu po raz pierwszy spadnie poniżej 20 000 zł?
  statement_latex: 60000\cdot q^{2}=43350
  solution: |-
    Model: W(n) = 60000\cdot q^{n}, gdzie q = 1 − \frac{p}{100}.
    a) 60000\cdot q^{2} = 43350, więc q^{2} = \frac{43350}{60000} = 0{,}7225, skąd q = \sqrt{0{,}7225} = 0{,}85 (bierzemy pierwiastek dodatni). Zatem 1 − \frac{p}{100} = 0{,}85, czyli p = 15. Wartość maleje o 15% rocznie. Sprawdzenie: 60000 → 51000 → 43350. ✓
    b) W(5) = 60000\cdot 0{,}85^{5} = 60000\cdot 0{,}4437053125 = 26 622{,}32 zł (po zaokrągleniu do groszy).
    c) Szukamy najmniejszego naturalnego n, dla którego 60000\cdot 0{,}85^{n} < 20000, czyli 0{,}85^{n} < \frac{1}{3}.
    0,85⁵ ≈ 0,4437; 0,85⁶ ≈ 0,3771 (czyli 22 628,97 zł — wciąż powyżej); 0,85⁷ ≈ 0,3206 (19 234,58 zł < 20 000 zł).
    Pierwszy raz warunek zachodzi dla n = 7 (logarytmicznie: n > \frac{\log\frac{1}{3}}{\log 0{,}85} ≈ 6{,}76).
  solution_steps:
  - Zapisz model W(n) = 60000·qⁿ i równanie 60000·q² = 43350.
  - Wyznacz q² = 0,7225 i q = √0,7225 = 0,85.
  - 'Odczytaj procent spadku: p = (1 − 0,85)·100% = 15%.'
