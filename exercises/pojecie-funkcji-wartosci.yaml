- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: 'modelowanie geometryczne: pole jako funkcja szerokości ścieżki, filtracja pierwiastka'
  statement: |-
    Prostokątna działka ma wymiary 30 m × 20 m. Wzdłuż całego wewnętrznego brzegu działki wysypano żwirem ścieżkę o jednakowej szerokości, a pozostała część działki — również prostokąt — została obsiana trawą. Pole trawnika jest równe 336 m².
    a) Oblicz szerokość ścieżki.
    b) Oblicz, jaki procent powierzchni całej działki zajmuje ścieżka.
  statement_latex: P\left(x\right)=\left(30-2\cdot x\right)\cdot\left(20-2\cdot x\right)=336
  solution: |-
    a) Oznaczam przez x (w metrach) szerokość ścieżki. Ścieżka biegnie wzdłuż wszystkich czterech boków, więc trawnik jest prostokątem o bokach krótszych z obu stron o x:
    P(x) = (30 − 2x)·(20 − 2x).
    Z warunków geometrycznych 30 − 2x > 0 i 20 − 2x > 0 oraz x > 0, więc dziedziną jest przedział (0; 10).
    Rozwiązuję równanie P(x) = 336:
    (30 − 2x)(20 − 2x) = 336
    600 − 60x − 40x + 4x² = 336
    4x² − 100x + 264 = 0  | : 4
    x² − 25x + 66 = 0,  Δ = 625 − 264 = 361, √Δ = 19,
    x = (25 − 19)/2 = 3 albo x = (25 + 19)/2 = 22.
    Liczba 22 nie należy do dziedziny (22 > 10 — ścieżka szersza niż połowa działki jest niemożliwa), więc odrzucamy ją.
    Szerokość ścieżki wynosi 3 m. (Sprawdzenie: (30 − 6)(20 − 6) = 24·14 = 336 ✓.)
    b) Pole całej działki: 30·20 = 600 m². Pole ścieżki: 600 − 336 = 264 m².
    264/600 · 100% = 44%.
    Odpowiedź: ścieżka zajmuje 44% powierzchni działki.
  solution_steps:
  - Wprowadzam zmienną x — szerokość ścieżki w metrach.
  - Zauważam, że trawnik jest prostokątem o wymiarach (30 − 2x) m × (20 − 2x) m, więc P(x) = (30 − 2x)(20
    − 2x).
  - 'Ustalam dziedzinę: x > 0, 20 − 2x > 0, czyli x ∈ (0; 10).'
  - Zapisuję równanie (30 − 2x)(20 − 2x) = 336 i doprowadzam je do postaci x² − 25x + 66 = 0.
  - Obliczam Δ = 361 i pierwiastki x = 3 oraz x = 22.
  - Odrzucam x = 22 jako liczbę spoza dziedziny; szerokość ścieżki to 3 m.
  - Obliczam pole działki 600 m² i pole ścieżki 600 − 336 = 264 m².
  - Obliczam 264/600 · 100% = 44%.
  answer:
    kind: MULTIPART
    parts:
    - name: szerokosc_sciezki_m
      answer:
        kind: NUMERIC
        value: 3.0
    - name: procent_powierzchni_sciezki
      answer:
        kind: NUMERIC
        value: 44.0
  checks:
  - kind: evaluate
    expr: \frac{25-\sqrt{625-264}}{2}
    part: szerokosc_sciezki_m
  - kind: evaluate
    expr: \frac{600-336}{600}\cdot 100
    part: procent_powierzchni_sciezki
