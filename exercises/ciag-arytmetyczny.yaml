    Kontrola: a_{20} = 9 + 19\cdot 3 = 66, S_{20} = \frac{9 + 66}{2}\cdot 20 = \frac{75}{2}\cdot 20 = 750. ✓
    Odpowiedź: boki mają długości 9, 12 i 15, pole trójkąta wynosi 54, a S_{20} = 750.
