    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 3 members matched'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: równanie wielomianowe z niewiadomą po obu stronach
  statement: Rozwiąż równanie 2x^{3}-5x^{2}=18x-45. Zapisz obliczenia.
  statement_latex: 2x^{3}-5x^{2}=18x-45
  solution: |-
    Przenosimy wszystkie wyrazy na lewą stronę:
    2x^{3}-5x^{2}-18x+45=0.
    Grupujemy w pary:
    \left(2x^{3}-5x^{2}\right)+\left(-18x+45\right)=x^{2}\left(2x-5\right)-9\left(2x-5\right)=\left(2x-5\right)\left(x^{2}-9\right)=0.
    Czynnik x^{2}-9 rozkładamy jako różnicę kwadratów: \left(x-3\right)\left(x+3\right). Zatem
    \left(2x-5\right)\left(x-3\right)\left(x+3\right)=0.
    Stąd 2x-5=0 lub x-3=0 lub x+3=0, czyli x=\frac{5}{2} lub x=3 lub x=-3.
    Sprawdzenie dla x=3: lewa strona równania wyjściowego 2\cdot27-5\cdot9=9, prawa 18\cdot3-45=9 — zgadza się.
    Odpowiedź: x\in\left\{-3,\frac{5}{2},3\right\}.
  solution_steps:
  - 'Przenieś wszystko na lewą stronę: 2x^{3}-5x^{2}-18x+45=0.'
  - 'Pogrupuj wyrazy w pary i wyłącz czynniki: x^{2}\left(2x-5\right)-9\left(2x-5\right).'
  - 'Wyłącz wspólny nawias: \left(2x-5\right)\left(x^{2}-9\right)=0.'
  - 'Rozłóż różnicę kwadratów: \left(2x-5\right)\left(x-3\right)\left(x+3\right)=0.'
  - Z własności iloczynu zerowego otrzymaj x=\frac{5}{2}, x=3, x=-3 i sprawdź jedno z rozwiązań.
  answer:
    kind: SET
    members:
    - '-3'
    - \frac{5}{2}
    - '3'
  checks:
  - kind: solve_equation
    expr: 2x^{3}-5x^{2}=18x-45
  skills:
  - przenoszenie wyrazów na jedną stronę
  - metoda grupowania
  - różnica kwadratów
  - własność iloczynu zerowego
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 3 members matched'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: równanie dwukwadratowe i rozkład na czynniki
  statement: Dany jest wielomian W\left(x\right)=x^{4}-7x^{2}+12. Rozłóż wielomian W na czynniki liniowe,
    a następnie rozwiąż równanie W\left(x\right)=0. Zapisz obliczenia.
  statement_latex: W\left(x\right)=x^{4}-7x^{2}+12
  solution: |-
    Rozbijamy środkowy wyraz: -7x^{2}=-3x^{2}-4x^{2}, więc
    x^{4}-3x^{2}-4x^{2}+12=x^{2}\left(x^{2}-3\right)-4\left(x^{2}-3\right)=\left(x^{2}-3\right)\left(x^{2}-4\right).
    (Ten sam wynik daje podstawienie t=x^{2}: t^{2}-7t+12 ma \Delta=49-48=1, więc t=3 lub t=4.)
    Każdy z czynników jest różnicą kwadratów:
    x^{2}-3=\left(x-\sqrt{3}\right)\left(x+\sqrt{3}\right), \quad x^{2}-4=\left(x-2\right)\left(x+2\right).
    Zatem W\left(x\right)=\left(x-\sqrt{3}\right)\left(x+\sqrt{3}\right)\left(x-2\right)\left(x+2\right).
    Równanie W\left(x\right)=0 daje x=\sqrt{3} lub x=-\sqrt{3} lub x=2 lub x=-2.
    Kontrola: stopień wielomianu wynosi 4 i otrzymaliśmy dokładnie 4 różne pierwiastki.
    Odpowiedź: W\left(x\right)=\left(x-2\right)\left(x+2\right)\left(x-\sqrt{3}\right)\left(x+\sqrt{3}\right); x\in\left\{-2,-\sqrt{3},\sqrt{3},2\right\}.
  solution_steps:
  - 'Rozbij środkowy wyraz: -7x^{2}=-3x^{2}-4x^{2} (albo podstaw t=x^{2}).'
  - 'Zgrupuj i wyłącz wspólny nawias: \left(x^{2}-3\right)\left(x^{2}-4\right).'
  - 'Rozłóż każdy czynnik jako różnicę kwadratów: \left(x-\sqrt{3}\right)\left(x+\sqrt{3}\right)\left(x-2\right)\left(x+2\right).'
  - 'Przyrównaj czynniki do zera i wróć do zmiennej x: x^{2}=3 daje x=\pm\sqrt{3}, x^{2}=4 daje x=\pm
    2.'
  - Sprawdź, że liczba różnych pierwiastków (4) nie przekracza stopnia wielomianu.
  answer:
    kind: MULTIPART
    parts:
    - name: postać iloczynowa
      answer:
        kind: SYMBOLIC
        latex: \left(x-2\right)\left(x+2\right)\left(x-\sqrt{3}\right)\left(x+\sqrt{3}\right)
    - name: rozwiązania
      answer:
        kind: SET
        members:
        - '-2'
        - '2'
        - -\sqrt{3}
        - \sqrt{3}
  checks:
  - kind: solve_equation
    expr: x^{4}-7x^{2}+12=0
    part: rozwiązania
  skills:
  - rozkład wielomianu dwukwadratowego
  - powrót od zmiennej pomocniczej do x
  - kontrola liczby pierwiastków
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: PARSE_ERROR: "UnexpectedCharacters: No terminal matches
      ''('' in the current parser context, at line 1 col 25"'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: rozkład wielomianu na czynniki i rozwiązanie równania wielomianowego
  statement: |-
    Dany jest wielomian W(x)=2x^{4}+5x^{3}-18x^{2}-45x.
    a) Doprowadź wielomian W do postaci iloczynu czynników stopnia co najwyżej pierwszego.
    b) Rozwiąż równanie W(x)=0.
    c) Oblicz sumę wszystkich rozwiązań tego równania.
    Zapisz obliczenia.
  statement_latex: W(x)=2x^{4}+5x^{3}-18x^{2}-45x
  solution: |-
    Każdy składnik zawiera x, więc najpierw wyłączamy x przed nawias:
    W(x)=x\cdot\left(2x^{3}+5x^{2}-18x-45\right).
    W nawiasie mamy cztery składniki — stosujemy grupowanie:
    2x^{3}+5x^{2}-18x-45=\left(2x^{3}+5x^{2}\right)+\left(-18x-45\right)=x^{2}\cdot\left(2x+5\right)-9\cdot\left(2x+5\right)=\left(2x+5\right)\cdot\left(x^{2}-9\right).
    (Uwaga na znak: -18x-45=-9\cdot\left(2x+5\right), bo -9\cdot5=-45.)
    Czynnik x^{2}-9 to różnica kwadratów: x^{2}-3^{2}=\left(x-3\right)\cdot\left(x+3\right). Zatem
    W(x)=x\cdot\left(2x+5\right)\cdot\left(x-3\right)\cdot\left(x+3\right).
    Równanie W(x)=0 ma postać iloczynową, więc z własności iloczynu zerowego:
    x=0 lub 2x+5=0 lub x-3=0 lub x+3=0,
    czyli x=0 lub x=-\frac{5}{2} lub x=3 lub x=-3.
    Stopień wielomianu wynosi 4 i otrzymaliśmy dokładnie 4 różne pierwiastki — wynik jest zgodny z kontrolą.
    Suma wszystkich rozwiązań: 0+\left(-\frac{5}{2}\right)+3+\left(-3\right)=-\frac{5}{2}.
    Odpowiedź: W(x)=x\left(2x+5\right)\left(x-3\right)\left(x+3\right), x\in\left\{-3,-\frac{5}{2},0,3\right\}, suma rozwiązań wynosi -\frac{5}{2}.
  solution_steps:
  - 'Wyłącz wspólny czynnik x: W(x)=x\cdot\left(2x^{3}+5x^{2}-18x-45\right).'
  - 'Zgrupuj składniki w nawiasie: \left(2x^{3}+5x^{2}\right)+\left(-18x-45\right)=x^{2}\cdot\left(2x+5\right)-9\cdot\left(2x+5\right).'
  - 'Wyłącz wspólny nawias: \left(2x+5\right)\cdot\left(x^{2}-9\right).'
  - 'Rozłóż różnicę kwadratów: x^{2}-9=\left(x-3\right)\cdot\left(x+3\right), więc W(x)=x\left(2x+5\right)\left(x-3\right)\left(x+3\right).'
  - 'Zastosuj własność iloczynu zerowego: x=0 lub 2x+5=0 lub x-3=0 lub x+3=0.'
  - 'Rozwiąż równania cząstkowe: x=0, x=-\frac{5}{2}, x=3, x=-3.'
  - 'Oblicz sumę rozwiązań: 0+\left(-\frac{5}{2}\right)+3+\left(-3\right)=-\frac{5}{2}.'
  answer:
    kind: MULTIPART
    parts:
    - name: postac_iloczynowa
      answer:
        kind: SYMBOLIC
        latex: x\left(2x+5\right)\left(x-3\right)\left(x+3\right)
    - name: rozwiazania
      answer:
        kind: SET
        members:
        - '-3'
        - -\frac{5}{2}
        - '0'
        - '3'
    - name: suma_rozwiazan
      answer:
        kind: NUMERIC
        value: -2.5
  checks:
  - kind: solve_equation
    expr: 2x^{4}+5x^{3}-18x^{2}-45x
    part: rozwiazania
  - kind: evaluate
    expr: 0+\left(-\frac{5}{2}\right)+3+\left(-3\right)
    part: suma_rozwiazan
  skills:
  - wyłączanie wspólnego czynnika przed nawias
  - metoda grupowania
  - różnica kwadratów
  - własność iloczynu zerowego
  - kontrola liczby pierwiastków a stopień wielomianu
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 5
  exercise_type: równanie dwukwadratowe i pełny rozkład na czynniki liniowe
  statement: |-
    Dane jest równanie 4x^{4}+4=17x^{2}.
    a) Przekształć to równanie do postaci W(x)=0 i zapisz wielomian W w postaci iloczynu czterech czynników liniowych.
    b) Rozwiąż to równanie.
    c) Podaj największe rozwiązanie tego równania.
    Zapisz obliczenia.
  statement_latex: 4x^{4}+4=17x^{2}
  solution: |-
    Przenosimy wszystko na lewą stronę:
    4x^{4}-17x^{2}+4=0.
    Podstawiamy t=x^{2}, przy czym t\ge 0. Otrzymujemy równanie kwadratowe
    4t^{2}-17t+4=0,
    \Delta=\left(-17\right)^{2}-4\cdot4\cdot4=289-64=225, \sqrt{\Delta}=15,
    t_{1}=\frac{17-15}{2\cdot4}=\frac{2}{8}=\frac{1}{4}, \qquad t_{2}=\frac{17+15}{2\cdot4}=\frac{32}{8}=4.
    Stąd 4t^{2}-17t+4=4\cdot\left(t-\frac{1}{4}\right)\cdot\left(t-4\right), czyli po powrocie do x:
    4x^{4}-17x^{2}+4=4\cdot\left(x^{2}-\frac{1}{4}\right)\cdot\left(x^{2}-4\right)=\left(4x^{2}-1\right)\cdot\left(x^{2}-4\right).
    Oba czynniki są różnicami kwadratów:
    4x^{2}-1=\left(2x-1\right)\cdot\left(2x+1\right), \qquad x^{2}-4=\left(x-2\right)\cdot\left(x+2\right).
    Zatem W(x)=\left(2x-1\right)\left(2x+1\right)\left(x-2\right)\left(x+2\right).
    Z własności iloczynu zerowego:
    2x-1=0 lub 2x+1=0 lub x-2=0 lub x+2=0,
    czyli x=\frac{1}{2} lub x=-\frac{1}{2} lub x=2 lub x=-2.
    (Równoważnie: x^{2}=\frac{1}{4} daje x=\pm\frac{1}{2}, a x^{2}=4 daje x=\pm 2 — pamiętamy o obu znakach.)
    Stopień wielomianu wynosi 4 i mamy 4 różne pierwiastki. Największym rozwiązaniem jest x=2.
    Sprawdzenie dla x=2: lewa strona 4\cdot16+4=68, prawa 17\cdot4=68.
    Odpowiedź: W(x)=\left(2x-1\right)\left(2x+1\right)\left(x-2\right)\left(x+2\right), x\in\left\{-2,-\frac{1}{2},\frac{1}{2},2\right\}, największe rozwiązanie to 2.
  solution_steps:
  - 'Przenieś wszystko na lewą stronę: 4x^{4}-17x^{2}+4=0.'
  - 'Podstaw t=x^{2} i rozwiąż 4t^{2}-17t+4=0: \Delta=225, t_{1}=\frac{1}{4}, t_{2}=4.'
  - 'Zapisz rozkład: 4x^{4}-17x^{2}+4=\left(4x^{2}-1\right)\cdot\left(x^{2}-4\right).'
  - 'Rozłóż obie różnice kwadratów: W(x)=\left(2x-1\right)\left(2x+1\right)\left(x-2\right)\left(x+2\right).'
  - 'Zastosuj własność iloczynu zerowego i rozwiąż cztery równania liniowe: x=\frac{1}{2}, x=-\frac{1}{2},
    x=2, x=-2.'
