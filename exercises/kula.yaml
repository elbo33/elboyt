  exercise_type: 'demonstracja błędu: środek kuli opisanej na ostrosłupie'
  statement: Dany jest ostrosłup prawidłowy czworokątny o krawędzi podstawy a = 6\sqrt{2} i wysokości
    H = 8. Uczeń, licząc promień kuli opisanej na tym ostrosłupie, przyjął, że środek kuli dzieli wysokość
    na połowy, i otrzymał R = \sqrt{6^{2}+4^{2}} = \sqrt{52} = 2\sqrt{13}. Wyjaśnij, dlaczego to rozumowanie
    jest błędne, i oblicz poprawną wartość promienia kuli opisanej.
  statement_latex: R^{2} = R_{p}^{2}+\left(H-R\right)^{2},\qquad R_{p} = 6,\ H = 8
  solution: |-
    Krok 0. Promień okręgu opisanego na podstawie: przekątna kwadratu ma długość a\sqrt{2} = 6\sqrt{2}\cdot\sqrt{2} = 12, więc R_{p} = 6.
    Błędne rozumowanie: uczeń założył, że środek kuli opisanej leży w połowie wysokości (odległość od podstawy równa \frac{H}{2} = 4) i policzył R = \sqrt{R_{p}^{2}+\left(\frac{H}{2}\right)^{2}} = \sqrt{36+16} = 2\sqrt{13}\approx 7{,}21.
    Dlaczego to źle: podział wysokości na połowy obowiązuje tylko dla brył z dwiema przystającymi, równoległymi podstawami (graniastosłup prosty, walec). W ostrosłupie środek kuli opisanej musi być jednakowo oddalony od wierzchołka ostrosłupa i od wierzchołków podstawy, a te punkty nie leżą symetrycznie względem połowy wysokości. Sprawdzenie: przy R = 2\sqrt{13} odległość środka od wierzchołka wynosiłaby H - \frac{H}{2} = 4 \ne 2\sqrt{13}, czyli wierzchołek nie leżałby na sferze.
    Poprawne rozwiązanie: środek leży na wysokości w odległości H - R od podstawy, więc R^{2} = R_{p}^{2}+\left(H-R\right)^{2}, czyli R^{2} = 36 + 64 - 16R + R^{2}, stąd 16R = 100 oraz R = \frac{100}{16} = \frac{25}{4} = 6{,}25.
    (Kontrola wzorem R = \frac{b^{2}}{2H}, gdzie b^{2} = R_{p}^{2}+H^{2} = 100: R = \frac{100}{16} = \frac{25}{4}.)
    Odpowiedź: R = \frac{25}{4}.
  solution_steps:
  - Oblicz R_{p} = \frac{6\sqrt{2}\cdot\sqrt{2}}{2} = 6.
  - 'Wskaż błąd: w ostrosłupie środek kuli opisanej nie leży w połowie wysokości.'
  - Zapisz poprawne równanie R^{2} = 6^{2}+\left(8-R\right)^{2}.
  - 'Rozwiąż: 16R = 100, czyli R = \frac{25}{4}.'
