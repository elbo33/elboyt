- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: losowanie dwóch kul bez zwracania
  statement: 'W urnie znajduje się 12 kul: 4 kule białe, 5 kul czarnych i 3 kule zielone. Kule różnią
    się wyłącznie kolorem. Z urny losujemy jednocześnie dwie kule. Oblicz prawdopodobieństwo zdarzenia
    A polegającego na tym, że obie wylosowane kule są tego samego koloru, oraz prawdopodobieństwo zdarzenia
    B polegającego na tym, że wśród wylosowanych kul jest co najmniej jedna kula zielona. Zapisz obliczenia.'
  statement_latex: '|\Omega|=\frac{12\cdot 11}{2}=66,\qquad P(A)=\frac{19}{66},\qquad P(B)=1-\frac{\frac{9\cdot
    8}{2}}{66}'
  solution: |-
    Losujemy jednocześnie, więc kolejność nie jest istotna: \Omega to zbiór dwuelementowych podzbiorów zbioru 12 kul, czyli |\Omega|=\frac{12\cdot 11}{2}=66.
    Zdarzenie A: obie kule tego samego koloru. Par białych jest \frac{4\cdot 3}{2}=6, par czarnych \frac{5\cdot 4}{2}=10, par zielonych \frac{3\cdot 2}{2}=3. Te przypadki wykluczają się, więc |A|=6+10+3=19 oraz P(A)=\frac{19}{66}.
    Zdarzenie B: co najmniej jedna kula zielona. Wygodnie użyć zdarzenia przeciwnego B': „ani jedna kula nie jest zielona”, czyli obie kule wybrano spośród 9 kul niezielonych: |B'|=\frac{9\cdot 8}{2}=36, więc P(B')=\frac{36}{66}=\frac{6}{11}.
    Stąd P(B)=1-\frac{6}{11}=\frac{5}{11}.
    Oba wyniki należą do przedziału [0,1].
  solution_steps:
  - 'Przyjmujemy model bez kolejności: |\Omega|=\frac{12\cdot 11}{2}=66.'
  - 'Liczymy pary jednokolorowe: \frac{4\cdot 3}{2}+\frac{5\cdot 4}{2}+\frac{3\cdot 2}{2}=6+10+3=19.'
  - P(A)=\frac{19}{66}.
  - 'Zdarzenie przeciwne do B: obie kule spośród 9 niezielonych, |B''|=\frac{9\cdot 8}{2}=36.'
  - P(B)=1-\frac{36}{66}=\frac{5}{11}.
  answer:
    kind: MULTIPART
    parts:
    - name: P(A)
      answer:
        kind: SYMBOLIC
        latex: \frac{19}{66}
    - name: P(B)
      answer:
        kind: SYMBOLIC
        latex: \frac{5}{11}
  checks:
  - kind: evaluate
    expr: \frac{\frac{4\cdot 3}{2}+\frac{5\cdot 4}{2}+\frac{3\cdot 2}{2}}{\frac{12\cdot 11}{2}}
    part: P(A)
  - kind: evaluate
    expr: 1-\frac{\frac{9\cdot 8}{2}}{\frac{12\cdot 11}{2}}
    part: P(B)
  skills:
  - liczba par bez uwzględniania kolejności
  - zdarzenia wykluczające się
