  exercise_type: odczyt informacji z wykresu (łamana o danych wierzchołkach)
  statement: |-
    Wykresem funkcji f jest łamana złożona z trzech odcinków: AB, BC i CD, gdzie A = (−4, −2), B = (−1, 4), C = (3, −4), D = (5, 0). Dziedziną funkcji f jest przedział ⟨−4, 5⟩.
    a) Podaj dziedzinę i zbiór wartości funkcji f.
    b) Odczytaj f(−4) oraz f(3).
    c) Wyznacz wszystkie miejsca zerowe funkcji f.
    d) Wyznacz wszystkie rozwiązania równania f(x) = 2.
    e) Podaj największą wartość funkcji f oraz argument, dla którego jest ona przyjmowana.
  statement_latex: A=\left(-4,\,-2\right),\quad B=\left(-1,\,4\right),\quad C=\left(3,\,-4\right),\quad
    D=\left(5,\,0\right)
  solution: |-
    Wyznaczam wzory poszczególnych odcinków.
    AB, x ∈ ⟨−4, −1⟩: a = (4 − (−2))/(−1 − (−4)) = 6/3 = 2, więc y = 2x + 6 (sprawdzenie: dla x = −4 mamy −2 ✓).
    BC, x ∈ ⟨−1, 3⟩: a = (−4 − 4)/(3 − (−1)) = −8/4 = −2, więc y = −2x + 2 (dla x = −1 mamy 4 ✓).
    CD, x ∈ ⟨3, 5⟩: a = (0 − (−4))/(5 − 3) = 4/2 = 2, więc y = 2x − 10 (dla x = 3 mamy −4 ✓).

    a) Rzut wykresu na oś OX to przedział ⟨−4, 5⟩ — to dziedzina. Najniżej leży punkt C o rzędnej −4, najwyżej punkt B o rzędnej 4, a wykres jest łamaną ciągłą, więc ZW = ⟨−4, 4⟩.
    b) f(−4) = 2·(−4) + 6 = −2 (rzędna punktu A); f(3) = 2·3 − 10 = −4 (rzędna punktu C).
    c) 2x + 6 = 0 ⟹ x = −3 ∈ ⟨−4, −1⟩ ✓; −2x + 2 = 0 ⟹ x = 1 ∈ ⟨−1, 3⟩ ✓; 2x − 10 = 0 ⟹ x = 5 ∈ ⟨3, 5⟩ ✓. Miejsca zerowe: −3, 1, 5.
    d) Prowadzę prostą y = 2: 2x + 6 = 2 ⟹ x = −2 ∈ ⟨−4, −1⟩ ✓; −2x + 2 = 2 ⟹ x = 0 ∈ ⟨−1, 3⟩ ✓; 2x − 10 = 2 ⟹ x = 6 ∉ ⟨3, 5⟩ — odrzucam. Równanie f(x) = 2 ma dwa rozwiązania: x = −2 oraz x = 0.
    e) Największa wartość funkcji jest równa 4 i jest przyjmowana dla argumentu x = −1.
  solution_steps:
  - 'Wyznaczam wzór odcinka AB: współczynnik kierunkowy 6/3 = 2, więc y = 2x + 6 dla x ∈ ⟨−4, −1⟩.'
  - 'Wyznaczam wzór odcinka BC: współczynnik kierunkowy −8/4 = −2, więc y = −2x + 2 dla x ∈ ⟨−1, 3⟩.'
  - 'Wyznaczam wzór odcinka CD: współczynnik kierunkowy 4/2 = 2, więc y = 2x − 10 dla x ∈ ⟨3, 5⟩.'
  - 'Rzutuję wykres na oś OX: dziedzina D = ⟨−4, 5⟩; rzutuję na oś OY: ZW = ⟨−4, 4⟩.'
  - Odczytuję f(−4) = −2 oraz f(3) = −4 (rzędne punktów A i C).
  - 'Rozwiązuję równania odcinków równe 0: x = −3, x = 1, x = 5 — wszystkie należą do swoich przedziałów.'
  - 'Rozwiązuję równania odcinków równe 2: x = −2 ✓, x = 0 ✓, x = 6 ✗ (spoza ⟨3, 5⟩).'
  - Największa wartość to 4, przyjmowana dla x = −1 (punkt B).
