- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: okręgi styczne i wspólna styczna
  statement: 'Okrąg o środku O₁ i promieniu 12 oraz okrąg o środku O₂ i promieniu 3 są styczne zewnętrznie.
    Prosta k jest wspólną styczną zewnętrzną tych okręgów (nie przechodzi między nimi): jest styczna do
    pierwszego okręgu w punkcie A i do drugiego okręgu w punkcie B. Oblicz odległość środków |O₁O₂| oraz
    długość odcinka AB. Zapisz obliczenia.'
  statement_latex: '|O_1O_2| = 12+3,\qquad |AB| = \sqrt{\left(12+3\right)^{2}-\left(12-3\right)^{2}}'
  solution: |-
    Okręgi są styczne zewnętrznie, więc |O_1O_2| = r_1 + r_2 = 12 + 3 = 15.
    Promienie O_1A i O_2B są prostopadłe do wspólnej stycznej k, więc są równoległe, a czworokąt ABO_2O_1 jest trapezem prostokątnym o podstawach |O_1A| = 12 i |O_2B| = 3 oraz ramieniu AB prostopadłym do obu podstaw.
    Z punktu O_2 poprowadźmy odcinek równoległy do AB, przecinający odcinek O_1A w punkcie C. Wtedy |O_2C| = |AB|, |AC| = |O_2B| = 3, więc |O_1C| = 12 - 3 = 9, a trójkąt O_1CO_2 jest prostokątny przy C z przeciwprostokątną |O_1O_2| = 15.
    Z twierdzenia Pitagorasa: |AB|^{2} = |O_2C|^{2} = 15^{2} - 9^{2} = 225 - 81 = 144, czyli |AB| = 12.
    Odpowiedź: |O_1O_2| = 15, |AB| = 12.
  solution_steps:
  - 'Styczność zewnętrzna: |O1O2| = 12 + 3 = 15.'
  - Promienie do punktów styczności są prostopadłe do prostej k, więc ABO2O1 to trapez prostokątny o podstawach
    12 i 3.
  - Poprowadź z O2 odcinek równoległy do AB; powstaje trójkąt prostokątny o przyprostokątnej 12 − 3 =
    9 i przeciwprostokątnej 15.
  - '|AB|² = 225 − 81 = 144.'
  - '|AB| = 12.'
  answer:
    kind: MULTIPART
    parts:
    - name: odleglosc_srodkow
      answer:
        kind: NUMERIC
        value: 15.0
        latex: '15'
    - name: dlugosc_AB
      answer:
        kind: NUMERIC
        value: 12.0
        latex: '12'
  checks:
  - kind: evaluate
    expr: 12+3
    part: odleglosc_srodkow
  - kind: evaluate
    expr: \sqrt{\left(12+3\right)^{2}-\left(12-3\right)^{2}}
    part: dlugosc_AB
  skills:
  - okręgi styczne zewnętrznie
  - styczna prostopadła do promienia
  - trapez prostokątny i Pitagoras
