  statement: Uczeń obliczał wartość wyrażenia W = 2\cdot\cos 150^{\circ} + \sqrt{3}\cdot\sin 150^{\circ},
    stosując wzór \cos\left(180^{\circ}-\alpha\right)=\cos\alpha, i otrzymał W=\frac{3\sqrt{3}}{2}. Wyjaśnij,
