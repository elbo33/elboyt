- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: Trapez z przekątnymi – równanie kwadratowe i selekcja pierwiastka
  statement: W trapezie ABCD podstawy AB i CD są równoległe, a przekątne AC i BD przecinają się w punkcie
    S. Wiadomo, że |AB| = 12, |AC| = 15 oraz |AS| \cdot |SC| = 54. Ponadto podstawa AB jest dłuższa od
    podstawy CD. Oblicz |AS| oraz długość podstawy CD.
  statement_latex: x\cdot\left(15-x\right)=54,\qquad \frac{|AS|}{|SC|}=\frac{|AB|}{|CD|}
  solution: |-
    Krok 1 (wybór niewiadomej). Punkt S leży wewnątrz przekątnej AC, więc oznaczmy |AS| = x, gdzie 0 < x < 15. Wtedy |SC| = 15 - x.
    Z warunku |AS|\cdot|SC| = 54 otrzymujemy
    x\cdot\left(15-x\right)=54, czyli x^{2}-15x+54=0.
    Δ = \left(-15\right)^{2}-4\cdot 1\cdot 54 = 225-216 = 9, \sqrt{\Delta}=3,
    x_{1}=\frac{15-3}{2}=6, x_{2}=\frac{15+3}{2}=9.
    Oba pierwiastki należą do przedziału (0, 15), więc trzeba je rozstrzygnąć warunkiem geometrycznym.
    Krok 2 (odrzucenie pierwiastka). Trójkąty ABS i CDS są podobne (kąty ASB i CSD wierzchołkowe, kąty BAS i DCS naprzemianległe przy AB ∥ CD), więc
    \frac{|AS|}{|SC|}=\frac{|AB|}{|CD|}.
    Skoro |AB| > |CD|, to \frac{|AB|}{|CD|} > 1, a zatem |AS| > |SC|. Warunek ten spełnia tylko x = 9 (wtedy |SC| = 6); dla x = 6 mielibyśmy |AS| < |SC|, czyli AB krótsze od CD.
    Zatem |AS| = 9, |SC| = 6.
    Krok 3 (podstawa CD). Z proporcji \frac{9}{6}=\frac{12}{|CD|} mamy 9\cdot|CD| = 6\cdot 12 = 72, więc
    |CD| = \frac{12\cdot 6}{9} = 8.
    Sprawdzenie: 9 + 6 = 15 ✓, 9\cdot 6 = 54 ✓, \frac{9}{6}=\frac{12}{8}=1{,}5 ✓ oraz 12 > 8 ✓.
    Odpowiedź: |AS| = 9, |CD| = 8.
  solution_steps:
