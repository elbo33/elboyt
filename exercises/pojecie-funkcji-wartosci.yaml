  - 'Podstawiamy poprawnie: f(-3)=\left(-3\right)^{2}-4\cdot\left(-3\right)=9+12=21.'
  - 'Podstawiamy drugi argument: f\left(-\frac{1}{2}\right)=\left(-\frac{1}{2}\right)^{2}-4\cdot\left(-\frac{1}{2}\right)=\frac{1}{4}+2=\frac{9}{4}.'
  - Zapisujemy odpowiedzi.
