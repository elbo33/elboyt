  statement: Rozwiąż nierówność 5^{x-2} < 5^{6}. Zbiór rozwiązań zapisz w postaci przedziału.
  statement_latex: 5^{x-2} < 5^{6}
  solution: |-
    Podstawą obu potęg jest liczba 5, a 5 > 1, więc potęgowanie o tej podstawie jest rosnące i przy opuszczaniu potęgowania zachowujemy znak nierówności:
    x - 2 < 6
    x < 8.
    Zbiór rozwiązań: x \in \left(-\infty, 8\right).
    Sprawdzenie: dla x = 0 mamy 5^{-2} = \frac{1}{25} < 5^{6} — nierówność jest spełniona.
  solution_steps:
  - Zauważ, że obie strony mają tę samą podstawę 5 i że 5 > 1.
  - 'Opuść potęgowanie bez zmiany znaku nierówności: x - 2 < 6.'
  - 'Rozwiąż nierówność liniową: x < 8.'
  - 'Zapisz zbiór rozwiązań: x \in \left(-\infty, 8\right).'
