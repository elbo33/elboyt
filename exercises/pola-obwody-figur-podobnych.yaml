    Na czym polega błąd: odwrócony kierunek skali. Zapis „F_{2} jest podobny do F_{1} w skali k” oznacza P(F_{2}) = k^{2}\cdot P(F_{1}), a więc szukane pole jest w mianowniku, a nie w liczniku. Skoro k = \frac{3}{2} > 1, czworokąt F_{2} jest większy, więc pole F_{1} musi być mniejsze niż 45 cm², a nie większe.
