- id: g-cm-09
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 3
  exercise_type: interpretacja symbolu f(x)
  statement: 'Dana jest funkcja f określona wzorem f(x) = x^2 + 3x dla wszystkich liczb rzeczywistych
    x. Oblicz f(5) oraz sumę f(2) + f(3), a następnie rozstrzygnij, czy prawdziwa jest równość f(2 + 3)
    = f(2) + f(3). Uczeń napisał: "f(2 + 3) = f(2) + f(3), bo f(x) to f razy x, a mnożenie jest rozdzielne
    względem dodawania". Wyjaśnij, dlaczego to rozumowanie jest błędne.'
  statement_latex: f\left(x\right)=x^{2}+3\cdot x
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: "f(x) = f·x, więc f(2 + 3) = f·2 + f·3 = f(2) + f(3)" — z tego uczeń wnioskuje, że równość zachodzi.
    NA CZYM POLEGA BŁĄD: zapis f(x) czytamy "ef od iks" i oznacza on WARTOŚĆ funkcji dla argumentu x, a nie iloczyn litery f przez x. Nie wolno więc "wymnażać nawiasu". Aby obliczyć f(2 + 3), trzeba najpierw dodać: 2 + 3 = 5, a potem podstawić 5 do wzoru.
    POPRAWNE OBLICZENIA:
    f(5) = (5)² + 3·(5) = 25 + 15 = 40.
    f(2) = (2)² + 3·(2) = 4 + 6 = 10, f(3) = (3)² + 3·(3) = 9 + 9 = 18, zatem f(2) + f(3) = 10 + 18 = 28.
    Ponieważ f(2 + 3) = f(5) = 40, a f(2) + f(3) = 28, mamy 40 ≠ 28, więc równość jest FAŁSZYWA.
    Odpowiedź: f(5) = 40, f(2) + f(3) = 28; równość f(2 + 3) = f(2) + f(3) nie zachodzi.
  solution_steps:
  - 'Rozpoznajemy błąd: f(x) nie jest iloczynem f\cdot x, lecz symbolem wartości funkcji.'
  - Obliczamy f(5)=\left(5\right)^{2}+3\cdot\left(5\right)=40, bo f(2+3)=f(5).
  - Obliczamy f(2)=10 oraz f(3)=18, więc f(2)+f(3)=28.
  - 'Porównujemy: 40\ne 28, zatem równość jest fałszywa.'
  answer:
    kind: MULTIPART
    parts:
    - name: f(5)
      answer:
        kind: NUMERIC
        value: 40.0
    - name: f(2)+f(3)
      answer:
        kind: NUMERIC
        value: 28.0
    - name: czy zachodzi f(2+3)=f(2)+f(3)
      answer:
        kind: BOOLEAN
        truth: false
