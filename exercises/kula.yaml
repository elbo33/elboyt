    note: 3 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 5
  exercise_type: kula opisana i wpisana — ostrosłup prawidłowy czworokątny
  statement: Dany jest ostrosłup prawidłowy czworokątny ABCDS o krawędzi podstawy a = 6 i wysokości H
    = 4. Oblicz pole powierzchni kuli opisanej na tym ostrosłupie oraz objętość kuli wpisanej w ten ostrosłup.
    Zapisz obliczenia.
  statement_latex: R_{o} = \frac{b^{2}}{2\cdot H},\qquad R_{w} = \frac{\rho_{p}\cdot H}{\rho_{p}+m},\qquad
    S = 4\pi R_{o}^{2},\qquad V = \frac{4}{3}\pi R_{w}^{3}
  solution: |-
    Krok 1. Podstawą jest kwadrat o boku 6. Promień okręgu opisanego na podstawie to połowa przekątnej:
    R_{p} = \frac{6\sqrt{2}}{2} = 3\sqrt{2}, a promień okręgu wpisanego w podstawę \rho_{p} = \frac{6}{2} = 3.
    Krok 2. Krawędź boczna: b^{2} = R_{p}^{2}+H^{2} = 18+16 = 34.
    Krok 3. Środek kuli opisanej leży na wysokości ostrosłupa i spełnia R^{2} = R_{p}^{2}+\left(H-R\right)^{2}, skąd
    R_{o} = \frac{b^{2}}{2\cdot H} = \frac{34}{2\cdot 4} = \frac{17}{4}.
    Krok 4. Pole powierzchni kuli opisanej: S = 4\pi\left(\frac{17}{4}\right)^{2} = 4\pi\cdot\frac{289}{16} = \frac{289\pi}{4}.
    Krok 5. Apotema (wysokość ściany bocznej): m = \sqrt{H^{2}+\rho_{p}^{2}} = \sqrt{16+9} = 5.
    Krok 6. Przekrój ostrosłupa przez apotemy przeciwległych ścian to trójkąt równoramienny o podstawie 2\rho_{p} = 6 i wysokości H = 4; kula wpisana daje w nim okrąg wpisany:
    R_{w} = \frac{\rho_{p}\cdot H}{\rho_{p}+m} = \frac{3\cdot 4}{3+5} = \frac{3}{2}.
    Krok 7. Objętość kuli wpisanej: V = \frac{4}{3}\pi\left(\frac{3}{2}\right)^{3} = \frac{4}{3}\pi\cdot\frac{27}{8} = \frac{9\pi}{2}.
    Odpowiedź: S = \frac{289\pi}{4}, V = \frac{9\pi}{2}.
  solution_steps:
  - Oblicz R_{p} = 3\sqrt{2} oraz \rho_{p} = 3 dla kwadratu o boku 6.
  - Wyznacz b^{2} = R_{p}^{2}+H^{2} = 34 i R_{o} = \frac{b^{2}}{2\cdot H} = \frac{17}{4}.
  - Policz S = 4\pi R_{o}^{2} = \frac{289\pi}{4}.
  - Wyznacz apotemę m = \sqrt{H^{2}+\rho_{p}^{2}} = 5 oraz R_{w} = \frac{\rho_{p}\cdot H}{\rho_{p}+m}
