    b) Oblicz, ile najwięcej rzędów może mieć ta widownia i ile miejsc jest wtedy na całej widowni. Zapisz obliczenia.
  statement_latex: S_n = \frac{\left(2\cdot 24+\left(n-1\right)\cdot 6\right)\cdot n}{2},\qquad a_n =
    18+6\cdot n \le 90,\qquad S_n \le 900
  solution: |-
    Niech a_n oznacza liczbę miejsc w n-tym rzędzie. Każdy następny rząd ma o 6 miejsc więcej, więc (a_n) jest ciągiem arytmetycznym o r = 6.
    Z warunku a_5 = 48: a_1 = a_5 - 4\cdot r = 48 - 24 = 24. Zatem a_n = 24 + \left(n-1\right)\cdot 6 = 18 + 6\cdot n.
    a) S_n = \frac{\left(2\cdot 24 + \left(n-1\right)\cdot 6\right)\cdot n}{2} = \frac{\left(42+6\cdot n\right)\cdot n}{2} = 3\cdot n^{2} + 21\cdot n, dla n \in \mathbb{N}_{+}.
    b) Pierwszy warunek (żaden rząd nie większy niż 90 miejsc): 18 + 6\cdot n \le 90, czyli 6\cdot n \le 72, więc n \le 12.
    Drugi warunek (widownia nie większa niż 900 miejsc): 3\cdot n^{2} + 21\cdot n \le 900, czyli n^{2} + 7\cdot n - 300 \le 0. Wyróżnik: \Delta = 49 + 1200 = 1249, \sqrt{1249} \approx 35{,}34, dodatni pierwiastek to \frac{-7+35{,}34}{2} \approx 14{,}17, więc n \le 14.
    Oba warunki muszą być spełnione jednocześnie, więc wiążące jest ograniczenie n \le 12.
    Dla n = 12: a_{12} = 18 + 72 = 90 \le 90 ✓ oraz S_{12} = 3\cdot 144 + 21\cdot 12 = 432 + 252 = 684 \le 900 ✓.
    Dla n = 13 byłoby a_{13} = 96 > 90, co jest niedozwolone.
    Odpowiedź: a) S_n = 3n^{2}+21n; b) widownia może mieć najwyżej 12 rzędów, a wtedy jest na niej 684 miejsca.
