  exercise_type: wyznaczanie liczby boków
  statement: Kąt wewnętrzny pewnego wielokąta foremnego ma miarę 144°. Wyznacz liczbę boków tego wielokąta,
    sumę miar jego kątów wewnętrznych oraz liczbę jego przekątnych.
  statement_latex: n=\frac{360^\circ}{180^\circ-144^\circ},\qquad S=\left(n-2\right)\cdot 180^\circ,\qquad
    d=\frac{n\cdot\left(n-3\right)}{2}
  solution: |-
    Kąt zewnętrzny: 180° − 144° = 36°. W wielokącie foremnym kąt zewnętrzny równa się 360°/n, więc
    360°/n = 36°  ⟹  n = 360°/36° = 10.
    Wynik jest liczbą naturalną większą od 2, więc taki wielokąt istnieje — jest to dziesięciokąt foremny.
    Suma kątów wewnętrznych: S = (10 − 2)·180° = 8·180° = 1440° (kontrola: 1440°/10 = 144° ✓).
    Liczba przekątnych: d = 10·(10 − 3)/2 = 70/2 = 35.
    Odpowiedź: n = 10, S = 1440°, 35 przekątnych.
  solution_steps:
  - 'Oblicz kąt zewnętrzny: 180° − 144° = 36°.'
  - Z równania 360°/n = 36° wyznacz n = 10 i sprawdź, że jest to liczba naturalna ≥ 3.
  - 'Oblicz sumę kątów: S = (10−2)·180° = 1440°.'
  - 'Oblicz liczbę przekątnych: d = 10·7/2 = 35.'
