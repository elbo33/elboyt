- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczanie wyrazów ciągu rekurencyjnego
  statement: 'Ciąg \left(a_{n}\right) jest określony następująco: a_{1} = 5 oraz a_{n+1} = a_{n} - 4 dla
    każdej liczby naturalnej n \geq 1. Oblicz drugi i trzeci wyraz tego ciągu.'
  statement_latex: a_{1}=5,\qquad a_{n+1}=a_{n}-4\quad\text{dla }n\geq 1
  solution: |-
    Wyrazy liczymy po kolei, zawsze zapisując, jakie n podstawiamy.
    Dla n = 1: a_{2} = a_{1} - 4 = 5 - 4 = 1.
    Dla n = 2: a_{3} = a_{2} - 4 = 1 - 4 = -3.
    Zatem a_{2} = 1 oraz a_{3} = -3.
  solution_steps:
  - 'Zapisz dane: a_{1} = 5 oraz regułę a_{n+1} = a_{n} - 4.'
  - 'Podstaw n = 1: a_{2} = a_{1} - 4 = 5 - 4 = 1.'
  - 'Podstaw n = 2, korzystając z obliczonego a_{2}: a_{3} = a_{2} - 4 = 1 - 4 = -3.'
  - 'Zapisz odpowiedź: a_{2} = 1, a_{3} = -3.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_2
      answer:
        kind: NUMERIC
        value: 1.0
    - name: a_3
      answer:
        kind: NUMERIC
        value: -3.0
  checks:
  - kind: evaluate
    expr: 5-4
    var: n
    part: a_2
  - kind: evaluate
    expr: \left(5-4\right)-4
    var: n
    part: a_3
  skills:
  - podstawianie w zależności rekurencyjnej
  - odczytanie warunku początkowego
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [a_2] SymPy solved it fresh: 1.0 vs 1.0 (tol 1e-09) ; [a_3]
      SymPy solved it fresh: -3.0 vs -3.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: wyznaczanie a_{n+1} i różnicy
  statement: Dany jest ciąg \left(a_{n}\right) określony wzorem a_{n} = 4n + 7 dla każdej liczby naturalnej
    n \geq 1. Wyznacz wyraz a_{n+1} (w postaci uproszczonej) oraz oblicz różnicę a_{n+1} - a_{n}.
  statement_latex: a_{n}=4n+7,\qquad a_{n+1}=?,\qquad a_{n+1}-a_{n}=?
  solution: |-
    W miejsce każdego n we wzorze wstawiamy (n+1) w nawiasie:
    a_{n+1} = 4\left(n+1\right) + 7 = 4n + 4 + 7 = 4n + 11.
    Różnica:
    a_{n+1} - a_{n} = \left(4n+11\right) - \left(4n+7\right) = 4.
    Różnica jest liczbą dodatnią (równą 4) dla każdego n \geq 1, więc ciąg jest rosnący.
  solution_steps:
  - 'Wstaw (n+1) w nawiasie w miejsce n: a_{n+1} = 4\left(n+1\right) + 7.'
  - 'Uprość: a_{n+1} = 4n + 11.'
  - 'Utwórz różnicę: a_{n+1} - a_{n} = \left(4n+11\right) - \left(4n+7\right).'
  - 'Zredukuj wyrazy podobne: różnica jest równa 4.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_{n+1}
      answer:
        kind: SYMBOLIC
        latex: 4n+11
    - name: roznica
      answer:
        kind: NUMERIC
        value: 4.0
  checks:
  - kind: simplify
    expr: 4\left(n+1\right)+7
    var: n
    part: a_{n+1}
  - kind: simplify
    expr: \left(4\left(n+1\right)+7\right)-\left(4n+7\right)
    var: n
    part: roznica
  skills:
  - podstawianie (n+1) do wzoru ogólnego
  - metoda różnicy
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [a_{n+1}] SymPy solved it fresh: ''4n+11'' vs ''4*n + 11''
      ; [roznica] SymPy solved it fresh: 4.0 vs 4.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: rekurencja dwuwyrazowa
  statement: 'Ciąg \left(a_{n}\right) jest określony następująco: a_{1} = 2, a_{2} = 3 oraz a_{n+2} =
    a_{n+1} + a_{n} dla każdej liczby naturalnej n \geq 1. Oblicz a_{3}, a_{4} oraz a_{5}.'
  statement_latex: a_{1}=2,\quad a_{2}=3,\quad a_{n+2}=a_{n+1}+a_{n}\ \text{dla } n\geq 1
  solution: |-
    W każdym kroku sumujemy dwa poprzednie wyrazy.
    Dla n = 1: a_{3} = a_{2} + a_{1} = 3 + 2 = 5.
    Dla n = 2: a_{4} = a_{3} + a_{2} = 5 + 3 = 8.
    Dla n = 3: a_{5} = a_{4} + a_{3} = 8 + 5 = 13.
    Zatem a_{3} = 5, a_{4} = 8, a_{5} = 13.
  solution_steps:
  - 'Zapisz oba warunki początkowe: a_{1} = 2, a_{2} = 3.'
  - 'Podstaw n = 1: a_{3} = a_{2} + a_{1} = 3 + 2 = 5.'
  - 'Podstaw n = 2: a_{4} = a_{3} + a_{2} = 5 + 3 = 8.'
  - 'Podstaw n = 3: a_{5} = a_{4} + a_{3} = 8 + 5 = 13.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_3
      answer:
        kind: NUMERIC
        value: 5.0
    - name: a_4
      answer:
        kind: NUMERIC
        value: 8.0
    - name: a_5
      answer:
        kind: NUMERIC
        value: 13.0
  checks:
  - kind: evaluate
    expr: 3+2
    var: n
    part: a_3
  - kind: evaluate
    expr: \left(3+2\right)+3
    var: n
    part: a_4
  - kind: evaluate
    expr: \left(\left(3+2\right)+3\right)+\left(3+2\right)
    var: n
    part: a_5
  skills:
  - obliczanie wyrazów rekurencji dwuwyrazowej
  - praca z dwoma warunkami początkowymi
  verification:
