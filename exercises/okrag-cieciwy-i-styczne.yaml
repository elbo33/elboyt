- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: zadanie obliczeniowe wieloetapowe
  statement: Dany jest okrąg o środku O i promieniu 15. Prosta k jest styczna do tego okręgu w punkcie
    A. Na prostej k obrano taki punkt P, że |PA| = 20. Odcinek OP przecina ten okrąg w punkcie K. Oblicz
    długość odcinka PK oraz odległość punktu A od prostej OP. Zapisz obliczenia.
  statement_latex: '|OP|=\sqrt{15^{2}+20^{2}},\qquad |PK|=|OP|-15,\qquad h=\frac{15\cdot 20}{|OP|}'
  solution: |-
    Styczna jest prostopadła do promienia poprowadzonego do punktu styczności, więc trójkąt OAP ma kąt prosty przy wierzchołku A, a odcinek OP jest jego przeciwprostokątną.

    Z twierdzenia Pitagorasa: |OP|^{2}=|OA|^{2}+|PA|^{2}=15^{2}+20^{2}=225+400=625, zatem |OP|=25.

    Punkt K leży na okręgu i na odcinku OP, więc |OK|=15 i |PK|=|OP|-|OK|=25-15=10.

    Odległość punktu A od prostej OP to wysokość h trójkąta prostokątnego OAP opuszczona na przeciwprostokątną. Pole tego trójkąta obliczamy na dwa sposoby:
    \frac{1}{2}\cdot 15\cdot 20=\frac{1}{2}\cdot 25\cdot h, czyli 150=12{,}5\cdot h, skąd h=\frac{15\cdot 20}{25}=12.

    Odpowiedź: |PK| = 10, a odległość punktu A od prostej OP wynosi 12. (Sprawdzenie: |PA|=20<25=|OP|.)
  solution_steps:
  - 'Zaznacz kąt prosty przy punkcie styczności A: styczna jest prostopadła do promienia OA.'
  - 'W trójkącie prostokątnym OAP oblicz przeciwprostokątną: |OP|=\sqrt{15^{2}+20^{2}}=25.'
  - Zauważ, że |OK|=15 (promień), więc |PK|=25-15=10.
  - 'Zapisz pole trójkąta OAP na dwa sposoby: \frac{1}{2}\cdot15\cdot20=\frac{1}{2}\cdot25\cdot h.'
  - Wyznacz h=\frac{15\cdot20}{25}=12 – to odległość punktu A od prostej OP.
  answer:
    kind: MULTIPART
    parts:
    - name: PK
      answer:
        kind: NUMERIC
        value: 10.0
    - name: odleglosc_A_od_OP
      answer:
        kind: NUMERIC
        value: 12.0
  checks:
  - kind: evaluate
    expr: \sqrt{15^{2}+20^{2}}-15
    part: PK
  - kind: evaluate
    expr: \frac{15\cdot 20}{\sqrt{15^{2}+20^{2}}}
    part: odleglosc_A_od_OP
  skills:
  - styczna prostopadła do promienia
  - twierdzenie Pitagorasa w trójkącie OAP
  - obliczanie wysokości trójkąta prostokątnego z pola
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [PK] SymPy solved it fresh: 10.0 vs 10.0 (tol 1e-09) ; [odleglosc_A_od_OP]
      SymPy solved it fresh: 12.0 vs 12.0 (tol 1e-09)'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: odległość środka od cięciwy
  statement: 'W okręgu o środku O i promieniu 17 poprowadzono cięciwę AB o długości 16. Oblicz odległość
    środka O od tej cięciwy. Uczeń zapisał: „k = \sqrt{17^{2}-16^{2}} = \sqrt{33}”. Wskaż błąd w tym rozumowaniu
    i podaj poprawny wynik. Zapisz obliczenia.'
  statement_latex: k = \sqrt{17^{2}-\left(\frac{16}{2}\right)^{2}}
  solution: |-
    Błędne rozumowanie: uczeń podstawił do twierdzenia Pitagorasa całą długość cięciwy i otrzymał k = \sqrt{17^{2}-16^{2}} = \sqrt{289-256} = \sqrt{33} \approx 5{,}74.
    Dlaczego to źle: odcinek poprowadzony ze środka okręgu prostopadle do cięciwy dzieli ją na dwie równe części. Przyprostokątną trójkąta prostokątnego OSA jest więc połowa cięciwy \frac{|AB|}{2} = \frac{16}{2} = 8, a nie 16.
    Poprawnie: k^{2} = 17^{2} - 8^{2} = 289 - 64 = 225, więc k = 15.
    Sprawdzenie: k = 15 < 17 = r oraz |AB| = 16 < 34 = 2r – warunki geometryczne są spełnione.
