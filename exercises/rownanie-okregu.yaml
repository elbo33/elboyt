- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: zapisanie równania okręgu
  statement: W kartezjańskim układzie współrzędnych (x, y) dany jest okrąg o środku S = (3, -1) i promieniu
    r = 4. Zapisz równanie tego okręgu w postaci kanonicznej.
  statement_latex: S=\left(3,-1\right),\ r=4\ \Rightarrow\ \left(x-a\right)^2+\left(y-b\right)^2=r^2
  solution: |-
    Korzystamy z szablonu (x-a)^2+(y-b)^2=r^2, w którym S=(a,b).
    Tu a=3, b=-1, więc w nawiasach piszemy liczby przeciwne: (x-3)^2 oraz (y-(-1))^2=(y+1)^2.
    Po prawej stronie stoi KWADRAT promienia: r^2=4^2=16.
    Zatem równanie ma postać (x-3)^2+(y+1)^2=16.
    Kontrola: punkt (a+r,b)=(7,-1) spełnia równanie, bo (7-3)^2+(-1+1)^2=16+0=16.
  solution_steps:
  - Zapisz szablon \left(x-a\right)^2+\left(y-b\right)^2=r^2.
  - 'Podstaw a=3, b=-1 ze zmienionym znakiem: \left(x-3\right)^2+\left(y+1\right)^2.'
  - Oblicz r^2=4^2=16 i wpisz po prawej stronie.
  - Zapisz równanie \left(x-3\right)^2+\left(y+1\right)^2=16 i sprawdź je punktem \left(7,-1\right).
  answer:
    kind: SYMBOLIC
    latex: \left(x-3\right)^2+\left(y+1\right)^2=16
  skills:
  - postać kanoniczna równania okręgu
  - zapis środka ze zmienionym znakiem
  verification:
    checkability: REFERENCE_CALL
    note: '''\\left(x-3\\right)^2+\\left(y+1\\right)^2=16'' vs ''(x-3)^2 + (y+1)^2 = 16'''
- id: g-th-01
