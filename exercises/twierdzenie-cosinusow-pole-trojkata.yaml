  exercise_type: pole trójkąta przez sinus
  statement: W trójkącie KLM dane są |KL| = 6, |KM| = 10 oraz |∠LKM| = 150°. Oblicz pole tego trójkąta.
    Zapisz obliczenia.
  statement_latex: P = \frac{1}{2}\cdot 6\cdot 10\cdot\sin 150^\circ
  solution: |-
    Kąt LKM leży między bokami KL i KM, więc możemy skorzystać ze wzoru na pole:
    P = \frac{1}{2}\cdot|KL|\cdot|KM|\cdot\sin\angle LKM.
    Ponieważ sin 150° = sin 30° = 1/2 (sinus kąta rozwartego jest dodatni), otrzymujemy
    P = \frac{1}{2}\cdot 6\cdot 10\cdot\frac{1}{2} = 15.
    Kontrola: P \le \frac{1}{2}\cdot 6\cdot 10 = 30, a 15 < 30.
  solution_steps:
  - Sprawdź, że kąt 150° jest kątem zawartym między bokami KL i KM.
  - Zapisz wzór P = \frac{1}{2}\cdot|KL|\cdot|KM|\cdot\sin\angle LKM.
  - Podstaw sin 150° = 1/2.
  - Oblicz P = \frac{1}{2}\cdot 6\cdot 10\cdot\frac{1}{2} = 15.
  answer:
    kind: NUMERIC
    value: 15.0
  checks:
  - kind: evaluate
    expr: \frac{1}{2}\cdot 6\cdot 10\cdot\frac{1}{2}
  skills:
  - wzór P = 1/2 ab sin γ
  - sinus kąta rozwartego
  - wartości tablicowe
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 15.0 vs 15.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: cosinus kąta z trzech boków (BBB)
  statement: Dany jest trójkąt ABC, w którym |BC| = 5, |AC| = 7 oraz |AB| = 8. Oblicz cosinus kąta ACB.
    Zapisz obliczenia.
  statement_latex: \cos\angle ACB = \frac{5^2 + 7^2 - 8^2}{2\cdot 5\cdot 7}
  solution: |-
    Naprzeciw kąta ACB leży bok AB o długości 8, a ramionami tego kąta są boki BC = 5 i AC = 7. Zatem
    \cos\angle ACB = \frac{|BC|^2 + |AC|^2 - |AB|^2}{2\cdot|BC|\cdot|AC|} = \frac{25 + 49 - 64}{2\cdot 5\cdot 7} = \frac{10}{70} = \frac{1}{7}.
    Wynik należy do przedziału (-1; 1), a jego dodatni znak oznacza, że kąt ACB jest ostry.
  solution_steps:
  - Zidentyfikuj bok leżący naprzeciw kąta ACB — jest to AB = 8.
  - Zapisz wzór \cos\angle ACB = \frac{|BC|^2+|AC|^2-|AB|^2}{2\cdot|BC|\cdot|AC|}.
  - 'Podstaw dane: \frac{25+49-64}{70} = \frac{10}{70}.'
  - 'Skróć ułamek: \cos\angle ACB = \frac{1}{7}.'
  answer:
    kind: SYMBOLIC
    latex: \frac{1}{7}
  checks:
  - kind: evaluate
    expr: \frac{5^2 + 7^2 - 8^2}{2\cdot 5\cdot 7}
  skills:
  - wzór na cosinus z trzech boków
  - identyfikacja boku naprzeciw kąta
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 0.14285714285714285 vs 0.14285714285714285 (tol 1e-09)'
