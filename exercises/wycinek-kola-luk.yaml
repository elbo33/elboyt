- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: wyznaczanie kąta z pola wycinka
  statement: Wycinek koła o promieniu r = 8 ma pole równe 24π. Wyznacz miarę kąta środkowego tego wycinka
    oraz długość ograniczającego go łuku.
  statement_latex: 24\pi=\frac{\alpha}{360^\circ}\cdot\pi\cdot 8^2
  solution: |-
    Pole całego koła: \pi\cdot 8^2=64\pi.
    Ułamek koła: k=\frac{24\pi}{64\pi}=\frac{3}{8}.
    Kąt środkowy: \alpha=\frac{3}{8}\cdot 360^\circ=135^\circ (warunek 0^\circ<\alpha\le 360^\circ spełniony).
    Długość łuku: l=\frac{3}{8}\cdot 2\cdot\pi\cdot 8=\frac{3}{8}\cdot 16\pi=6\pi.
    Kontrola: P_w=\frac{1}{2}\cdot l\cdot r=\frac{1}{2}\cdot 6\pi\cdot 8=24\pi ✓.
  solution_steps:
  - Zapisz równanie 24\pi=\frac{\alpha}{360^\circ}\cdot\pi\cdot 8^{2}.
  - 'Podziel obie strony przez \pi\cdot 64: \frac{\alpha}{360^\circ}=\frac{24}{64}=\frac{3}{8}.'
  - Oblicz \alpha=\frac{3}{8}\cdot 360^\circ=135^\circ.
  - 'Oblicz długość łuku: l=\frac{3}{8}\cdot 2\cdot\pi\cdot 8=6\pi.'
  - Sprawdź wynik zależnością P_w=\frac{1}{2}\cdot l\cdot r.
  answer:
    kind: MULTIPART
    parts:
    - name: kat_srodkowy
      answer:
        kind: NUMERIC
        value: 135.0
    - name: dlugosc_luku
      answer:
        kind: SYMBOLIC
        latex: 6\pi
  checks:
  - kind: evaluate
    expr: \frac{24\cdot\pi}{\pi\cdot 8^{2}}\cdot 360
    part: kat_srodkowy
  - kind: evaluate
    expr: \frac{24\cdot\pi}{\pi\cdot 8^{2}}\cdot 2\cdot\pi\cdot 8
    part: dlugosc_luku
  skills:
  - przekształcanie wzoru na pole wycinka
  - długość łuku
  - kontrola wzorem P=½lr
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [kat_srodkowy] SymPy solved it fresh: 135.0 vs 135.0 (tol 1e-09)
      ; [dlugosc_luku] SymPy solved it fresh: 18.84955592153876 vs 18.84955592153876 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: figura złożona z wycinków (fragment pierścienia)
  statement: 'Dane są dwa okręgi współśrodkowe o wspólnym środku O i promieniach 3 cm oraz 9 cm. Z pierścienia
    zawartego między tymi okręgami wycięto fragment odpowiadający kątowi środkowemu o mierze 120°; brzeg
    tego fragmentu tworzą: łuk większego okręgu, łuk mniejszego okręgu oraz dwa odcinki leżące na ramionach
    kąta i łączące końce tych łuków. Oblicz pole oraz obwód tego fragmentu pierścienia. Wyniki podaj w
    postaci dokładnej.'
  statement_latex: P=\frac{120^\circ}{360^\circ}\cdot\left(\pi\cdot 9^2-\pi\cdot 3^2\right),\qquad Ob=\frac{120^\circ}{360^\circ}\cdot
    2\cdot\pi\cdot 9+\frac{120^\circ}{360^\circ}\cdot 2\cdot\pi\cdot 3+2\cdot\left(9-3\right)
  solution: |-
    Ułamek koła: \frac{120^\circ}{360^\circ}=\frac{1}{3}.
    Pole pierścienia: \pi\cdot 9^2-\pi\cdot 3^2=81\pi-9\pi=72\pi cm^2.
    Pole fragmentu: P=\frac{1}{3}\cdot 72\pi=24\pi cm^2 ≈ 75{,}4 cm^2.
    Obwód: łuk zewnętrzny \frac{1}{3}\cdot 2\cdot\pi\cdot 9=6\pi cm, łuk wewnętrzny \frac{1}{3}\cdot 2\cdot\pi\cdot 3=2\pi cm, dwa odcinki o długości 9-3=6 cm każdy.
    Ob=6\pi+2\pi+2\cdot 6=8\pi+12 cm ≈ 37{,}1 cm.
    Składników z \pi i bez \pi nie łączymy w jeden wyraz.
  solution_steps:
  - 'Wyznacz ułamek koła: \frac{120^\circ}{360^\circ}=\frac{1}{3}.'
  - 'Oblicz pole pierścienia: \pi\cdot 9^{2}-\pi\cdot 3^{2}=72\pi cm^2.'
  - 'Pole fragmentu: P=\frac{1}{3}\cdot 72\pi=24\pi cm^2.'
  - 'Oblicz długości obu łuków: 6\pi cm i 2\pi cm.'
  - 'Dodaj dwa odcinki o długości 9-3=6 cm: Ob=6\pi+2\pi+12=8\pi+12 cm.'
  answer:
    kind: MULTIPART
    parts:
    - name: pole
      answer:
        kind: SYMBOLIC
        latex: 24\pi
    - name: obwod
      answer:
        kind: SYMBOLIC
        latex: 8\pi+12
  checks:
