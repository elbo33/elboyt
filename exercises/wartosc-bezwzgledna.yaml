- id: g-cm-09
  slot: COMMON_MISTAKE
  ramp_index: 3
  difficulty: 2
  exercise_type: wartość wyrażenia z modułami — analiza błędu
  statement: 'Oblicz wartość wyrażenia W = \left|2 - 9\right| - \left|-5 + 1\right|. Uczeń zapisał: "moduł
    zamienia każdy minus na plus, więc \left|2 - 9\right| = 2 + 9 = 11 oraz \left|-5 + 1\right| = 5 +
    1 = 6, zatem W = 11 - 6 = 5". Wyjaśnij błąd i podaj poprawny wynik.'
  statement_latex: W = \left|2 - 9\right| - \left|-5 + 1\right|
  solution: |-
    Błędne rozumowanie: uczeń rozdzielił moduł na poszczególne składniki sumy, czyli przyjął \left|a + b\right| = \left|a\right| + \left|b\right|, i otrzymał W = 11 - 6 = 5.
    Gdzie tkwi błąd: moduł jest zgodny z mnożeniem i dzieleniem, ale nie z dodawaniem. Zachodzi jedynie nierówność trójkąta \left|a + b\right| \le \left|a\right| + \left|b\right|. Przykład: \left|3 + \left(-5\right)\right| = 2, a \left|3\right| + \left|-5\right| = 8.
    Poprawne rozwiązanie: najpierw wykonujemy działania pod modułami.
    2 - 9 = -7, więc \left|2 - 9\right| = 7.
    -5 + 1 = -4, więc \left|-5 + 1\right| = 4.
    Stąd W = 7 - 4 = 3.
    Odpowiedź: W = 3.
  solution_steps:
  - 'Wskaż błąd: nie wolno stosować równości \left|a+b\right| = \left|a\right| + \left|b\right|.'
  - 'Wykonaj działania pod modułami: 2 - 9 = -7 oraz -5 + 1 = -4.'
  - 'Opuść moduły: \left|-7\right| = 7, \left|-4\right| = 4.'
  - Oblicz W = 7 - 4 = 3.
