    Skoro wartość maleje co roku o ten sam procent, to kolejne roczne wartości maszyny tworzą ciąg geometryczny o pewnym ilorazie q, przy czym q > 0. Oznaczmy przez W_{0} cenę zakupu; wtedy W_{n} = W_{0} \cdot q^{n}.
    Wartości po dwóch i po czterech latach różnią się o dwa okresy, więc
    26\,244 = 32\,400 \cdot q^{2}, czyli q^{2} = \frac{26\,244}{32\,400} = 0{,}81.
    Ponieważ wartość maszyny jest dodatnia, q > 0, zatem q = 0{,}9 (rozwiązanie q = -0{,}9 odrzucamy).
    Cena zakupu: 32\,400 = W_{0} \cdot q^{2} = W_{0} \cdot 0{,}81, więc W_{0} = \frac{32\,400}{0{,}81} = 40\,000 zł.
