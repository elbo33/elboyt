    wyrażenia.'
  statement_latex: \left(2x+3\right)^{2}-\left(2x-1\right)^{2}
  solution: |-
    Błędne rozumowanie ucznia: po rozwinięciu \left(2x-1\right)^{2}=4x^{2}-4x+1 uczeń przepisał rozwinięcie bez zmiany znaków wszystkich jego wyrazów, otrzymując 4x^{2}+12x+9-4x^{2}-4x+1=8x+10.
    Test liczbowy dla x=1: wyrażenie wyjściowe daje \left(2+3\right)^{2}-\left(2-1\right)^{2}=25-1=24, a wynik ucznia 8\cdot 1+10=18. Skoro 24\ne 18, przekształcenie jest błędne.
    Poprawnie: minus przed nawiasem zmienia znak KAŻDEGO wyrazu rozwinięcia:
    -\left(4x^{2}-4x+1\right)=-4x^{2}+4x-1.
    Zatem \left(2x+3\right)^{2}-\left(2x-1\right)^{2}=4x^{2}+12x+9-4x^{2}+4x-1=16x+8.
    Szybciej — ze wzoru na różnicę kwadratów:
    \left[\left(2x+3\right)-\left(2x-1\right)\right]\cdot\left[\left(2x+3\right)+\left(2x-1\right)\right]=4\cdot\left(4x+2\right)=16x+8.
    Sprawdzenie dla x=1: 16+8=24 — zgadza się.
  solution_steps:
  - Zapisz błędne przekształcenie ucznia i jego wynik 8x+10.
  - 'Sprawdź dla x=1: 24 wobec 18 — sprzeczność.'
  - 'Zmień znaki wszystkich wyrazów w nawiasie poprzedzonym minusem: -\left(4x^{2}-4x+1\right)=-4x^{2}+4x-1.'
  - 'Zredukuj wyrazy podobne: 16x+8.'
  - 'Potwierdź wynik wzorem na różnicę kwadratów: 4\cdot\left(4x+2\right)=16x+8.'
