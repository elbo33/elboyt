- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczanie funkcji trygonometrycznych z punktu na ramieniu kąta
  statement: Kąt \alpha o mierze z przedziału \langle 0^{\circ},180^{\circ}\rangle ma wierzchołek w punkcie
    O=(0,0), jedno jego ramię pokrywa się z dodatnią półosią Ox, a drugie ramię przechodzi przez punkt
    P=(4,3). Oblicz \sin\alpha, \cos\alpha oraz \operatorname{tg}\alpha.
  statement_latex: P=\left(4,\ 3\right),\quad r=\sqrt{4^{2}+3^{2}},\quad \sin\alpha=\frac{y}{r},\ \cos\alpha=\frac{x}{r},\
    \operatorname{tg}\alpha=\frac{y}{x}
  solution: |-
    Punkt P leży w I ćwiartce, więc \alpha jest kątem ostrym i wszystkie trzy wartości będą dodatnie.
    Obliczamy r=|OP|=\sqrt{4^{2}+3^{2}}=\sqrt{16+9}=\sqrt{25}=5 (długość odcinka, zawsze dodatnia).
    Z definicji współrzędnościowych:
    \sin\alpha=\frac{y}{r}=\frac{3}{5},\qquad \cos\alpha=\frac{x}{r}=\frac{4}{5},\qquad \operatorname{tg}\alpha=\frac{y}{x}=\frac{3}{4}.
    Kontrola jedynką trygonometryczną: \left(\frac{3}{5}\right)^{2}+\left(\frac{4}{5}\right)^{2}=\frac{9}{25}+\frac{16}{25}=1.
  solution_steps:
  - Zauważ, że P=(4,3) leży w I ćwiartce, więc kąt jest ostry (wszystkie wartości dodatnie).
  - Oblicz r=\sqrt{4^{2}+3^{2}}=5.
  - 'Podstaw do wzorów: \sin\alpha=\frac{3}{5}, \cos\alpha=\frac{4}{5}, \operatorname{tg}\alpha=\frac{3}{4}.'
  - Sprawdź wynik jedynką trygonometryczną.
  answer:
    kind: MULTIPART
    parts:
    - name: sinus
      answer:
        kind: NUMERIC
        value: 0.6
        latex: \frac{3}{5}
    - name: cosinus
      answer:
        kind: NUMERIC
        value: 0.8
        latex: \frac{4}{5}
    - name: tangens
      answer:
        kind: NUMERIC
        value: 0.75
        latex: \frac{3}{4}
  checks:
  - kind: evaluate
    expr: \frac{3}{\sqrt{4^{2}+3^{2}}}
    part: sinus
  - kind: evaluate
    expr: \frac{4}{\sqrt{4^{2}+3^{2}}}
    part: cosinus
  - kind: evaluate
    expr: \frac{3}{4}
    part: tangens
  skills:
  - definicja współrzędnościowa sin, cos, tg
  - obliczanie r = |OP|
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [sinus] SymPy solved it fresh: 0.6 vs 0.6 (tol 1e-09) ; [cosinus]
      SymPy solved it fresh: 0.8 vs 0.8 (tol 1e-09) ; [tangens] SymPy solved it fresh: 0.75 vs 0.75 (tol
      1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: wartość wyrażenia z kątami szczególnymi
  statement: Oblicz dokładną wartość wyrażenia W = 2\cdot\sin 60^{\circ} - \operatorname{tg}45^{\circ}\cdot\cos
    30^{\circ}.
  statement_latex: W = 2\cdot\sin 60^{\circ} - \operatorname{tg}45^{\circ}\cdot\cos 30^{\circ}
  solution: |-
    Odczytujemy wartości szczególne: \sin 60^{\circ}=\frac{\sqrt{3}}{2}, \operatorname{tg}45^{\circ}=1, \cos 30^{\circ}=\frac{\sqrt{3}}{2}.
    Zatem
    W = 2\cdot\frac{\sqrt{3}}{2} - 1\cdot\frac{\sqrt{3}}{2} = \sqrt{3} - \frac{\sqrt{3}}{2} = \frac{2\sqrt{3}-\sqrt{3}}{2} = \frac{\sqrt{3}}{2}.
  solution_steps:
  - 'Wypisz wartości szczególne: \sin 60^{\circ}=\frac{\sqrt{3}}{2}, \operatorname{tg}45^{\circ}=1, \cos
    30^{\circ}=\frac{\sqrt{3}}{2}.'
  - 'Wstaw je do wyrażenia: W=2\cdot\frac{\sqrt{3}}{2}-1\cdot\frac{\sqrt{3}}{2}.'
  - 'Wykonaj działania: W=\sqrt{3}-\frac{\sqrt{3}}{2}=\frac{\sqrt{3}}{2}.'
  answer:
    kind: SYMBOLIC
    latex: \frac{\sqrt{3}}{2}
  checks:
  - kind: evaluate
    expr: 2\cdot\sin\left(60^{\circ}\right)-\tan\left(45^{\circ}\right)\cdot\cos\left(30^{\circ}\right)
  skills:
  - tabela wartości dla 30°, 45°, 60°
  - działania na pierwiastkach
  verification:
    checkability: REFERENCE_CALL
    note: '''\\frac{\\sqrt{3}}{2}'' vs ''\\frac{\\sqrt{3}}{2}'''
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: wzory redukcyjne
  statement: Korzystając ze wzorów redukcyjnych dla kąta rozwartego, oblicz \cos 120^{\circ} oraz \sin
    135^{\circ}.
  statement_latex: \cos 120^{\circ}=\cos\left(180^{\circ}-60^{\circ}\right),\qquad \sin 135^{\circ}=\sin\left(180^{\circ}-45^{\circ}\right)
  solution: |-
    Zapisujemy każdy kąt rozwarty w postaci 180^{\circ}-\alpha_{0}:
    120^{\circ}=180^{\circ}-60^{\circ}, więc \cos 120^{\circ}=-\cos 60^{\circ}=-\frac{1}{2}.
    135^{\circ}=180^{\circ}-45^{\circ}, więc \sin 135^{\circ}=\sin 45^{\circ}=\frac{\sqrt{2}}{2}.
    Kontrola znaków: cosinus kąta rozwartego jest ujemny, sinus dodatni.
  solution_steps:
  - Zapisz 120^{\circ}=180^{\circ}-60^{\circ} i zastosuj \cos\left(180^{\circ}-\alpha\right)=-\cos\alpha.
  - Odczytaj \cos 60^{\circ}=\frac{1}{2}, więc \cos 120^{\circ}=-\frac{1}{2}.
  - Zapisz 135^{\circ}=180^{\circ}-45^{\circ} i zastosuj \sin\left(180^{\circ}-\alpha\right)=\sin\alpha.
  - Odczytaj \sin 45^{\circ}=\frac{\sqrt{2}}{2}, więc \sin 135^{\circ}=\frac{\sqrt{2}}{2}.
  - 'Sprawdź znaki: cos ujemny, sin dodatni.'
  answer:
    kind: MULTIPART
    parts:
    - name: cos 120 stopni
      answer:
        kind: NUMERIC
        value: -0.5
        latex: -\frac{1}{2}
    - name: sin 135 stopni
      answer:
        kind: SYMBOLIC
        latex: \frac{\sqrt{2}}{2}
  checks:
  - kind: evaluate
    expr: -\cos\left(60^{\circ}\right)
    part: cos 120 stopni
  - kind: evaluate
    expr: \sin\left(45^{\circ}\right)
    part: sin 135 stopni
  skills:
  - redukcja kąta rozwartego do ostrego
  - znaki funkcji w II ćwiartce
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: wartość wyrażenia z kątami rozwartymi
  statement: Oblicz dokładną wartość wyrażenia W = \sin 150^{\circ}\cdot\cos 180^{\circ} + \operatorname{tg}120^{\circ}\cdot\cos
    30^{\circ}.
  statement_latex: W = \sin 150^{\circ}\cdot\cos 180^{\circ} + \operatorname{tg}120^{\circ}\cdot\cos 30^{\circ}
  solution: |-
    Redukujemy kąty rozwarte:
    \sin 150^{\circ}=\sin\left(180^{\circ}-30^{\circ}\right)=\sin 30^{\circ}=\frac{1}{2},
    \operatorname{tg}120^{\circ}=\operatorname{tg}\left(180^{\circ}-60^{\circ}\right)=-\operatorname{tg}60^{\circ}=-\sqrt{3}.
    Ponadto \cos 180^{\circ}=-1 oraz \cos 30^{\circ}=\frac{\sqrt{3}}{2}.
    Zatem
    W=\frac{1}{2}\cdot\left(-1\right)+\left(-\sqrt{3}\right)\cdot\frac{\sqrt{3}}{2}=-\frac{1}{2}-\frac{3}{2}=-2.
  solution_steps:
  - 'Zredukuj kąty rozwarte: \sin 150^{\circ}=\sin 30^{\circ}=\frac{1}{2}, \operatorname{tg}120^{\circ}=-\operatorname{tg}60^{\circ}=-\sqrt{3}.'
  - Odczytaj \cos 180^{\circ}=-1 oraz \cos 30^{\circ}=\frac{\sqrt{3}}{2}.
  - 'Podstaw: W=\frac{1}{2}\cdot\left(-1\right)+\left(-\sqrt{3}\right)\cdot\frac{\sqrt{3}}{2}.'
  - 'Wykonaj działania: W=-\frac{1}{2}-\frac{3}{2}=-2.'
  answer:
    kind: NUMERIC
    value: -2.0
    latex: '-2'
  checks:
  - kind: evaluate
    expr: \sin\left(150^{\circ}\right)\cdot\cos\left(180^{\circ}\right)+\tan\left(120^{\circ}\right)\cdot\cos\left(30^{\circ}\right)
  skills:
  - wzory redukcyjne
  - działania na pierwiastkach
  - wartości dla 0°, 90°, 180°
  verification:
    checkability: REFERENCE_CALL
    note: -2.0 vs -2.0 (tol 1e-09)
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: jedynka trygonometryczna i związek tg = sin/cos
  statement: Kąt \alpha jest kątem rozwartym i \cos\alpha = -\frac{12}{13}. Oblicz \sin\alpha oraz \operatorname{tg}\alpha,
    a następnie wartość wyrażenia W = \frac{\sin\alpha}{1+\cos\alpha}.
  statement_latex: \cos\alpha=-\frac{12}{13},\quad 90^{\circ}<\alpha<180^{\circ},\qquad W=\frac{\sin\alpha}{1+\cos\alpha}
  solution: |-
    Z jedynki trygonometrycznej \sin^{2}\alpha+\cos^{2}\alpha=1 mamy
    \sin^{2}\alpha = 1-\left(-\frac{12}{13}\right)^{2}=1-\frac{144}{169}=\frac{25}{169}.
    Dla każdego kąta z przedziału \langle 0^{\circ},180^{\circ}\rangle jest \sin\alpha\ge 0, więc \sin\alpha=\frac{5}{13}.
    Dalej
    \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha}=\frac{\frac{5}{13}}{-\frac{12}{13}}=-\frac{5}{12} (ujemny, zgodnie z tym, że kąt jest rozwarty).
    Wreszcie 1+\cos\alpha = 1-\frac{12}{13}=\frac{1}{13}, więc
    W=\frac{\frac{5}{13}}{\frac{1}{13}}=5.
  solution_steps:
  - Podstaw \cos\alpha=-\frac{12}{13} do jedynki trygonometrycznej i wyznacz \sin^{2}\alpha=\frac{25}{169}.
  - 'Wybierz znak dodatni (sinus kąta z \langle 0^{\circ},180^{\circ}\rangle jest nieujemny): \sin\alpha=\frac{5}{13}.'
  - Oblicz \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha}=-\frac{5}{12}.
  - Oblicz 1+\cos\alpha=\frac{1}{13}.
  - Wyznacz W=\frac{\frac{5}{13}}{\frac{1}{13}}=5.
  answer:
    kind: MULTIPART
    parts:
    - name: sin alfa
      answer:
        kind: NUMERIC
        value: 0.38461538461538464
        latex: \frac{5}{13}
    - name: tg alfa
      answer:
        kind: NUMERIC
        value: -0.4166666666666667
        latex: -\frac{5}{12}
    - name: wartosc W
      answer:
        kind: NUMERIC
        value: 5.0
        latex: '5'
  checks:
  - kind: evaluate
    expr: \sqrt{1-\left(-\frac{12}{13}\right)^{2}}
    part: sin alfa
  - kind: evaluate
    expr: \frac{\frac{5}{13}}{-\frac{12}{13}}
    part: tg alfa
  - kind: evaluate
    expr: \frac{\frac{5}{13}}{1+\left(-\frac{12}{13}\right)}
    part: wartosc W
  skills:
  - jedynka trygonometryczna
  - dobór znaku dla kąta rozwartego
  - działania na ułamkach
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [sin alfa] SymPy solved it fresh: 0.38461538461538464 vs 0.38461538461538464
      (tol 1e-09) ; [tg alfa] SymPy solved it fresh: -0.4166666666666667 vs -0.4166666666666667 (tol 1e-09)
      ; [wartosc W] SymPy solved it fresh: 5.0 vs 5.0 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: równanie trygonometryczne w kontekście geometrycznym
  statement: W trójkącie ABC kąt przy wierzchołku C ma miarę 105^{\circ}, a sinus kąta przy wierzchołku
    A jest równy \frac{1}{2}. Wyznacz miary kątów A i B tego trójkąta oraz uzasadnij, dlaczego drugie
    rozwiązanie równania \sin A=\frac{1}{2} należy odrzucić.
  statement_latex: \sin A=\frac{1}{2},\qquad |\sphericalangle C| = 105^{\circ},\qquad |\sphericalangle
    A|+|\sphericalangle B|+|\sphericalangle C| = 180^{\circ}
  solution: |-
    Kątem ostrym o sinusie \frac{1}{2} jest 30^{\circ}. Ponieważ 0<\frac{1}{2}<1, w przedziale \langle 0^{\circ},180^{\circ}\rangle równanie \sin A=\frac{1}{2} ma dwa rozwiązania:
    A = 30^{\circ} lub A = 180^{\circ}-30^{\circ}=150^{\circ}.
    W trójkącie suma miar kątów wynosi 180^{\circ}, a kąt C ma 105^{\circ}, więc |\sphericalangle A| < 180^{\circ}-105^{\circ}=75^{\circ}. Rozwiązanie A=150^{\circ} jest więc sprzeczne z warunkami zadania i je odrzucamy.
    Zatem A = 30^{\circ}, a stąd
    B = 180^{\circ}-105^{\circ}-30^{\circ}=45^{\circ}.
  solution_steps:
  - 'Rozwiąż \sin A=\frac{1}{2} w \langle 0^{\circ},180^{\circ}\rangle: A=30^{\circ} lub A=150^{\circ}.'
  - Zauważ, że w trójkącie A+B = 180^{\circ}-105^{\circ} = 75^{\circ}, więc A<75^{\circ}.
  - Odrzuć A=150^{\circ} jako sprzeczne z sumą kątów trójkąta.
  - Przyjmij A=30^{\circ} i oblicz B=180-105-30=45^{\circ}.
  answer:
    kind: MULTIPART
    parts:
    - name: miara kata A
      answer:
        kind: NUMERIC
        value: 30.0
        latex: 30^{\circ}
    - name: miara kata B
      answer:
        kind: NUMERIC
        value: 45.0
        latex: 45^{\circ}
    - name: uzasadnienie odrzucenia
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy wykazać, że równanie \sin A=\frac{1}{2} ma w \langle 0^{\circ},180^{\circ}\rangle
          dwa rozwiązania 30^{\circ} i 150^{\circ}, oraz uzasadnić, że A=150^{\circ} jest niemożliwe,
          bo A+C=255^{\circ}>180^{\circ} (suma kątów trójkąta wynosi 180^{\circ}, więc A<75^{\circ}).
  checks:
  - kind: evaluate
    expr: 180-105-30
    part: miara kata B
  skills:
  - rozwiązywanie sin α = s w ⟨0°,180°⟩
  - suma kątów trójkąta
  - odrzucanie rozwiązań sprzecznych z warunkami zadania
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie odrzucenia · 1/2 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: wyznaczanie pozostałych funkcji trygonometrycznych i wartość wyrażenia
  statement: Kąt α jest kątem rozwartym i \operatorname{tg}\alpha = -\frac{3}{4}. Oblicz \sin\alpha oraz
    \cos\alpha, a następnie oblicz dokładną wartość wyrażenia W = \frac{\sin\alpha - \cos\alpha}{\sin\alpha
    \cdot \cos\alpha}.
  statement_latex: \operatorname{tg}\alpha=-\frac{3}{4},\quad \alpha\in\left(90^\circ,180^\circ\right),\qquad
    W=\frac{\sin\alpha-\cos\alpha}{\sin\alpha\cdot\cos\alpha}
  solution: |-
    Ponieważ α jest kątem rozwartym, jego drugie ramię leży w II ćwiartce, więc punkt P=(x,y) tego ramienia spełnia x<0 oraz y>0.
    Z definicji \operatorname{tg}\alpha=\frac{y}{x}=-\frac{3}{4}, więc możemy przyjąć x=-4, y=3 (znaki zgodne z II ćwiartką).
    Wtedy r=|OP|=\sqrt{\left(-4\right)^2+3^2}=\sqrt{16+9}=5 (r jest zawsze dodatnie).
    Stąd \sin\alpha=\frac{y}{r}=\frac{3}{5} oraz \cos\alpha=\frac{x}{r}=-\frac{4}{5}.
    Kontrola znaków: sinus dodatni, cosinus ujemny – zgodnie z tym, że kąt jest rozwarty. Kontrola jedynką: \left(\frac{3}{5}\right)^2+\left(-\frac{4}{5}\right)^2=\frac{9+16}{25}=1.
    Licznik: \sin\alpha-\cos\alpha=\frac{3}{5}-\left(-\frac{4}{5}\right)=\frac{7}{5}.
    Mianownik: \sin\alpha\cdot\cos\alpha=\frac{3}{5}\cdot\left(-\frac{4}{5}\right)=-\frac{12}{25}.
    Zatem W=\frac{\frac{7}{5}}{-\frac{12}{25}}=\frac{7}{5}\cdot\left(-\frac{25}{12}\right)=-\frac{35}{12}.
  solution_steps:
  - 'Zauważ, że kąt rozwarty ma ramię w II ćwiartce: x<0, y>0.'
  - Z \operatorname{tg}\alpha=\frac{y}{x}=-\frac{3}{4} przyjmij x=-4, y=3.
  - Oblicz r=\sqrt{\left(-4\right)^2+3^2}=5.
  - Zapisz \sin\alpha=\frac{3}{5}, \cos\alpha=-\frac{4}{5} i sprawdź znaki oraz jedynkę trygonometryczną.
  - Oblicz licznik \frac{7}{5} i mianownik -\frac{12}{25}, a następnie W=-\frac{35}{12}.
  answer:
    kind: MULTIPART
    parts:
    - name: sin_alpha
      answer:
        kind: NUMERIC
        value: 0.6
        latex: \frac{3}{5}
    - name: cos_alpha
      answer:
        kind: NUMERIC
        value: -0.8
        latex: -\frac{4}{5}
    - name: W
      answer:
        kind: NUMERIC
        value: -2.9166666666666665
        latex: -\frac{35}{12}
  checks:
  - kind: evaluate
    expr: \frac{3}{\sqrt{\left(-4\right)^2+3^2}}
    part: sin_alpha
  - kind: evaluate
    expr: \frac{-4}{\sqrt{\left(-4\right)^2+3^2}}
    part: cos_alpha
  - kind: evaluate
    expr: \frac{\frac{3}{5}-\left(-\frac{4}{5}\right)}{\frac{3}{5}\cdot\left(-\frac{4}{5}\right)}
    part: W
  skills:
  - definicja współrzędnościowa funkcji trygonometrycznych
  - jedynka trygonometryczna
  - znaki funkcji w II ćwiartce
  - działania na ułamkach
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [sin_alpha] SymPy solved it fresh: 0.6 vs 0.6 (tol 1e-09) ;
      [cos_alpha] SymPy solved it fresh: -0.8 vs -0.8 (tol 1e-09) ; [W] SymPy solved it fresh: -2.9166666666666665
      vs -2.9166666666666665 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: równania trygonometryczne w trójkącie + wartość wyrażenia
  statement: W trójkącie ABC kąty wewnętrzne przy wierzchołkach A, B i C mają miary odpowiednio |\angle
    A|, |\angle B| i |\angle C|. Wiadomo, że \cos\left|\angle A\right| = -\frac{1}{2} oraz \sin\left|\angle
    B\right| = \frac{\sqrt{2}}{2}. Oblicz miary wszystkich trzech kątów tego trójkąta oraz dokładną wartość
    wyrażenia W = \frac{\sin\left|\angle A\right|}{\cos\left|\angle B\right|}.
  statement_latex: \cos\left|\angle A\right|=-\frac{1}{2},\qquad \sin\left|\angle B\right|=\frac{\sqrt{2}}{2},\qquad
    W=\frac{\sin\left|\angle A\right|}{\cos\left|\angle B\right|}
  solution: |-
    Kąt wewnętrzny trójkąta należy do przedziału \left(0^\circ,180^\circ\right).
    Równanie \cos\left|\angle A\right|=-\frac{1}{2}: kątem ostrym o cosinusie \frac{1}{2} jest 60^\circ, a wartość ujemna oznacza kąt rozwarty, więc |\angle A| = 180^\circ - 60^\circ = 120^\circ. Cosinus jest w tym przedziale malejący, więc to jedyne rozwiązanie.
    Równanie \sin\left|\angle B\right|=\frac{\sqrt{2}}{2} ma dwa rozwiązania: 45^\circ oraz 180^\circ - 45^\circ = 135^\circ. Ponieważ |\angle A| = 120^\circ, a suma kątów trójkąta wynosi 180^\circ, musi być |\angle B| < 60^\circ. Rozwiązanie 135^\circ odrzucamy, zatem |\angle B| = 45^\circ.
    Stąd |\angle C| = 180^\circ - 120^\circ - 45^\circ = 15^\circ.
    Dalej \sin 120^\circ = \sin\left(180^\circ-60^\circ\right) = \sin 60^\circ = \frac{\sqrt{3}}{2} oraz \cos 45^\circ = \frac{\sqrt{2}}{2}.
    Zatem W = \frac{\frac{\sqrt{3}}{2}}{\frac{\sqrt{2}}{2}} = \frac{\sqrt{3}}{\sqrt{2}} = \frac{\sqrt{6}}{2}.
  solution_steps:
  - Z \cos\left|\angle A\right|=-\frac{1}{2} wyznacz |\angle A| = 180^\circ - 60^\circ = 120^\circ (jedno
    rozwiązanie).
  - 'Z \sin\left|\angle B\right|=\frac{\sqrt{2}}{2} wypisz oba rozwiązania: 45^\circ i 135^\circ.'
  - Odrzuć 135^\circ, bo suma kątów przekroczyłaby 180^\circ; stąd |\angle B| = 45^\circ.
  - Oblicz |\angle C| = 180^\circ - 120^\circ - 45^\circ = 15^\circ.
  - Podstaw \sin 120^\circ = \frac{\sqrt{3}}{2}, \cos 45^\circ = \frac{\sqrt{2}}{2} i uprość W = \frac{\sqrt{6}}{2}.
  answer:
    kind: MULTIPART
    parts:
    - name: kat_A
      answer:
        kind: NUMERIC
        value: 120.0
        latex: 120^\circ
    - name: kat_B
      answer:
        kind: NUMERIC
        value: 45.0
        latex: 45^\circ
    - name: kat_C
      answer:
        kind: NUMERIC
        value: 15.0
        latex: 15^\circ
    - name: W
      answer:
        kind: SYMBOLIC
        latex: \frac{\sqrt{6}}{2}
  checks:
  - kind: evaluate
    expr: 180 - 60
    part: kat_A
  - kind: evaluate
    expr: 180 - 120 - 45
    part: kat_C
  - kind: evaluate
    expr: \frac{\frac{\sqrt{3}}{2}}{\frac{\sqrt{2}}{2}}
    part: W
  skills:
  - rozwiązywanie równań sin α = s, cos α = c w ⟨0°,180°⟩
  - odrzucanie rozwiązań sprzecznych z warunkami zadania
  - suma kątów trójkąta
  - wartości szczególne i wzory redukcyjne
  verification:
    checkability: REFERENCE_CALL
    note: 4 parts matched
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: diagnoza błędu – znak sinusa kąta rozwartego
  statement: 'Uczeń obliczał wartość wyrażenia W = 2\cdot\sin 120^{\circ} + 2\cdot\cos 120^{\circ} i rozumował
    tak: „kąt 120^{\circ} leży w II ćwiartce, więc wszystkie funkcje trygonometryczne zmieniają znak,
