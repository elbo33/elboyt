    Rzutem krawędzi bocznej SA na podstawę jest odcinek OA o długości R = \frac{6\cdot\sqrt{2}}{2} = 3\sqrt{2}. Z twierdzenia Pitagorasa w trójkącie prostokątnym SOA: H = \sqrt{b^{2}-R^{2}} = \sqrt{36-18} = \sqrt{18} = 3\sqrt{2}.

    Kąt α nachylenia krawędzi bocznej: \operatorname{tg}\alpha = \frac{H}{R} = \frac{3\sqrt{2}}{3\sqrt{2}} = 1, zatem α = 45°.

    Kąt β nachylenia ściany bocznej mierzymy w trójkącie prostokątnym SOM (M — środek krawędzi AB), w którym OM = r = \frac{a}{2} = 3: \operatorname{tg}\beta = \frac{H}{r} = \frac{3\sqrt{2}}{3} = \sqrt{2} \approx 1{,}4142, czyli β ≈ 54°44'.

    Kontrola: \operatorname{tg}\beta = \sqrt{2}\cdot\operatorname{tg}\alpha oraz β > α. ✓
