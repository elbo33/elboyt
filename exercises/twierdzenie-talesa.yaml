- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: Konfiguracja motylka w trapezie – odcinek przez punkt przecięcia przekątnych
  statement: W trapezie ABCD podstawy AB i CD są równoległe, |AB| = 20 oraz |CD| = 12. Przekątne AC i
    BD przecinają się w punkcie S. Przez punkt S poprowadzono prostą równoległą do podstaw; przecina ona
    ramię AD w punkcie P, a ramię BC w punkcie Q. Oblicz |PS| oraz |PQ|.
  statement_latex: \frac{|DS|}{|SB|}=\frac{|CD|}{|AB|}=\frac{12}{20},\qquad \frac{|PS|}{|AB|}=\frac{|DS|}{|DB|}
  solution: |-
    Krok 1. Trójkąty ABS i CDS są podobne: kąty ASB i CSD są wierzchołkowe, a kąty BAS i DCS są naprzemianległe przy prostych równoległych AB i CD przeciętych sieczną AC. Zatem
    \frac{|DS|}{|SB|}=\frac{|CD|}{|AB|}=\frac{12}{20}=\frac{3}{5}.
    Krok 2. Punkt S dzieli przekątną DB w stosunku 3:5, więc odcinek DB składa się z 3+5 = 8 równych części i
    \frac{|DS|}{|DB|}=\frac{3}{8}.
    Krok 3. W trójkącie ABD punkt P leży na boku DA, punkt S na boku DB oraz PS ∥ AB. Z podobieństwa trójkątów DPS i DAB
    \frac{|PS|}{|AB|}=\frac{|DS|}{|DB|}=\frac{3}{8}, czyli |PS| = 20\cdot\frac{3}{8}=7{,}5.
    Krok 4. Analogicznie \frac{|CS|}{|SA|}=\frac{|CD|}{|AB|}=\frac{3}{5}, więc \frac{|CS|}{|CA|}=\frac{3}{8}, a w trójkącie ABC (Q na BC, S na AC, SQ ∥ AB) otrzymujemy |SQ| = 20\cdot\frac{3}{8}=7{,}5.
    Zatem |PQ| = |PS| + |SQ| = 7{,}5 + 7{,}5 = 15.
    Sprawdzenie: 12 < 15 < 20 — odcinek przechodzący przez S leży „między” podstawami ✓.
    Odpowiedź: |PS| = 7,5 oraz |PQ| = 15.
  solution_steps:
  - Z podobieństwa trójkątów ABS i CDS zapisz \frac{|DS|}{|SB|}=\frac{|CD|}{|AB|}=\frac{3}{5}.
  - 'Przejdź na proporcję część:całość: \frac{|DS|}{|DB|}=\frac{3}{8}.'
  - W trójkącie ABD z PS ∥ AB oblicz |PS| = 20\cdot\frac{3}{8} = 7{,}5.
  - Analogicznie w trójkącie ABC oblicz |SQ| = 20\cdot\frac{3}{8} = 7{,}5.
  - 'Dodaj: |PQ| = 7{,}5 + 7{,}5 = 15.'
  answer:
    kind: MULTIPART
    parts:
    - name: PS
      answer:
        kind: NUMERIC
        value: 7.5
    - name: PQ
      answer:
        kind: NUMERIC
        value: 15.0
  checks:
  - kind: evaluate
    expr: 20\cdot\frac{3}{8}
    part: PS
  - kind: evaluate
    expr: \frac{2\cdot 20\cdot 12}{20+12}
    part: PQ
