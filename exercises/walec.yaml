- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: trygonometria w przekroju osiowym + kula opisana
  statement: Przekątna przekroju osiowego walca ma długość 12 i tworzy z płaszczyzną podstawy kąt o mierze
    \alpha = 30^{\circ}. Oblicz objętość tego walca, pole jego przekroju osiowego oraz promień kuli opisanej
    na tym walcu. Zapisz obliczenia.
  statement_latex: 2r = 12\cdot \cos 30^{\circ},\qquad H = 12\cdot \sin 30^{\circ}
  solution: |-
    Przekrój osiowy to prostokąt o bokach 2r (poziomy) i H (pionowy); jego przekątna d = 12 tworzy z bokiem 2r kąt \alpha = 30^{\circ}.
    Z trójkąta prostokątnego: 2r = d\cos\alpha = 12 \cdot \frac{\sqrt{3}}{2} = 6\sqrt{3}, więc r = 3\sqrt{3} oraz r^2 = 27.
    H = d\sin\alpha = 12 \cdot \frac{1}{2} = 6.
    Objętość: V = \pi r^2 H = \pi \cdot 27 \cdot 6 = 162\pi.
    Pole przekroju osiowego: P_{os} = 2r \cdot H = 6\sqrt{3}\cdot 6 = 36\sqrt{3}.
    Kula opisana na walcu ma środek w środku osi walca, a jej promień spełnia R^2 = r^2 + \left(\frac{H}{2}\right)^2 = 27 + 9 = 36, więc R = 6 (przekątna przekroju osiowego jest średnicą koła wielkiego, 2R = 12).
    Sprawdzenie: 4r^2 + H^2 = 108 + 36 = 144 = 12^2 ✓.
    Odp. V = 162\pi, P_{os} = 36\sqrt{3}, R = 6.
  solution_steps:
  - Narysuj myślowo prostokąt przekroju osiowego o bokach 2r i H oraz przekątną d = 12.
  - Oblicz 2r = 12\cos 30^{\circ} = 6\sqrt{3}, więc r = 3\sqrt{3}.
  - Oblicz H = 12\sin 30^{\circ} = 6.
  - 'Objętość: V = \pi \cdot \left(3\sqrt{3}\right)^2 \cdot 6 = 162\pi.'
  - 'Pole przekroju osiowego: P_{os} = 2r\cdot H = 6\sqrt{3}\cdot 6 = 36\sqrt{3}.'
  - 'Promień kuli opisanej: R = \sqrt{r^2 + \left(\frac{H}{2}\right)^2} = \sqrt{27 + 9} = 6.'
  answer:
    kind: MULTIPART
    parts:
    - name: objętość
      answer:
        kind: SYMBOLIC
        latex: 162\pi
    - name: pole przekroju osiowego
      answer:
        kind: SYMBOLIC
        latex: 36\sqrt{3}
    - name: promień kuli opisanej
      answer:
        kind: NUMERIC
        value: 6.0
  checks:
  - kind: evaluate
    expr: \pi \cdot \left(3\sqrt{3}\right)^2 \cdot 6
    var: r
    part: objętość
  - kind: evaluate
    expr: 2\cdot 3\sqrt{3} \cdot 6
    var: r
    part: pole przekroju osiowego
  - kind: evaluate
    expr: \sqrt{\left(3\sqrt{3}\right)^2 + \left(\frac{6}{2}\right)^2}
    var: r
    part: promień kuli opisanej
  skills:
  - 2r = d\cos\alpha, H = d\sin\alpha
  - pole przekroju osiowego
  - R^2 = r^2 + \left(\frac{H}{2}\right)^2
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
