    Wyjaśnij, dlaczego rzutu ramienia na podstawę nie wolno liczyć jako 10·sin 60°.
  statement_latex: p=10\cdot\cos 60^\circ,\qquad |AB|=7+2\cdot 10\cdot\cos 60^\circ,\qquad h=10\cdot\sin
    60^\circ
  solution: |-
    BŁĘDNE ROZUMOWANIE (typowy błąd):
    Uczeń „zawsze liczy sinusem” i zapisuje rzut ramienia na dłuższą podstawę jako
    \[p=10\cdot\sin 60^\circ=5\sqrt3,\]
    skąd \(|AB|=7+2\cdot 5\sqrt3=7+10\sqrt3\approx 24{,}3\). To wynik błędny.

    DLACZEGO TO BŁĄD:
    Wybór funkcji zależy od położenia boku WZGLĘDEM kąta. Po opuszczeniu wysokości z D na AB powstaje trójkąt prostokątny, w którym ramię (10) jest przeciwprostokątną, wysokość leży NAPRZECIW kąta 60° (więc h = 10·sin 60°), a rzut ramienia leży PRZY tym kącie (więc p = 10·cos 60°). Uczeń zamienił te dwa boki rolami.

    POPRAWNE ROZWIĄZANIE:
    \[p=10\cdot\cos 60^\circ=10\cdot\frac{1}{2}=5,\]
    \[|AB|=|CD|+2p=7+2\cdot 5=17,\]
    \[h=10\cdot\sin 60^\circ=10\cdot\frac{\sqrt3}{2}=5\sqrt3 .\]
    Kontrola Pitagorasem: \(5^2+\left(5\sqrt3\right)^2=25+75=100=10^2\). ✓

    Odpowiedź: |AB| = 17, h = 5√3.
