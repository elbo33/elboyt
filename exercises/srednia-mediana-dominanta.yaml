  exercise_type: modelowanie zestawu danych opisanego słownie – średnia, mediana, dominanta i interpretacja
  statement: 'W pewnej małej firmie pracuje 10 osób: 7 pracowników szeregowych, 2 kierowników i dyrektor.
    Każdy pracownik szeregowy otrzymuje miesięcznie tę samą płacę, każdy kierownik otrzymuje miesięcznie
    o 1000 zł więcej niż pracownik szeregowy, a dyrektor otrzymuje miesięcznie dwa razy tyle, co pracownik
    szeregowy. Średnia miesięczna płaca w tej firmie jest równa 4600 zł. a) Oblicz miesięczną płacę pracownika
    szeregowego oraz miesięczną płacę dyrektora. b) Wyznacz medianę i dominantę miesięcznych płac w tej
    firmie. c) Oblicz, jaki procent pracowników tej firmy zarabia miesięcznie mniej niż średnia płaca
    w firmie, i uzasadnij, że mediana lepiej niż średnia opisuje typową płacę w tej firmie.'
  statement_latex: \frac{7 \cdot x + 2 \cdot \left(x + 1000\right) + 2 \cdot x}{10} = 4600
  solution: |-
    a) Oznaczmy przez x (w złotych) miesięczną płacę pracownika szeregowego, x > 0. Wtedy każdy kierownik zarabia x + 1000, a dyrektor 2x.
    Łączna płaca wszystkich 10 osób jest równa 10 · 4600 = 46000 zł, więc
    7x + 2(x + 1000) + 2x = 46000,
    7x + 2x + 2000 + 2x = 46000,
    11x = 44000,
    x = 4000.
    Zatem pracownik szeregowy zarabia 4000 zł, kierownik 4000 + 1000 = 5000 zł, a dyrektor 2 · 4000 = 8000 zł.
    Sprawdzenie: (7 · 4000 + 2 · 5000 + 8000)/10 = (28000 + 10000 + 8000)/10 = 46000/10 = 4600 ✓.

    b) Szereg uporządkowany płac (10 danych): 4000, 4000, 4000, 4000, 4000, 4000, 4000, 5000, 5000, 8000.
    n = 10 jest parzyste, więc mediana to średnia elementów o numerach 5 i 6: Me = (4000 + 4000)/2 = 4000 zł.
