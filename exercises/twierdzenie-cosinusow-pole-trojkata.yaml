- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: 'Trójkąt o danych trzech bokach (BBB): cosinus kąta i pole'
  statement: Dany jest trójkąt ABC, w którym |BC| = 4, |AC| = 5 oraz |AB| = 6. Oblicz cosinus największego
    kąta tego trójkąta oraz pole trójkąta ABC. Zapisz obliczenia i podaj wynik w postaci dokładnej.
  statement_latex: \cos\gamma = \frac{4^2 + 5^2 - 6^2}{2\cdot 4\cdot 5},\qquad P = \frac{1}{2}\cdot 4\cdot
    5\cdot\sin\gamma
  solution: |-
    Największy kąt leży naprzeciw najdłuższego boku, czyli naprzeciw boku AB = 6. Jest to kąt przy wierzchołku C, oznaczmy go \gamma; kąt ten jest zawarty między bokami BC = 4 i AC = 5.

    Z twierdzenia cosinusów: 6^2 = 4^2 + 5^2 - 2\cdot 4\cdot 5\cdot\cos\gamma, czyli 36 = 16 + 25 - 40\cos\gamma, zatem 40\cos\gamma = 5 oraz \cos\gamma = \frac{1}{8}.

    Cosinus jest dodatni, więc największy kąt jest ostry — trójkąt jest ostrokątny (kontrola: 36 < 16 + 25).

    Kąt trójkąta spełnia 0^\circ < \gamma < 180^\circ, więc \sin\gamma > 0 i \sin\gamma = \sqrt{1 - \left(\frac{1}{8}\right)^2} = \sqrt{\frac{63}{64}} = \frac{3\sqrt{7}}{8}.

    Pole: P = \frac{1}{2}\cdot 4\cdot 5\cdot\frac{3\sqrt{7}}{8} = \frac{30\sqrt{7}}{8} = \frac{15\sqrt{7}}{4} \approx 9,92.

    Kontrola: P \le \frac{1}{2}\cdot 4\cdot 5 = 10 i rzeczywiście 9,92 < 10.
  solution_steps:
  - Rozpoznaj, że największy kąt leży naprzeciw najdłuższego boku AB = 6; jest to kąt \gamma przy wierzchołku
    C, zawarty między bokami 4 i 5.
  - 'Zapisz twierdzenie cosinusów: 6^2 = 4^2 + 5^2 - 2\cdot 4\cdot 5\cdot\cos\gamma.'
  - Oblicz \cos\gamma = \frac{16 + 25 - 36}{40} = \frac{5}{40} = \frac{1}{8}.
  - Wyznacz \sin\gamma = \sqrt{1 - \frac{1}{64}} = \frac{3\sqrt{7}}{8} (znak plus, bo 0^\circ < \gamma
    < 180^\circ).
  - Oblicz P = \frac{1}{2}\cdot 4\cdot 5\cdot\frac{3\sqrt{7}}{8} = \frac{15\sqrt{7}}{4}.
  - 'Sprawdź sensowność: P < \frac{1}{2}\cdot 4\cdot 5 = 10.'
  answer:
    kind: MULTIPART
    parts:
    - name: cosinus_najwiekszego_kata
      answer:
        kind: NUMERIC
        value: 0.125
    - name: pole
      answer:
        kind: SYMBOLIC
        latex: \frac{15\sqrt{7}}{4}
  checks:
  - kind: evaluate
    expr: \frac{4^2 + 5^2 - 6^2}{2\cdot 4\cdot 5}
    part: cosinus_najwiekszego_kata
  - kind: evaluate
    expr: \frac{1}{2}\cdot 4\cdot 5\cdot\sqrt{1 - \left(\frac{1}{8}\right)^2}
    part: pole
  skills:
  - twierdzenie cosinusów
  - cosinus kąta z trzech boków
  - jedynka trygonometryczna
  - pole trójkąta przez sinus
  verification:
    checkability: DETERMINISTIC
