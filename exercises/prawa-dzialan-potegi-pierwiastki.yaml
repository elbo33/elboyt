    oraz w postaci jednego pierwiastka. Uczeń napisał, że \(\sqrt{7}\cdot\sqrt[3]{7}=\sqrt[5]{7}\), bo
    „stopnie pierwiastków się dodają”. Wyjaśnij, dlaczego jest to błąd, i podaj poprawny wynik.
  statement_latex: \sqrt{7}\cdot\sqrt[3]{7}
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń dodał stopnie pierwiastków:
    \[\sqrt{7}\cdot\sqrt[3]{7}=\sqrt[2+3]{7}=\sqrt[5]{7}=7^{\frac{1}{5}}.\]
    Dlaczego to źle: przy mnożeniu potęg o tej samej podstawie dodają się WYKŁADNIKI, a nie stopnie pierwiastków (stopień siedzi w mianowniku wykładnika). Zresztą \(7^{\frac{1}{5}}\approx 1{,}48\), a \(\sqrt{7}\cdot\sqrt[3]{7}\approx 2{,}65\cdot 1{,}91\approx 5{,}06\).

    POPRAWNIE: zamieniamy pierwiastki na potęgi (\(7>0\)):
    \[\sqrt{7}=7^{\frac{1}{2}},\qquad \sqrt[3]{7}=7^{\frac{1}{3}},\]
    \[7^{\frac{1}{2}}\cdot 7^{\frac{1}{3}}=7^{\frac{1}{2}+\frac{1}{3}}=7^{\frac{3}{6}+\frac{2}{6}}=7^{\frac{5}{6}}=\sqrt[6]{7^{5}}.\]
    Odpowiedź: \(7^{\frac{5}{6}}=\sqrt[6]{7^{5}}\).
