    checkability: STATED_MODEL
    note: 'stage 1 inconclusive: TypeError: name should be a string, not Token'
- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: ciąg pól trójkątów; czy liczba jest wyrazem ciągu, z warunkiem dodatkowym
  statement: |-
    Suma długości obu przyprostokątnych pewnego trójkąta prostokątnego jest równa 20, a długość jednej z nich jest liczbą naturalną dodatnią n. Pole tego trójkąta oznaczamy przez a_n.
    a) Zapisz wzór ogólny ciągu (a_n) i podaj, dla jakich n ma on sens.
    b) Rozstrzygnij, czy liczba 48 jest wyrazem ciągu (a_n), i podaj wszystkie indeksy, dla których wyraz jest równy 48.
    c) Spośród znalezionych indeksów wskaż ten, dla którego przyprostokątna o długości n jest krótsza od drugiej przyprostokątnej.
  statement_latex: a_n = \frac{n \cdot \left(20 - n\right)}{2}
  solution: |-
    a) Jeżeli jedna przyprostokątna ma długość n, to druga ma długość 20 - n. Obie długości muszą być dodatnie, a n jest liczbą naturalną dodatnią, więc 1 \leq n \leq 19.
    Pole trójkąta prostokątnego to połowa iloczynu przyprostokątnych:
    a_n = \frac{n \cdot \left(20 - n\right)}{2}, \quad n \in \{1, 2, \ldots, 19\}.

    b) Rozwiązujemy równanie \frac{n \cdot \left(20 - n\right)}{2} = 48, czyli n \cdot \left(20 - n\right) = 96, a więc n^2 - 20n + 96 = 0.
    \Delta = 400 - 384 = 16, \sqrt{\Delta} = 4, stąd n = \frac{20 - 4}{2} = 8 albo n = \frac{20 + 4}{2} = 12.
    Obie liczby są naturalne i należą do zakresu \{1, \ldots, 19\}, więc liczba 48 jest wyrazem ciągu — i to dwa razy: a_8 = 48 oraz a_{12} = 48.
    Sprawdzenie: a_8 = \frac{8 \cdot 12}{2} = 48, a_{12} = \frac{12 \cdot 8}{2} = 48. ✓

    c) Warunek: n < 20 - n, czyli 2n < 20, a więc n < 10. Spośród liczb 8 i 12 warunek spełnia tylko n = 8 (przyprostokątne mają wtedy długości 8 i 12).
    Odpowiedź: a_n = \frac{n \cdot \left(20 - n\right)}{2} dla n \in \{1, \ldots, 19\}; wyraz równy 48 mają indeksy 8 i 12; warunek z punktu c) spełnia n = 8.
  solution_steps:
  - Oznacz przyprostokątne przez n i 20 - n; zauważ, że obie muszą być dodatnie, więc n \in \{1, \ldots,
    19\}.
