- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: przekrój stożka równoległy do podstawy
  statement: 'Stożek ma wysokość 15 cm i objętość 250 cm³. Stożek ten przecięto płaszczyzną równoległą
    do podstawy, w odległości 9 cm od wierzchołka. W ten sposób powstały: mały stożek przy wierzchołku
    oraz stożek ścięty. Oblicz objętość małego stożka, objętość stożka ściętego oraz stosunek objętości
    małego stożka do objętości stożka ściętego.'
  statement_latex: k=\frac{9}{15}=\frac{3}{5},\qquad V_{\text{mały}}=k^{3}\cdot 250,\qquad V_{\text{ścięty}}=250-V_{\text{mały}}
  solution: |-
    Płaszczyzna równoległa do podstawy odcina przy wierzchołku stożek podobny do całego stożka.
    Skala podobieństwa: k = 9/15 = 3/5.
    Objętość małego stożka: V_mały = k³·V = (3/5)³·250 = (27/125)·250 = 54 (cm³).
    Objętość stożka ściętego: V_ścięty = 250 − 54 = 196 (cm³) — równoważnie (1 − 27/125)·250 = (98/125)·250 = 196.
    Stosunek: V_mały : V_ścięty = 54 : 196 = 27 : 98.
    Odpowiedź: 54 cm³, 196 cm³ oraz stosunek 27 : 98.
  solution_steps:
  - Zauważ, że mały stożek przy wierzchołku jest podobny do całego stożka.
  - 'Wyznacz skalę z wysokości: k=\frac{9}{15}=\frac{3}{5}.'
  - 'Oblicz objętość małego stożka: V=\left(\frac{3}{5}\right)^{3}\cdot 250=54\ \text{cm}^{3}.'
  - 'Oblicz objętość stożka ściętego jako różnicę: 250-54=196\ \text{cm}^{3}.'
  - 'Zapisz i skróć stosunek: \frac{54}{196}=\frac{27}{98}.'
  answer:
    kind: MULTIPART
    parts:
    - name: objętość małego stożka
      answer:
        kind: NUMERIC
        value: 54.0
        latex: 54\ \text{cm}^{3}
    - name: objętość stożka ściętego
      answer:
        kind: NUMERIC
        value: 196.0
        latex: 196\ \text{cm}^{3}
    - name: stosunek objętości
      answer:
        kind: SYMBOLIC
        latex: \frac{27}{98}
  checks:
  - kind: evaluate
    expr: \left(\frac{9}{15}\right)^{3}\cdot 250
    part: objętość małego stożka
  - kind: evaluate
    expr: 250-\left(\frac{9}{15}\right)^{3}\cdot 250
    part: objętość stożka ściętego
  - kind: evaluate
    expr: \frac{54}{196}
    part: stosunek objętości
  skills:
  - skala z wysokości odciętej bryły
  - V' = k^3 V
  - objętość bryły ściętej jako różnica
  - stosunek objętości
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [objętość małego stożka] SymPy solved it fresh: 54.0 vs 54.0
      (tol 1e-09) ; [objętość stożka ściętego] SymPy solved it fresh: 196.0 vs 196.0 (tol 1e-09) ; [stosunek
