  exercise_type: obliczanie wartości wyrażenia arytmetycznego
  statement: Oblicz wartość wyrażenia \left(-2\right)^{3} + 3\cdot\left(-4\right) - \sqrt{49}.
  statement_latex: \left(-2\right)^{3} + 3\cdot\left(-4\right) - \sqrt{49}
  solution: |-
    Najpierw potęga i pierwiastek: \left(-2\right)^{3} = -8 (podstawa ujemna, wykładnik nieparzysty, więc wynik ujemny), \sqrt{49} = 7 (pierwiastek arytmetyczny jest nieujemny).
    Potem mnożenie: 3\cdot\left(-4\right) = -12.
    Wyrażenie ma postać -8 + \left(-12\right) - 7.
    Dodawanie i odejmowanie od lewej: -8 - 12 = -20, a następnie -20 - 7 = -27.
    Odpowiedź: -27.
  solution_steps:
  - 'Oblicz potęgę: (−2)³ = −8.'
  - 'Oblicz pierwiastek: √49 = 7.'
  - 'Wykonaj mnożenie: 3·(−4) = −12.'
  - 'Wykonaj dodawanie i odejmowanie od lewej: −8 − 12 − 7 = −27.'
  answer:
    kind: NUMERIC
    value: -27.0
  checks:
  - kind: evaluate
    expr: \left(-2\right)^{3} + 3\cdot\left(-4\right) - \sqrt{49}
  skills:
