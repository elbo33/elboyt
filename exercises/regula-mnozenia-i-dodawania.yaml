  statement_latex: 10 \cdot n \cdot \left(n-1\right)=1560
  solution: |-
    Oznaczmy przez n liczbę liter alfabetu (n jest liczbą naturalną, n \geq 2).

    Kod powstaje w trzech etapach:
    – pierwsza litera: n sposobów,
    – druga litera (musi być inna niż pierwsza): n-1 sposobów,
    – cyfra: 10 sposobów.
    Liczba możliwości na każdym etapie nie zależy od tego, które konkretnie litery wybrano wcześniej, więc regułą mnożenia liczba wszystkich kodów wynosi
    N\left(n\right)=n \cdot \left(n-1\right) \cdot 10.

    Z warunku zadania:
    10 \cdot n \cdot \left(n-1\right)=1560, czyli n \cdot \left(n-1\right)=156, czyli n^{2}-n-156=0.
    \Delta = 1+4 \cdot 156 = 625, \sqrt{\Delta}=25,
    n_{1}=\frac{1-25}{2}=-12, \qquad n_{2}=\frac{1+25}{2}=13.

    Liczba liter musi być dodatnia, więc rozwiązanie n=-12 odrzucamy.

    Sprawdzenie: 13 \cdot 12 \cdot 10 = 1560.

    Odpowiedź: alfabet liczy 13 liter.
