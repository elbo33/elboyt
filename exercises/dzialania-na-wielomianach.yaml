  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: AMBIGUOUS: ''parser returned an unresolved ambiguity (_ambig)'''
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: dodawanie wielomianów
  statement: Dane są wielomiany W(x)=x^{3}-4x+2 oraz P(x)=3x^{2}+4x-9. Wyznacz wielomian S(x)=W(x)+P(x)
    i zapisz go w postaci uporządkowanej.
  statement_latex: S(x)=\left(x^{3}-4x+2\right)+\left(3x^{2}+4x-9\right)
  solution: |-
    Zapisujemy sumę w nawiasach: S(x)=\left(x^{3}-4x+2\right)+\left(3x^{2}+4x-9\right). Przed drugim nawiasem stoi znak +, więc opuszczamy nawiasy bez zmiany znaków: x^{3}-4x+2+3x^{2}+4x-9.
    Redukujemy: x^{3} (bez pary), 3x^{2} (bez pary), -4x+4x=0, 2-9=-7.
    Po uporządkowaniu S(x)=x^{3}+3x^{2}-7.
    Kontrola dla x=1: W\left(1\right)=1-4+2=-1, P\left(1\right)=3+4-9=-2, suma -3; z wyniku 1+3-7=-3 ✔.
  solution_steps:
  - Zapisz sumę w nawiasach i opuść je bez zmiany znaków (przed nawiasem jest +).
  - Pogrupuj wyrazy podobne.
  - 'Zredukuj: -4x+4x=0, 2-9=-7.'
  - 'Zapisz wynik malejąco: S(x)=x^{3}+3x^{2}-7 i sprawdź dla x=1.'
  answer:
    kind: SYMBOLIC
    latex: x^{3}+3x^{2}-7
  checks:
  - kind: simplify
    expr: \left(x^{3}-4x+2\right)+\left(3x^{2}+4x-9\right)
  skills:
  - dodawanie wielomianów
  - redukcja wyrazów podobnych
  - kontrola przez podstawienie
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''x^{3}+3x^{2}-7'' vs ''x**3 + 3*x**2 - 7'''
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: mnożenie jednomianu przez wielomian
  statement: Wykonaj mnożenie -3x^{2}\cdot\left(4x^{3}-2x+5\right), zapisz wynik w postaci uporządkowanej
    i podaj stopień otrzymanego wielomianu.
  statement_latex: -3x^{2}\cdot\left(4x^{3}-2x+5\right)
  solution: |-
    Korzystamy z rozdzielności mnożenia względem dodawania — mnożymy jednomian przez każdy wyraz nawiasu:
    -3x^{2}\cdot 4x^{3}=-12x^{5},
    -3x^{2}\cdot\left(-2x\right)=6x^{3} (minus razy minus daje plus),
    -3x^{2}\cdot 5=-15x^{2}.
    Zatem -3x^{2}\cdot\left(4x^{3}-2x+5\right)=-12x^{5}+6x^{3}-15x^{2}.
    Stopień iloczynu jest sumą stopni czynników: 2+3=5 ✔.
  solution_steps:
  - Pomnóż -3x^{2} przez każdy wyraz nawiasu osobno.
  - 'Współczynniki mnóż, wykładniki dodawaj: -3\cdot 4=-12, x^{2}\cdot x^{3}=x^{5}.'
  - 'Pilnuj znaków: -3x^{2}\cdot\left(-2x\right)=6x^{3}.'
  - 'Zapisz wynik malejąco: -12x^{5}+6x^{3}-15x^{2}; stopień 2+3=5.'
  answer:
    kind: MULTIPART
    parts:
    - name: iloczyn
      answer:
        kind: SYMBOLIC
        latex: -12x^{5}+6x^{3}-15x^{2}
    - name: stopien
      answer:
        kind: NUMERIC
        value: 5.0
  checks:
  - kind: simplify
    expr: -3x^{2}\cdot\left(4x^{3}-2x+5\right)
    part: iloczyn
  skills:
  - rozdzielność mnożenia
  - mnożenie jednomianów
  - stopień iloczynu
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: odejmowanie wielomianów
  statement: Dane są wielomiany W(x)=4x^{3}-2x^{2}+x-6 oraz P(x)=4x^{3}+5x^{2}-3. Wyznacz wielomian R(x)=W(x)-P(x),
    zapisz go w postaci uporządkowanej i podaj jego stopień.
  statement_latex: R(x)=\left(4x^{3}-2x^{2}+x-6\right)-\left(4x^{3}+5x^{2}-3\right)
  solution: |-
    Zapisujemy różnicę w nawiasach: R(x)=\left(4x^{3}-2x^{2}+x-6\right)-\left(4x^{3}+5x^{2}-3\right).
    Minus przed nawiasem zmienia znak KAŻDEGO wyrazu odejmowanego wielomianu:
    4x^{3}-2x^{2}+x-6-4x^{3}-5x^{2}+3.
    Redukujemy: 4x^{3}-4x^{3}=0, -2x^{2}-5x^{2}=-7x^{2}, x pozostaje, -6+3=-3.
    Zatem R(x)=-7x^{2}+x-3.
    Wyrazy z x^{3} się zredukowały, więc stopień różnicy wynosi 2 (jest mniejszy niż stopnie obu wielomianów — dla różnicy i sumy zachodzi tylko nierówność \deg\le\max).
    Kontrola dla x=1: W\left(1\right)=4-2+1-6=-3, P\left(1\right)=4+5-3=6, różnica -9; z wyniku -7+1-3=-9 ✔.
  solution_steps:
  - 'Zapisz różnicę w nawiasach: (W)-(P).'
  - Zmień znak każdego wyrazu wielomianu P.
  - Zredukuj wyrazy podobne — wyrazy 4x^{3} i -4x^{3} znoszą się.
  - 'Zapisz wynik: R(x)=-7x^{2}+x-3 i odczytaj stopień 2.'
  - Sprawdź rachunki, podstawiając x=1.
  answer:
    kind: MULTIPART
    parts:
    - name: roznica
      answer:
        kind: SYMBOLIC
        latex: -7x^{2}+x-3
    - name: stopien
      answer:
        kind: NUMERIC
        value: 2.0
  checks:
  - kind: simplify
    expr: \left(4x^{3}-2x^{2}+x-6\right)-\left(4x^{3}+5x^{2}-3\right)
    part: roznica
  skills:
  - odejmowanie wielomianów
  - opuszczanie nawiasu ze znakiem minus
  - stopień sumy i różnicy
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: upraszczanie wyrażenia wielomianowego
  statement: Wyrażenie F(x)=\left(3x-2\right)\cdot\left(x^{2}+2x-4\right)-\left(x-1\right)^{2} zapisz
    w postaci uporządkowanego wielomianu, a następnie oblicz jego wartość dla x=2.
  statement_latex: F(x)=\left(3x-2\right)\cdot\left(x^{2}+2x-4\right)-\left(x-1\right)^{2}
  solution: |-
    Najpierw iloczyn — 2\cdot 3=6 iloczynów cząstkowych:
    3x\cdot x^{2}=3x^{3},\quad 3x\cdot 2x=6x^{2},\quad 3x\cdot\left(-4\right)=-12x,
    \left(-2\right)\cdot x^{2}=-2x^{2},\quad \left(-2\right)\cdot 2x=-4x,\quad \left(-2\right)\cdot\left(-4\right)=8.
    Po redukcji: \left(3x-2\right)\left(x^{2}+2x-4\right)=3x^{3}+4x^{2}-16x+8.
    Drugi składnik ze wzoru na kwadrat różnicy: \left(x-1\right)^{2}=x^{2}-2x+1.
    Odejmujemy CAŁE to wyrażenie, zmieniając znak każdego wyrazu:
    3x^{3}+4x^{2}-16x+8-x^{2}+2x-1.
    Redukcja: 4x^{2}-x^{2}=3x^{2}, -16x+2x=-14x, 8-1=7.
    Zatem F(x)=3x^{3}+3x^{2}-14x+7.
    Wartość dla x=2: F\left(2\right)=3\cdot 8+3\cdot 4-28+7=24+12-28+7=15.
    Kontrola z postaci wyjściowej: \left(6-2\right)\left(4+4-4\right)-\left(2-1\right)^{2}=4\cdot 4-1=15 ✔.
  solution_steps:
  - Wymnóż nawiasy metodą 'każdy z każdym' — 6 iloczynów cząstkowych.
  - 'Zredukuj: 3x^{3}+4x^{2}-16x+8.'
  - Zastosuj wzór \left(x-1\right)^{2}=x^{2}-2x+1.
  - 'Odejmij ten kwadrat, zmieniając znak każdego wyrazu, i zredukuj: F(x)=3x^{3}+3x^{2}-14x+7.'
  - 'Podstaw x=2: F\left(2\right)=24+12-28+7=15 i sprawdź z wyrażeniem wyjściowym.'
  answer:
    kind: MULTIPART
    parts:
    - name: postac uporzadkowana
      answer:
        kind: SYMBOLIC
        latex: 3x^{3}+3x^{2}-14x+7
    - name: wartosc dla x=2
      answer:
        kind: NUMERIC
        value: 15.0
  checks:
  - kind: simplify
    expr: \left(3x-2\right)\cdot\left(x^{2}+2x-4\right)-\left(x-1\right)^{2}
    part: postac uporzadkowana
  - kind: evaluate
    expr: \left(3\cdot 2-2\right)\cdot\left(2^{2}+2\cdot 2-4\right)-\left(2-1\right)^{2}
    part: wartosc dla x=2
  skills:
  - mnożenie wielomianów
  - wzór na kwadrat różnicy
  - opuszczanie nawiasu ze znakiem minus
  - obliczanie wartości wielomianu
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [postac uporzadkowana] SymPy solved it fresh: ''3x^{3}+3x^{2}-14x+7''
      vs ''3*x**3 + 3*x**2 - 14*x + 7'' ; [wartosc dla x=2] SymPy solved it fresh: 15.0 vs 15.0 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: dobieranie parametru z warunku na współczynniki
  statement: Dany jest wielomian W(x)=\left(2x^{2}+kx-3\right)\cdot\left(x+4\right)-5x^{2}, gdzie k jest
    parametrem rzeczywistym. Wyznacz taką wartość k, dla której wielomian W nie zawiera wyrazu z x^{2}.
    Dla znalezionej wartości k zapisz wzór wielomianu W w postaci uporządkowanej i podaj jego wyraz wolny.
  statement_latex: W(x)=\left(2x^{2}+kx-3\right)\cdot\left(x+4\right)-5x^{2}
  solution: |-
    Wykonujemy mnożenie (6 iloczynów cząstkowych):
    2x^{2}\cdot x=2x^{3},\quad 2x^{2}\cdot 4=8x^{2},\quad kx\cdot x=kx^{2},\quad kx\cdot 4=4kx,\quad \left(-3\right)\cdot x=-3x,\quad \left(-3\right)\cdot 4=-12.
    Zatem \left(2x^{2}+kx-3\right)\left(x+4\right)=2x^{3}+\left(8+k\right)x^{2}+\left(4k-3\right)x-12.
    Po odjęciu 5x^{2}: W(x)=2x^{3}+\left(k+3\right)x^{2}+\left(4k-3\right)x-12.
    Brak wyrazu z x^{2} oznacza, że współczynnik przy x^{2} jest równy zeru: k+3=0, czyli k=-3.
    Dla k=-3 mamy 4k-3=-12-3=-15, więc W(x)=2x^{3}-15x-12. Wyraz wolny wynosi -12 (to W\left(0\right)).
    Kontrola dla x=1, k=-3: \left(2-3-3\right)\left(1+4\right)-5=\left(-4\right)\cdot 5-5=-25 oraz 2-15-12=-25 ✔.
  solution_steps:
  - Wymnóż nawiasy i uporządkuj wynik według potęg x.
  - 'Zapisz współczynnik przy x^{2} z uwzględnieniem składnika -5x^{2}: 8+k-5=k+3.'
  - 'Przyrównaj go do zera: k+3=0, stąd k=-3.'
  - Podstaw k=-3 i zapisz W(x)=2x^{3}-15x-12.
  - 'Odczytaj wyraz wolny: -12; sprawdź wynik, podstawiając x=1.'
  answer:
    kind: MULTIPART
    parts:
    - name: parametr k
      answer:
        kind: NUMERIC
        value: -3.0
    - name: wzor wielomianu
      answer:
        kind: SYMBOLIC
        latex: 2x^{3}-15x-12
    - name: wyraz wolny
      answer:
        kind: NUMERIC
        value: -12.0
  checks:
  - kind: solve_equation
    expr: k+3=0
    var: k
    part: parametr k
  - kind: simplify
    expr: \left(2x^{2}-3x-3\right)\cdot\left(x+4\right)-5x^{2}
    part: wzor wielomianu
  - kind: evaluate
    expr: \left(2\cdot 0^{2}-3\cdot 0-3\right)\cdot\left(0+4\right)-5\cdot 0^{2}
    part: wyraz wolny
  skills:
  - mnożenie wielomianów
  - porównywanie współczynników
  - dobieranie parametru
  - wyraz wolny
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [parametr k] SymPy solved it fresh: -3.0 vs -3.0 (tol 1e-09)
      ; [wzor wielomianu] SymPy solved it fresh: ''2x^{3}-15x-12'' vs ''2*x**3 - 15*x - 12'' ; [wyraz
      wolny] SymPy solved it fresh: -12.0 vs -12.0 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: upraszczanie wyrażenia wielomianowego i odczytanie jego charakterystyk
  statement: Dany jest wielomian W\left(x\right)=\left(2\cdot x-1\right)\cdot\left(x^{2}+3\cdot x-4\right)-2\cdot\left(x-3\right)^{2}+5\cdot
    x. Zapisz wielomian W w postaci uporządkowanej (według malejących potęg zmiennej), a następnie podaj
    jego stopień, współczynnik przy x^{2} oraz wyraz wolny.
  statement_latex: W\left(x\right)=\left(2\cdot x-1\right)\cdot\left(x^{2}+3\cdot x-4\right)-2\cdot\left(x-3\right)^{2}+5\cdot
    x
  solution: |-
    Wykonujemy mnożenie „każdy z każdym” (2\cdot 3=6 iloczynów):
    \left(2\cdot x-1\right)\cdot\left(x^{2}+3\cdot x-4\right)=2\cdot x^{3}+6\cdot x^{2}-8\cdot x-x^{2}-3\cdot x+4=2\cdot x^{3}+5\cdot x^{2}-11\cdot x+4.
    Korzystamy ze wzoru na kwadrat różnicy: \left(x-3\right)^{2}=x^{2}-6\cdot x+9, zatem 2\cdot\left(x-3\right)^{2}=2\cdot x^{2}-12\cdot x+18.
    Odejmujemy CAŁE wyrażenie, więc zmieniamy znak każdego jego wyrazu:
    W\left(x\right)=2\cdot x^{3}+5\cdot x^{2}-11\cdot x+4-2\cdot x^{2}+12\cdot x-18+5\cdot x.
    Redukcja wyrazów podobnych: x^{3}: 2\cdot x^{3};\; x^{2}: 5-2=3, czyli 3\cdot x^{2};\; x: -11+12+5=6, czyli 6\cdot x;\; wyrazy wolne: 4-18=-14.
    Stąd W\left(x\right)=2\cdot x^{3}+3\cdot x^{2}+6\cdot x-14. Stopień wielomianu to 3, współczynnik przy x^{2} wynosi 3, a wyraz wolny -14.
    Kontrola dla x=1: \left(2-1\right)\cdot\left(1+3-4\right)-2\cdot\left(1-3\right)^{2}+5=0-8+5=-3 oraz 2+3+6-14=-3 ✔.
  solution_steps:
  - Wymnóż \left(2\cdot x-1\right)\cdot\left(x^{2}+3\cdot x-4\right)=2\cdot x^{3}+5\cdot x^{2}-11\cdot
    x+4.
  - Rozwiń 2\cdot\left(x-3\right)^{2}=2\cdot x^{2}-12\cdot x+18.
  - Opuść nawias ze znakiem minus, zmieniając znak każdego wyrazu.
  - 'Zredukuj wyrazy podobne i uporządkuj: W\left(x\right)=2\cdot x^{3}+3\cdot x^{2}+6\cdot x-14.'
  - 'Odczytaj: stopień 3, współczynnik przy x^{2} równy 3, wyraz wolny -14.'
  - Sprawdź wynik, podstawiając x=1 do obu postaci.
  answer:
    kind: MULTIPART
    parts:
    - name: postac_uporzadkowana
      answer:
        kind: SYMBOLIC
        latex: 2x^{3}+3x^{2}+6x-14
    - name: stopien
      answer:
        kind: NUMERIC
        value: 3.0
    - name: wspolczynnik_przy_x2
      answer:
        kind: NUMERIC
        value: 3.0
    - name: wyraz_wolny
      answer:
        kind: NUMERIC
        value: -14.0
  checks:
  - kind: simplify
    expr: \left(2\cdot x-1\right)\cdot\left(x^{2}+3\cdot x-4\right)-2\cdot\left(x-3\right)^{2}+5\cdot
      x
    part: postac_uporzadkowana
  - kind: evaluate
    expr: 2\cdot 3+\left(-1\right)\cdot 1-2\cdot 1
    part: wspolczynnik_przy_x2
  - kind: evaluate
    expr: \left(2\cdot 0-1\right)\cdot\left(0^{2}+3\cdot 0-4\right)-2\cdot\left(0-3\right)^{2}+5\cdot
      0
    part: wyraz_wolny
  skills:
  - mnożenie wielomianu przez wielomian
  - wzór na kwadrat różnicy
  - opuszczanie nawiasu ze znakiem minus
  - redukcja wyrazów podobnych i porządkowanie
  - odczytywanie stopnia, współczynnika i wyrazu wolnego
  verification:
    checkability: REFERENCE_CALL
    note: 4 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: dobieranie parametru z warunku na współczynnik
  statement: Dany jest wielomian W\left(x\right)=\left(x^{2}+a\cdot x-3\right)\cdot\left(2\cdot x-1\right)+5\cdot
    x^{2}, gdzie a jest liczbą rzeczywistą. Wyznacz tę wartość a, dla której wielomian W nie zawiera wyrazu
    z x^{2}. Dla znalezionej wartości a zapisz wielomian W w postaci uporządkowanej oraz oblicz W\left(-1\right).
  statement_latex: W\left(x\right)=\left(x^{2}+a\cdot x-3\right)\cdot\left(2\cdot x-1\right)+5\cdot x^{2}
  solution: |-
    Wykonujemy mnożenie (6 iloczynów):
    \left(x^{2}+a\cdot x-3\right)\cdot\left(2\cdot x-1\right)=2\cdot x^{3}-x^{2}+2\cdot a\cdot x^{2}-a\cdot x-6\cdot x+3.
    Po dodaniu 5\cdot x^{2} i uporządkowaniu:
    W\left(x\right)=2\cdot x^{3}+\left(2\cdot a+4\right)\cdot x^{2}+\left(-a-6\right)\cdot x+3.
    Brak wyrazu z x^{2} oznacza, że współczynnik przy x^{2} jest równy zeru:
    2\cdot a+4=0, czyli a=-2.
    Dla a=-2 mamy -a-6=2-6=-4, zatem W\left(x\right)=2\cdot x^{3}-4\cdot x+3.
    Wartość: W\left(-1\right)=2\cdot\left(-1\right)^{3}-4\cdot\left(-1\right)+3=-2+4+3=5.
    Kontrola bezpośrednio ze wzoru wyjściowego dla a=-2 i x=-1: \left(1+2-3\right)\cdot\left(-3\right)+5=0+5=5 ✔.
  solution_steps:
