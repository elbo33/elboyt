  exercise_type: obliczenie obwodu figury podobnej
  statement: Wielokąt W' jest podobny do wielokąta W w skali k = 3. Obwód wielokąta W jest równy 14 cm.
    Oblicz obwód wielokąta W'. Zapisz obliczenia.
  statement_latex: \mathrm{Obw}(W')=k\cdot \mathrm{Obw}(W)=3\cdot 14
  solution: |-
    Obwód jest wielkością liniową, więc przy podobieństwie w skali k mnoży się przez k.
    Zatem Obw(W') = 3 \cdot 14 = 42 cm.
    Sprawdzenie sensowności: k = 3 > 1, więc figura W' jest większa i jej obwód musi być większy — 42 > 14. Zgadza się.
    Odpowiedź: 42 cm.
  solution_steps:
  - 'Zapisz zależność obwodów figur podobnych: Obw(W'') = k·Obw(W).'
  - Podstaw k = 3 i Obw(W) = 14 cm.
  - Oblicz 3·14 = 42.
  - 'Podaj wynik z jednostką liniową: 42 cm.'
  answer:
    kind: NUMERIC
    value: 42.0
    latex: 42\ \text{cm}
  checks:
