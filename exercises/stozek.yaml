- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: równanie kwadratowe z odrzuceniem rozwiązania niegeometrycznego
  statement: Suma długości promienia podstawy i tworzącej pewnego stożka jest równa 18, a pole powierzchni
    bocznej tego stożka jest równe 65\pi. Oblicz objętość oraz pole powierzchni całkowitej tego stożka.
    Zapisz obliczenia.
  statement_latex: r+l=18,\qquad \pi\cdot r\cdot l=65\pi
  solution: |-
    Oznaczmy przez r promień podstawy; wtedy tworząca l=18-r.
    Z pola powierzchni bocznej: \pi r l=65\pi, czyli r\left(18-r\right)=65, co daje r^{2}-18r+65=0.
    Wyróżnik: \Delta=324-260=64, \sqrt{\Delta}=8, więc r=\frac{18-8}{2}=5 albo r=\frac{18+8}{2}=13.
    Dla r=13 mamy l=18-13=5, czyli l<r — to niemożliwe, bo tworząca jest przeciwprostokątną w trójkącie o przyprostokątnych r i H, więc zawsze l>r. Ten przypadek odrzucamy.
    Zostaje r=5 oraz l=13. Wysokość: H=\sqrt{l^{2}-r^{2}}=\sqrt{169-25}=\sqrt{144}=12.
    Objętość: V=\frac{1}{3}\pi r^{2}H=\frac{1}{3}\pi\cdot 25\cdot 12=100\pi.
    Pole całkowite: P_c=\pi r\left(r+l\right)=\pi\cdot 5\cdot 18=90\pi.
    Odpowiedź: V=100\pi, P_c=90\pi.
  solution_steps:
  - 'Wprowadź niewiadomą: r – promień podstawy, wtedy l=18-r.'
  - 'Zapisz równanie z pola bocznego: r\left(18-r\right)=65, czyli r^{2}-18r+65=0.'
  - 'Rozwiąż równanie: \Delta=64, r=5 lub r=13.'
  - Odrzuć r=13, bo wtedy l=5<r, a musi być l>r.
  - Dla r=5, l=13 oblicz H=\sqrt{169-25}=12.
  - Oblicz V=\frac{1}{3}\pi\cdot 5^{2}\cdot 12=100\pi oraz P_c=\pi\cdot 5\cdot\left(5+13\right)=90\pi.
  answer:
    kind: MULTIPART
    parts:
    - name: objetosc
      answer:
        kind: SYMBOLIC
        latex: 100\pi
    - name: pole_calkowite
      answer:
        kind: SYMBOLIC
        latex: 90\pi
  checks:
