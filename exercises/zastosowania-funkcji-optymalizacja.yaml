- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: porównanie dwóch modeli liniowych
  statement: Dwaj operatorzy proponują różne taryfy za rozmowy telefoniczne. W taryfie A abonent płaci
    25 zł miesięcznego abonamentu oraz 0,20 zł za każdą minutę rozmowy. W taryfie B nie ma abonamentu,
    ale każda minuta rozmowy kosztuje 0,45 zł. Niech t oznacza łączny czas rozmów w miesiącu, wyrażony
    w minutach (t \ge 0). (a) Oblicz, dla jakiego czasu rozmów miesięczne rachunki w obu taryfach są równe.
    (b) Wyznacz wszystkie czasy rozmów, dla których taryfa A jest tańsza od taryfy B. Zapisz obliczenia.
  statement_latex: K_{A}\left(t\right)=\frac{1}{5}t+25,\qquad K_{B}\left(t\right)=\frac{9}{20}t
  solution: |-
    Oznaczmy przez t czas rozmów w minutach, t \ge 0.
    Koszt w taryfie A: K_{A}(t)=0{,}2t+25 (25 zł to opłata stała, 0,20 zł – koszt jednej minuty).
    Koszt w taryfie B: K_{B}(t)=0{,}45t.
    (a) Rozwiązujemy równanie K_{A}(t)=K_{B}(t):
    0{,}2t+25=0{,}45t \Rightarrow 25=0{,}25t \Rightarrow t=100.
    Przy 100 minutach rozmów oba rachunki wynoszą 0{,}45\cdot 100=45 zł.
    (b) Rozwiązujemy nierówność K_{A}(t)<K_{B}(t):
    0{,}2t+25<0{,}45t \Rightarrow 25<0{,}25t \Rightarrow t>100.
    Po przecięciu z dziedziną t \ge 0 otrzymujemy t \in (100,\infty).
    Odpowiedź: rachunki są równe przy 100 minutach rozmów; taryfa A jest tańsza, gdy abonent rozmawia dłużej niż 100 minut miesięcznie.
  solution_steps:
  - 'Zapisz oba modele: K_A(t)=0,2t+25 oraz K_B(t)=0,45t.'
  - Rozwiąż równanie 0,2t+25=0,45t, otrzymując 0,25t=25, czyli t=100.
  - Rozwiąż nierówność 0,2t+25<0,45t, otrzymując t>100.
  - Przetnij rozwiązanie z dziedziną t \ge 0.
  - Sformułuj odpowiedź słowną z jednostkami (minuty).
  answer:
    kind: MULTIPART
    parts:
    - name: czas równych rachunków (min)
      answer:
        kind: NUMERIC
        value: 100.0
    - name: czasy, dla których taryfa A jest tańsza (min)
      answer:
        kind: INTERVAL
        lo: '100'
  checks:
  - kind: solve_equation
    expr: \frac{1}{5}\cdot t+25=\frac{9}{20}\cdot t
    var: t
    part: czas równych rachunków (min)
  - kind: solve_inequality
    expr: \frac{1}{5}\cdot t+25<\frac{9}{20}\cdot t
    var: t
    part: czasy, dla których taryfa A jest tańsza (min)
  skills:
  - porównywanie dwóch modeli liniowych
  - równanie liniowe
  - nierówność liniowa
  - interpretacja wyniku
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [czas równych rachunków (min)] SymPy solved it fresh: 100.0
      vs 100.0 (tol 1e-09) ; [czasy, dla których taryfa A jest tańsza (min)] SymPy solved it fresh: endpoints
      matched'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: optymalizacja ekonomiczna – przychód
  statement: Przy cenie biletu 30 zł na spektakl teatralny sprzedaje się 400 biletów. Z analizy sprzedaży
    wynika, że każda podwyżka ceny biletu o 5 zł powoduje spadek liczby sprzedanych biletów o 40. Niech
    x oznacza liczbę podwyżek ceny o 5 zł (x jest liczbą całkowitą nieujemną). Oblicz, jaką cenę biletu
    należy ustalić, aby przychód ze sprzedaży biletów był największy. Podaj tę cenę, liczbę sprzedanych
    wówczas biletów oraz największy przychód. Zapisz obliczenia.
  statement_latex: P\left(x\right)=\left(30+5x\right)\cdot\left(400-40x\right)
  solution: |-
    Niech x – liczba podwyżek ceny o 5 zł, x \in \{0,1,2,\ldots\}.
    Cena biletu: c(x)=30+5x (zł). Liczba sprzedanych biletów: n(x)=400-40x.
    Dziedzina: n(x)>0 \Rightarrow 400-40x>0 \Rightarrow x<10, więc x \in \{0,1,\ldots,9\}.
    Przychód: P(x)=(30+5x)(400-40x)=12000-1200x+2000x-200x^{2}=-200x^{2}+800x+12000.
    Współczynnik a=-200<0, więc funkcja przyjmuje wartość największą w wierzchołku:
    p=-\frac{800}{2\cdot(-200)}=2 – liczba całkowita należąca do dziedziny.
    q=P(2)=-200\cdot 4+1600+12000=12800.
    Wracamy do oznaczeń: cena = 30+5\cdot 2=40 zł, liczba biletów = 400-40\cdot 2=320.
    Sprawdzenie: 40\cdot 320=12800 zł – zgadza się.
    Odpowiedź: bilet powinien kosztować 40 zł; sprzeda się wtedy 320 biletów, a przychód wyniesie 12 800 zł.
  solution_steps:
  - Oznacz x – liczbę podwyżek o 5 zł; zapisz cenę c(x)=30+5x i sprzedaż n(x)=400-40x.
  - 'Wyznacz dziedzinę: 400-40x>0, czyli x \in \{0,1,\ldots,9\}.'
  - Zapisz przychód P(x)=(30+5x)(400-40x)=-200x^{2}+800x+12000.
  - Stwierdź, że a=-200<0, więc maksimum jest w wierzchołku.
  - Oblicz p=-\frac{800}{2\cdot(-200)}=2 i sprawdź, że 2 należy do dziedziny.
  - Oblicz cenę 30+5\cdot 2=40 zł, liczbę biletów 400-40\cdot 2=320 oraz P(2)=12800 zł.
  answer:
    kind: MULTIPART
    parts:
    - name: cena biletu (zł)
      answer:
        kind: NUMERIC
        value: 40.0
    - name: liczba sprzedanych biletów
      answer:
        kind: NUMERIC
        value: 320.0
    - name: największy przychód (zł)
      answer:
        kind: NUMERIC
        value: 12800.0
  checks:
  - kind: evaluate
    expr: 30+5\cdot\left(-\frac{800}{2\cdot\left(-200\right)}\right)
    part: cena biletu (zł)
  - kind: evaluate
    expr: 400-40\cdot\left(-\frac{800}{2\cdot\left(-200\right)}\right)
    part: liczba sprzedanych biletów
  - kind: evaluate
    expr: \left(30+5\cdot 2\right)\cdot\left(400-40\cdot 2\right)
    part: największy przychód (zł)
  stated_model:
    variable: x
    objective_latex: P\left(x\right)=\left(30+5x\right)\cdot\left(400-40x\right)
    domain_lo: '0'
    domain_hi: '10'
    domain_lo_open: false
    constraint_used: cena =30+5x, sprzedaż =400-40x, x – całkowite, 400-40x>0
  skills:
  - model ekonomiczny przychodu
  - iloczyn dwóch wielkości liniowych
  - wierzchołek paraboli
  - interpretacja zmiennej pomocniczej
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''x'': ''P\\left(x\\right)=\\left(30+5x\\right)\\cdot\\left(400-40x\\right)'')
      — human review'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: optymalizacja geometryczna z ograniczeniem przedziału
  statement: Właściciel gospodarstwa dysponuje 48 metrami bieżącymi siatki i chce ogrodzić prostokątny
    wybieg dla kur, przylegający jednym bokiem do prostej, długiej ściany budynku (przy tej ścianie siatki
    nie stawia). Ze względu na ustawienie karmników bok przylegający do ściany musi mieć długość co najmniej
    30 m. Niech x (w metrach) oznacza długość boku przylegającego do ściany, a y (w metrach) – długość
    boku prostopadłego do ściany. (a) Zapisz wzór funkcji P opisującej pole wybiegu w zależności od x
    (w postaci ogólnej) oraz wyznacz dziedzinę tej funkcji. (b) Oblicz wymiary x i y wybiegu o największym
    polu. (c) Oblicz to największe pole. Zapisz obliczenia.
  statement_latex: x+2y=48,\qquad P\left(x\right)=x\cdot\left(24-\frac{x}{2}\right)
  solution: |-
    (a) Grodzimy jeden bok o długości x oraz dwa boki o długości y, zatem warunek wiążący ma postać x+2y=48, skąd y=\frac{48-x}{2}=24-\frac{x}{2}.
    Pole: P(x)=x\cdot\left(24-\frac{x}{2}\right)=-\frac{1}{2}x^{2}+24x.
    Dziedzina: y>0 \Rightarrow 24-\frac{x}{2}>0 \Rightarrow x<48, a z treści x \ge 30. Zatem D=[30,48).
    (b) Wierzchołek: p=-\frac{24}{2\cdot\left(-\frac{1}{2}\right)}=24. Liczba 24 NIE należy do dziedziny [30,48).
    Ponieważ a=-\frac{1}{2}<0, funkcja jest malejąca na przedziale [24,\infty), a więc jest malejąca na całym [30,48). Największą wartość przyjmuje zatem w lewym końcu, czyli dla x=30.
    Wtedy y=24-\frac{30}{2}=24-15=9.
    (c) P(30)=30\cdot 9=270.
    Sprawdzenie: 30+2\cdot 9=48 m siatki – zgadza się.
    Odpowiedź: P(x)=-\frac{1}{2}x^{2}+24x, D=[30,48); wybieg ma wymiary 30 m (przy ścianie) na 9 m, a jego największe pole to 270 m².
  solution_steps:
  - 'Zapisz warunek wiążący: grodzone są jeden bok x i dwa boki y, więc x+2y=48.'
  - 'Wyznacz y=24-\frac{x}{2} i wstaw do wzoru na pole: P(x)=-\frac{1}{2}x^{2}+24x.'
  - 'Wyznacz dziedzinę: y>0 daje x<48, a warunek z treści daje x \ge 30, więc D=[30,48).'
  - Oblicz p=-\frac{24}{2\cdot(-0,5)}=24 i stwierdź, że p \notin D.
  - 'Skorzystaj z monotoniczności: a<0, więc na [30,48) funkcja maleje – maksimum w x=30.'
  - Oblicz y=24-15=9 oraz P(30)=30\cdot 9=270 (m²).
  answer:
    kind: MULTIPART
    parts:
    - name: wzór funkcji pola
      answer:
        kind: SYMBOLIC
        latex: -\frac{1}{2}x^{2}+24x
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '30'
        hi: '48'
        lo_open: false
    - name: wymiary (x, y) w metrach
      answer:
        kind: TUPLE
        items:
        - '30'
        - '9'
    - name: największe pole (m^2)
      answer:
        kind: NUMERIC
        value: 270.0
  checks:
  - kind: simplify
    expr: x\cdot\left(24-\frac{x}{2}\right)
    part: wzór funkcji pola
  - kind: evaluate
    expr: 30\cdot\left(24-\frac{30}{2}\right)
    part: największe pole (m^2)
  stated_model:
    variable: x
    objective_latex: P\left(x\right)=x\cdot\left(24-\frac{x}{2}\right)
    domain_lo: '30'
    domain_hi: '48'
    domain_lo_open: false
    constraint_used: x+2y=48 oraz x \ge 30, y>0
  skills:
  - warunek wiążący
  - redukcja do funkcji jednej zmiennej
  - dziedzina z ograniczeniem
  - ekstremum na przedziale (monotoniczność)
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''x'': ''P\\left(x\\right)=x\\cdot\\left(24-\\frac{x}{2}\\right)'')
      — human review'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: optymalizacja ekonomiczna (zysk, dziedzina całkowitoliczbowa)
  statement: Właściciel pensjonatu wynajmuje pokoje na doby. Przy cenie 120 zł za dobę wynajmowanych jest
    40 pokoi. Właściciel oszacował, że każda podwyżka ceny o 10 zł zmniejsza liczbę wynajętych pokoi o
    2. Obsługa jednego wynajętego pokoju kosztuje właściciela 20 zł na dobę. Zysk jest różnicą przychodu
    ze sprzedaży noclegów i kosztów obsługi wynajętych pokoi. Oblicz, jaką cenę za dobę należy ustalić,
    aby dobowy zysk pensjonatu był największy, oraz oblicz ten największy zysk. Zapisz obliczenia.
  statement_latex: Z\left(x\right)=\left(120+10\cdot x-20\right)\cdot\left(40-2\cdot x\right)=-20x^{2}+200x+4000
  solution: |-
    Niech x oznacza liczbę podwyżek ceny o 10 zł, przy czym x jest liczbą całkowitą nieujemną.
    Cena doby: c\left(x\right)=120+10\cdot x (zł). Liczba wynajętych pokoi: n\left(x\right)=40-2\cdot x.
    Dziedzina: n\left(x\right)>0, czyli 40-2\cdot x>0, stąd x<20; zatem x\in\{0,1,\ldots,19\}.
    Przychód: P\left(x\right)=\left(120+10\cdot x\right)\cdot\left(40-2\cdot x\right). Koszt obsługi: K\left(x\right)=20\cdot\left(40-2\cdot x\right).
    Zysk: Z\left(x\right)=P\left(x\right)-K\left(x\right)=\left(120+10\cdot x-20\right)\cdot\left(40-2\cdot x\right)=\left(100+10\cdot x\right)\cdot\left(40-2\cdot x\right).
    Po wymnożeniu: Z\left(x\right)=4000-200x+400x-20x^{2}=-20x^{2}+200x+4000.
    Współczynnik przy x^{2} jest równy -20<0, więc funkcja przyjmuje wartość największą w wierzchołku:
    p=-\frac{200}{2\cdot\left(-20\right)}=5, a 5 jest liczbą całkowitą należącą do dziedziny.
    q=Z\left(5\right)=-20\cdot 25+200\cdot 5+4000=-500+1000+4000=4500.
    Wracamy do oznaczeń: cena doby wynosi 120+10\cdot 5=170 zł, wynajętych jest 40-2\cdot 5=30 pokoi.
    Sprawdzenie: przychód 170\cdot 30=5100 zł, koszt obsługi 20\cdot 30=600 zł, zysk 5100-600=4500 zł.
    Odpowiedź: cena za dobę powinna wynosić 170 zł, a największy dobowy zysk to 4500 zł.
  solution_steps:
