- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: ciąg geometryczny z konstrukcji geometrycznej — wzór, suma, najmniejsze n
  statement: |-
    Kwadrat K_{1} ma bok długości 8. Dla każdej liczby naturalnej n \geq 1 wierzchołkami kwadratu K_{n+1} są środki boków kwadratu K_{n}. Przez P_{n} oznaczamy pole kwadratu K_{n}.
    a) Uzasadnij, że ciąg \left(P_{n}\right) jest geometryczny, i wyznacz jego wzór ogólny.
    b) Oblicz sumę pól sześciu początkowych kwadratów tej konstrukcji.
    c) Wyznacz najmniejszą liczbę naturalną n, dla której pole kwadratu K_{n} jest mniejsze od 1.
    Zapisz obliczenia.
  statement_latex: P_{n} = 64 \cdot \left(\frac{1}{2}\right)^{n-1}, \qquad S_{6} = 64 \cdot \frac{1 -
    \left(\frac{1}{2}\right)^{6}}{1 - \frac{1}{2}}
  solution: |-
    a) Niech bok kwadratu K_{n} ma długość a. Wierzchołki kwadratu K_{n+1} to środki boków K_{n}, więc każdy bok kwadratu K_{n+1} jest przeciwprostokątną trójkąta prostokątnego równoramiennego o przyprostokątnych \frac{a}{2}. Zatem bok kwadratu K_{n+1} ma długość \sqrt{\left(\frac{a}{2}\right)^{2} + \left(\frac{a}{2}\right)^{2}} = \frac{a\sqrt{2}}{2}, a jego pole wynosi \left(\frac{a\sqrt{2}}{2}\right)^{2} = \frac{a^{2}}{2} = \frac{1}{2} P_{n}.
    Zatem \frac{P_{n+1}}{P_{n}} = \frac{1}{2} dla każdego n, a wszystkie pola są dodatnie, więc ciąg \left(P_{n}\right) jest geometryczny o ilorazie q = \frac{1}{2}.
    Pierwszy wyraz: P_{1} = 8^{2} = 64, więc P_{n} = 64 \cdot \left(\frac{1}{2}\right)^{n-1}.
    b) Ponieważ q = \frac{1}{2} \neq 1:
    S_{6} = 64 \cdot \frac{1 - \left(\frac{1}{2}\right)^{6}}{1 - \frac{1}{2}} = 64 \cdot 2 \cdot \left(1 - \frac{1}{64}\right) = 128 \cdot \frac{63}{64} = 126.
    c) P_{n} = 64 \cdot \left(\frac{1}{2}\right)^{n-1} = 2^{6} \cdot 2^{-\left(n-1\right)} = 2^{7-n}.
    Warunek P_{n} < 1 = 2^{0} oznacza 7 - n < 0, czyli n > 7. Najmniejszą liczbą naturalną spełniającą tę nierówność jest n = 8.
    Sprawdzenie: P_{7} = 2^{0} = 1 (nie jest mniejsze od 1), a P_{8} = 2^{-1} = \frac{1}{2} < 1. ✓
    Odpowiedź: P_{n} = 64 \cdot \left(\frac{1}{2}\right)^{n-1}, S_{6} = 126, n = 8.
  solution_steps:
  - 'Wyznacz bok kwadratu K_{n+1} z twierdzenia Pitagorasa: \frac{a\sqrt{2}}{2}, gdzie a to bok K_{n}.'
  - Oblicz \frac{P_{n+1}}{P_{n}} = \frac{1}{2} — iloraz nie zależy od n, więc ciąg pól jest geometryczny.
  - Podaj P_{1} = 8^{2} = 64 i wzór ogólny P_{n} = 64 \cdot \left(\frac{1}{2}\right)^{n-1}.
  - Oblicz S_{6} = 64 \cdot \frac{1 - \left(\frac{1}{2}\right)^{6}}{1 - \frac{1}{2}} = 126.
  - Zapisz P_{n} = 2^{7-n} i rozwiąż nierówność 2^{7-n} < 2^{0}, otrzymując n > 7.
  - 'Wybierz najmniejszą liczbę naturalną większą od 7: n = 8 (sprawdź P_{7} = 1, P_{8} = \frac{1}{2}).'
