- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie bryły: wzór funkcji z dziedziną i wartość największa na przedziale'
  statement: Prostopadłościan ma podstawę, która jest kwadratem o krawędzi długości a (w centymetrach).
    Suma długości wszystkich krawędzi tego prostopadłościanu jest równa 48 cm, a jego wysokość jest co
    najmniej dwukrotnie dłuższa od krawędzi podstawy. a) Wyznacz wzór funkcji S opisującej pole powierzchni
    całkowitej tego prostopadłościanu w zależności od a oraz podaj dziedzinę tej funkcji. b) Oblicz największe
    możliwe pole powierzchni całkowitej takiego prostopadłościanu i podaj długości jego krawędzi. Zapisz
    obliczenia.
  statement_latex: S\left(a\right) = 2\cdot a^2 + 4\cdot a\cdot\left(12 - 2\cdot a\right) = -6\cdot a^2
    + 48\cdot a
  solution: |-
    a) Prostopadłościan o podstawie kwadratowej ma 8 krawędzi podstaw długości a i 4 krawędzie boczne długości h, więc 8a + 4h = 48, stąd h = 12 - 2a.
    Warunki: a > 0 oraz h ≥ 2a, czyli 12 - 2a ≥ 2a, więc 4a ≤ 12, stąd a ≤ 3. (Warunek h > 0 jest wtedy spełniony.) Dziedziną jest przedział (0, 3⟩.
    Pole powierzchni całkowitej: S(a) = 2a^2 + 4·a·h = 2a^2 + 4a(12 - 2a) = 2a^2 + 48a - 8a^2 = -6a^2 + 48a.
    b) a = -6 < 0, ramiona paraboli skierowane w dół, p = -\frac{48}{2\cdot(-6)} = 4.
    p = 4 ∉ (0, 3⟩ — wierzchołek leży poza dziedziną. Dla a < 0 funkcja rośnie w (-∞, 4⟩, a cała dziedzina (0,3⟩ leży w (-∞,4⟩, więc S jest rosnąca i wartość największą przyjmuje dla a = 3.
    S(3) = -6·9 + 48·3 = -54 + 144 = 90. Wtedy h = 12 - 2·3 = 6 (istotnie 6 ≥ 2·3, warunek jest spełniony).
    Odpowiedź: S(a) = -6a^2 + 48a dla a ∈ (0, 3⟩; największe pole powierzchni całkowitej wynosi 90 cm² i jest osiągane dla prostopadłościanu o krawędzi podstawy 3 cm i wysokości 6 cm. Wartość S(4) = 96 cm² jest nieosiągalna, bo dla a = 4 wysokość h = 4 nie spełnia warunku h ≥ 2a.
  solution_steps:
  - Z warunku 8a + 4h = 48 wyznacz h = 12 - 2a.
  - Zapisz warunki a > 0 oraz h ≥ 2a, czyli 12 - 2a ≥ 2a, i wyznacz dziedzinę a ∈ (0, 3⟩.
  - 'Zbuduj wzór: S(a) = 2a^2 + 4a(12-2a) = -6a^2 + 48a.'
  - Oblicz p = -\frac{48}{2\cdot(-6)} = 4 i stwierdź, że 4 ∉ (0,3⟩.
  - Z monotoniczności (a<0, dziedzina na lewo od p) maksimum jest dla a = 3.
  - Oblicz S(3) = 90 cm² oraz h = 12 - 2·3 = 6 cm i sprawdź warunek h ≥ 2a.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_S
      answer:
        kind: SYMBOLIC
        latex: -6\cdot a^2 + 48\cdot a
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '3'
        hi_open: false
    - name: najwieksze_pole
      answer:
        kind: NUMERIC
        value: 90.0
    - name: krawedz_podstawy
      answer:
        kind: NUMERIC
        value: 3.0
    - name: wysokosc
      answer:
        kind: NUMERIC
        value: 6.0
