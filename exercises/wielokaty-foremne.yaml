    BŁĘDNE ROZUMOWANIE: „Suma kątów to n·180°, więc n = 2520°/180° = 14”, a następnie „kąt wewnętrzny to 2520°/(n − 2) = 2520°/12 = 210°”. Kąt wewnętrzny wielokąta wypukłego nie może mieć 210°, więc wynik jest niemożliwy.

    GDZIE JEST BŁĄD: poprawny wzór to S = (n − 2)·180°, bo przekątne poprowadzone z jednego wierzchołka dzielą wielokąt na n − 2 trójkątów. Sumę dzielimy przez n (liczbę kątów), a nie przez n − 2.

    POPRAWNE ROZWIĄZANIE:
    (n − 2)·180° = 2520°  ⟹  n − 2 = 14  ⟹  n = 16.
    Kąt wewnętrzny: α = 2520°/16 = 157,5° (kontrola: 180° − 360°/16 = 180° − 22,5° = 157,5°). ✓
    Odpowiedź: szesnastokąt foremny, kąt wewnętrzny 157,5°.
