- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: wyznaczanie wzoru funkcji liniowej z warunku na pole trójkąta
  statement: Funkcja liniowa f jest rosnąca. Wykres funkcji f przecina oś OY w punkcie B = (0, 4), a oś
    OX — w punkcie A. Pole trójkąta o wierzchołkach A, B oraz O = (0, 0) jest równe 12. Wyznacz wzór funkcji
    f. Zapisz obliczenia.
  statement_latex: B = \left(0,\ 4\right),\qquad O = \left(0,\ 0\right),\qquad P_{AOB} = 12
  solution: |-
    Z punktu przecięcia z osią OY odczytujemy b = 4, zatem f\left(x\right) = a\cdot x + 4 oraz \left|OB\right| = 4.
    Trójkąt AOB ma kąt prosty w punkcie O, a jego przyprostokątne leżą na osiach, więc
    P = \frac{1}{2}\cdot\left|OA\right|\cdot\left|OB\right| = \frac{1}{2}\cdot\left|OA\right|\cdot 4 = 12, stąd \left|OA\right| = \frac{2\cdot 12}{4} = 6.
    Punkt A leży na osi OX, więc A = \left(6,\ 0\right) albo A = \left(-6,\ 0\right).
    Funkcja f jest rosnąca, więc a > 0, a ponieważ b = 4 > 0, miejsce zerowe x_0 = -\frac{4}{a} jest liczbą ujemną. Zatem A = \left(-6,\ 0\right).
    Współczynnik kierunkowy: a = \frac{4 - 0}{0 - \left(-6\right)} = \frac{4}{6} = \frac{2}{3}.
    Odpowiedź: f\left(x\right) = \frac{2}{3}\cdot x + 4.
    Sprawdzenie: f\left(-6\right) = -4 + 4 = 0 oraz \frac{1}{2}\cdot 6\cdot 4 = 12.
  solution_steps:
  - Odczytaj z punktu B, że b = 4, więc f\left(x\right) = a\cdot x + 4 i \left|OB\right| = 4.
  - 'Zapisz pole trójkąta prostokątnego AOB: \frac{1}{2}\cdot\left|OA\right|\cdot 4 = 12.'
  - Wyznacz \left|OA\right| = 6, czyli A = \left(6,\ 0\right) lub A = \left(-6,\ 0\right).
  - Z założenia, że f jest rosnąca (a > 0) przy b = 4 > 0 wynika, że miejsce zerowe jest ujemne, więc
    A = \left(-6,\ 0\right).
  - Oblicz a = \frac{4 - 0}{0 - \left(-6\right)} = \frac{2}{3} i zapisz wzór f\left(x\right) = \frac{2}{3}\cdot
    x + 4.
  answer:
    kind: MULTIPART
    parts:
    - name: x_A
      answer:
        kind: NUMERIC
        value: -6.0
    - name: a
      answer:
        kind: NUMERIC
        value: 0.6666666666666666
        tol: 1.0e-06
    - name: wzor
      answer:
        kind: SYMBOLIC
        latex: f\left(x\right) = \frac{2}{3}\cdot x + 4
  checks:
  - kind: evaluate
    expr: -\frac{2\cdot 12}{4}
    part: x_A
  - kind: evaluate
