- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: interpretacja geometryczna sin i cos na okręgu jednostkowym
  statement: W kartezjańskim układzie współrzędnych (x, y) punkt P leży w pierwszej ćwiartce na okręgu
    o środku w punkcie O = (0, 0) i promieniu 1. Odległość punktu P od osi Ox jest trzy razy większa od
    odległości punktu P od osi Oy. Przez α oznaczamy kąt ostry, jaki półprosta OP tworzy z dodatnią półosią
    Ox. Oblicz sin α oraz cos α, a następnie wartość wyrażenia \sin\alpha + \cos\alpha.
  statement_latex: \sin\alpha + \cos\alpha,\qquad P=\left(x,\ y\right),\ x^{2}+y^{2}=1,\ y = 3\cdot x
  solution: |-
    Niech P = (x, y), przy czym x > 0 i y > 0, bo punkt leży w pierwszej ćwiartce. Odległość P od osi Oy jest równa x, a odległość P od osi Ox jest równa y, więc warunek zadania daje y = 3·x.
    Ponieważ |OP| = 1, to w trójkącie prostokątnym o wierzchołkach O, (x, 0) i P przyprostokątne mają długości x oraz y, a przeciwprostokątna długość 1. Zatem
    \cos\alpha = \frac{x}{1} = x oraz \sin\alpha = \frac{y}{1} = y.
    Z jedynki trygonometrycznej (równoważnie: z równania okręgu) x^{2} + y^{2} = 1, a po wstawieniu y = 3·x:
    x^{2} + \left(3\cdot x\right)^{2} = 1, czyli 10\cdot x^{2} = 1, więc x^{2} = \frac{1}{10}.
    Ponieważ x > 0, mamy x = \frac{1}{\sqrt{10}} = \frac{\sqrt{10}}{10}, a stąd y = \frac{3\sqrt{10}}{10}.
    Zatem \cos\alpha = \frac{\sqrt{10}}{10}, \sin\alpha = \frac{3\sqrt{10}}{10} oraz
    \sin\alpha + \cos\alpha = \frac{3\sqrt{10}}{10} + \frac{\sqrt{10}}{10} = \frac{4\sqrt{10}}{10} = \frac{2\sqrt{10}}{5}.
    Kontrola: \left(\frac{3\sqrt{10}}{10}\right)^{2} + \left(\frac{\sqrt{10}}{10}\right)^{2} = \frac{9}{10} + \frac{1}{10} = 1, a wynik \frac{2\sqrt{10}}{5} \approx 1{,}26 należy do przedziału (1; \sqrt2\,], co jest zgodne z własnością sumy sinusa i cosinusa kąta ostrego.
  solution_steps:
  - Oznacz P = (x, y), x > 0, y > 0; odległość od osi Oy to x, a od osi Ox to y.
  - Zapisz warunek zadania jako y = 3·x.
  - Zauważ, że dla promienia długości 1 zachodzi cos α = x oraz sin α = y.
  - Wstaw y = 3x do równania x² + y² = 1 i otrzymaj 10x² = 1, czyli x = \frac{\sqrt{10}}{10}.
  - 'Wyznacz sin α = \frac{3\sqrt{10}}{10}, cos α = \frac{\sqrt{10}}{10} i dodaj: \frac{2\sqrt{10}}{5}.'
  answer:
