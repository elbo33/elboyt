- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: romb — przekątne i pole
  statement: W rombie ABCD bok ma długość 8, a kąt przy wierzchołku A ma miarę 120°. Oblicz długości obu
    przekątnych AC i BD oraz pole tego rombu. Wyniki podaj w postaci dokładnej.
  statement_latex: a=8,\ |\angle DAB|=120^\circ,\quad |BD|=2\cdot 8\cdot\sin 60^\circ,\quad |AC|=2\cdot
    8\cdot\sin 30^\circ,\quad P=8^{2}\cdot\sin 120^\circ
  solution: |-
    W rombie przekątne są prostopadłe, przecinają się w środku S i dzielą kąty rombu na połowy.

    1) Kąt przy A ma miarę 120°, więc przekątna AC dzieli go na dwa kąty po 60°. Kąt przy B ma miarę \(180^\circ-120^\circ=60^\circ\), a przekątna BD dzieli go na dwa kąty po 30°.

    2) W trójkącie prostokątnym ABS (kąt prosty przy S) przeciwprostokątną jest bok AB = 8, a kąt przy A wynosi 60°:
    \[|BS|=8\cdot\sin 60^\circ=4\sqrt3,\qquad |AS|=8\cdot\cos 60^\circ=4.\]

    3) Przekątne to podwojone te odcinki:
    \[|BD|=2\cdot 4\sqrt3=8\sqrt3,\qquad |AC|=2\cdot 4=8.\]
    Dłuższa przekątna \(BD=8\sqrt3\) leży naprzeciw kątów rozwartych.

    4) Pole:
    \[P=a^2\sin\alpha=8^2\cdot\sin 120^\circ=64\cdot\frac{\sqrt3}{2}=32\sqrt3 .\]
    Kontrola drugim wzorem: \(P=\tfrac12 d_1d_2=\tfrac12\cdot 8\cdot 8\sqrt3=32\sqrt3\). ✓

    Odpowiedź: \(|AC|=8\), \(|BD|=8\sqrt3\), \(P=32\sqrt3\).
  solution_steps:
  - 'Zauważ, że przekątne rombu są prostopadłe i dzielą kąty na połowy: przy A powstaje kąt 60°.'
  - 'W trójkącie prostokątnym z bokiem rombu jako przeciwprostokątną oblicz połowy przekątnych: 8·sin
    60° = 4√3 i 8·cos 60° = 4.'
  - 'Podwój: |BD| = 8√3 (dłuższa), |AC| = 8 (krótsza).'
  - 'Oblicz pole: P = 8²·sin 120° = 32√3 i sprawdź wzorem P = ½·d₁·d₂.'
  answer:
    kind: MULTIPART
    parts:
    - name: AC
      answer:
        kind: NUMERIC
        value: 8.0
    - name: BD
      answer:
        kind: SYMBOLIC
        latex: 8\sqrt{3}
    - name: pole
      answer:
        kind: SYMBOLIC
        latex: 32\sqrt{3}
  checks:
  - kind: evaluate
    expr: 2\cdot 8\cdot\frac{1}{2}
    part: AC
  - kind: evaluate
    expr: 2\cdot 8\cdot\frac{\sqrt{3}}{2}
    part: BD
  - kind: evaluate
    expr: 8^{2}\cdot\frac{\sqrt{3}}{2}
    part: pole
  skills:
