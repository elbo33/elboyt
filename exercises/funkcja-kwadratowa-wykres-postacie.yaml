  statement_latex: f(x)=2x^{2}-4x+5,\qquad \Delta=b^{2}-4\cdot a\cdot c
  solution: |-
    Błędne rozumowanie ucznia: myli postać kanoniczną (która istnieje zawsze) z iloczynową i „na siłę” szuka miejsc zerowych.
    Liczymy: a=2, b=-4, c=5, więc \Delta=\left(-4\right)^{2}-4\cdot 2\cdot 5=16-40=-24.
    Ponieważ \Delta=-24<0, funkcja f nie ma miejsc zerowych, a zatem postać iloczynowa nie istnieje — tak właśnie trzeba zapisać w odpowiedzi. Wykres oczywiście istnieje: parabola o ramionach skierowanych w górę, leżąca w całości nad osią Ox.
    Postać kanoniczna istnieje zawsze: p=\frac{-\left(-4\right)}{2\cdot 2}=1, q=f(1)=2-4+5=3, więc f(x)=2\left(x-1\right)^{2}+3.
    Kontrola: 2\left(x^{2}-2x+1\right)+3=2x^{2}-4x+5 ✔.
