  statement: 'Uczeń miał rozstrzygnąć, czy prawdziwe jest zdanie: „suma dwóch liczb parzystych jest podzielna
    przez \(4\)”. Napisał: „niech \(m\) i \(n\) będą liczbami parzystymi, czyli \(m=2k\) i \(n=2k\); wtedy
    \(m+n=4k\), więc suma jest podzielna przez \(4\)”. Wskaż błąd w tym rozumowaniu, rozstrzygnij, czy
    zdanie jest prawdziwe, i podaj resztę z dzielenia liczby \(2+4\) przez \(4\).'
  statement_latex: m = 2\cdot k,\quad n = 2\cdot l,\quad m+n = 2\cdot\left(k+l\right)
  solution: |-
    Błędne rozumowanie: uczeń przyjął m = 2k oraz n = 2k, otrzymał m+n = 4k i wyciągnął wniosek, że 4 \mid \left(m+n\right). Wniosek: „zdanie prawdziwe”.

    Dlaczego to błąd: zapis m = 2k i n = 2k wymusza m = n, a więc uczeń udowodnił tezę tylko dla dwóch RÓWNYCH liczb parzystych. Każda nowa liczba wymaga nowej litery.

    Poprawnie: niech m = 2k oraz n = 2l, gdzie k, l \in \mathbb{Z}. Wtedy m+n = 2k+2l = 2\cdot\left(k+l\right), a k+l jest liczbą całkowitą — suma jest zatem parzysta, ale nic więcej z tego nie wynika.

    Kontrprzykład: m = 2, n = 4 są parzyste, a m+n = 6 oraz 6 = 4\cdot 1 + 2, więc reszta z dzielenia liczby 6 przez 4 wynosi 2, czyli 6 nie jest podzielne przez 4.

    Odpowiedź: zdanie jest FAŁSZYWE, a reszta z dzielenia liczby 2+4 przez 4 jest równa 2.
  solution_steps:
  - 'Odtwarzamy błędne rozumowanie: m = 2k i n = 2k, stąd m+n = 4k.'
  - 'Wskazujemy błąd: ta sama litera k opisuje dwie różne liczby, co wymusza m = n.'
  - 'Zapisujemy poprawnie: m = 2k, n = 2l, m+n = 2\left(k+l\right) — suma jest tylko parzysta.'
  - 'Podajemy kontrprzykład: 2+4 = 6 = 4\cdot 1 + 2, reszta 2.'
  - 'Wniosek: zdanie jest fałszywe.'
  answer:
    kind: MULTIPART
    parts:
    - name: czy zdanie jest prawdziwe
      answer:
        kind: BOOLEAN
        truth: false
    - name: reszta z dzielenia liczby 2+4 przez 4
