- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: rozwijanie kwadratu dwumianu
  statement: Korzystając ze wzoru na kwadrat sumy, rozwiń wyrażenie \left(x+7\right)^{2} i zapisz wynik
    w postaci trójmianu uporządkowanego malejąco względem potęg x.
  statement_latex: \left(x+7\right)^{2}
  solution: |-
    We wzorze \left(a+b\right)^{2}=a^{2}+2\cdot a\cdot b+b^{2} przyjmujemy a=x oraz b=7.
    Kwadrat pierwszego składnika: x^{2}.
    Podwojony iloczyn składników: 2\cdot x\cdot 7=14x.
    Kwadrat drugiego składnika: 7^{2}=49.
    Zatem \left(x+7\right)^{2}=x^{2}+14x+49.
    Kontrola dla x=1: \left(1+7\right)^{2}=64 oraz 1+14+49=64 — zgadza się.
  solution_steps:
  - 'Rozpoznaj składniki: a=x, b=7.'
  - 'Zapisz kwadrat pierwszego składnika: x^{2}.'
  - 'Oblicz podwojony iloczyn: 2\cdot x\cdot 7=14x.'
  - 'Zapisz kwadrat drugiego składnika: 7^{2}=49.'
  - 'Zapisz wynik: x^{2}+14x+49 i sprawdź go dla x=1.'
  answer:
    kind: SYMBOLIC
    latex: x^{2}+14x+49
  checks:
  - kind: simplify
    expr: \left(x+7\right)^{2}
  skills:
  - kwadrat sumy
  - stosowanie wzorów skróconego mnożenia
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''x^{2}+14x+49'' vs ''(x + 7)**2'''
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: rozkład na czynniki
  statement: Rozłóż na czynniki wyrażenie 4x^{2}-49, korzystając ze wzoru na różnicę kwadratów.
  statement_latex: 4x^{2}-49
  solution: |-
    Oba wyrazy są kwadratami: 4x^{2}=\left(2x\right)^{2} oraz 49=7^{2}, a między nimi stoi znak minus, więc wzór na różnicę kwadratów można zastosować.
    We wzorze a^{2}-b^{2}=\left(a-b\right)\cdot\left(a+b\right) przyjmujemy a=2x, b=7.
    Stąd 4x^{2}-49=\left(2x-7\right)\cdot\left(2x+7\right).
    Kontrola: \left(2x-7\right)\cdot\left(2x+7\right)=4x^{2}+14x-14x-49=4x^{2}-49.
  solution_steps:
  - Sprawdź, że między wyrazami jest znak minus.
  - 'Zapisz wyrazy jako kwadraty: 4x^{2}=\left(2x\right)^{2}, 49=7^{2}.'
  - Zastosuj wzór a^{2}-b^{2}=\left(a-b\right)\cdot\left(a+b\right) dla a=2x, b=7.
  - Zapisz rozkład \left(2x-7\right)\cdot\left(2x+7\right) i sprawdź go przez wymnożenie.
  answer:
    kind: SYMBOLIC
    latex: \left(2x-7\right)\cdot\left(2x+7\right)
  checks:
  - kind: simplify
    expr: 4x^{2}-49
  skills:
  - różnica kwadratów
  - rozkład na czynniki
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''\\left(2x-7\\right)\\cdot\\left(2x+7\\right)'' vs ''4*x**2
      - 49'''
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: sprytne rachunki liczbowe
  statement: 'Nie używając kalkulatora, oblicz wartość każdego z wyrażeń, stosując wzory skróconego mnożenia:
    a) 101^{2}, b) 2025^{2}-2024^{2}.'
  statement_latex: \text{a) } \left(100+1\right)^{2}, \qquad \text{b) } 2025^{2}-2024^{2}
  solution: |-
    a) Zapisujemy 101=100+1 i stosujemy kwadrat sumy:
    101^{2}=\left(100+1\right)^{2}=100^{2}+2\cdot 100\cdot 1+1^{2}=10000+200+1=10201.
    b) Stosujemy różnicę kwadratów:
    2025^{2}-2024^{2}=\left(2025-2024\right)\cdot\left(2025+2024\right)=1\cdot 4049=4049.
  solution_steps:
  - a) Rozbij 101 na 100+1.
  - 'a) Zastosuj wzór \left(a+b\right)^{2}=a^{2}+2ab+b^{2}: 10000+200+1=10201.'
  - b) Zauważ różnicę kwadratów i zapisz ją jako iloczyn \left(2025-2024\right)\cdot\left(2025+2024\right).
  - b) Oblicz 1\cdot 4049=4049.
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: NUMERIC
        value: 10201.0
    - name: b
      answer:
        kind: NUMERIC
        value: 4049.0
  checks:
  - kind: evaluate
    expr: \left(100+1\right)^{2}
    part: a
  - kind: evaluate
    expr: 2025^{2}-2024^{2}
    part: b
