    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 14580.0 vs 14580.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: procent składany — kapitalizacja roczna
  statement: Klient wpłacił 5000 zł na lokatę oprocentowaną 3% w skali roku, z kapitalizacją roczną. Podatku
    od odsetek nie uwzględniamy. Oblicz wartość lokaty po 2 latach. Zapisz obliczenia.
  statement_latex: K_{2} = 5000\cdot\left(1+\frac{3}{100}\right)^{2}
  solution: |-
    Mnożnik jednego roku wynosi q = 1 + \frac{3}{100} = 1{,}03. Po n latach kapitał wynosi K_n = K_0\cdot q^{n} (kapitał początkowy odpowiada zeru lat).
    K_2 = 5000\cdot 1{,}03^{2} = 5000\cdot 1{,}0609 = 5304{,}50.
    Odpowiedź: po dwóch latach na lokacie będzie 5304,50 zł.
  solution_steps:
  - 'Wyznacz mnożnik jednego okresu: q = 1 + 3/100 = 1,03.'
  - Zapisz K_2 = 5000\cdot 1,03^2.
  - Oblicz 1,03^2 = 1,0609.
  - Oblicz K_2 = 5304,50 zł.
  answer:
    kind: NUMERIC
    value: 5304.5
    tol: 0.005
  checks:
  - kind: evaluate
    expr: 5000\cdot\left(1+\frac{3}{100}\right)^{2}
