    Hełm wieży ma kształt ostrosłupa prawidłowego czworokątnego. Suma długości krawędzi podstawy tego ostrosłupa i długości wysokości jego ściany bocznej jest równa 21 m. Ze względów konstrukcyjnych krawędź podstawy hełmu musi mieć długość co najmniej 12 m. Cztery ściany boczne mają zostać pokryte blachą.
