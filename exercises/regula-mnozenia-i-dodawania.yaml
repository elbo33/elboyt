  statement: |-
    W pewnej firmie każdy pracownik ma otrzymać własny, różny od pozostałych, identyfikator. Identyfikator składa się z jednej litery wybranej ze zbioru {A, B, C, D, E, F} oraz zapisanej po niej liczby trzycyfrowej o wszystkich cyfrach różnych, podzielnej przez 5 (np. A340, F195).
    a) Oblicz, ile jest wszystkich takich identyfikatorów.
    b) W firmie pracuje 1000 osób. Rozstrzygnij, czy dla każdego pracownika wystarczy inny identyfikator. Jeżeli nie wystarczy, oblicz, ile co najmniej liter musiałby liczyć zbiór dopuszczalnych liter (przy niezmienionych pozostałych warunkach), aby identyfikatorów było co najmniej 1000.
    Zapisz obliczenia.
  statement_latex: N = 6 \cdot \left(1 \cdot 9 \cdot 8 + 1 \cdot 8 \cdot 8\right), \qquad 136 \cdot k
    \geq 1000
  solution: |-
    Identyfikator powstaje w dwóch etapach: wybór litery, a potem wybór liczby trzycyfrowej o żądanych własnościach. Najpierw liczymy, ile jest takich liczb trzycyfrowych.

    Liczba jest podzielna przez 5, gdy kończy się cyfrą 0 albo 5. Warunek dotyczy ostatniego miejsca, a cyfra 0 wpływa na możliwości na pierwszym miejscu (cyfra setek nie może być zerem), więc dzielimy na dwa rozłączne przypadki.

    Przypadek A — ostatnia cyfra to 0:
    jedności: 1 sposób, setki: dowolna z cyfr 1–9, czyli 9 sposobów, dziesiątki: pozostałe 8 cyfr, czyli 8 sposobów.
    A = 1 \cdot 9 \cdot 8 = 72.

    Przypadek B — ostatnia cyfra to 5:
    jedności: 1 sposób, setki: cyfra różna od 0 i od 5, czyli 8 sposobów, dziesiątki: pozostałe 8 cyfr, czyli 8 sposobów.
    B = 1 \cdot 8 \cdot 8 = 64.

    Regułą dodawania takich liczb trzycyfrowych jest 72 + 64 = 136.

    a) Regułą mnożenia (litera, a potem liczba):
    N = 6 \cdot 136 = 816.

    b) Ponieważ 816 < 1000, identyfikatorów nie wystarczy dla 1000 pracowników — odpowiedź brzmi: nie.
    Niech k oznacza liczbę dopuszczalnych liter (k liczba naturalna dodatnia). Wtedy identyfikatorów jest 136 \cdot k i musi być spełniony warunek
    136 \cdot k \geq 1000, czyli k \geq \frac{1000}{136} = 7{,}35...
    Najmniejszą liczbą naturalną spełniającą tę nierówność jest k = 8 (sprawdzenie: 136 \cdot 7 = 952 < 1000, a 136 \cdot 8 = 1088 \geq 1000).

    Odpowiedź: a) 816 identyfikatorów; b) nie wystarczy; potrzeba co najmniej 8 liter.
  solution_steps:
  - 'Zauważam, że identyfikator powstaje w dwóch etapach: litera, potem liczba trzycyfrowa.'
  - Liczę liczby trzycyfrowe o różnych cyfrach podzielne przez 5, dzieląc na przypadki.
  - 'Przypadek A (ostatnia cyfra 0): 1 \cdot 9 \cdot 8 = 72.'
  - 'Przypadek B (ostatnia cyfra 5, setki ≠ 0 i ≠ 5): 1 \cdot 8 \cdot 8 = 64.'
  - 'Reguła dodawania: 72 + 64 = 136 liczb trzycyfrowych.'
  - 'Reguła mnożenia: N = 6 \cdot 136 = 816 identyfikatorów.'
  - 'Porównuję: 816 < 1000, więc identyfikatorów nie wystarczy.'
  - Wprowadzam k — liczbę liter; rozwiązuję 136 \cdot k \geq 1000, czyli k \geq \frac{1000}{136}.
  - 'Najmniejsza liczba naturalna: k = 8.'
