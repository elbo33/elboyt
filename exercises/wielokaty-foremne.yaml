    GDZIE JEST BŁĄD: kąt środkowy i kąt wewnętrzny to dwa różne kąty. Kąt środkowy to 360°/n, bo n takich kątów wypełnia kąt pełny; kąt wewnętrzny to 180° − 360°/n.

