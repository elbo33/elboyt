  statement: W trójkącie ABC dane są |AB| = 10, |AC| = 6 oraz kąt BAC o mierze 45°. Oblicz pole tego trójkąta.
    Wynik podaj w postaci dokładnej.
  statement_latex: P=\frac{1}{2}\cdot 10\cdot 6\cdot\sin 45^\circ
  solution: |-
    Kąt o mierze 45° leży MIĘDZY danymi bokami AB i AC, więc stosujemy wzór
    \[P=\tfrac12\cdot a\cdot b\cdot\sin\gamma .\]
    Stąd
    \[P=\frac{1}{2}\cdot 10\cdot 6\cdot\sin 45^\circ=30\cdot\frac{\sqrt2}{2}=15\sqrt2 .\]
    Odpowiedź: \(P=15\sqrt2\) (w przybliżeniu 21,2).
  solution_steps:
  - Sprawdź, że kąt 45° leży między bokami AB i AC.
  - Zapisz wzór P = ½·|AB|·|AC|·sin(∠BAC).
  - 'Podstaw dane: P = ½·10·6·(√2/2).'
  - 'Uprość: P = 15√2.'
  answer:
    kind: SYMBOLIC
    latex: 15\sqrt{2}
  checks:
  - kind: evaluate
