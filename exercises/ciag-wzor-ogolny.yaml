- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: sprawdzanie, czy liczba jest wyrazem ciągu
  statement: Ciąg \left(a_{n}\right) jest określony wzorem a_{n}=\frac{4\cdot n-3}{n+1} dla każdej liczby
    naturalnej n\geq 1. a) Oblicz wyraz a_{5}. b) Sprawdź, czy liczba 3 jest wyrazem tego ciągu, a jeśli
    tak — podaj jego numer. c) Rozstrzygnij, czy liczba 4 jest wyrazem tego ciągu.
  statement_latex: a_{n}=\frac{4\cdot n-3}{n+1},\qquad n\geq 1
  solution: |-
    a) a_{5}=\frac{4\cdot 5-3}{5+1}=\frac{17}{6}.
    b) Rozwiązujemy równanie \frac{4\cdot n-3}{n+1}=3. Ponieważ dla n\geq 1 mamy n+1\neq 0, mnożymy obie strony przez n+1: 4n-3=3\left(n+1\right), czyli 4n-3=3n+3, stąd n=6. Liczba 6 jest liczbą naturalną dodatnią, więc 3 jest wyrazem ciągu — jest to wyraz a_{6}. Sprawdzenie: a_{6}=\frac{24-3}{7}=\frac{21}{7}=3. ✓
    c) Rozwiązujemy \frac{4\cdot n-3}{n+1}=4, czyli 4n-3=4n+4, stąd -3=4 — sprzeczność. Równanie nie ma rozwiązań, więc liczba 4 nie jest wyrazem tego ciągu.
    Odpowiedź: a_{5}=\frac{17}{6}; liczba 3 jest szóstym wyrazem ciągu; liczba 4 nie jest wyrazem ciągu.
  solution_steps:
  - 'Podstaw n=5: a_{5}=\frac{17}{6}.'
  - Ułóż równanie \frac{4\cdot n-3}{n+1}=3 i pomnóż przez n+1.
  - Rozwiąż 4n-3=3n+3, otrzymując n=6; sprawdź, że 6\in\mathbb{N}_{+}.
  - Ułóż równanie \frac{4\cdot n-3}{n+1}=4 i doprowadź do sprzeczności -3=4.
  - Sformułuj odpowiedzi.
  answer:
    kind: MULTIPART
    parts:
    - name: a_5
      answer:
        kind: NUMERIC
        value: 2.8333333333333335
        tol: 1.0e-06
    - name: numer wyrazu równego 3
      answer:
        kind: NUMERIC
        value: 6.0
    - name: czy 4 jest wyrazem ciągu
      answer:
        kind: BOOLEAN
        truth: false
  checks:
  - kind: evaluate
    expr: \frac{4\cdot 5-3}{5+1}
    var: n
    part: a_5
  - kind: solve_equation
    expr: \frac{4\cdot n-3}{n+1}=3
    var: n
    part: numer wyrazu równego 3
  skills:
  - obliczanie wyrazu ciągu
  - rozwiązywanie równania a_n = c
  - sprawdzanie warunku n ∈ N+
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: kind mismatch: answer=NUMERIC reference=BOOLEAN'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: wyznaczanie parametru we wzorze ogólnym
  statement: Ciąg \left(a_{n}\right) jest określony wzorem a_{n}=3\cdot n^{2}+k\cdot n-4 dla każdej liczby
    naturalnej n\geq 1, gdzie k jest pewną liczbą rzeczywistą. Wiadomo, że a_{3}=20. a) Wyznacz k. b)
    Dla znalezionego k wyznacz i uprość różnicę a_{n+1}-a_{n}. c) Rozstrzygnij, czy liczba 0 jest wyrazem
    tego ciągu.
  statement_latex: a_{n}=3\cdot n^{2}+k\cdot n-4,\qquad a_{3}=20
  solution: |-
    a) Podstawiamy n=3: a_{3}=3\cdot 3^{2}+k\cdot 3-4=27+3k-4=23+3k. Z warunku 23+3k=20 otrzymujemy 3k=-3, czyli k=-1. Wzór ogólny ma postać a_{n}=3\cdot n^{2}-n-4.
    b) Wstawiamy \left(n+1\right) w miejsce każdego n:
    a_{n+1}=3\cdot\left(n+1\right)^{2}-\left(n+1\right)-4=3n^{2}+6n+3-n-1-4=3n^{2}+5n-2.
    Stąd a_{n+1}-a_{n}=\left(3n^{2}+5n-2\right)-\left(3n^{2}-n-4\right)=6n+2.
    Kontrola: a_{1}=-2, a_{2}=6, różnica 8=6\cdot 1+2. ✓
    c) Rozwiązujemy równanie 3n^{2}-n-4=0. \Delta=1+48=49, \sqrt{\Delta}=7, więc n=\frac{1-7}{6}=-1 lub n=\frac{1+7}{6}=\frac{4}{3}. Żadna z tych liczb nie jest liczbą naturalną dodatnią, zatem liczba 0 nie jest wyrazem tego ciągu.
  solution_steps:
  - 'Podstaw n=3 do wzoru: 23+3k.'
  - 'Przyrównaj do 20 i rozwiąż: k=-1.'
  - Zapisz wzór a_{n}=3\cdot n^{2}-n-4.
  - Wyznacz a_{n+1}=3\cdot\left(n+1\right)^{2}-\left(n+1\right)-4=3n^{2}+5n-2.
  - 'Odejmij a_{n} i uprość: a_{n+1}-a_{n}=6n+2.'
  - Rozwiąż 3n^{2}-n-4=0, otrzymując n=-1 i n=\frac{4}{3}; odrzuć oba jako nienależące do \mathbb{N}_{+}.
  - 'Odpowiedz: liczba 0 nie jest wyrazem ciągu.'
  answer:
    kind: MULTIPART
    parts:
    - name: k
      answer:
        kind: NUMERIC
        value: -1.0
    - name: a_{n+1}-a_n
      answer:
        kind: SYMBOLIC
        latex: 6\cdot n+2
    - name: czy 0 jest wyrazem ciągu
      answer:
        kind: BOOLEAN
        truth: false
  checks:
  - kind: solve_equation
    expr: 3\cdot 3^{2}+k\cdot 3-4=20
    var: k
    part: k
  - kind: simplify
    expr: 3\cdot\left(n+1\right)^{2}-\left(n+1\right)-4-\left(3\cdot n^{2}-n-4\right)
    var: n
    part: a_{n+1}-a_n
  skills:
  - wyznaczanie parametru z warunku o wyrazie
  - wyznaczanie a_{n+1} i różnicy a_{n+1}-a_n
  - sprawdzanie warunku n ∈ N+
  verification:
    checkability: REFERENCE_CALL
    note: '3 parts matched · det: [k] SymPy solved it fresh: -1.0 vs -1.0 (tol 1e-09) ; [a_{n+1}-a_n]
      SymPy solved it fresh: ''6\\cdot n+2'' vs ''6*n + 2'''
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: wyznaczanie parametru we wzorze ogólnym i badanie, czy liczba jest wyrazem ciągu
  statement: |-
    Ciąg (a_n) jest określony wzorem a_n = n^2 + k \cdot n - 21 dla każdej liczby naturalnej n \geq 1, gdzie k jest pewną liczbą rzeczywistą. Wiadomo, że a_5 = 9.
    a) Wyznacz k.
    b) Rozstrzygnij, czy liczba 51 jest wyrazem tego ciągu, a jeśli tak — podaj numer tego wyrazu.
    c) Rozstrzygnij, czy liczba (-21) jest wyrazem tego ciągu.
  statement_latex: a_n = n^2 + k \cdot n - 21,\qquad a_5 = 9
  solution: |-
    a) Podstawiamy n = 5 do wzoru ogólnego: a_5 = 5^2 + k \cdot 5 - 21 = 25 + 5k - 21 = 4 + 5k. Z warunku 4 + 5k = 9 otrzymujemy 5k = 5, czyli k = 1. Zatem a_n = n^2 + n - 21.
    Sprawdzenie: a_5 = 25 + 5 - 21 = 9. ✓

    b) Rozwiązujemy równanie n^2 + n - 21 = 51, czyli n^2 + n - 72 = 0. Wyróżnik: \Delta = 1 + 4 \cdot 72 = 289, \sqrt{\Delta} = 17, więc n = \frac{-1 - 17}{2} = -9 albo n = \frac{-1 + 17}{2} = 8. Liczba -9 nie jest liczbą naturalną dodatnią, więc ją odrzucamy. Pozostaje n = 8, a więc liczba 51 jest ósmym wyrazem ciągu (a_8 = 64 + 8 - 21 = 51 ✓).

    c) Rozwiązujemy równanie n^2 + n - 21 = -21, czyli n^2 + n = 0, stąd n \cdot (n + 1) = 0, więc n = 0 albo n = -1. Żadna z tych liczb nie należy do zbioru liczb naturalnych dodatnich (ciąg zaczyna się od n = 1), zatem liczba -21 nie jest wyrazem tego ciągu.
  solution_steps:
  - 'Podstaw n = 5: a_5 = 25 + 5k - 21 = 4 + 5k.'
  - 'Przyrównaj do 9 i rozwiąż: 5k = 5, czyli k = 1; wzór ogólny to a_n = n^2 + n - 21.'
  - Ułóż równanie n^2 + n - 21 = 51, czyli n^2 + n - 72 = 0.
  - Oblicz \Delta = 289, \sqrt{\Delta} = 17 i pierwiastki n = -9 oraz n = 8; odrzuć n = -9.
  - 'Odpowiedz: 51 jest ósmym wyrazem ciągu.'
  - Ułóż równanie n^2 + n - 21 = -21, czyli n(n+1) = 0; rozwiązania n = 0 i n = -1 nie są liczbami naturalnymi
    dodatnimi.
  - 'Wniosek: liczba -21 nie jest wyrazem ciągu.'
  answer:
    kind: MULTIPART
    parts:
    - name: k
      answer:
        kind: NUMERIC
        value: 1.0
    - name: indeks_51
      answer:
        kind: NUMERIC
        value: 8.0
    - name: czy_minus21_jest_wyrazem
      answer:
        kind: BOOLEAN
        truth: false
  checks:
  - kind: solve_equation
    expr: 5^2 + 5 \cdot k - 21 = 9
    var: k
    part: k
  - kind: evaluate
    expr: \frac{-1 + \sqrt{1 + 4 \cdot 72}}{2}
    var: n
    part: indeks_51
  skills:
  - podstawianie indeksu do wzoru ogólnego
  - wyznaczanie parametru z równania
  - rozwiązywanie równania kwadratowego a_n = c
  - kontrola warunku n ∈ N+
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: kind mismatch: answer=NUMERIC reference=MULTIPART'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: wyrazy o indeksach symbolicznych i różnica kolejnych wyrazów
  statement: |-
    Ciąg (a_n) jest określony wzorem a_n = \frac{3n + 2}{n + 1} dla każdej liczby naturalnej n \geq 1.
    a) Wyznacz i uprość a_{n+1} oraz a_{2n}.
    b) Oblicz i uprość różnicę a_{n+1} - a_n.
    c) Uzasadnij, że ciąg (a_n) jest rosnący.
    d) Rozstrzygnij, czy liczba 3 jest wyrazem tego ciągu.
  statement_latex: a_n = \frac{3n + 2}{n + 1}
  solution: |-
    a) W miejsce KAŻDEGO n wstawiamy wyrażenie w nawiasie.
    a_{n+1} = \frac{3 \cdot \left(n+1\right) + 2}{\left(n+1\right) + 1} = \frac{3n + 5}{n + 2}.
    a_{2n} = \frac{3 \cdot \left(2n\right) + 2}{\left(2n\right) + 1} = \frac{6n + 2}{2n + 1}.

    b) a_{n+1} - a_n = \frac{3n+5}{n+2} - \frac{3n+2}{n+1}. Wspólny mianownik: \left(n+1\right)\left(n+2\right).
    Licznik: \left(3n+5\right)\left(n+1\right) - \left(3n+2\right)\left(n+2\right) = \left(3n^2 + 8n + 5\right) - \left(3n^2 + 8n + 4\right) = 1.
    Zatem a_{n+1} - a_n = \frac{1}{\left(n+1\right)\left(n+2\right)}.

    c) Dla każdej liczby naturalnej n \geq 1 mamy n + 1 > 0 i n + 2 > 0, więc \frac{1}{\left(n+1\right)\left(n+2\right)} > 0, czyli a_{n+1} - a_n > 0, a stąd a_{n+1} > a_n dla każdego n. Ciąg jest więc rosnący.
    Kontrola liczbowa: a_1 = \frac{5}{2}, a_2 = \frac{8}{3}, różnica \frac{8}{3} - \frac{5}{2} = \frac{1}{6} = \frac{1}{2 \cdot 3}. ✓

    d) Rozwiązujemy równanie \frac{3n+2}{n+1} = 3. Mnożymy obie strony przez n + 1 > 0: 3n + 2 = 3n + 3, czyli 2 = 3 — sprzeczność. Równanie nie ma rozwiązań, więc liczba 3 nie jest wyrazem tego ciągu.
  solution_steps:
  - 'Wstaw (n+1) w miejsce każdego n: a_{n+1} = \frac{3(n+1)+2}{(n+1)+1} = \frac{3n+5}{n+2}.'
  - 'Wstaw (2n) w miejsce każdego n: a_{2n} = \frac{6n+2}{2n+1}.'
  - Zapisz różnicę \frac{3n+5}{n+2} - \frac{3n+2}{n+1} i sprowadź do wspólnego mianownika (n+1)(n+2).
  - 'Rozwiń liczniki: (3n^2+8n+5) - (3n^2+8n+4) = 1, czyli a_{n+1} - a_n = \frac{1}{(n+1)(n+2)}.'
  - Zauważ, że dla n \geq 1 mianownik jest dodatni, więc różnica jest dodatnia — ciąg jest rosnący.
  - 'Rozwiąż \frac{3n+2}{n+1} = 3: 3n+2 = 3n+3, sprzeczność — liczba 3 nie jest wyrazem ciągu.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_nplus1
      answer:
        kind: SYMBOLIC
        latex: \frac{3n + 5}{n + 2}
    - name: a_2n
      answer:
        kind: SYMBOLIC
        latex: \frac{6n + 2}{2n + 1}
    - name: roznica
      answer:
        kind: SYMBOLIC
        latex: \frac{1}{\left(n + 1\right) \cdot \left(n + 2\right)}
    - name: uzasadnienie_rosnacy
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy uzasadnić, że dla każdego n ∈ N+ różnica a_{n+1} - a_n = \frac{1}{(n+1)(n+2)} jest
          dodatnia (mianownik dodatni), a więc a_{n+1} > a_n i ciąg jest rosnący.
