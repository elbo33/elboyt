- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: procent koła a kąt środkowy
  statement: Na diagramie kołowym pewien wycinek koła obrazuje 15% wszystkich danych, czyli jego pole
    stanowi 15% pola całego koła. Oblicz miarę kąta środkowego tego wycinka.
  statement_latex: \alpha=\frac{15}{100}\cdot 360^\circ
  solution: 'Pole wycinka jest wprost proporcjonalne do kąta środkowego, więc wycinkowi o polu równym
    15% pola koła odpowiada kąt równy 15% kąta pełnego: \alpha=\frac{15}{100}\cdot 360^\circ=54^\circ.
    Kontrola: 0^\circ<54^\circ\le 360^\circ, a 54^\circ to nieco mniej niż 60^\circ, czyli nieco mniej
    niż \frac{1}{6} koła – zgadza się z 15%.'
  solution_steps:
  - 'Zapisz proporcję: pełnemu kątowi 360^\circ odpowiada 100% koła, a szukanemu kątowi \alpha odpowiada
    15%.'
  - Stąd \frac{\alpha}{360^\circ}=\frac{15}{100}.
  - Oblicz \alpha=\frac{15}{100}\cdot 360^\circ=54^\circ.
  - 'Sprawdź sensowność: 0^\circ<\alpha\le 360^\circ.'
  answer:
