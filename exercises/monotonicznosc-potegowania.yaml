- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: porownywanie_poteg_o_tej_samej_podstawie
  statement: Porównaj liczby w każdej z par. W każdym podpunkcie wpisz między liczbami znak < albo >.
    (a) 7^{-3} i 7^{-2}. (b) \left(\frac{2}{5}\right)^{4} i \left(\frac{2}{5}\right)^{7}.
  statement_latex: \text{(a) } 7^{-3} \;\square\; 7^{-2}, \qquad \text{(b) } \left(\frac{2}{5}\right)^{4}
    \;\square\; \left(\frac{2}{5}\right)^{7}
  solution: |-
    (a) Podstawą jest liczba 7, a 7 > 1, więc potęgowanie zachowuje porządek wykładników. Na osi liczbowej -3 < -2, zatem 7^{-3} < 7^{-2}.
    (b) Podstawą jest liczba \frac{2}{5}, a 0 < \frac{2}{5} < 1, więc potęgowanie odwraca porządek wykładników. Ponieważ 4 < 7, otrzymujemy \left(\frac{2}{5}\right)^{4} > \left(\frac{2}{5}\right)^{7}.
    Sprawdzenie w (b): \left(\frac{2}{5}\right)^{4} = \frac{16}{625}, a \left(\frac{2}{5}\right)^{7} = \frac{128}{78125} = \frac{16}{9765{,}625}\text{-tej części} — druga liczba jest wyraźnie mniejsza.
  solution_steps:
  - 'W podpunkcie (a) sprawdź podstawę: 7 > 1, więc potęgowanie jest rosnące.'
  - 'Porównaj wykładniki: -3 < -2, więc 7^{-3} < 7^{-2}.'
  - 'W podpunkcie (b) sprawdź podstawę: 0 < \frac{2}{5} < 1, więc potęgowanie jest malejące.'
  - 'Porównaj wykładniki: 4 < 7, więc znak trzeba odwrócić: \left(\frac{2}{5}\right)^{4} > \left(\frac{2}{5}\right)^{7}.'
  answer:
    kind: MULTIPART
    parts:
    - name: (a)
      answer:
        kind: SYMBOLIC
        latex: 7^{-3} < 7^{-2}
    - name: (b)
      answer:
        kind: SYMBOLIC
        latex: \left(\frac{2}{5}\right)^{4} > \left(\frac{2}{5}\right)^{7}
  skills:
  - monotoniczność potęgowania względem wykładnika
  - rozpoznanie położenia podstawy względem 1
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: porownanie_potegi_z_jedynka
  statement: 'Dla każdej z podanych liczb rozstrzygnij (odpowiedź TAK albo NIE), czy jest ona większa
    od 1: (a) \left(\frac{3}{4}\right)^{-6}, (b) \left(0{,}9\right)^{5}, (c) 2^{-0{,}3}.'
  statement_latex: \left(\frac{3}{4}\right)^{-6} > 1?\qquad \left(0{,}9\right)^{5} > 1?\qquad 2^{-0{,}3}
    > 1?
  solution: |-
    Punktem odniesienia jest a^{0} = 1.
    (a) Podstawa \frac{3}{4} należy do przedziału (0,1), a wykładnik -6 jest ujemny. Dla podstawy z (0,1) potęga jest większa od 1 dokładnie wtedy, gdy wykładnik jest ujemny, więc \left(\frac{3}{4}\right)^{-6} > 1 — odpowiedź TAK. (Rachunkiem: \left(\frac{3}{4}\right)^{-6} = \left(\frac{4}{3}\right)^{6} > 1.)
    (b) Podstawa 0{,}9 należy do (0,1), a wykładnik 5 jest dodatni, więc potęga jest mniejsza od 1 — odpowiedź NIE.
    (c) Podstawa 2 > 1, a wykładnik -0{,}3 jest ujemny, więc 2^{-0{,}3} < 2^{0} = 1 — odpowiedź NIE.
  solution_steps:
  - Zauważ, że w każdym podpunkcie porównujesz potęgę z a^{0} = 1.
  - '(a) podstawa z (0,1) i wykładnik ujemny → potęga większa od 1: TAK.'
  - '(b) podstawa z (0,1) i wykładnik dodatni → potęga mniejsza od 1: NIE.'
  - '(c) podstawa większa od 1 i wykładnik ujemny → potęga mniejsza od 1: NIE.'
  answer:
    kind: MULTIPART
    parts:
    - name: (a)
      answer:
        kind: BOOLEAN
        truth: true
    - name: (b)
      answer:
        kind: BOOLEAN
        truth: false
    - name: (c)
      answer:
        kind: BOOLEAN
        truth: false
  skills:
  - porównywanie potęgi z liczbą 1
  - znak wykładnika a położenie podstawy
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
- id: g-th-02
