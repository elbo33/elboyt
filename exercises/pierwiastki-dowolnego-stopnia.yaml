- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: wzór z parametrem naturalnym + obliczenia i ocena wykonalności
  statement: |-
    Metalowy sześcian o krawędzi \(12\ \mathrm{cm}\) przetopiono — bez strat materiału — na \(n\) jednakowych sześciennych kostek.
    a) Wyznacz wzór na długość krawędzi jednej kostki w zależności od \(n\) oraz podaj, jakie wartości może przyjmować \(n\).
    b) Oblicz długość krawędzi jednej kostki oraz sumę pól powierzchni wszystkich kostek dla \(n=4\). Wyniki zapisz w najprostszej postaci.
    c) Rozstrzygnij, czy kostka otrzymana dla \(n=4\) zmieściłaby się w sześciennym pudełku o krawędzi \(7{,}5\ \mathrm{cm}\).
  statement_latex: a\left(n\right)=\sqrt[3]{\frac{12^{3}}{n}}=\frac{12}{\sqrt[3]{n}}
  solution: |-
    a) Objętość dużego sześcianu wynosi \(V=12^{3}=1728\ \mathrm{cm}^{3}\). Po przetopieniu każda z \(n\) jednakowych kostek ma objętość \(\frac{1728}{n}\), więc jej krawędź jest równa
    \[a\left(n\right)=\sqrt[3]{\frac{1728}{n}}=\frac{\sqrt[3]{1728}}{\sqrt[3]{n}}=\frac{12}{\sqrt[3]{n}}\ \mathrm{cm}.\]
    Liczba kostek jest liczbą naturalną, a kostek jest kilka, zatem \(n\in\mathbb{N}\) oraz \(n\ge 2\).

    b) Dla \(n=4\):
    \[a=\frac{12}{\sqrt[3]{4}}=\frac{12\cdot\sqrt[3]{2}}{\sqrt[3]{4}\cdot\sqrt[3]{2}}=\frac{12\cdot\sqrt[3]{2}}{2}=6\cdot\sqrt[3]{2}\ \mathrm{cm}\ \left(\approx 7{,}56\ \mathrm{cm}\right).\]
    Pole powierzchni jednej kostki: \(6a^{2}=6\cdot 36\cdot\sqrt[3]{4}=216\cdot\sqrt[3]{4}\), więc suma pól powierzchni czterech kostek wynosi
    \[P=4\cdot 216\cdot\sqrt[3]{4}=864\cdot\sqrt[3]{4}\ \mathrm{cm}^{2}\ \left(\approx 1371{,}7\ \mathrm{cm}^{2}\right).\]

