- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: obraz okręgu danego w postaci rozwiniętej
  statement: W kartezjańskim układzie współrzędnych (x, y) dany jest okrąg o o równaniu x^2+y^2+8x-6y+9=0.
    a) Wyznacz środek i promień okręgu o. b) Wyznacz równanie okręgu o', który jest obrazem okręgu o w
    symetrii względem osi Ox. c) Rozstrzygnij, czy okrąg o' jest styczny do osi Oy, i uzasadnij odpowiedź.
  statement_latex: x^2+y^2+8x-6y+9=0,\qquad S_{Ox}\left(x,\;y\right)=\left(x,\;-y\right)
  solution: |-
    a) Grupujemy wyrazy: (x^2 + 8x) + (y^2 - 6y) = -9. Uzupełniamy do kwadratów: x^2 + 8x = (x + 4)^2 - 16 oraz y^2 - 6y = (y - 3)^2 - 9. Stąd (x + 4)^2 - 16 + (y - 3)^2 - 9 = -9, czyli (x + 4)^2 + (y - 3)^2 = 16. Środek S = (-4, 3), promień r = \sqrt{16} = 4.
    b) Symetria względem osi Ox zmienia znak drugiej współrzędnej środka: S' = (-4, -3). Promień pozostaje równy 4 (izometria). Równanie obrazu: (x + 4)^2 + (y + 3)^2 = 16.
    c) Odległość środka S' = (-4, -3) od osi Oy wynosi |-4| = 4 i jest równa promieniowi okręgu o'. Zatem okrąg o' jest styczny do osi Oy.
  solution_steps:
  - 'Pogrupuj wyrazy z x i z y, liczbę przenieś na prawą stronę: (x^2 + 8x) + (y^2 - 6y) = -9.'
  - 'Uzupełnij do pełnych kwadratów i zapisz postać kanoniczną: (x + 4)^2 + (y - 3)^2 = 16.'
  - Odczytaj środek S = (-4, 3) i promień r = \sqrt{16} = 4.
  - 'Wyznacz obraz środka w S_Ox: S'' = (-4, -3); promień się nie zmienia.'
  - 'Zapisz równanie obrazu: (x + 4)^2 + (y + 3)^2 = 16.'
  - Porównaj odległość środka S' od osi Oy, równą |-4| = 4, z promieniem 4 — są równe, więc okrąg jest
    styczny do osi Oy.
  answer:
    kind: MULTIPART
    parts:
    - name: srodek okregu o
      answer:
        kind: TUPLE
        items:
        - '-4'
        - '3'
    - name: promien okregu o
      answer:
        kind: NUMERIC
        value: 4.0
    - name: rownanie obrazu
      answer:
        kind: SYMBOLIC
        latex: \left(x+4\right)^2+\left(y+3\right)^2=16
    - name: czy o' jest styczny do Oy
      answer:
        kind: BOOLEAN
        truth: true
    - name: uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń musi uzasadnić, że odległość środka obrazu (-4, -3) od osi Oy wynosi |-4| = 4 i
          jest równa promieniowi 4, co jest warunkiem styczności okręgu do prostej.
  checks:
  - kind: evaluate
    expr: \sqrt{\left(-4\right)^2+3^2-9}
    part: promien okregu o
  skills:
  - sprowadzanie równania okręgu do postaci kanonicznej
  - symetria względem osi Ox
  - styczność okręgu do osi układu
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie · 1/4 other parts solved fresh'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: złożenie przekształceń i warunek styczności
  statement: 'W kartezjańskim układzie współrzędnych (x, y) dany jest okrąg o o równaniu \left(x-5\right)^2+\left(y+4\right)^2=9.
    a) Wyznacz równanie okręgu, który powstaje z okręgu o przez złożenie przekształceń: najpierw symetria
    względem osi Ox, a potem przesunięcie o wektor \vec{v}=\left[-2,\;3\right]. b) Wyznacz wszystkie liczby
    p, dla których obraz okręgu o w przesunięciu o wektor \vec{u}=\left[p,\;0\right] jest styczny do osi
    Oy.'
  statement_latex: \left(x-5\right)^2+\left(y+4\right)^2=9,\qquad \vec{v}=\left[-2,\;3\right],\qquad \vec{u}=\left[p,\;0\right]
  solution: |-
    Z równania odczytujemy środek S = (5, -4) i promień r = \sqrt{9} = 3.
    a) Najpierw symetria względem osi Ox: S_1 = (5, 4). Następnie przesunięcie o [-2, 3]: S_2 = (5 - 2, 4 + 3) = (3, 7). Promień w obu krokach się nie zmienia (izometrie), więc szukane równanie to (x - 3)^2 + (y - 7)^2 = 9.
    b) Po przesunięciu o wektor [p, 0] środek ma współrzędne S' = (5 + p, -4), a promień nadal wynosi 3. Okrąg jest styczny do osi Oy dokładnie wtedy, gdy odległość środka od tej osi równa się promieniowi: |5 + p| = 3, czyli (5 + p)^2 = 9.
    Stąd 5 + p = 3 lub 5 + p = -3, czyli p = -2 lub p = -8.
    Sprawdzenie: dla p = -2 środek to (3, -4) i odległość od Oy wynosi 3; dla p = -8 środek to (-3, -4) i odległość od Oy również wynosi 3.
  solution_steps:
  - Odczytaj z równania środek S = (5, -4) i promień r = 3.
  - 'Wykonaj pierwsze przekształcenie: S_Ox(5, -4) = (5, 4).'
  - 'Wykonaj drugie przekształcenie: przesunięcie o [-2, 3] daje (3, 7).'
  - 'Zapisz równanie obrazu: (x - 3)^2 + (y - 7)^2 = 9.'
  - 'Dla przesunięcia o [p, 0] zapisz środek obrazu: (5 + p, -4).'
  - 'Zapisz warunek styczności do osi Oy: |5 + p| = 3, czyli (5 + p)^2 = 9.'
  - 'Rozwiąż równanie: p = -2 lub p = -8.'
  answer:
    kind: MULTIPART
    parts:
    - name: rownanie obrazu w zlozeniu
      answer:
        kind: SYMBOLIC
        latex: \left(x-3\right)^2+\left(y-7\right)^2=9
    - name: wartosci p
      answer:
        kind: SET
        members:
        - '-2'
        - '-8'
  checks:
  - kind: solve_equation
    expr: \left(5+p\right)^2=9
    var: p
    part: wartosci p
  skills:
  - złożenie symetrii i przesunięcia
  - obraz okręgu
  - warunek styczności do osi
  - równanie z wartością bezwzględną
  verification:
    checkability: REFERENCE_CALL
    note: '2 parts matched · det: [wartosci p] SymPy solved it fresh: 2 members matched'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: obraz okręgu w przekształceniu, postać kanoniczna, warunek styczności
  statement: |-
    W kartezjańskim układzie współrzędnych (x,\ y) dany jest okrąg o o równaniu x^{2}+y^{2}+8\cdot x-6\cdot y-11=0.
    a) Wyznacz środek i promień okręgu o.
    b) Wyznacz równanie obrazu okręgu o w symetrii środkowej względem początku układu współrzędnych.
    c) Wyznacz wszystkie wartości p, dla których obraz okręgu o w przesunięciu o wektor \vec{u}=[p,\ 0] jest styczny do osi Oy.
  statement_latex: x^{2}+y^{2}+8\cdot x-6\cdot y-11=0
  solution: |-
    a) Grupujemy wyrazy i uzupełniamy do kwadratów:
    \left(x^{2}+8\cdot x\right)+\left(y^{2}-6\cdot y\right)=11,
    x^{2}+8\cdot x=\left(x+4\right)^{2}-16,\qquad y^{2}-6\cdot y=\left(y-3\right)^{2}-9.
    Stąd \left(x+4\right)^{2}-16+\left(y-3\right)^{2}-9=11, czyli \left(x+4\right)^{2}+\left(y-3\right)^{2}=36.
    Środek S=\left(-4,\ 3\right), promień r=\sqrt{36}=6.

    b) Symetria środkowa względem O zmienia znaki obu współrzędnych środka: S'=\left(4,\ -3\right). Promień się nie zmienia (izometria), więc obraz ma równanie \left(x-4\right)^{2}+\left(y+3\right)^{2}=36.

    c) Po przesunięciu o \vec{u}=[p,\ 0] środek to S''=\left(-4+p,\ 3\right), a promień nadal wynosi 6. Okrąg jest styczny do osi Oy wtedy i tylko wtedy, gdy odległość środka od tej osi równa się promieniowi, czyli \left|-4+p\right|=6.
    Stąd p-4=6 lub p-4=-6, czyli p=10 albo p=-2.
    Sprawdzenie: dla p=10 środek to \left(6,\ 3\right) (styczność z prawej strony), dla p=-2 środek to \left(-6,\ 3\right) (styczność z lewej strony).
  solution_steps:
  - 'Pogrupuj wyrazy z x i z y, liczbę przenieś na prawą stronę: \left(x^{2}+8\cdot x\right)+\left(y^{2}-6\cdot
    y\right)=11.'
  - 'Uzupełnij do kwadratów i zapisz postać kanoniczną: \left(x+4\right)^{2}+\left(y-3\right)^{2}=36.'
  - Odczytaj środek S=\left(-4,\ 3\right) i promień r=6.
  - 'Zastosuj S_{O} do środka: S''=\left(4,\ -3\right), promień bez zmian; zapisz \left(x-4\right)^{2}+\left(y+3\right)^{2}=36.'
  - Po przesunięciu o [p,\ 0] środek ma współrzędne \left(-4+p,\ 3\right).
  - 'Zapisz warunek styczności do osi Oy: \left|p-4\right|=6 i rozwiąż: p=10 lub p=-2.'
  answer:
    kind: MULTIPART
    parts:
    - name: srodek
      answer:
        kind: TUPLE
        items:
        - '-4'
        - '3'
    - name: promien
      answer:
        kind: NUMERIC
        value: 6.0
    - name: rownanie_obrazu_w_S_O
      answer:
        kind: SYMBOLIC
        latex: \left(x-4\right)^{2}+\left(y+3\right)^{2}=36
    - name: wartosci_p
      answer:
        kind: SET
        members:
        - '10'
        - '-2'
  checks:
  - kind: evaluate
    expr: \sqrt{11+16+9}
    part: promien
  - kind: solve_equation
    expr: \left|p-4\right|=6
    var: p
    part: wartosci_p
  skills:
  - sprowadzanie równania okręgu do postaci kanonicznej
  - odczytywanie środka i promienia okręgu
