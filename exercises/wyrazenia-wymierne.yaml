    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 2 members matched'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: skracanie ułamka algebraicznego
  statement: Dane jest wyrażenie \frac{3\cdot x+12}{x^{2}-16}. Wypisz wszystkie liczby rzeczywiste, które
    nie należą do dziedziny tego wyrażenia, a następnie skróć ułamek do najprostszej postaci.
  statement_latex: \frac{3\cdot x+12}{x^{2}-16}
  solution: |-
    1) Dziedzina: mianownik x^{2}-16 = \left(x-4\right)\cdot\left(x+4\right), więc x\neq 4 i x\neq -4. Liczby wykluczone: -4 oraz 4.
    2) Rozkład licznika: 3\cdot x+12 = 3\cdot\left(x+4\right).
    3) Skracamy wspólny czynnik \left(x+4\right), który na mocy założenia jest różny od zera:
    \frac{3\cdot\left(x+4\right)}{\left(x-4\right)\cdot\left(x+4\right)} = \frac{3}{x-4}.
    Odpowiedź: wyrażenie równa się \frac{3}{x-4} dla x\in\mathbb{R}\setminus\{-4,\ 4\}.
  solution_steps:
  - 'Rozłóż mianownik: x^{2}-16 = \left(x-4\right)\cdot\left(x+4\right).'
  - 'Zapisz warunki dziedziny: x\neq 4 i x\neq -4.'
  - 'Wyłącz wspólny czynnik w liczniku: 3\cdot x+12 = 3\cdot\left(x+4\right).'
  - Skróć czynnik \left(x+4\right) i zapisz wynik \frac{3}{x-4}.
  answer:
    kind: MULTIPART
    parts:
    - name: liczby wykluczone z dziedziny
      answer:
        kind: SET
        members:
        - '-4'
        - '4'
    - name: postać uproszczona
      answer:
        kind: SYMBOLIC
        latex: \frac{3}{x-4}
  checks:
