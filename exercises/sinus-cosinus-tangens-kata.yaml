  statement: W kartezjańskim układzie współrzędnych (x,\ y) dane są punkty O = (0,\ 0) oraz A = (5,\ 0).
    Punkt B leży w drugiej ćwiartce układu współrzędnych, a jego odległość od punktu O jest równa 4. Przez
    α oznaczamy miarę kąta AOB (jedno ramię tego kąta pokrywa się z dodatnią półosią Ox, a drugie przechodzi
    przez punkt B). a) Wyznacz wzór na pole P trójkąta OAB w zależności od α oraz podaj przedział, do
    którego należy miara α. b) Oblicz miarę kąta α oraz współrzędne punktu B, jeżeli pole trójkąta OAB
    jest równe 5\sqrt{2}. c) Rozstrzygnij, czy pole trójkąta OAB może być równe 11. Odpowiedź uzasadnij.
  statement_latex: P\left(\alpha\right)=\frac{1}{2}\cdot 5\cdot 4\sin\alpha=10\sin\alpha,\qquad \alpha\in\left(90^\circ,180^\circ\right)
  solution: |-
    a) Punkt B leży na drugim ramieniu kąta α, przy czym r=\left|OB\right|=4. Z definicji współrzędnościowej y_{B}=r\cdot\sin\alpha=4\sin\alpha oraz x_{B}=r\cdot\cos\alpha=4\cos\alpha.
    Bok OA leży na osi Ox i ma długość 5, więc wysokość trójkąta opuszczona na ten bok jest równa y_{B}. Zatem
    P=\frac{1}{2}\cdot 5\cdot 4\sin\alpha=10\sin\alpha.
    Punkt B leży w II ćwiartce, więc x_{B}<0 i y_{B}>0, czyli \cos\alpha<0 i \sin\alpha>0. Stąd \alpha\in\left(90^\circ,180^\circ\right).
    b) Z równania 10\sin\alpha=5\sqrt{2} otrzymujemy \sin\alpha=\frac{\sqrt{2}}{2}. W przedziale \left(0^\circ,180^\circ\right) rozwiązaniami są 45^\circ oraz 180^\circ-45^\circ=135^\circ, ale dziedziną jest \left(90^\circ,180^\circ\right), więc \alpha=135^\circ.
    Wtedy \cos\alpha=\cos 135^\circ=-\frac{\sqrt{2}}{2}, a zatem
    x_{B}=4\cdot\left(-\frac{\sqrt{2}}{2}\right)=-2\sqrt{2},\qquad y_{B}=4\cdot\frac{\sqrt{2}}{2}=2\sqrt{2}.
    Kontrola: \left|OB\right|=\sqrt{8+8}=4 i punkt leży w II ćwiartce. ✔
    c) Dla każdego kąta zachodzi \sin\alpha\le 1, więc P=10\sin\alpha\le 10<11. (Co więcej, dla \alpha\in\left(90^\circ,180^\circ\right) jest \sin\alpha<1, więc nawet P<10.) Pole trójkąta OAB nie może być równe 11.
  solution_steps:
  - 'Zapisz współrzędne punktu B przez kąt: x_{B}=4\cos\alpha, y_{B}=4\sin\alpha.'
  - 'Zbuduj wzór na pole: P=\frac{1}{2}\cdot 5\cdot y_{B}=10\sin\alpha.'
  - Z warunku 'B w II ćwiartce' wyznacz dziedzinę \alpha\in\left(90^\circ,180^\circ\right).
  - Rozwiąż 10\sin\alpha=5\sqrt{2}, czyli \sin\alpha=\frac{\sqrt{2}}{2}; odrzuć 45^\circ (poza dziedziną)
    i przyjmij \alpha=135^\circ.
  - Oblicz x_{B}=4\cos 135^\circ=-2\sqrt{2} oraz y_{B}=4\sin 135^\circ=2\sqrt{2}.
  - 'Porównaj 11 z zakresem wartości: P=10\sin\alpha\le 10, więc pole równe 11 jest niemożliwe.'
