- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie długości odcinków środkowej
  statement: W trójkącie ABC odcinek AD jest środkową poprowadzoną z wierzchołka A (punkt D jest środkiem
    boku BC), a jej długość wynosi 21 cm. Punkt S jest środkiem ciężkości tego trójkąta. Oblicz długości
    odcinków AS oraz SD.
  statement_latex: '|AS|=\frac{2}{3}\cdot 21,\qquad |SD|=\frac{1}{3}\cdot 21'
  solution: |-
    Środek ciężkości trójkąta dzieli każdą środkową w stosunku 2:1, licząc od wierzchołka. Zatem odcinek od wierzchołka A do punktu S stanowi \frac{2}{3} długości środkowej, a odcinek od S do środka boku D stanowi \frac{1}{3} tej długości.
    |AS| = \frac{2}{3}\cdot 21 = 14 (cm),
    |SD| = \frac{1}{3}\cdot 21 = 7 (cm).
    Sprawdzenie: 14 + 7 = 21 ✓ oraz |AS| : |SD| = 14 : 7 = 2 : 1 ✓.
  solution_steps:
  - 'Zapisz własność: S dzieli środkową w stosunku 2:1 od wierzchołka.'
  - Oblicz |AS| = \frac{2}{3}\cdot 21 = 14 cm.
  - Oblicz |SD| = \frac{1}{3}\cdot 21 = 7 cm.
  - 'Sprawdź: 14 + 7 = 21 cm.'
  answer:
    kind: MULTIPART
    parts:
    - name: '|AS|'
      answer:
        kind: NUMERIC
        value: 14.0
    - name: '|SD|'
      answer:
        kind: NUMERIC
        value: 7.0
  checks:
  - kind: evaluate
    expr: \frac{2}{3}\cdot 21
    part: '|AS|'
  - kind: evaluate
    expr: \frac{1}{3}\cdot 21
    part: '|SD|'
  skills:
  - podział środkowej w stosunku 2:1
  - rozpoznawanie środka ciężkości
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [|AS|] SymPy solved it fresh: 14.0 vs 14.0 (tol 1e-09) ; [|SD|]
      SymPy solved it fresh: 7.0 vs 7.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: promienie okręgów w trójkącie prostokątnym
  statement: Dany jest trójkąt prostokątny, którego przyprostokątne mają długości 5 i 12. Oblicz promień
    R okręgu opisanego na tym trójkącie oraz promień r okręgu wpisanego w ten trójkąt.
  statement_latex: R=\frac{c}{2},\qquad r=\frac{a+b-c}{2},\qquad c=\sqrt{5^{2}+12^{2}}
  solution: |-
    Z twierdzenia Pitagorasa przeciwprostokątna ma długość c = \sqrt{5^{2}+12^{2}} = \sqrt{169} = 13.
    W trójkącie prostokątnym kąt prosty jest kątem wpisanym opartym na przeciwprostokątnej, więc przeciwprostokątna jest średnicą okręgu opisanego, a środek O tego okręgu leży w jej środku:
    R = \frac{13}{2} = 6{,}5.
    Promień okręgu wpisanego liczymy ze wzoru szczególnego:
    r = \frac{5+12-13}{2} = \frac{4}{2} = 2.
    Sprawdzenie ogólnym wzorem: P = \frac{1}{2}\cdot 5\cdot 12 = 30, p = \frac{5+12+13}{2} = 15, r = \frac{30}{15} = 2 ✓. Zauważ, że r < R ✓.
  solution_steps:
  - 'Oblicz przeciwprostokątną: c = \sqrt{5^{2}+12^{2}} = 13.'
  - 'Skorzystaj z faktu, że przeciwprostokątna jest średnicą okręgu opisanego: R = \frac{13}{2} = 6{,}5.'
  - Zastosuj wzór r = \frac{a+b-c}{2} = \frac{5+12-13}{2} = 2.
  - Sprawdź wynik wzorem r = \frac{P}{p} = \frac{30}{15} = 2.
  answer:
    kind: MULTIPART
    parts:
    - name: R
      answer:
        kind: NUMERIC
        value: 6.5
    - name: r
      answer:
        kind: NUMERIC
        value: 2.0
  checks:
  - kind: evaluate
    expr: \frac{\sqrt{5^{2}+12^{2}}}{2}
    part: R
  - kind: evaluate
    expr: \frac{5+12-\sqrt{5^{2}+12^{2}}}{2}
    part: r
  skills:
  - wzór R = c/2 w trójkącie prostokątnym
  - wzór r = (a+b-c)/2
  - twierdzenie Pitagorasa
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [R] SymPy solved it fresh: 6.5 vs 6.5 (tol 1e-09) ; [r] SymPy
      solved it fresh: 2.0 vs 2.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: współrzędne środka ciężkości
  statement: W kartezjańskim układzie współrzędnych (x, y) dane są punkty A = (-2, 1), B = (4, -3) oraz
    C = (7, 8), które są wierzchołkami trójkąta ABC. Oblicz odciętą i rzędną środka ciężkości S tego trójkąta.
  statement_latex: S=\left(\frac{-2+4+7}{3},\ \frac{1+\left(-3\right)+8}{3}\right)
  solution: |-
    Środek ciężkości trójkąta o wierzchołkach A, B, C ma współrzędne będące średnimi arytmetycznymi odpowiednich współrzędnych wierzchołków:
    x_S = \frac{-2+4+7}{3} = \frac{9}{3} = 3,
    y_S = \frac{1+\left(-3\right)+8}{3} = \frac{6}{3} = 2.
    Zatem S = (3, 2).
  solution_steps:
  - Zapisz wzór S = \left(\frac{x_A+x_B+x_C}{3},\ \frac{y_A+y_B+y_C}{3}\right).
  - 'Oblicz odciętą: \frac{-2+4+7}{3} = 3.'
  - 'Oblicz rzędną: \frac{1+\left(-3\right)+8}{3} = 2.'
  - 'Zapisz odpowiedź: S = (3, 2).'
  answer:
    kind: MULTIPART
    parts:
    - name: odcieta punktu S
      answer:
        kind: NUMERIC
        value: 3.0
    - name: rzedna punktu S
      answer:
        kind: NUMERIC
        value: 2.0
  checks:
  - kind: evaluate
    expr: \frac{-2+4+7}{3}
    part: odcieta punktu S
  - kind: evaluate
    expr: \frac{1+\left(-3\right)+8}{3}
    part: rzedna punktu S
  skills:
  - wzór na współrzędne środka ciężkości
  - rachunek w układzie współrzędnych
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [odcieta punktu S] SymPy solved it fresh: 3.0 vs 3.0 (tol 1e-09)
      ; [rzedna punktu S] SymPy solved it fresh: 2.0 vs 2.0 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 3
  exercise_type: promienie r i R w trójkącie równoramiennym
  statement: 'Trójkąt ABC jest równoramienny: |AC| = |BC| = 10 oraz podstawa |AB| = 12. Oblicz promień
    r okręgu wpisanego w ten trójkąt, promień R okręgu opisanego na tym trójkącie oraz odległość środka
    O okręgu opisanego od podstawy AB.'
  statement_latex: r=\frac{P}{p},\qquad R=\frac{10\cdot 10\cdot 12}{4\cdot P},\qquad P=\frac{1}{2}\cdot
    12\cdot h
  solution: |-
    Wysokość CD poprowadzona z wierzchołka C na podstawę AB dzieli ją na połowy (trójkąt jest równoramienny), więc |AD| = 6 i
    h = \sqrt{10^{2}-6^{2}} = \sqrt{64} = 8.
    Pole: P = \frac{1}{2}\cdot 12\cdot 8 = 48. Połowa obwodu: p = \frac{10+10+12}{2} = 16.
    Promień okręgu wpisanego: r = \frac{P}{p} = \frac{48}{16} = 3.
    Promień okręgu opisanego: R = \frac{10\cdot 10\cdot 12}{4\cdot 48} = \frac{1200}{192} = \frac{25}{4} = 6{,}25.
    Wszystkie punkty szczególne leżą na osi symetrii, czyli na prostej CD. Środek O jest oddalony od wierzchołka C o R = 6{,}25, a wierzchołek C leży 8 jednostek nad podstawą, więc odległość O od podstawy wynosi 8 - \frac{25}{4} = \frac{7}{4} = 1{,}75.
    Sprawdzenie: odległość O od wierzchołka A wynosi \sqrt{\left(\frac{7}{4}\right)^{2}+6^{2}} = \sqrt{\frac{625}{16}} = \frac{25}{4} = R ✓. Ponadto r < R oraz 2r \le R ✓, a O leży wewnątrz trójkąta (trójkąt jest ostrokątny).
  solution_steps:
  - 'Oblicz wysokość opuszczoną na podstawę: h = \sqrt{10^{2}-6^{2}} = 8.'
  - Oblicz pole P = \frac{1}{2}\cdot 12\cdot 8 = 48 i połowę obwodu p = 16.
  - Wyznacz r = \frac{48}{16} = 3.
  - Wyznacz R = \frac{10\cdot 10\cdot 12}{4\cdot 48} = \frac{25}{4}.
  - 'Odległość O od podstawy: 8 - \frac{25}{4} = \frac{7}{4}.'
  - Sprawdź, że odległość O od wierzchołka podstawy też wynosi \frac{25}{4}.
  answer:
    kind: MULTIPART
    parts:
    - name: r
      answer:
        kind: NUMERIC
        value: 3.0
    - name: R
      answer:
        kind: NUMERIC
        value: 6.25
    - name: odleglosc O od AB
      answer:
        kind: NUMERIC
        value: 1.75
  checks:
  - kind: evaluate
    expr: \frac{\frac{1}{2}\cdot 12\cdot 8}{\frac{10+10+12}{2}}
    part: r
  - kind: evaluate
    expr: \frac{10\cdot 10\cdot 12}{4\cdot \frac{1}{2}\cdot 12\cdot 8}
    part: R
  - kind: evaluate
    expr: 8-\frac{10\cdot 10\cdot 12}{4\cdot \frac{1}{2}\cdot 12\cdot 8}
    part: odleglosc O od AB
  skills:
  - wzór r = P/p
  - wzór R = abc/(4P)
  - oś symetrii trójkąta równoramiennego
  - twierdzenie Pitagorasa
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [r] SymPy solved it fresh: 3.0 vs 3.0 (tol 1e-09) ; [R] SymPy
      solved it fresh: 6.25 vs 6.25 (tol 1e-09) ; [odleglosc O od AB] SymPy solved it fresh: 1.75 vs 1.75
      (tol 1e-09)'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: kąty przy punktach szczególnych
  statement: 'W trójkącie ABC kąt przy wierzchołku A ma miarę 64°, a kąt przy wierzchołku B ma miarę 76°.
    Punkt I jest środkiem okręgu wpisanego w ten trójkąt, a punkt O jest środkiem okręgu opisanego na
    tym trójkącie. Oblicz miary kątów: |∢BIC|, |∢AOB| oraz |∢OAB|.'
  statement_latex: '|\sphericalangle BIC|=90^\circ+\frac{64^\circ}{2},\qquad |\sphericalangle AOB|=2\cdot\left(180^\circ-64^\circ-76^\circ\right)'
  solution: |-
    Najpierw trzeci kąt trójkąta: \gamma = 180^\circ - 64^\circ - 76^\circ = 40^\circ.
    Kąt BIC: odcinki BI i CI leżą na dwusiecznych, więc w trójkącie BIC kąty przy B i C mają miary \frac{76^\circ}{2} = 38^\circ i \frac{40^\circ}{2} = 20^\circ, zatem
    |\sphericalangle BIC| = 180^\circ - 38^\circ - 20^\circ = 122^\circ.
    Sprawdzenie wzorem: 90^\circ + \frac{64^\circ}{2} = 122^\circ ✓.
    Kąt AOB jest kątem środkowym opartym na łuku AB, na którym oparty jest kąt wpisany ACB o mierze 40^\circ, więc
    |\sphericalangle AOB| = 2\cdot 40^\circ = 80^\circ.
    Trójkąt AOB jest równoramienny, bo |OA| = |OB| = R, więc kąty przy jego podstawie są równe:
    |\sphericalangle OAB| = \frac{180^\circ - 80^\circ}{2} = 50^\circ.
    Sprawdzenie: |\sphericalangle OAB| = 90^\circ - \gamma = 90^\circ - 40^\circ = 50^\circ ✓.
  solution_steps:
  - 'Oblicz trzeci kąt: \gamma = 180^\circ - 64^\circ - 76^\circ = 40^\circ.'
  - 'W trójkącie BIC kąty przy B i C to połowy kątów trójkąta: 38^\circ i 20^\circ, więc |∢BIC| = 122^\circ.'
  - 'Zastosuj zależność kąt środkowy = 2 · kąt wpisany: |∢AOB| = 2\cdot 40^\circ = 80^\circ.'
  - 'Z równoramienności trójkąta AOB: |∢OAB| = \frac{180^\circ-80^\circ}{2} = 50^\circ.'
  answer:
    kind: MULTIPART
    parts:
    - name: kat BIC (w stopniach)
      answer:
        kind: NUMERIC
        value: 122.0
    - name: kat AOB (w stopniach)
      answer:
        kind: NUMERIC
        value: 80.0
    - name: kat OAB (w stopniach)
      answer:
        kind: NUMERIC
        value: 50.0
  checks:
  - kind: evaluate
    expr: 90+\frac{64}{2}
    part: kat BIC (w stopniach)
  - kind: evaluate
    expr: 2\cdot\left(180-64-76\right)
    part: kat AOB (w stopniach)
  - kind: evaluate
    expr: \frac{180-2\cdot\left(180-64-76\right)}{2}
    part: kat OAB (w stopniach)
  skills:
  - kąt BIC = 90 + alfa/2
  - kąt środkowy BOC = 2 alfa
  - trójkąt równoramienny o ramionach R
  - suma kątów w trójkącie
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [kat BIC (w stopniach)] SymPy solved it fresh: 122.0 vs 122.0
      (tol 1e-09) ; [kat AOB (w stopniach)] SymPy solved it fresh: 80.0 vs 80.0 (tol 1e-09) ; [kat OAB
      (w stopniach)] SymPy solved it fresh: 50.0 vs 50.0 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: punkty szczególne w układzie współrzędnych
  statement: W kartezjańskim układzie współrzędnych (x, y) punkty A = (-1, -2), B = (7, -2) oraz C = (3,
    6) są wierzchołkami trójkąta ABC. a) Wyznacz współrzędne środka ciężkości S tego trójkąta. b) Wyznacz
    współrzędne środka O okręgu opisanego na tym trójkącie. c) Oblicz promień R tego okręgu. d) Uzasadnij,
    że trójkąt ABC jest ostrokątny.
  statement_latex: S=\left(\frac{-1+7+3}{3},\ \frac{-2+\left(-2\right)+6}{3}\right),\qquad R=\sqrt{\left(3-\left(-1\right)\right)^{2}+\left(1-\left(-2\right)\right)^{2}}
  solution: |-
    a) S = \left(\frac{-1+7+3}{3},\ \frac{-2+\left(-2\right)+6}{3}\right) = \left(3,\ \frac{2}{3}\right).
    b) Bok AB leży na prostej y = -2, jego środek to (3, -2), więc symetralna boku AB to prosta x = 3. (Ten sam wniosek daje spostrzeżenie, że |AC| = |BC| = \sqrt{16+64} = 4\sqrt5, więc trójkąt jest równoramienny i prosta x = 3 jest jego osią symetrii.)
    Środek O leży na tej prostej: O = (3, y). Z warunku |OA| = |OC|:
    \left(3-\left(-1\right)\right)^{2}+\left(y+2\right)^{2} = \left(y-6\right)^{2},
    16 + y^{2}+4y+4 = y^{2}-12y+36,
    16y = 16, czyli y = 1. Zatem O = (3, 1).
    c) R = |OA| = \sqrt{\left(3-\left(-1\right)\right)^{2}+\left(1-\left(-2\right)\right)^{2}} = \sqrt{16+9} = 5.
    Sprawdzenie: |OB| = \sqrt{4^{2}+3^{2}} = 5, |OC| = \sqrt{0+5^{2}} = 5 ✓.
    d) Punkt O = (3, 1) leży wewnątrz trójkąta: jego odcięta 3 mieści się między -1 a 7, a rzędna 1 jest większa od -2 (poziom podstawy) i mniejsza od rzędnych boków AC i BC nad punktem x = 3 (tam trójkąt sięga do y = 6). Skoro środek okręgu opisanego leży wewnątrz trójkąta, to trójkąt jest ostrokątny. Zauważmy też, że S = \left(3, \frac{2}{3}\right) \ne O, więc trójkąt nie jest równoboczny.
  solution_steps:
  - Oblicz S = \left(\frac{-1+7+3}{3},\ \frac{-2-2+6}{3}\right) = \left(3, \frac{2}{3}\right).
  - Zauważ, że AB leży na prostej y = -2, jego środek to (3,-2), więc symetralna AB ma równanie x = 3.
  - Z warunku |OA| = |OC| dla O = (3, y) rozwiąż równanie 16+\left(y+2\right)^{2} = \left(y-6\right)^{2},
    skąd y = 1.
  - Zapisz O = (3, 1).
  - Oblicz R = \sqrt{4^{2}+3^{2}} = 5 i sprawdź, że |OB| = |OC| = 5.
  - Uzasadnij, że O leży wewnątrz trójkąta, więc trójkąt jest ostrokątny.
  answer:
    kind: MULTIPART
    parts:
    - name: S
      answer:
        kind: TUPLE
        items:
        - '3'
        - \frac{2}{3}
    - name: O
      answer:
        kind: TUPLE
        items:
        - '3'
        - '1'
    - name: R
      answer:
        kind: NUMERIC
        value: 5.0
    - name: uzasadnienie ostrokatnosci
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy uzasadnić, że środek O = (3,1) okręgu opisanego leży wewnątrz trójkąta ABC (np.
          porównując jego położenie z bokami trójkąta), a stąd wywnioskować, że trójkąt jest ostrokątny.
  checks:
  - kind: evaluate
    expr: \sqrt{\left(3-\left(-1\right)\right)^{2}+\left(1-\left(-2\right)\right)^{2}}
    part: R
  skills:
  - współrzędne środka ciężkości
  - wyznaczanie środka okręgu opisanego z symetralnych
  - obliczanie długości odcinka
  - rozpoznawanie rodzaju trójkąta
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie ostrokatnosci · 1/3 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: punkty szczególne w układzie współrzędnych (trójkąt prostokątny)
  statement: W kartezjańskim układzie współrzędnych (x, y) dane są punkty A = (1, 2), B = (9, 2) oraz
    C = (1, 8). Punkty te są wierzchołkami trójkąta prostokątnego o kącie prostym przy wierzchołku A (bok
    AB jest równoległy do osi OX, a bok AC do osi OY). Wyznacz współrzędne środka ciężkości S trójkąta
    ABC, współrzędne środka O okręgu opisanego na tym trójkącie oraz współrzędne ortocentrum H, a następnie
    oblicz promień r okręgu wpisanego i promień R okręgu opisanego.
  statement_latex: A=\left(1,\ 2\right),\quad B=\left(9,\ 2\right),\quad C=\left(1,\ 8\right),\quad S=\left(\frac{x_A+x_B+x_C}{3},\
    \frac{y_A+y_B+y_C}{3}\right)
  solution: |-
    Długości przyprostokątnych: |AB| = 9 − 1 = 8 oraz |AC| = 8 − 2 = 6. Przeciwprostokątna: |BC| = \sqrt{8^2+6^2} = \sqrt{100} = 10.

    Środek ciężkości: S = \left(\frac{1+9+1}{3},\ \frac{2+2+8}{3}\right) = \left(\frac{11}{3},\ 4\right).

    Środek okręgu opisanego: kąt prosty jest kątem wpisanym opartym na boku BC, więc BC jest średnicą okręgu opisanego, a O jest środkiem przeciwprostokątnej: O = \left(\frac{9+1}{2},\ \frac{2+8}{2}\right) = (5,\ 5). Stąd R = \frac{|BC|}{2} = 5.

    Ortocentrum: w trójkącie prostokątnym dwie wysokości to przyprostokątne AB i AC (każda jest prostopadła do drugiej), więc przecinają się w wierzchołku kąta prostego: H = A = (1, 2).

    Promień okręgu wpisanego: r = \frac{a+b-c}{2} = \frac{8+6-10}{2} = 2 (kontrola: P = \frac{1}{2}\cdot 8\cdot 6 = 24, p = \frac{8+6+10}{2} = 12, r = \frac{24}{12} = 2 ✓).

    Sprawdzenie sensowności: r = 2 < R = 5 ✓.
  solution_steps:
  - 'Oblicz długości boków: |AB| = 8, |AC| = 6, |BC| = \sqrt{8^2+6^2} = 10.'
  - 'Wyznacz S ze wzoru na środek ciężkości: S = \left(\frac{11}{3},\ 4\right).'
  - Zauważ, że przeciwprostokątna BC jest średnicą okręgu opisanego, więc O = (5, 5) oraz R = \frac{10}{2}
    = 5.
  - Zauważ, że przyprostokątne są wysokościami, więc H = A = (1, 2).
  - Oblicz r = \frac{8+6-10}{2} = 2 i sprawdź warunek r < R.
  answer:
    kind: MULTIPART
    parts:
    - name: S_x
      answer:
        kind: NUMERIC
        value: 3.6666666666666665
        tol: 1.0e-06
        latex: \frac{11}{3}
    - name: S_y
      answer:
        kind: NUMERIC
        value: 4.0
        latex: '4'
    - name: O_x
      answer:
        kind: NUMERIC
        value: 5.0
        latex: '5'
    - name: O_y
      answer:
        kind: NUMERIC
        value: 5.0
        latex: '5'
