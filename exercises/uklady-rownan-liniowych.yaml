  statement_latex: \begin{cases} 2\cdot x - y = 3 \\ -6\cdot x + 3\cdot y = -9 \end{cases}
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: po pomnożeniu pierwszego równania przez 3 mamy 6x - 3y = 9; dodając stronami do drugiego równania dostajemy 0 = 0, a uczeń odczytuje z tego "x = 0 i y = 0". Błędna odpowiedź: (0, 0).
    DLACZEGO TO ŹLE: równość 0 = 0 nie mówi nic o wartościach x i y — to zdanie zawsze prawdziwe. Sprawdźmy zresztą parę (0, 0) w pierwszym równaniu: 2·0 - 0 = 0, a miało być 3. Zatem (0, 0) NIE jest rozwiązaniem.
    POPRAWNE ROZUMOWANIE: drugie równanie powstaje z pierwszego przez pomnożenie przez (-3): (-3)·(2x - y) = -6x + 3y oraz (-3)·3 = -9. Oba równania opisują tę samą prostą, więc każda para spełniająca pierwsze równanie spełnia i drugie. Tożsamość 0 = 0 oznacza właśnie, że układ jest NIEOZNACZONY — ma nieskończenie wiele rozwiązań.
