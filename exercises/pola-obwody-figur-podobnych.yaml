- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: obliczenie pola figury podobnej
  statement: Czworokąt F' jest podobny do czworokąta F w skali k = \frac{5}{2}. Pole czworokąta F jest
    równe 8 cm². Oblicz pole czworokąta F'. Zapisz obliczenia.
  statement_latex: P(F')=k^{2}\cdot P(F)=\left(\frac{5}{2}\right)^{2}\cdot 8
  solution: |-
    Pola figur podobnych są w stosunku k², więc P(F') = k²·P(F).
    k² = \left(\frac{5}{2}\right)^{2} = \frac{25}{4}.
    Zatem P(F') = \frac{25}{4}\cdot 8 = 50 cm².
    Sprawdzenie: k = 2,5 > 1, więc pole musi wzrosnąć — 50 > 8. Zgadza się.
    Odpowiedź: 50 cm².
  solution_steps:
  - 'Zapisz zależność pól figur podobnych: P(F'') = k²·P(F).'
  - Oblicz k² = (5/2)² = 25/4.
  - 'Podstaw: P(F'') = (25/4)·8 = 50.'
  - 'Podaj wynik z jednostką kwadratową: 50 cm².'
  answer:
    kind: NUMERIC
    value: 50.0
    latex: 50\ \text{cm}^{2}
  checks:
  - kind: evaluate
    expr: \left(\frac{5}{2}\right)^{2}\cdot 8
  skills:
  - stosowanie zależności pól figur podobnych
  - podnoszenie skali do kwadratu
