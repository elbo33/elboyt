- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: średnia ważona i średnia połączonych grup
  statement: 'W pewnej szkole ocena semestralna jest średnią ważoną ocen cząstkowych: sprawdziany mają
    wagę 4, odpowiedzi ustne wagę 2, a aktywność wagę 1. Marek napisał dwa sprawdziany, z których otrzymał
    oceny 3 i 5, odpowiadał ustnie trzy razy i otrzymał oceny 4, 2, 5, a za aktywność dostał ocenę 6.
    (a) Oblicz średnią ważoną ocen Marka. (b) W grupie A jest 12 uczniów, a średnia ich ocen semestralnych
    wynosi 4,5; w grupie B jest 18 uczniów o średniej 3,5. Oblicz średnią ocen wszystkich 30 uczniów.'
  statement_latex: \bar{x}_w=\frac{3\cdot 4+5\cdot 4+4\cdot 2+2\cdot 2+5\cdot 2+6\cdot 1}{4+4+2+2+2+1},\qquad
    \bar{x}=\frac{12\cdot 4{,}5+18\cdot 3{,}5}{12+18}
  solution: |-
    (a) Wypisujemy pary (ocena; waga): (3;4), (5;4), (4;2), (2;2), (5;2), (6;1).
    Suma iloczynów: 3\cdot 4+5\cdot 4+4\cdot 2+2\cdot 2+5\cdot 2+6\cdot 1 = 12+20+8+4+10+6 = 60.
    Suma wag: 4+4+2+2+2+1 = 15 (w mianowniku stoi suma wag, a nie liczba ocen).
    \bar{x}_w=\frac{60}{15}=4.
    Sprawdzenie: 2 \le 4 \le 6 ✓.

    (b) Łączna suma ocen obu grup: 12\cdot 4{,}5 + 18\cdot 3{,}5 = 54 + 63 = 117. Łączna liczba uczniów: 12 + 18 = 30.
    \bar{x}=\frac{117}{30}=3{,}9.
    Uwaga: zwykła średnia obu średnich dałaby \frac{4{,}5+3{,}5}{2}=4 – to wynik błędny, bo grupy mają różne liczebności i wynik musi być bliżej średniej grupy liczniejszej.

    Odpowiedź: (a) 4; (b) 3,9.
  solution_steps:
  - Wypisz pary (ocena; waga) dla wszystkich ocen Marka.
  - 'Oblicz sumę iloczynów ocena·waga: 12 + 20 + 8 + 4 + 10 + 6 = 60.'
  - 'Oblicz sumę wag: 4 + 4 + 2 + 2 + 2 + 1 = 15.'
  - 'Podziel: \bar{x}_w=\frac{60}{15}=4.'
  - 'W punkcie (b) oblicz sumy ocen w grupach: 12\cdot 4{,}5=54 oraz 18\cdot 3{,}5=63.'
  - 'Podziel łączną sumę przez łączną liczebność: \frac{117}{30}=3{,}9.'
  answer:
    kind: MULTIPART
    parts:
    - name: srednia_wazona
      answer:
        kind: NUMERIC
        value: 4.0
        latex: '4'
    - name: srednia_laczna
      answer:
        kind: NUMERIC
        value: 3.9
        latex: 3{,}9
  checks:
  - kind: evaluate
    expr: \frac{3\cdot 4+5\cdot 4+4\cdot 2+2\cdot 2+5\cdot 2+6\cdot 1}{4+4+2+2+2+1}
    part: srednia_wazona
  - kind: evaluate
    expr: \frac{12\cdot 4.5+18\cdot 3.5}{12+18}
    part: srednia_laczna
  skills:
  - średnia ważona
  - suma wag w mianowniku
  - średnia dwóch połączonych zestawów
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [srednia_wazona] SymPy solved it fresh: 4.0 vs 4.0 (tol 1e-09)
      ; [srednia_laczna] SymPy solved it fresh: 3.9 vs 3.9 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: parametr w zestawie danych – analiza przypadków
  statement: 'Dany jest zestaw czterech liczb: 3, 7, 9, x. Wyznacz wszystkie wartości x, dla których mediana
    tego zestawu jest równa jego średniej arytmetycznej.'
  statement_latex: \frac{3+7+9+x}{4}=\mathrm{Me}
  solution: |-
    Średnia zestawu nie zależy od położenia x: \bar{x}=\frac{3+7+9+x}{4}=\frac{19+x}{4}.
    Mediana zależy od tego, gdzie w szeregu uporządkowanym znajdzie się x; n = 4 jest parzyste, więc mediana jest średnią dwóch środkowych elementów. Rozważamy przypadki wyznaczone przez znane dane 3, 7, 9.

    Przypadek 1: x \le 3. Szereg: x, 3, 7, 9, więc \mathrm{Me}=\frac{3+7}{2}=5.
    Równanie: \frac{19+x}{4}=5, czyli 19+x=20, stąd x=1. Warunek x \le 3 jest spełniony, więc x = 1 jest rozwiązaniem.

    Przypadek 2: 3 \le x \le 7. Szereg: 3, x, 7, 9, więc \mathrm{Me}=\frac{x+7}{2}.
    Równanie: \frac{19+x}{4}=\frac{x+7}{2}, czyli 19+x=2x+14, stąd x=5. Warunek 3 \le 5 \le 7 jest spełniony, więc x = 5 jest rozwiązaniem.

    Przypadek 3: 7 \le x \le 9. Szereg: 3, 7, x, 9, więc \mathrm{Me}=\frac{7+x}{2} – to samo równanie co wyżej, x = 5, ale 5 nie należy do przedziału \langle 7; 9 \rangle, więc w tym przypadku nie ma nowych rozwiązań.

    Przypadek 4: x \ge 9. Szereg: 3, 7, 9, x, więc \mathrm{Me}=\frac{7+9}{2}=8.
    Równanie: \frac{19+x}{4}=8, czyli 19+x=32, stąd x=13. Warunek x \ge 9 jest spełniony, więc x = 13 jest rozwiązaniem.

    Sprawdzenie dla x = 13: \bar{x}=\frac{32}{4}=8, szereg 3, 7, 9, 13, \mathrm{Me}=\frac{7+9}{2}=8 ✓.
    Odpowiedź: x \in \{1; 5; 13\}.
  solution_steps:
  - 'Zapisz średnią zestawu: \bar{x}=\frac{19+x}{4}.'
  - 'Uporządkuj znane dane: 3, 7, 9 i rozważ przypadki położenia x.'
  - 'Przypadek x \le 3: \mathrm{Me}=5, z równania \frac{19+x}{4}=5 otrzymujesz x = 1 (zgodne z założeniem).'
  - 'Przypadek 3 \le x \le 7 (oraz 7 \le x \le 9): \mathrm{Me}=\frac{x+7}{2}, z równania otrzymujesz x
    = 5 (zgodne tylko w pierwszym z tych przedziałów).'
  - 'Przypadek x \ge 9: \mathrm{Me}=8, z równania \frac{19+x}{4}=8 otrzymujesz x = 13 (zgodne z założeniem).'
  - 'Zbierz rozwiązania: x \in \{1; 5; 13\}.'
  answer:
    kind: SET
    latex: \{1;5;13\}
    members:
    - '1'
    - '5'
    - '13'
  skills:
  - mediana z parametrem
  - analiza przypadków
  - równania liniowe
  - porównanie średniej i mediany
  verification:
    checkability: REFERENCE_CALL
    note: 3 members matched
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: obliczenia z tabeli liczebności z niewiadomymi liczebnościami
  statement: W klasie liczącej 25 uczniów przeprowadzono sprawdzian oceniany w skali od 1 do 6. Ocenę
    2 otrzymało 4 uczniów, ocenę 3 otrzymało k uczniów, ocenę 4 otrzymało 7 uczniów, ocenę 5 otrzymało
    m uczniów, a ocenę 6 otrzymało 2 uczniów. Nikt z tej klasy nie otrzymał oceny 1. Średnia arytmetyczna
    wszystkich ocen z tego sprawdzianu w tej klasie jest równa 3,92. Wyznacz liczby k oraz m, a następnie
    oblicz medianę i podaj dominantę ocen uzyskanych z tego sprawdzianu.
  statement_latex: 4 + k + 7 + m + 2 = 25, \qquad \frac{2 \cdot 4 + 3 \cdot k + 4 \cdot 7 + 5 \cdot m
    + 6 \cdot 2}{25} = 3{,}92
  solution: |-
    Z liczebności klasy: 4 + k + 7 + m + 2 = 25, czyli k + m = 12, a więc m = 12 − k.

    Z warunku na średnią (mianownikiem jest łączna liczba uczniów, czyli 25):
    (2·4 + 3·k + 4·7 + 5·m + 6·2) / 25 = 3,92, zatem suma ocen wynosi 25 · 3,92 = 98.
    Stąd 8 + 3k + 28 + 5m + 12 = 98, czyli 3k + 5m = 50.
    Podstawiamy m = 12 − k: 3k + 5(12 − k) = 50, czyli 60 − 2k = 50, więc k = 5 oraz m = 12 − 5 = 7.

    Rozkład ocen: 2 – 4 uczniów, 3 – 5 uczniów, 4 – 7 uczniów, 5 – 7 uczniów, 6 – 2 uczniów (razem 25 ✓).
    Sprawdzenie średniej: (8 + 15 + 28 + 35 + 12)/25 = 98/25 = 3,92 ✓.

    Mediana: n = 25 jest nieparzyste, więc mediana to element o numerze (25+1)/2 = 13 w szeregu uporządkowanym. Liczebności skumulowane: do oceny 2 – 4, do oceny 3 – 9, do oceny 4 – 16. Pozycje od 10. do 16. zajmuje ocena 4, więc element 13. to 4, czyli Me = 4.

    Dominanta: największa liczebność wynosi 7 i odpowiada dwóm wartościom: ocenie 4 oraz ocenie 5. Zestaw ma zatem dwie dominanty: 4 i 5.
  solution_steps:
  - 'Zapisz warunek liczebności: 4 + k + 7 + m + 2 = 25, stąd k + m = 12.'
  - 'Zapisz sumę ocen z warunku na średnią: suma = 25 · 3,92 = 98.'
  - Ułóż równanie 8 + 3k + 28 + 5m + 12 = 98, czyli 3k + 5m = 50.
  - 'Podstaw m = 12 − k i rozwiąż: 60 − 2k = 50, więc k = 5, m = 7.'
  - 'Wyznacz medianę: pozycja (25+1)/2 = 13; liczebności skumulowane 4, 9, 16 – pozycja 13. to ocena 4,
    więc Me = 4.'
  - 'Wyznacz dominantę: największa liczebność 7 występuje dla ocen 4 i 5, więc są dwie dominanty: 4 i
    5.'
  answer:
    kind: MULTIPART
    parts:
    - name: k
      answer:
        kind: NUMERIC
        value: 5.0
    - name: m
      answer:
        kind: NUMERIC
        value: 7.0
    - name: mediana
      answer:
        kind: NUMERIC
        value: 4.0
    - name: dominanta
      answer:
        kind: SET
        members:
        - '4'
        - '5'
  checks:
  - kind: solve_equation
    expr: \frac{2 \cdot 4 + 3 \cdot k + 4 \cdot 7 + 5 \cdot \left(12 - k\right) + 6 \cdot 2}{25} = 3.92
    var: k
    part: k
  - kind: evaluate
    expr: 25 - \left(4 + 5 + 7 + 2\right)
    var: m
    part: m
  skills:
  - średnia z tabeli liczebności
  - układanie i rozwiązywanie równania z warunku na średnią
  - mediana z liczebności skumulowanych
  - wyznaczanie dominanty (także kilku dominant)
  verification:
    checkability: REFERENCE_CALL
    note: 4 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: parametr w zestawie danych – analiza przypadków dla mediany
  statement: 'Dany jest zestaw pięciu liczb: 2, 5, 9, 12, x. Wyznacz wszystkie wartości x, dla których
    mediana tego zestawu jest równa jego średniej arytmetycznej.'
  statement_latex: \bar{x} = \frac{2 + 5 + 9 + 12 + x}{5} = \frac{28 + x}{5}, \qquad \mathrm{Me} = x_{\left(3\right)}
  solution: |-
    Średnia zestawu nie zależy od położenia x w szeregu: x̄ = (2 + 5 + 9 + 12 + x)/5 = (28 + x)/5.
    Zestaw ma n = 5 elementów, więc mediana jest elementem o numerze (5+1)/2 = 3 w szeregu uporządkowanym niemalejąco. Położenie x zależy od jego wartości, więc rozważamy przypadki wyznaczone przez znane dane 2, 5, 9, 12.

    Przypadek 1: x ≤ 2. Szereg: x, 2, 5, 9, 12, więc Me = 5.
    Równanie: (28 + x)/5 = 5, czyli 28 + x = 25, stąd x = −3. Warunek x ≤ 2 jest spełniony, więc x = −3 jest rozwiązaniem.

    Przypadek 2: 2 ≤ x ≤ 5. Szereg: 2, x, 5, 9, 12, więc Me = 5 i znów x = −3. Ta wartość nie należy do przedziału [2; 5], więc w tym przypadku nie ma rozwiązań.

    Przypadek 3: 5 ≤ x ≤ 9. Szereg: 2, 5, x, 9, 12, więc Me = x.
    Równanie: (28 + x)/5 = x, czyli 28 + x = 5x, stąd 4x = 28 i x = 7. Warunek 5 ≤ 7 ≤ 9 jest spełniony, więc x = 7 jest rozwiązaniem.

    Przypadek 4: 9 ≤ x ≤ 12. Szereg: 2, 5, 9, x, 12, więc Me = 9.
    Równanie: (28 + x)/5 = 9, czyli 28 + x = 45, stąd x = 17. Wartość 17 nie należy do [9; 12], więc brak rozwiązań w tym przypadku.

    Przypadek 5: x ≥ 12. Szereg: 2, 5, 9, 12, x, więc Me = 9 i x = 17. Warunek x ≥ 12 jest spełniony, więc x = 17 jest rozwiązaniem.

    Sprawdzenie dla x = 17: średnia = 45/5 = 9, szereg 2, 5, 9, 12, 17, mediana = 9 ✓.
    Odpowiedź: x ∈ {−3, 7, 17}.
  solution_steps:
  - 'Zapisz średnią zależną od x: x̄ = (28 + x)/5.'
  - Zauważ, że n = 5, więc mediana to trzeci element szeregu uporządkowanego.
  - 'Rozważ przypadek x ≤ 5: Me = 5, równanie (28 + x)/5 = 5 daje x = −3 (zgodne tylko z x ≤ 2).'
  - 'Rozważ przypadek 5 ≤ x ≤ 9: Me = x, równanie (28 + x)/5 = x daje x = 7 (zgodne).'
