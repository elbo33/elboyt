- id: g-cm-08
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: 'wykrycie błędu: wartości funkcji wykładniczej'
  statement: 'Uczeń rozwiązywał równanie 2^{x} + 8 = 0 i zapisał: „2^{x} = -8 = -2^{3}, więc x = 3”. Wyjaśnij,
    dlaczego to rozumowanie jest błędne. a) Podaj zbiór rozwiązań równania 2^{x} + 8 = 0. b) Podaj zbiór
    wartości funkcji g(x) = 2^{x} + 8.'
  statement_latex: 2^{x}+8=0,\qquad g\left(x\right)=2^{x}+8
  solution: |-
    Błędne rozumowanie: uczeń „przeniósł” minus do potęgi i uznał, że 2^{x} może być liczbą ujemną. Tymczasem -2^{3} = -8 nie jest potęgą liczby 2 o żadnym wykładniku: (-8) < 0, a potęga liczby dodatniej jest zawsze dodatnia.

    Korekta: zbiorem wartości funkcji wykładniczej y = 2^{x} jest przedział (0,\ +\infty). Wartości maleją do zera, gdy x \to -\infty, ale nigdy zera nie osiągają — prosta y = 0 jest asymptotą poziomą.
    a) Równanie 2^{x} = -8 nie ma rozwiązań, więc zbiór rozwiązań jest pusty: \varnothing.
    b) Skoro 2^{x} > 0 dla każdego x, to 2^{x} + 8 > 8, a wartości dowolnie bliskie 8 i dowolnie duże są przyjmowane. Zatem zbiorem wartości funkcji g jest przedział (8,\ +\infty) (asymptota pozioma y = 8).
  solution_steps:
  - 'Wskazujemy błąd: 2^{x} nigdy nie przyjmuje wartości ujemnej ani zera, więc zapis 2^{x}=-8 jest sprzeczny.'
  - 'Przypominamy zbiór wartości: dla f(x)=2^{x} jest to (0,+\infty), a prosta y=0 to asymptota pozioma.'
  - 'Wniosek dla a): równanie 2^{x}+8=0 nie ma rozwiązań — zbiór rozwiązań jest pusty.'
  - 'Dla b): z 2^{x}>0 wynika 2^{x}+8>8, więc zbiór wartości g to (8,+\infty).'
  answer:
    kind: MULTIPART
    parts:
    - name: zbiór rozwiązań równania
      answer:
        kind: SET
        latex: \varnothing
    - name: zbiór wartości funkcji g
      answer:
        kind: INTERVAL
        lo: '8'
        hi: \infty
