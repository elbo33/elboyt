  statement: Dany jest równoległobok o bokach długości 7 i 8 oraz o kącie między nimi o mierze 135°. Oblicz
    pole tego równoległoboku w postaci dokładnej. Wyjaśnij, dlaczego rozumowanie „sin 135° = −sin 45°,
    więc pole wychodzi ujemne” jest błędne.
  statement_latex: P=7\cdot 8\cdot\sin 135^\circ
  solution: |-
    BŁĘDNE ROZUMOWANIE (typowy błąd):
    Uczeń pisze „\(\sin 135^\circ=-\sin 45^\circ=-\frac{\sqrt2}{2}\)”, skąd
    \[P=7\cdot 8\cdot\left(-\frac{\sqrt2}{2}\right)=-28\sqrt2,\]
    czyli pole ujemne — i stwierdza, że dla kąta rozwartego wzoru nie wolno stosować.

    DLACZEGO TO BŁĄD:
    Dla \(0^\circ<\gamma<180^\circ\) sinus jest DODATNI i zachodzi \(\sin\left(180^\circ-\alpha\right)=\sin\alpha\). Ujemny jest dopiero cosinus kąta rozwartego: \(\cos 135^\circ=-\cos 45^\circ\). Zatem
    \[\sin 135^\circ=\sin\left(180^\circ-135^\circ\right)=\sin 45^\circ=\frac{\sqrt2}{2}.\]

    POPRAWNE ROZWIĄZANIE:
    \[P=a\cdot b\cdot\sin\alpha=7\cdot 8\cdot\frac{\sqrt2}{2}=56\cdot\frac{\sqrt2}{2}=28\sqrt2 .\]
    Kontrola przez wysokość: wysokość opuszczona na bok długości 8 wynosi \(h=7\cdot\sin 45^\circ=\frac{7\sqrt2}{2}\), więc \(P=8\cdot\frac{7\sqrt2}{2}=28\sqrt2\). ✓

    Odpowiedź: \(P=28\sqrt2\) (≈ 39,6).
  solution_steps:
  - 'Rozpoznaj błąd: przyjęcie sin 135° = −sin 45° i pole ujemne −28√2.'
  - 'Popraw wartość: sin(180° − α) = sin α, więc sin 135° = sin 45° = √2/2 (ujemny jest cosinus).'
  - Podstaw do wzoru P = a·b·sin α = 7·8·(√2/2).
  - 'Uprość: P = 28√2 i sprawdź przez wysokość h = 7·sin 45°.'
