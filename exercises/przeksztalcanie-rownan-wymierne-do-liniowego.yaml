- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 3
  exercise_type: zadanie tekstowe prowadzące do równania wymiernego
  statement: Licznik pewnego ułamka jest o 4 mniejszy od jego mianownika. Jeżeli do licznika i do mianownika
    tego ułamka dodamy liczbę 3, to otrzymamy ułamek równy \frac{5}{7}. Wyznacz licznik i mianownik ułamka
    wyjściowego.
  statement_latex: \frac{\left(x-4\right)+3}{x+3}=\frac{5}{7}
  solution: |-
    Oznaczmy przez x mianownik szukanego ułamka. Wtedy jego licznik jest równy x-4.
    Po dodaniu 3 do licznika i do mianownika otrzymujemy ułamek \frac{x-4+3}{x+3}=\frac{x-1}{x+3}, a z treści zadania jest on równy \frac{5}{7}. Zapisujemy równanie:
    \frac{x-1}{x+3}=\frac{5}{7}.
    Dziedzina: x+3\neq 0, czyli x\neq -3 (mianownik ułamka wyjściowego też musi być różny od zera, więc x\neq 0).
    Stosujemy proporcję (oba mianowniki różne od zera):
    7\cdot\left(x-1\right)=5\cdot\left(x+3\right)
    7x-7=5x+15
    2x=22
    x=11.
    Liczba 11 należy do dziedziny, więc mianownik wynosi 11, a licznik 11-4=7.
    Sprawdzenie: ułamek \frac{7}{11}; po dodaniu 3 do licznika i mianownika: \frac{10}{14}=\frac{5}{7}. Zgadza się.
    Odpowiedź: licznik jest równy 7, a mianownik 11 (ułamek \frac{7}{11}).
  solution_steps:
  - 'Wprowadź niewiadomą: x – mianownik ułamka, wtedy licznik to x-4.'
  - Zapisz warunek zadania jako równanie \frac{x-1}{x+3}=\frac{5}{7}.
  - 'Ustal dziedzinę: x\neq -3 (oraz x\neq 0 dla ułamka wyjściowego).'
  - 'Zastosuj proporcję: 7\cdot\left(x-1\right)=5\cdot\left(x+3\right).'
  - 'Rozwiąż równanie liniowe: 2x=22, x=11.'
  - 'Oblicz licznik: 11-4=7 i sprawdź warunek zadania.'
