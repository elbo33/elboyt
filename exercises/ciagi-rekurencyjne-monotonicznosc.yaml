- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: wyrazy ciągu rekurencyjnego i monotoniczność
  statement: 'Ciąg \left(a_{n}\right) jest określony następująco: a_{1} = 4 oraz a_{n+1} = 3a_{n} - 5
    dla każdej liczby naturalnej n \geq 1. a) Oblicz a_{2}, a_{3} oraz a_{4}. b) Uzasadnij, że ciąg \left(a_{n}\right)
    jest rosnący.'
  statement_latex: a_{1}=4,\qquad a_{n+1}=3\cdot a_{n}-5\quad\text{dla } n\geq 1
  solution: |-
    a) Liczymy krok po kroku:
    n = 1: a_{2} = 3\cdot a_{1} - 5 = 3\cdot 4 - 5 = 7.
    n = 2: a_{3} = 3\cdot a_{2} - 5 = 3\cdot 7 - 5 = 16.
    n = 3: a_{4} = 3\cdot a_{3} - 5 = 3\cdot 16 - 5 = 43.
    b) Tworzymy różnicę bezpośrednio z rekurencji:
    a_{n+1} - a_{n} = \left(3a_{n} - 5\right) - a_{n} = 2a_{n} - 5.
    Wszystkie wyrazy ciągu są nie mniejsze od 4: istotnie a_{1} = 4, a jeżeli a_{n} \geq 4, to a_{n+1} = 3a_{n} - 5 \geq 3\cdot 4 - 5 = 7 > 4. Zatem dla każdego n \geq 1 mamy a_{n} \geq 4, czyli 2a_{n} - 5 \geq 8 - 5 = 3 > 0.
    Różnica a_{n+1} - a_{n} jest dodatnia dla każdego n \in \mathbb{N}^{+}, więc z definicji ciąg \left(a_{n}\right) jest rosnący.
  solution_steps:
  - 'Podstaw n = 1: a_{2} = 3\cdot 4 - 5 = 7.'
  - 'Podstaw n = 2: a_{3} = 3\cdot 7 - 5 = 16.'
  - 'Podstaw n = 3: a_{4} = 3\cdot 16 - 5 = 43.'
  - 'Zapisz różnicę: a_{n+1} - a_{n} = \left(3a_{n}-5\right) - a_{n} = 2a_{n} - 5.'
  - Uzasadnij, że a_{n} \geq 4 dla każdego n (a_{1} = 4, a z a_{n} \geq 4 wynika a_{n+1} = 3a_{n} - 5
    \geq 7).
  - 'Wywnioskuj: 2a_{n} - 5 \geq 3 > 0, więc a_{n+1} > a_{n} dla każdego n — ciąg jest rosnący.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_2
      answer:
        kind: NUMERIC
        value: 7.0
    - name: a_3
      answer:
        kind: NUMERIC
        value: 16.0
    - name: a_4
      answer:
        kind: NUMERIC
        value: 43.0
    - name: uzasadnienie_monotonicznosci
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma wykazać, że a_{n+1} - a_{n} = 2a_{n} - 5 > 0 dla każdego n, uzasadniając wcześniej,
          że a_{n} \geq 4, i sformułować wniosek, że ciąg jest rosnący.
  checks:
  - kind: evaluate
    expr: 3\cdot 4-5
    var: n
    part: a_2
  - kind: evaluate
    expr: 3\cdot\left(3\cdot 4-5\right)-5
    var: n
    part: a_3
  - kind: evaluate
    expr: 3\cdot\left(3\cdot\left(3\cdot 4-5\right)-5\right)-5
    var: n
    part: a_4
  skills:
  - obliczanie wyrazów rekurencji liniowej
  - badanie znaku różnicy a_{n+1}-a_{n}
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie_monotonicznosci · 3/3 other parts solved fresh'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: badanie monotoniczności metodą różnicy
  statement: Dany jest ciąg \left(a_{n}\right) określony wzorem a_{n} = n^{2} - 8n + 3 dla każdej liczby
    naturalnej n \geq 1. a) Wyznacz i uprość różnicę a_{n+1} - a_{n}. b) Rozstrzygnij, czy ciąg \left(a_{n}\right)
    jest monotoniczny — odpowiedź uzasadnij. c) Oblicz najmniejszy wyraz tego ciągu.
  statement_latex: a_{n}=n^{2}-8n+3,\qquad a_{n+1}-a_{n}=?
  solution: |-
    a) Podstawiamy (n+1) w nawiasie w miejsce każdego n:
    a_{n+1} = \left(n+1\right)^{2} - 8\left(n+1\right) + 3 = n^{2} + 2n + 1 - 8n - 8 + 3 = n^{2} - 6n - 4.
    Różnica: a_{n+1} - a_{n} = \left(n^{2} - 6n - 4\right) - \left(n^{2} - 8n + 3\right) = 2n - 7.
    b) Badamy znak wyrażenia 2n - 7 dla n \in \mathbb{N}^{+}:
    dla n = 1: 2\cdot 1 - 7 = -5 < 0, czyli a_{2} < a_{1};
    dla n = 4: 2\cdot 4 - 7 = 1 > 0, czyli a_{5} > a_{4}.
    Różnica przyjmuje wartości ujemne i dodatnie, zatem ciąg NIE jest monotoniczny (nie jest ani rosnący, ani malejący).
    c) Dla n \in \{1,2,3\} różnica jest ujemna (ciąg maleje), a dla n \geq 4 dodatnia (ciąg rośnie), więc najmniejszym wyrazem jest a_{4}:
    a_{4} = 4^{2} - 8\cdot 4 + 3 = 16 - 32 + 3 = -13.
  solution_steps:
  - Wyznacz a_{n+1} = \left(n+1\right)^{2} - 8\left(n+1\right) + 3 = n^{2} - 6n - 4.
  - 'Oblicz różnicę: a_{n+1} - a_{n} = \left(n^{2}-6n-4\right) - \left(n^{2}-8n+3\right) = 2n - 7.'
  - 'Zbadaj znak 2n - 7 dla n \geq 1: ujemny dla n \in \{1,2,3\}, dodatni dla n \geq 4.'
  - Wskaż dwie różnice o przeciwnych znakach (n = 1 i n = 4) i wywnioskuj brak monotoniczności.
  - Zauważ, że ciąg maleje do wyrazu a_{4}, a potem rośnie, więc najmniejszy wyraz to a_{4} = 16 - 32
    + 3 = -13.
  answer:
    kind: MULTIPART
    parts:
    - name: roznica
      answer:
        kind: SYMBOLIC
        latex: 2n-7
    - name: czy_monotoniczny
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma stwierdzić, że ciąg nie jest monotoniczny, i uzasadnić to, wskazując np. a_{2}
          - a_{1} = -5 < 0 oraz a_{5} - a_{4} = 1 > 0.
    - name: najmniejszy_wyraz
      answer:
        kind: NUMERIC
        value: -13.0
  checks:
  - kind: simplify
    expr: \left(\left(n+1\right)^{2}-8\left(n+1\right)+3\right)-\left(n^{2}-8n+3\right)
    var: n
    part: roznica
  - kind: evaluate
    expr: 4^{2}-8\cdot 4+3
    var: n
    part: najmniejszy_wyraz
  skills:
  - podstawianie (n+1)
  - znak wyrażenia liniowego dla n naturalnych
  - obalanie monotoniczności
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: czy_monotoniczny · 2/2 other parts solved fresh'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: dowód monotoniczności ciągu wymiernego
  statement: Dany jest ciąg \left(a_{n}\right) określony wzorem a_{n} = \frac{3n+2}{n+2} dla każdej liczby
    naturalnej n \geq 1. a) Oblicz a_{1}. b) Wyznacz różnicę a_{n+1} - a_{n} i zapisz ją w postaci jednego
    ułamka w najprostszej postaci. c) Wykaż, że ciąg \left(a_{n}\right) jest rosnący.
  statement_latex: a_{n}=\frac{3n+2}{n+2},\qquad a_{n+1}-a_{n}=?
  solution: |-
    a) a_{1} = \frac{3\cdot 1 + 2}{1+2} = \frac{5}{3}.
    b) Dla n \geq 1 mamy n + 2 > 0, więc wzór jest poprawnie określony. Podstawiamy (n+1):
    a_{n+1} = \frac{3\left(n+1\right)+2}{\left(n+1\right)+2} = \frac{3n+5}{n+3}.
    Różnica:
    a_{n+1} - a_{n} = \frac{3n+5}{n+3} - \frac{3n+2}{n+2} = \frac{\left(3n+5\right)\left(n+2\right) - \left(3n+2\right)\left(n+3\right)}{\left(n+3\right)\left(n+2\right)}.
    Licznik: \left(3n+5\right)\left(n+2\right) = 3n^{2} + 11n + 10, \left(3n+2\right)\left(n+3\right) = 3n^{2} + 11n + 6, ich różnica to 4.
    Zatem a_{n+1} - a_{n} = \frac{4}{\left(n+2\right)\left(n+3\right)}.
    c) Dla każdego n \in \mathbb{N}^{+} mamy n + 2 > 0 oraz n + 3 > 0, więc mianownik jest dodatni, a licznik równy 4 > 0. Stąd a_{n+1} - a_{n} > 0 dla każdego n, czyli a_{n+1} > a_{n}. Z definicji ciąg \left(a_{n}\right) jest rosnący. \square
  solution_steps:
  - Oblicz a_{1} = \frac{3\cdot 1+2}{1+2} = \frac{5}{3}.
  - Wyznacz a_{n+1} = \frac{3\left(n+1\right)+2}{\left(n+1\right)+2} = \frac{3n+5}{n+3}.
  - 'Sprowadź różnicę do wspólnego mianownika: \frac{\left(3n+5\right)\left(n+2\right)-\left(3n+2\right)\left(n+3\right)}{\left(n+3\right)\left(n+2\right)}.'
  - 'Uprość licznik: 3n^{2}+11n+10 - \left(3n^{2}+11n+6\right) = 4, więc a_{n+1} - a_{n} = \frac{4}{\left(n+2\right)\left(n+3\right)}.'
  - Zauważ, że dla n \geq 1 mianownik jest dodatni, a licznik równy 4 > 0.
  - 'Sformułuj wniosek: a_{n+1} - a_{n} > 0 dla każdego n \in \mathbb{N}^{+}, zatem ciąg jest rosnący.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_1
      answer:
        kind: NUMERIC
        value: 1.6666666666666667
    - name: roznica
      answer:
        kind: SYMBOLIC
        latex: \frac{4}{\left(n+2\right)\left(n+3\right)}
    - name: dowod
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma wykazać, że różnica \frac{4}{\left(n+2\right)\left(n+3\right)} jest dodatnia
          dla każdego n \in \mathbb{N}^{+} (dodatni licznik i dodatni mianownik) i stąd wywnioskować,
          że ciąg jest rosnący.
  checks:
  - kind: evaluate
    expr: \frac{3\cdot 1+2}{1+2}
    var: n
    part: a_1
  - kind: simplify
    expr: \frac{3\left(n+1\right)+2}{\left(n+1\right)+2}-\frac{3n+2}{n+2}
    var: n
    part: roznica
  skills:
  - metoda różnicy dla ułamków
  - sprowadzanie do wspólnego mianownika
  - formułowanie dowodu
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: dowod · 2/2 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: ciąg rekurencyjny — wyrazy początkowe i monotoniczność
  statement: 'Ciąg \left( a_{n} \right) jest określony rekurencyjnie następująco: a_{1} = 2 oraz a_{n+1}
    = a_{n} + 2n - 7 dla każdej liczby naturalnej n \geq 1. Oblicz wyrazy a_{2}, a_{3}, a_{4} oraz a_{5}.
    Rozstrzygnij, czy ciąg \left( a_{n} \right) jest monotoniczny. Odpowiedź uzasadnij.'
  statement_latex: a_{1} = 2,\qquad a_{n+1} = a_{n} + 2\cdot n - 7 \quad \text{dla } n \geq 1
  solution: |-
    Wyrazy liczymy kolejno, podstawiając za n liczby 1, 2, 3, 4.
    n = 1: a_{2} = a_{1} + 2\cdot 1 - 7 = 2 - 5 = -3.
    n = 2: a_{3} = a_{2} + 2\cdot 2 - 7 = -3 - 3 = -6.
    n = 3: a_{4} = a_{3} + 2\cdot 3 - 7 = -6 - 1 = -7.
    n = 4: a_{5} = a_{4} + 2\cdot 4 - 7 = -7 + 1 = -6.
    Zatem a_{1} = 2, a_{2} = -3, a_{3} = -6, a_{4} = -7, a_{5} = -6.
    Rekurencja ma postać a_{n+1} = a_{n} + f\left(n\right), więc a_{n+1} - a_{n} = 2\cdot n - 7.
    Dla n = 1: 2\cdot 1 - 7 = -5 < 0, czyli a_{2} < a_{1}.
    Dla n = 4: 2\cdot 4 - 7 = 1 > 0, czyli a_{5} > a_{4}.
    Różnica a_{n+1} - a_{n} przyjmuje zarówno wartości ujemne (dla n \in \{1,2,3\}), jak i dodatnie (dla n \geq 4), więc ciąg nie jest ani rosnący, ani malejący — nie jest monotoniczny.
  solution_steps:
  - 'Zapisz dane: a_{1} = 2 oraz regułę a_{n+1} = a_{n} + 2\cdot n - 7.'
  - Podstaw n = 1 i oblicz a_{2} = 2 + \left(2\cdot 1 - 7\right) = -3.
  - Podstaw n = 2 i oblicz a_{3} = -3 + \left(2\cdot 2 - 7\right) = -6.
  - Podstaw n = 3 i oblicz a_{4} = -6 + \left(2\cdot 3 - 7\right) = -7.
  - Podstaw n = 4 i oblicz a_{5} = -7 + \left(2\cdot 4 - 7\right) = -6.
  - Zauważ, że a_{n+1} - a_{n} = 2\cdot n - 7.
  - 'Zbadaj znak: dla n = 1 różnica jest ujemna, dla n = 4 dodatnia.'
  - 'Wniosek: ciąg nie jest monotoniczny.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_2
      answer:
        kind: NUMERIC
        value: -3.0
    - name: a_3
      answer:
        kind: NUMERIC
        value: -6.0
    - name: a_4
      answer:
        kind: NUMERIC
        value: -7.0
    - name: a_5
      answer:
        kind: NUMERIC
        value: -6.0
    - name: monotonicznosc
      answer:
        kind: SYMBOLIC
        latex: niemonotoniczny
    - name: uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: 'Należy wykazać, że a_{n+1} - a_{n} = 2n - 7 zmienia znak: dla n = 1 różnica jest ujemna
          (a_2 < a_1), a dla n = 4 dodatnia (a_5 > a_4), więc ciąg nie jest ani rosnący, ani malejący.'
  checks:
  - kind: evaluate
    expr: 2 + \left(2\cdot 1 - 7\right)
    var: n
    part: a_2
  - kind: evaluate
    expr: 2 + \left(2\cdot 1 - 7\right) + \left(2\cdot 2 - 7\right)
    var: n
    part: a_3
  - kind: evaluate
    expr: 2 + \left(2\cdot 1 - 7\right) + \left(2\cdot 2 - 7\right) + \left(2\cdot 3 - 7\right)
    var: n
    part: a_4
  - kind: evaluate
