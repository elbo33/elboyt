  exercise_type: klasyfikacja położenia prostych – demonstracja błędu
  statement: 'Dany jest prostopadłościan ABCDA''B''C''D'', w którym |AB| = 8, |BC| = 5, |AA''| = 4 (ABCD
    jest dolną podstawą, a AA'', BB'', CC'', DD'' – krawędziami bocznymi). Uczeń stwierdził: „Proste AB
    i CC'' nie mają punktu wspólnego, więc są równoległe”. Odpowiedz: (a) Czy proste AB i CC'' są równoległe?
    (b) Czy proste AB i CC'' są skośne? Wyjaśnij, na czym polega błąd ucznia.'
  statement_latex: AB\cap CC'=\varnothing\ \nRightarrow\ AB\parallel CC'
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: „Na płaszczyźnie dwie proste, które się nie przecinają, są równoległe. Proste AB i CC' nie mają punktu wspólnego, więc AB ∥ CC'.” Otrzymana (błędna) odpowiedź: proste są równoległe.
    DLACZEGO TO BŁĄD: reguła „brak punktu wspólnego ⇒ równoległość” obowiązuje tylko dla prostych leżących w jednej płaszczyźnie. W przestrzeni brak punktu wspólnego oznacza jedynie, że proste są równoległe LUB skośne.
    POPRAWNE ROZUMOWANIE: prosta AB leży w płaszczyźnie dolnej podstawy, a prosta CC' jest prostopadła do tej płaszczyzny i przebija ją w punkcie C, który nie należy do prostej AB. Gdyby istniała płaszczyzna zawierająca AB i CC', to zawierałaby punkty A, B, C, C'; płaszczyzna przez A, B, C to płaszczyzna podstawy, a do niej punkt C' nie należy – sprzeczność. Zatem nie ma płaszczyzny zawierającej obie proste, więc proste AB i CC' są SKOŚNE (a nie równoległe). Dodatkowo, ponieważ CC' ∥ BB' i AB ⊥ BB', kąt między tymi prostymi skośnymi wynosi 90°.
  solution_steps:
  - 'Błąd: przeniesienie planimetrycznej reguły „brak punktu wspólnego ⇒ równoległe” do przestrzeni; wynik
    błędny: AB ∥ CC''.'
  - 'W przestrzeni brak punktu wspólnego daje tylko alternatywę: równoległe lub skośne.'
  - 'Sprawdź, czy istnieje płaszczyzna zawierająca AB i CC'': punkty A, B, C wyznaczają płaszczyznę podstawy,
    do której C'' nie należy – takiej płaszczyzny nie ma.'
  - 'Wniosek: proste AB i CC'' są skośne, a nie równoległe (kąt między nimi wynosi 90°).'
