    Pole prostokąta to P=x\cdot\left(14-x\right) i ma być nie mniejsze niż 45:
    x\left(14-x\right)\ge 45.
    Porządkujemy: 14x-x^{2}-45\ge 0, czyli po pomnożeniu przez -1 (i odwróceniu znaku) x^{2}-14x+45\le 0.
    \Delta=\left(-14\right)^{2}-4\cdot 1\cdot 45=196-180=16, \sqrt{\Delta}=4.
