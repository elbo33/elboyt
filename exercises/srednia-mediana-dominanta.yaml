- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 1
  exercise_type: wyznaczanie dominanty
  statement: 'W sklepie sprzedano w ciągu godziny dziewięć par butów w rozmiarach: 38, 40, 39, 40, 41,
    40, 38, 39, 40. Podaj dominantę rozmiaru sprzedanych butów.'
  statement_latex: D=40
  solution: |-
    Zliczamy wystąpienia poszczególnych rozmiarów:
    rozmiar 38 – 2 razy, rozmiar 39 – 2 razy, rozmiar 40 – 4 razy, rozmiar 41 – 1 raz.
    Razem 2 + 2 + 4 + 1 = 9 danych, co zgadza się z liczebnością zestawu.
    Największa liczebność to 4 i odpowiada ona rozmiarowi 40.
    Dominantą jest sama wartość występująca najczęściej, czyli D = 40 (liczba 4 to tylko jej liczebność).
    Odpowiedź: D = 40.
  solution_steps:
  - 'Zlicz wystąpienia każdego rozmiaru: 38 – 2, 39 – 2, 40 – 4, 41 – 1.'
  - Sprawdź, że suma liczebności wynosi 9.
  - 'Wskaż największą liczebność: 4.'
  - 'Podaj wartość o tej liczebności: D = 40.'
  answer:
    kind: NUMERIC
    value: 40.0
    latex: '40'
  skills:
  - zliczanie wystąpień wartości
  - wyznaczanie dominanty
  verification:
    checkability: REFERENCE_CALL
