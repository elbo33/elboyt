      r\\cdot\\left(20-2\\cdot r\\right)=16'') — human review'
- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: optymalizacja pola wycinka z ograniczeniem zewnętrznym
  statement: |-
    Rabata w ogrodzie ma mieć kształt wycinka koła, którego brzeg tworzą dwa promienie i łuk. Cały brzeg rabaty trzeba obłożyć obrzeżem — mamy do dyspozycji taśmę o długości 24 m i musimy zużyć ją w całości. Promień rabaty oznaczmy przez x (w metrach).
    a) Zapisz pole P rabaty jako funkcję zmiennej x i podaj dziedzinę tej funkcji, przyjmując, że promień i długość łuku muszą być dodatnie.
    b) Ze względu na kształt działki promień rabaty nie może być większy niż 5 m. Oblicz największe pole rabaty możliwe w tych warunkach oraz długość łuku rabaty o tym polu.
  statement_latex: P\left(x\right)=\frac{1}{2}\cdot x\cdot\left(24-2\cdot x\right)=12\cdot x-x^{2}
  solution: |-
    a) Brzeg wycinka to dwa promienie i łuk, więc 2x+l=24, czyli l=24-2x.
    Pole wycinka liczymy wzorem P_w=\frac{1}{2}\cdot l\cdot x:
    P\left(x\right)=\frac{1}{2}\cdot\left(24-2x\right)\cdot x=12x-x^{2}.
    Dziedzina: x>0 oraz l=24-2x>0, czyli x<12. Zatem x\in\left(0;12\right).
    b) Funkcja P\left(x\right)=-x^{2}+12x jest funkcją kwadratową o ujemnym współczynniku przy x^{2}; jej wierzchołek ma pierwszą współrzędną
    x_{w}=\frac{-12}{2\cdot\left(-1\right)}=6.
    Wartość x_{w}=6 nie jest dopuszczalna, bo promień nie może przekroczyć 5 m. Na przedziale \left(0;6\right] funkcja jest rosnąca, więc na przedziale \left(0;5\right] największą wartość przyjmuje dla x=5:
    P\left(5\right)=12\cdot 5-5^{2}=60-25=35\ \text{m}^2.
    Długość łuku: l=24-2\cdot 5=14\ \text{m}.
    Sprawdzenie wykonalności: łuk musi spełniać l\le 2\pi x, a 14\le 2\pi\cdot 5=10\pi\approx 31{,}4 ✓ (kąt środkowy \alpha=\frac{14}{10\pi}\cdot 360^\circ\approx 160^\circ).
    Odpowiedź: największe pole to 35 m² przy promieniu 5 m i łuku długości 14 m.
  solution_steps:
  - 'Z warunku na obrzeże: 2x + l = 24, więc l = 24 − 2x.'
  - Zapisz pole wzorem P = ½·l·x, czyli P(x) = ½·x·(24 − 2x) = 12x − x².
  - 'Wyznacz dziedzinę z warunków x > 0 i 24 − 2x > 0: x ∈ (0; 12).'
  - 'Znajdź wierzchołek paraboli: x_w = 6 — leży poza dopuszczalnym zakresem x ≤ 5.'
  - Zauważ, że P jest rosnąca na (0; 6], więc na (0; 5] największa wartość jest dla x = 5.
  - Oblicz P(5) = 35 m² oraz l = 24 − 10 = 14 m i sprawdź warunek l ≤ 2πx.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_pola
      answer:
        kind: SYMBOLIC
        latex: 12\cdot x-x^{2}
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '12'
    - name: najwieksze_pole
      answer:
        kind: NUMERIC
        value: 35.0
    - name: dlugosc_luku
      answer:
        kind: NUMERIC
        value: 14.0
  checks:
  - kind: simplify
    expr: \frac{1}{2}\cdot x\cdot\left(24-2\cdot x\right)
    part: wzor_pola
  - kind: evaluate
    expr: 12\cdot 5-5^{2}
    part: najwieksze_pole
  - kind: evaluate
    expr: 24-2\cdot 5
    part: dlugosc_luku
  stated_model:
