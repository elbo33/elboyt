- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: wyznaczanie mediany (n parzyste)
  statement: 'Sześciu zawodników pokonało pewien tor przeszkód w czasach (w minutach): 14, 9, 6, 11, 9,
    20. Wyznacz medianę tych czasów.'
  statement_latex: \mathrm{Me}=\frac{9+11}{2}
  solution: |-
    Porządkujemy dane niemalejąco, wypisując wszystkie powtórzenia: 6, 9, 9, 11, 14, 20.
    Liczebność n = 6 jest parzysta, więc mediana jest średnią arytmetyczną elementów o numerach \frac{n}{2}=3 oraz \frac{n}{2}+1=4, czyli liczb 9 i 11.
    \mathrm{Me}=\frac{9+11}{2}=10.
    Po obu stronach mediany leżą po trzy dane, co potwierdza poprawność.
    Odpowiedź: mediana wynosi 10 minut.
  solution_steps:
  - 'Uporządkuj dane niemalejąco: 6, 9, 9, 11, 14, 20.'
  - Zauważ, że n = 6 jest parzyste, więc mediana to średnia elementów 3. i 4.
  - 'Odczytaj te elementy: 9 i 11.'
  - Oblicz \mathrm{Me}=\frac{9+11}{2}=10.
