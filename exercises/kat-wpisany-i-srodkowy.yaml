  exercise_type: demonstracja błędu — zły łuk
  statement: 'Punkty A i B leżą na okręgu o środku O, a kąt wypukły AOB ma miarę 140^\circ. Punkt D leży
    na krótszym łuku AB. Uczeń zapisał: „Kąt wpisany oparty na cięciwie AB jest połową kąta AOB, więc
    |\angle ADB| = \frac{1}{2}\cdot 140^\circ = 70^\circ”. Wyjaśnij, na czym polega błąd, i oblicz poprawną
    miarę kąta ADB.'
  statement_latex: '\text{błędnie: } |\angle ADB| = \frac{1}{2}\cdot 140^\circ,\qquad \text{poprawnie:
    } |\angle ADB| = \frac{1}{2}\cdot\left(360^\circ - 140^\circ\right)'
  solution: |-
    Błędne rozumowanie: uczeń podzielił przez 2 kąt środkowy wypukły i otrzymał |\angle ADB| = 70^\circ.

    Dlaczego to jest źle: cięciwa AB wyznacza DWA łuki i dwa kąty środkowe: wypukły o mierze 140^\circ (oparty na krótszym łuku) oraz wklęsły o mierze 360^\circ - 140^\circ = 220^\circ (oparty na dłuższym łuku). Kąt wpisany opiera się na tym łuku, który leży po przeciwnej stronie cięciwy niż jego wierzchołek. Punkt D leży na krótszym łuku, więc kąt ADB opiera się na dłuższym łuku AB, a nie na krótszym — dzielić należało kąt 220^\circ, a nie 140^\circ.

    Poprawne rozwiązanie:
    |\angle ADB| = \frac{1}{2}\cdot\left(360^\circ - 140^\circ\right) = \frac{1}{2}\cdot 220^\circ = 110^\circ.

    Kontrola: dla punktu C leżącego na dłuższym łuku mamy |\angle ACB| = \tfrac12\cdot 140^\circ = 70^\circ i rzeczywiście 70^\circ + 110^\circ = 180^\circ — kąty wpisane po przeciwnych stronach cięciwy nie są równe, lecz dopełniają się do 180^\circ.

    Odpowiedź: |\angle ADB| = 110^\circ.
  solution_steps:
  - 'Wskaż błąd: uczeń użył kąta środkowego opartego na niewłaściwym łuku.'
  - Zauważ, że D leży na krótszym łuku AB, więc kąt ADB opiera się na dłuższym łuku.
  - 'Oblicz kąt środkowy wklęsły: 360^\circ - 140^\circ = 220^\circ.'
  - 'Oblicz |\angle ADB| = \tfrac12\cdot 220^\circ = 110^\circ i sprawdź: 70^\circ + 110^\circ = 180^\circ.'
