- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: wyznaczanie boku z danego kąta (ekierka 30-60-90)
  statement: W trójkącie prostokątnym KLM kąt przy wierzchołku M jest prosty, przeciwprostokątna |KL|
    = 12, a kąt LKM ma miarę 30^\circ. Oblicz długość przyprostokątnej LM, leżącej naprzeciw kąta o mierze
    30^\circ.
  statement_latex: \sin 30^\circ=\frac{|LM|}{12}\ \Rightarrow\ |LM|=12\cdot\frac{1}{2}
  solution: |-
    Bok LM leży naprzeciw kąta o mierze 30^\circ, a dana jest przeciwprostokątna KL — para „naprzeciw i przeciwprostokątna” to sinus.
    \sin 30^\circ=\frac{|LM|}{|KL|}=\frac{|LM|}{12}.
    Ponieważ \sin 30^\circ=\frac{1}{2}, to |LM|=12\cdot\frac{1}{2}=6.
    Kontrola: naprzeciw kąta 30^\circ leży połowa przeciwprostokątnej — zgadza się (6 to połowa z 12). ✓
  solution_steps:
  - Zauważ, że LM leży naprzeciw kąta 30°, a KL to przeciwprostokątna.
  - 'Wybierz sinus: sin30° = \frac{|LM|}{12}.'
  - Wstaw sin30° = \frac{1}{2}.
  - Wyznacz |LM| = 12\cdot\frac{1}{2} = 6.
  answer:
    kind: NUMERIC
    value: 6.0
  checks:
  - kind: evaluate
    expr: 12\cdot\frac{1}{2}
  skills:
  - dobór funkcji metodą mam–szukam
  - dokładne wartości dla 30°
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 6.0 vs 6.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: jedynka trygonometryczna
  statement: Kąt \alpha jest kątem ostrym oraz \cos\alpha=\frac{5}{13}. Oblicz \sin\alpha.
  statement_latex: \sin\alpha=\sqrt{1-\left(\frac{5}{13}\right)^2}
  solution: |-
    Sposób I (trójkąt pomocniczy): rozważmy trójkąt prostokątny, w którym przy kącie \alpha leży przyprostokątna długości 5, a przeciwprostokątna ma długość 13. Z twierdzenia Pitagorasa druga przyprostokątna (naprzeciw \alpha) ma długość \sqrt{13^2-5^2}=\sqrt{169-25}=\sqrt{144}=12. Stąd \sin\alpha=\frac{12}{13}.
    Sposób II (rachunkowy): z jedynki trygonometrycznej \sin^2\alpha=1-\cos^2\alpha=1-\frac{25}{169}=\frac{144}{169}, a ponieważ \alpha jest kątem ostrym, bierzemy pierwiastek dodatni: \sin\alpha=\frac{12}{13}.
    Kontrola: \frac{12}{13}\approx 0{,}92 należy do przedziału (0,1). ✓
  solution_steps:
  - 'Zapisz jedynkę trygonometryczną: sin²α + cos²α = 1.'
  - 'Podstaw cosα = \frac{5}{13}: sin²α = 1 - \frac{25}{169} = \frac{144}{169}.'
  - 'Dla kąta ostrego weź pierwiastek dodatni: sinα = \frac{12}{13}.'
  - Sprawdź, że wynik leży w przedziale (0,1).
  answer:
    kind: SYMBOLIC
    latex: \frac{12}{13}
  checks:
  - kind: evaluate
    expr: \sqrt{1-\left(\frac{5}{13}\right)^{2}}
  skills:
  - jedynka trygonometryczna
  - trójkąt pomocniczy
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 0.9230769230769231 vs 0.9230769230769231 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: 'rozwiązywanie trójkąta: dany bok i kąt ostry'
  statement: Dany jest trójkąt prostokątny ABC, w którym kąt przy wierzchołku C jest prosty, |AC| = 9,
    a kąt BAC ma miarę 60^\circ. Oblicz dokładne długości boków BC oraz AB.
  statement_latex: \operatorname{tg}60^\circ=\frac{|BC|}{9},\qquad \cos 60^\circ=\frac{9}{|AB|}
  solution: |-
    Kąt prosty jest przy C, więc przyprostokątne to AC i BC, a przeciwprostokątną jest AB.
    Względem kąta BAC = 60^\circ: przy nim leży AC = 9, naprzeciw niego leży BC, przeciwprostokątną jest AB.
    1) Bok BC (dwie przyprostokątne → tangens): \operatorname{tg}60^\circ=\frac{|BC|}{9}, czyli |BC|=9\cdot\sqrt{3}=9\sqrt{3}\approx 15{,}59.
    2) Bok AB (bok przy i przeciwprostokątna → cosinus): \cos 60^\circ=\frac{9}{|AB|}, czyli \frac{1}{2}=\frac{9}{|AB|}, stąd |AB|=\frac{9}{\frac{1}{2}}=18.
    Kontrola Pitagorasem: 9^2+\left(9\sqrt{3}\right)^2=81+243=324=18^2. ✓ Przeciwprostokątna wyszła najdłuższa. ✓
  solution_steps:
  - 'Ustal role boków względem kąta 60°: przy — AC = 9, naprzeciw — BC, przeciwprostokątna — AB.'
  - 'Dla BC użyj tangensa: tg60° = \frac{|BC|}{9}.'
  - Podstaw tg60° = \sqrt{3} i oblicz |BC| = 9\sqrt{3}.
  - 'Dla AB użyj cosinusa: cos60° = \frac{9}{|AB|}, czyli |AB| = \frac{9}{\frac{1}{2}}.'
  - Oblicz |AB| = 18 i sprawdź wynik twierdzeniem Pitagorasa.
  answer:
    kind: MULTIPART
    parts:
    - name: '|BC|'
      answer:
        kind: SYMBOLIC
        latex: 9\sqrt{3}
    - name: '|AB|'
      answer:
        kind: NUMERIC
        value: 18.0
  checks:
  - kind: evaluate
    expr: 9\cdot\sqrt{3}
    part: '|BC|'
  - kind: evaluate
    expr: \frac{9}{\frac{1}{2}}
    part: '|AB|'
  skills:
  - dobór funkcji metodą mam–szukam
  - dokładne wartości dla 60°
  - przekształcanie równania
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [|BC|] SymPy solved it fresh: 15.588457268119896 vs 15.588457268119896
      (tol 1e-09) ; [|AB|] SymPy solved it fresh: 18.0 vs 18.0 (tol 1e-09)'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: zadanie praktyczne z kątem wzniesienia
  statement: Geodeta stoi na poziomym placu w odległości 40 m od pionowego masztu. Przyrząd pomiarowy
    znajduje się na wysokości 1,6 m nad podłożem, a wierzchołek masztu geodeta widzi pod kątem wzniesienia
    38^\circ (kąt między poziomą linią patrzenia a kierunkiem na wierzchołek masztu). Oblicz wysokość
    masztu oraz odległość przyrządu od wierzchołka masztu. Wyniki podaj w metrach z zaokrągleniem do 0,1
    m. Przyjmij \operatorname{tg}38^\circ\approx 0{,}7813 oraz \cos 38^\circ\approx 0{,}7880.
  statement_latex: h=40\cdot 0{,}7813+1{,}6,\qquad d=\frac{40}{0{,}7880}
  solution: |-
    Model: pozioma linia patrzenia (długości 40 m) i pionowy odcinek masztu powyżej poziomu przyrządu tworzą trójkąt prostokątny; kąt ostry przy przyrządzie ma miarę 38^\circ.
    1) Odcinek x — część masztu powyżej poziomu przyrządu — leży naprzeciw kąta 38^\circ, a bok przy tym kącie ma długość 40 m, więc używamy tangensa:
    \operatorname{tg}38^\circ=\frac{x}{40}, czyli x=40\cdot 0{,}7813=31{,}252 m.
    Cała wysokość masztu: h=31{,}252+1{,}6=32{,}852\approx 32{,}9 m (pamiętamy o wysokości przyrządu!).
    2) Odległość przyrządu od wierzchołka masztu to przeciwprostokątna d. Znany bok 40 m leży PRZY kącie 38^\circ, więc:
    \cos 38^\circ=\frac{40}{d}, stąd d=\frac{40}{0{,}7880}\approx 50{,}76\approx 50{,}8 m.
    Kontrola: przeciwprostokątna (50,8 m) jest dłuższa od przyprostokątnej 40 m. ✓
    Odpowiedź: maszt ma około 32,9 m wysokości, a wierzchołek masztu jest oddalony od przyrządu o około 50,8 m.
  solution_steps:
  - 'Zbuduj model: trójkąt prostokątny o przyprostokątnej poziomej 40 m i kącie ostrym 38° przy obserwatorze.'
  - 'Oblicz część masztu nad poziomem przyrządu: x = 40·tg38° = 40·0,7813 = 31,252 m.'
  - 'Dodaj wysokość przyrządu: h = 31,252 + 1,6 = 32,852 ≈ 32,9 m.'
  - 'Dla odległości użyj cosinusa: cos38° = \frac{40}{d}, więc d = \frac{40}{0,7880} ≈ 50,76 m.'
  - Zaokrąglij d do 50,8 m i sprawdź, że przeciwprostokątna jest najdłuższa.
  answer:
    kind: MULTIPART
    parts:
    - name: wysokosc masztu (m)
      answer:
        kind: NUMERIC
        value: 32.9
        tol: 0.06
    - name: odleglosc przyrzadu od wierzcholka (m)
      answer:
        kind: NUMERIC
        value: 50.8
        tol: 0.06
  checks:
  - kind: evaluate
    expr: 40\cdot 0.7813+1.6
    part: wysokosc masztu (m)
  - kind: evaluate
    expr: \frac{40}{0.7880}
    part: odleglosc przyrzadu od wierzcholka (m)
  skills:
  - model z trójkątem prostokątnym
  - kąt wzniesienia
  - uwzględnienie wysokości obserwatora
  - zaokrąglanie wyniku
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [wysokosc masztu (m)] SymPy solved it fresh: 32.9 vs 32.852
      (tol 0.06) ; [odleglosc przyrzadu od wierzcholka (m)] SymPy solved it fresh: 50.8 vs 50.761421319797
      (tol 0.06)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: rozbicie figury na trójkąty prostokątne
  statement: W trapezie równoramiennym ABCD podstawy AB i CD są równoległe, |AB| = 14, |CD| = 6, a kąt
    DAB (przy dłuższej podstawie) ma miarę 45^\circ. Oblicz wysokość trapezu, dokładną długość ramienia
    AD oraz pole trapezu.
  statement_latex: x=\frac{14-6}{2},\qquad h=x\cdot\operatorname{tg}45^\circ,\qquad |AD|=\frac{x}{\cos
    45^\circ},\qquad P=\frac{14+6}{2}\cdot h
  solution: |-
    Poprowadźmy wysokości z wierzchołków D i C na podstawę AB; ich spodki oznaczmy E i F. Odcinek EF ma długość 6 (jak CD), a odcinki AE i FB są równe, bo trapez jest równoramienny.
    1) 2x+6=14, więc x=|AE|=\frac{14-6}{2}=4.
    2) W trójkącie prostokątnym AED kąt przy A ma 45^\circ, przy nim leży AE = 4, naprzeciw leży wysokość h:
    \operatorname{tg}45^\circ=\frac{h}{4}, czyli h=4\cdot 1=4.
    3) Ramię AD jest przeciwprostokątną tego trójkąta; bok AE = 4 leży PRZY kącie 45^\circ, więc
    \cos 45^\circ=\frac{4}{|AD|}, stąd |AD|=\frac{4}{\frac{\sqrt{2}}{2}}=4\sqrt{2}\approx 5{,}66.
    (Kontrola Pitagorasem: 4^2+4^2=32=\left(4\sqrt{2}\right)^2. ✓)
    4) Pole: P=\frac{14+6}{2}\cdot 4=10\cdot 4=40.
    Odpowiedź: wysokość wynosi 4, ramię 4\sqrt{2}, a pole trapezu 40.
  solution_steps:
  - Poprowadź wysokości z D i C na AB; odetną one na AB odcinki równe x = \frac{14-6}{2} = 4.
  - W trójkącie prostokątnym o kącie 45° zapisz tg45° = \frac{h}{4} i oblicz h = 4.
  - 'Ramię wyznacz z cosinusa: cos45° = \frac{4}{|AD|}, więc |AD| = \frac{4}{\frac{\sqrt{2}}{2}} = 4\sqrt{2}.'
  - 'Sprawdź wynik twierdzeniem Pitagorasa: 4² + 4² = (4√2)².'
  - 'Oblicz pole: P = \frac{14+6}{2}\cdot 4 = 40.'
  answer:
    kind: MULTIPART
    parts:
    - name: wysokosc
      answer:
        kind: NUMERIC
        value: 4.0
    - name: ramie AD
      answer:
        kind: SYMBOLIC
        latex: 4\sqrt{2}
    - name: pole
      answer:
        kind: NUMERIC
        value: 40.0
  checks:
  - kind: evaluate
    expr: \frac{14-6}{2}\cdot 1
    part: wysokosc
  - kind: evaluate
    expr: \frac{\frac{14-6}{2}}{\frac{\sqrt{2}}{2}}
    part: ramie AD
  - kind: evaluate
    expr: \frac{14+6}{2}\cdot 4
    part: pole
  skills:
  - rozbijanie trapezu na trójkąty prostokątne
  - dokładne wartości dla 45°
  - pole trapezu
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [wysokosc] SymPy solved it fresh: 4.0 vs 4.0 (tol 1e-09) ;
      [ramie AD] SymPy solved it fresh: 5.656854249492381 vs 5.656854249492381 (tol 1e-09) ; [pole] SymPy
      solved it fresh: 40.0 vs 40.0 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: rozbicie figury na trójkąty prostokątne (trapez równoramienny)
  statement: W trapezie równoramiennym ABCD podstawy AB i CD są równoległe, przy czym |AB| = 16 oraz |CD|
    = 6. Kąt ostry trapezu przy dłuższej podstawie AB (czyli kąt DAB) ma miarę 60°. Oblicz dokładną długość
    wysokości trapezu, dokładną długość ramienia AD oraz dokładne pole tego trapezu.
  statement_latex: '|AB|=16,\quad |CD|=6,\quad \sphericalangle DAB = 60^\circ,\quad x=\frac{16-6}{2}'
  solution: |-
    Z wierzchołków C i D prowadzimy wysokości na podstawę AB; ich spodki dzielą AB na trzy odcinki o długościach x, 6, x, przy czym 2x + 6 = 16, więc x = 5.
    Powstał trójkąt prostokątny o kącie ostrym 60° przy wierzchołku A, w którym odcinek x = 5 leży PRZY tym kącie, wysokość h leży NAPRZECIW niego, a ramię AD jest przeciwprostokątną.
    Wysokość: tg 60° = h/5, więc h = 5·√3 = 5√3.
    Ramię: cos 60° = 5/|AD|, czyli 1/2 = 5/|AD|, stąd |AD| = 10 (szukana wielkość stoi w mianowniku, więc dzielimy: |AD| = 5 : (1/2)).
    Kontrola twierdzeniem Pitagorasa: 5² + (5√3)² = 25 + 75 = 100 = 10². ✓
    Pole: P = ((16 + 6)/2)·5√3 = 11·5√3 = 55√3 ≈ 95,3.
    Odpowiedź: wysokość 5√3, ramię 10, pole 55√3.
  solution_steps:
  - 'Poprowadź obie wysokości z końców krótszej podstawy: 2x + 6 = 16, więc x = 5.'
  - 'W powstałym trójkącie prostokątnym: x = 5 leży przy kącie 60°, h naprzeciw, ramię to przeciwprostokątna.'
  - tg 60° = h/5, więc h = 5√3.
  - 'cos 60° = 5/|AD|, więc |AD| = 5 : (1/2) = 10.'
  - P = ((16+6)/2)·5√3 = 55√3.
  answer:
    kind: MULTIPART
    parts:
    - name: wysokosc
      answer:
        kind: SYMBOLIC
        latex: 5\sqrt{3}
    - name: ramie_AD
      answer:
        kind: NUMERIC
        value: 10.0
    - name: pole
      answer:
        kind: SYMBOLIC
        latex: 55\sqrt{3}
  checks:
  - kind: evaluate
    expr: \frac{16-6}{2}\cdot\sqrt{3}
    part: wysokosc
  - kind: evaluate
    expr: \frac{\frac{16-6}{2}}{\frac{1}{2}}
    part: ramie_AD
  - kind: evaluate
    expr: \frac{16+6}{2}\cdot 5\sqrt{3}
    part: pole
  skills:
  - rozbijanie figury na trójkąty prostokątne
  - dokładne wartości funkcji dla 60°
  - obliczanie pola trapezu
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: rozwiązywanie trójkąta prostokątnego z danej wartości funkcji
  statement: Dany jest trójkąt prostokątny ABC, w którym kąt przy wierzchołku C jest prosty, |AC| = 9,
    a sinus kąta ABC jest równy \frac{3}{5}. Punkt D jest spodkiem wysokości poprowadzonej z wierzchołka
    C na przeciwprostokątną AB. Oblicz długość przeciwprostokątnej AB, długość przyprostokątnej BC, pole
    trójkąta ABC oraz długość odcinka CD.
  statement_latex: \sin\left(\sphericalangle ABC\right)=\frac{|AC|}{|AB|}=\frac{3}{5},\qquad |AC|=9
  solution: |-
    1) Względem kąta ABC bok AC leży NAPRZECIW, a AB jest przeciwprostokątną, więc sin(ABC) = |AC| : |AB|.
     Stąd 3/5 = 9/|AB|, a ponieważ szukana wielkość stoi w mianowniku: |AB| = 9 : (3/5) = 9·(5/3) = 15.
     Kontrola: przeciwprostokątna wyszła dłuższa niż 9. ✓
    2) Druga przyprostokątna z twierdzenia Pitagorasa: |BC|² = 15² − 9² = 225 − 81 = 144, więc |BC| = 12.
    3) Pole: P = ½·|AC|·|BC| = ½·9·12 = 54.
    4) Wysokość na przeciwprostokątną z zależności a·b = c·h: 9·12 = 15·|CD|, więc |CD| = 108/15 = 7,2.
     Kontrola: 7,2 < 9 < 12 < 15 — wysokość jest krótsza od obu przyprostokątnych. ✓
    Odpowiedź: |AB| = 15, |BC| = 12, P = 54, |CD| = 7,2.
  solution_steps:
  - Zapisz sin(ABC) = |AC|/|AB| = 3/5, czyli 3/5 = 9/|AB|.
  - 'Wyznacz |AB| = 9 : (3/5) = 15.'
  - Z twierdzenia Pitagorasa |BC| = √(225 − 81) = 12.
  - Pole P = ½·9·12 = 54.
  - 'Z zależności a·b = c·h: |CD| = (9·12)/15 = 7,2.'
  answer:
    kind: MULTIPART
    parts:
    - name: AB
      answer:
        kind: NUMERIC
        value: 15.0
    - name: BC
      answer:
        kind: NUMERIC
        value: 12.0
    - name: pole
      answer:
        kind: NUMERIC
        value: 54.0
    - name: CD
