- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie: wzór na sumę z dziedziną oraz ograniczenie zewnętrzne'
  statement: |-
    Rury składuje się w stos ułożony warstwami: w najniższej warstwie leży 30 rur, a w każdej kolejnej warstwie leży o jedną rurę mniej niż w warstwie leżącej bezpośrednio pod nią. Stos uznaje się za prawidłowy tylko wtedy, gdy jego najwyższa warstwa zawiera co najmniej 5 rur. Niech n oznacza liczbę warstw stosu (n jest liczbą naturalną, n \geq 1).
    a) Wyznacz wzór na łączną liczbę rur w stosie złożonym z n warstw oraz podaj wszystkie wartości n, dla których stos jest prawidłowy.
    b) Do magazynu dostarczono 400 rur. Oblicz największą liczbę warstw prawidłowego stosu, jaki można ułożyć z tych rur.
    Zapisz obliczenia.
  statement_latex: S_{n} = \frac{2\cdot 30 + \left(n - 1\right)\cdot\left(-1\right)}{2}\cdot n = \frac{\left(61
    - n\right)\cdot n}{2}, \qquad S_{n} \leq 400
  solution: |-
    a) 1) Liczby rur w kolejnych warstwach (od dołu) tworzą ciąg arytmetyczny o a_{1} = 30 i r = -1, więc liczba rur w n-tej warstwie to a_{n} = 30 + \left(n - 1\right)\cdot\left(-1\right) = 31 - n.
    2) Łączna liczba rur: S_{n} = \frac{2\cdot 30 + \left(n - 1\right)\cdot\left(-1\right)}{2}\cdot n = \frac{61 - n}{2}\cdot n = \frac{\left(61 - n\right)\cdot n}{2}.
    3) Warunek prawidłowości: najwyższa warstwa ma a_{n} = 31 - n rur, więc 31 - n \geq 5, czyli n \leq 26. Zatem n \in \left\{1, 2, \dots, 26\right\}.
    b) 4) Warunek na liczbę rur: \frac{\left(61 - n\right)\cdot n}{2} \leq 400, czyli 61n - n^{2} \leq 800, a stąd n^{2} - 61n + 800 \geq 0.
    5) \Delta = 61^{2} - 4\cdot 800 = 3721 - 3200 = 521, \sqrt{521} \approx 22{,}83, więc pierwiastki to n = \frac{61 - \sqrt{521}}{2} \approx 19{,}09 oraz n = \frac{61 + \sqrt{521}}{2} \approx 41{,}91.
    6) Nierówność jest spełniona dla n \leq 19{,}09 lub n \geq 41{,}91; z dziedziny n \leq 26 pozostaje n \leq 19{,}09, czyli n \leq 19.
    7) Sprawdzenie wykonalności: S_{19} = \frac{\left(61 - 19\right)\cdot 19}{2} = \frac{42\cdot 19}{2} = 399 \leq 400, natomiast S_{20} = \frac{41\cdot 20}{2} = 410 > 400. Ponadto 19 \leq 26, więc taki stos jest prawidłowy.
    Odpowiedź: a) S_{n} = \frac{\left(61 - n\right)\cdot n}{2} dla n \in \left\{1, 2, \dots, 26\right\}; b) największa liczba warstw to 19 (zużyto 399 rur).
