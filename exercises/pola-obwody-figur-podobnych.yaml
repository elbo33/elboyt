    note: '[whole] SymPy solved it fresh: 50.0 vs 50.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: wyznaczanie skali ze stosunku pól
  statement: Trójkąt KLM jest podobny do trójkąta ABC. Pole trójkąta ABC jest równe 9 cm², a pole trójkąta
    KLM jest równe 49 cm². Wyznacz skalę podobieństwa trójkąta KLM do trójkąta ABC. Zapisz obliczenia.
  statement_latex: k=\sqrt{\frac{P(KLM)}{P(ABC)}}=\sqrt{\frac{49}{9}}
  solution: |-
    Stosunek pól figur podobnych jest równy kwadratowi skali: \frac{P(KLM)}{P(ABC)} = k^{2}.
    Stąd k^{2} = \frac{49}{9}, a ponieważ k > 0, mamy k = \sqrt{\frac{49}{9}} = \frac{7}{3}.
    Sprawdzenie: \left(\frac{7}{3}\right)^{2} = \frac{49}{9}. Zgadza się.
    Odpowiedź: k = \frac{7}{3}.
  solution_steps:
  - 'Zapisz stosunek pól: P(KLM)/P(ABC) = 49/9.'
  - Skorzystaj z zależności P'/P = k².
  - Wyznacz k = √(49/9) = 7/3 (bierzemy pierwiastek arytmetyczny, bo k > 0).
  answer:
    kind: SYMBOLIC
    latex: \frac{7}{3}
  checks:
  - kind: evaluate
    expr: \sqrt{\frac{49}{9}}
  skills:
  - wyznaczanie skali ze stosunku pól
  - pierwiastkowanie ułamka
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 2.3333333333333335 vs 2.3333333333333335 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: obwód i pole trójkąta podobnego
  statement: Trójkąty prostokątne T_{1} i T_{2} są podobne. Przyprostokątne trójkąta T_{1} mają długości
    6 cm i 8 cm. Przeciwprostokątna trójkąta T_{2} ma długość 15 cm. Oblicz obwód oraz pole trójkąta T_{2}.
    Zapisz obliczenia.
  statement_latex: k=\frac{15}{10},\qquad \mathrm{Obw}(T_{2})=k\cdot\left(6+8+10\right),\qquad P(T_{2})=k^{2}\cdot\frac{1}{2}\cdot
    6\cdot 8
  solution: |-
    Z twierdzenia Pitagorasa przeciwprostokątna trójkąta T_{1} ma długość \sqrt{6^{2}+8^{2}} = \sqrt{100} = 10 cm.
    Przeciwprostokątne odpowiadają sobie, więc skala podobieństwa trójkąta T_{2} do trójkąta T_{1} wynosi k = \frac{15}{10} = \frac{3}{2}.
    Obwód trójkąta T_{1}: 6 + 8 + 10 = 24 cm, więc Obw(T_{2}) = \frac{3}{2}\cdot 24 = 36 cm.
    Pole trójkąta T_{1}: \frac{1}{2}\cdot 6\cdot 8 = 24 cm², więc P(T_{2}) = \left(\frac{3}{2}\right)^{2}\cdot 24 = \frac{9}{4}\cdot 24 = 54 cm².
    Sprawdzenie: przyprostokątne T_{2} to 9 cm i 12 cm, obwód 9 + 12 + 15 = 36 cm, pole \frac{1}{2}\cdot 9\cdot 12 = 54 cm². Zgadza się.
    Odpowiedź: obwód 36 cm, pole 54 cm².
  solution_steps:
  - 'Oblicz przeciwprostokątną T₁: √(6²+8²) = 10 cm.'
  - Wyznacz skalę k = 15/10 = 3/2 (od T₁ do T₂).
  - 'Oblicz obwód T₁ = 24 cm i pomnóż przez k: 36 cm.'
  - 'Oblicz pole T₁ = 24 cm² i pomnóż przez k² = 9/4: 54 cm².'
  - 'Sprawdź wynik, wyznaczając boki T₂: 9, 12, 15.'
  answer:
    kind: MULTIPART
    parts:
    - name: obwod
      answer:
        kind: NUMERIC
        value: 36.0
        latex: 36\ \text{cm}
    - name: pole
      answer:
        kind: NUMERIC
        value: 54.0
        latex: 54\ \text{cm}^{2}
  checks:
  - kind: evaluate
    expr: \frac{15}{10}\cdot\left(6+8+10\right)
    part: obwod
  - kind: evaluate
    expr: \left(\frac{15}{10}\right)^{2}\cdot\frac{1}{2}\cdot 6\cdot 8
    part: pole
  skills:
  - wyznaczanie skali podobieństwa
  - obliczanie obwodu i pola figury podobnej
  - twierdzenie Pitagorasa
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [obwod] SymPy solved it fresh: 36.0 vs 36.0 (tol 1e-09) ; [pole]
