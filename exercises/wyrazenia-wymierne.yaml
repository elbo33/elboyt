- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: mnożenie wyrażeń wymiernych z dziedziną
  statement: Dane jest wyrażenie \frac{x^{2}-6\cdot x+9}{2\cdot x+8}\cdot\frac{x^{2}-16}{3\cdot x-9}.
    Wypisz wszystkie liczby rzeczywiste, które nie należą do dziedziny tego wyrażenia, a następnie wykonaj
    mnożenie i podaj wynik w najprostszej postaci.
  statement_latex: \frac{x^{2}-6\cdot x+9}{2\cdot x+8}\cdot\frac{x^{2}-16}{3\cdot x-9}
  solution: |-
    1) Rozkłady na czynniki: x^{2}-6\cdot x+9 = \left(x-3\right)^{2}; 2\cdot x+8 = 2\cdot\left(x+4\right); x^{2}-16 = \left(x-4\right)\cdot\left(x+4\right); 3\cdot x-9 = 3\cdot\left(x-3\right).
    2) Dziedzina: 2\cdot\left(x+4\right)\neq 0 \Rightarrow x\neq -4 oraz 3\cdot\left(x-3\right)\neq 0 \Rightarrow x\neq 3. Zatem D = \mathbb{R}\setminus\{-4,\ 3\}, liczby wykluczone: -4 i 3.
    3) Zapisujemy jeden ułamek (bez wymnażania nawiasów):
    \frac{\left(x-3\right)\cdot\left(x-3\right)\cdot\left(x-4\right)\cdot\left(x+4\right)}{2\cdot\left(x+4\right)\cdot 3\cdot\left(x-3\right)}.
    4) Skracamy \left(x+4\right) oraz jeden czynnik \left(x-3\right):
    = \frac{\left(x-3\right)\cdot\left(x-4\right)}{6}.
    Odpowiedź: \frac{\left(x-3\right)\cdot\left(x-4\right)}{6} dla x\in\mathbb{R}\setminus\{-4,\ 3\}.
  solution_steps:
  - Rozłóż na czynniki wszystkie liczniki i mianowniki.
  - 'Z warunków 2\cdot\left(x+4\right)\neq 0 i 3\cdot\left(x-3\right)\neq 0 odczytaj liczby wykluczone:
    -4 i 3.'
  - Zapisz iloczyn jako jeden ułamek, nie wymnażając nawiasów.
  - Skróć wspólne czynniki \left(x+4\right) i \left(x-3\right).
  - Zapisz wynik \frac{\left(x-3\right)\cdot\left(x-4\right)}{6}.
  answer:
    kind: MULTIPART
    parts:
    - name: liczby wykluczone z dziedziny
      answer:
        kind: SET
        members:
        - '-4'
        - '3'
    - name: postać uproszczona
      answer:
        kind: SYMBOLIC
        latex: \frac{\left(x-3\right)\cdot\left(x-4\right)}{6}
  checks:
  - kind: solve_equation
    expr: \left(2\cdot x+8\right)\cdot\left(3\cdot x-9\right) = 0
    part: liczby wykluczone z dziedziny
  - kind: simplify
    expr: \frac{x^{2}-6\cdot x+9}{2\cdot x+8}\cdot\frac{x^{2}-16}{3\cdot x-9}
    part: postać uproszczona
  skills:
  - wzory skróconego mnożenia
  - wyłączanie wspólnego czynnika
  - mnożenie i skracanie wyrażeń wymiernych
  - wyznaczanie dziedziny
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [liczby wykluczone z dziedziny] SymPy solved it fresh: 2 members
      matched ; [postać uproszczona] SymPy solved it fresh: ''\\frac{\\left(x-3\\right)\\cdot\\left(x-4\\right)}{6}''
      vs ''x**2/6 - 7*x/6 + 2'''
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: dzielenie wyrażeń wymiernych, dziedzina i wartość
  statement: Dane jest wyrażenie W\left(x\right)=\dfrac{\frac{x^{3}-9\cdot x}{x^{2}-2\cdot x-8}}{\frac{x^{2}+3\cdot
    x}{3\cdot x-12}}. Wypisz wszystkie liczby rzeczywiste, które nie należą do dziedziny tego wyrażenia,
    doprowadź je do najprostszej postaci i oblicz W\left(2\right).
  statement_latex: W\left(x\right)=\dfrac{\frac{x^{3}-9\cdot x}{x^{2}-2\cdot x-8}}{\frac{x^{2}+3\cdot
    x}{3\cdot x-12}}
  solution: |-
    1) Rozkłady na czynniki:
     x^{3}-9\cdot x = x\cdot\left(x-3\right)\cdot\left(x+3\right),
     x^{2}-2\cdot x-8: \Delta = 4+32 = 36, \sqrt{\Delta}=6, x_{1}=-2, x_{2}=4, więc x^{2}-2\cdot x-8 = \left(x+2\right)\cdot\left(x-4\right),
     x^{2}+3\cdot x = x\cdot\left(x+3\right),
     3\cdot x-12 = 3\cdot\left(x-4\right).
    2) Założenia:
     \left(x+2\right)\cdot\left(x-4\right)\neq 0 \Rightarrow x\neq -2 i x\neq 4,
     3\cdot\left(x-4\right)\neq 0 \Rightarrow x\neq 4,
     dzielnik różny od zera: x\cdot\left(x+3\right)\neq 0 \Rightarrow x\neq 0 i x\neq -3.
     Zatem D = \mathbb{R}\setminus\{-3,\ -2,\ 0,\ 4\}.
    3) Zamieniamy dzielenie na mnożenie przez odwrotność dzielnika:
    W\left(x\right)=\frac{x\cdot\left(x-3\right)\cdot\left(x+3\right)}{\left(x+2\right)\cdot\left(x-4\right)}\cdot\frac{3\cdot\left(x-4\right)}{x\cdot\left(x+3\right)}.
    4) Skracamy x, \left(x+3\right) oraz \left(x-4\right):
    W\left(x\right)=\frac{3\cdot\left(x-3\right)}{x+2}.
    5) Liczba 2 należy do dziedziny, więc W\left(2\right)=\frac{3\cdot\left(2-3\right)}{2+2}=-\frac{3}{4}.
    Odpowiedź: liczby wykluczone: -3, -2, 0, 4; W\left(x\right)=\frac{3\cdot\left(x-3\right)}{x+2}; W\left(2\right)=-\frac{3}{4}.
  solution_steps:
  - Rozłóż na czynniki wszystkie cztery wielomiany.
  - 'Zapisz trzy grupy warunków: mianownik dzielnej, mianownik dzielnika i licznik dzielnika różne od
    zera.'
  - 'Odczytaj liczby wykluczone: -3, -2, 0, 4.'
  - Zamień dzielenie na mnożenie przez odwrotność dolnego ułamka.
  - Skróć czynniki x, \left(x+3\right), \left(x-4\right) i zapisz W\left(x\right)=\frac{3\cdot\left(x-3\right)}{x+2}.
  - Sprawdź, że 2\in D, i oblicz W\left(2\right)=-\frac{3}{4}.
  answer:
    kind: MULTIPART
    parts:
    - name: liczby wykluczone z dziedziny
      answer:
        kind: SET
        members:
        - '-3'
        - '-2'
        - '0'
        - '4'
    - name: postać uproszczona
      answer:
        kind: SYMBOLIC
        latex: \frac{3\cdot\left(x-3\right)}{x+2}
    - name: W(2)
      answer:
        kind: NUMERIC
        value: -0.75
  checks:
  - kind: solve_equation
    expr: \left(x^{2}-2\cdot x-8\right)\cdot\left(3\cdot x-12\right)\cdot\left(x^{2}+3\cdot x\right) =
      0
    part: liczby wykluczone z dziedziny
  - kind: simplify
    expr: \frac{\frac{x^{3}-9\cdot x}{x^{2}-2\cdot x-8}}{\frac{x^{2}+3\cdot x}{3\cdot x-12}}
    part: postać uproszczona
  - kind: evaluate
    expr: \frac{3\cdot\left(2-3\right)}{2+2}
    part: W(2)
  skills:
  - rozkład wielomianu na czynniki
  - dzielenie wyrażeń wymiernych
  - warunek dzielnik ≠ 0
  - obliczanie wartości wyrażenia
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [liczby wykluczone z dziedziny] SymPy solved it fresh: 4 members
      matched ; [postać uproszczona] SymPy solved it fresh: ''\\frac{3\\cdot\\left(x-3\\right)}{x+2}''
      vs ''3*(x - 3)/(x + 2)'' ; [W(2)] SymPy solved it fresh: -0.75 vs -0.75 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: dzielenie wyrażeń wymiernych z dziedziną i wartością
  statement: 'Dane jest wyrażenie W\left(x\right) = \frac{x^{2}-25}{x^{2}+2\cdot x} : \frac{2\cdot x-10}{x^{2}-4}.
    Wyznacz dziedzinę tego wyrażenia, zapisz je w najprostszej postaci i oblicz W\left(3\right).'
  statement_latex: 'W\left(x\right) = \frac{x^{2}-25}{x^{2}+2\cdot x} : \frac{2\cdot x-10}{x^{2}-4}'
  solution: |-
    1) Rozkładamy na czynniki wszystkie liczniki i mianowniki:
    x^{2}-25=\left(x-5\right)\left(x+5\right),\quad x^{2}+2x=x\left(x+2\right),\quad 2x-10=2\left(x-5\right),\quad x^{2}-4=\left(x-2\right)\left(x+2\right).
    2) Założenia (dziedzina):
     • mianownik dzielnej: x\left(x+2\right)\neq 0 \Rightarrow x\neq 0 i x\neq -2,
     • mianownik dzielnika: \left(x-2\right)\left(x+2\right)\neq 0 \Rightarrow x\neq 2 i x\neq -2,
     • dzielnik różny od zera: 2\left(x-5\right)\neq 0 \Rightarrow x\neq 5.
    Zatem D = \mathbb{R}\setminus\{-2,\,0,\,2,\,5\}.
    3) Dzielenie zamieniamy na mnożenie przez odwrotność dzielnika:
    W(x)=\frac{\left(x-5\right)\left(x+5\right)}{x\left(x+2\right)}\cdot\frac{\left(x-2\right)\left(x+2\right)}{2\left(x-5\right)}.
    4) Nie wymnażamy nawiasów — skracamy czynniki \left(x-5\right) oraz \left(x+2\right) (są niezerowe na mocy założeń):
    W(x)=\frac{\left(x+5\right)\left(x-2\right)}{2x}.
    5) Liczba 3 należy do dziedziny, więc
    W(3)=\frac{\left(3+5\right)\left(3-2\right)}{2\cdot 3}=\frac{8}{6}=\frac{4}{3}.
    Odpowiedź: D=\mathbb{R}\setminus\{-2,0,2,5\}, W(x)=\frac{\left(x+5\right)\left(x-2\right)}{2x}, W(3)=\frac{4}{3}.
  solution_steps:
  - 'Rozłóż na czynniki: x^{2}-25=(x-5)(x+5), x^{2}+2x=x(x+2), 2x-10=2(x-5), x^{2}-4=(x-2)(x+2).'
  - 'Zapisz założenia: x(x+2)\neq 0, (x-2)(x+2)\neq 0 oraz 2(x-5)\neq 0 (dzielnik \neq 0).'
  - 'Zapisz dziedzinę: D=\mathbb{R}\setminus\{-2,0,2,5\}.'
  - Zamień dzielenie na mnożenie przez odwrotność dzielnika.
  - 'Skróć czynniki (x-5) i (x+2); wynik: \frac{(x+5)(x-2)}{2x}.'
  - 'Sprawdź, że 3\in D i podstaw: W(3)=\frac{8\cdot 1}{6}=\frac{4}{3}.'
  answer:
    kind: MULTIPART
    parts:
    - name: liczby_wykluczone_z_dziedziny
      answer:
        kind: SET
        members:
        - '-2'
        - '0'
        - '2'
        - '5'
    - name: postac_uproszczona
      answer:
        kind: SYMBOLIC
        latex: \frac{\left(x+5\right)\cdot\left(x-2\right)}{2\cdot x}
    - name: W_3
      answer:
        kind: NUMERIC
        value: 1.3333333333333333
  checks:
  - kind: solve_equation
    expr: x\cdot\left(x+2\right)\cdot\left(x-2\right)\cdot\left(x-5\right)=0
    part: liczby_wykluczone_z_dziedziny
  - kind: simplify
    expr: \frac{\frac{x^{2}-25}{x^{2}+2\cdot x}}{\frac{2\cdot x-10}{x^{2}-4}}
    part: postac_uproszczona
  - kind: evaluate
    expr: \frac{\frac{3^{2}-25}{3^{2}+2\cdot 3}}{\frac{2\cdot 3-10}{3^{2}-4}}
    part: W_3
  skills:
  - rozkład wielomianu na czynniki
  - wyznaczanie dziedziny wyrażenia wymiernego
  - warunek dzielnik ≠ 0
  - dzielenie wyrażeń wymiernych
  - obliczanie wartości wyrażenia
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [liczby_wykluczone_z_dziedziny] SymPy solved it fresh: 4 members
      matched ; [postac_uproszczona] SymPy solved it fresh: ''\\frac{\\left(x+5\\right)\\cdot\\left(x-2\\right)}{2\\cdot
      x}'' vs ''x/2 + 3/2 - 5/x'' ; [W_3] SymPy solved it fresh: 1.3333333333333333 vs 1.3333333333333333
      (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: 'ułamek piętrowy: dziedzina, uproszczenie, równanie'
  statement: Dane jest wyrażenie W\left(x\right) = \dfrac{\frac{9-x^{2}}{x^{2}-6\cdot x+9}}{\frac{x^{2}+3\cdot
    x}{2\cdot x-6}}. Wyznacz dziedzinę tego wyrażenia, doprowadź je do najprostszej postaci, a następnie
    wyznacz wszystkie liczby x z dziedziny, dla których W\left(x\right) = -1.
  statement_latex: W\left(x\right) = \dfrac{\frac{9-x^{2}}{x^{2}-6\cdot x+9}}{\frac{x^{2}+3\cdot x}{2\cdot
    x-6}}
  solution: |-
    1) Rozkłady na czynniki:
    9-x^{2}=\left(3-x\right)\left(3+x\right)=-\left(x-3\right)\left(x+3\right),\quad x^{2}-6x+9=\left(x-3\right)^{2},\quad x^{2}+3x=x\left(x+3\right),\quad 2x-6=2\left(x-3\right).
    2) Ułamek piętrowy to dzielenie: \frac{9-x^{2}}{x^{2}-6x+9} : \frac{x^{2}+3x}{2x-6}. Założenia:
     • \left(x-3\right)^{2}\neq 0 \Rightarrow x\neq 3,
     • 2\left(x-3\right)\neq 0 \Rightarrow x\neq 3,
     • licznik dzielnika \neq 0: x\left(x+3\right)\neq 0 \Rightarrow x\neq 0 i x\neq -3.
    Zatem D=\mathbb{R}\setminus\{-3,\,0,\,3\}.
    3) Mnożymy przez odwrotność dzielnika:
    W(x)=\frac{-\left(x-3\right)\left(x+3\right)}{\left(x-3\right)^{2}}\cdot\frac{2\left(x-3\right)}{x\left(x+3\right)}=\frac{-2\left(x-3\right)^{2}\left(x+3\right)}{\left(x-3\right)^{2}\cdot x\left(x+3\right)}.
    4) Skracamy \left(x-3\right)^{2} oraz \left(x+3\right):
    W(x)=-\frac{2}{x}.
    5) Równanie: -\frac{2}{x}=-1 \Rightarrow \frac{2}{x}=1 \Rightarrow x=2. Liczba 2 należy do dziedziny, więc jest rozwiązaniem.
    Odpowiedź: D=\mathbb{R}\setminus\{-3,0,3\}, W(x)=-\frac{2}{x}, W(x)=-1 dla x=2.
  solution_steps:
