    GDZIE JEST BŁĄD: własność „iloczyn równy zeru” działa wyłącznie wtedy, gdy po drugiej stronie stoi \(0\). Liczbę 6 można rozłożyć na iloczyn na nieskończenie wiele sposobów, więc z równości iloczynu i szóstki nic o czynnikach nie wynika.
    Sprawdzenie: dla \(x=7\) mamy \(\left(7-1\right)\cdot\left(7+4\right)=6\cdot 11=66\neq 6\).

