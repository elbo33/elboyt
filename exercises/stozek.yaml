  statement: Promień podstawy stożka obrotowego jest równy 4, a tworząca tego stożka jest nachylona do
    płaszczyzny podstawy pod kątem 60^\circ. Uczeń zapisał \operatorname{tg} 60^\circ = \frac{r}{H} i
    stąd wyznaczył wysokość H = \frac{4}{\sqrt{3}}. Wyjaśnij błąd i oblicz poprawną objętość stożka.
  statement_latex: r=4,\quad \beta=60^\circ,\quad \operatorname{tg}\beta=\frac{H}{r}
  solution: |-
    Błędne rozumowanie: uczeń przyjął \operatorname{tg}\beta = \frac{r}{H}, czyli traktował \beta tak, jakby był kątem przy wierzchołku (między osią a tworzącą). Otrzymał H = \frac{4}{\sqrt{3}} = \frac{4\sqrt{3}}{3} i objętość \frac{1}{3}\pi\cdot 16\cdot\frac{4\sqrt{3}}{3} = \frac{64\sqrt{3}}{9}\pi.
    Dlaczego to źle: kąt \beta leży PRZY PODSTAWIE trójkąta prostokątnego o bokach r, H, l. Przyprostokątna przyległa do \beta to r, a naprzeciw leży H, więc \operatorname{tg}\beta = \frac{H}{r}. Zauważ też, że dla \beta = 60^\circ musi być H > r, a wynik ucznia daje H < r.
    Poprawnie: H = r\cdot\operatorname{tg} 60^\circ = 4\sqrt{3}.
    V = \frac{1}{3}\pi r^2 H = \frac{1}{3}\cdot\pi\cdot 16\cdot 4\sqrt{3} = \frac{64\sqrt{3}}{3}\pi.
