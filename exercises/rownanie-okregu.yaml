- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: okrąg zadany średnicą i położenie punktów
  statement: W kartezjańskim układzie współrzędnych (x, y) punkty A=\left(-2,-1\right) oraz B=\left(6,5\right)
    są końcami średnicy okręgu O. a) Wyznacz promień okręgu O i zapisz jego równanie. b) Rozstrzygnij
    dla każdego z punktów C=\left(5,6\right), D=\left(-1,5\right), E=\left(6,-3\right), czy leży on na
    okręgu O, wewnątrz niego, czy na zewnątrz.
  statement_latex: S=\left(\frac{-2+6}{2},\ \frac{-1+5}{2}\right),\qquad r=\frac{1}{2}\cdot\left|AB\right|
  solution: |-
    a) Środkiem okręgu jest środek średnicy AB:
    S=\left(\frac{-2+6}{2},\frac{-1+5}{2}\right)=\left(2,2\right).
    Promień to połowa długości średnicy:
    \left|AB\right|=\sqrt{\left(6+2\right)^2+\left(5+1\right)^2}=\sqrt{64+36}=\sqrt{100}=10, więc r=\frac{10}{2}=5.
    (Kontrola: r^2=\left(-2-2\right)^2+\left(-1-2\right)^2=16+9=25.)
    Równanie okręgu: \left(x-2\right)^2+\left(y-2\right)^2=25.

    b) Liczymy L=\left(x_0-2\right)^2+\left(y_0-2\right)^2 i porównujemy z r^2=25.
    C=\left(5,6\right): L=\left(5-2\right)^2+\left(6-2\right)^2=9+16=25=r^2 — punkt leży na okręgu.
    D=\left(-1,5\right): L=\left(-1-2\right)^2+\left(5-2\right)^2=9+9=18<25 — punkt leży wewnątrz okręgu.
    E=\left(6,-3\right): L=\left(6-2\right)^2+\left(-3-2\right)^2=16+25=41>25 — punkt leży na zewnątrz okręgu.
  solution_steps:
  - 'Wyznacz środek okręgu jako środek odcinka AB: S=\left(2,2\right).'
  - Oblicz \left|AB\right|=\sqrt{\left(6+2\right)^2+\left(5+1\right)^2}=10 i promień r=\frac{10}{2}=5.
  - 'Zapisz równanie: \left(x-2\right)^2+\left(y-2\right)^2=25.'
  - 'Dla C: L=9+16=25=r^2 — punkt na okręgu.'
  - 'Dla D: L=9+9=18<25 — punkt wewnątrz.'
  - 'Dla E: L=16+25=41>25 — punkt na zewnątrz.'
  answer:
    kind: MULTIPART
    parts:
    - name: promien
      answer:
        kind: NUMERIC
        value: 5.0
        latex: '5'
    - name: rownanie
      answer:
        kind: SYMBOLIC
        latex: \left(x-2\right)^2+\left(y-2\right)^2=25
    - name: polozenie_C
      answer:
        kind: SYMBOLIC
        latex: na okręgu
    - name: polozenie_D
      answer:
        kind: SYMBOLIC
        latex: wewnątrz
    - name: polozenie_E
      answer:
        kind: SYMBOLIC
        latex: na zewnątrz
  checks:
  - kind: evaluate
    expr: \frac{\sqrt{\left(6+2\right)^2+\left(5+1\right)^2}}{2}
    part: promien
  skills:
