- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: trygonometria w przekroju osiowym + siatka
  statement: Tworząca stożka obrotowego ma długość 12 i jest nachylona do płaszczyzny podstawy pod kątem
    60^\circ. Oblicz objętość tego stożka, pole jego powierzchni całkowitej oraz miarę kąta środkowego
    wycinka koła, który jest rozwinięciem powierzchni bocznej tego stożka. Zapisz obliczenia.
  statement_latex: l=12,\quad \beta=60^\circ,\quad r=l\cdot\cos\beta,\quad H=l\cdot\sin\beta,\quad \varphi=360^\circ\cdot\frac{r}{l}
  solution: |-
    W przekroju osiowym (trójkąt równoramienny o ramionach l i podstawie 2r) wysokość H dzieli go na dwa trójkąty prostokątne o bokach r, H, l; kąt przy podstawie to \beta = 60^\circ.
    r = l\cdot\cos 60^\circ = 12\cdot\frac{1}{2} = 6,
    H = l\cdot\sin 60^\circ = 12\cdot\frac{\sqrt{3}}{2} = 6\sqrt{3}.
    Sprawdzenie: r^2 + H^2 = 36 + 108 = 144 = l^2. ✓
    Objętość: V = \frac{1}{3}\pi r^2 H = \frac{1}{3}\cdot\pi\cdot 36\cdot 6\sqrt{3} = 72\sqrt{3}\pi.
    Pole całkowite: P_c = \pi r(r+l) = \pi\cdot 6\cdot(6+12) = 108\pi.
    Kąt wycinka: \varphi = 360^\circ\cdot\frac{r}{l} = 360^\circ\cdot\frac{6}{12} = 180^\circ.
  solution_steps:
  - W trójkącie prostokątnym o bokach r, H, l kąt przy podstawie wynosi 60^\circ.
  - Oblicz r = 12\cdot\cos 60^\circ = 6 oraz H = 12\cdot\sin 60^\circ = 6\sqrt{3}.
  - Oblicz V = \frac{1}{3}\cdot\pi\cdot 6^2\cdot 6\sqrt{3} = 72\sqrt{3}\pi.
  - Oblicz P_c = \pi\cdot 6\cdot\left(6+12\right) = 108\pi.
  - Oblicz \varphi = 360^\circ\cdot\frac{6}{12} = 180^\circ.
  answer:
    kind: MULTIPART
    parts:
    - name: objętość
      answer:
        kind: SYMBOLIC
        latex: 72\sqrt{3}\pi
    - name: pole powierzchni całkowitej
      answer:
        kind: SYMBOLIC
        latex: 108\pi
    - name: kąt środkowy wycinka
      answer:
        kind: NUMERIC
        value: 180.0
  checks:
  - kind: evaluate
    expr: \frac{1}{3}\cdot\pi\cdot 6^2\cdot 6\cdot\sqrt{3}
    part: objętość
  - kind: evaluate
    expr: \pi\cdot 6\cdot\left(6+12\right)
    part: pole powierzchni całkowitej
  - kind: evaluate
    expr: 360\cdot\frac{6}{12}
    part: kąt środkowy wycinka
  skills:
  - r=l cos beta, H=l sin beta
  - objętość i pole całkowite
  - kąt środkowy wycinka
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
