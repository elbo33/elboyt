- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: porównanie kątów nachylenia w ostrosłupie prawidłowym
  statement: W ostrosłupie prawidłowym czworokątnym ABCDS krawędź podstawy ma długość a = 6, a wysokość
    ostrosłupa ma długość H = 3\sqrt{3}. Oblicz tangens kąta α nachylenia krawędzi bocznej do płaszczyzny
    podstawy, oblicz miarę kąta β nachylenia ściany bocznej do płaszczyzny podstawy oraz uzasadnij, że
    w tym ostrosłupie β > α.
  statement_latex: \operatorname{tg}\alpha=\frac{3\sqrt{3}}{3\sqrt{2}},\qquad \operatorname{tg}\beta=\frac{3\sqrt{3}}{3}
  solution: |-
    Niech O będzie środkiem podstawy, a M — środkiem krawędzi AB. Wtedy R = OA = \frac{a\sqrt{2}}{2} = 3\sqrt{2} oraz r = OM = \frac{a}{2} = 3.
    Kąt α jest kątem SAO w trójkącie prostokątnym SOA (rzutem krawędzi SA na podstawę jest odcinek OA), więc \operatorname{tg}\alpha=\frac{H}{R}=\frac{3\sqrt{3}}{3\sqrt{2}}=\frac{\sqrt{3}}{\sqrt{2}}=\frac{\sqrt{6}}{2}\approx 1{,}2247.
    Kąt β jest kątem SMO w trójkącie prostokątnym SOM, więc \operatorname{tg}\beta=\frac{H}{r}=\frac{3\sqrt{3}}{3}=\sqrt{3}, czyli β = 60°.
    Uzasadnienie: oba kąty są ostre, a funkcja tangens jest rosnąca dla kątów ostrych. Ponieważ r = 3 < 3\sqrt{2} = R oraz obie wysokości są tą samą liczbą H, mamy \operatorname{tg}\beta=\frac{H}{r}>\frac{H}{R}=\operatorname{tg}\alpha (bo \sqrt{3}>\frac{\sqrt{6}}{2}), a zatem β > α.
  solution_steps:
  - Oblicz R = \frac{a\sqrt{2}}{2} = 3\sqrt{2} oraz r = \frac{a}{2} = 3.
  - Wskaż kąt α = ∠SAO i zapisz \operatorname{tg}\alpha=\frac{H}{R}=\frac{3\sqrt{3}}{3\sqrt{2}}=\frac{\sqrt{6}}{2}.
  - Wskaż kąt β = ∠SMO (kąt liniowy kąta dwuściennego) i zapisz \operatorname{tg}\beta=\frac{H}{r}=\sqrt{3}.
  - Odczytaj β = 60°.
  - 'Porównaj: r < R, więc \frac{H}{r}>\frac{H}{R}, a ponieważ tangens jest rosnący dla kątów ostrych,
    β > α.'
  answer:
    kind: MULTIPART
    parts:
    - name: tangens kąta α
      answer:
        kind: SYMBOLIC
        latex: \frac{\sqrt{6}}{2}
    - name: miara kąta β
      answer:
        kind: NUMERIC
        value: 60.0
        tol: 1.0e-06
        latex: 60^\circ
    - name: uzasadnienie nierówności β > α
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma uzasadnić, że skoro r = 3 < R = 3\sqrt{2}, to \operatorname{tg}\beta=\frac{H}{r}>\frac{H}{R}=\operatorname{tg}\alpha,
          a wobec rosnącej monotoniczności tangensa dla kątów ostrych wynika stąd β > α.
  checks:
  - kind: simplify
    expr: \frac{3\sqrt{3}}{3\sqrt{2}}
    part: tangens kąta α
  - kind: evaluate
    expr: \frac{180}{\pi}\cdot\arctan\left(\frac{3\sqrt{3}}{\frac{6}{2}}\right)
    part: miara kąta β
  skills:
  - kąt nachylenia krawędzi bocznej
  - kąt nachylenia ściany bocznej
  - uzasadnianie nierówności między kątami
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie nierówności β > α · 2/2 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: obliczanie kątów w ostrosłupie prawidłowym trójkątnym
  statement: W ostrosłupie prawidłowym trójkątnym ABCS podstawa ABC jest trójkątem równobocznym o boku
    długości 12, a spodek wysokości ostrosłupa pokrywa się ze środkiem O tej podstawy. Ściana boczna jest
    nachylona do płaszczyzny podstawy pod kątem 60°. Oblicz wysokość ostrosłupa, długość krawędzi bocznej
    oraz tangens kąta nachylenia krawędzi bocznej do płaszczyzny podstawy.
  statement_latex: a=12,\qquad \operatorname{tg}60^\circ=\frac{H}{r},\qquad r=\frac{a\cdot\sqrt{3}}{6},\qquad
    R=\frac{a\cdot\sqrt{3}}{3}
  solution: |-
    W podstawie – trójkącie równobocznym o boku a = 12 – promień okręgu wpisanego wynosi r = \frac{12\cdot\sqrt{3}}{6} = 2\sqrt{3}, a promień okręgu opisanego R = \frac{12\cdot\sqrt{3}}{3} = 4\sqrt{3} (czyli R = 2r).

    Kąt nachylenia ściany bocznej do podstawy to kąt między apotemą ostrosłupa a jej rzutem – odcinkiem OM o długości r (M jest środkiem krawędzi podstawy). W trójkącie prostokątnym SOM mamy \operatorname{tg}60^\circ = \frac{H}{r}, więc H = r\cdot\sqrt{3} = 2\sqrt{3}\cdot\sqrt{3} = 6.

    Rzutem krawędzi bocznej SA na podstawę jest odcinek OA o długości R = 4\sqrt{3}. W trójkącie prostokątnym SOA: b = SA = \sqrt{H^{2}+R^{2}} = \sqrt{36+48} = \sqrt{84} = 2\sqrt{21}.

    Kąt α nachylenia krawędzi bocznej do podstawy: \operatorname{tg}\alpha = \frac{H}{R} = \frac{6}{4\sqrt{3}} = \frac{\sqrt{3}}{2} \approx 0{,}8660, czyli α ≈ 40°54'.

    Kontrola: \operatorname{tg}\beta = 2\cdot\operatorname{tg}\alpha, bo \sqrt{3} = 2\cdot\frac{\sqrt{3}}{2}. ✓ Ponadto β = 60° > α, zgodnie z regułą β > α.
  solution_steps:
  - 'Oblicz promienie podstawy: r = \frac{12\cdot\sqrt{3}}{6} = 2\sqrt{3}, R = \frac{12\cdot\sqrt{3}}{3}
    = 4\sqrt{3}.'
  - 'Zaznacz kąt dwuścienny: trójkąt prostokątny SOM o przyprostokątnych r i H.'
  - Z zależności \operatorname{tg}60^\circ = \frac{H}{r} wyznacz H = 2\sqrt{3}\cdot\sqrt{3} = 6.
  - W trójkącie prostokątnym SOA oblicz krawędź boczną b = \sqrt{6^{2}+\left(4\sqrt{3}\right)^{2}} = 2\sqrt{21}.
  - Oblicz \operatorname{tg}\alpha = \frac{H}{R} = \frac{6}{4\sqrt{3}} = \frac{\sqrt{3}}{2} (α ≈ 40°54').
  - 'Sprawdź zgodność: \operatorname{tg}\beta = 2\cdot\operatorname{tg}\alpha oraz β > α.'
  answer:
    kind: MULTIPART
    parts:
    - name: wysokosc_H
      answer:
        kind: NUMERIC
        value: 6.0
    - name: krawedz_boczna
      answer:
        kind: NUMERIC
        value: 9.16515138991168
        tol: 1.0e-06
    - name: tg_alfa
      answer:
        kind: SYMBOLIC
        latex: \frac{\sqrt{3}}{2}
  checks:
  - kind: evaluate
    expr: \frac{12\cdot\sqrt{3}}{6}\cdot\sqrt{3}
    part: wysokosc_H
  - kind: evaluate
    expr: \sqrt{6^{2}+\left(\frac{12\cdot\sqrt{3}}{3}\right)^{2}}
    part: krawedz_boczna
  - kind: evaluate
    expr: \frac{6}{\frac{12\cdot\sqrt{3}}{3}}
    part: tg_alfa
  skills:
  - rozróżnianie promieni r i R w trójkącie równobocznym
  - kąt dwuścienny ściana boczna–podstawa
  - twierdzenie Pitagorasa w bryle
  - tangens kąta ostrego
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [wysokosc_H] SymPy solved it fresh: 6.0 vs 6.0 (tol 1e-09)
      ; [krawedz_boczna] SymPy solved it fresh: 9.16515138991168 vs 9.16515138991168 (tol 1e-06) ; [tg_alfa]
      SymPy solved it fresh: 0.8660254037844386 vs 0.8660254037844386 (tol 1e-09)'
