  - Oblicz \Delta=\left(-4\right)^{2}-4\cdot 2\cdot 5=-24.
  - Z \Delta<0 wynika brak miejsc zerowych, więc postać iloczynowa nie istnieje.
  - Oblicz p=1 oraz q=f(1)=3.
  - Zapisz f(x)=2\left(x-1\right)^{2}+3.
