  exercise_type: Układ z parametrem + rozwiązanie dla konkretnej wartości parametru
  statement: |-
    Dany jest układ równań z parametrem m:
    \[ \left\{ \begin{matrix} m\cdot x + 2y = 4 \\ 2x + m\cdot y = m + 2 \end{matrix} \right. \]
    a) Wyznacz tę wartość parametru m, dla której układ jest nieoznaczony, oraz tę, dla której układ jest sprzeczny.
    b) Rozwiąż ten układ dla m = 0.
    Zapisz obliczenia.
  statement_latex: \left\{ \begin{matrix} m\cdot x + 2\cdot y = 4 \\ 2\cdot x + m\cdot y = m + 2 \end{matrix}
    \right.
  solution: |-
    a) Wyznacznik układu: \(W = m\cdot m - 2\cdot 2 = m^{2} - 4\).
    Dla \(W \neq 0\), czyli dla \(m \neq 2\) i \(m \neq -2\), układ jest oznaczony. Kandydatami na układ nieoznaczony lub sprzeczny są tylko \(m = 2\) oraz \(m = -2\) — każdy z nich trzeba zbadać osobno (samo \(W = 0\) niczego nie rozstrzyga).
    Dla \(m = 2\): \(\left\{ 2x + 2y = 4;\ 2x + 2y = 4 \right\}\). Oba równania są identyczne, po odjęciu stronami otrzymujemy \(0 = 0\) — układ jest NIEOZNACZONY (proste pokrywają się, rozwiązaniem jest każda para postaci \(\left(x,\ 2 - x\right)\)).
    Dla \(m = -2\): \(\left\{ -2x + 2y = 4;\ 2x - 2y = 0 \right\}\). Dodając równania stronami, otrzymujemy \(0 = 4\) — zdanie fałszywe, więc układ jest SPRZECZNY (proste \(y = x + 2\) i \(y = x\) są równoległe i rozłączne).
    b) Dla \(m = 0\) układ ma postać \(\left\{ 2y = 4;\ 2x = 2 \right\}\), zatem \(y = 2\) oraz \(x = 1\).
    Sprawdzenie: \(0\cdot 1 + 2\cdot 2 = 4\) ✓ oraz \(2\cdot 1 + 0\cdot 2 = 2 = 0 + 2\) ✓.
    Odpowiedź: układ jest nieoznaczony dla \(m = 2\), sprzeczny dla \(m = -2\); dla \(m = 0\) rozwiązaniem jest para \(\left(1,\ 2\right)\).
  solution_steps:
  - Obliczam wyznacznik W = m² - 4.
  - 'Rozwiązuję W = 0: m = 2 lub m = -2 — tylko te wartości mogą dawać układ nieoznaczony lub sprzeczny.'
  - 'Podstawiam m = 2: oba równania to 2x + 2y = 4, otrzymuję 0 = 0 — układ nieoznaczony.'
  - 'Podstawiam m = -2: po dodaniu równań stronami otrzymuję 0 = 4 — układ sprzeczny.'
  - 'Podstawiam m = 0: z pierwszego równania y = 2, z drugiego x = 1.'
  - Sprawdzam parę (1, 2) w obu równaniach dla m = 0 i zapisuję odpowiedź.
  answer:
    kind: MULTIPART
    parts:
    - name: m_nieoznaczony
      answer:
        kind: NUMERIC
        value: 2.0
    - name: m_sprzeczny
      answer:
        kind: NUMERIC
        value: -2.0
    - name: x_dla_m0
      answer:
        kind: NUMERIC
        value: 1.0
    - name: y_dla_m0
      answer:
        kind: NUMERIC
        value: 2.0
