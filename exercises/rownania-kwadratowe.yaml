- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: zadanie tekstowe geometryczne prowadzące do równania kwadratowego
  statement: Przekątna pewnego prostokąta ma długość 13, a obwód tego prostokąta jest równy 34. Oblicz
    pole tego prostokąta. Zapisz obliczenia.
  statement_latex: x^{2} + \left(17 - x\right)^{2} = 13^{2}
  solution: |-
    Oznaczmy przez x długość jednego boku prostokąta. Z obwodu 2x + 2y = 34 wynika, że drugi bok ma długość y = 17 - x, przy czym 0 < x < 17.

    Przekątna prostokąta wraz z jego dwoma bokami tworzy trójkąt prostokątny, więc z twierdzenia Pitagorasa:
    x^{2} + \left(17-x\right)^{2} = 13^{2}.
    Po wymnożeniu: x^{2} + 289 - 34x + x^{2} = 169, czyli 2x^{2} - 34x + 120 = 0, a po podzieleniu przez 2:
    x^{2} - 17x + 60 = 0.
    \Delta = \left(-17\right)^{2} - 4\cdot 1\cdot 60 = 289 - 240 = 49, \sqrt{\Delta} = 7.
    x_{1} = \frac{17-7}{2} = 5, \qquad x_{2} = \frac{17+7}{2} = 12.
    Obie liczby należą do przedziału \left(0,\,17\right) i opisują ten sam prostokąt o bokach 5 i 12.

    Pole: P = 5\cdot 12 = 60.

    KRÓTSZA DROGA. Ponieważ x oraz y = 17-x są pierwiastkami równania x^{2}-17x+60=0, to z wzorów Viète'a P = x\cdot y = 60. Można też od razu: \left(x+y\right)^{2} = x^{2}+y^{2}+2xy, czyli 17^{2} = 13^{2} + 2P, skąd P = \frac{289-169}{2} = 60.

    Odpowiedź: pole prostokąta jest równe 60.
  solution_steps:
  - 'Wprowadź zmienną: bok x, drugi bok y = 17 - x (z obwodu 34), przy czym 0 < x < 17.'
  - 'Zapisz twierdzenie Pitagorasa dla przekątnej: x^{2}+\left(17-x\right)^{2} = 169.'
  - 'Uporządkuj do postaci ogólnej: 2x^{2}-34x+120 = 0, czyli x^{2}-17x+60 = 0.'
  - Oblicz \Delta = 49 i pierwiastki x = 5 oraz x = 12 — to długości boków prostokąta.
  - 'Oblicz pole: P = 5\cdot 12 = 60 (równoważnie P = \frac{17^{2}-13^{2}}{2}).'
  answer:
