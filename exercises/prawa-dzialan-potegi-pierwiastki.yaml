  exercise_type: zamiana zapisu pierwiastkowego na potęgowy
  statement: Zapisz liczbę \(\sqrt[4]{5^{3}}\) w postaci potęgi liczby 5 o wykładniku wymiernym.
  statement_latex: \sqrt[4]{5^{3}}
  solution: |-
    Korzystamy ze wzoru \(\sqrt[n]{a^{m}}=a^{\frac{m}{n}}\), prawdziwego dla \(a>0\).
    Stopień pierwiastka (4) trafia do mianownika wykładnika, a wykładnik spod pierwiastka (3) — do licznika:
    \[\sqrt[4]{5^{3}}=5^{\frac{3}{4}}.\]
    Odpowiedź: \(5^{\frac{3}{4}}\).
  solution_steps:
  - Rozpoznaj wzór \(\sqrt[n]{a^{m}}=a^{\frac{m}{n}}\).
  - Podstaw \(n=4\), \(m=3\), \(a=5\).
  - 'Zapisz wynik: \(5^{\frac{3}{4}}\).'
  answer:
    kind: SYMBOLIC
    latex: 5^{\frac{3}{4}}
  checks:
  - kind: simplify
    expr: \sqrt[4]{5^{3}}
  skills:
  - pierwiastek jako potęga o wykładniku wymiernym
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: ''5^{\\frac{3}{4}}'' vs ''5**(3/4)'''
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: obliczanie potęgi o wykładniku wymiernym
  statement: Oblicz wartość wyrażenia \(16^{\frac{3}{4}}\).
  statement_latex: 16^{\frac{3}{4}}
  solution: |-
    Zapisujemy podstawę jako potęgę liczby 2: \(16=2^{4}\).
    \[16^{\frac{3}{4}}=\left(2^{4}\right)^{\frac{3}{4}}=2^{4\cdot\frac{3}{4}}=2^{3}=8.\]
    Równoważnie: \(16^{\frac{3}{4}}=\left(\sqrt[4]{16}\right)^{3}=2^{3}=8\).
    Odpowiedź: 8.
  solution_steps:
  - 'Zapisz podstawę jako potęgę liczby pierwszej: \(16=2^{4}\).'
  - 'Zastosuj wzór \(\left(a^{m}\right)^{n}=a^{m\cdot n}\): \(2^{4\cdot\frac{3}{4}}=2^{3}\).'
  - Oblicz \(2^{3}=8\).
  answer:
    kind: NUMERIC
    value: 8.0
  checks:
