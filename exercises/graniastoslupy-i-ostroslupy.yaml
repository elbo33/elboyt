  exercise_type: ostrosłup prawidłowy trójkątny — trygonometria kąta nachylenia ściany bocznej
  statement: W ostrosłupie prawidłowym trójkątnym ABCS o podstawie ABC krawędź podstawy ma długość 6,
    a każda ściana boczna jest nachylona do płaszczyzny podstawy pod kątem 60°. Oblicz objętość tego ostrosłupa,
    pole jego powierzchni całkowitej oraz długość krawędzi bocznej. Zapisz obliczenia.
  statement_latex: r = \frac{6\sqrt{3}}{6} = \sqrt{3},\qquad \operatorname{tg}60^{\circ} = \frac{H}{r}
  solution: |-
    Podstawą jest trójkąt równoboczny o boku a = 6, więc promień okręgu wpisanego r = \frac{a\sqrt{3}}{6} = \frac{6\sqrt{3}}{6} = \sqrt{3}, a promień okręgu opisanego R = \frac{a\sqrt{3}}{3} = 2\sqrt{3}.
    Kąt nachylenia ściany bocznej leży w trójkącie prostokątnym o przyprostokątnych r i H, z przeciwprostokątną h (wysokością ściany bocznej):
    \operatorname{tg}60^{\circ} = \frac{H}{r} \Rightarrow H = \sqrt{3}\cdot\sqrt{3} = 3,
    \cos 60^{\circ} = \frac{r}{h} \Rightarrow h = \frac{\sqrt{3}}{\frac{1}{2}} = 2\sqrt{3}.
    Pole podstawy: P_p = \frac{6^2\sqrt{3}}{4} = 9\sqrt{3}.
