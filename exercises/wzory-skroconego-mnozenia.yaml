      vs 27.05887450304572 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: usuwanie niewymierności i tożsamości pochodne
  statement: Dane są liczby x = \frac{4}{3-\sqrt{5}} oraz y = \frac{4}{3+\sqrt{5}}. a) Oblicz sumę x+y.
    b) Oblicz iloczyn x\cdot y. c) Oblicz x^{2}+y^{2}.
  statement_latex: x = \frac{4}{3-\sqrt{5}}, \qquad y = \frac{4}{3+\sqrt{5}}
  solution: |-
    Usuwamy niewymierność z mianowników, mnożąc licznik i mianownik przez wyrażenie sprzężone.
    x = \frac{4}{3-\sqrt{5}} = \frac{4\cdot\left(3+\sqrt{5}\right)}{\left(3-\sqrt{5}\right)\cdot\left(3+\sqrt{5}\right)} = \frac{4\cdot\left(3+\sqrt{5}\right)}{9-5} = 3+\sqrt{5}.
    Podobnie y = \frac{4\cdot\left(3-\sqrt{5}\right)}{9-5} = 3-\sqrt{5}.
    a) x+y = \left(3+\sqrt{5}\right)+\left(3-\sqrt{5}\right) = 6.
    b) x\cdot y = \left(3+\sqrt{5}\right)\cdot\left(3-\sqrt{5}\right) = 3^{2}-\left(\sqrt{5}\right)^{2} = 9-5 = 4.
    c) Korzystamy z tożsamości pochodnej: x^{2}+y^{2} = \left(x+y\right)^{2} - 2\cdot x\cdot y = 6^{2} - 2\cdot 4 = 36-8 = 28.
    (Kontrola: \left(3+\sqrt{5}\right)^{2}+\left(3-\sqrt{5}\right)^{2} = \left(14+6\sqrt{5}\right)+\left(14-6\sqrt{5}\right) = 28.)
  solution_steps:
  - Pomnóż licznik i mianownik ułamka x przez sprzężenie 3+\sqrt{5}; otrzymasz x = 3+\sqrt{5}.
  - Analogicznie y = 3-\sqrt{5}.
  - 'Dodaj: x+y = 6.'
  - 'Pomnóż wyrażenia sprzężone: x\cdot y = 9-5 = 4.'
  - Zastosuj x^{2}+y^{2} = \left(x+y\right)^{2}-2\cdot x\cdot y = 36-8 = 28.
  answer:
    kind: MULTIPART
    parts:
    - name: suma
      answer:
        kind: NUMERIC
        value: 6.0
    - name: iloczyn
      answer:
        kind: NUMERIC
        value: 4.0
    - name: suma_kwadratow
      answer:
        kind: NUMERIC
        value: 28.0
  checks:
  - kind: evaluate
    expr: \frac{4}{3-\sqrt{5}} + \frac{4}{3+\sqrt{5}}
    part: suma
  - kind: evaluate
    expr: \frac{4}{3-\sqrt{5}} \cdot \frac{4}{3+\sqrt{5}}
    part: iloczyn
  - kind: evaluate
    expr: \left(\frac{4}{3-\sqrt{5}}\right)^{2} + \left(\frac{4}{3+\sqrt{5}}\right)^{2}
    part: suma_kwadratow
  skills:
  - mnożenie przez wyrażenie sprzężone
  - różnica kwadratów
  - tożsamość a^2+b^2=(a+b)^2-2ab
  - działania na liczbach niewymiernych
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [suma] SymPy solved it fresh: 6.0 vs 6.0 (tol 1e-09) ; [iloczyn]
      SymPy solved it fresh: 4.0 vs 4.0 (tol 1e-09) ; [suma_kwadratow] SymPy solved it fresh: 28.0 vs
      28.0 (tol 1e-09)'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: wykrycie i poprawa błędu
  statement: 'Uczeń zapisał: \left(x+6\right)^{2}=x^{2}+36. Sprawdź poprawność tego zapisu, podstawiając
    x=2, wyjaśnij, na czym polega błąd, i podaj poprawne rozwinięcie wyrażenia \left(x+6\right)^{2}.'
  statement_latex: \left(x+6\right)^{2}
  solution: |-
    Błędne rozumowanie ucznia: „kwadrat sumy to suma kwadratów”, czyli \left(x+6\right)^{2}=x^{2}+6^{2}=x^{2}+36. Otrzymany (błędny) wynik: x^{2}+36.
