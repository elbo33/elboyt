- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie wielomianowe: wzór, dziedzina, wartość i ocena wykonalności'
  statement: Z prostokątnego arkusza kartonu o wymiarach 24 cm i 16 cm wycięto w każdym z czterech narożników
    jednakowy kwadrat, a następnie powstałe wystające paski zagięto do góry wzdłuż krawędzi wycięć i sklejono,
    otrzymując pudełko w kształcie prostopadłościanu bez przykrywki. Wysokość pudełka jest równa długości
    boku wyciętego kwadratu; oznacz ją przez x (w centymetrach). a) Wyznacz wzór na objętość V\left(x\right)
    tego pudełka, zapisz go w postaci wielomianu uporządkowanego i podaj dziedzinę. b) Wyznacz wzór na
    pole powierzchni pudełka (dno i cztery ściany boczne) i zapisz go w postaci uporządkowanej. c) Oblicz
    objętość pudełka o wysokości 3 cm. d) Rozstrzygnij, czy w opisany sposób można otrzymać z tego arkusza
    pudełko o wysokości 9 cm.
  statement_latex: V\left(x\right)=x\cdot\left(24-2\cdot x\right)\cdot\left(16-2\cdot x\right)
  solution: |-
    a) Po wycięciu w narożnikach kwadratów o boku x dno pudełka jest prostokątem o bokach 24-2\cdot x oraz 16-2\cdot x, a wysokość pudełka wynosi x. Zatem
    V\left(x\right)=x\cdot\left(24-2\cdot x\right)\cdot\left(16-2\cdot x\right).
    Najpierw mnożymy dwa nawiasy: \left(24-2\cdot x\right)\cdot\left(16-2\cdot x\right)=384-48\cdot x-32\cdot x+4\cdot x^{2}=4\cdot x^{2}-80\cdot x+384.
    Po pomnożeniu przez x: V\left(x\right)=4\cdot x^{3}-80\cdot x^{2}+384\cdot x.
    Dziedzina: wszystkie wymiary muszą być dodatnie, więc x>0, 24-2\cdot x>0 (czyli x<12) oraz 16-2\cdot x>0 (czyli x<8). Warunkiem najostrzejszym jest x<8, zatem x\in\left(0,\;8\right).
    b) Pole powierzchni to dno oraz cztery ściany boczne: dwie o wymiarach x na 24-2\cdot x i dwie o wymiarach x na 16-2\cdot x:
    P\left(x\right)=\left(24-2\cdot x\right)\cdot\left(16-2\cdot x\right)+2\cdot x\cdot\left(24-2\cdot x\right)+2\cdot x\cdot\left(16-2\cdot x\right)=
    \left(4\cdot x^{2}-80\cdot x+384\right)+\left(48\cdot x-4\cdot x^{2}\right)+\left(32\cdot x-4\cdot x^{2}\right).
    Redukujemy: x^{2}: 4-4-4=-4;\; x: -80+48+32=0;\; wyraz wolny: 384. Zatem P\left(x\right)=-4\cdot x^{2}+384 (to pole arkusza pomniejszone o cztery wycięte kwadraty: 384-4\cdot x^{2} ✔).
    c) Dla x=3: V\left(3\right)=3\cdot\left(24-6\right)\cdot\left(16-6\right)=3\cdot 18\cdot 10=540, czyli 540 cm^{3} (kontrola ze wzoru: 4\cdot 27-80\cdot 9+384\cdot 3=108-720+1152=540 ✔).
    d) Dla x=9 mielibyśmy 16-2\cdot 9=-2<0, czyli 9 nie należy do dziedziny \left(0,\;8\right) — z krótszego boku arkusza nie da się wyciąć dwóch pasów po 9 cm. Takiego pudełka otrzymać nie można.
  solution_steps:
  - Zauważ, że po wycięciu narożnych kwadratów o boku x dno ma wymiary 24-2\cdot x oraz 16-2\cdot x, a
    wysokość wynosi x.
  - 'Zapisz V\left(x\right)=x\cdot\left(24-2\cdot x\right)\cdot\left(16-2\cdot x\right) i wymnóż: V\left(x\right)=4\cdot
    x^{3}-80\cdot x^{2}+384\cdot x.'
  - Z warunków x>0, 24-2\cdot x>0, 16-2\cdot x>0 wyznacz dziedzinę x\in\left(0,\;8\right).
  - 'Złóż pole powierzchni z dna i czterech ścian bocznych i zredukuj wyrazy podobne: P\left(x\right)=384-4\cdot
    x^{2}.'
  - Oblicz V\left(3\right)=3\cdot 18\cdot 10=540 cm^{3}.
  - 'Sprawdź x=9 względem dziedziny: 9\notin\left(0,\;8\right), więc takiego pudełka nie można wykonać.'
