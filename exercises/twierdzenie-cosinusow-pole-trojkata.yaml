  solution: |-
    a) Jeżeli |AB| = x, to na odcinek AC pozostaje 24 - x centymetrów drutu, czyli |AC| = 24 - x. Kąt BAC = 150^\circ jest kątem zawartym między bokami AB i AC, więc

    P\left(x\right) = \frac{1}{2}\cdot x\cdot\left(24 - x\right)\cdot\sin 150^\circ = \frac{1}{2}\cdot x\cdot\left(24 - x\right)\cdot\frac{1}{2} = \frac{x\cdot\left(24 - x\right)}{4}.

    Dziedzina: musi być x > 0 oraz 24 - x > 0, czyli 0 < x < 24, a dodatkowo warunek konstrukcyjny x \le 9. Ostatecznie dziedziną jest przedział \left(0;\,9\right\rangle.

    b) Funkcja P\left(x\right) = -\frac{1}{4}x^2 + 6x jest funkcją kwadratową o współczynniku przy x^2 ujemnym, więc jej wykresem jest parabola o ramionach skierowanych w dół. Pierwsza współrzędna wierzchołka:
    x_w = \frac{0 + 24}{2} = 12.

    Wierzchołek leży poza dziedziną, bo 12 > 9. Na przedziale \left(0;\,12\right\rangle funkcja jest rosnąca, więc na dziedzinie \left(0;\,9\right\rangle największą wartość przyjmuje dla x = 9:

    P\left(9\right) = \frac{9\cdot\left(24 - 9\right)}{4} = \frac{9\cdot 15}{4} = \frac{135}{4} = 33,75.

    Odpowiedź: pole jest największe dla |AB| = 9 cm (wtedy |AC| = 15 cm) i wynosi 33,75 cm^2.
  solution_steps:
  - Zauważ, że |AB| + |AC| = 24, więc |AC| = 24 - x.
  - 'Zapisz pole przez sinus kąta zawartego: P\left(x\right) = \frac{1}{2}\cdot x\cdot\left(24 - x\right)\cdot\sin
    150^\circ i podstaw \sin 150^\circ = \frac{1}{2}, otrzymując P\left(x\right) = \frac{x\cdot\left(24
    - x\right)}{4}.'
  - 'Wyznacz dziedzinę: x > 0, 24 - x > 0 oraz x \le 9, czyli x \in \left(0;\,9\right\rangle.'
  - Zauważ, że P jest funkcją kwadratową o ramionach skierowanych w dół, i oblicz x_w = \frac{0 + 24}{2}
    = 12.
  - Sprawdź, że wierzchołek nie należy do dziedziny (12 > 9), więc na \left(0;\,9\right\rangle funkcja
    jest rosnąca i największą wartość przyjmuje dla x = 9.
  - Oblicz P\left(9\right) = \frac{9\cdot 15}{4} = 33,75 cm^2.
