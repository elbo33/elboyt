    note: '[whole] SymPy solved it fresh: endpoints matched'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: równanie liniowe z ułamkami liczbowymi
  statement: Rozwiąż równanie \[\frac{3\cdot x-2}{4}-\frac{x+1}{6}=\frac{5}{12}.\]
  statement_latex: \frac{3\cdot x-2}{4}-\frac{x+1}{6}=\frac{5}{12}
  solution: |-
    Mianowniki są liczbami, więc dziedziną jest zbiór \mathbb{R}.
    NWW(4,6,12)=12. Mnożymy obie strony przez 12 (liczba dodatnia, przekształcenie równoważne):
    3\cdot\left(3x-2\right)-2\cdot\left(x+1\right)=5.
    Wymnażamy nawiasy, pamiętając o minusie przed drugim nawiasem:
    9x-6-2x-2=5
    7x-8=5
    7x=13
    x=\frac{13}{7}.
    Sprawdzenie: dla x=\frac{13}{7} mamy \frac{3\cdot\frac{13}{7}-2}{4}=\frac{\frac{25}{7}}{4}=\frac{25}{28} oraz \frac{\frac{13}{7}+1}{6}=\frac{\frac{20}{7}}{6}=\frac{20}{42}=\frac{10}{21}. Różnica: \frac{75}{84}-\frac{40}{84}=\frac{35}{84}=\frac{5}{12}. ✓
    Odpowiedź: x=\frac{13}{7}.
  solution_steps:
  - Zauważ, że mianowniki są liczbowe, więc D=\mathbb{R}.
  - 'Pomnóż obie strony przez 12: 3\cdot\left(3x-2\right)-2\cdot\left(x+1\right)=5.'
  - 'Wymnóż nawiasy: 9x-6-2x-2=5.'
  - 'Zredukuj wyrazy podobne: 7x=13.'
  - 'Podziel przez 7: x=\frac{13}{7}; sprawdź podstawieniem.'
  answer:
    kind: NUMERIC
    value: 1.8571428571428572
  checks:
  - kind: solve_equation
    expr: \frac{3\cdot x-2}{4}-\frac{x+1}{6}=\frac{5}{12}
  skills:
  - mnożenie przez NWW mianowników
  - wymnażanie nawiasów ze znakiem minus
  - rozwiązywanie równania ax=b
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 1.8571428571428572 vs 1.8571428571428572 (tol 1e-09)'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: równanie wymierne prowadzące do liniowego
  statement: Dane jest równanie \[\frac{x+2}{x-3}=\frac{x-1}{x+2}.\] a) Wyznacz dziedzinę tego równania,
    tzn. wypisz wszystkie liczby rzeczywiste, które do niej nie należą. b) Rozwiąż to równanie.
  statement_latex: \frac{x+2}{x-3}=\frac{x-1}{x+2}
  solution: |-
    a) Mianowniki: x-3 oraz x+2. Warunki: x-3\neq 0 i x+2\neq 0, czyli x\neq 3 i x\neq -2. Zatem D=\mathbb{R}\setminus\{-2,3\}, a z dziedziny wykluczamy liczby 3 i -2.
    b) W dziedzinie oba mianowniki są różne od zera, więc możemy zastosować proporcję (mnożenie na krzyż):
    \left(x+2\right)\cdot\left(x+2\right)=\left(x-1\right)\cdot\left(x-3\right)
    x^{2}+4x+4=x^{2}-4x+3.
    Wyrazy x^{2} redukują się po obu stronach – zostaje równanie liniowe:
    4x+4=-4x+3
    8x=-1
    x=-\frac{1}{8}.
    Liczba -\frac{1}{8} należy do dziedziny (jest różna od 3 i od -2).
    Sprawdzenie: L=\frac{-\frac{1}{8}+2}{-\frac{1}{8}-3}=\frac{\frac{15}{8}}{-\frac{25}{8}}=-\frac{3}{5}, P=\frac{-\frac{1}{8}-1}{-\frac{1}{8}+2}=\frac{-\frac{9}{8}}{\frac{15}{8}}=-\frac{3}{5}. ✓
    Odpowiedź: x=-\frac{1}{8}.
  solution_steps:
  - 'Zapisz założenia: x-3\neq 0 i x+2\neq 0, czyli x\neq 3 i x\neq -2.'
  - 'Zastosuj proporcję: \left(x+2\right)^{2}=\left(x-1\right)\cdot\left(x-3\right).'
  - 'Wymnóż: x^{2}+4x+4=x^{2}-4x+3 i zredukuj wyrazy x^{2}.'
  - Rozwiąż równanie liniowe 8x=-1, czyli x=-\frac{1}{8}.
  - Sprawdź, że -\frac{1}{8}\in D i podstaw do równania wyjściowego.
  answer:
    kind: MULTIPART
    parts:
    - name: liczby wykluczone z dziedziny
      answer:
        kind: SET
        members:
        - '3'
        - '-2'
    - name: rozwiązanie równania
      answer:
        kind: NUMERIC
        value: -0.125
  checks:
  - kind: solve_equation
    expr: \left(x-3\right)\cdot\left(x+2\right)=0
    part: liczby wykluczone z dziedziny
  - kind: solve_equation
    expr: \frac{x+2}{x-3}=\frac{x-1}{x+2}
    part: rozwiązanie równania
  skills:
  - wyznaczanie dziedziny
  - metoda proporcji
  - redukcja wyrazów z x^2
  - konfrontacja wyniku z dziedziną
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [liczby wykluczone z dziedziny] SymPy solved it fresh: 2 members
      matched ; [rozwiązanie równania] SymPy solved it fresh: -0.125 vs -0.125 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: równanie wymierne z trzema ułamkami
  statement: Dane jest równanie \[\frac{5}{x-2}-\frac{3}{x}=\frac{4}{x\cdot\left(x-2\right)}.\] a) Wyznacz
    dziedzinę tego równania, tzn. wypisz wszystkie liczby rzeczywiste, które do niej nie należą. b) Rozwiąż
    to równanie. c) Rozstrzygnij, czy liczba 2 jest rozwiązaniem tego równania. Odpowiedź uzasadnij.
  statement_latex: \frac{5}{x-2}-\frac{3}{x}=\frac{4}{x\cdot\left(x-2\right)}
  solution: |-
    a) Mianowniki: x-2, x oraz x\cdot\left(x-2\right). Warunki: x-2\neq 0 i x\neq 0, czyli x\neq 2 i x\neq 0. Zatem D=\mathbb{R}\setminus\{0,2\}; z dziedziny wykluczamy liczby 0 i 2.
    b) Wspólnym mianownikiem jest x\cdot\left(x-2\right), które w dziedzinie jest różne od zera, więc mnożenie przez nie jest przekształceniem równoważnym:
    5\cdot x-3\cdot\left(x-2\right)=4
    5x-3x+6=4
    2x=-2
    x=-1.
    Liczba -1 należy do dziedziny.
    Sprawdzenie: L=\frac{5}{-3}-\frac{3}{-1}=-\frac{5}{3}+3=\frac{4}{3}, P=\frac{4}{\left(-1\right)\cdot\left(-3\right)}=\frac{4}{3}. ✓
    Odpowiedź: x=-1.
    c) Nie. Liczba 2 nie należy do dziedziny równania (dla x=2 mianownik x-2 jest równy zeru, więc wyrażenie \frac{5}{x-2} nie ma sensu liczbowego). Liczba spoza dziedziny nigdy nie jest rozwiązaniem.
  solution_steps:
  - 'Zapisz założenia: x\neq 0 i x\neq 2.'
  - Wyznacz wspólny mianownik x\cdot\left(x-2\right) i pomnóż przez niego obie strony.
  - Otrzymaj równanie 5x-3\cdot\left(x-2\right)=4 i wymnóż nawias.
  - 'Zredukuj: 2x=-2, czyli x=-1.'
  - Sprawdź, że -1\in D, i podstaw do równania wyjściowego.
  - Uzasadnij, że 2 nie może być rozwiązaniem, bo nie należy do dziedziny.
  answer:
    kind: MULTIPART
    parts:
    - name: liczby wykluczone z dziedziny
      answer:
        kind: SET
        members:
        - '0'
        - '2'
    - name: rozwiązanie równania
      answer:
        kind: NUMERIC
        value: -1.0
    - name: czy 2 jest rozwiązaniem – uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń musi uzasadnić, że liczba 2 nie jest rozwiązaniem, ponieważ nie należy do dziedziny
          (dla x=2 mianownik x-2 równa się zeru i wyrażenie nie ma sensu liczbowego).
  checks:
  - kind: solve_equation
    expr: x\cdot\left(x-2\right)=0
    part: liczby wykluczone z dziedziny
  - kind: solve_equation
    expr: \frac{5}{x-2}-\frac{3}{x}=\frac{4}{x\cdot\left(x-2\right)}
    part: rozwiązanie równania
  skills:
  - wyznaczanie dziedziny
  - wspólny mianownik wyrażeń wymiernych
  - rozwiązywanie równania liniowego
  - uzasadnianie odrzucenia liczby spoza dziedziny
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: czy 2 jest rozwiązaniem – uzasadnienie · 2/2 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: równanie wymierne prowadzące do liniowego
  statement: Wyznacz dziedzinę równania \frac{x+4}{x-1}-\frac{x-3}{x+1}=\frac{19}{x^{2}-1}, a następnie
    rozwiąż to równanie.
  statement_latex: \frac{x+4}{x-1}-\frac{x-3}{x+1}=\frac{19}{x^{2}-1}
  solution: |-
    Rozkładamy mianownik prawej strony: x^{2}-1=\left(x-1\right)\cdot\left(x+1\right).
    Dziedzina: musi być x-1\neq 0 oraz x+1\neq 0, czyli x\neq 1 i x\neq -1. Zatem D=\mathbb{R}\setminus\{-1,1\}.
    Wspólnym mianownikiem wszystkich ułamków jest \left(x-1\right)\cdot\left(x+1\right); w dziedzinie jest on różny od zera, więc mnożenie obu stron przez niego jest przekształceniem równoważnym:
    \left(x+4\right)\cdot\left(x+1\right)-\left(x-3\right)\cdot\left(x-1\right)=19.
    Wymnażamy nawiasy (uwaga na minus przed drugim iloczynem):
    x^{2}+5x+4-\left(x^{2}-4x+3\right)=19
    x^{2}+5x+4-x^{2}+4x-3=19
    9x+1=19
    9x=18
    x=2.
    Liczba 2 należy do dziedziny (2\neq 1 i 2\neq -1).
    Sprawdzenie w równaniu wyjściowym: L=\frac{6}{1}-\frac{-1}{3}=6+\frac{1}{3}=\frac{19}{3}, P=\frac{19}{4-1}=\frac{19}{3}. Zgadza się.
    Odpowiedź: D=\mathbb{R}\setminus\{-1,1\}, x=2.
  solution_steps:
  - 'Rozłóż mianownik: x^{2}-1=\left(x-1\right)\cdot\left(x+1\right).'
  - 'Zapisz założenia: x\neq 1 i x\neq -1, czyli D=\mathbb{R}\setminus\{-1,1\}.'
  - Pomnóż obie strony przez \left(x-1\right)\cdot\left(x+1\right) (w dziedzinie różne od zera).
  - 'Wymnóż nawiasy: x^{2}+5x+4-x^{2}+4x-3=19.'
  - 'Zredukuj wyrazy z x^{2} i uporządkuj: 9x=18.'
  - 'Rozwiąż: x=2 i sprawdź, że 2\in D.'
  - Wykonaj sprawdzenie przez podstawienie do równania wyjściowego.
  answer:
    kind: MULTIPART
    parts:
    - name: dziedzina
      answer:
        kind: SYMBOLIC
        latex: \mathbb{R}\setminus\{-1,1\}
    - name: rozwiazanie
      answer:
        kind: NUMERIC
        value: 2.0
  checks:
  - kind: solve_equation
    expr: \frac{x+4}{x-1}-\frac{x-3}{x+1}=\frac{19}{x^{2}-1}
    part: rozwiazanie
  skills:
  - wyznaczanie dziedziny równania wymiernego
  - sprowadzanie do wspólnego mianownika
  - rozwiązywanie równania liniowego
  - konfrontacja wyniku z dziedziną
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: przekształcanie wzoru (wyznaczanie zmiennej z mianownika)
  statement: Opór zastępczy R dwóch oporników o oporach R_{1} i R_{2} połączonych równolegle spełnia zależność
    \frac{1}{R}=\frac{1}{R_{1}}+\frac{1}{R_{2}}, przy czym R>0, R_{1}>0 i R_{2}>0. a) Wyznacz R_{2} w
    zależności od R i R_{1} oraz zapisz założenie, przy którym takie przekształcenie jest możliwe. b)
    Oblicz R_{2} dla R=4\ \Omega oraz R_{1}=12\ \Omega.
  statement_latex: \frac{1}{R}=\frac{1}{R_{1}}+\frac{1}{R_{2}}
  solution: |-
    a) Traktujemy R_{2} jako niewiadomą, a R i R_{1} jako dane dodatnie.
    Odejmujemy \frac{1}{R_{1}} od obu stron (przekształcenie równoważne):
    \frac{1}{R_{2}}=\frac{1}{R}-\frac{1}{R_{1}}.
    Sprowadzamy prawą stronę do wspólnego mianownika R\cdot R_{1}\neq 0:
    \frac{1}{R_{2}}=\frac{R_{1}-R}{R\cdot R_{1}}.
    Aby odwrócić obie strony (równoważnie: pomnożyć na krzyż), prawa strona musi być różna od zera, czyli R_{1}-R\neq 0, to znaczy R_{1}\neq R. Wtedy
    R_{2}=\frac{R\cdot R_{1}}{R_{1}-R}.
    Dodatkowo z warunku R_{2}>0 wynika R_{1}>R.
    b) Podstawiamy R=4 i R_{1}=12:
    R_{2}=\frac{4\cdot 12}{12-4}=\frac{48}{8}=6.
    Sprawdzenie: \frac{1}{12}+\frac{1}{6}=\frac{1}{12}+\frac{2}{12}=\frac{3}{12}=\frac{1}{4}=\frac{1}{R}. Zgadza się.
    Odpowiedź: R_{2}=\frac{R\cdot R_{1}}{R_{1}-R} przy założeniu R_{1}\neq R; dla danych liczbowych R_{2}=6\ \Omega.
  solution_steps:
  - Potraktuj R_{2} jako niewiadomą; odejmij \frac{1}{R_{1}} od obu stron.
  - 'Sprowadź prawą stronę do wspólnego mianownika: \frac{1}{R_{2}}=\frac{R_{1}-R}{R\cdot R_{1}}.'
  - Zapisz założenie R_{1}-R\neq 0 (dzielimy/odwracamy tylko wyrażenie różne od zera).
  - 'Odwróć obie strony: R_{2}=\frac{R\cdot R_{1}}{R_{1}-R}.'
  - 'Podstaw R=4 i R_{1}=12: R_{2}=\frac{4\cdot 12}{12-4}=6.'
  - Sprawdź wynik, podstawiając do wzoru wyjściowego.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor
      answer:
        kind: SYMBOLIC
        latex: \frac{R\cdot R_{1}}{R_{1}-R}
    - name: zalozenie
      answer:
        kind: SYMBOLIC
        latex: R_{1}\neq R
    - name: wartosc
      answer:
        kind: NUMERIC
        value: 6.0
  checks:
  - kind: evaluate
    expr: \frac{4\cdot 12}{12-4}
    part: wartosc
  skills:
  - przekształcanie wzoru
  - działania na ułamkach algebraicznych
  - zapisywanie założeń
  - obliczanie wartości ze wzoru
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: reference produced 2 outputs, answer has 3'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: nierówność liniowa – analiza błędu
  statement: Rozwiąż nierówność \[4-5\cdot\left(x-1\right)\ge 2\cdot x+23\] i zapisz zbiór jej rozwiązań
    w postaci przedziału. Uczeń, który rozwiązywał tę nierówność, doszedł do postaci -7\cdot x\ge 14 i
    zapisał odpowiedź x\in\langle -2,+\infty). Wyjaśnij, na czym polega jego błąd, i podaj poprawny zbiór
    rozwiązań.
  statement_latex: 4-5\cdot\left(x-1\right)\ge 2\cdot x+23
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA:
    4-5x+5\ge 2x+23, czyli 9-5x\ge 2x+23, dalej -5x-2x\ge 23-9, czyli -7x\ge 14. Uczeń dzieli obie strony przez -7 i pisze x\ge -2, „bo dzielimy obie strony przez -7 i nic więcej się nie dzieje”. Otrzymuje błędną odpowiedź x\in\langle -2,+\infty).
