  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: odczyt dziedziny z wykresu
  statement: Wykresem funkcji f jest łamana o kolejnych wierzchołkach A=(-4, 2), B=(-1, -3), C=(3, 1).
    Punkty A i C są końcami wykresu i oba zaznaczono kropkami pełnymi, a wykres nie ma żadnych przerw.
    Podaj dziedzinę funkcji f.
  statement_latex: A=\left(-4,\,2\right),\quad B=\left(-1,\,-3\right),\quad C=\left(3,\,1\right)
  solution: Dziedzinę odczytujemy jako rzut wykresu na oś OX, czyli patrzymy wyłącznie na pierwsze współrzędne
    punktów wykresu. Skrajnie lewym punktem wykresu jest A=(-4, 2), więc najmniejszym argumentem jest
    -4. Skrajnie prawym punktem jest C=(3, 1), więc największym argumentem jest 3. Oba końce zaznaczono
    kropkami pełnymi, zatem oba argumenty należą do dziedziny, a wykres jest nieprzerwany, więc dziedzina
    jest jednym przedziałem domkniętym. Stąd D_f = \left\langle -4,\,3 \right\rangle.
  solution_steps:
  - Zauważ, że dziedzina to zbiór argumentów, czyli rzut wykresu na oś OX.
  - 'Odczytaj pierwszą współrzędną skrajnie lewego punktu wykresu: -4 (punkt A).'
  - 'Odczytaj pierwszą współrzędną skrajnie prawego punktu wykresu: 3 (punkt C).'
  - Kropki pełne na obu końcach oznaczają nawiasy domknięte; brak przerw w wykresie oznacza jeden przedział.
  - 'Zapisz odpowiedź: D_f = ⟨-4, 3⟩.'
  answer:
    kind: INTERVAL
    lo: '-4'
    hi: '3'
    lo_open: false
    hi_open: false
  skills:
  - odczytywanie dziedziny z wykresu
  - interpretacja kropek pełnych
  verification:
    checkability: REFERENCE_CALL
