- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: rozróżnianie argumentu i wartości
  statement: 'Dana jest funkcja f określona wzorem f(x) = 2x^2 - 3 dla wszystkich liczb rzeczywistych
    x. a) Oblicz f(2). b) Wyznacz wszystkie argumenty, dla których funkcja f przyjmuje wartość 5. Uczeń
    w podpunkcie a) zapisał: "f(x) = 2, czyli 2x^2 - 3 = 2, zatem x^2 = \frac{5}{2}", a w podpunkcie b)
    odpowiedział: "f(5) = 2\cdot 5^2 - 3 = 47". Wskaż błąd w tym rozumowaniu i podaj poprawne odpowiedzi.'
  statement_latex: f\left(x\right)=2\cdot x^{2}-3
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA:
    a) uczeń potraktował liczbę 2 jako wartość funkcji i ułożył równanie 2x² − 3 = 2, otrzymując x² = 5/2, czyli x = ±√(5/2) — to odpowiedź na zupełnie inne pytanie;
    b) uczeń potraktował liczbę 5 jako argument i policzył f(5) = 2·5² − 3 = 47 — również odpowiedź na inne pytanie.
    NA CZYM POLEGA BŁĄD: uczeń pomylił argument z wartością. Zapis f(2) oznacza WARTOŚĆ funkcji dla ARGUMENTU 2 (podstawiamy 2 w miejsce x). Natomiast zdanie "funkcja przyjmuje wartość 5" prowadzi do RÓWNANIA f(x) = 5, w którym szukamy argumentu. Argumenty odczytujemy z osi OX, wartości z osi OY.
    POPRAWNE ROZWIĄZANIE:
    a) f(2) = 2·(2)² − 3 = 2·4 − 3 = 8 − 3 = 5.
    b) 2x² − 3 = 5 ⟹ 2x² = 8 ⟹ x² = 4 ⟹ x = −2 lub x = 2.
    Odpowiedź: f(2) = 5, a wartość 5 funkcja przyjmuje dla dwóch argumentów: x = −2 oraz x = 2.
  solution_steps:
  - 'Rozpoznajemy błąd: zamiana ról argumentu i wartości (f(2) obliczamy przez podstawienie, a f(x)=5
    przez rozwiązanie równania).'
  - 'Poprawnie a): f(2)=2\cdot\left(2\right)^{2}-3=5.'
  - 'Poprawnie b): układamy równanie 2\cdot x^{2}-3=5, skąd x^{2}=4.'
  - Otrzymujemy x=-2 lub x=2 i sprawdzamy, że należą do dziedziny.
  answer:
