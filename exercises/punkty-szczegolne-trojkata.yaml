- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: 'zadanie odwrotne: z promienia okręgu wpisanego wyznacz bok trójkąta'
  statement: Promień okręgu wpisanego w trójkąt równoramienny o podstawie długości 18 jest równy 4,5.
    Oblicz długość ramienia tego trójkąta.
  statement_latex: r = \frac{P}{p} = \frac{\frac{1}{2}\cdot 18\cdot\sqrt{x^{2}-81}}{\frac{x+x+18}{2}}
    = \frac{9}{2}
  solution: |-
    Oznaczmy przez x długość ramienia trójkąta (x > 9, bo suma połówek podstawy musi być mniejsza od sumy ramion). Wysokość opuszczona na podstawę dzieli ją na połowy po 9, więc h = \sqrt{x^{2}-81}.

    Pole: P = \frac{1}{2}\cdot 18\cdot\sqrt{x^{2}-81} = 9\sqrt{x^{2}-81}.
    Połowa obwodu: p = \frac{x+x+18}{2} = x+9.

    Z warunku r = \frac{P}{p}:
    \frac{9\cdot\sqrt{x^{2}-81}}{x+9} = \frac{9}{2}.

    Dzielimy obie strony przez 9 i mnożymy przez 2(x+9) > 0:
    2\sqrt{x^{2}-81} = x+9.

    Obie strony są dodatnie, więc możemy podnieść do kwadratu:
    4\left(x^{2}-81\right) = x^{2}+18x+81,
    3x^{2}-18x-405 = 0,
    x^{2}-6x-135 = 0,
    \Delta = 36+540 = 576,\ \sqrt{\Delta} = 24,
    x = \frac{6-24}{2} = -9 \text{ (odrzucamy)} \quad\text{lub}\quad x = \frac{6+24}{2} = 15.

    Sprawdzenie: dla x = 15 mamy h = \sqrt{225-81} = 12, P = \frac{1}{2}\cdot 18\cdot 12 = 108, p = \frac{15+15+18}{2} = 24, r = \frac{108}{24} = 4{,}5 ✓.

    Ramię ma długość 15.
  solution_steps:
  - 'Wprowadź niewiadomą: x – długość ramienia, x > 9.'
  - 'Wyznacz wysokość na podstawę: h = \sqrt{x^{2}-81} (wysokość dzieli podstawę na połowy).'
  - Zapisz P = 9\sqrt{x^{2}-81} oraz p = x+9 i podstaw do wzoru r = \frac{P}{p}.
  - Rozwiąż równanie 2\sqrt{x^{2}-81} = x+9, otrzymując x^{2}-6x-135 = 0.
  - Odrzuć ujemny pierwiastek i podaj x = 15; sprawdź, że wtedy r = 4{,}5.
  answer:
    kind: NUMERIC
    value: 15.0
    latex: '15'
  checks:
  - kind: solve_equation
    expr: \frac{9\cdot\sqrt{x^{2}-81}}{x+9}=\frac{9}{2}
  stated_model:
    variable: x
    objective_latex: \frac{9\cdot\sqrt{x^{2}-81}}{x+9} = \frac{9}{2}
    domain_lo: '9'
    goal: value
    constraint_used: x – długość ramienia trójkąta równoramiennego o podstawie 18
