  exercise_type: uzupełnienie podziału na przypadki
  statement: 'Uczeń chciał wykazać zdanie: „dla każdej liczby całkowitej \(n\) liczba \(n^{2}+2\) nie
    jest podzielna przez \(3\)”. Rozpatrzył tylko dwa przypadki: \(n=3k\) oraz \(n=3k+1\) i uznał dowód
    za zakończony. Wskaż brakujący przypadek, wyznacz resztę z dzielenia liczby \(n^{2}+2\) przez \(3\)
    w tym przypadku, oblicz wartość wyrażenia \(n^{2}+2\) dla \(n=2\) i rozstrzygnij, czy zdanie ucznia
    jest prawdziwe.'
  statement_latex: n = 3k+2 \;\Rightarrow\; n^{2}+2 = 3\cdot\left(3k^{2}+4k+2\right)
  solution: |-
    Błędne rozumowanie: uczeń sprawdził, że dla n = 3k mamy n^{2}+2 = 3\cdot 3k^{2}+2 (reszta 2), a dla n = 3k+1 mamy n^{2}+2 = 9k^{2}+6k+3 = 3\cdot\left(3k^{2}+2k+1\right)... — tu zresztą reszta wynosi 0! — i mimo to uznał, że pominięcie przypadku n = 3k+2 nie ma znaczenia. Jego „odpowiedź”: zdanie udowodnione.

    Dlaczego to błąd: przy dzielniku 3 przypadki muszą być trzy: n = 3k, n = 3k+1, n = 3k+2. Pominięcie choćby jednego unieważnia dowód. Tutaj brakujący przypadek wręcz obala tezę.

    Brakujący przypadek n = 3k+2:
    n^{2}+2 = \left(3k+2\right)^{2}+2 = 9k^{2}+12k+4+2 = 9k^{2}+12k+6 = 3\cdot\left(3k^{2}+4k+2\right).
    Liczba 3k^{2}+4k+2 jest całkowita, więc n^{2}+2 jest podzielne przez 3 — reszta wynosi 0.

    Kontrprzykład: dla n = 2 mamy n^{2}+2 = 4+2 = 6 = 3\cdot 2, a więc liczba podzielna przez 3.

    Odpowiedź: zdanie ucznia jest FAŁSZYWE; w przypadku n = 3k+2 reszta z dzielenia n^{2}+2 przez 3 wynosi 0, a dla n = 2 otrzymujemy 6.
  solution_steps:
  - Zauważamy, że przy dzielniku 3 przypadki to n = 3k, n = 3k+1 oraz n = 3k+2 — uczeń pominął ostatni.
  - 'Podstawiamy n = 3k+2: n^{2}+2 = 9k^{2}+12k+6 = 3\cdot\left(3k^{2}+4k+2\right).'
  - 'Odczytujemy resztę: 0, bo 3k^{2}+4k+2 jest liczbą całkowitą.'
  - 'Podajemy kontrprzykład n = 2: n^{2}+2 = 6, liczba podzielna przez 3.'
  - 'Wniosek: zdanie jest fałszywe, a dowód ucznia był niepełny.'
  answer:
    kind: MULTIPART
    parts:
    - name: reszta w przypadku n=3k+2
