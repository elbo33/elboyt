  solution: |-
    Symetria względem osi Ox zmienia znak drugiej współrzędnej, a pierwszą pozostawia bez zmian: A_1 = (7, 3).
    Symetria względem osi Oy zmienia znak pierwszej współrzędnej: A_2 = (-7, -3).
