    b) Wyznacz długość krawędzi podstawy, dla której pole powierzchni bocznej jest największe, oblicz to pole oraz oblicz wysokość takiego ostrosłupa. Zapisz obliczenia.
  statement_latex: P_b\left(x\right) = 4\cdot\frac{1}{2}\cdot x\cdot\left(21 - x\right) = 42x - 2x^{2}
  solution: |-
    a) Niech x oznacza długość krawędzi podstawy, a h — wysokość ściany bocznej. Z warunku x + h = 21 mamy h = 21 - x.
    Pole powierzchni bocznej to cztery przystające trójkąty równoramienne o podstawie x i wysokości h:
    P_b\left(x\right) = 4\cdot\frac{1}{2}\cdot x\cdot\left(21-x\right) = 42x - 2x^{2}.
    Warunki: x > 0 oraz h > 0. Ponadto ostrosłup istnieje tylko wtedy, gdy h > \frac{x}{2} (bo h^{2} = H^{2} + \left(\frac{x}{2}\right)^{2} i H > 0), czyli 21 - x > \frac{x}{2}, skąd x < 14. Warunek konstrukcyjny daje x \ge 12.
    Dziedzina: x \in \left[12;14\right).
    b) Wykresem funkcji P_b jest parabola o ramionach skierowanych w dół, a jej wierzchołek ma odciętą x = \frac{-42}{2\cdot\left(-2\right)} = 10{,}5. Ta wartość nie należy do dziedziny, a dla x > 10{,}5 funkcja maleje, więc największą wartość na przedziale \left[12;14\right) przyjmuje dla x = 12.
    Wtedy h = 21 - 12 = 9 oraz P_b = 42\cdot 12 - 2\cdot 12^{2} = 504 - 288 = 216 (m^{2}).
    Wysokość bryły: r = \frac{x}{2} = 6, więc H = \sqrt{h^{2} - r^{2}} = \sqrt{81 - 36} = \sqrt{45} = 3\sqrt{5} \approx 6{,}7 (m).
    Kontrola: h = 9 > H = 3\sqrt{5} — zgodnie z geometrią bryły.
  solution_steps:
  - Oznacz krawędź podstawy przez x; z warunku x + h = 21 wysokość ściany bocznej h = 21 - x.
  - 'Zapisz pole boczne jako sumę pól czterech trójkątów: P_b\left(x\right) = 2x\left(21-x\right) = 42x
    - 2x^{2}.'
  - 'Ustal dziedzinę: x > 0, h > 0 oraz h > \frac{x}{2} (istnienie ostrosłupa) daje x < 14; warunek konstrukcyjny
    daje x \ge 12, więc x \in \left[12;14\right).'
  - 'Wierzchołek paraboli: x = 10{,}5 — poza dziedziną; na \left[12;14\right) funkcja maleje, więc maksimum
    dla x = 12.'
  - Oblicz P_b\left(12\right) = 216 m^{2} oraz H = \sqrt{\left(21-12\right)^{2} - 6^{2}} = 3\sqrt{5} m.
