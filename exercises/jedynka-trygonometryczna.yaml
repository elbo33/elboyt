  - 'Błąd: użycie \operatorname{tg}\alpha=\frac{\cos\alpha}{\sin\alpha} i wynik 2\sqrt{2}.'
  - 'Korekta: \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha} — sinus w liczniku.'
  - \operatorname{tg}\alpha=\frac{1}{2\sqrt{2}}=\frac{\sqrt{2}}{4}.
