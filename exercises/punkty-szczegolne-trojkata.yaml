    S”. Wskaż błąd, a następnie wyznacz współrzędne ortocentrum H i środka ciężkości S oraz oblicz długość
    odcinka HS.'
  statement_latex: S=\left(\frac{0+8+2}{3},\ \frac{0+0+6}{3}\right),\qquad |HS|=\sqrt{\left(\frac{10}{3}-2\right)^{2}+\left(2-2\right)^{2}}
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń utożsamił wysokość ze środkową. Spodek wysokości z C to rzut punktu C na prostą AB (oś x), czyli punkt (2, 0), natomiast środek boku AB to punkt (4, 0). To dwa różne punkty, więc wysokość z C nie jest środkową — pokrywają się one tylko wtedy, gdy trójkąt jest równoramienny względem wierzchołka C (tu |AC| = \sqrt{40}, |BC| = \sqrt{72}, więc nie jest). Wniosek ucznia, że H = S, jest fałszywy.
    POPRAWNIE:
    Wysokość z C: bok AB leży na prostej y = 0, więc wysokość z C to prosta x = 2.
    Wysokość z A: prosta BC ma współczynnik kierunkowy \frac{6-0}{2-8} = -1, więc prosta prostopadła do niej ma współczynnik 1; przechodzi przez A = (0,0), zatem jej równanie to y = x.
    Punkt wspólny: x = 2, y = 2, czyli H = (2, 2).
    Środek ciężkości: S = \left(\frac{0+8+2}{3}, \frac{0+0+6}{3}\right) = \left(\frac{10}{3}, 2\right).
    Widać, że H \ne S. Długość odcinka:
    |HS| = \sqrt{\left(\frac{10}{3}-2\right)^{2}+\left(2-2\right)^{2}} = \frac{4}{3}.
  solution_steps:
  - 'Nazwij błąd: spodek wysokości z C to (2,0), a środek boku AB to (4,0) — wysokość nie jest środkową.'
  - 'Wyznacz wysokość z C: prosta x = 2 (bo AB leży na osi x).'
  - 'Wyznacz wysokość z A: prosta BC ma współczynnik -1, więc wysokość ma równanie y = x.'
  - 'Rozwiąż układ: H = (2, 2).'
  - Oblicz S = \left(\frac{10}{3}, 2\right).
  - Oblicz |HS| = \sqrt{\left(\frac{10}{3}-2\right)^{2}} = \frac{4}{3}.
  answer:
    kind: MULTIPART
