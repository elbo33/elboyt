- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: rozpoznawanie wielokąta foremnego
  statement: 'Adam twierdzi: „Romb o boku długości 5 i kącie ostrym 50° ma wszystkie boki równe, więc
    jest czworokątem foremnym”. Rozstrzygnij, czy ten romb jest wielokątem foremnym, a następnie oblicz
    pole czworokąta foremnego o obwodzie równym obwodowi tego rombu.'
  statement_latex: L=4\cdot 5=20,\qquad a_{kw}=\frac{4\cdot 5}{4},\qquad P=\left(\frac{4\cdot 5}{4}\right)^{2}
  solution: |-
    BŁĘDNE ROZUMOWANIE (Adam): „Wszystkie cztery boki rombu mają długość 5, a wielokąt foremny to wielokąt o równych bokach, więc romb jest czworokątem foremnym”. Przy takim założeniu Adam nie zmienia figury i liczy pole rombu jako pole „czworokąta foremnego”, dostając 5² = 25 tylko dla kwadratu, a dla rombu 5·5·sin50° ≈ 19,15 — i twierdzi, że to pole czworokąta foremnego. To fałsz.

    GDZIE JEST BŁĄD: definicja wymaga JEDNOCZEŚNIE równych boków i równych kątów wewnętrznych. Kąty rombu wynoszą 50°, 130°, 50°, 130° — nie są równe, więc romb foremny NIE jest. Jedynym czworokątem foremnym jest kwadrat (tylko w trójkącie równość boków pociąga równość kątów).

    POPRAWNE ROZWIĄZANIE: romb nie jest wielokątem foremnym. Obwód rombu: L = 4·5 = 20. Czworokąt foremny o takim obwodzie to kwadrat o boku 20/4 = 5, więc jego pole wynosi P = 5² = 25.
    Odpowiedź: romb nie jest foremny; szukane pole wynosi 25.
