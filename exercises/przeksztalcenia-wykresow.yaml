section: przeksztalcenia-wykresow
name: 'Przekształcenia wykresów: przesunięcia wzdłuż osi'
scope: From the graph of y = f(x), sketching the graphs obtained by shifting it along the x-axis and along
  the y-axis; reading off how the shift changes zeros, domain and range.
requirements:
- V.12
counts:
  total: 16
  REFERENCE_CALL: 11
  NOT_MACHINE_CHECKABLE: 2
  DETERMINISTIC: 2
  STATED_MODEL: 1
exercises:
- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obraz punktu przy przesunięciu wykresu
  statement: Punkt A = (-3,\ 5) należy do wykresu funkcji f. Funkcja g jest określona wzorem g(x) = f(x
    - 4) + 1. Podaj współrzędne punktu A', który jest obrazem punktu A i należy do wykresu funkcji g.
  statement_latex: g(x) = f\left(x - 4\right) + 1,\qquad A = \left(-3,\ 5\right)
  solution: |-
    Wzór wzorcowy przesunięcia to g(x) = f(x - p) + q. Porównując: x - 4 = x - p, więc p = 4, oraz q = 1. Wykres funkcji f przesuwamy zatem o wektor [4,\ 1] (4 jednostki w prawo i 1 jednostkę w górę).
    Każdy punkt wykresu wędruje o ten sam wektor: (x,\ y) \mapsto (x + 4,\ y + 1).
    Zatem A' = (-3 + 4,\ 5 + 1) = (1,\ 6).
    Sprawdzenie: g(1) = f(1 - 4) + 1 = f(-3) + 1 = 5 + 1 = 6, więc punkt (1,\ 6) rzeczywiście leży na wykresie g.
  solution_steps:
  - Porównaj wzór g(x) = f(x - 4) + 1 ze wzorem g(x) = f(x - p) + q i odczytaj p = 4, q = 1.
  - 'Zapisz wektor przesunięcia: [4, 1].'
  - 'Do pierwszej współrzędnej punktu A dodaj 4, do drugiej dodaj 1: A'' = (-3 + 4, 5 + 1).'
  - 'Zapisz odpowiedź: A'' = (1, 6) i sprawdź, że g(1) = f(-3) + 1 = 6.'
  answer:
    kind: TUPLE
    items:
    - '1'
    - '6'
  skills:
  - obraz punktu wykresu przy przesunięciu
  - odczytywanie wektora [p, q] ze wzoru
  verification:
    checkability: REFERENCE_CALL
    note: 2 components matched
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: odczytanie wektora przesunięcia ze wzoru
  statement: Wykres funkcji g otrzymano przez przesunięcie wykresu funkcji f, przy czym g(x) = f(x + 6)
    - 2. Podaj współrzędne wektora \vec{u} = [p,\ q], o który przesunięto wykres funkcji f.
  statement_latex: g(x) = f\left(x + 6\right) - 2
  solution: |-
    Wzorem wzorcowym jest g(x) = f(x - p) + q.
    Zapisujemy x + 6 = x - (-6), więc p = -6 (pierwszą współrzędną bierzemy z przeciwnym znakiem niż liczba w nawiasie).
    Liczba dopisana na zewnątrz to -2, więc q = -2 (tę bierzemy bez zmiany znaku).
    Wektor przesunięcia: \vec{u} = [-6,\ -2], czyli 6 jednostek w lewo i 2 jednostki w dół.
  solution_steps:
  - Zapisz wzór wzorcowy g(x) = f(x - p) + q.
  - Przekształć x + 6 = x - (-6), stąd p = -6.
  - Odczytaj q = -2 ze składnika dopisanego poza nawiasem.
  - 'Zapisz wektor: [-6, -2] (6 w lewo, 2 w dół).'
  answer:
    kind: TUPLE
    items:
    - '-6'
    - '-2'
  skills:
  - odczytywanie znaków p i q
  - zapis wektora przesunięcia
  verification:
    checkability: REFERENCE_CALL
    note: 2 components matched
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: przesunięta hiperbola - asymptoty i dziedzina
  statement: Wykres funkcji g jest opisany wzorem g(x) = \frac{3}{x - 2} + 5 i powstał z wykresu funkcji
    f(x) = \frac{3}{x} przez przesunięcie o pewien wektor. Podaj równanie asymptoty pionowej oraz równanie
    asymptoty poziomej wykresu funkcji g, a także dziedzinę tej funkcji.
  statement_latex: g(x) = \frac{3}{x - 2} + 5
  solution: |-
    Wzór g(x) = f(x - 2) + 5 oznacza przesunięcie wykresu funkcji f o wektor [2,\ 5].
    Razem z wykresem przesuwają się jego asymptoty:
    - asymptota pionowa x = 0 przechodzi na prostą x = 0 + 2, czyli x = 2,
    - asymptota pozioma y = 0 przechodzi na prostą y = 0 + 5, czyli y = 5.
    Dziedziną funkcji f jest \mathbb{R} \setminus \{0\}; liczbę wykluczoną również przesuwamy o p = 2, więc D_g = \mathbb{R} \setminus \{2\}. Zgadza się to z warunkiem x - 2 \neq 0.
  solution_steps:
  - 'Odczytaj ze wzoru wektor przesunięcia: p = 2, q = 5.'
  - 'Przesuń asymptotę pionową: x = 0 przechodzi na x = 2.'
  - 'Przesuń asymptotę poziomą: y = 0 przechodzi na y = 5.'
  - 'Przesuń punkt wykluczony z dziedziny: 0 przechodzi na 2, więc D = R \ {2}.'
  answer:
    kind: MULTIPART
    parts:
    - name: asymptota pionowa
      answer:
        kind: SYMBOLIC
        latex: x = 2
    - name: asymptota pozioma
      answer:
        kind: SYMBOLIC
        latex: y = 5
    - name: dziedzina
      answer:
        kind: SYMBOLIC
        latex: \mathbb{R}\setminus\left\{2\right\}
  skills:
  - przesunięcie hiperboli
  - wyznaczanie asymptot wykresu przesuniętego
  - dziedzina funkcji wymiernej
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: NOT_MACHINE_CHECKABLE: ''piecewise / matrix form'''
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: własności funkcji po przesunięciu poziomym
  statement: Funkcja f jest określona w przedziale \langle -5,\ 3 \rangle, jej zbiorem wartości jest przedział
    \langle -2,\ 4 \rangle, a jej miejscami zerowymi są liczby -4 oraz 1. Funkcja g jest określona wzorem
    g(x) = f(x + 2). Wyznacz dziedzinę funkcji g, jej zbiór wartości oraz wszystkie jej miejsca zerowe.
  statement_latex: g(x) = f\left(x + 2\right)
  solution: |-
    Ponieważ x + 2 = x - (-2), mamy p = -2 oraz q = 0, czyli przesunięcie o wektor [-2,\ 0] — o 2 jednostki w lewo.
    Dziedzina: do obu końców przedziału \langle -5,\ 3 \rangle dodajemy p = -2, więc D_g = \langle -7,\ 1 \rangle.
    Zbiór wartości: przesunięcie poziome nie zmienia żadnej wartości funkcji, więc ZW_g = \langle -2,\ 4 \rangle.
    Miejsca zerowe: przy przesunięciu poziomym każde miejsce zerowe przesuwa się o p, więc -4 + (-2) = -6 oraz 1 + (-2) = -1. Obie liczby należą do dziedziny \langle -7,\ 1 \rangle.
    Sprawdzenie: g(-6) = f(-6 + 2) = f(-4) = 0 oraz g(-1) = f(-1 + 2) = f(1) = 0.
  solution_steps:
  - Zapisz x + 2 = x - (-2), stąd p = -2, q = 0 — przesunięcie o 2 w lewo.
  - 'Dziedzina: <-5 - 2, 3 - 2> = <-7, 1>.'
  - 'Zbiór wartości nie zmienia się przy ruchu poziomym: <-2, 4>.'
  - 'Miejsca zerowe przesuń o p: -4 - 2 = -6 oraz 1 - 2 = -1.'
  - 'Sprawdź: g(-6) = f(-4) = 0 i g(-1) = f(1) = 0.'
  answer:
    kind: MULTIPART
    parts:
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '-7'
        hi: '1'
        lo_open: false
        hi_open: false
    - name: zbior wartosci
      answer:
        kind: INTERVAL
        lo: '-2'
        hi: '4'
        lo_open: false
        hi_open: false
    - name: miejsca zerowe
      answer:
        kind: SET
        members:
        - '-6'
        - '-1'
  skills:
  - wpływ przesunięcia na dziedzinę
  - wpływ przesunięcia na zbiór wartości
  - miejsca zerowe po przesunięciu poziomym
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: przesunięcie wykresu wartości bezwzględnej
  statement: Dana jest funkcja g określona wzorem g(x) = \left| x + 1 \right| - 3, której wykres powstaje
    z wykresu funkcji f(x) = \left| x \right| przez przesunięcie o pewien wektor. a) Naszkicuj wykres
    funkcji g i uzasadnij, że jego wierzchołek ma współrzędne (-1,\ -3). b) Wyznacz miejsca zerowe funkcji
    g. c) Podaj zbiór wartości funkcji g. d) Podaj maksymalny przedział, w którym funkcja g jest malejąca.
  statement_latex: g(x) = \left| x + 1 \right| - 3
  solution: |-
    a) Zapisujemy x + 1 = x - (-1), więc g(x) = f(x - (-1)) + (-3) — przesunięcie o wektor [-1,\ -3] (1 w lewo, 3 w dół). Wierzchołek (załamanie) wykresu f, czyli punkt (0,\ 0), przechodzi na (0 - 1,\ 0 - 3) = (-1,\ -3). Ramiona zachowują nachylenia -1 i 1, więc rysujemy literę V o wierzchołku (-1,\ -3), przechodzącą np. przez punkty (-4,\ 0), (2,\ 0) oraz (0,\ -2).
    b) \left| x + 1 \right| - 3 = 0 \iff \left| x + 1 \right| = 3 \iff x + 1 = 3 lub x + 1 = -3, czyli x = 2 lub x = -4.
    c) Zbiorem wartości funkcji f jest \langle 0,\ +\infty ), po przesunięciu o q = -3 otrzymujemy ZW_g = \langle -3,\ +\infty ).
    d) Funkcja f maleje w przedziale ( -\infty,\ 0 \rangle; przedział ten przesuwamy o p = -1, więc g maleje w ( -\infty,\ -1 \rangle.
  solution_steps:
  - 'Odczytaj wektor przesunięcia: x + 1 = x - (-1), zatem [p, q] = [-1, -3].'
  - Przesuń wierzchołek (0, 0) na (-1, -3) i naszkicuj literę V o tych samych nachyleniach ramion.
  - 'Rozwiąż |x + 1| - 3 = 0: |x + 1| = 3, stąd x = 2 lub x = -4.'
  - 'Przesuń zbiór wartości <0, +oo) o q = -3: ZW = <-3, +oo).'
  - 'Przesuń przedział malejący (-oo, 0> o p = -1: (-oo, -1>.'
  answer:
    kind: MULTIPART
    parts:
    - name: szkic i wierzcholek
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma naszkicować literę V o wierzchołku (-1, -3), przechodzącą przez punkty (-4, 0)
          i (2, 0), oraz uzasadnić, że wierzchołek (0,0) wykresu y = |x| przechodzi przy przesunięciu
          o wektor [-1, -3] na punkt (-1, -3).
    - name: miejsca zerowe
      answer:
        kind: SET
        members:
        - '-4'
        - '2'
    - name: zbior wartosci
      answer:
        kind: INTERVAL
        lo: '-3'
        hi: \infty
        lo_open: false
    - name: przedzial malejacy
      answer:
        kind: INTERVAL
        lo: -\infty
        hi: '-1'
        hi_open: false
  checks:
  - kind: solve_equation
    expr: \left| x + 1 \right| - 3 = 0
    part: miejsca zerowe
  skills:
  - szkicowanie wykresu y = f(x - p) + q
  - miejsca zerowe funkcji z wartością bezwzględną
  - przedziały monotoniczności po przesunięciu
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: szkic i wierzcholek · 0/3 other parts solved fresh'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: wyznaczanie wektora przesunięcia paraboli
  statement: Dane są funkcje f(x) = x^{2} oraz g(x) = x^{2} - 10 \cdot x + 19. a) Wyznacz wektor \vec{u}
    = [p,\ q], o który należy przesunąć wykres funkcji f, aby otrzymać wykres funkcji g. b) Podaj współrzędne
    wierzchołka paraboli będącej wykresem funkcji g. c) Punkt A = (1,\ 1) leży na wykresie funkcji f.
    Podaj współrzędne jego obrazu A' przy tym przesunięciu. d) Wyznacz miejsca zerowe funkcji g.
  statement_latex: f(x) = x^{2},\qquad g(x) = x^{2} - 10 \cdot x + 19
  solution: |-
    a) Doprowadzamy wzór funkcji g do postaci kanonicznej (uzupełnianie do kwadratu):
    g(x) = x^{2} - 10 \cdot x + 19 = \left( x^{2} - 10 \cdot x + 25 \right) - 25 + 19 = \left( x - 5 \right)^{2} - 6.
    Zatem g(x) = f(x - 5) + (-6), czyli \vec{u} = [5,\ -6] (5 jednostek w prawo i 6 jednostek w dół).
    b) Wierzchołek (0,\ 0) paraboli y = x^{2} przechodzi na W = (0 + 5,\ 0 - 6) = (5,\ -6) — zgodnie z postacią kanoniczną.
    c) A' = (1 + 5,\ 1 - 6) = (6,\ -5). Sprawdzenie: g(6) = 36 - 60 + 19 = -5, więc A' leży na wykresie g.
    d) \left( x - 5 \right)^{2} - 6 = 0 \iff \left( x - 5 \right)^{2} = 6 \iff x - 5 = \sqrt{6} lub x - 5 = -\sqrt{6}, czyli x = 5 - \sqrt{6} lub x = 5 + \sqrt{6}.
  solution_steps:
  - 'Uzupełnij do kwadratu: x^2 - 10x + 19 = (x - 5)^2 - 6.'
  - 'Porównaj z f(x - p) + q: p = 5, q = -6, więc wektor to [5, -6].'
  - 'Przesuń wierzchołek (0, 0) o wektor: W = (5, -6).'
  - 'Przesuń punkt A = (1, 1): A'' = (6, -5); sprawdź g(6) = -5.'
  - 'Rozwiąż (x - 5)^2 = 6: x = 5 - sqrt(6) lub x = 5 + sqrt(6).'
  answer:
    kind: MULTIPART
    parts:
    - name: wektor
      answer:
        kind: TUPLE
        items:
        - '5'
        - '-6'
    - name: wierzcholek
      answer:
        kind: TUPLE
        items:
        - '5'
        - '-6'
    - name: obraz punktu A
      answer:
        kind: TUPLE
        items:
        - '6'
        - '-5'
    - name: miejsca zerowe
      answer:
        kind: SET
        members:
        - 5 - \sqrt{6}
        - 5 + \sqrt{6}
  checks:
  - kind: solve_equation
    expr: x^{2} - 10 \cdot x + 19 = 0
    part: miejsca zerowe
  skills:
  - postać kanoniczna funkcji kwadratowej
  - wyznaczanie wektora przesunięcia z dwóch wzorów
  - obraz punktu wykresu
  - miejsca zerowe funkcji kwadratowej
  verification:
    checkability: REFERENCE_CALL
    note: 4 parts matched
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: wyznaczanie wektora przesunięcia z postaci ogólnej i własności funkcji przesuniętej
  statement: Dane są funkcje f oraz g określone dla każdej liczby rzeczywistej x wzorami f\left(x\right)=x^2
    oraz g\left(x\right)=x^2-8x+11. Wykres funkcji g powstaje z wykresu funkcji f przez przesunięcie o
    wektor \vec{u}=\left[p,\ q\right]. Wyznacz liczby p i q, wyznacz miejsca zerowe funkcji g oraz podaj
    zbiór wartości funkcji g.
  statement_latex: g\left(x\right)=x^2-8\cdot x+11=\left(x-p\right)^2+q
  solution: |-
    Doprowadzamy wzór funkcji g do postaci kanonicznej (uzupełnianie do kwadratu):
    g(x)=x^2-8x+11=\left(x^2-8x+16\right)-16+11=\left(x-4\right)^2-5.
    Można też skorzystać ze wzorów: p=-\frac{b}{2a}=-\frac{-8}{2\cdot 1}=4 oraz q=g(4)=16-32+11=-5.
    Zatem g(x)=f\left(x-4\right)+\left(-5\right), czyli wektor przesunięcia to \vec{u}=[4,\ -5]: 4 jednostki w prawo i 5 jednostek w dół. Wierzchołkiem paraboli g jest punkt W=(4,-5) (obraz punktu (0,0)).

    Miejsca zerowe wyznaczamy z równania \left(x-4\right)^2-5=0, czyli \left(x-4\right)^2=5, stąd x-4=\sqrt{5} lub x-4=-\sqrt{5}, więc x=4+\sqrt{5} lub x=4-\sqrt{5}. (Uwaga: miejsca zerowe funkcji f, czyli x=0, NIE przesuwają się tylko o p, bo przesunięcie ma także część pionową.)

    Zbiór wartości funkcji f to \langle 0,+\infty\right), po przesunięciu o q=-5 otrzymujemy ZW_g=\langle -5,+\infty\right).
  solution_steps:
  - 'Uzupełnij wyrażenie x^2-8x+11 do kwadratu: x^2-8x+11=\left(x-4\right)^2-5.'
  - Odczytaj z postaci f(x-p)+q liczby p=4 oraz q=-5, czyli \vec{u}=[4,-5].
  - Rozwiąż równanie \left(x-4\right)^2-5=0 i otrzymaj x=4-\sqrt{5} oraz x=4+\sqrt{5}.
  - 'Przesuń zbiór wartości \langle 0,+\infty\right) o q=-5: ZW_g=\langle -5,+\infty\right).'
  answer:
    kind: MULTIPART
    parts:
    - name: p
      answer:
        kind: NUMERIC
        value: 4.0
    - name: q
      answer:
        kind: NUMERIC
        value: -5.0
    - name: miejsca_zerowe
      answer:
        kind: SET
        members:
        - 4-\sqrt{5}
        - 4+\sqrt{5}
    - name: zbior_wartosci
      answer:
        kind: INTERVAL
        lo: '-5'
        hi: \infty
        lo_open: false
  checks:
  - kind: evaluate
    expr: -\frac{-8}{2\cdot 1}
    part: p
  - kind: evaluate
    expr: \frac{4\cdot 1\cdot 11-\left(-8\right)^2}{4\cdot 1}
    part: q
  - kind: solve_equation
    expr: x^2-8\cdot x+11=0
    part: miejsca_zerowe
  skills:
  - postać kanoniczna funkcji kwadratowej
  - odczytywanie wektora przesunięcia
  - miejsca zerowe funkcji kwadratowej
  - zbiór wartości po przesunięciu pionowym
  verification:
    checkability: REFERENCE_CALL
    note: 4 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: przesunięcie hiperboli o wektor — wzór, asymptoty, miejsce zerowe, punkt wykresu
  statement: |-
    Dana jest funkcja f określona wzorem f\left(x\right)=\frac{-3}{x} dla każdej liczby rzeczywistej x\neq 0. Wykres funkcji f przesunięto o wektor \vec{u}=\left[2,\ -1\right] i otrzymano wykres funkcji g.
    a) Zapisz wzór funkcji g i podaj jej dziedzinę.
    b) Podaj równania asymptoty pionowej i asymptoty poziomej wykresu funkcji g.
    c) Wyznacz miejsce zerowe funkcji g.
    d) Oblicz g\left(5\right) i rozstrzygnij, czy punkt A=\left(5,\ -2\right) należy do wykresu funkcji g.
  statement_latex: g\left(x\right)=\frac{-3}{x-2}-1
  solution: |-
    a) Dla wektora \vec{u}=[p,q]=[2,-1] mamy g(x)=f\left(x-2\right)+\left(-1\right), czyli g(x)=\frac{-3}{x-2}-1. Dziedziną funkcji f jest \mathbb{R}\setminus\{0\}; przesuwamy ją o p=2, więc D_g=\mathbb{R}\setminus\{2\} (sprawdzenie: mianownik x-2\neq 0).

    b) Asymptota pionowa x=0 przechodzi na x=0+2=2, asymptota pozioma y=0 przechodzi na y=0+(-1)=-1. Zatem asymptoty mają równania x=2 oraz y=-1.

    c) \frac{-3}{x-2}-1=0 \iff \frac{-3}{x-2}=1 \iff -3=x-2 (dla x\neq 2) \iff x=-1. Liczba -1 należy do dziedziny, więc jedynym miejscem zerowym jest x=-1.

    d) g(5)=\frac{-3}{5-2}-1=\frac{-3}{3}-1=-1-1=-2. Ponieważ g(5)=-2, punkt A=(5,-2) należy do wykresu funkcji g. (Kontrola: przesuwając A o wektor przeciwny [-2,1], otrzymujemy punkt (3,-1), a f(3)=\frac{-3}{3}=-1 ✓.)
  solution_steps:
  - Z wektora [2,-1] odczytaj p=2, q=-1 i zapisz g(x)=f\left(x-2\right)-1=\frac{-3}{x-2}-1.
  - 'Przesuń punkt wykluczony z dziedziny: 0\mapsto 2, więc D_g=\mathbb{R}\setminus\{2\}.'
  - 'Przesuń asymptoty: x=0\mapsto x=2 oraz y=0\mapsto y=-1.'
  - Rozwiąż \frac{-3}{x-2}-1=0, otrzymując x=-1 (należy do dziedziny).
  - Oblicz g(5)=\frac{-3}{3}-1=-2 i porównaj z drugą współrzędną punktu A — punkt należy do wykresu.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_g
      answer:
        kind: SYMBOLIC
        latex: g\left(x\right)=\frac{-3}{x-2}-1
    - name: dziedzina
      answer:
        kind: SYMBOLIC
        latex: \mathbb{R}\setminus\{2\}
    - name: asymptota_pionowa
      answer:
        kind: SYMBOLIC
        latex: x=2
    - name: asymptota_pozioma
      answer:
        kind: SYMBOLIC
        latex: y=-1
