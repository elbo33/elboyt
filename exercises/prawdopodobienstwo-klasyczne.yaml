- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie prawdopodobieństwa w modelu klasycznym
  statement: Rzucamy jeden raz symetryczną sześcienną kostką do gry, która na każdej ściance ma inną liczbę
    oczek — od jednego oczka do sześciu oczek. Zdarzenie A polega na tym, że wypadła liczba oczek podzielna
    przez 3. Oblicz prawdopodobieństwo zdarzenia A oraz prawdopodobieństwo zdarzenia przeciwnego A'. Zapisz
    obliczenia.
  statement_latex: P(A)=\frac{|A|}{|\Omega|},\qquad P(A')=1-P(A)
  solution: |-
    Kostka jest symetryczna, więc stosujemy model klasyczny. Zbiorem wszystkich zdarzeń elementarnych jest \Omega=\{1,2,3,4,5,6\}, zatem |\Omega|=6.
    Zdarzeniu A sprzyjają te wyniki, które są podzielne przez 3: A=\{3,6\}, więc |A|=2.
    Stąd P(A)=\frac{2}{6}=\frac{1}{3}.
    Zdarzenie przeciwne A' to „wypadła liczba oczek niepodzielna przez 3”, czyli A'=\{1,2,4,5\}, |A'|=4, więc P(A')=\frac{4}{6}=\frac{2}{3}. Zgadza się to ze wzorem P(A')=1-\frac{1}{3}=\frac{2}{3}.
  solution_steps:
  - 'Ustalamy zbiór wszystkich zdarzeń elementarnych: \Omega=\{1,2,3,4,5,6\}, |\Omega|=6.'
  - 'Wypisujemy zdarzenia sprzyjające: A=\{3,6\}, |A|=2.'
  - Obliczamy P(A)=\frac{2}{6}=\frac{1}{3}.
  - Wyznaczamy zdarzenie przeciwne A'=\{1,2,4,5\}, |A'|=4, więc P(A')=\frac{4}{6}=\frac{2}{3}.
  answer:
    kind: MULTIPART
    parts:
    - name: P(A)
      answer:
        kind: SYMBOLIC
        latex: \frac{1}{3}
    - name: P(A')
      answer:
        kind: SYMBOLIC
        latex: \frac{2}{3}
  checks:
  - kind: evaluate
    expr: \frac{2}{6}
    part: P(A)
  - kind: evaluate
    expr: 1-\frac{2}{6}
    part: P(A')
  skills:
  - wyznaczanie zbioru \Omega
  - zliczanie zdarzeń sprzyjających
  - wzór P(A)=|A|/|\Omega|
  - zdarzenie przeciwne
  verification:
