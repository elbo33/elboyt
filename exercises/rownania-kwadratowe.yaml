- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: równanie kwadratowe deltą + postać iloczynowa
  statement: Rozwiąż równanie \(2x^{2}+7x-15=0\), a następnie zapisz trójmian \(2x^{2}+7x-15\) w postaci
    iloczynowej. Zapisz obliczenia.
  statement_latex: 2x^{2}+7x-15=0
  solution: |-
    Współczynniki: \(a=2\), \(b=7\), \(c=-15\).
    \(\Delta=7^{2}-4\cdot 2\cdot\left(-15\right)=49+120=169>0\), więc równanie ma dwa różne rozwiązania; \(\sqrt{\Delta}=13\).
    \(x_{1}=\frac{-7-13}{2\cdot 2}=\frac{-20}{4}=-5\), \(x_{2}=\frac{-7+13}{4}=\frac{6}{4}=\frac{3}{2}\).
    Sprawdzenie wzorami Viète'a: \(x_{1}+x_{2}=-5+\frac{3}{2}=-\frac{7}{2}=-\frac{b}{a}\) ✓ oraz \(x_{1}\cdot x_{2}=-5\cdot\frac{3}{2}=-\frac{15}{2}=\frac{c}{a}\) ✓.
    Postać iloczynowa: \(2x^{2}+7x-15=2\cdot\left(x-\frac{3}{2}\right)\cdot\left(x+5\right)\) (nie wolno pominąć czynnika \(a=2\); można też zapisać \(\left(2x-3\right)\left(x+5\right)\)).
  solution_steps:
  - Odczytaj a = 2, b = 7, c = −15.
  - Oblicz Δ = 7² − 4·2·(−15) = 169 oraz √Δ = 13.
  - Wyznacz x₁ = (−7 − 13)/4 = −5 i x₂ = (−7 + 13)/4 = 3/2.
  - Sprawdź wynik wzorami Viète'a.
  - 'Zapisz postać iloczynową: 2(x − 3/2)(x + 5).'
  answer:
    kind: MULTIPART
    parts:
    - name: rozwiazania
      answer:
        kind: SET
        members:
        - '-5'
        - \frac{3}{2}
    - name: postac iloczynowa
      answer:
        kind: SYMBOLIC
        latex: 2\cdot\left(x-\frac{3}{2}\right)\cdot\left(x+5\right)
  checks:
  - kind: solve_equation
    expr: 2x^{2}+7x-15=0
    part: rozwiazania
  - kind: simplify
    expr: 2x^{2}+7x-15
    part: postac iloczynowa
  skills:
  - obliczanie wyróżnika
  - wzory na pierwiastki
  - zapis postaci iloczynowej
