- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: optymalizacja kwadratowa z ograniczeniem (przychód)
  statement: Kwiaciarnia sprzedaje dziennie 40 bukietów w cenie 30 zł za bukiet. Właściciel ustalił, że
    każde obniżenie ceny bukietu o 1 zł zwiększa dzienną sprzedaż o 4 bukiety (obniżka nie musi być całkowitą
    liczbą złotych, a wszystkie przygotowane bukiety zostają sprzedane). Właściciel rozważa jedynie obniżenie
    ceny, nigdy jej podwyższenie. Ze względu na możliwości pracowni kwiaciarnia może przygotować dziennie
    co najwyżej 60 bukietów. Jaka powinna być cena bukietu, aby dzienny przychód ze sprzedaży bukietów
    był największy? Oblicz ten największy dzienny przychód. Zapisz obliczenia.
  statement_latex: P\left(x\right) = \left(30 - x\right)\cdot\left(40 + 4\cdot x\right) = -4\cdot x^2
    + 80\cdot x + 1200
  solution: |-
    Niech x oznacza obniżkę ceny bukietu w złotych, x ≥ 0. Wtedy cena wynosi (30 - x) zł, a dzienna sprzedaż (40 + 4x) bukietów.
    Ograniczenie z treści: 40 + 4x ≤ 60, czyli 4x ≤ 20, stąd x ≤ 5. Zatem x ∈ ⟨0, 5⟩.
    Przychód: P(x) = (30 - x)(40 + 4x) = 1200 + 120x - 40x - 4x^2 = -4x^2 + 80x + 1200.
    Współczynnik a = -4 < 0, więc ramiona paraboli są skierowane w dół, a p = -\frac{80}{2\cdot(-4)} = 10.
    p = 10 ∉ ⟨0, 5⟩ — wierzchołek leży na prawo od przedziału. Dla a < 0 funkcja rośnie w (-∞, 10⟩, a cały przedział ⟨0,5⟩ zawiera się w (-∞,10⟩, więc P jest na nim rosnąca i wartość największą przyjmuje dla x = 5.
    P(5) = (30 - 5)(40 + 4·5) = 25·60 = 1500.
    Odpowiedź: cena bukietu powinna wynosić 25 zł; największy dzienny przychód to 1500 zł (sprzedanych zostanie 60 bukietów). Wartość P(10) = 1600 zł jest nieosiągalna, bo wtedy trzeba by przygotować 80 bukietów.
  solution_steps:
  - 'Wprowadź zmienną: x — obniżka ceny w złotych; cena 30 - x, sprzedaż 40 + 4x.'
  - Z warunku 40 + 4x ≤ 60 oraz x ≥ 0 wyznacz dziedzinę x ∈ ⟨0, 5⟩.
  - Zapisz przychód P(x) = (30-x)(40+4x) = -4x^2 + 80x + 1200.
  - Oblicz p = -\frac{80}{2\cdot(-4)} = 10 i stwierdź, że 10 ∉ ⟨0,5⟩.
  - Z monotoniczności (a<0, przedział na lewo od p) wynika, że maksimum jest w x = 5.
  - Oblicz cenę 30 - 5 = 25 zł i przychód P(5) = 25·60 = 1500 zł.
  answer:
    kind: MULTIPART
    parts:
    - name: cena
      answer:
        kind: NUMERIC
        value: 25.0
    - name: przychod
      answer:
        kind: NUMERIC
        value: 1500.0
  checks:
  - kind: evaluate
    expr: 30 - \frac{60 - 40}{4}
    part: cena
  - kind: evaluate
    expr: \left(30 - 5\right)\cdot\left(40 + 4\cdot 5\right)
    part: przychod
