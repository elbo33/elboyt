- id: g-cm-10
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 3
  exercise_type: analiza błędu — znak przy grupowaniu
  statement: Rozwiąż równanie x^{3}+4x^{2}-25x-100=0. Uczeń w trakcie grupowania zapisał, że -25x-100=-25\left(x-4\right),
    po czym stwierdził, że nawiasy się nie zgadzają i metoda grupowania tu nie działa. Wyjaśnij, gdzie
    popełnił błąd, i podaj poprawny zbiór rozwiązań.
  statement_latex: x^{3}+4x^{2}-25x-100=0
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń grupuje \left(x^{3}+4x^{2}\right)+\left(-25x-100\right), z pierwszej pary wyłącza poprawnie x^{2}\left(x+4\right), ale z drugiej pary pisze -25\left(x-4\right). Nawiasy \left(x+4\right) i \left(x-4\right) są różne, więc uczeń nie może wyłączyć wspólnego nawiasu i uznaje, że grupowanie zawiodło.
    GDZIE JEST BŁĄD: sprawdźmy wyłączenie przez wymnożenie: -25\left(x-4\right)=-25x+100, a mieliśmy -25x-100. Poprawnie jest -25\left(x+4\right), bo -25\cdot4=-100.
    POPRAWNE ROZWIĄZANIE:
    x^{3}+4x^{2}-25x-100=x^{2}\left(x+4\right)-25\left(x+4\right)=\left(x+4\right)\left(x^{2}-25\right).
    Czynnik x^{2}-25 to różnica kwadratów: \left(x-5\right)\left(x+5\right), więc
    \left(x+4\right)\left(x-5\right)\left(x+5\right)=0.
    Stąd x=-4 lub x=5 lub x=-5.
    Sprawdzenie dla x=5: 125+100-125-100=0 — zgadza się.
    Odpowiedź: x\in\left\{-5,-4,5\right\}.
  solution_steps:
  - 'Pokaż błędne wyłączenie: -25x-100=-25\left(x-4\right) i wynikający z niego wniosek, że grupowanie
    nie działa.'
  - 'Sprawdź to wyłączenie przez wymnożenie: -25\left(x-4\right)=-25x+100\neq -25x-100.'
  - 'Popraw znak: -25x-100=-25\left(x+4\right).'
  - 'Wyłącz wspólny nawias: \left(x+4\right)\left(x^{2}-25\right)=0 i rozłóż różnicę kwadratów.'
  - Z własności iloczynu zerowego otrzymaj x\in\left\{-5,-4,5\right\} i sprawdź jedno rozwiązanie.
