  exercise_type: klasyfikacja trójkąta z długości boków
  statement: Boki trójkąta mają długości 7, 9 i 11. Oblicz sumę kwadratów dwóch krótszych boków oraz kwadrat
    najdłuższego boku i rozstrzygnij, jakiego rodzaju jest ten trójkąt.
  statement_latex: 7^{2}+9^{2} \quad\text{oraz}\quad 11^{2}
  solution: |-
    Porządkuję boki rosnąco: 7 < 9 < 11, więc c = 11 jest najdłuższym bokiem, a = 7, b = 9.
    Warunek istnienia: 7 + 9 = 16 > 11 — trójkąt istnieje.
    Suma kwadratów krótszych boków: 7² + 9² = 49 + 81 = 130.
    Kwadrat najdłuższego boku: 11² = 121.
    Ponieważ 130 > 121, czyli a² + b² > c², kąt leżący naprzeciw boku 11 jest ostry. Jest to największy kąt trójkąta, więc wszystkie kąty są ostre — trójkąt jest ostrokątny.
  solution_steps:
  - 'Porządkuję boki rosnąco: 7 < 9 < 11; najdłuższy bok c = 11.'
  - 'Sprawdzam warunek istnienia: 7 + 9 = 16 > 11.'
  - Obliczam 7² + 9² = 130.
  - Obliczam 11² = 121.
  - Ponieważ 130 > 121, kąt naprzeciw najdłuższego boku jest ostry, więc trójkąt jest ostrokątny.
  answer:
    kind: MULTIPART
    parts:
