    Podaj współrzędne środka S oraz promień r tego okręgu. Uczeń zapisał odpowiedź S = (6, -2). Wyjaśnij,
    na czym polega jego błąd, i podaj poprawną odpowiedź.
  statement_latex: \left(x+6\right)^{2}+\left(y-2\right)^{2}=49
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń przepisał liczby widoczne w nawiasach bez zmiany znaku — z (x+6)^2 wziął 6, a z (y-2)^2 wziął -2 — i otrzymał S=(6,-2).

    DLACZEGO TO JEST ŹLE: wzorcem jest zawsze (x-a)^2+(y-b)^2=r^2, a więc w nawiasie stoi RÓŻNICA x-a. Liczba widoczna w nawiasie jest liczbą PRZECIWNĄ do współrzędnej środka. Łatwo to sprawdzić: dla S=(6,-2) i r=7 środek musiałby spełniać (6+6)^2+(-2-2)^2=144+16=160\neq 0, tzn. sam środek 'wypadałby' daleko od okręgu w sposób niezgodny z równaniem, bo lewa strona zeruje się dopiero dla x=-6, y=2.

    POPRAWNIE: (x+6)^2=(x-(-6))^2, więc a=-6; (y-2)^2 daje b=2. Zatem S=(-6,2).
    Promień: prawa strona to r^2, więc r=\sqrt{49}=7.
    Odpowiedź: S=(-6,2), r=7.
