  statement: 'Uczeń rozkładał na czynniki wyrażenie a(x - 4) + b(4 - x) i zapisał: a(x - 4) + b(4 - x)
    = (x - 4)(a + b), tłumacząc, że „to ten sam nawias, tylko z przestawionymi wyrazami". Wyjaśnij, na
    czym polega błąd, i podaj poprawną postać iloczynową tego wyrażenia.'
  statement_latex: a\cdot\left(x - 4\right) + b\cdot\left(4 - x\right)
  solution: |-
    Błędne rozumowanie: uczeń uznał, że (4 - x) to to samo co (x - 4). Sprawdzenie przez wymnożenie: \left(x-4\right)\left(a+b\right) = ax + bx - 4a - 4b, natomiast a(x-4) + b(4-x) = ax - 4a + 4b - bx. Wyrażenia te są różne (np. dla x = 0, a = 1, b = 1 pierwsze daje -8, a drugie 4).
    Przestawianie wyrazów jest dozwolone przy dodawaniu, ale nie przy odejmowaniu: 4 - x = -\left(x - 4\right). Zatem b\left(4 - x\right) = -b\left(x - 4\right) i całe wyrażenie zapisujemy jako a\left(x - 4\right) - b\left(x - 4\right) = \left(x - 4\right)\left(a - b\right). Sprawdzenie: (x-4)(a-b) = ax - bx - 4a + 4b, czyli dokładnie a(x-4) + b(4-x). ✓
  solution_steps:
  - 'Zauważ, że nawiasy (x − 4) i (4 − x) nie są równe, lecz przeciwne: 4 − x = −(x − 4).'
  - 'Pokaż błąd liczbowo lub przez wymnożenie: (x − 4)(a + b) = ax + bx − 4a − 4b ≠ ax − 4a + 4b − bx.'
  - 'Zamień drugi wyraz: b(4 − x) = −b(x − 4).'
  - 'Wyłącz wspólny nawias: a(x − 4) − b(x − 4) = (x − 4)(a − b).'
  - Sprawdź wynik przez wymnożenie.
