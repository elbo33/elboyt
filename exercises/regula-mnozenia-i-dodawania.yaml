- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: zliczanie dwuetapowe / porównanie obu reguł
  statement: W stołówce w zestawie obiadowym można wybrać jedną z 4 zup oraz jedno z 6 dań głównych. a)
    Ile jest różnych zestawów obiadowych złożonych z zupy i dania głównego? b) Na ile sposobów można zamówić
    tylko jedną potrawę (zupę albo danie główne)?
  statement_latex: a)\ N_a = 4\cdot 6,\qquad b)\ N_b = 4 + 6
  solution: |-
    a) Zestaw powstaje w dwóch etapach: najpierw wybieramy zupę (4 sposoby), a potem danie główne (6 sposobów). Liczba możliwości na drugim etapie nie zależy od tego, którą zupę wybrano, więc stosujemy regułę mnożenia: N_a = 4\cdot 6 = 24.
    b) Teraz zamawiamy TYLKO JEDNĄ potrawę: jest to zupa ALBO danie główne. Te przypadki są rozłączne (żadna potrawa nie jest jednocześnie zupą i daniem głównym), więc stosujemy regułę dodawania: N_b = 4 + 6 = 10.
    Odpowiedź: 24 zestawy oraz 10 sposobów wyboru jednej potrawy.
  solution_steps:
  - 'a) Rozbij konstrukcję zestawu na etapy: zupa, potem danie główne.'
  - 'a) Zapisz liczby możliwości: 4 i 6, i zastosuj regułę mnożenia: 4·6 = 24.'
  - b) Zauważ, że wybór jednej potrawy to przypadek „zupa” albo „danie główne” — przypadki rozłączne.
  - 'b) Zastosuj regułę dodawania: 4 + 6 = 10.'
  answer:
    kind: MULTIPART
    parts:
    - name: zestawy
      answer:
        kind: NUMERIC
        value: 24.0
    - name: jedna potrawa
      answer:
        kind: NUMERIC
        value: 10.0
  checks:
  - kind: evaluate
    expr: 4\cdot 6
    part: zestawy
  - kind: evaluate
    expr: 4 + 6
    part: jedna potrawa
  skills:
  - reguła mnożenia
  - reguła dodawania
  - rozpoznanie „i” kontra „albo”
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [zestawy] SymPy solved it fresh: 24.0 vs 24.0 (tol 1e-09) ;
      [jedna potrawa] SymPy solved it fresh: 10.0 vs 10.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 1
  exercise_type: wybór z powtórzeniami
  statement: Kod zabezpieczający rower składa się z trzech cyfr ustawionych w ustalonej kolejności; na
    każdym miejscu może stać dowolna z cyfr 0, 1, 2, …, 9 i cyfry mogą się powtarzać. Oblicz, ile jest
    wszystkich takich kodów.
  statement_latex: N = 10\cdot 10\cdot 10
  solution: |-
    Kod powstaje w trzech etapach: ustawiamy cyfrę na pierwszym miejscu, potem na drugim, potem na trzecim. Ponieważ cyfry mogą się powtarzać, na każdym etapie mamy tyle samo, czyli 10 możliwości (cyfry od 0 do 9), niezależnie od wcześniejszych wyborów.
    Z reguły mnożenia: N = 10\cdot 10\cdot 10 = 10^{3} = 1000.
    Odpowiedź: jest 1000 takich kodów.
  solution_steps:
  - Zauważ, że kod to trójka cyfr ustawionych w kolejności — kolejność ma znaczenie.
  - 'Sprawdź, czy dozwolone są powtórzenia: tak, więc na każdym miejscu 10 możliwości.'
  - 'Zastosuj regułę mnożenia: 10·10·10 = 1000.'
  answer:
    kind: NUMERIC
    value: 1000.0
  checks:
  - kind: evaluate
    expr: 10\cdot 10\cdot 10
  skills:
  - reguła mnożenia
  - wybór z powtórzeniami
  - metoda miejsc
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 1000.0 vs 1000.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: ustawienia wszystkich elementów
  statement: Na półce ustawiamy obok siebie 5 różnych książek. Oblicz, na ile sposobów można to zrobić.
  statement_latex: N = 5\cdot 4\cdot 3\cdot 2\cdot 1
  solution: |-
    Ustawienie powstaje w pięciu etapach: wybieramy książkę na pierwsze miejsce (5 sposobów), potem na drugie (pozostały 4 książki), potem na trzecie (3), czwarte (2) i piąte (1). Raz ustawionej książki nie można użyć ponownie, więc liczba możliwości maleje o 1 na każdym etapie, ale nie zależy od tego, KTÓRE książki już zużyliśmy.
    Z reguły mnożenia: N = 5\cdot 4\cdot 3\cdot 2\cdot 1 = 120.
    Odpowiedź: 120 sposobów.
  solution_steps:
  - 'Rozbij ustawianie na etapy: kolejno obsadzamy miejsca od pierwszego do piątego.'
  - 'Zauważ brak powtórzeń: liczby możliwości to 5, 4, 3, 2, 1.'
  - 'Pomnóż: 5·4·3·2·1 = 120.'
  answer:
    kind: NUMERIC
    value: 120.0
  checks:
  - kind: evaluate
    expr: 5\cdot 4\cdot 3\cdot 2\cdot 1
  skills:
  - reguła mnożenia bez powtórzeń
  - permutacje
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 120.0 vs 120.0 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: zliczanie liczb metodą miejsc
  statement: Rozważamy liczby naturalne trzycyfrowe o wszystkich cyfrach różnych, w których zapisie dziesiętnym
    występują wyłącznie cyfry ze zbioru \{0,\ 2,\ 4,\ 5,\ 7\}. a) Oblicz, ile jest wszystkich takich liczb.
    b) Oblicz, ile spośród nich jest nieparzystych. Zapisz obliczenia.
  statement_latex: a)\ N_a = 4\cdot 4\cdot 3,\qquad b)\ N_b = 2\cdot 3\cdot 3
  solution: |-
    a) Rysujemy trzy miejsca: setki, dziesiątki, jedności. Najbardziej ograniczone jest miejsce setek, bo cyfra 0 nie może tam stać: pozostają cyfry 2, 4, 5, 7, czyli 4 możliwości. Na miejscu dziesiątek może stać każda z pozostałych 4 cyfr zbioru (w tym 0), a na miejscu jedności każda z pozostałych 3.
    N_a = 4\cdot 4\cdot 3 = 48.

    b) Warunek nieparzystości dotyczy ostatniego miejsca, więc wypełniamy je najpierw: cyfra jedności musi być nieparzysta, czyli 5 albo 7 — 2 możliwości. Następnie setki: cyfra różna od 0 i różna od użytej na końcu, czyli jedna z 3 pozostałych cyfr zbioru \{2,4,5,7\} — 3 możliwości. Na koniec dziesiątki: dowolna z 3 niewykorzystanych cyfr — 3 możliwości.
    N_b = 2\cdot 3\cdot 3 = 18.
    Odpowiedź: a) 48 liczb, b) 18 liczb nieparzystych.
  solution_steps:
  - 'a) Zapisz ograniczenia: trzy miejsca, cyfry różne, na pierwszym miejscu nie może być 0.'
  - a) Wypełnij najpierw setki (4 możliwości), potem dziesiątki (4) i jedności (3).
  - 'a) Pomnóż: 4·4·3 = 48.'
  - 'b) Zacznij od miejsca najbardziej ograniczonego: jedności nieparzyste, czyli 5 lub 7 — 2 możliwości.'
  - 'b) Setki: cyfra ≠ 0 i ≠ użyta — 3 możliwości; dziesiątki: 3 możliwości.'
  - 'b) Pomnóż: 2·3·3 = 18.'
  answer:
    kind: MULTIPART
    parts:
    - name: wszystkie
      answer:
        kind: NUMERIC
        value: 48.0
    - name: nieparzyste
      answer:
        kind: NUMERIC
        value: 18.0
  checks:
  - kind: evaluate
    expr: 4\cdot 4\cdot 3
    part: wszystkie
  - kind: evaluate
    expr: 2\cdot 3\cdot 3
    part: nieparzyste
