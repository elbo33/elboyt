    note: 'could not compare: part disagrees: AMBIGUOUS: ''parser returned an unresolved ambiguity (_ambig)'''
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: rzut pionowy – wierzchołek paraboli
  statement: W chwili t = 0 z poziomu ziemi wyrzucono pionowo w górę kamień. Wysokość kamienia (w metrach)
    po t sekundach opisuje wzór h\left(t\right)=-5t^{2}+30t. (a) Oblicz, po jakim czasie kamień osiągnie
    największą wysokość. (b) Oblicz tę największą wysokość. Zapisz obliczenia.
  statement_latex: h\left(t\right)=-5t^{2}+30t
  solution: |-
    Funkcja h jest funkcją kwadratową o współczynniku a=-5<0, więc jej wykres to parabola o ramionach skierowanych w dół i największą wartość funkcja przyjmuje w wierzchołku.
    (a) p=-\frac{b}{2a}=-\frac{30}{2\cdot(-5)}=3. Zatem kamień jest najwyżej po 3 sekundach.
    (b) q=h(3)=-5\cdot 3^{2}+30\cdot 3=-45+90=45.
    Odpowiedź: kamień osiąga największą wysokość 45 m po 3 sekundach lotu. (p = 3 s to CHWILA, q = 45 m to WYSOKOŚĆ.)
  solution_steps:
  - Zauważ, że a = -5 < 0, więc funkcja ma wartość największą w wierzchołku.
  - Oblicz p = -\frac{30}{2\cdot(-5)} = 3 (s).
  - Oblicz q = h(3) = -5\cdot 9 + 90 = 45 (m).
  - 'Zinterpretuj: p to czas w sekundach, q to wysokość w metrach.'
  answer:
    kind: MULTIPART
    parts:
    - name: czas osiągnięcia największej wysokości (s)
      answer:
        kind: NUMERIC
        value: 3.0
    - name: największa wysokość (m)
      answer:
        kind: NUMERIC
        value: 45.0
  checks:
  - kind: evaluate
    expr: -\frac{30}{2\cdot\left(-5\right)}
    var: t
    part: czas osiągnięcia największej wysokości (s)
  - kind: evaluate
    expr: -5\cdot 3^{2}+30\cdot 3
    var: t
    part: największa wysokość (m)
  skills:
  - wierzchołek paraboli jako ekstremum
  - interpretacja p i q
  - rzut pionowy
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [czas osiągnięcia największej wysokości (s)] SymPy solved it
      fresh: 3.0 vs 3.0 (tol 1e-09) ; [największa wysokość (m)] SymPy solved it fresh: 45.0 vs 45.0 (tol
      1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: model geometryczny – wzór i dziedzina
  statement: Rozważamy wszystkie prostokąty o obwodzie równym 36 cm. Niech x oznacza długość jednego boku
    takiego prostokąta (w centymetrach), a y – długość boku sąsiedniego. (a) Zapisz wzór funkcji P opisującej
    pole prostokąta w zależności od x, doprowadzając go do postaci ogólnej funkcji kwadratowej. (b) Wyznacz
    dziedzinę tej funkcji wynikającą z warunków zadania. Zapisz obliczenia.
  statement_latex: 2\cdot\left(x+y\right)=36,\qquad P\left(x\right)=x\cdot\left(18-x\right)
  solution: |-
    (a) Warunek wiążący (obwód): 2(x+y)=36, czyli x+y=18, skąd y=18-x.
    Pole prostokąta: P=x\cdot y=x\cdot(18-x)=18x-x^{2}=-x^{2}+18x.
    (b) Obie długości muszą być dodatnie: x>0 oraz y=18-x>0, czyli x<18. Część wspólna tych warunków to x \in (0,18).
    Odpowiedź: P(x)=-x^{2}+18x, D=(0,18).
  solution_steps:
  - 'Zapisz warunek wiążący z obwodu: 2(x+y)=36, czyli x+y=18.'
  - 'Wyznacz y z warunku wiążącego: y=18-x.'
  - 'Wstaw do wzoru na pole: P(x)=x(18-x)=-x^{2}+18x.'
  - 'Zapisz warunki dodatniości: x>0 oraz 18-x>0.'
  - 'Wyznacz część wspólną: D=(0,18).'
  answer:
    kind: MULTIPART
    parts:
    - name: wzór funkcji pola
      answer:
        kind: SYMBOLIC
        latex: -x^{2}+18x
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '18'
  checks:
  - kind: simplify
    expr: x\cdot\left(18-x\right)
    part: wzór funkcji pola
  stated_model:
    variable: x
    objective_latex: P\left(x\right)=x\cdot\left(18-x\right)
    domain_lo: '0'
    domain_hi: '18'
