  solution: |-
    1) Oznaczam przez x długość najkrótszego boku. Wtedy boki mają długości x, x + 3, x + 6, przy czym x > 0.
    2) Najdłuższy bok x + 6 jest przeciwprostokątną, więc z twierdzenia Pitagorasa:
    x^{2} + \left(x + 3\right)^{2} = \left(x + 6\right)^{2}.
    3) x^{2} + x^{2} + 6x + 9 = x^{2} + 12x + 36, czyli x^{2} - 6x - 27 = 0.
    4) \Delta = \left(-6\right)^{2} - 4\cdot 1\cdot\left(-27\right) = 36 + 108 = 144, \sqrt{\Delta} = 12.
    5) x = \frac{6 - 12}{2} = -3 (odrzucam, bo długość boku musi być dodatnia) albo x = \frac{6 + 12}{2} = 9.
    6) Boki mają długości 9, 12, 15 (sprawdzenie: 9^{2} + 12^{2} = 81 + 144 = 225 = 15^{2} ✓).
    7) Pole: P = \frac{1}{2}\cdot 9\cdot 12 = 54.
