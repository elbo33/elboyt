  statement: 'W kartezjańskim układzie współrzędnych (x, y) dane są punkty A = (0, 0), B = (8, 0) oraz
    C = (0, 6), które są wierzchołkami trójkąta prostokątnego o kącie prostym przy wierzchołku A. Uczeń
    rozwiązał zadanie tak: „Środek okręgu opisanego to punkt przecięcia dwusiecznych kątów trójkąta. Promień
    okręgu wpisanego wynosi r = \frac{8+6-10}{2} = 2, a dwusieczne przecinają się w punkcie odległym o
    2 od obu przyprostokątnych, czyli w punkcie (2, 2). Zatem środek okręgu opisanego to (2, 2)”. Wskaż
    błąd w tym rozumowaniu, a następnie podaj poprawne współrzędne środka O okręgu opisanego na trójkącie
    ABC oraz oblicz promień R tego okręgu.'
