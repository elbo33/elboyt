section: cechy-podobienstwa-trojkatow
name: Cechy podobieństwa trójkątów
scope: The similarity criteria for triangles (AA, SSS, SAS); identifying similar triangles and using the
  ratio of similarity to find lengths.
requirements:
- VIII.8
counts:
  total: 16
  DETERMINISTIC: 10
  REFERENCE_CALL: 2
  NOT_MACHINE_CHECKABLE: 4
exercises:
- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczanie skali i długości boku z zapisu podobieństwa
  statement: 'Trójkąty ABC i KLM są podobne, przy czym △ABC ∼ △KLM (wierzchołki wypisano w kolejności
    odpowiadania sobie). Dane są: |AB| = 6 cm, |BC| = 10 cm oraz |KL| = 9 cm. Oblicz skalę podobieństwa
    k trójkąta KLM do trójkąta ABC oraz długość boku LM.'
  statement_latex: k=\frac{\left|KL\right|}{\left|AB\right|}=\frac{9}{6},\qquad \left|LM\right|=k\cdot\left|BC\right|
  solution: |-
    Z zapisu △ABC ∼ △KLM odczytujemy odpowiadające sobie boki: AB ↔ KL, BC ↔ LM, AC ↔ KM.
    Skala podobieństwa trójkąta KLM do trójkąta ABC:
    k = |KL| / |AB| = 9/6 = 3/2.
    Stąd |LM| = k · |BC| = (3/2) · 10 = 15 cm.
    Sprawdzenie sensowności: k > 1, więc trójkąt KLM jest większy i rzeczywiście |LM| = 15 cm > |BC| = 10 cm.
  solution_steps:
  - 'Odczytaj z zapisu △ABC ∼ △KLM pary odpowiadających boków: AB ↔ KL, BC ↔ LM.'
  - 'Oblicz skalę: k = |KL|/|AB| = 9/6 = 3/2.'
  - 'Pomnóż |BC| przez k: |LM| = (3/2)·10 = 15 cm.'
  - 'Sprawdź sensowność: k > 1, więc bok LM musi być dłuższy od BC.'
  answer:
    kind: MULTIPART
    parts:
    - name: k
      answer:
        kind: SYMBOLIC
        latex: \frac{3}{2}
    - name: LM
      answer:
        kind: NUMERIC
        value: 15.0
  checks:
  - kind: evaluate
    expr: \frac{9}{6}
    part: k
  - kind: evaluate
    expr: \frac{9}{6}\cdot 10
    part: LM
  skills:
  - odczytywanie odpowiadających sobie boków z zapisu podobieństwa
  - wyznaczanie skali podobieństwa
  - układanie i rozwiązywanie proporcji
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [k] SymPy solved it fresh: 1.5 vs 1.5 (tol 1e-09) ; [LM] SymPy
      solved it fresh: 15.0 vs 15.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: sprawdzanie podobieństwa cechą bbb
  statement: Boki pierwszego trójkąta mają długości 5 cm, 8 cm i 11 cm, a boki drugiego trójkąta — kolejno
    24 cm, 33 cm i 15 cm. Rozstrzygnij, czy te trójkąty są podobne, i jeśli tak, podaj skalę podobieństwa
    drugiego trójkąta do pierwszego.
  statement_latex: \frac{15}{5}=\frac{24}{8}=\frac{33}{11}
  solution: |-
    Porządkujemy boki obu trójkątów rosnąco.
    Pierwszy trójkąt: 5, 8, 11. Drugi trójkąt: 15, 24, 33.
    Sprawdzamy ilorazy odpowiadających sobie boków (najkrótszy do najkrótszego, średni do średniego, najdłuższy do najdłuższego):
    15/5 = 3,  24/8 = 3,  33/11 = 3.
    Wszystkie trzy ilorazy są równe, więc na mocy cechy bbb trójkąty są podobne, a skala podobieństwa drugiego trójkąta do pierwszego wynosi k = 3.
  solution_steps:
  - 'Uporządkuj boki obu trójkątów rosnąco: 5, 8, 11 oraz 15, 24, 33.'
  - 'Oblicz trzy ilorazy odpowiadających sobie boków: 15/5 = 3, 24/8 = 3, 33/11 = 3.'
  - Stwierdź, że wszystkie ilorazy są równe, więc z cechy bbb trójkąty są podobne.
  - 'Zapisz skalę: k = 3.'
  answer:
    kind: MULTIPART
    parts:
    - name: czy podobne
      answer:
        kind: BOOLEAN
        truth: true
    - name: k
      answer:
        kind: NUMERIC
        value: 3.0
  checks:
  - kind: evaluate
    expr: \frac{15}{5}
    part: k
  skills:
  - porządkowanie boków rosnąco
  - sprawdzanie proporcjonalności trzech par boków
  - stosowanie cechy bbb
  verification:
    checkability: REFERENCE_CALL
    note: '2 parts matched · det: [k] SymPy solved it fresh: 3.0 vs 3.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: stosunek obwodów i pól trójkątów podobnych
  statement: Trójkąt A′B′C′ jest podobny do trójkąta ABC w skali k = 5/2 (trójkąta A′B′C′ do trójkąta
    ABC). Obwód trójkąta ABC jest równy 14 cm, a jego pole jest równe 8 cm². Oblicz obwód i pole trójkąta
    A′B′C′.
  statement_latex: Obw\left(\triangle A'B'C'\right)=\frac{5}{2}\cdot 14,\qquad P\left(\triangle A'B'C'\right)=\left(\frac{5}{2}\right)^{2}\cdot
    8
  solution: |-
    Obwód jest sumą długości boków, a każda długość mnoży się przez k, więc obwód mnoży się przez k:
    Obw(△A′B′C′) = (5/2) · 14 = 35 cm.
    Pole zależy od iloczynu dwóch wymiarów, więc mnoży się przez k²:
    P(△A′B′C′) = (5/2)² · 8 = (25/4) · 8 = 50 cm².
  solution_steps:
  - 'Zapisz, że obwody skalują się przez k: Obw′ = k · Obw.'
  - Oblicz Obw′ = (5/2)·14 = 35 cm.
  - 'Zapisz, że pola skalują się przez k²: P′ = k²·P.'
  - Oblicz P′ = (25/4)·8 = 50 cm².
  answer:
    kind: MULTIPART
    parts:
    - name: obwód A'B'C'
      answer:
        kind: NUMERIC
        value: 35.0
    - name: pole A'B'C'
      answer:
        kind: NUMERIC
        value: 50.0
  checks:
  - kind: evaluate
    expr: \frac{5}{2}\cdot 14
    part: obwód A'B'C'
  - kind: evaluate
    expr: \left(\frac{5}{2}\right)^{2}\cdot 8
    part: pole A'B'C'
  skills:
  - stosowanie zależności Obw'/Obw = k
  - stosowanie zależności P'/P = k^2
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [obwód A''B''C''] SymPy solved it fresh: 35.0 vs 35.0 (tol
      1e-09) ; [pole A''B''C''] SymPy solved it fresh: 50.0 vs 50.0 (tol 1e-09)'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: konfiguracja z prostą równoległą do boku (daszek)
  statement: 'W trójkącie ABC punkt D leży na boku AB, a punkt E leży na boku AC, przy czym odcinek DE
    jest równoległy do boku BC. Dane są: |AD| = 5 cm, |DB| = 3 cm, |AE| = 4 cm oraz |DE| = 6 cm. Oblicz
    długość boku BC oraz długość odcinka EC. Zapisz obliczenia.'
  statement_latex: \frac{\left|AD\right|}{\left|AB\right|}=\frac{\left|AE\right|}{\left|AC\right|}=\frac{\left|DE\right|}{\left|BC\right|},\qquad
    \left|AB\right|=5+3
  solution: |-
    Ponieważ DE ∥ BC, kąt ADE jest równy kątowi ABC (kąty odpowiadające), a kąt przy wierzchołku A jest wspólny. Z cechy kkk: △ADE ∼ △ABC.
    Odpowiadające sobie boki: AD ↔ AB, AE ↔ AC, DE ↔ BC.
    |AB| = |AD| + |DB| = 5 + 3 = 8 cm, więc skala trójkąta ABC do trójkąta ADE wynosi k = |AB|/|AD| = 8/5.
    Stąd |BC| = k · |DE| = (8/5) · 6 = 9,6 cm.
    Ponadto |AC| = k · |AE| = (8/5) · 4 = 6,4 cm, zatem |EC| = |AC| − |AE| = 6,4 − 4 = 2,4 cm.
    Sprawdzenie sensowności: trójkąt ABC jest większy, więc BC > DE oraz AC > AE — zgadza się.
  solution_steps:
  - Z równoległości DE ∥ BC wskaż równe kąty odpowiadające i wspólny kąt A, stąd △ADE ∼ △ABC (cecha kkk).
  - Oblicz |AB| = |AD| + |DB| = 8 cm i skalę k = |AB|/|AD| = 8/5.
  - Oblicz |BC| = (8/5)·6 = 9,6 cm.
  - Oblicz |AC| = (8/5)·4 = 6,4 cm, a następnie |EC| = 6,4 − 4 = 2,4 cm.
  answer:
    kind: MULTIPART
    parts:
    - name: BC
      answer:
        kind: NUMERIC
        value: 9.6
    - name: EC
      answer:
        kind: NUMERIC
        value: 2.4
  checks:
  - kind: evaluate
    expr: \frac{6\cdot\left(5+3\right)}{5}
    part: BC
  - kind: evaluate
    expr: \frac{4\cdot\left(5+3\right)}{5}-4
    part: EC
  skills:
  - rozpoznawanie podobieństwa w konfiguracji z prostą równoległą
  - układanie proporcji z całymi bokami
  - obliczanie długości odcinków
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [BC] SymPy solved it fresh: 9.6 vs 9.6 (tol 1e-09) ; [EC] SymPy
      solved it fresh: 2.4 vs 2.4 (tol 1e-09)'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: konfiguracja kokardki (kąty wierzchołkowe) z pytaniem o stosunek pól
  statement: Odcinki KM i LN przecinają się w punkcie P. Wiadomo, że |∡PKL| = |∡PMN| oraz |KP| = 6, |LP|
    = 4, |MP| = 15. Uzasadnij, że trójkąty KPL i MPN są podobne, oblicz długość odcinka PN oraz podaj
    stosunek pola trójkąta MPN do pola trójkąta KPL. Zapisz obliczenia.
  statement_latex: \frac{\left|MP\right|}{\left|KP\right|}=\frac{\left|PN\right|}{\left|LP\right|},\qquad
    \frac{P\left(\triangle MPN\right)}{P\left(\triangle KPL\right)}=k^{2}
  solution: |-
    Z założenia |∡PKL| = |∡PMN|. Ponadto |∡KPL| = |∡MPN| jako kąty wierzchołkowe (odcinki KM i LN przecinają się w P). Dwie pary kątów są równe, więc na mocy cechy kkk trójkąty KPL i MPN są podobne, przy czym K ↔ M, P ↔ P, L ↔ N.
    Odpowiadające sobie boki: KP ↔ MP oraz PL ↔ PN.
    Skala trójkąta MPN do trójkąta KPL: k = |MP|/|KP| = 15/6 = 5/2.
    Stąd |PN| = k · |LP| = (5/2) · 4 = 10.
    Stosunek pól: P(△MPN)/P(△KPL) = k² = (5/2)² = 25/4.
  solution_steps:
  - Zauważ, że |∡KPL| = |∡MPN| jako kąty wierzchołkowe, a |∡PKL| = |∡PMN| z założenia.
  - Z cechy kkk zapisz △KPL ∼ △MPN (K ↔ M, L ↔ N).
  - Wyznacz skalę k = |MP|/|KP| = 15/6 = 5/2.
  - Oblicz |PN| = (5/2)·4 = 10.
  - 'Oblicz stosunek pól: k² = 25/4.'
  answer:
    kind: MULTIPART
    parts:
    - name: uzasadnienie podobieństwa
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: 'Należy wskazać dwie pary równych kątów: |∡PKL| = |∡PMN| (założenie) oraz |∡KPL| = |∡MPN|
          (kąty wierzchołkowe) i powołać się na cechę kkk, zapisując podobieństwo w kolejności odpowiadających
          wierzchołków △KPL ∼ △MPN.'
    - name: PN
      answer:
        kind: NUMERIC
        value: 10.0
    - name: stosunek pól
      answer:
        kind: SYMBOLIC
        latex: \frac{25}{4}
  checks:
  - kind: evaluate
    expr: \frac{4\cdot 15}{6}
    part: PN
  - kind: evaluate
    expr: \left(\frac{15}{6}\right)^{2}
    part: stosunek pól
  skills:
  - uzasadnianie podobieństwa cechą kkk
  - wykorzystanie kątów wierzchołkowych
  - obliczanie długości z proporcji
  - stosowanie zależności P'/P = k^2
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie podobieństwa · 2/2 other parts solved fresh'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: trójkąt prostokątny z wysokością z kąta prostego
  statement: W trójkącie prostokątnym KLM kąt przy wierzchołku M jest prosty, |KM| = 9 cm oraz |LM| =
    12 cm. Z wierzchołka M poprowadzono wysokość MS, gdzie punkt S leży na przeciwprostokątnej KL. Oblicz
    długość przeciwprostokątnej KL, długość wysokości MS oraz długość odcinka KS. Zapisz obliczenia.
  statement_latex: \left|KL\right|=\sqrt{9^{2}+12^{2}},\qquad \left|MS\right|=\frac{9\cdot 12}{\left|KL\right|},\qquad
    \left|KM\right|^{2}=\left|KL\right|\cdot\left|KS\right|
  solution: |-
    Z twierdzenia Pitagorasa: |KL|² = 9² + 12² = 81 + 144 = 225, więc |KL| = 15 cm.
    Trójkąty KSM i KML mają wspólny kąt ostry przy wierzchołku K oraz kąty proste (przy S i przy M), więc z cechy kkk: △KSM ∼ △KML (S ↔ M, M ↔ L).
    Z odpowiadających sobie boków: |KS|/|KM| = |KM|/|KL|, czyli |KM|² = |KL| · |KS|.
    Stąd |KS| = 81/15 = 5,4 cm.
    Analogicznie △LSM ∼ △LMK, więc |LM|² = |KL| · |LS|, czyli |LS| = 144/15 = 9,6 cm (i rzeczywiście 5,4 + 9,6 = 15).
    Wysokość: z podobieństwa △KSM ∼ △MSL mamy |MS|² = |KS| · |LS| = 5,4 · 9,6 = 51,84, więc |MS| = 7,2 cm.
    Ten sam wynik daje porównanie pól: ½·9·12 = ½·15·|MS|, skąd |MS| = 108/15 = 7,2 cm.
  solution_steps:
  - 'Oblicz przeciwprostokątną z twierdzenia Pitagorasa: |KL| = √(81 + 144) = 15 cm.'
  - Zauważ podobieństwo △KSM ∼ △KML (kąt prosty i wspólny kąt przy K), stąd |KM|² = |KL|·|KS|.
  - Oblicz |KS| = 81/15 = 5,4 cm oraz |LS| = 144/15 = 9,6 cm.
  - 'Z zależności |MS|² = |KS|·|LS| = 51,84 otrzymaj |MS| = 7,2 cm (lub z porównania pól: |MS| = (9·12)/15).'
  - 'Sprawdź: |KS| + |LS| = 5,4 + 9,6 = 15 = |KL|.'
  answer:
    kind: MULTIPART
    parts:
    - name: KL
      answer:
        kind: NUMERIC
        value: 15.0
    - name: MS
      answer:
        kind: NUMERIC
        value: 7.2
    - name: KS
      answer:
        kind: NUMERIC
        value: 5.4
  checks:
  - kind: evaluate
    expr: \sqrt{9^{2}+12^{2}}
    part: KL
  - kind: evaluate
    expr: \frac{9\cdot 12}{15}
    part: MS
  - kind: evaluate
    expr: \frac{9^{2}}{15}
    part: KS
  skills:
  - twierdzenie Pitagorasa
  - podobieństwo trójkątów w trójkącie prostokątnym z wysokością
  - stosowanie zależności a^2 = c·p oraz h^2 = p·q
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [KL] SymPy solved it fresh: 15.0 vs 15.0 (tol 1e-09) ; [MS]
      SymPy solved it fresh: 7.2 vs 7.2 (tol 1e-09) ; [KS] SymPy solved it fresh: 5.4 vs 5.4 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: obliczanie długości i stosunku pól w konfiguracji „kokardka”
  statement: W trapezie ABCD boki AB i CD są równoległe, przy czym |AB| = 15 cm oraz |CD| = 9 cm. Przekątne
    AC i BD tego trapezu przecinają się w punkcie S, a ponadto |AS| = 10 cm i |BS| = 7,5 cm. Oblicz długości
    odcinków SC i SD oraz stosunek pola trójkąta ABS do pola trójkąta CDS. Zapisz obliczenia.
  statement_latex: k=\frac{|CD|}{|AB|}=\frac{9}{15},\qquad |SC|=k\cdot|AS|,\qquad \frac{P_{ABS}}{P_{CDS}}=\left(\frac{15}{9}\right)^{2}
  solution: |-
    Ponieważ AB ∥ CD, to kąty SAB i SCD są naprzemianległe przy prostych równoległych przeciętych prostą AC, więc |∡SAB| = |∡SCD|. Podobnie |∡SBA| = |∡SDC| (proste równoległe przecięte prostą BD). Zatem na mocy cechy kkk trójkąty ABS i CDS są podobne: △ABS ∼ △CDS.
    Odpowiadające sobie boki: AB ↔ CD, AS ↔ CS, BS ↔ DS.
    Skala podobieństwa trójkąta CDS do trójkąta ABS wynosi k = \frac{|CD|}{|AB|} = \frac{9}{15} = \frac{3}{5}.
    Stąd |SC| = \frac{3}{5}\cdot 10 = 6 (cm) oraz |SD| = \frac{3}{5}\cdot 7{,}5 = 4{,}5 (cm).
    Trójkąt ABS jest większy, a skala podobieństwa trójkąta ABS do trójkąta CDS wynosi \frac{15}{9} = \frac{5}{3}, więc stosunek pól jest równy \left(\frac{5}{3}\right)^{2} = \frac{25}{9}.
    Sprawdzenie sensowności: odcinki w mniejszym trójkącie CDS wyszły krótsze niż odpowiadające im odcinki w trójkącie ABS.
  solution_steps:
  - 'Z równoległości AB ∥ CD wskaż równe kąty naprzemianległe: |∡SAB| = |∡SCD| i |∡SBA| = |∡SDC|.'
  - Z cechy kkk zapisz podobieństwo △ABS ∼ △CDS i wypisz odpowiadające sobie boki.
  - 'Wyznacz skalę k = |CD| : |AB| = 9 : 15 = 3/5.'
  - Oblicz |SC| = (3/5)·10 = 6 cm oraz |SD| = (3/5)·7,5 = 4,5 cm.
  - Skala trójkąta ABS do CDS wynosi 15/9 = 5/3, więc stosunek pól to (5/3)² = 25/9.
  answer:
    kind: MULTIPART
    parts:
    - name: SC
      answer:
        kind: NUMERIC
        value: 6.0
    - name: SD
      answer:
        kind: NUMERIC
        value: 4.5
    - name: stosunek_pol
      answer:
        kind: SYMBOLIC
        latex: \frac{25}{9}
  checks:
  - kind: evaluate
    expr: \frac{9}{15}\cdot 10
    part: SC
  - kind: evaluate
    expr: \frac{9}{15}\cdot 7.5
    part: SD
  - kind: evaluate
    expr: \left(\frac{15}{9}\right)^{2}
    part: stosunek_pol
  skills:
  - rozpoznawanie podobieństwa z cechy kkk przy prostych równoległych
  - ustalanie odpowiadających sobie boków
  - układanie i rozwiązywanie proporcji
  - stosunek pól trójkątów podobnych
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [SC] SymPy solved it fresh: 6.0 vs 6.0 (tol 1e-09) ; [SD] SymPy
      solved it fresh: 4.5 vs 4.5 (tol 1e-09) ; [stosunek_pol] SymPy solved it fresh: 2.7777777777777777
      vs 2.7777777777777777 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: od stosunku pól do skali, obwodu i długości odcinka
  statement: W trójkącie ABC punkt D leży na boku AB, a punkt E leży na boku AC, przy czym DE ∥ BC. Pole
    trójkąta ADE jest równe 12 cm², a pole trapezu DBCE jest równe 96 cm². Ponadto |AD| = 5 cm, a obwód
    trójkąta ADE jest równy 18 cm. Oblicz skalę podobieństwa trójkąta ABC do trójkąta ADE, długość odcinka
    DB oraz obwód trójkąta ABC. Zapisz obliczenia.
  statement_latex: k=\sqrt{\frac{P_{ABC}}{P_{ADE}}}=\sqrt{\frac{12+96}{12}},\qquad |DB|=k\cdot|AD|-|AD|,\qquad
    Obw_{ABC}=k\cdot Obw_{ADE}
  solution: |-
    Ponieważ DE ∥ BC, kąt ADE jest równy kątowi ABC (kąty odpowiadające), a kąt przy wierzchołku A jest wspólny, więc z cechy kkk: △ADE ∼ △ABC.
    Pole trójkąta ABC to suma pola trójkąta ADE i pola trapezu DBCE:
    P_{ABC} = 12 + 96 = 108 (cm²).
    Stosunek pól trójkątów podobnych jest równy kwadratowi skali, więc
    k^{2} = \frac{108}{12} = 9, skąd k = 3 (skala trójkąta ABC do trójkąta ADE).
    Długości mnożymy przez k: |AB| = 3\cdot|AD| = 3\cdot 5 = 15 (cm), więc
    |DB| = |AB| − |AD| = 15 − 5 = 10 (cm).
    Uwaga: odpowiednikiem odcinka AD jest CAŁY bok AB, a nie jego część DB.
    Obwód jest sumą długości, więc skaluje się przez k:
    Obw(△ABC) = 3\cdot 18 = 54 (cm).
  solution_steps:
  - Uzasadnij podobieństwo △ADE ∼ △ABC (DE ∥ BC, kąty odpowiadające i wspólny kąt A, cecha kkk).
  - 'Oblicz pole trójkąta ABC: 12 + 96 = 108 cm².'
