  statement: Oblicz wartość największą i wartość najmniejszą funkcji f\left(x\right)=-3x^2+12x-5 w przedziale
    \langle 3,6\rangle. Uczeń odpowiedział, że wartość największa wynosi 7, bo tyle wynosi druga współrzędna
    wierzchołka. Wyjaśnij, na czym polega jego błąd, i podaj poprawne wartości.
  statement_latex: f\left(x\right)=-3x^2+12x-5,\qquad x\in\langle 3,6\rangle
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: „a=-3<0, więc funkcja ma wartość największą w wierzchołku. p=-\frac{12}{2\cdot\left(-3\right)}=2, q=f\left(2\right)=-3\cdot 2^2+12\cdot 2-5=7, zatem w przedziale \langle 3,6\rangle wartość największa wynosi 7”. Błędny wynik: 7.
    GDZIE JEST BŁĄD: wartość q jest przyjmowana tylko wtedy, gdy p należy do rozważanego przedziału. Tutaj p=2, a 2\notin\langle 3,6\rangle, więc funkcja nigdy nie osiąga wartości 7 dla x z tego przedziału.
    POPRAWNE ROZWIĄZANIE: skoro a<0, to f maleje w \langle 2,+\infty\rangle, a cały przedział \langle 3,6\rangle w nim leży, więc f jest tam malejąca. Wartość największa jest w lewym końcu: f\left(3\right)=-3\cdot 3^2+12\cdot 3-5=-27+36-5=4, a najmniejsza w prawym: f\left(6\right)=-3\cdot 6^2+12\cdot 6-5=-108+72-5=-41.
    Odpowiedź: wartość największa wynosi 4 (dla x=3), wartość najmniejsza wynosi -41 (dla x=6).
  solution_steps:
  - 'Pokaż błędne rozumowanie: podanie q=7 jako wartości największej.'
  - Oblicz p=2 i stwierdź, że p\notin\langle 3,6\rangle – q nie jest przyjmowane.
  - Z a<0 wywnioskuj, że f maleje na \langle 3,6\rangle.
  - Oblicz f\left(3\right)=4 i f\left(6\right)=-41.
  - Zapisz poprawną odpowiedź.
  answer:
    kind: MULTIPART
    parts:
    - name: wartość największa
      answer:
        kind: NUMERIC
        value: 4.0
    - name: wartość najmniejsza
      answer:
        kind: NUMERIC
        value: -41.0
