- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: kula wpisana i opisana — stożek z danym kątem
  statement: Dany jest stożek o promieniu podstawy r = 3, którego tworząca jest nachylona do płaszczyzny
    podstawy pod kątem 60°. W ten stożek wpisano kulę, a na tym samym stożku opisano kulę. Oblicz promień
    kuli wpisanej oraz promień kuli opisanej, a następnie oblicz, ile razy objętość kuli opisanej jest
    większa od objętości kuli wpisanej. Zapisz obliczenia.
  statement_latex: H = r\cdot \mathrm{tg}\,60^{\circ},\qquad l = \frac{r}{\cos 60^{\circ}},\qquad R_{w}
    = \frac{r\cdot H}{r+l},\qquad R_{o} = \frac{l^{2}}{2\cdot H}
  solution: |-
    Krok 1. Przekrój osiowy stożka to trójkąt równoramienny o podstawie 2r = 6; kąt przy podstawie ma miarę 60°.
    Z trójkąta prostokątnego utworzonego przez wysokość, promień podstawy i tworzącą:
    H = r\cdot \mathrm{tg}\,60^{\circ} = 3\sqrt{3}, \qquad l = \frac{r}{\cos 60^{\circ}} = \frac{3}{\frac{1}{2}} = 6.
    Krok 2. Kula wpisana w stożek daje w przekroju osiowym okrąg wpisany w ten trójkąt:
    R_{w} = \frac{r\cdot H}{r+l} = \frac{3\cdot 3\sqrt{3}}{3+6} = \frac{9\sqrt{3}}{9} = \sqrt{3}.
    Krok 3. Kula opisana na stożku: jej środek leży na osi stożka, a z równania R^{2} = r^{2}+\left(H-R\right)^{2} otrzymujemy
    R_{o} = \frac{l^{2}}{2\cdot H} = \frac{36}{2\cdot 3\sqrt{3}} = \frac{36}{6\sqrt{3}} = \frac{6}{\sqrt{3}} = 2\sqrt{3}.
    Krok 4. Obie bryły są kulami, więc są podobne w skali k = \frac{R_{o}}{R_{w}} = \frac{2\sqrt{3}}{\sqrt{3}} = 2, zatem stosunek objętości wynosi k^{3} = 8.
    Odpowiedź: R_{w} = \sqrt{3}, R_{o} = 2\sqrt{3}, objętość kuli opisanej jest 8 razy większa.
  solution_steps:
  - Z kąta 60° wyznacz wysokość H = 3\sqrt{3} i tworzącą l = 6.
  - Oblicz promień kuli wpisanej R_{w} = \frac{r\cdot H}{r+l} = \sqrt{3}.
  - Oblicz promień kuli opisanej R_{o} = \frac{l^{2}}{2\cdot H} = 2\sqrt{3}.
  - Wyznacz skalę k = 2 i stosunek objętości k^{3} = 8.
  answer:
    kind: MULTIPART
    parts:
    - name: R_wpisanej
      answer:
        kind: SYMBOLIC
        latex: \sqrt{3}
    - name: R_opisanej
      answer:
        kind: SYMBOLIC
        latex: 2\sqrt{3}
    - name: krotnosc_objetosci
      answer:
        kind: NUMERIC
        value: 8.0
  checks:
  - kind: evaluate
    expr: \frac{3\cdot 3\sqrt{3}}{3+6}
    part: R_wpisanej
  - kind: evaluate
    expr: \frac{6^{2}}{2\cdot 3\sqrt{3}}
    part: R_opisanej
  - kind: evaluate
    expr: \left(\frac{2\sqrt{3}}{\sqrt{3}}\right)^{3}
    part: krotnosc_objetosci
