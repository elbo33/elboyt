- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: zadanie odwrotne (dane pole, szukane podstawy)
  statement: W trapezie równoramiennym ABCD ramiona AD i BC mają długość 8, a kąty przy dłuższej podstawie
    AB mają miarę 60^\circ. Pole tego trapezu jest równe 56\sqrt{3}. Oblicz długości obu podstaw tego
    trapezu.
  statement_latex: h=8\cdot\sin 60^\circ,\qquad \frac{1}{2}\cdot\left(|AB|+|CD|\right)\cdot h=56\sqrt{3},\qquad
    |AB|=|CD|+2\cdot 8\cdot\cos 60^\circ
  solution: |-
    Oznaczmy |AB| = a (podstawa dłuższa), |CD| = b (podstawa krótsza).

    1) Wysokość trapezu: prowadząc wysokość z wierzchołka D na AB otrzymujemy trójkąt prostokątny, w którym ramię 8 jest przeciwprostokątną, a wysokość leży naprzeciw kąta 60^\circ:
    h = 8\cdot\sin 60^\circ = 8\cdot\frac{\sqrt{3}}{2} = 4\sqrt{3}.

    2) Z pola: \frac{1}{2}\cdot\left(a+b\right)\cdot 4\sqrt{3} = 56\sqrt{3}, czyli 2\sqrt{3}\cdot\left(a+b\right) = 56\sqrt{3}, więc
    a+b = 28.

    3) Rzuty ramion na dłuższą podstawę (po jednym z każdej strony) mają długość
    p = 8\cdot\cos 60^\circ = 8\cdot\frac{1}{2} = 4, zatem a = b + 2\cdot 4, czyli
    a-b = 8.

    4) Rozwiązujemy układ: a = \frac{28+8}{2} = 18, b = \frac{28-8}{2} = 10.

    Kontrola: h = 4\sqrt{3}, P = \frac{1}{2}\cdot\left(18+10\right)\cdot 4\sqrt{3} = 56\sqrt{3}. ✓ Ponadto 18 > 10, więc AB rzeczywiście jest podstawą dłuższą.

    Odpowiedź: |AB| = 18, |CD| = 10.
  solution_steps:
  - 'Oznacz podstawy: |AB| = a, |CD| = b.'
  - Oblicz wysokość h = 8\cdot\sin 60^\circ = 4\sqrt{3}.
  - Z warunku na pole otrzymaj a+b = 28.
  - Z rzutu ramienia p = 8\cdot\cos 60^\circ = 4 otrzymaj a-b = 8.
  - 'Rozwiąż układ: a = 18, b = 10, i sprawdź, że a > b.'
  answer:
    kind: MULTIPART
    parts:
    - name: AB
      answer:
        kind: NUMERIC
        value: 18.0
    - name: CD
      answer:
        kind: NUMERIC
        value: 10.0
