- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: zadanie praktyczne — dwa punkty obserwacji
  statement: Wieża stoi na poziomym terenie. Punkty A, B oraz spodek S wieży leżą na jednej prostej, przy
    czym B leży między A a S. Z punktu A wierzchołek wieży widać pod kątem wzniesienia o mierze 30°, a
    z punktu B — pod kątem 45°. Odległość |AB| wynosi 30 m. Oblicz wysokość wieży w postaci dokładnej
    oraz podaj jej przybliżenie z dokładnością do 0,01 m (przyjmij √3 ≈ 1,7321).
  statement_latex: \operatorname{tg}45^\circ=\frac{h}{x},\qquad \operatorname{tg}30^\circ=\frac{h}{x+30},\qquad
    h=\frac{30\cdot\sqrt{3}}{3-\sqrt{3}}
  solution: |-
    Oznaczmy: h — wysokość wieży, S — jej spodek, x = |BS|. Wtedy |AS| = x + 30. Mamy dwa trójkąty prostokątne o wspólnej przyprostokątnej h.

    1) Z trójkąta przy B:
    \[\operatorname{tg}45^\circ=\frac{h}{x}\ \Rightarrow\ h=x .\]

    2) Z trójkąta przy A:
    \[\operatorname{tg}30^\circ=\frac{h}{x+30}\ \Rightarrow\ \frac{\sqrt3}{3}=\frac{h}{h+30}.\]

    3) Rozwiązujemy równanie:
    \[3h=\sqrt3\left(h+30\right)\ \Rightarrow\ h\left(3-\sqrt3\right)=30\sqrt3\ \Rightarrow\ h=\frac{30\sqrt3}{3-\sqrt3}.\]
    Usuwamy niewymierność:
    \[h=\frac{30\sqrt3\left(3+\sqrt3\right)}{\left(3-\sqrt3\right)\left(3+\sqrt3\right)}=\frac{90\sqrt3+90}{6}=15\sqrt3+15 .\]

    4) Przybliżenie: \(h\approx 15\cdot 1{,}7321+15=25{,}98+15=40{,}98\) m.

    Odpowiedź: \(h=15+15\sqrt3\ \text{m}\approx 40{,}98\ \text{m}\).
  solution_steps:
  - 'Wprowadź niewiadome: h — wysokość wieży, x = |BS|, wtedy |AS| = x + 30.'
  - 'Z trójkąta przy B: tg 45° = h/x, czyli h = x.'
  - 'Z trójkąta przy A: tg 30° = h/(h + 30), czyli √3/3 = h/(h+30).'
  - 'Rozwiąż równanie: 3h = √3(h+30), h(3 − √3) = 30√3.'
  - 'Usuń niewymierność: h = 15 + 15√3.'
  - 'Oblicz przybliżenie: h ≈ 40,98 m.'
  answer:
    kind: MULTIPART
    parts:
    - name: wysokosc_dokladna
      answer:
        kind: SYMBOLIC
        latex: 15+15\sqrt{3}
    - name: wysokosc_przyblizona
      answer:
        kind: NUMERIC
        value: 40.98
        tol: 0.01
  checks:
  - kind: evaluate
    expr: \frac{30\cdot\sqrt{3}}{3-\sqrt{3}}
    part: wysokosc_dokladna
  - kind: evaluate
    expr: \frac{30\cdot\sqrt{3}}{3-\sqrt{3}}
    part: wysokosc_przyblizona
  stated_model:
    variable: h
    objective_latex: \frac{h}{h+30}=\frac{\sqrt{3}}{3}
    domain_lo: '0'
    goal: value
    constraint_used: h>0, wspólna przyprostokątna dwóch trójkątów prostokątnych o kątach 45^\circ i 30^\circ,
      |AB|=30
  skills:
