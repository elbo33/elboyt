  exercise_type: ocena poprawności rozumowania
  statement: 'Dany jest ciąg \left(a_{n}\right) określony wzorem a_{n} = n^{2} - 9n + 4 dla każdej liczby
    naturalnej n \geq 1. Uczeń obliczył a_{1} = -4, a_{2} = -10, a_{3} = -14, a_{4} = -16 i napisał: „wyrazy
    maleją, więc ciąg jest malejący”. Wyznacz różnicę a_{n+1} - a_{n}, oblicz a_{6} - a_{5} i rozstrzygnij,
    czy ciąg jest monotoniczny. Wskaż błąd w rozumowaniu ucznia.'
  statement_latex: a_{n}=n^{2}-9n+4,\qquad a_{n+1}-a_{n}=?,\qquad a_{6}-a_{5}=?
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: sprawdził cztery pierwsze wyrazy (-4, -10, -14, -16), zobaczył, że maleją, i stwierdził: „ciąg jest malejący”. Otrzymał w ten sposób błędną odpowiedź.
    DLACZEGO TO BŁĄD: definicja ciągu malejącego wymaga nierówności a_{n+1} < a_{n} dla KAŻDEJ liczby naturalnej n \geq 1. Sprawdzenie skończenie wielu wyrazów niczego nie dowodzi — dalsze wyrazy mogą zachować się inaczej.
    POPRAWNE ROZWIĄZANIE: a_{n+1} = \left(n+1\right)^{2} - 9\left(n+1\right) + 4 = n^{2} - 7n - 4, więc
    a_{n+1} - a_{n} = \left(n^{2}-7n-4\right) - \left(n^{2}-9n+4\right) = 2n - 8.
    Dla n = 1 mamy 2 - 8 = -6 < 0, ale dla n = 5 mamy 2\cdot 5 - 8 = 2 > 0, czyli a_{6} - a_{5} = 2 > 0 (istotnie a_{5} = -16, a_{6} = -14).
    Różnice mają różne znaki, więc ciąg NIE jest monotoniczny: nie jest ani rosnący, ani malejący.
    UWAGA: odwrotny kierunek jest poprawny — wskazanie dwóch różnic o przeciwnych znakach WYSTARCZA, by obalić monotoniczność.
  solution_steps:
  - Zauważ, że uczeń oparł wniosek tylko na czterech pierwszych wyrazach — to nie jest dowód.
  - Wyznacz a_{n+1} = \left(n+1\right)^{2} - 9\left(n+1\right) + 4 = n^{2} - 7n - 4.
  - 'Oblicz różnicę: a_{n+1} - a_{n} = 2n - 8.'
  - 'Podstaw n = 5: a_{6} - a_{5} = 2\cdot 5 - 8 = 2 > 0, a dla n = 1 różnica wynosi -6 < 0.'
  - 'Wniosek: różnica zmienia znak, więc ciąg nie jest monotoniczny; rozumowanie ucznia jest błędne.'
  answer:
    kind: MULTIPART
    parts:
    - name: roznica
      answer:
        kind: SYMBOLIC
        latex: 2n-8
    - name: a_6-a_5
      answer:
        kind: NUMERIC
        value: 2.0
    - name: czy_monotoniczny
      answer:
        kind: BOOLEAN
        truth: false
  checks:
  - kind: simplify
    expr: \left(\left(n+1\right)^{2}-9\left(n+1\right)+4\right)-\left(n^{2}-9n+4\right)
    var: n
    part: roznica
  - kind: evaluate
    expr: \left(6^{2}-9\cdot 6+4\right)-\left(5^{2}-9\cdot 5+4\right)
