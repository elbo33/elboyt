  - 'Podstaw dane: 144 + |BD|² = 2·(64 + 36) = 200.'
  - Oblicz |BD|² = 56, czyli |BD| = 2√14 ≈ 7,48.
  - 'Sprawdź: przekątne są różne, dłuższa leży naprzeciw kąta rozwartego.'
