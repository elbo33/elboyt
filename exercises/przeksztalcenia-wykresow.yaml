    a) Wyznacz wzór funkcji S, opisującej pole prostokąta ABCD w zależności od x, oraz podaj dziedzinę funkcji S.
    b) Dodatkowo wymagamy, aby bok AB miał długość nie mniejszą niż 8. Oblicz największe możliwe pole prostokąta ABCD spełniającego ten warunek oraz odpowiadającą mu wartość x.
  statement_latex: S\left(x\right)=2\cdot x\cdot\left(6-x\right)
  solution: |-
    Wykres funkcji f to 'daszek' o wierzchołku (0,0). Po przesunięciu o wektor [4,6] otrzymujemy g(x)=-\left|x-4\right|+6 — 'daszek' o wierzchołku W=(4,\ 6), którego miejscami zerowymi są liczby -2 oraz 10 (bo \left|x-4\right|=6).

    a) Wierzchołek C ma pierwszą współrzędną 4+x, więc jego druga współrzędna to
    g(4+x)=-\left|4+x-4\right|+6=6-\left|x\right|.
    Dla x>0 wysokość prostokąta wynosi 6-x, a długość podstawy \left|AB\right|=\left(4+x\right)-\left(4-x\right)=2x. Zatem
    S(x)=2\cdot x\cdot\left(6-x\right)=-2x^2+12x.
    Prostokąt istnieje, gdy 2x>0 oraz 6-x>0, czyli dla x\in\left(0,\ 6\right).

    b) Warunek \left|AB\right|\ge 8 daje 2x\ge 8, czyli x\ge 4. Uwzględniając dziedzinę, rozważamy x\in\langle 4,\ 6\right).
    Parabola S(x)=-2x^2+12x ma ramiona skierowane w dół, a jej wierzchołek ma pierwszą współrzędną x_w=-\frac{12}{2\cdot\left(-2\right)}=3. Wartość x=3 nie spełnia warunku x\ge 4, więc nie jest dopuszczalna.
    W przedziale \langle 4,\ 6\right) funkcja S jest malejąca (leży on na prawo od wierzchołka), więc największą wartość przyjmuje dla x=4:
    S(4)=-2\cdot 16+12\cdot 4=-32+48=16.
    Prostokąt ma wtedy wymiary \left|AB\right|=8 oraz wysokość 6-4=2, a jego pole wynosi 16.
  solution_steps:
