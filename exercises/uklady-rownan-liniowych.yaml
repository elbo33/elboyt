  - 'Zapisuję równanie mas: x + y = 900 oraz bilans soli: 0,12x + 0,30y = 0,20·900 = 180.'
  - 'Rozwiązuję układ metodą podstawiania: y = 400, x = 500; sprawdzam bilans soli.'
  - 'Dla stężenia 35% zapisuję nowy układ: x + y = 900 oraz 0,12x + 0,30y = 0,35·900 = 315.'
  - 'Rozwiązuję go: y = 1150, x = -250.'
  - 'Konfrontuję wynik z dziedziną: masa ujemna jest niemożliwa, więc roztworu 35% nie da się otrzymać
    (stężenie mieszaniny mieści się zawsze między 12% a 30%).'
