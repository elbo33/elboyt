- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: równanie w postaci iloczynowej
  statement: Rozwiąż równanie \left(x+5\right)\left(3x-2\right)=0. Zapisz obliczenia.
  statement_latex: \left(x+5\right)\cdot\left(3x-2\right)=0
  solution: |-
    Lewa strona jest iloczynem dwóch czynników, a po prawej stronie stoi 0, więc korzystamy z własności iloczynu zerowego: iloczyn jest równy zeru wtedy i tylko wtedy, gdy co najmniej jeden z czynników jest równy zeru.
    Zatem x+5=0 lub 3x-2=0.
    1) x+5=0, czyli x=-5.
    2) 3x-2=0, czyli 3x=2, a stąd x=\frac{2}{3}.
    Sprawdzenie dla x=\frac{2}{3}: pierwszy czynnik jest równy \frac{2}{3}+5=\frac{17}{3}, drugi 3\cdot\frac{2}{3}-2=0, więc iloczyn jest równy 0.
    Odpowiedź: x=-5 lub x=\frac{2}{3}.
  solution_steps:
  - Zauważ, że równanie jest już w postaci iloczynowej, a po prawej stronie stoi 0.
  - 'Zastosuj własność iloczynu zerowego: x+5=0 lub 3x-2=0.'
  - 'Rozwiąż pierwsze równanie: x=-5.'
  - 'Rozwiąż drugie równanie: 3x=2, czyli x=\frac{2}{3}.'
  - Zapisz odpowiedź, łącząc rozwiązania spójnikiem 'lub'.
  answer:
    kind: SET
    members:
    - '-5'
    - \frac{2}{3}
  checks:
  - kind: solve_equation
    expr: \left(x+5\right)\cdot\left(3x-2\right)=0
  skills:
  - własność iloczynu zerowego
  - rozwiązywanie równań liniowych
  - odczyt pierwiastka z czynnika
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 2 members matched'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: równanie iloczynowe z czynnikiem nierozkładalnym
  statement: Dane jest równanie \left(x-4\right)\left(x^{2}+9\right)=0. Rozwiąż to równanie oraz uzasadnij,
    że czynnik x^{2}+9 nie ma pierwiastków rzeczywistych.
  statement_latex: \left(x-4\right)\cdot\left(x^{2}+9\right)=0
  solution: |-
    Po prawej stronie stoi 0, więc z własności iloczynu zerowego: x-4=0 lub x^{2}+9=0.
    1) x-4=0 daje x=4.
    2) x^{2}+9=0 daje x^{2}=-9. Kwadrat liczby rzeczywistej nie jest ujemny, zatem x^{2}\ge 0, więc x^{2}+9\ge 9>0 dla każdego x rzeczywistego. To równanie nie ma rozwiązań (można też policzyć \Delta=0^{2}-4\cdot1\cdot9=-36<0).
    Czynnika x^{2}+9 nie wolno zatem 'skracać' bez komentarza — po prostu nie wnosi on żadnych rozwiązań.
    Odpowiedź: jedynym rozwiązaniem jest x=4.
  solution_steps:
  - 'Zastosuj własność iloczynu zerowego: x-4=0 lub x^{2}+9=0.'
  - Z pierwszego równania otrzymaj x=4.
  - Zauważ, że x^{2}\ge 0, więc x^{2}+9\ge 9>0 — drugi czynnik nigdy nie jest zerem (\Delta=-36<0).
  - Zapisz, że jedynym rozwiązaniem równania jest x=4.
  answer:
    kind: MULTIPART
    parts:
    - name: rozwiązania
      answer:
        kind: SET
        members:
        - '4'
    - name: uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń musi uzasadnić, że x^{2}+9>0 dla każdego x rzeczywistego (np. z nierówności x^{2}\ge
          0 albo z \Delta=-36<0), a więc czynnik ten nie ma pierwiastków rzeczywistych.
  checks:
  - kind: solve_equation
    expr: \left(x-4\right)\cdot\left(x^{2}+9\right)=0
    part: rozwiązania
  skills:
  - własność iloczynu zerowego
  - rozpoznanie czynnika bez pierwiastków rzeczywistych
  - uzasadnianie
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie · 1/1 other parts solved fresh'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: postać iloczynowa przez wyłączenie wspólnego czynnika
  statement: Dany jest wielomian W\left(x\right)=6x^{4}-9x^{3}. Doprowadź ten wielomian do postaci iloczynowej,
    a następnie podaj wszystkie pierwiastki wielomianu W.
  statement_latex: W\left(x\right)=6x^{4}-9x^{3}
  solution: |-
    Wyłączamy przed nawias największy wspólny czynnik liczbowy (3) oraz najniższą potęgę x (czyli x^{3}):
    6x^{4}-9x^{3}=3x^{3}\left(2x-3\right).
    Sprawdzenie przez wymnożenie: 3x^{3}\cdot 2x=6x^{4} oraz 3x^{3}\cdot\left(-3\right)=-9x^{3} — zgadza się.
    Równanie 3x^{3}\left(2x-3\right)=0 daje x^{3}=0 lub 2x-3=0, czyli x=0 lub x=\frac{3}{2}.
    Odpowiedź: W\left(x\right)=3x^{3}\left(2x-3\right); pierwiastkami są liczby 0 (pierwiastek trzykrotny) oraz \frac{3}{2}.
  solution_steps:
  - Wyłącz przed nawias wspólny czynnik liczbowy 3 i najniższą potęgę x, czyli x^{3}.
  - Zapisz W\left(x\right)=3x^{3}\left(2x-3\right) i sprawdź rozkład przez wymnożenie.
  - 'Przyrównaj czynniki do zera: x^{3}=0 lub 2x-3=0.'
  - Otrzymaj pierwiastki x=0 oraz x=\frac{3}{2} (każdy wypisz raz).
  answer:
    kind: MULTIPART
    parts:
    - name: postać iloczynowa
      answer:
        kind: SYMBOLIC
        latex: 3x^{3}\left(2x-3\right)
    - name: pierwiastki
      answer:
        kind: SET
        members:
        - '0'
        - \frac{3}{2}
  checks:
  - kind: solve_equation
    expr: 6x^{4}-9x^{3}=0
    part: pierwiastki
  skills:
  - wyłączanie wspólnego czynnika przed nawias
  - odczyt pierwiastków z postaci iloczynowej
