  statement: Promień podstawy stożka obrotowego ma długość 6, a wysokość tego stożka jest równa 8. Oblicz
    długość tworzącej tego stożka. Zapisz obliczenia.
  statement_latex: r=6,\quad H=8,\quad l=\sqrt{r^2+H^2}
  solution: |-
    Wysokość stożka pada w środek podstawy, więc promień r, wysokość H i tworząca l tworzą trójkąt prostokątny, w którym tworząca jest przeciwprostokątną.
    Stąd l^2 = r^2 + H^2 = 6^2 + 8^2 = 36 + 64 = 100.
    Zatem l = \sqrt{100} = 10.
    Sprawdzenie sensowności: l = 10 > 8 = H oraz l = 10 > 6 = r. ✓
  solution_steps:
  - Zauważ, że r, H i l tworzą trójkąt prostokątny o przeciwprostokątnej l.
  - Zapisz l^2 = r^2 + H^2 = 36 + 64 = 100.
  - Wyznacz l = 10 (bierzemy pierwiastek dodatni).
