- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: upraszczanie wyrażenia i obliczanie wartości
  statement: Dane jest wyrażenie W\left(x\right)=\left(3x-2\right)^{2}-\left(x+5\right)\cdot\left(x-5\right)+2\cdot\left(x+1\right)^{2}.
    Uprość to wyrażenie do postaci trójmianu, a następnie oblicz W\left(-1\right).
  statement_latex: W\left(x\right)=\left(3x-2\right)^{2}-\left(x+5\right)\cdot\left(x-5\right)+2\cdot\left(x+1\right)^{2}
  solution: |-
    Rozwijamy kolejne składniki:
    \left(3x-2\right)^{2}=9x^{2}-12x+4,
    \left(x+5\right)\cdot\left(x-5\right)=x^{2}-25 (różnica kwadratów),
    2\cdot\left(x+1\right)^{2}=2\cdot\left(x^{2}+2x+1\right)=2x^{2}+4x+2.
    Uwaga na minus przed nawiasem: -\left(x^{2}-25\right)=-x^{2}+25.
    Zatem
    W\left(x\right)=9x^{2}-12x+4-x^{2}+25+2x^{2}+4x+2=10x^{2}-8x+31.
    Dalej W\left(-1\right)=10\cdot 1+8+31=49.
    Kontrola bezpośrednia: \left(-3-2\right)^{2}-\left(4\right)\cdot\left(-6\right)+2\cdot 0^{2}=25+24+0=49.
  solution_steps:
  - Rozwiń \left(3x-2\right)^{2}=9x^{2}-12x+4.
  - 'Zastosuj różnicę kwadratów: \left(x+5\right)\cdot\left(x-5\right)=x^{2}-25.'
  - Rozwiń 2\cdot\left(x+1\right)^{2}=2x^{2}+4x+2.
  - 'Zmień znaki w nawiasie poprzedzonym minusem i zredukuj wyrazy podobne: W\left(x\right)=10x^{2}-8x+31.'
  - 'Podstaw x=-1: W\left(-1\right)=10+8+31=49.'
  answer:
    kind: MULTIPART
    parts:
    - name: postac_uproszczona
      answer:
        kind: SYMBOLIC
        latex: 10x^{2}-8x+31
    - name: W(-1)
      answer:
        kind: NUMERIC
        value: 49.0
  checks:
  - kind: simplify
    expr: \left(3x-2\right)^{2}-\left(x+5\right)\cdot\left(x-5\right)+2\cdot\left(x+1\right)^{2}
    part: postac_uproszczona
  - kind: evaluate
    expr: \left(3\cdot\left(-1\right)-2\right)^{2}-\left(\left(-1\right)+5\right)\cdot\left(\left(-1\right)-5\right)+2\cdot\left(\left(-1\right)+1\right)^{2}
    part: W(-1)
  skills:
  - kwadrat różnicy
  - kwadrat sumy
  - różnica kwadratów
  - redukcja wyrazów podobnych
  verification:
