  - Przy założeniu |∡ABC| = |∡KLM| = 30° kąt leży między proporcjonalnymi bokami, więc z cechy bkb △ABC
    ∼ △KLM, k = 12/9 = 4/3.
  - Oblicz |KM| = (4/3)·5,4 = 7,2.
