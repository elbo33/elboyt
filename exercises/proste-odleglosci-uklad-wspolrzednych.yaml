- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: prosta prostopadła, punkt wspólny, odległość
  statement: W kartezjańskim układzie współrzędnych (x, y) dana jest prosta k o równaniu 2x + y - 5 =
    0 oraz punkt P = (-3, 1). Prosta l jest prostopadła do prostej k i przechodzi przez punkt P. Wyznacz
    równanie prostej l w postaci kierunkowej, oblicz współrzędne punktu wspólnego S prostych k i l oraz
    oblicz odległość |PS|. Zapisz obliczenia.
  statement_latex: k:\ 2x+y-5=0,\qquad l:\ y = \frac{1}{2}x+\frac{5}{2}
  solution: |-
    Sprowadzamy prostą k do postaci kierunkowej: y = -2x+5, więc a_k = -2.
    Z warunku prostopadłości a_k \cdot a_l = -1 otrzymujemy a_l = -\frac{1}{-2} = \frac{1}{2}.
    Wstawiamy współrzędne punktu P = (-3, 1) do równania y = \frac{1}{2}x+b:
    1 = \frac{1}{2}\cdot\left(-3\right)+b, czyli 1 = -\frac{3}{2}+b, stąd b = \frac{5}{2}.
    Zatem l: y = \frac{1}{2}x+\frac{5}{2}.
    Punkt wspólny: -2x+5 = \frac{1}{2}x+\frac{5}{2}. Mnożymy obie strony przez 2: -4x+10 = x+5, stąd 5 = 5x, czyli x = 1 oraz y = -2\cdot 1+5 = 3.
    Sprawdzenie: \frac{1}{2}\cdot 1+\frac{5}{2} = 3 \checkmark, więc S = (1, 3).
    Odległość: |PS| = \sqrt{\left(1-\left(-3\right)\right)^{2}+\left(3-1\right)^{2}} = \sqrt{16+4} = \sqrt{20} = 2\sqrt{5}.
  solution_steps:
  - 'Zapisz prostą k w postaci kierunkowej: y = -2x+5, zatem a_{k} = -2.'
  - Z warunku prostopadłości wyznacz a_{l} = \frac{1}{2}.
  - Wstaw P = \left(-3,\ 1\right) do y = \frac{1}{2}x+b i oblicz b = \frac{5}{2}; zapisz l:\ y = \frac{1}{2}x+\frac{5}{2}.
  - 'Rozwiąż układ: -2x+5 = \frac{1}{2}x+\frac{5}{2}, stąd x = 1 oraz y = 3, czyli S = \left(1,\ 3\right).'
  - Oblicz |PS| = \sqrt{\left(1-\left(-3\right)\right)^{2}+\left(3-1\right)^{2}} = 2\sqrt{5}.
  answer:
    kind: MULTIPART
    parts:
    - name: rownanie_prostej_l
      answer:
        kind: SYMBOLIC
        latex: y = \frac{1}{2}x+\frac{5}{2}
    - name: punkt_S
      answer:
        kind: TUPLE
        latex: \left(1,\ 3\right)
        items:
        - '1'
        - '3'
    - name: odleglosc_PS
      answer:
        kind: NUMERIC
        value: 4.47213595499958
        latex: 2\sqrt{5}
  checks:
  - kind: evaluate
    expr: \sqrt{\left(1-\left(-3\right)\right)^{2}+\left(3-1\right)^{2}}
    part: odleglosc_PS
  skills:
  - zamiana postaci ogólnej na kierunkową
  - warunek prostopadłości
  - rozwiązywanie układu równań
  - odległość dwóch punktów
  verification:
    checkability: REFERENCE_CALL
    note: '3 parts matched · det: [odleglosc_PS] SymPy solved it fresh: 4.47213595499958 vs 4.47213595499958
      (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: wzajemne położenie prostych z parametrem
  statement: 'W kartezjańskim układzie współrzędnych (x, y) dane są proste k oraz l o równaniach k: y
    = (m+2)x - 3 oraz l: 4x + 2y - 7 = 0, gdzie m jest parametrem. Wyznacz wszystkie wartości parametru
    m, dla których: a) proste k i l są równoległe, b) proste k i l są prostopadłe, c) proste k i l mają
    dokładnie jeden punkt wspólny.'
  statement_latex: k:\ y = \left(m+2\right)x-3,\qquad l:\ 4x+2y-7=0
  solution: |-
    Sprowadzamy prostą l do postaci kierunkowej: 2y = -4x+7, czyli y = -2x+\frac{7}{2}. Zatem a_l = -2 oraz b_l = \frac{7}{2}. Dla prostej k mamy a_k = m+2 oraz b_k = -3.
    a) Równoległość: a_k = a_l, czyli m+2 = -2, stąd m = -4. Wtedy k: y = -2x-3, a ponieważ -3 \ne \frac{7}{2}, proste są równoległe i rozłączne (dla żadnego m się nie pokrywają).
    b) Prostopadłość: a_k \cdot a_l = -1, czyli \left(m+2\right)\cdot\left(-2\right) = -1, stąd m+2 = \frac{1}{2}, czyli m = -\frac{3}{2}.
    c) Dokładnie jeden punkt wspólny mają proste, które nie są równoległe: m+2 \ne -2, czyli m \ne -4.
    Odpowiedź: a) m = -4, b) m = -\frac{3}{2}, c) m \in \mathbb{R}\setminus\{-4\}.
  solution_steps:
  - 'Zapisz prostą l w postaci kierunkowej: y = -2x+\frac{7}{2}, więc a_{l} = -2, b_{l} = \frac{7}{2}.'
  - a) Rozwiąż m+2 = -2, otrzymując m = -4; sprawdź, że -3 \ne \frac{7}{2}, więc proste są rozłączne.
  - b) Rozwiąż \left(m+2\right)\cdot\left(-2\right) = -1, otrzymując m = -\frac{3}{2}.
  - c) Proste przecinają się w jednym punkcie dokładnie wtedy, gdy m+2 \ne -2, czyli m \ne -4.
  answer:
    kind: MULTIPART
    parts:
    - name: m_rownolegle
      answer:
        kind: NUMERIC
        value: -4.0
        latex: '-4'
    - name: m_prostopadle
      answer:
        kind: NUMERIC
        value: -1.5
        latex: -\frac{3}{2}
    - name: m_jeden_punkt_wspolny
      answer:
        kind: SYMBOLIC
        latex: m \in \mathbb{R}\setminus\left\{-4\right\}
  checks:
  - kind: solve_equation
    expr: m+2 = -2
    var: m
    part: m_rownolegle
  - kind: solve_equation
    expr: \left(m+2\right)\cdot\left(-2\right) = -1
    var: m
    part: m_prostopadle
  skills:
  - zamiana postaci ogólnej na kierunkową
  - warunek równoległości
  - warunek prostopadłości
  - warunek przecinania się prostych
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: NOT_MACHINE_CHECKABLE: ''piecewise / matrix form'''
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: prosta prostopadła, punkt wspólny, odległość punktów
  statement: |-
    W kartezjańskim układzie współrzędnych (x, y) dane są: prosta k o równaniu x - 2y + 2 = 0 oraz punkt P = (4, 8). Prosta l jest prostopadła do prostej k i przechodzi przez punkt P. Punkt S jest punktem wspólnym prostych k oraz l.
    a) Wyznacz równanie prostej l w postaci kierunkowej.
    b) Oblicz współrzędne punktu S.
    c) Oblicz długość odcinka PS.
    Zapisz obliczenia.
  statement_latex: k:\ x - 2y + 2 = 0,\qquad P = \left(4,\ 8\right),\qquad l \perp k,\qquad S = k \cap
    l,\qquad |PS| = \sqrt{\left(x_S - 4\right)^2 + \left(y_S - 8\right)^2}
  solution: |-
    Sprowadzamy prostą k do postaci kierunkowej: z równania x - 2y + 2 = 0 otrzymujemy 2y = x + 2, czyli y = \frac{1}{2}\cdot x + 1. Zatem a_k = \frac{1}{2}.

    a) Z warunku prostopadłości a_l \cdot a_k = -1 mamy a_l = -\frac{1}{\frac{1}{2}} = -2. Prosta l ma więc równanie y = -2\cdot x + b. Podstawiamy współrzędne punktu P = (4, 8): 8 = -2\cdot 4 + b, stąd b = 16. Zatem l: y = -2x + 16.

    b) Rozwiązujemy układ równań prostych k i l, przyrównując prawe strony: \frac{1}{2}\cdot x + 1 = -2\cdot x + 16. Mnożymy obie strony przez 2: x + 2 = -4x + 32, czyli 5x = 30, więc x = 6. Wtedy y = \frac{1}{2}\cdot 6 + 1 = 4. Punkt wspólny to S = (6, 4). Sprawdzenie: 6 - 2\cdot 4 + 2 = 0 oraz -2\cdot 6 + 16 = 4.

    c) |PS| = \sqrt{\left(6 - 4\right)^2 + \left(4 - 8\right)^2} = \sqrt{4 + 16} = \sqrt{20} = 2\sqrt{5}.
  solution_steps:
  - 'Zamień równanie k na postać kierunkową: y = \frac{1}{2}\cdot x + 1, więc a_k = \frac{1}{2}.'
  - Z warunku a_l \cdot a_k = -1 wyznacz a_l = -2.
  - 'Podstaw P = (4, 8) do y = -2x + b i oblicz b = 16, czyli l: y = -2x + 16.'
  - Przyrównaj \frac{1}{2}\cdot x + 1 = -2\cdot x + 16 i wyznacz x = 6.
  - Oblicz y = \frac{1}{2}\cdot 6 + 1 = 4, czyli S = (6, 4).
  - Oblicz |PS| = \sqrt{\left(6-4\right)^2 + \left(4-8\right)^2} = \sqrt{20} = 2\sqrt{5}.
  answer:
    kind: MULTIPART
    parts:
    - name: l
      answer:
        kind: SYMBOLIC
        latex: y = -2x + 16
    - name: S_x
      answer:
        kind: NUMERIC
        value: 6.0
    - name: S_y
      answer:
        kind: NUMERIC
        value: 4.0
    - name: PS
      answer:
        kind: NUMERIC
        value: 4.47213595499958
        tol: 1.0e-06
  checks:
  - kind: solve_equation
    expr: \frac{1}{2}\cdot x + 1 = -2\cdot x + 16
    part: S_x
  - kind: evaluate
    expr: \frac{1}{2}\cdot 6 + 1
    part: S_y
  - kind: evaluate
    expr: \sqrt{\left(6 - 4\right)^2 + \left(4 - 8\right)^2}
    part: PS
  skills:
  - zamiana postaci ogólnej na kierunkową
  - wyznaczanie prostej prostopadłej przez dany punkt
  - rozwiązywanie układu równań prostych
  - obliczanie odległości dwóch punktów
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: reference produced 3 outputs, answer has 4'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: punkt na osi równo oddalony od dwóch punktów, obwód trójkąta
  statement: |-
    W kartezjańskim układzie współrzędnych (x, y) dane są punkty A = (-2, 1) oraz B = (6, 7). Punkt C leży na osi Ox i jest równo oddalony od punktów A i B.
    a) Oblicz współrzędne punktu C.
    b) Oblicz obwód trójkąta ABC.
    c) Uzasadnij, że kąt ACB jest kątem prostym.
    Zapisz obliczenia.
  statement_latex: A = \left(-2,\ 1\right),\quad B = \left(6,\ 7\right),\quad C = \left(x,\ 0\right),\quad
    |AC| = |BC|
  solution: |-
    a) Punkt C leży na osi Ox, więc C = (x, 0). Warunek |AC| = |BC| zapisujemy dla kwadratów długości:
    \left(x - \left(-2\right)\right)^2 + \left(0 - 1\right)^2 = \left(x - 6\right)^2 + \left(0 - 7\right)^2,
    czyli x^2 + 4x + 4 + 1 = x^2 - 12x + 36 + 49. Po redukcji: 4x + 5 = -12x + 85, więc 16x = 80 i x = 5. Zatem C = (5, 0).

    b) |AC| = \sqrt{\left(5 + 2\right)^2 + \left(0 - 1\right)^2} = \sqrt{49 + 1} = \sqrt{50} = 5\sqrt{2},
    |BC| = \sqrt{\left(5 - 6\right)^2 + \left(0 - 7\right)^2} = \sqrt{1 + 49} = 5\sqrt{2},
    |AB| = \sqrt{\left(6 + 2\right)^2 + \left(7 - 1\right)^2} = \sqrt{64 + 36} = \sqrt{100} = 10.
    Obwód: 5\sqrt{2} + 5\sqrt{2} + 10 = 10 + 10\sqrt{2}.

    c) |AC|^2 + |BC|^2 = 50 + 50 = 100 = |AB|^2, więc z twierdzenia odwrotnego do twierdzenia Pitagorasa kąt przy wierzchołku C (naprzeciw najdłuższego boku AB) jest prosty. Równoważnie: a_{CA} = \frac{1 - 0}{-2 - 5} = -\frac{1}{7}, a_{CB} = \frac{7 - 0}{6 - 5} = 7 oraz \left(-\frac{1}{7}\right)\cdot 7 = -1.
  solution_steps:
  - Zapisz C = (x, 0), bo C leży na osi Ox.
