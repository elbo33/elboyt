- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: ciąg z opisu geometrycznego (D1, D2, D3) z progiem (D6)
  statement: Kwadrat K_{1} ma bok długości 12. Dla każdej liczby naturalnej n \geq 1 wierzchołkami kwadratu
    K_{n+1} są środki boków kwadratu K_{n}. Niech P_{n} oznacza pole kwadratu K_{n}. Wyznacz wzór ogólny
    ciągu \left( P_{n} \right), rozstrzygnij, czy ciąg ten jest rosnący, czy malejący, oraz wyznacz najmniejszą
    liczbę naturalną n, dla której P_{n} < 5, i oblicz pole P_{n} dla tego n.
  statement_latex: P_{1} = 12^{2} = 144,\qquad P_{n+1} = \frac{1}{2}\cdot P_{n}
  solution: |-
    Niech bok kwadratu K_{n} ma długość b_{n}. Wierzchołki kwadratu K_{n+1} są środkami boków K_{n}, więc każdy bok kwadratu K_{n+1} jest przeciwprostokątną trójkąta prostokątnego równoramiennego o przyprostokątnych \frac{b_{n}}{2}, zatem
    b_{n+1} = \sqrt{\left(\frac{b_{n}}{2}\right)^{2} + \left(\frac{b_{n}}{2}\right)^{2}} = \frac{b_{n}\cdot\sqrt{2}}{2}.
    Stąd P_{n+1} = b_{n+1}^{2} = \frac{b_{n}^{2}}{2} = \frac{1}{2}\cdot P_{n} — każde kolejne pole jest połową poprzedniego.
    Ponieważ P_{1} = 12^{2} = 144, otrzymujemy
    P_{n} = \frac{144}{2^{n-1}}.
    Monotoniczność: wszystkie wyrazy są dodatnie i \frac{P_{n+1}}{P_{n}} = \frac{1}{2} < 1, więc ciąg \left( P_{n} \right) jest malejący.
    Warunek P_{n} < 5:
    \frac{144}{2^{n-1}} < 5 \iff 2^{n-1} > \frac{144}{5} = 28{,}8.
    Mamy 2^{4} = 16 < 28{,}8 oraz 2^{5} = 32 > 28{,}8, więc n - 1 \geq 5, czyli n \geq 6.
    Najmniejsza taka liczba naturalna to n = 6, a P_{6} = \frac{144}{2^{5}} = \frac{144}{32} = 4{,}5 < 5.
  solution_steps:
  - Oznacz bok kwadratu K_{n} przez b_{n} i zauważ, że b_{n+1} = \frac{b_{n}\cdot\sqrt{2}}{2}.
  - 'Wywnioskuj stąd zależność pól: P_{n+1} = \frac{1}{2}\cdot P_{n}.'
  - Oblicz P_{1} = 12^{2} = 144 i zapisz wzór ogólny P_{n} = \frac{144}{2^{n-1}}.
  - Zbadaj iloraz \frac{P_{n+1}}{P_{n}} = \frac{1}{2} < 1 przy dodatnich wyrazach — ciąg jest malejący.
  - Rozwiąż nierówność \frac{144}{2^{n-1}} < 5, czyli 2^{n-1} > 28{,}8.
  - Porównaj 2^{4} = 16 i 2^{5} = 32, otrzymując n \geq 6.
  - Oblicz P_{6} = \frac{144}{32} = 4{,}5.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_ogolny
      answer:
        kind: SYMBOLIC
        latex: P_{n} = \frac{144}{2^{n-1}}
    - name: monotonicznosc
      answer:
        kind: SYMBOLIC
        latex: malejący
    - name: n_min
      answer:
        kind: NUMERIC
        value: 6.0
    - name: P_n_min
      answer:
        kind: NUMERIC
        value: 4.5
  checks:
  - kind: evaluate
    expr: \left\lfloor \log_{2}\left(\frac{144}{5}\right) \right\rfloor + 2
    var: n
    part: n_min
  - kind: evaluate
    expr: \frac{144}{2^{6-1}}
    var: n
    part: P_n_min
  stated_model:
    variable: P_n
    objective_latex: P_{n} = \frac{144}{2^{n-1}}
    domain_lo: '1'
    goal: value
    constraint_used: wierzchołkami kolejnego kwadratu są środki boków poprzedniego, więc pole maleje o
      połowę
  skills:
  - przełożenie opisu geometrycznego na ciąg
  - wyznaczanie wzoru ogólnego ciągu geometrycznego z rekurencji
  - badanie monotoniczności ciągu o wyrazach dodatnich
  - rozwiązanie nierówności wykładniczej dla n naturalnych
  verification:
    checkability: STATED_MODEL
    note: 'stage 1 inconclusive: TypeError: name should be a string, not Token'
- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'ciąg pól prostokątów: wzór + dziedzina, monotoniczność i wartość największa (D1, D3,
    D5, D8, D10)'
  statement: |-
    Dla liczby naturalnej n \geq 1 rozważamy prostokąt P_{n}, którego jeden bok ma długość n + 1, a drugi bok ma długość 14 - n (w tych samych jednostkach). Prostokąt P_{n} istnieje tylko wtedy, gdy oba jego boki mają dodatnią długość. Niech a_{n} oznacza pole prostokąta P_{n}.
    a) Wyznacz wzór ciągu \left( a_{n} \right) w postaci wielomianu zmiennej n oraz największą liczbę naturalną n, dla której prostokąt P_{n} istnieje.
    b) Wyznacz wszystkie liczby naturalne n, dla których a_{n+1} > a_{n}, rozstrzygnij, czy ciąg \left( a_{n} \right) jest monotoniczny, oraz oblicz największe pole spośród pól prostokątów P_{n}.
  statement_latex: a_{n} = \left(n + 1\right)\cdot\left(14 - n\right)
  solution: |-
    a) Pole prostokąta to iloczyn boków:
    a_{n} = \left(n+1\right)\cdot\left(14-n\right) = 14n - n^{2} + 14 - n = -n^{2} + 13n + 14.
    Boki muszą być dodatnie: n + 1 > 0 (spełnione dla każdego n \geq 1) oraz 14 - n > 0, czyli n < 14.
    Największą liczbą naturalną spełniającą ten warunek jest n = 13 (wtedy boki mają długości 14 i 1).
    b) Wyznaczamy różnicę. Podstawiając (n+1):
    a_{n+1} = \left(n+2\right)\cdot\left(13-n\right) = -n^{2} + 11n + 26.
    Zatem
    a_{n+1} - a_{n} = \left(-n^{2} + 11n + 26\right) - \left(-n^{2} + 13n + 14\right) = 12 - 2n.
    Warunek a_{n+1} > a_{n} oznacza 12 - 2n > 0, czyli n < 6. Dla n naturalnych daje to n \in \{1, 2, 3, 4, 5\}.
    Dla n = 6 różnica jest równa 0 (a_{7} = a_{6}), a dla n \in \{7, 8, \dots, 12\} różnica jest ujemna, więc wyrazy maleją.
    Różnice mają zatem różne znaki — ciąg nie jest monotoniczny.
    Największe pole otrzymujemy dla n = 6 (i tyle samo dla n = 7):
    a_{6} = \left(6+1\right)\cdot\left(14-6\right) = 7\cdot 8 = 56, a_{7} = 8\cdot 7 = 56.
    Największe pole prostokąta P_{n} jest równe 56.
  solution_steps:
  - 'Zapisz pole jako iloczyn boków: a_{n} = \left(n+1\right)\cdot\left(14-n\right).'
  - 'Rozwiń nawiasy: a_{n} = -n^{2} + 13n + 14.'
  - Z warunku dodatniości boków 14 - n > 0 otrzymaj n < 14, więc największe naturalne n to 13.
  - Wyznacz a_{n+1} = \left(n+2\right)\cdot\left(13-n\right) = -n^{2} + 11n + 26.
  - Oblicz różnicę a_{n+1} - a_{n} = 12 - 2n.
  - Rozwiąż 12 - 2n > 0, otrzymując n < 6, czyli n \in \{1,2,3,4,5\}.
  - Zauważ, że dla n = 6 różnica jest zerowa, a dla n \geq 7 ujemna — ciąg nie jest monotoniczny.
  - 'Oblicz największy wyraz: a_{6} = 7\cdot 8 = 56 (oraz a_{7} = 56).'
  answer:
    kind: MULTIPART
    parts:
    - name: wzor
      answer:
        kind: SYMBOLIC
        latex: -n^{2} + 13\cdot n + 14
    - name: n_max
      answer:
        kind: NUMERIC
        value: 13.0
    - name: n_rosnace
      answer:
        kind: SET
        members:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    - name: monotonicznosc
      answer:
        kind: SYMBOLIC
        latex: niemonotoniczny
    - name: pole_max
      answer:
        kind: NUMERIC
        value: 56.0
  checks:
  - kind: simplify
    expr: \left(n + 1\right)\cdot\left(14 - n\right)
    var: n
    part: wzor
  - kind: evaluate
    expr: \left\lceil 14 \right\rceil - 1
    var: n
    part: n_max
  - kind: evaluate
    expr: \left(6 + 1\right)\cdot\left(14 - 6\right)
    var: n
    part: pole_max
  stated_model:
    variable: n
    objective_latex: a_{n} = \left(n+1\right)\cdot\left(14-n\right)
    domain_lo: '1'
    domain_hi: '13'
    domain_lo_open: false
    domain_hi_open: false
    constraint_used: 'oba boki dodatnie: n + 1 > 0 oraz 14 - n > 0, n liczba naturalna'
  skills:
  - układanie wzoru ciągu z opisu geometrycznego
  - wyznaczanie dziedziny z warunku dodatniości boków
  - badanie znaku różnicy a_{n+1}-a_{n} dla ciągu kwadratowego
  - wyznaczanie największego wyrazu ciągu
  verification:
    checkability: STATED_MODEL
    note: 'stage 1 inconclusive: TypeError: name should be a string, not Token'
