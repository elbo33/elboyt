  - Zbuduj funkcję P_{b}\left(H\right) = \pi H\sqrt{100 - H^{2}}.
  - 'Podstaw t = H^{2} i zbadaj g\left(t\right) = t\left(100-t\right): wierzchołek t = 50 odpowiada H
    = \sqrt{50} < 8, więc leży poza dziedziną.'
  - Na przedziale t\in\left\langle 64;100\right) funkcja g maleje, więc największe pole jest dla H = 8.
  - Oblicz r = 3 oraz P_{b} = 2\pi\cdot 3\cdot 8 = 48\pi.
