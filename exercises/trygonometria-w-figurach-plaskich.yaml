- id: g-cm-10
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 3
  exercise_type: praca z błędem — jedynka trygonometryczna
  statement: W trójkącie prostokątnym ABC kąt prosty jest przy wierzchołku C, przeciwprostokątna AB ma
    długość 20, a dla kąta ostrego α = ∠BAC zachodzi sin α = 3/5. Oblicz cos α, długość przyprostokątnej
    AC oraz pole tego trójkąta. Wyjaśnij, dlaczego z jedynki trygonometrycznej nie wynika cos α = 2/5.
  statement_latex: \sin\alpha=\frac{3}{5},\qquad \cos\alpha=\sqrt{1-\left(\frac{3}{5}\right)^{2}},\qquad
    |AC|=20\cdot\cos\alpha,\qquad P=\frac{1}{2}\cdot 12\cdot 16
  solution: |-
    BŁĘDNE ROZUMOWANIE (typowy błąd):
    Uczeń „upraszcza” jedynkę trygonometryczną do \(\sin\alpha+\cos\alpha=1\) i pisze
    \[\cos\alpha=1-\frac{3}{5}=\frac{2}{5}=0{,}4,\]
    stąd \(|AC|=20\cdot 0{,}4=8\) oraz \(|BC|=20\cdot 0{,}6=12\) i \(P=\tfrac12\cdot 12\cdot 8=48\). Wyniki błędne — dodatkowo \(8^2+12^2=208\ne 400\), więc twierdzenie Pitagorasa się nie zgadza.

    DLACZEGO TO BŁĄD:
    Wzór brzmi \(\sin^2\alpha+\cos^2\alpha=1\) — istotne są KWADRATY, a nie same wartości; z sumy kwadratów nie wolno „ściągać” potęg.

    POPRAWNE ROZWIĄZANIE:
    \[\cos^2\alpha=1-\left(\frac{3}{5}\right)^2=1-\frac{9}{25}=\frac{16}{25}\ \Rightarrow\ \cos\alpha=\frac{4}{5}=0{,}8\]
    (kąt ostry, więc pierwiastek dodatni).
    \[|BC|=20\cdot\sin\alpha=20\cdot\frac{3}{5}=12,\qquad |AC|=20\cdot\cos\alpha=20\cdot\frac{4}{5}=16 .\]
    Kontrola: \(12^2+16^2=144+256=400=20^2\). ✓ (To trójkąt podobny do trójkąta o bokach 3, 4, 5.)
    \[P=\frac{1}{2}\cdot 12\cdot 16=96 .\]

    Odpowiedź: cos α = 4/5, |AC| = 16, P = 96.
  solution_steps:
  - 'Rozpoznaj błąd: zapis sin α + cos α = 1 i wynik cos α = 0,4 (stąd |AC| = 8, P = 48).'
  - 'Zastosuj poprawnie jedynkę: cos²α = 1 − (3/5)² = 16/25.'
  - 'Weź pierwiastek dodatni (kąt ostry): cos α = 4/5.'
  - 'Oblicz przyprostokątne: |BC| = 20·(3/5) = 12, |AC| = 20·(4/5) = 16; sprawdź Pitagorasem.'
  - 'Oblicz pole: P = ½·12·16 = 96.'
  answer:
