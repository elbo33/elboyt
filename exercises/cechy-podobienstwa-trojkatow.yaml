- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: wysokość z kąta prostego — równanie kwadratowe z odrzuceniem pierwiastka
  statement: W trójkącie prostokątnym ABC kąt przy wierzchołku C jest prosty. Wysokość CD poprowadzona
    z wierzchołka C na przeciwprostokątną AB ma długość 24 cm, a punkt D dzieli przeciwprostokątną na
    odcinki AD i DB, przy czym odcinek AD jest o 14 cm dłuższy od odcinka DB. Oblicz obwód i pole trójkąta
    ABC. Zapisz obliczenia.
  statement_latex: '|CD|^{2}=|AD|\cdot|DB|\quad\Longrightarrow\quad 24^{2}=\left(x+14\right)\cdot x'
  solution: |-
    Oznaczmy |DB| = x (cm), x > 0. Wtedy |AD| = x + 14.
    Trójkąty ACD i CBD są prostokątne (kąt przy D jest prosty) i mają równe kąty ostre: |∡ACD| = |∡CBD| (oba dopełniają kąt ∡DCB do 90°). Z cechy kkk △ACD ∼ △CBD, a stąd proporcja odpowiadających boków
    \frac{|AD|}{|CD|}=\frac{|CD|}{|DB|}, czyli |CD|^{2}=|AD|\cdot|DB|.
    Podstawiamy: 24^{2}=\left(x+14\right)\cdot x, czyli x^{2}+14x-576=0.
    Δ = 14^{2}+4\cdot 576 = 196+2304 = 2500, \sqrt{\Delta}=50,
    x_{1}=\frac{-14-50}{2}=-32, x_{2}=\frac{-14+50}{2}=18.
    Długość odcinka musi być dodatnia, więc odrzucamy x = −32 i przyjmujemy |DB| = 18 cm, |AD| = 32 cm.
    Przeciwprostokątna: |AB| = 18 + 32 = 50 (cm).
    Z podobieństwa △ACD ∼ △ABC mamy |AC|^{2}=|AB|\cdot|AD| = 50\cdot 32 = 1600, więc |AC| = 40 cm.
    Analogicznie |BC|^{2}=|AB|\cdot|DB| = 50\cdot 18 = 900, więc |BC| = 30 cm.
    Obwód: 50 + 40 + 30 = 120 (cm).
    Pole: P = \frac{1}{2}\cdot|AB|\cdot|CD| = \frac{1}{2}\cdot 50\cdot 24 = 600 (cm²).
    Sprawdzenie: 30^{2}+40^{2}=900+1600=2500=50^{2} — twierdzenie Pitagorasa spełnione.
  solution_steps:
  - 'Wprowadź zmienną: |DB| = x > 0, wtedy |AD| = x + 14.'
