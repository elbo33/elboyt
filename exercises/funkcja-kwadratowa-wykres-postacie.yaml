  statement: 'Funkcja kwadratowa f jest określona wzorem f(x)=2x^{2}-4x+5. Uczeń napisał: „każdą funkcję
    kwadratową można zapisać w postaci iloczynowej, więc f(x)=2\left(x-x_{1}\right)\left(x-x_{2}\right)
    dla pewnych liczb x_{1}, x_{2}”. Oblicz wyróżnik \Delta, rozstrzygnij, czy postać iloczynowa funkcji
