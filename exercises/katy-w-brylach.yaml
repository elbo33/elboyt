- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 5
  exercise_type: bryła obrotowa — wybór osi obrotu i filtr warunkiem na kąt
  statement: Trójkąt prostokątny, w którym jedna z przyprostokątnych ma długość 6, a przeciwprostokątna
    ma długość 10, obrócono wokół prostej zawierającej jedną z jego przyprostokątnych. Otrzymany stożek
    obrotowy ma kąt rozwarcia większy od 90°. Oblicz objętość tego stożka oraz cosinus kąta nachylenia
    tworzącej do płaszczyzny podstawy. Uzasadnij, że obrót wokół drugiej przyprostokątnej nie daje bryły
    spełniającej warunki zadania.
  statement_latex: a=6,\ c=10\ \Rightarrow\ b=\sqrt{10^{2}-6^{2}}=8,\qquad V=\frac{1}{3}\cdot\pi\cdot
    r^{2}\cdot h,\qquad \operatorname{tg}\beta=\frac{r}{h}
  solution: |-
    Druga przyprostokątna ma długość \sqrt{10^{2}-6^{2}} = \sqrt{64} = 8.

    Przy obrocie wokół prostej zawierającej przyprostokątną ta przyprostokątna staje się wysokością stożka, druga — promieniem podstawy, a przeciwprostokątna — tworzącą (zawsze l = 10).

    Kąt rozwarcia to 2β, gdzie β jest kątem między tworzącą a osią i \operatorname{tg}\beta = \frac{r}{h}. Warunek 2β > 90° oznacza β > 45°, czyli \operatorname{tg}\beta > 1, a więc r > h.

    Wariant I — oś zawiera przyprostokątną długości 6: h = 6, r = 8, wtedy \operatorname{tg}\beta = \frac{8}{6} = \frac{4}{3} > 1, więc β > 45° i kąt rozwarcia jest większy od 90°. Ten wariant spełnia warunki zadania.
    Wariant II — oś zawiera przyprostokątną długości 8: h = 8, r = 6, wtedy \operatorname{tg}\beta = \frac{6}{8} = \frac{3}{4} < 1, więc β < 45° i kąt rozwarcia byłby mniejszy od 90°. Ten wariant odrzucamy.

    Dla wariantu I:
    V = \frac{1}{3}\cdot\pi\cdot 8^{2}\cdot 6 = 128\pi.
    Kąt α nachylenia tworzącej do podstawy jest kątem przy podstawie trójkąta osiowego: \cos\alpha = \frac{r}{l} = \frac{8}{10} = \frac{4}{5} (α ≈ 36°52').

    Odpowiedź: V = 128\pi, \cos\alpha = \frac{4}{5}.
  solution_steps:
  - 'Z twierdzenia Pitagorasa wyznacz drugą przyprostokątną: \sqrt{10^{2}-6^{2}} = 8.'
  - Zauważ, że oś obrotu nie jest wskazana — rozważ oba możliwe obroty; w każdym l = 10.
  - 'Zapisz warunek na kąt rozwarcia: 2\beta > 90^\circ \iff \operatorname{tg}\beta = \frac{r}{h} > 1
    \iff r > h.'
  - Odrzuć wariant h = 8, r = 6 (bo \frac{6}{8} < 1); przyjmij h = 6, r = 8.
  - 'Oblicz objętość: V = \frac{1}{3}\cdot\pi\cdot 8^{2}\cdot 6 = 128\pi.'
  - Oblicz \cos\alpha = \frac{r}{l} = \frac{8}{10} = \frac{4}{5}.
  answer:
    kind: MULTIPART
    parts:
    - name: objetosc
      answer:
        kind: NUMERIC
        value: 402.1238596594935
        tol: 1.0e-06
    - name: cos_alfa
      answer:
        kind: SYMBOLIC
        latex: \frac{4}{5}
    - name: uzasadnienie_wyboru_osi
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy wykazać, że przy obrocie wokół przyprostokątnej długości 8 mamy r = 6, h = 8, więc
          \operatorname{tg}\beta = \frac{6}{8} < 1, czyli \beta < 45^\circ i kąt rozwarcia 2\beta < 90^\circ
          — warunek zadania nie jest spełniony.
