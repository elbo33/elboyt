- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: średnia, mediana i dominanta z tabeli liczebności
  statement: 'W konkursie matematycznym wzięło udział 24 uczniów. Rozkład uzyskanych przez nich liczb
    punktów przedstawia zestawienie: 5 punktów uzyskało 3 uczniów, 6 punktów – 5 uczniów, 7 punktów –
    10 uczniów, 8 punktów – 4 uczniów, 9 punktów – 2 uczniów. Oblicz średnią arytmetyczną liczby punktów
    oraz wyznacz medianę i dominantę.'
  statement_latex: \bar{x}=\frac{5\cdot 3+6\cdot 5+7\cdot 10+8\cdot 4+9\cdot 2}{3+5+10+4+2}
  solution: |-
    Sprawdzamy liczebność: 3 + 5 + 10 + 4 + 2 = 24 ✓.

    Średnia: suma iloczynów wartość·liczebność wynosi
    5\cdot 3+6\cdot 5+7\cdot 10+8\cdot 4+9\cdot 2 = 15+30+70+32+18 = 165,
    zatem \bar{x}=\frac{165}{24}=6{,}875. Mianownikiem jest łączna liczba uczniów (24), a nie liczba różnych wyników.

    Mediana: n = 24 jest parzyste, więc szukamy elementów o numerach 12 i 13 w szeregu uporządkowanym. Liczebności skumulowane: do 5 punktów – 3, do 6 punktów – 3 + 5 = 8, do 7 punktów – 8 + 10 = 18. Pozycje od 9. do 18. zajmuje wartość 7, więc element 12. i 13. to 7 i 7, czyli \mathrm{Me}=\frac{7+7}{2}=7.

    Dominanta: największa liczebność to 10 i odpowiada wartości 7 punktów, więc D = 7.

    Sprawdzenie: 5 \le 6{,}875 \le 9 ✓.
    Odpowiedź: \bar{x}=6{,}875, \mathrm{Me}=7, D=7.
  solution_steps:
  - 'Sprawdź łączną liczebność: 3 + 5 + 10 + 4 + 2 = 24.'
  - 'Oblicz sumę iloczynów wartość·liczebność: 15 + 30 + 70 + 32 + 18 = 165.'
  - 'Podziel przez łączną liczebność: \bar{x}=\frac{165}{24}=6{,}875.'
  - 'Dla mediany wyznacz pozycje 12. i 13. i utwórz liczebności skumulowane: 3, 8, 18.'
  - 'Odczytaj wartości na pozycjach 12. i 13.: 7 i 7, więc \mathrm{Me}=\frac{7+7}{2}=7.'
  - 'Wskaż wartość o największej liczebności (10): D = 7.'
  answer:
    kind: MULTIPART
    parts:
    - name: srednia
      answer:
        kind: NUMERIC
        value: 6.875
        latex: 6{,}875
    - name: mediana
      answer:
        kind: NUMERIC
        value: 7.0
        latex: '7'
    - name: dominanta
      answer:
        kind: NUMERIC
        value: 7.0
        latex: '7'
  checks:
  - kind: evaluate
    expr: \frac{5\cdot 3+6\cdot 5+7\cdot 10+8\cdot 4+9\cdot 2}{3+5+10+4+2}
    part: srednia
  - kind: evaluate
    expr: \frac{7+7}{2}
    part: mediana
  skills:
  - odczyt tabeli liczebności
  - średnia ważona liczebnościami
