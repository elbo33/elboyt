  exercise_type: 'modelowanie bryłą: wzór z dziedziną + nierówność liniowa'
  statement: Ze sztywnego drutu o długości 84 cm wykonano model prostopadłościanu (drut tworzy wszystkie
    krawędzie i został zużyty w całości). Podstawą tego prostopadłościanu jest prostokąt, w którym jeden
    bok jest dwa razy dłuższy od drugiego. a) Wyznacz wzór opisujący wysokość tego prostopadłościanu w
    zależności od długości krótszego boku podstawy oraz podaj dziedzinę tej zależności (zbiór tych długości,
    dla których prostopadłościan istnieje). b) Wyznacz zbiór wszystkich długości krótszego boku podstawy,
    dla których wysokość prostopadłościanu jest nie mniejsza od dłuższego boku podstawy, i podaj największą
    możliwą długość krótszego boku podstawy.
  statement_latex: 4\cdot\left(x + 2\cdot x + h\right) = 84
  solution: |-
    Oznaczmy przez x (w centymetrach) długość krótszego boku podstawy. Wtedy dłuższy bok podstawy ma długość 2\cdot x, a wysokość oznaczmy przez h.
    Prostopadłościan ma 12 krawędzi: po 4 krawędzie każdej z trzech długości, więc suma ich długości wynosi 4\cdot\left(x + 2\cdot x + h\right). Cały drut został zużyty, zatem
    4\cdot\left(x + 2\cdot x + h\right) = 84, czyli 3\cdot x + h = \frac{84}{4} = 21.
    Stąd h = 21 - 3\cdot x.
    Dziedzina: wszystkie wymiary muszą być dodatnie, więc x > 0 oraz h > 0, czyli 21 - 3\cdot x > 0, stąd x < 7. Zatem x \in \left(0, 7\right).
    b) Warunek „wysokość nie mniejsza od dłuższego boku podstawy”: h \ge 2\cdot x, czyli
    21 - 3\cdot x \ge 2\cdot x, stąd 21 \ge 5\cdot x, czyli x \le \frac{21}{5} = 4{,}2.
