  exercise_type: trójkąt prostokątny z wysokością na przeciwprostokątną + ocena wyniku
  statement: |-
    Dany jest trójkąt prostokątny ABC, w którym kąt przy wierzchołku C jest prosty. Punkt D leży na przeciwprostokątnej AB i jest spodkiem wysokości poprowadzonej z wierzchołka C, przy czym |AD| = 9 oraz |DB| = 16.
    a) Oblicz długość wysokości CD oraz długości obu przyprostokątnych AC i BC.
    b) Oblicz tangens kąta ABC i rozstrzygnij, czy miara kąta ABC jest mniejsza od 40° (przyjmij tg 40° ≈ 0,839).
  statement_latex: \operatorname{tg}\left(\sphericalangle CAD\right)=\frac{|CD|}{9},\qquad \operatorname{tg}\left(\sphericalangle
    CBD\right)=\frac{|CD|}{16},\qquad \sphericalangle CAD+\sphericalangle CBD=90^\circ
  solution: |-
    Oznaczmy α = |∠CAB|, β = |∠CBA| oraz h = |CD|. Odcinek CD jest prostopadły do AB, więc trójkąty ACD i BCD są prostokątne o kącie prostym przy D.
    1) W trójkącie ACD: tg α = h/9. W trójkącie BCD: tg β = h/16.
    2) W trójkącie ABC kąt przy C jest prosty, więc α + β = 90°, a stąd tg β = tg(90° − α) = 1/tg α, czyli
     h/16 = 9/h, zatem h² = 144 i h = 12 (bierzemy wartość dodatnią).
    3) Przyprostokątne z twierdzenia Pitagorasa (w trójkątach ACD i BCD):
     |AC| = √(9² + 12²) = √225 = 15, |BC| = √(16² + 12²) = √400 = 20.
     Kontrola w trójkącie ABC: 15² + 20² = 225 + 400 = 625 = 25² = (9 + 16)². ✓
    4) Kąt ABC = β. Względem β w trójkącie ABC bok AC = 15 leży naprzeciw, bok BC = 20 leży przy nim — obie przyprostokątne, więc
     tg β = 15/20 = 3/4 = 0,75. (Ten sam wynik daje trójkąt BCD: 12/16 = 0,75.)
    5) Ponieważ 0,75 < 0,839 ≈ tg 40°, a tangens kąta ostrego rośnie wraz z miarą kąta, to β < 40°.
    Odpowiedź: |CD| = 12, |AC| = 15, |BC| = 20, tg(∠ABC) = 3/4, a miara kąta ABC jest mniejsza od 40°.
  solution_steps:
  - Oznacz h = |CD| i zauważ, że trójkąty ACD i BCD są prostokątne.
  - Zapisz tg α = h/9 oraz tg β = h/16.
  - 'Skorzystaj z α + β = 90°, czyli tg β = 1/tg α: h/16 = 9/h, więc h² = 144 i h = 12.'
  - 'Z twierdzenia Pitagorasa: |AC| = √(81 + 144) = 15, |BC| = √(256 + 144) = 20.'
  - tg(∠ABC) = 12/16 = 15/20 = 0,75.
  - 'Porównaj: 0,75 < 0,839 ≈ tg 40°, więc ∠ABC < 40°.'
  answer:
