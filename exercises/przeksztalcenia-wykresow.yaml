    q oraz współrzędne punktów A i B.
  statement_latex: g\left(x\right)=\left|x-3\right|+q,\qquad P=\frac{1}{2}\cdot\left|AB\right|\cdot h=25
  solution: |-
    Po przesunięciu o wektor [3,q] mamy g(x)=\left|x-3\right|+q. Jest to 'litera V' o wierzchołku W=(3,\ q) i ramionach o współczynnikach kierunkowych -1 oraz 1.

    Wykres przecina oś Ox w dwóch punktach tylko wtedy, gdy wierzchołek leży poniżej osi Ox, czyli gdy q<0. Podstawmy q=-t, gdzie t>0.
    Miejsca zerowe: \left|x-3\right|=t \iff x=3-t lub x=3+t, więc A=(3-t,\ 0), B=(3+t,\ 0) oraz \left|AB\right|=2t.
    Wysokość trójkąta o podstawie AB i trzecim wierzchołku W=(3,-t) jest równa odległości W od osi Ox, czyli t.

    Pole: P=\frac{1}{2}\cdot 2t\cdot t=t^2. Z warunku t^2=25 i t>0 otrzymujemy t=5 (rozwiązanie t=-5 odrzucamy, bo t>0).

    Zatem q=-5, a punkty przecięcia z osią Ox to A=(3-5,\ 0)=(-2,\ 0) oraz B=(3+5,\ 0)=(8,\ 0).
    Sprawdzenie: g(x)=\left|x-3\right|-5, g(-2)=5-5=0, g(8)=5-5=0, wierzchołek (3,-5), pole \frac{1}{2}\cdot 10\cdot 5=25 ✓.
