  statement: W kartezjańskim układzie współrzędnych (x, y) dany jest trójkąt prostokątny ABC o wierzchołkach
    A = (-4, 1), B = (-1, 1), C = (-1, 5). Wyznacz współrzędne wierzchołków trójkąta A'B'C', który jest
    obrazem trójkąta ABC w symetrii względem osi Oy, a następnie oblicz obwód i pole trójkąta A'B'C'.
  statement_latex: A=\left(-4,\;1\right),\; B=\left(-1,\;1\right),\; C=\left(-1,\;5\right),\qquad S_{Oy}\left(x,\;y\right)=\left(-x,\;y\right)
  solution: |-
    Symetria względem osi Oy zmienia znak pierwszej współrzędnej, drugą pozostawia:
    A' = (4, 1), B' = (1, 1), C' = (1, 5).
    Obrazem trójkąta ABC jest trójkąt A'B'C' o tych wierzchołkach (bok AB przechodzi na A'B' itd.).
    Długości boków trójkąta wyjściowego: |AB| = |-1 - (-4)| = 3 (bok poziomy), |BC| = |5 - 1| = 4 (bok pionowy), kąt przy B jest prosty, więc |AC| = \sqrt{3^2 + 4^2} = 5.
    Symetria osiowa jest izometrią, więc boki obrazu mają te same długości: |A'B'| = 3, |B'C'| = 4, |A'C'| = 5.
    Obwód: 3 + 4 + 5 = 12.
    Pole: \frac{1}{2}\cdot 3\cdot 4 = 6.
  solution_steps:
  - Zastosuj wzór S_Oy(x, y) = (-x, y) do każdego wierzchołka.
  - 'Zapisz obrazy: A'' = (4, 1), B'' = (1, 1), C'' = (1, 5).'
  - 'Oblicz długości boków: |A''B''| = 3, |B''C''| = 4, |A''C''| = \sqrt{3^2 + 4^2} = 5.'
  - 'Oblicz obwód: 3 + 4 + 5 = 12.'
  - 'Oblicz pole trójkąta prostokątnego: \frac{1}{2}\cdot 3\cdot 4 = 6.'
  answer:
    kind: MULTIPART
    parts:
    - name: A'
      answer:
        kind: TUPLE
        items:
        - '4'
        - '1'
    - name: B'
      answer:
        kind: TUPLE
        items:
        - '1'
        - '1'
    - name: C'
      answer:
        kind: TUPLE
        items:
        - '1'
        - '5'
    - name: obwod
      answer:
        kind: NUMERIC
        value: 12.0
    - name: pole
      answer:
        kind: NUMERIC
        value: 6.0
  checks:
  - kind: evaluate
    expr: 3+4+\sqrt{3^2+4^2}
    part: obwod
  - kind: evaluate
