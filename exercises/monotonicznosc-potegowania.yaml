- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: nierówność wykładnicza z nieznaną podstawą
  statement: |-
    Liczba a jest dodatnia i różna od 1. Wiadomo, że a^{\frac{1}{2}} < a^{\frac{1}{3}}.
    a) Rozstrzygnij, do którego z przedziałów: \left( 0, 1 \right) czy \left( 1, +\infty \right), należy liczba a. Odpowiedź uzasadnij.
    b) Rozwiąż nierówność a^{2x-3} \le a^{5-x} i zapisz zbiór rozwiązań w postaci przedziału. Podaj najmniejszą liczbę całkowitą spełniającą tę nierówność.
  statement_latex: a^{\frac{1}{2}} < a^{\frac{1}{3}}, \qquad a^{2 \cdot x - 3} \le a^{5 - x}
  solution: |-
    a) Wykładniki spełniają \frac{1}{3} < \frac{1}{2}, a mimo to potęga o większym wykładniku jest MNIEJSZA: a^{\frac{1}{2}} < a^{\frac{1}{3}}. Oznacza to, że potęgowanie o podstawie a odwraca porządek wykładników, a to zachodzi dokładnie wtedy, gdy 0 < a < 1. Zatem a \in \left( 0, 1 \right).
    (Gdyby było a > 1, to z \frac{1}{3} < \frac{1}{2} wynikałoby a^{\frac{1}{3}} < a^{\frac{1}{2}}, co przeczy założeniu.)

    b) Skoro 0 < a < 1, to opuszczając potęgowanie ODWRACAMY znak nierówności:
    a^{2x-3} \le a^{5-x} \iff 2x - 3 \ge 5 - x
    2x + x \ge 5 + 3
    3x \ge 8
    x \ge \frac{8}{3}.

    Zbiór rozwiązań: x \in \left\langle \frac{8}{3}, +\infty \right).
    Ponieważ \frac{8}{3} = 2\frac{2}{3}, najmniejszą liczbą całkowitą spełniającą nierówność jest 3.

    Sprawdzenie dla a = \frac{1}{2} i x = 3: lewa strona \left( \frac{1}{2} \right)^{3} = \frac{1}{8}, prawa strona \left( \frac{1}{2} \right)^{2} = \frac{1}{4}; istotnie \frac{1}{8} \le \frac{1}{4}.
  solution_steps:
