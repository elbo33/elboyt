  statement: Obwód pewnego prostokąta jest równy 40 cm, a jeden z jego boków jest co najmniej o 4 cm dłuższy
    od drugiego boku. Oblicz największe możliwe pole takiego prostokąta oraz podaj długości boków prostokąta,
    który ma to pole. Zapisz obliczenia.
  statement_latex: P\left(x\right)=x\cdot\left(20-x\right),\qquad x-\left(20-x\right)\geq 4
  solution: |-
    Niech x (w centymetrach) oznacza długość dłuższego boku prostokąta, a y — długość krótszego boku. Z obwodu:
    2x + 2y = 40, więc y = 20 - x.
    Warunek „jeden bok jest co najmniej o 4 cm dłuższy od drugiego” zapisujemy jako
    x - (20 - x) ≥ 4, czyli 2x ≥ 24, stąd x ≥ 12.
    Ponadto y > 0, czyli x < 20. Dziedzina: x ∈ ⟨12, 20).
    Pole: P(x) = x·(20 - x) = -x² + 20x — funkcja kwadratowa o a = -1 < 0, o wierzchołku dla
    p = \frac{-20}{2\cdot(-1)} = 10.
    Ale 10 ∉ ⟨12, 20), więc wartości 100 nie da się osiągnąć. Dla a < 0 funkcja maleje w przedziale ⟨10, +∞), a więc maleje w całej dziedzinie ⟨12, 20). Największą wartość przyjmuje zatem na lewym końcu, dla x = 12:
    P(12) = 12·(20 - 12) = 12·8 = 96.
    Wtedy y = 8, a warunek 12 - 8 = 4 ≥ 4 jest spełniony ✔.
    Największe możliwe pole wynosi 96 cm², a boki mają długości 12 cm i 8 cm.
  solution_steps:
  - Oznaczamy dłuższy bok przez x, krótszy przez y i z obwodu otrzymujemy y = 20 - x.
  - Zapisujemy warunek x - (20 - x) ≥ 4, czyli x ≥ 12, oraz y > 0, czyli x < 20; dziedzina to ⟨12, 20).
  - 'Układamy funkcję pola: P(x) = x(20 - x) = -x² + 20x.'
  - Obliczamy p = 10 i stwierdzamy, że wierzchołek leży poza dziedziną.
  - Ponieważ P maleje w ⟨10, +∞), największa wartość jest dla x = 12.
  - 'Obliczamy P(12) = 96 i podajemy boki: 12 cm oraz 8 cm.'
