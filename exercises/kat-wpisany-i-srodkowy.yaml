  - 'Skorzystaj z |OA| = |OB| = r: |\angle OBA| = |\angle OAB| = 32^\circ.'
  - 'Oblicz kąt środkowy: |\angle AOB| = 180^\circ - 2\cdot 32^\circ = 116^\circ.'
