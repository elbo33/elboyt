- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: potęgi i nierówności wykładnicze w zadaniu o bryle (wzór + dziedzina)
  statement: |-
    Prostopadłościan ma podstawę kwadratową o krawędzi długości 2^{x} cm i pole powierzchni bocznej równe 2^{9} cm^{2} (x jest liczbą rzeczywistą).
    a) Wyznacz wzór na wysokość H tego prostopadłościanu w zależności od x, zapisując go w postaci potęgi liczby 2.
    b) Wyznacz zbiór wszystkich wartości x, dla których jednocześnie wysokość prostopadłościanu jest mniejsza od krawędzi jego podstawy oraz objętość prostopadłościanu nie przekracza 2^{12} cm^{3}.
    c) Oblicz objętość prostopadłościanu dla największej wartości x spełniającej warunki z podpunktu b).
  statement_latex: 4 \cdot 2^{x} \cdot H = 2^{9}, \qquad V\left( x \right) = \left( 2^{x} \right)^{2}
    \cdot H
  solution: |-
    a) Pole powierzchni bocznej prostopadłościanu o podstawie kwadratowej to obwód podstawy razy wysokość:
    4 \cdot 2^{x} \cdot H = 2^{9},
    zatem
    H = \frac{2^{9}}{4 \cdot 2^{x}} = \frac{2^{9}}{2^{2} \cdot 2^{x}} = 2^{9-2-x} = 2^{7-x} \;\left[ \text{cm} \right].

    b) Objętość: V\left( x \right) = \left( 2^{x} \right)^{2} \cdot H = 2^{2x} \cdot 2^{7-x} = 2^{x+7}.

    Warunek 1 (wysokość mniejsza od krawędzi podstawy): 2^{7-x} < 2^{x}. Podstawa 2 > 1, więc porównujemy wykładniki bez zmiany znaku:
    7 - x < x \iff 7 < 2x \iff x > \frac{7}{2}.

    Warunek 2 (objętość nie przekracza 2^{12}): 2^{x+7} \le 2^{12}, znowu podstawa 2 > 1, więc
    x + 7 \le 12 \iff x \le 5.

    Część wspólna obu warunków: x \in \left( \frac{7}{2}, 5 \right\rangle. Zbiór jest niepusty, więc taki prostopadłościan istnieje.

    c) Największa dopuszczalna wartość to x = 5 (spełnia 5 > \frac{7}{2}). Wtedy
    V = 2^{5+7} = 2^{12} = 4096 \;\left[ \text{cm}^{3} \right]
    (krawędź podstawy 2^{5} = 32 cm, wysokość 2^{2} = 4 cm — istotnie wysokość jest mniejsza od krawędzi podstawy, a pole boczne wynosi 4 \cdot 32 \cdot 4 = 512 = 2^{9} cm^{2}).
  solution_steps:
  - 'Zapisz pole powierzchni bocznej: 4 \cdot 2^{x} \cdot H = 2^{9}.'
  - 'Wyznacz wysokość: H = \frac{2^{9}}{2^{2} \cdot 2^{x}} = 2^{7-x}.'
  - 'Ułóż wzór na objętość: V\left( x \right) = 2^{2x} \cdot 2^{7-x} = 2^{x+7}.'
  - Z warunku 2^{7-x} < 2^{x} przy podstawie 2 > 1 otrzymaj 7 - x < x, czyli x > \frac{7}{2}.
  - Z warunku 2^{x+7} \le 2^{12} otrzymaj x + 7 \le 12, czyli x \le 5.
  - 'Wyznacz część wspólną: x \in \left( \frac{7}{2}, 5 \right\rangle.'
  - Dla największego x = 5 oblicz V = 2^{12} = 4096 cm^{3}.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_wysokosci
      answer:
        kind: SYMBOLIC
        latex: H\left( x \right) = 2^{7-x}
    - name: zbior_x
      answer:
        kind: INTERVAL
        lo: \frac{7}{2}
        hi: '5'
        hi_open: false
    - name: objetosc_dla_najwiekszego_x
      answer:
        kind: NUMERIC
        value: 4096.0
