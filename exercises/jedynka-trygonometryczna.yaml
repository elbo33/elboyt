  statement: Kąt \alpha jest ostry oraz \sin\alpha = \frac{1}{3}. Oblicz \cos\alpha oraz \operatorname{tg}\alpha.
  statement_latex: \sin\alpha=\frac{1}{3},\qquad \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha}
  solution: |-
    Najpierw cosinus (tu błędu nie ma): \cos^{2}\alpha=1-\left(\frac{1}{3}\right)^{2}=1-\frac{1}{9}=\frac{8}{9}, więc \cos\alpha=\sqrt{\frac{8}{9}}=\frac{2\sqrt{2}}{3} (kąt ostry).

    BŁĘDNE ROZUMOWANIE (typowy błąd):
    Uczeń zapisuje odwrócony wzór \operatorname{tg}\alpha=\frac{\cos\alpha}{\sin\alpha} i otrzymuje
    \operatorname{tg}\alpha=\frac{\frac{2\sqrt{2}}{3}}{\frac{1}{3}}=2\sqrt{2}\approx 2{,}83 — wynik BŁĘDNY.

    DLACZEGO TO BŁĄD:
    Tangens to „naprzeciw przez przy", czyli \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha} — sinus jest w liczniku. Kontrola na kącie znanym: \operatorname{tg}60^\circ=\sqrt{3}=\frac{\sin 60^\circ}{\cos 60^\circ}, natomiast \frac{\cos 60^\circ}{\sin 60^\circ}=\frac{\sqrt{3}}{3} — to inna liczba. Tu \sin\alpha<\cos\alpha, więc tangens musi być MNIEJSZY od 1, a 2\sqrt{2}>1.

    POPRAWNE ROZWIĄZANIE:
    \operatorname{tg}\alpha=\frac{\sin\alpha}{\cos\alpha}=\frac{\frac{1}{3}}{\frac{2\sqrt{2}}{3}}=\frac{1}{3}\cdot\frac{3}{2\sqrt{2}}=\frac{1}{2\sqrt{2}}=\frac{\sqrt{2}}{4}.
    Odpowiedź: \cos\alpha=\frac{2\sqrt{2}}{3}, \operatorname{tg}\alpha=\frac{\sqrt{2}}{4}.
