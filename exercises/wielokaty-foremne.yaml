- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: zadanie odwrotne — liczba boków z liczby przekątnych
  statement: Liczba przekątnych pewnego wielokąta foremnego jest o 25 większa od liczby jego boków. Oblicz,
    ile boków ma ten wielokąt, jaka jest miara jego kąta wewnętrznego oraz ile wynosi suma miar wszystkich
    jego kątów wewnętrznych.
  statement_latex: \frac{n\cdot\left(n-3\right)}{2}=n+25
  solution: |-
    Niech n oznacza liczbę boków wielokąta, n \ge 3 i n jest liczbą naturalną. Liczba przekątnych wynosi \frac{n\cdot\left(n-3\right)}{2}, więc warunek zadania daje równanie
    \frac{n\cdot\left(n-3\right)}{2}=n+25.
    Mnożymy obie strony przez 2: n^{2}-3n=2n+50, czyli n^{2}-5n-50=0.
    Wyróżnik: \Delta=\left(-5\right)^{2}-4\cdot 1\cdot\left(-50\right)=25+200=225, \sqrt{\Delta}=15.
    Stąd n=\frac{5-15}{2}=-5 lub n=\frac{5+15}{2}=10.
    Liczba boków musi być liczbą naturalną nie mniejszą niż 3, więc rozwiązanie n=-5 odrzucamy; zostaje n=10.
    Sprawdzenie: \frac{10\cdot 7}{2}=35=10+25 ✓.
    Kąt wewnętrzny: \alpha=\frac{\left(10-2\right)\cdot 180^\circ}{10}=144^\circ.
    Suma kątów wewnętrznych: S=\left(10-2\right)\cdot 180^\circ=1440^\circ.
    Odpowiedź: dziesięciokąt foremny, kąt wewnętrzny 144°, suma kątów 1440°.
  solution_steps:
  - Oznacz liczbę boków przez n (n naturalne, n \ge 3) i zapisz liczbę przekątnych jako \frac{n\cdot\left(n-3\right)}{2}.
  - Ułóż równanie \frac{n\cdot\left(n-3\right)}{2}=n+25 i sprowadź je do postaci n^{2}-5n-50=0.
  - Oblicz \Delta=225 i pierwiastki n=-5 oraz n=10.
  - Odrzuć n=-5 (liczba boków musi być naturalna i nie mniejsza od 3); przyjmij n=10.
  - Oblicz kąt wewnętrzny \alpha=\frac{\left(10-2\right)\cdot 180^\circ}{10}=144^\circ oraz sumę S=\left(10-2\right)\cdot
    180^\circ=1440^\circ.
  answer:
    kind: MULTIPART
    parts:
    - name: n
      answer:
        kind: NUMERIC
        value: 10.0
    - name: kat_wewnetrzny
      answer:
        kind: NUMERIC
        value: 144.0
    - name: suma_katow
      answer:
        kind: NUMERIC
        value: 1440.0
  checks:
  - kind: evaluate
    expr: \frac{5+\sqrt{\left(-5\right)^{2}+4\cdot 50}}{2}
    var: n
    part: n
