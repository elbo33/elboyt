  - 'Oblicz \sin\alpha=\frac{2\sqrt{3}}{4}=\frac{\sqrt{3}}{2} i wypisz oba rozwiązania: 60^\circ i 120^\circ.'
  - Z warunku 'B w II ćwiartce' wynika x_{B}<0, więc \alpha=120^\circ.
  - Wyznacz x_{B}=-\sqrt{16-12}=-2 i sprawdź zgodność z \cos 120^\circ=-\frac{1}{2}.
