  statement: Kąt α o mierze z przedziału \left(0^\circ,180^\circ\right) ma wierzchołek w punkcie O = (0,\
    0), jedno jego ramię pokrywa się z dodatnią półosią Ox, a na drugim ramieniu leży punkt P = (m,\ 4),
    którego odległość od punktu O jest równa 8. Wiadomo ponadto, że α jest kątem rozwartym. Wyznacz liczbę
    m oraz miarę kąta α.
  statement_latex: P=\left(m,\ 4\right),\qquad \left|OP\right|=\sqrt{m^{2}+4^{2}}=8,\qquad \alpha\in\left(90^\circ,180^\circ\right)
  solution: |-
    Odległość punktu P od początku układu to r=\left|OP\right|=\sqrt{m^{2}+4^{2}}, więc z warunku zadania \sqrt{m^{2}+16}=8.
    Stąd m^{2}+16=64, czyli m^{2}=48 i m=4\sqrt{3} lub m=-4\sqrt{3}.
    Kąt α jest rozwarty, więc jego ramię leży w II ćwiartce, a zatem pierwsza współrzędna punktu P jest ujemna. Odrzucamy m=4\sqrt{3} i przyjmujemy m=-4\sqrt{3}.
    Teraz \cos\alpha=\frac{m}{r}=\frac{-4\sqrt{3}}{8}=-\frac{\sqrt{3}}{2}.
    Kątem ostrym o cosinusie \frac{\sqrt{3}}{2} jest 30^\circ, a wartość ujemna oznacza kąt rozwarty, więc \alpha=180^\circ-30^\circ=150^\circ.
    Kontrola: \sin\alpha=\frac{4}{8}=\frac{1}{2}=\sin 150^\circ. ✔
  solution_steps:
  - 'Zapisz warunek na odległość: \sqrt{m^{2}+16}=8.'
  - Podnieś obustronnie do kwadratu i wyznacz m^{2}=48, czyli m=\pm 4\sqrt{3}.
  - Z warunku 'kąt rozwarty' wynika m<0, więc m=-4\sqrt{3}.
  - Oblicz \cos\alpha=\frac{-4\sqrt{3}}{8}=-\frac{\sqrt{3}}{2}.
  - Odczytaj \alpha=180^\circ-30^\circ=150^\circ i sprawdź wynik sinusem.
  answer:
    kind: MULTIPART
    parts:
    - name: m
      answer:
        kind: SYMBOLIC
        latex: -4\sqrt{3}
    - name: alpha
      answer:
        kind: NUMERIC
        value: 150.0
        latex: 150^\circ
