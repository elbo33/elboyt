    Gdzie tkwi błąd: walce są podobne tylko wtedy, gdy ich wymiary są proporcjonalne, czyli gdy r_A/r_B = h_A/h_B.
    Sprawdzenie: r_A/r_B = 2/4 = 1/2, natomiast h_A/h_B = 6/9 = 2/3. Ponieważ 1/2 ≠ 2/3, walce NIE są podobne i wzoru V' = k³V użyć nie wolno.
