  exercise_type: wyznaczanie R z objętości i obliczanie pola
  statement: Objętość kuli jest równa 36\pi\ \text{cm}^{3}. Oblicz promień tej kuli, jej pole powierzchni
    oraz pole koła wielkiego tej kuli. Zapisz obliczenia.
  statement_latex: \frac{4}{3}\pi R^{3} = 36\pi
  solution: |-
    Krok 1. Ze wzoru na objętość: \frac{4}{3}\pi R^{3} = 36\pi.
    Krok 2. Mnożymy obie strony przez \frac{3}{4\pi}: R^{3} = \frac{3\cdot 36\pi}{4\pi} = 27, zatem R = 3 cm.
    Krok 3. Pole powierzchni kuli: S = 4\pi R^{2} = 4\pi\cdot 9 = 36\pi\ \text{cm}^{2}.
    Krok 4. Koło wielkie to przekrój płaszczyzną przechodzącą przez środek, więc ma promień R = 3 i pole P = \pi\cdot 3^{2} = 9\pi\ \text{cm}^{2}.
    Kontrola: pole sfery to dokładnie cztery pola koła wielkiego: 4\cdot 9\pi = 36\pi. Zgadza się.
    Odpowiedź: R = 3 cm, S = 36\pi\ \text{cm}^{2}, P = 9\pi\ \text{cm}^{2}.
  solution_steps:
  - Zapisz równanie \frac{4}{3}\pi R^{3} = 36\pi.
  - Wyznacz R^{3} = \frac{3\cdot 36\pi}{4\pi} = 27, czyli R = 3\ \text{cm}.
  - Oblicz S = 4\pi\cdot 3^{2} = 36\pi\ \text{cm}^{2}.
  - Oblicz pole koła wielkiego P = \pi\cdot 3^{2} = 9\pi\ \text{cm}^{2}.
  answer:
    kind: MULTIPART
    parts:
