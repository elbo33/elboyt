- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: logarytm dziesiętny
  statement: 'Oblicz logarytmy dziesiętne: a) \log 10000, b) \log 0{,}01.'
  statement_latex: \log 10000,\quad \log 0{,}01
  solution: |-
    Brak podstawy oznacza podstawę 10.
    a) \log 10000 = c \iff 10^{c}=10000=10^{4}, więc c=4.
    b) \log 0{,}01 = c \iff 10^{c}=0{,}01=10^{-2}, więc c=-2.
    Kontrola: w podpunkcie b) liczba logarytmowana jest mniejsza od 1, a podstawa większa od 1, więc wynik musi być ujemny.
  solution_steps:
  - Zauważ, że brak zapisanej podstawy oznacza podstawę 10.
  - a) 10^{c}=10^{4}, więc \log 10000 = 4.
  - b) 0{,}01 = 10^{-2}, więc \log 0{,}01 = -2.
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: NUMERIC
        value: 4.0
    - name: b
      answer:
        kind: NUMERIC
        value: -2.0
  checks:
  - kind: evaluate
    expr: \log_{10}10000
    part: a
  - kind: evaluate
    expr: \log_{10}\left(\frac{1}{100}\right)
    part: b
  skills:
  - logarytm dziesiętny
  - potęgi liczby 10
  - znak logarytmu
  verification:
