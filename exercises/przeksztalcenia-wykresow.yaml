  - 'Zbuduj funkcję pola: S(x)=2\cdot x\cdot\left(6-x\right)=-2x^2+12x, z warunków 2x>0 i 6-x>0 dziedzina
    to (0,6).'
  - Uwzględnij ograniczenie 2x\ge 8, czyli x\ge 4; rozważ x\in\langle 4,6\right).
  - Wyznacz wierzchołek paraboli x_w=3 i stwierdź, że nie należy do \langle 4,6\right), więc S jest tam
    malejąca.
  - 'Największe pole otrzymujemy dla x=4: S(4)=16 (prostokąt o wymiarach 8 i 2).'
