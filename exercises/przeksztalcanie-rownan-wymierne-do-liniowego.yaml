- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: zadanie tekstowe – równanie wymierne i rozstrzygnięcie
  statement: W pewnej grupie jest 12 osób, a średnia arytmetyczna ich wieku wynosi 30 lat. Do grupy mają
    dołączyć nowe osoby, z których każda ma dokładnie 20 lat. a) Oblicz, ile takich osób musi dołączyć
    do grupy, aby średnia wieku wszystkich osób w grupie była równa 26 lat. b) Rozstrzygnij, czy dołączając
    do tej grupy wyłącznie osoby dwudziestoletnie, można uzyskać średnią wieku grupy równą dokładnie 20
    lat. Odpowiedź uzasadnij.
  statement_latex: \frac{12\cdot 30+20\cdot n}{12+n}=26
  solution: |-
    Oznaczmy przez n liczbę dołączających osób dwudziestoletnich, n\in\{0,1,2,\ldots\}.
    Suma lat osób będących już w grupie wynosi 12\cdot 30=360, a po dołączeniu n osób suma lat to 360+20\cdot n, natomiast liczebność grupy to 12+n.
    a) Średnia ma być równa 26, więc
    \frac{360+20\cdot n}{12+n}=26.
    Dziedzina: 12+n\neq 0, czyli n\neq -12 – dla n\geq 0 warunek jest spełniony, więc mnożymy obie strony przez 12+n:
    360+20\cdot n=26\cdot\left(12+n\right)
    360+20n=312+26n
    48=6n
    n=8.
    Liczba 8 jest liczbą naturalną, więc jest to poprawna odpowiedź.
    Sprawdzenie: \frac{360+160}{20}=\frac{520}{20}=26. Zgadza się.
    b) Przypuśćmy, że po dołączeniu n osób dwudziestoletnich średnia wynosi 20:
    \frac{360+20\cdot n}{12+n}=20
    360+20n=20\cdot\left(12+n\right)
    360+20n=240+20n
    360=240.
    Niewiadoma zniknęła, a otrzymana równość jest fałszywa – równanie jest sprzeczne, nie ma rozwiązań. Zatem nie istnieje taka liczba dołączających dwudziestolatków. (Zgadza się to z intuicją: dołączanie osób w wieku 20 lat obniża średnią, ale nigdy poniżej ani do poziomu 20 lat, bo suma lat jest zawsze o 120 większa niż 20\cdot\left(12+n\right).)
    Odpowiedź: a) 8 osób; b) nie, jest to niemożliwe.
  solution_steps:
  - Wprowadź niewiadomą n – liczbę dołączających osób dwudziestoletnich (n liczba naturalna).
  - 'Zapisz sumę lat: 12\cdot 30+20\cdot n oraz liczebność grupy: 12+n.'
  - a) Ułóż równanie \frac{360+20\cdot n}{12+n}=26 i podaj założenie 12+n\neq 0.
  - 'a) Pomnóż przez 12+n, uporządkuj: 48=6n, więc n=8; sprawdź, że 8 jest liczbą naturalną.'
  - 'b) Ułóż analogiczne równanie ze średnią 20: \frac{360+20\cdot n}{12+n}=20.'
  - b) Po wymnożeniu otrzymasz 360=240 – równość fałszywa, równanie sprzeczne, więc taka średnia jest
    nieosiągalna.
  answer:
    kind: MULTIPART
    parts:
    - name: liczba_osob
      answer:
        kind: NUMERIC
        value: 8.0
