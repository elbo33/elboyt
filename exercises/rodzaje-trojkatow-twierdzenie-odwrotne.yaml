  exercise_type: klasyfikacja trójkąta z długości boków
  statement: Dany jest trójkąt o bokach długości 9, 12 i 15. Oblicz sumę kwadratów dwóch krótszych boków
    oraz kwadrat najdłuższego boku, a następnie określ rodzaj tego trójkąta (ostrokątny, prostokątny czy
    rozwartokątny).
  statement_latex: 9^{2}+12^{2} \quad\text{oraz}\quad 15^{2}
  solution: |-
    Najdłuższym bokiem jest c = 15, krótsze boki to a = 9 i b = 12. Warunek istnienia trójkąta jest spełniony, bo 9 + 12 = 21 > 15.
    Obliczamy sumę kwadratów krótszych boków: 9² + 12² = 81 + 144 = 225.
    Obliczamy kwadrat najdłuższego boku: 15² = 225.
    Ponieważ 225 = 225, czyli a² + b² = c², to na mocy twierdzenia odwrotnego do twierdzenia Pitagorasa trójkąt jest prostokątny, a kąt prosty leży naprzeciw boku długości 15. (To trójka pitagorejska (3, 4, 5) pomnożona przez 3.)
  solution_steps:
  - 'Sprawdzam warunek istnienia trójkąta: 9 + 12 = 21 > 15.'
  - 'Wskazuję najdłuższy bok: c = 15, pozostałe a = 9, b = 12.'
  - Obliczam a² + b² = 81 + 144 = 225.
  - Obliczam c² = 15² = 225.
  - 'Porównuję: 225 = 225, więc z twierdzenia odwrotnego do twierdzenia Pitagorasa trójkąt jest prostokątny.'
  answer:
