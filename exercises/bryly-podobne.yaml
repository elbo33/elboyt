  - kind: evaluate
    expr: \left(\frac{9}{6}\right)^{2}\cdot 48
    part: pole powierzchni G2
  - kind: evaluate
    expr: \left(\frac{9}{6}\right)^{3}\cdot 40
    part: objętość G2
