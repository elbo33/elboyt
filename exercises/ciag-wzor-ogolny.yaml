    Dlaczego to błąd: ciąg jest z definicji funkcją określoną na zbiorze liczb naturalnych DODATNICH \mathbb{N}_{+}=\{1,2,3,\dots\}, a w zadaniu wprost napisano „dla każdej liczby naturalnej n\geq 1”. Wyraz a_{0} po prostu nie istnieje — 0 nie jest numerem żadnego miejsca w ciągu.
