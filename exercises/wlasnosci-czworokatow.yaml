- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: rozwiązywanie trapezu równoramiennego
  statement: W trapezie równoramiennym ABCD podstawy mają długości |AB| = 14 i |CD| = 6 (AB ∥ CD), a ramiona
    |AD| = |BC| = 5. Oblicz wysokość tego trapezu, długość jego linii środkowej, cosinus kąta ostrego
    przy podstawie AB oraz długość przekątnej AC. Zapisz obliczenia.
  statement_latex: h=\sqrt{5^{2}-\left(\frac{14-6}{2}\right)^{2}},\qquad m=\frac{14+6}{2},\qquad \cos\alpha=\frac{\frac{14-6}{2}}{5},\qquad
    \left|AC\right|=\sqrt{10^{2}+3^{2}}
  solution: |-
    Spuszczamy wysokości z wierzchołków D i C na podstawę AB; ich spodki oznaczmy E i F. Ponieważ trapez jest równoramienny, dłuższa podstawa dzieli się na odcinki (14 − 6)/2 = 4, 6 oraz 4.
    Wysokość: w trójkącie prostokątnym ADE mamy przeciwprostokątną 5 i przyprostokątną 4, więc h² = 25 − 16 = 9, czyli h = 3.
    Linia środkowa: m = (14 + 6)/2 = 10.
    Kąt ostry α = |∡DAB|: cos α = |AE| / |AD| = 4/5.
    Przekątna AC: spodek wysokości z C leży w odległości 4 + 6 = 10 od punktu A, a wysokość ma długość 3, więc |AC| = √(10² + 3²) = √109 ≈ 10,44.
    Kontrola: |AC| > 10 oraz |AC| > 3 — przeciwprostokątna jest najdłuższym bokiem. ✓ (Z równoramienności także |BD| = √109.)
    Odpowiedź: h = 3, m = 10, cos α = 4/5, |AC| = √109.
  solution_steps:
  - Poprowadź wysokości z C i D na AB; skrajne odcinki mają długość (14 − 6)/2 = 4.
  - 'Z twierdzenia Pitagorasa: h = √(5² − 4²) = 3.'
  - 'Linia środkowa: m = (14 + 6)/2 = 10.'
  - 'Cosinus kąta ostrego: cos α = 4/5.'
  - 'Przekątna AC jako przeciwprostokątna trójkąta o przyprostokątnych 10 i 3: |AC| = √109.'
  answer:
    kind: MULTIPART
    parts:
    - name: wysokosc
      answer:
        kind: NUMERIC
        value: 3.0
    - name: linia srodkowa
      answer:
        kind: NUMERIC
        value: 10.0
    - name: cosinus kata
      answer:
        kind: SYMBOLIC
        latex: \frac{4}{5}
    - name: przekatna AC
      answer:
        kind: SYMBOLIC
        latex: \sqrt{109}
  checks:
  - kind: evaluate
    expr: \sqrt{5^{2}-\left(\frac{14-6}{2}\right)^{2}}
    part: wysokosc
  - kind: evaluate
    expr: \frac{14+6}{2}
    part: linia srodkowa
  - kind: evaluate
    expr: \frac{\frac{14-6}{2}}{5}
    part: cosinus kata
  - kind: evaluate
    expr: \sqrt{\left(6+\frac{14-6}{2}\right)^{2}+\left(\sqrt{5^{2}-4^{2}}\right)^{2}}
    part: przekatna AC
  skills:
  - wysokość trapezu równoramiennego
  - linia środkowa trapezu
  - przekątna trapezu
  - trygonometria kąta ostrego
  verification:
    checkability: DETERMINISTIC
    note: 'all 4 parts solved fresh · det: [wysokosc] SymPy solved it fresh: 3.0 vs 3.0 (tol 1e-09) ;
      [linia srodkowa] SymPy solved it fresh: 10.0 vs 10.0 (tol 1e-09) ; [cosinus kata] SymPy solved it
      fresh: 0.8 vs 0.8 (tol 1e-09) ; [przekatna AC] SymPy solved it fresh: 10.44030650891055 vs 10.44030650891055
      (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: angle chasing w trapezie z przekątną
  statement: W trapezie ABCD (AB ∥ CD, AB jest dłuższą podstawą) przekątna BD dzieli kąt przy wierzchołku
    B na dwa kąty równe. Wiadomo, że |∡DAB| = 100° oraz |∡ABC| = 76°. Oblicz miary kątów ∡ADC i ∡BCD,
    wyznacz miary kątów trójkąta ABD oraz trójkąta BCD, a następnie uzasadnij, że |CB| = |CD|.
  statement_latex: \left|\measuredangle ADC\right| = 180^\circ - 100^\circ,\qquad \left|\measuredangle
    DBC\right| = \frac{76^\circ}{2}
  solution: |-
    Krok 1. Kąty przy ramieniu AD sumują się do 180°: |∡ADC| = 180° − 100° = 80°.
    Kąty przy ramieniu BC: |∡BCD| = 180° − 76° = 104°.
    Kontrola: 100° + 76° + 104° + 80° = 360°. ✓
    Krok 2. BD jest dwusieczną kąta B, więc |∡ABD| = |∡DBC| = 76°/2 = 38°.
    Krok 3. W trójkącie ABD: |∡ADB| = 180° − 100° − 38° = 42°. Kąty trójkąta ABD to 100°, 38°, 42°.
    Krok 4. AB ∥ CD, a BD jest sieczną, więc kąty ∡ABD i ∡BDC są naprzemianległe wewnętrzne: |∡BDC| = 38°.
    Kąty trójkąta BCD: |∡DBC| = 38°, |∡BDC| = 38°, |∡BCD| = 104°; suma 180°. ✓
    Kontrola: |∡ADC| = |∡ADB| + |∡BDC| = 42° + 38° = 80°. ✓
    Krok 5. W trójkącie BCD dwa kąty są równe (po 38°), więc trójkąt ten jest równoramienny; naprzeciw kąta ∡DBC leży bok CD, a naprzeciw kąta ∡BDC leży bok CB, zatem |CB| = |CD|.
  solution_steps:
  - 'Z warunku dla kątów przy ramieniu AD: |∡ADC| = 180° − 100° = 80°.'
  - 'Z warunku dla kątów przy ramieniu BC: |∡BCD| = 180° − 76° = 104°.'
  - 'Z dwusiecznej: |∡ABD| = |∡DBC| = 38°.'
  - 'W trójkącie ABD: |∡ADB| = 180° − 100° − 38° = 42°.'
  - 'Z kątów naprzemianległych przy AB ∥ CD: |∡BDC| = |∡ABD| = 38°; kąty trójkąta BCD to 38°, 38°, 104°.'
  - Trójkąt BCD ma dwa kąty równe, więc jest równoramienny, skąd |CB| = |CD|.
  answer:
    kind: MULTIPART
    parts:
    - name: kat ADC
      answer:
        kind: NUMERIC
        value: 80.0
    - name: kat BCD
      answer:
        kind: NUMERIC
        value: 104.0
    - name: kat ADB
      answer:
        kind: NUMERIC
        value: 42.0
    - name: katy trojkata ABD
      answer:
        kind: TUPLE
        items:
        - '100'
        - '38'
        - '42'
    - name: katy trojkata BCD
      answer:
        kind: TUPLE
        items:
        - '38'
        - '38'
        - '104'
    - name: uzasadnienie CB = CD
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: 'Należy wykazać, że |∡BDC| = |∡ABD| = 38° (kąty naprzemianległe przy AB ∥ CD), zatem trójkąt
          BCD ma dwa kąty po 38°, jest równoramienny i boki leżące naprzeciw tych kątów są równe: |CB|
          = |CD|.'
  checks:
  - kind: evaluate
    expr: 180 - 100
    part: kat ADC
  - kind: evaluate
    expr: 180 - 76
    part: kat BCD
  - kind: evaluate
    expr: 180 - 100 - \frac{76}{2}
    part: kat ADB
  skills:
  - kąty przy ramieniu trapezu
  - kąty naprzemianległe przy przekątnej
  - suma kątów trójkąta
  - rozpoznawanie trójkąta równoramiennego
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie CB = CD · 3/5 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: obliczeniowe (rozwiązywanie trapezu przez dorysowanie wysokości)
  statement: W trapezie równoramiennym ABCD podstawy AB i CD są równoległe, przy czym |AB| = 14, |CD|
    = 4, a ramiona mają długości |AD| = |BC| = 13. Oblicz wysokość tego trapezu, długość przekątnej AC
    oraz sinus kąta ostrego przy podstawie AB. Zapisz obliczenia.
  statement_latex: '|AB|=14,\quad |CD|=4,\quad |AD|=|BC|=13,\quad h^{2}+\left(\frac{14-4}{2}\right)^{2}=13^{2}'
  solution: |-
    Prowadzimy wysokości z wierzchołków D i C na podstawę AB; ich spodki oznaczmy odpowiednio E i F. Ponieważ trapez jest równoramienny, odcinki skrajne mają równe długości:
    |AE| = |FB| = \frac{|AB|-|CD|}{2} = \frac{14-4}{2} = 5, a odcinek środkowy |EF| = |CD| = 4.

    Wysokość. W trójkącie prostokątnym AED o przeciwprostokątnej |AD| = 13 i przyprostokątnej |AE| = 5 mamy
    h^{2} = 13^{2} - 5^{2} = 169 - 25 = 144, więc h = 12.

    Przekątna AC. Spodek F wysokości poprowadzonej z C leży w odległości |AF| = |AE| + |EF| = 5 + 4 = 9 od punktu A. W trójkącie prostokątnym AFC o przyprostokątnych 9 i 12 otrzymujemy
    |AC| = \sqrt{9^{2}+12^{2}} = \sqrt{81+144} = \sqrt{225} = 15.
    (Ponieważ trapez jest równoramienny, także |BD| = 15.)

    Sinus kąta ostrego. Kąt ostry przy podstawie AB to kąt DAE w trójkącie prostokątnym AED, więc
    \sin\alpha = \frac{h}{|AD|} = \frac{12}{13}.

    Kontrola: 12 < 13 oraz 15 > 12 i 15 > 9 — przekątna jest dłuższa od każdej z przyprostokątnych. ✓

    Odpowiedź: h = 12, |AC| = 15, \sin\alpha = \frac{12}{13} (czyli \alpha \approx 67^{\circ}).
  solution_steps:
  - 'Poprowadź wysokości z D i C na AB i oblicz odcinki skrajne: (14 − 4)/2 = 5.'
  - 'Z twierdzenia Pitagorasa: h² = 13² − 5² = 144, więc h = 12.'
  - Zauważ, że spodek wysokości z C leży w odległości 5 + 4 = 9 od A.
  - 'Oblicz przekątną: |AC| = √(9² + 12²) = 15.'
  - 'Oblicz sin kąta ostrego przy AB: sin α = 12/13.'
  answer:
    kind: MULTIPART
    parts:
    - name: wysokosc
      answer:
        kind: NUMERIC
        value: 12.0
    - name: AC
      answer:
        kind: NUMERIC
        value: 15.0
    - name: sin_alfa
      answer:
        kind: SYMBOLIC
        latex: \frac{12}{13}
  checks:
  - kind: evaluate
    expr: \sqrt{13^{2}-\left(\frac{14-4}{2}\right)^{2}}
    part: wysokosc
  - kind: evaluate
    expr: \sqrt{\left(4+\frac{14-4}{2}\right)^{2}+\left(\sqrt{13^{2}-5^{2}}\right)^{2}}
    part: AC
  - kind: evaluate
    expr: \frac{\sqrt{13^{2}-5^{2}}}{13}
    part: sin_alfa
  skills:
  - rzuty ramion na dłuższą podstawę trapezu równoramiennego
  - twierdzenie Pitagorasa
  - długość przekątnej trapezu
  - funkcje trygonometryczne kąta ostrego
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [wysokosc] SymPy solved it fresh: 12.0 vs 12.0 (tol 1e-09)
      ; [AC] SymPy solved it fresh: 15.0 vs 15.0 (tol 1e-09) ; [sin_alfa] SymPy solved it fresh: 0.9230769230769231
      vs 0.9230769230769231 (tol 1e-09)'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: obliczeniowe (przekątne rombu)
  statement: W rombie ABCD przekątne AC i BD przecinają się w punkcie S, przy czym |AC| = 24 oraz |BD|
    = 10. Oblicz długość boku rombu, jego pole, tangens kąta SAB (czyli kąta między przekątną AC a bokiem
    AB) oraz wysokość tego rombu. Zapisz obliczenia.
  statement_latex: \left(\frac{24}{2}\right)^{2}+\left(\frac{10}{2}\right)^{2}=a^{2},\qquad P=\frac{1}{2}\cdot
    24\cdot 10,\qquad \operatorname{tg}\left|\measuredangle SAB\right|=\frac{\frac{10}{2}}{\frac{24}{2}}
  solution: |-
    Przekątne rombu są prostopadłe i dzielą się na połowy, więc |AS| = \frac{24}{2} = 12 oraz |BS| = \frac{10}{2} = 5, a trójkąt ABS jest prostokątny o kącie prostym przy S.

    Bok rombu. Z twierdzenia Pitagorasa:
    a^{2} = 12^{2}+5^{2} = 144+25 = 169, więc a = |AB| = 13.

    Pole. Przekątne są prostopadłe, więc wolno użyć wzoru
    P = \frac{1}{2}\cdot 24\cdot 10 = 120.

