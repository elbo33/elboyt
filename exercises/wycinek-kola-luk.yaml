    expr: \frac{120}{360}\cdot\left(\pi\cdot 9^{2}-\pi\cdot 3^{2}\right)
    part: pole
  - kind: evaluate
    expr: \frac{120}{360}\cdot 2\cdot\pi\cdot 9+\frac{120}{360}\cdot 2\cdot\pi\cdot 3+2\cdot\left(9-3\right)
    part: obwod
  skills:
