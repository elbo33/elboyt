- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: wyznaczanie dziedziny równania wymiernego
  statement: Dane jest równanie \[\frac{x+4}{x-5}+\frac{3}{2\cdot x+1}=7.\] Wypisz wszystkie liczby rzeczywiste,
    które nie należą do dziedziny tego równania.
  statement_latex: \frac{x+4}{x-5}+\frac{3}{2\cdot x+1}=7
  solution: |-
    W równaniu występują dwa mianowniki: x-5 oraz 2x+1. Dziedzinę ustalamy przed jakimikolwiek przekształceniami: każdy mianownik musi być różny od zera.
    Z warunku x-5 \neq 0 otrzymujemy x \neq 5.
    Z warunku 2x+1 \neq 0 otrzymujemy 2x \neq -1, czyli x \neq -\frac{1}{2}.
    Zatem D = \mathbb{R}\setminus\left\{-\frac{1}{2},\,5\right\}, a liczbami wykluczonymi z dziedziny są 5 oraz -\frac{1}{2}.
  solution_steps:
  - 'Wypisz wszystkie mianowniki: x-5 oraz 2x+1.'
  - 'Przyrównaj każdy mianownik do zera: x-5=0 oraz 2x+1=0.'
  - 'Rozwiąż: x=5 oraz x=-\frac{1}{2}.'
  - 'Zapisz odpowiedź: z dziedziny wykluczamy liczby 5 i -\frac{1}{2}, czyli D=\mathbb{R}\setminus\left\{-\frac{1}{2},5\right\}.'
  answer:
    kind: SET
    members:
    - '5'
    - -\frac{1}{2}
  checks:
  - kind: solve_equation
    expr: \left(x-5\right)\cdot\left(2\cdot x+1\right)=0
  skills:
  - wyznaczanie dziedziny wyrażenia wymiernego
  - zapisywanie założeń
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 2 members matched'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 1
  difficulty: 2
  exercise_type: równanie wymierne (proporcja)
  statement: Rozwiąż równanie \[\frac{2\cdot x-1}{x+4}=3.\]
  statement_latex: \frac{2\cdot x-1}{x+4}=3
  solution: |-
    Dziedzina: x+4 \neq 0, czyli x \neq -4, D=\mathbb{R}\setminus\{-4\}.
    W dziedzinie mnożymy obie strony przez x+4 (wyrażenie różne od zera, więc przekształcenie jest równoważne):
    2x-1 = 3\cdot\left(x+4\right)
    2x-1 = 3x+12
    2x-3x = 12+1
    -x = 13
    x = -13.
    Liczba -13 należy do dziedziny (-13 \neq -4).
    Sprawdzenie: \frac{2\cdot(-13)-1}{-13+4}=\frac{-27}{-9}=3. ✓
    Odpowiedź: x=-13.
  solution_steps:
  - 'Zapisz założenie: x+4\neq 0, czyli x\neq -4.'
  - 'Pomnóż obie strony przez x+4: 2x-1=3\cdot\left(x+4\right).'
  - 'Wymnóż nawias: 2x-1=3x+12.'
  - 'Uporządkuj: -x=13, stąd x=-13.'
  - Sprawdź przynależność do dziedziny i podstaw do równania wyjściowego.
  answer:
    kind: NUMERIC
    value: -13.0
  checks:
  - kind: solve_equation
    expr: \frac{2\cdot x-1}{x+4}=3
  skills:
  - mnożenie na krzyż
  - rozwiązywanie równania liniowego
  - konfrontacja wyniku z dziedziną
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: -13.0 vs -13.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 1
  exercise_type: nierówność liniowa
  statement: Rozwiąż nierówność \[-4\cdot x+3>11\] i zapisz zbiór jej rozwiązań w postaci przedziału.
  statement_latex: -4\cdot x+3>11
  solution: |-
    Odejmujemy 3 od obu stron (przekształcenie równoważne, znak bez zmian):
    -4x > 8.
    Dzielimy obie strony przez -4. Jest to liczba ujemna, więc ZMIENIAMY zwrot nierówności:
    x < -2.
    Zbiór rozwiązań: x \in \left(-\infty,-2\right).
    Kontrola: dla x=-3 mamy -4\cdot(-3)+3=15>11 (prawda), dla x=0 mamy 3>11 (fałsz).
  solution_steps:
  - 'Odejmij 3 od obu stron: -4x>8.'
  - 'Podziel obie strony przez -4 i odwróć zwrot nierówności: x<-2.'
  - 'Zapisz zbiór rozwiązań: x\in\left(-\infty,-2\right).'
  - Sprawdź liczbą z wnętrza przedziału i liczbą spoza niego.
  answer:
    kind: INTERVAL
    hi: '-2'
  checks:
  - kind: solve_inequality
    expr: -4\cdot x+3>11
  skills:
  - przekształcenia równoważne nierówności
  - zmiana zwrotu przy dzieleniu przez liczbę ujemną
  - zapis zbioru rozwiązań w postaci przedziału
  verification:
