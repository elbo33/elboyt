    H = 20 - 2r.
    Krok 2. Pole przekroju osiowego:
    P\left(r\right) = 2r\cdot H = 2r\cdot\left(20 - 2r\right) = 40r - 4r^{2}.
    Krok 3. Dziedzina. Musi być r > 0 oraz H > 0, czyli 20 - 2r > 0, więc r < 10. Ponadto z warunku zadania H \leq 8, czyli 20 - 2r \leq 8, skąd r \geq 6. Ostatecznie r \in \left\langle 6;10\right).
    Krok 4. Funkcja P\left(r\right) = -4r^{2} + 40r ma wierzchołek dla r_{w} = \frac{-40}{2\cdot\left(-4\right)} = 5, a 5 \notin \left\langle 6;10\right). Dla r > 5 funkcja jest malejąca, więc na przedziale \left\langle 6;10\right) największą wartość przyjmuje dla r = 6:
    P\left(6\right) = 40\cdot 6 - 4\cdot 6^{2} = 240 - 144 = 96.
    Krok 5. Dla r = 6 mamy H = 20 - 2\cdot 6 = 8 (warunek H \leq 8 spełniony), więc
    V = \pi r^{2}H = \pi\cdot 36\cdot 8 = 288\pi \approx 904{,}8.
    Odp. a) P\left(r\right) = 40r - 4r^{2}, r \in \left\langle 6;10\right); b) największe pole przekroju osiowego wynosi 96, a objętość odpowiadającego walca to 288\pi.
  solution_steps:
