- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: wypisywanie początkowych wyrazów ciągu
  statement: Ciąg \left(a_{n}\right) jest określony wzorem a_{n}=\left(-1\right)^{n}\cdot\left(2\cdot
    n+1\right) dla każdej liczby naturalnej n\geq 1. Wypisz trzy początkowe wyrazy tego ciągu.
  statement_latex: a_{n}=\left(-1\right)^{n}\cdot\left(2\cdot n+1\right),\qquad n\geq 1
  solution: |-
    Podstawiamy kolejno n=1, n=2, n=3.
    n=1: \left(-1\right)^{1}=-1 oraz 2\cdot 1+1=3, więc a_{1}=-1\cdot 3=-3.
    n=2: \left(-1\right)^{2}=1 oraz 2\cdot 2+1=5, więc a_{2}=1\cdot 5=5.
    n=3: \left(-1\right)^{3}=-1 oraz 2\cdot 3+1=7, więc a_{3}=-1\cdot 7=-7.
    Odpowiedź: -3,\ 5,\ -7. Wyrazy o indeksach nieparzystych są ujemne, a o parzystych dodatnie — tak działa czynnik \left(-1\right)^{n}.
  solution_steps:
  - Ustal, że ciąg zaczyna się od n=1.
  - 'Podstaw n=1: a_{1}=\left(-1\right)^{1}\cdot 3=-3.'
  - 'Podstaw n=2: a_{2}=\left(-1\right)^{2}\cdot 5=5.'
  - 'Podstaw n=3: a_{3}=\left(-1\right)^{3}\cdot 7=-7.'
  - 'Zapisz wyrazy w kolejności: -3, 5, -7.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_1
      answer:
        kind: NUMERIC
        value: -3.0
    - name: a_2
      answer:
        kind: NUMERIC
        value: 5.0
    - name: a_3
      answer:
        kind: NUMERIC
        value: -7.0
  checks:
  - kind: evaluate
    expr: \left(-1\right)^{1}\cdot\left(2\cdot 1+1\right)
    var: n
    part: a_1
  - kind: evaluate
    expr: \left(-1\right)^{2}\cdot\left(2\cdot 2+1\right)
    var: n
    part: a_2
  - kind: evaluate
    expr: \left(-1\right)^{3}\cdot\left(2\cdot 3+1\right)
    var: n
