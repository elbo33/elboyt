  - 'Wskaż błąd: symetria względem OY zmienia znak cosinusa, więc \cos\left(180^{\circ}-\alpha\right)=-\cos\alpha.'
  - 'Popraw: \cos 150^{\circ}=-\frac{\sqrt{3}}{2}, \sin 150^{\circ}=\frac{1}{2}.'
