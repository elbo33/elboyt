section: zastosowania-funkcji-optymalizacja
name: Zastosowania funkcji liniowej i kwadratowej; optymalizacja
scope: Using linear and quadratic functions to interpret geometric, physical and everyday problems; optimisation
  reducible to a quadratic - expressing the quantity as a quadratic function of one variable under constraints
  and reading the extremum.
requirements:
- V.11
- XIII.1
