- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: trójkąt przecięty prostą równoległą do boku
  statement: W trójkącie ABC pole jest równe 63 cm², a bok AB ma długość 15 cm. Punkt D leży na boku CA,
    a punkt E leży na boku CB, przy czym odcinek DE jest równoległy do boku AB i ma długość 10 cm. a)
    Uzasadnij, że trójkąty CDE i CAB są podobne. b) Oblicz pole trójkąta CDE. c) Oblicz pole trapezu ABED.
    Zapisz obliczenia.
  statement_latex: k=\frac{DE}{AB}=\frac{10}{15},\qquad P_{CDE}=k^{2}\cdot 63,\qquad P_{ABED}=63-k^{2}\cdot
    63
  solution: |-
    a) Kąt przy wierzchołku C jest wspólny dla trójkątów CDE i CAB. Ponadto DE ∥ AB, więc kąt CDE jest równy kątowi CAB jako kąty odpowiadające przy prostych równoległych DE i AB przeciętych prostą CA. Dwa kąty trójkąta CDE są odpowiednio równe dwóm kątom trójkąta CAB, zatem na mocy cechy (kk) trójkąty CDE i CAB są podobne.
    b) Boki DE i AB są bokami odpowiadającymi sobie, więc skala podobieństwa trójkąta CDE do trójkąta CAB wynosi k = \frac{10}{15} = \frac{2}{3}.
    Stąd P(CDE) = k^{2}\cdot P(CAB) = \frac{4}{9}\cdot 63 = 28 cm².
    c) Trapez ABED jest różnicą trójkąta CAB i trójkąta CDE, więc P(ABED) = 63 − 28 = 35 cm².
    Odpowiedź: P(CDE) = 28 cm², P(ABED) = 35 cm².
  solution_steps:
  - Wskaż kąt wspólny przy wierzchołku C oraz równe kąty odpowiadające przy DE ∥ AB — cecha (kk).
  - Wyznacz skalę k = DE/AB = 10/15 = 2/3.
  - Oblicz pole trójkąta CDE = (2/3)²·63 = 28 cm².
  - Oblicz pole trapezu ABED = 63 − 28 = 35 cm².
  answer:
    kind: MULTIPART
    parts:
    - name: uzasadnienie_podobienstwa
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń musi wskazać kąt wspólny przy wierzchołku C oraz równość kątów CDE i CAB jako kątów
          odpowiadających przy prostych równoległych DE ∥ AB i powołać się na cechę (kk) podobieństwa
          trójkątów.
    - name: pole_CDE
      answer:
        kind: NUMERIC
        value: 28.0
        latex: 28\ \text{cm}^{2}
    - name: pole_trapezu
      answer:
        kind: NUMERIC
        value: 35.0
        latex: 35\ \text{cm}^{2}
  checks:
  - kind: evaluate
    expr: \left(\frac{10}{15}\right)^{2}\cdot 63
    part: pole_CDE
  - kind: evaluate
    expr: 63-\left(\frac{10}{15}\right)^{2}\cdot 63
    part: pole_trapezu
  skills:
  - uzasadnianie podobieństwa cechą kk
  - stosunek pól trójkątów podobnych
  - pole trapezu jako różnica pól
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie_podobienstwa · 2/2 other parts solved fresh'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: stosunek obwodów i suma pól (metoda parametru)
  statement: 'Obwody dwóch podobnych wielokątów są w stosunku 4 : 7, a suma ich pól jest równa 260 cm².
    Oblicz pole każdego z tych wielokątów. Zapisz obliczenia.'
  statement_latex: k=\frac{7}{4},\quad k^{2}=\frac{49}{16},\quad 16t+49t=260
  solution: |-
    Stosunek obwodów figur podobnych jest równy skali podobieństwa, więc (od mniejszego wielokąta do większego) k = \frac{7}{4}.
    Stosunek pól jest równy k^{2} = \frac{49}{16}, czyli P_{mniejsze} : P_{większe} = 16 : 49.
    Wprowadzamy parametr t > 0: P_{mniejsze} = 16t, P_{większe} = 49t.
    Z warunku na sumę pól: 16t + 49t = 260, czyli 65t = 260, więc t = 4.
    Stąd P_{mniejsze} = 16\cdot 4 = 64 cm², P_{większe} = 49\cdot 4 = 196 cm².
    Sprawdzenie: 64 + 196 = 260 oraz \frac{64}{196} = \frac{16}{49} = \left(\frac{4}{7}\right)^{2}. Zgadza się.
    Odpowiedź: 64 cm² i 196 cm².
  solution_steps:
  - 'Odczytaj skalę ze stosunku obwodów: k = 7/4.'
  - 'Oblicz stosunek pól: k² = 49/16, czyli pola mają się jak 16 : 49.'
  - Zapisz pola jako 16t i 49t.
  - Ułóż i rozwiąż równanie 16t + 49t = 260, skąd t = 4.
  - 'Podaj pola: 64 cm² i 196 cm²; sprawdź sumę i stosunek.'
  answer:
    kind: MULTIPART
    parts:
    - name: pole_mniejszego
      answer:
        kind: NUMERIC
        value: 64.0
        latex: 64\ \text{cm}^{2}
    - name: pole_wiekszego
      answer:
        kind: NUMERIC
        value: 196.0
        latex: 196\ \text{cm}^{2}
  checks:
  - kind: evaluate
    expr: 16\cdot\frac{260}{16+49}
    var: t
    part: pole_mniejszego
  - kind: evaluate
    expr: 49\cdot\frac{260}{16+49}
    var: t
    part: pole_wiekszego
  skills:
  - przejście od stosunku obwodów do stosunku pól
  - metoda parametru t
  - rozwiązywanie równania liniowego
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [pole_mniejszego] SymPy solved it fresh: 64.0 vs 64.0 (tol
