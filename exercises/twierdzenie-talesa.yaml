  statement: 'W trójkącie ABC punkt D leży na boku AB, a punkt E na boku AC, przy czym |AD| = 4, |DB|
    = 5, |AE| = 6 oraz |EC| = 8. W treści zadania nie ma informacji o równoległości. Uczeń napisał: „odcinek
    DE wygląda na równoległy do BC, więc z twierdzenia Talesa \frac{4}{5}=\frac{6}{|EC|}, skąd |EC| =
