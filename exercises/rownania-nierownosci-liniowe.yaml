    note: '[whole] SymPy solved it fresh: endpoints matched'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: nierówność liniowa z nawiasami
  statement: Rozwiąż nierówność \(4\left(x - 2\right) - 3 \geq 2\left(x + 1\right) + 5\). Zbiór wszystkich
    rozwiązań zapisz w postaci przedziału oraz podaj najmniejszą liczbę całkowitą, która tę nierówność
    spełnia.
  statement_latex: 4\cdot\left(x - 2\right) - 3 \geq 2\cdot\left(x + 1\right) + 5
  solution: |-
    Usuwamy nawiasy po obu stronach: 4x − 8 − 3 ≥ 2x + 2 + 5, czyli 4x − 11 ≥ 2x + 7.
    Grupujemy wyrazy z niewiadomą po lewej stronie, a liczby po prawej: 4x − 2x ≥ 7 + 11, czyli 2x ≥ 18.
    Dzielimy obie strony przez 2 (liczba dodatnia, znak bez zmian): x ≥ 9.
    Zbiór rozwiązań: ⟨9, +∞). Kraniec 9 należy do zbioru, bo nierówność jest nieostra, więc najmniejsza liczba całkowita spełniająca nierówność to 9.
    Sprawdzenie: dla x = 9 mamy L = 4·7 − 3 = 25, P = 2·10 + 5 = 25, więc 25 ≥ 25 ✓.
  solution_steps:
  - 'Usuń nawiasy: 4x − 8 − 3 ≥ 2x + 2 + 5.'
  - 'Zredukuj wyrazy podobne: 4x − 11 ≥ 2x + 7.'
  - 'Zgrupuj wyrazy: 2x ≥ 18.'
  - 'Podziel przez 2: x ≥ 9.'
  - 'Zapisz przedział ⟨9, +∞) i odczytaj najmniejszą liczbę całkowitą: 9.'
  answer:
    kind: MULTIPART
    parts:
    - name: zbiór rozwiązań
      answer:
        kind: INTERVAL
        lo: '9'
        hi: +\infty
        lo_open: false
    - name: najmniejsza liczba całkowita
      answer:
        kind: NUMERIC
        value: 9.0
  checks:
