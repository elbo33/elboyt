  exercise_type: 'zadanie wieloczęściowe: ułożenie równania z dwoma modułami, metoda przedziałów, wnioski'
  statement: Na osi liczbowej dane są punkty A o współrzędnej \left(-6\right) oraz B o współrzędnej 10.
    Punkt P o współrzędnej x leży na tej osi, a suma jego odległości od punktu A i od punktu B jest równa
    24. a) Zapisz warunek zadania w postaci równania z wartościami bezwzględnymi i wyznacz wszystkie możliwe
    współrzędne punktu P. b) Oblicz długość odcinka o końcach w znalezionych punktach oraz współrzędną
    środka tego odcinka. c) Uzasadnij, że żaden punkt należący do odcinka AB nie spełnia warunku zadania.
  statement_latex: \left|x+6\right| + \left|x-10\right| = 24
  solution: |-
    a) Odległości punktu P od A i od B to \left|x-\left(-6\right)\right| = \left|x+6\right| oraz \left|x-10\right|. Warunek zadania:
    \left|x+6\right| + \left|x-10\right| = 24.
    Miejsca zerowe wyrażeń pod modułami: x = -6 i x = 10 — dzielą oś na trzy przedziały.

    Przypadek 1: x < -6. Wtedy x+6 < 0 i x-10 < 0, więc -\left(x+6\right) - \left(x-10\right) = 24, czyli -2x+4 = 24, stąd -2x = 20, x = -10. Liczba -10 należy do przedziału \left(-\infty,-6\right), więc jest rozwiązaniem.
    Przypadek 2: -6 \le x \le 10. Wtedy x+6 \ge 0 i x-10 \le 0, więc \left(x+6\right) - \left(x-10\right) = 16, czyli 16 = 24 — sprzeczność, brak rozwiązań.
    Przypadek 3: x > 10. Wtedy \left(x+6\right) + \left(x-10\right) = 24, czyli 2x-4 = 24, stąd x = 14. Liczba 14 należy do przedziału \left(10,+\infty\right), więc jest rozwiązaniem.

    Sprawdzenie: dla x = -10: \left|-10+6\right| + \left|-10-10\right| = 4+20 = 24 ✓; dla x = 14: \left|14+6\right| + \left|14-10\right| = 20+4 = 24 ✓.

    b) Długość odcinka o końcach -10 i 14 wynosi \left|14-\left(-10\right)\right| = 24, a współrzędna jego środka to \frac{-10+14}{2} = 2. (Środek odcinka AB też ma współrzędną \frac{-6+10}{2} = 2, więc oba odcinki mają wspólny środek.)

    c) Jeżeli punkt P należy do odcinka AB, to -6 \le x \le 10 i wtedy \left|x+6\right| + \left|x-10\right| = \left(x+6\right) + \left(10-x\right) = 16, niezależnie od x. Ponieważ 16 \ne 24, żaden punkt odcinka AB nie spełnia warunku zadania (dla punktów odcinka suma odległości jest zawsze równa długości AB, czyli 16).

    Odpowiedź: a) \left|x+6\right| + \left|x-10\right| = 24, x = -10 lub x = 14; b) długość 24, środek o współrzędnej 2.
  solution_steps:
