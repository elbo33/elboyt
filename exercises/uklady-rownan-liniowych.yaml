    Dziedzina: \(a = 2 \in \{1,\ldots,9\}\), \(b = 4 \in \{0,\ldots,9\}\) — cyfry poprawne.
    Szukana liczba to \(10\cdot 2 + 4 = 24\).
    Sprawdzenie w treści: suma cyfr \(2 + 4 = 6\) i \(4\cdot 6 = 24\) ✓; \(24 + 18 = 42\), a 42 to liczba 24 zapisana od tyłu ✓.
    Odpowiedź: szukana liczba dwucyfrowa to 24.
