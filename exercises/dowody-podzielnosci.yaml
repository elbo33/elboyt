    domain_hi_open: false
    constraint_used: 2\cdot b=a+c,\ a\in\{1,\ldots,9\},\ b,c\in\{0,\ldots,9\},\ cyfry\ parami\ różne,\
      9\mid N
  skills:
  - zapis dziesiętny liczby trzycyfrowej
