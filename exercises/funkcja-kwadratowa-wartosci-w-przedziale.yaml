- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: obliczenie wierzchołka i sprawdzenie przynależności do przedziału
  statement: Dana jest funkcja kwadratowa f określona wzorem f\left(x\right)=2x^2-8x+3. Oblicz pierwszą
    współrzędną p wierzchołka paraboli będącej wykresem tej funkcji i rozstrzygnij, czy p należy do przedziału
    \langle 0,3\rangle.
  statement_latex: f\left(x\right)=2x^2-8x+3,\qquad p=-\frac{b}{2\cdot a},\qquad \langle 0,3\rangle
  solution: |-
    Ze wzoru funkcji odczytujemy a=2, b=-8, c=3.
    Pierwsza współrzędna wierzchołka: p=-\frac{b}{2\cdot a}=-\frac{-8}{2\cdot 2}=\frac{8}{4}=2.
    Sprawdzamy przynależność: 0\le 2\le 3, więc p=2 należy do przedziału \langle 0,3\rangle.
    Odpowiedź: p=2 i p\in\langle 0,3\rangle.
  solution_steps:
  - 'Odczytaj współczynniki: a=2, b=-8.'
  - Podstaw do wzoru p=-\frac{b}{2\cdot a}=-\frac{-8}{2\cdot 2}=2.
  - Sprawdź nierówności 0\le 2\le 3 – są spełnione.
  - 'Zapisz odpowiedź: p=2, wierzchołek należy do przedziału.'
  answer:
    kind: MULTIPART
    parts:
    - name: p
      answer:
        kind: NUMERIC
        value: 2.0
    - name: czy p należy do przedziału
      answer:
        kind: BOOLEAN
        truth: true
  checks:
  - kind: evaluate
    expr: -\frac{-8}{2\cdot 2}
    part: p
  skills:
  - wyznaczanie pierwszej współrzędnej wierzchołka
  - sprawdzanie przynależności do przedziału domkniętego
  verification:
    checkability: REFERENCE_CALL
    note: '2 parts matched · det: [p] SymPy solved it fresh: 2.0 vs 2.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: odczyt wartości ekstremalnej z postaci kanonicznej
  statement: Funkcja kwadratowa f jest określona wzorem f\left(x\right)=-\left(x-2\right)^2+7. Podaj wartość
    największą tej funkcji w przedziale \langle 0,5\rangle oraz argument, dla którego jest ona przyjmowana.
  statement_latex: f\left(x\right)=-\left(x-2\right)^2+7,\qquad x\in\langle 0,5\rangle
  solution: |-
    Z postaci kanonicznej odczytujemy a=-1<0 oraz wierzchołek W=\left(2,7\right), czyli p=2, q=7.
    Ponieważ a<0, ramiona paraboli są skierowane w dół, więc w wierzchołku funkcja przyjmuje wartość największą.
    Sprawdzamy, czy p należy do przedziału: 0\le 2\le 5, więc tak.
    Zatem wartość największa w \langle 0,5\rangle wynosi f\left(2\right)=-\left(2-2\right)^2+7=7 i jest przyjmowana dla x=2.
  solution_steps:
  - Odczytaj z postaci kanonicznej a=-1 oraz W=\left(2,7\right).
  - Stwierdź, że a<0, więc w wierzchołku jest wartość największa.
  - Sprawdź, że p=2\in\langle 0,5\rangle.
  - 'Zapisz: wartość największa równa 7, przyjmowana dla x=2.'
  answer:
    kind: MULTIPART
    parts:
    - name: wartość największa
      answer:
        kind: NUMERIC
        value: 7.0
    - name: argument
      answer:
        kind: NUMERIC
        value: 2.0
  checks:
  - kind: evaluate
    expr: -\left(2-2\right)^2+7
    part: wartość największa
  skills:
  - odczytywanie wierzchołka z postaci kanonicznej
  - wskazanie wartości największej przy a<0
  verification:
    checkability: REFERENCE_CALL
    note: '2 parts matched · det: [wartość największa] SymPy solved it fresh: 7.0 vs 7.0 (tol 1e-09)'
- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: wartości skrajne przy wierzchołku poza przedziałem
  statement: Dana jest funkcja f\left(x\right)=x^2+2x-3. Wykaż, że pierwsza współrzędna wierzchołka nie
    należy do przedziału \langle 2,5\rangle, a następnie oblicz wartość najmniejszą i wartość największą
    funkcji f w tym przedziale.
  statement_latex: f\left(x\right)=x^2+2x-3,\qquad x\in\langle 2,5\rangle
  solution: |-
    a=1>0, b=2, więc p=-\frac{2}{2\cdot 1}=-1.
    Liczba -1 nie spełnia warunku 2\le x\le 5, zatem p\notin\langle 2,5\rangle i wierzchołek leży na lewo od przedziału.
    Dla a>0 funkcja rośnie w przedziale \langle p,+\infty\rangle=\langle -1,+\infty\rangle, a cały przedział \langle 2,5\rangle w nim się zawiera, więc f jest tam rosnąca.
    Stąd wartość najmniejszą przyjmuje w lewym końcu: f\left(2\right)=2^2+2\cdot 2-3=5,
    a wartość największą w prawym końcu: f\left(5\right)=5^2+2\cdot 5-3=32.
  solution_steps:
  - Oblicz p=-\frac{2}{2\cdot 1}=-1.
  - Uzasadnij, że -1\notin\langle 2,5\rangle.
  - Z a>0 wywnioskuj, że f rośnie w \langle -1,+\infty\rangle, więc rośnie na \langle 2,5\rangle.
  - Oblicz f\left(2\right)=5 i f\left(5\right)=32.
  - 'Zapisz: wartość najmniejsza 5, największa 32.'
  answer:
    kind: MULTIPART
    parts:
    - name: uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy obliczyć p=-1 i wykazać, że nie spełnia warunku 2\le x\le 5, a następnie powołać
          się na monotoniczność funkcji na \langle 2,5\rangle.
    - name: wartość najmniejsza
      answer:
        kind: NUMERIC
        value: 5.0
    - name: wartość największa
      answer:
        kind: NUMERIC
        value: 32.0
  checks:
  - kind: evaluate
    expr: 2^2+2\cdot 2-3
    part: wartość najmniejsza
  - kind: evaluate
    expr: 5^2+2\cdot 5-3
    part: wartość największa
  skills:
  - monotoniczność funkcji kwadratowej
  - obliczanie wartości na końcach przedziału
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie · 2/2 other parts solved fresh'
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: wartości ekstremalne w przedziale zawierającym wierzchołek
  statement: Wyznacz wartość największą i wartość najmniejszą funkcji f\left(x\right)=x^2-2x-8 w przedziale
    \langle -2,5\rangle. Podaj także argumenty, dla których te wartości są przyjmowane. Zapisz obliczenia.
  statement_latex: f\left(x\right)=x^2-2x-8,\qquad x\in\langle -2,5\rangle
  solution: |-
    Krok 1: a=1>0, ramiona paraboli skierowane w górę.
    Krok 2: p=-\frac{-2}{2\cdot 1}=1.
    Krok 3: -2\le 1\le 5, więc wierzchołek należy do przedziału – liczymy trzy wartości.
    Krok 4: f\left(1\right)=1^2-2\cdot 1-8=-9, f\left(-2\right)=\left(-2\right)^2-2\cdot\left(-2\right)-8=0, f\left(5\right)=5^2-2\cdot 5-8=7.
    Krok 5: Ponieważ a>0 i p\in\langle -2,5\rangle, wartość najmniejsza to f\left(1\right)=-9. Wartość największa to większa z liczb f\left(-2\right)=0 i f\left(5\right)=7, czyli 7 (zgodnie z regułą odległości: \left|5-1\right|=4>\left|-2-1\right|=3).
    Odpowiedź: wartość największa wynosi 7 (dla x=5), wartość najmniejsza wynosi -9 (dla x=1).
  solution_steps:
  - Stwierdź, że a=1>0.
  - Oblicz p=-\frac{-2}{2\cdot 1}=1 i sprawdź, że p\in\langle -2,5\rangle.
  - Oblicz f\left(1\right)=-9, f\left(-2\right)=0, f\left(5\right)=7.
  - Wybierz minimum f\left(1\right)=-9 i maksimum f\left(5\right)=7.
  - Zapisz wartości wraz z argumentami.
  answer:
    kind: MULTIPART
    parts:
    - name: wartość największa
      answer:
        kind: NUMERIC
        value: 7.0
    - name: argument wartości największej
      answer:
        kind: NUMERIC
        value: 5.0
    - name: wartość najmniejsza
      answer:
        kind: NUMERIC
        value: -9.0
    - name: argument wartości najmniejszej
      answer:
        kind: NUMERIC
        value: 1.0
  checks:
  - kind: evaluate
    expr: 5^2-2\cdot 5-8
    part: wartość największa
  - kind: evaluate
    expr: 1^2-2\cdot 1-8
    part: wartość najmniejsza
  - kind: evaluate
    expr: -\frac{-2}{2\cdot 1}
    part: argument wartości najmniejszej
  skills:
  - algorytm wartości największej i najmniejszej w przedziale
  - obliczanie wartości funkcji
  verification:
    checkability: REFERENCE_CALL
    note: '4 parts matched · det: [wartość największa] SymPy solved it fresh: 7.0 vs 7.0 (tol 1e-09) ;
      [wartość najmniejsza] SymPy solved it fresh: -9.0 vs -9.0 (tol 1e-09) ; [argument wartości najmniejszej]
      SymPy solved it fresh: 1.0 vs 1.0 (tol 1e-09)'
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: wartości ekstremalne i zbiór wartości w przedziale
  statement: Dana jest funkcja kwadratowa f określona wzorem f\left(x\right)=-x^2+6x-4. Wyznacz wartość
    największą i wartość najmniejszą funkcji f w przedziale \langle 4,7\rangle, uzasadnij położenie tych
    wartości, korzystając z monotoniczności funkcji, oraz podaj zbiór wartości funkcji f zawężonej do
    tego przedziału.
  statement_latex: f\left(x\right)=-x^2+6x-4,\qquad x\in\langle 4,7\rangle
  solution: |-
    Krok 1: a=-1<0, ramiona paraboli skierowane w dół.
    Krok 2: p=-\frac{6}{2\cdot\left(-1\right)}=3.
    Krok 3: 3\notin\langle 4,7\rangle – wierzchołek leży na lewo od przedziału.
    Krok 4: Dla a<0 funkcja maleje w \langle p,+\infty\rangle=\langle 3,+\infty\rangle, a \langle 4,7\rangle\subset\langle 3,+\infty\rangle, więc f jest malejąca na \langle 4,7\rangle. Zatem wartość największa jest w lewym końcu, a najmniejsza w prawym.
    Krok 5: f\left(4\right)=-4^2+6\cdot 4-4=-16+24-4=4, f\left(7\right)=-7^2+6\cdot 7-4=-49+42-4=-11.
    Wartość największa wynosi 4 (dla x=4), najmniejsza -11 (dla x=7).
    Funkcja kwadratowa jest ciągła, więc w przedziale domkniętym przyjmuje wszystkie wartości pomiędzy minimum a maksimum: ZW=\langle -11,4\rangle.
  solution_steps:
  - Ustal a=-1<0 i oblicz p=-\frac{6}{2\cdot\left(-1\right)}=3.
  - Stwierdź, że p\notin\langle 4,7\rangle i że f maleje na \langle 3,+\infty\rangle, więc maleje na \langle
    4,7\rangle.
  - Oblicz f\left(4\right)=4 oraz f\left(7\right)=-11.
  - Wskaż wartość największą 4 (dla x=4) i najmniejszą -11 (dla x=7).
  - Z ciągłości funkcji zapisz zbiór wartości \langle -11,4\rangle.
  answer:
    kind: MULTIPART
    parts:
    - name: wartość największa
      answer:
        kind: NUMERIC
        value: 4.0
    - name: wartość najmniejsza
      answer:
        kind: NUMERIC
        value: -11.0
    - name: uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Trzeba wykazać, że p=3 leży poza przedziałem oraz że przy a<0 funkcja jest malejąca na
          \langle 4,7\rangle, skąd maksimum w x=4, a minimum w x=7.
    - name: zbiór wartości
      answer:
        kind: INTERVAL
        lo: '-11'
        hi: '4'
        lo_open: false
        hi_open: false
  checks:
  - kind: evaluate
    expr: -4^2+6\cdot 4-4
    part: wartość największa
  - kind: evaluate
    expr: -7^2+6\cdot 7-4
    part: wartość najmniejsza
  skills:
  - monotoniczność funkcji kwadratowej
  - zbiór wartości funkcji zawężonej do przedziału
  - uzasadnianie położenia ekstremów
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie · 2/3 other parts solved fresh'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: optymalizacja kwadratowa z ograniczeniem przedziałowym
  statement: Ogrodnik chce ogrodzić prostokątną rabatę, która jednym bokiem przylega do prostego, długiego
    muru (przy murze siatki się nie stawia). Do ogrodzenia pozostałych trzech boków ma dokładnie 24 m
    siatki i zużywa ją w całości. Długość boku prostopadłego do muru oznaczamy przez x (w metrach), przy
    czym ze względów praktycznych 2\le x\le 5. Zapisz pole rabaty jako funkcję zmiennej x, a następnie
    oblicz największe i najmniejsze możliwe pole rabaty. Zapisz obliczenia.
  statement_latex: P\left(x\right)=x\cdot\left(24-2\cdot x\right)=-2x^2+24x,\qquad x\in\langle 2,5\rangle
  solution: |-
    Boki prostopadłe do muru mają długość x każdy (są dwa), więc na bok równoległy do muru zostaje 24-2\cdot x metrów siatki.
    Pole rabaty: P\left(x\right)=x\cdot\left(24-2\cdot x\right)=-2x^2+24x, gdzie x\in\langle 2,5\rangle.
    Współczynnik a=-2<0, więc ramiona paraboli skierowane są w dół, a p=-\frac{24}{2\cdot\left(-2\right)}=6.
    Liczba 6 nie należy do \langle 2,5\rangle, więc wierzchołek leży na prawo od przedziału. Dla a<0 funkcja rośnie w \left(-\infty,6\rangle, a \langle 2,5\rangle\subset\left(-\infty,6\rangle, więc P jest rosnąca na \langle 2,5\rangle.
    P\left(5\right)=-2\cdot 5^2+24\cdot 5=-50+120=70, P\left(2\right)=-2\cdot 2^2+24\cdot 2=-8+48=40.
    Odpowiedź: największe pole to 70 m^2 (dla x=5 m), najmniejsze pole to 40 m^2 (dla x=2 m). Wartość P\left(6\right)=72 m^2 nie jest osiągalna, bo x=6 nie spełnia warunku zadania.
  solution_steps:
  - Zapisz drugi bok jako 24-2\cdot x i pole P\left(x\right)=x\cdot\left(24-2\cdot x\right)=-2x^2+24x.
  - 'Ustal dziedzinę modelu: x\in\langle 2,5\rangle.'
  - Oblicz p=-\frac{24}{2\cdot\left(-2\right)}=6 i stwierdź, że p\notin\langle 2,5\rangle.
  - Z a<0 wywnioskuj, że P rośnie na \langle 2,5\rangle.
  - Oblicz P\left(5\right)=70 oraz P\left(2\right)=40 i zinterpretuj wyniki w m^2.
  answer:
    kind: MULTIPART
    parts:
    - name: wzór pola
      answer:
        kind: SYMBOLIC
        latex: -2x^2+24x
    - name: największe pole
      answer:
        kind: NUMERIC
        value: 70.0
    - name: najmniejsze pole
      answer:
        kind: NUMERIC
        value: 40.0
  checks:
  - kind: simplify
    expr: x\cdot\left(24-2\cdot x\right)
    part: wzór pola
  - kind: evaluate
    expr: -2\cdot 5^2+24\cdot 5
    part: największe pole
  - kind: evaluate
    expr: -2\cdot 2^2+24\cdot 2
    part: najmniejsze pole
  stated_model:
    variable: x
    objective_latex: P\left(x\right)=-2x^2+24x
    domain_lo: '2'
    domain_hi: '5'
    domain_lo_open: false
    domain_hi_open: false
    constraint_used: 2\cdot x+y=24,\ 2\le x\le 5
  skills:
  - budowanie modelu kwadratowego
  - wyznaczanie przedziału zmiennej
  - optymalizacja gdy wierzchołek leży poza przedziałem
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''x'': ''P\\left(x\\right)=-2x^2+24x'')
      — human review'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: wartość największa i najmniejsza w przedziale domkniętym (postać iloczynowa)
  statement: Funkcja kwadratowa f jest określona wzorem f(x) = -(x-2)(x+4). Wyznacz wartość największą
    i wartość najmniejszą funkcji f w przedziale ⟨-1, 3⟩ oraz podaj argumenty, dla których te wartości
    są przyjmowane. Wyznacz też zbiór wartości funkcji f zawężonej do przedziału ⟨-1, 3⟩. Zapisz obliczenia.
  statement_latex: f\left(x\right) = -\left(x-2\right)\cdot\left(x+4\right),\qquad x\in\langle -1,\,3\rangle
  solution: |-
    Z postaci iloczynowej odczytujemy miejsca zerowe: x_1 = 2, x_2 = -4. Po wymnożeniu f(x) = -(x^2+2x-8) = -x^2-2x+8, więc a = -1 < 0 — ramiona paraboli skierowane są w dół, a w wierzchołku funkcja przyjmuje wartość największą.
    Pierwsza współrzędna wierzchołka to średnia arytmetyczna miejsc zerowych: p = \frac{2+(-4)}{2} = -1. Liczba p = -1 należy do przedziału ⟨-1, 3⟩ (jest jego lewym końcem).
    Liczymy wartości w kandydatach: f(-1) = -(-1-2)(-1+4) = -(-3)\cdot 3 = 9 oraz f(3) = -(3-2)(3+4) = -1\cdot 7 = -7.
    Ponieważ a < 0 i p ∈ ⟨-1,3⟩, wartość największa to f(p) = f(-1) = 9. Wartość najmniejsza jest przyjmowana na dalszym od p końcu przedziału, czyli f(3) = -7.
    Funkcja kwadratowa jest ciągła, więc na przedziale domkniętym przyjmuje wszystkie wartości między wartością najmniejszą a największą: ZW = ⟨-7, 9⟩.
    Odpowiedź: wartość największa wynosi 9 (dla x = -1), wartość najmniejsza wynosi -7 (dla x = 3), a zbiorem wartości jest ⟨-7, 9⟩.
  solution_steps:
  - 'Odczytaj miejsca zerowe z postaci iloczynowej: x_1 = 2, x_2 = -4.'
  - 'Ustal znak a: po wymnożeniu f(x) = -x^2-2x+8, więc a = -1 < 0 (ramiona w dół).'
  - Oblicz p = \frac{2+(-4)}{2} = -1 i sprawdź, że -1 ∈ ⟨-1,3⟩.
  - Oblicz f(-1) = 9 oraz f(3) = -7.
  - 'Dla a < 0 i p w przedziale: f_max = f(-1) = 9, f_min = f(3) = -7.'
  - 'Z ciągłości funkcji zapisz zbiór wartości: ⟨-7, 9⟩.'
  answer:
    kind: MULTIPART
    parts:
    - name: wartosc_najwieksza
      answer:
        kind: NUMERIC
        value: 9.0
    - name: argument_dla_najwiekszej
      answer:
        kind: NUMERIC
        value: -1.0
    - name: wartosc_najmniejsza
      answer:
        kind: NUMERIC
        value: -7.0
    - name: argument_dla_najmniejszej
      answer:
        kind: NUMERIC
        value: 3.0
    - name: zbior_wartosci
      answer:
        kind: INTERVAL
        lo: '-7'
        hi: '9'
        lo_open: false
        hi_open: false
  checks:
  - kind: evaluate
    expr: -\left(-1-2\right)\cdot\left(-1+4\right)
    part: wartosc_najwieksza
  - kind: evaluate
    expr: \frac{2+\left(-4\right)}{2}
    part: argument_dla_najwiekszej
  - kind: evaluate
    expr: -\left(3-2\right)\cdot\left(3+4\right)
    part: wartosc_najmniejsza
  skills:
  - odczytywanie miejsc zerowych z postaci iloczynowej
  - wyznaczanie pierwszej współrzędnej wierzchołka jako średniej miejsc zerowych
  - sprawdzanie przynależności p do przedziału
  - wyznaczanie zbioru wartości funkcji zawężonej do przedziału
  verification:
    checkability: REFERENCE_CALL
    note: 5 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: wyznaczanie parametru z zadanej wartości największej w przedziale
  statement: Funkcja kwadratowa f jest określona wzorem f(x) = x^2 - 2x + c, gdzie c jest pewną liczbą
    rzeczywistą. W przedziale ⟨-2, 5⟩ funkcja f przyjmuje wartość największą równą 22. Oblicz c, a następnie
    wyznacz wartość najmniejszą funkcji f w przedziale ⟨-2, 5⟩ (podaj też argument, dla którego jest ona
    przyjmowana) oraz zbiór wartości funkcji f zawężonej do tego przedziału. Zapisz obliczenia.
  statement_latex: f\left(x\right) = x^2 - 2\cdot x + c,\qquad x\in\langle -2,\,5\rangle,\qquad f_{\max}
    = 22
  solution: |-
    Mamy a = 1 > 0, więc ramiona paraboli są skierowane w górę, a wartość największa w przedziale domkniętym jest przyjmowana na jednym z jego końców.
    Pierwsza współrzędna wierzchołka: p = -\frac{-2}{2\cdot 1} = 1 i p = 1 ∈ ⟨-2, 5⟩.
    Porównujemy odległości końców od osi symetrii x = 1: |-2-1| = 3, |5-1| = 4. Ponieważ a > 0, większą wartość daje koniec dalszy od p, czyli x = 5. Zatem f(5) = 22.
    f(5) = 25 - 10 + c = 15 + c, więc 15 + c = 22, stąd c = 7.
    Funkcja ma wzór f(x) = x^2 - 2x + 7. Ponieważ a > 0 i p = 1 należy do przedziału, wartość najmniejsza to f(1) = 1 - 2 + 7 = 6 (dla x = 1).
    Sprawdzenie: f(-2) = 4 + 4 + 7 = 15 < 22 — istotnie maksimum jest w x = 5.
    Z ciągłości funkcji kwadratowej zbiorem wartości w ⟨-2, 5⟩ jest ⟨6, 22⟩.
    Odpowiedź: c = 7, wartość najmniejsza wynosi 6 (dla x = 1), a zbiór wartości to ⟨6, 22⟩.
  solution_steps:
  - Zauważ, że a = 1 > 0, więc maksimum w przedziale domkniętym jest na jednym z końców.
  - Oblicz p = -\frac{-2}{2\cdot 1} = 1 i sprawdź, że p ∈ ⟨-2,5⟩.
  - 'Porównaj odległości: |-2-1| = 3 < |5-1| = 4, więc przy a > 0 wartość największa jest w x = 5.'
  - Rozwiąż równanie 25 - 10 + c = 22, otrzymując c = 7.
  - Oblicz wartość najmniejszą f(1) = 1 - 2 + 7 = 6.
  - 'Zapisz zbiór wartości: ⟨6, 22⟩.'
  answer:
    kind: MULTIPART
    parts:
    - name: c
      answer:
        kind: NUMERIC
        value: 7.0
    - name: wartosc_najmniejsza
      answer:
        kind: NUMERIC
        value: 6.0
    - name: argument_dla_najmniejszej
      answer:
        kind: NUMERIC
        value: 1.0
    - name: zbior_wartosci
      answer:
        kind: INTERVAL
        lo: '6'
        hi: '22'
        lo_open: false
        hi_open: false
  checks:
  - kind: solve_equation
    expr: 25 - 10 + c = 22
    var: c
    part: c
  - kind: evaluate
    expr: 1^2 - 2\cdot 1 + 7
    part: wartosc_najmniejsza
  - kind: evaluate
    expr: -\frac{-2}{2\cdot 1}
    part: argument_dla_najmniejszej
  skills:
  - porównywanie wartości na końcach przedziału przez odległość od osi symetrii
  - wyznaczanie parametru z równania
  - obliczanie wartości najmniejszej w wierzchołku
  - wyznaczanie zbioru wartości w przedziale domkniętym
  verification:
    checkability: REFERENCE_CALL
    note: 4 parts matched
