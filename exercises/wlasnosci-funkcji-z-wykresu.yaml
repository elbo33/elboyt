- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: przedziały monotoniczności
  statement: 'Wykresem funkcji f jest łamana o kolejnych wierzchołkach A=(-5, 3), B=(-2, -1), C=(1, -1),
    D=(4, 5). Punkty A i D są końcami wykresu i zaznaczono je kropkami pełnymi. Podaj: przedział, w którym
    funkcja f jest malejąca; przedział, w którym funkcja f jest stała; przedział, w którym funkcja f jest
    rosnąca.'
  statement_latex: A=\left(-5,\,3\right),\ B=\left(-2,\,-1\right),\ C=\left(1,\,-1\right),\ D=\left(4,\,5\right)
  solution: Prowadzimy wzrok wzdłuż wykresu od lewej do prawej. Od A=(-5, 3) do B=(-2, -1) wartości spadają
    z 3 do -1, więc funkcja jest malejąca w przedziale ⟨-5, -2⟩. Od B=(-2, -1) do C=(1, -1) wartość jest
    stale równa -1 (odcinek poziomy), więc funkcja jest stała w przedziale ⟨-2, 1⟩. Od C=(1, -1) do D=(4,
    5) wartości rosną z -1 do 5, więc funkcja jest rosnąca w przedziale ⟨1, 4⟩. Każdy przedział zapisujemy
    osobno.
  solution_steps:
  - 'Podziel dziedzinę argumentami wierzchołków łamanej: -5, -2, 1, 4.'
  - Na odcinku AB wykres opada — f maleje w ⟨-5, -2⟩.
  - Odcinek BC jest poziomy (wartość -1) — f jest stała w ⟨-2, 1⟩.
  - Na odcinku CD wykres się wznosi — f rośnie w ⟨1, 4⟩.
  - Zapisz trzy przedziały osobno, nie łącząc ich znakiem sumy.
  answer:
    kind: MULTIPART
    parts:
    - name: przedział, w którym f maleje
      answer:
        kind: INTERVAL
        lo: '-5'
        hi: '-2'
        lo_open: false
        hi_open: false
    - name: przedział, w którym f jest stała
      answer:
        kind: INTERVAL
        lo: '-2'
        hi: '1'
        lo_open: false
        hi_open: false
    - name: przedział, w którym f rośnie
      answer:
        kind: INTERVAL
        lo: '1'
        hi: '4'
        lo_open: false
        hi_open: false
  skills:
  - wyznaczanie przedziałów monotoniczności
  - rozpoznawanie funkcji stałej
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 0
  difficulty: 2
  exercise_type: pełny odczyt własności funkcji przedziałami określonej
  statement: 'Funkcja f jest określona następująco: f(x) = x + 4 dla x ∈ ⟨-5, -1⟩, f(x) = 3 dla x ∈ (-1,
    2⟩, f(x) = -2x + 7 dla x ∈ (2, 4). Wykres funkcji y = f(x) składa się zatem z odcinka o końcach (-5,
    -1) i (-1, 3) (oba końce należą do wykresu), z poziomego odcinka o wartości 3 dla argumentów z przedziału
    (-1, 2⟩ oraz z odcinka opadającego od punktu (2, 3) do punktu (4, -1), przy czym punkt (4, -1) do
    wykresu nie należy. Uzupełnij zdania 1.-3., zapisując odpowiednie przedziały. 1. Dziedziną funkcji
    f jest przedział ..... 2. Zbiorem wartości funkcji f jest przedział ..... 3. Zbiorem wszystkich argumentów,
    dla których funkcja f przyjmuje wartości dodatnie, jest przedział .....'
  statement_latex: f\left(x\right)=x+4\ \text{dla}\ x\in\left\langle -5,\,-1\right\rangle,\quad f\left(x\right)=3\
    \text{dla}\ x\in\left(-1,\,2\right\rangle,\quad f\left(x\right)=-2\cdot x+7\ \text{dla}\ x\in\left(2,\,4\right)
  solution: |-
    Dziedzina: argumenty pochodzą z sumy przedziałów ⟨-5, -1⟩ ∪ (-1, 2⟩ ∪ (2, 4), które sklejają się w jeden przedział. Lewy koniec -5 należy do dziedziny (kropka pełna), prawy koniec 4 nie należy (kropka pusta). Zatem D_f = ⟨-5, 4).

    Zbiór wartości: pierwszy fragment to odcinek rosnący od f(-5) = -1 do f(-1) = 3, daje wartości ⟨-1, 3⟩. Drugi fragment daje jedynie wartość 3. Trzeci fragment opada od poziomu 3 (dla x bliskich 2) do poziomu -1 (dla x bliskich 4, wartość -1 nie jest tu osiągana), daje wartości (-1, 3). Suma wszystkich wartości to ⟨-1, 3⟩.

    Znak funkcji: miejsca zerowe znajdujemy w pierwszym i trzecim fragmencie. Z równania x + 4 = 0 mamy x = -4 (należy do ⟨-5, -1⟩), z równania -2x + 7 = 0 mamy x = \frac{7}{2} (należy do (2, 4)). Dla x ∈ ⟨-5, -4) wartości są ujemne, dla x ∈ (-4, -1⟩ dodatnie, na całym (-1, 2⟩ wartość 3 jest dodatnia, na (2, 7/2) wartości są dodatnie, a na (7/2, 4) ujemne. Zatem f(x) > 0 dla x ∈ (-4, \frac{7}{2}).
  solution_steps:
  - 'Zsumuj przedziały argumentów: ⟨-5, -1⟩ ∪ (-1, 2⟩ ∪ (2, 4) = ⟨-5, 4).'
  - 'Wyznacz wartości na końcach fragmentów: f(-5) = -1, f(-1) = 3, wartość stała 3, wartości od 3 do
    -1 (bez -1) na ostatnim fragmencie.'
  - 'Połącz zbiory wartości: ⟨-1, 3⟩ ∪ {3} ∪ (-1, 3) = ⟨-1, 3⟩.'
  - 'Znajdź miejsca zerowe: x + 4 = 0 daje x = -4; -2x + 7 = 0 daje x = 7/2.'
  - Ustal, na których kawałkach wykres leży nad osią OX, i zapisz f(x) > 0 dla x ∈ (-4, 7/2).
  answer:
    kind: MULTIPART
    parts:
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '-5'
        hi: '4'
        lo_open: false
    - name: zbiór wartości
      answer:
        kind: INTERVAL
        lo: '-1'
        hi: '3'
        lo_open: false
        hi_open: false
    - name: zbiór argumentów, dla których f(x) > 0
      answer:
        kind: INTERVAL
        lo: '-4'
        hi: \frac{7}{2}
  skills:
  - odczytywanie dziedziny
  - odczytywanie zbioru wartości
  - odczytywanie przedziałów stałego znaku
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 1
  difficulty: 3
  exercise_type: odczyt własności funkcji kwadratowej z wykresu
  statement: 'Dana jest funkcja f określona wzorem f(x) = x^2 - 6x + 5 dla x ∈ ⟨0, 7⟩ (oba końce należą
    do dziedziny). Wykresem tej funkcji jest fragment paraboli o wierzchołku W = (3, -4), o ramionach
    skierowanych do góry. Wyznacz: (a) wszystkie miejsca zerowe funkcji f; (b) zbiór wszystkich rozwiązań
    nierówności f(x) ≤ 0; (c) wartość najmniejszą funkcji f w przedziale ⟨0, 7⟩ i argument, dla którego
    jest przyjmowana; (d) wartość największą funkcji f w przedziale ⟨0, 7⟩ i argument, dla którego jest
    przyjmowana.'
  statement_latex: f\left(x\right)=x^{2}-6\cdot x+5,\qquad x\in\left\langle 0,\,7\right\rangle,\qquad
    W=\left(3,\,-4\right)
  solution: |-
    (a) Miejsca zerowe to punkty wspólne wykresu z osią OX. Rozwiązujemy x^{2}-6\cdot x+5=0. Wyróżnik: \Delta = 36 - 4\cdot 5 = 16, \sqrt{\Delta}=4, więc x = \frac{6-4}{2}=1 lub x = \frac{6+4}{2}=5. Obie liczby należą do ⟨0, 7⟩, zatem miejscami zerowymi są 1 i 5.

    (b) Ramiona paraboli skierowane są do góry, więc wykres leży pod osią OX lub na niej między miejscami zerowymi. Nierówność jest nieostra, więc końce dołączamy: x ∈ ⟨1, 5⟩ (cały ten przedział mieści się w dziedzinie).

    (c) Najniższym punktem fragmentu wykresu jest wierzchołek W = (3, -4). Wartość najmniejsza wynosi -4 i jest przyjmowana dla x = 3.

    (d) Kandydatami na wartość największą są końce przedziału: f(0) = 0 - 0 + 5 = 5 oraz f(7) = 49 - 42 + 5 = 12. Większa z nich to 12, zatem wartość największa wynosi 12 i jest przyjmowana dla x = 7.
  solution_steps:
  - 'Rozwiąż równanie x^2 - 6x + 5 = 0: Δ = 16, x = 1 lub x = 5 — to miejsca zerowe.'
  - 'Ramiona paraboli skierowane do góry, więc f(x) ≤ 0 między miejscami zerowymi: x ∈ ⟨1, 5⟩.'
  - 'Odczytaj wierzchołek W = (3, -4) — najniższy punkt wykresu: wartość najmniejsza to -4 dla x = 3.'
  - 'Oblicz wartości na końcach przedziału: f(0) = 5, f(7) = 12.'
  - 'Porównaj kandydatów: wartość największa wynosi 12 i jest przyjmowana dla x = 7.'
  answer:
    kind: MULTIPART
    parts:
    - name: miejsca zerowe
      answer:
        kind: SET
        members:
        - '1'
        - '5'
    - name: rozwiązanie nierówności f(x) ≤ 0
      answer:
        kind: INTERVAL
        lo: '1'
        hi: '5'
        lo_open: false
        hi_open: false
    - name: wartość najmniejsza
      answer:
        kind: NUMERIC
        value: -4.0
    - name: argument wartości najmniejszej
      answer:
        kind: NUMERIC
        value: 3.0
    - name: wartość największa
      answer:
        kind: NUMERIC
        value: 12.0
    - name: argument wartości największej
      answer:
        kind: NUMERIC
        value: 7.0
  checks:
  - kind: solve_equation
    expr: x^{2}-6\cdot x+5=0
    part: miejsca zerowe
  - kind: solve_inequality
    expr: x^{2}-6\cdot x+5\le 0
    part: rozwiązanie nierówności f(x) ≤ 0
  - kind: evaluate
    expr: \left(3\right)^{2}-6\cdot 3+5
    part: wartość najmniejsza
  - kind: solve_equation
    expr: x^{2}-6\cdot x+5=-4
    part: argument wartości najmniejszej
  - kind: evaluate
    expr: \left(7\right)^{2}-6\cdot 7+5
    part: wartość największa
  skills:
  - odczytywanie miejsc zerowych
  - graficzne rozwiązywanie nierówności
  - wartość największa i najmniejsza w przedziale domkniętym
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: reference produced 4 outputs, answer has 6'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: pełny opis własności wykresu z przerwą i kropką pustą
  statement: 'Wykres funkcji h składa się z dwóch odcinków. Pierwszy odcinek ma końce (-4, 3) oraz (-1,
    -3) i oba te punkty należą do wykresu (kropki pełne). Drugi odcinek ma końce (0, -1) oraz (3, 5),
    przy czym punkt (0, -1) do wykresu nie należy (kropka pusta), a punkt (3, 5) należy (kropka pełna).
    Poza tymi dwoma odcinkami wykresu nie ma. Wyznacz: (a) dziedzinę funkcji h; (b) zbiór wartości funkcji
    h; (c) wszystkie miejsca zerowe funkcji h; (d) zbiór wszystkich argumentów, dla których h(x) < 0;
    (e) uzasadnij, że w przedziale (0, 3⟩ funkcja h nie przyjmuje wartości najmniejszej.'
  statement_latex: \text{odcinek I}:\ \left(-4,\,3\right)\to\left(-1,\,-3\right),\qquad \text{odcinek
    II}:\ \left(0,\,-1\right)\to\left(3,\,5\right)
  solution: |-
    Wyznaczmy najpierw równania obu odcinków. Odcinek I: współczynnik kierunkowy to \frac{-3-3}{-1-\left(-4\right)} = \frac{-6}{3} = -2, więc y = 3 - 2\cdot\left(x+4\right) = -2\cdot x - 5 dla x ∈ ⟨-4, -1⟩. Odcinek II: współczynnik kierunkowy to \frac{5-\left(-1\right)}{3-0} = 2, więc y = -1 + 2\cdot x = 2\cdot x - 1 dla x ∈ (0, 3⟩.

    (a) Dziedzina: rzut wykresu na oś OX to ⟨-4, -1⟩ ∪ (0, 3⟩ (między -1 a 0 wykresu nie ma, a 0 nie należy do dziedziny z powodu kropki pustej).

    (b) Zbiór wartości: odcinek I opada od 3 do -3, daje ⟨-3, 3⟩; odcinek II wznosi się od poziomu -1 (nieosiąganego) do 5 (osiąganego), daje (-1, 5⟩. Suma: ⟨-3, 3⟩ ∪ (-1, 5⟩ = ⟨-3, 5⟩.

    (c) Miejsca zerowe: -2\cdot x-5=0 daje x = -\frac{5}{2} ∈ ⟨-4, -1⟩; 2\cdot x-1=0 daje x = \frac{1}{2} ∈ (0, 3⟩. Miejsca zerowe to -\frac{5}{2} oraz \frac{1}{2}.

    (d) Znak: na odcinku I wykres jest pod osią OX dla x > -\frac{5}{2}, czyli dla x ∈ \left(-\frac{5}{2},\,-1\right\rangle; na odcinku II wykres jest pod osią OX dla x < \frac{1}{2}, czyli dla x ∈ \left(0,\,\frac{1}{2}\right). Zatem h(x) < 0 dla x ∈ \left(-\frac{5}{2},\,-1\right\rangle \cup \left(0,\,\frac{1}{2}\right).

    (e) W przedziale (0, 3⟩ funkcja jest rosnąca, a jej wartości to zbiór (-1, 5⟩. Poziom -1 nie jest osiągany (kropka pusta w punkcie (0, -1)), a dla dowolnego argumentu x_0 ∈ (0, 3⟩ można wskazać argument x_1 = \frac{x_0}{2} ∈ (0, 3⟩, dla którego h(x_1) < h(x_0). Zatem żadna przyjmowana wartość nie jest najmniejsza — wartość najmniejsza nie istnieje.
  solution_steps:
  - 'Wyznacz równania odcinków: y = -2x - 5 dla x ∈ ⟨-4, -1⟩ oraz y = 2x - 1 dla x ∈ (0, 3⟩.'
  - 'Dziedzina jako rzut na OX z uwzględnieniem kropki pustej: ⟨-4, -1⟩ ∪ (0, 3⟩.'
  - 'Zbiór wartości: ⟨-3, 3⟩ z pierwszego odcinka i (-1, 5⟩ z drugiego, w sumie ⟨-3, 5⟩.'
  - 'Miejsca zerowe: -2x - 5 = 0 daje x = -5/2; 2x - 1 = 0 daje x = 1/2.'
  - 'Znak ujemny: (-5/2, -1⟩ na pierwszym odcinku i (0, 1/2) na drugim.'
  - 'Uzasadnij brak wartości najmniejszej w (0, 3⟩: funkcja rośnie, poziom -1 nie jest osiągany, dla każdego
    argumentu istnieje mniejsza wartość.'
  answer:
    kind: MULTIPART
    parts:
    - name: dziedzina
      answer:
        kind: SYMBOLIC
        latex: \left\langle -4,\,-1\right\rangle \cup \left(0,\,3\right\rangle
    - name: zbiór wartości
      answer:
        kind: INTERVAL
        lo: '-3'
        hi: '5'
        lo_open: false
        hi_open: false
    - name: miejsca zerowe
      answer:
        kind: SET
        members:
        - -\frac{5}{2}
        - \frac{1}{2}
    - name: zbiór argumentów, dla których h(x) < 0
      answer:
        kind: SYMBOLIC
        latex: \left(-\frac{5}{2},\,-1\right\rangle \cup \left(0,\,\frac{1}{2}\right)
    - name: uzasadnienie braku wartości najmniejszej w (0, 3⟩
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: 'Uczeń musi uzasadnić, że w przedziale (0, 3⟩ funkcja h nie ma wartości najmniejszej:
          h jest tam rosnąca, wartości tworzą zbiór (-1, 5⟩, poziom -1 nie jest osiągany (kropka pusta),
          więc dla każdego argumentu x0 ∈ (0, 3⟩ istnieje argument mniejszy, dla którego wartość jest
          mniejsza.'
  skills:
  - odczytywanie dziedziny z przerwą
  - odczytywanie zbioru wartości
  - znak funkcji
  - ocena istnienia wartości skrajnych
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: uzasadnienie braku wartości najmniejszej w (0, 3⟩ · 0/4 other parts solved
      fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: odczyt własności funkcji danej wzorem przedziałami
  statement: |-
    Funkcja f jest określona następująco:
    f(x) = -2x - 4 dla x ∈ ⟨-4, -1),  f(x) = -2 dla x ∈ ⟨-1, 2⟩,  f(x) = 2x - 6 dla x ∈ (2, 4⟩.
    Wykresem funkcji f jest łamana o kolejnych wierzchołkach (-4, 4), (-1, -2), (2, -2), (4, 2); oba końce wykresu (dla x = -4 oraz x = 4) należą do wykresu.
    a) Podaj zbiór wartości funkcji f.
    b) Podaj wszystkie miejsca zerowe funkcji f.
    c) Zapisz zbiór wszystkich rozwiązań nierówności f(x) ≥ 1.
    d) Podaj wartość największą i wartość najmniejszą funkcji f w przedziale ⟨-3, 3⟩ oraz wszystkie argumenty, dla których te wartości są przyjmowane.
  statement_latex: f(x)=\left\{\begin{matrix} -2 \cdot x - 4 & \text{dla } x \in \langle -4,\ -1) \\ -2
    & \text{dla } x \in \langle -1,\ 2 \rangle \\ 2 \cdot x - 6 & \text{dla } x \in (2,\ 4 \rangle \end{matrix}\right.
  solution: |-
    Wykres jest łamaną ciągłą: opada z punktu (-4, 4) do (-1, -2), jest poziomy na poziomie -2 dla x ∈ ⟨-1, 2⟩, a następnie wznosi się do punktu (4, 2).

    a) Najniższy poziom wykresu to y = -2 (cały odcinek poziomy), najwyższy to y = 4 (punkt (-4, 4), kropka pełna). Wykres jest ciągły, więc przyjmuje wszystkie wartości pomiędzy: ZW = ⟨-2, 4⟩.

    b) Miejsca zerowe: na pierwszym kawałku -2x - 4 = 0, czyli x = -2 i -2 ∈ ⟨-4, -1). Na kawałku stałym wartość -2 ≠ 0. Na trzecim kawałku 2x - 6 = 0, czyli x = 3 i 3 ∈ (2, 4⟩. Miejsca zerowe to liczby -2 oraz 3.

    c) Prowadzimy prostą y = 1. Na pierwszym kawałku: -2x - 4 ≥ 1 ⟺ -2x ≥ 5 ⟺ x ≤ -5/2; uwzględniając ⟨-4, -1) otrzymujemy ⟨-4, -5/2⟩. Na kawałku stałym -2 ≥ 1 nie zachodzi. Na trzecim kawałku: 2x - 6 ≥ 1 ⟺ x ≥ 7/2; uwzględniając (2, 4⟩ otrzymujemy ⟨7/2, 4⟩. Zatem rozwiązaniem jest zbiór argumentów ⟨-4, -5/2⟩ ∪ ⟨7/2, 4⟩.

    d) Ograniczamy się do przedziału ⟨-3, 3⟩. Kandydaci: f(-3) = -2·(-3) - 4 = 2, wartość na odcinku poziomym równa -2 (dla x ∈ ⟨-1, 2⟩), f(3) = 2·3 - 6 = 0. Największa z tych liczb to 2, najmniejsza to -2.
    Wartość największa wynosi 2 i jest przyjmowana dla x = -3 (na kawałku malejącym równanie -2x - 4 = 2 daje x = -3, innych argumentów nie ma). Wartość najmniejsza wynosi -2 i jest przyjmowana dla każdego x ∈ ⟨-1, 2⟩.
  solution_steps:
  - 'Zinterpretuj wzór: wykres to łamana o wierzchołkach (-4, 4), (-1, -2), (2, -2), (4, 2).'
  - 'Zbiór wartości: najniższy poziom -2, najwyższy 4, wykres ciągły ⟹ ZW = ⟨-2, 4⟩.'
  - 'Miejsca zerowe: -2x - 4 = 0 ⟹ x = -2; 2x - 6 = 0 ⟹ x = 3; kawałek stały wartości -2 nie daje zera.'
  - 'Nierówność f(x) ≥ 1 rozwiąż na każdym kawałku osobno: x ≤ -5/2 oraz x ≥ 7/2, po przecięciu z dziedzinami
    kawałków: ⟨-4, -5/2⟩ ∪ ⟨7/2, 4⟩.'
  - 'W przedziale ⟨-3, 3⟩ porównaj kandydatów: f(-3) = 2, poziom -2 na ⟨-1, 2⟩, f(3) = 0.'
  - 'Zapisz: wartość największa 2 dla x = -3; wartość najmniejsza -2 dla każdego x ∈ ⟨-1, 2⟩.'
  answer:
    kind: MULTIPART
    parts:
    - name: zbior_wartosci
      answer:
        kind: INTERVAL
        lo: '-2'
        hi: '4'
        lo_open: false
        hi_open: false
    - name: miejsca_zerowe
      answer:
        kind: SET
        members:
        - '-2'
        - '3'
    - name: rozwiazanie_nierownosci
      answer:
        kind: SYMBOLIC
        latex: \langle -4,\ -\frac{5}{2} \rangle \cup \langle \frac{7}{2},\ 4 \rangle
    - name: wartosc_najwieksza
      answer:
        kind: NUMERIC
        value: 2.0
    - name: argument_najwiekszej
      answer:
        kind: NUMERIC
        value: -3.0
    - name: wartosc_najmniejsza
      answer:
        kind: NUMERIC
        value: -2.0
    - name: argumenty_najmniejszej
      answer:
        kind: SYMBOLIC
        latex: \langle -1,\ 2 \rangle
  checks:
  - kind: solve_equation
    expr: \left(-2 \cdot x - 4\right) \cdot \left(2 \cdot x - 6\right) = 0
    part: miejsca_zerowe
  - kind: evaluate
    expr: -2 \cdot \left(-3\right) - 4
    part: wartosc_najwieksza
  - kind: solve_equation
    expr: -2 \cdot x - 4 = 2
    part: argument_najwiekszej
  - kind: evaluate
    expr: 2 \cdot 2 - 6
    part: wartosc_najmniejsza
  skills:
  - odczyt zbioru wartości
  - wyznaczanie miejsc zerowych
  - rozwiązywanie nierówności f(x) ≥ a
  - wartość największa i najmniejsza w przedziale domkniętym
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: kind mismatch: answer=SYMBOLIC reference=INTERVAL'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 5
  exercise_type: odczyt własności funkcji nieciągłej, badanie istnienia wartości skrajnych
  statement: |-
    Funkcja g jest określona następująco:
    g(x) = x + 4 dla x ∈ ⟨-4, -1),  g(x) = -2 dla x ∈ ⟨-1, 2⟩,  g(x) = 2x - 6 dla x ∈ (2, 5⟩.
    Wykres funkcji g składa się z odcinka o końcach (-4, 0) [kropka pełna] i (-1, 3) [kropka pusta], odcinka poziomego o końcach (-1, -2) i (2, -2) [obie kropki pełne] oraz odcinka o końcach (2, -2) i (5, 4) [oba końce należą do wykresu, przy czym punkt (2, -2) jest wspólny z odcinkiem poziomym].
    a) Podaj zbiór wartości funkcji g.
    b) Podaj wszystkie miejsca zerowe funkcji g.
    c) Zapisz zbiór wszystkich argumentów, dla których g(x) > 0.
    d) Rozstrzygnij, czy w przedziale ⟨-4, -1⟩ funkcja g ma wartość najmniejszą i czy ma wartość największą. Podaj te wartości, o ile istnieją, wraz z argumentami, dla których są przyjmowane, i uzasadnij odpowiedź.
  statement_latex: g(x)=\left\{\begin{matrix} x + 4 & \text{dla } x \in \langle -4,\ -1) \\ -2 & \text{dla
    } x \in \langle -1,\ 2 \rangle \\ 2 \cdot x - 6 & \text{dla } x \in (2,\ 5 \rangle \end{matrix}\right.
  solution: |-
    a) Pierwszy fragment (rosnący) przyjmuje wartości od g(-4) = 0 (włącznie) do poziomu 3 (bez, bo argument -1 należy już do drugiego wzoru), czyli ⟨0, 3). Drugi fragment daje jedną wartość -2. Trzeci fragment rośnie od poziomu -2 (bez, bo x = 2 nie należy do (2, 5⟩) do g(5) = 4 (włącznie), czyli (-2, 4⟩. Suma: {-2} ∪ (-2, 4⟩ ∪ ⟨0, 3) = ⟨-2, 4⟩. Zatem ZW = ⟨-2, 4⟩.

    b) x + 4 = 0 daje x = -4 i -4 ∈ ⟨-4, -1), więc -4 jest miejscem zerowym. Wartość -2 nie jest zerem. 2x - 6 = 0 daje x = 3 i 3 ∈ (2, 5⟩. Miejsca zerowe: -4 oraz 3.

    c) Na pierwszym fragmencie x + 4 > 0 ⟺ x > -4, czyli x ∈ (-4, -1). Na drugim fragmencie wartość -2 < 0. Na trzecim 2x - 6 > 0 ⟺ x > 3, czyli x ∈ (3, 5⟩. Zatem g(x) > 0 dla x ∈ (-4, -1) ∪ (3, 5⟩.

    d) Rozważamy tylko fragment wykresu nad przedziałem ⟨-4, -1⟩. Dla x ∈ ⟨-4, -1) wartości to ⟨0, 3), a ponadto g(-1) = -2.
    Wartość najmniejsza istnieje i wynosi -2; jest przyjmowana dla x = -1.
    Wartości największej nie ma: wartości zbliżają się do 3, ale poziom 3 nie jest osiągany (punkt (-1, 3) nie należy do wykresu — kropka pusta), a dla dowolnego x₀ ∈ ⟨-4, -1) można wskazać argument bliższy -1, dla którego wartość jest większa niż g(x₀).
  solution_steps:
  - 'Ustal zbiory wartości poszczególnych fragmentów: ⟨0, 3), {-2}, (-2, 4⟩.'
  - 'Zsumuj je: ZW = ⟨-2, 4⟩.'
  - 'Rozwiąż g(x) = 0 na każdym fragmencie: x = -4 oraz x = 3.'
  - 'Wyznacz znak na każdym fragmencie: g(x) > 0 dla x ∈ (-4, -1) ∪ (3, 5⟩.'
  - 'W przedziale ⟨-4, -1⟩ zestaw wartości: ⟨0, 3) z fragmentu rosnącego oraz g(-1) = -2.'
  - 'Wnioski: wartość najmniejsza -2 dla x = -1; wartość największa nie istnieje z powodu kropki pustej
    w (-1, 3).'
  answer:
    kind: MULTIPART
    parts:
    - name: zbior_wartosci
      answer:
        kind: INTERVAL
        lo: '-2'
        hi: '4'
        lo_open: false
        hi_open: false
    - name: miejsca_zerowe
      answer:
        kind: SET
        members:
        - '-4'
        - '3'
    - name: argumenty_dodatnie
      answer:
        kind: SYMBOLIC
        latex: \left(-4,\ -1\right) \cup \left(3,\ 5 \right\rangle
    - name: wartosc_najmniejsza
      answer:
        kind: NUMERIC
        value: -2.0
    - name: argument_najmniejszej
      answer:
        kind: NUMERIC
        value: -1.0
    - name: czy_istnieje_najwieksza
      answer:
        kind: SYMBOLIC
        latex: nie istnieje
    - name: uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń musi uzasadnić, że w ⟨-4, -1⟩ wartości fragmentu rosnącego zbliżają się do 3, ale
          poziom 3 nie jest przyjmowany (punkt (-1, 3) nie należy do wykresu), więc dla każdego argumentu
          istnieje inny argument o większej wartości — wartość największa nie istnieje.
  checks:
  - kind: solve_equation
    expr: \left(x + 4\right) \cdot \left(2 \cdot x - 6\right) = 0
    part: miejsca_zerowe
  - kind: evaluate
    expr: -1 + 4 - 3
    part: wartosc_najmniejsza
  skills:
  - odczyt zbioru wartości z wykresu złożonego z kilku fragmentów
  - miejsca zerowe
  - przedziały stałego znaku
  - ocena istnienia wartości największej
  verification:
    checkability: DETERMINISTIC
    note: '[miejsca_zerowe] SymPy solved it fresh: 2 members matched ; [wartosc_najmniejsza] SymPy solved
      it fresh and disagrees: -2.0 vs 0.0 (tol 1e-09)'
