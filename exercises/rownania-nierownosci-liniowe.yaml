- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: rozwiązywanie nierówności liniowej
  statement: Rozwiąż nierówność \(5x - 3 > 12\). Zbiór wszystkich rozwiązań zapisz w postaci przedziału.
  statement_latex: 5\cdot x - 3 > 12
  solution: |-
    Przenosimy liczbę −3 na prawą stronę (zmieniając jej znak): 5x > 12 + 3, czyli 5x > 15.
    Dzielimy obie strony przez 5 — liczbę dodatnią — więc znak nierówności pozostaje bez zmian: x > 3.
    Zbiór rozwiązań: (3, +∞). Przy symbolu +∞ zawsze stoi nawias okrągły.
    Sprawdzenie: dla x = 4 mamy 5·4 − 3 = 17 > 12 ✓, a dla x = 0 mamy −3 > 12 — fałsz, więc 0 słusznie nie należy do zbioru rozwiązań.
  solution_steps:
  - 'Przenieś wyraz wolny na prawą stronę: 5x > 15.'
  - 'Podziel obie strony przez 5 (liczba dodatnia, znak bez zmian): x > 3.'
  - 'Zapisz zbiór rozwiązań jako przedział: (3, +∞).'
  - Sprawdź liczbą próbną x = 4.
  answer:
    kind: INTERVAL
    lo: '3'
    hi: +\infty
  checks:
  - kind: solve_inequality
    expr: 5\cdot x - 3 > 12
  skills:
  - przekształcanie nierówności liniowej
  - zapis przedziałowy zbioru rozwiązań
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: endpoints matched'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: klasyfikacja równania liniowego
  statement: Dane jest równanie \(5\left(x - 2\right) + 3 = 5x - 7\). Rozstrzygnij, czy to równanie jest
    oznaczone, sprzeczne, czy tożsamościowe, i podaj zbiór wszystkich jego rozwiązań.
  statement_latex: 5\cdot\left(x - 2\right) + 3 = 5\cdot x - 7
  solution: |-
    Usuwamy nawias po lewej stronie: 5x − 10 + 3 = 5x − 7, czyli 5x − 7 = 5x − 7.
    Przenosimy wyrazy z niewiadomą na lewą stronę, a liczby na prawą: 5x − 5x = −7 + 7, czyli 0·x = 0.
    Współczynnik przy x jest równy 0 i wyraz wolny również jest równy 0 — została prawdziwa równość liczbowa 0 = 0, która nie zależy od x.
    Odpowiedź: równanie jest tożsamościowe, spełnia je każda liczba rzeczywista, zbiór rozwiązań to R.
    Sprawdzenie: dla x = 1 mamy L = 5·(−1) + 3 = −2, P = 5 − 7 = −2 ✓.
  solution_steps:
  - 'Usuń nawias: 5x − 10 + 3 = 5x − 7.'
  - 'Zredukuj wyrazy podobne po lewej stronie: 5x − 7 = 5x − 7.'
  - 'Przenieś wyrazy z x na jedną stronę, liczby na drugą: 0·x = 0.'
  - Stwierdź, że równość 0 = 0 jest prawdziwa dla każdego x — równanie tożsamościowe.
  - 'Zapisz zbiór rozwiązań: R.'
  answer:
    kind: MULTIPART
    parts:
    - name: typ równania
      answer:
        kind: SYMBOLIC
        latex: \text{równanie tożsamościowe}
    - name: zbiór rozwiązań
      answer:
        kind: SYMBOLIC
        latex: \mathbb{R}
  skills:
  - redukcja wyrazów podobnych
  - rozpoznawanie równania tożsamościowego
  - zapis zbioru rozwiązań
  verification:
    checkability: REFERENCE_CALL
    note: 'could not compare: part disagrees: NOT_MACHINE_CHECKABLE: ''prose inside the expression'''
- id: g-th-02
