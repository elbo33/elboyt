- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: wyłączanie największego wspólnego czynnika jednomianowego
  statement: 'Zapisz w postaci iloczynu, wyłączając przed nawias największy wspólny czynnik: a) 12x^2y
    - 30xy^2, b) 5a^3 + 5a^2 - 10a.'
  statement_latex: \text{a) } 12\cdot x^{2}\cdot y - 30\cdot x\cdot y^{2},\qquad \text{b) } 5\cdot a^{3}
    + 5\cdot a^{2} - 10\cdot a
  solution: |-
    a) Współczynniki: 12 i 30, NWD(12, 30) = 6. Litera x: wykładniki 2 i 1, bierzemy x. Litera y: wykładniki 1 i 2, bierzemy y. Wyłączany jednomian to 6xy. Dzielimy: 12x^{2}y : 6xy = 2x, \left(-30xy^{2}\right) : 6xy = -5y. Zatem 12x^{2}y - 30xy^{2} = 6xy\left(2x - 5y\right). Sprawdzenie: 6xy·2x - 6xy·5y = 12x^{2}y - 30xy^{2}. ✓
    b) Współczynniki: 5, 5, 10, NWD = 5. Litera a występuje we wszystkich wyrazach, najniższy wykładnik to 1, więc wyłączamy 5a. Dzielimy: 5a^{3} : 5a = a^{2}, 5a^{2} : 5a = a, \left(-10a\right) : 5a = -2. Zatem 5a^{3} + 5a^{2} - 10a = 5a\left(a^{2} + a - 2\right). W nawiasie są trzy wyrazy — tyle, ile w sumie wyjściowej. Sprawdzenie: 5a·a^{2} + 5a·a - 5a·2 = 5a^{3} + 5a^{2} - 10a. ✓
  solution_steps:
  - a) Oblicz NWD(12, 30) = 6.
  - 'a) Weź x i y w najniższych wykładnikach: x^1 i y^1, czyli czynnik 6xy.'
  - 'a) Podziel wyrazy: 12x^2y : 6xy = 2x, (−30xy^2) : 6xy = −5y, więc 12x^2y − 30xy^2 = 6xy(2x − 5y).'
  - 'b) Oblicz NWD(5, 5, 10) = 5 i weź a w najniższym wykładniku: czynnik 5a.'
  - 'b) Podziel wyrazy: 5a^3 : 5a = a^2, 5a^2 : 5a = a, (−10a) : 5a = −2.'
  - 'b) Zapisz wynik: 5a^3 + 5a^2 − 10a = 5a(a^2 + a − 2) i sprawdź przez wymnożenie.'
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: SYMBOLIC
        latex: 6\cdot x\cdot y\left(2\cdot x - 5\cdot y\right)
    - name: b
      answer:
        kind: SYMBOLIC
        latex: 5\cdot a\left(a^{2} + a - 2\right)
  checks:
  - kind: simplify
    expr: 12\cdot x^{2}\cdot y - 30\cdot x\cdot y^{2}
    part: a
  - kind: simplify
    expr: 5\cdot a^{3} + 5\cdot a^{2} - 10\cdot a
    var: a
    part: b
  skills:
  - NWD współczynników
  - najniższe wykładniki zmiennych
  - poprawny zapis jedynki w nawiasie
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [a] SymPy solved it fresh: ''6\\cdot x\\cdot y\\left(2\\cdot
      x - 5\\cdot y\\right)'' vs ''6*x*y*(2*x - 5*y)'' ; [b] SymPy solved it fresh: ''5\\cdot a\\left(a^{2}
      + a - 2\\right)'' vs ''5*a*(a**2 + a - 2)'''
- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: wyłączanie czynnika ujemnego, wspólnego nawiasu i potęgi liczby
  statement: a) Zapisz wyrażenie -8x^3y + 12x^2y^2 - 4x^2y w postaci iloczynu, wyłączając przed nawias
    czynnik ujemny. b) Rozłóż na czynniki wyrażenie 3a(a + 7) - (a + 7). c) Oblicz wartość liczby 3^{21}
    - 3^{19} i zapisz wynik w postaci iloczynu liczby naturalnej i potęgi liczby 3.
  statement_latex: \text{a) } -8\cdot x^{3}\cdot y + 12\cdot x^{2}\cdot y^{2} - 4\cdot x^{2}\cdot y,\qquad
    \text{b) } 3\cdot a\left(a + 7\right) - \left(a + 7\right),\qquad \text{c) } 3^{21} - 3^{19}
  solution: |-
    a) Współczynniki 8, 12, 4 mają NWD = 4. Litera x: wykładniki 3, 2, 2 → x^{2}. Litera y: wykładniki 1, 2, 1 → y. Największy wspólny jednomian to 4x^{2}y, a ponieważ mamy wyłączyć czynnik ujemny, bierzemy -4x^{2}y. Dzielimy: \left(-8x^{3}y\right) : \left(-4x^{2}y\right) = 2x, \;12x^{2}y^{2} : \left(-4x^{2}y\right) = -3y, \;\left(-4x^{2}y\right) : \left(-4x^{2}y\right) = 1. Zatem -8x^{3}y + 12x^{2}y^{2} - 4x^{2}y = -4x^{2}y\left(2x - 3y + 1\right). Sprawdzenie: -4x^{2}y·2x = -8x^{3}y, -4x^{2}y·(-3y) = 12x^{2}y^{2}, -4x^{2}y·1 = -4x^{2}y. ✓
    b) Drugi wyraz to 1·(a + 7). Wspólnym czynnikiem jest nawias (a + 7): 3a(a + 7) - 1·(a + 7) = \left(a + 7\right)\left(3a - 1\right). Sprawdzenie: (a+7)(3a-1) = 3a^{2} - a + 21a - 7 = 3a^{2} + 20a - 7 oraz 3a(a+7) - (a+7) = 3a^{2} + 21a - a - 7. ✓
    c) Najniższa potęga to 3^{19}, a 3^{21} = 3^{19}\cdot 3^{2} = 9\cdot 3^{19}. Stąd 3^{21} - 3^{19} = 3^{19}\left(9 - 1\right) = 8\cdot 3^{19}.
  solution_steps:
  - 'a) Wyznacz największy wspólny jednomian: NWD(8,12,4) = 4, x w potędze 2, y w potędze 1 — czyli 4x^2y.'
  - 'a) Dopisz minus: wyłączasz −4x^2y i dzielisz przez niego każdy wyraz (znaki się zmieniają).'
  - 'a) Zapisz wynik: −8x^3y + 12x^2y^2 − 4x^2y = −4x^2y(2x − 3y + 1); pamiętaj o jedynce.'
  - b) Zauważ, że drugi wyraz to 1·(a + 7), więc wspólnym czynnikiem jest nawias (a + 7).
  - 'b) Wyłącz (a + 7): 3a(a + 7) − 1·(a + 7) = (a + 7)(3a − 1).'
  - 'c) Wyłącz najniższą potęgę 3^19: 3^21 − 3^19 = 3^19(3^2 − 1) = 3^19·8 = 8·3^19.'
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: SYMBOLIC
        latex: -4\cdot x^{2}\cdot y\left(2\cdot x - 3\cdot y + 1\right)
    - name: b
      answer:
        kind: SYMBOLIC
        latex: \left(a + 7\right)\left(3\cdot a - 1\right)
    - name: c
      answer:
        kind: SYMBOLIC
        latex: 8\cdot 3^{19}
  checks:
  - kind: simplify
    expr: -8\cdot x^{3}\cdot y + 12\cdot x^{2}\cdot y^{2} - 4\cdot x^{2}\cdot y
    part: a
  - kind: simplify
    expr: 3\cdot a\left(a + 7\right) - \left(a + 7\right)
    var: a
    part: b
  - kind: evaluate
    expr: 3^{21} - 3^{19}
    part: c
  skills:
  - wyłączanie czynnika ujemnego
  - wspólny czynnik w postaci nawiasu
  - wyłączanie potęgi liczby
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [a] SymPy solved it fresh: ''-4\\cdot x^{2}\\cdot y\\left(2\\cdot
      x - 3\\cdot y + 1\\right)'' vs ''4*x**2*y*(-2*x + 3*y - 1)'' ; [b] SymPy solved it fresh: ''\\left(a
      + 7\\right)\\left(3\\cdot a - 1\\right)'' vs ''3*a*(a + 7) - a - 7'' ; [c] SymPy solved it fresh:
      9298091736.0 vs 9298091736.0 (tol 1e-09)'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: grupowanie i równanie iloczynowe
  statement: a) Rozłóż na czynniki metodą grupowania wyrażenie x^3 + 3x^2 + 4x + 12. b) Rozwiąż równanie
    3x^2 = 12x. c) Wyjaśnij, dlaczego przy rozwiązywaniu równania z punktu b) nie wolno podzielić obu
    jego stron przez x.
  statement_latex: \text{a) } x^{3} + 3\cdot x^{2} + 4\cdot x + 12,\qquad \text{b) } 3\cdot x^{2} = 12\cdot
    x
  solution: |-
    a) Wszystkie cztery wyrazy nie mają wspólnego czynnika, więc grupujemy pierwsze dwa i ostatnie dwa: \left(x^{3} + 3x^{2}\right) + \left(4x + 12\right). W pierwszej grupie wyłączamy x^{2}: x^{2}\left(x + 3\right); w drugiej wyłączamy 4: 4\left(x + 3\right). Powstał ten sam nawias (x + 3), więc wyłączamy go: x^{2}(x+3) + 4(x+3) = \left(x + 3\right)\left(x^{2} + 4\right). Sprawdzenie: (x+3)(x^{2}+4) = x^{3} + 4x + 3x^{2} + 12. ✓
    b) Przenosimy wszystko na jedną stronę: 3x^{2} - 12x = 0. Wyłączamy 3x: 3x\left(x - 4\right) = 0. Iloczyn jest zerem, gdy 3x = 0 lub x - 4 = 0, czyli x = 0 lub x = 4.
    c) Dzielenie obu stron przez x jest dozwolone tylko wtedy, gdy x \neq 0. Liczba 0 spełnia to równanie (3·0^{2} = 12·0), więc po podzieleniu przez x rozwiązanie x = 0 zostałoby zgubione i otrzymalibyśmy tylko x = 4.
  solution_steps:
  - a) Sprawdź, że wszystkie cztery wyrazy nie mają wspólnego czynnika.
  - 'a) Pogrupuj: (x^3 + 3x^2) + (4x + 12).'
  - 'a) Wyłącz w grupach: x^2(x + 3) + 4(x + 3).'
  - 'a) Wyłącz wspólny nawias: (x + 3)(x^2 + 4) i sprawdź przez wymnożenie.'
  - 'b) Przenieś wszystko na jedną stronę: 3x^2 − 12x = 0.'
  - 'b) Wyłącz 3x: 3x(x − 4) = 0.'
  - 'b) Zastosuj warunek iloczyn = 0: x = 0 lub x = 4.'
  - c) Uzasadnij, że dzielenie przez x wymaga założenia x ≠ 0 i gubi rozwiązanie x = 0.
  answer:
    kind: MULTIPART
    parts:
    - name: a
      answer:
        kind: SYMBOLIC
        latex: \left(x + 3\right)\left(x^{2} + 4\right)
    - name: b
      answer:
        kind: SET
        members:
        - '0'
        - '4'
    - name: c
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń ma wyjaśnić, że dzielenie stron równania przez x wymaga założenia x ≠ 0, a liczba
          0 spełnia to równanie, więc dzielenie prowadzi do utraty rozwiązania x = 0.
  checks:
  - kind: simplify
    expr: x^{3} + 3\cdot x^{2} + 4\cdot x + 12
    part: a
  - kind: solve_equation
    expr: 3\cdot x^{2} = 12\cdot x
    part: b
  skills:
  - rozkład przez grupowanie
  - równanie iloczynowe
  - uzasadnianie zakazu dzielenia przez niewiadomą
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: c · 2/2 other parts solved fresh'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: rozkład na czynniki przez grupowanie + równanie iloczynowe
  statement: |-
    Dane jest wyrażenie W\left(x\right)=2x^{3}-6x^{2}-5x+15.
    a) Rozłóż wyrażenie W\left(x\right) na czynniki, stosując metodę grupowania wyrazów.
    b) Rozwiąż równanie W\left(x\right)=0.
  statement_latex: W\left(x\right)=2\cdot x^{3}-6\cdot x^{2}-5\cdot x+15
  solution: |-
    a) Grupujemy dwa pierwsze i dwa ostatnie wyrazy:
    2x^{3}-6x^{2}-5x+15=\left(2x^{3}-6x^{2}\right)+\left(-5x+15\right).
    W pierwszej grupie wspólnym czynnikiem jest 2x^{2}: 2x^{3}-6x^{2}=2x^{2}\left(x-3\right).
    W drugiej grupie wyłączamy czynnik ujemny -5, aby otrzymać ten sam nawias: -5x+15=-5\left(x-3\right).
    Zatem W\left(x\right)=2x^{2}\left(x-3\right)-5\left(x-3\right)=\left(x-3\right)\left(2x^{2}-5\right).
    Sprawdzenie: \left(x-3\right)\left(2x^{2}-5\right)=2x^{3}-5x-6x^{2}+15=2x^{3}-6x^{2}-5x+15. ✓

    b) Iloczyn jest równy zeru, gdy co najmniej jeden czynnik jest zerem:
    x-3=0 lub 2x^{2}-5=0.
    Z pierwszego równania x=3.
    Z drugiego: 2x^{2}=5, czyli x^{2}=\frac{5}{2}, więc x=\sqrt{\frac{5}{2}}=\frac{\sqrt{10}}{2} lub x=-\frac{\sqrt{10}}{2}.
    Równanie ma trzy rozwiązania: x=3,\ x=\frac{\sqrt{10}}{2},\ x=-\frac{\sqrt{10}}{2}.
  solution_steps:
  - 'Podziel cztery wyrazy na dwie grupy: (2x^3 - 6x^2) oraz (-5x + 15).'
  - W pierwszej grupie wyłącz 2x^2, otrzymując 2x^2(x-3).
  - W drugiej grupie wyłącz czynnik ujemny -5, otrzymując -5(x-3) — nawiasy są teraz identyczne.
  - 'Wyłącz wspólny nawias: W(x) = (x-3)(2x^2-5); sprawdź rozkład przez wymnożenie.'
  - Zapisz równanie iloczynowe (x-3)(2x^2-5)=0 i przyrównaj każdy czynnik do zera.
  - Rozwiąż x-3=0 oraz 2x^2-5=0, otrzymując x=3, x=\frac{\sqrt{10}}{2}, x=-\frac{\sqrt{10}}{2}.
  answer:
    kind: MULTIPART
    parts:
    - name: rozklad
      answer:
        kind: SYMBOLIC
        latex: \left(x-3\right)\left(2\cdot x^{2}-5\right)
    - name: rozwiazania
      answer:
        kind: SET
        members:
        - '3'
        - \frac{\sqrt{10}}{2}
        - -\frac{\sqrt{10}}{2}
  checks:
  - kind: simplify
    expr: 2\cdot x^{2}\cdot\left(x-3\right)-5\cdot\left(x-3\right)
    part: rozklad
  - kind: solve_equation
    expr: 2\cdot x^{3}-6\cdot x^{2}-5\cdot x+15=0
    part: rozwiazania
  skills:
  - grupowanie wyrazów
  - wyłączanie czynnika ujemnego
  - rozkład na czynniki
  - równanie iloczynowe
  - sprawdzenie rozkładu przez wymnożenie
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [rozklad] SymPy solved it fresh: ''\\left(x-3\\right)\\left(2\\cdot
      x^{2}-5\\right)'' vs ''2*x**2*(x - 3) - 5*x + 15'' ; [rozwiazania] SymPy solved it fresh: 3 members
      matched'
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: wyłączanie jednomianu ujemnego, wartość liczbowa, potęgi
  statement: |-
    a) Zapisz wyrażenie -8a^{3}b^{2}+12a^{2}b^{3}-4a^{2}b^{2} w postaci iloczynu, wyłączając przed nawias czynnik ujemny.
    b) Korzystając z otrzymanej postaci iloczynowej, oblicz wartość tego wyrażenia dla a=2 oraz b=-1.
    c) Oblicz bez użycia kalkulatora wartość wyrażenia \frac{5^{21}-5^{19}}{24\cdot 5^{18}}.
  statement_latex: -8\cdot a^{3}\cdot b^{2}+12\cdot a^{2}\cdot b^{3}-4\cdot a^{2}\cdot b^{2},\qquad \frac{5^{21}-5^{19}}{24\cdot
    5^{18}}
  solution: |-
    a) Współczynniki: 8, 12, 4 — NWD(8,12,4)=4. Litera a występuje w wykładnikach 3, 2, 2, więc bierzemy a^{2}. Litera b występuje w wykładnikach 2, 3, 2, więc bierzemy b^{2}. Największy wspólny czynnik jednomianowy to 4a^{2}b^{2}; ponieważ pierwszy wyraz jest ujemny, wyłączamy -4a^{2}b^{2}.
    Dzielimy każdy wyraz przez -4a^{2}b^{2}:
    \left(-8a^{3}b^{2}\right):\left(-4a^{2}b^{2}\right)=2a,\quad 12a^{2}b^{3}:\left(-4a^{2}b^{2}\right)=-3b,\quad \left(-4a^{2}b^{2}\right):\left(-4a^{2}b^{2}\right)=1.
    Zatem -8a^{3}b^{2}+12a^{2}b^{3}-4a^{2}b^{2}=-4a^{2}b^{2}\left(2a-3b+1\right).
    Sprawdzenie: -4a^{2}b^{2}\cdot 2a=-8a^{3}b^{2}; -4a^{2}b^{2}\cdot\left(-3b\right)=12a^{2}b^{3}; -4a^{2}b^{2}\cdot 1=-4a^{2}b^{2}. ✓

    b) Dla a=2, b=-1: -4\cdot 2^{2}\cdot\left(-1\right)^{2}\cdot\left(2\cdot 2-3\cdot\left(-1\right)+1\right)=-16\cdot\left(4+3+1\right)=-16\cdot 8=-128.

