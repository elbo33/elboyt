  exercise_type: 'Modelowanie: dwa sześciany, masa i suma krawędzi, układ równań symetrycznych'
  statement: Dwa klocki mają kształt sześcianów i są wykonane z tego samego jednorodnego drewna o gęstości
    \(0{,}8\ \frac{\mathrm{g}}{\mathrm{cm}^{3}}\). Łączna masa obu klocków jest równa \(121{,}6\ \mathrm{g}\),
    a suma długości wszystkich krawędzi obu klocków wynosi \(96\ \mathrm{cm}\). Oblicz długości krawędzi
    obu klocków oraz stosunek pola powierzchni całkowitej klocka większego do pola powierzchni całkowitej
    klocka mniejszego.
  statement_latex: \begin{cases} a^{3}+b^{3}=\frac{121{,}6}{0{,}8} \\ 12\cdot a+12\cdot b=96 \end{cases}
  solution: |-
    Oznaczmy przez \(a\) i \(b\) długości krawędzi klocków (w centymetrach), przy czym \(a<b\), \(a>0\), \(b>0\).
    Łączna objętość drewna: \(V=\frac{121{,}6}{0{,}8}=152\ \mathrm{cm}^{3}\), zatem \(a^{3}+b^{3}=152\).
    Suma długości wszystkich krawędzi: \(12a+12b=96\), czyli \(a+b=8\).
    Korzystamy z tożsamości \(\left(a+b\right)^{3}=a^{3}+b^{3}+3ab\left(a+b\right)\):
    \(512=152+3ab\cdot 8\), stąd \(24ab=360\), czyli \(ab=15\).
    Liczby \(a\) i \(b\) są więc pierwiastkami równania \(t^{2}-8t+15=0\). Wyróżnik \(\Delta=64-60=4\), \(\sqrt{\Delta}=2\), zatem \(t_{1}=\frac{8-2}{2}=3\), \(t_{2}=\frac{8+2}{2}=5\). Oba pierwiastki są dodatnie, więc krawędź mniejszego klocka ma \(3\ \mathrm{cm}\), a większego \(5\ \mathrm{cm}\).
    Dowolne dwa sześciany są podobne, a skala podobieństwa (większy do mniejszego) wynosi \(k=\frac{5}{3}\).
    Stosunek pól powierzchni całkowitych: \(\frac{P_{\text{w}}}{P_{\text{m}}}=k^{2}=\left(\frac{5}{3}\right)^{2}=\frac{25}{9}\).
    Sprawdzenie: \(3^{3}+5^{3}=27+125=152\) ✓, \(12\cdot\left(3+5\right)=96\) ✓.
    Odpowiedź: krawędzie mają długości \(3\ \mathrm{cm}\) i \(5\ \mathrm{cm}\), a stosunek pól wynosi \(\frac{25}{9}\) (czyli \(25:9\)).
  solution_steps:
  - Wprowadź zmienne a<b — długości krawędzi sześcianów.
  - 'Zamień masę na objętość: \frac{121{,}6}{0{,}8}=152, więc a^{3}+b^{3}=152.'
  - Z sumy krawędzi 12a+12b=96 otrzymaj a+b=8.
  - Z tożsamości \left(a+b\right)^{3}=a^{3}+b^{3}+3ab\left(a+b\right) wyznacz ab=15.
  - 'Rozwiąż t^{2}-8t+15=0: t=3 lub t=5; mniejszy klocek ma krawędź 3 cm, większy 5 cm.'
  - Sześciany są podobne w skali k=\frac{5}{3}, więc \frac{P_{\text{w}}}{P_{\text{m}}}=k^{2}=\frac{25}{9}.
  answer:
    kind: MULTIPART
    parts:
    - name: krawedz_mniejszego
      answer:
        kind: NUMERIC
        value: 3.0
    - name: krawedz_wiekszego
