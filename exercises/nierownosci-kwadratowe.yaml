  statement: Podstawa pewnego trójkąta jest o 3 cm dłuższa od wysokości opuszczonej na tę podstawę, a
    pole tego trójkąta jest nie większe niż 20 cm^{2}. Wyznacz zbiór wszystkich możliwych długości tej
    wysokości oraz podaj największą możliwą długość podstawy tego trójkąta. Zapisz obliczenia.
  statement_latex: \frac{h\cdot\left(h+3\right)}{2} \leq 20, \qquad h > 0
  solution: |-
    Oznaczmy przez h (w centymetrach) długość wysokości opuszczonej na rozważaną podstawę. Wtedy podstawa ma długość h+3, a z warunków zadania h>0.
    Pole trójkąta: P=\frac{h\cdot\left(h+3\right)}{2}. Warunek zadania:
    \frac{h\left(h+3\right)}{2}\le 20 \;\Longleftrightarrow\; h^{2}+3h\le 40 \;\Longleftrightarrow\; h^{2}+3h-40\le 0.
    \Delta=3^{2}-4\cdot 1\cdot\left(-40\right)=9+160=169, \sqrt{\Delta}=13.
    h_{1}=\frac{-3-13}{2}=-8, \qquad h_{2}=\frac{-3+13}{2}=5.
    Ponieważ a=1>0 i nierówność jest typu \le, mamy h\in\left\langle -8,5\right\rangle.
    Długość wysokości musi być dodatnia, więc z uwzględnieniem warunku h>0 otrzymujemy
    h\in\left(0,5\right\rangle.
    Podstawa ma długość h+3, a największa dopuszczalna wysokość to 5 cm, zatem największa możliwa długość podstawy wynosi 5+3=8 cm (wtedy pole jest równe \frac{5\cdot 8}{2}=20 cm^{2}).
  solution_steps:
  - Oznacz wysokość przez h; podstawa ma wtedy długość h+3, przy czym h>0.
  - 'Zapisz pole: P=\frac{h\cdot\left(h+3\right)}{2} i warunek \frac{h\left(h+3\right)}{2}\le 20.'
  - Sprowadź do postaci h^{2}+3h-40\le 0.
  - Oblicz \Delta=169 oraz h_{1}=-8, h_{2}=5; stąd h\in\left\langle -8,5\right\rangle.
  - 'Odrzuć wartości niedodatnie: h\in\left(0,5\right\rangle.'
  - 'Największa podstawa: h+3 dla h=5, czyli 8 cm.'
