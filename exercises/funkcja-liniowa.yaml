- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'modelowanie funkcją liniową: wzór, dziedzina i kontrola ograniczenia'
  statement: Do pustoszejącego basenu ogrodowego w kształcie prostopadłościanu o wymiarach dna 2 m × 1,5
    m i wysokości 1,8 m wlewa się wodę ze stałą wydajnością. W chwili rozpoczęcia nalewania (t = 0) wysokość
    słupa wody wynosiła 20 cm, a po 12 minutach nalewania — 50 cm. Wysokość h słupa wody (w centymetrach)
    jest funkcją liniową czasu t nalewania (w minutach). a) Wyznacz wzór funkcji h oraz jej dziedzinę,
    czyli przedział czasu, w którym ten wzór opisuje napełnianie tego zbiornika (od chwili t = 0 do chwili,
    w której woda sięgnie górnej krawędzi zbiornika). b) Oblicz, po ilu minutach od rozpoczęcia nalewania
    woda sięgnie górnej krawędzi zbiornika, i rozstrzygnij, czy przy nieprzerwanym nalewaniu woda zacznie
    się przelewać przed upływem 70 minut. Zapisz obliczenia.
  statement_latex: h\left(t\right) = a\cdot t + b,\qquad h\left(0\right) = 20,\qquad h\left(12\right)
    = 50,\qquad h\left(t\right) \le 180
  solution: |-
    Przyjmujemy h\left(t\right) = a\cdot t + b, gdzie t — czas w minutach, h — wysokość w centymetrach.
    Z warunku h\left(0\right) = 20 mamy b = 20.
    Z warunku h\left(12\right) = 50: a = \frac{50 - 20}{12 - 0} = \frac{30}{12} = \frac{5}{2}, czyli woda przybywa o 2,5 cm na minutę.
    Zatem h\left(t\right) = \frac{5}{2}\cdot t + 20.
    Wysokość zbiornika to 1,8 m = 180 cm, więc wzór opisuje napełnianie dopóki h\left(t\right) \le 180.
    Rozwiązujemy \frac{5}{2}\cdot t + 20 = 180: \frac{5}{2}\cdot t = 160, stąd t = 64.
    Dziedziną jest więc przedział \left\langle 0,\ 64 \right\rangle (t w minutach).
    Woda sięgnie górnej krawędzi po 64 minutach, a ponieważ 64 < 70, przy nieprzerwanym nalewaniu woda zacznie się przelewać przed upływem 70 minut.
    Sprawdzenie: h\left(64\right) = \frac{5}{2}\cdot 64 + 20 = 160 + 20 = 180.
  solution_steps:
  - Wprowadź zmienną t (czas w minutach) i przyjmij h\left(t\right) = a\cdot t + b, gdzie h jest wysokością
    w centymetrach.
  - Z warunku h\left(0\right) = 20 odczytaj b = 20.
  - Oblicz a = \frac{50 - 20}{12 - 0} = \frac{5}{2}.
  - Zapisz wzór h\left(t\right) = \frac{5}{2}\cdot t + 20.
  - 'Zamień wysokość zbiornika na centymetry: 1,8 m = 180 cm, i rozwiąż \frac{5}{2}\cdot t + 20 = 180,
    otrzymując t = 64.'
  - 'Zapisz dziedzinę \left\langle 0,\ 64 \right\rangle i porównaj 64 z 70: 64 < 70, więc woda zacznie
    się przelewać przed upływem 70 minut.'
