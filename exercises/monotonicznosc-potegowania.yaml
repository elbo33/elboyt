  exercise_type: zalozenia_twierdzenia_o_monotonicznosci
  statement: 'Kasia twierdzi, że: (1) z równości 1^{x} = 1^{5} wynika, że x = 5, oraz (2) skoro 3 < 4,
    to na mocy monotoniczności potęgowania \left(-2\right)^{3} < \left(-2\right)^{4}. Rozstrzygnij (TAK/NIE),
    czy z równości 1^{x} = 1^{5} wynika x = 5, oblicz wartości liczb \left(-2\right)^{3} i \left(-2\right)^{4}
    oraz wyjaśnij, dlaczego w żadnym z tych przypadków nie wolno powoływać się na monotoniczność potęgowania.'
  statement_latex: 1^{x} = 1^{5}, \qquad \left(-2\right)^{3} \;\square\; \left(-2\right)^{4}
  solution: |-
    BŁĘDNE ROZUMOWANIE: Kasia stosuje twierdzenia „a^{x_{1}} = a^{x_{2}} \iff x_{1} = x_{2}” oraz „x_{1} < x_{2} \Rightarrow a^{x_{1}} < a^{x_{2}}” do podstaw a = 1 i a = -2.
    GDZIE JEST BŁĄD: oba twierdzenia mają założenia a > 0 oraz a \neq 1.
    (1) Dla a = 1 mamy 1^{x} = 1 dla każdego x, więc równość 1^{x} = 1^{5} jest prawdziwa dla KAŻDEJ liczby rzeczywistej x (np. x = 0 albo x = -7). Nie wynika z niej x = 5 — odpowiedź NIE.
    (2) Dla podstawy ujemnej potęgowanie w ogóle nie jest funkcją monotoniczną: \left(-2\right)^{3} = -8, \left(-2\right)^{4} = 16, ale \left(-2\right)^{5} = -32, więc wartości „skaczą” raz na plus, raz na minus. Sama nierówność -8 < 16 jest prawdziwa (wynika po prostu z obliczenia obu liczb), ale NIE wolno jej uzasadniać monotonicznością potęgowania — dla podstawy ujemnej ta reguła nie obowiązuje.
    WNIOSEK: monotoniczność i różnowartościowość potęgowania stosujemy wyłącznie dla a > 0 i a \neq 1.
  solution_steps:
  - 'Błędnie: zastosowanie twierdzeń o monotoniczności do podstaw a = 1 i a = -2.'
  - 'Przypomnij założenia twierdzeń: a > 0 oraz a \neq 1.'
  - '(1) Zauważ, że 1^{x} = 1 dla każdego x, więc równość 1^{x} = 1^{5} spełnia każda liczba rzeczywista
    — wniosek x = 5 jest nieuprawniony: NIE.'
  - (2) Oblicz \left(-2\right)^{3} = -8 oraz \left(-2\right)^{4} = 16.
  - (2) Zauważ, że kolejne potęgi liczby -2 zmieniają znak (np. \left(-2\right)^{5} = -32), więc ciąg
    potęg nie jest monotoniczny i reguły nie stosujemy.
  answer:
    kind: MULTIPART
    parts:
    - name: czy z rownosci 1^{x} = 1^{5} wynika x = 5
