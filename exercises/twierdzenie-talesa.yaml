  statement: 'W trójkącie ABC punkt D leży na boku AB, a punkt E na boku AC, przy czym DE ∥ BC oraz |AD|
    : |DB| = 3 : 5. Bok AC ma długość 24 cm. Uczeń napisał: „skoro |AD| : |DB| = 3 : 5, to |AE| = \frac{3}{5}\cdot|AC|
    = \frac{3}{5}\cdot 24 = 14{,}4 cm”. Wskaż błąd w tym rozumowaniu oraz oblicz poprawne długości odcinków
    AE i EC.'
  statement_latex: '|AE|=\frac{3}{3+5}\cdot 24,\qquad |EC|=\frac{5}{3+5}\cdot 24'
  solution: |-
    Rozumowanie ucznia (błędne). Uczeń potraktował stosunek 3 : 5 jak stosunek części do CAŁOŚCI i policzył |AE| = \frac{3}{5}\cdot 24 = 14{,}4 cm.
    Gdzie tkwi błąd. Zapis |AD| : |DB| = 3 : 5 oznacza stosunek CZĘŚCI DO CZĘŚCI. Przyjmijmy |AD| = 3t, |DB| = 5t; wtedy cały bok |AB| = 3t + 5t = 8t, więc |AD| : |AB| = 3 : 8, a nie 3 : 5. Trzeba dodać części, czyli uzupełnić proporcję do całości.
    Poprawne rozwiązanie. Z twierdzenia Talesa (DE ∥ BC) punkt E dzieli bok AC w tym samym stosunku 3 : 5, zatem
    |AE| = \frac{3}{3+5}\cdot|AC| = \frac{3}{8}\cdot 24 = 9\ \text{cm},
    |EC| = \frac{5}{3+5}\cdot 24 = \frac{5}{8}\cdot 24 = 15\ \text{cm}.
