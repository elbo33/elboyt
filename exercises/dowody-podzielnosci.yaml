    Dlaczego to błąd: w twierdzeniu o dzieleniu z resztą reszta r musi spełniać 0 \le r < b. Liczba -3 jest ujemna, a liczba 4 nie jest mniejsza od dzielnika 4 — żadna z nich nie może być resztą z dzielenia przez 5 (odpowiednio przez 4).

    Poprawnie:
    (1) -23 = 5\cdot\left(-5\right)+2, bo 5\cdot\left(-5\right) = -25 oraz -23-\left(-25\right) = 2 i 0 \le 2 < 5. Reszta wynosi 2.
