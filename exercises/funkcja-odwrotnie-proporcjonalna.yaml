- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: rozpoznanie proporcjonalności odwrotnej z tabeli
  statement: 'W tabeli zestawiono odpowiadające sobie wartości wielkości x i y: dla x=2 jest y=30, dla
    x=5 jest y=12, dla x=6 jest y=10, a dla x=4 wartość y nie została podana. Rozstrzygnij, czy wielkości
    x i y są odwrotnie proporcjonalne (odpowiedz TAK lub NIE), wyznacz współczynnik proporcjonalności
    a oraz brakującą wartość y dla x=4.'
  statement_latex: x\cdot y = a,\qquad \left(2;\,30\right),\ \left(5;\,12\right),\ \left(6;\,10\right),\
    \left(4;\,?\right)
  solution: 'Obliczamy iloczyny odpowiadających sobie wartości: 2\cdot 30=60, 5\cdot 12=60, 6\cdot 10=60.
    Wszystkie iloczyny są równe tej samej liczbie 60\neq 0, zatem wielkości są odwrotnie proporcjonalne,
    a współczynnik proporcjonalności wynosi a=60. Wzór zależności to y=\frac{60}{x}. Dla x=4 mamy y=\frac{60}{4}=15.'
  solution_steps:
  - 'Oblicz iloczyny x\cdot y dla wszystkich pełnych par: 2\cdot 30=60, 5\cdot 12=60, 6\cdot 10=60.'
  - Stwierdź, że iloczyny są stałe i równe 60, więc wielkości są odwrotnie proporcjonalne, a=60.
  - Zapisz wzór y=\frac{60}{x}.
  - 'Oblicz brakującą wartość: y=\frac{60}{4}=15.'
  answer:
    kind: MULTIPART
    parts:
    - name: czy odwrotnie proporcjonalne
      answer:
        kind: BOOLEAN
        latex: TAK
        truth: true
    - name: wspolczynnik a
      answer:
        kind: NUMERIC
        value: 60.0
        latex: a=60
    - name: y dla x=4
      answer:
        kind: NUMERIC
        value: 15.0
        latex: y=15
  checks:
  - kind: evaluate
    expr: 2 \cdot 30
    part: wspolczynnik a
  - kind: evaluate
    expr: \frac{60}{4}
    part: y dla x=4
