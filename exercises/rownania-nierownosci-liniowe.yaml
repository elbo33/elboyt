  statement: Rozwiąż nierówność \(-x + 1 < 4\). Zbiór wszystkich rozwiązań zapisz w postaci przedziału.
  statement_latex: -x + 1 < 4
  solution: |-
    Przenosimy 1 na prawą stronę: −x < 4 − 1, czyli −x < 3.
    Dzielimy obie strony przez −1 — liczbę ujemną — więc ODWRACAMY znak nierówności: x > −3.
    Zbiór rozwiązań: (−3, +∞). Kraniec −3 nie należy do zbioru, bo nierówność jest ostra.
    Sprawdzenie: dla x = 0 mamy 0 + 1 = 1 < 4 ✓; dla x = −5 mamy 5 + 1 = 6 < 4 — fałsz ✓.
  solution_steps:
  - 'Przenieś 1 na prawą stronę: −x < 3.'
  - 'Podziel obie strony przez −1 i odwróć znak nierówności: x > −3.'
  - 'Zapisz zbiór rozwiązań: (−3, +∞).'
  - Sprawdź liczbą próbną x = 0.
  answer:
    kind: INTERVAL
    lo: '-3'
    hi: +\infty
  checks:
  - kind: solve_inequality
    expr: -x + 1 < 4
  skills:
  - mnożenie/dzielenie nierówności przez liczbę ujemną
  - zapis przedziałowy
