- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 2
  difficulty: 2
  exercise_type: przekrój płaski kuli
  statement: Kulę o środku O i promieniu R = 10 cm przecięto płaszczyzną, której odległość od środka O
    jest równa d = 6 cm. Oblicz promień otrzymanego koła przekroju oraz jego pole.
  statement_latex: r = \sqrt{R^{2}-d^{2}} = \sqrt{10^{2}-6^{2}},\qquad P = \pi r^{2}
  solution: |-
    Krok 1. Rozpatrujemy przekrój kuli płaszczyzną przechodzącą przez środek O i prostopadłą do danej płaszczyzny. Powstaje trójkąt prostokątny o przeciwprostokątnej R = 10 i przyprostokątnych d = 6 oraz r.
    Krok 2. Z twierdzenia Pitagorasa: r^{2} = R^{2} - d^{2} = 100 - 36 = 64, więc r = 8 cm.
    Krok 3. Pole koła przekroju: P = \pi r^{2} = \pi\cdot 64 = 64\pi\ \text{cm}^{2}.
    Sprawdzenie: r = 8 < R = 10 — wynik sensowny.
    Odpowiedź: r = 8 cm, P = 64\pi\ \text{cm}^{2}.
  solution_steps:
  - Zauważ trójkąt prostokątny o bokach R (przeciwprostokątna), d oraz r.
  - Zapisz r^{2} = R^{2} - d^{2} = 100 - 36 = 64.
  - Wyznacz r = 8\ \text{cm}.
  - Oblicz pole przekroju P = \pi\cdot 8^{2} = 64\pi\ \text{cm}^{2}.
  answer:
    kind: MULTIPART
    parts:
    - name: promień przekroju
      answer:
        kind: NUMERIC
        value: 8.0
    - name: pole przekroju
      answer:
        kind: SYMBOLIC
        latex: 64\pi
  checks:
  - kind: evaluate
    expr: \sqrt{10^{2}-6^{2}}
    part: promień przekroju
  - kind: evaluate
    expr: \pi\cdot\left(\sqrt{10^{2}-6^{2}}\right)^{2}
    part: pole przekroju
