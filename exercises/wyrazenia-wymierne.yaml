    note: '[whole] SymPy solved it fresh: ''\\frac{2\\cdot\\left(x-3\\right)}{x}'' vs ''2 - 6/x'''
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: dziedzina i wartość wyrażenia
  statement: Dane jest wyrażenie W\left(x\right)=\frac{2\cdot x-1}{x^{2}-5\cdot x+6}. Wypisz wszystkie
    liczby rzeczywiste, które nie należą do dziedziny tego wyrażenia, oraz oblicz W\left(1\right).
  statement_latex: W\left(x\right)=\frac{2\cdot x-1}{x^{2}-5\cdot x+6}
  solution: |-
    1) Rozkładamy mianownik: dla x^{2}-5\cdot x+6 mamy \Delta = 25-24 = 1, \sqrt{\Delta}=1, x_{1}=\frac{5-1}{2}=2, x_{2}=\frac{5+1}{2}=3, więc x^{2}-5\cdot x+6 = \left(x-2\right)\cdot\left(x-3\right).
    2) Warunek dziedziny: \left(x-2\right)\cdot\left(x-3\right)\neq 0, czyli x\neq 2 i x\neq 3. Zatem D = \mathbb{R}\setminus\{2,\ 3\}.
    3) Liczba 1 należy do dziedziny, więc możemy podstawić:
    W\left(1\right)=\frac{2\cdot 1-1}{1^{2}-5\cdot 1+6}=\frac{1}{2}.
    Odpowiedź: liczby wykluczone to 2 i 3, W\left(1\right)=\frac{1}{2}.
  solution_steps:
  - 'Oblicz \Delta dla mianownika i wyznacz jego pierwiastki: x=2, x=3.'
  - 'Zapisz dziedzinę: D = \mathbb{R}\setminus\{2,\ 3\}.'
  - Sprawdź, że 1 należy do dziedziny.
  - Podstaw x=1 i oblicz W\left(1\right)=\frac{1}{2}.
  answer:
    kind: MULTIPART
    parts:
    - name: liczby wykluczone z dziedziny
      answer:
        kind: SET
        members:
        - '2'
        - '3'
    - name: W(1)
      answer:
        kind: NUMERIC
        value: 0.5
  checks:
  - kind: solve_equation
    expr: x^{2}-5\cdot x+6 = 0
    part: liczby wykluczone z dziedziny
  - kind: evaluate
    expr: \frac{2\cdot 1-1}{1^{2}-5\cdot 1+6}
    part: W(1)
  skills:
  - rozkład trójmianu kwadratowego
  - wyznaczanie dziedziny
  - obliczanie wartości wyrażenia
  verification:
