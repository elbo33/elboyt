- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: modelowanie i optymalizacja kwadratowa z ograniczeniem
  statement: |-
    Projektowany jest zbiornik w kształcie stożka prostego. Suma długości promienia podstawy i wysokości tego zbiornika ma być równa 12 dm, a ze względów konstrukcyjnych wysokość zbiornika musi być co najmniej dwa razy większa od promienia jego podstawy. Promień podstawy zbiornika oznaczamy przez x (w decymetrach).
    a) Wyznacz wzór funkcji P opisującej pole przekroju osiowego tego zbiornika w zależności od x oraz podaj dziedzinę tej funkcji.
    b) Wyznacz tę wartość x, dla której pole przekroju osiowego jest największe, i oblicz objętość zbiornika o takim promieniu podstawy. Zapisz obliczenia.
  statement_latex: P\left(x\right)=x\cdot\left(12-x\right),\qquad 12-x\geq 2\cdot x,\qquad V=\frac{1}{3}\cdot\pi\cdot
    x^{2}\cdot\left(12-x\right)
  solution: |-
    a) Niech x będzie promieniem podstawy. Z warunku r+H=12 wysokość wynosi H=12-x.
    Przekrój osiowy to trójkąt równoramienny o podstawie 2x i wysokości H, więc jego pole to P=\frac{1}{2}\cdot 2x\cdot H=x\cdot\left(12-x\right)=12x-x^{2}.
    Dziedzina: musi być x>0 oraz H>0, a ponadto H\geq 2x, czyli 12-x\geq 2x, stąd 12\geq 3x, czyli x\leq 4 (warunek x\leq 4 pociąga H=12-x\geq 8>0).
    Zatem P\left(x\right)=12x-x^{2} dla x\in\left(0,\;4\right\rangle.
    b) Funkcja P jest funkcją kwadratową o ujemnym współczynniku przy x^{2}, więc jej wykresem jest parabola o ramionach skierowanych w dół, a wierzchołek ma pierwszą współrzędną x_w=\frac{-12}{2\cdot\left(-1\right)}=6.
    Wierzchołek nie należy do dziedziny (6>4). Na przedziale \left(0,\;4\right\rangle funkcja P jest rosnąca (bo 4<6), więc największą wartość przyjmuje na końcu przedziału, dla x=4.
    Wtedy P\left(4\right)=4\cdot 8=32, czyli największe pole przekroju osiowego to 32 dm^{2}.
    Dla x=4 mamy r=4 dm i H=12-4=8 dm, zatem V=\frac{1}{3}\pi\cdot 4^{2}\cdot 8=\frac{128\pi}{3} dm^{3}\approx 134,0 dm^{3}.
    Odpowiedź: P\left(x\right)=12x-x^{2}, x\in\left(0,\;4\right\rangle; największe pole dla x=4 dm, a objętość takiego zbiornika wynosi \frac{128\pi}{3} dm^{3}.
  solution_steps:
  - Oznacz r=x, wtedy z warunku r+H=12 otrzymujesz H=12-x.
  - 'Zapisz pole przekroju osiowego: P=\frac{1}{2}\cdot 2x\cdot\left(12-x\right)=12x-x^{2}.'
  - 'Wyznacz dziedzinę: x>0 oraz 12-x\geq 2x, czyli x\leq 4; stąd x\in\left(0,\;4\right\rangle.'
  - 'Znajdź wierzchołek paraboli: x_w=6 — leży poza dziedziną.'
  - Ponieważ na \left(0,\;4\right\rangle funkcja jest rosnąca, największe pole jest dla x=4 (i wynosi
    32).
  - Dla r=4 i H=8 oblicz V=\frac{1}{3}\pi\cdot 4^{2}\cdot 8=\frac{128\pi}{3} dm^{3}.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_funkcji
      answer:
        kind: SYMBOLIC
        latex: P\left(x\right)=12x-x^{2}
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '4'
        hi_open: false
    - name: x_optymalne
      answer:
        kind: NUMERIC
        value: 4.0
    - name: objetosc
      answer:
        kind: SYMBOLIC
        latex: \frac{128\pi}{3}
  checks:
  - kind: simplify
    expr: x\cdot\left(12-x\right)
    part: wzor_funkcji
  - kind: solve_equation
    expr: 12-x=2\cdot x
    part: x_optymalne
  - kind: evaluate
    expr: \frac{1}{3}\cdot\pi\cdot 4^{2}\cdot 8
    part: objetosc
