- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: podział koła w danym stosunku kątów
  statement: 'W kole o środku O i promieniu 18 cm poprowadzono trzy promienie OA, OB oraz OC, które dzielą
    to koło na trzy wycinki. Miary kątów środkowych tych wycinków pozostają w stosunku 2 : 3 : 7. Oblicz
    obwód największego z tych wycinków oraz pole najmniejszego z nich.'
  statement_latex: 2\cdot x+3\cdot x+7\cdot x=360^\circ
  solution: |-
    Miary kątów zapisujemy jako 2x, 3x, 7x (zmiennej nie ma w treści — trzeba ją wprowadzić). Kąty trzech wycinków tworzą kąt pełny:
    2x+3x+7x=360^\circ,\quad 12x=360^\circ,\quad x=30^\circ.
    Zatem kąty mają miary 60^\circ, 90^\circ oraz 210^\circ.
    Największy wycinek odpowiada kątowi 210^\circ. Jego łuk:
    l=\frac{210^\circ}{360^\circ}\cdot 2\pi\cdot 18=\frac{7}{12}\cdot 36\pi=21\pi\ \text{cm}.
    Obwód tego wycinka to łuk i dwa promienie:
    Ob=21\pi+2\cdot 18=21\pi+36\ \text{cm}\approx 101{,}97\ \text{cm}.
    Najmniejszy wycinek odpowiada kątowi 60^\circ:
    P=\frac{60^\circ}{360^\circ}\cdot\pi\cdot 18^{2}=\frac{1}{6}\cdot 324\pi=54\pi\ \text{cm}^2\approx 169{,}6\ \text{cm}^2.
    Kontrola: 21\pi\le 2\pi\cdot 18=36\pi ✓ oraz 54\pi\le \pi\cdot 18^2=324\pi ✓.
  solution_steps:
  - Oznacz miary kątów przez 2x, 3x, 7x.
  - Zapisz równanie 2x + 3x + 7x = 360° i wyznacz x = 30°.
  - 'Podaj miary kątów: 60°, 90°, 210°.'
  - Dla największego wycinka (210°) oblicz łuk l = (210/360)·2π·18 = 21π.
  - 'Dodaj dwa promienie: Ob = 21π + 36 cm.'
  - Dla najmniejszego wycinka (60°) oblicz pole P = (1/6)·π·18² = 54π cm².
  answer:
    kind: MULTIPART
    parts:
    - name: obwod_najwiekszego
      answer:
        kind: SYMBOLIC
        latex: 21\pi+36
    - name: pole_najmniejszego
      answer:
        kind: SYMBOLIC
        latex: 54\pi
  checks:
  - kind: evaluate
    expr: \frac{210}{360}\cdot 2\cdot \pi\cdot 18+2\cdot 18
    part: obwod_najwiekszego
  - kind: evaluate
    expr: \frac{60}{360}\cdot \pi\cdot 18^{2}
    part: pole_najmniejszego
