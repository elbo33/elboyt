  - wybór właściwego łuku
  - eliminacja przypadku sprzecznego z założeniem
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'part(s) need a human: a) dowód, że kąt AOB jest prosty · 1/1 other parts solved fresh'
- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'dowód geometryczny z parametrem: wzór, dziedzina i rozstrzygnięcie'
  statement: |-
    Punkty A, B, C leżą na okręgu o środku O i promieniu r. Trójkąt ABC jest równoramienny, |CA| = |CB|, a środek O leży wewnątrz tego trójkąta. Przez x oznaczamy miarę kąta ACB wyrażoną w stopniach.
    a) Wykaż, że prosta CO jest symetralną odcinka AB.
    b) Wyznacz miarę kąta OAB w zależności od x oraz podaj zbiór wszystkich wartości x, dla których opisana konfiguracja jest możliwa.
    c) Rozstrzygnij, czy przy powyższych założeniach może zachodzić równość |\sphericalangle OAB| = |\sphericalangle ABC|.
  statement_latex: '|\sphericalangle OAB| = \frac{180 - 2 \cdot x}{2} = 90 - x,\qquad x \in \left(0^\circ,\
    90^\circ\right)'
  solution: |-
    Założenie: A, B, C na okręgu o środku O, |CA| = |CB|, O leży wewnątrz trójkąta ABC, x = |∡ACB|.

    a) Punkt C spełnia |CA| = |CB|, więc leży na symetralnej odcinka AB (symetralna to zbiór punktów równoodległych od końców odcinka). Punkt O spełnia |OA| = |OB| = r, więc również leży na symetralnej odcinka AB. Punkty C i O są różne (C leży na okręgu, O jest jego środkiem, r > 0), a przez dwa różne punkty przechodzi dokładnie jedna prosta. Zatem prosta CO jest symetralną odcinka AB — co należało wykazać.

    b) Kąt ACB jest kątem wpisanym opartym na łuku AB niezawierającym punktu C. Kąt środkowy oparty na tym samym łuku to kąt AOB, więc
    |∡AOB| = 2 \cdot x.
    W trójkącie AOB mamy |OA| = |OB| = r, więc jest on równoramienny, a kąty przy podstawie AB są równe:
    |∡OAB| = \frac{180^\circ - 2\cdot x}{2} = 90^\circ - x.
    Dziedzina: środek O leży wewnątrz trójkąta ABC dokładnie wtedy, gdy trójkąt ABC jest ostrokątny. Kąty trójkąta ABC to x (przy C) oraz \frac{180^\circ - x}{2} = 90^\circ - \frac{x}{2} przy A i przy B. Warunki: x < 90^\circ oraz 90^\circ - \frac{x}{2} < 90^\circ, czyli x > 0^\circ. Zatem x \in \left(0^\circ, 90^\circ\right).

    c) Przypuśćmy, że |∡OAB| = |∡ABC|. Wtedy
    90^\circ - x = 90^\circ - \frac{x}{2}, czyli \frac{x}{2} = 0, a więc x = 0^\circ.
    Wartość x = 0^\circ nie należy do wyznaczonego zbioru \left(0^\circ, 90^\circ\right) (dla x = 0 punkty A, B, C nie tworzą trójkąta). Zatem taka konfiguracja nie istnieje — równość |∡OAB| = |∡ABC| jest niemożliwa.

    Odpowiedź: b) |∡OAB| = 90^\circ - x dla x \in \left(0^\circ, 90^\circ\right); c) nie, taka konfiguracja nie istnieje.
  solution_steps:
  - a) Zauważ, że zarówno C (bo |CA| = |CB|), jak i O (bo |OA| = |OB| = r) leżą na symetralnej odcinka
    AB; przez dwa różne punkty przechodzi jedna prosta, więc CO jest tą symetralną.
  - b) Kąt ACB to kąt wpisany oparty na łuku AB niezawierającym C, więc kąt środkowy |∡AOB| = 2\cdot x.
  - b) Trójkąt AOB jest równoramienny (|OA| = |OB| = r), więc |∡OAB| = \frac{180^\circ - 2\cdot x}{2}
    = 90^\circ - x.
  - 'b) Warunek „O wewnątrz trójkąta ABC” oznacza, że trójkąt ABC jest ostrokątny: x < 90^\circ oraz 90^\circ
    - \frac{x}{2} < 90^\circ, czyli x \in \left(0^\circ, 90^\circ\right).'
  - 'c) Zapisz |∡ABC| = 90^\circ - \frac{x}{2} i rozwiąż 90^\circ - x = 90^\circ - \frac{x}{2}; jedyne
    rozwiązanie x = 0^\circ jest poza dziedziną, więc odpowiedź brzmi: nie.'
  answer:
    kind: MULTIPART
    parts:
    - name: a) dowód, że CO jest symetralną AB
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Należy uzasadnić, że C leży na symetralnej AB (bo |CA| = |CB|) i że O leży na symetralnej
          AB (bo |OA| = |OB| = r), oraz że C ≠ O, więc prosta CO pokrywa się z symetralną odcinka AB.
    - name: b) wzór na miarę kąta OAB
      answer:
        kind: SYMBOLIC
        latex: 90 - x
    - name: b) dziedzina (dopuszczalne x)
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '90'
    - name: c) czy |∡OAB| = |∡ABC| jest możliwe
      answer:
        kind: BOOLEAN
        truth: false
  checks:
  - kind: simplify
    expr: \frac{180 - 2 \cdot x}{2}
    part: b) wzór na miarę kąta OAB
  stated_model:
    variable: x
    objective_latex: 90 - x
    domain_lo: '0'
    domain_hi: '90'
    goal: value
    constraint_used: '|CA|=|CB| oraz O wewnątrz trójkąta ABC (trójkąt ostrokątny)'
  skills:
