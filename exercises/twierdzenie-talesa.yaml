  statement: W trójkącie ABC punkt D leży na boku AB, a punkt E na boku AC, przy czym DE ∥ BC. Dane są
    |AD| = 3, |DB| = 7 oraz |AE| = 4,5. Uczeń zapisał proporcję \frac{|AD|}{|DB|}=\frac{|EC|}{|AE|} i
    otrzymał |EC| = \frac{27}{14}. Wskaż błąd w tym zapisie i oblicz poprawną długość odcinka EC.
  statement_latex: '\text{błędnie: }\frac{3}{7}=\frac{|EC|}{4{,}5};\qquad \text{poprawnie: }\frac{3}{7}=\frac{4{,}5}{|EC|}'
  solution: |-
    Rozumowanie ucznia (błędne). Uczeń zapisał \frac{3}{7}=\frac{|EC|}{4{,}5}, skąd 7\cdot|EC| = 3\cdot 4{,}5 = 13{,}5, czyli |EC| = \frac{27}{14}\approx 1{,}93. Wynik jest niedorzeczny: wyszłoby |EC| < |AE|, choć na boku AB odcinek dalszy od wierzchołka A (|DB| = 7) jest dłuższy od bliższego (|AD| = 3).
    Gdzie tkwi błąd. W proporcji Talesa odcinki muszą sobie odpowiadać: w licznikach odcinki bliższe wierzchołka A (AD i AE), w mianownikach odcinki dalsze (DB i EC). Uczeń „odwrócił” tylko jeden ułamek. Wolno odwrócić obie strony jednocześnie: \frac{|DB|}{|AD|}=\frac{|EC|}{|AE|}.
    Poprawne rozwiązanie. \frac{|AD|}{|DB|}=\frac{|AE|}{|EC|},\quad \frac{3}{7}=\frac{4{,}5}{x},\quad 3x = 31{,}5,\quad x = 10{,}5.
