  - Wskaż wynik policzony wielokrotnie, np. (6, 6, 2) — raz dla szóstki w I rzucie, raz w II.
  - 'Policz wszystkie wyniki trzech rzutów: 6^3 = 216.'
  - 'Sformułuj zaprzeczenie: „żadna szóstka” i policz 5^3 = 125.'
