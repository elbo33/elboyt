- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: optymalizacja pola trójkąta prostokątnego z warunkiem na przeciwprostokątną i obliczeniem
    r oraz R
  statement: |-
    W trójkącie prostokątnym suma długości przyprostokątnych jest równa 14, a przeciwprostokątna ma długość nie większą niż 10. Jedna z przyprostokątnych ma długość x.
    a) Wyznacz wzór na pole P tego trójkąta jako funkcję zmiennej x oraz wyznacz dziedzinę tej funkcji (uwzględniając warunek nałożony na przeciwprostokątną).
    b) Wyznacz długości przyprostokątnych trójkąta o największym polu, podaj to największe pole oraz oblicz promień R okręgu opisanego na tym trójkącie i promień r okręgu w niego wpisanego.
  statement_latex: P\left(x\right)=\frac{x\cdot\left(14-x\right)}{2},\qquad \sqrt{x^{2}+\left(14-x\right)^{2}}\le
    10
  solution: |-
    a) Jeżeli jedna przyprostokątna ma długość x, to druga ma długość 14 − x, więc
    P\left(x\right) = \frac{x\cdot\left(14-x\right)}{2}.

    Dziedzina: z warunku dodatniości boków x > 0 oraz 14 − x > 0, czyli x \in \left(0,\ 14\right). Warunek na przeciwprostokątną:
    \sqrt{x^{2}+\left(14-x\right)^{2}} \le 10 \iff x^{2}+\left(14-x\right)^{2} \le 100 \iff 2x^{2}-28x+196 \le 100 \iff x^{2}-14x+48 \le 0.
    \Delta = 196-192 = 4, pierwiastki: x = 6 oraz x = 8, więc x \in \left\langle 6,\ 8\right\rangle. Przecięcie z przedziałem (0, 14) daje dziedzinę D = \left\langle 6,\ 8\right\rangle.

    b) P\left(x\right) = -\frac{1}{2}x^{2}+7x to funkcja kwadratowa o ujemnym współczynniku przy x^{2}, więc największą wartość przyjmuje w wierzchołku paraboli:
    x_{w} = \frac{-7}{2\cdot\left(-\frac{1}{2}\right)} = 7.
    Sprawdzamy wykonalność: 7 \in \left\langle 6,\ 8\right\rangle ✓ (przeciwprostokątna wynosi wtedy \sqrt{49+49} = 7\sqrt{2}\approx 9{,}9 \le 10 ✓).

    Zatem obie przyprostokątne mają długość 7, a największe pole to
    P\left(7\right) = \frac{7\cdot 7}{2} = \frac{49}{2} = 24{,}5.

    Przeciwprostokątna: c = \sqrt{7^{2}+7^{2}} = 7\sqrt{2}. W trójkącie prostokątnym środek okręgu opisanego leży w środku przeciwprostokątnej, więc
    R = \frac{c}{2} = \frac{7\sqrt{2}}{2},
    oraz
    r = \frac{a+b-c}{2} = \frac{7+7-7\sqrt{2}}{2} = 7-\frac{7\sqrt{2}}{2}.

    Kontrola: r \approx 2{,}05 < R \approx 4{,}95 ✓ (oraz P = p\cdot r = \left(7+\frac{7\sqrt{2}}{2}\right)\left(7-\frac{7\sqrt{2}}{2}\right) = 49-\frac{49}{2} = 24{,}5 ✓).
  solution_steps:
  - Oznacz przyprostokątne przez x i 14 − x i zapisz P\left(x\right)=\frac{x\cdot\left(14-x\right)}{2}.
  - 'Z warunku boków dodatnich: x \in \left(0,\ 14\right).'
  - Z warunku \sqrt{x^{2}+\left(14-x\right)^{2}}\le 10 otrzymaj nierówność x^{2}-14x+48 \le 0, czyli x
    \in \left\langle 6,\ 8\right\rangle – to jest dziedzina.
  - Zauważ, że P jest funkcją kwadratową o ramionach skierowanych w dół i wyznacz odciętą wierzchołka
    x_{w}=7.
  - Sprawdź, że 7 należy do dziedziny \left\langle 6,\ 8\right\rangle (warunek na przeciwprostokątną jest
    spełniony).
  - Oblicz P\left(7\right)=24{,}5 oraz c=7\sqrt{2}, a następnie R=\frac{7\sqrt{2}}{2} i r=\frac{7+7-7\sqrt{2}}{2}=7-\frac{7\sqrt{2}}{2}.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_P
      answer:
        kind: SYMBOLIC
        latex: \frac{x\cdot\left(14-x\right)}{2}
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '6'
        hi: '8'
        lo_open: false
        hi_open: false
    - name: x_max
      answer:
        kind: NUMERIC
        value: 7.0
        latex: '7'
    - name: P_max
      answer:
        kind: NUMERIC
        value: 24.5
        latex: \frac{49}{2}
    - name: R
      answer:
        kind: SYMBOLIC
        latex: \frac{7\sqrt{2}}{2}
    - name: r
      answer:
        kind: SYMBOLIC
        latex: 7-\frac{7\sqrt{2}}{2}
