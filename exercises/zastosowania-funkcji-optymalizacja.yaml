- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: optymalizacja geometryczna z wierzchołkiem poza dziedziną
  statement: Prostokątny wybieg dla zwierząt o bokach długości x metrów i y metrów ogrodzono siatką, a
    następnie podzielono go na dwa mniejsze prostokąty dodatkowym odcinkiem siatki równoległym do boku
    o długości y metrów. Na całe ogrodzenie, wraz ze ścianką wewnętrzną, zużyto dokładnie 36 metrów bieżących
    siatki. Ze względu na szerokość bramki bok o długości y musi mieć co najmniej 8 m. Oblicz wymiary
    x oraz y tego z rozważanych wybiegów, którego pole jest największe, i oblicz to największe pole. Zapisz
    obliczenia.
  statement_latex: 2\cdot x+3\cdot y=36,\qquad P\left(x\right)=x\cdot\frac{36-2\cdot x}{3}=12x-\frac{2}{3}x^{2}
  solution: |-
    Ogrodzenie tworzą dwa boki długości x oraz trzy odcinki długości y (dwa boki prostokąta i ścianka wewnętrzna równoległa do nich), zatem warunek wiążący ma postać 2\cdot x+3\cdot y=36, skąd y=\frac{36-2\cdot x}{3}.
    Dziedzina: x>0 oraz y\geq 8, czyli \frac{36-2\cdot x}{3}\geq 8, stąd 36-2\cdot x\geq 24, czyli x\leq 6. Zatem x\in\left(0,6\right].
    Pole wybiegu: P\left(x\right)=x\cdot y=x\cdot\frac{36-2\cdot x}{3}=12x-\frac{2}{3}x^{2}.
    Jest to funkcja kwadratowa o współczynniku a=-\frac{2}{3}<0. Wierzchołek: p=-\frac{12}{2\cdot\left(-\frac{2}{3}\right)}=9.
    Liczba 9 nie należy do dziedziny \left(0,6\right]. Ponieważ a<0, funkcja rośnie na przedziale \left(-\infty,9\right], więc na całym \left(0,6\right] jest rosnąca i wartość największą przyjmuje w prawym końcu, dla x=6.
    P\left(6\right)=12\cdot 6-\frac{2}{3}\cdot 36=72-24=48, a wtedy y=\frac{36-12}{3}=8.
    Sprawdzenie: 2\cdot 6+3\cdot 8=36 m siatki, y=8\geq 8, pole 6\cdot 8=48 \mathrm{m}^{2}.
    Odpowiedź: wybieg powinien mieć wymiary x=6 m oraz y=8 m, a jego największe możliwe pole wynosi 48 \mathrm{m}^{2}.
  solution_steps:
  - 'Zapisz warunek wiążący: 2x+3y=36, bo ścianka wewnętrzna jest równoległa do boków długości y.'
  - Wyznacz y=(36-2x)/3.
  - 'Ustal dziedzinę: x>0 oraz y ≥ 8, czyli x ∈ (0,6].'
  - 'Zapisz pole jako funkcję jednej zmiennej: P(x)=12x-(2/3)x².'
  - Oblicz p=9 i stwierdź, że p ∉ (0,6].
  - Skorzystaj z monotoniczności (a<0, funkcja rośnie na (-∞,9]) – maksimum w x=6.
  - Oblicz P(6)=48 i y=8; podaj odpowiedź z jednostkami.
  answer:
    kind: MULTIPART
    parts:
    - name: x
      answer:
        kind: NUMERIC
        value: 6.0
    - name: y
      answer:
        kind: NUMERIC
        value: 8.0
    - name: P_max
      answer:
        kind: NUMERIC
        value: 48.0
