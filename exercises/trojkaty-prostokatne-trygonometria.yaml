- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: zadanie praktyczne z kątem wzniesienia (dwa trójkąty prostokątne)
  statement: Na poziomym placu stoi pionowy maszt. Punkty A i B leżą na tym placu, na jednej prostej z
    podstawą masztu i po tej samej jego stronie, przy czym punkt B leży między punktem A a podstawą masztu
    oraz |AB| = 30 m. Kąt wzniesienia wierzchołka masztu obserwowanego z punktu A ma miarę 45°, a obserwowanego
    z punktu B — miarę 60°. Oblicz dokładną wysokość masztu (wynik podaj w metrach w postaci dokładnej).
  statement_latex: \frac{h}{\operatorname{tg}45^\circ}-\frac{h}{\operatorname{tg}60^\circ}=30
  solution: |-
    Oznaczmy przez h (w metrach) wysokość masztu, a przez S — jego podstawę. Maszt jest pionowy, plac poziomy, więc trójkąty o wierzchołkach A, S, wierzchołek masztu oraz B, S, wierzchołek masztu są prostokątne z kątem prostym przy S.
    1) W trójkącie z kątem 45° przy A: tg 45° = h/|AS|, czyli 1 = h/|AS|, więc |AS| = h.
    2) W trójkącie z kątem 60° przy B: tg 60° = h/|BS|, czyli √3 = h/|BS|, więc |BS| = h/√3 = (h√3)/3.
    3) Ponieważ B leży między A a S, mamy |AS| − |BS| = |AB| = 30, czyli
     h − (h√3)/3 = 30.
    4) Rozwiązujemy: h·(3 − √3)/3 = 30, więc h = 90/(3 − √3) = 90(3 + √3)/((3 − √3)(3 + √3)) = 90(3 + √3)/6 = 15(3 + √3) = 45 + 15√3.
     Kontrola sensowności: 45 + 15√3 ≈ 71 m, a wtedy |AS| ≈ 71 m i |BS| ≈ 41 m, czyli różnica ≈ 30 m. ✓
    Odpowiedź: maszt ma wysokość (45 + 15√3) m, czyli około 71 m.
  solution_steps:
  - 'Wprowadź niewiadomą: h — wysokość masztu, S — spodek masztu.'
  - 'Z trójkąta przy punkcie A: tg 45° = h/|AS|, więc |AS| = h.'
  - 'Z trójkąta przy punkcie B: tg 60° = h/|BS|, więc |BS| = (h√3)/3.'
  - 'Ułóż równanie |AS| − |BS| = 30: h − (h√3)/3 = 30.'
  - 'Rozwiąż: h = 90/(3 − √3) = 45 + 15√3.'
