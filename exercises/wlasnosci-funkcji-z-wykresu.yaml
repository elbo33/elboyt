        latex: \{-1\} \cup \left\langle 3,\ 6 \right)
    - name: czy_istnieje_najwieksza
      answer:
        kind: SYMBOLIC
        latex: nie istnieje
    - name: uzasadnienie
      answer:
        kind: NOT_MACHINE_CHECKABLE
        reason: Uczeń musi uzasadnić, że w przedziale ⟨0, 6) wartości funkcji zbliżają się do 5, ale poziom
          5 nie jest przyjmowany (punkt (6, 5) nie należy do wykresu), więc wartość największa nie istnieje.
