    b) Rozstrzygnij, czy to pudełko można postawić na półce, nad którą jest wolne miejsce o wysokości \(1\ \mathrm{dm}\).
  statement_latex: x^{2}\cdot\frac{x}{2}=2,\qquad P=x^{2}+4\cdot x\cdot\frac{x}{2}=3\cdot x^{2}
  solution: |-
    Oznaczmy przez \(x\) (w dm) długość krawędzi podstawy, \(x>0\). Wysokość pudełka jest równa \(\frac{x}{2}\).

    Objętość: \(V=x^{2}\cdot\frac{x}{2}=\frac{x^{3}}{2}\). Z warunku zadania
    \[\frac{x^{3}}{2}=2,\qquad x^{3}=4,\qquad x=\sqrt[3]{4}\ \mathrm{dm}.\]

    a) Pudełko nie ma górnej ścianki, więc
    \[P=x^{2}+4\cdot x\cdot\frac{x}{2}=x^{2}+2x^{2}=3\cdot x^{2}.\]
    Stąd
    \[P=3\cdot\left(\sqrt[3]{4}\right)^{2}=3\cdot\sqrt[3]{16}=3\cdot 2\cdot\sqrt[3]{2}=6\cdot\sqrt[3]{2}\ \mathrm{dm}^{2}\ \left(\approx 7{,}56\ \mathrm{dm}^{2}\right).\]

    b) Wysokość pudełka jest równa \(h=\frac{x}{2}=\frac{\sqrt[3]{4}}{2}\). Porównujemy ją z \(1\ \mathrm{dm}\):
    \[\frac{\sqrt[3]{4}}{2}<1\iff\sqrt[3]{4}<2=\sqrt[3]{8},\]
    a to jest prawdą, bo \(4<8\), a pierwiastki są tego samego stopnia i liczby podpierwiastkowe są dodatnie. Zatem \(h<1\ \mathrm{dm}\) — pudełko zmieści się.

    Odpowiedź: a) \(6\sqrt[3]{2}\ \mathrm{dm}^{2}\); b) tak, zmieści się.
  solution_steps:
  - 'Wprowadź zmienną: x — krawędź podstawy (x>0), wysokość równa x/2.'
