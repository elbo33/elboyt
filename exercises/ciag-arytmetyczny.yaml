  - Zapisuję równanie \frac{2\cdot a_1 + 19\cdot(-20)}{2}\cdot 20 = 9000.
  - 'Rozwiązuję: 2a_1 - 380 = 900, stąd a_1 = 640.'
  - Obliczam ostatnią ratę a_{20} = 640 - 19\cdot 20 = 260.
  - 'Sprawdzam: \frac{640 + 260}{2}\cdot 20 = 9000.'
  answer:
    kind: MULTIPART
    parts:
    - name: pierwsza rata
      answer:
        kind: NUMERIC
        value: 640.0
        latex: 640\ \text{zł}
    - name: ostatnia rata
      answer:
        kind: NUMERIC
        value: 260.0
        latex: 260\ \text{zł}
