- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: punkt na prostej o zadanej odległości, równanie prostej
  statement: 'W kartezjańskim układzie współrzędnych (x, y) dane są: prosta k o równaniu y = 2x - 3 oraz
    punkt A = (1, 4). Punkt K leży na prostej k, jego odległość od punktu A jest równa 5, a obie współrzędne
    punktu K są liczbami dodatnimi. Oblicz współrzędne punktu K oraz wyznacz równanie prostej AK w postaci
    ogólnej. Zapisz obliczenia.'
  statement_latex: k:\ y = 2x - 3,\qquad A = \left(1,\ 4\right),\qquad K \in k,\qquad |AK| = 5,\qquad
    x_K > 0,\ y_K > 0
  solution: |-
    Skoro punkt K leży na prostej k, to jego współrzędne mają postać K = \left(t,\ 2t - 3\right) dla pewnej liczby rzeczywistej t.

    Zapisujemy warunek |AK| = 5 dla kwadratów:
    \left(t - 1\right)^2 + \left(2t - 3 - 4\right)^2 = 25,
    czyli t^2 - 2t + 1 + 4t^2 - 28t + 49 = 25, a stąd 5t^2 - 30t + 25 = 0, czyli t^2 - 6t + 5 = 0.
    Przekształcamy: \left(t - 3\right)^2 = 4, więc t = 3 - 2 = 1 albo t = 3 + 2 = 5.

    Dla t = 1 otrzymujemy K = (1, -1) — rzędna jest ujemna, więc ten punkt odrzucamy. Dla t = 3 + 2 = 5 otrzymujemy K = (5, 2\cdot 5 - 3) = (5, 7); obie współrzędne są dodatnie, więc K = (5, 7).

    Równanie prostej AK: a = \frac{7 - 4}{5 - 1} = \frac{3}{4}. Podstawiamy A = (1, 4): 4 = \frac{3}{4}\cdot 1 + b, stąd b = \frac{13}{4}, czyli y = \frac{3}{4}\cdot x + \frac{13}{4}. Mnożymy przez 4 i porządkujemy: 4y = 3x + 13, czyli 3x - 4y + 13 = 0.
    Sprawdzenie: dla A: 3\cdot 1 - 4\cdot 4 + 13 = 0, dla K: 3\cdot 5 - 4\cdot 7 + 13 = 0.
  solution_steps:
  - Zauważ, że punkt prostej k ma postać K = (t, 2t - 3) — wprowadź parametr t.
  - 'Zapisz warunek |AK|^2 = 25: \left(t - 1\right)^2 + \left(2t - 7\right)^2 = 25.'
  - 'Uporządkuj równanie: 5t^2 - 30t + 25 = 0, czyli \left(t - 3\right)^2 = 4.'
  - Wyznacz t = 1 lub t = 5 i odrzuć t = 1, bo wtedy K = (1, -1) ma ujemną rzędną.
  - Zapisz K = (5, 7).
  - 'Oblicz współczynnik kierunkowy prostej AK: a = \frac{3}{4}, następnie b = \frac{13}{4}.'
  - 'Zapisz postać ogólną: 3x - 4y + 13 = 0.'
  answer:
    kind: MULTIPART
    parts:
    - name: K_x
      answer:
        kind: NUMERIC
        value: 5.0
    - name: K_y
      answer:
        kind: NUMERIC
        value: 7.0
    - name: prosta_AK
      answer:
        kind: SYMBOLIC
        latex: 3x - 4y + 13 = 0
  checks:
  - kind: evaluate
    expr: 3 + 2
    var: t
    part: K_x
  - kind: evaluate
    expr: 2\cdot 5 - 3
    var: t
    part: K_y
  stated_model:
    variable: t
    objective_latex: '|AK|^2 = \left(t - 1\right)^2 + \left(2t - 7\right)^2'
    domain_lo: \frac{3}{2}
    goal: value
    constraint_used: '|AK| = 5 oraz t > 0 i 2t - 3 > 0'
