  exercise_type: postać iloczynowa — odczyt pierwiastków
  statement: Rozwiąż równanie \(\left(2x-6\right)\cdot\left(x+5\right)=0\).
  statement_latex: \left(2x-6\right)\cdot\left(x+5\right)=0
  solution: |-
    Po lewej stronie stoi iloczyn, a po prawej dokładnie zero, więc możemy skorzystać z własności iloczynu równego zeru:
    \(2x-6=0\) lub \(x+5=0\).
    Z pierwszego równania: \(2x=6\), czyli \(x=3\).
    Z drugiego równania: \(x=-5\).
    Odpowiedź: \(x=3\) lub \(x=-5\).
  solution_steps:
  - Zauważ, że iloczyn jest równy zeru.
  - 'Przyrównaj każdy czynnik do zera: 2x − 6 = 0 lub x + 5 = 0.'
  - 'Rozwiąż równania liniowe: x = 3, x = −5.'
  answer:
    kind: SET
    members:
