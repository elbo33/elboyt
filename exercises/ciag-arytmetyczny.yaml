  solution: |-
    1) Wyraz dwudziesty: a_{20} = a_1 + 19r = -5 + 19\cdot 4 = -5 + 76 = 71.
    2) Suma: S_{20} = \frac{a_1 + a_{20}}{2}\cdot 20 = \frac{-5 + 71}{2}\cdot 20 = \frac{66}{2}\cdot 20 = 33\cdot 20 = 660.
    Kontrola drugim wzorem: S_{20} = \frac{2\cdot(-5) + 19\cdot 4}{2}\cdot 20 = \frac{-10 + 76}{2}\cdot 20 = 33\cdot 20 = 660. ✓
    Odpowiedź: a_{20} = 71, S_{20} = 660.
  solution_steps:
  - 'Stosuję a_n = a_1 + (n-1)r dla n = 20: a_{20} = -5 + 19\cdot 4 = 71.'
  - 'Stosuję S_n = \frac{a_1 + a_n}{2}\cdot n: S_{20} = \frac{-5 + 71}{2}\cdot 20.'
  - Obliczam S_{20} = 33\cdot 20 = 660.
  - 'Sprawdzam wynik wzorem z różnicą: \frac{2\cdot(-5) + 19\cdot 4}{2}\cdot 20 = 660.'
  answer:
    kind: MULTIPART
    parts:
