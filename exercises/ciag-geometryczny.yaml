  statement: Ciąg geometryczny (a_n) jest określony dla każdej liczby naturalnej n ≥ 1. Pierwszy wyraz
    tego ciągu jest równy a_1 = 2, a iloraz jest równy q = 5. Oblicz czwarty wyraz tego ciągu.
  statement_latex: a_1 = 2,\quad q = 5,\quad a_4 = a_1\cdot q^{4-1} = 2\cdot 5^{3}
  solution: |-
    Korzystamy ze wzoru na n-ty wyraz ciągu geometrycznego: a_n = a_1 \cdot q^{n-1}.
    Dla n = 4 wykładnik wynosi n - 1 = 3, zatem a_4 = 2 \cdot 5^3 = 2 \cdot 125 = 250.
    Sprawdzenie przez wypisanie wyrazów: 2, 10, 50, 250 — każdy kolejny jest 5 razy większy od poprzedniego. ✓
    Odpowiedź: a_4 = 250.
  solution_steps:
  - 'Zapisz wzór ogólny: a_n = a_1 \cdot q^{n-1}.'
  - 'Podstaw n = 4: a_4 = 2 \cdot 5^{3}.'
  - 'Oblicz potęgę: 5^3 = 125.'
  - 'Wykonaj mnożenie: a_4 = 2 \cdot 125 = 250.'
