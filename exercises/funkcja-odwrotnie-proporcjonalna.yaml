- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: wyznaczanie współczynnika a
  statement: Funkcja odwrotnie proporcjonalna f jest określona wzorem f(x)=\frac{a}{x}, gdzie a\neq 0.
    Wykres tej funkcji przechodzi przez punkt A=\left(4,\ -5\right). Oblicz współczynnik a.
  statement_latex: f(x)=\frac{a}{x},\qquad A=\left(4,\ -5\right)
  solution: 'Punkt A należy do wykresu, więc jego współrzędne spełniają wzór funkcji: -5=\frac{a}{4}.
    Mnożąc obie strony przez 4, otrzymujemy a=4\cdot\left(-5\right)=-20. Krócej: dla funkcji odwrotnie
    proporcjonalnej współczynnik a jest iloczynem współrzędnych dowolnego punktu wykresu, czyli a=x_0\cdot
    y_0=4\cdot\left(-5\right)=-20. Sprawdzenie: f(4)=\frac{-20}{4}=-5, zgadza się.'
  solution_steps:
  - Zapisz wzór ogólny f(x)=\frac{a}{x}.
  - 'Podstaw współrzędne punktu A: -5=\frac{a}{4}.'
  - Wyznacz a=4\cdot\left(-5\right)=-20.
  - 'Sprawdź: f(4)=\frac{-20}{4}=-5.'
  answer:
    kind: NUMERIC
    value: -20.0
    latex: a=-20
  checks:
  - kind: evaluate
    expr: 4 \cdot \left(-5\right)
  skills:
  - wyznaczanie współczynnika proporcjonalności
  - przynależność punktu do wykresu
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: -20.0 vs -20.0 (tol 1e-09)'
