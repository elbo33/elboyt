  statement_latex: 3x^{2}+5x-2=0
  solution: |-
    BŁĘDNE ROZUMOWANIE: \(x=\frac{5\pm 7}{6}\), czyli \(x=\frac{12}{6}=2\) lub \(x=\frac{-2}{6}=-\frac{1}{3}\).

    GDZIE JEST BŁĄD: w liczniku wzoru występuje \(-b\), a nie \(b\). Skoro \(b=5\), to \(-b=-5\), a uczeń wstawił \(+5\).
    Sprawdzenie: dla \(x=2\) mamy \(3\cdot 2^{2}+5\cdot 2-2=12+10-2=20\neq 0\) — liczba 2 nie jest pierwiastkiem.

    POPRAWNE ROZWIĄZANIE: \(a=3\), \(b=5\), \(c=-2\),
    \(\Delta=5^{2}-4\cdot 3\cdot\left(-2\right)=25+24=49\), \(\sqrt{\Delta}=7\),
    \(x_{1}=\frac{-5-7}{2\cdot 3}=\frac{-12}{6}=-2\), \(x_{2}=\frac{-5+7}{6}=\frac{2}{6}=\frac{1}{3}\).
    Sprawdzenie dla \(x=\frac{1}{3}\): \(3\cdot\frac{1}{9}+5\cdot\frac{1}{3}-2=\frac{1}{3}+\frac{5}{3}-2=0\) ✓.
    Odpowiedź: \(x=-2\) lub \(x=\frac{1}{3}\).
  solution_steps:
  - 'Pokaż błędny tok: x = (5 ± 7)/6 i „rozwiązania” 2 oraz −1/3.'
  - 'Wskaż błąd: w liczniku ma być −b, a więc −5, nie +5.'
