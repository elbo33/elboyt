  statement: W kartezjańskim układzie współrzędnych (x,\ y) okrąg o' o równaniu x^{2}+y^{2}+6\cdot x-8\cdot
    y+9=0 jest obrazem pewnego okręgu o w symetrii względem osi Oy. Zapisz równanie okręgu o w postaci
    kanonicznej oraz oblicz odległość środka okręgu o od początku układu współrzędnych.
  statement_latex: x^{2}+y^{2}+6\cdot x-8\cdot y+9=0
  solution: |-
    Najpierw sprowadzamy równanie okręgu o' do postaci kanonicznej:
    \left(x^{2}+6\cdot x\right)+\left(y^{2}-8\cdot y\right)=-9,
    x^{2}+6\cdot x=\left(x+3\right)^{2}-9,\qquad y^{2}-8\cdot y=\left(y-4\right)^{2}-16,
    więc \left(x+3\right)^{2}+\left(y-4\right)^{2}=-9+9+16=16.
    Okrąg o' ma zatem środek S'=\left(-3,\ 4\right) i promień r=\sqrt{16}=4.

    Symetria względem osi Oy jest przekształceniem odwrotnym do samej siebie, więc środek okręgu o jest obrazem punktu S' w tej symetrii: S=\left(3,\ 4\right). Promień nie zmienia się (izometria), czyli r=4 i
    o:\ \left(x-3\right)^{2}+\left(y-4\right)^{2}=16.
    Sprawdzenie: obrazem okręgu o w symetrii względem Oy jest okrąg o środku \left(-3,\ 4\right) i promieniu 4 — zgadza się z o'.

    Odległość środka S=\left(3,\ 4\right) od punktu O=\left(0,\ 0\right):
    \left|OS\right|=\sqrt{3^{2}+4^{2}}=\sqrt{25}=5.
  solution_steps:
  - 'Uzupełnij równanie okręgu o'' do kwadratów: \left(x+3\right)^{2}+\left(y-4\right)^{2}=16.'
  - Odczytaj środek S'=\left(-3,\ 4\right) i promień r=4 okręgu o'.
  - 'Zauważ, że aby wrócić do okręgu o, wystarczy ponownie zastosować symetrię względem Oy: S=\left(3,\
    4\right).'
  - 'Zapisz równanie okręgu o: \left(x-3\right)^{2}+\left(y-4\right)^{2}=16 (promień bez zmian, bo symetria
    jest izometrią).'
  - 'Oblicz odległość: \left|OS\right|=\sqrt{3^{2}+4^{2}}=5.'
  answer:
    kind: MULTIPART
    parts:
    - name: rownanie_okregu_o
      answer:
        kind: SYMBOLIC
        latex: \left(x-3\right)^{2}+\left(y-4\right)^{2}=16
    - name: odleglosc_srodka_od_O
      answer:
        kind: NUMERIC
        value: 5.0
  checks:
  - kind: evaluate
    expr: \sqrt{3^{2}+4^{2}}
    part: odleglosc_srodka_od_O
  skills:
  - sprowadzanie równania okręgu do postaci kanonicznej
  - odwracanie symetrii osiowej (wyznaczanie oryginału)
  - obliczanie odległości punktu od początku układu
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: przesunięcie okręgu z warunkiem styczności i warunkiem położenia
  statement: W kartezjańskim układzie współrzędnych (x,\ y) okrąg o ma środek w punkcie S=\left(-5,\ 2\right)
    i jest styczny do prostej o równaniu x=-2. Okrąg o przesunięto o wektor \vec{u}=\left[p,\ 2\cdot p\right],
    gdzie p jest liczbą rzeczywistą, i otrzymano okrąg o'. Okrąg o' jest styczny do osi Oy i zawiera się
    w półpłaszczyźnie określonej nierównością x\leq 0. Wyznacz p, zapisz równanie okręgu o' oraz oblicz
    długość wektora \vec{u}.
  statement_latex: \vec{u}=\left[p,\ 2\cdot p\right],\qquad S=\left(-5,\ 2\right)
  solution: |-
    Promień okręgu o to odległość środka S=\left(-5,\ 2\right) od prostej x=-2:
    r=\left|-2-\left(-5\right)\right|=3.

    Po przesunięciu o \vec{u}=\left[p,\ 2\cdot p\right] środek okręgu o' ma współrzędne
    S'=\left(-5+p,\ 2+2\cdot p\right), a promień nadal wynosi 3 (przesunięcie jest izometrią).

    Styczność do osi Oy oznacza, że odległość środka S' od tej osi jest równa promieniowi:
    \left|-5+p\right|=3, czyli p-5=3 lub p-5=-3, a więc p=8 albo p=2.

    Sprawdzamy warunek położenia. Dla p=8 środek to \left(3,\ 18\right) i okrąg leży w półpłaszczyźnie x\geq 0 — nie spełnia warunku x\leq 0. Dla p=2 środek to \left(-3,\ 6\right); największa pierwsza współrzędna punktu tego okręgu to -3+3=0, więc cały okrąg zawiera się w półpłaszczyźnie x\leq 0. Zatem p=2.

    Równanie okręgu o': \left(x+3\right)^{2}+\left(y-6\right)^{2}=9.

    Długość wektora \vec{u}=\left[2,\ 4\right]:
    \left|\vec{u}\right|=\sqrt{2^{2}+4^{2}}=\sqrt{20}=2\cdot\sqrt{5}.
  solution_steps:
  - 'Z warunku styczności okręgu o do prostej x=-2 wyznacz promień: r=\left|-2-\left(-5\right)\right|=3.'
  - 'Zapisz środek obrazu po przesunięciu: S''=\left(-5+p,\ 2+2\cdot p\right), promień bez zmian r=3.'
  - 'Zapisz warunek styczności obrazu do osi Oy: \left|p-5\right|=3, stąd p=8 lub p=2.'
  - Odrzuć p=8 (środek \left(3,\ 18\right), okrąg leży po prawej stronie osi Oy) i przyjmij p=2, bo wtedy
    S'=\left(-3,\ 6\right) i cały okrąg spełnia x\leq 0.
  - 'Zapisz równanie obrazu: \left(x+3\right)^{2}+\left(y-6\right)^{2}=9.'
  - 'Oblicz długość wektora \vec{u}=\left[2,\ 4\right]: \left|\vec{u}\right|=\sqrt{2^{2}+4^{2}}=2\cdot\sqrt{5}.'
  answer:
    kind: MULTIPART
    parts:
    - name: p
      answer:
        kind: NUMERIC
        value: 2.0
    - name: rownanie_okregu_o_prim
      answer:
        kind: SYMBOLIC
        latex: \left(x+3\right)^{2}+\left(y-6\right)^{2}=9
    - name: dlugosc_wektora
      answer:
        kind: SYMBOLIC
        latex: 2\cdot\sqrt{5}
  checks:
  - kind: evaluate
    expr: -3-\left(-5\right)
    var: p
    part: p
  - kind: evaluate
    expr: \sqrt{2^{2}+4^{2}}
    part: dlugosc_wektora
