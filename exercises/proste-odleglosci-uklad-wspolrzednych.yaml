  - wyznaczanie równania prostej przez dwa punkty
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (NOT_MACHINE_CHECKABLE: ''segment length / measure
      bars'') — human review'
- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: warunek prostopadłości, punkt na osi, pole trójkąta
  statement: W kartezjańskim układzie współrzędnych (x, y) dane są punkty A = (0, 4) oraz B = (6, 2).
    Punkt C leży na osi Ox, jego odcięta jest większa od 3, a kąt ACB jest kątem prostym. Oblicz odciętę
    punktu C oraz pole trójkąta ABC. Zapisz obliczenia.
  statement_latex: A = \left(0,\ 4\right),\quad B = \left(6,\ 2\right),\quad C = \left(x,\ 0\right),\quad
    x > 3,\quad \sphericalangle ACB = 90^{\circ}
  solution: |-
    Punkt C leży na osi Ox, więc C = (x, 0), przy czym x \ne 0 oraz x \ne 6 (w przeciwnym razie jedna z prostych CA, CB byłaby pionowa i kąt prosty nie mógłby powstać w opisany sposób).

    Współczynniki kierunkowe:
    a_{CA} = \frac{4 - 0}{0 - x} = -\frac{4}{x}, \qquad a_{CB} = \frac{2 - 0}{6 - x} = \frac{2}{6 - x}.

    Z warunku prostopadłości a_{CA}\cdot a_{CB} = -1 mamy
    \left(-\frac{4}{x}\right)\cdot \frac{2}{6 - x} = -1, czyli \frac{8}{x\cdot\left(6 - x\right)} = 1,
    zatem x\cdot\left(6 - x\right) = 8, czyli x^2 - 6x + 8 = 0, a stąd \left(x - 3\right)^2 = 1.
    Otrzymujemy x = 3 - 1 = 2 albo x = 3 + 1 = 4. Warunek x > 3 spełnia tylko x = 4, więc C = (4, 0).

    Długości przyprostokątnych:
    |CA| = \sqrt{\left(0 - 4\right)^2 + \left(4 - 0\right)^2} = \sqrt{32} = 4\sqrt{2},
    |CB| = \sqrt{\left(6 - 4\right)^2 + \left(2 - 0\right)^2} = \sqrt{8} = 2\sqrt{2}.
    Pole: P = \frac{1}{2}\cdot 4\sqrt{2}\cdot 2\sqrt{2} = \frac{1}{2}\cdot 16 = 8.
  solution_steps:
  - Zapisz C = (x, 0) — wprowadź niewiadomą odciętą punktu leżącego na osi Ox.
  - 'Wyznacz współczynniki kierunkowe: a_{CA} = -\frac{4}{x}, a_{CB} = \frac{2}{6 - x}.'
