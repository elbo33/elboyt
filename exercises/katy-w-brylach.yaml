- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: wyznaczanie wymiarów ostrosłupa z danego kąta
  statement: W ostrosłupie prawidłowym czworokątnym ABCDS krawędź podstawy ma długość a = 12, a każda
    ściana boczna jest nachylona do płaszczyzny podstawy pod kątem 60°. Oblicz wysokość tego ostrosłupa,
    długość apotemy (wysokości ściany bocznej) oraz długość krawędzi bocznej.
  statement_latex: \operatorname{tg}60^\circ=\frac{H}{\frac{12}{2}},\qquad \cos 60^\circ=\frac{\frac{12}{2}}{h_b},\qquad
    b=\sqrt{H^2+\left(\frac{12\sqrt{2}}{2}\right)^2}
  solution: 'Niech O będzie środkiem podstawy, a M — środkiem krawędzi AB. Wtedy r = OM = \frac{a}{2}
    = 6 oraz R = OA = \frac{a\sqrt{2}}{2} = 6\sqrt{2}. Kąt SMO = 60° jest kątem nachylenia ściany bocznej
    do podstawy, bo SM ⟂ AB i OM ⟂ AB. W trójkącie prostokątnym SOM: \operatorname{tg}60^\circ=\frac{H}{6},
    więc H = 6\sqrt{3}. Apotema: \cos 60^\circ=\frac{6}{h_b}, więc h_b=\frac{6}{\frac{1}{2}}=12. Krawędź
    boczna: w trójkącie prostokątnym SOA mamy b=\sqrt{H^2+R^2}=\sqrt{\left(6\sqrt{3}\right)^2+\left(6\sqrt{2}\right)^2}=\sqrt{108+72}=\sqrt{180}=6\sqrt{5}.'
  solution_steps:
  - Wyznacz r = \frac{a}{2} = 6 oraz R = \frac{a\sqrt{2}}{2} = 6\sqrt{2}.
  - 'Wskaż kąt liniowy kąta dwuściennego: kąt SMO = 60° w trójkącie prostokątnym SOM.'
  - Z \operatorname{tg}60^\circ=\frac{H}{6} oblicz H = 6\sqrt{3}.
  - Z \cos 60^\circ=\frac{6}{h_b} oblicz h_b = 12.
  - W trójkącie SOA oblicz b=\sqrt{\left(6\sqrt{3}\right)^2+\left(6\sqrt{2}\right)^2}=6\sqrt{5}.
  answer:
    kind: MULTIPART
    parts:
    - name: wysokość ostrosłupa
      answer:
        kind: SYMBOLIC
        latex: 6\sqrt{3}
    - name: apotema
      answer:
        kind: NUMERIC
        value: 12.0
        tol: 1.0e-06
        latex: '12'
    - name: krawędź boczna
      answer:
        kind: SYMBOLIC
        latex: 6\sqrt{5}
  checks:
  - kind: evaluate
    expr: \frac{12}{2}\cdot\tan\left(\frac{\pi}{3}\right)
    part: wysokość ostrosłupa
  - kind: evaluate
    expr: \frac{\frac{12}{2}}{\cos\left(\frac{\pi}{3}\right)}
    part: apotema
  - kind: evaluate
    expr: \sqrt{\left(6\sqrt{3}\right)^2+\left(6\sqrt{2}\right)^2}
    part: krawędź boczna
  skills:
  - kąt dwuścienny ściany bocznej z podstawą
  - apotema
  - krawędź boczna ostrosłupa prawidłowego
  verification:
    checkability: DETERMINISTIC
    note: 'all 3 parts solved fresh · det: [wysokość ostrosłupa] SymPy solved it fresh: 10.392304845413264
      vs 10.392304845413264 (tol 1e-09) ; [apotema] SymPy solved it fresh: 12.0 vs 12.0 (tol 1e-06) ;
