- id: g-cm-10
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 3
  exercise_type: funkcja klamrowa — wybór wzoru
  statement: 'Funkcja f jest określona dla wszystkich liczb rzeczywistych wzorem: f(x) = 3x + 5 dla x
    \le 1 oraz f(x) = x^2 - 2 dla x > 1. Oblicz f(1) oraz f(3). Uczeń zapisał: "f(1) = 1^2 - 2 = -1".
    Wskaż błąd w tym rozumowaniu i podaj poprawne wartości.'
  statement_latex: f\left(x\right)=\begin{cases} 3\cdot x+5 & \text{dla } x\le 1\\ x^{2}-2 & \text{dla
    } x>1\end{cases}
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: dla x = 1 uczeń wybrał wzór x² − 2 (bo "1 jest na granicy, więc pasuje do drugiego wzoru") i otrzymał f(1) = 1² − 2 = −1.
    NA CZYM POLEGA BŁĄD: przy pierwszym wzorze stoi warunek x ≤ 1 (nierówność NIEOSTRA), a przy drugim x > 1 (nierówność OSTRA). Liczba 1 spełnia warunek x ≤ 1, a nie spełnia warunku x > 1, więc dla x = 1 obowiązuje TYLKO pierwszy wzór.
    POPRAWNE ROZWIĄZANIE:
    x = 1: ponieważ 1 ≤ 1, korzystamy ze wzoru 3x + 5, czyli f(1) = 3·(1) + 5 = 8.
    x = 3: ponieważ 3 > 1, korzystamy ze wzoru x² − 2, czyli f(3) = (3)² − 2 = 9 − 2 = 7.
    Odpowiedź: f(1) = 8 (a nie −1) oraz f(3) = 7.
  solution_steps:
  - 'Rozpoznajemy błąd: zignorowanie różnicy między nierównością nieostrą x\le 1 a ostrą x>1.'
  - 'Dla x=1 sprawdzamy warunki: 1\le 1 jest prawdą, więc obowiązuje wzór 3\cdot x+5.'
  - Obliczamy f(1)=3\cdot\left(1\right)+5=8.
  - Dla x=3 zachodzi 3>1, więc f(3)=\left(3\right)^{2}-2=7.
