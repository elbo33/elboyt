- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: optymalizacja geometryczna z dodatkowym warunkiem zawężającym dziedzinę
  statement: Prostokątny ogród warzywny ma jeden bok położony wzdłuż prostego muru — ten bok nie wymaga
    ogrodzenia. Pozostałe trzy boki ogrodzono siatką o łącznej długości 60 m, zużywając całą siatkę. Ze
    względu na sposób nawadniania bok ogrodu leżący wzdłuż muru nie może być krótszy niż 40 m. Oblicz
    największe możliwe pole tego ogrodu oraz podaj wymiary ogrodu, dla którego to pole jest osiągane.
    Zapisz obliczenia.
  statement_latex: P\left(x\right) = x\cdot\left(60 - 2\cdot x\right) = -2\cdot x^2 + 60\cdot x
  solution: |-
    Niech x (w metrach) oznacza długość boku prostopadłego do muru. Ogrodzone są dwa takie boki oraz bok równoległy do muru, więc bok wzdłuż muru ma długość 60 - 2x.
    Warunki: x > 0 oraz 60 - 2x ≥ 40, czyli -2x ≥ -20, stąd x ≤ 10. Dziedzina: x ∈ (0, 10⟩ (warunek 60-2x>0 jest spełniony automatycznie).
    Pole: P(x) = x(60 - 2x) = -2x^2 + 60x.
    a = -2 < 0, ramiona w dół, p = -\frac{60}{2\cdot(-2)} = 15.
    p = 15 ∉ (0, 10⟩ — wierzchołek leży na prawo od dziedziny. Dla a < 0 funkcja rośnie w (-∞, 15⟩, więc na (0, 10⟩ jest rosnąca i największą wartość przyjmuje dla x = 10.
    P(10) = 10·(60 - 20) = 10·40 = 400.
    Odpowiedź: największe możliwe pole ogrodu wynosi 400 m² i jest osiągane dla ogrodu o wymiarach 10 m × 40 m (bok prostopadły do muru ma 10 m, bok wzdłuż muru 40 m). Wartość P(15) = 450 m² jest niedopuszczalna, bo wtedy bok wzdłuż muru miałby tylko 30 m.
  solution_steps:
  - Oznacz przez x długość boku prostopadłego do muru; bok wzdłuż muru ma wtedy 60 - 2x.
  - Z warunków x > 0 i 60 - 2x ≥ 40 wyznacz dziedzinę x ∈ (0, 10⟩.
  - Zapisz pole P(x) = x(60-2x) = -2x^2 + 60x.
  - Oblicz p = 15 i stwierdź, że 15 nie należy do dziedziny.
  - Z monotoniczności (a<0, dziedzina na lewo od p) wynika maksimum dla x = 10.
  - Oblicz P(10) = 400 m² i podaj wymiary 10 m i 40 m.
  answer:
    kind: MULTIPART
    parts:
    - name: pole
      answer:
        kind: NUMERIC
        value: 400.0
