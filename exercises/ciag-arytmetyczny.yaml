  statement: Pani Ewa spłaciła pożyczkę w wysokości 9000 zł w dwudziestu ratach. Każda kolejna rata była
    mniejsza od poprzedniej o 20 zł. Oblicz kwotę pierwszej raty oraz kwotę ostatniej (dwudziestej) raty.
    Zapisz obliczenia.
  statement_latex: \frac{2\cdot a_1 + 19\cdot\left(-20\right)}{2}\cdot 20 = 9000
  solution: |-
    Raty tworzą ciąg arytmetyczny o różnicy r = -20 i liczbie wyrazów n = 20, a suma wszystkich rat wynosi 9000 zł.
    1) Zapisuję równanie z niewiadomą a_1 (pierwszą ratą):
    \frac{2\cdot a_1 + 19\cdot(-20)}{2}\cdot 20 = 9000.
    2) Upraszczam: \left(2a_1 - 380\right)\cdot 10 = 9000, czyli 2a_1 - 380 = 900.
    3) Stąd 2a_1 = 1280, więc a_1 = 640.
    4) Ostatnia rata: a_{20} = a_1 + 19\cdot(-20) = 640 - 380 = 260.
    Kontrola: \frac{640 + 260}{2}\cdot 20 = 450\cdot 20 = 9000. ✓
    Odpowiedź: pierwsza rata wynosiła 640 zł, ostatnia 260 zł.
  solution_steps:
