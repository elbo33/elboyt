- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: odtworzenie sinusa i cosinusa z tangensa oraz obliczenie wartości wyrażenia
  statement: Kąt \alpha jest ostry oraz \operatorname{tg}\alpha = \frac{3}{4}. Oblicz \sin\alpha, \cos\alpha
    oraz wartość wyrażenia W = \frac{5\cdot\sin\alpha - 2\cdot\cos\alpha}{\sin\alpha + 4\cdot\cos\alpha}.
  statement_latex: \operatorname{tg}\alpha=\frac{3}{4},\qquad W=\frac{5\cdot\sin\alpha-2\cdot\cos\alpha}{\sin\alpha+4\cdot\cos\alpha}
  solution: |-
    Z definicji tangensa \sin\alpha=\frac{3}{4}\cdot\cos\alpha. Wstawiamy do jedynki:
    \left(\frac{3}{4}\cos\alpha\right)^{2}+\cos^{2}\alpha=1, czyli \frac{9}{16}\cos^{2}\alpha+\cos^{2}\alpha=1, więc \frac{25}{16}\cos^{2}\alpha=1.
    Stąd \cos^{2}\alpha=\frac{16}{25}, a ponieważ kąt jest ostry, \cos\alpha=\frac{4}{5}.
    Wtedy \sin\alpha=\frac{3}{4}\cdot\frac{4}{5}=\frac{3}{5}.
    (Można też skorzystać z trójkąta o przyprostokątnych 3 i 4 oraz przeciwprostokątnej 5.)
    Wartość wyrażenia najwygodniej policzyć, dzieląc licznik i mianownik przez \cos\alpha\neq 0:
    W=\frac{5\operatorname{tg}\alpha-2}{\operatorname{tg}\alpha+4}=\frac{5\cdot\frac{3}{4}-2}{\frac{3}{4}+4}=\frac{\frac{15}{4}-2}{\frac{19}{4}}=\frac{\frac{7}{4}}{\frac{19}{4}}=\frac{7}{19}.
    Kontrola liczbowa: licznik 5\cdot\frac{3}{5}-2\cdot\frac{4}{5}=\frac{7}{5}, mianownik \frac{3}{5}+4\cdot\frac{4}{5}=\frac{19}{5}, iloraz \frac{7}{19}.
    Odpowiedź: \sin\alpha=\frac{3}{5}, \cos\alpha=\frac{4}{5}, W=\frac{7}{19}.
  solution_steps:
  - Zapisz \sin\alpha=\frac{3}{4}\cdot\cos\alpha.
  - 'Wstaw do jedynki: \frac{25}{16}\cos^{2}\alpha=1, więc \cos^{2}\alpha=\frac{16}{25}.'
  - 'Kąt ostry: \cos\alpha=\frac{4}{5}, stąd \sin\alpha=\frac{3}{5}.'
  - 'Podziel licznik i mianownik W przez \cos\alpha: W=\frac{5\operatorname{tg}\alpha-2}{\operatorname{tg}\alpha+4}.'
  - Podstaw \operatorname{tg}\alpha=\frac{3}{4} i oblicz W=\frac{7}{19}.
  answer:
    kind: MULTIPART
    parts:
    - name: sin
      answer:
        kind: SYMBOLIC
        latex: \frac{3}{5}
    - name: cos
      answer:
        kind: SYMBOLIC
        latex: \frac{4}{5}
    - name: W
      answer:
        kind: SYMBOLIC
        latex: \frac{7}{19}
  checks:
  - kind: evaluate
    expr: \frac{\frac{3}{4}}{\sqrt{1+\left(\frac{3}{4}\right)^{2}}}
    part: sin
  - kind: evaluate
    expr: \frac{1}{\sqrt{1+\left(\frac{3}{4}\right)^{2}}}
    part: cos
  - kind: evaluate
    expr: \frac{5\cdot\frac{3}{5}-2\cdot\frac{4}{5}}{\frac{3}{5}+4\cdot\frac{4}{5}}
    part: W
  skills:
  - metoda podstawienia \sin\alpha=t\cdot\cos\alpha
  - jedynka trygonometryczna
  - dzielenie licznika i mianownika przez \cos\alpha
  verification:
