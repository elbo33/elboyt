- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 4
  exercise_type: Zadanie tekstowe — liczba dwucyfrowa, model z układem równań
  statement: Pewna liczba dwucyfrowa jest cztery razy większa od sumy swoich cyfr. Jeżeli do tej liczby
    dodamy 18, to otrzymamy liczbę zapisaną tymi samymi cyframi, ale w odwrotnej kolejności. Wyznacz tę
    liczbę dwucyfrową. Zapisz obliczenia.
  statement_latex: \left\{ \begin{matrix} 10\cdot a + b = 4\cdot\left(a + b\right) \\ 10\cdot a + b +
    18 = 10\cdot b + a \end{matrix} \right.
  solution: |-
    Oznaczenia: \(a\) — cyfra dziesiątek, \(b\) — cyfra jedności, przy czym \(a \in \{1,\ldots,9\}\), \(b \in \{0,\ldots,9\}\) i obie są liczbami całkowitymi. Szukana liczba to \(10a + b\), a liczba o przestawionych cyfrach to \(10b + a\).
    Pierwszy warunek: \(10a + b = 4\cdot\left(a + b\right)\), czyli \(10a + b = 4a + 4b\), stąd \(6a = 3b\), czyli \(b = 2a\).
    Drugi warunek: \(10a + b + 18 = 10b + a\), czyli \(9a + 18 = 9b\), stąd \(b - a = 2\).
