- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: równanie wymierne sprowadzalne do kwadratowego
  statement: Dane jest równanie \(\frac{24}{x}-\frac{24}{x+2}=2\). Wyznacz wszystkie liczby, których nie
    może przyjmować niewiadoma \(x\) (wartości wykluczone z dziedziny), a następnie rozwiąż to równanie.
    Zapisz obliczenia.
  statement_latex: \frac{24}{x}-\frac{24}{x+2}=2
  solution: |-
    Dziedzina: mianowniki muszą być różne od zera, więc \(x\neq 0\) i \(x+2\neq 0\), czyli wykluczamy \(x=0\) oraz \(x=-2\).
    Mnożymy obie strony przez \(x\cdot\left(x+2\right)\):
    \(24\cdot\left(x+2\right)-24\cdot x=2\cdot x\cdot\left(x+2\right)\)
    \(24x+48-24x=2x^{2}+4x\)
    \(48=2x^{2}+4x\)
    \(2x^{2}+4x-48=0\), po podzieleniu przez 2: \(x^{2}+2x-24=0\).
    \(\Delta=2^{2}-4\cdot 1\cdot\left(-24\right)=4+96=100\), \(\sqrt{\Delta}=10\).
    \(x_{1}=\frac{-2-10}{2}=-6\), \(x_{2}=\frac{-2+10}{2}=4\).
    Obie liczby należą do dziedziny (żadna nie jest równa 0 ani −2), więc obie są rozwiązaniami.
    Odpowiedź: wykluczone są \(x=0\) i \(x=-2\); rozwiązania: \(x=-6\) lub \(x=4\).
  solution_steps:
  - 'Ustal dziedzinę: x ≠ 0 i x ≠ −2.'
  - Pomnóż obie strony przez x(x+2).
  - Uporządkuj do postaci x² + 2x − 24 = 0.
  - Oblicz Δ = 100 i wyznacz x₁ = −6, x₂ = 4.
  - Sprawdź zgodność z dziedziną i zapisz odpowiedź.
  answer:
    kind: MULTIPART
    parts:
    - name: wartosci wykluczone
      answer:
        kind: SET
        members:
        - '0'
        - '-2'
    - name: rozwiazania
      answer:
        kind: SET
        members:
        - '-6'
        - '4'
  checks:
  - kind: solve_equation
    expr: x\cdot\left(x+2\right)=0
    part: wartosci wykluczone
  - kind: solve_equation
    expr: \frac{24}{x}-\frac{24}{x+2}=2
    part: rozwiazania
  skills:
  - wyznaczanie dziedziny
  - przekształcanie równania wymiernego
  - rozwiązywanie równania kwadratowego
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [wartosci wykluczone] SymPy solved it fresh: 2 members matched
      ; [rozwiazania] SymPy solved it fresh: 2 members matched'
- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: równanie kwadratowe z parametrem i wzory Viète'a
  statement: Dane jest równanie \(x^{2}-6x+\left(m-2\right)=0\) z niewiadomą \(x\) i parametrem \(m\).
    a) Wyznacz wszystkie wartości parametru \(m\), dla których to równanie ma dwa różne rozwiązania rzeczywiste
    \(x_{1}\), \(x_{2}\). b) Wyznacz wszystkie takie wartości \(m\), dla których spełniony jest warunek
    \(x_{1}^{2}+x_{2}^{2}=20\). Zapisz obliczenia.
  statement_latex: x^{2}-6x+\left(m-2\right)=0,\qquad x_{1}^{2}+x_{2}^{2}=20
  solution: |-
    a) Tu \(a=1\neq 0\), \(b=-6\), \(c=m-2\).
    \(\Delta=\left(-6\right)^{2}-4\cdot 1\cdot\left(m-2\right)=36-4m+8=44-4m\).
    Warunek dwóch różnych rozwiązań: \(\Delta>0\), czyli \(44-4m>0\), stąd \(m<11\).

    b) Dla \(m<11\) pierwiastki istnieją, więc możemy użyć wzorów Viète'a:
    \(S=x_{1}+x_{2}=-\frac{b}{a}=6\), \(P=x_{1}\cdot x_{2}=\frac{c}{a}=m-2\).
    \(x_{1}^{2}+x_{2}^{2}=S^{2}-2P=36-2\cdot\left(m-2\right)=40-2m\).
    Warunek zadania: \(40-2m=20\), czyli \(2m=20\), zatem \(m=10\).
    Sprawdzamy założenie: \(10<11\) ✓ (dla \(m=10\) mamy \(\Delta=44-40=4>0\)).
    Odpowiedź: a) \(m\in\left(-\infty,\,11\right)\); b) \(m=10\).
  solution_steps:
  - Zapisz Δ = (−6)² − 4·1·(m − 2) = 44 − 4m.
  - Rozwiąż nierówność 44 − 4m > 0, otrzymując m < 11.
  - 'Zapisz wzory Viète''a: S = 6, P = m − 2.'
  - Przekształć x₁² + x₂² = S² − 2P = 40 − 2m.
  - Rozwiąż równanie 40 − 2m = 20, czyli m = 10.
  - Sprawdź, że m = 10 spełnia warunek m < 11.
  answer:
    kind: MULTIPART
    parts:
    - name: m dla dwoch roznych rozwiazan
      answer:
        kind: INTERVAL
        lo: -\infty
        hi: '11'
    - name: m z warunku na sume kwadratow
      answer:
        kind: NUMERIC
        value: 10.0
  checks:
  - kind: solve_inequality
    expr: 44-4\cdot m>0
    var: m
    part: m dla dwoch roznych rozwiazan
  - kind: solve_equation
    expr: 40-2\cdot m=20
    var: m
    part: m z warunku na sume kwadratow
  skills:
  - warunek Δ > 0 z parametrem
  - wzory Viète'a
  - wyrażenia symetryczne pierwiastków
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [m dla dwoch roznych rozwiazan] SymPy solved it fresh: endpoints
      matched ; [m z warunku na sume kwadratow] SymPy solved it fresh: 10.0 vs 10.0 (tol 1e-09)'
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 4
  exercise_type: równanie wymierne sprowadzalne do kwadratowego
  statement: Dane jest równanie \frac{3}{x-2} + \frac{x}{x+2} = \frac{12}{x^{2}-4}. Wyznacz dziedzinę
    tego równania, a następnie rozwiąż je. Zapisz obliczenia.
  statement_latex: \frac{3}{x-2} + \frac{x}{x+2} = \frac{12}{x^{2}-4}
  solution: |-
    DZIEDZINA. Mianowniki: x-2, x+2 oraz x^{2}-4 = \left(x-2\right)\left(x+2\right). Muszą być różne od zera, więc x \neq 2 i x \neq -2. Dziedziną jest zbiór \mathbb{R}\setminus\left\{-2,\,2\right\}.

    PRZEKSZTAŁCENIE. Mnożymy obie strony równania przez \left(x-2\right)\left(x+2\right) (dla x z dziedziny jest to liczba różna od zera):
    3\cdot\left(x+2\right) + x\cdot\left(x-2\right) = 12,
    3x + 6 + x^{2} - 2x = 12,
    x^{2} + x - 6 = 0.

    ROZWIĄZANIE RÓWNANIA KWADRATOWEGO. a = 1, b = 1, c = -6, więc \Delta = 1^{2} - 4\cdot 1\cdot\left(-6\right) = 1 + 24 = 25, \sqrt{\Delta} = 5.
    x_{1} = \frac{-1-5}{2} = -3, \qquad x_{2} = \frac{-1+5}{2} = 2.

    WERYFIKACJA Z DZIEDZINĄ. Liczba 2 nie należy do dziedziny (zeruje mianowniki), więc jest rozwiązaniem obcym i ją odrzucamy. Zostaje x = -3.

    SPRAWDZENIE: \frac{3}{-5} + \frac{-3}{-1} = -\frac{3}{5} + 3 = \frac{12}{5} oraz \frac{12}{\left(-3\right)^{2}-4} = \frac{12}{5}. Zgadza się.

    Odpowiedź: dziedzina to \mathbb{R}\setminus\left\{-2,\,2\right\}, jedynym rozwiązaniem jest x = -3.
  solution_steps:
  - 'Przyrównaj mianowniki do zera: x-2 \neq 0, x+2 \neq 0, więc D = \mathbb{R}\setminus\left\{-2,2\right\}.'
  - Zauważ, że x^{2}-4 = \left(x-2\right)\left(x+2\right) i pomnóż równanie stronami przez \left(x-2\right)\left(x+2\right).
  - 'Uporządkuj: 3x+6+x^{2}-2x = 12, czyli x^{2}+x-6 = 0.'
  - Oblicz \Delta = 1 + 24 = 25 i pierwiastki x = -3 oraz x = 2.
  - 'Odrzuć x = 2 jako liczbę spoza dziedziny; odpowiedź: x = -3.'
  answer:
    kind: MULTIPART
    parts:
    - name: dziedzina
      answer:
        kind: SYMBOLIC
        latex: \mathbb{R}\setminus\left\{-2,\,2\right\}
    - name: rozwiazanie
      answer:
        kind: SET
        members:
        - '-3'
  checks:
  - kind: solve_equation
    expr: \frac{3}{x-2} + \frac{x}{x+2} = \frac{12}{x^{2}-4}
    part: rozwiazanie
  skills:
  - wyznaczanie dziedziny równania wymiernego
  - sprowadzanie do postaci ogólnej ax^2+bx+c=0
  - rozwiązywanie równania kwadratowego deltą
  - odrzucanie rozwiązań spoza dziedziny
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 5
  exercise_type: równanie kwadratowe z parametrem, wzory Viète'a
  statement: Dane jest równanie x^{2} + \left(m-3\right)\cdot x + m = 0 z niewiadomą x i parametrem m.
    a) Wyznacz wszystkie wartości m, dla których to równanie ma dwa różne rozwiązania rzeczywiste. b)
    Wyznacz wszystkie wartości m, dla których równanie ma dwa różne rozwiązania x_{1}, x_{2} spełniające
    warunek x_{1}^{2} + x_{2}^{2} = 9. Zapisz obliczenia.
  statement_latex: x^{2} + \left(m-3\right)\cdot x + m = 0,\qquad x_{1}^{2}+x_{2}^{2} = 9
  solution: |-
    a) Współczynnik przy x^{2} jest równy 1, więc równanie zawsze jest kwadratowe. Mamy a = 1, b = m-3, c = m, zatem
    \Delta = \left(m-3\right)^{2} - 4\cdot 1\cdot m = m^{2} - 6m + 9 - 4m = m^{2} - 10m + 9.
    Dwa różne rozwiązania istnieją wtedy i tylko wtedy, gdy \Delta > 0, czyli m^{2}-10m+9 > 0. Miejsca zerowe tego trójmianu: \Delta_{m} = 100 - 36 = 64, \sqrt{\Delta_{m}} = 8, więc m = \frac{10-8}{2} = 1 oraz m = \frac{10+8}{2} = 9. Ramiona paraboli skierowane są w górę, więc nierówność jest spełniona dla m \in \left(-\infty,\,1\right)\cup\left(9,\,+\infty\right).

    b) Ze wzorów Viète'a (przy założeniu \Delta > 0):
    S = x_{1}+x_{2} = -\frac{m-3}{1} = 3-m, \qquad P = x_{1}\cdot x_{2} = m.
    Stąd x_{1}^{2}+x_{2}^{2} = S^{2} - 2P = \left(3-m\right)^{2} - 2m = m^{2} - 6m + 9 - 2m = m^{2} - 8m + 9.
    Warunek zadania: m^{2}-8m+9 = 9, czyli m^{2}-8m = 0, m\left(m-8\right) = 0, więc m = 0 lub m = 8.

    SPRAWDZENIE WARUNKU Z PUNKTU a): m = 0 należy do \left(-\infty,1\right) — dobrze. Dla m = 8 mamy \Delta = 64-80+9 = -7 < 0, więc równanie nie ma wtedy pierwiastków i tę wartość odrzucamy.

    Kontrola dla m = 0: x^{2}-3x = 0, czyli x = 0 lub x = 3, a wtedy x_{1}^{2}+x_{2}^{2} = 0 + 9 = 9. Zgadza się.

    Odpowiedź: a) m \in \left(-\infty,1\right)\cup\left(9,+\infty\right); b) m = 0.
  solution_steps:
  - Zapisz a = 1, b = m-3, c = m i oblicz \Delta = \left(m-3\right)^{2}-4m = m^{2}-10m+9.
  - 'Rozwiąż nierówność m^{2}-10m+9 > 0: miejsca zerowe 1 i 9, stąd m \in \left(-\infty,1\right)\cup\left(9,+\infty\right).'
  - 'Zapisz wzory Viète''a: S = 3-m, P = m.'
  - Przekształć x_{1}^{2}+x_{2}^{2} = S^{2}-2P = m^{2}-8m+9.
  - Rozwiąż równanie m^{2}-8m+9 = 9, otrzymując m = 0 lub m = 8.
  - 'Odrzuć m = 8 (wtedy \Delta = -7 < 0); odpowiedź: m = 0.'
  answer:
    kind: MULTIPART
    parts:
    - name: a_dwa_rozwiazania
      answer:
        kind: SYMBOLIC
        latex: m \in \left(-\infty,\,1\right)\cup\left(9,\,+\infty\right)
    - name: b_parametr
      answer:
        kind: NUMERIC
        value: 0.0
  checks:
  - kind: solve_inequality
    expr: m^{2} - 10 \cdot m + 9 > 0
    var: m
    part: a_dwa_rozwiazania
  skills:
  - obliczanie delty z parametrem
  - rozwiązywanie nierówności kwadratowej z parametrem
  - wzory Viète'a
  - suma kwadratów pierwiastków
  - odrzucanie wartości parametru niespełniających warunku \Delta>0
  verification:
    checkability: DETERMINISTIC
    note: '[a_dwa_rozwiazania] SymPy solved it fresh and disagrees: ''m \\in \\left(-\\infty,\\,1\\right)\\cup\\left(9,\\,+\\infty\\right)''
      vs ''Union(Interval.open(-oo, 1), Interval.open(9, oo))'' (as text)'
- id: g-cm-06
  slot: COMMON_MISTAKE
  ramp_index: 0
  difficulty: 2
  exercise_type: demonstracja błędu — dzielenie przez x
  statement: Rozwiąż równanie \(5x^{2}=15x\). Uczeń podzielił obie strony tego równania przez \(x\) i
    otrzymał \(5x=15\), a stąd jedno rozwiązanie \(x=3\). Wskaż błąd w tym rozumowaniu i podaj wszystkie
    rozwiązania równania.
  statement_latex: 5x^{2}=15x
  solution: |-
    BŁĘDNE ROZUMOWANIE: \(5x^{2}=15x\ \Rightarrow\ 5x=15\ \Rightarrow\ x=3\) — jedno rozwiązanie.

    GDZIE JEST BŁĄD: dzielenie obu stron przez \(x\) jest dozwolone tylko przy założeniu \(x\neq 0\). Uczeń „po drodze” wykluczył liczbę 0, a przecież \(x=0\) spełnia równanie: \(5\cdot 0^{2}=0\) i \(15\cdot 0=0\). W ten sposób rozwiązanie zostało zgubione.

    POPRAWNE ROZWIĄZANIE: przenosimy wszystko na jedną stronę i wyłączamy wspólny czynnik:
    \(5x^{2}-15x=0\)
    \(5x\cdot\left(x-3\right)=0\)
    \(5x=0\) lub \(x-3=0\)
    \(x=0\) lub \(x=3\).
    Odpowiedź: równanie ma dwa rozwiązania: \(x=0\) i \(x=3\).
  solution_steps:
