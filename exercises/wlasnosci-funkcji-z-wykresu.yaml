  statement_latex: A=\left(-5,\,4\right),\ B=\left(-2,\,-2\right),\ C=\left(0,\,3\right),\ D=\left(3,\,-3\right)
  solution: |-
    Błędne rozumowanie ucznia: „na odcinku AB wykres opada i na odcinku CD też opada, więc funkcja maleje w zbiorze ⟨-5, -2⟩ ∪ ⟨0, 3⟩”.

    Kontrprzykład obalający ten zapis: weźmy x_1 = -2 (z pierwszego kawałka) i x_2 = 0 (z drugiego kawałka). Wtedy x_1 < x_2, ale f\left(-2\right) = -2 oraz f\left(0\right) = 3, czyli f\left(x_1\right) < f\left(x_2\right). Warunek definicji funkcji malejącej (x_1 < x_2 \Rightarrow f\left(x_1\right) > f\left(x_2\right)) nie jest spełniony, więc na sumie tych przedziałów funkcja NIE jest malejąca.

    Korekta: monotoniczność orzekamy o przedziale, a przedziały monotoniczności wypisujemy oddzielnie. Idąc od lewej: od A do B wykres opada (z 4 do -2), więc f maleje w ⟨-5, -2⟩; od B do C wykres się wznosi (z -2 do 3), więc f rośnie w ⟨-2, 0⟩; od C do D wykres opada (z 3 do -3), więc f maleje w ⟨0, 3⟩. Nigdy nie łączymy tych przedziałów znakiem sumy.
  solution_steps:
  - 'Pokaż błąd: uczeń połączył dwa przedziały malenia znakiem sumy zbiorów.'
  - 'Podaj kontrprzykład: x1 = -2, x2 = 0, x1 < x2, ale f(-2) = -2 < 3 = f(0), więc definicja funkcji
    malejącej nie jest spełniona.'
  - 'Prześledź wykres od lewej: odcinek AB opada — f maleje w ⟨-5, -2⟩.'
  - Odcinek BC wznosi się — f rośnie w ⟨-2, 0⟩.
  - Odcinek CD opada — f maleje w ⟨0, 3⟩; przedziały zapisujemy osobno.
  answer:
    kind: MULTIPART
    parts:
    - name: pierwszy przedział, w którym f maleje
      answer:
        kind: INTERVAL
        lo: '-5'
        hi: '-2'
        lo_open: false
        hi_open: false
    - name: drugi przedział, w którym f maleje
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '3'
        lo_open: false
