- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: dwie cięciwy równoległe
  statement: 'W okręgu o środku O i promieniu 25 poprowadzono dwie cięciwy równoległe: cięciwę AB o długości
    48 oraz cięciwę CD o długości 14. Wyznacz wszystkie możliwe odległości między prostymi zawierającymi
    te cięciwy, rozważając oba położenia cięciw względem środka okręgu. Zapisz obliczenia.'
  statement_latex: k_{1} = \sqrt{25^{2}-\left(\frac{48}{2}\right)^{2}},\qquad k_{2} = \sqrt{25^{2}-\left(\frac{14}{2}\right)^{2}}
  solution: |-
    Odległość środka od cięciwy AB: połowa AB to 24, więc k_{1} = \sqrt{25^{2}-24^{2}} = \sqrt{625-576} = \sqrt{49} = 7.
    Odległość środka od cięciwy CD: połowa CD to 7, więc k_{2} = \sqrt{25^{2}-7^{2}} = \sqrt{625-49} = \sqrt{576} = 24.
    Przypadek 1 – cięciwy leżą po przeciwnych stronach środka: odległość między nimi wynosi k_{1}+k_{2} = 7+24 = 31.
    Przypadek 2 – cięciwy leżą po tej samej stronie środka: odległość wynosi k_{2}-k_{1} = 24-7 = 17.
    Oba wyniki są możliwe, bo 31 < 2r = 50.
    Odpowiedź: 31 albo 17.
  solution_steps:
  - k1 = √(25² − 24²) = 7 (dla cięciwy 48).
  - k2 = √(25² − 7²) = 24 (dla cięciwy 14).
  - 'Cięciwy po przeciwnych stronach środka: k1 + k2 = 31.'
  - 'Cięciwy po tej samej stronie środka: k2 − k1 = 17.'
  - Podaj oba wyniki, bo treść nie rozstrzyga położenia.
  answer:
    kind: MULTIPART
    parts:
    - name: po_przeciwnych_stronach
      answer:
        kind: NUMERIC
        value: 31.0
        latex: '31'
    - name: po_tej_samej_stronie
      answer:
        kind: NUMERIC
        value: 17.0
        latex: '17'
  checks:
  - kind: evaluate
    expr: \sqrt{25^{2}-\left(\frac{48}{2}\right)^{2}}+\sqrt{25^{2}-\left(\frac{14}{2}\right)^{2}}
    part: po_przeciwnych_stronach
  - kind: evaluate
    expr: \sqrt{25^{2}-\left(\frac{14}{2}\right)^{2}}-\sqrt{25^{2}-\left(\frac{48}{2}\right)^{2}}
    part: po_tej_samej_stronie
  skills:
  - odległość środka od cięciwy
  - analiza dwóch przypadków położenia
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [po_przeciwnych_stronach] SymPy solved it fresh: 31.0 vs 31.0
