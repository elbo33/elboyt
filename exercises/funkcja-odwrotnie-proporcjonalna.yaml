    a) Oblicz, ile maszyn pakuje partię towaru w ciągu 12 godzin.
    b) Oblicz, w ciągu ilu godzin tę samą partię towaru zapakowałoby 16 takich maszyn.
  statement_latex: 12\cdot x = 8\cdot \left(x+4\right)
  solution: |-
    Oznaczmy przez x liczbę maszyn pakujących partię towaru w ciągu 12 godzin (x > 0). Przy jednakowej wydajności maszyn iloczyn (liczba maszyn) \cdot (czas pracy) jest stały i równy całej pracy do wykonania.
