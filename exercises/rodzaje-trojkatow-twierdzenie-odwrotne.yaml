- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: wyznaczanie brakującego boku trójkąta prostokątnego
  statement: Dwa boki trójkąta mają długości 9 i 12. Wyznacz wszystkie możliwe długości x trzeciego boku,
    dla których trójkąt ten jest prostokątny. Rozważ oba położenia szukanego boku i za każdym razem sprawdź
    nierówność trójkąta.
  statement_latex: x^{2}=9^{2}+12^{2} \qquad\text{albo}\qquad x^{2}+9^{2}=12^{2}
  solution: |-
    Przypadek 1: bok x jest przeciwprostokątną (najdłuższym bokiem). Wtedy x² = 9² + 12² = 81 + 144 = 225, czyli x = 15. Sprawdzenie nierówności trójkąta: 9 + 12 = 21 > 15 ✔ (to trójka pitagorejska 9, 12, 15).
    Przypadek 2: przeciwprostokątną jest dłuższy z danych boków, czyli 12, a x jest przyprostokątną. Wtedy x² + 9² = 12², więc x² = 144 − 81 = 63 i x = √63 = 3√7 ≈ 7,94. Sprawdzenie: dwa krótsze boki to 3√7 i 9, a 3√7 + 9 ≈ 16,9 > 12 ✔.
    Przypadek, w którym przeciwprostokątną byłby bok długości 9, jest niemożliwy, bo przeciwprostokątna musi być najdłuższym bokiem, a mamy bok 12 > 9.
    Odpowiedź: x = 15 lub x = 3√7.
  solution_steps:
  - 'Przypadek 1: x jest przeciwprostokątną, więc x² = 9² + 12² = 225 i x = 15.'
  - 'Sprawdzam nierówność trójkąta dla 9, 12, 15: 9 + 12 = 21 > 15.'
  - 'Przypadek 2: przeciwprostokątną jest bok 12, więc x² = 12² − 9² = 63 i x = 3√7.'
  - 'Sprawdzam nierówność trójkąta dla 3√7, 9, 12: 3√7 + 9 > 12.'
  - Odrzucam przypadek, w którym przeciwprostokątną byłby bok 9 (nie jest najdłuższy).
  - 'Zapisuję odpowiedź: x = 15 lub x = 3√7.'
  answer:
    kind: MULTIPART
    parts:
    - name: x, gdy szukany bok jest przeciwprostokątną
      answer:
        kind: NUMERIC
        value: 15.0
    - name: x, gdy szukany bok jest przyprostokątną
      answer:
        kind: SYMBOLIC
        latex: 3\sqrt{7}
  checks:
  - kind: evaluate
    expr: \sqrt{9^{2}+12^{2}}
    part: x, gdy szukany bok jest przeciwprostokątną
  - kind: evaluate
    expr: \sqrt{12^{2}-9^{2}}
    part: x, gdy szukany bok jest przyprostokątną
  skills:
  - twierdzenie Pitagorasa
  - rozważanie dwóch przypadków
  - nierówność trójkąta
  verification:
