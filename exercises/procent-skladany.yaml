    Łączny czynnik: q = 1,1·1,2 = 1,32.
    Cena końcowa: C = 200·1,32 = 264 zł.
    Odpowiedź: czynnik łączny to 1,32 (łączna podwyżka o 32%), cena końcowa 264 zł.
  solution_steps:
