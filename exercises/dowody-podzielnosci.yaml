- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: zapis dziesiętny — dowód i wyznaczenie liczb z warunku
  statement: |-
    Pewna liczba dwucyfrowa ma cyfrę dziesiątek a i cyfrę jedności b, przy czym b\ge 1. Po zamianie cyfr miejscami otrzymujemy drugą liczbę dwucyfrową.
    a) Wykaż, że różnica kwadratu pierwszej liczby i kwadratu drugiej liczby jest podzielna przez 99.
    b) Wyznacz wszystkie liczby dwucyfrowe, dla których różnica ta jest równa 4455.
  statement_latex: \left(10\cdot a+b\right)^{2}-\left(10\cdot b+a\right)^{2}=99\cdot\left(a-b\right)\cdot\left(a+b\right)
  solution: |-
    a) Oznaczamy N=10\cdot a+b oraz M=10\cdot b+a, gdzie a\in\{1,\ldots,9\}, b\in\{1,\ldots,9\}. Ze wzoru na różnicę kwadratów
    N^{2}-M^{2}=\left(N-M\right)\cdot\left(N+M\right)=\left(9\cdot a-9\cdot b\right)\cdot\left(11\cdot a+11\cdot b\right)=9\cdot 11\cdot\left(a-b\right)\cdot\left(a+b\right)=99\cdot\left(a-b\right)\cdot\left(a+b\right).
    Liczba \left(a-b\right)\cdot\left(a+b\right) jest całkowita, więc N^{2}-M^{2} jest iloczynem liczby 99 i liczby całkowitej, zatem jest podzielna przez 99. To należało wykazać.

    b) Z warunku 99\cdot\left(a-b\right)\cdot\left(a+b\right)=4455 otrzymujemy \left(a-b\right)\cdot\left(a+b\right)=\frac{4455}{99}=45.
    Ponieważ 45>0 oraz a+b>0, mamy a-b>0. Liczba 45 jest nieparzysta, więc oba czynniki a-b i a+b są nieparzyste, a przy tym a-b<a+b. Możliwe rozkłady liczby 45 na iloczyn dwóch dodatnich czynników, w którym pierwszy jest mniejszy, to 1\cdot 45, 3\cdot 15 oraz 5\cdot 9.
    • a-b=1 i a+b=45 — niemożliwe, bo a+b\le 9+9=18.
    • a-b=3 i a+b=15 — stąd a=9, b=6, czyli liczba 96.
    • a-b=5 i a+b=9 — stąd a=7, b=2, czyli liczba 72.
    Oba wyniki spełniają warunki zadania (cyfry, b\ge 1). Sprawdzenie: 96^{2}-69^{2}=9216-4761=4455 oraz 72^{2}-27^{2}=5184-729=4455.
    Szukane liczby dwucyfrowe to 72 i 96.
  solution_steps:
  - 'Wprowadź oznaczenia cyfr: N=10\cdot a+b, M=10\cdot b+a.'
  - 'Zastosuj wzór na różnicę kwadratów: N^{2}-M^{2}=99\cdot\left(a-b\right)\cdot\left(a+b\right) i sformułuj
    wniosek o podzielności przez 99.'
  - Z równania 99\cdot\left(a-b\right)\cdot\left(a+b\right)=4455 otrzymaj \left(a-b\right)\cdot\left(a+b\right)=45.
