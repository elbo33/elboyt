- id: g-th-02
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: warunek istnienia trójkąta
  statement: 'Rozstrzygnij, czy z odcinków o podanych długościach można zbudować trójkąt: a) 3, 8, 12;
    b) 5, 7, 9. W każdym przypadku zapisz sprawdzaną nierówność.'
  statement_latex: 3+8 \ \square\ 12 \qquad\text{oraz}\qquad 5+7 \ \square\ 9
  solution: |-
    Wystarczy porównać sumę dwóch krótszych odcinków z najdłuższym.
    a) Najdłuższy odcinek ma długość 12, a suma dwóch krótszych wynosi 3 + 8 = 11. Ponieważ 11 < 12, nierówność trójkąta nie jest spełniona — trójkąta zbudować NIE można.
    b) Najdłuższy odcinek ma długość 9, a suma dwóch krótszych wynosi 5 + 7 = 12. Ponieważ 12 > 9, nierówność trójkąta jest spełniona — trójkąt zbudować MOŻNA.
  solution_steps:
  - 'a) Wskazuję najdłuższy odcinek: 12; sumuję dwa krótsze: 3 + 8 = 11.'
  - 'a) Porównuję: 11 < 12, więc nierówność trójkąta nie zachodzi — trójkąt nie istnieje.'
  - 'b) Wskazuję najdłuższy odcinek: 9; sumuję dwa krótsze: 5 + 7 = 12.'
  - 'b) Porównuję: 12 > 9, więc trójkąt o takich bokach istnieje.'
  answer:
    kind: MULTIPART
    parts:
    - name: a) 3, 8, 12
      answer:
        kind: BOOLEAN
        truth: false
    - name: b) 5, 7, 9
      answer:
        kind: BOOLEAN
        truth: true
  skills:
  - nierówność trójkąta
  - sprawdzanie warunku istnienia trójkąta
  verification:
    checkability: REFERENCE_CALL
    note: 2 parts matched
- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: klasyfikacja trójkąta i cosinus największego kąta
  statement: 'W trójkącie ABC dane są długości boków: |AB| = 14, |BC| = 10, |CA| = 8. Rozstrzygnij, jakiego
    rodzaju jest ten trójkąt, wskaż wierzchołek, przy którym leży jego największy kąt, oraz oblicz cosinus
    tego kąta.'
  statement_latex: \cos\gamma = \frac{10^{2}+8^{2}-14^{2}}{2\cdot 10\cdot 8}
  solution: |-
    Warunek istnienia: dwa krótsze boki to 8 i 10, a 8 + 10 = 18 > 14 — trójkąt istnieje.
    Najdłuższym bokiem jest AB o długości 14. Naprzeciw niego leży kąt przy wierzchołku C, więc to on jest największym kątem trójkąta.
    Porównuję: 10² + 8² = 100 + 64 = 164 oraz 14² = 196. Ponieważ 164 < 196, kąt przy wierzchołku C jest rozwarty, a trójkąt jest rozwartokątny.
    Z twierdzenia cosinusów: cos γ = (10² + 8² − 14²)/(2·10·8) = (164 − 196)/160 = −32/160 = −1/5 = −0,2.
    Ujemna wartość cosinusa potwierdza, że kąt C jest rozwarty.
  solution_steps:
  - 'Sprawdzam warunek istnienia: 8 + 10 = 18 > 14.'
  - Wskazuję najdłuższy bok AB = 14; naprzeciw niego leży kąt przy wierzchołku C.
  - Obliczam 10² + 8² = 164 i 14² = 196.
  - Ponieważ 164 < 196, trójkąt jest rozwartokątny, a kąt rozwarty leży przy wierzchołku C.
  - 'Z twierdzenia cosinusów: cos γ = (100 + 64 − 196)/(2·10·8) = −32/160 = −1/5.'
  answer:
    kind: MULTIPART
    parts:
    - name: rodzaj trójkąta
      answer:
        kind: SYMBOLIC
        latex: \text{trójkąt rozwartokątny}
    - name: wierzchołek największego kąta
      answer:
        kind: SYMBOLIC
        latex: C
    - name: cosinus największego kąta
      answer:
        kind: NUMERIC
        value: -0.2
