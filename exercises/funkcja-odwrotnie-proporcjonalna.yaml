  statement: Piętnaście jednakowych drukarek, pracujących z tą samą wydajnością, drukuje cały nakład ulotek
    w ciągu 8 godzin. Uczeń, chcąc obliczyć czas x potrzebny 20 takim drukarkom, zapisał proporcję \frac{15}{8}=\frac{20}{x}
    i otrzymał wynik x=\frac{160}{15}\approx 10{,}7 godziny. Oblicz poprawnie, w ciągu ilu godzin 20 drukarek
