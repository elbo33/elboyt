- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: 'odwrotne zadanie o lokacie: odsetki dwóch lat, wyznaczanie stopy, kapitału i czasu podwojenia'
  statement: Pewną kwotę wpłacono do banku na lokatę o stałym oprocentowaniu p% w skali roku z kapitalizacją
    roczną (bez uwzględniania podatków). Odsetki dopisane do lokaty na koniec drugiego roku były o 24
    zł większe od odsetek dopisanych na koniec pierwszego roku, a łączne odsetki dopisane w ciągu tych
    dwóch lat wyniosły 624 zł. a) Oblicz oprocentowanie p. b) Oblicz kwotę wpłaconą na lokatę. c) Po ilu
    pełnych latach oszczędzania na tej lokacie kapitał po raz pierwszy przekroczy dwukrotność wpłaconej
    kwoty?
  statement_latex: K_0\cdot r + K_0\cdot r\cdot\left(1+r\right) = 624,\qquad K_0\cdot r^{2}=24
  solution: |-
    Niech K_0 będzie wpłaconą kwotą, a r = \frac{p}{100} roczną stopą (r > 0).
    Odsetki pierwszego roku: O_1 = K_0 r. Kapitał po roku: K_0(1+r), więc odsetki drugiego roku: O_2 = K_0(1+r)r = K_0 r + K_0 r^{2}.
    Z warunków zadania:
    O_2 − O_1 = K_0 r^{2} = 24,
    O_1 + O_2 = 2K_0 r + K_0 r^{2} = 624.
    Z drugiego równania: 2K_0 r = 624 − 24 = 600, czyli K_0 r = 300.
    a) Dzielimy: \frac{K_0 r^{2}}{K_0 r} = \frac{24}{300} = 0{,}08, więc r = 0,08, czyli p = 8%.
    b) K_0 = \frac{300}{0{,}08} = 3750 zł.
    Sprawdzenie: 3750·0,08 = 300 zł (I rok), 4050·0,08 = 324 zł (II rok); różnica 24 zł, suma 624 zł. ✓
    c) Szukamy najmniejszego naturalnego n, dla którego 3750\cdot 1{,}08^{n} > 2\cdot 3750, czyli 1{,}08^{n} > 2.
    1,08² = 1,1664; 1,08⁴ = 1,36048896; 1,08⁸ ≈ 1,850930; 1,08⁹ ≈ 1,999005 < 2 — jeszcze za mało!
    1,08¹⁰ ≈ 2,158925 > 2.
    Zatem dopiero po 10 pełnych latach kapitał przekroczy dwukrotność wpłaty (po 9 latach jest to 7496,27 zł < 7500 zł).
