    Bok kwadratu: \frac{32}{4} = 8, zatem H = 8 oraz 2r = 8, czyli r = 4.
    Objętość: V = \pi r^2 H = \pi \cdot 4^2 \cdot 8 = 128\pi (zgodnie ze wzorem V = 2\pi r^3 = 2\pi\cdot 64 = 128\pi).
    Odp. V = 128\pi.
