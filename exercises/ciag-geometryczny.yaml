  exercise_type: odczytanie ilorazu i obliczenie wyrazu
  statement: 'Czterema początkowymi wyrazami pewnego ciągu geometrycznego (a_n) są kolejno liczby: 96,
    48, 24, 12. Wyznacz iloraz q tego ciągu oraz oblicz jego szósty wyraz a_6.'
  statement_latex: q = \frac{48}{96},\qquad a_6 = 96\cdot\left(\frac{1}{2}\right)^{5}
  solution: |-
    Iloraz liczymy dzieląc wyraz późniejszy przez wcześniejszy: q = \frac{48}{96} = \frac{1}{2}.
    Kontrola: \frac{24}{48} = \frac{1}{2} oraz \frac{12}{24} = \frac{1}{2} — iloraz jest stały. ✓
    Szósty wyraz: a_6 = a_1 \cdot q^{5} = 96 \cdot \left(\frac{1}{2}\right)^{5} = \frac{96}{32} = 3.
    Sprawdzenie: 96, 48, 24, 12, 6, 3. ✓
    Odpowiedź: q = \frac{1}{2}, a_6 = 3.
  solution_steps:
  - 'Policz iloraz: q = \frac{48}{96} = \frac{1}{2}.'
  - Sprawdź stałość ilorazu na kolejnych parach wyrazów.
  - Zastosuj wzór a_6 = a_1 \cdot q^{5} = 96\cdot\left(\frac{1}{2}\right)^{5}.
  - 'Oblicz: 96 \cdot \frac{1}{32} = 3.'
