- id: g-ch-t03
  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: prostokąt wpisany w trójkąt prostokątny z dodatkowym ograniczeniem
  statement: Dany jest trójkąt prostokątny ABC, w którym kąt przy wierzchołku C jest prosty, |AC| = 8
    oraz |BC| = 12. Punkt M leży na przyprostokątnej BC, punkt N leży na przyprostokątnej AC, a punkt
    K leży na przeciwprostokątnej AB, przy czym czworokąt CMKN jest prostokątem (odcinek KM jest prostopadły
    do BC, a odcinek KN jest prostopadły do AC). Rozważamy tylko te prostokąty CMKN, w których bok CN
    ma długość nie mniejszą niż 6. Oblicz długości boków tego z rozważanych prostokątów, który ma największe
    pole, i oblicz to pole. Zapisz obliczenia.
  statement_latex: P\left(x\right)=x\cdot\left(8-\frac{2}{3}\cdot x\right)=8x-\frac{2}{3}x^{2},\qquad
    x=\left|CM\right|\in\left(0,3\right]
  solution: |-
    Niech x=\left|CM\right| (x>0). Wtedy \left|BM\right|=12-x.
    Trójkąt BMK jest podobny do trójkąta BCA (oba mają kąt przy wierzchołku B i kąt prosty), więc \frac{\left|MK\right|}{\left|CA\right|}=\frac{\left|BM\right|}{\left|BC\right|}, czyli \frac{\left|MK\right|}{8}=\frac{12-x}{12}.
    Stąd \left|MK\right|=\frac{8\cdot\left(12-x\right)}{12}=8-\frac{2}{3}\cdot x. Ponieważ CMKN jest prostokątem, mamy \left|CN\right|=\left|MK\right|=8-\frac{2}{3}\cdot x.
    Warunek z treści: \left|CN\right|\geq 6, czyli 8-\frac{2}{3}\cdot x\geq 6, stąd \frac{2}{3}\cdot x\leq 2, czyli x\leq 3. Dziedzina: x\in\left(0,3\right].
    Pole prostokąta: P\left(x\right)=x\cdot\left(8-\frac{2}{3}\cdot x\right)=8x-\frac{2}{3}x^{2}.
    Współczynnik a=-\frac{2}{3}<0, wierzchołek: p=-\frac{8}{2\cdot\left(-\frac{2}{3}\right)}=6. Liczba 6 nie należy do dziedziny \left(0,3\right].
    Funkcja o a<0 rośnie na \left(-\infty,6\right], więc na \left(0,3\right] jest rosnąca i wartość największą przyjmuje dla x=3.
    P\left(3\right)=8\cdot 3-\frac{2}{3}\cdot 9=24-6=18, a wtedy \left|CN\right|=8-\frac{2}{3}\cdot 3=6.
    Odpowiedź: największe pole ma prostokąt o bokach \left|CM\right|=3 i \left|CN\right|=6, a to pole jest równe 18. (Bez dodatkowego warunku optymalne byłoby x=6 i pole 24, ale wtedy \left|CN\right|=4<6.)
  solution_steps:
  - Oznacz x=|CM| i zauważ, że |BM|=12-x.
  - Z podobieństwa trójkątów BMK i BCA wyznacz |MK|=|CN|=8-(2/3)x.
  - 'Z warunku |CN| ≥ 6 wyznacz dziedzinę: x ∈ (0,3].'
  - Zapisz pole P(x)=x(8-(2/3)x)=8x-(2/3)x².
  - Oblicz p=6 i stwierdź, że p ∉ (0,3].
  - Z monotoniczności (a<0, funkcja rosnąca na (-∞,6]) wybierz x=3.
  - Oblicz |CN|=6 oraz P(3)=18 i sformułuj odpowiedź.
  answer:
    kind: MULTIPART
    parts:
    - name: CM
      answer:
        kind: NUMERIC
        value: 3.0
    - name: CN
      answer:
        kind: NUMERIC
        value: 6.0
    - name: P_max
      answer:
        kind: NUMERIC
        value: 18.0
  checks:
  - kind: solve_equation
    expr: 8-\frac{2}{3}\cdot x=6
    part: CM
  - kind: evaluate
    expr: 8-\frac{2}{3}\cdot 3
    part: CN
  - kind: evaluate
    expr: 3\cdot\left(8-\frac{2}{3}\cdot 3\right)
    part: P_max
  stated_model:
    variable: x
    objective_latex: P\left(x\right)=8x-\frac{2}{3}x^{2}
    domain_lo: '0'
    domain_hi: '3'
    domain_hi_open: false
    constraint_used: '|CN|=8-\frac{2}{3}x z podobieństwa trójkątów oraz |CN| \geq 6'
  skills:
  - podobieństwo trójkątów jako warunek wiążący
  - redukcja do funkcji jednej zmiennej
  - dziedzina wymuszona warunkiem z treści
  - ekstremum na końcu przedziału
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''x'': ''P\\left(x\\right)=8x-\\frac{2}{3}x^{2}'')
      — human review'
- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: wzór i dziedzina funkcji pola powierzchni prostopadłościanu + optymalizacja z ograniczeniem
  statement: Rozważamy wszystkie prostopadłościany ABCDEFGH, w których podstawa ABCD jest kwadratem o
    boku długości x, a suma długości trzech krawędzi wychodzących z wierzchołka A (są to krawędzie AB,
    AD oraz AE) jest równa 18. Ponadto wysokość |AE| każdego z rozważanych prostopadłościanów ma być nie
    mniejsza niż 8. (a) Wyznacz wzór i dziedzinę funkcji P opisującej pole powierzchni całkowitej takiego
    prostopadłościanu w zależności od x. (b) Oblicz długość krawędzi podstawy tego z rozważanych prostopadłościanów,
    którego pole powierzchni całkowitej jest największe, oraz oblicz to największe pole. Zapisz obliczenia.
  statement_latex: 2\cdot x+\left|AE\right|=18,\qquad P\left(x\right)=2\cdot x^{2}+4\cdot x\cdot\left(18-2\cdot
    x\right)=-6x^{2}+72x
  solution: |-
    Oznaczmy h=\left|AE\right| – wysokość prostopadłościanu. Ponieważ podstawa jest kwadratem, to \left|AB\right|=\left|AD\right|=x, a warunek z treści daje x+x+h=18, czyli h=18-2\cdot x.
    (a) Pole powierzchni całkowitej to suma pól dwóch kwadratowych podstaw i czterech prostokątnych ścian bocznych:
    P\left(x\right)=2\cdot x^{2}+4\cdot x\cdot h=2\cdot x^{2}+4\cdot x\cdot\left(18-2\cdot x\right)=2x^{2}+72x-8x^{2}=-6x^{2}+72x.
    Dziedzina: x>0 oraz h\geq 8, czyli 18-2\cdot x\geq 8, stąd 2\cdot x\leq 10, czyli x\leq 5. Zatem D=\left(0,5\right].
    (b) Współczynnik przy x^{2} jest równy -6<0, więc parabola ma ramiona skierowane w dół, a jej wierzchołek ma pierwszą współrzędną
    p=-\frac{72}{2\cdot\left(-6\right)}=6.
    Liczba 6 nie należy do dziedziny D=\left(0,5\right], więc wierzchołek jest niedopuszczalny. Ponieważ a<0, funkcja P rośnie na przedziale \left(-\infty,6\right], a więc rośnie na całym \left(0,5\right] i wartość największą przyjmuje w prawym końcu, dla x=5.
    P\left(5\right)=-6\cdot 25+72\cdot 5=-150+360=210.
    Sprawdzenie: dla x=5 mamy h=18-10=8\geq 8, pole podstaw 2\cdot 25=50, pole boczne 4\cdot 5\cdot 8=160, razem 210.
    Odpowiedź: P\left(x\right)=-6x^{2}+72x, D=\left(0,5\right]; największe pole powierzchni całkowitej, równe 210, ma prostopadłościan o krawędzi podstawy x=5 (i wysokości 8).
  solution_steps:
  - 'Oznacz h=|AE| i zapisz warunek wiążący: x+x+h=18, stąd h=18-2x.'
  - 'Zapisz pole powierzchni całkowitej: P=2x²+4xh.'
  - 'Podstaw h i wymnóż: P(x)=2x²+4x(18-2x)=-6x²+72x.'
  - 'Wyznacz dziedzinę: x>0 oraz 18-2x ≥ 8, czyli D=(0,5].'
  - Oblicz p=-72/(2·(-6))=6 i sprawdź, że 6 ∉ D.
  - Z monotoniczności (a=-6<0, funkcja rosnąca na (-∞,6]) wybierz x=5.
  - Oblicz P(5)=210 i sprawdź, że h=8 spełnia warunek; zapisz pełną odpowiedź.
  answer:
    kind: MULTIPART
    parts:
    - name: wzor_P
      answer:
        kind: SYMBOLIC
        latex: -6x^{2}+72x
    - name: dziedzina
      answer:
        kind: INTERVAL
        lo: '0'
        hi: '5'
        hi_open: false
    - name: x_opt
      answer:
        kind: NUMERIC
        value: 5.0
    - name: P_max
      answer:
        kind: NUMERIC
        value: 210.0
  checks:
  - kind: simplify
    expr: 2\cdot x^{2}+4\cdot x\cdot\left(18-2\cdot x\right)
    part: wzor_P
  - kind: solve_equation
    expr: 18-2\cdot x=8
    part: x_opt
  - kind: evaluate
    expr: -6\cdot 5^{2}+72\cdot 5
    part: P_max
  stated_model:
    variable: x
    objective_latex: P\left(x\right)=-6x^{2}+72x
    domain_lo: '0'
    domain_hi: '5'
    domain_hi_open: false
    constraint_used: 2x+h=18 oraz h \geq 8
  skills:
  - zapis warunku wiążącego dla krawędzi bryły
  - złożenie pola powierzchni całkowitej
  - wyznaczenie dziedziny z warunków zadania
  - sprawdzenie położenia wierzchołka względem dziedziny
  - monotoniczność i wartość na końcu przedziału
  verification:
    checkability: NOT_MACHINE_CHECKABLE
    note: 'no optimisable objective in the stated model (objective is not a function of ''x'': ''P\\left(x\\right)=-6x^{2}+72x'')
      — human review'
