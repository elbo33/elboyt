- id: g-ex-05
  slot: EXERCISE
  ramp_index: 2
  difficulty: 4
  exercise_type: wyznaczanie stopy i liczby okresów
  statement: Pewien kapitał w wysokości 25000 zł ulokowano na lokacie z kapitalizacją roczną i stałym
    oprocentowaniem. Po trzech latach oszczędzania na lokacie było 33275 zł (bez uwzględniania podatków).
    a) Oblicz roczne oprocentowanie tej lokaty. b) Wyznacz najmniejszą liczbę pełnych lat oszczędzania,
    po której kapitał na tej lokacie przekroczy 40000 zł. c) Oblicz kapitał po tylu latach, z dokładnością
    do 1 grosza.
  statement_latex: 25000\cdot q^{3}=33275,\qquad q=\sqrt[3]{\frac{33275}{25000}}
  solution: |-
    a) Model: 25000·q^3 = 33275, więc q^3 = 33275/25000 = 1,331.
    q = ∛1,331 = 1,1, bo 1,1^3 = 1,331.
    Zatem 1 + p/100 = 1,1, czyli p = 10. Oprocentowanie wynosi 10% w skali roku.
    Sprawdzenie: 25000 → 27500 → 30250 → 33275. ✓
    b) Szukamy najmniejszego n, dla którego 25000·(1,1)^n > 40000, czyli (1,1)^n > 1,6.
    (1,1)^1 = 1,1; (1,1)^2 = 1,21; (1,1)^3 = 1,331; (1,1)^4 = 1,4641; (1,1)^5 = 1,61051 > 1,6.
    Warunek po raz pierwszy zachodzi dla n = 5.
    c) K_5 = 25000·1,61051 = 40262,75 zł (a po 4 latach było 36602,50 zł < 40000 zł).
    Odpowiedź: a) 10% rocznie, b) po 5 latach, c) 40262,75 zł.
  solution_steps:
  - Zapisz równanie 25000·q^3 = 33275 i wyznacz q^3 = 1,331.
  - 'Spierwiastkuj trzeciego stopnia: q = 1,1, więc p = 10%.'
  - Zapisz nierówność 25000·(1,1)^n > 40000, czyli (1,1)^n > 1,6.
  - 'Licz kolejne potęgi 1,1 aż do przekroczenia 1,6: (1,1)^4 = 1,4641 < 1,6, (1,1)^5 = 1,61051 > 1,6,
    więc n = 5.'
  - 'Oblicz kapitał po 5 latach: 25000·1,61051 = 40262,75 zł.'
  answer:
    kind: MULTIPART
    parts:
    - name: oprocentowanie_procent
      answer:
        kind: NUMERIC
        value: 10.0
        tol: 1.0e-06
        latex: 10\%
    - name: liczba_lat
      answer:
        kind: NUMERIC
        value: 5.0
        latex: '5'
    - name: kapital_po_tylu_latach
      answer:
        kind: NUMERIC
        value: 40262.75
        tol: 0.01
        latex: 40262{,}75\ \text{zł}
  checks:
  - kind: evaluate
    expr: \left(\sqrt[3]{\frac{33275}{25000}}-1\right)\cdot 100
    var: q
    part: oprocentowanie_procent
  - kind: evaluate
    expr: 25000\cdot\left(1+\frac{10}{100}\right)^{5}
    part: kapital_po_tylu_latach
  skills:
  - pierwiastek n-tego stopnia w modelu K_0·q^n = K_n
  - wyznaczanie liczby okresów
  - obliczanie kapitału końcowego
