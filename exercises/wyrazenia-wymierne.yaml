  slot: CHALLENGE
  ramp_index: 1
  difficulty: 4
  exercise_type: modelowanie geometryczne wyrażeniem wymiernym z dziedziną i filtrem
  statement: "Pole pewnego prostokąta jest równe 2\\cdot x^{2}-8, a jeden z jego boków ma długość x-2.\
    \ \na) Zapisz wyrażenie opisujące długość drugiego boku tego prostokąta, doprowadź je do najprostszej\
    \ postaci i podaj zbiór wszystkich wartości x, dla których taki prostokąt istnieje (obie długości\
    \ boków muszą być dodatnie).\nb) Wyznacz tę wartość x, dla której długość drugiego boku jest równa\
    \ kwadratowi długości boku x-2."
  statement_latex: b\left(x\right) = \frac{2\cdot x^{2}-8}{x-2}
  solution: |-
    a) Drugi bok obliczamy jako iloraz pola i danego boku:
    b\left(x\right)=\frac{2x^{2}-8}{x-2}=\frac{2\left(x-2\right)\left(x+2\right)}{x-2}=2\left(x+2\right)=2x+4\quad\text{(dla } x\neq 2\text{)}.
