  statement: 'Dane są dwa trójkąty: trójkąt ABC, w którym |AB| = 8, |AC| = 7 oraz |∡ABC| = 60°, i trójkąt
    KLM, w którym |KL| = 8, |KM| = 7 oraz |∡KLM| = 60°. Uczeń napisał: „Trójkąty mają po dwa równe boki
