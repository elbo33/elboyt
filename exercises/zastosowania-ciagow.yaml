- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: model arytmetyczny — wyraz ciągu
  statement: W sali kinowej w pierwszym rzędzie jest 14 miejsc, a w każdym następnym rzędzie jest o 2
    miejsca więcej niż w rzędzie poprzednim. Oblicz, ile miejsc jest w dziesiątym rzędzie tej sali. Zapisz
    obliczenia.
  statement_latex: a_{1} = 14,\quad r = 2,\quad a_{10} = 14 + \left(10-1\right)\cdot 2
  solution: |-
    Niech a_n oznacza liczbę miejsc w n-tym rzędzie. Z treści zadania a_1 = 14 oraz każdy następny wyraz powstaje przez dodanie 2, więc ciąg (a_n) jest arytmetyczny o różnicy r = 2.
    Korzystamy ze wzoru a_n = a_1 + (n-1)\cdot r:
    a_{10} = 14 + (10-1)\cdot 2 = 14 + 18 = 32.
    Odpowiedź: w dziesiątym rzędzie jest 32 miejsca.
  solution_steps:
  - 'Ustal model: a_n — liczba miejsc w n-tym rzędzie, a_1 = 14, r = 2 (ciąg arytmetyczny).'
  - Zastosuj wzór a_n = a_1 + (n-1)\cdot r dla n = 10.
  - Oblicz a_{10} = 14 + 9\cdot 2 = 32.
  - 'Sformułuj odpowiedź: 32 miejsca.'
  answer:
    kind: NUMERIC
    value: 32.0
  checks:
  - kind: evaluate
    expr: 14 + \left(10-1\right)\cdot 2
  skills:
  - budowa modelu ciągowego
  - wzór na n-ty wyraz ciągu arytmetycznego
  - interpretacja wyniku
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 32.0 vs 32.0 (tol 1e-09)'
- id: g-th-01
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 2
  exercise_type: spadek wykładniczy — wartość po n okresach
  statement: Maszyna kosztowała nowa 20 000 zł. Jej wartość co roku maleje o 10% wartości z roku poprzedniego.
    Oblicz wartość tej maszyny po 3 latach. Zapisz obliczenia.
  statement_latex: W_{3} = 20000\cdot\left(1-\frac{10}{100}\right)^{3}
  solution: |-
    Spadkowi o 10% odpowiada mnożnik q = 1 - \frac{10}{100} = 0{,}9. Wartości maszyny w kolejnych latach tworzą ciąg geometryczny o ilorazie 0,9, a wartość początkowa odpowiada zeru okresów.
    W_3 = 20000\cdot 0{,}9^{3} = 20000\cdot 0{,}729 = 14580.
    Odpowiedź: po 3 latach maszyna jest warta 14 580 zł.
  solution_steps:
  - 'Zamień spadek o 10% na mnożnik jednego roku: q = 1 - 0,10 = 0,9.'
  - Zauważ, że wartość po n latach to W_n = W_0\cdot q^{n}, przy czym W_0 = 20000.
  - Oblicz 0,9^3 = 0,729.
  - Oblicz W_3 = 20000\cdot 0,729 = 14580 zł.
  answer:
    kind: NUMERIC
    value: 14580.0
  checks:
  - kind: evaluate
    expr: 20000\cdot\left(1-\frac{10}{100}\right)^{3}
  skills:
  - współczynnik spadku
  - wzór na n-ty wyraz ciągu geometrycznego
  - amortyzacja
