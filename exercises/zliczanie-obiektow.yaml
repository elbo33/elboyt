- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: przekątne wielokąta wypukłego — wzór, dziedzina i zadanie odwrotne
  statement: W pewnym wielokącie wypukłym liczba wszystkich przekątnych jest o 25 większa od liczby jego
    boków. a) Wyznacz wzór na liczbę wszystkich przekątnych wielokąta wypukłego o n bokach oraz podaj,
    dla jakich n ten wzór ma sens. b) Oblicz, ile boków i ile przekątnych ma opisany wielokąt.
  statement_latex: \frac{n \cdot \left(n-1\right)}{2} - n = \frac{n \cdot \left(n-3\right)}{2}, \qquad
    \frac{n \cdot \left(n-3\right)}{2} = n + 25
  solution: |-
    a) Wielokąt wypukły o n bokach ma n wierzchołków. Każdy odcinek o końcach w dwóch różnych wierzchołkach jest bokiem albo przekątną, a odcinek o końcach A, B to ten sam odcinek co B, A — liczymy więc pary nieuporządkowane:
    liczba wszystkich odcinków = \frac{n\cdot\left(n-1\right)}{2}.
    Od tej liczby odejmujemy n boków:
    d\left(n\right) = \frac{n\cdot\left(n-1\right)}{2} - n = \frac{n^2 - n - 2n}{2} = \frac{n\cdot\left(n-3\right)}{2}.
    Wzór ma sens dla n będących liczbami naturalnymi spełniającymi n ≥ 3 (najmniejszy wielokąt to trójkąt; dla n = 3 otrzymujemy d = 0, co jest zgodne z tym, że trójkąt nie ma przekątnych).

    b) Warunek zadania: liczba przekątnych jest o 25 większa od liczby boków, czyli
    \frac{n\cdot\left(n-3\right)}{2} = n + 25.
    Mnożymy obie strony przez 2: n^2 - 3n = 2n + 50, stąd n^2 - 5n - 50 = 0.
    Δ = 25 + 200 = 225, \sqrt{Δ} = 15, więc n = \frac{5-15}{2} = -5 albo n = \frac{5+15}{2} = 10.
    Sprawdzamy zgodność z dziedziną: n = -5 odrzucamy, bo n musi być liczbą naturalną i n ≥ 3. Zostaje n = 10.
    Liczba przekątnych: d\left(10\right) = \frac{10\cdot 7}{2} = 35.
    Kontrola: 35 = 10 + 25 ✓.

    Odpowiedź: a) d(n) = \frac{n\cdot\left(n-3\right)}{2} dla n ∈ N, n ≥ 3; b) wielokąt ma 10 boków i 35 przekątnych (jest to dziesięciokąt wypukły).
  solution_steps:
  - 'Zauważ, że odcinek łączący dwa wierzchołki to para nieuporządkowana: wszystkich takich odcinków jest
    n(n−1)/2.'
  - 'Odejmij n boków i uprość: d(n) = n(n−1)/2 − n = n(n−3)/2.'
  - 'Podaj dziedzinę wzoru: n ∈ N, n ≥ 3.'
  - 'Zapisz warunek zadania jako równanie: n(n−3)/2 = n + 25.'
  - 'Przekształć do postaci n² − 5n − 50 = 0 i rozwiąż: Δ = 225, n = 10 lub n = −5.'
  - Odrzuć n = −5 jako sprzeczne z dziedziną; oblicz liczbę przekątnych d(10) = 10·7/2 = 35 i sprawdź
    warunek 35 = 10 + 25.
