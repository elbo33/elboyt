    Wyjaśnij, na czym polega jego błąd, i podaj poprawny wynik.
  statement_latex: \sqrt{\left(-7\right)^{2}}+\sqrt{\left(2-\sqrt{5}\right)^{2}}
  solution: |-
    BŁĘDNE ROZUMOWANIE: uczeń skrócił pierwiastek z kwadratem „wprost”:
    \[\sqrt{\left(-7\right)^{2}}=-7,\qquad \sqrt{\left(2-\sqrt{5}\right)^{2}}=2-\sqrt{5},\]
    skąd suma \(-7+2-\sqrt{5}=-5-\sqrt{5}\approx-7{,}24\).
    Dlaczego to źle: pierwiastek arytmetyczny stopnia parzystego jest zawsze liczbą nieujemną, więc jego wartość nie może być ujemna. Obowiązuje wzór \(\sqrt{a^{2}}=\left|a\right|\).

    POPRAWNIE:
    \[\sqrt{\left(-7\right)^{2}}=\left|-7\right|=7.\]
    Ponieważ \(\sqrt{5}\approx 2{,}24>2\), liczba \(2-\sqrt{5}\) jest ujemna, zatem
    \[\sqrt{\left(2-\sqrt{5}\right)^{2}}=\left|2-\sqrt{5}\right|=\sqrt{5}-2.\]
    Razem: \(7+\sqrt{5}-2=5+\sqrt{5}\).
    Odpowiedź: \(5+\sqrt{5}\).
  solution_steps:
