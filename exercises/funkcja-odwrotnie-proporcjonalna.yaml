  statement_latex: 15\cdot 8 = 20\cdot x,\qquad x=\frac{15\cdot 8}{20}
  solution: |-
    BŁĘDNE ROZUMOWANIE UCZNIA: uczeń użył proporcji prostej \frac{15}{8}=\frac{20}{x}, czyli 15\cdot x=160, skąd x=\frac{160}{15}\approx 10{,}7 h. Wynik jest bezsensowny: więcej drukarek miałoby pracować DŁUŻEJ niż mniej drukarek, co przeczy sytuacji z zadania.
    KOREKTA: liczba drukarek i czas druku tego samego nakładu są odwrotnie proporcjonalne, bo stała jest praca do wykonania: n\cdot t=\text{const}. Zatem należy przyrównać iloczyny: 15\cdot 8=20\cdot x, czyli 120=20\cdot x, skąd x=\frac{15\cdot 8}{20}=6.
