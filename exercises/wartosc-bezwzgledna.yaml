- id: g-cm-08
  slot: COMMON_MISTAKE
  ramp_index: 2
  difficulty: 3
  exercise_type: upraszczanie wyrażenia z modułem — analiza błędu
  statement: 'Uprość wyrażenie W = \left|x - 5\right| + 2\cdot x przy założeniu, że x < 5. Uczeń zapisał:
    "moduł usuwa minusy, więc \left|x - 5\right| = x - 5 i W = 3\cdot x - 5". Wyjaśnij błąd i podaj poprawną
    postać wyrażenia.'
  statement_latex: W = \left|x - 5\right| + 2\cdot x, \qquad x < 5
  solution: |-
    Błędne rozumowanie: uczeń przyjął, że \left|x - 5\right| = x - 5 dla każdego x, i otrzymał W = x - 5 + 2\cdot x = 3\cdot x - 5.
    Gdzie tkwi błąd: równość \left|x - 5\right| = x - 5 zachodzi tylko wtedy, gdy x - 5 \ge 0, czyli dla x \ge 5. Przy założeniu x < 5 wyrażenie x - 5 jest ujemne, więc zgodnie z definicją \left|x - 5\right| = -\left(x - 5\right) = 5 - x. Zmiana znaku dotyczy całego wyrażenia, a nie tylko jednego składnika.
    Kontrola liczbowa dla x = 1: \left|1 - 5\right| + 2\cdot 1 = 4 + 2 = 6, a wzór ucznia daje 3\cdot 1 - 5 = -2 — wynik błędny.
    Poprawne rozwiązanie: W = \left(5 - x\right) + 2\cdot x = x + 5.
    Sprawdzenie dla x = 1: 1 + 5 = 6.
    Odpowiedź: W = x + 5.
  solution_steps:
  - 'Wskaż błąd: równość \left|x-5\right| = x - 5 obowiązuje tylko dla x \ge 5.'
  - 'Dla x < 5 zastosuj definicję: \left|x-5\right| = -\left(x-5\right) = 5 - x.'
  - 'Podstaw i uprość: W = \left(5 - x\right) + 2\cdot x = x + 5.'
  - Sprawdź wynik dla przykładowej liczby x = 1.
