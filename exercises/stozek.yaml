- id: g-ex-t01
  slot: EXERCISE
  ramp_index: 7
  difficulty: 4
  exercise_type: siatka stożka – zadanie odwrotne
  statement: Powierzchnia boczna pewnego stożka po rozwinięciu na płaszczyznę jest półkolem o polu równym
    18\pi. Oblicz objętość oraz pole powierzchni całkowitej tego stożka. Zapisz obliczenia.
  statement_latex: \frac{180^\circ}{360^\circ}\cdot\pi\cdot l^{2}=18\pi,\qquad \frac{\varphi}{360^\circ}=\frac{r}{l}
  solution: |-
    Promieniem wycinka jest tworząca l, a kąt środkowy półkola wynosi \varphi=180^\circ.
    Pole wycinka: \frac{180^\circ}{360^\circ}\cdot\pi l^{2}=18\pi, czyli \frac{1}{2}\pi l^{2}=18\pi, stąd l^{2}=36 i l=6.
    Z zależności \frac{\varphi}{360^\circ}=\frac{r}{l} mamy \frac{1}{2}=\frac{r}{6}, więc r=3 (łuk półkola 6\pi jest równy obwodowi podstawy 2\pi r).
    Wysokość: H=\sqrt{l^{2}-r^{2}}=\sqrt{36-9}=\sqrt{27}=3\sqrt{3}.
    Objętość: V=\frac{1}{3}\pi r^{2}H=\frac{1}{3}\pi\cdot 9\cdot 3\sqrt{3}=9\sqrt{3}\pi.
    Pole całkowite: P_c=\pi r\left(r+l\right)=\pi\cdot 3\cdot\left(3+6\right)=27\pi (kontrola: pole boczne \pi rl=18\pi, tyle co pole półkola).
    Odpowiedź: V=9\sqrt{3}\pi, P_c=27\pi.
  solution_steps:
  - Zauważ, że promień wycinka to tworząca, a kąt wycinka to \varphi=180^\circ.
  - Z pola półkola \frac{1}{2}\pi l^{2}=18\pi wyznacz l=6.
  - Z proporcji \frac{\varphi}{360^\circ}=\frac{r}{l} otrzymaj r=6\cdot\frac{1}{2}=3.
  - Oblicz wysokość H=\sqrt{36-9}=3\sqrt{3}.
  - Oblicz V=\frac{1}{3}\pi\cdot 3^{2}\cdot 3\sqrt{3}=9\sqrt{3}\pi.
  - Oblicz P_c=\pi\cdot 3\cdot\left(3+6\right)=27\pi.
  answer:
    kind: MULTIPART
    parts:
    - name: objetosc
      answer:
        kind: SYMBOLIC
        latex: 9\sqrt{3}\pi
    - name: pole_calkowite
      answer:
        kind: SYMBOLIC
        latex: 27\pi
  checks:
  - kind: evaluate
    expr: \frac{1}{3}\cdot\pi\cdot 3^{2}\cdot 3\cdot\sqrt{3}
    part: objetosc
  - kind: evaluate
    expr: \pi\cdot 3\cdot\left(3+6\right)
    part: pole_calkowite
