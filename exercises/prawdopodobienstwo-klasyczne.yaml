- id: g-ex-04
  slot: EXERCISE
  ramp_index: 2
  difficulty: 3
  exercise_type: losowanie ze zwracaniem, tworzenie liczby dwucyfrowej
  statement: Dany jest zbiór cyfr C = \left\{1,\ 2,\ 3,\ 4,\ 5\right\}. Ze zbioru C losujemy ze zwracaniem
    kolejno dwa razy po jednej cyfrze, a następnie tworzymy liczbę dwucyfrową w ten sposób, że cyfra wylosowana
    jako pierwsza jest cyfrą dziesiątek, a cyfra wylosowana jako druga — cyfrą jedności tej liczby. Oblicz
    prawdopodobieństwo zdarzenia A polegającego na tym, że otrzymana liczba dwucyfrowa jest podzielna
    przez 4, oraz prawdopodobieństwo zdarzenia B polegającego na tym, że obie cyfry otrzymanej liczby
    są różne. Zapisz obliczenia.
  statement_latex: '|\Omega|=5\cdot 5=25,\qquad P(A)=\frac{5}{25},\qquad P(B)=\frac{20}{25}'
  solution: |-
    Losujemy ze zwracaniem, wyniki zapisujemy w kolejności losowania, więc z reguły mnożenia |\Omega|=5\cdot 5=25 i każdy wynik jest jednakowo prawdopodobny.
    Zdarzenie A: liczba dwucyfrowa podzielna przez 4. Sprawdzamy kolejno liczby o cyfrach ze zbioru C: 12, 24, 32, 44, 52 — i tylko te są podzielne przez 4. Zatem |A|=5 oraz P(A)=\frac{5}{25}=\frac{1}{5}.
    Zdarzenie B: obie cyfry różne. Zdarzeniem przeciwnym B' jest „obie cyfry jednakowe”: 11, 22, 33, 44, 55, czyli |B'|=5. Stąd |B|=25-5=20 i P(B)=\frac{20}{25}=\frac{4}{5}.
  solution_steps:
  - Z reguły mnożenia |\Omega|=5\cdot 5=25.
  - 'Wypisujemy liczby podzielne przez 4 o obu cyfrach ze zbioru C: 12, 24, 32, 44, 52, więc |A|=5.'
  - P(A)=\frac{5}{25}=\frac{1}{5}.
  - 'Zdarzenie przeciwne do B to „obie cyfry jednakowe”: 11, 22, 33, 44, 55, czyli |B''|=5.'
  - P(B)=1-\frac{5}{25}=\frac{20}{25}=\frac{4}{5}.
  answer:
    kind: MULTIPART
    parts:
    - name: P(A)
      answer:
        kind: SYMBOLIC
        latex: \frac{1}{5}
    - name: P(B)
      answer:
        kind: SYMBOLIC
        latex: \frac{4}{5}
  checks:
  - kind: evaluate
    expr: \frac{5}{5\cdot 5}
    part: P(A)
  - kind: evaluate
    expr: 1-\frac{5}{5\cdot 5}
    part: P(B)
  skills:
  - reguła mnożenia
