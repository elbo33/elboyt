- id: g-ch-t02
  slot: CHALLENGE
  ramp_index: 0
  difficulty: 3
  exercise_type: zadanie tekstowe prowadzące do równania wielomianowego
  statement: Trzy kolejne dodatnie liczby parzyste są takie, że ich iloczyn jest równy czterokrotności
    ich sumy. Wyznacz te trzy liczby. Zapisz obliczenia.
  statement_latex: \left(x-2\right)\cdot x\cdot\left(x+2\right)=4\cdot\left(\left(x-2\right)+x+\left(x+2\right)\right)
  solution: |-
    Oznaczmy przez x środkową z trzech kolejnych liczb parzystych. Wtedy te liczby to x-2,\ x,\ x+2, przy czym z warunku, że wszystkie są dodatnie, wynika x-2>0, czyli x>2.

    Iloczyn tych liczb: \left(x-2\right)\cdot x\cdot\left(x+2\right)=x\cdot\left(x^2-4\right)=x^3-4x.
    Suma tych liczb: \left(x-2\right)+x+\left(x+2\right)=3x, więc jej czterokrotność to 4\cdot 3x=12x.

    Z warunku zadania otrzymujemy równanie
    x^3-4x=12x.

    Przenosimy wszystko na lewą stronę (nie wolno dzielić obu stron przez x):
    x^3-16x=0,
    x\cdot\left(x^2-16\right)=0,
    x\cdot\left(x-4\right)\cdot\left(x+4\right)=0.

    Stąd x=0 lub x=4 lub x=-4. Warunek x>2 spełnia tylko x=4.

    Szukane liczby to 2,\ 4,\ 6.
    Sprawdzenie: 2\cdot 4\cdot 6=48 oraz 4\cdot\left(2+4+6\right)=4\cdot 12=48 — zgadza się.
  solution_steps:
  - Oznacz środkową liczbę przez x; trzy kolejne liczby parzyste to x-2, x, x+2, a z dodatniości wynika
    x>2.
  - 'Zapisz iloczyn: \left(x-2\right)\cdot x\cdot\left(x+2\right)=x^3-4x oraz sumę: 3x.'
  - 'Ułóż równanie x^3-4x=12x i przenieś wszystko na lewą stronę: x^3-16x=0.'
  - 'Doprowadź do postaci iloczynowej: x\cdot\left(x-4\right)\cdot\left(x+4\right)=0, skąd x=0 lub x=4
    lub x=-4.'
  - Odrzuć x=0 i x=-4 (warunek x>2) i wypisz liczby 2, 4, 6; sprawdź warunek zadania.
  answer:
    kind: MULTIPART
    parts:
    - name: najmniejsza
      answer:
        kind: NUMERIC
        value: 2.0
    - name: srodkowa
      answer:
        kind: NUMERIC
        value: 4.0
    - name: najwieksza
      answer:
        kind: NUMERIC
        value: 6.0
  checks:
