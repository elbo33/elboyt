  statement_latex: '\text{błędnie: } |\angle APC| = \frac{1}{2}\cdot 80^\circ,\qquad \text{poprawnie:
    } |\angle APC| = \frac{1}{2}\cdot\left(80^\circ + 40^\circ\right)'
  solution: |-
    Błędne rozumowanie: uczeń potraktował kąt APC jak kąt wpisany i wziął połowę miary łuku AC, otrzymując 40^\circ.

    Dlaczego to jest źle: kąt wpisany musi mieć wierzchołek NA okręgu. Punkt P leży wewnątrz koła, więc kąt APC nie jest kątem wpisanym i twierdzenia o kącie wpisanym nie wolno do niego stosować wprost.

    Poprawne rozwiązanie. Rozważmy trójkąt APD.
    Kąt ADP = kąt ADC jest kątem wpisanym opartym na łuku AC, więc |\angle ADP| = \frac{1}{2}\cdot 80^\circ = 40^\circ.
    Kąt DAP = kąt DAB jest kątem wpisanym opartym na łuku BD, więc |\angle DAP| = \frac{1}{2}\cdot 40^\circ = 20^\circ.
    Kąt APC jest kątem zewnętrznym trójkąta APD przy wierzchołku P, a kąt zewnętrzny równa się sumie dwóch kątów wewnętrznych do niego nieprzyległych:
    |\angle APC| = 40^\circ + 20^\circ = 60^\circ.

    Jest to zgodne ze wzorem |\angle APC| = \frac{1}{2}\cdot\left(80^\circ + 40^\circ\right) = 60^\circ.

    Odpowiedź: |\angle APC| = 60^\circ.
  solution_steps:
  - 'Wskaż błąd: P leży wewnątrz koła, więc kąt APC nie jest kątem wpisanym.'
  - W trójkącie APD oblicz kąt wpisany |\angle ADP| = \tfrac12\cdot 80^\circ = 40^\circ.
  - Oblicz kąt wpisany |\angle DAP| = \tfrac12\cdot 40^\circ = 20^\circ.
  - 'Zastosuj twierdzenie o kącie zewnętrznym: |\angle APC| = 40^\circ + 20^\circ = 60^\circ.'
