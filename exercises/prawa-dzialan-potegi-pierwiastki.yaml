- id: g-ex-03
  slot: EXERCISE
  ramp_index: 1
  difficulty: 2
  exercise_type: obliczanie wartości wyrażenia z potęgami
  statement: Oblicz wartość wyrażenia \(\left(\frac{1}{9}\right)^{-\frac{1}{2}}+32^{\frac{2}{5}}-7^{0}\).
  statement_latex: \left(\frac{1}{9}\right)^{-\frac{1}{2}}+32^{\frac{2}{5}}-7^{0}
  solution: |-
    Liczymy każdy składnik osobno.
    1) Ujemny wykładnik odwraca ułamek: \(\left(\frac{1}{9}\right)^{-\frac{1}{2}}=9^{\frac{1}{2}}=\sqrt{9}=3\).
    2) \(32=2^{5}\), więc \(32^{\frac{2}{5}}=\left(2^{5}\right)^{\frac{2}{5}}=2^{5\cdot\frac{2}{5}}=2^{2}=4\).
    3) \(7^{0}=1\).
    Razem: \(3+4-1=6\).
    Odpowiedź: 6.
  solution_steps:
  - 'Odwróć ułamek przy ujemnym wykładniku: \(\left(\frac{1}{9}\right)^{-\frac{1}{2}}=9^{\frac{1}{2}}=3\).'
  - Zapisz \(32=2^{5}\) i oblicz \(32^{\frac{2}{5}}=2^{2}=4\).
  - Zauważ, że \(7^{0}=1\).
  - 'Wykonaj dodawanie i odejmowanie: \(3+4-1=6\).'
  answer:
    kind: NUMERIC
    value: 6.0
  checks:
  - kind: evaluate
    expr: \left(\frac{1}{9}\right)^{-\frac{1}{2}}+32^{\frac{2}{5}}-7^{0}
