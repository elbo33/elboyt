- id: g-ch-t04
  slot: CHALLENGE
  ramp_index: 2
  difficulty: 5
  exercise_type: 'model lokaty z podatkiem naliczanym co rok: wzór, dziedzina, wartość i porównanie z
    rosnącą ceną'
  statement: Pan Zieliński wpłacił do banku 40 000 zł na lokatę długoterminową o oprocentowaniu 5% w skali
    roku z kapitalizacją roczną. Na koniec każdego roku bank nalicza odsetki, potrąca od nich 19% podatku
    i dopiero pozostałą część dopisuje do kapitału. a) Zapisz wzór funkcji K(n) opisującej kwotę na lokacie
    po n pełnych latach oszczędzania i podaj, dla jakich n ten wzór ma sens. b) Oblicz kwotę na lokacie
    po 3 latach oszczędzania (z dokładnością do 1 grosza). c) Pan Zieliński chce kupić samochód, który
    dzisiaj kosztuje 46 000 zł, a jego cena rośnie o 2% rocznie. Oblicz kwotę na lokacie po 4 latach oraz
    cenę samochodu po 4 latach (obie z dokładnością do 1 grosza) i rozstrzygnij, czy zgromadzony kapitał
    wystarczy wtedy na zakup tego samochodu.
  statement_latex: K(n) = 40000\cdot\left(1+\frac{81}{100}\cdot\frac{5}{100}\right)^{n}
  solution: |-
    a) W jednym roku odsetki brutto wynoszą 5% kapitału, ale do kapitału bank dopisuje tylko 81% tej kwoty, czyli 0{,}81\cdot 5\% = 4{,}05\%. Stopa netto jednego okresu to 0,0405, więc czynnik roczny q = 1{,}0405 i
    K(n) = 40000\cdot\left(1{,}0405\right)^{n}.
    Wzór ma sens dla n będących liczbami całkowitymi nieujemnymi (odsetki dopisywane są tylko na koniec pełnego roku), czyli n \in \mathbb{N}.
    b) K(3) = 40000\cdot 1{,}0405^{3}. Kolejno: 1,0405² = 1,08264025; 1,0405³ = 1,12648718; K(3) = 40000·1,12648718 = 45 059,49 zł.
    c) K(4) = 40000\cdot 1{,}0405^{4} = 40000\cdot 1{,}17210991 = 46 884,40 zł.
    Cena samochodu rośnie wykładniczo: C(4) = 46000\cdot 1{,}02^{4} = 46000\cdot 1{,}08243216 = 49 791,88 zł.
    Porównanie: 46 884,40 zł < 49 791,88 zł, brakuje 2907,48 zł.
    Odpowiedź: kapitał po 4 latach NIE wystarczy na zakup tego samochodu.
  solution_steps:
  - 'Zauważ, że podatek potrącany jest co roku: efektywna stopa jednego roku to 0,81·5% = 4,05%.'
  - 'Zapisz model: K(n) = 40000·(1,0405)ⁿ, n ∈ N (odsetki dopisywane na koniec pełnego roku).'
  - Oblicz 1,0405³ = 1,12648718 i K(3) = 45 059,49 zł.
  - Oblicz 1,0405⁴ = 1,17210991 i K(4) = 46 884,40 zł.
  - 'Zbuduj model ceny: C(n) = 46000·1,02ⁿ, więc C(4) = 46000·1,08243216 = 49 791,88 zł.'
  - 'Porównaj obie kwoty: 46 884,40 < 49 791,88 — kapitał nie wystarczy (brakuje 2907,48 zł).'
