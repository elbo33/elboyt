    c) Wykaż, że wysokość każdego z rozważanych stożków jest mniejsza od 18.
    Zapisz obliczenia.
  statement_latex: 2x+2l = 36,\qquad H = \sqrt{l^{2}-x^{2}},\qquad R\left(x\right) = \frac{x\cdot H}{\frac{2x+2l}{2}}
  solution: |-
    Krok 1. Oznaczmy przez x promień podstawy stożka, a przez l jego tworzącą. Przekrój osiowy to trójkąt równoramienny o podstawie 2x i ramionach l, więc 2x+2l = 36, skąd l = 18-x.
    Krok 2. Warunki geometryczne: x > 0 oraz (z nierówności trójkąta dla trójkąta równoramiennego) 2l > 2x, czyli 18-x > x, więc x < 9. Dziedziną jest przedział \left(0,\ 9\right).
    Krok 3. Wysokość stożka: H = \sqrt{l^{2}-x^{2}} = \sqrt{\left(18-x\right)^{2}-x^{2}} = \sqrt{324-36x} = 6\sqrt{9-x}.
    Krok 4. Kula wpisana w stożek daje w przekroju osiowym okrąg wpisany w ten trójkąt. Pole trójkąta P = \frac{1}{2}\cdot 2x\cdot H = x\cdot H, a połowa obwodu p = \frac{36}{2} = 18, więc
    R\left(x\right) = \frac{P}{p} = \frac{x\cdot 6\sqrt{9-x}}{18} = \frac{x\sqrt{9-x}}{3}, \qquad x\in\left(0,\ 9\right).
    Krok 5. b) Przekrój osiowy jest trójkątem równobocznym, gdy 2x = l, czyli 2x = 18-x, skąd x = 6. Sprawdzenie: 6\in\left(0,\ 9\right), więc taki stożek istnieje (jest to trójkąt o boku 12).
    R = \frac{6\sqrt{9-6}}{3} = \frac{6\sqrt{3}}{3} = 2\sqrt{3}.
    Objętość kuli: V = \frac{4}{3}\pi\left(2\sqrt{3}\right)^{3} = \frac{4}{3}\pi\cdot 8\cdot 3\sqrt{3} = 32\sqrt{3}\pi.
    Krok 6. c) Dla każdego x\in\left(0,\ 9\right) mamy 9-x < 9, więc \sqrt{9-x} < 3, a zatem H = 6\sqrt{9-x} < 6\cdot 3 = 18. To kończy uzasadnienie.
    Odpowiedź: R\left(x\right) = \frac{x\sqrt{9-x}}{3} dla x\in\left(0,\ 9\right); V = 32\sqrt{3}\pi.
  solution_steps:
  - Wprowadź x — promień podstawy; z obwodu przekroju osiowego wyznacz tworzącą l = 18-x.
  - 'Ustal dziedzinę: x > 0 oraz l > x, czyli x\in\left(0,\ 9\right).'
  - Oblicz wysokość H = \sqrt{\left(18-x\right)^{2}-x^{2}} = 6\sqrt{9-x}.
  - 'Zastosuj R = \frac{P}{p} dla trójkąta osiowego: R\left(x\right) = \frac{x\cdot 6\sqrt{9-x}}{18} =
    \frac{x\sqrt{9-x}}{3}.'
  - Dla trójkąta równobocznego 2x = 18-x, czyli x = 6\in\left(0,\ 9\right); stąd R = 2\sqrt{3} i V = \frac{4}{3}\pi\left(2\sqrt{3}\right)^{3}
    = 32\sqrt{3}\pi.
  - 'Uzasadnij H < 18: z x > 0 wynika 9-x < 9, więc 6\sqrt{9-x} < 18.'
