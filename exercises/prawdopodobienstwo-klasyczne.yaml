  statement: W pudełku znajduje się 5 kul zielonych, 7 kul niebieskich i 8 kul czerwonych. Kule różnią
    się wyłącznie kolorem. Z pudełka losujemy jedną kulę. Oblicz prawdopodobieństwo zdarzenia polegającego
    na tym, że wylosowana kula jest niebieska. Zapisz obliczenia.
  statement_latex: P(A)=\frac{7}{5+7+8}
  solution: |-
    Wszystkich kul jest 5+7+8=20, a losowanie odbywa się na chybił trafił, więc każda kula może być wylosowana z takim samym prawdopodobieństwem: |\Omega|=20.
    Zdarzeniu A („wylosowano kulę niebieską”) sprzyja 7 wyników, czyli |A|=7.
    Zatem P(A)=\frac{7}{20}=0{,}35.
    Wynik należy do przedziału [0,1], więc jest sensowny.
  solution_steps:
  - 'Obliczamy liczbę wszystkich kul: |\Omega|=5+7+8=20.'
  - 'Liczba kul niebieskich: |A|=7.'
  - P(A)=\frac{7}{20}=0{,}35.
