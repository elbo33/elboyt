    Oznaczmy przez r promień podstawy stożka (r > 0). Kąt nachylenia tworzącej do podstawy to kąt przy podstawie trójkąta osiowego, więc \operatorname{tg}60^\circ = \frac{h}{r}, skąd h = r\cdot\sqrt{3}.

    Z warunku na objętość:
    V = \frac{1}{3}\cdot\pi\cdot r^{2}\cdot r\cdot\sqrt{3} = \frac{\sqrt{3}}{3}\cdot\pi\cdot r^{3} = 9\cdot\sqrt{3}\cdot\pi,
    zatem r^{3} = 27, czyli r = 3 (oraz h = 3\sqrt{3}).

    Tworząca: l = \sqrt{r^{2}+h^{2}} = \sqrt{9+27} = \sqrt{36} = 6. (Można też krócej: \cos60^\circ = \frac{r}{l}, więc l = 2r = 6.)

    Kąt między tworzącą a osią stożka: β = 90° − 60° = 30°, a kąt rozwarcia to CAŁY kąt przy wierzchołku przekroju osiowego, czyli 2β = 180° − 2·60° = 60°.

    Odpowiedź: l = 6, kąt rozwarcia ma miarę 60° (przekrój osiowy jest trójkątem równobocznym o boku 6).
