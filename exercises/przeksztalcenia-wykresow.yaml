  exercise_type: odtworzenie wektora przesunięcia z danych o wykresie i wyznaczenie miejsca zerowego
  statement: Wykres funkcji f określonej wzorem f\left(x\right)=\frac{6}{x} dla x\neq 0 przesunięto o
    pewien wektor \vec{u}=\left[p,\ q\right] i otrzymano wykres funkcji g. Asymptotą pionową wykresu funkcji
    g jest prosta o równaniu x=-3, a do wykresu funkcji g należy punkt P=\left(-1,\ 6\right). Oblicz miejsce
    zerowe funkcji g.
  statement_latex: g\left(x\right)=\frac{6}{x-p}+q
  solution: |-
    Po przesunięciu o wektor [p,q] wzór ma postać g(x)=\frac{6}{x-p}+q, a asymptota pionowa x=0 przechodzi na prostą x=p. Z warunku, że asymptotą pionową jest x=-3, otrzymujemy p=-3, czyli
    g(x)=\frac{6}{x+3}+q.

    Punkt P=(-1,6) należy do wykresu g, więc g(-1)=6:
    \frac{6}{-1+3}+q=6, czyli \frac{6}{2}+q=6, czyli 3+q=6, stąd q=3.

    Zatem g(x)=\frac{6}{x+3}+3 (przesunięcie o wektor [-3,3]).

    Miejsce zerowe: \frac{6}{x+3}+3=0 \iff \frac{6}{x+3}=-3 \iff 6=-3\left(x+3\right) (dla x\neq -3) \iff 6=-3x-9 \iff 3x=-15 \iff x=-5.
    Liczba -5 należy do dziedziny \mathbb{R}\setminus\{-3\}, więc miejscem zerowym funkcji g jest x=-5.
  solution_steps:
  - 'Zapisz ogólną postać wykresu po przesunięciu: g(x)=\frac{6}{x-p}+q.'
  - Z położenia asymptoty pionowej x=-3 wywnioskuj p=-3.
  - 'Z warunku g(-1)=6 wyznacz q: 3+q=6, więc q=3.'
  - Rozwiąż równanie \frac{6}{x+3}+3=0 i otrzymaj x=-5 (liczba należy do dziedziny).
  answer:
    kind: NUMERIC
    value: -5.0
