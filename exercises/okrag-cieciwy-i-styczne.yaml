  statement_latex: P\left(x\right)=\frac{1}{2}\cdot x\cdot\sqrt{10^{2}-\left(\frac{x}{2}\right)^{2}}=\frac{x}{4}\sqrt{400-x^{2}}
  solution: |-
    a) Niech S będzie środkiem cięciwy AB. Ponieważ trójkąt OAB jest równoramienny (|OA|=|OB|=10), odcinek OS jest wysokością tego trójkąta i OS \perp AB. W trójkącie prostokątnym OSA mamy |AS|=\frac{x}{2} oraz
    |OS|=\sqrt{10^{2}-\left(\frac{x}{2}\right)^{2}}=\frac{1}{2}\sqrt{400-x^{2}}.
    Pole trójkąta OAB (podstawa AB, wysokość OS):
    P\left(x\right)=\frac{1}{2}\cdot x\cdot\frac{1}{2}\sqrt{400-x^{2}}=\frac{x}{4}\sqrt{400-x^{2}}.
    Dziedzina: cięciwa musi mieć dodatnią długość i nie może być dłuższa od średnicy, a dla x=20 punkty O, A, B są współliniowe i trójkąt nie powstaje. Zatem x\in\left(0;20\right).

    b) Rozwiązujemy równanie \frac{x}{4}\sqrt{400-x^{2}}=48, czyli x\sqrt{400-x^{2}}=192. Obie strony są dodatnie, więc po podniesieniu do kwadratu:
    x^{2}\left(400-x^{2}\right)=36864.
    Podstawiamy t=x^{2}\;(t>0):
    t^{2}-400t+36864=0,\qquad \Delta=160000-147456=12544,\qquad \sqrt{\Delta}=112,
    t=\frac{400-112}{2}=144\quad\text{lub}\quad t=\frac{400+112}{2}=256.
    Stąd x=12 lub x=16 (wartości ujemne odrzucamy). Obie należą do dziedziny \left(0;20\right).
    Sprawdzenie: dla x=12 wysokość wynosi \frac{1}{2}\sqrt{400-144}=8 i P=\frac{1}{2}\cdot12\cdot8=48; dla x=16 wysokość wynosi \frac{1}{2}\sqrt{400-256}=6 i P=\frac{1}{2}\cdot16\cdot6=48.

    c) Z punktu b) jedynymi cięciwami dającymi pole 48 są cięciwy o długościach 12 i 16, a obie są krótsze niż 18. Zatem taka cięciwa nie istnieje – odpowiedź: nie.
