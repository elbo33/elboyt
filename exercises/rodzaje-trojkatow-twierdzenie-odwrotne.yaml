- id: g-ex-05
  slot: EXERCISE
  ramp_index: 3
  difficulty: 4
  exercise_type: badanie typu trójkąta zależnego od parametru
  statement: Boki trójkąta mają długości x, x + 4 oraz x + 8, gdzie x > 0. a) Wyznacz wszystkie wartości
    x, dla których taki trójkąt istnieje. b) Dla jakiej wartości x trójkąt ten jest prostokątny? c) Dla
    jakich wartości x trójkąt ten jest rozwartokątny?
  statement_latex: x^{2}+\left(x+4\right)^{2}=\left(x+8\right)^{2}
  solution: |-
    Najdłuższym bokiem jest c = x + 8, bo x < x + 4 < x + 8; pozostałe boki to a = x, b = x + 4.
    a) Warunek istnienia trójkąta: x + (x + 4) > x + 8, czyli 2x + 4 > x + 8, stąd x > 4. Zatem x ∈ (4, +∞).
    b) Trójkąt jest prostokątny, gdy x² + (x + 4)² = (x + 8)²:
    x² + x² + 8x + 16 = x² + 16x + 64
    x² − 8x − 48 = 0, Δ = 64 + 192 = 256, √Δ = 16,
    x = (8 − 16)/2 = −4 lub x = (8 + 16)/2 = 12.
    Wartość x = −4 odrzucamy (musi być x > 4), zostaje x = 12, czyli boki 12, 16, 20 ✔.
    c) Trójkąt jest rozwartokątny, gdy x² + (x + 4)² < (x + 8)², czyli x² − 8x − 48 < 0, a więc x ∈ (−4, 12). Uwzględniając warunek istnienia x > 4, otrzymujemy x ∈ (4, 12).
    (Dla x > 12 trójkąt jest ostrokątny.)
  solution_steps:
  - Zauważam, że najdłuższym bokiem jest x + 8, a krótsze to x oraz x + 4.
  - 'Warunek istnienia: x + (x + 4) > x + 8 ⇒ x > 4, czyli x ∈ (4, +∞).'
  - 'Warunek prostokątności: x² + (x + 4)² = (x + 8)² ⇒ x² − 8x − 48 = 0.'
  - 'Rozwiązuję: Δ = 256, x = −4 lub x = 12; odrzucam x = −4, bo x > 4.'
  - 'Warunek rozwartokątności: x² + (x + 4)² < (x + 8)² ⇒ x² − 8x − 48 < 0 ⇒ x ∈ (−4, 12).'
  - 'Przecinam z warunkiem istnienia: x ∈ (4, 12).'
  answer:
    kind: MULTIPART
    parts:
    - name: a) warunek istnienia trójkąta
      answer:
        kind: INTERVAL
        lo: '4'
        hi: \infty
    - name: b) trójkąt prostokątny
      answer:
        kind: NUMERIC
        value: 12.0
    - name: c) trójkąt rozwartokątny
      answer:
        kind: INTERVAL
        lo: '4'
        hi: '12'
  checks:
  - kind: solve_inequality
    expr: x+\left(x+4\right) > x+8
    part: a) warunek istnienia trójkąta
  skills:
  - nierówność trójkąta z parametrem
  - równanie i nierówność kwadratowa
  - kryterium prostokątności i rozwartokątności
  verification:
    checkability: REFERENCE_CALL
    note: 3 parts matched
- id: g-ex-t00
  slot: EXERCISE
  ramp_index: 6
  difficulty: 3
  exercise_type: wyznaczanie brakującej długości boku
  statement: Dwa boki pewnego trójkąta mają długości 9 cm i 12 cm, a trzeci bok ma długość x cm. Wyznacz
    wszystkie wartości x, dla których ten trójkąt jest prostokątny. Rozważ oba możliwe położenia boku
    x (raz jako przeciwprostokątnej, raz jako przyprostokątnej) i w każdym przypadku sprawdź nierówność
    trójkąta.
  statement_latex: x^2 = 9^2 + 12^2 \quad \text{lub} \quad x^2 + 9^2 = 12^2
  solution: |-
    Przeciwprostokątna jest zawsze najdłuższym bokiem, więc bokiem naprzeciw kąta prostego może być albo x, albo dłuższy z danych boków, czyli 12 (bok długości 9 nie może być przeciwprostokątną, bo 9 < 12).

    Przypadek 1: x jest przeciwprostokątną. Z twierdzenia Pitagorasa x^2 = 9^2 + 12^2 = 81 + 144 = 225, więc x = 15 (odrzucamy x = -15, bo długość jest dodatnia). Nierówność trójkąta: 9 + 12 = 21 > 15 ✔. Otrzymujemy trójkąt o bokach 9, 12, 15 — to trójka (3, 4, 5) pomnożona przez 3.

    Przypadek 2: przeciwprostokątną jest bok długości 12, a x jest przyprostokątną. Wtedy x^2 + 9^2 = 12^2, czyli x^2 = 144 - 81 = 63, więc x = \sqrt{63} = 3\sqrt{7} \approx 7{,}94. Nierówność trójkąta: 9 + 3\sqrt{7} > 12, bo 3\sqrt{7} > 3 (gdyż \sqrt{7} > 1) ✔; pozostałe nierówności są oczywiste.

    Odpowiedź: x = 15 cm albo x = 3\sqrt{7} cm.
  solution_steps:
  - 'Zauważ, że przeciwprostokątna musi być najdłuższym bokiem, więc możliwe są tylko dwa przypadki: x
    jest przeciwprostokątną albo przeciwprostokątną jest bok długości 12.'
  - 'Przypadek 1: x^2 = 9^2 + 12^2 = 225, stąd x = 15.'
  - 'Sprawdź nierówność trójkąta: 9 + 12 = 21 > 15 ✔.'
  - 'Przypadek 2: x^2 + 9^2 = 12^2, stąd x^2 = 63 i x = 3\sqrt{7}.'
  - 'Sprawdź nierówność trójkąta: 9 + 3\sqrt{7} > 12, bo 3\sqrt{7} > 3 ✔.'
  - 'Zapisz odpowiedź: x = 15 lub x = 3\sqrt{7}.'
  answer:
    kind: MULTIPART
    parts:
    - name: x_jako_przeciwprostokatna
      answer:
        kind: NUMERIC
        value: 15.0
    - name: x_jako_przyprostokatna
      answer:
        kind: NUMERIC
        value: 7.937253933193772
        tol: 1.0e-06
  checks:
  - kind: evaluate
    expr: \sqrt{9^2 + 12^2}
    part: x_jako_przeciwprostokatna
  - kind: evaluate
    expr: \sqrt{12^2 - 9^2}
    part: x_jako_przyprostokatna
  skills:
  - twierdzenie odwrotne do twierdzenia Pitagorasa
  - rozważanie obu położeń nieznanego boku
  - nierówność trójkąta
  - działania na pierwiastkach
  verification:
    checkability: DETERMINISTIC
    note: 'all 2 parts solved fresh · det: [x_jako_przeciwprostokatna] SymPy solved it fresh: 15.0 vs
