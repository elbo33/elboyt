- id: g-th-00
  slot: THEORY_SUPPORT
  ramp_index: 0
  difficulty: 1
  exercise_type: zliczanie regułą mnożenia
  statement: W kawiarni zestaw popołudniowy składa się z jednego napoju i jednego ciasta. Do wyboru są
    4 napoje (herbata, kawa, kakao, sok) oraz 3 ciasta (sernik, szarlotka, makowiec). Oblicz, ile różnych
    zestawów popołudniowych można zamówić.
  statement_latex: N = 4 \cdot 3
  solution: |-
    Jednym liczonym obiektem jest para (napój, ciasto). Zestaw powstaje w dwóch etapach: wybieram napój I wybieram ciasto, więc stosujemy regułę mnożenia.
    Napój możemy wybrać na 4 sposoby, a do każdego z nich ciasto na 3 sposoby (liczba możliwości w drugim etapie nie zależy od tego, co wybrano w pierwszym).
    N = 4 \cdot 3 = 12.
    Kontrola drzewem: z korzenia wychodzą 4 krawędzie, z każdego z 4 wierzchołków po 3 krawędzie, czyli 12 liści. ✓
    Odpowiedź: 12 zestawów.
  solution_steps:
  - Ustal, że jednym obiektem jest para (napój, ciasto) — wybór dwuetapowy.
  - Zauważ, że etapy łączy spójnik „i”, więc stosujemy regułę mnożenia.
  - Oblicz N = 4 \cdot 3 = 12.
  - 'Sprawdź wynik drzewem możliwości: 4 gałęzie po 3 liście dają 12 liści.'
  answer:
    kind: NUMERIC
    value: 12.0
  checks:
  - kind: evaluate
    expr: 4 \cdot 3
  skills:
  - reguła mnożenia
  - analiza sytuacji kombinatorycznej
  verification:
    checkability: DETERMINISTIC
    note: '[whole] SymPy solved it fresh: 12.0 vs 12.0 (tol 1e-09)'
- id: g-th-01
