  exercise_type: modelowanie geometryczne prowadzące do równania wielomianowego (wzór + dziedzina, potem
    obliczenia)
  statement: |-
    Podstawą pewnego prostopadłościanu jest prostokąt. Jeden bok tej podstawy jest o 5 cm dłuższy od wysokości tego prostopadłościanu, a drugi bok tej podstawy jest o 5 cm krótszy od tej wysokości. Wysokość prostopadłościanu oznaczamy przez x (w centymetrach).
    a) Zapisz wzór na objętość V(x) tego prostopadłościanu (w cm^{3}) w zależności od x oraz podaj dziedzinę tak określonej funkcji, uwzględniając warunki wynikające z opisu bryły.
    b) Wiadomo, że objętość tego prostopadłościanu jest równa objętości prostopadłościanu o krawędziach długości 4 cm, 6 cm oraz x cm. Oblicz wysokość opisanego prostopadłościanu, długości boków jego podstawy oraz jego objętość. Zapisz obliczenia.
  statement_latex: V(x)=x\cdot\left(x+5\right)\cdot\left(x-5\right),\qquad x\cdot\left(x+5\right)\cdot\left(x-5\right)=4\cdot
    6\cdot x
  solution: |-
    a) Niech x oznacza wysokość prostopadłościanu (w cm). Boki podstawy mają wtedy długości x+5 oraz x-5.
    Długości boków muszą być dodatnie: x+5>0 oraz x-5>0, a ponadto x>0. Najmocniejszy z tych warunków to x>5, więc dziedziną jest przedział \left(5,+\infty\right).
    Objętość:
    V(x)=x\cdot\left(x+5\right)\cdot\left(x-5\right)=x\cdot\left(x^{2}-25\right)=x^{3}-25x.

    b) Objętość drugiego prostopadłościanu wynosi 4\cdot 6\cdot x=24x. Z warunku zadania:
    x^{3}-25x=24x.
    Przenosimy wszystko na lewą stronę (nie dzielimy przez x!):
    x^{3}-49x=0,
    x\cdot\left(x^{2}-49\right)=0,
    x\cdot\left(x-7\right)\cdot\left(x+7\right)=0.
    Stąd x=0 lub x=7 lub x=-7. Do dziedziny \left(5,+\infty\right) należy wyłącznie x=7 (liczby 0 i -7 odrzucamy).

    Zatem wysokość wynosi 7 cm, boki podstawy mają długości 7-5=2 cm oraz 7+5=12 cm, a objętość
    V\left(7\right)=7^{3}-25\cdot 7=343-175=168.
    Sprawdzenie: 2\cdot 12\cdot 7=168 oraz 4\cdot 6\cdot 7=168 — objętości są równe.

    Odpowiedź: V(x)=x^{3}-25x dla x\in\left(5,+\infty\right); wysokość 7 cm, boki podstawy 2 cm i 12 cm, objętość 168 cm^{3}.
  solution_steps:
  - Oznacz wysokość przez x; boki podstawy to x+5 oraz x-5.
  - 'Z warunków x+5>0 i x-5>0 wyznacz dziedzinę: x\in\left(5,+\infty\right).'
  - Zapisz wzór V(x)=x\cdot\left(x+5\right)\cdot\left(x-5\right)=x^{3}-25x.
  - Zapisz objętość drugiej bryły 4\cdot 6\cdot x=24x i ułóż równanie x^{3}-25x=24x.
  - 'Przenieś wszystko na lewą stronę i rozłóż: x\cdot\left(x-7\right)\cdot\left(x+7\right)=0, skąd x=0
    lub x=7 lub x=-7.'
  - 'Sprawdź kandydatów względem dziedziny: zostaje x=7; oblicz boki podstawy 2 cm i 12 cm oraz objętość
    7^{3}-25\cdot 7=168 cm^{3}.'
